 MAPMODE_ALLIANCES_MAPMODE_NAME: "Alliances"
 MAPMODE_ALLIANCES_MAPMODE_DESCRIPTION: "Shows the countries the selected target has an alliance with.\n\n§LTo vew other country's alliances, select them by clicking one of their states on the map. Then a \"Map Mode Target\" window will appear, click on the button inside that window to vew the selected country's alliances§!"
 alliances_mapmode_tooltip: "[From.Controller.GetAlliancesMapModeTooltip]"
 alliances_mapmode_tooltip_delayed: "§LYou can select a country and then click the "Map Mode Target" Button to vew the selected country's alliances.\nSome alliances/pacts may have some secret clauses that only the signatory countries can see. There could also be entire alliances hidden to the rest of the world."

