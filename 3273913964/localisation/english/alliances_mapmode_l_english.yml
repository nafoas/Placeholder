 alliances_mapmode_FRA_POL: "§Y[?temp_target.GetFlag][?temp_target.GetNonIdeologyName]§! is in a §Gdefensive alliance§! with §Y[From.Controller.GetFlag][From.Controller.GetNonIdeologyName]§!.\n\n§CThe Franco-Polish Alliance of 1921§!\nThe treaty assumes common assistance in case one of the signatories becomes a victim of an \"unprovoked\" attack. The alliance is aimed at deterring §R[GRM.GetFlag]Germany§! from the use of force to achieve a revision of the postwar settlement by ensuring that German forces would be confronted with the significant combined strength of their neighbours.[FRA_POL_alliance_targets]"
 FRA_POL_alliance_terms: "\n\nAlthough it does not §Yrequire§! the signatories to send troops or declare war on the attacker if their partner is invaded, they still can choose to do so.\nNowadays the alliance has remained mostly innactive due to France's reluctance to invest in its allies's industry; with its only effect being to keep the French Military Mission to Poland."