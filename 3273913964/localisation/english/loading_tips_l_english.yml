l_english:
 LOADING_TIP_0:0 "It is humiliating to remain with our hands folded while others write history. It matters little who wins.\n- Benito Mussolini"
 LOADING_TIP_1:0 "The biggest battle is the war against ignorance.\n- Mustafa Kemal Ataturk"
 LOADING_TIP_2:0 "Every soldier must know, before he goes into battle, how the little battle he is to fight fits into the larger picture.\n- Bernard L. Montgomery"
 LOADING_TIP_3:0 "He who is not patriotic cannot be considered Portuguese.\n- António de Oliveira Salazar"
 LOADING_TIP_4:0 "The Jew murders the Arab and the Arab murders the Jew. This is what is going on in Palestine now. And it will go on for the next 50 years in all probability.\n- Bernard Montgomery on the 1936-1939 Arab Revolt"
 LOADING_TIP_5:0 "Appeasement is feeding the crocodile, hoping he will eat you last.\n- Winston Churchill"
 LOADING_TIP_6:0 "You can cut all the flowers but you cannot keep spring from coming.\n- Pablo Neruda"
 LOADING_TIP_7:0 "As long as there are sovereign nations possessing great power, war is inevitable.\n- Albert Einstein"
 LOADING_TIP_8:0 "Diplomacy is the art of telling people to go to hell in such a way that they ask for directions.\n- Winston Churchill"
 LOADING_TIP_9:0 "History shows that there are no invincible armies and that there never have been.\n- Joseph Stalin"
 LOADING_TIP_10:0 "If you want to have serious riots in Yugoslavia or cause a regime change, you need to kill me.\n- King Alexander I, 1932"
 LOADING_TIP_11:0 "But it is a well-known maxim of war that whoever tries to hold on to everything at once, finishes up by holding nothing at all.\n- Erich von Manstein"
 LOADING_TIP_12:0 "These men and their hypnotized followers call this a new order. It is not new. It is not order.\n- Franklin Delano Roosevelt on National Socialism, 1941"
 LOADING_TIP_13:0 "I want to die a slave to principles. Not to men.\n- Emiliano Zapata"
 LOADING_TIP_14:0 "In wartime, truth is so precious that she should always be attended by a bodyguard of lies.\n- Winston Churchill"
 LOADING_TIP_15:0 "The Spanish people prefer to die on their feet rather than live on their knees.\n- Dolores Ibárruri"
 LOADING_TIP_16:0 "Presidents of the Second Polish Republic have no luck. First was shot like a dog, second was kicked out like a dog, and third is obedient like a dog.\n- A saying from Warsaw, about the Polish president Ignacy Mościcki."
 LOADING_TIP_17:0 "Workers! Farmers! Antifascists! Patriotic Spaniards! Everyone rise to defend the Republic against the Fascist military uprising, to defend the common freedoms and the democratic triumphs of the people!\n- Dolores Ibárruri, 1936"
 LOADING_TIP_18:0 "Success consists of going from failure to failure without loss of enthusiasm.\n- Winston Churchill"
 LOADING_TIP_19:0 "If you're going through hell, keep going.\n- Winston Churchill"
 LOADING_TIP_20:0 "In Spain the best way to keep a secret is to write a book.\n- Manuel Azaña"
 LOADING_TIP_21:0 "Whenever in future wars the battle is fought, panzer troops will play the decisive role.\n- Heinz Guderian"
 #LOADING_TIP_22:0 "The new German Panther and Tiger can be used until they break down without trying to repair them. They have bad engines, transmission and suspension.\n- Department of Weaponry of the Red Army"
 #LOADING_TIP_23:0 "No bastard ever won a war by dying for his country. He won it by making the other poor dumb bastard die for his country.\n- George S. Patton"
 #LOADING_TIP_24:0 "A good plan violently executed now is better than a perfect plan executed next week.\n- George S. Patton"
 #LOADING_TIP_25:0 "Lead me, follow me, or get out of my way.\n- George S. Patton"
 #LOADING_TIP_26:0 "Nobody ever defended anything successfully, there is only attack and attack and attack some more.\n- George S. Patton"
 LOADING_TIP_27:0 "Konoe Fumimaro is like Mount Fuji. It is beautiful from afar, but only rocks roll when you look close.\n - Harada Kumao, Secretary of Saionji Kinmochi"
 LOADING_TIP_28:0 "Our stance towards Germany will be the same as the German stance towards us.\n - Jozef Beck, Polish minister of foreign affairs"
 LOADING_TIP_29:0 "I trust no one, not even myself.\n- Josef Stalin"
 LOADING_TIP_30:0 "Leadership consists of picking good men and helping them do their best.\n- Chester W. Nimitz"
 #LOADING_TIP_31:0 "Is the proposed operation likely to succeed? Is it in the realm of practicability in terms of material and supplies?\n- Chester W. Nimitz"
 LOADING_TIP_32:0 "Show me the man and I’ll find you the crime.\n- Lavrenity Beria"
 LOADING_TIP_33:0 "Your task will not be an easy one. Your enemy is well trained, well equipped and battle hardened. He will fight savagely.\n- Dwight D. Eisenhower to the troops before Operation Overlord"
 LOADING_TIP_34:0 "Vanquished today by mechanical force, in the future we will be able to overcome by a superior mechanical force. The fate of the world depends on it.\n - Charles de Gaulle"
 LOADING_TIP_35:0 "Talk to me of treaties! Talk to me of the League of Nations! Every Great Power in Europe was pledged by treaty to preserve Belgium. That was a League of Nations, but it failed.\n- Edward Carson"
 LOADING_TIP_36:0 "I would rather be the hammer than the anvil.\n- Erwin Rommel"
 LOADING_TIP_37:0 "Sweat saves blood, blood saves lives, but brains saves both.\n- Erwin Rommel"
 LOADING_TIP_38:0 "Poor Neville Chamberlain believed he could trust Hitler. He was wrong. But I don't think I'm wrong about Stalin.\n- Winston Churchill (after Yalta)"
 LOADING_TIP_39:0 "I believe it is peace for our time.\n- Neville Chamberlain, 1938 after Munich agreement."
 LOADING_TIP_40:0 "Podkolyosin asked tragically, \"Why are you keeping quiet, like the League of Nations?\"\n- Ilf and Petrov, 1927"
 LOADING_TIP_41:0 "We have only to kick in the door and the whole rotten structure will come crashing down.\n- Adolf Hitler (on the Soviet Union)"
 LOADING_TIP_42:0 "I can run wild for the first six to twelve months of a war with the United States and the United Kingdom. After that, I have no expectation of success.\n- Isoroku Yamamoto"
 LOADING_TIP_43:0 "If we come to a minefield, our infantry attacks exactly as if it were not there.\n- Georgy Zhukov"
 LOADING_TIP_44:0 "The Russian colossus has been underestimated by us... whenever a dozen divisions are destroyed, the Russians replace them with another dozen.\n- Franz Halder"
 LOADING_TIP_45:0 "To the German Commander: NUTS!\nThe American Commander.\n- Anthony C. McAuliffe (responding to German demand for surrender)"
 LOADING_TIP_46:0 "It is us today. It will be you tomorrow.\n- Haile Selassie I, 1936"
 LOADING_TIP_47:0 "Not one step back!\n- Soviet Order No. 227"
 LOADING_TIP_48:0 "Gentlemen, you have fought like lions and been led by donkeys.\n- Erwin Rommel to British POWs"
 LOADING_TIP_49:0 "Your name is unknown. Your deed is immortal.\n- Tomb of the Unknown Soldier (Moscow)"
 LOADING_TIP_50:0 "Where is, repeat, where is Task Force Thirty-Four? The world wonders.\n- CINCPAC, Battle of Leyte Gulf"
 LOADING_TIP_51:0 "The war situation has developed not necessarily to Japan's advantage.\n- Emperor Hirohito, 1945"
 LOADING_TIP_52:0 "Gaiety is the most outstanding feature of the Soviet Union.\n- Joseph Stalin"
 LOADING_TIP_53:0 "The vastness of Russia devours us.\n- Gerd von Rundstedt"
 LOADING_TIP_54:0 "I ask you, do you want total war? If necessary, do you want a war more total and radical than anything that we can even yet imagine?\n- Joseph Goebbels"
 LOADING_TIP_55:0 "One blow from the German army and another from the Soviet army put an end to this ugly product of Versailles.\n- Vyacheslav Molotov (after the fall of Poland)"
 #LOADING_TIP_56:0 "Scratch one flattop! Dixon to carrier: scratch one flattop!\n- Robert E. Dixon, Battle of the Coral Sea"
 #LOADING_TIP_57:0 "Isn't it dreadful? Here we are, two officers of the German General Staff, discussing how best to murder our commander in chief.\n- Henning von Tresckow"
 LOADING_TIP_58:0 "Hitler is a dancing dervish. He must be shot down.\n- Henning von Tresckow"
 LOADING_TIP_59:0 "The Nazis entered this war under the rather childish delusion that they were going to bomb everyone else, and nobody was going to bomb them.\n- Arthur 'Bomber' Harris"
 LOADING_TIP_60:0 "If Hitler invaded Hell, I would make at least a favorable reference to the devil in the House of Commons.\n- Winston Churchill, 21 June, 1941"
 LOADING_TIP_61:0 "So the bastard's dead? Too bad we didn't capture him alive!\n- Joseph Stalin (on hearing of Hitler's suicide)"
 LOADING_TIP_62:0 "We have been defeated. We are beaten, we have lost the battle.\n- Paul Reynaud, 15 May, 1940"
 LOADING_TIP_63:0 "I only need a few thousand dead so that I can sit at the peace conference as a man who has fought.\n- Benito Mussolini"
 LOADING_TIP_64:0 "The French had lied to the Poles in saying they are going to attack. There is no idea of it.\n- Edmund Ironside"
 LOADING_TIP_65:0 "I will be killed, but there are those who will avenge me!\n- Lepa Radić"
 LOADING_TIP_66:0 "There is something phoney about this war.\n- US Senator William Borah, 1939"
 LOADING_TIP_67:0 "Switzerland possesses the most disgusting and miserable people and political system. The Swiss are the mortal enemies of the new Germany.\n- Adolf Hitler"
 LOADING_TIP_68:0 "The fruits of victory are tumbling into our mouths too quickly.\n- Emperor Hirohito"
 LOADING_TIP_69:0 "You will all wind up shining the shoes of the Germans!\n- Italo Balbo"
 LOADING_TIP_70:0 "Sink, burn, capture, destroy. Let nothing pass.\n- Andrew Cunningham, Battle of Tunisia"
 LOADING_TIP_71:0 "I think we may be going a bridge too far.\n- Frederick Browning (prior to Operation Market Garden)"
 LOADING_TIP_72:0 "Prosperity can come through peace alone.\n- Paul von Hindenburg"
 LOADING_TIP_73:0 "When you see a rattlesnake poised to strike, you do not wait until he has struck to crush it.\n- Franklin D. Roosevelt"
 LOADING_TIP_74:0 "Rules are not necessarily sacred, principles are.\n- Franklin D. Roosevelt"
 LOADING_TIP_75:0 "People who are hungry and out of a job are the stuff of which dictatorships are made.\n- Franklin D. Roosevelt"
 LOADING_TIP_76:0 "A man has to be alert all the time if he expects to keep on breathing. If not, some German son-of-a-bitch will sneak up behind him and beat him to death with a sock full of shit.\n- George S. Patton"
 LOADING_TIP_77:0 "Fortifications, artillery, foreign aid - will be of no value, unless the ordinary soldier knows that it is HE guarding his country.\n- Carl Gustaf Emil Mannerheim"
 LOADING_TIP_78:0 "All wars are fought for money.\n- Socrates"
 LOADING_TIP_79:0 "What we National Socialists want is revolution or, better said, the attainment of a German future by the ruthless implementation of national freedom, social justice and völkisch recovery.\n- Gregor Strasser"
 LOADING_TIP_80:0 "Liberty doesn’t make men more or less happy, it simply makes them human.\n- Manuel Azaña"
 LOADING_TIP_81:0 "It is to be hoped that the leaders of this movement will place the nation above the party.\n- Franz von Papen"
 LOADING_TIP_82:0 "The National Socialist Party in Austria never tried to hide its inclination for a greater Germany. That Austria would one day return to the Reich was a matter of course for all National Socialists and for true Germans in Austria.\n- Arthur Seyss-Inquart"
 LOADING_TIP_83:0 "Throughout history, it has been the inaction of those who could have acted, the indifference of those who should have known better, the silence of the voice of justice when it mattered most, that has made it possible for evil to triumph.\n- Emperor Haile Selassie, 1963"
 LOADING_TIP_84:0 "War is pleasant for those who don’t know it.\n- Erasmus"
 LOADING_TIP_85:0 "It has to look democratic, but we must have everything in (our) hand.\n- Walter Ulbricht"
 LOADING_TIP_86:0 "I wish that an English statesman might once have spoken of us as Western Europeans.\n- Konrad Adenauer"
 LOADING_TIP_87:0 "Tora! Tora! Tora!\n- Mitsuo Fuchida, 7 December, 1941"
 LOADING_TIP_88:0 "After I am dead, the boy will ruin himself in twelve months.\n- George V on his son, Edward VIII"
 LOADING_TIP_89:0 "We should have known better after the first war.\n- Gerd von Rundstedt"
 LOADING_TIP_90:0 "We have lost the good old British spirit. Instead we have American journalism and black-shirted buffoons making a cheap imitation of ice-cream sellers.\n- Oswald Mosley"
 LOADING_TIP_91:0 "After the deed is done, one always becomes clever and philosophical.\n- Hans Frank"
 LOADING_TIP_92:0 "Chiang Kai-shek does not like my policies but he cannot do anything to me. I am too far away from his reach.\n- Sheng Shicai"
 LOADING_TIP_93:0 "An absolute abyss separates Austria from Nazism.\n- Kurt Schuschnigg"
 LOADING_TIP_94:0 "Stauning or Chaos!\n- 1935 Danish Election Slogan"
 LOADING_TIP_95:0 "Soldiers and peasants lived together on friendly terms; they knew each other and their everyday routines, and trusted each other; they shook their heads together over the war.\n- Ernst Toller, 1948"
 LOADING_TIP_96:0 "There is general curiosity in the British Fleet to find out whether the Italians are up to the level they were at in the last war or whether they have fallen off at all.\n- Winston Churchill (on the Italian declaration of war)"
 LOADING_TIP_97:0 "And we'll fight them with the butt ends of broken beer bottles because that's bloody well all we've got!\n - Winston Churchill (immediately after promising to fight in the fields and in the streets)"
 LOADING_TIP_98:0 "Experience has shown that attacks against tanks with close combat weapons by a sufficiently determined man will basically always succeed\n - German Army Group Center anti-tank manual"
 LOADING_TIP_99:0 "Give me fifty DC-3s and the Japanese can have the Burma Road.\n - Chiang Kai-Shek"
 LOADING_TIP_100:0 "Politics is war without bloodshed, while war is politics with bloodshed\n - Mao Zedong"
 LOADING_TIP_101:0 "Keep men, lose land: land can be taken again. Keep land, lose men: land and men are both lost.\n - Mao Zedong"
 LOADING_TIP_102:0 "I would rather die in a swamp of Greater Romania than in a paradise of a small Romania.\n - Ion Antonescu"
 LOADING_TIP_103:0 "People don't matter, only what they represent.\n - Ion Antonescu"
 LOADING_TIP_104:0 "In the day of today, defeated and unarmed the red army, the national troops have reached their last military objectives. The war is over.\n- Francisco Franco, 1 April 1939"
 LOADING_TIP_105:0 "Fascism glorifies both militarism and war. It is as surely a menace to the peace as to the liberty of mankind.\n- Norman Thomas, 1937"
 LOADING_TIP_106:0 "When the Spaniards can employ this extraordinary flow of energies in something better (...) they will replace the sinister and painful glory of war. And then it will be proven, once again, what should have never been unknown: that we are all children of the same sun and tributaries of the same river. -Manuel Azaña"
 LOADING_TIP_107:0 "The first death of every war is common sense\n- A. den Doolaard"
 LOADING_TIP_108:0 "How fortunate for governments that the people they administer don't think.\n- Adolf Hitler"
 LOADING_TIP_109:0 "Man is unable to draw a lesson from the past. It just jumps back into the posture. It is elastic. Bloodshed follows war.\n- Gerrit Komrij"
 LOADING_TIP_110:0 "Equality does not create war.\n- Erasmus"
 LOADING_TIP_111:0 "I have seen war… I hate war.\n- Franklin Delano Roosevelt, 14 August 1936"
 LOADING_TIP_112:0 "War is a creation of the people, so is peace.\n- Bernard V. A. Röling"
 LOADING_TIP_113:0 "Before Alamein, we had no victories. After Alamein, we had no defeats.\n- Winston Churchill"
 LOADING_TIP_114:0 "Never in the field of human conflict has so much been owed by so many to so few.\n- Winston Churchill, September 1940"
 LOADING_TIP_115:0 "Fascism accepts the individual only insofar his interests coincide with the state’s.\n- Benito Mussolini"
 LOADING_TIP_116:0 "From my earliest years, the first thing that I saw was suffering.\n- Buenaventura Durruti, 1931"
 LOADING_TIP_117:0 "I am Polish, and thus I have Polish duties and responsibilities\n- Roman Dmowski"
 LOADING_TIP_118:0 "Czechoslovakia has ceased to exist!\n- Adolf Hitler, 15 March 1939"
 LOADING_TIP_119:0 "This is not a constitution, this is prostitution\n- Józef Piłsudski, on the Polish Parliamentary Democracy"
 LOADING_TIP_120:0 "The definition of collaboration: Give me your watch and I’ll tell you the time.\n- French Joke under Occupation"
 LOADING_TIP_121:0 "In waking a tiger, use a long stick.\n- Mao Zedong"
 LOADING_TIP_122:0 "There is a denial of the value of the individual. Christianity affirms the value of each individual soul. Nazism denies it.\n- Clement Attle, 1940"
 LOADING_TIP_123:0 "To get vanquished, but not to surrender, is a victory. To win and to rest on one’s laurels, is a defeat. Who wants, will, who wants, wins. Provided the desire is not a whim or without force.\n- Józef Piłsudski - 24th December 1918"
 LOADING_TIP_124:0 "You were given the choice between war and dishonor. You chose dishonor and you will have war.\n- Winston Churchill"
 LOADING_TIP_125:0 "I'm for the poor man — all poor men, black and white, they all gotta have a chance. They gotta have a home, a job, and a decent education for their children. \"Every man a king\" — that's my slogan.\n- Huey Pierce Long"
 LOADING_TIP_126:0 "I used to get things done by saying please. Now I dynamite 'em out of my path.\n- Huey Pierce Long"
 LOADING_TIP_127:0 "It is common sense to take a method and try it. If it fails, admit it frankly and try another. But above all, try something\n- Franklin Delano Roosevelt"
 LOADING_TIP_128:0 "The only thing we have to fear, is fear itself\n- Franklin Delano Roosevelt"
 LOADING_TIP_129:0 "The constitution does not provide for first and second class citizens.\n- Wendell Willkie"
 LOADING_TIP_130:0 "When we talk of freedom and opportunity for all nations, the mocking paradoxes in our own society become so clear they can no longer be ignored.\n- Wendell Willkie"
 LOADING_TIP_131:0 "Wherever I have gone in this country, I have found Americans.\n- Alf Landon"
 LOADING_TIP_132:0 "In time of war, truth is always replaced by propaganda.\n- Charles Lindbergh"
 LOADING_TIP_133:0 "Only those who release others from it are freed from fear.\n- Erich Koch-Weser"
 LOADING_TIP_134:0 "You fight not only with the sword, but also with the heart.\n- Gustav Streseman"
 LOADING_TIP_135:0 "Freedom and Justice are twin sisters.\n- Frederich Ebert"
 LOADING_TIP_136:0 "I'm going to command the whole shebang.\n- Dwight D. Eisenhower"
 LOADING_TIP_137:0 "Only the most concrete, most immediate danger, which threatened us from Hitlerite Germany, has disappeared.\n- Mikhail Kalinin, August 1945"
 LOADING_TIP_138:0 "It is a fact that under equal conditions, large-scale battles and whole wars are won by troops which have a strong will for victory, clear goals before them, high moral standards, and devotion to the banner under which they go into battle.\n- Georgy Zhukov"
 LOADING_TIP_139:0 "Nazis believed the Red Army was not capable of defending Moscow, but their schemes failed.\n- Georgy Zhukov"
 LOADING_TIP_140:0 "There's no smoke without fire.\n- Georgy Zhukov"
 LOADING_TIP_141:0 "There are things in Russia which are not as they seem.\n- Georgy Zhukov"
 LOADING_TIP_142:0 "Repression for the attainment of economic ends is a necessary weapon of the socialist dictatorship.\n- Leon Trotsky"
 LOADING_TIP_143:0 "An ally has to be watched just like an enemy.\n- Leon Trotsky"
 LOADING_TIP_144:0 "It was as the supreme expression of the mediocrity of the apparatus that Stalin himself rose to his position.\n- Leon Trotsky"
 LOADING_TIP_145:0 "History teaches, but it has no pupils.\n- Antonio Gramsci, 1919"
#  LOADING_TIP_146:0 "I have no son named Yakov.\n- Josef Stalin on his son's capture by the Wehrmacht."
 LOADING_TIP_147:0 "Sometimes, winning is knowing to wait.\n- Getúlio Vargas"
 LOADING_TIP_148:0 "If the Germans invade us - we will lose freedom. If the Russians invade us - we will lose our soul.\n- Jozef Beck, Polish minister of foreign affairs"
#  LOADING_TIP_149:0 "Those who vote decide nothing. Those who count the vote decide everything.\n- Joseph Stalin"
 LOADING_TIP_150:0 "We are now facing new difficulties, and these difficulties are not less complex and serious, not less profound, than those that confronted us in the spring of last year.\n- Pavel Milyukov"
 LOADING_TIP_151:0 "Our poor country is fighting at an extraordinary hard conjuncture of an unparalleled war and internal problems such as we have never seen before...\n- Alexander Guchkov"
 LOADING_TIP_152:0 "He who fights with monsters should look to it that he himself does not become a monster. And when you gaze into an abyss, the abyss also gazes into you.\n- Friedrich Nietzsche, 1886"
#  LOADING_TIP_153:0 "The best argument against democracy is a five-minute conversation with the average voter.\n- Winston Churchill"
 LOADING_TIP_154:0 "Force is the only thing that can knock it down.\n- Anastasy Vonsiatsky on the USSR"
 LOADING_TIP_155:0 "Whatever the future may bring, I beg and pray all Magyars worthy of that name...to keep before their eyes a single purpose: the restoration of Hungary’s freedom.\n- Miklos Horthy"
 LOADING_TIP_156:0 "Every German soldier must be made to feel that he is living under the muzzle of a Russian gun.\n- Vasily Chuikov"
#  LOADING_TIP_157:0 "Lost are those who abandon themselves.\n- Hans-Ulrich Rudel"
 LOADING_TIP_158:0 "Dictatorships encourage oppression, dictatorships encourage serfdom, dictatorships encourage cruelty; but most abominable is the fact that dictatorships encourage idiocy.\n- Jorge Luis Borges"
 LOADING_TIP_159:0 "Some of you will not come back. Some of you will come back maimed. Those of you who do come back will come back changed men. That is war!\n- Jan Smuts"
 LOADING_TIP_160:0 "Tell me, Mr. General, what do you plan to do with those 600 trucks and what have you done with the last 20 that I bought two months ago?\n- President Salamanca to the Bolivian Army Chief of Staff, 1933"
 LOADING_TIP_161:0 "Latvian people are the only masters of this country; Latvians will themselves promulgate the laws and judge for themselves what justice is.\n- Alfrēds Birznieks, 1936"
 LOADING_TIP_162:0 "If you tell a big enough lie and tell it frequently enough, it will be believed.\n- Adolf Hitler"
 LOADING_TIP_163:0 "When they called me for the CCs, I was plowin’ corn for fifty cents a day. So I went to CC to have something for my mother. You know they sent twenty-five dollars to her. I got five.\n- Clifford Caplinger, 1934"
 LOADING_TIP_164:0 "And you cannot think what anxiety they are looking to this country to-day as the last stronghold of freedom, standing like a rock in a tide that is threatening to submerge the world.\n- Stanley baldwin on Dictatorship, 1934"
 LOADING_TIP_165:0 "We loath and detest the military spirit, the tyrannical spirit which has shown itself all over the world. You will never beat this by attack; you will only beat it by putting something far bigger in its place.\n- Clement Attlee, 1935"
#  LOADING_TIP_166:0 "Socialism is not the invention of an individual. It is essentially the outcome of economic and social conditions.\n- Clement Attlee"
 LOADING_TIP_167:0 "Are there any idiots who are fighting because of oil?\n - Ishiwara Kanji"
 LOADING_TIP_168:0 "If the workers see themselves faced with defeat through starvation, they will prefer to go down fighting rather than fainting — and whether or not we leaders agree.\n- Ernest Bevin, 1929"
 LOADING_TIP_169:0 "They have worked to split the British working class, and are in short agents of Fascism in Great Britain. The CPGB refuses with disgust to deal with such renegades. We treat them as vipers, to be destroyed.\n- The CPGB on the SPGB, 1943"
 LOADING_TIP_170:0 "There can be only one peace which will be acceptable to the people of this country. That is a peace which takes every precaution in our power to see to it that neither Germany nor Japan has any avoidable opportunity of starting this business again. -Anthony Eden, 1944"
 LOADING_TIP_171:0 "If one man has a dollar he didn't work for, some other man worked for a dollar he didn't get.\n- William Haywood"
 LOADING_TIP_172:0 "If we did not love our country so much, perhaps we would surrender it to Wall Street.\n- Earl Browder"
#  LOADING_TIP_173:0 "Can't we turn Hitler East? Napoleon broke himself against the Russians. Hitler might do the same\n - Stanley Baldwin, after the Munich Agreement"
 LOADING_TIP_174:0 "A lie will gallop halfway round the world before the truth has time to pull its breeches on.\n- Cordell Hull, 1948"
 LOADING_TIP_175:0 "War is a racket. It always has been… A few profit - and the many pay.\n- Smedley Butler, 1935"
 LOADING_TIP_176:0 "If today I stand here as a revolutionary, it is as a revolutionary against the Revolution.\n- Adolf Hitler"
 LOADING_TIP_177:0 "For the machine, because of the way it is built, can work only in a given direction, no matter who pulls its levers.\n- Rudolf Rocker, 1937"
 LOADING_TIP_178:0 "The war will bring about changes which may be fundamental and revolutionary in the economic and social life of this country. On that we are all agreed.\n- Anthony Eden, 1939"
 LOADING_TIP_179:0 "History writes the word \"Reconciliation\" over all her quarrels.\n- Jan Smuts"
 LOADING_TIP_180:0 "It is possible that a German defeat would be Germany’s ruin; it’s indisputable that its victory would also be its ruin.\n- Jorge Luis Borges"
#  LOADING_TIP_181:0 "Tom Mosley is a cad and a wrong 'un and (Labour) will find it out.\n- Stanley Baldwin, 1929"
 LOADING_TIP_182:0 "I am ready for every sacrifice for the honour of Greece\n - Ioannis Metaxas"
 LOADING_TIP_183:0 "Heroes never die; instead they fall, and the soil, by drinking their blood borns them again…\n - Ioannis Metaxas"
 LOADING_TIP_184:0 "The situation in Europe is complicated and bizarre.\n- Hiranuma Kiichiro (after the Molotov-Ribbentrop Pact)"
 LOADING_TIP_185:0 "In Iraq there is still—and I say this with a heart full of sorrow— no Iraqi people but an unimaginable masses of human beings.\n- King Faisal I"
 LOADING_TIP_186:0 "One does not use a tank to catch field mice — a cat will do the job better.\n- Georgeios Grivas, on the British Military."
 LOADING_TIP_187:0 "The only real power comes out of a long rifle.\n- Joseph Stalin"
 LOADING_TIP_188:0 "But there is no option left except fists and guns when someone offends the precepts of justice or the fatherland.\n- José Antonio Primo de Rivera, 1933"
 LOADING_TIP_189:0 "Turkey's true master is the peasant.\n- Mustafa Kemal Ataturk"
 LOADING_TIP_190:0 "The greater the terror, the greater our victories.\n- Lavr Kornilov"
