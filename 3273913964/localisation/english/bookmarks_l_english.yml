l_english:
  BM_HISTORY_TITLE:0 "Brief History"
  GATHERING_STORM_NAME:0 "Calm Before the Storm"
  GATHERING_STORM_DESC:0 "Dark times are coming. In Europe, German President Hindenburg is nearing the end of his life, and the people of Germany are almost completely united in support against his government. In Asia, the Japanese are beginning to mobilize for a war on Asia, while the United States remains neutral. The future of the world will be decided in the next few years."
  HITTING_FAN_NAME:0 "The Hitting of the Fan"
  HITTING_FAN_DESC:0 "Yup, that's right! That umbrella collection is about to come in real handy."
  USA_GATHERING_STORM_DESC:0 "The United States retreated back into isolation at the end of the last war and enjoyed a period of economic prosperity during the Roaring Twenties. This came to a dramatic end when the nation was gripped by the Great Depression.\n\nAmerica's policy of non-intervention in foreign wars has stood firm, but tensions are rising in both Europe and Asia. The 'Great Neutral' may find itself drawn into the maelstrom whether it wants to or not."
  FRA_GATHERING_STORM_DESC:0 "Despite the devastation of the Great War, France has been on the road to recovery thanks to a strong economy. However, the Depression has still affected the country and the new German regime has no interest in paying the war reparations stipulated by the Treaty of Versailles.\n\nWhen the treaty was signed, a French marshal famously remarked that it was not peace, but an armistice of 20 years. Those 20 years are now rapidly running out."
  ENG_GATHERING_STORM_DESC:0 "Although the United Kingdom emerged victorious from the Great War, the foundation of its great empire was shaken to its core. A generation of the country's finest were lost in the trenches of Flanders and Northern France, while unrest spread throughout the Commonwealth and massive debts accrued.\n\nWith the trauma of the last war still in fresh memory, the country now faces the prospect of another. It is becoming increasingly clear that there will be no Peace for Our Time."
  GER_GATHERING_STORM_DESC:0 "The German Republic is nearing its end. When Hindenburg forms the next cabinet, whoever he picks as chancellor will have the responsibility of keeping Germany together, whether by words or blood.\n\nWhile Hitler and his Nazis are popular, they face opposition from the Social Democrats and the Communists. It is clear that a new conflict will soon strike Germany."
  ITA_GATHERING_STORM_DESC:0 "With the rise of Fascism, Italy has entered a new glorious era. Its forces are currently in the process of adding Ethiopia to the growing Italian colonial empire, but Mussolini's ambitions do not stop there.\n\nDominion over the Mediterranean has always been Italy's destiny, and a new order of things is taking shape in Europe. When the tidal wave of change arrives, Italy must find a place at its crest or risk being swept away."
  SOV_GATHERING_STORM_DESC:0 "When the dust settled after the Russian Civil War, the U.S.S.R. had emerged as the undisputed ruler over most of what once constituted the Russian Empire. Rapid industrialization and collectivization followed, often at a great cost in human lives.\n\nThe Soviet Union is now faced with the threat of a resurgent Germany to the west and a belligerent Japan in the east. Of course, there are also internal threats within the ranks of the Communist Party to contend with..."
  JAP_GATHERING_STORM_DESC:0 "The Empire of Japan stands at a crossroads. Hokushin-ron, the Northern Expansion Doctrine, is favored by the Army and calls for an advance into Siberia. Nanshin-ron, the Southern Expansion Doctrine, is supported by the Navy and has the rich European colonies in Southeast Asia and the Pacific as its target.\n\nAnd then, of course, there is always China. Japan possesses a formidable military, but its industries are starving for resources and time is running out. Which path to choose?"
  OTHER_GATHERING_STORM_DESC:0 "The nations of the world, great and small, are not all content to hold their breath awaiting the outbreak of another global conflict. From major powers on the brink of civil war to the many nations formed and transformed by the Great War, all will have to make difficult decisions and balance ideals with pragmatism to have an impact on the future of the world."
  MEX_GATHERING_STORM_DESC:0 "This last century hasn't been kind on México, and after years of war, economic downfall and political assasinations the country was finally secured by Plutarco E. Calles, better known as the \"Jefe Maximo\".\n\nWhether this is to last or not is still doubtful, but one thing is clear: México has a rocky way to go."
  BRA_GATHERING_STORM_DESC:0 "In the fateful month of October 1930, after 40 years of rule by corrupt oligarchs, Getúlio Vargas and his supporters marched towards Rio de Janeiro, displacing the President Washington Luís. In 1932, however, the state of São Paulo and its allies declared war - unsuccessfully - against the central government, aiming at toppling Getúlio and restoring constitutional order.\n\nNow, what should be of the 1930 Revolution? Various factions - liberals, socialists, tenentes, fascists - want to call the Revolution their own, and only God knows what path is Brazil going to follow..."
  SPR_GATHERING_STORM_DESC:0 "Spain is in a phase of changes. Less that 2 years ago, in 1931, the Second Republic was proclaimed and King Alfonso XIII fled Spain. During this time, a coalition government of republicans, liberals and socialists has tried to reform and modernize the unstable country, with reforms such as the Agrarian Reform.\n\nHowever, these reforms are not without opposition: fascists, monarchists and anarchists are all determined to end the fledgling Republic and impose their views. Will democracy prevail, or will the two Spains finally collide on the battlefield?"
  NOR_GATHERING_STORM_DESC:0 "Although the Kingdom of Norway gained its independence from Sweden only 28 years ago, Norway has had quite a turbulent situation as a free nation. The initial economic prosperity that Norway enjoyed didn't last for long, as the 1920s brought economic stagnation and political tension for Norway. The political tension is characterized by \"Menstadslaget\" in 1931, where the police and workers clashed against each other.\n\nNorway is facing difficulties as radicalism in not only on the rise abroad, but also in Norway herself."
  SAF_GATHERING_STORM_DESC:0 "When the Great War began, many in South Africa refused to take up arms for their British masters. The South African military spent most of the Great War chasing around German forces in their African colonies, with limited success.\n\nNow a new war looms on the horizon. Then, as now, there are some in South Africa that think the country shouldn't be fighting against the Germans at all. Some even believe that the time has come for the descendents of the Boers to make their bid for the liberty that was denied to their forefathers."
  YUG_GATHERING_STORM_DESC:0 "Proclaimed in late 1918, Yugoslavia developed into a fragile parliamentary democracy in which governments were short and debates were heated to the point of violence. It enters the 1930s as a backwards state, with the King proclaiming personal rule and squashing all opposition to his regime.\n\nThe people, left without proper representation in the National Assembly, are increasingly turning to radical solutions to achieve these ends. For now, the South Slavic kingdom is held together only by the will of its monarch."
  POL_GATHERING_STORM_DESC:0 "After centuries in which the Polish nation has been divided between three empires, Poland now stands independent once again. But its position is not an easy one.\n\nIn the east, the Soviet Union has not forgotten the humiliating defeat in the Polish-Soviet war.\n\nIn the west, German Führer Adolf Hitler makes no secret of his desire for more "living space" - and that the former German areas now under Polish control will be the first step to achieve it."
  ETH_GATHERING_STORM_DESC:0 "Ethiopia inherits an anti-colonial legacy unlike any other. It manages to maintain a stable, budding quasi-democracy under the leadership of its monarch, Haile Selassie. Having also secured amicable relations with Mussolini’s Italy with the Italo-Ethiopian Treaty of 1928, there is little doubt to Ethiopia’s presence in the world stage.\nAnd yet, the same cannot be said for the continuation of such presence. As Omar Mukhtar’s rebellion against the Italians was crushed in 1931, Ethiopia started tightening its stance against the Italian threat and both nations attempt to outmaneuver one another. Will Ethiopia manage to survive in the face of the empires' desires?"
  HUN_GATHERING_STORM_DESC:0 "13 years have passed since the Treaty of Trianon, reducing the Kingdom of Hungary to two thirds of what it once were. Refusing to admit being just 'another' nation in Europe, Hungary's main goal ever since then has been to revise Trianon, and bring back their former territory. With the treaty setting very heavy restrictions on the army, ambitions like that seems far of reach as of now. \n\nHowever, the political landscape in Europe is changing, and the time may come for a redrawing of the borders, regaining the Lands of the Crown of Saint Stephen."
  CHI_GATHERING_STORM_DESC:0 "Something Something Warlords something Opium something Japan something something"

# Unused nations
#  CAN_GATHERING_STORM_DESC:0 "Canada entered the Great War as a mere colony and left it as a nation. Born in the mud of Passchendaele, Canada now takes its first few uncertain steps onto the world stage.\n\nHobbled by the Great Depression and with internal divisions between Anglophones and Francophones, the future of this new nation looks anything but secure."
#  AST_GATHERING_STORM_DESC:0 "Australians earned their place in the history books of the Great War in blood. The sacrifices made in the Gallipolli campaign have not been forgotten - and neither were those who ordered it.\n\nAustralia now stands at a crossroads: should she stay with her colonial master, about to be drawn into yet another conflict in distant Europe, or should the focus be on the threats that are appearing closer to home?"
#  NZL_GATHERING_STORM_DESC:0 "The tiny nation in the South Pacific fought bravely in the Great War, suffering high casualties in the bloody battles at Gallipoli and on the western front. Nearly half the men of fighting age had served in the fighting overseas and many had not returned.\n\nSome twenty years after the end of the Great War, the people of New Zealand look anxiously at the world stage, for this time, the threat of war seems to draw ever closer to their own home..."
#  RAJ_GATHERING_STORM_DESC:0 "The crown jewel of the British Empire, the Raj of India is a strange combination of imperial power and imperial powerlessness. A tiny elite of British civil servants rule over a vast subcontinent filled with hundreds of millions of subjects. From their ranks recruits the Indian Army, which fought bravely in the Great War.\n\nIndian leaders hoped that the sacrifices made in the last war would help India gain her independence from Britain, but so far, that hope has been disappointed. With a new war looming, many believe that the time has come to take that freedom - by whatever means necessary."