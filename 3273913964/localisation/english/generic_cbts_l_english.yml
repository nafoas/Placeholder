l_english:
 GEN_ship_purchase_orders:0 "Ship Purchase Orders"
 GEN_ship_purchase_orders_desc:0 "Some countries lack naval facilities, the tools, the manpower or available dockyards to produce the ships their navy requires. To solve this issue, they arrange deals with foreign naval powers like us to provide modern ships in exchange of money.\n\nHere will appear all the ships that other nations have ordered for us to build."

 HOL_order_orzel: "Building ORP Orzeł"
 HOL_order_orzel_desc: "We are building the submarine ORP Orzeł (meaning 'eagle') at the Dutch shipyard De Schelde, as the Job No. 205. The sub has a modern design, which was made in cooperation with a team from the Polish Navy, and incorporates some features of the earlier Dutch submarine HNLMS O 16 including the external trainable mount. The design is made to fulfill the Polish requirements for a multi-purpose vessel, to be used both in the shallow waters of the Baltic Sea and in the high seas."
 HOL_order_orzel_sep: "Building ORP Sęp"
 HOL_order_orzel_sep_desc: "We are building the submarine ORP Sęp (meaning 'vulture') at the Rotterdamse Shipyards. The sub is part of the Orzeł Class, a modern design (designed by the joint venture of Polish and Dutch engineers) ordered by the Polish Government."

