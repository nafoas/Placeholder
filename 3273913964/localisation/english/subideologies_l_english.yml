 warlordism_alt:0 "Warlordism"
 warlordism:0 "Chinese Warlordism"
 warlordism_desc:0 "§Y$warlordism$§!\nAfter Yuan Shikai reversed several reforms of the early Chinese Revolution and ended political freedoms in 1914, the country collapsed, allowing the Warlord Era to come about. The Warlords are military governors who, although they may be outwardly loyal to Nanjing, are more-or-less able to pursue their own agendas. They control their own private armies, which they use to enforce order in their own fiefdoms, essentially.\n\nThe Warlords themselves tend to be glory-hunters, as they are willing to form and disband alliances if they feel it will grant them personal glory (as long as familial ties do not interfere). They also tend to use Confucianism and the teachings of Dr. Sun Yat-Sen to justify their actions, despite the fact that many of the Warlords are barely literate. However, they do not act in a Confucian manner, as they routinely use the army to harass and extort from the citizenry to acquire funds for the army and for the Warlords' personal wealth. In the end, the warlords do not have a defined political program, making their regime one of personal autocracy.\n\nStarting with the ascendency of Chiang Kai-Shek in 1928, the warlords could be split into two types. Some tried to be reformist in the manner of the KMT, and occasionally tried to challenge Chiang's authority. Others tried to stick to more indifferent traditional practices, but this type of warlord is strongly on the decline.\n\nEconomics in the warlord states are focused on controlling infrastructure. The need to control railways and supplies is crucial to the warlords, as they might be crushed without the ability to move manpower and equipment. Economic structure also focuses on supplying the army for similar reasons. This can mean high taxes on vital goods (such as food), embezzlement, counterfeiting, bank loans, and opium sales."

 kokka_shugi:0 "Yokusan System"
 #kokka_shugi_desc:0 "Shōwa Statism combines elements of ultrantionalism, fascism, state capitalism, and corporatism to form a syncretic ideology unique to the Japanese. Though it borrows elements from Fascism, Shōwa Statism cannot be said to be fascist itself, as it lacks a personality cult of the leader - instead creating a cult of the Emperor - and fascist movements are generally supressed by the government. Regardless, this form of statism is strongly repressive, militarist, and chauvanist.\n\nJapanese statists seek to establish a political system where partisan party politics would be succeded by a totalitarian state which would organize the mobilization of the nation all the way from the central government to the neighborhood level. This involves the mass repression of the regime's political opponents, curtailing personal and social freedoms, and mass propaganda campaigns.\n\nSpecial notice must be made to the deificaiton of the Emperor. Proponents of Shōwa statism wish to represent the Emperor as a living god through whom the Kami (traditional Japanese pantheon) protect the people of Japan (this is also used to justify Japanese racial supremacy and expansionism). Despite Emperor Hirohito's lack of interest and involvement in politics, statists seek to use his image to inspire a spiritualist fanaticism in the Japanese people in order to foster support for the movement.\n\nShōwa statism is extremely imperialist and expansionist. The aforementioned spiritualist doctrine includes a tenet of bringing \"all the world under one roof\" (Hakkō ichiu). In practical terms, this translates to the Amau Doctrine, which held that Japan was responsible for establishing dominance over East Asia in order to protect it from communist and western influence. \n\nSimilarly, the statists seek to bring economic activity under the state's control. This includes the control of trade unions, nationalization of key industries and news media, and price controls. The statists also seek to bring the zaibatsu (large family-owned conglomerates) under state control, in order to meet the needs of the state."
 kokka_shugi_desc:0 "§Y$kokka_shugi$§!\nThe Yokusan System is one of the many submovements that can be found within Japanese Statism. It is an attempt to synthesize elements of Italian Fascism, German National Socialism, Marxism-Leninism, and Shōwa Statism into a single ideology. Proponents of the Yokusan System include the Reform and New Bureaucratic factions.\n\nThe ideology of the Yokusan System is a branch of Shōwa Statism. Shōwa Statism proposes to establish an ultranationalist, totalitarian, and militarist society to replace the parliamentary system of government, which in Japan had grown to become unstable. Such a system would replace partisan and class divisions with a form of national mobilization, where all political and economic activity would be subordinate to the perceived needs of the state. This would use a cult of the Emperor (despite the Emperor's disinterest in politics) and the idea of pan-asian unity (under Japanese leadership) as symbols of national unification.\n\nThe Yokusan system chooses to integrate concepts from western totalitarianism into the Shōwa framework. From European fascism, the Yokusan system borrows the concept of autarky, arguing that a strong Japanese state should not need to depend on foreign powers for resources. Distrustful of capitalism, the Yokusanites seek to establish a high level of state control of the economy. Rather than allowing the Zaibatsu (large family-owned conglomerates) to control the economy, the Yokusanites wish to establish a command economy where the bureaucracy would direct zaibatsu activity. They also seek to borrow the Soviet model of the five-year plan in order to forcibly industrialize Japanese and Japanese Puppet Regime territory. However, such a system would not be conducive to workers' rights, as expenses would be kept down by lowering wages to a minimum level."

 brazilian_estadonovismo_alt:0 "Estadonovismo"
 brazilian_estadonovismo_autdes:0 "Brazilian Estadonovismo"
 brazilian_estadonovismo_autdes_desc:0 "§YBrazilian Estadonovismo§!\nEstadonovismo is the name attributed to the set of practices and beliefs espoused by the Brazilian authoritarian regime, often presented through its traditional channels of communication, such as the radio, propaganda departments, state-affiliated newspapers, and pro-regime intellectuals. Influenced by both Catholic Social Teaching and Brazilian Modernist thinkers, the key aspect of this ideology is the strengthening of the Brazilian state and the destruction of the forces that the government deems centrifugal. Its program can be roughly separated into four parts: political, cultural, economic, and military centralization. \n\nThe Brazilian Estado Novo seeks to destroy the power of the states and other regional authorities of the Federation, which the central government sees as obstacles to the establishment of true national unity and technocratic government. Schooled in the tradition of Riograndense Positivism, Getúlio Vargas has also come to believe in an all-powerful Executive, free from the restraints of the Legislative Power. These dictatorial powers should not be mistaken for the one-party regimes of Europe, however, as these are seen as antithetical to Brazilian traditions. \n\nTo this school of thought, the regional problem is intertwined with the cultural problem, as they see the full assimilation of immigrants as paramount to the strength of the Brazilian State. Some pockets of immigration, especially in the southern states, have preserved the full traditions and language of their homelands, causing fears of secessionism among government officials. \n\nChanging the economic infrastructure also is deemed essential to the strengthening of the Brazilian State, as urbanization is seen as a factor of bringing the population closer to governmental authorities, who have virtually no access to the vast Brazilian countryside. The new social groups that will arise from industrialization should be organized in a corporatist manner, with huge verticalized trade unions negotiating directly with the government, replacing the more traditional democratic channels. Finally, human labor should be exalted by State propaganda and policies, breaking with the old Brazilian tradition of depreciating manual labor, inherited from slavery. \n\nThe last pillar of the Estadonovista program is the strengthening and homogenization of the Armed Forces, that have been plagued by internal disunity for decades. Only a strong and united Army would be able to carry out the dismantling of regional authorities and other centrifugal forces, as they see fit."

 integral_nationalism: "Integral Nationalism"
 integral_nationalism_desc:0 "§YIntegral Nationalism§!\nIntegral Nationalism is the brainchild of French Ultramonarchist Charles Maurras, and is the official ideology of his party, the Action Française. Integral nationalism posits that due to the French Revolution (considered to be the work of foreign influences, ie Freemasons, Protestants, Jews, and other foreigners), France had left a golden era that needed to be recaptured. The traditional and \"organic\" units of authority such as the family, church, monarchy, and municipality had been replaced by an \"anti-French\" sentiment of the nation-state. As such, integral nationalism positions itself as a strongly counterrevolutionary ideology.\n\nIntegral nationalism presents a vision of a decentralized nationalist monarchy. Maurras believed that centralism led to democracy, thus seeing a need to institute a policy of regionalism. Though it is a monarchist ideology, nationalism theorizes that a monarchy is mostly necessary as a unifying institution, capable of finding a balance between centralized authority - necessary for the national interest - and regionalism. However, for the time being, the AF demphasizes monarchism in favor of nationalism. As a positivist ideology, integral nationalism sees the Catholic Church as a necessary social authority. The Church would unify the nation and present a source of moral doctrine. The Catholic Church, on the other hand, had chosen to condemn the AF due to Maurras's agnosticism and the group's influence on young Catholics However, despite Maurras's regionalism, the national interest is ultimately paramount, thus creating a need for the establishment of a national community, which the aforementioned \"un-French\" groups would be excluded from. However, this nationalism is not expansionist or highly colonial, arguing that there is no need to impose French culture onto others. However, AF remains hostile to the idea of anti-colonialism, favoring the application of integral nationalism to the colonies.\n\nIntegral Nationalism is also economically distinct in that it supports a form of national syndicalism, though it is not based on Sorelianism, rather on Catholic corporatism and the ideas of René de La Tour du Pin. Under this system, economic power is decentralized into a form of national community, where all are involved in decision-making, to a degree.\n\nBefore the Great War, the AF was the strongest far-right movement in France. However, it soon began to decline, and there is little hope for it electorally. As such, the AF would rather seek alternative paths to power..."

 ubiquismo:0 "Ubiquismo"
 ubiquismo_desc:0 "§YUbiquismo§!\nGeneral Jorge Ubico Castañeda, also known as \"Number Five\" and \"Central America's Napoleon\" came to power in Guatemala in an uncontested election in 1931. Reaching the rank of colonel by the age of 28, he became governor of Alta Verapaz for four years, followed by a stint in Retalhuleu. His administrations invested in public works and welfare projects, as well as dealt harsh punishments for bandits and smugglers. Participating in the coup of 1921, he helped bring to power a regime that opened up the country of the United Fruit Company, an American fruit-cultivation company. Coming to power amidst instability and bankruptcy, he quickly cemented his status as dictator.\n\nUbico's government is highly totalitarian. Political opponents are quickly found out and harshly repressed. However, even his detractors admit that Ubico has been effective in reducing corruption in the country. On the other hand, Ubico is happy to overlook embezzlement by his close allies, and even engage in the practice himself. His bureaucracy is highly militarized, as many civil servants have been replaced by military officials.\n\nDespite his admiration of German National Socialism, Ubico considers his regime to the the United States' most important ally in the region, and as such has allowed the United Fruit Company to essentially monopolize the entire Guatemalan economy. This has allowed the establishment of a strong but small landowner class, much to the chagrin of the middle and working classes..."

 ### Far-Right Authoritarian
 nationalist_alt:0 "Authoritarianism"
 nationalist:0 "Far-Right Authoritarianism"
 nationalist_desc:0 "§Y$nationalist$§!\nFar-right political movements are present across the globe. It is difficult to offer specific information on their policies given that the development of far-right ideology in a country oftentimes relies more on local circumstances than theoretical doctrine. However, it is possible to establish a general sociopolitical philosophy along with some of the far-right's core beliefs.\n\nFar-right philosophy views society as an interacting set of components that develops dynamically. This is then combined with a form of extreme nationalism to create a perceived need to rid a nation (depending on the movement, this can be defined by race, ethnicity, religion, etc) of outside influence in order to create a closed utopian organic society, usually manifesting in racism and xenophobia. The far-right also rejects egalitarianism and individualism, preferring forms of collectivist elitism. As such, the far-right rejects liberalism and socialism as \"impurities\" that hamper the establishment of the aforementioned \"utopia\".\n\nAs one might expect, the far-right's rejection of individualism leads them to adopt strongly traditionalist viewpoints. The far-right sees the permission of religious, expressive, and other freedoms as an invitation for \"harmful influences\" to damage the nation. As such, far-right movements seek to at the very least limit personal freedoms, wishing to repress political opponents and establish laws against what they regard as harmful social practices. They instead seek to promote relevant cultural and/or religious practices to enforce social homogeniety.\n\nSimilarly, many (but not all) far-right movements perceive capitalism as individualist opportunism that exploits the nation for its own needs. However, it also rejects socialist (at least in the common vernacular, as some far-right ideologies claim to promote a form of socialism distinct from those present on the political left) as a form of atheist and internationalist egalitarianism. Thus, they tend to promote an authoritarian form of corporatism, which aims to represent the interest of different sectors of society within the framework of a market economy. In this vein, the state might nationalize key industries. As part of their traditionalist mindset, the far-right may sometimes adopt agrarianism in order to oppose modernist industrial urbanism."

 austrofascism:0 "Austrofascism"
 austrofascism_desc:0 "§YAustrofascism§!\nThough the term \"Austrofascism\" obviously makes the claim that Austrofascism is a form of fascism, such a classification remains contentious to this day. Whereas fascism is based on the need for a mass party and glorification of the state, Austrofascism is based more on Catholic social teaching, with more similarities to the authoritarian government of Salazar in Portugal. Regardless, Austrofascism remains a nationalist, authoritarian, and corporatist movement.\n\nAustrofascism is based on an authoritarian form of Catholic social teaching, which supports the establishment of a corporatist state to establish social harmony between the rich and poor in society. In the Austrofascist - and general corporate statist - conception, this involves the establishment of state-controlled \"corporations\" (not in the sense of for-profit businesses, but of corporate groups of individuals with a specific interest) as professional organizations. This effectively nationalizes the trade union movement. The state also takes an interventionist role in the economy, seeking to implement tariffs and regulate the economy for state and/or popular needs.\n\nAnother core component of Austrofascism is, as one might expect, Austrian nationalism. Contrary to German Nationalism (also strongly present in Austria), which holds that Austrians are not overly distinct from other German-speaking cultures, thus legitimizing the unification of Austria and Germany, Austrian nationalism holds that Austrian's cultural and Catholic identity sets them apart from the other Germans. These differences, with emphasis put on Austria's Catholic roots, is meant to present Austrians as better Germans than those in Germany. Austrofascism thus promotes pre-modernist styles, harkening back to the days of the Baroque period and the conflict against an eastern enemy. Austrofascism is also socially traditionalist, as it promotes religious education, traditional gender roles, and promoted moderate levels of anti-intellectualism. However, unlike German National Socialism, Austrofascism is not racialist in basis, and promotes no explicitly anti-Jewish policies. However, they are not particularly pro-Jewish either, as they seem to ignore anti-semitism altogether, and many Austrofascists publically express anti-semitic sentiments."

 metaxism:0 "Metaxism"
 metaxism_desc:0 "§YMetaxism§!\nThough Metaxism - the ideology of Greek dictator Ioannis Metaxas - is clearly influenced by fascist stylings and rhetoric, it is more of a reactionary conservative doctrine than an ostensibly revolutionary mass movement. Rejecting the liberal attempts at democracy as degenerate, Metaxism instead seeks to establish a totalitarian reactionary monarchy in place of the republic.\n\nTwo of the main centerpoints of Metaxism are anti-parliamentarism and anti-communism. Essentially, Metaxas sees the unstable Hellenic Republic as proof of democracy's failure to provide for a secure and strong nation. Similarly, he views left-wing ideologies as harmful strands of thought that invites egalitarianism and atheism. Metaxism, like other forms of Greek conservatism, promotes monarchism, which at present is a hot-button issue in Greek life. The monarchy in metaxismis viewed as an establishment that provides a figure of unity, though actual executive power remains with the dictator.\n\nMetaxism promotes Greek nationalism and traditionalism. Arguing that the Macedonian and Byzantine Empires represented two periods of \"Hellenic Civilization\", metaxism supports the creation of a third such period (though without the territorial boundaries of the former empires). Similarly, metaxism promotes the idea that members of the Greek nation have to be of Greek descent and practice Eastern Orthodoxy, intentionally excluding non-Greeks (Slavs, Turks, and Albanians) from citizenship. Metaxism is also anti-imperialist, as it opposes foreign influence on Greek political, social, and economic life. As might be expected, metaxism promotes traditionalist social policies and despises individualism.\n\nMetaxism rejects both capitalism and socialism in favor of statist corporatism. Under this arrangement, professional organizations arranged by vocation would be organized to promote the economic interests of said vocation(s). This is meant to counterbalance the power of capitalist elites while avoiding left-wing egalitarian thought. Finally, metaxism is also protectionist, seeking to protect industry and establish a degree of self-sufficiency through tariffs."

 brazilian_estadonovismo_faraut:0 "Brazilian Estadonovismo"
 brazilian_estadonovismo_faraut_desc:0 "§YBrazilian Estadonovismo§!\nEstadonovismo is the name attributed to the set of practices and beliefs espoused by the Brazilian authoritarian regime, often presented through its traditional channels of communication, such as the radio, propaganda departments, state-affiliated newspapers, and pro-regime intellectuals. Influenced by both Catholic Social Teaching and Brazilian Modernist thinkers, the key aspect of this ideology is the strengthening of the Brazilian state and the destruction of the forces that the government deems centrifugal. Its program can be roughly separated into four parts: political, cultural, economic, and military centralization. \n\nThe Brazilian Estado Novo seeks to destroy the power of the states and other regional authorities of the Federation, which the central government sees as obstacles to the achievement of true national unity and technocratic government. Schooled in the tradition of Riograndense Positivism, Getúlio Vargas has also come to believe in an all-powerful Executive, free from the restraints of the Legislative Power. These dictatorial powers should not be mistaken for the one-party regimes of Europe, however, as these are seen as antithetical to Brazilian traditions. \n\nTo this school of thought, the regional problem is intertwined with the cultural problem, as they see the full assimilation of immigrants as paramount to the strength of the Brazilian State. Some pockets of immigration, especially in the southern states, have preserved the full traditions and language of their homelands, causing fears of secessionism among government officials. \n\nChanging the economic infrastructure also is deemed essential to the strengthening of the Brazilian State, as urbanization is seen as a factor of bringing the population closer to governmental authorities, who have virtually no access to the vast Brazilian countryside. The new social groups that will arise from industrialization should be organized in a corporatist manner, with huge verticalized trade unions negotiating directly with the government, replacing the more traditional democratic channels. Finally, human labor should be exalted by State propaganda and policies, breaking with the old Brazilian tradition of depreciating manual labor, inherited from slavery. \n\nThe last pillar of the Estadonovista program is the strengthening and homogenization of the Armed Forces, that have been plagued by internal disunity for decades. Only a strong and united Army would be able to carry out the dismantling of regional authorities and other centrifugal forces, as they see fit."

 carlism:0 "Carlism"
 carlism_desc:0 "§YCarlism§!\nCarlism originates from a 19th century movement that aimed to replace the Spanish monarch with a noble from the line of Don Carlos, Count of Molina (hence the name Carlism). The movement attempted to seize control of Spain by force during the Carlist Wars, a series of six rebellions that took place between 1833 and 1876. These wars were largely based on guerilla strategies, but the military option was abandoned after the Third Carlist War. After that, the Carlists became a peaceful political movement, and continue to be relevant in the Second Spanish Republic.\n\nCarlists' motto is \"Dios, Patria, Fueros, Rey\", meaning God, Fatherland, Charters, and King. Carlism is strongly anti-modernist, rejecting the values of individualism and egalitarianism for traditionalism and corporatism. Instead of a liberal parliamentary democracy, the Carlists push for a Catholic corporatist form of representation, in which representation would be based on vocation. This ties into the concept of Fueros, which would provide for a somewhat decentralized kingdom, where regional autonomy would be respected in a manner similar to Catholic subsidiarity. Regardless, the Carlists wish to see a King with strong - though not excessive - executive power. The King would be limited by both religious and civil law. He would unite the Fatherland (Patria), which is considered to be a grouping of the national communities (Spaniards, Basques, etc.) under one banner.\n\nCarlism is also extremely traditionalist, wishing to eradicate influences of communism, liberalism, and socialism, which they see as atheistic and morally degenerate forces. However, it still manages to be a mass movement. Thanks to its work in the Catholic trade unions, Carlism has managed to appeal to workers as well as peasants and landowners, making Carlism a hetrogenous movement. At present, Carlism finds its main stronghold in Navarra, where local autonomy was revoked by the liberal government in the 19th century. In addition, they have a strong support base in Andalusia, the Basque Country, Catalonia, and Castille."

 afrikaner_nationalism:0 "Afrikaner Nationalism"
 afrikaner_nationalism_desc:0 "§YAfrikaner Nationalism§!\nAfrikaner nationalism is a synthesis of Dutch neo-Calvinist conservative and secular nationalist doctrine. Around the turn of the century, Dutch conservative prime minister Abraham Kuyper formulated a set of positions that rejected Enlightenment values such as individualism and rationality, arguing that egalitarian and libertarian pose a threat to God's authority. Afrikaner nationalists and theologians used his philosophy as the basis of their own ideology.\n\nAfrikaner nationalists, such as those in the Broederbond (brotherhood), formulated a strongly anti-British and anti-Black ideology that encompassed Christian and Afrikaner nationalism. Essentially, they argue that Afrikaner minority rule is necessary for its own sake, as Black domination of the Boers would be, in their view, unjust. The nationalists also seek to promote an idealized vision of the Afrikaner community through propaganda, promoting it as having a divine mandate to rule.\n\nThough the Afrikaner nationalists are not opposed to capitalism, they reject the Anglo model in favor of Volkskapitalisme (people's capitalism), which aims to neglect non-Afrikaner businesses in a form of economic chauvinism. Other than Volkskapitalisme, Afrikaner nationalists do not have a strongly defined economic doctrine.\n\nAs previously discussed, Afrikaner nationalism is strongly anti-modernist and racist. As one might expect, it is also strongly socially conservative, advocating for the regulation of social life on conservative Christian grounds. The nationalists see their support coming from many sectors of the Afrikaner community, including the urban middle class and the working class. In addition, the movement is highly anti-Semitic and some members look highly upon the fascist and national socialist movements in Europe."

 thai_cultural_revolution:0 "Thai Cultural Revolution"
 thai_cultural_revolution_desc:0 "§YThai Cultural Revolution§!\nThe Thai Cultural Revolution is the brainchild of Thai dictator Plaek Phibunsongkhram (known as \"Phibun\" to westerners). An admirer of Italian fascism, he seeks to modernize Thailand using fascist propaganda tactics to promote nationalism. Phibun was a soldier and was one of the leaders of the 1932 Siamese coup, which created a constitutional monarchy.\n\nThe Thai Cultural Revolution can be summed up in twelve points. The first mandate is to rename the country from \"Siam\" (a foreign name) to \"Thailand\", with \"Thai\" replacing \"Siamese\". In addition, regional identities are to be discouraged in exchange for a Thai identity. Similarly, the mandates seek to firmly establish behaviors relating to the good of the nation. Actions taken against the Thai nation are considered treason, and those who fail to honor national symbols are to be \"admonished\". The mandates demand that Thais speak the Thai language, and buy domestic products. They also mandate that the Thai people eat well, work hard, and sleep around seven hours a day.\n\nPhibun seeks to improve Thailand's economy as well. As such, he seeks to engage in economic statism, including the establishment of state-owned corporations and nationalization. Many of these policies are to be directed towards the Chinese minority, whom Phibun and many Thai nationalists see as an overrepresented minority.\n\nPhibun also seeks to establish a personality cult in order to increase his own power (at the expense of the King) based on Bhuddist symbolism. This includes the prominence of the rooster (Phibun's zodiac sign) and the color green (associated with Wednesday, the day Phibun was born, in Thai culture)."

 salazar_estado_novo:0 "Salazarism"
 salazar_estado_novo_desc:0 "§YSalazarism§!\nAntónio de Oliveira Salazar came to power in Portugal as a result of the instability of the Portuguese First Republic. After sixteen years, it was overthrown and replaced by the Ditadura Nacional (national dictatorship). The dictatorship gave the Catholic Church preferential status, and abolished the Communist Party. As order came back to Portugal and the future had to be confronted, the increasingly influential Salazar presented a continuation of his Catholic corporatist regime, becoming Prime Minister in July 1932.\n\nThough a casual observer might equate Salazar's regime with that of Mussolini's Italy, closer examination reveals large disparities between the two. Salazar himself detests fascism as anti-legalist immoral \"Caesarism\" and paganism, preferring Catholic social teaching to fascist philosophy. As such, the regime is opposed to both marxism and the national syndicalist movement in Portugal. Salazar's proposed constitution creates two legislative chambers: the National Assembly (the actual legislature) and the Corporative Chamber, which provided representation by Corporation, rather than party. This included geographical divisions, educational institutions, trade unions, other economic organizations, and welfare organizations. This is meant to reject divisive party politics and introduce social order. However, despite the presence of the National Union as the official state party, it is far less prevalent than those in fascist regimes, as Salazar rejected the ultra-centralization of other far-right ideologies in exchange for passivity, where power is decentralized among other elite institutions. However, despite the New State's lack of fascist-esque centralization, the state still plays the primary role, not the corporations.\n\nThe New State supports extensive social welfare programs, education programs, and market regulations, as it rejects liberal capitalism alongside marxian socialism, based on a Catholic rejection of secularism, atheism, and materialism. However, the new system allows large conglomerates to dominate industry and fails to provide for workers rights. This also comes with the strict curtailment of personal liberties such as freedoms of speech or assembly, which are seen as liberal or socialist ideas."

 turanism:0 "Turanism"
 turanism_desc:0 "§YTuranism§!\nTuranism is a movement that presents a need for cooperation between ethnicities and nationalities related to Central Asia. This includes the Finns, Hungarinas, Japanese, Koreans, Manchus, Mongols, Sami, Samoyeds, and Turks. This comes based on the theory of Gottfried Wilhelm Leibniz, which posited the existence of an Ural-Altaic ethnic group. This was then developed further by Finnish nationalists such as Matthias Alexander Castrén and Hungarian nationalists such as Sándor Kőrösi Csoma.\n\nTuranist political movements have different characteristics depending on the country in question, but there are some common themes. Generally, turanists are romantic nationalists who see western influences as harmful, and thus seek a turn to an eastern-centric policy. The idea is usually tied to local nationalism as well, as these nationalists see a need to strengthen the position of their own ethnicity or nationality, often combining turanist goals with local irridentism. As a result, turanism is considered to be a far-right ideology, in some cases acting as a vehicle for racism and other socially reactionary positions. However, turanists have no singular economic program.\n\nWhile some turanist movements have been influential, it is fair to say that the movements' development is largely separate from others on the far-right. For example, while some governments or parties might have been inspired by turanism to reach out to relevant \"turan\" nations, very few established movements actually embrace Turanism as their ideology."

 religious_nationalism:0 "Religious Nationalism"
 religious_nationalism_desc:0 "§Y$religious_nationalism$§!\nThis government's ideology is a form of extremely religious nationalism. The values of this government are strongly inspired by religious doctrine, though the government is not necessarily a full theocracy. This government rejects the values of modernity and the Enlightenment (particularly secularism, atheism, and egalitarianism) in favor of traditionalist collectivism based on religious values. While other nationalists might also include emphasis on religion in their doctrines, this form of nationalism emphasizes religion's absolute primacy in society.\n\nReligious nationalists reject the values of democracy (as it is a product of modernity), and will thus seek to hinder or abolish democratic institutions. These nationalists' prefered form of government is, depending on the country, some kind of dictatorship that would use political religion as its guiding principle. This government would seek to repress political opponents, including (presumably secular) liberals and (presumably atheist) socialists and anarchists.\n\n Similarly, religious nationalism is strongly socially reactionary. Its adherents seek to criminalize \"morally degenerate\" practices and reverse \"harmful\" changes, such as the advancement of womens' rights or freedom of religion. Apostasy and blasphemy would be similarly criminalized. While some religious nationalists are tolerant of ethnic minorities, others see minorities - especially if they are known to follow a different religion - as foreigners who are ineligible for membership in the national community. As religion is used to support national identity and provide a symbol of unity, minorities are sometimes seen as obstacles to such goals.\n\nThough such religious nationalists reject Anglo-American notions of capitalism, they do not reject the market economy itself. Instead, they favor the establishment of a structure (depending on the movement in question) meant to limit the excesses of capitalism and provide for harmony between the different classes in society. This would, according to the doctrine, provide the nation with stability and unity."

 endecja:0 "Endecja"
 endecja_desc:0 "§YEndecja§!\nNarodowa Demoracja (National Democracy), or Endecja for short, was formulated by Roman Dmowski as a national liberal movement in Poland in the late 19th century. However, as the political situation continued to develop, the liberal and nationalist elements began to drift apart, leading the nationalist wing to reject democracy. They began to look to authoritarian forms of government, a position that was strengthened by the May coup and the general instability of the Republic. With an anti-British and anti-German perspective, these nationalists began looking to Russia for assistance.\n\nThe core ideal of National Democracy is the concept of the national community, an ethnic formation that deserves an independent and undivided state. Such a state would reject class division for a form of class collaborationism. The vehicle for such a state would be a social darwinistic form of international struggle, that is to say, struggle between nations. Though it is an authoritarian movement, the National Democrats adopted democracy as an organizational tactic rather than an optimal ideal. National democracy wishes to see democratic institutions hampered by a strong executive, limited rights for minorities, and the corporatization of society. National democracy is distrustful of radical and totalitarian ideologies such as fascism. As such, the National Democrats seek to find a \"third way\" between parliamentarism and totalitarianism based on Catholic social teaching and corporatism.\n\nNational democracy is a strongly Catholic movement. According to Dmowski, Catholicism is the \"essence\" of the movement. The movement is also hostile to minorities, as they are seen as members of foreign nations. They seek to limit Jewish rights as much as possible, and even wish to see the Jews expelled from Poland. In addition, they regard it as necessary to \"Polonize\" the other minorities in the country, such as the Belarusians and Ukrainians."

 kokuhon_shugi:0 "Kokuhon Shugi"
 kokuhon_shugi_desc:0 "§YKokuhon Shugi§!\nMany different submovements can be found within Shōwa Statism. For example, the ideology of the National Foundation Society (Kokuhonsha) forms a distinct subtrend within the movement through its direct promotion of totalitarianism. Formed by nationalist parliamentarian and Minister of Justice Hiranuma Kiichirō, the National Foundation Society rejects western ideologies, arguing that Japanese Ultranationalist ideology must be entirely home grown.The ideology of the Kokuhonsha is a branch of Shōwa Statism. Shōwa Statism proposes to establish an ultranationalist, totalitarian, and militarist society to replace the parliamentary system of government, which in Japan had grown to become unstable. Such a system would replace partisan and class divisions with a form of national mobilization, where all political and economic activity would be subordinate to the perceived needs of the state. This would use a cult of the Emperor (despite the Emperor's disinterest in politics) and the idea of pan-asian unity (under Japanese leadership) as symbols of national unification.\n\nUnlike the reformers, who follow the Yokusan system, the Kokuhonites reject western \"-isms,\" such as fascism, communism, liberalism, and national socialism. Instead, they advocate for a homegrown nationalism, termed \"kokutai\". State Shintoism and the primacy of the traditional lifestyle of Tonarigumi, mutual-aid associations established at the neighborhood level. Such associations would be responsible for local affairs, public security, and civil defence."

 ### Fascism
 fascism_ideology:0 "Fascism"
 fascism_ideology_desc:0 "§YFascism§!\nDue to the vast regional variances in fascist movements, fascism is difficult to generalize into a single description. However, it is possible to establish usually-common characteristics in fascist rhetoric and practice. Fascism rejects modernism and rationalism in order to reintroduce traditional structures and values in modern form. For example, fascism transforms the absolute monarchy, a pre- (and more importantly, anti-) Enlightenment concept into the \"modern\" totalitarian leader-centric dictatorship. Fascism rejects intellectualism, arguing that actions should be the primary driver of ideology and \"policy\" for their own sake.\n\nFascism rejects parliamentary democracy as a modernist ideology. To the fascists, parliamentarism promotes instability and is unrepresentative of the \"Common Will\". As an alternative, fascism promotes the cult of a strongman meant to interpret the nation's wishes and guide it accordingly. In practice, the leader is a dictator, enforcing their own will down the ranks. Fascist rhetoric makes extreme use of scapegoating and conspiratorial fearmongering. Fascists often blame internal problems on alleged external forces and plots. Similarly, fascism sees opposing ideologies and movements as treasonous, and will thus seek to either absorb or eliminate all other political and social forces by whatever means they can feasibly get away with.\n\nFor general definitions of fascism, a specific economic program is very difficult to ascertain, and many fascist movements will pay little more than lip service to such policy. However, fascist movements will position themselves as the \"third position,\" rejecting both capitalism and marxian socialism. Fascism instead promotes corporatism. The fascist conception of corporatism will generally mean paltry reforms to workers' rights and some state intervention in the economy. Fascists will usually regard all those involved with production as members of the productive class, while the label of \"capitalist\" is more-or-less reserved for those in financial services. However, they promote the market economy from a social darwinist perspective.\n\nFascism is very much socially traditionalist. Fascism sees extreme masculinity and \"strength\" as something to be celebrated, and femininity and \"weakness\" as something to fight against. Fascism promotes \"heroes\" who engage entirely in fighting the nation's battles. As such, fascists perceive the nation to be in an eternal war in which, with enough determination, they will eventually become triumphant."

 italian_fascism:0 "Italian Fascism"
 italian_fascism_desc:0 "§Y$italian_fascism$§!\nItalian fascism is a synthesis of Italian irredentism, revolutionary nationalism, and national syndicalism. Though Italian dictator Benito Mussolini did not invent fascism himself, he took over the nascent movement in 1919 and quickly transformed the ideology as he saw fit. Fascism is an irrationalist ideology that rejects both modernism and reaction. Instead, fascism presents a vision of revolutionary traditionalism that glorifies war, violence, and action. Against a background of leftist unrest and irredentist sentiment in postwar Italy, Mussolini took power in the March on Rome in 1922, and after a brief coalition period, has since ruled Italy with an iron fist.\n\nFascism rejects the concept of parliamentary democracy, regarding it as indecisive and unstable. Instead, fascism argues for a totalitarian dictatorship led by an alleged strongman, which would unite the nation across party and class lines. This state would bring all aspects of life into the sphere of the state, as part of the nation's perpetual war against its perceived enemies. As such, the state is highly repressive, using extensive propaganda, secret police, and a national militia to silence dissidents by any means. The state is also expansionist. Though Mussolini claims that Fascist Italy is a direct heir of the Roman Empire, Italy's territorial claims are not so extensive. They seek to unite ethnically and historically Italian lands under the fascist banner, and establish themselves as a world power. Fascist Italy also seeks to colonize other areas, arguing that the Italian people were running out of space.\n\nMussolini, a former syndicalist, rejected both capitalism and socialism. After the end of the coalition period, the Fascist government began establishing a third alternative, which was termed \"corporatism\". Based on sorelianism and national syndicalism, fascist corporatism sought to provide a framework for class collaboration, arguing that such a thing is necessary in order to develop a strong national bond. In practice, this meant that although there was some paltry pro-worker legislation, it strengthened the power of conglomerates and allowed the state some intervention in the economy. However, these conglomerates were expected to work in the supposed national interest.\n\nItalian fascism is strongly socially traditionalist. It promotes \"masculine\" heroism and action, and despises \"feminine\" intellectualism and weakness. In addition, Mussolini's dictatorship is extremely racist against the Africans that it has colonized."

 nazism:0 "National Socialism"
 nazism_desc:0 "§Y$nazism$§!\nGerman National Socialism was born in 1920 in the German Workers' Party, an organization with nationalist, anti-communist, and anti-capitalist goals. Adolf Hitler, a former soldier, would join the party, quickly transform it into the National Socialist German Workers' Party (NSDAP), and became the national socialist movement's leader. National socialism is extremely anti-semitic, totalitarian, expansionist, and nationalist. However, although it adopted the stylings and tactics of the Italian Fascists, the theoretical basis of national socialism is derived from different sources.\n\nNational socialism has three core areas of interest. The first is its extreme xenophobia, and by extension, social traditionalism. Like others on the German far-right, the hitlerists refuse to believe that Germany's loss in the great war can be blamed on Germany's internal deficiencies, and choose to believe that it was external and foreign forces that caused its collapse. These forces, according to the hitlerists, were a conspiracy between the Jews (considered by the far-right to be foreign) and the communists (considered to be a Jewish ideology). Hitlerists are willing to blame any perceived opponent on any of Germany's internal problems. And while anti-semitism and racism is not new to Germany, the hitlerists take it to its extreme, arguing that their racist beliefs have some sort of scientific ground to them (a claim that has been repeatedly refuted). Similarly, though enthusiastic about technology, hitlerism is extremely anti-intellectual, seeing it as decadent individualism. Hitlerists also detest forms of social progression, arguing for traditional gender roles and extreme homophobia.\n\nThe second core of national socialism is the Cult of Adolf Hitler. Whereas the Italian Fascists might promote Mussolini as the hero of their nation, the hitlerists see Hitler as nothing less than a messiah, assigning him a quasi-religious level of might. Hitler certainly has absolute power over the party, as all anti-hitler elements have been removed. As such, national socialism seeks to do away with democracy and replace it with a totalitarian dictatorship, where the cult of Hitler and hitlerism would be omnipresent. In addition, anti-national socialist dissidents would be brutally repressed by any means. This would be an attempt to bring all aspects of life into the purview of the state.\n\nThe third core of national socialism is its extreme expansionism. The hitlerists expand on other irredentist sentiments by desiring nothing less than the establishment of Germany as a world power. This leads into the hitlerists' proud lack of an economic plan, as Hitler is willing to do anything as long as it enables Germany to fight war. However, Hitler also sees the need for Germany to conquer Eastern Europe for german colonization, and the subjugation of its slavic inhabitants."

 german_fascism:0 "German Fascism"
 german_fascism_desc:0 "§Y$german_fascism$§!\nThe Stahlhelm, Bund der Frontsoldaten is a far-right paramilitary organization in Germany, which serves as the armed wing of the traditional-conservative German National People's Party. Though not a party in itself, the Stahlhelm adopted a political program in 1928 that stylizes the organization as \"German fascist\" rather than conservative or national socialist. As such, they seek to establish a nationalist autocracy in the place of liberal democracy.\n\nThe Stahlhelm seeks to establish a new empire on a pan-germanic basis. As such, the Stalhelm is irredentist and expansionist. They demand German expansion to much of eastern Europe and the colonization of those lands by ethnic Germans. In order to accomplish these goals, the Stahlhelm wishes to replace parliamentary democracy with a strong totalitarian regime, which would unite the nation across party and class lines, repress political enemies, and prepare the nation for war. German fascists are strongly anti-communist and anti-socialist, as they see such things as foreign ideologies.\n\nUnlike its Italian cousin, German fascism is strongly anti-semitic. The Stahlhelm views German Jews as \"foreigners\". However, early attempts to remove Jewish members from their ranks were postponed. Similarly, though the Stahlhelm initially flirted with \"Aryan\" ideology, the fascists chose not to engage with hitlerist racial theory (though they did not explicitly reject it either), choosing to instead denounce \"foreign influences\". The Stahlhelm is also implicitly anti-Catholic, as they reject Churches with \"international ties\", which they percieve as anti-national. However, they do promote Christianity as a method to unite the German people against their alleged enemies.\n\nThe German fascists do not really have an economic program. They are mildly anti-capitalist, as they see capitalism as exploitative of the nation. However, they are also strongly anti-communist. In any case, their only real economic goals are to protect German agriculture, mobilize the economy to serve the national interest, and rearmament."

 falangism:0 "Falangism"
 falangism_desc:0 "§YFalangism§!\nFalangism is a comparatively new far-right ideology in Spain. The founder of the movement (and son of a former Spanish dictator), José Antonio Primo de Rivera, intended to infuse Italian fascism with allegedly-Spanish characteristics. Falangism is, in short, promotes a national syndicalist view of society, which would also follow Catholic and pan-hispanic principles.\n\nFalangism rejects parliamentary democracy, and wishes to replace it with a system of totalitarianism, where political freedom is repressed, arguing that anti-state activity would divide the nation and prevent Spain from achieving its \"destiny\". In such a system, all Spaniards are expected to work for the collective and national interests in all aspects of their life. Similarly, falangism strongly advocates for Spanish ultranationalism and unity, seeing separatism and internationalism as illegitimate. Falangists are also irredentist, as they call for Gibraltar to be returned to Spain. Some even call for the annexation of Portugal and parts of France!\n\nFalangism also has a pan-hispanic component. The tenet of the \"Hispanidad\" mandates that Falangists work towards economic and cultural cooperation between the Iberians and Latin Americans. Though some falangists support racialist theories and policies, this is not a key component of the ideology beyond Primo de Rivera's personal feelings towards Marxism, which he connects the Jewish population. They see the issue of clericalism as more important, arguing that the Catholic Church must play a primary role in social and political policy. As one might expect, falangism is strongly socially conservative, particularly arguing in favor of gender roles and the primacy of religion in direct reaction to the policies of the Second Spanish Republic.\n\nFalangist economics are officially national syndicalist in character. They seek to nationalize the banks and eliminate private economic activity that is unconducive to national unity. Otherwise, they wish to group capitalists, managers, and workers in \"vertical unions\" based on branches of production. These would be the basic structure of the economy. In addition, the falangists seek to undertake land reform to allow for a more equitable distribution of agricultural capital."

 francoism:0 "Francoism"
 francoism_desc:0 "§YFrancoism§!\nFrancisco Franco Bahamonde was born in Galicia in the year 1892 to upper-class parents. Though his family had a naval background, Franco chose to go into the army due to the Spanish-American War (and partially to spite his father). By 1910, he graduated from the Infantry Academy in Toledo as a second lieutenant. He soon began service in the Rif region of Morocco, becoming a major by the age of 24, and by the declaration of the Second Spanish Republic in 1931, he was a general. Since then, he had been known as a monarchist officer, as he supports the monarchist Acción Española and believes in conspiracy theories.\n\nFrancoism, a set of policies that can be identified with Franco's regime, involve the replacement of parliamentary democracy with a strong authoritarian regime. Though it is ostensibly falangist, a fascist ideology that seeks to install a totalitarian national syndicalist regime, the Francoist movement involves a merger between falangism and Carlism, a traditionalist conservative movement. Franco himself prefers the primacy of the armed forces to both movements. The Francoist state is repressive, as political opponents are routinely jailed, exiled, and/or killed and all aspects of social life are brought under state control. Francoism is strongly anti-communist, anti-liberal, and anti-separatist. Despite the participation of the falangists and carlists, francoism is more of a personalist movement around the \"Caudillo\", in which Franco chooses to use opportunism to gain alliances rather than a strict program. Francoism also pursues alliances with the traditional elites, and as such, allows corruption to breed.\n\nAnother key component of francoism is the primacy of the Catholic Church. Unlike fascist Italy, Francoism seeks to give Catholicism a primary role in society. Social policy is dictated according to Church doctrine, and as such, Francoism is strongly socially traditionalist. As such, it promotes antisemitism and traditional gender roles."

 british_fascism:0 "British Fascism"
 british_fascism_desc:0 "§Y$british_fascism$§!\nOswald Mosley is a notorious figure in British politics. Beginning his career as a conservative MP for Harrow, he would later cross the aisle to Labour and Independent Labour over disagreements about Irish policy. However, after Labour rejected the \"Mosley Memorandum\" for fixing the great depression in 1930, the once-proud Fabian left the party to found the protectionist New Party. Though the New Party did surprisingly well in some constituencies, it failed to win any seats overall. Mosley would then go on a tour of Mussolini's Italy in 1932, coming back as a convicted fascist. He quickly formed the British Union of Fascists, and outlined a new set of policies.\n\nThough based on Italian fascism, British fascism holds up several periods of British history as precedents for fascist policies. Though it claims to be democratic, British fascism holds up Cromwellian England, known for its authoritarianism, as the first fascist period in the isles. The fascists advocate for the end of parliamentary democracy and the installation of an authoritarian government. The mosleyites also claim legitimacy from English philosopher Thomas Hobbes' Leviathan, which more-or-less formalized the concepts of the body politic and political absolutism in the 17th century. British fascism is strongly nationalist and anti-sectarian. The BUF seeks to establish the Church as a strong institution within Britain, in an attempt to garner support from both Catholics and Anglicans. British fascism is also anti-semitic to varying degrees.\n\nBritish fascism advocates for the fascist conception of corporatism, in which society is treated as an organic being and the economy is arranged in a national syndicalist manner. Though private enterprise and ownership would be tolerated, it would have to be subordinate to the national interest. Mosleyism is also protectionist, arguing that free trade can allow foreign influence to corrupt the nation. However, unlike other fascist movements in Europe, British Fascist is not irredentist, arguing that conflict is only necessary in defense of the British Empire, feeling that the only real threat to the Empire came from the USSR and other communists.\n\nBritish fascism is also simultaneously reactionary and modernist. Though Mosley argues in favor of rapid technological development, he also argues in fervent defense of the monarchy and clerical institutions."

 rexism:0 "Rexism"
 rexism_desc:0 "§YRexism§!\nRexism began as a traditionalist Catholic conservative movement in Wallonia based on the work of politician Jean Denis. Led by Léon Degrelle, a journalist, it slowly began to adopt fascist stylings and doctrine, and has managed to fuse catholic traditionalism with fascism to create a clerical fascist movement unique to Belgium.\n\nRexism, coming from the latin word for \"king\", is a strongly authoritarian movement. It chooses to focus on anti-communism, but is equally anti-liberal as well. Rexism considers both ideologies to be morally corrupt and anti-Catholic. Though at first it did not reject democracy, the Rexists came to the conclusion that democracy must be overthrown by a revolution, and be replaced by an authoritarian state. This state would repress political opponents and curtail personal freedom. It would be centered on the leader (Degrelle himself) and make extensive use of Catholic doctrine. In addition, unlike other Belgian fascist movements, it was unitarist (rejected Flemish and Wallonian separatism) and monarchist.\n\nRexism rejects both capitalism and communism, arguing that both economic doctrines allow for decadence and the exploitation of the nation. Instead, rexism argues in favor of a corporatist system (though it seems more based on Catholic corporatism than the fascist variant) that would represent people by vocational interest than by party or class lines. However, what such a thing would entail, at least in the Rexists' eyes, are a bit vague.\n\nRexism is strongly socially traditionalist. The Rexists believe that the Catholic church should be dominant in the country, supporting social doctrine based on conservative Catholic beliefs. Despite their overwhelming Catholicism, the Catholic church in Belgium chooses to denounce the movement, arguing that even abstaining from voting against the Rexists would be a sinful move."

 clerical:0 "Clerical Fascism"
 clerical_desc:0 "§Y$clerical$§!\nA clerical fascist movement is one that places religious doctrine in a near-primary position alongside more \"orthodox\" fascist doctrine. The term originates in Italy to refer to Catholic conservatives who supported Mussolini's government and sought to synthesize Catholicism with Italian fascism. However, clerical fascism is not unique to Catholicism, or even Christianity. And though clerical fascist elements may be present in other ideologies, it must be stressed that clerical fascism gives clericalism a primary role rather than simply acknowledging or promoting a religious national identity. It also must be contrasted with traditionalist conservative governments, which though they may have a strong clerical component to them, lack the revolutionary character of fascism.\n\nLike other fascists, clerical fascists seek to overthrow parliamentary democracy and replace it with a revolutionary totalitarian state. This new government would abolish democratic institutions in favor of structures that repress political enemies and try to unite the nation across class and party lines, as well as bring social life under the state's control in order to regulate allegedly harmful foreign influences. The main difference here is that under clerical fascism, the clergy and/or clerical doctrine would be given a high level of influence on governance and policy.\n\nThough the clerical fascists seek to adopt corporatism like their non-clerical counterparts, their flavor of corporatism would not necessarily be based on national syndicalism. Though it certainly can be, it is also possible for clerical fascists (particularly Catholics) to adopt a more traditionalist conception of the corporate state. Regardless, they would seek to oppose both communism and capitalism by creating a system where workers and owners are both represented, along with frameworks to allow them to collaborate towards the national interest.\n\nClerical fascism is also socially traditionalist. Clerical fascists vociferously endorse conservative social positions such as gender roles, the social primacy of clerical institutions, and the promotion of traditional culture. Many clerical fascist movements will also promote some form of discrimination against minorities."

 integralism:0 "Integralism"
 integralism_desc:0 "§YIntegraism§!\nThe Brazilian Integralist movement was founded by writer Plínio Salgado in October 1932. Though it seeks to emulate Italian fascism, Salgado injects his own beliefs into it to try and make it a specifically Brazilian ideology. Salgado sees human history as a protracted conflict between materialism (defined political doctrine) and spiritualism (belief in a transcendent order). He saw liberalism and socialism as representatives of materialism and nationalism as representative of spiritualism. Thus, integralism seeks to harness nationalism for its own revolutionary ends.\n\nIntegralism seeks to establish an authoritarian state that would reorganize society on organicist lines. Essentially, the people would be educated to undergo self-revolution and subordinate their interests to the collective \"family\". This would come in tandem with the eradication of the \"materialist\" ideologies and the absorption of all other \"spiritualist\" political forces. However, Salgado does not see the state as comparable to other institutions, arguing exists in parallel to them rather than above or below. Integralism is also municipalist, arguing that the municipality is one of the more vital corporate groups\n\nUnlike other far-right movements, which define the nation as an ethnically homogenous community, Salgado defines the nation as a heterogeneous community sharing the same nationalist and spiritualist identity. However, even though Salgado himself denounces racism, several other prominent integralists are strongly anti-semitic.\n\nIntegralism supports a corporate economy rather than a capitalist or socialist one. Under this system, the state would intervene in a coordinative manner, whereas the basic unit of the economy would be the unions. However, while other fascist ideologies only see a place for state-controlled unions, the integralists see non-governmental trade unions as legitimate, as long as it brings together enough people from a given profession and is loyal to the state. The corporate state would also see the involvement of the owners in the unions in order to promote national unity."

 legionarism:0 "Legionarism"
 legionarism_desc:0 "§YLegionarism§!\nThe members of the Legion of the Archangel Michael, also known as the Iron Guard, are called Legionnaires. The legionary movement was formed in 1927 by politician Corneliu Zelea Codreanu to present a radical totalitarian vision of Romanian ultranationalism through a student and peasant movement. The movement uses anti-communism as a vehicle for anti-semitic, antiziganist, and anti-magyar policies. The Legion is responsible for assassinations and terror in Romania in their attempts to seize power. In addition, it strongly promotes an Orthodox Christian identity, which they claim is integral to the Romanian ethnic identity.\n\nThe Iron Guard rejects the traditional positions of the Romanian intelligentsia, which was to follow the French ideals of human rights and freedoms. Instead, Codreanu promoted xenophobia and ultranationalism. The Iron Guard denounces the \"anti-Christian\" activities of communism, fremasonry, freudian psychology, socialism, atheism, and homosexuality, and demands a return to Eastern Orthodox social values. This manifests itself as extreme xenophobia towards the Jewish, Roma, and Hungarian population in Romania. They seek to reform Romanians into \"new men\" trained to devote their very soul to the nation following the cult of death and violence. Within the movement, women are severely underrepresented, as the Iron Guard mainly makes effort to appeal to men with their vision of masculinity.\n\nThe Iron Guard seeks to replace Romanian democracy - which they see as historically unstable, materialist, and decadent - with a state modeled on Mussolini's Italy. The state would be organized as a revolutionary dictatorship which would brutally terrorize any political opposition. The leader of the movement would be addressed as the Conducător, and treated as a holy saint. The Romanian Orthodox Church would also have a large amount of influence, although the church did not strongly support the movement. The Iron Guard's support base is mostly students (as it generally organized around universities) and peasants (as they are an agrarian movement).\n\nRejecting capitalism and communism as materialist ideologies, the Iron Guard seeks to find a third spiritual-collectivist alternative. Though the Guard does not focus on economic issues, they generally advocate for a communalist-agrarian lifestyle. Despite being an anti-egalitarian ideology, Legionarism denounces the current Romanian elite as corrupt, thus earning them some working and peasant class support."

 japanese_fascism:0 "Imperial Socialism"
 japanese_fascism_desc:0 "§Y$japanese_fascism$§!\nKita Ikki, real name Kita Terujirō is a philosopher on the extreme right of Japanese politics. Born in Niigata Prefecture to a sake merchant father, Kita turned to socialism as a teenager, but would then turn away from the socialist movement, which he saw as opportunistic. In 1906, at the age of 23, he published his first treatise that established his ideology of Imperial socialism. From there, he became more involved with far-right politics and continued to expand on his ideas.\n\nKita's theory rejects the Meiji constitution and the parliamentary system, arguing that the Emperor should suspend the constitution and create a \"National Reorganization Diet\" that would establish a totalitarian regime. This regime would then attempt to rid Japan of foreign influences and political divisions in order to unite the country across partisan lines. However, Kita felt that the state should respect freedoms of speech and basic human rights, as well as abolish the Kazoku (nobility) and the House of Lords. The Emperor would act as a strongman and become the center of national politics (though Hirohito himself was not interested in such a thing). Kita's imperial socialism is also strongly militaristic and expansionist, arguing that in order to confront western imperialism and economic stagnation, Japan should embark on its own path of imperialism, including the conquests of Australia and Siberia.\n\nUnlike other Japanese Ultranationalists, Kita argues that non-Japanese inhabitants of the empire, including Chinese, Koreans, and Russians, must be made citizens of Japan with equal rights and obligations. Also unlike other Japanese ultranationalists, Kita rejects the idea that the people are the people of an Emperor descended from Shinto gods, but rather that the emperor's duty is to serve the people. This is the core of Kita's top-down socialism, where the government would unite and militarize society to unify all of asia. Kita was an agrarian, though he saw the need for the government to nationalize certain industries and redistribute wealth. The new economy would reduce the amount of wealth given to the Emperor, and dismantle the Zaibatsus (large family-owned conglomerates). However, even though workers' rights would allegedly be strengthened, the ability to strike and engage in labour disputes would be taken away."

 synarquism:0 "Mexican Synarchism"
 synarquism_desc:0 "§Y$synarquism$§!\nThe National Synarchist Union was founded in Mexico by nationalist Catholics opposed to the government of the National Revolutionary Party. Formed in the context of internal conflicts between the Callistas and the Cárdenistas, the clerical and anti-clerical portions of society, and the state and political opponents in the military and opposition groups, the synarchists turned to totalitarianism and national unionism to attempt to solve Mexico's problems.\n\nSynarchism is opposed to the PNR's centralist policies, and instead seeks to establish a decentralized agrarian system. At the same time, they intend to establish a totalitarian state on the model of Mussolini's Italy. This state would enforce Catholic and Mexican cultural values and establish laws based on Mexican nationalism. Synarchism sees a need to eradicate the perceived influences of communism, atheism, and the PNR in the country through repressive measures. Parliamentary democracy would be overthrown by a strongman leader and would be replaced by a corporate assembly meant to be free of factional division.\n\nMexican synarchism opposes both communist and capitalist economic structures. While their doctrine is nominally based on Catholic social doctrine, it was also influenced by the fascist conception of national syndicalism. This system would create state-affiliated unions to represent the farmers and workers and promote cooperative and communal economic activity. The banks would be nationalized as well.\n\nAs one might expect, the anarchists offer a traditionalist view of society. Reacting to the anti-clerical policies of the Calles and Cárdenas governments, they would ensure that Catholic doctrine has a primary place in policy and that the Catholic church is granted sufficient privileges to operate in Mexico. In addition, Mexican culture, symbols, and history would be promoted in a tenet of \"Mexicanidad\" (Mexicanity) to encourage nationalism."

 ustashe:0 "Ustaše"
 ustashe_desc:0 "§Y$ustashe$§!\nThe Ustaše movement - a name that carries connotations of military service and insurgency - began in 1929 as the idea of Croatian ultranationalist Ante Pavelić, who opposed the Yugoslavian kingdom and sought to establish, with the help of Italian fascist Benito Mussolini, an independent Croatia. The Ustaše became known for their terrorist tactics, extreme xenophobia, and religious ultranationalism. Envisioning a Greater Croatia, it is clear that Pavelić will stop at little to achieve his aims.\n\nThe Ustaše seek to use extreme terror to foment an insurgency and an uprising to establish a Greater Croatia. This state would have borders defined by the historical territories inhabited not just by Croats, but by Slovenes, Bosniaks, and some Serb areas. They consider these other ethnicities to be Croats who have been converted by foreign influences in 16th and 17th century. Such a state would be modeled on fascist Italy, where the Ustaše, as the state party led by the Poglavnik (Pavelić) would carry out the repression of political dissidents and perceived internal opponents. This would result in a totalitarian dictatorship under Pavelić.\n\nThe extreme xenophobia of Ustaše ideology is hard to get across clearly. Though the movement is not very popular in Croatia, its members feel the need to eliminate perceived Jewish and Serbian influences by any means. It also gives high priority to the Catholic church, arguing that those peoples who were allegedly converted in the past must be \"reconverted\" to Catholicism by force. They also seek to \"purify\" the Croatian language of Serbian words.\n\nThough the Ustaše pay little attention to economics, they adopt the Corporatist position common to other fascist ideologies. Though they declare that private ownership of property is a natural right (when kept to a small scale), it must be subordinated to the collective interest. They oppose liberalism for supposedly inviting Jewish exploitation of Croatia and Communism for its allegedly atheistic and anti-family viewpoint."

 russian_fascism:0 "Russian Fascism"
 russian_fascism_desc:0 "§Y$russian_fascism$§!\nThe term \"Russian fascism\" requires some qualification. If fascist circles existed in the USSR, they are certainly not known to us. During the 1920's, fascist sentiment grew in the Russian emigre community as an alternative to the White movement, which was seen as a failure, and the Soviet regime. The two main camps of Russian fascism are Konstantin Rodzaevsky's Russian Fascist Party, formed in Harbin, Manchuria in 1931; and the All-Russian Fascist Organization, formed in 1933 (though dissolved the year later) by Anastasy Vonsyatsky in Connecticut, USA. Though both factions hold some similar views, it is very clear that Rodzaevsky's faction is dominant.\n\nRussian Fascism is unique among fascist ideologies, where rather than fighting to replace liberal democratic governments or conservative dictatorships with totalitarian regimes, they are campaigning to replace an already totalitarian, albeit communist, regime. As such, they declare their intention to implement personal freedoms, although if the government is to be modeled on Western examples of fascism, such promises are likely shallow. There is an additional issue about whether or not to support Tsarism. Though likely against the idea, Rodzaevsky gives contradicting and vague answers. This is likely part of his strategy to attract conservative support, something which Vonsyatsky opposes.\n\nThe Russian fascists have conflicting ideas on who is to be eligible for \"membership\" in the nation. Vonsyatsky argues that it is the slavs, regardless if they are Ukrainian, Russian, etc, while Rodzaevsky claims that the idea of \"Russian\" as a nation should supersede that of Russia as an ethnicity. However, while Vonsyatsky is not anti-semitic (considering anti-communist Jews to be allies), Rodzaevsky fully believes in conspiracy theories involving alleged Judeo-Bolshevik plots. Regardless, due to their intention to establish Russian Orthodoxy as the state religion and their rhetoric used, it is reasonable to expect that ethnic Russians would continue to be the senior partner in a Russian fascist state.\n\nThe Russian fascists do not put large emphasis on their preferred economy, other than their intention to copy the Italian model. Under fascist corporatism, national trade unions would be set up to allow for vertical management of the economy through class collaboration, opposed to the class struggle promoted by the USSR."

 national_radicalism:0 "National Radicalism"
 national_radicalism_desc:0 "§Y$national_radicalism$§!\nThe National Radicalism was formed after a split within the National Democracy movement in Poland. Rejecting liberalism and socialism as \"Jewish\" ideologies, the national radicals split from the more conservative nationalists over the latter's perceived lack of action towards their goals. Modeling themselves on German national socialism and Italian fascism, the national radicals seek to establish a fascist state in Poland and establish a radicalized vision of the national democratic program.\n\nThough there are several National Radical Camp organizations, the strongest one by far is the ONR-Falanga. They seek to establish a totalitarian state that would bring all affairs under its control and establish an organic hierarchical society. This is opposed to the ONR-ABC, a much smaller group that would prefer a decentralized council with regional autonomies. Under national radicalism, political opponents would be silenced and the state would introduce new policies based on Catholic fundamentalism. Like the national democrats, they consider the idea of the nation to be a united community based on religion and ethnicity, and sought to work towards such a goal. As such, they reject the materialism of liberal and communist politics. To seize power, the Falanga intends to use terror to establish a new government by force.\n\nThe national radicals see the need to give the Catholic church influential roles in the new state in order to work towards the spiritual unity of the nation. Through the church, a new form and curriculum, and the reinforcement of the family unit, the national radicals seek to form a fascist \"new man\". National radicalism is strongly anti-semitic and believes in unfounded theories about Jewish conspiracies.\n\nThe ONR-Falanga declares its economic goals to be seperate of both capitalism and communism (both seen as Jewish and morally degenerate), where the state would nationalize major businesses and banks and prepare the state for war."

 military_socialism:0 "Military Socialism"
 military_socialism_desc:0 "§YMilitary Socialism§!\nThough the term \"military socialism\" is unique to the governments of David Toro and Germán Busch in Bolivia, it also can be applied to certain other governments in South America. Though the exact specific policies of the different governments vary, of course, the general idea is that a \"military socialist\" government involves policies introduced by a military ruler to implement their visions of state socialism. This has the result of a near-fascist government that introduces statist economic policies while cementing the autocratic rule of the leader.\n\nMilitary socialist regimes are established after the overthrow of liberal democracies in times of constitutional crisis. The military will then establish a political role for itself, and establish a dictatorship. Political opponents, particularly communists and anarchists, would be repressed. Interestingly, in some cases the government could see support from even Marxist intellectuals, though they are not permitted much political freedoms. The military leadership also makes effort to promote nationalist propaganda (such as the concept of heroism), promote local culture, and modernize the armed forces.\n\nHowever, the key reforms are made in the economic sphere. These regimes seek to establish corporate states that would include representation by trade unions and other professional organizations. In these regimes, key industries are brought either nationalized or otherwise brought under state control, welfare programs are established, and labour rights are expanded. However, these governments will try to limit labour strikes, seeing them as divisive and invitive of class struggle. For the same reason, the regimes will oppose conservative nationalists, who generally represent capitalist interests."

 RK_SS:0 "SS Administration"
 RK_SS_desc: "§Y$RK_SS$§!\nThis administration is one which falls under the authority of a governor drawn from the Schutzstaffel. Intended as a semi-permanent form of governance by the party paramilitary, the future of this administration will be highly dependent on its geographic location.\n\nIf it is located in one of the Western Territories, the \"fellow Aryans\" in the local population will likely be encouraged to join the local SS and receive additional favorable treatment aimed at furthering Germanization. This may culminate in the transfer of power to a leader from the native SS, as part of Heinrich Himmler’s attempt at building a \"Pan-Germanic Empire\" through the Schutzstaffel. In the Eastern Territories, bar attempts at fomenting ethnic division through the recruitment of minority groups into local SS branches the administration is likely to pursue a policy of expediting the preparation of the territory as \"Lebensraum\" for Germanic settlement.\n\nEither way, an SS administration will be characterized by its frequent attempts to play the native population against each other and using (often excessive) force and repression in day to day administration. Its end-goals are to further not just the interests and expansion of Hitler’s Germany, but also the agenda of Himmler and the SS as a whole, as part of both its ideological line and the struggle for power with other factions within the Nazi state."