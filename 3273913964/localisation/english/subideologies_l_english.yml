l_english:
 ### Leninism
 leninism:0 "Leninism"
 leninism_desc: "§Y$leninism$§!\nLeninism is a variant of Marxism developed by Vladimir Illiych Lenin (formerly Ulyanov), the first leader of the USSR. Leninism is a Revolutionary Communist ideology that sees a Vanguard Party as the natural leaders of the Proletarian Revoltuion rather than democratic councils. This is based on the conditions in Russia before and during the revolution, when there was not a developed proletarian class. Central to the Leninist State is the idea of \"Democratic Centralism\", where internal debate on policy is only tolerated until the party reaches a decision, after which all members of the party - even those who disagreed with the decision - are expected to accept the decision and act accordingly. This is meant to prevent factionalism within the Communist Party. Though Leninism was originally accepting of Democracy (though with Socialist Groups playing primary roles), Leninism came to advocate a One-Party State during and after the Russian Civil War. The Leninist Government is organized around a bureaucracy. Decisions are made by the Central Committee and Politburo, and the bureaucracy then enacts the policy.\n\nLenin's initial economic policies involved the nationalization of all economic activity in the country, a period known as War Communism, which most famously involved mass confiscation of grain from the peasants during the Russian Civil War. This was replaced by the New Economic Policy (1921-1928), during which private enterprise was legalized. Overall, Leninism seeks to prevent the existance of Capitalist and Landowning classes, which Leninists believe inevitably lead to the exploitation of the Proletariat.\n\nOrthodox Leninism is noted for being progressive for its time. Lenin sought to eliminate the influences of Racism, Sexism, Nationalism, and Clericalism; denouncing them as tools used to divide the working classes. In this vein, Leninist Russia enacted policies improving the status of women and redirecting nationalism to cultural reneissances within cultural units of the USSR."

 stalinism:0 "Stalinism"
 stalinism_desc:0 "§YStalinism§!\nStalinism, officially known as \"Marxism-Leninism\", of Leninism based on the policies of Josef Stalin, General Secretary of the All-Union Communist Party (Bolsheviks), the ruling party of the USSR. Because of a power struggle against his political rivals, Stalin only secured his position in 1929, but his policies had been taking form since Lenin's death in 1924.\n\nStalinism involves a large bureaucracy meant to supplement the General Secretary’s policies in a system where political rivals and dissidents are dealt with harshly. At best, dissidents are expelled from the party and ostracized from society, and at worst, imprisoned in a concentration camp. Stalin relies on the secret police (the NKVD) to carry out the persecution of political dissidents. Stalinism also places heavy emphasis on class warfare, with those who are branded \"Class Enemies\" forcibly rejected by society. To legitimize Stalin's autocratic governance, a massive personality cult has developed around the leader, driven by intense propaganda efforts. Tolerating no competing moral authority, Stalinism also involves propagates intense misotheistic policies, as clergymen have been arrested en masse, and many religious buildings have been torn down and destroyed.\n\nIn 1928, Stalin ended the New Economic Policy and introduced the first Five-Year Plan, where all economic activity was nationalized and the state began a massive industrialization campaign, largely driven forward by forced labor. In addition, the government began a \"Collectivization\" effort, where all peasants were made to combine their land and work it collectively under state supervision. Such farms are known as \"Kolkhozy\" or Collective Farms. This was accompanied by \"Dekulakization\", where peasants suspected of hiding grain were ostracized and, in many cases, deported to Siberia or killed outright.\n\nStalinism is Socially Conservative, with Leninist policies that improved women’s' rights and national deliminations (Lenin and Stalin sought to co-opt Ethnic Nationalism to make it compatible with a Socialist State, leading to the creation of the SSR system) begining to see reversals under the Stalinist regime. Stalin also rejected the idea of Socialist Internationalism, instead adhering to the Bukharinist Theory of \"Socialism in one Country\", thereby causing the USSR to enter an extreme period of isolation."

 right_communism: "Bukharinism"
 right_communism_desc:0 "§Y$right_communism$§!\n\"Right Communism\", informally called \"Bukharinism\", is a derivative of Leninism that arose in the USSR during the post-Lenin power struggle. Right Communism came out of the \"Right Opposition\" as it is known in Soviet Histography, which was led by Nikolai Bukharin, a close associate of Lenin. Bukharinism strenuously advocates in favor of the one-party nature of the Leninist state and the democratic centralist nature of the Party (especially after Bukharin became extremely opposed to factionalism on Trotsky's part). As in Orthodox Leninism, the General Secratary is supported by the Central Commitee and Politburo, which in turn are supplemented by a large bureaucracy. However, Bukharinism does not seek to centralize power to the extent of Stalinism. Though his opinions were orginally regarded to be to the Left of Lenin's (he flirted with Left Communism), Bukharin came around to Lenin's positions after the Treaty of Brest-Litovsk, which he famously opposed.\n\nAfter the Civil War, Bukharin came to be an enthusiastic supporter of the New Economic Policy (A period of moderate Capitalism in the USSR, begun in 1921 and ending in 1928.) and the \"Smychka\", the alliance between the peasant and proletariat classes.\n\nIn defending the NEP, Bukharinism takes a more gradual approach to industrializiation through a combination of private and public sector activity. It takes a similar position in the defense of well-off farmers (The so-called \"Kulaks\"), arguing that the prospect of profit should be used to encourage production rather than lowering everybody to the level of the poor farmers. Bukharinism wants to offer conciliatory measures to the peasants to encourage production rather than forcefully collectivizing them. The resulting surplus produce might then be sold abroad for other goods. As Bukharin himself said, \"Only idiots can say there must always be the poor\". Bukharin also created the theory of \"Socialism in one Country\", which argues that instead of working towards the International Revolution, the USSR should strengthen itself internally, and that establishing Socialism in the USSR alone was possible. This was adopted by Stalin's government as state policy, leading to the establishment of a period of extreme isolation."

 maoism:0 "Maoism"
 maoism_desc:0 "§YMaoism§!\nMaoism refers to the political theory of Mao Zedong, an influential figure in the Communist Party of China. Maoism combines Marxism-Leninism, Agrarian Socialism, and elements of Chinese Nationalism to form a new and distinct ideology.\n\nMaoism first began to diverge from Marxism in the 1920's, as Mao began to use psychological - not socioeconomic – explanations to advocate for a socialist revolution. During the late '20s and early '30s, Mao began minimizing the use of Marxist theory and instead shifted focus to revolutionary objectives and practical realities. Thus, while Maoism is rooted on Soviet Socialist theory, Mao also stresses that Soviet-Style politico-economic structures are so far unsuitable for the Chinese, as China lacks a developed proletarian class. Nevertheless, Maoists hope to nationalize all economic activity as the USSR did during the late 1920's and early 1930's. Whereas Marx based his dialectics on what he saw as the inherent contradictions of the goals of the working and capitalist classes, Maoism rejects Materialist Dialectics for a different way of thinking. Maoist Contradiction focuses on the relationships between ideological theory versus revolutionary practice, and revolution versus counter-revolution. As a result, Mao rejects the Marxist focus on the urban proletariat, choosing instead to focus on the peasantry.\n\nMao considers urbanity to be a symbol of imperialist capitalism, while the rural countryside is emblematic of communism. Early Maoist economic reforms thus focused on expanding access to education and the redistributing nationalized land. Despite refuting several key foundations of Marxism, Mao insists that his ideology is compatible with Marx's teachings, though he has yet to make a clear connection between the two.\n\n As Maoism also contains elements of Chinese nationalism, with its stated goal to unify China, it is invariable that its proponents should have to assert themselves by force, especially in the face of persistent warlordism, encirclements, and Japanese incursions. In this effort, a central part of Maoist thought is the \"People's War\", a military strategy necessitated by the Chinese Communists' lack of military equipment. This strategy combines strong political propaganda with guerilla warfare to establish both a political and military advantage, despite leading an army using backwards equipment."

 german_communism:0 "Marxism-Leninism"
 german_communism_desc:0 "§YMarxism-Leninism§!\nSoon after the outbreak of the Great War, left-wing revolutionaries who opposed the war and the Social Democratic Party of Germany’s parliamentary reformism, such as Karl Liebknecht and Rosa Luxemburg, broke with the SPD to form the Spartacus League, which renamed itself to the Communist Party of Germany (Kommunistische Partei Deutschlands/KPD) during the German Revolution. The government eventually put down the revolts, during which Liebknecht and Luxemburg were killed. After the attempted revolution, the KPD began to move closer to the USSR (as part of the Comintern) and away from revolutionary policy, which has brought them a substantial following. In 1925, trade unionist Ernst Thälmann took over the party leadership with Moscow’s backing. In 1928, as per Comintern policy, the KPD adopted the Third Period strategy, in which rival left-wing organizations were to be seen as equal, if not greater, threats than bourgeois groups.\n\nThe KPD closely follows Marxist-Leninist principles. They call for a German Soviet Republic in the form of a one-party state. The KPD follows democratic centralist principles, which aims to do with party factionalism while maintaining a veneer of democracy. The German Soviet Republic would largely emulate and be in alliance with the USSR. Industry and financial services would be brought under government control, and large farming estates would be redistributed. However, KPD rhetoric in recent years has begun to see a nationalist bent, sometimes reaching the point of antisemitism. The KPD wishes to repudiate the Treaty of Versailles and other \"chains of national subjugation\", which they claim is a plot by the ruling classes to stifle the German working and middle classes."

 ### Revolutionary socialism
 council_communism:0 "Council Communism"
 council_communism_desc:0 "§YCouncil Communism§!\nCouncil Communism is a political theory mostly present in the Netherlands and Germany. It arose out of the Left Communist camp of the German Socialists near the end of the Great War. One faction, formed around Rosa Luxemburg, formed the Spartacus League, which would eventually become the Pro-Soviet Communist Party of Germany (KPD). The Left Communists would be expelled from the KPD for their ideological deviation from Leninism and form the Communist Workers' Party of Germany (KAPD) in 1920. Other Council Communist parties would then be formed in Bulgaria, the Netherlands, and the UK. Though the KAPD was known in Germany, the other groups would never achieve any form of relevance. The KAPD eventually split into smaller factions, which themselves became further splintered, due to infighting caused in differences of opinion around organization and affiliation.\n\nCouncil Communism developed in direct reaction to the growing Leninist trend towards autocracy, as demonstrated in the Russian Civil War and the Stalinist centralization power in the 1920's. The ideology explicitly rejects Leninist institutions, arguing that the workers should support neither a Vanguard nor a Reformist Party. Instead, Council Communists argue that a revolution is necessary to install a system of Democratic Workers' Councils, which would manage the new economy and state in a decentralized manner. These councils will be made up of elected representatives, and will act as an amalgamation of executive, legislative, and judicial branches. Furthermore, representatives will be subject to removal through recall petitions should the need arise. These decentralized measures are meant to avoid the establishment of a Party Dictatorship as in the USSR. Council Communism stresses that an organized Party is not meant to lead the revolution, arguing that the workers themselves will take the primary role. Under Council Communism, economic decisions would be made collectively by the workers as Council Communists denounce Soviet-Style Planned Economies as \"state capitalism\", arguing that the proletariat in the USSR is still subject to wage labour, and thus socialism had not been achieved."

 social_nationalism:0 "Left-Wing Nationalism"
 social_nationalism_desc:0 "§Y$social_nationalism$§!\nLeft-Wing Nationalism, or Socialist Nationalism, holds both Nationalism and Social Equality as core tenants. Though not all Social Nationalist movements are Marxist, they all generally support Egalitarianism, National Self-Determination, and Anti-Imperialism to varying degrees. In contrast, one point of disagreement is the treatment of Minority Groups. While most Left-Nationalist groups reject ethnic homogeneity, a few others perceive Ethnocentrism as an acceptable or even desirable political goal.\n\nAs a catch-all term, Left-Nationalism can encompass a number of stances on political theory. Though many of the more notable Authoritarian and Totalitarian Socialist ideologies (Such as Stalinism or Maoism) are Nationalist in nature, there are also many Left-Nationalist movements that advocate for Democracy. Notable examples include Early Polish Socialism and some Basque and Catalonian groups. While Left-Nationalism houses a number of different opinions on economic structures, most can generally be classified as anti-capitalist. Additionally, they defend workers' rights and the development or expansion of a welfare state. Some Left-Nationalist movements can also be Agrarian Socialist, choosing to focus on the peasants rather than the urban workers. These groups sometimes choose not focus on the specific economic structure they wish to implement, preferring focus on the national issue instead."

 anarcho_syndicalism:0 "Anarcho-Syndicalism"
 anarcho_syndicalism_desc:0 "§Y$anarcho_syndicalism$§!\nA branch of Anarchism that incorporates Syndicalist thought, Anarcho-Syndicalism sees the Trade or Craftsman Union as the principal political organization of the working class, rejecting party politics.\n\nBefore discussing Anarcho-Syndicalism, \"Proper\" Syndicalism should be explained. Syndicalists view political parties as inter-class organizations, whereas a union can be an inter-political organization. However, they are not above working with political groups for a common goal. According to Syndicalist theory, the Trade Union is meant to organize the workers in campaigning for better working conditions before eventually overthrowing Capitalism in its entirety. What sets Syndicalism apart from other forms of Socialism is its lack of major theoretical evolution. Though it has a theory, Syndicalists distrust the intelligentsia, and see workers' action as a more effective revolutionary tool than ideological abstraction.\n\nAnarcho-Syndicalism takes this a step further, integrating Syndicalist Trade Union activity with Anarchist thought. Anarcho-Syndicalists do not necessarily wish to dominate the workers' movement, accepting the mere duties of organizing and helping put pressure on the existing power structure. On the other hand, Syndicalism and Anarcho-Syndicalism have had several ideologues, most notably Richard Rocker and Georges Sorel. Putting a heavy emphasis on direct action, Anarcho-Syndicalists believe that self-managing Trade Unions will eventually supplant political parties and corporations to become the main basis of societal organization. Under such a system, the \"state\" as we know it would be replaced by a decentralized federation of communes, where workplaces would elect delegates to represent them at the syndicate level, which would in turn elect their own delegates to represent the syndicate at the federal level. This also reflects the economic structure of the Anarcho-Syndicalist society, where collectives of workers and peasants would make economic decisions on their own, without direction from bureaucrats or executives."

 centrist_marxism:0 "Centrist Marxism"
 centrist_marxism_desc:0 "§Y$centrist_marxism$§!\n\"Centrism\" in Marxist terminology refers to positions between Reformism (aiming to achieve Socialism through gradual reform) and Revolution (aiming to achieve Socialism by a rapid sociopolitical transformation). Parties that follow Centrist Marxism are generally to the left of mainstream Social Democratic parties and to the right of more radical Communist groups. This tendency manifests in party programs that demand radical change, but without the intention to launch a Socialist Revolution.\n\nAs Marxists, the primary concern of these \"Centrists\" are workers' rights and the eventual replacement of the \"Bourgeoisie Capitalist State\" with an internationalist \"Dictatorship of the Proletariat\". What this actually entails depends on the party in question. For example, the short-lived Independent Social Democratic Party of Germany adopted a platform that argued for a system of workers' councils. On the other hand, the British Independent Labour Party did not advocate for major changes to the parliamentary system. However, Centrists reject the idea of a Soviet-Style Vanguard State, arguing that it results in a totalitarian autocracy. As in politics and government, so too does Centrist Marxism vary in economic policy. Though they generally agree on their radical anti-capitalism, the actual economic structure of the intended Socialist society is left rather vague. However, Centrist Marxist parties are generally progressive rejecting racism, anti-semitism, and sexism to varying degrees."

 syndicalism:0 "Syndicalism"
 syndicalism_desc:0 "§YSyndicalism§!\nDerived from the French word \"Syndicat\" (Trade Union), Syndicalism is less of a political ideology than an organizational strategy. Syndicalists reject parliamentary politics, claiming that it merely serves to divide the working class and therefore do not participate in elections (though they sometimes collaborate with parliamentary groups to reach a common goal). Instead, Syndicalists view the Trade Union as the workers' primary representative organization. According to the theory, the purpose of the Trade Union is to coordinate the workers in campaigns for better rights and the eventual usurpation of capitalism and its replacement by a socialist society.\n\nThe term \"theory\" must be loosely applied to Syndicalism, as it proudly rejects political philosophy, as its adherents distrust intellectuals and wish for Syndicalism to remain purely a workers' movement. Regardless, that has not stopped self-proclaimed ideologues from expanding on Syndicalist ideas, the most famous example being Georges Sorel.\n\nThe eventual aim of Syndicalist leaders is to supplant the Capitalist State with a Socialist Federation, where the Trade Union is the basic unit of society. In such a structure, self-managed work places would elect delegates to the Trade Union, which would then elect delegates to a parliament made solely out of workers' representatives.\n\nThough Syndicalist leaders generally believe that the movement must constantly wage a Class War to destroy bureaucracy and capitalism, many of the workers who join Syndicalist movements are generally indifferent about this goal, being far more interested in advancing their rights and improving their working conditions. Syndicalist movements are generally racially progressive, but have varying attitudes to women’s rights. Several Syndicalist groups were openly hostile to female membership until the late 1910's.\n\nBefore the Bolshevik Revolution and the end of the Great War, it was the primary worker movement, particularly in France, Spain, and Italy (Marxism was more of an intellectual movement at the time). Ideologically similar movements, such as the Industrial Workers of the World, had influence in their respective countries as well. However, a combination of state repression, effective welfare policies, and the increasing appeal of Marxist Social Democratic or Bolshevik parties have rendered Syndicalist groups powerless in most nations."

 rev_socialism:0 "Revolutionary Socialism"
 rev_socialism_desc:0 "§Y$rev_socialism$§!\nRevolutionary Socialism is the belief that a rapid far-reaching restructuring of society is necessary in order to achieve Socialism. This position is in direct contrast to \"Reformist\" movements that seek to slowly transition from a Capitalist to Socialist society by parliamentary means. This principle partly comes from the Communist Manifesto by Karl Marx and Friederich Engels, where they wrote that Communism can only occur through the \"forcible overthrow of all existing social conditions\" by the working class. The workers would then form a \"Dictatorship of the Proletariat\", a government in which the working class would hold power. What these concepts actually entail vary from movement to movement. However, many Revolutionary Socialists reject Marxism and adhere to other forms of socialism, such as Anarchism or Syndicalism.\n\nAside from their differences in preferred political and economic structures, one of the major points of contention between Revolutionary Socialists is exactly how the revolution should be led, though they all agree that a mass movement is necessary to carry it out. Leninism and some other theories subscribe to Vanguardism, where the revolution is led by an intellectual elite, leading to the creation of a hierarchical bureaucracy. Other theories believe that the workers themselves must trigger the revolution. These movements tend to be less structured and more egalitarian.\n\nRevolutionary Socialists might vary in their preferred economic system, but they all agree that the role of the \"ruling classes\", such as Capitalists or Landowners, should be generally eliminated. Some advocate for a total Soviet-Style nationalization of industry, while others advocate for decentralized planning or workplace self-management, where economic decisions would be made democratically by the workers themselves rather than by a corporate hierarchy.\n\nWith the Bolshevik Revolution in 1917, the rise of Josef Stalin, and the establishment of Moscow-imposed ideological rigidity of Western Communist Parties, Leninism and Marxism-Leninism have by far become the primary revolutionary socialist ideologies. While non-Leninist and non-Marxist Revolutionary groups still exist in moderate numbers, they rarely have the influence needed to challenge the dominance of the Bolsheviks and Reformists."

 caballerism:0 "Caballerism"
 caballerism_desc:0 "§YCaballerism§!\nFrancisco Largo Caballero is the leader of the Spanish Socialist Workers' Party (Partido Socialista Obrero Español), or PSOE.\n\nCaballero was born in a Madrid attic to a carpenter father and his maid wife (though she left him shortly thereafter). Caballero began working as a child, where he experienced the workers' poor conditions first-hand. At 21, he joined the General Workers Union (UGT) after witnessing a speech by PSOE founder Pablo Iglesias in 1890, and joined the PSOE three years later. By 1925, Caballero held a significant amount of influence in the UGT and PSOE and after Pablo Iglesias' death that year, Caballero succeeded him as General Secretary. He would become the President of the PSOE in 1932.\n\nCaballero used to be more moderate. For instance, during the Dictatorship of Primo de Rivera, Caballero argued for collaboration with the regime in order to further their Socialist aims, even given the circumstances. This set him apart from his rival Indalecio Prieto, who rejected collaboration. The growing instability of the nation led the Socialists to break with the regime in 1929, and they entered the government coalition upon the establishment of the Second Spanish Republic in 1931. Caballero was the Minister of Labour, where he secured key progressive reforms. An experienced politician and trade unionist, his originally moderate Socialist positions are slowly radicalizing due to the growth of Anti-Republican movements in Spain.\n\nLately, Caballero has turned sharply to the left in response to the rise of Conservative Parties and movements. Once the coalition with the Liberal Republicans collapsed in 1933, Caballero began to advocate for a violent revolution against the Republic, which he deems a \"Bourgeois Dictatorship\". He sees a civil war as necessary to topple the Republican government and establish a \"Soviet Republic\" and expropriate private property. However, he does not reference Lenin in his rhetoric, which aims to appeal towards a broader base of Socialists. Caballero voices his own positions while advocating for cooperation with the Pro-Soviet Communist Party of Spain (PCE), the Revolutionary Workers' Party of Marxist Unification (POUM), and the Anarcho-Syndicalist National Confederation of Labour (CNT). All of this has put him in opposition to the now-moderate Prieto, who now supports cooperation with the Liberal Government."

 caballerism_soc:0 "Caballerism"
 caballerism_soc_desc:0 "Francisco Largo Caballero is the leader of the Spanish Socialist Workers' Party (Partido Socialista Obrero Español), or PSOE.\n\nCaballero was born in a Madrid attic to a carpenter father and his maid wife (though she left him shortly thereafter). Caballero began working as a child, where he experienced the workers' poor conditions first-hand. At 21, he joined the General Workers Union (UGT) after witnessing a speech by PSOE founder Pablo Iglesias in 1890, and joined the PSOE three years later. By 1925, Caballero held a significant amount of influence in the UGT and PSOE and after Pablo Iglesias' death that year, Caballero succeeded him as General Secretary. He would become the President of the PSOE in 1932.\n\nCaballero used to be more moderate. For instance, during the Dictatorship of Primo de Rivera, Caballero argued for collaboration with the regime in order to further their Socialist aims, even given the circumstances. This set him apart from his rival Indalecio Prieto, who rejected collaboration. The growing instability of the nation led the Socialists to break with the regime in 1929, and they entered the government coalition upon the establishment of the Second Spanish Republic in 1931. Caballero was the Minister of Labour, where he secured key progressive reforms. An experienced politician and trade unionist, his originally moderate Socialist positions are slowly radicalizing due to the growth of Anti-Republican movements in Spain.\n\nLately, Caballero has turned sharply to the left in response to the rise of Conservative Parties and movements. Once the coalition with the Liberal Republicans collapsed in 1933, Caballero began to advocate for a violent revolution against the Republic, which he deems a \"Bourgeois Dictatorship\". He sees a civil war as necessary to topple the Republican government and establish a \"Soviet Republic\" and expropriate private property. However, he does not reference Lenin in his rhetoric, which aims to appeal towards a broader base of Socialists. Caballero voices his own positions while advocating for cooperation with the Pro-Soviet Communist Party of Spain (PCE), the Revolutionary Workers' Party of Marxist Unification (POUM), and the Anarcho-Syndicalist National Confederation of Labour (CNT). All of this has put him in opposition to the now-moderate Prieto, who now supports cooperation with the Liberal Government."

 de_leonism:0 "De Leonism"
 de_leonism_desc:0 "§YDe Leonism§!\nCreated by American Trade Unionist Daniel De Leon, De Leonism is a Libertarian Marxist theory that synthesizes early Revolutionary Syndicalism with Marxism. De Leon was an immigrant to the United States born on the Dutch Caribbean Island of Curaçao, though he had Spanish ancestry. Though initially a Georgist, he became a Revolutionary Marxist in the 1880s, joining the Socialist Labour Party in 1890. Though he remained influential in the SLP, his affiliations with other groups such as the Industrial Workers of the World fluctuated as he began to disagree with their theories and tactics.\n\nDe Leonism agrees with Syndicalism and Anarcho-Syndicalism that the Trade Union should be the primary unit of society, but also considers a central government to be necessary in economic coordination (though not in the bureaucratic Soviet style). Though De Leon maintained that while the Industrial Unions would play a major part in carrying out the revolution, a revolutionary political party is necessary to allow the Unions to take power, assuming the party can maintain a position of sufficient influence. Essentially, De Leonism encourages a peaceful transfer of power where a De Leonist party is voted into office, which then works with the De Leonist Unions to transfer control of the means of production to union-organized councils. The (presumably) Liberal Government would then be replaced by an \"All-Industrial Congress\" staffed by representatives elected by the workers. These representatives would be chosen from the Trade Unions themselves while workers would also elect representatives to councils at the workplace and local levels.\n\nThough the All-Industrial Congress would help to coordinate economic activity, it relies on workplace self-management and democracy rather than the bureaucratic model that arose in the USSR. De Leonism predates Leninism by at least a decade and has influenced Socialist Theorists such as Gramsci and (allegedly) Lenin himself. Despite this legacy, De Leonist parties have dwindled to the point of near collapse as a result of the rise of Marxist Social Democratic and Bolshevik parties."

 agrarian_socialism_rev:0 "Agrarian Socialism"
 agrarian_socialism_rev_desc:0 "§Y$agrarian_socialism_rev$§!\nAgrarian Socialism is an ideology that puts emphasis on farmers rather than industrial workers. Whereas Marxist or otherwise Industrial Socialist theories focus on transferring the means of production from the Capitalists and Landowners into the hands of the workers, Agrarian Socialism makes land reform its largest priority. The extent of said land reform varies from movement to movement. Moderate Agrarian Socialist programs may be satisfied with breaking up large estates or existing feudal structures (in the case of less developed countries) to allow each farmer to own the land they work on, and thus own the fruits, vegetables, or other crop of their labour. Other more radical forms of Agrarian Socialism might advocate for collective land ownership, where the land would be worked and owned by a collective of families, who would also own their harvest communally. The most extreme Agrarian Socialist movements - such as the 17th-century Diggers movement in England - call for the abolition of land ownership altogether, arguing that the land should be worked and owned communally.\n\nThough the desired political structure varies between movements and parties, Agrarian Socialist movements generally tend towards decentralization and localism, as they put emphasis on the countryside rather than on urban localities. Though some Agrarian Socialist groups may choose to include worker-based policies (which can include Marxist principles), their primary focus will nonetheless remain on the farmers."

 guesdism:0 "Guesdism"
 guesdism_desc:0 "§YGuesdism§!\n\"Guesdisme\" (\"Guesdism\" in English) is the name given to the informal collection of policies associated with French Socialist Jules Guesde. Guesde was an early member of the \"Section Française de l'Internationale Ouvrière\" (French Section of the Workers International, or SFIO), and his policies became the general guideline of the SFIO, though never the official party line.\n\nGuesdists reject both reformism and revolution. They claim that reformism, which involves cooperation and conciliation with Bourgeois, is not compatible with the development of Socialism. And for the latter, unlike Lenin and other Revolutionaries, they refuse to immediately engage in an immediate revolution, instead wishing to prepare for an eventual revolution through class struggle. Guesdism is also characterized by its simplification of Marxism. Though the Guesdists are Marxists, they focus more on political practice than revolutionary theory, which drew the ire of many of their contemporaries, including Karl Marx himself.\n\nGuesde's policies draw criticism from other currents in the SFIO, which complain about Guesdism's vulgarization of Socialist Philosophy and lack of commitment to either reformism or revolution. Reformists feel that Guesdism attempts to unnecessarily segregate the Socialists from the Left-Liberals, while Revolutionaries feel that Guesdism's inaction is damning enough. \n\nNonetheless, Guesdist opinions on economics are strongly against economic nationalization, believing that it was too authoritarian. For all intents and purposes, Guesdism can be considered to lean towards reformist political positions, but without the intention to cooperate with Liberal Parties.\n\nGuesde and his faction left a major imprint on French Socialism. The Guesdists were a contributing factor in the establishment of a French Socialist tradition, and his policies were included in the SFIO political program. However, the Great War had changed Guesde's attitude, and he entered René Viviani's National Unity Government in 1914 where Guesde was a minister until 1916. He would begin to advocate for a patriotic - and occasionally nationalist - viewpoint, until he died in 1922."

 ### Democratic socialism
 real_socialism:0 "Reformist Socialism"
 real_socialism_desc:0 "§Y$real_socialism$§!\nReformism is a current of Socialism that advocates the use of legal parliamentary means to gradually transition towards a Socialist society. This puts it in direct contrast with Revolutionary Socialism, which demands an immediate overthrow of the Capitalist system. Reformist groups participate in parliamentary politics, sometimes cooperating with non-socialist parties in order to achieve their aims.\n\nReformism is sometimes considered a Marxist current. Marxist Reformism was first adopted in 1875 when the Social Democratic Party of Germany created a program that advocated for achieving Socialist goals through parliamentary participation, much to Marx's own chagrin. However, non-Marxist reformist theories also exist. For example, British Fabians also advocated for parliamentary gradualism while rejecting Marxism.\n\nThe actual platform of Reformist Groups vary, but emphasis is generally placed on workers' rights and welfare. These \"Social Democratic\" parties advocate for policies such as the eight-hour day, universal healthcare, expanding access to education, and sometimes international pacifism. When it comes to implementing Socialism, these parties tend to advocate nationalizing public utilities and transport, as well as regulatory and interventionist market policies. To solve the class struggle without violence, Reformists will sometimes advocate a system in which the government mediates disputes between Labour and Capital interests. This avoids a violent class war without ignoring the plight of the working man. Reformists see the advancement of democracy as a prerequisite to Socialism. As a result, they often support laws to expand the franchise and introduce more fair voting calculation methods.\n\nReformism is also generally progressive. Reformist parties are generally more accepting of female and minority members, but this also varies between countries. There are cases of outwardly racist Reformist parties, such as the South African Labour Party, but these are few and far between."

 british_labour:0 "Labourism"
 british_labour_desc: "§Y$british_labour$§!\nThe Labour Party began in the United Kingdom as the Labour Representation Committee, an initiative by the Trade Union Congress to form an organization that would support Left-Wing parliamentary candidates at the national level. In 1906, LRC Parliamentarians changed their name to \"The Labour Party\" but continued as an umbrella group of Leftist organizations rather than a true political party. Over time, candidates would run purely under the "Labour" banner, decreasing the need for affiliated organizations. Labour first came into government in 1923, but this ministry collapsed within a year due to scandals such as the forged Zinoviev Letter. Labour came back into government in 1929, but was unable to deal with the Great Depression and was defeated in 1931 by a coalition of Conservatives, Liberals, and the National Labour Organization. Labour Parties were also formed in Australia, New Zealand, and South Africa.\n\nLabour began with a collection of different socialist ideas, however, the Fabian Society has by far been the greatest influence on Labour. \"Fabianism\", named after the Roman General Fabius, advocates for a slow transition to Socialism using Parliamentary means. Fabian Socialists advocate for establishing a Welfare State, including an increased minimum wage, a national health service, and national education programs. Instead of advocating for the end of the British Empire, the Fabians propose a reform of the Empire as a positive constructive tool.\n\nLabour's current platform involves wide-ranging economic restructuring, demanding the nationalization of land, mineral resources, and public utilities, as well as ventures into state planning and the establishment of state medical care. Labourites are also generally pacifist, but are not opposed to advocating for military buildup against Fascist powers."

 prietism:0 "Prietism"
 prietism_desc:0 "§YPrietism§!\nIndalecio Prieto was born in Oviedo, Asturias in 1883, where his father died when he was six years old. Prieto joined the Spanish Socialist Workers' Party (Partido Socialista Obrero Español, PSOE) at the age of 16 as an up-and-coming journalist. He quickly became influential in the Basque Country, becoming the provincial deputy of Vizcaya in 1911. His influence only continued to grow, and he was involved with organizing the Spanish General Strike of 1917 and became an Executive of the PSOE by 1921. He was a fierce opponent of the Primo de Rivera dictatorship, which brought him into conflict with his political rival, Largo Caballero, who was in favor of collaboration.\n\nWhen the Second Spanish Republic was declared in 1931, Prieto became the Minister of Finance in the new government, where he pushed for greater reforms. However, he abstained from voting on the Female Suffrage Law. Prieto was then moved to the Ministry of Public Works, where he planned extensive infrastructure projects. However, the Liberal-Socialist coalition would collapse in 1933.\n\nPrieto is a moderate in the PSOE. Unlike the Revolutionary faction, Prieto argues that the Socialists should continue to work for reform in conjunction with the Left-Liberal parties and advocates for a Keynesian economy, where the state would be active in regulation and public works. Though Prieto promotes democracy, he also advocates for a strong public order to ensure stability. This has likely contributed to his increasing Spanish patriotism, though he does not reject internationalism either. Consequently, Prieto does not accept Catalan or Basque separatism as legitimate goals, arguing that Spain must remain whole."

 blumism:0 "Blumism"
 blumism_desc:0 "§YBlumism§!\nWhile the centre wing of the SFIO (French Section of the Workers' International) officially follows the same Guesdist line as the left wing, they are ideologically closer to Jean Jaures and the pre-SFIO Independent Socialists. As Juares advocated, they are far more invested in Parliamentary Politics and tend to be far more favorable to the idea of working with \"Bourgeois\" parties such as the Left-Liberal Radicals. While they often use Marxist rhetoric and refuse to engage in outright reformism, they are far from dogmatic, unlike Marcel Déat and the Neosocialists. Leon Blum, the leader of the centre wing, is relatively indifferent to Marxism.\n\nIn typical Jauressian fashion, they are also very attached to French Republican values such as the Declaration of the Rights of Man and the Citizen, or \"Liberal\" Humanism, unlike more Orthodox Marxists who would argue for going beyond those values. Like more \"orthodox\" Guesdists (and unlike typical Marxists), they tend to be opposed to nationalization, viewing it as an authoritarian top-down method of improving the workers' lives, preferring to support the working class through the empowerment of unions, mutual help, and more favorable workplace regulations."

 ### Social democracy
 dem_socialism:0 "Social Democracy"
 dem_socialism_desc:0 "§Y$dem_socialism$§!\nModerate Social Democracy evolved out from the radical Social Democratic movement after the Bolshevik Revolution, as some Socialist parties began to give up Marxist aims. Though these moderates do not reject the Socialist concept of the class struggle, they choose to focus on improving collaboration between classes and improving minimum living conditions. In addition, they are committed to protecting private property, rather than attempting to transition from a state of private to public ownership.\n\nMuch like their radical counterparts, moderate Social Democrats value parliamentary democracy as the primary method of social reform, rejecting both violent revolution and general strikes. As such, they will always argue for the adoption of egalitarian voting methods and the expansion of the franchise wherever possible. They are also usually progressive, at the least in comparison with other movements in the country. They will generally campaign for the improvement of civil rights, opposing social hierarchies based on race or gender.\n\nUnlike their radical counterparts, moderate Social Democrats do not wish to reform capitalist structures into socialist ones, instead attempting to establish a market economy which provides for the needs of both the working and upper classes. As such, much like the radicals, they argue for the establishment of a welfare state, where minimum wages, unemployment pensions, retirement funds, state-provided healthcare insurance, and public education are guaranteed and funded to high levels by the state. However, the moderates consider this their end goal. Using welfare measures and economic intervention, a moderate Social Democratic government seeks to close the gaps between the rich and the poor without eliminating the class system proper. In this vein, Social Democrats argue for state mediation between Capital and Labour to prevent ill-will and violence amongst sectors of society."

 republicanism_spr_alt:0 "Left Republicanism"
 republicanism_spr:0 "Spanish Republicanism"
 republicanism_spr_desc:0 "§Y$republicanism_spr$§!\nSpanish Republicanism grew out of the ideology of the French Revolution and the Peninsular war against Napoleonic France. However, it only crystallized in the 1850s, during the reign of Isabela II. Though Spain became a republic in 1873, it did not last even a year before it was overthrown by a series of coups and counter-coups. From there on, Republicanism remained unpopular, until the Primo de Rivera coup and dictatorship left many liberal intellectuals disillusioned with the monarchy, creating many different groups such as the Republican Alliance. After the fall of the dictatorship, Socialists, Radicals, and Republicans would sign the San Sebastián Pact, signaling the beginning of an alliance that finally managed to proclaim the Spanish Republic on the 14th of April 1931.\n\nRepublicans, led by Manuel Azaña, have thereafter pushed for a number of reformist measures: Statutes of Autonomy for historical nationalities such as Catalonia, radical laicism, and land, military, and education reform to eradicate aristocratic and clerical influence from Spanish society. This has caused a split between the more centre-right Radicals and the Republicans, with the latter now working more closely with the Moderate Socialists.\n\nLike other left-liberal ideologies, Republicanism appeals to small business owners, technical specialists, and intellectuals. In Spain, it is opposed by Conservatives, Monarchists, Falangists, Anarchists and Communists, but the Republicans are willing and able to cooperate with the Moderate Liberals and Socialists."

 american_progressivism_alt:0 "Progressivism"
 american_progressivism:0 "American Progressivism"
 american_progressivism_desc:0 "§Y$american_progressivism$§!\nProgressivism in the United States arose in the late 19th century. The unchecked growth of capitalism and industry brought poverty and political corruption, which in turn gave rise to a Progressive Movement focused on \"purifying\" society of corruption, waste, inefficiency, and inequality.\n\nProgressives seek to limit corruption in the voting process. During the Progressive Era (1890-1914), they fought against powerful bosses (who bought votes), alcohol sales, and fought to curtail corrupt voting practices, even advocating for disenfranchisement in some cases. The Progressives also managed to secure reforms to municipal governments, making them more structured and easier for the common citizen to participate in.\n\nProgressives seek to improve equality. Modern progressives use scientific analysis to argue for shorter working hours, equality for women and minorities, and compulsory education. Progressives identify industrial monopolies as a main cause of social poverty. As a result, they advocate for the break-up of excessively large conglomerates and corporate regulations. They also support safer working conditions, minimum wages, and other pro-worker positions.\n\nThough the Progressive Era might be over, Progressive ideals remain entrenched in American society. Progressives today support FDR's New Deal, though they would like to take it in a more advanced direction. Progressives such as Henry Wallace seek to use state solutions to raise the poor out of poverty, establish equality for minorities, and achieve peaceful coexistence with Communist Powers."

 french_neosocialism:0 "Neosocialism"
 french_neosocialism_desc:0 "§Y$french_neosocialism$§!\nThe progenitor of French Neosocialism was the Belgian \"Planisme\", of  Belgian Labour Party Leader Henri de Man. Planisme involves using the state to plan economic activity in order to counter the \"perverse effects\" of market economies. Neosocialism was born in France out of the right-wing of the SFIO (French Section of the Workers' International) as a rejection of the Revolutionary and Reformist Marxist dichotomy.\n\nSpearheaded by Marcel Déat, the term \"Neosocialism\" was first used in 1930. His essay \"Socialist Perspectives\" advocated for the end of the SFIO's isolation from other left-wing movements and for an alliance with middle-class parties. Using the right wing's newspaper, \"The Socialist Life\", Déat began to expand upon his ideas.\n\nNeosocialism rejects both the necessity of Marxist Class Struggle and Capitalism. Instead, Neosocialists seek to replace the capitalist system with a corporatist one, where the classes would collaborate at their place of work rather than having an individualist profit motive. Most of the economic activity will be directed - not planned in the Soviet style - by technocratic civil servants in order to form agreements between the different sectors of society. Despite the planning, Neosocialism aims to preserve private property within the aforementioned Corporatist framework.\n\nSimilarly, Neosocialism calls for the replacement of the Parliamentary System with a Centralized Technocracy, though it vaguely roots this in democratic institutions. The Neosocialist \"Constructive Revolution\" would be framed in a bourgeois revolutionary manner. In this vein, Neosocialists wish to institutionalize the middle-class, such as small business owners and the intelligentsia to properly represent them alongside the workers (already represented in Unions) and the Capitalists (represented by their firms).\n\nThough Neosocialism’s social policy is somewhat diverse as while it is progressive (though there are Anti-Semitic Neosocialists), it bases its social policies on national traditions, but not Traditionalism. For example, it is patriotic, but also anti-clerical."

 brazilian_labourism_alt:0 "Labourism"
 brazilian_labourism:0 "Brazilian Labourism"
 brazilian_labourism_desc:0 "§Y$brazilian_labourism$§!\nBrazilian Labourism finds its roots in the Tenentista movement of the 1920's. The \"Tenetists\" demanded secret ballots, female suffrage, and educational reform. Though Brazilian Labourism is not a formal ideology, its ideals have slowly been developing since the 1920's.\n\nBrazilian Labourism's main ideologist is Alberto Pasqualini, a sociologist of Italian heritage. While Pasqualini supports market economies over socialism, he also rejects an entirely free market. He decided that profit must also bring social gains, leading to his use of the term \"Solidarist Capitalism\". He also sees education reform as a major issue, as it was the best way to change society to a Labourist structure.\n\nBrazilian Labourism also has a nationalist component. Labourists are willing to engage in class collaboration in order to industrialize Brazil and move towards an incomplete autarky and therefore, support protectionist policies. Brazilian Labourism is also culturally nationalist, as they wish to preserve Brazil's cultural heritage. However, though the Labourists wish to preserve Brazil's cultural heritage, they do not see this as a priority and generally use it as a justification for their economic policy."

 ### Social liberalism
 liberalism:0 "Social Liberalism"
 liberalism_desc:0 "§Y$liberalism$§!\nSocial Liberalism began in the late 19th century out of concerns about social inequality and slowing economic growth brought about by laissez-faire capitalism. Though social liberalism is mostly known as an Anglo concept, the term \"social liberal\" was first used in Germany in 1893, though German \"left-liberals\" were different from the UK \"New Liberals\". Thinkers in the United States and France also came to reject classical liberal economics, estabilishing their own traditions and ideas.\n\nSocial Liberalism has no singular core tenet, but instead views individual freedom and the common good as equally desirable goals. Social liberals strongly advocate for parliamentary democracy, and see civil freedoms as paramount. They will therefore support freedoms of speech, assembly, religion, and the right to a secret ballot. Similarly, social liberals are also socially progressive, and tend to support greater rights for minorities and women. Economically, social liberalism supports a market economy, but rejects classical economics. They hold that laissez-faire policies allow for gross economic inequalities that hamper classical liberalism's advocacy for equal opportunity. Social liberals thus advocate for pro-labour policies such as a minimum wage, safety regulations, education reform, and social security, as well as pro-consumer policies such as corporate regulations and progressive taxation. In this manner, social liberals work to provide opportunity for all without eliminating the capitalist system.\n\nThough social liberal positions are generally supported across the political spectrum in one way or the other, after the Great War, liberal parties began to decline in favor of Social Democratic and Conservative groups."

 jadidism:0 "Jadisism"
 jadidism_desc:0 "§Y$jadidism$§!\nJadidism is a modernist Muslim movement that arose in the late 19th century Russian Empire. The \"Jadids\"' ideology was based on the position that Muslims in the Russian Emipire had begun to decay, and sought to apply European models to reform Muslim culture to modernize the people.\n\nJadids largest priority is to reform education. They reject traditionalist religious education on the basis that it does not teach concepts, only memorization. Ergo, traditionalist education was outdated in the modern world. Jadid \"New Schools\" taught modern subjects such as science and history. They also introduced educational tools such as blackboards or even desks that were missing from the traditional schools. Strikingly, corporal punishment was prohibited in these schools, and parents were encouraged to send their daughters (though few did), which was a remarkably progressive position to hold in the Russian Empire. Though Jadidism is still a religious movement, they often came into conflict with conservative members of the clergy, thus it adopted an anti-clerical tone. The Jadids saw their \"Qadimist\" opponents as promoters of social degeneracy and backwardness, which only hindered the Muslims of the Russian Empire. Despite this dichotomy, Jadidism is also not a united movement. There are more left-wing Jadids and more right-wing Jadids, though they all fit within the reformist tradition.\n\nJadidism also has a nationalist aim. In the early 20th century, Pan-Turkism became a major current among Jadids in central asia, though pan-ethnic goals were not shared by all in the movement. However, during Jadidism's peak during the Russian Civil War, several Jadidist movements established parliamentary democratic states out of the crumbling Empire, including Azerbaijan, the Mountain Republic, and the Kokand Autonomy. With the arrival of the Bolshevik Dictatorship, the Jadids and Communists collaborated at first (with the exception of the Tashkent Soviet's crushing of Kokand), but eventually the Bolsheviks enacted programs that ended up overshadowing Jadidism, making the movement unable to progress."

 french_radicalism_alt:0 "Radicalism"
 french_radicalism:0 "European Radicalism"
 french_radicalism_desc:0 "§Y$french_radicalism$§!\nEuropean Radicalism began on the Far-Left of French Politics during the July Monarchy of the mid-19th century. The Radicals held that liberalism can only be realized in a progressive parliamentary republic, a position that was illegal at the time. Thus, they stood in contrast to the \"Opportunists\", conservative liberal republicans who advocated for cooperation with the monarchists to pursue liberal ideals; the Orléanists, who advocated for a constitutional monarchy, and far-right anti-parliamentary Legitimists. After the end of the July Monarchy and establishment of the Second Republic in 1848, they sat in a group called \"The Mountain\", which advocated for Democratic and Utopian Socialist ideals.\n\nEven though parliamentary politics ended upon the establishment of the Second French Empire in 1852, the Radicals survived to see its reinstatement in 1871, where they became a major force. Though they no longer advocate for socialist ideas, they aim to have no enemies to their left, and are thus willing to work with any reformist party that accepts the parliamentary nature of the state.\n\nRadicalism is at its core a Reformist Liberal ideology. Radicals defend liberal democracy as the best way to maximize indivudialism. For example, the 1902 Radical Government implemented secret ballots. In the same vein, Radicals promote small business and agrarian interests. Radicalism is also socially progressive. It is notably anti-clerical, as it established the law that separated church and state. Tax Radicals also established the income tax, the Ministry of Labour, and education reform in the early 20th century. It is important to note that Radicalism is not a united movement. Some Radicals would be better identified as close to Moderate Social Democrats, and some would be better identified as Market Liberals.\n\nThe Radical tradition had since influenced left-liberals in other nations, mainly in Latin countries, but also the UK and Germany, though these trends have sharply declined in favor of Socialist reformist groups."

 sa_radicalism_at:0 "Radicalism"
 sa_radicalism:0 "Latin American Radicalism"
 sa_radicalism_desc:0 "§Y$sa_radicalism$§!\nLatin American Radicalism was influenced by the French Radical Tradition. It began in the mid-to-late 19th century in Brazil, Chile, Colombia, Mexico, and Argentina. Though these movements differ between countries and even parties, they were founded with the same underlying utilitarian principles. They seek to maximize personal freedom, expand the franchise, and fight corruption.\n\nRadicals wish to expand individualism by supporting a market economy that works for the middle and working classes. As right-wing liberal parties already existed in Latin America, Radical parties became left-liberal opposition groups. Thus, they support state intervention in the economy to promote industrialization, sometimes even taking cues from Social Democratic writings. Some radicals also advocate for a welfare system to help lift the population out of poverty. For example, Colombian Radicals advocate for a stronger education system.\n\nLatin American Radicals' core demand is the expansion of secular democracy. Radicals are anti-clerial, meaning that they reject religious interference in politics and support freedom of worship. In the 19th century, they fought for the establishment of Universal Male Suffrage, and continue to fight for the end of corruption in government, particularly in electoral matters. They seek to establish free and fair elections. Some, such as the Chileans, are concerned about over-centralization of the state, and thus support a federal model."

 american_soclib:0 "New Deal Liberalism"
 american_soclib_desc:0 "§Y$american_soclib$§!\nThough the Great Depression has had a devestating effect on the world economy, it was most damaging in the United States. Millions of people became unemployed and entered poverty. Though President Herbert Hoover attempted to deal with the crisis, he was widely criticized for not doing enough to mitigate the effects of the depression, and lost to Franklin Delano Roosevelt in the 1932 General Election.\n\nPresident Roosevelt's flagship policy is his \"New Deal\", which intended to provide \"relief, reform, and recovery\". Roosevelt's early policies resembled Anglo \"New Liberalism\", which advocated for the use of social security mechanisms to help Americans rise out of poverty. New Deal Liberalism advocates for a balanced budget, though accepts the existance of an imbalanced emergency budget. New Dealers also support Banking and Monetary reform to take the US off the Gold Standard and regulate the banks in order to ensure stability. New Deal Liberalism is also characterized by support for Federal public works agencies in order to provide jobs to unemployed Americans. These agencies would oversee the construction of infrastructure, schools, hospitals, etc. New Dealers also support agencies to help farmers by raising prices in order to help them ensure a living. New Deal Liberalism also supports regulation on businesses, such as the establishment of an eight-hour workday, a minimum wage, and the abolition of Child Labour. They also support Trade Unions, so that workers could earn higher wages in order to increase their purchasing power. Furthermore, New Deal Liberalism supports free trade, as Roosevelt strongly campaigned against the Smoot-Hawley Act of 1930, which turned out to be a major disaster.\n\nNew Deal Liberalism is generally culturally liberal, as it stands against Prohibition policies, and many of its supporters advocate for racial equality. However, many other New Dealers have no intention to prohibit Segregation in the American South or to establish racial equality."

 ### Market liberalism
 market_liberal:0 "Market Liberalism"
 market_liberal_desc:0 "§Y$market_liberalism$§!\nThe term \"Market Liberalism\" generally refers to a society with an economic structure characterized by a limited government intervention and a political structure that aims to maximize individual liberty. Market Liberals favor a capitalist economy based on Adam Smith's treatise, \"An Inquiry into the Nature and Causes of the Wealth of Nations\". Essentially, a laissez-faire economy leaves resource allocation to an \"Invisible Hand\", and postulates that when all are left to fend for themselves, they would be encouraged to work harder and innovate, thereby achieving a more prosperous society. As such, Market Liberalism rejects the concept of a welfare state (though Smith himself advocated for it). These \"Classical Liberals\" tend to oppose government regulations that stifle the movement of resources or limit market activity, (such as safety regulations or tariffs) as blockers to optimization.\n\nClassical Liberals also tend to support liberal ideas in the political spheres. Politically, they generally support democratic forms of government, especially when contrasted with the pre-modern aristocracies of Europe. Assuming that nearly everybody intends to act in their own self-interest, limiting the individual's ability to engage in contracts is seen as counter-productive. Though Classical Liberals can and generally are open to progressive social policies (or at least the protection of already-established liberties), these socio-political views are not shared by all classical liberal movements.\n\nThough Classical Liberalism allowed the nations of Western Europe and North America to quickly industrialize, it was quickly determined that society was trending to or had already reached a state of mass inequality unseen in agrarian economies. This concentration of wealth and mass inequality therefore invariably gave rise to a slew of Anti-Capitalist ideologies. As such, classical liberalism has largely given way to \"Social Liberalism\", which accepts the presence of a welfare state within the framework of a market economy."

 usa_classical_liberal:0 "Classical Liberalism"
 usa_classical_liberal_desc:0 "§Y$usa_classical_liberal$§!\nClassical Liberalism in the United States finds its roots in the writings of the Founding Fathers, particularly those of Thomas Jefferson, who was himself influenced by the philosopher John Locke. Due to America's lack of a formally-landed aristocracy, Liberalism became the dominant ideology in the country.\n\nAmerican Classical Liberalism prioritizes maximizing the individual's freedom from state tyranny, as a direct reaction to British Colonial Policy. As such, Classical Liberals reject any policies that are perceived as limiting personal liberty. Classical Liberals support democratic forms of government, favoring constitutionalism and the separation of powers as a means to prevent authoritarianism. While this concept is common to most Liberal movements, American Classical Liberals put great emphasis on \"limited government\", where the federal government only has enough power as is deemed necessary. While many Classical Liberals support progressive social policies (in particular towards the treatment of minorities), this is not a universal trend within the ideology.\n\nThough European Classical Liberals advocate for Laissez-Faire economic policies, in America, Classical Liberalism takes a different stance. American Classical Liberals accept government intervention on the part of the producer, such as subsidies and tariffs, but reject regulations, antitrust laws, and government social programs.\n\nAmerican Classical Liberalism is not without its opponents. From the mid-19th century, as Classical Liberal policies encouraged the rapid development of industry, left-wing movements - including Anarchism, Marxism, Socialism, Progressivism, and Agrarianism - began to oppose Classical Liberal economic policies, especially as the advent of several economic crises provided a challenge to Classical Theory. As the Great Depression struck, the failing policies of Herbert Hoover led to the election of Franklin Delano Roosevelt, who ran on a Social Liberal platform. Despite these setbacks, Classical Liberalism is not fully spent and retains much of its influence on American political and social life."

 ### Liberal Conservatism
 liberal_conservatism:0 "Liberal Conservatism"
 liberal_conservatism_desc:0 "§Y$liberal_conservatism$§!\nLiberal conservatism is a strand of conservative political thought that integrates liberal philosophical thought to create an ideology that contains elements of both. On one hand, Liberal Conservatism upholds the maxim that \"all men are created equal\" and have innate individual responsibilities and freedoms, but on the other hand, it emphasizes the need for a government with sufficient power to ensure stability.\n\nThough the term \"Liberal Conservatism\" can be used to mean many different sets of policies, the basic philosophy of the ideology remains generally consistent from party to party. Liberal conservatives take a Lockean view that a government with limited power (especially in the economic sphere) is the optimal means to maximize human liberty. Nevertheless, they also reject the theory that individuals will necessarily fulfill societal responsibilities, which creates the need for a state with sufficient power to fill the gap.\n\nLiberal conservative philosophy is distinct from national or social conservative movements, which put more emphasis on national identity and traditional values, respectively. Liberal Conservatism is not a formally organized ideology, though it is slowly gaining traction in competition with these older forms of conservative thought. This allows several different platforms and agendas to count as \"liberal conservative\". Liberal conservatives can thus be said to support a mixture of various measures as and when they deem necessary. For example, while liberal conservatives support civil and democratic rights, they can also hold socially conservative positions, such as the integration of religious teachings in policy, the role of national or cultural identities, or an emphasis on a strong police force. Furthermore, while liberal conservatives support a market economy, they may also advocate for a limited welfare state in order to mitigate the worst excesses of classical liberal capitalism."

 national_liberalism:0 "National Liberalism"
 national_liberalism_desc:0 "§Y$national_liberalism$§!\nNational liberalism emerged in the 19th century as a product of the nationalist movement in Europe. Primarily present in Central and Eastern Europe, it emphasizes individual and economic freedom together with the need for national self-determination.\n\nNational liberals see democracy as the optimal form of government to guarantee maximum liberty to its citizens. However, like other liberal conservatives, national liberals provide for state intervention in order to achieve stability, order, and in this case, national liberation. In a few cases, such as in Germany and Austria, some National Liberal parties instead supported conservative governments to keep cultural dominance over a multi-ethnic population. National liberals typically support civil rights, but may hold moderately socially conservative beliefs, such as some emphasis on Christian teachings.\n\nNational liberalism staunchly defends private property and private initiative in order to achieve economic prosperity. As such, they may oppose welfare programs, or at least welfare programs beyond a point they deem excessive. However, national liberalism also defends the state's right to intervene in economic affairs, with policies ranging from protectionism all the way to economic planning, to varying degrees depending on the nation.\n\nThough national liberalism had a large presence in the mid-19th century, once national liberation or unification was achieved, the ideology began a rapid decline. However, in some nations the ideology still clings on, mainly in Germany, Austria, and Romania."

 liberal_nationalism:0 "Liberal Nationalism"
 liberal_nationalism_desc:0 "§Y$liberal_nationalism$§!\nLiberal nationalism is a form of liberalism that emphasizes national identity alongside liberal values of freedom and individualism. Like the similarly-named \"national liberal\" movement, liberal nationalist ideas began to form in the 19th century, though they originate in 18th century American and French liberalism. However, unlike national liberalism, liberal nationalism is not a concrete strand of ideological thought, but rather a coincidentally shared synthesis of ideas.\n\nLike their national liberal cousins, liberal nationalists see representative democracy as the ideal form of government. In the liberal tradition, they value individualism, and thus seek to maximize liberty for their citizens. However, unlike the national liberals, who tend to support cultural dominance, liberal nationalists are more tolerant, arguing that ethnic and cultural minorities do not need to assimilate to be considered part of and identify with the nation.\n\nLiberal nationalists, like other liberals, promote a privately-owned market economy as the structure that best enables people to exercise individual rights. However, like other liberal conservatives, liberal nationalists are not always opposed to limited state intervention and welfare programs in order to introduce measures of social responsibility and to combat the worst excesses of capitalism."

 agrarianism:0 "Agrarianism"
 agrarianism_desc:0 "§Y$agrarianism$§!\n\"Agrarianism\" is a general term for policies that aim to represent small farmers and rural communities against the wealthy or industrialized urban movements. Though agrarian ideas are as old as Classical Greece, modern agrarianism originates in 18th and 19th centuries, starting with the French Physiocrats and Thomas Jefferson, continuing with the Irish agrarian rebellions, and finally crystalizing in the early 20th century.\n\nAs the name suggests, the main philosophical tenet is the primacy of the small farmer in society. As such, agrarian policies revolve around improving the situation of the peasants. Agrarians may support land reform to distribute land to the smallholders at the expense of wealthy landlords and they oftentimes support agricultural protectionism to enable domestic agriculture to compete without cheap foreign agriculture that drive prices down. Though they generally oppose an overly strong state, Agrarians may support state intervention where necessary to guarantee that the farmers are encouraged to produce, often using price controls. This aims to ensure that farmers will not stop producing because prices are too low, causing shortages and poverty.\n\nAgrarian sociopolitical stances may vary, and those on the right of the political spectrum will typically adhere some form of social conservatism. Though they may encourage individualism, agrarian parties are likely to encourage more egalitarian communal forms of society. In this vein, they generally advocate for decentralization to allow rural communities to better see to their own affairs."

 liberal_agrarianism:0 "Agrarianism"
 liberal_agrarianism_desc:0 "\"Agrarianism\" is a general term for policies that aim to represent small farmers and rural communities against the wealthy or industrialized urban movements. Though agrarian ideas are as old as Classical Greece, modern agrarianism originates in 18th and 19th centuries, starting with the French Physiocrats and Thomas Jefferson, continuing with the Irish agrarian rebellions, and finally crystalizing in the early 20th century.\n\nAs the name suggests, the main philosophical tenet is the primacy of the small farmer in society. As such, agrarian policies revolve around improving the situation of the peasants. Agrarians may support land reform to distribute land to the smallholders at the expense of wealthy landlords and they oftentimes support agricultural protectionism to enable domestic agriculture to compete without cheap foreign agriculture that drive prices down. Though they generally oppose an overly strong state, Agrarians may support state intervention where necessary to guarantee that the farmers are encouraged to produce, often using price controls. This aims to ensure that farmers will not stop producing because prices are too low, causing shortages and poverty.\n\nAgrarian sociopolitical stances may vary, and those on the right of the political spectrum will typically adhere some form of social conservatism. Though they may encourage individualism, agrarian parties are likely to encourage more egalitarian communal forms of society. In this vein, they generally advocate for decentralization to allow rural communities to better see to their own affairs."

 lerrouxism:0 "Lerrouxism"
 lerrouxism_desc:0 "§Y$lerrouxism$§!\nAlejandro Lerroux Garcia was born in March 1864 in Córdoba, Spain, and by the 1880s was a staunch follower of the Spanish radical republicans. A journalist, he became known for his populist style of writing. In 1901, he was elected as a deputy to the Cortes Generales for Barcelona where his influence continued to grow, alongside his republican views. In 1931, he participated in the founding of the Second Spanish Republic, and was Minister of State until the transitional coalition collapsed. Opposed to the centre-left government of Manuel Azaña, he eventually entered into an agreement with the conservative CEDA.\n\nThe political positions associated with Lerroux have become collectively known as \"Lerrouxismo\". Lerrouxism is of a democratic populist character, but it is still moderately conservative and strongly advocates for liberal democracy as the optimal form of government.\n\nAt the end of the day, Lerroux is more of an opportunist than an ideologue, though he maintains a core ideology formed around anti-clericalism and republicanism. At present his party is the main centrist liberal party in Spain, in direct competition with the socialists and left republicans."

 american_moderate_conservatism:0 "Republican Conservatism"
 american_moderate_conservatism_desc:0 "§Y$american_moderate_conservatism$§!\nModerate conservatism in the United States has found its home in the Republican Party, ideologically led by \"Mr. Republican\" Robert A. Taft. The moderate conservatives are strongly anti-union, isolationist, and emphatically oppose Franklin Delano Roosevelt's New Deal. They hold the values of Thomas Jefferson as the basis of conservatism, arguing for limited government with free markets.\n\nAmerican conservatives believe the New Deal is inefficient and prefer to let the free markets try and correct for the Great Depression. However, they are not afraid to suggest limited government intervention where absolutely necessary. As such, though they abhor deficit spending, union activity, and subsidies, these conservatives are willing to accept small welfare programs. Some also believe in the need to cut government programs altogether, in order to prevent the government from interfering with a free market. Similarly, such conservatives reject the idea of foreign aid, as it is a form of government intervention. They are against heavy taxation, support the Gold Standard, and wish to protect states' rights.\n\nModerate conservatives are also generally socially conservative, as they reject feminism. While they support \"states' rights\" and limited government, they do not generally weigh in on the Civil Rights debate and Jim Crow laws. These ideas of limited intervention carry over to the economic and geopolitical sphere, as they reject the idea of government participation in the economy. They also reject American Interventionism in foreign conflicts, believing neutrality to be the best way of ensuring national security. Nevertheless, they are strongly anti-communist and anti-fascist, believing that the government should take action against these groups domestically, though not internationally."

 christian_democracy:0 "Christian Democracy"
 christian_democracy_desc:0 "§Y$christian_democracy$§!\nThough Christian democracy can trace its roots back to Thomas Aquinas, Christian democracy as a political movement first came about as a reaction to liberalism. Political Catholicism and Protestantism began to crystalize in the late 19th century as devout Christians formed political parties to oppose secularization and secure their denominational interests. The Catholic Church was particularly interested in these movements, as they saw liberalism as a secular ideology that promoted materialism and selfish self-indulgence. The Catholic Church defined its position with several papal encyclicals, starting with the Rerum novarum. As a reaction to both liberalism and socialism, political Catholicism adopted corporatist positions that sought to provide for workers' rights and social harmony between classes. Many political Protestant and Eastern Orthodox groups followed suit.\n\nChristian democrat economics are meant to transcend the left-right divide and provide an alternative solution. Christian democrats originally supported a return of a guild-based economy, but have ultimately abandoned this plan in favor of a reform of capitalism. Christian democrats support substantial social welfare programs and union rights in order to protect humans' \"God-given dignity\". Christian democracy stresses cooperation and strong government intervention in the economy as opposed to the laissez-faire attitudes of the Anglo-American model.\n\nChristian democrats are generally strongly socially conservative, with family and moral values being at the forefront of their policy. In this vein, they treat each sector of society as its own family, arguing that one should not be able to interfere with another. They oppose secularization and individualism, but are supportive of religious freedom. They strongly reject Marxian Socialism and other far-left ideologies, as well as fascism and far-right forms of government."

 centrism:0 "Centrism"
 centrism_desc:0 "§Y$centrism$§!\nCentrism is a term whose meaning can vary considerably in different countries. Centrist parties and movements position themselves as a moderate alternative to more defined leftist or rightist movements. In general, centrists try to establish a balance between social equality and hierarchy and strongly oppose radical politics.\n\nCentrists are democratic, and argue for the protection or establishment of parliamentary forms of government, alongside supporting strong protections for civil and political rights. However, centrist groups may have differing opinions on cultural rights. For example, a centrist party might support left-wing economics and right-wing cultural values, or vice versa.\n\nEconomically, centrists support a market economy, though generally with noticeable welfare measures, a degree of some government involvement, and at least some support for labour unions. As such, centrists oppose a transition to or a forceful imposition of socialist economic structures. Centrism tries to attract a big tent movement of voters opposed to what they see as radical shifts in societal or economic values, though they generally accept or tolerate reform through the democratic process."

 ### Social Conservatism
 soccon_agrarianism:0 "Agrarianism"
 soccon_agrarianism_desc:0 "§Y$soccon_agrarianism$§!\n\"Agrarianism\" is a general term for policies that aim to represent small farmers and rural communities against the wealthy or industrialized urban movements. Though agrarian ideas are as old as Classical Greece, modern agrarianism originates in 18th and 19th centuries, starting with the French Physiocrats and Thomas Jefferson, continuing with the Irish agrarian rebellions, and finally crystalizing in the early 20th century.\n\nAs the name suggests, the main philosophical tenet is the primacy of the small farmer in society. As such, agrarian policies revolve around improving the situation of the peasants. Agrarians may support land reform to distribute land to the smallholders at the expense of wealthy landlords and they oftentimes support agricultural protectionism to enable domestic agriculture to compete without cheap foreign agriculture that drive prices down. Though they generally oppose an overly strong state, Agrarians may support state intervention where necessary to guarantee that the farmers are encouraged to produce, often using price controls. This aims to ensure that farmers will not stop producing because prices are too low, causing shortages and poverty.\n\nAgrarian sociopolitical stances may vary, and those on the right of the political spectrum will typically adhere some form of social conservatism. Though they may encourage individualism, agrarian parties are likely to encourage more egalitarian communal forms of society. In this vein, they generally advocate for decentralization to allow rural communities to better see to their own affairs."

 christian_democracy_soccon:0 "Christian Democracy"
 christian_democracy_soccon_desc:0 "§Y$christian_democracy_soccon$§!\nThough Christian democracy can trace its roots back to Thomas Aquinas, Christian democracy as a political movement first came about as a reaction to liberalism. Political Catholicism and Protestantism began to crystalize in the late 19th century as devout Christians formed political parties to oppose secularization and secure their denominational interests. The Catholic Church was particularly interested in these movements, as they saw liberalism as a secular ideology that promoted materialism and selfish self-indulgence. The Catholic Church defined its position with several papal encyclicals, starting with the Rerum novarum. As a reaction to both liberalism and socialism, political Catholicism adopted corporatist positions that sought to provide for workers' rights and social harmony between classes. Many political Protestant and Eastern Orthodox groups followed suit.\n\nChristian democrat economics are meant to transcend the left-right divide and provide an alternative solution. Christian democrats originally supported a return of a guild-based economy, but have ultimately abandoned this plan in favor of a reform of capitalism. Christian democrats support substantial social welfare programs and union rights in order to protect humans' \"God-given dignity\". Christian democracy stresses cooperation and strong government intervention in the economy as opposed to the laissez-faire attitudes of the Anglo-American model.\n\nChristian democrats are generally strongly socially conservative, with family and moral values being at the forefront of their policy. In this vein, they treat each sector of society as its own family, arguing that one should not be able to interfere with another. They oppose secularization and individualism, but are supportive of religious freedom. They strongly reject Marxian Socialism and other far-left ideologies, as well as fascism and far-right forms of government."

 conservatism:0 "Social Conservatism"
 conservatism_desc:0 "§Y$conservatism$§!\nThough conservatism has existed for several centuries, what we now call social conservatism first became a distinct ideology in the mid-to-late 19th century. Social conservatism rejects the ideas of social progress, instead advocating for policies based on moralistic philosophy.\n\nUnlike their more autocratic counterparts, social conservatives generally support parliamentary democracy. However, they normally reject policies based on secularism, liberalism, and/or socialism, seeking to preserve a society grounded in religion and traditional moral values. In that vein, they might reject women's suffrage or the separation of church and state. Social conservatives see the church as an integral part of society, and thus a key stakeholder when determining policy, leading many to turn to socially conservative parties in opposition to perceived cultural shifts towards secularization or atheism. Social conservatism stands strongly opposed to socialism, which they view as an atheist and excessively egalitarian ideology that stands in opposition to their own beliefs. As such, social conservative movements have diverging views on the integration and treatment of ethnic minorities within the state.\n\nLikewise, social conservatism does not have a uniform economic position. Some conservatives might lean towards a more liberal position, arguing that state involvement in the economy should not occur more than is necessary. Others may lean towards a paternalistic view, arguing that it is the state's moral duty to correct for market failures, though all social conservatives argue for the defense of private property."

 social_conservatism:0 "Social Conservatism"
 social_conservatism_desc:0 "§Y$social_conservatism$§!\nThough conservatism has existed for several centuries, what we now call social conservatism first became a distinct ideology in the mid-to-late 19th century. Social conservatism rejects the ideas of social progress, instead advocating for policies based on moralistic philosophy.\n\nUnlike their more autocratic counterparts, social conservatives generally support parliamentary democracy. However, they normally reject policies based on secularism, liberalism, and/or socialism, seeking to preserve a society grounded in religion and traditional moral values. In that vein, they might reject women's suffrage or the separation of church and state. Social conservatives see the church as an integral part of society, and thus a key stakeholder when determining policy, leading many to turn to socially conservative parties in opposition to perceived cultural shifts towards secularization or atheism. Social conservatism stands strongly opposed to socialism, which they view as an atheist and excessively egalitarian ideology that stands in opposition to their own beliefs. As such, social conservative movements have diverging views on the integration and treatment of ethnic minorities within the state.\n\nLikewise, social conservatism does not have a uniform economic position. Some conservatives might lean towards a more liberal position, arguing that state involvement in the economy should not occur more than is necessary. Others may lean towards a paternalistic view, arguing that it is the state's moral duty to correct for market failures, though all social conservatives argue for the defense of private property."

 british_conservatism:0 "Toryism"
 british_conservatism_desc:0 "§Y$british_conservatism$§!\nConservative politics in the United Kingdom has a very long history. The conservatives in the pre-modern period were known as Tories. They primarily represented aristocratic rural landowners, and supported monarchism, clericalism, familial stability, and private property. Generally concerned with the preservation of societal values, they were wholly opposed to the industrial revolution until Robert Peel was able to bring the industrialists and landowners together in 1846.\n\nBy 1850, Conservatives in the UK had begun to fight for the expansion of democracy, and eventually, social reform. This strand of British conservatism, known as \"One-Nation Conservatism,\" was formulated by Prime Minister Benjamin Disraeli in an attempt to provide for a harmony between the rich and the poor. His Corporatist theory treated the rich and the poor as separate \"nations\", which One-Nation Conservatism attempts to bring into cooperation against the middle class.\n\nBritish Conservatism (or \"Toryism\" as it is colloquially known) also has a more liberal current, which has been dominant in the party since 1918. Though they are fighting for the expansion of suffrage and reform, welfare projects are considered to be secondary to the perceived need for austerity after the Great War. This current is also more aggressively protectionist, and the issue of tariffs continues to cause contention among Parliamentarians.\n\nParallel to these currents stand the High Tories, a now-fringe strand that stresses traditionalism and aristocratic values. They support Tory Corporatism as outlined by Disraeli, but with additional emphasis placed on hierarchy rooted in agricultural enterprise.\n\nBritish conservatism does not have a singular position on social progress. Though opposed to sweeping cultural changes, some conservatives support the cautious expansion of women's and minority rights. While conservatives seek to protect the workers from poverty and poor working conditions, they are strongly anti-union, arguing that a \"property-owning democracy\" must protect private property from workers' democracy."

 national_conservatism:0 "National Conservatism"
 national_conservatism_desc:0 "§Y$national_conservatism$§!\nNational conservatism is a branch of social conservatism that emphasizes national identity and sovereignty. Though it is a distinct synthesis of conservatism and nationalism, national conservatism can also be found as a component of other ideologies. Although nationally-minded conservatism can be found as far back as the 18th century, what is considered to be \"national conservative\" in the 1930s mostly pertains to political parties in democratic or semi-democratic nations. Like other forms of social conservatism, national conservatism finds its support base in rural or more traditionally conservative areas rather than urban population centers.\n\nThe core of national conservatism are the ideas of a national identity and by extension, national sovereignty. As a concept, \"national identity\", the sense of belonging to a nation, might come into conflict with \"ethnic identity\", the sense of belonging to an ethnicity. This might especially be called to attention in multi-ethnic polities. In such cases, national conservative parties may either shift to ethnically-based policies and rhetoric or promote the \"national identity\" as a separate concept to \"ethnic identity\", where the former is essentially made up of groups of the latter. That being said, national conservatives usually oppose immigration, as they claim immigrants might bring differing national and cultural identities with them. Consequently, national conservatism is also protective of cultural traditions, and base their social policies on \"family values\".\n\nNational conservatives do not have a uniform economic position. While they can support a free market, they can also support a welfare state or even a planned approach to the markets. Economic policy is not one of the core issues of national conservatism, though in an effort to protect \"national sovereignty\", national conservatives generally support protectionism, as they wish to limit the influence of foreign goods on the nation."

 american_social_conservatism:0 "Democratic Conservatism"
 american_social_conservatism_desc:0 "§YDemocratic Conservatism§!\nConservatism in the United States is multifaceted, but several trends can be observed within it. Hardline mainstream conservatism can usually be found in the \"Solid South\", where the Southern Democrats hold almost complete political control. They are the successors of Jacksonian Democrats, defenders of slavery, and the copperheads. In short, the Southern Democrats represent the interests of conservative landowners in the American South rather than the pro-worker progressivism of northern Democrats.\n\nIn regards to the economy, hardline conservatives are mildly supportive of President Roosevelt's New Deal. Although they think it may have gone too far in some places, they recognize that state intervention in the economy is necessary to provide relief for their constituents and voter base. However, they still support balanced budgets and are strongly anti-union, sometimes supporting the use of violence against strikers. They are generally ambivalent on tariffs, though they often support tariffs on produce, textiles, etc grown in their constituency.\n\nPolitically, the hardliners are strongly against the idea of a strong executive branch and federal government. They instead support the primacy of state governments and the legislative branch. As might be expected from their support base, they strongly support the right of individual states to practice racial segregation and oppose any attempts to abolish or limit Jim Crow laws at any level. Externally, they support an interventionist foreign policy, arguing that America must fight fascism and communism abroad."

 ### Authoritarian
 sanation:0 "Sanacja"
 sanation_desc:0 "§Y$sanation$§!\nSanacja, (from the Latin word \"sanatio\", healing) was the colloquial name for the ruling clique in Poland since the 1926 May Coup. The name referred to an intended \"moral sanitation\", the healing of Polish public life in the reborn Republic of Poland.\n\nThis movement started with Polish statesman Józef Piłsudski, First Marshal of Poland and one of modern Poland’s founders, and grew due to ordinary Poles’ frustration with Polish parliamentary democracy. The Polish constitution was modelled after that of the Third French Republic and gave considerable powers to the Sejm, while limiting those of the president. The Sejm's primacy, in tandem with inter-party conflicts, led to administrative paralysis. Falling governments, rising unemployment, and the international isolation of Poland created a need in society to find a \"man of providence\" who would put an end to the internal chaos and bring order to Poland. Józef Piłsudski decided to become such a person when he overthrew the democratically elected government and president in the May Coup of 1926.\n\n\"Moral sanation\" manifested in the struggle against \"Sejmocracy\" and \"partisanship\" and the desire to reform liberal democracy into a new, more centralised system of ruling, while distancing itself from fascism and communism. This movement gained support from people across the ideological spectrum, from socialists and anarchists, to liberals and conservatives, and nationalists. The main staple of this movement was the person of Piłsudski himself, being regarded as the man who could save Poland from the dangers of the 20th century.\n\n The movement drew inspiration from romantic and positivist philosophy, socialism and conservatism, and Poland's struggle for independence in the 19th century. A revived and independent Polish state was to allow for the common good of all citizens, regardless of gender, religion and nationality. In addition, the new Poland was to be a continuation of the Polish-Lithuanian Commonwealth, which despite its internal difficulties was able to be an important political player in Central and Eastern Europe."

 longism:0 "Longism"
 longism_desc:0 "§Y$longism$§!\nHuey Pierce Long is an American politician who served as Governor of Louisiana from 1928 to 1932, and in the United State Senate thereafter, as a member of the Democratic Party. Long's personal ideology, encapsulated in his slogan of \"Every Man a King,\" is a semi-authoritarian populist program that envisions welfare programs and public works on a scale as yet unheard of in the majority of the United States, especially in the Deep South. Long broke with both President Roosevelt's New Dealers and the conservative Southern Democrats to propose his own agricultural-populist program, \"Share Our Wealth\".\n\nThe Share Our Wealth program is based on securing the welfare of the \"little man\", i.e the poor farmer. Long believes that the Great Depression can be corrected by fixing the inequality between the rich and the poor. The program includes a cap on net worth pegged to 300 times the mean family fortune, an extra tax on wealth over $1 Million, a cap on personal income at $1 Million, and a cap on inheritances at $5.1 Million. It also features a \"homestead allowance,\" essentially a yearly stipend for each family at a minimum of one-third of the average household income. \"Share Our Wealth\" would also provide for pensions for the elderly and veterans, as well as healthcare for veterans. In addition, all children would have free public education, and equal opportunities for free university and/or vocational education. Finally, the state would intervene to purchase surplus produce and provide public works programs to boost employment.\n\nLong's political style is known to be especially authoritarian. Within Louisiana, pro and anti-Long factionalism is as important as the Democratic/Republican divide, though anti-Long candidates never really attacked Long himself. Long established a political machine, filling important offices with his supporters and making state employees donate to his campaign treasury, among other corrupt practices. In addition, Long tends to strongarm his opponents into accepting his policies and allows his bodyguards to assault reporters, going as far as to establish his own newspaper.\n\nThough he has been compared to Lenin, Hitler, and Mussolini, Long rejects comparisons with both far-left and far-right dictators, though he does project a stance of mild anti-communism and associates with numerous far-right figures. Despite this, Long positions himself as strongly in favor of racial equality, and strongly opposes the Ku Klux Klan. Despite his social policies achieving a positive effect on the economic situation of African-Americans, he made no effort to overturn Jim Crow laws or overturn legislation that effectively disenfranchised Black Americans in Louisiana. Thus, his views on race remains unclear."

 vlasovism:0 "Vlasovism"
 vlasovism_desc:0 "§Y$vlasovism$§!\nIt is difficult to ascertain whether or not what is known as \"Vlasovism\" is a genuine ideology or just rhetoric. General Andrei Vlasov's official ideology comes from a fourteen point manifesto that serves as the program of the \"Committee for the Liberation of the Peoples of Russia\". While his supporters proclaim him to be the \"Champion of the Nation\", his detractors see him as a Bonapartist, Opportunist, Populist, or some combination thereof. Critics are happy to bring up Vlasov's past and complicity in sentencing innocent people to death, which his supporters argue was the result of coercion by the Bolsheviks. As a result, Vlasov only really has supporters in his own camp, as liberals think he's too authoritarian while authoritarians think he's too compromising. Marxists and social democrats denounce him as a fascist, and fascists denounce him as a social democrat and a marxist.\n\nOne thing that is agreed upon is Vlasov's vaguely leftist economic stance. Vlasov wishes to abolish the Bolshevik system of state socialism, but also rejects laissez-faire economics - which the Vlasovists view as exploitative - in favor of a mixed system. According to him, the state's interests should be to raise the welfare of its citizens and to maintain control of key industries. In the more immediate sense, Vlasovism rejects and wishes to abolish collective and state farms, alongside restoring widespread private property rights. It also envisions strong welfare programs including medicine, education, and pensions for the unemployed, elderly, and disabled veterans.\n\nIn terms of social values, Vlasov maintains a populist and vaguely socially conservative position. Though the Vlasovists proclaim the need for equality for minorities and women, they also proclaim the need to strengthen the family unit, as Vlasovism seeks to appeal to both those who were a part of and apart from the Soviet system. Vlasovists support total amnesty for all members of the Communist Party, except for those who they proclaim to be the \"highest criminals\" (Stalin and his inner circle). At the same time, they support the end of forced labour and mass deportations.\n\nIn terms of Russia's political future, Vlasovism nominally supports democracy, but Vlasov refuses to commit himself either way. Though the Vlasovist program wishes to introduce personal freedoms not present under the Bolsheviks, observers are quick to point out it makes no mention of democracy itself."

 kemalism:0 "Kemalism"
 kemalism_desc:0 "§YKemalism§!\nKemalism is the ideology of the first President of Turkey, Mustafa Kemal Atatürk. Atatürk came to power after the collapse of the Ottoman Empire, declaring Turkey to be a republic in 1923. Since then, Atatürk has undertaken a sweeping reform program meant to transform Turkey from a backwards religious monarchy to a modern secular republic. Kemalism is meant to be socially revolutionary, economically statist, and politically nationalist. Though Kemalism supports a multi-party system, in Turkey, opposition parties are non-existent, due to the authoritarian measures used to combat traditionalist reaction, particularly among the clergy.\n\nKemalism is based on six fundamental \"ilke\" (pillars). The principle of Republicanism outlines Turkey as a parliamentary republic, where the parliament is elected by the people, the parliament elects the president, and the president appoints the prime minister. The state has checks and balances, along with separation of powers to avoid a return to the monarchist system. The state remains unitary, where the central government treats the state as a single unit rather than devolving duties onto regional authorities. Kemalism is also populist, which is defined as the intent to transfer power from the despot (the Emperor) to the people, while maintaining national unity. Kemalism rejects the socialist idea of class struggle, focusing on a nationalist set of policies, where said nationalism is defined as the treatment of the \"Turkish Nation\" as a Turkish polity built on patriotism, personal responsibility, and human rights. However, Kemalism is not ethnically nationalist, as it holds that all citizens are members of the nation regardless of their creed or actual ethnicity.\n\nA fourth principle of Kemalism is political secularism as though the Kemalists are not opposed to religion itself, they see religion as something to be controlled, lest it interfere with politics. To that end, Turkey has abolished Islamic law in favor of codes based on Swiss, Italian, and German models. Political Islam (Islamism) was seen as one of the major contributing causes to the collapse of the Ottoman Empire, and was thus a major enemy of the Republic. This reformism carries over to other aspects of life. Kemalism supports strong secular education, including Turkey's adoption of the Latin alphabet in 1929. The need for social reform is seen as an irreversible and urgent revolutionary cause. Said revolution aims to adapt western institutions to Turkish culture and circumstances. Finally, Kemalism supports economic statism, as it sees the need for the state to direct industrialization and modernization alongside private capital, though the state is usually stronger than the private sector in all aspects."

 spr_ceda:0 "Catholic Accidentalism"
 spr_ceda_desc:0 "§Y$spr_ceda$§!\nAt the head of the Spanish Right is the CEDA, the Confederación Española de Derechas Autónomas (Spanish Confederation of the Autonomous Right). The CEDA is a Catholic national conservative party formed as the successor to the Popular Action group. Led by \"El Jefe\" José María Gil-Robles, the party serves as a reaction to Spanish republicanism and communism.\n\nThough CEDA is not a fascist party, it has adopted fascist stylings and rhetoric to stimulate public support. Gil-Robles is referred to as \"the Chief\" by supporters, the party holds fascist-style rallies, and its literature focuses on anti-socialism, anti-republicanism, and totalitarianism. It can be said that CEDA stands for whatever the Second Spanish Republic is not. At its core, CEDA is a Catholic fundamentalist party meant to serve as an umbrella organization of autonomous rightist groups. As such, CEDA aims to build an alliance between themselves, the Carlists, the Alfonsines, and other anti-republican and anti-socialist parties. CEDA wishes to see secular parliamentarism ended in favor of authoritarian catholic corporatism. Unlike other major right-wing movements, CEDA also rejects the restoration of the monarchy, as they see the monarchism debate as irrelevant, arguing that the catholic corporative nature of the state is the main goal, regardless of who is the head of state.\n\nCEDA believed that the Cortes Generales should be either destroyed and replaced or subordinated to a strong body made up of corporate groups, as advocated by the Quadragesimo Anno, or at least the CEDA's interpretation of it. This Papal encyclical proclaims the necessity of the existance of private property but also capital's subordination to the needs of the many in order to stave off revolution. This differs from the Fascist conception of corparatism, which sees more in common with national syndicalism and sorelianism.\n\nMuch of CEDA's rhetoric focuses on anti-communism. CEDA presents their case by claiming that the voters only real choices at the ballot box were between Christian Redeption or Communist Revolution. They claim that all good Catholics vote for the right, and those that do not are affiliated with the \"immoral\" and \"anarchistic\" left. Despite its recent founding, CEDA has quickly found a substantial following among the Spanish right. It has already overtaken the republican right and center in the ever-polarized Spanish political sphere."

 colonial:0 "Colonial Government"
 colonial_desc:0 "§YColonial Government§!\nThis government represents the interests of a colonial power. This means that the government's main goal is to secure control over the colony, prevent independence movements from growing, and making sure the colony is economically profitable. Nevertheless, the actual policies of a colonial government can widely differ, based on the policies of the \"mother\" country and the governor themselves, but a general set of policies can be ascertained.\n\nColonial governments tend to reject pushes for local self-representation in exchange for either direct or indirect rule by the governor or traditional elites. In some models, the local bureaucracy is directly responsible for managing local affairs, and in others, local affairs are managed by traditional monarchs under a treaty of protection. The latter state of affairs is known as a \"protectorate\". In this vein, colonial governments will seek to outlaw or minimize the influence of trade unions, political parties, and intellectual movements. Thus, schools are largely ignored (other than the teaching of the \"mother\" tongue), meaning that the few intellectuals that come from the colonies are usually educated in the \"mother\" country. It is also important to note that if things get heated, a colonial government is usually not above using violence to restore order. Any reforms are usually paltry concessions given to stave off revolt.\n\nIn terms of economics, the main goal of the colonial government is to ensure that raw materials are grown/extracted and shipped to the \"mother\" country to be refined and used in manufacturing. To that end, the government will sponsor the construction of railways, roads, waterways, ports, and other forms of infrastructure, while largely ignoring industry. As might be expected, working conditions in many colonies are little better than slavery, with harsh working conditions and meager pay. In the few colonies where there are industries to unionize in, colonial governments will usually attempt to stifle such attempts. As such, socialist movements have become common in colonial areas, often synthesizing it with nationalism."

 military_alt:0 "Military Dictatorship"
 military:0 "Military Dictatorship"
 military_desc:0 "§YMilitary Dictatorship§!\nThis government is a dictatorship controlled by the military. In these cases, the military has usually seized power illegally, generally through a coup d'etat. In other cases, the military is invited or otherwise made involved in politics by the civilian government due to constitutional crises. Military governments are authoritarian regimes that seek to either eliminate or control opposition to their regime, promote nationalism, and typically wish to subordinate economic activity to what is perceived to be national or military interests. The military generally becomes involved in this way due to political and social upheaval that threaten conservative institutions, such as a socialist revolution.\n\nMilitary dictatorships reject democratic structures and while some might wish to do away with the democratic process entirely, many maintain sham elections to provide a facade of legitimacy. The nation is instead governed by the military bureaucracy, which either replaces the civilian bureaucracy in its entirety or co-opts it into their government. Military dictatorships usually prohibit opposition and jail known dissidents. Alternatively, they can keep these dissidents around in a controlled manner (they will never win elections and will have little influence on policy) to provide for a show of legitimacy. In these cases, the military might also form its own political party. The leader of the dictatorship, as might be expected, is generally the highest-ranking officer, and if not, will usually become the highest ranking.\n\nMilitary dictatorships are generally socially conservative, as cultural liberalization could allow for anti-dictatorship sentiment to take hold. However, there are cases (such as Poland between 1918 and 1922) where the dictatorship decides to shrug off outdated institutions and modernize the country.\n\nEconomically, military dictatorships have no set policy. On one hand, they could be economically statist in order to direct the economy towards what they decide is the national interest. On the other hand, they could promote free trade in an attempt to let the free market develop the country."

 oligarchism:0 "Oligarchism"
 oligarchism_desc:0 "§YOligarchism§!\nThis government is an oligarchy, meaning power is concentrated in the hands of a few \"oligarchs\". Though the concept stretches back to Ancient Greece (where it was defined by Aristotle to refer to rule by the wealthy, that which we now call Plutocracy), such structures still exist today.\n\nModern oligarchies are authoritarian, as political restrictions are seen as necessary to maintain the oligarchy's power. As such, the oligarchy might either eschew democracy altogether or establish a \"guided\" system, where the oligarchy's party of power will win elections by a solid margin. The oligarchy will thus curtail press rights, freedoms of speech and assembly, usually banning threatening movements and jailing relevant members of the opposition. An oligarchy can also oversee a system of minority rule, especially in colonial areas.\n\nOligarchic states can have a variety of economic structures. Generally, they will involve some form of state involvement in order to establish further control over the country, but they can also adopt a more laissez-faire attitude. These states can also oversee corrupt practices that funnel wealth to the top, making them more accurately fit Aristotle's vision of plutocracy.\n\nSocially, these states tend to be more conservative, as social progress tends to invite political activism. Thus, while they might try to modernize society to get away from reactionary pre-modern values, they will not try to introduce radical progress beyond what is generally considered to be the European norm."

 big_tent:0 "Catch-All Politics"
 big_tent_desc:0 "§Y$big_tent$§!\nBig tent parties encourage a broad collection of viewpoints among its members rather than specific ideological tenets. Though such catch-all parties and alliances are found on all sides of the political spectrum, in this context, conservative or vaguely apolitical forces are being united under a single generally right-wing banner. They might arise in reaction to perceived or actual surges in communist, socialist, liberal, fascist, or otherwise anti-conservative activity. Ultimately, it is the fear of revolution or progress that keeps such alliances together, and they are generally liable to collapse.\n\nBig tent conservative parties or alliances generally do not have specific political goals, preferring to implement measures meant to stave off rising influences of anti-conservative political forces. End goals within the coalition can vary wildly, and left to their own devices (without the fear of revolution keeping them together), the alliance will be happy to collapse into competing factions. The party might have common social goals of adhering to \"family values\" or establishing anti-secular, or perhaps nationalist policy. However, their economic policies can similarly vary, as free-market and statist ideas can be represented within the coalition."

 authoritarian:0 "Authoritarianism"
 authoritarian_desc:0 "§YAuthoritarianism§!\nAuthoritarian regimes generally reject liberal or social democratic institutions and values in exchange for an autocratic style of government. Authoritarian governments, parties, and movements generally get their support from those fearing liberal, secular, or socialist movements. Authoritarian states generally see a high level of government involvement in society, with the government typically using its power for self-perpetuation.\n\nAuthoritarian regimes reject the idea of an open democracy. Though they may hold elections, the government may enact restrictions to ensure that their party wins, or the elections might be a complete sham. Authoritarian states use government resources to control or eliminate opposition, ranging from state decrees to the arrest of prisoners, or even assassinations. These states might also build up a personality cult around its leader to try and establish their legitimacy.\n\nIn the economic field, authoritarian governments can have different approaches. On one hand, an authoritarian regime may use its power to build up the country's economy directly by encouraging development in key industries or establishing state-owned corporations. Alternatively, they might take a free-market approach, and allow for the development of larger conglomerates (either foreign or domestic) to develop the extraction or harvesting of the country's resources. This stance varies from regime to regime, and some may use a combination of the two.\n\nIn terms of social progress, authoritarian regimes are generally socially conservative as advances in cultural rights are generally associated with liberalism, socialism, and sometimes secularism, and thus are implied to foster political opposition. However, these states might also advance cultural rights, such as the improvement of women's rights or the establishment of secularism or modern education in order to modernize (but not liberalize) society to a point approaching a Western European standard."

 theocratic:0 "Theocracy"
 theocratic_desc:0 "§YTheocracy§!\nA theocratic government is one ruled by clerical leadership, even if the clergy itself will usually claim that the state is under divine guidance and that the government is only a representative of said divine being(s). Though the nature of a theocracy can vary wildly based on the state religion, they are generally in the conservative camp.\n\nTheocracies are generally anti-democratic as they feel that democracy invites liberalism and socialism, and therefore secular and atheistic beliefs. A theocracy might resort to authoritarian measures to deal with any opposition, but their lack of a modern political structure makes it difficult to ascertain general theocratic policy on this issue. It must also be made clear that there is a distinction from a theocracy, which is ruled by clerics, and a state based on religious teaching. In the latter case, the nation might base its constitution or political policies off of religious teachings, but the ruling class is separate from the clergy. Theocracies are also distinct from a monarchy where the monarch is the head of the religion or deified. Such governments are uncommon in the modern period, and the few which remain generally treat this arrangement as a formality rather than the basis of the state.\n\nTheocracies generally follow an economic doctrine inferred from their religious texts. Though this too can vary with the state religion, it generally involves some market economy, but can also involve significant state participation to ensure workers' rights, welfare, etc.\n\nTheocracies are also socially conservative and progressive policies are generally seen as opening the door for anti-clerical thought and behaviour, and are thus not usually tolerated."

 est_auth_democrat_alt:0 "Authoritarian Democracy"
 est_auth_democrat:0 "Estonian Authoritarian Democracy"
 est_auth_democrat_desc:0 "§Y$est_auth_democrat$§!\nEstonia was made into an Authoritarian state in 1934 after the self-coup by Estonian prime minister Konstantin Päts. Beforehand, Estonia had been a democracy led by conservative forces, but ruling elites feared a potential revolution by the far-right Vaps movement, which aimed to replace Estonian democracy with a nationalist presidential dictatorship. In response, Päts and his supporters used the Constitution of 1933 to establish an alternative dictatorship in its place, with the justification that the people could be trusted not to fall for Vaps propaganda and that a democracy would thus not be in the public interest.\n\nThe Päts dictatorship is intended by some to be a temporary measure, and is consequently not terribly harsh. Some major opposition members have been jailed, but the non-Vaps opposition is otherwise unharmed, though disorganized. Päts himself believes in corporate statism, which is based on, though distinct from, the fascist conception of the term. Päts supports the replacement of parliamentary democracy with chambers to represent people by corporate groups, in this case, by vocation, especially as he had already founded two before the establishment of the dictatorship.\n\nThe dictatorship supports the statist expansion of the economy and the Estonianization of names, it also supports the reigning in of the power of the courts and the primacy of the executive branch. The core of the dictatorship is Päts himself. Though he does not have the kind of omnipresent personality cult that surrounds figures such as Mussolini or Stalin, the dictatorship generally revolves around him. This period of Estonian history was borne by his hand, and it shall die by it as well..."

 maximato:0 "Maximato"
 maximato_desc:0 "§YMaximato§!\nThe term \"Maximato\" refers to the rule of Plutarco Elías Calles, called the \"Jefe Máximo\" (Maximum Leader) of Mexico. The Maximato arose due to Calles' personal quest for power. As part of the Mexican revolution, re-election was prohibited by the new constitution to avoid another lifelong presidency like that of Porfirio Díaz, who ruled the country for 35 years in a period called the \"Porfiriato\". Calles, president from 1924 to 1928, had managed to secure a reform enabling non-consecutive re-election, and he would presumably swap the position with General Álvaro Obregón. However, after Obregón's assasination in 1928, Calles needed an alternative method for maintaining influence, which became the Maximato. The Maximato features presidents meant to serve as puppets of Calles, who is de-facto in control of the country.\n\nCalles established the Partido Nacional Revolucionario (National Revolutionary Party) to maintain his own influence under a big-tent banner. The PNR unites labour and agricultural organizations, political organizations, and professional unions. \n\nCalles himself has slowly become more autocratic as his rule continues. In 1930, the Mexican Communist Party was prohibited, strike action was abolished, and land reform was halted.  At the same time Calles ended Mexico's backing of Anti-American ESDN rebels in Nicaragua. In short, the Maximato exists only to preserve Calles' own power and status, and is heavily opposed by liberal, conservative, Catholic, and leftist opposition figures. However, Calles has become increasingly close to the Gold Shirts, a near-fascist paramilitary that espouses anticlerical, antisemitic and anti-Chinese sentiment.\n\nThough the Maximato appears strong, in reality, it is in decline. After the death of his second wife and due to his own poor health, Calles is less and less involved in Mexican politics. Though the Maximato can exist without him, it has now become a matter of how the Maximato will end, rather than when..."

 social_credit:0 "Social Credit"
 social_credit_desc:0 "§YSocial Credit§!\nSocial Credit is a philosophy developed by British engineer Clifford Hugh Douglas based on what he called \"practical Christianity\". Douglas's economic analysis posits that workers are not being paid enough to buy the goods that they had produced. As such, Douglas has proposed the Social Credit system of economic and political structure to correct for this discrepancy.\n\nThe primary feature of social credit is its economic theory. Douglas proposed to add a fourth factor of production to the traditional three (land, labour, and capital): the \"cultural heritage of society\", defined as global technological progression. Douglas came to disagree that the purpose of production is the \"delivery of goods and services\", instead arguing that production should be done for consumption. Production that does not increase well-being is thus considered \"sabotage\". However, in his disagreement with the classical labour theory of value, Douglas came to reject the usage of money as the measure of value, but a means of \"economic democracy\", by which credit would be democratically controlled. Douglas argues that money as a medium of exchange is an outdated concept, and should be exchanged for a system where money is a system of credit. In short, this system would reform the banking system to be solely creditory systems to assist in distribution.\n\nSocial credit is partially a theory of accounting, which separates payments into two groups. Group \"A\" denotes payments made to individuals, and Group \"B\" denotes payments made to organizations. This is called the \"A+B Theorem\". The end result of the current system, according to Douglas, ends up being exponential growth of debt, trade war, and finally, real war.\n\nTo make up for the discrepancy between wages and prices, which was posited to be caused by the increase in (B) in direct proportion to (A), Douglas proposed to establish a \"National Dividend\" to compensate consumers for this lost credit. In essence, a certain amount of money would be redistributed to workers in accordance to mathematical calculations based on the \"true price\" of goods.\n\nIn the political sphere, Social Credit argues for the abolition of political parties and the establishment of open ballots, where voters would be made accountable for their votes. With Douglas basing his opposition to the secret ballot on his personal antisemitic sentiments. Additionally, he argued for the supremacy of common law under Trinitarianist doctrine and the replacement of political representatives with technical experts."

 rocquism:0 "Rocquism"
 rocquism_desc:0 "§YRocquism§!\nFrançois de La Rocque is a right-wing French politician. A former soldier, he served in North Africa, the Somme, and Poland until his resignation in 1927, reaching the rank of Lieutenant Colonel. He soon joined the Croix de Feu (Cross of Fire, a right-wing veterans’ organization) and quickly became its leader, adding several vague economic points to its platform including protectionism and domestic laissez-faire. However, unlike other CdF members, de La Rocque hesitates to espouse explicitly fascistic rhetoric, as he sees fascism as cult-like,even if he praises mass politics and expects to be treated as a strong leader. As a result of his admiration of mass politics, de La Rocque has been slowly recruiting from more sectors of French societies, including the middle class and the peasantry.\n\nComing from the 19th century patriotic Social Catholic tradition, de La Roque rejects democracy, seeing it as corrupt, leftist, and unpatriotic. Instead, he advocates for an organized authoritarian corporatist-like state, though of a different nature to that in Italy, as he rejects the totalitarian natures of Fascism, National Socialism, and Marxism-Leninism for a more moderate alternative.  He and the CdF supported the creation of a Catholic Corporatist Technocracy, where the state would be active in social, patriotic, and economic organization, but not totalitarian in nature. Despite de La Roque's distaste of democracy, he respects the laws of the Republic, even if he enthusiastically sends CdF members to confront leftist groups.\n\nAs the CdF is not a homogenous movement, several opinions towards antisemitism exist within the party. For example, the Algerian section is heavily antisemitic, while the rest of the party is not as strongly antisemitic as other right-wing and far-right forces, except where non-French Jews were concerned."

 ### Autocratic Despotism
 despotism:0 "Autocratic Despotism"
 despotism_desc:0 "§Y$despotism$§!\nAutocratic Despotism, coming respectively from the Greek terms autós (self), krátos (power), and despotes (master), is a form of government which places power in the hands of a central figure. Such a figure is generally considered to be above the law, and in some cases, apolitical. This figure is usually an absolutist monarch or another individual who takes it upon themselves to consolidate power. Such absolutism is one of the oldest forms of government, particularly in Afroeurasia.\n\nAutocracies are usually centered on a single powerful figure and his/her bureaucracy. The civil service's purpose is to carry out the ruler's demands without major dissent. In this vein, political opposition is not tolerated, and is either controlled, forced underground, or eliminated entirely. Though the autocrat is traditionally some kind of monarch, in modern times, it also might be a military leader or civilian dictator. Opposition movements - whether they are left-wing, centrist, or right-wing - are either brought under the purview of the government in a sort of coalition, or considered criminals.\n\nAutocracies may be statist in economics. Government control in the political and social spheres might be accompanied by control in the economic sector, as the autocracy may establish state-owned corporations, cooperate with business, and/or intervene in an existing market economy to foster growth and increase employment. Alternatively, the autocracy might allow for a free market, but this is less common than statism. Economic issues thus should be considered on a case-by-case basis.\n\nAutocracies seek to establish strict controls on personal activities. Though perhaps not as all-encompassing as more far-right regimes (such as fascist states), autocracies generally have low tolerances for personal expression and freedom. In some cases they may seek to modernize the country, but in general, traditional and/or religious values are kept intact."

 semi_constitutional_alt:0 "Semi-Constitutional Monarchy"
 semi_constitutional:0 "Semi-Constitutional Monarchism"
 semi_constitutional_desc:0 "§Y$semi_constitutional$§!\nBetween a constitutional monarchy, where a monarch is generally bound by some sort of constitution or set of legislation, and in modern times usually a figurehead for a democratic parliament; and absolute monarchies, where the monarch is generally an unbound autocrat, sits the semi-constitutional monarchy. A semi-constitutional monarchy sees the monarch somewhat bound by law, though he or she is still able to exercise considerable powers. This form of government may see some free political activity, though within a framework of authoritarianism.\n\nSemi-constitutional monarchies generally have a semi-free political landscape. In such a government, there will be parliamentary activity, including partisan campaigns and elections. The legislative branch is thus empowered to make most decisions. However, such systems might be stacked against radical opponents of the regime and/or towards conservative supporters, with \"excessively\" radical opponents considered criminals. The monarch remains a central figure, and can still (and in some cases, often does) wield strong executive power. This can include the dismissal of the prime minister, dissolution of the parliament, or other such measures.\n\nThough the semi-constitutional monarchy is more relaxed in the social sphere than its absolutist counterpart, it still belongs in the conservative camp. Though liberal and sometimes even socialist opposition is tolerated, religious and traditional values are usually represented in legislation, such as traditional gender roles. In addition, ethnic and/or racial minorities might be discriminated against without protection from the law. Otherwise, social, cultural and political organizations are not as scrutinized as they are in absolutist monarchies.\n\nEconomically, semi-constitutional monarchies can either follow laissez-faire teachings or statist doctrine. In the former case, the government takes its hands off the economy to allow the market to develop, and the later case, they take an active role to foster prosperity. Semi-constitutional monarchies are also capable of switching between doctrines, as German Chancellor Otto von Bismark did in 1883, when he introduced state health insurance."

 sanationist_despotism:0 "Sanacja"
 sanationist_despotism_desc:0 "§YSanancja§!\nSanacja, (from the Latin word \"sanatio\", healing) was the colloquial name for the ruling clique in Poland since the 1926 May Coup. The name referred to an intended \"moral sanitation\", the healing of Polish public life in the reborn Republic of Poland.\n\nThis movement started with Polish statesman Józef Piłsudski, First Marshal of Poland and one of modern Poland’s founders, and grew due to ordinary Poles’ frustration with Polish parliamentary democracy. The Polish constitution was modelled after that of the Third French Republic and gave considerable powers to the Sejm, while limiting those of the president. The Sejm's primacy, in tandem with inter-party conflicts, led to administrative paralysis. Falling governments, rising unemployment, and the international isolation of Poland created a need in society to find a \"man of providence\" who would put an end to the internal chaos and bring order to Poland. Józef Piłsudski decided to become such a person when he overthrew the democratically elected government and president in the May Coup of 1926.\n\n\"Moral sanation\" manifested in the struggle against \"Sejmocracy\" and \"partisanship\" and the desire to reform liberal democracy into a new, more centralised system of ruling, while distancing itself from fascism and communism. This movement gained support from people across the ideological spectrum, from socialists and anarchists, to liberals and conservatives, and nationalists. The main staple of this movement was the person of Piłsudski himself, being regarded as the man who could save Poland from the dangers of the 20th century.\n\n The movement drew inspiration from romantic and positivist philosophy, socialism and conservatism, and Poland's struggle for independence in the 19th century. A revived and independent Polish state was to allow for the common good of all citizens, regardless of gender, religion and nationality. In addition, the new Poland was to be a continuation of the Polish-Lithuanian Commonwealth, which despite its internal difficulties was able to be an important political player in Central and Eastern Europe."

 RK_Heer:0 "Militärverwaltung"
 RK_Heer_desc:0 "§Y$RK_Heer$§!\nThis administration falls under the authority of a Militärbefehlshaber (military commander) drawn from the German Army. Unlike the civilian governments of the party or the administrations of the SS, which are meant to be semi-permanent arrangements, this administration is intended to operate as an interim military occupation for an indeterminate period.\n\nThereafter, it is intended that the military governance would give way to a civilian government either as collaborationist client state of Germany, or as a new Reichskommissariat under a party bureaucrat. Until such time, this administration’s role would be to quell resistance and maintain order by leveraging the power of the German Army.\n\nThis will likely consist of the creation of a militarized German-led government built on top of the indigenous administration and the recruitment and coercion of the bureaucracy and local nationalists into cooperation with government. Though not as ideological as either the party bureaucracy or the SS, this administration still maintains a broadly authoritarian character and acknowledges the need to toe the Berlin line. As such, it is more likely that it will be inclined to bouts of pragmatism amid repression rather than a \"benevolent\" despotism."

 dang_guo_alt:0 "Dang Guo"
 dang_guo:0 "Three Principles of the People"
 dang_guo_desc:0 "§Y$dang_guo$§!\nThe Kuomintang One-Party State is based on the teachings of Sun Yat-Sen and his Three Principles of the People. After the fall of the Qing Dynasty and the beginning of the Warlord Era, the Kuomintang (KMT) government began implementing the Three Principles, which Sun based on American progressivism and the Soviet Union's Communist Party structure. The Three Principles work on a concept of three stages (Military Rule, Political Tutelage, and Constitutionalism) meant to modernize China into a Western Democracy. The first stage, fulfilled by the Northern Expedition, was to unify the country militarily. The KMT currently considers itself to be in the second stage of Political Tutelage, where the \"Dang Guo\", or Party-State, would establish a one-party rule meant to build up political knowledge to enable a parliamentary democracy to survive without sliding into autocracy. Sun Yat-Sen died in 1925, though the KMT claims to carry on his work.\n\nThe first of Sun's Principles is the concept of Civic Nationalism (Mínzu Zhuyì). This principle rejects ethnic nationalism in favor of the need to unite the five major ethnoreligious groups in China (Han Chinese, Mongols, Tibetans, Manchus, and the the Hui) to achieve independence from imperialism.\n\nThe second Principle, Democracy (Mínquán Zhǔyì) presents the need to reform into a constitutional government on western models. Such a government would see a five-branch system, combining the three western branches (the Legislative, Executive, and Judicial Yuans) with traditional Chinese institutions (the Control and Examination Yuans). After the end of the second stage, the citizenry would be able to use all their political rights, including referendums and recall elections.\n\nThe third principle, Welfare (Minsheng Zhuyì), presents a critique of capitalism. Arguing that capitalism fails to take people's livelihood into account, Sun introduced elements of Georgist thought into the Three Principles. However, Sun was not able to elaborate on this principle, as he died before he could do so."

