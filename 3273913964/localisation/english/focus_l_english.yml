 SPR_militarize:0 "Militarize The Factories"
 SPR_regular:0 "Regular Army"
 SPR_british:0 "British Help"
 SPR_lessons:0 "Lessons From The War"
 SPR_national:0 "New National Army"
 SPR_german:0 "German Help"
 SPR_nationalist_coup:0 "Nationalist Coup"
 SPR_revitalize:0 "Revitalize The Economy"
 SPR_revitalize_desc:0 "After a long period of economic reforms, we can finally float our economy and make it comparable with other european countries."
 SPR_prospect:0 "Review the Mining Grants"
 SPR_prospect_desc:0 "Our industry demands resources! Most of our mines are owned by foreign companies, and we should grant them even more land to fully exploit our riches. In addition, a special fund will be created with the goal of creating statee-owned mines."
 SPR_ahv:0 "Invest In AHV"
 SPR_ahv_desc:0 "AHV is a great asset for our steel production. We could invest in it, creating jobs in the Basque Country, and increasing the steel output."
 SPR_investors:0 "Foreign Investors"
 SPR_investors_desc:0 "Many foreign investors have decided to open factories in our country, creating thousands of jobs. We should invite even more investors to our country."
 SPR_enrichment:0 "Enrichment Of The Spaniards"
 SPR_enrichment_desc:0 "One of our most important priorities should be the creation of a big middle class with purchasing power to strenghten the internal market, and that rejects radicalism in defense of the republic."
 SPR_universities:0 "Universties Expansion"
 SPR_universities_desc:0 "It is time to expand some universities' science and engineering facilities and labs, and to authorize the creation of many new universities to give everyone a chance to study at a university."
 SPR_mobilization:0 "Economical Mobilization"
 SPR_mobilization_desc:0 "War is upon us. It is time to mobilize all the industry we have built for it. Because are won on the battlefield, but also at the factories."
 SPR_boom:0 "Spanish Economical Boom"
 SPR_boom_desc:0 "Spain is experiencing an incredible economic growth. Investors are opening factories, our entreprises grow, jobs are created, and the people sees its quality of life increased year after year. The future seems bright, after all."
 SPR_postwar:0 "Post-War Recovery"
 SPR_postwar_desc:0 "We have fought a long, hard war, and now it is the time to rebuild Spain and uplift its citizens out of poverty."
 SPR_rationing:0 "Rationing"
 SPR_rationing_desc:0 "We can't let people accumulate food while others starve. We shall implement rationing through the country with a Presidential Decree."
 SPR_rebuild:0 "Rebuild Our Country"
 SPR_rebuild_desc:0 "It is time to begin working on rebuilding this country, both physically and socially."
 SPR_usa_aid:0 "Rebuild The Administration"
 SPR_usa_aid_desc:0 "We have to end military administration in rebel areas and fully restore pre-war bureaucracy."
 SPR_rebuild_infra:0 "Rebuild Rail Network"
 SPR_rebuild_infra_desc:0 "We need to rebuild our railway network if we want to fully recover from the economic downturn."
 SPR_rebuild_ind:0 "Rebuild Industrial Network"
 SPR_rebuild_ind_desc:0 "Now that our transport network is rebuilt, we have to restore the industrial production levels we attained in 1935, and even expand our industry further!"
 SPR_recovery:0 "Spain is Rebuilt"
 SPR_recovery_desc:0 "Finally, after this time of hard work and sacrifices, Spain is fully rebuilt. Now we can look to foreign adventures and continue improving our economy."
 SPR_review:0 "Review The Military"
 SPR_review_desc:0 "It is time to review the state of our armed forces. The army is outdated, the airforce is almost non-existant, and the navy is too small. It is time to fix that."
 SPR_ammo:0 "Sevillan Ammunition Factory"
 SPR_ammo_desc:0 "One important step in reducing our lack of modern weapons is bolstering domestic arms production. Thus the Sevilla Ammunition Factory shall be greatly expanded."
 SPR_budget:0 "Increase Military Budget"
 SPR_budget_desc:0 "We can't rely in domestic arms production only. A sharp increase of the military budget will allow us to buy new weapons."
 SPR_old_guard:0 "Remove The Old Guard"
 SPR_old_guard_desc:0 "If we want to have a truly professional force, we must remove the old officers within our army ranks. It will be a politically costly step, but necessary."
#  SPR_armor_primacy:0 "Armor Primacy"
#  SPR_armor_primacy_desc:0 "The Great War showed us that the future belongs to quick, armoured offensives, and not to good old infantry. We should improve our army with this idea in mind."
#  SPR_tank_factories:0 "Tank Factories"
#  SPR_tank_factories_desc:0 "If we are going to have an armoured army, we need to increase our industrial output. Building more tank factories is the solution."
