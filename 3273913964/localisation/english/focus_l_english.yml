 appear_regulares:0 "§Y5 Elite Divisions of Regulares will be mobilized in the Rif§!"
 
 SPA_glorioso_alzamiento:0 "Glorioso Alzamiento"
 SPA_glorioso_alzamiento_desc:0 "After months of disorder, killings, vandalism and the threat of a stalinist dictatorship implemented in our dear country, the military has rightfully taken arms to purify Spain again."
 SPA_salamanca_meeting:0 "Salamanca Meeting"
 SPA_salamanca_meeting_desc:0 "Sanjurjo is dead, and while General Cabanellas has become the figurehead of the new National Defense Junta, we need to elect a proper leadership. The restoration of the monarchy, and the appointment of a Generalísimo, are on the table."
 SPA_sanjurjo_returns:0 "Sanjurjo Returns"
 SPA_sanjurjo_returns_desc:0 "General José Sanjurjo has returned from his exile in Portugal! While he failed in 1932, he will now make sure that the communists are destroyed."
 
 SPA_generalisimo_franco:0 "Generalísimo Franco"
 SPA_generalisimo_franco_desc:0 "General Francisco Franco has been elected by the junta as the new Generalísimo, wielding strong powers. Although initially he was only meant to lead us as long as the war is ongoing, that provision was removed by Franco's aides, giving him free hand to lead Spain even after the war ends."
 SPA_diarchy_jose_antonio:0 "Diarchy with José Antonio"
 SPA_diarchy_jose_antonio_desc:0 "José Antonio Primo de Rivera and his Falange have grown to great importance during the first weeks of the war, and he would be a great asset in our goal of completely controlling politics. To that end, Jose Antonio shall lead the civilian government!"
 SPA_franco_rules_alone:0 "Franco Rules Alone"
 SPA_franco_rules_alone_desc:0 "General Franco must assume total power if his position is to be secure. Carlists, monarchists, militarymen and falangists all need to be controlled, subdued or outright eliminated in order to guarantee a solid government."
 SPA_secure_military_loyalty: "Secure Military Loyalty"
 SPA_secure_military_loyalty_desc:0 "The generals of the old National Defense Junta must be convinced to join our side. With force, if needed."
 SPA_subdue_alfonsines:0 "Subdue the Alfonsines"
 SPA_subdue_alfonsines_desc:0 "Legitimists enjoy the support of few military units, but important generals like Kindelán and Orgaz and important aristocrats that could help us finance the war. We must bring them to our side."
 SPA_eliminate_alfonsines:0 "Eliminate the Alfonsines"
 SPA_eliminate_alfonsines_desc:0 "Legitimists haven't understood 1931. Alfonso XIII was expelled from Spain for good, and he, and his descendants, will never return. If they don't like that, they shall be eliminated."
 SPA_subdue_carlists: "Subdue the Carlists"
 SPA_subdue_carlists_desc:0 "The Requetés are a very valuable fighting force, and the moral support the carlists and their catholicism bring can't be stressed enough. We should make efforts to integrate the carlists in our political structure."
 SPA_eliminate_carlists:0 "Stamp Out the Carlists"
 SPA_eliminate_carlists_desc:0 "The carlists think that they can impose their backwards state on us after the war is won!? Well, in order to preserve stability, they shoud be eliminated now in order to avoid future conflicts."
 SPA_caudillo_of_spain:0 "Caudillo of Spain"
 SPA_caudillo_of_spain_desc:0 "Francisco Franco will take the title of Caudillo, like Mussolini is Il Duce and Hitler is the Führer. He will guide the righteous Spaniards to victory over the red vyper!"
 SPA_martyrdom_jose_antonio:0 "Martyrdom for José Antonio"
 SPA_martyrdom_jose_antonio_desc:0 "José Antonio Primo de Rivera serves us better dead than alive. Alive, he could protest our absolute power, dead, his martyrdom will serve us to control the Falange!"
 SPA_exile_fal_conde:0 "Exile Fal-Conde"
 SPA_exile_fal_conde_desc:0 "Manuel Fal-Conde is too stubborn to continue leading a big political force like the carlists. He must be exiled or imprisioned, that will make the carlists easier to deal with."
 SPA_decreto_unificacion:0 "Unification Decree"
 SPA_decreto_unificacion_desc:0 "Now that Falange and the carlists have been both beheaded, we can merge the parties under the strong leadership of Francisco Franco, Caudillo of Spain by the Grace of God!"
 SPA_junta_tecnica:0 "Junta Técnica del Estado"
 SPA_junta_tecnica_desc:0 "The National Defense Junta shall be dissolved, with a new Technical Estate Junta taking its place. Led by Fidel Dávila, they shall administer civilian matters until a more solid government is created."
 SPA_national_catholicism:0 "National Catholicism"
 SPA_national_catholicism_desc:0 "The support of the Church is vital. They can provide men, money and international support, and in exchange we can make the new Spain a National-Catholic state!"
 SPA_the_new_state:0 "The New State"
 SPA_the_new_state_desc:0 "It is time to enact the Law for the Central Administration of the State, creating a real government and allowing us to create a new, organized state to compete with the Republic."
 SPA_servicio_trigo:0 "Servicio Nacional del Trigo"
 SPA_servicio_trigo_desc:0 "In order to avoid famine and maximize our agricultural efficiency, we shall create the Nacional Wheat Service, that will manage food supply."
 SPA_ban_catalan_administration:0 "Repeal the Estatutes of Autonomy"
 SPA_ban_catalan_administration_desc:0 "We shall officially repeal the Estatutes of Autonomy approved by the Republic, centralizing Spain once more. The use of catalan in the administration will be banned a well."
 SPA_fuero_trabajo:0 "Fuero del Trabajo"
 SPA_fuero_trabajo_desc:0 "We have to keep the pretense we fight for all Spaniards, even the workers. The FET-JONS has recently approved a new Worker's Estatute that could help with propaganda."
 SPA_press_censorship:0 "Press Censorship"
 SPA_press_censorship_desc:0 "We can't allow liberal and socialist newspapers to corrupt society again. The press shall be closely monitored."
 SPA_catholic_education:0 "Catholic Education Reform"
 SPA_catholic_education_desc:0 "Although further reforms will be done after our victory, we should start reforming education to make it more catholic and less liberal."
 SPA_purge_dissent:0 "Purge Dissent"
 SPA_purge_dissent_desc:0 "We will rule with fear. All those who dare challenging us will be swiftly executed, in order to root out evil ideologies from our dear country."
 SPA_organized_repression:0 "Organized Repression"
 SPA_organized_repression_desc:0 "With our recent military advances, thousands of reds now find themselves within our borders. Our policy shall be clear: root them out with extreme force, and they will never rise again!"
 SPA_milicia_nacional:0 "Milicia Nacional-Popular"
 SPA_milicia_nacional_desc:0 "Falange has been fighting with disorganized militias until now. The National People's Militia will serve as the official paramilitary wing of Falange, enabling it to effectively punish dissenters in the red side and within our ranks..."
 SPA_martyrdom_franco:0 "Martyrdom for Franco"
 SPA_martyrdom_franco_desc:0 "Franco has been captured by the reds. He is of no use alive, but dead, we could make him a martyr to control the rebellious National Defense Junta"
 SPA_exile_mola:0 "Exile Mola"
 SPA_exile_mola_desc:0 "With Franco gone, Mola is the only General capable of rallying enough support to pose a challenge in the Junta. We need to take him down."
 SPA_empower_falange:0 "Empower Falange"
 SPA_empower_falange_desc:0 "We need to make Falange the only party allowed in Spain. We also need to use it to control every aspect of our people's lives, and to integrate the workers into our regime."
 SPA_gobierno_salvacion:0 "Gobierno de Salvación Nacional"
 SPA_gobierno_salvacion_desc:0 "The National Defense Junta is of no use to us. Instead of dissolving it, a National Salvation Government, made up of loyal falangists, will take most of its power."
 SPA_collaborate_church:0 "Collaborate with the Church"
 SPA_collaborate_church_desc:0 "We can't secure power without the Church. We need to give them concessions and they will provide men and money for our war."
 SPA_viva_jefe:0 "¡Viva el Jefe!"
 SPA_viva_jefe_desc:0 "José Antonio must abandon the provisional nature of his leadership and make it permanent with the proclamation of the \"Jefe\" of the Spanish State."
 SPA_heavy_rationing:0 "Harsh Rationing"
 SPA_heavy_rationing_desc:0 "A harsh rationing program will serve to enlarge our food stockpile and to make our people stronger through temperance and austerity!"
 SPA_purge_guardia_civil:0 "Purge the Guardia Civil"
 SPA_purge_guardia_civil_desc:0 "Many Civil Guards remained loyal to the Republic, while a decent number defected to us but harbors monarchists sympathies. We need to examine this corps, and purge our opponents there."
 SPA_national_syndicalism:0 "National Syndicalism"
 SPA_national_syndicalism_desc:0 "The ideas of National Syndicalism shall be implemented with a number of decrees: the National Trade Union, the Duty to Work, and the Devotion to the Nation are just some of the ideas we'll set in motion."
 SPA_guerrilla_nacional:0 "Guerrilla Nacional"
 SPA_guerrilla_nacional_desc:0 "We shall encourage our fifth column in the republican territory to rise up and create guerrillas that win the war from the rear."
 SPA_begin_nationalizations:0 "Begin Nationalizations"
 SPA_begin_nationalizations_desc:0 "We can't let fat capitalists and bankers to steal more wealth from the honourable spaniards. Those businesses that refuse to collaborate will be swiftly nationalized."
 
 SPA_junta_defensa:0 "Junta de Defensa Nacional"
 SPA_junta_defensa_desc:0 "The National Defense Junta will lead us in our righteous crusade against the reds and the liberals! The Falange and the monarchists will have to learn their place, or be destroyed!"
 SPA_general_mola:0 "Generalísimo Mola"
 SPA_general_mola_desc:0 "Emilio Mola, the Director, has been elected as the new Generalísimo. He was the main planner of the uprising, securing carlist support to our side and coordinating the war in the North. Now he will finish the job and lead us to victory!"
 SPA_institution_ume:0 "Institutionalize the UME"
 SPA_institution_ume_desc:0 "The Spanish Military Union was a great asset in the planning of the uprising, and they shall be the main political force in the new regime!"
 SPA_instruccion_reservada_one:0 "Intrucción Reservada Nº1"
 SPA_instruccion_reservada_one_desc:0 "One of the orders given by General Mola in preparation for the uprising, the Instrucción Reservada Nº1 declared our intentions of forcefully rooting out the reds from our country."
 SPA_junta_militar_nacional:0 "Junta Militar Nacional"
 SPA_junta_militar_nacional_desc:0 "The National Defense Junta shall be renamed and reformed, with fewer generals and greater powers for our Generalísimo, Mola."
 SPA_build_personality_cult:0 "Build a Personality Cult"
 SPA_build_personality_cult_desc:0 "Our position won't be secure until we manage to convince the people, and the generals, to obey their Generalísimo without thinking it twice."
 SPA_assume_permanent_leadership:0 "Assume Permanent Leadership"
 SPA_assume_permanent_leadership_desc:0 "The text that gave Mola the position of Generalísimo had one last provision: he would lead as long as the war is going. We can now remove that provision and take full power!"
 SPA_secure_church_funding:0 "Secure Church Funding"
 SPA_secure_church_funding_desc:0 "Several concessions will be given to the Church in order to secure their financial support in our struggle."
 SPA_secure_carlist_loyalty:0 "Concessions to the Carlists"
 SPA_secure_carlist_loyalty_desc:0 "The Carlists have been close associates of Mola ever since the uprising was being planned. We still need their loyalty to build a strong state."
 SPA_contain_franco:0 "Contain Franco"
 SPA_contain_franco_desc:0 "Francisco Franco has suffered one political setback, but he is not dead. We must discredit him and neutralize his allies to destroy his political capital."
 SPA_maintain_republican_ideals:0 "Maintain Republican Ideals"
 SPA_maintain_republican_ideals_desc:0 "We are not fighting against the Republic, we are fighting against the red scum that has taken over it."
 SPA_rebuild_ceda:0 "Rebuild the CEDA"
 SPA_rebuild_ceda_desc:0 "Gil-Robles was popular before the war, with enough political and financial support he can rebuild the CEDA and serve as the civilian pillar of our regime."
 SPA_ignore_monarchist_question:0 "Ignore the Monarchist Question"
 SPA_ignore_monarchist_question_desc:0 "The best way to avoid losing allies is to remain quiet, and we shall do so."
 SPA_aristocratic_support:0 "Aristocratic Support"
 SPA_aristocratic_support_desc:0 "We need to convince the aristocrats to provide funds and a small amount of men for the Crusade of Liberation."
 SPA_milicia_ciudadana:0 "Milicias Españolas"
 SPA_milicia_ciudadana_desc:0 "The Reds have given arms to the people and formed militias. Although they are pretty disorganized, we must take inspiration and arms our people as well."
 SPA_reactionary_rethoric:0 "Reactionary Rethoric"
 SPA_reactionary_rethoric_desc:0 "We fight to restore order, we fight to restore the old status of things. Those who think this is a revolution are very mistaken."
 SPA_controlled_opposition:0 "Controlled Opposition"
 SPA_controlled_opposition_desc:0 "The Falange can be a useful tool, giving an illusion of plurality in the new regime. However, their growth must be contained and its leadership dealt with."
 SPA_eliminate_jose_antonio:0 "Eliminate José Antonio"
 SPA_eliminate_jose_antonio_desc:0 "José Antonio Primo de Rivera is still leading Falange, contesting our control over it. He must be taken out of the picture."
 SPA_eliminate_falangists:0 "Destroy Falange"
 SPA_eliminate_falangists_desc:0 "Falange is a threat to the Junta. They must be destroyed with extreme force before they grow out of control."
 SPA_absorb_falangist_militias:0 "Absorb Falangist Militias"
 SPA_absorb_falangist_militias_desc:0 "Those who fought in the falangist militias must be welcomed again to the Army, as long as they are deemed acceptable by the police."
 SPA_dgs:0 "Dirección General de Seguridad"
 SPA_dgs_desc:0 "The DGS has to be restored immediately, with all police and security forces under its command. That way we can conduct repression more efficiently."
 SPA_general_sanjurjo:0 "Generalísimo Sanjurjo"
 SPA_general_sanjurjo_desc:0 "Sanjurjo has safely arrived to Salamanca, were he has taken command of the rebel forces. Now he will, as planned, lead us to victory!"
 SPA_provisional_auth:0 "Autoridad Militar Provisional"
 SPA_provisional_auth_desc:0 "The Provisional Military Authority shall oversee both the National Defense Junta and the civilian affairs. It will be led by Sanjurjo, of course."
 SPA_root_out_anti_spain:0 "Root Out the Anti-Spain"
 SPA_root_out_anti_spain_desc:0 "Liberals, socialists, syndicalists, communists and regionalists don't deserve any kind of mercy from the true Spaniards. The only thing they deserve is death."
 SPA_war_against_democracy:0 "War Against Democracy"
 SPA_war_against_democracy_desc:0 "We fight for the old values, against the rotten demo-liberals and the socialist vypers. Spain is not suited for democracy and will never be!"
 SPA_second_sanjurjada:0 "Second Sanjurjada"
 SPA_second_sanjurjada_desc:0 "General Sanjurjo already tried to overthrow Azaña's government back in 1932, but he was defeated and exiled. We must use this to gain legitimacy and claim continuity with the '32 Coup Attempt."
 SPA_neutralize_franco_mola:0 "Neutralize Franco and Mola"
 SPA_neutralize_franco_mola_desc:0 "General Mola was the planner of the uprising, while Franco is gaining lots of prestige from his military successes. We must use blackmail, propaganda and anything at our disposal to prevent these two generals from growing too ambitious."
 SPA_dissolve_communion:0 "Dissolve the Communion"
 SPA_dissolve_communion_desc:0 "The carlists are a clear threat to our power and our alliance with the Alfonsines. They must be dissolved and their leader exiled as soon as we can."
 SPA_fight_for_christianity:0 "Fight for Christianity"
 SPA_fight_for_christianity_desc:0 "The anti-religious brutality of the red side can be used in our propaganda to transform this war into a Crusade. With the fervour of the soldiers of Christ, we shall triumph!"
 SPA_aristocratic_funding:0 "Aristocratic Funding"
 SPA_aristocratic_funding_desc:0 "Aristocrats and bankers, like Juan March, shall be convinced to provide extra funds to support our war effort."
 SPA_integrate_alfonsines:0 "Integrate the Alfonsines"
 SPA_integrate_alfonsines_desc:0 "The supporters of King Alfonso XIII, the party Renovación Española, were the best defenders of the real Spain in the republican Parliament and will be an useful ally now. They lack men, but they can provide money and international reputation."
 SPA_chairman_cabanellas:0 "President Cabanellas"
 SPA_chairman_cabanellas_desc:0 "Neither Franco nor Mola have managed to secure a majority in the Junta to be elected Generalísimo, and after a long debate, the generals have agreed to leave the situation unchanged: a military junta with Cabanellas as its figurehead."
 SPA_gobierno_tecnico_provisional:0 "Gobierno Técnico Provisional"
 SPA_gobierno_tecnico_provisional_desc:0 "While the National Defense Junta will retain supreme authority over everything, we should set up a provisional government to manage civilian affairs."
 SPA_restore_assault_guard:0 "Restore the Assault Guard"
 SPA_restore_assault_guard_desc:0 "A explicitly Republican police force, the Assault Guard remained mostly loyal to the government. We must create our own version in our territory to claim continuity with the liberal Republic."
 SPA_war_against_communism:0 "War Against Communism"
 SPA_war_against_communism_desc:0 "This is not a war against the Republic. This is a war against the communists, socialists and anarchists that have taken over it."
 SPA_decentralized_leadership:0 "Decentralized Leadership"
 SPA_decentralized_leadership_desc:0 "The continuation of the Junta means that every general will be more or less free to act, both militarily and politically. We should try to sort out all this mess."
 SPA_business_sympathies:0 "Business Sympathies"
 SPA_business_sympathies_desc:0 "Cultivating sympathies with businesses and industries will be key to get the funding we need to win the war."
 SPA_eliminate_falange:0 "Eliminate Falange"
 SPA_eliminate_falange_desc:0 "The Falangists are a threat to the old order and to the Junta. They must be destroyed with supreme force, and their leaders executed."
 SPA_legal_facade:0 "A Legal Facade"
 SPA_legal_facade_desc:0 "We need to create a legal framework for our new state. It will serve to limit the rebellious generals and to give legitimacy to our extra-judicial executions and repression."
 SPA_destroy_carlists:0 "Destroy the Carlists"
 SPA_destroy_carlists_desc:0 "The whole 19th Century wasn't enough for the carlists to notice that Spain doesn't want them anywhere close to power. We shall take care of this dangerous group of fanatic catholics with extreme force!"
 SPA_law_and_order:0 "Law and Order"
 SPA_law_and_order_desc:0 "We shall convince our people, and the world, that we only fight for law and order. The Republic was an utter chaos and the Army, the protector of the spirit of Spain, acted to save it from itself."
 
 SPA_la_regencia:0 "La Regencia"
 SPA_la_regencia_desc:0 "The monarchy has been restored! However, we can't properly crown the new monarch at war. A regency will head the country, for now."
 SPA_regent_kindelan:0 "Regent Kindelán"
 SPA_regent_kindelan_desc:0 "General Kindelán has been chosen by Alfonso XIII to head the War Regency. He is a staunch legitimist monarchist, and will do his best to try the monarchist flame alive."
 SPA_regent_javier:0 "Regent Javier"
 SPA_regent_javier_desc:0 "The carlists have managed to convince the National Defense Junta that Javier de Borbón is the best choice for the Regency, as he is already in Spain and actually has a royal claim."
 SPA_viva_rey:0 "¡Viva El Rey!"
 SPA_viva_rey_desc:0 "Long Live the King! We must use propaganda to turn the people more amiable towards the idea of the monarchy once again."
 SPA_purge_rep_generals:0 "Purge Republican Generals"
 SPA_purge_rep_generals_desc:0 "Generals like Queipo de Llano or Cabanellas have republican beliefs, and they might cause trouble in the future. It is better to remove them now."
 SPA_convince_rep_generals:0 "Convince Republican Generals"
 SPA_convince_rep_generals_desc:0 "Republican Generals like cabanellas can be convinced, no doubt. We are better with their military skills than without them."
 SPA_purge_falange: "Destroy Falange"
 SPA_purge_falange_desc:0 "Falange has grown too much, more than we can allow. Their revolutionary rethoric and their worker-oriented propaganda are a clear threat towards our regime."
 SPA_subdue_falangists:0 "Subdue the Falangists"
 SPA_subdue_falangists_desc:0 "Falange can be used to integrate the people in our regime if we manage it correctly. José Antonio will be gone, of course, and Hedilla will be exiled. That way, Falange and its members will be ours!"
 SPA_a_reactionary_war:0 "A Reactionary War"
 SPA_a_reactionary_war_desc:0 "The reds call us reactionary, and they are right! We fight to destroy the Revolution and bring back the old values, we fight for the best cause in Spanish History."
 SPA_systematic_repression:0 "Systematic Repression"
 SPA_systematic_repression_desc:0 "We must lead the efforts of our soldiers to root out the reds and the liberals from this land! After drowning Spain with blood, the righteous warriors of faith will emerge victorious!"
 SPA_consejo_ministros:0 "Consejo de Ministros"
 SPA_consejo_ministros_desc:0 "We must re-estabilish the old structure of the Kingdom of Spain, starting with the Council of Ministers that will manage civilian affairs."
 SPA_invite_prince_juan:0 "Invite Prince Juan"
 SPA_invite_prince_juan_desc:0 "As long as it is fully safe, we can invite Prince Juan de Borbón to our territory to inspire the soldier and gain a political asset against our rivals."
 SPA_goicoechea_cabinet:0 "Gobierno Goicoechea"
 SPA_goicoechea_cabinet_desc:0 "Sadly, Calvo-Sotelo was assasinated by the reds, so Antonio Goicoechea, the other leading personality of Renovación Española, shall form the first war cabinet!"
 SPA_sway_franco:0 "Sway Franco"
 SPA_sway_franco_desc:0 "General Franco is very popular, and politically he isn't aligned with any faction. We have to bring him to our side."
 SPA_destroy_carlist:0 "Destroy the Carlist Traitors"
 SPA_destroy_carlist_desc:0 "Carlists have been trying, since 1833, to impose their ilegitimate candidate to the throne. They must destroyed once and for all."
 SPA_support_nobility:0 "Support from the Nobility"
 SPA_support_nobility_desc:0 "Nobles and aristocrats are very friendly towards our monarchist restoration, and they will happily contribute to the war effort. Hopefully."
 SPA_frente_nacional_contrarrevolucionario:0 "Frente Nacional Contrarrevolucionario"
 SPA_frente_nacional_contrarrevolucionario_desc:0 ""
 SPA_rehabilitate_alfonso:0 "Rehabilitate Alfonso XIII"
 SPA_rehabilitate_alfonso_desc:0 "King Alfonso XIII was never really popular, and the fall of the Monarchy saw his popularity drop even further. We must fix that with a grand propaganda campaign!"
 SPA_expand_guardia_civil:0 "Expand the Guardia Civil"
 SPA_expand_guardia_civil_desc:0 "The Civil Guard are a great asset in public order duties, and they are mostly loyal to the monarchy. We must expand them to increase our control."
 SPA_economic_corporatism:0 "Economic Corporatism"
 SPA_economic_corporatism_desc:0 "Alfonsine monarchists have been very influenced by Italy during their exile, and now they have plans to give the economy a radic turn towards corporatism."
 SPA_agrarian_counter_reform:0 "Agrarian Counter-Reform"
 SPA_agrarian_counter_reform_desc:0 "The Agrarian Reform was a terrible mistake. We must begin reverting it immediately, returning the land to its rightful owners."
 SPA_consejo_real_guerra:0 "Consejo Real de Guerra"
 SPA_consejo_real_guerra_desc:0 "The Royal War Council shall oversee civilian affairs, with the Regent's supervision, until the war is finally won!"
 SPA_church_privileges:0 "Church Privileges"
 SPA_church_privileges_desc:0 "The Catholic Church has lost many of its rightful privileges in a century of liberal revolution and treason. We must restore the natural order of things."
 SPA_sway_mola:0 "Sway Mola"
 SPA_sway_mola_desc:0 "General Mola included the carlists in the uprising plans, and now he can be a good ally against Franco and the Alfonsines."
 SPA_remove_alfonsines:0 "Remove the Alfonsines"
 SPA_remove_alfonsines_desc:0 "The remaining isabelinos must be destroyed! Those who betrayed the country in 1933 can't expect any kind of mercy now."
 SPA_new_carlist_aristocracy:0 "New Carlist Aristocracy"
 SPA_new_carlist_aristocracy_desc:0 "The Regent shall hand out land and titles to loyal carlist nobles to replace the old Alfonsine aristocracy and expand our economical base."
 SPA_expand_requetes:0 "Expand the Requetés"
 SPA_expand_requetes_desc:0 "We need to allow even more young men to fight for God, King and Fatherland! Let our warriors of faith destroy the communist traitors."
 SPA_fal_conde_cabinet:0 "Gobierno Fal Conde"
 SPA_fal_conde_cabinet_desc:0 "Manuel Fal Conde lead the Carlist Communion faithfully during the Republic, and he shall lead the Government! He has grand plans for Spain..."
 SPA_ley_educacion_catolica:0 "Ley de Educación Católica"
 SPA_ley_educacion_catolica_desc:0 "Republican laicist education was heathenous and barbaric. We need to make sure our children are illuminated by the Holy Bible and the Catholic Church."
 SPA_extreme_fanaticism:0 "Extreme Fanaticism"
 SPA_extreme_fanaticism_desc:0 "If being truly passionate about defending your country, the greatest in the world; against the heathens, the reds, the barbaric anarchsits and the legitimist traitors then yes, we are fanatics!. And we shall fight as fanatics."
 SPA_religious_purity:0 "Enforce Religious Purity"
 SPA_religious_purity_desc:0 "We can't tolerate any religion that's not Catholicism. No one shall deviate Spain from the true faith!"
 SPA_new_tercios:0 "Tercios Nuevos"
 SPA_new_tercios_desc:0 "We must claim the legacy of the imperial Tercios, connecting them with our Requetés. They also fight for catholicism, for Spain and for the King, and they shall also be victorious!"
 
 
 SPA_fascist_state:0 "A Fascist State"
 SPA_fascist_state_desc:0 "The Falange has managed to secure absolute over Spain! It is time to remake our great country to our image, doing away with the old and bringing new ideas to restore our rightful place in the world."
 SPA_cult:0 "Cult Of Personality"
 SPA_cult_desc:0 "Our great leader, José Antonio Primo de Rivera, must be respected and loved by the people. A cult of personality will keep the new regime stable."
 SPA_reinforce:0 "Reinforce The MNP"
 SPA_reinforce_desc:0 "The National Popular Militia was useful during the civil war, and now we must continue expanding it to preserve order and security, and to include the youth in our regime."
 SPA_organize:0 "Organize The New State"
 SPA_organize_desc:0 "The monarchists, carlists and the Church have supported or simply tolerated us, but this can't last for much longer. We should decide if we want to cooperate with the rest of the right, or engage in more revolutionary rethoric as the JONS are demanding."
 SPA_aristocracy:0 "Proclaim The Spanish State"
 SPA_aristocracy_desc:0 "Although we won't restore the monarchy, we shall also avoid adopting the name \"Republic\". The Spanish State will rally all the right to bring stability and strength to the nation!"
 SPA_support_staff:0 "Create the Defense Junta"
 SPA_support_staff_desc:0 "The General Staff shall be reorganized into the Junta de Defensa, where only the ministers of Air, Navy and Army, along with [SPA.GetLeader], will be represented. We need to maintain military support!"
 SPA_reform_mnp:0 "Reform The MNP"
 SPA_reform_mnp_desc:0 "The National Popular Militia has been useful, but the rest of the right is very concerned with their revolutionary rethoric and the hostility towards the regular Army. We should downsize this militia and eliminate its most revolutionary members."
 SPA_catholic_spirit:0 "New Concordato"
 SPA_catholic_spirit_desc:0 "In order to continue building the ideal of National Catholicism, we need the support of the Vatican. If we surrender the education to the church, along with a generous subsidy, they could stabilize the regime through their control over the masses. It will also serve to strenghten our weak diplomatic position."
 SPA_ley_cortes:0 "Ley Constitutiva de las Cortes"
 SPA_ley_cortes_desc:0 "Foreign powers are complaining about the lack of a Parliament in the new regime. Although we don't care at all, doing what they say is a good idea if we dont want to anger them. The new Cortes will be, of course, powerless, but they can be a propaganda tool."
 SPA_revolution_fas:0 "Proclaim The National Republic"
 SPA_revolution_fas_desc:0 "We Falangists are not monarchists and will never be! The new Spanish National Republic will abolish liberalism, socialism, and monarchism; bringing a new era of prosperity, tradition and might to Spain. If the monarchist aristocrats oppose us, they will be eliminated."
 SPA_one_party:0 "One Party State"
 SPA_one_party_desc:0 "The [SPA.GetRulingParty] will be the only legal party in the new Spain. It shall control the state apparatus, propaganda and the economy, at least for now."
 SPA_sv:0 "Sindicato Vertical"
 SPA_sv_desc:0 "Dividing workers by class through conventional, socialist unions goes against the spirit of national unity. We need a single, workers union, that can direct the efforts of all classes towards the common goal: the prosperity and strength of our nation!"
 SPA_purge_staff:0 "Purge The General Staff"
 SPA_purge_staff_desc:0 "Many officers remain unconvinced about our new Republic, and they are planning a military coup! We must eliminate them and promote loyal, falangist generals."
 SPA_national_army:0 "New National Army"
 SPA_national_army_desc:0 "The new Ejército Nacional will be led directly by José Antonio, through loyal general Juan Yagüe. The MNP should also be integrated into it to further weaken anti-regime elements in the Armed Forces."
 SPA_agrarian_reform:0 "Recover The Agrarian Reform"
 SPA_agrarian_reform_desc:0 "The Agrarian Reform had some interesting goals, but it was completely botchered by liberal and socialist degeneracy. We shall redistribute land to loyal patriots that will work it, we can't allow our land to under-produce! Small owners will be respected, as long as they fall in line."
 SPA_worker_estatute:0 "Estatuto De Los Trabajadores"
 SPA_worker_estatute_desc:0 "We can use workers' rights as a tool of propaganda and social coercion, giving paid holidays, sick leave, and a generous minimum wage to those who are loyal to the regime. The new Statute will serve to gain the support of the lower classes!"
 SPA_remove_aristocracy:0 "Limit Aristocratic Power"
 SPA_remove_aristocracy_desc:0 "The Church and many aristocrats have loyally stood with the new Republic, but those monarchists that remain shall be penalized with a new Wealth Limit Decree, that will ensure that they lose all their power. The lower classes will also appreciate this move."
 SPA_franco2:0 "Franco In Power"
 SPA_franco2_desc:0 "General Franco has managed to lead the Nationalist forces to victory! His status as \"Caudillo de España\" has been confirmed and strengthened, and Spain will soon be remade to his vision."
 SPA_caudillo:0 "Glorify El Caudillo"
 SPA_caudillo_desc:0 "As many regimes are doing, Franco will be \"El Caudillo\", like the Duce or the Führer. The cult of personality must present him as man who has been sent by God to save Spain from the red hordes."
 SPA_deal_monarch:0 "Deal With The Monarchists"
 SPA_deal_monarch_desc:0 "Monarchists were key during Franco's ascension to power, and now they are pressuring us for the restoration of their dear King. We need to reach an agreement with them, impressing them with vague promises, to keep their support."
 SPA_patriotic:0 "Patriotic Education"
 SPA_patriotic_desc:0 "Liberal and Republican teachers must be purged from the schools and universities, giving their posts to men of proven loyalty: former officers, right-wing intellectuals, and veterans. If we control education we control Spain!"
 SPA_spanish:0 "Se Habla Español!"
 SPA_spanish_desc:0 "Use of Catalan, Basque and Galician languages must be punished and prosecuted. Everyone is Spain must speak Spanish, the Imperial Language, or suffer the consequences."
 SPA_destroy:0 "Cuerpo de Policía Armada"
 SPA_destroy_desc:0 "The Assault Guard created by the Republic was not a bad idea, as keeping order in the cities is a very serious matter. The Armed Police Corps will serve a similar purpose: dissolving riots, beating up strikers and arresting political opponents!"
 SPA_maquis:0 "Crush The Maquis"
 SPA_maquis_desc:0 "Red guerrillas, or Maquis, haven't accepted their defeat and still roam around the mountains, attacking policemen and roads. We need to stamp them out, fast."
 SPA_minister:0 "Reform The Ministries"
 SPA_minister_desc:0 "The old Ministry of War must be split into the Ministries of Air, Navy and Army. This will keep the military happy and help with planning."
 SPA_inflated:0 "Inflated Military Budget"
 SPA_inflated_desc:0 "The precarious international situation only leaves us with one choice: a massive military budget ( up to 50% ) to keep the Armed Forces mobilized and ready for anything."
 SPA_military_junta:0 "A Military Junta"
 SPA_military_junta_desc:0 "The new Military Junta that now rules Spain, under the leadership of [SPA.GetLeader], must solidify its rule and finish what we started in the civil war, purifying and pacifying our country."
 SPA_authority:0 "Strenghten Our Authority"
 SPA_authority_desc:0 "The authority of the Junta is constantly being contested by political parties, aristocrats and the Church. We need to strenghten the regime's resolve against both left-wing and right-wing dissidents."
 SPA_civilian_question:0 "Ban Civilian Parties?"
 SPA_civilian_question_desc:0 "Political Parties, like Falange, the Carlists, Renovación Española or the CEDA remain active, and their very existence poses our authority in question. We need to decide if we should integrate them or ban them."
 SPA_monarchy_name:0 "A Monarchy In Name"
 SPA_monarchy_name_desc:0 "A way to win popular and aristocratic support would be to officially restore the monarchy. However, [SPA.GetLeader] will serve as Regent, keeping the status quo por the time being."
 SPA_public:0 "Create Public Companies"
 SPA_public_desc:0 "In order to rebuild our war-torn country, we shall create several public companies, dealing with construction, communications and research. They will create employment and strengthen our economy."
 SPA_radio:0 "Expand RNE"
 SPA_radio_desc:0 "The Spanish National Radio was created during the civil war, and it will serve as an excellent propaganda tool to control the masses. Its expansion will also improve communications and coordination in our country."
 SPA_destroy_falangism:0 "Destroy Falangism"
 SPA_destroy_falangism_desc:0 "The falangists remain staunchly opposed to our regime, insisting on their revolutionary ideals. This situation can't be sustained: we need to ban Falange and the JONS, arrest their leadership, dissolve their militia and confiscate their weapons."
 SPA_aristocratic:0 "Aristocratic Ties"
 SPA_aristocratic_desc:0 "Our restoration of the monarchy, in name at least, has satisfied the monarchists, for now. They should be willing to cooperate politically and financially with the government to bring both social and economical stability."
 SPA_ugt:0 "Lift UGT Ban"
 SPA_ugt_desc:0 "During Primo de Rivera's dictatorship, the UGT and the Socialist Party cooperated with the dictatorship in order to bring the workers into the regime's political machine. We could emulate this by lifting the ban on the UGT, the socialist trade union, and working closely with them."
 SPA_united_spain:0 "Spain Is United"
 SPA_united_spain_desc:0 "Our concessions to the workers and the monarchists, and our hard stance against republicans and falangists, seems to have stabilized the regime, at least for the time being. We should focus now on the ankward regency that technically rules Spain."
 SPA_elect:0 "Elect A New King"
 SPA_elect_desc:0 "The Regency ends now! The son of King Alfonso XIII, Juan de Borbón, will take the throne as King Juan III of Spain. However, [SPA.GetLeader] will maintain control over the government, with the King as a figurehead."
 SPA_elections_mil:0 "Hold Elections"
 SPA_elections_mil_desc:0 "Several members of the cabinet, along with the future King, have expressed their desire to return to Constitutional rule, after all these years. If we want to return to the status quo that was in place before Primo de Rivera, we must invite Juan III to Spain, and form a conservative and a liberal party to participate in elections..."
 SPA_monarchy_restored:0 "The Monarchy Restored"
 SPA_restored_desc:0 "The civil war has been one, and after almost a decade, the monarchy is back! Long live the King!"
 SPA_javier_regency:0 "Javier's Regency"
 SPA_carlist_desc:0 "Javier the Borbón shall keep his position as regent, at least for now, while the dynastic disputes between the different carlist factions are solved. We also need to enact some traditionalist reforms."
 SPA_dios:0 "Dios"
 SPA_dios_desc:0 "Spain needs to be a proper catholic state once more, undoing a century of slow secularization. Heathens and heretics shall be prosecuted and expelled, not to mention atheists! Perhaps something similiar to the Inquisition could be restored...?"
 SPA_patria:0 "Patria"
 SPA_patria_desc:0 "Spain, our dear country, has a glorious imperial past, defeating heathens and heretics across the globe in the name of the King and the Cross. We need to reinforce patriotism in our country."
 SPA_rey:0 "Rey"
 SPA_rey_desc:0 "The time has come to choose a King! There are 3 main options: Regent Javier de Borbón, who enjoys broad support because of his job as regent, Juan de Borbón, son of Alfonso XIII, supported by the Alfonsines and some carlists, and finally Carlos Pío de Habsburgo, supported by a particular carlist faction called the \"Cruzadistas\"."
 SPA_fueros:0 "Fueros"
 SPA_fueros_desc:0 "The Fueros, the old regional laws and privileges that date back to the Middle Ages, need to be restored. That would be a good way to appease the provinces, but let them know that the real power stays in Madrid!"
 SPA_car_juan:0 "King Juan III"
 SPA_car_juan_desc:0 "In order to unite all monarchists in our country, we have decided to make Juan de Borbón, son of Alfonso XIII, King of Spain."
 SPA_unite_monarchists:0 "Unite the Monarchists"
 SPA_unite_monarchists_desc:0 "The Alfonsines of Renovación Española and the carlists of the Comunión Tradicionalista have no reason to be enemies now that they support the same King. Thus, we need to unite them in a single political machine."
 SPA_re_evaluate_laws:0 "Re-evaluate Traditionalist Laws"
 SPA_re_evaluate_laws_desc:0 "Many laws that were enacted during Javier's Regency are insane as they are. We need to moderate them to lower their negative social and economical impact."
 SPA_car_javier:0 "King Javier I"
 SPA_car_javier_desc:0 "Javier de Borbón, who dutifully served as Regent and led us through the civil war, has been finally crowned as King. He shall continue strengthening carlism domestically and reclaiming our deserved position abroad!"
 SPA_reinforce_legitimacy:0 "Reinforce Our Legitimacy"
 SPA_reinforce_legitimacy_desc:0 "Javier's legitimacy as King has been questioned by the supporters of the other 2 candidates. We need to support our King's legitimacy, as he was chosen by God himself!"
 SPA_representative_cortes:0 "Representative Cortes"
 SPA_representative_cortes_desc:0 "One of Javier's private goals is to restore the Cortes. They need to be representative of the will of the people, but they should only exists to rubberstamp approved laws and to manage regional fueros. Of course, no parties will be allowed."
 SPA_car_carlos:0 "King Carlos VIII"
 SPA_car_carlos_desc:0 "Carlos Pío de Habsburgo has been crowned as King Carlos VIII of Spain. He has some social ideas, outlined in a manifesto he wrote shortly before becoming King."
 SPA_restore_holy_inquisition:0 "An Independent Judiciary"
 SPA_restore_holy_inquisition_desc:0 "If God, through the King, writes the laws, we can trust on our judges to be independent. This will be appreciated by the people."
 SPA_empire_reborn:0 "Increase Protection for Workers"
 SPA_empire_reborn_desc:0 "Motivated by our victory in the civil war, factory owners have worsened conditions for their workers, who are now living miserably. As their King, Carlos VIII needs to protect his loyal subjects by enacting some regulations like the paid holidays, higher minimum wage, safety regulation, and social security!"
 SPA_paternalism:0 "State Paternalism"
 SPA_paternalism_desc:0 "The King and his cabinet shall take a paternalist role, deciding what's best for the people while punishing those who go the wrong way."
 SPA_catholic_tu:0 "Catholic Trade Unions"
 SPA_catholic_tu_desc:0 "Workers' Unions shall be allowed, but only if they have proven ties with the Catholic Church. This is a way of integrating workers into the new monarchy."
 SPA_agrarian:0 "Agrarian Commission"
 SPA_agrarian_desc:0 "A Royal Comission shall be formed to solve the situation in the countryside. Land redistribution is out of the question, but subsidies and relief are certainly in the realm of possibility."
 SPA_royal_univ:0 "Royal Universities"
 SPA_royal_univ_desc:0 "New Royal Universities shall be opened in the main cities of Spain, to promote research and innovation! Of course, without any Republican or Liberal teacher."
 SPA_legitimists:0 "King Alfonso XIII"
 SPA_legitimists_desc:0 "Alfonso XIII has been finally restored the throne, after being forced to flee in 1931. He's old and sick, so he has chosen to let day-to-day ruling to his cabinet, made up of loyal RE members."
 SPA_juan_iii:0 "King Juan III"
 SPA_juan_iii_desc:0 "With the death of Alfonso XIII, his son Juan has been crowned as King Juan III of Spain. The cabinet distrusts him, and the feeling is mutual, so he has some plans..."
 SPA_military_takeover:0 "Military In Control"
 SPA_military_takeover_desc:0 "The army has taken action, and saved the regime we worked so hard to build during the civil war! We can't allow an incompetent King to restore liberalism in this country!"
 SPA_crush_left:0 "Crush The Left"
 SPA_crush_left_desc:0 "The liberals are now protesting our military intervention! Let us show them that they lost the civil war, and they will never infect Spain again."
 SPA_puppet_king:0 "A Puppet King"
 SPA_puppet_king_desc:0 "King Juan III will be a puppet of the Royal Cabinet and of the military. This unusual situation is necessary to preserve unity and prosperity."
 SPA_king_jaime:0 "King Jaime I"
 SPA_king_jaime_desc:0 "The new King, Jaime I, has come to power with the blessing of the cabinet and the military. We'll see what his goals are."
 SPA_agreement_army:0 "Agreement With The Army"
 SPA_agreement_army_desc:0 "The Army seems to continue plotting coups, as they have been successful in almost all their attempts during this century. We need to reach an agreement with them so that they stay quiet."
 SPA_estatuto:0 "Estatuto Real"
 SPA_estatuto_desc:0 "A new Royal Estatute, that acts as a pseudo-Constitution, can serve to calm the masses and to keep the support of the military and of the Royal Cabinet."
 SPA_authoritarian_monarchy:0 "An Authoritarian Monarchy"
 SPA_authoritarian_monarchy_desc:0 "The monarchy shall continue to rely on a strong Royal Cabinet and on the military, with no place for those foreign ideas of \"democracy\" and \"freedom\"."
 SPA_destroy_carlism:0 "Destroy Carlism"
 SPA_destroy_carlism_desc:0 "Those recalcitrant carlists that remain shall be exiled or executed! We will tolerate no challenges to the King's legitimacy!"
 SPA_catholic_kingdom:0 "A Catholic Kingdom"
 SPA_catholic_kingdom_desc:0 "Catholicism should be made, again, the official religion of the Kingdom of Spain. The rest of the faiths must be allowed, as long as they are not displayed in public."
 SPA_move_corporatism:0 "Move Towards Corporatism"
 SPA_move_corporatism_desc:0 "Like in fascist Italy or the Primo de Rivera Dictatorship, we need to move towards a corporatist economy model, that rejects class divisions to unite the people under the King!"
 SPA_restore_senate:0 "Restore The Senate"
 SPA_restore_senate_desc:0 "The Senate can serve as an aristocratic Upper House, that will appease the aristocrats and further increase the power of the Cabinet."
 SPA_censitary_suffrage:0 "Censitary Suffrage"
 SPA_censitary_suffrage_desc:0 "We can open up the Cortes seats for elections, but only those who have enough patrimony should be able to vote, as they are they only ones that are actually invested in the governance of the nation. Of course, no parties should be allowed."
 SPA_partido_conservador:0 "Partido Conservador"
 SPA_partido_conservador_desc:0 "The moderate conservatives will lead the country for the next 4 years. Their program includes the drafting of Estatutes of Autonomy, the continuation of state catholicism and the gradual reconciliation of both civil war sides."
 SPA_calm_army:0 "Calm the Army"
 SPA_calm_army_desc:0 "The Army is very concerned with our democratization policies. We must reassure them that the monarchy, stability and their own position is perfectly secure."
 SPA_continue_catholic_policies:0 "Continue Catholic Policies"
 SPA_continue_catholic_policies_desc:0 "If we are supposed to be a democracy, we must follow the catholic majority of Spain, and continue our close cooperation with the Vatican. The Church must be on our side!"
 SPA_partido_liberal:0 "Partido Liberal"
 SPA_partido_liberal_desc:0 "The Liberals have gained a majority in the new Parliamennt! They have promised to move forward, preserving patriotism and prosperity while enacting reconciliatory policies."
 SPA_reduce_tariffs:0 "Reduce Tariffs"
 SPA_reduce_tariffs_desc:0 "Protectionism has been constant during modern Spanish history, but that has to end now. We need to end protectionism and lower tariffs now!"
 SPA_legacy_republic:0 "Legacy of the Second Republic"
 SPA_legacy_republic_desc:0 "The 2nd Republic had some noble goals, especially when it started, until it was corrupted by socialists and communists. We need to defend its legacy while also defending the current regime."
 SPA_reestructure_army:0 "Reestructure the Army"
 SPA_reestructure_army_desc:0 "The Army is still planning a coup to overthrow us, and that can't be. We can't purge the disloyal officers, but we can reassign them or demote them to prevent the looming threat of a coup."
 SPA_ley_prensa:0 "Ley de Libertad de Prensa"
 SPA_ley_prensa_desc:0 "It is time to restore freedom of the press, ending the Censorship Junta and allowing ideas to freely spread. At least for those newspaper that are not socialist..."
 SPA_independent_judiciary:0 "Ley de Amnistía"
 SPA_independent_judiciary_desc:0 "If we pardon those moderates that tried to prevent crimes during the civil war, even if they stood with the other side, we should be able to advance towards national reconciliation."
 SPA_work_unions:0 "Legalize Trade Unions"
 SPA_work_unions_desc:0 "Trade Unions need to be legalized once more, to allow workers to defend themselves against the aristocrats. They need to understand that this is a concession that can be withdrew at any moment, however."
 SPA_constitutional:0 "Constitutional Monarchy"
 SPA_constitutional_desc:0 "Juan III has finally called for general elections, signaling the beggining of another Constitutional Monarchy in Spain, one that will hopefully amend the errors of the past."
 SPA_embrace_lib:0 "Embrace Liberalism"
 SPA_embrace_lib_desc:0 "Political liberalism is back, and this time it won't fall into the mistakes of the past. We shall promote freedom without supporting anti-clericalism or aligning with socialism."
 SPA_new_ed_law:0 "New Education Law"
 SPA_new_ed_law_desc:0 "More schools need to be built! That combined with a new education law should give our country a boost in research and development."
 SPA_martial_law:0 "Declare Martial Law"
 SPA_martial_law_desc:0 "Chaos has engulfed the nation upon hearing how we blocked the proposed democratization amendments. We need to declare Martial Law to restore order in this country!"
 SPA_snp:0 "Create The National-Unionist Party"
 SPA_snp_desc:0 "The new Republic has been stabilized, but we need to unite the right. By creating a new catch-all political party, we should able to install the \"National Government\", that will rule Spain until \"elections can be held\", through repression and propaganda."
 SPA_pne:0 "PNUE"
 SPA_pne_long:0 "Partido Nacional-Unionista Español"
 SPA_tutelage:0 "National Government"
 SPA_tutelage_desc:0 "The new National Government has managed to pacify our country after a decade of disorders and violence. It will continue to lead us until we are mature enough to transition back to democracy."
 SPA_draft_new_cons:0 "Draft A New Constitution"
 SPA_draft_new_cons_desc:0 "The time has come to draft the new Constitution of the Third Spanish Republic. The democrats are pressuring us for democratization measures, while the hardliners refuse to give up power..."
 SPA_strenghten_presi:0 "Strenghten The President"
 SPA_strenghten_presi_desc:0 "President [SPA.GetLeader]'s position is threatened by disloyal generals, falangists and monarchists. We to strengthen the Presidency to properly organize the new Administration!"
 SPA_anti_monarchism:0 "Anti Monarchism"
 SPA_anti_monarchism_desc:0 "Monarchism in Spain is dead, but there are lots of generals and aristocrats that refuse to accept it. We need to double down on anti-monarchism, both in propaganda and in repression."
 SPA_order:0 "Restore Public Order"
 SPA_order_desc:0 "Falangists and red remnants are organizing militias and challenging our rule. We didn't win a war to tolerate this: they must be crushed!"
 SPA_auth_rep:0 "An Authoritarian Republic"
 SPA_auth_rep_desc:0 "Spain has emerged from the bloody civil war as an authoritarian Republic, that will correct the mistakes of the 2nd Republic, that was corrupted by socialism and anti-clericalism. With monarchists, falangists and leftists against us, we need to be strong!"
 SPA_hold_elections:0 "Hold Elections"
 SPA_hold_elections_desc:0 "The time has come to hold the first elections of the Third Spanish Republic. The conservatives and the liberals are both fighting to see who will get to rule Spain now..."
 SPA_postwar_econ:0 "Postwar Economy"
 SPA_postwar_econ_desc:0 "The civil was left our country in ruins. We need to focus all our efforts to rebuild the nation, heal our wounds, and prevent a famine from breaking out."
 SPA_bureaucracy:0 "Expand The Bureaucracy"
 SPA_bureaucracy_desc:0 "In order to beat the crisis, we need to intervene decisevely in the economy. The cabinet will direct the industries and corporations without increasing tariffs, and begin planning solutions for the impeding famine."
 SPA_autarky:0 "Autarky"
 SPA_autarky_desc:0 "In order to beat the crisis, we will start an Autarky policy. This is the perfect opportunity to make Spain self-sufficient, as that's the only way we can be truly great."
 SPA_liberalization:0 "Liberalization"
 SPA_liberalization_desc:0 "In order to beat the crisis, we will liberalize the economy, letting private initiative to sustain the recovery efforts. Our top economic advisors are pointing out that this solution is very likely to succeed."
 SPA_close_economy:0 "Close The Economy"
 SPA_close_economy_desc:0 "If we want to be truly self-sufficient, the economy must be closed to foreign trade. We should be able to produce what we consume."
 SPA_militarized:0 "Militarized Factories"
 SPA_militarized_desc:0 "Having a strong military production sector could be pretty useful, especially if we want to be ready for war. Factories, especially military ones, should be put under sstrict conditions to activate their production."
 SPA_spanish_science:0 "Spanish Science"
 SPA_spanish_science_desc:0 "We should promote Spanish science over foreign-made inventions. Almost all scientists are exiled due to our repressive policies, but eh, we can try."
 SPA_corporations:0 "Corporatism"
 SPA_corporations_desc:0 "In order to properly manage the economy, perhaps it would be a good idea to recover the corporatist economic theories of Primo de Rivera, that were inspired by fascist Italy."
 SPA_famine:0 "Fight Famine"
 SPA_famine_desc:0 "We need to fight against famine with all our energy, with food imports, increased agrarian production, rationing and more."
 SPA_forced_labour:0 "Use Forced Labour"
 SPA_forced_labour_desc:0 "The Patronato Central de Redención de Penas por Trabajo will be useful in the reconstruction of Spain, using prisioner reds to rebuild the country. Hopefully that will show them the greatness of the new Spain!"
 SPA_projects:0 "Create the INI"
 SPA_projects_desc:0 "The Instituto Nacional de Industria, taking inspiration from the Italian IRI, will manage industrial projects and will give us the necessary industrial muscle for the next decades!"
 SPA_rationing:0 "Rationing"
 SPA_rationing_desc:0 "Rationing is essential if we want to mitigate the famine that is currently rampaging our country. We also need to focus our efforts in controlling the wheat black market."
 SPA_peseta:0 "Intervene The Peseta"
 SPA_peseta_desc:0 "We need to intervene our currency, the Peseta, to secure its market value and avoid inflation. We can look into a possible devaluation later on."
 SPA_funding_frenzy:0 "Funding Frenzy"
 SPA_funding_frenzy_desc:0 "There are lots of private reconstruction initiatives, along with some public ones, that are waiting for funds to begin. We need to give ample funds to these initiatives so that reconstruction goes faster!"
 SPA_rail_reform:0 "Estatuto Ferroviario"
 SPA_rail_reform_desc:0 "If we want to proerly rebuild the railway network we need to put it under state control once more. An Estatuto Ferroviario will serve for that purpose, and will outline the conditions for the railways' re-privatization."
 SPA_rural:0 "Rural Relief Plan"
 SPA_rural_desc:0 "The situation in the countryside continues to be dramatic, as no Agrarian Reform was enacted. However, the Council of Ministers has approved Rural Relief Plan that will hopefully help combat misery in the south and in Castilla."
 SPA_food_imports:0 "Food Imports"
 SPA_food_imports_desc:0 "Avoiding famine must be our top priority! We need to secure food imports with Argentina, with the Commonwealth, and with any country that is willing to sell us wheat and meat, or the crisis will get worse."
 SPA_public_sector:0 "Strenghten The Public Sector"
 SPA_public_sector_desc:0 "We need a robust public sector that is capable of sustaining the recovery effort. We can't trust the volatile private sector and their greed, that might fail to solve the crisis or even make it worse!"
 SPA_foreign_invest:0 "Foreign Investments"
 SPA_foreign_invest_desc:0 "Easing private activity will likely begin a masisve entry of foreign capital, that can benefit from our ( forcefully ) cheap labor and our untapped resources!"
 SPA_strenght_private:0 "Strenghten The Private Sector"
 SPA_strenght_private_desc:0 "We need a robust private sector that can quickly create employment and rebuild the country. The state apparatus might be too corrupt to handle this reconstruction."
 SPA_employment_boom:0 "Employment Boom"
 SPA_employment_boom_desc:0 "We need to continue promoting the creation of employment, with lower taxes, worse worker conditions or anything that can help. If we quickly eliminate unemployment, we will prosper."
 SPA_reactivate_market:0 "Reactivate Internal Market"
 SPA_reactivate_market_desc:0 "With our people ( mostly ) employed, we should encourage our people to buy, and to buy Spanish, to further promote our nascent industry."
 SPA_expand_ports:0 "Expand Trade Ports"
 SPA_expand_ports_desc:0 "We need to continue expanding our ports, to be able to import more food, fuel, and industrial machinery. Otherwise, we will continue isolated."
 SPA_recovery:0 "Full Recovery"
 SPA_recovery_desc:0 "It seems that after these years, the economy has finally recovered from the horrors of the post-war. We can now continue Spain's industrialization with a renewed impetus."
 SPA_talgo:0 "TALGO Trains"
 SPA_talgo_desc:0 "Alenjandro Goicoechea, a famous engineer, has approached us with a plan to build our own trains, that would be quite fast. We should promote and fund this initiative, called TALGO."
 SPA_instalaza:0 "State Armories"
 SPA_instalaza_desc:0 "To keep expanding our military production, we should build state-owned military factories that can properly tend our army's needs."
 SPA_madrid_complex:0 "The Madrid Complex"
 SPA_madrid_complex_desc:0 "A military-industrial complex in Madrid is easily defensible and can be coordinated with the Army with ease. We should begin planning its construction."
 SPA_ahv:0 "Expand AHV"
 SPA_ahv_desc:0 "The Altos Hornos de Vizcaya should be expanded in order to drastrically increase our steel production. That should help us keeping the military production chain."
 SPA_military_railways:0 "Military Railways"
 SPA_military_railways_desc:0 "Building some railways for exclusive military use should make our army more mobile and the country slightly more defensible."
 SPA_catholic_unions:0 "Catholic Unions"
 SPA_new_diplomacy:0 "New Diplomacy"
 SPA_new_diplomacy_desc:0 "A new Spain has risen! The time has come for us to re-examine our foreign policy and gain our rightfully deserved power. The first step should be leaving the League of Nations, and we can decide from there."
 SPA_claim_gibraltar:0 "Claim Gibraltar"
 SPA_claim_gibraltar_desc:0 "Gibraltar, the English colony in Spanish soil, is an insult and a national humilliation. We need to get Gibraltar back one way or another."
 SPA_take_side:0 "Take A Side"
 SPA_take_side_desc:0 "We can't afford to doubt in this crucial moment. We need to take a side and fight for it!"
 SPA_allies:0 "The Allies"
 SPA_allies_desc:0 "The Allies seem to be the strongest faction, and the British, despite our differences, are fighting for a noble cause. We should seek an alliance with them."
 SPA_axis:0 "The Axis"
 SPA_axis_desc:0 "Germany is destroying the Old World and building a new one, with strength, patriotism and a sense of duty and honour. We need to join their fight against liberalism and bolshevism."
 SPA_recover_catalonia:0 "Recover Catalonia"
 SPA_recover_catalonia_desc:0 "While during the civil war we decided to give priority to defeating the reds, letting the separatist Catalans alone, we are now in a position to rectify that. Let us march into Barcelona and retake what is ours!"
 SPA_use_caution:0 "Use Caution"
 SPA_use_caution_desc:0 "Germany and Britain are about to have a war, and we shouldn't jump into it mindlessly. We shall use caution and wait until one side is decisevely defeated to join the other side and reap the benefits!"
 SPA_pro_german:0 "Pro-German Stance"
 SPA_pro_german_desc:0 "The Germans are invincible: their armies will destroy weak liberals and bolsheviks. We should cooperate with them in order to be on the winning side."
 SPA_naval_access:0 "Naval Access To Germany"
 SPA_naval_access_desc:0 "If we offer the Germans docking rights for their submarines, they would greatly increase the range of their operations, and also improve their opinion of us."
 SPA_german_propaganda:0 "Pro-German Press"
 SPA_german_propaganda_desc:0 "German agents have become very interested in controlling our press, and we can only cooperate with them. Spanish newspapers shall show our country the glory of the Reich, while propaganda magazines like Signal and Der Adler will teach young spaniards the values of discipline and militarization!"
 SPA_blue_division:0 "División Azul"
 SPA_blue_division_desc:0 "Germany has declared war on bolshevism! We shall send a volunteer force to help them in their righteous Crusade for the Western Civilization and Christian Values! Down with Communism!"
 SPA_tungsten_exports:0 "Tungsten Exports"
 SPA_tungsten_exports_desc:0 "Germany is very interested in our tungsten reserves, and we can only agree with them. They shall have full access to our tungsten reserves, something that will also mean the entry of german capital into our country."
 SPA_spanish_workers:0 "Spanish Workers In Germany"
 SPA_spanish_workers_desc:0 "The Germans are fighting hard on the frontlines, and they have asked us to provide them with some human capital. We shall send some unemployed workers to show our commitment to the cause."
 SPA_non_belligerence:0 "Declare Non-Belligerence"
 SPA_non_belligerence_desc:0 "It is time for us to change our stance from neutral to non-belligerent! Our entry in the war approaches!"
 SPA_enter_war:0 "Enter The War"
 SPA_enter_war_desc:0 "To arms! It is time to join the war and show our enemies the Spanish might!"
 SPA_declare_neutrality:0 "Declare Neutrality"
 SPA_declare_neutrality_desc:0 "This war is not our business; we will never join it, and the world shall know that the spanish people will only know peace. Thus, we shall continue our strictly neutral policies and fight foreign influence that wishes to steer us in any direction."
 SPA_pro_british:0 "Pro-British Stance"
 SPA_pro_british_desc:0 "The British somehow always manage to win these kind of wars, it would be unwise to break our ties with them, at least for now."
 SPA_increase_trade_britain:0 "Increase Trade With Britain"
 SPA_increase_trade_britain_desc:0 "We should be able to greatly boost our destroyed economy if we increase our economic ties with the British."
 SPA_demand_press_neutrality:0 "Neutral Press"
 SPA_demand_press_neutrality_desc:0 "We need to demand our main newspapers to stop being so biased against the British. We need the real information to make decisions, not propaganda."
 SPA_end_tungsten_shipments:0 "End Tungsten Shipments"
 SPA_end_tungsten_shipments_desc:0 "Tungsten shipments to Germany should end immediately, as a gesture of goodwill towards Britain. We should be wary of the German reaction though..."
 SPA_anti_japanese:0 "Anti-Japanese Rethoric"
 SPA_anti_japanese_desc:0 "The Japanese are massacring our people in the Philippines, and by taking a stance against them the Allies will appreciate more our position."
 SPA_catholicism_over_fascism:0 "Catholicism Over Fascism"
 SPA_catholicism_over_fascism_desc:0 "We need to emphasize our catholic policies, staying away from fascist rethoric. That will surely pleace the Allies, and the Vatican as well."
 disable_influence:0 "§GThis will disable the alignment minigame, preventing you from joining factions but also reducing the chance of being attacked.§!"
 
 SPC_1934:0 "The 1934 Revolution"
 SPC_1934_desc:0 "Although our revolutionary strike has failed in almost all of Spain, we have managed to triumph in Asturias. Now we have to resist the fascist government!"
 SPC_scw:0 "The People's Executive Committee"
 SPC_scw_desc:0 "As the people of Spain finally rises up against the forces of reaction, the Socialist Party, UGT, the Communist Party, the CNT-FAI and the POUM have casted their differences aside and formed the Comité Ejecutivo Popular (People's Executive Committee), led by the PSOE's leader Largo Caballero."
 SPC_disunited_army:0 "Disunited Army"
 SPC_disunited_army_desc:0 "Although the otherwise squabbling left is somehow united, the militias are not. CNT, PSOE, PCE and regional militias will need to be merged to form a functional army."
 SPC_international_brigades:0 "International Brigades"
 SPC_international_brigades_desc:0 "Thousands of workers worldwide have decided to join the Spanish people in their struggle against reaction. We must organize these men and take them to the front, quickly."
 SPC_anti_fascist_struggle:0 "Anti-Fascist Struggle"
 SPC_anti_fascist_struggle_desc:0 "The Spanish Republic is gone, destroyed the fascism and reaction. This is now a popular war against the fascists that have taken over the defunct Republic, and the world should be more sympathetic to our cause."
 SPC_anti_capitalist_war:0 "Anti-Capitalist War"
 SPC_anti_capitalist_war_desc:0 "The liberals have somehow managed to prevail, and the Second Republic is still standing. Although this undermines our international reputation, we should still be able to get more volunteers to fight capitalism."
 spc_five_int_brigades:0 "§Y6§! §RInternational Brigades§! will arrive!"
 spc_two_int_brigades:0 "§Y2§! §RInternational Brigades§! will arrive!"
 spc_three_int_brigades:0 "§Y3§! §RInternational Brigades§! will arrive!"
 spc_gain_infantry:0 "§GGain §Y6§! fully equipped Revolutionary Columns!§!"
 SPC_maintain_enthusiasm:0 "Maintain the Enthusiasm"
 SPC_maintain_enthusiasm_desc:0 "As the war drags on, the people have begun to realize that this isn't going to be the fast Revolution everyone imagined, and we are going to fight for a long time. If our enthusiasm decays, the fascists will win, so more propaganda is needed."
 SPC_nationalize_industry:0 "Decreto de intervención de la industria"
 SPC_nationalize_industry_desc:0 "We will issue a decree to nationalize most factories from military companies, as well as capitalist and corporate owned industries located in our territory."
 SPC_seize_civilian_planes:0 "Seize Civilian Planes"
 SPC_seize_civilian_planes_desc:0 "Airports and airbases across our territory have lots of airplanes that, properly armed, can be used to contest the Spanish skies!"
 SPC_mobilize_the_workers:0 "Mobilize the Workers"
 SPC_mobilize_the_workers_desc:0 "The UGT and CNT-FAI will call for a general strike on all the cities controlled by the burgeoise government as a way to paralize the capitalist's war effort. Meanwhile the People's Executive Committee will issue a decree to mobilize the workforce and to begin transitioning to a war economy."
 SPC_establish_rations: "Establish Civilian Rationing"
 SPC_establish_rations: "The troops at the frontline must be well fed if we want any chance to win our struggle. We will set up a rationing system of food and other commodities for the civilian population as a temporary wartime measure for that purpose. "
 SPC_merge_party_militias:0 "Merge the Party Militias"
 SPC_merge_party_militias_desc:0 "CNT, PSOE, PCE and POUM militias need to be unified under a centralized leadership. That is the only way we can properly end inter-party disputes, at least for now."
 SPC_a_las_barricadas_focus:0 "A las barricadas!"
 SPC_a_las_barricadas_focus_desc:0 "We must defend the Revolution against the reactionary oppressor!"
 SPC_seize_companies_industry:0 "Seize Capitalist Industries"
 SPC_seize_companies_industry_desc:0 "In our efforts to abolish provate property we must seize the factories from capitalists and give them to the workers."
 SPC_consejo_agrario:0 "Consejo Agrario"
 SPC_consejo_agrario_desc:0 "The collectivized farms across our land are doing alright, and production is steadily rising, but with proper direction, we should be able to eliminate the food issue and focus only on the war."
 SPC_arsenal_de_madrid: "Arsenal de Madrid"
 SPC_arsenal_de_madrid_desc: "Now that we have finaly taken Madrid from the hands of the fascists we can use the city's arsenal to better supply our forces."
 SPC_consejo_obrero_mineria_acero:0 "Consejo Obrero de la Minería y el Acero"
 SPC_consejo_obrero_mineria_acero_desc:0 "Eastern Andalusia has lots of untapped resources, specially steel, for us to extract. With the creation of the COMA, we can properly plan and execute mining operation in the area."
 SPC_consejo_industrial_levante:0 "Consejo Industrial del Levante"
 SPC_consejo_industrial_levante_desc:0 "Many factories in the Mediterranean coast have been collectivized or nationalized, but we need to go further and unite all factories into a single Industrial Council. That will hopefully help us increase our military production."
 SPC_soviet:0 "Soviet Help"
 SPC_soviet_desc:0 "The USSR should be happy to send us some advisors, being the Home of the Revolution. We hope they don't make further demands..."
 SPC_secure_firearms: "Secure the Firearms"
 SPC_secure_firearms_desc:0 "We must secure enough military equipment to further carry out the revolution! Thus we shall loot the military parks and arsenals of the big cities and redistribute the firearms to the workers."
 SPC_organize_militias:0 "Organize Revolutionary Columns"
 SPC_organize_militias_desc:0 "We will create a series of \"Revolutionary Columns\" made up of experienced soldiers that deserted to our side. These will work as an elite shock unit, at least for the time being, as they will be the best equipped units we currently have."
 SPC_brigadas_mixtas:0 "Organize the Mixed Brigades"
 SPC_brigadas_mixtas_desc:0 ""
 SPC_form_armour_regiment:0 "Form an Armoured Regiment"
 SPC_form_armour_regiment_desc:0 "Now that we have enough tanks we will organize the first Armoured Regiment of the Spanish Revolutionary Army. May it bring death to our enemies and penetrate their lines, for the Revolution! "
 SPC_economy1:0 "Direction Of The Economy"
 SPC_economy1_desc:0 "The Worker's Congress has decided an economic policy; now must work to transform the words into real policies that improve the livelihood of the workers!"
 SPC_pce_eco:0 "PCE: Central Planning"
 SPC_pce_eco_desc:0 "The Communist economic plan, based on central planning, has managed to win the vote thanks to the backing of Largo Caballero's faction. Spain will soon enjoy the benefits provided by the 5 Year Plans!"
 SPC_comitee:0 "Comité de Planificación Central"
 SPC_comitee_desc:0 "In order to oversee economic matters, a Central Planning Committee will be set up, that only answers to the Economy Minister and the Head of Government. It shall draft and execute industrial and agricultural plans in a centralized manner, and oversee factory production."
 SPC_military_plans:0 "Military Planning"
 SPC_military_plans_desc:0 "Building military factories we reactivate the economy the war destroyed, along with reinforcing our Armed Forces. Under the constant threat of a fascist retaliation, that is only good."
 SPC_complex:0 "The Madrid Industrial Complex"
 SPC_complex_desc:0 "A grand industrial complex, with both heavy and military industries, shall be built near Madrid. It will greatly help our industrialization progress."
 SPC_rebuilt:0 "Spain Is Rebuilt"
 SPC_rebuilt_desc:0 "Our economic policies seem to be working, and Spain is slowly recovering the pre-war economic levels. This success will be very useful in the Second Worker's Congress!"
 SPC_self_sufficiency:0 "Self-Sufficient Communes"
 SPC_self_sufficiency_desc:0 "We need to begin working on a small scale. Self-Sufficient agricultural communes should be the basis of our society once Libertarian Communism arrives, we might as well begin setting them up now."
 SPC_safety:0 "Ensure Worker Safety"
 SPC_safety_desc:0 "A factory ran by the workers themselves must never prioritize productivity over safety. All factories in Spain shall be properly prepared so that not a single worker dies an avoidable and unnecessary death."
 SPC_workplace:0 "Workplace Democracy"
 SPC_workplace_desc:0 "In industrialized areas, the basis of society must be workplace democracy, where workers are free to speak for themselves and collectively manage our economy, instead of it being run by greedy oligarchs."
 SPC_agricultural:0 "Comités Agrarios"
 SPC_agricultural_desc:0 "Agricultural Communes seem to be working. We need to continue promoting them, as it shows the people that anarcho-syndicalism is in fact viable, and better than capitalism."
 SPC_cooperatives:0 "Worker Cooperatives"
 SPC_cooperatives_desc:0 "Worker cooperatives are the entities that run each factory, with every worker equally represented within them. All the means of production, from industries to farms, shall be owned by cooperatives made up of the people that work them."
 SPC_5_year:0 "Plan Quinquenal"
 SPC_5_year_desc:0 "Stalin's successful 5 year plans show us the way! With a bit of effort, we can greatly increase our industrial production in 5 years."
 SPC_syndie:0 "CNT: Syndicalist Economy"
 SPC_syndie_desc:0 "The Syndicalist economic plan, based on democratization of the workplace, has managed to win the vote thanks to the influence of the unions. Spain will soon enjoy the benefits of having no masters, of having truly sovereign workers."
 SPC_liberal:0 "Prietistas: Liberal Socialism"
 SPC_liberal_desc:0 "Against all odds, the Prietista economic plan, involving a more liberalized economy, has won the vote. Now we must ensure it doesn't fail, or we might have another Revolution..."
 SPC_welfare:0 "A Robust Welfare State"
 SPC_welfare_desc:0 "Before thinking about utopic economic theories, we must handle the rampant poverty and famine that the war has caused."
 SPC_redistribution:0 "A Radical Agrarian Reform"
 SPC_redistribution_desc:0 "Instead of collectivizing the land, we can break up large properties and give small shares of it to each of the agrarian workers. That way they can provide for themselves, and we can help if something goes wrong."
 SPC_entrepreurial:0 "Entrepreurial Spirit"
 SPC_entrepreurial_desc:0 "Entrepreurial spirit is compatible with socialism! Workers must not depend on it to prosper, but must encourage innovation and initiative in our economy."
 SPC_georgism:0 "Promote Agrarian Cooperatives"
 SPC_georgism_desc:0 "The people own land, but the product of it is owned by the society. That's an interesting idea that can help with famines and poverty in the countryside."
 SPC_territorial1:0 "Territorial Policy"
 SPC_territorial1_desc:0 "The Worker's Congress has decided what policy should we follow regarding centralization or decentralization. Now we must begin working on it."
 SPC_self_rule:0 "Comités Autónomos"
 SPC_self_rule_desc:0 "Councils and Committees must be ruled mostly be themselves, so that the transition to anarchy is easier."
 SPC_communal_chamber:0 "Create the Comité Central"
 SPC_communal_chamber_desc:0 "The Central Committee will loosely coordinate and protect the local communes, but it will not be a Parliament or anything of the sort."
 SPC_decentralize:0 "CNT: Decentralization"
 SPC_decentralize_desc:0 "We need to decentralize and delegate. If we keep a strong centralized state, libertarian communism is impossible."
 SPC_communal:0 "Regional Defense Councils"
 SPC_communal_desc:0 "Each region shall have its own Committee that oversees the progress of libertarian communism in the area. They will be dissolved once anarchy is archieved, so that all communes are equal."
 SPC_appointed:0 "Strenghten Civil Governors"
 SPC_appointed_desc:0 "Civilian Governors are to be appointed by the Central Government, and they will have far more power that the city councils and the local unions. Only a united country can defeat capitalism!"
 SPC_lenguage:0 "The Language Question"
 SPC_lenguage_desc:0 "Catalan, Basque, Galician; the all pose an obstacle to proletarian unity, and their mere presence is a reminder of feudal borders and privileges. We must promote the castillian language so that all workers can understand each other and fight for each other!"
 SPC_status_quo:0 "PSOE: Status Quo"
 SPC_status_quo_desc:0 "The territorial policy that the Republic followed, at least during its starting years, was the right one. Those regions that want autonomy should have it, and those who only feel Spanish shouldn't be forced into it."
 SPC_municipal:0 "Townhall Democracy"
 SPC_municipal_desc:0 "The basis of the new Republic should be the local city councils. The Socialist Party is very strong on a local level, and by managing people's needs on a small scale we can truly dominate the new state."
 SPC_many_one:0 "España Integral"
 SPC_many_one_desc:0 "The España Integral concept was introduced in the Constitution of 1931, and it is a policy that we should follow. All provinces should have the right, but not the obligation, of seeking autonomy; always, of course, under socialist leadership."
 SPC_estatutes:0 "Estatutos de Autonomía"
 SPC_estatutes_desc:0 "We can now properly draft the new Estatutes of Autonomy for Catalonia, Galicia and the Basque Country. We need to be careful to ensure that equality is kept and the old feudal privileges are completely destroyed."
 SPC_centralize1:0 "PCE: Centralization"
 SPC_centralize1_desc:0 "Having lots of competing voices slows down the Revolution, and reactionaries might strike back if we are weak and disunited. If we maintain a strong government in Madrid, the Revolution will be strong enough to survive and thrive!"
 SPC_supress:0 "Supress Regional Nationalists"
 SPC_supress_desc:0 "Regional nationalists are just carlists in disguise! We need to crack down hard on those who threaten to disunite the proletarians in favour of their old feudal privileges, we are all equal!"
 SPC_reforms_done:0 "Ley de Organización"
 SPC_reforms_done_desc:0 "Now that we have more or less organized the state, we can combine all our measures into a single law, that can endure the test of time."
 SPC_union_rep:0 "Empower the CNT-UGT Alliance"
 SPC_union_rep_desc:0 "Giving power to the trade unions has a risk: the UGT is a very big union that is aligned with socialists interests and not with ours. We need to begin working on an alliance with them, at least until our rivals are properly defeated."
 SPC_peoples_nav:0 "People's Navy"
 SPC_peoples_nav_desc:0 "Strict discipline is not what our navy needs. Our sailors, that are both workers and the Vanguard of the Revolution, are perfectly fit to manage the navy, replacing admirals with Naval Committees!"
 SPC_cortes:0 "Prietistas: Cortes Generales"
 SPC_cortes_desc:0 "We shouldn't break with the tradition of Spanish Parliamentarism by creating councils with fancy names that pretend to represent the people. Now that we have destroyed the reactionaries and fascists, we should give the voice to the people directly once more."
 SPC_elections:0 "Promise Elections"
 SPC_elections_desc:0 "Our petty struggles with the PCE and the CNT don't represent the will of the people, they are just a contest of personal influence in the unions and the army. We need to promise the people that they will soon have a say in the direction of our Republic."
 SPC_expel:0 "Limit CNT Influence"
 SPC_expel_desc:0 "The CNT is not even a political party; its intervention into national politics is based on threats, violence and lies. If they want to have any influence over the course of the country, they should form a party and win the elections like everybody else."
 SPC_2_chambers:0 "Restore the Senate Proposal"
 SPC_2_chambers_desc:0 "Having a second Chamber for the Parliament is a rightist proposal, that want to go back to the old monarchist Senate. Instead, we can use this second chamber to give voice to regional aspirations and needs, and to further weaken PCE and CNT influence in national politics."
 SPC_shared:0 "Reform the Alianza Obrera"
 SPC_shared_desc:0 "Our alliance with the Caballeristas and the UGT must be formalized through the re-enactment of the Alianza Obrera ( Worker's Alliance ), that organized the Asturian Revolution in 1934. Just like the PCE absorbed the youth wing of the PSOE when it was supposed to be a merger ( the JSU ), we hope that eventually we can absorb the UGT."
 SPC_internal1:0 "Internal Policy"
 SPC_internal1_desc:0 "The Congress has chosen the new government! Now it must work on organizing the new Republic. All 4 factions have different ideas, and if the winners can implement their own, Spain will be set towards one clear path."
 SPC_tuc:0 "CNT: Power to the Unions"
 SPC_tuc_desc:0 "Having a strong executive power is fascist, and having a Parliament is like the illusion of democracy that existed in the old Republic. Only through the unions, the direct voice of the workers, we can begin preparations for libertarian communism."
 SPC_secret_pol:0 "Policía Revolucionaria Popular"
 SPC_secret_pol_desc:0 "The Revolutionary People's Police will be an specialized force that will deal with any fascists and reactionaries that have managed to survive inside our country."
 SPC_comissars:0 "Create the CMDR"
 SPC_comissars_desc:0 "The CNT is very popular within the army ranks. In order to deal with a possible coup, we must create the Military Comissariat for the Defense of the Revolution, that ensures that the army is loyal and ideologically correct."
 SPC_offices:0 "Absorb the PSUC"
 SPC_offices_desc:0 "The PSUC was a succesful political operation that led to the creation of a united Catalan communist party under our leadership. Now they are no longer useful, and they must be absorbed back into the PCE before the develop regionalist tendencies."
 SPC_chairman:0 "PCE: Strong Executive"
 SPC_chairman_desc:0 "The Revolution demands a strong will, and only a reinforced executive is able to deliver that! These emergency powers should be only temporary, as the enemies of the Revolution are destroyed..."
 SPC_monthly_checks:0 "Popular Courts"
 SPC_monthly_checks_desc:0 "Justice is not the patrimony of a select group of ( probably reactionary ) elitists. The Spanish People, free and sovereign, shall be the one that punishes the traitors and the fascists, and acquits those who are truly innocent. They may call it mob justice, it is simply justice."
 SPC_internal_done:0 "Ley de Soberanía"
 SPC_internal_done_desc:0 "After all our changes, we should get them compiled into a single law, that the Second Worker's Congress will approve. It will form the basis for the legal framework of the new regime."
 SPC_new:0 "A New Spain"
 SPC_new_desc:0 "Political and administrative reforms are completed! Spain has truly changed, as the old bourgeois chains have been broken and the people is already enjoying the fruits of their labor!"
 SPC_caballeristas_focus:0 "Caballeristas: Maintain Left-Wing Unity"
 SPC_caballeristas_focus_desc:0 "The War Government, led by Largo Caballero, managed to preserve unity amongst the squabbling left-wing factions, and it will continue to do so now that the Worker's Congress has re-elected Largo Caballero as the new leader!"
 SPC_heal_party:0 "Heal the Socialist Party"
 SPC_heal_party_desc:0 "Ever since Pablo Iglesias died, petty divisions inside our party, the PSOE, have threatened our unity, and the unity of the whole left. The dispute with Prieto and Besteiro that has raged on during this decade needs to end, and we are ready to make concessions to archieve this goal."
 SPC_the_spanish_lenin:0 "\"The Spanish Lenin\""
 SPC_the_spanish_lenin_desc:0 "Largo Caballero is popularly known as \"The Spanish Lenin\". Leaving nicknames aside, he has been a big preponent of further cooperation between the PSOE and the PCE, supporting the formation of the PSUC and the JSU. Now we need to continue this cooperation to ensure a stable government that can defend the Revolution!"
 SPC_placate_unions:0 "Form the Frente Sindical"
 SPC_placate_unions_desc:0 "Cooperation between the UGT and the CNT has been a goal of Largo Caballero since the start of the decade, and now we are in a position where we can make this happen. Although not formally united, as the CNT and the UGT would not accept that (for now), we should encourage the creation of a \"Syndical Front\" that unites all unions under UGT and CNT leadership. This will hopefully decrease the FAI power, as well."
 SPC_frente_sindical:0 "Frente Sindical"

 SPC_postwar: "Spanish Socialist Republic - Post War"
 SPC_first:0 "The First Worker's Congress"
 SPC_first_desc:0 "The Revolution has triumphed! Now that we have finally expelled the ractionaries from Spain, we should convene the Worker's Congress so that we discuss the direction that the country shall take from now on."
 SPC_second:0 "The Second Worker's Congress"
 SPC_second_desc:0 "Our government is, despite all our reforms, still limited by the Worker's Congress. We need to call a second Congress that can approve the basis of the new legal framework, and then dissolve itself so that we rule alone!"
 SPC_navy1:0 "Naval Policy"
 SPC_navy1_desc:0 "The Worker's Congress is also discussing Naval Policy. The CNT and the Prietistas seem to have a heated conflict over the nature of naval leadership, if we should rely on admirals or sailor committees..."
 SPC_militia:0 "Caballeristas-CNT: Militia Army"
 SPC_militia_desc:0 "We destroyed the reactionaries using enthusiastic militias with very high morale. The CNT and the Caballeristas have understood that we can't create a disciplined army, and our morale would plummet if we follow that route. The People in Arms is its best defender!"
 SPC_military1:0 "Military Policy"
 SPC_military1_desc:0 "The Worker's Congress is discussing about the nature of the Army. The Prietistas and the PCE insist that the militia model is inneficient and would not stand a foreign attack, while the CNT and the Caballeristas defend the militias as the most clear expression of the Will of the People."
 SPC_organized:0 "Prietistas-PCE: Organized Army"
 SPC_organized_desc:0 "Our rag-tag militia may be enthusiastic and all, but that's not how wars are won. Both the PCE and the Prietistas have understood that the Defense of the Revolution is a very serious matter, and not some kind of festivity."
 SPC_navy_expansion:0 "Naval 5 Year Plan"
 SPC_navy_expansion_desc:0 "We must expand our Fleet if we want to survive any possible threat from foreign nations. For that reason the Admiralty has aproved a 5 year plan to kickstart the construction of new and modern warships. But to achieve what is planned we first need to expand the current dockyards."
 SPC_carrier:0 "Rebuild the 'Dédalo'"
 SPC_carrier_desc:0 "Dédalo was the first carrier of the Spanish Navy, but it was decomissioned. We shall rebuild it and make it the first carrier where sailors, workers and pilots collectively manage the weapons and the machinery, directing the fury of the people through a moster of steel. That is what a vanguard navy needs."
 SPC_sailor:0 "Sailor School of Barcelona"
 SPC_sailor_desc:0 "Our sailors are enthusiastic, but they could use a bit more skill. If we open a school in Barcelona, perhaps the Prietistas will finally shut up and admit that sailors are just as skilled as admirals are."
 SPC_officer_nav:0 "Officer's Navy"
 SPC_officer_nav_desc:0 "The CNT proposal in nonsensical, you can't apply anarcho-syndicalism to a ship. Our navy won't be able to punish the enemies of the people if it isn't properly led."
 SPC_naval_drill:0 "Naval Drill"
 SPC_naval_drill_desc:0 "Our navy doesn't need to be enthusiastic, it needs to be disciplined. A war ship is like a clock, if something fails it will most likely sink, and we can't afford that."
 SPC_protect_fleet:0 "Protect Our Trade Routes"
 SPC_protect_fleet_desc:0 "We are quite isolated as it is. If the fascists or the capitalists take their chance and cut our trade routes, we might starve. We can't allow that to happen."
 SPC_battleship:0 "A new Battleship Class"
 SPC_battleship_desc:0 "What our navy needs is a group of battleships that are able to win any naval engagement by sinking the reactionary ships. Once that happens, the Revolution will be truly secure."
 SPC_school_nav:0 "Admiral Academy of Cartagena"
 SPC_school_nav_desc:0 "The Spanish People's Navy needs the best leadership. An admiral school ( that will also act as a political filter ) in Cartagena will ensure our navy is properly led. Hopefully that way the CNT can finally shut up about their naval committees proposal."
 SPC_initiative:0 "Officer Initiative"
 SPC_initiative_desc:0 "We need to trust our officers to change the plans if the situation is not developing in a good way. We need to flexible, or we will break."
 SPC_defensive:0 "Preserve Our Men"
 SPC_defensive_desc:0 "Having a disciplined army means that our men are more precious than in a militia-style warfare. Thus we must ensure that casualties are as low as we can."
 SPC_directed_bombardment:0 "Directed Bombardment"
 SPC_directed_bombardment_desc:0 "Just tell the artillero the enemy position, and we will rain hell on the enemy lines!"
 SPC_enthusiasm:0 "An Enthusiastic Army"
 SPC_enthusiasm_desc:0 "Our army should rely in morale, the same morale that motivated the people to rise up against the fascists and reactionaries and liberated us. We shall be unstoppable!"
 SPC_artillery:0 "Artillery Modernization"
 SPC_artillery_desc:0 "Our artillery pieces are pretty outdated. We should consider to get better artillery models."
 SPC_disband_militias:0 "Disband The Militias"
 SPC_disband_militias_desc:0 "The Militias are useless in combat, they only thing they do is intimidation and crime, not to mention the political instability they bring. We need to disband them now!"
 SPC_discipline:0 "A Disciplined Army"
 SPC_discipline_desc:0 "Our army relies on quality and discipline. The soldiers know that they fight for the people, so they will maintain their positions tenaciously and attack with the fury of a million workers!"
 SPC_command:0 "Strenghten The Central Command"
 SPC_command_desc:0 "The Central Command has been pretty powerless... until now. By centralizing army command, we can better organize and plan new strategies, and it also reinforces our political control over the Army..."
 SPC_elected:0 "Elected Officers"
 SPC_elected_desc:0 "Our officers should be elected by the soldiers themselves. That way, we will not form an elitist group, and they will care more about the troops."
 SPC_drive:0 "Recruitment Drive"
 SPC_drive_desc:0 "We need soldiers! Our lax discipline and our revolutionary propaganda should help us expanding our ranks."
 SPC_hospitals:0 "Expand Field Hospitals"
 SPC_hospitals_desc:0 "If we care about our soldiers we must ensure that only bullets, and not disease, are capable of killing them. Through expanded field hospital logistics we will be able to have more endurable soldiers."
 SPC_motorize:0 "Truck Modernization"
 SPC_motorize_desc:0 "Trucks are essential for the transport of goods and soldiers. If we want to ensure that the supply chain functions properly, we need modern trucks."
 SPC_factories_tank:0 "Tank Factories"
 SPC_factories_tank_desc:0 "We can't begin investing in a motorized army if lack military factories to produce vehicles. We need to construct those before we begin our motorization."
 SPC_relampago:0 "Guerra Relámpago"
 SPC_relampago_desc:0 "Our army will strike fast like lighting. The enemy lines will break at a certain point, and we can pierce through there to seize important locations. In a short amount of time, they will be knocked out!"
 SPC_armoured:0 "Armor Modernization"
 SPC_armoured_desc:0 "Focusing on a motorized army without proper tank designs is like shooting ourselves in the foot. We need to ensure we have the best designs before we commit to them."
 SPC_field_engineers:0 "Expand Engineer Corps"
 SPC_field_engineers_desc:0 "If we are going to rely on vehicles, we need to be able to fix them on the spot. The engineers shouldn't be just for building bridges and trenches, they should maintain the tanks and trucks as well!"
 SPC_small_arms:0 "Small Arms Modernization"
 SPC_small_arms_desc:0 "The small arms are the basis of our army. If the infantryman fights with outdated weapons, he will always be in disadvantage, even though his morale might be higher."
 SPC_new_army:0 "A New Army"
 SPC_new_army_desc:0 "From a disorganized militia to a proper army. The new Spanish Army is more than capable of destroying the enemies of the Revolution here and abroad!"
 SPC_relentless:0 "Relentless Attack"
 SPC_relentless_desc:0 "Attack, attack, attack! The fascists and the capitalists need to be destroyed with extreme, unrelenting force, if we want to liberate the workers of the world!"
 SPC_call_arms:0 "Call To Arms"
 SPC_call_arms_desc:0 "We need more soldiers! The Revolution doesn't end at the Pyrenees or at the Duero river, it goes beyond and beyond our borders until the proletarians are free. And to do that, we need to convince our people to join our ranks!"
 SPC_gun_every_hand:0 "A Gun in Every Hand"
 SPC_gun_every_hand_desc:0 "If we are going to recruit more men, we need guns for everyone. Otherwise our brave soldiers would just be cannonfodder for the reactionaries!"
 SPC_3rd:0 "The 3rd Republic"
 SPC_3rd_desc:0 "The Third Spanish Republic has been proclaimed! Under the leadership of the Socialists, it will be a Republic of the Workers, based on the ideals of freedom and equality. It will also, unlike the 2nd Republic, fight against fascism and capitalism!"
 SPC_general:0 "General Elections"
 SPC_general_desc:0 "In order to hear the voice of the people, we will hold a general election, in which all legalized parties will be able to run. The PSOE is the clear frontrunner, but the liberals and republicans are also organizing behind the restored Izquierda Republicana..."
 SPC_housing:0 "Ministerio de Vivienda"
 SPC_housing_desc:0 "We need to create a Ministry that deals specifically with the housing issue. Our cities are about to experience an inmigration and construction boom, and we must be ready for it."
 SPC_healthcare:0 "Create the Seguridad Social"
 SPC_healthcare_desc:0 "Social Security is an excellent idea, and we need to introduce it here. All workers will have guaranteed healthcare and pensions, so they are more free and secure."
 SPC_censorship:0 "Lift Press Censorship"
 SPC_censorship_desc:0 "Censorship and State control over the Press needs to be lifted. Of course, right-wing newspapers such as the ABC will be still banned, but leftist and liberal press shall be permitted."
 SPC_ley_trabajo:0 "Ley del Trabajo"
 SPC_ley_trabajo_desc:0 "We need to unite all labor regulations into a single law. A high minimum wage, power to the unions, safety regulations, enforcement of the 8-hour workday, paid holidays, guaranteed sick and maternity leaves... All of it will be in the same law, that will be enforced throughly."
 SPC_rural_schooling:0 "Rural Schooling"
 SPC_rural_schooling_desc:0 "The right-wing Lerroux government interrupted the rural literacy program initiated in 1931, and subsequent events, such as the civil war, have prevented its restarting. We need to restore the program and begin literacy missions and rural school construction initiatives all over the country!"
 SPC_asalto:0 "Reform the Guardia de Asalto"
 SPC_asalto_desc:0 "The Assault Guard was created by the Old Republic to keep order in the cities, in opposition to the more countryside-based Civil Guard. This Civil Guard is too much of a symbol of landowner power for us to restore, but the Assault Guard can be reinstated to chase anarchist, communist and especially fascist agitators in the urban areas."
 SPC_tax:0 "Restore the Ministerio de Hacienda"
 SPC_tax_desc:0 "The Finance Ministry was absurdly abolished by Largo Caballero, creating a single \"Economic Ministry\" instead. We need to restore it and begin preparations for a comprehensive taxation program and not the chaos we currently have."
 SPC_progressive:0 "Progressive Legislation"
 SPC_progressive_desc:0 "Although Prieto and the republicans opposed women's suffrage in 1931, saying that it would favor the right, we need to overcome those times and protect women's rights. There are also proposals to decriminalize homosexuality that we should look into."
 SPC_stable:0 "Stable Democracy"
 SPC_stable_desc:0 "A bold, leftist democracy has triumphed in Spain. We are not afraid to defend freedom, to protect our workers and to overall improve the lives of the people. Progressive Spain has triumphed over its conservative counterpart, without falling for totalitarianism!"
 SPC_crush_pce:0 "Crush The PCE"
 SPC_crush_pce_desc:0 "The PCE and its surprisingly high influence over the general staff is very dangerous. We need to limit their influence over the army, arrest some of its leadership and disband the JSU and the MAOC. That way they'll be relegated to a controlled opposition."
 SPC_ahv:0 "Expand AHV"
 SPC_ahv_desc:0 "The Altos Hornos de Vizacaya, under proper worker control, has somewhat lowered its production due to the war. We need to give them all the resources they need so that they can expand and increase their steel production."
 SPC_highway:0 "Highway Projects"
 SPC_highway_desc:0 "Spain needs to be properly linked! We need to build highways that go from Madrid to the important cities, such as Bilbao, Valencia, Barcelona, Sevilla and La Coruña. Of course, public and free to use."
 SPC_ban_cnt:0 "Integrate The CNT"
 SPC_ban_cnt_desc:0 "Largo Caballero has always been a big supporter of unity between the UGT and the CNT. Now that we find ourselves in a position of power, we need to encourage the integration of the CNT into the UGT, with force if needed be."
 SPC_empower_ugt:0 "Empower The UGT"
 SPC_empower_ugt_desc:0 "The UGT, bolstered with many former members of the CNT, needs to be empowered, making it the connection between the workers and the Republic."
 SPC_disarm:0 "Disarm The Communists"
 SPC_disarm_desc:0 "Communist militias still pretend to have some authority. They need to be disarmed by the War Ministry to preserve the Republic, and their guns will be seized by the army!"
 SPC_motorizada:0 "Expand 'La Motorizada'"
 SPC_motorizada_desc:0 "\"La Motorizada\" is a socialist paramilitary that has its characteristic name due to their motorbikes. They can be turned into an official army unit, and replace those motorbikes with trucks!"
 SPC_semi:0 "Semi-Independent Judiciary"
 SPC_semi_desc:0 "An independent judiciary is the basis of equality, so we should be less involved in it. However, we need to ensure that all judges will still follow socialist ideas..."
 SPC_revolution_halt:0 "Halt The Revolution"
 SPC_revolution_halt_desc:0 "The Revolution has triumphed! The remaining anarchists and the POUM are still calling for the continuing of the Revolution, through violence and crime. We need to halt popular enthusiasm and get the people to accept that we are here to stay."
 SPC_worker_cond:0 "Plan del Bienestar Obrero"
 SPC_worker_cond_desc:0 "We are workers who came to power through a Worker's Revolution, and our main idea is to empower the lower classes and make their existance better. We need to ensure that the workers are properly represented and treated in the new Spain."
 SPC_woo:0 "Reconcile the Prietistas"
 SPC_woo_desc:0 "The old divide between Prietistas and Caballeristas makes no sense now. We should integrate the supporters of Prieto and Besteiro, offer them positions of power and work towards healing our party. That's what Pablo Iglesias would have wanted."
 SPC_dgs:0 "Expand The DGS"
 SPC_dgs_desc:0 "The Dirección General de Seguridad, properly restored with socialist officers and policemen, will be very useful in dealing with those who still resist; fascists, capitalists and stalinists."
 SPC_new_kind:0 "New Kind of Republic"
 SPC_new_kind_desc:0 "The Third Spanish Republic is an evolution of the old, and failed, liberal Republics. The workers are represented through the UGT, and the PSOE works to uplift the people and end poverty. This new kind of Republic will endure!"
 SPC_communes:0 "United Iberian Communes"
 SPC_communes_desc:0 "The CNT-FAI has finally secured full power, getting rid of both stalinists and socialists. Now we must convene a CNT Congress to decide in what direction we should take our country."
 SPC_union_initiatives:0 "Union Initatives"
 SPC_union_initiatives_desc:0 "The trade unions have proposed several industrial initiatives to put the people to work. The Central Committee needs to have them approved, so that works can begin as soon as we can!"
 SPC_industries:0 "Industries for the Workers"
 SPC_industries_desc:0 "Collective ownership of the means of production ensures that the benefits of work go to the people directly. We need to build more factories that serve the people, and not some wealthy oligarchs."
 SPC_communal_cooperation:0 "Communal Cooperation"
 SPC_communal_cooperation_desc:0 "Different unions and communes need to cooperate to build large projects, such as railways, industrial complexes, or mines. La unión hace la fuerza!"
 SPC_arms:0 "Arms for the Revolution"
 SPC_arms_desc:0 "The capitalists, fascists and stalinists out there are still seeking to destroy us! We need to direct our efforts towards military construction so that the Revolution can be defended!"
 SPC_railway:0 "Coruña-Málaga Railway"
 SPC_railway_desc:0 "A grand railway, connecting Málaga with La Coruña, will serve to unite the people and  better connect our industrial centers."
 SPC_people:0 "República Popular Española"
 SPC_people_desc:0 "The Spanish People's Republic has been proclaimed! Through the ideas of democratic centralism, the Communist Party of Spain will guide our people towards communism!"
 SPC_secretariat:0 "Strenghten the Central Secretariat"
 SPC_secretariat_desc:0 "The Central Secretariat of the PCE is the most important office in the country. We need to strenghten its power, or we will fall to factionalism, disunity and perhaps even another civil war!"
 SPC_cpsr:0 "Form The CPDR"
 SPC_cpsr_desc:0 "The People's Comissariat for the Defense of the Revolution ( Comisariado del Pueblo para la Defensa de la Revolución ) will help us chase fascists and anarchists and eliminate all threats to our Republic!"
 SPC_party:0 "Strengthen The Party"
 SPC_party_desc:0 "The PCE is still relatively weak on a social level, and we need to change that if we want to fully control Spain. The JSU need to be greatly expanded, the MAOC integrated into the army, friendly officers empowered, and a merge with the PSOE should be considered."
 SPC_destroy_cnt:0 "Destroy The CNT"
 SPC_destroy_cnt_desc:0 "The CNT is the only thing that can pose a threat to our power. They misguide and deceive the workers into thinking that communism can be archieved instantly, and by doing that they are sabotaging our efforts. They need to be eliminated, quickly."
 SPC_soviets:0 "Merge with the PSOE"
 SPC_soviets_desc:0 "The PSOE and the PCE share many things, and the PCE itself splitted from the Socialist Party back in 1922. Following the example of the JSU, we need to unite into a Unified Spanish Socialist Party, that can better resist attacks from anarchist and counter-revolutionaries. The moderate sector of the PSOE, the Prietistas, will have to join us, or be destroyed."
 SPC_proletarian:0 "Dictadura del Proletariado"
 SPC_proletarian_desc:0 "Spain has gone from a Bourgeois Dictatorship, where the capital ruled supreme and fat oligarchs lived off the hardworking Spanish people; to a Proletarian Dictatorhip, where the lower classes lead the country towards communism!"
 SPC_leap:0 "Gran Plan de Modernización"
 SPC_leap_desc:0 "A Grand Modernization Plan is needed for this country to truly industrialize. We won't use a time limit like in the USSR, but the central idea is the same as in the 5-Year Plans: work for the Revolution!"
 SPC_railroad:0 "Railroad Expansion"
 SPC_railroad_desc:0 "We need to expand and improve our railway network. It was not very big, and the destruction caused by the war has left it very damaged. Let's get to work!"
 SPC_centers:0 "Develop Industrial Centers"
 SPC_centers_desc:0 "Industrial centers, like Madrid, Barcelona or the Basque Country, need to be developed so that they meet all our new needs."
 SPC_resource:0 "Plan Minero Nacional"
 SPC_resource_desc:0 "If our industries lack resources, we should work into getting our workers to get them, instead of buying them from oppresive capitalists."
 SPC_kulaks:0 "End Castillian Small Owners"
 SPC_kulaks_desc:0 "Castillian Small Owners have defied our agrarian policy since the beggining, and even during the old Republic they opposed the land redistribution of Andalusian land while voting for the right. Now their farms will be collectivized!"
 SPC_quotas:0 "Production Quotas"
 SPC_quotas_desc:0 "We will never increase our production until we put production quotas to meet. Otherwise the people don't seem to work as hard as they should."
 SPC_rural_education:0 "Enact the PAER"
 SPC_rural_education_desc:0 "The Plan de Alfabetización y Educación Rural ( Rural Literacy and Education Plan ) will finish what the old Republic started, and teach our people how to read, giving them a future outside of their villages!"
 
 SPC_cnt_faistas:0 "Faístas"
 SPC_cnt_faistas_desc:0 "The Revolution has been won, and our marxist rivals have been neutralized. We can't wait any longer: we shall install Libertarian Communism now!"
 SPC_cnt_treintistas:0 "Treintistas"
 SPC_cnt_treintistas_desc:0 "Our society is still not ready for Libertarian Communism. We must listen to the Treintista faction of the CNT and set up a transitionary state that gradually paves the way for anarchy!"
 SPC_destroy_pce:0 "Destroy the PCE"
 SPC_destroy_pce_desc:0 "The complete destruction of the PCE is necessary for the survival of the Revolution. If we wait any longer, they might strike back, with the help of their stalinist masters. Let's eliminate them now!"
 SPC_transform_society:0 "Transform Society"
 SPC_transform_society_desc:0 "Transitioning from a bourgeois society to a free classless society is not easy, and we have lots of work to do. The people need to know that everyone is equal, there should be no hierarchy, and that they need to completely abandon their religious beliefs, amongst other things, if they want to be truly free."
 SPC_burgeois_vices:0 "End Bourgeois Vices?"
 SPC_burgeois_vices_desc:0 "Bourgeois vices, such as drinking, have been corrupting the workers for long, keeping them depressed and addicted to a drug. If we want to ensure that every worker reaches its full potential, we should consider moving against taverns. Although some others say that we are in no position to ban them, as anarchist as we are..."
 SPC_dissolve_political_parties:0 "Dissolve Political Parties"
 SPC_dissolve_political_parties_desc:0 "Political Parties are unnecessary in the new society. Although the Revolution and the subsequent struggles have caused lots of parties to dissapear, there are some that still remain, such as the PSOE, the POUM or even our own Syndicalist Party. All of them must be dissolved."
 SPC_collective_leadership:0 "Collective Leadership"
 SPC_collective_leadership_desc:0 "Our society won't have a Head of State, a Head of Government or a General Secretary. Leadership shall be assumed by committees and councils, both in the more local level and in the central level. Everyone speaks for himself, everyone is the master of his own fate!"
 SPC_no_hierarchy:0 "Comunismo Libertario"
 SPC_no_hierarchy_desc:0 "As all hierarchy dissolves, all that remains is the loose Federation of councils that provides mutual defense for its members. Workers across the world shall be inspired by our success at liberating the people from their chains!"
 SPC_cooperate_socialists:0 "Cooperate with the Socialists"
 SPC_cooperate_socialists_desc:0 "The Socialist Party might be marxist and all, but they still have significant influence, and through their union, the UGT, we can begin cooperation with them. The POUM should consider joining our Front, as well."
 SPC_transitionary_state:0 "The Transitionary State"
 SPC_transitionary_state_desc:0 "Libertarian Communism is coming, but we need to ensure that everyone is ready for it. We can't afford to fail at this experiment."
 SPC_revolucion_sindicalista:0 "Revolución Sindicalista"
 SPC_revolucion_sindicalista_desc:0 "We should shift power from the various CNT-FAI committees to the trade unions, in a local and state level. They are direct way for the worker to have his voice heard!"
 SPC_the_individual_revolution:0 "An Individual Revolution"
 SPC_the_individual_revolution_desc:0 "Each individual must experience his own Revolution. Not everyone is ready for complete freedom, we must help those who still cling on to their chains to embrace the new state of affairs."
 SPC_secure_womens_liberation:0 "Mujeres Libres"
 SPC_secure_womens_liberation_desc:0 "Everyone is completely free from their chains, and that includes women. We must ensure that the Women's Liberation that happened during the Revolution results in full gender equality once Libertarian Communism is archieved."
 SPC_educate_people:0 "Educate the People"
 SPC_educate_people_desc:0 "It is very important to educate the masses. Culture, and not propaganda, will be the way people will become ready for the removal of hierarchy and Libertarian Communism. To ensure that it doesn't result in indoctrination, these education initiatives will be managed independently by unions and cooperatives at a local level."
 SPC_apolitical_unions:0 "Apolitical Unions"
 SPC_apolitical_unions_desc:0 "Although we allowed political parties for the time being, they will be eventually dissolved. And unions who act as political parties will get the same treatment. Unions are the voice of the workers, not a place to discuss political theory."
 anarchist_hog:0 "Central Committee"
 anarchist_fm:0 "Diplomatic Committee"
 anarchist_em:0 "Industrial Committee"
 anarchist_sm:0 "Security Committee"
 SPC_poum:0 "POUM"
 SPC_poum_long:0 "Partido Obrero de Unificación Marxista"
 pce_destroyed_cnt:0 "The PCE has been destroyed"
 spc_treintistas:0 "Supported the Treintista faction"
 spc_faistas:0 "Supported the Faísta faction"
 
 CAT_first_election:0 "The First Election"
 CAT_first_election_desc:0 "After a month of protests and trouble, we have managed to hold the first elections of the Catalan Republic! The first of many, we hope."
 CAT_esquerra:0 "ERC Victory!"
 CAT_esquerra_desc:0 "The Catalan Republican Left has won the elections, as everyone expected. Lluís Companys is ready for defending the Catalan Republic and implementing the reforms our people needs."
 CAT_lliga:0 "LC-UDC Victory!"
 CAT_lliga_desc:0 "Unexpectedly, the coalition between the Catalonian League and the Catalonian Democratic Union has won the elections. They are will defend christian democracy and they are open towards cooperation with Spain."
 CAT_restore_order:0 "Restore Order"
 CAT_restore_order_desc:0 "During these last weeks, leftist agitators have tried to destroy our democracy. Now that we have democratic legitimacy, it is time to stop them."
 CAT_catalan_constitution:0 "The Catalan Constitution"
 CAT_catalan_constitution_desc:0 "It is time for our Parliament to begin discussing the nature of our new Constitution. A new era begins!"
 CAT_welfare_state:0 "A Welfare State"
 CAT_welfare_state_desc:0 "If we want to unite our people we need them to trust the state, and there isn't a better way of doing so than providing them with healthcare and protection."
 CAT_education_reform:0 "Education Reform"
 CAT_education_reform_desc:0 "One of ERC's main goals is to reform education to make it more accessible and to improve its quality. The catalan language shall also be reinforced and promoted, to reinforce the idea of an independent Catalonia."
 CAT_agrarian_reform:0 "Agrarian Reform"
 CAT_agrarian_reform_desc:0 "While the problem is smaller than in southern Spain, Catalonia has also problems regarding the ownership of the land. While we tried to legislate about that when we were under Spain, now we are free to solve the problem fully!"
 CAT_enemies_republic:0 "Unitat de Policia Secreta"
 CAT_enemies_republic_desc:0 "We have to crush those who oppose the Catalan Republic, and we have to do it quickly. From the CNT to the communists, the monarchists and the pro-spanish liberals, they are all a threat to our existence, and they will be silenced with our new intelligence service."
 CAT_free_catalonia:0 "A Free Catalonia"
 CAT_free_catalonia_desc:0 "We have managed to outmaneouver the enemies of democracy and secure freedom for our people. Because it is democracy what makes Catalonia great!"
 CAT_sometent:0 "Restore the Sometent"
 CAT_sometent_desc:0 "The Sometent, a citizen police group whose history dates to the Middle Ages, earned a bad reputation in Alfonso's reign because of their fights against revolutionaries and criminals to defend private property. Abolished in 1931, we shall restore it, so those workers learn their place."
 CAT_catholic_welfare:0 "Catholic Welfare"
 CAT_catholic_welfare_desc:0 "It's not christian to let people starve and die in the streets. We shall support state charity through the catholic church, and begin organizing a proper welfare system to help the poor while respecting those who earned their wealth."
 CAT_textile_industry:0 "Support the Textile Industry"
 CAT_textile_industry_desc:0 "The Lliga has a lot of ties with the industrial barons of the textile sector. We have to take benefit of this, offering them concessions that will improve the economy!"
 CAT_catholic_universities:0 "Open Catholic Universities"
 CAT_catholic_universities_desc:0 "To protect the catalan language, and promoto catholic teachings, we shall co-finance the construction of many univiersities with the catholic church."
 CAT_poum_vic:0 "POUM Victory!"
 CAT_poum_vic_desc:0 "Against all odds, the Worker's Party of Marxist Unification has won the election! It is time to bring the ideals of the Bolshevik Revolution to Catalonia..."
 CAT_psuc_victory:0 "PSUC Victory!"
 CAT_psuc_victory_desc:0 "Against all odds, the Unified Socialist Party of Catalonia has won the election! It is time to bring the Marxist ideas to this nation, and free catalan workers from their chains."
 CAT_militias_seize_streets:0 "The Militias Seize the Streets"
 CAT_militias_seize_streets_desc:0 "Our first action in government will be declaring the Estate of Emergency and allowing our militias to imprision those who threaten the worker's revolution. We shall also begin to ban political parties, starting with the Lliga, and purge communists of the rivaling faction."
 CAT_abolish_parliament:0 "Abolish the Parliament"
 CAT_abolish_parliament_desc:0 "After purging our opponents, the Parliament is no longer useful to us. To complete our takeover, the Parliament shall transfer all its powers to the Catalan Worker's Council, dominated by the ruling party."
 CAT_slow_col:0 "Slow Collectivization"
 CAT_slow_col_desc:0 "We can't just walk into our land and collectivize it, that would cause famines. We shall proceed slowly but surely, same as in the factories, to ensure our economy is not damaged by collectivization."
 CAT_ally_erc:0 "Ally ERC"
 CAT_ally_erc_desc:0 "We should integrate Esquerra Republicana into our power structure, whether they like it or not! That will give us legitimacy."
 CAT_pol_comissars:0 "Political Comissars"
 CAT_pol_comissars_desc:0 "To control our society, and especially the military, we shall create political comissars loyal to the party, with full competences to accuse someone of being an enemy of the revolution."
 CAT_socialist_education:0 "Socialist Education"
 CAT_socialist_education_desc:0 "We have to reform education if we want to promote socialism and communism in our younger generations. We shall also promote technical advancement to showcase it as the archievements of the regime!"
 CAT_red_catalonia:0 "A Red Catalonia"
 CAT_red_catalonia_desc:0 "We have managed to bring the proletarian revolution to this country and destroy the burgoisie! A brighter future for the workers begins."
 CAT_inmediate_col:0 "Immediate Collectivization"
 CAT_inmediate_col_desc:0 "The Revolution can't wait! We shall collectivize our lands immediately, and those who resist will be shot!"
 CAT_ally_cnt:0 "Ally the CNT"
 CAT_ally_cnt_desc:0 "The CNT was defeated by the social-fascist government, but we have to rehabilitate them. They will be a poweful ally in the class war we are waging."
 CAT_ban_catholicism:0 "Ban Catholicism"
 CAT_ban_catholicism_desc:0 "Religion is the opium of the people! For centuries the church has protected the powerful and mistreated the weak, exploiting them and benefitting from their labour without producing anything but smoke and words. Well, now they will taste our bullets!"
 CAT_empower_unions:0 "Empower the Unions"
 CAT_empower_unions_desc:0 "We have to allow the workers to have more power in our regime. We shalll empower the unions to strenghten the voice of the average worker."
 
 CAT_cnt_takeover:0 "The CNT Takes Over!"
 CAT_cnt_takeover_desc:0 "The CNT has managed to destroy Companys' burgeois regime, and catalonian workers will now know how true freedom looks like!"
 CAT_new_society:0 "A New Society"
 CAT_new_society_desc:0 "With our arrival into power, everything must change. This burgeois society will be destroy, and the workers will truly take over!"
 CAT_destroy_churches:0 "Destroy the Churches"
 CAT_destroy_churches_desc:0 "The Catholic Church has been supporting the aristocrats since the Middle Ages, enforcing a brutal regime on the average worker. To prevent them from continuing to poison the people's minds, we will burn the churches and kill the priests!"
 CAT_hunt_burgoisie:0 "Hunt the Bourgeoisie"
 CAT_hunt_burgoisie_desc:0 "They shall suffer. We will walk into their mansions, we will walk into their casinos, we will walk into their clubs, and they will pay for eveything they have done to us workers."
 CAT_false_communists:0 "Destroy the False Communists"
 CAT_false_communists_desc:0 "How can a Proletarian DICTATORSHIP mean freedom for the workers? Libertarian communism is the true way, and those who pretend to care for the workers while they try to enslave them, like the POUM and especially the PSUC, shall suffer."
 CAT_democratic_comitees:0 "Democratic Committees"
 CAT_democratic_comitees_desc:0 "The basis of our regime will be the democratic, worker committees, that will elect their representatives for the Congress of the Unions and manage their local communes."
 CAT_equalize_wages:0 "Equalize Wages"
 CAT_equalize_wages_desc:0 "Until we gain more land and are able to implement anarchism fully, the archaic concept of wages will have to be used. However, they will be equal for everybody!"
 CAT_enforce_gender:0 "Enforce Gender Equality"
 CAT_enforce_gender_desc:0 "How can we pretend we care about equality when our femenine comrades are being discriminated for their sex? Gender equality will be enforces through the country, and true equality will be archieved!"
 CAT_expand_militias:0 "Expand Worker's Militias"
 CAT_expand_militias_desc:0 "A free people is an armed people. We shall distribute more weapons to the people and organize a militia to defend the revolution."
 CAT_hospital_construction:0 "Hospital Construction"
 CAT_hospital_construction_desc:0 "We have to improve the life of the workers, and a good way of doing that is building free hospitals through Catalonia for everyone to use! Health will no longer be a privilege!"
 CAT_revolutionary_cat:0 "A Revolutionary Catalonia"
 CAT_revolutionary_cat_desc:0 "We have managed to implement libertarian communism! A great archievement that proofs that workers can do everything when they are united."
 CAT_collectivize_factories:0 "Collectivize the Factories"
 CAT_collectivize_factories_desc:0 "All private property shall end immediately. Worker committees will take over the factories and restart production for the people and not for a rich, fat burgeois."
 CAT_collectivize_fields:0 "Collectivize the Fields"
 CAT_collectivize_fields_desc:0 "After our success with factories, we shall confiscate all the land and for collective farms with unemployed farmers. Those who oppose this will be shot!"
 
 CAT_catalan_economy:0 "The Catalan Economy"
 CAT_catalan_economy_desc:0 "Now that we have our political matters sorted out, it is time for us to improve our economy with ambitious projects!"
 CAT_tarragona:0 "Expand Tarragona Port"
 CAT_tarragona_desc:0 "We need strong maritime connections with the rest of the world if we want to survive. To pursue this goal, we shall expand the port facilities in the city of Tarragona!"
 CAT_barcelona:0 "Expand Barcelona Port"
 CAT_barcelona_desc:0 "We need strong maritime connections with the rest of the world if we want to survive. To pursue this goal, we shall expand the port facilities in our capital, Barcelona."
 CAT_sccn_focus:0 "Create The SCCN"
 CAT_sccn_focus_desc:0 "It is time to seize old SECN assets and create the Catalan Society of Naval Construction, to increase our naval output!"
 CAT_agriculture:0 "Modernize Catalan Agriculture"
 CAT_agriculture_desc:0 "If want to have an impact on the world market we need to improve our agricultural output. We shall use the most modern methods to ensure our agriculture is profitable."
 CAT_bellmut:0 "Expand Bellmunt del Priorat"
 CAT_bellmut_desc:0 "Bellmut del Priorat's lead mines should be expanded to lower the costs of bullet production and reduce unemployment."
 CAT_railway:0 "Expand our Railway Network"
 CAT_railway_desc:0 "Our infrastructure is quite good already, but with further expansion it will give a dramatic boost to our industry!"
 CAT_urbanization:0 "Support Urbanization"
 CAT_urbanization_desc:0 "We need to promote migration from the countryside to Barcelona and other big cities. Our industries will need more people quite soon!"
 CAT_diversify_industry:0 "Diversify Our Industry"
 CAT_diversify_industry_desc:0 "Our industry relies too much in the textile sector. No more! We shall begin diversifying our industrial sector to produce everything we need."
 CAT_military_investments:0 "Military Investments"
 CAT_military_investments_desc:0 "We have to expand our military budget if we want to keep our armed forces equipped and ready. Now it is the time for these projects."
 CAT_military_rd:0 "Military R&D"
 CAT_military_rd_desc:0 "It is said that war fuels techological advancement, and our government strongly believes that. We shall expand the military R&D fund to modernize our equipment and its production faster."
 CAT_defend_skies:0 "Defend our Skies"
 CAT_defend_skies_desc:0 "Being a small country, our industry is very concentrated, which makes us vulnerable to enemy bombers. We have to fix that!"
 CAT_refineries:0 "Catalan Refineries"
 CAT_refineries_desc:0 "We have to use our military R&D funds to create a large scale synthetic fuel and rubber production. That way, we'll be able to build a larger airforce and navy."
 CAT_paisos:0 "Països Catalans Development Projects"
 CAT_paisos_desc:0 "We have finally united Catalonia, now it is time to develop Valencia and the Baleares as much as we have developed Catalonia!"
 CAT_corredor:0 "Corredor Mediterrani"
 CAT_corredor_desc:0 "We have to extend our railway lines to unite all our peninsular coast. The Mediterranean Corridor will go from Alacant to Girona, dynamizing our economy."
 CAT_balearic_port:0 "Expand Balearic Ports"
 CAT_balearic_port_desc:0 "We have to expand Palma de Majorca's port facilities to increase our naval production and better connect the Baleares to our country."
 CAT_aim_project:0 "The A.I.M. Project"
 CAT_aim_project_desc:0 "The Mediterranean Industrial Area Project ( Àrea Industrial Mediterrània, AIM ) will create a solid industrial base in our country, especially in Valencia and Baleares, where our investments will be targeted at."
 
 CAT_catalan_army:0 "The Catalan Army"
 CAT_catalan_army_desc:0 "If we want to fight again, we have to organize a proper military. The command chain shall be re-organized, equipment will be redistributed, new officers will be promoted and new drilling techniques will be introduced."
 CAT_conscript_militias:0 "Conscript the Militias"
 CAT_conscript_militias_desc:0 "We can't let nationalist militias, like the Escamots, remain separate from state control. All militias shall be dissolved and integrated into our growing army."
 CAT_command_chain:0 "Organize the Command Chain"
 CAT_command_chain_desc:0 "We have to organize the command structure. A proper General Staff will be formed, military regions will be created, and our best officers will be given a promotion."
 CAT_exercit:0 "Exèrcit de Terra"
 CAT_exercit_desc:0 "Our new army, the Exèrcit de Terra ( Land Army ) is ready to fight. Now our country will be unstoppable!"
 CAT_offense:0 "Focus on Quality"
 CAT_offense_desc:0 "Our army will be, above all, proffesional. We shall bomb our enemies and then destroy them with our men!"
 CAT_academy:0 "Acadèmia d'Artilleria"
 CAT_academy_desc:0 "If we want to develop our firepower theories we need a good artillery. To archieve that goal, we shall create the Acadèmia d'Artilleria ( Artillery Academy ) in Barcelona."
 CAT_staff:0 "Reorganize the Estat Major"
 CAT_staff_desc:0 "We have to ensure that only the best commanders and theorists are in charge of our land army. If we want to crush the enemy with our numbers, we need mastermind tacticians."
 CAT_elite_army:0 "An Elite Army"
 CAT_elite_army_desc:0 "We have archieved our goal. The Catalan Army is one of the best in the world, with each of our soldiers worth at least 3 foreign soldiers! Maybe not, but that's what the propaganda will say."
 CAT_planning:0 "Focus on Planning"
 CAT_planning_desc:0 "Instead of focusing on the individual soldier, we should focus on the bigger picture. Battle Planning will lead us to victory!"
 CAT_mass_recruit:0 "Mass Recruitment Campaign"
 CAT_mass_recruit_desc:0 "We need to conscript as many people as possible, without damaging our production capabilities, if we want to wage war sucessfully"
 CAT_escola:0 "Escola de Planificació Militar"
 CAT_escola_desc:0 "A new military planning school will improve the strategic knowledge of our officers and allow them to perfect their tactics."
 CAT_grand_army:0 "A Grand Army"
 CAT_grand_army_desc:0 "We have archieved our goal. The Catalan Army has been expanded and improved, and it stands ready to fight its enemies!"
 CAT_muntanya:0 "Cos d'Infanteria de Muntanya"
 CAT_muntanya_desc:0 "We have to organize our mountain forces to increase their effectiveness in battle."
 
 CAT_catalan_navy:0 "The Catalan Navy"
 CAT_catalan_navy_desc:0 "Catalonia has always been a sea-oriented nation. We have to organize a fleet to dominate the seas!"
 CAT_purchase_old_ships:0 "Purchase Old Ships"
 CAT_purchase_old_ships_desc:0 "We need ships. To get them, we shall make a national effort and buy some old ships from all around the world."
 cat_more_ships:0 "§GWe will gain a small fleet in Barcelona!§!
 CAT_new_admiralty:0 "New Admiralty"
 CAT_new_admiralty_desc:0 "We have to assemble our best naval commanders and form a proper admiralty for our new navy."
 CAT_dispute_med:0 "Dispute the Mediterranean"
 CAT_dispute_med_desc:0 "Be careful, Italy! Watch out, Britain! A new contender has arrived for Mediterranean dominance!"
 CAT_submarine_fleet:0 "A Submarine Fleet"
 CAT_submarine_fleet_desc:0 "We can't afford to build a surface fleet, but we can mass-produce submarines to keep our seas secured... from the bottom."
 CAT_study_foreing_subs:0 "Study Foreign Subs"
 CAT_study_foreing_subs_desc:0 "We must observe the designs that the big naval nations have in order to have a modern submarine fleet."
 CAT_dominate_submarine:0 "Dominate Submarine Warfare"
 CAT_dominate_submarine_desc:0 "We are a very small country. If we want to have any chance at the naval war, we have to become masters of it."
 CAT_improve_naval_prod:0 "Improve Naval Production"
 CAT_improve_naval_prod_desc:0 "We don't have many dockyards, so we must ensure that we make the most profit from them as possible."
 CAT_surface_fleet:0 "A Surface Fleet"
 CAT_surface_fleet_desc:0 "How can we win the naval war if we don't have ships!? Those submarines are a ridiculous idea, we need conventional ships."
 CAT_convoy_protection:0 "Protect our Convoys"
 CAT_convoy_protection_desc:0 "We have to keep our shipping safe if we want to trade with the world. Those submarines will pay!"
 CAT_capital_ship:0 "Capital Ship Projects"
 CAT_capital_ship_desc:0 "We can't expect to be taken seriously if we don't have any capital ships. We shall begin preparations for the construction of a big battleship!"
 
 CAT_catalan_airforce:0 "The Catalan Airforce"
 CAT_catalan_airforce_desc:0 "We can't neglect the war in the air: we should begin building an airforce as soon as we can."
 CAT_buy_fighters:0 "Buy Old Fighters"
 CAT_buy_fighters_desc:0 "We have to buy leftover fighters from all over the world to begin building our airforce."
 CAT_buy_bombers:0 "Buy Old Bombers"
 CAT_buy_bombers_desc:0 "To increase our offensive capabilities, we shall buy old bombers from all over the world and adapt them for our use!"
 CAT_air_command:0 "Exèrcit de l'Aire"
 CAT_air_command_desc:0 "With the creation of the Army of the Air, we can begin to innovate in the world of aerial military tactics!"
 CAT_focus_fighters:0 "Focus on Fighters"
 CAT_focus_fighters_desc:0 "The basis of our airforce will be composed by fighters. That will maintain our air superiority!"
 CAT_focus_bombers:0 "Focus on Bombers"
 CAT_focus_bombers_desc:0 "Why having an airforce if we can't use it? We shall use bombers to terrorize our enemies from the skies!"
 CAT_expand_airbases:0 "Airbase Expansion"
 CAT_expand_airbases_desc:0 "Our airforce is rapidly growing, and we need to expand our infrastructure to support it."
 
 CAT_befriend_spain:0 "Cooperate With Spain"
 CAT_befriend_spain_desc:0 "Forces of democracy have managed to prevail in Spain! If we try to cooperate with them, we can ensure our border stays safe and try to ease the tension with our most important neighbour."
 CAT_spanish_auto:0 "Industry cooperation"
 CAT_spanish_auto_desc:0 "A lot of much needed Spanish companies left Catalonia and vice-versa during the war. We will make deals with the Spanish Government to try and restore how they were before, which both parties will benefit from and will better the ties with our neightbour."
 CAT_spanish_investments:0 "Spanish Investments"
 CAT_spanish_investments_desc:0 "With the succesful deals we brokered, spanish companies have resumed and expanded their investments in our country."
 CAT_research_coop:0 "Research Cooperation With Spain"
 CAT_research_coop_desc:0 "To bolster scientific advance in our countries, we shall promote a technology sharing program that will unite our brightest minds and make them reach their full potential."
 CAT_spanish_ally:0 "A Spanish Ally"
 CAT_spanish_ally_desc:0 "We will try to secure an alliance with the spanish without giving any inch of sovereignty, otherwise we will try to find French support to protect our independence."
 CAT_joint_exercises:0 "Joint Land Exercises"
 CAT_joint_exercises_desc:0 "We shall organize some military training exercises with the spanish army to improve our fighting effectiveness in case the French have any funny ideas."
 CAT_joint_air:0 "Joint Aerial Exercises"
 CAT_joint_air_desc:0 "We shall organize some aerial exercises with the spanish airforce to learn from them and improve our aerial force."
 CAT_pyrenees_wall:0 "The Pyrenees Wall"
 CAT_pyrenees_wall_desc:0 "To protect our two countries, we shall fortify our northern border and prevent European invaders from threatening us."
 CAT_join_iaect:0 "Join the IAECT"
 CAT_join_iaect_desc:0 "We are part of Ibero-America too! We will attempt to join the IAECT to enjoy its economical advantages."
 
 CAT_paisos_catalans:0 "Països Catalans"
 CAT_paisos_catalans_desc:0 "We can't cooperate with our oppressors, especially now that they are under a totalitarian regime. We shall defy them and unite all catalan-speaking peoples!"
 CAT_approach_britain:0 "Approach Britain"
 CAT_approach_britain_desc:0 "We need foreign help if we want to fight Spain. Britain should be wiling to work with us as long as we stay loyal to them."
 CAT_approach_france:0 "Approach France"
 CAT_approach_france_desc:0 "We should temporarily renounce to our claims in Catalunya Nord to get support from France, that will spell doom for Spain!"
 CAT_pan_catalanist:0 "Pan-Catalanist Campaign"
 CAT_pan_catalanist_desc:0 "Before we go into the offensive, we shall show valencians and majorcans that they are catalans and that they'll be better off with us."
 CAT_demand_valencia:0 "Demand Valencia"
 CAT_demand_valencia_desc:0 "It is the time. We shall demand Valencia, and if Spain refuses, we shall crush them!"
 CAT_integrate_valencia:0 "Integrate Valencia"
 CAT_integrate_valencia_desc:0 "Valencians still don't view themselves as true catalans. We should fix that."
 CAT_demand_baleares:0 "Demand the Balears"
 CAT_demand_baleares_desc:0 "It is the time. We shall demand the Balears, and if Spain refuses, we shall crush them!"
 CAT_integrate_baleares:0 "Integrate the Balears"
 CAT_integrate_baleares_desc:0 "Majorcans still don't view themselves as true catalans. We should fix that."
 CAT_catalan_irredentism:0 "Catalan Irredentism"
 CAT_catalan_irredentism_desc:0 "We have united the catalan countries, but there are more catalan speakers out there waiting to be liberated. East Aragon, the Rousillon and Sardinia are all claimable using the right diplomacy."
 
 CAT_defend_revolution:0 "Defend The Revolution"
 CAT_defend_revolution_desc:0 "We can't risk losing what we've archieved. We shall defend the revolution in Catalonia, defying spanish and french capitalists!"
 CAT_go_ussr:0 "Ally The USSR"
 CAT_go_ussr_desc:0 "We need an ally if we want to survive. The Soviet Union seems the most logical choice."
 CAT_soviet_engineers:0 "Soviet Technical Aid"
 CAT_soviet_engineers_desc:0 "We shall use soviet technical advancements to create a better Catalonia, a stronger one."
 CAT_soviet_advisors:0 "Soviet Military Advisors"
 CAT_soviet_advisors_desc:0 "We need soviet expertise our our newly formed army, and the soviets are more than wiling to provide it."
 CAT_not_pass:0 "No Passaran!"
 CAT_not_pass_desc:0 "France and Spain will try to destroy our glorious revolution, but all their attempts will be futile. Catalonia knows no masters!"
 CAT_go_alone:0 "We Stand Alone"
 CAT_go_alone_desc:0 "We can't trust the soviets and their ideological fallacies. We have to stand on our own to defend our revolution."
 CAT_prepare_inevitable:0 "Prepare For The Inevitable"
 CAT_prepare_inevitable_desc:0 "The spanish will come. We know that. The french will too. We have to prepare defense plans against both."
 CAT_mili:0 "Obligatory Military Service"
 CAT_mili_desc:0 "The only way of defending the revolution is to train the population in military combat, ensuring that every man and woman will be able to do their duty when the time comes."
 
 cat_militia_ready:0 "Some militia divisions will rise behind spanish lines when we start the Revolution."
 CAT_export_revolution:0 "Continue the Revolution"
 CAT_export_revolution_desc:0 "We have managed to take over Catalonia, however, the rest of Spain remains under capitalist opression. We must destroy them!"
 CAT_fuel_flames:0 "Fuel The Flames Of Revolution"
 CAT_fuel_flames_desc:0 "Spanish workers must know that their liberation is near, and any desestabilizing act against the burgeois government will make it nearer!"
 CAT_mobilize_exiles:0 "Mobilize The Exiles"
 CAT_mobilize_exiles_desc:0 "After their defeat, many spanish socialists have moved here, waiting for their opportunity to have their revenge. We shall mobilize them for the upcoming battle!"
 CAT_prepare_militias:0 "Prepare The Militias"
 CAT_prepare_militias_desc:0 "While the liberation army attacks the spaniards from the north, spanish workers will rise up and distract their forces!"
 CAT_secure_north:0 "Secure The Northern Border"
 CAT_secure_north_desc:0 "We can't allow french capitalists to disrupt our liberation. We'll build a border wall to keep them away."
 CAT_coastal_batteries:0 "Coastal Batteries"
 CAT_coastal_batteries_desc:0 "We can't match Spain on sea, but we can nullify that advantage building some coastal forts to prevent naval invasions."
 CAT_ready_people:0 "Ready The People"
 CAT_ready_people_desc:0 "We are going to begin a difficult operation, and we should make sure our people are behind us on this."
 CAT_second_revolution:0 "The Second Spanish Revolution"
 CAT_second_revolution_desc:0 "The time has come. It is time to destroy spanish capitalists and bring the revolution to Iberia!"
 
