 GEN_the_great_depression:0 "Deal with The Great Depression"
 GEN_the_great_depression_desc:0 "The Great Depression has cause a great blow to the country's economy, we will start by reviewing our current industrial advancements and modernize it."
 Generic_the_great_depression:0 "Deal with The Great Depression"
 Generic_the_great_depression_desc:0 "The Great Depression has cause a great blow to the country's economy, we will start by reviewing our current industrial advancements and modernize it."
 GEN_financial_reform:0 "Financial Reform"
 GEN_financial_reform_desc:0 "We can start taking steps to review and subsequently reform our financial systems, making, with any luck, the economy more efficient and capable."
 Generic_financial_reform:0 "Financial Reform"
 Generic_financial_reform_desc:0 "We can start taking steps to review and subsequently reform our financial systems, making, with any luck, the economy more efficient and capable."
 GEN_support_our_industries:0 "Support our Industries"
 GEN_support_our_industries_desc:0 "By creating subsidies to our current and new industries, we can start rebuilding the economy to be more secured and prepared for any new crisis that might arouse."
 Generic_support_our_industries:0 "Support our Industries"
 Generic_support_our_industries_desc:0 "By creating subsidies to our current and new industries, we can start rebuilding the economy to be more secured and prepared for any new crisis that might arouse."
 GEN_tackle_rural_unemployment:0 "Tackle Rural Unemployment"
 GEN_tackle_rural_unemployment_desc:0 "The Great Depression caused unemployment to skyrocket, especially in rural areas, priority must be given to the rural if we want to keep producing food and not depend on a foreign power for it."
 Generic_tackle_rural_unemployment:0 "Tackle Rural Unemployment"
 Generic_tackle_rural_unemployment_desc:0 "The Great Depression caused unemployment to skyrocket, especially in rural areas, priority must be given to the rural if we want to keep producing food and not depend on a foreign power for it."
 GEN_economic_stimulus:0 "Economic Stimulus"
 GEN_economic_stimulus_desc:0 "By incentivising the economy with economic plans and subsidies, we can ensure that new factories will open and the country start recovering from this crisis."
 GEN_rural_infra:0 "Invest in Rural Infrastructure"
 GEN_rural_infra_desc:0 "Building more infrastructure in our rural areas will facilitate the transport of new goods and improve the current economic situation."
 GEN_access_education:0 "Improve Access to Education"
 GEN_access_education_desc:0 "By making education more cheap and easier to access, we can assure a new generation of educated and intelligent citizens that can allow us to research much more than before."
 Generic_access_education:0 "Improve Access to Education"
 Generic_access_education_desc:0 "By making education more cheap and easier to access, we can assure a new generation of educated and intelligent citizens that can allow us to research much more than before."
 GEN_revitalize_cities:0 "Revitalize the Cities"
 GEN_revitalize_cities_desc:0 "Creating more jobs is an arduous task, but doing so will make cities more productive for the economy and improve lives for the people who habitate it."
 GEN_road_modernization:0 "Road Modernization"
 GEN_road_modernization_desc:0 "Renovating our roads is of the essence if we want to continue the expansion of our economy, as this is the way we can transfer supplies of industry and war to our homes and soldiers."
 GEN_industrial_reforms:0 "Industrial Reforms"
 GEN_industrial_reforms_desc:0 "Reforming how our industry works could provide us with more ways to make them more efficient and could allow us to harness their potential."
 GEN_new_cons_methods:0 "New Construction Methods"
 GEN_new_cons_methods_desc:0 "If we can discover new methods of construction that are faster and safer than the current ones, we can potentially pump out more factories and industrial facilities to improve the economy."
 Generic_new_cons_methods:0 "New Construction Methods"
 Generic_new_cons_methods_desc:0 "If we can discover new methods of construction that are faster and safer than the current ones, we can potentially pump out more factories and industrial facilities to improve the economy."
 GEN_modern_industry:0 "Modernize Industry"
 GEN_modern_industry_desc:0 "With the new innovations we have made on industries, we can open new factories that can use the new ways and methods and that way making us closer to recover from the economic crisis."
 GEN_university_expansion:0 "University Expansion"
 GEN_university_expansion_desc:0 "We can start expanding the universities, attracting more and more students that could make us more capable of research in a national level, of course that means we need to have the industrial capacity to do it first..."
 GEN_invest_war_industry:0 "War Industry Investments"
 GEN_invest_war_industry_desc:0 "A war is in the horizon and we need to prepare ourselves from it, we can start by investing into industries that were made for that purpose."
 Generic_invest_war_industry:0 "War Industry Investments"
 Generic_invest_war_industry_desc:0 "A war is in the horizon and we need to prepare ourselves from it, we can start by investing into industries that were made for that purpose."
 GEN_mitary_ind_complex:0 "Military-Industrial Complex"
 GEN_mitary_ind_complex_desc:0 "Now that we have made a substantial investment into the war industry, we can start to create a military-industrial complex, made to prepare ourselves for the imminent war."
 Generic_mitary_ind_complex:0 "Military-Industrial Complex"
 Generic_mitary_ind_complex_desc:0 "Now that we have made a substantial investment into the war industry, we can start to create a military-industrial complex, made to prepare ourselves for the imminent war."
 GEN_economic_war_prep:0 "Economic War Preparations"
 GEN_economic_war_prep_desc:0 "With a now strong war industry, we can start preparing our whole economy to the incoming conflict, by constructing more factories we can be sure that we will not be lacking in industrial capacity."
 Generic_economic_war_prep:0 "Economic War Preparations"
 Generic_economic_war_prep_desc:0 "With a now strong war industry, we can start preparing our whole economy to the incoming conflict, by constructing more factories we can be sure that we will not be lacking in industrial capacity."
 GEN_secret_weapons:0 "Secret Weapons"
 GEN_secret_weapons_desc:0 "Our scientists have discovered new phenomena, which can be applied to new technologies, that could bring destruction to our enemies, it might be wise to start investing some funds towards the research of these incredible weapons."
 idea_finance_reform:0 "Financial Reform"
 
 GEN_military_start:0 "Review our Military"
 GEN_military_start_desc:0 "To make sure that we are ready for any eventuality, we need to review our military capacity to face any incoming threat or menace."
 GEN_new_kind_war:0 "A New Kind of Warfare"
 GEN_new_kind_war_desc:0 "Our Aviation branch is relatively new, but we should be looking the ways we could use the power of the plane, maybe on a supportive role to our ground forces or as way to destroy our enemies."
 GEN_airbase_expansion:0 "Airbase Expansion Plans"
 GEN_airbase_expansion_desc:0 "If we wish to use the potential that our air forces can provide, we need to expand the necessary infrastructure to support them, by building new airbases we can ensure we use them to their fullest extent."
 GEN_improved_engines:0 "Improved Engines"
 GEN_improved_engines_desc:0 "With the appeareance of new plane designs, we need to start researching in new engines that can support more heavy and advance planes and that way be able to use these new designs."
 GEN_air_superiority:0 "Prioritise Air Superiority"
 GEN_air_superiority_desc:0 "Our ground forces are prepared and more than capable of dealing with the enemy, that means that our airforces should focus on repeling the enemies bombers and fighters from dealing damage to our troops."
 GEN_tactical_bombing:0 "Prioritise Tactical Operations"
 GEN_tactical_bombing_desc:0 "Tactical bombers have the advantage of being able to peform the task of a strategic bomber and a able also to peform air support, making them a very flexible bomber, maybe we could use this as the main focus of our air doctrine."
 GEN_strategic_bombing:0 "Prioritise Strategic Operations"
 GEN_strategic_bombing_desc:0 "By using our bombers for the purpose of bombing the enemies factories, we can cripple their ability to wage war, this could be the focus of our airforces."
 GEN_reform_airforce:0 "Reform the [Root.GetAdjective] Airforce"
 GEN_reform_airforce_desc:0 "Looking at other airforces we can come to the conclusion that our airforce needs to make some reforms in how we approach air combat."
 GEN_pilot_training:0 "Improved Pilot Training"
 GEN_pilot_training_desc:0 "Our old pilots could be assigned to be trainers to a new generation of pilots, their experience could be very valuable for our efforts in modernising our airforces."
 GEN_naval_air:0 "Invest in Naval Aviation"
 GEN_naval_air_desc:0 "By investing in naval bombers, we can secure our selves a bomber that can assist our navy and can sink some light ships."
 GEN_rocketry:0 "Invest in Rocketry Experiments"
 GEN_rocketry_desc:0 "By investing in this new rocket technology, we can find how to use this new technology as a weapon, or maybe as a way to propulse our modern planes."
 GEN_the_army:0 "The [Root.GetAdjective] Army"
 GEN_the_army_desc:0 "The [Root.GetAdjective] Army is our main way to wage war and defend our lands, but its lack of a doctrine and discipline prevents them from being a force to be reckoned with, and that needs to change."
 GEN_better_equipment:0 "Invest in Better Equipment"
 GEN_better_equipment_desc:0 "By investing more in our equipment for our infantry, we can outgun our enemies with superior guns, and that hopefully will be a decisive advantage, allowing us to win this conflict."
 GEN_improved_training:0 "Improved Training Methods"
 GEN_improved_training_desc:0 "Our training methods have become somewhat antiquated, we could improved them by reviewing our methods and putting some experts and fresh blood as part of the training exercise process."
 GEN_reform_command_structure:0 "Reform the Command Structure"
 GEN_reform_command_structure_desc:0 "Our old commanders and officers have much experience from the past conflict, but are refusing to adapt to the new times, we need to reform how command works and start thinking how we are going to wage war."
 GEN_use_planning:0 "Use Planning"
 GEN_use_planning_desc:0 "Planning and preparation is a key part of any military operation, the effective use of battleplans could be our key to victory."
 GEN_renew_infantry_equip:0 "Renew our Infantry Equipment"
 GEN_renew_infantry_equip_desc:0 "Our current weapons have served well in our armed forces, but now they need to be renew with new equipment."
 GEN_special_forces:0 "The Special Forces"
 GEN_special_forces_desc:0 "Special Forces are specialized units that are able to peform task with special equipment and training, hopefully by expanding this branch we can be more effective on the field, our enemies won't expect it."
 GEN_dismiss_old_guard:0 "Dismiss the Old Guard"
 GEN_dismiss_old_guard_desc:0 "These men have served their country with the most dedication these man can give, but it is time they get to rest and dismiss, as we need new blood with new ideas and innovations."
 GEN_army_motor:0 "Motorize the Army"
 GEN_army_motor_desc:0 "The army could be in more places and move faster if could mobilize them with these brand new trucks, making them a more deadly force."
 GEN_use_firepower:0 "Use Firepower"
 GEN_use_firepower_desc:0 "Throwing men and guns into combat means nothing if they can't make a deadly blow to the enemy, that is why we should throw shells instead, as men are more expensive than a shell and deal more damage."
 GEN_improve_artillery:0 "Modernize our Artillery"
 GEN_improve_artillery_desc:0 "Our Artillery hasn't been updated in a while, we should fix this by sending some funds to our brainheads and see if they can come up with anything better"
 GEN_use_speed:0 "Use Speed"
 GEN_use_speed_desc:0 "Speed, this is a factor one could exploit from our enemies, by being more faster and maneuverable, we could encircle and disorganize them with much efficiency."
 GEN_modern_tank_designs:0 "Modern Tank Designs"
 GEN_modern_tank_designs_desc:0 "The tank is relatively new invention that first appear in the Great War, meaning that is still alot of potential that could be of us for us, we should iterate and start researching for new models."
 GEN_use_men:0 "Use Men"
 GEN_use_men_desc:0 "Big weapons are overrated, if the gun works and can be put at the hand of a soldier, it will do, with this in mind we can out produce our enemies and that will bring sweet victory."
 GEN_increase_equipment_prod:0 "Increase Equipment Production"
 GEN_increase_equipment_prod_desc:0 "Increasing our production of equipment is imperative if our country wants to keep standing in the fight."
 GEN_improve_support:0 "Improved Support Companies"
 GEN_improve_support_desc:0 "Support equipment is an important part of our army, even if they're support, it would be intelligent of our part to try to get a fund for the development of better equipment."
 GEN_army_mech:0 "Army Mechanization"
 GEN_army_mech_desc:0 "An army that is mechanized is more faster and secure than their motorized counterparts, upgrading these units could be of a great advantage on the field."
 GEN_modernized_force:0 "Complete Army Reforms"
 GEN_modernized_force_desc:0 "Now that we have revised our grand strategy, we should finish our reforms and start polishing the finer details of our land doctrine."
 GEN_the_navy:0 "The [Root.GetAdjective] Navy"
 GEN_the_navy_desc:0 "The [Root.GetAdjective] Navy is in need of some revisions in their doctrine, bringing some experts to review them would be a good first step."
 GEN_dockyard_expansion:0 "Dockyard Expansion"
 GEN_dockyard_expansion_desc:0 "Financing the construction of more dockyards in theory, should kickstart our new set of ships, this is crucial if we want to stay competative in theater of the sea."
 GEN_reform_admiralty:0 "Reform the Admiralty"
 GEN_reform_admiralty_desc:0 "Our analysis of our command structure and way of combat have showned that we require to make some reforms in the admiralty and start promoting admirals that bring new ideas to the table."
 GEN_invest_submarines:0 "Invest in Submarines"
 GEN_invest_submarines_desc:0 "By investing in new submarines we gain the capacity to cripple the enemies convoys and destroy their supplies of resources."
 GEN_coastal_defense:0 "Coastal Defense"
 GEN_coastal_defense_desc:0 "Defending our lands from invasion is far more important than having a superior fleet, we shall priorities in producing cruisers for such purpose."
 GEN_capital_ships:0 "Invest in Capital Ships"
 GEN_capital_ships_desc:0 "Superiority in the seas has many advantages and we should try to achieve it by investing in capital ships like battleships and battlecruisers."
 GEN_new_naval_doct:0 "New Naval Doctrines"
 GEN_new_naval_doct_desc:0 "Thanks to the new guys we bring to the admiralty, we come to new ideas in naval warfare and how to use our ships appropriately according to these new doctrines."
 GEN_expand_merchant_marine:0 "Expand the Merchant Marine"
 GEN_expand_merchant_marine_desc:0 "The expansion of our convoys would allows to be able to bring more materials vital to the war effort and enable us to transport more troops."
 GEN_streamlined_naval_prod:0 "Streamlined Naval Production"
 GEN_streamlined_naval_prod_desc:0 "If we streamline our naval production, we could pump out more ships quicker, and with some effort we could match our fleet against the enemy fleet."
 GEN_towards_modern_fleet:0 "Towards a Modern Fleet"
 GEN_towards_modern_fleet_desc:0 "Investing in more models and new naval design, would tremendously help in our efforts to make this fleet a modern fleet."
 
 GEN_americas_diplomacy:0 "Redefine our Foreign Policy"
 GEN_americas_diplomacy_desc:0 "Our foreign policy has been heavily mark with US influence, we must decide if we want to keep getting close to the US or create new relations with other nations."
 GEN_a_sovereign_nation:0 "A Sovereign Nation"
 GEN_a_sovereign_nation_desc:0 "We are a sovereign nation that can decide for itself who is going to deal with, the United States can't change that and we should confirm this in our foreign policy."
 GEN_promote_regional_cooperation:0 "Promote Regional Cooperation"
 GEN_promote_regional_cooperation_desc:0 "We would be more successful if we start promoting friendship with our neighbors and we start cooperating more closely, that way we wouldn't have to depend on ourselves alone."
 GEN_aggresive_stance:0 "Aggressive Diplomacy"
 GEN_aggresive_stance_desc:0 "Other countries are out to get us, we need to prepare ourselves for the coming conflict and strike first to those countries that pretend to be our friends."
 GEN_ties_america:0 "Ties With the USA"
 GEN_ties_america_desc:0 "The United States has had a great influence on us, if we position ourselves more closer to the US, we could get much benefit from them, of course that means that our foreign policy would be bound to the US foreign policy."
 GEN_seek_friendship_neighbours:0 "Befriend our Neighbours"
 GEN_seek_friendship_neighbours_desc:0 "To start our diplomatic proyect, we should send some diplomats and build embassies in neighborhood countries, and that way improve our relations with them."
 GEN_regional_trade_initiative:0 "Regional Trade Initiative"
 GEN_regional_trade_initiative_desc:0 "Continuing our efforts of regional cooperation, we can start to invest in infrastructure and buildings thanks to the new agreements made with our neighbors."
 GEN_america_military_cuts:0 "Military Spending Cuts"
 GEN_america_military_cuts_desc:0 "With peace secured for our borders, we can cut our military spending so we can focus our industry on other mathers and ensure our new friends that we wont backstab them."
 GEN_militarize_border:0 "Militarize the Borders"
 GEN_militarize_border_desc:0 "We must prepare for anything and everything that might come at us, to that end we must start preparing our borders for an eventual invasion of our country and fight for every inch of it."
 GEN_america_mob_plans:0 "Prepare Mobilization Plans"
 GEN_america_mob_plans_desc:0 "To make our defenses more effective, we need to prepare the people for war, with the introduction of mobilization laws and with the preparation of a mobilization plan we can be better prepared for any potential conflict"
 GEN_remove_fifth_columnists:0 "Expand the Intelligence Services"
 GEN_remove_fifth_columnists_desc:0 "Now that we are prepared in the protection of our borders, we need to prepare ourselves for any spies and agents coming to our country to infiltrate and harm us internaly."
 GEN_welcome_american_advisors:0 "Welcome American Advisors"
 GEN_welcome_american_advisors_desc:0 "We have recive an offer for american advisors to assist the improvement our country, of course that will cause some to acuse that we are being use as a puppet for the american government."
 GEN_buy_american_weapons:0 "Buy American Weapons"
 GEN_buy_american_weapons_desc:0 "We can always rely on the americans to have weapons, we can ensure ourselves with a package and hopefully that will do for now."
 GEN_american_military_mission:0 "American Military Mission"
 GEN_american_military_mission_desc:0 "Another offer just come in from the embassy, now they want to send a military mission to modernize our military forces, that also means that we are going deeper in the rabbit hole that is american influence."
 GEN_american_technical_support:0 "American Technical Support"
 GEN_american_technical_support_desc:0 "The americans now have approach us with an offer to send technicians for our industry, we could use their help to expand our industrial capacity."
 GEN_buy_american_planes:0 "Buy American Planes"
 GEN_buy_american_planes_desc:0 "We have a shortage of planes in our airforce, buying americans planes looks like a good short term solution for now."
 GEN_welcome_american_companies:0 "Welcome American Companies"
 GEN_welcome_american_companies_desc:0 "Now that the US has a large influence over our country, we could harnees the benefits of american companies coming to invest in our economy and industry, of course that cements the influence that america has on us and much of the citizenry won't like it."
 GEN_intelligence_exchange:0 "Intelligence Exchange"
 GEN_intelligence_exchange_desc:0 "By exchange our knowledge of their enemies to the US and them to us, we could make a major difference in the coming conflict, now the fact that we are trusting our secrets to the US won't be seen very positive in some circles."
 GEN_mutual_friendship_deal:0 "Mutual Friendship and Cooperation Deal"
 GEN_mutual_friendship_deal_desc:0 "The US has approach us with a deal of friendship and cooperation, giving us and them the posibility of making better deals with each other, that also means that america holds the power to call us and invite us to any alliance without having the ability to say no."
 tie_diplo_us:0 "§YWe will tie our diplomatic future with that of the USA!§!"
 
