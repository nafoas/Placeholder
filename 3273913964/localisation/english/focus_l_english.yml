 SPR_radicalism:0 "Crush Radicalism"
 SPR_danger:0 "The Republic In Danger"
 SPR_historical:0 "¡No Pasarán!"
 SPR_arm:0 "Arm The People"
 SPR_arm_desc:0 "We can't trust the army anymore. We have to arm the people to ensure the Republic has loyal soldiers to fight fascism."
