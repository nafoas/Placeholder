l_english:
 WHILE_FOCUSING:0 "While focusing on this, there will be the following effects:\n$EFF$"
 NATIONAL_FOCUS_NO_CURRENT_EFFECT:0 "This focus does not currently have any effect. This may soon change."
 NATIONAL_FOCUS_MUTUALLY_EXCLUSIVE_TREE:0 "The branches are mutually exclusive."
 NATIONAL_FOCUS_EXCLUSIVE_INFO_DESC:0 "Mutually exclusive with"
 NATIONAL_FOCUS_EXCLUSIVE_INFO_ENTRY:0 "$FOCUS|Y$"
 generic_focus:0 "National Focus"

 army_effort:0 "Army Expansion"
 army_effort_desc:0 "Despite the increasing possibilities of aerial and naval warfare, ground combat is still key in tomorrow's wars. With preparation, we can avoid reliving the hell of the trenches."
 equipment_effort:0 "Rifle Stockpiling Effort"
 equipment_effort_desc:0 "The limits for what equipment can be carried by infantry are constantly being pushed. We will focus on giving our troops the best tools available."
 motorization_effort:0 "Motorization Effort"
 motorization_effort_desc:0 "Mobility and protection are crucial to get infantry into and out of the field safely. Focusing on these developments will allow us to take action quickly."
 doctrine_effort:0 "Doctrine Renewal"
 doctrine_effort_desc:0 "The military doctrines that defined ground combat in the Great War are outdated. We must put our greatest minds to the task of shaping the military thought of tomorrow."
 equipment_effort_2:0 "Support Weapons Improvement"
 equipment_effort_2_desc:0 "We will continue our efforts to ensure our infantry and support troops are armed with the best possible equipment of our time."
 mechanization_effort:0 "Mechanization Effort"
 mechanization_effort_desc:0 "Rethinking the possibilities of motorized infantry, we can push the limits of what vehicles can be constructed today."
 doctrine_effort_2:0 "Modern Tactics"
 doctrine_effort_2_desc:0 "The battlefield has changed not just in the interbellum years, but over the course of recent conflicts. We must continuously reevaluate our doctrines to reflect this."
 equipment_effort_3:0 "Artillery Effort"
 equipment_effort_3_desc:0 "Instead of imitating or buying foreign equipment, we should aim to become world-leading in infantry weapons."
 armor_effort:0 "Armor Effort"
 armor_effort_desc:0 "Applying what we have learned from mechanizing our infantry, we can improve our armored vehicles as well."
 special_forces:0 "Special Forces"
 special_forces_desc:0 "We have need of elite forces; mountain troops and paratroopers should be our priority."
 aviation_effort:0 "The [Root.GetAdjective] Airforce"
 aviation_effort_tt:0 "Not enough building slots for §YAir Base§!"
 aviation_effort_desc:0 "Nowhere is technological advances more rapid than in aerial warfare. Aviation is a field any modern nation must master."
 fighter_focus:0 "New Fighter Models"
 fighter_focus_desc:0 "We have not seen that last of dogfights in the Great War. Keeping ahead in the development of fighter planes will give us an edge in the future."
 bomber_focus:0 "Bomber Development"
 bomber_focus_desc:0 "When people of the future speak of the horror to today's wars, fire raining from the skies will prominently feature. We will do our best to ensure those stories are told by our enemies."
 aviation_effort_2:0 "Modernization Effort"
 aviation_effort_2_desc:0 "Further advances in aviation will be necessary to integrate our air force well with other branches of the military."
 CAS_effort:0 "Close Air Support Tactics"
 CAS_effort_desc:0 "A modern army needs support from vehicles not only on the ground, but also in the air."
 rocket_effort:0 "Rocket Effort"
 rocket_effort_desc:0 "Rocket and jet engines allow for unprecedented speeds for unmanned and manned vessels alike. Pioneering these technologies will allow us to take the enemy by surprise."
 NAV_effort:0 "Use Naval Bombers"
 NAV_effort_desc:0 "Just as the new naval warfare takes place in part beneath the water's surface, part of it takes place in the air above the waters."
 naval_effort:0 "The [Root.GetAdjective] Navy"
 naval_effort_tt:0 "Not enough building slots for §YNaval Dockyards§!"
 naval_effort_desc:0 "The expansion of our navy should be our first priority. Assign all available resources to new Dockyards and research into light surface ships."
 flexible_navy:0 "Flexible Navy"
 flexible_navy_desc:0 "Reinventing naval warfare to account for the advances in submarine technology will allow us to strike efficiently against enemy convoys."
 large_navy:0 "Large Navy"
 large_navy_desc:0 "Adapting our naval doctrines to accommodate large ships and ensuring the safety of our trade convoys will teach us much about what sort of ships we need."
 submarine_effort:0 "Submarine Effort"
 submarine_effort_desc:0 "Submarine warfare is the most exciting naval development since the invention of the torpedo boat. We would do well to not just protect against submarines, but also use them against enemy shipping."
 cruiser_effort:0 "Cruiser Effort"
 cruiser_effort_desc:0 "Before making forays into advanced battleship research, the smaller cruisers are in need of replacement."
 destroyer_effort:0 "Destroyer Effort"
 destroyer_effort_desc:0 "Studying the design and strategic use of submarines, we have also learned how to counter those strategies. Destroyers will be crucial for this."
 capital_ships_effort:0 "Capital Ship Effort"
 capital_ships_effort_desc:0 "The nation with the most battleships will rule the oceans. Battleships and carriers represent the old and the new in naval superiority."
 industrial_effort:0 "Industrial Effort"
 industrial_effort_desc:0 "Focus all our political efforts on building up the civilian industry in a great leap forward."
 industrial_effort_2:0 "Industrial Effort II"
 industrial_effort_2_desc:0 "With iron will and a relentless work ethic, we can mobilize the people in another great industrial effort."
 construction_effort:0 "Construction Effort"
 construction_effort_tt:0 "Not enough building slots for §YCivilian Factories§!"
 construction_effort_desc:0 "Civilian industrial capacity must not be underestimated even when war looms over the world."
 production_effort:0 "Armament Effort"
 production_effort_tt:0 "Not enough building slots for §YMilitary Factory§!"
 production_effort_desc:0 "If you can build tractors, you can build tanks! We must not allow our military production capacity to lag behind."
 construction_effort_2:0 "Construction Effort II"
 construction_effort_2_desc:0 "Continuing to expand our factories will allow us to speed up production of goods for trade and further construction efforts."
 production_effort_2:0 "Armament Effort II"
 production_effort_2_desc:0 "Trying to adapt civilian factories to produce military equipment is inefficient. We should focus on preparing military production now."
 production_effort_3:0 "Armament Effort III"
 production_effort_3_desc:0 "Continued efforts to expand our military factories are necessary to meet the demands for new equipment."
 infrastructure_effort:0 "Infrastructure Effort"
 infrastructure_effort_desc:0 "A country without proper infrastructure cannot pursue advanced projects or constructions."
 infrastructure_effort_tt:0 "Not enough building slots for §YInfrastructure§!"
 synth_oil_effort_tt:0 "Not enough building slots for §YSynthetic Refinery§!"
 infrastructure_effort_2:0 "Infrastructure Effort II"
 infrastructure_effort_2_desc:0 "Extending our infrastructure further will enable the transports and communications necessary for high-tech clandestine projects."
 construction_effort_3:0 "Construction Effort III"
 construction_effort_3_desc:0 "Expansion of our infrastructure network has significantly improved our capacity for construction."
 nuclear_effort:0 "Nuclear Effort"
 nuclear_effort_desc:0 "Standing on the edge of a world-changing discovery, we cannot let others light the fire that may one day consume the Earth."
 extra_tech_slot:0 "Extra Research Slot"
 extra_tech_slot_desc:0 "Our industrial expansion and other recent advances might allow us to conduct more R&D in parallel."
 extra_tech_slot_2:0 "Extra Research Slot II"
 extra_tech_slot_2_desc:0 "The rapid industrialization of our nation has opened up new opportunities in R&D that we should pursue."
 technology_sharing:0 "Technology Sharing"
 technology_sharing_desc:0 "By sharing technological advances with our allies, our whole faction will be able to conduct wartime R&D more efficiently."
 secret_weapons:0 "Secret Weapons"
 secret_weapons_desc:0 "It is tempting to expend all extra resources into developing tanks and planes, but the secret to winning wars lies in whole new fields of science; electronics, rocketry and nuclear research."
 political_effort:0 "Political Effort"
 political_effort_desc:0 "To bring about change in the world, we need to be able to bring about change in our own country. Strengthening our political position should come first."
 collectivist_ethos:0 "Collectivist Ethos"
 collectivist_ethos_desc:0 "Our enemies may divide and conquer lesser nations, but our people will stand united. All for one and one for all."
 liberty_ethos:0 "Liberty Ethos"
 liberty_ethos_desc:0 "In this time of ideological fanatics who seek to suffocate the human spirit, we will safeguard individual liberties and freedom."
 militarism:0 "Militarism"
 militarism_desc:0 "Those who view the military as a necessary evil are doomed to hesitate in the face of war. We will ingrain militarism into our culture to become a people of soldiers."
 political_correctness:0 "Political Correctness"
 political_correctness_desc:0 "People holding mildly controversial or otherwise embarrassing opinions appear to be concerned that there is a wide-reaching conspiracy against them. This seems like an excellent idea."
 neutrality_focus:0 "Neutrality Focus"
 neutrality_focus_desc:0 "While others may claim it takes bravery and wisdom to take sides in a global conflict, we know it takes more to refuse."
 interventionism_focus:0 "Interventionism Focus"
 interventionism_focus_desc:0 "We value the freedom of all people, not only our own citizens. If preventing tyranny means war, then so be it."
 military_youth:0 "Military Youth"
 military_youth_desc:0 "Organizations to promote discipline and political education of young people in our nation will foster loyalty and self-sacrifice early."
 deterrence:0 "Deterrence"
 deterrence_desc:0 "Standing alone, we rarely benefit from war. Fortunately, we know that the best defense is one so well-known you never have to put it to use."
 volunteer_corps:0 "Volunteer Corps"
 volunteer_corps_desc:0 "Forcing our people to die for ideals of freedom would be an exercise in irony, but establishing means for those who wish to aid people abroad is not."
 paramilitarism:0 "Paramilitarism"
 paramilitarism_desc:0 "Military principles have applications outside of the military. With the development of semi-militarized units to complement our armed forces, more people will have military training."
 indoctrination_focus:0 "Indoctrination"
 indoctrination_focus_desc:0 "Having established our ideology as based on the truth, it may be taught as truth. Education and media must reflect this lesson."
 foreign_expeditions:0 "Foreign Expeditions"
 foreign_expeditions_desc:0 "With our enemies prepared to intervene in distant conflicts on behalf of their ideals, we must be ready to do the same for ours."
 why_we_fight:0 "Why We Fight"
 why_we_fight_effect:0 "If we don't have the §YNeutral Foreign Policy§! spirit we will be able to create factions.\n"
 why_we_fight_desc:0 "The world is growing increasingly unsafe. Our people need to see the atrocities being committed by those who crave power. It is time we rally the people to our cause and ensure everyone is ready to fight for our freedom."
 political_commissars:0 "Political Commissars"
 political_commissars_desc:0 "To ensure that our policies are followed in military practice, we will introduce politically appointed officials into military ranks."
 internationalism_focus:0 "Internationalism Focus"
 internationalism_focus_desc:0 "Ideology knows no borders. Another nation may call itself sovereign, but our convictions are above such claims."
 nationalism_focus:0 "Nationalism Focus"
 nationalism_focus_desc:0 "Our nation is unique, and our political achievements could only have happened here. We must fight for it at any cost."
 ideological_fanaticism:0 "Ideological Fanaticism"
 ideological_fanaticism_desc:0 "Our politically established values and goals are worth dying for as much as any ancient faith. Any follower should be prepared to face death, and those who stray better be prepared to face death."
 air_innovation:0 "Air Innovations"
 air_innovation_desc:0 "Modern wars cannot be won without dominating the skies. We must do everything in our power to develop the air force!"
 air_innovation_2:0 "Air Innovations II"
 air_innovation_2_desc:0 "Every advantage we can gain in the skies is precious. We should focus all of our efforts on developing our fighters."
 naval_air_effort:0 "Naval Air Effort"
 naval_air_effort_desc:0 "The efficacy of air strikes against naval targets was demonstrated by the Americans already back in 1921. We should not neglect this branch of the Air Force if we intend to wage war on a naval power."
 
 WIP_focus:0 "§RThis focus is incomplete, functionality will come in the future!§"
 
 
 GEN_pass_budget:0 "Pass The 1933 Budget"
 GEN_pass_budget_desc:0 "A new year is uppon us and we need to aprove a new Budget for the continuing functioning of the government and allowing us to start making political and stuctural reforms."
 GEN_guarantee_freedom_press:0 "Guarantee Freedom of the Press"
 GEN_guarantee_freedom_press_desc:0 "The freedom of the Press is an important staple of our Democracy and what better way to honor this fact, than further guaranteeing it's freedom from our hands."
 GEN_new_censorship_laws:0 "New Censorship Laws"
 GEN_new_censorship_laws_desc:0 "To guarantee the support of the people, we must pass laws that make sure that the Press can't seek to criticise this goverment and jeopardize it's integrity."
 GEN_guarantee_freedom_speech:0 "Guarantee Freedom of Speech"
 GEN_guarantee_freedom_speech_desc:0 "The people should be able to speak their minds and this right should be protected by the state, even if it means that critism can be directed against us."
 GEN_limit_freedom_speech:0 "Limit Freedom of Speech"
 GEN_limit_freedom_speech_desc:0 "In spite that freedom of Speech is an important part of a democracy, in these troublesome times, we must ensure that the people don't get dangerous ideas like fascism or communism, and that way avoid the radicalization of our people."
 GEN_education_reform:0 "Education Reform"
 GEN_education_reform_desc:0 "We have been getting a little bit behind in terms of education and research, by passing these reforms, we will ensure a brighter future for our new generation and catch up to the rest of the World."
 GEN_cultural_initiatives:0 "Cultural Initiatives"
 GEN_cultural_initiatives_desc:0 "In these dangerous times the goverment should seek to promote [Root.GetAdjective] culture and this way continue the [Root.GetAdjective] way of life, for even in these times it should thrive and prosper."
 GEN_administrative_reform:0 "Administrative Reform"
 GEN_administrative_reform_desc:0 "Talks have started in the goverment on how best administrate our lands, is on our best interest that in these talks the result that comes out of them, it's of our liking."
 GEN_plans_autonomy:0 "Strenghten Local Democracy"
 GEN_plans_autonomy_desc:0 "Only local goverments knows the needs and resources of the regions, for that reason we will procee to reform this country into a more descentralice way of governing, ensuring the happiness of our citizens."
 GEN_one_free_nation:0 "One Free Nation"
 GEN_one_free_nation_desc:0 "A more centralize goverment can do more for the people than varius local ones, for that reason we will procee to reform this country into a strong centralize state, capable of overcoming any obstacule."
 GEN_negotiate_opposition:0 "Negotiate with the Opposition"
 GEN_negotiate_opposition_desc:0 "In order to pass more internal reforms we need support from other parties, which means we need to reach to the other part of the aisle, even if that means working with the opposition."
 GEN_judicial_reforms:0 "Judicial Reform"
 GEN_judicial_reforms_desc:0 "Even though costly to implement, a reform to our Judicial sistem would bring much needed stability to our country and allow us to reinforce the rule of the law."
 GEN_investigate_corruption:0 "Investigate Corruption"
 GEN_investigate_corruption_desc:0 "With opposition from our own goverment officials, we need to start an investigation into these rumors of corruption within the goverment and parties and bring justice to the ones guilty of these selfish actions."
 GEN_stabilize_country:0 "Stabilize the Country"
 GEN_stabilize_country_desc:0 "Now more than ever, we need to unite the country to a common cause and prepare it for what's to come, good or bad, we will be ready."
 GEN_negotiate_workers:0 "Negotiate with the Workers"
 GEN_negotiate_workers_desc:0 "For months now the workers have been asking for better working conditions, by accepting these propoositions we could potentially increase our popularity and increase the prosperity of the [Root.GetAdjective] nation."
 GEN_crackdown_socialism:0 "Crackdown on Socialism"
 GEN_crackdown_socialism_desc:0 "These ideas of \"Socialism\" are ideas that infect our working class with promises of a \"Better future\" and \"A Worker's Utopia\", these ideas cannot be tolerated any longer and must be stopped at any cost."
 GEN_progressive_ideas:0 "Progressive Ideas"
 GEN_progressive_ideas_desc:0 "By trying more progressive policies, we can see their potential and usefulness and integrated them into our own policies, of course that will make the parties that follow these ideas more influential."
 GEN_reinforce_traditional_values:0 "Reinforce Traditional Values"
 GEN_reinforce_traditional_values_desc:0 "By sticking to our conservative policies, we use what we know works and keep the country stable, although that will make the parties with the same policies more influential."
 GEN_expand_police_force:0 "Expand the Police Force"
 GEN_expand_police_force_desc:0 "To make sure that the new laws and Judicial reform are efficiently introduced, we should revitalize the [Root.GetAdjective] Police Force and expande it to make it more capable"
 GEN_draft_new_economic_plan:0 "Draft a New Economic Plan"
 GEN_draft_new_economic_plan_desc:0 "With a new budget we can start preparing the country for a new focus on our economy and make this nation thrive. Before us are two options, one is the \"Off Hands\" approach while the other being a \"Intervention on the Economy\" approach, either way we must choose one or the other."
 GEN_liberalise_economy:0 "Liberalise the Economy"
 GEN_liberalise_economy_desc:0 "If we decrease the restrictions we have impose on trade and the economy, it could open up new opportunities for expansion and investment for private citizens, improving the economy tremendously."
 GEN_deregulation:0 "Deregulation"
 GEN_deregulation_desc:0 "By making laws and any organism in charge of regulating the economy more loosen in their operations, allows more opportunities and expansion of private businesses, overall improving the economy, of course that also means opening the market to foreign investers."
 GEN_lower_taxes:0 "Lower Taxes"
 GEN_lower_taxes_desc:0 "The lowering of taxes allows that companies can have more capital and be able to expand more quickly and strongly, making a overall positive impact on the economy."
 GEN_intervention_plan:0 "Economic Interventionism"
 GEN_intervention_plan_desc:0 "If we increase restrictions and regulation in our economy and goods abroad, we can avoid market failures, like the ones that caused the Great Depression, and make sure our people receive the minimum goods to survive."
 GEN_introduce_progressive_taxation:0 "Introduce Progressive Taxation"
 GEN_introduce_progressive_taxation_desc:0 "By introducing a tax to the rich and private companies, we can ensure a steady stream of income for the goverment that can be use to create new social programs."
 GEN_welfare_state:0 "A Welfare State"
 GEN_welfare_state_desc:0 "The Welfare is when the state protects and promotes the social and the economy well-being of their citizens, by implementing this principle in our country we can increase the prosperity of our citizens and reduce civil unrest caused by economic turmoil."
 GEN_pass_new_budget:0 "Pass a New Budget"
 GEN_pass_new_budget_desc:0 "At chosing a new economic focus, we need to re-adjust our budget to adapt to the new policies and implement them with efficiency."
 GEN_investment_plans:0 "Industrial Investment Projects"
 GEN_investment_plans_desc:0 "Now that we have chosen a new economic focus and created a new budget, we can start promoting the creation of new industries and infrastructure to accommodate our needs."
 idea_liberalisation:0 "Economic Liberalisation"
 idea_low_taxes:0 "Lowered Taxes"
 idea_intervention_eco:0 "Economic Interventionism"
 idea_prog_taxation:0 "Progressive Taxation"
 idea_invest:0 "Investment Projects"
 idea_educ_reform:0 "Education Reform"
 idea_decent_policies:0 "Decentralization Policies"
 idea_cent_policies:0 "Centralization Policies"
 idea_judicial_reforms:0 "Judicial Reforms"
 idea_worker_rights:0 "Concessions to the Workers"
 
 GEN_european_diplomacy:0 "Our Foreign Policy"
 GEN_european_diplomacy_desc:0 "In these troubled times, we must start to think in our place in the world, and to contemplate if we are going to take a side in this coming conflict, and which one to choose if we so desire."
 GEN_neutrality_policy:0 "Neutral Foreign Policy"
 GEN_neutrality_policy_desc:0 "Our country is not ready to fight yet, so we are not going to take any side in the coming conflict, even if it means sacrificing our friends and allies to the wolves."
 GEN_peaceful_neutrality:0 "Peaceful Neutrality"
 GEN_peaceful_neutrality_desc:0 "To avoid provoking our neighbors, we must take a peaceful posture, even if that means making us ever so vulnerable to other aggressive countries."
 GEN_reduce_spending_mil:0 "Reduce Military Spending"
 GEN_reduce_spending_mil_desc:0 "At cutting the budget of our military, we reassure our neutrality stance and frees our military industry to use it for other purposes."
 GEN_improve_global_opinion:0 "Improve Global Opinion"
 GEN_improve_global_opinion_desc:0 "By sending diplomats and opening embassies around the world, we can create and assure our good relations with every single country that might threaten us and reassure our neutral stance."
 GEN_war_profiteering:0 "War Profiteering"
 GEN_war_profiteering_desc:0 "With our neutral stance secured, we can prepare our industry to start making profits in wartime, by producing to both sides we assure that we are needed by every side in the conflict, making us truly neutral"
 GEN_armed_neutrality:0 "Armed Neutrality"
 GEN_armed_neutrality_desc:0 "Even if we have decided to stay neutral on the coming conflict, that doesn't mean that these countries will respect our desires, we will not be so foolish to make such mistake and we will make sure to keep our country safe."
 GEN_defend_borders:0 "Defend our Borders"
 GEN_defend_borders_desc:0 "We must prepare for anything and everything that might come at us, to that end we must start preparing our borders for an eventual invasion of our country and fight for every inch of it."
 GEN_mobilization_plans:0 "Fast Mobilization Plans"
 GEN_mobilization_plans_desc:0 "To make our defenses more effective, we need to prepare the people for war, with the introduction of mobilization laws and with the preparation of a mobilization plan we can be better prepared for any potential conflict"
 GEN_defend_interests:0 "Defend our Interests Abroad"
 GEN_defend_interests_desc:0 "While is true we have decided for maintaing neutrality. that doesn't mean we should keep quiet while our interests and investments are taken by other foreign forces, we must be able to defend them."
 GEN_take_position:0 "Take a Side"
 GEN_take_position_desc:0 "We can't afford to be in the sidelines in the coming conflict, our country must be capable for the coming war and it is necessary that we too take a side to make the most of it."
 GEN_weapon_purchases:0 "Weapon Purchases"
 GEN_weapon_purchases_desc:0 "To prepare for the coming conflict, we need to start buying weapons and equipment from foreign nations, this way we can ensure we are ready for any surprises."
 GEN_approach_ussr:0 "Approach the USSR"
 GEN_approach_ussr_desc:0 "The Bolsheviks in Russia have passed through rough times and have demonstrated strength as a people; we may want to consider build an embassy in their capital and to start seeking for their friendship."
 GEN_approach_britain:0 "Approach the United Kingdom"
 GEN_approach_britain_desc:0 "The British have a great empire spanning the planet, to ignore such a powerful player would be foolish, we can establish an embassy in their capital and start aligning ourselves to them."
 GEN_approach_germany:0 "Approach Germany"
 GEN_approach_germany_desc:0 "Though the Germans have had many difficulties in the past decade, they have showed that they are a strong nation once again. They could be a good partner and ally in the coming storm."
 GEN_new_trade_policies:0 "New Trade Policies" 
 GEN_new_trade_policies_desc:0 "Now that we have decided in a side, we can approach our new friends and start negotiations for better deals and adjust our own trade to accommodate their interests."
 GEN_military_cooperation:0 "Military Cooperation"
 GEN_military_cooperation_desc:0 "Thanks to our new friends we can start modernization of our military forces, by asking for further military cooperation between our allies, we can learn from them and that way support them in the coming conflict."
 GEN_approach_france:0 "Approach France"
 GEN_approach_france_desc:0 "The French have garnered much experience in the Great War,if we make them our allies we could harness their experience and tradition to better prepare ourselves."
 
 GEN_asia_diplomacy:0 "Our Foreign Policy"
 GEN_asia_diplomacy_desc:0 "In these troubled times, we must start to think in our place in the world, and to contemplate if we are going to take a side in this coming conflict, and which one to choose if we so desire."
