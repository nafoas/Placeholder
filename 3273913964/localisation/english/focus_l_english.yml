 DEN_nazischools:0 "Reform The School-System"
 DEN_reformamts:0 "Reform The Amts?"
 DEN_commiedissolveamts:0 "Dissolve The Amts!"
 DEN_integrateredmillitias:0 "Integrate The Red Millitias"
 DEN_revolutionarypublic:0 "Revolutionary Public"
 DEN_commiestatefarms:0 "State Farms"
 DEN_socialistschools:0 "'Socialistisk Skoleforbund'"
 DEN_nyhedsforbund:0 "'Socialistisk Nyhedsforbund'"
 DEN_labourcrisis:0 "Labour Crisis!"
 DEN_socdemradikale:0 "Work with Radikale Venstre!"
 DEN_implementsocialreformen:0 "Implement Socialreformen"
 DEN_reformourlaws:0 "Reform our Laws!"
 DEN_helpthepoor:0 "Help The Poor"
 DEN_humanright:0 "A Human Right...."
 DEN_socdemneutral:0 "Reaffirm Our Neutrality!"
 DEN_scandinavianneutrality:0 "Scandinavian Neutrality"
 DEN_armedneutrality:0 "Armed Neutrality!"
 DEN_lookforallies:0 "Look for Allies!"
 DEN_spendingcuts:0 "Army Spending Cuts"
 DEN_copenhagcongress:0 "The Copenhagen Congress"
 DEN_stockholmforum:0 "The Stockholm Forum"
 DEN_stockholmconfer:0 "The Stockholm Conference"
 DEN_fortdenmark:0 "Fortress Denmark"
 DEN_konservresearch:0 "Research Agreements"
 DEN_workwithvenstre:0 "Work with Venstre!"
 DEN_tondownsocial:0 "Tone Down Socialreformen"
 DEN_reformtaxes:0 "Reform the Taxes!"
 DEN_supportthemarkets:0 "Support The Markets!"
 DEN_freedenmark:0 "A Free Denmark"
 DEN_churchofdenmark:0 "The Church of Denmark?"
 DEN_fundthearmy:0 "Fund The Army"
 DEN_commiespirit:0 "Revolutionary Spirit!"
 DEN_commiespirit_desc:0 "We must install a revolutionary spirit in our soldiers! They shall be proud to serve and die for the revolution!"
 DEN_seizewealthcommunist:0 "Seize the Capitalist Wealth!"
 DEN_seizewealthcommunist_desc:0 "For years the Worker starved while the filthy Capitalists ate all they could! But no more! With the capitalists fleeing the country, including the King, vast amounts of wealth can be taken from them and be redistributed."
 DEN_depressionover:0 "Expand our Industries!"
 DEN_depressionover_desc:0 "Now that we have finally recovered from Depression, we start expanding our industrial might."
 DEN_civlindustryI:0 "Civilian Industry I"
 DEN_civlindustryI_desc:0 "We need more civilian factories!"
 DEN_civlindustryII:0 "Civilian Industry II"
 DEN_civlindustryII_desc:0 "We need even more civilian factories!"
 DEN_civlindustryIII:0 "Civilian Industry III"
 DEN_civlindustryIII_desc:0 "Who doesn't like civilian industry!?"
 DEN_militaryindustryI:0 "Military Industry I"
 DEN_militaryindustryI_desc:0 "We need to make more guns!"
 DEN_militaryindustryII:0 "Military Industry II"
 DEN_militaryindustryII_desc:0 "Oh and artillery too! We need to make alot of that."
 DEN_militaryindustryIII:0 "Military Industry III"
 DEN_militaryindustryIII_desc:0 "You really love guns, don't you?"
 DEN_thenewaristocracy:0 "The New Aristocracy"
 DEN_thenewaristocracy_desc:0 "In the new Denmark, our great king shall forge, aristocrats will have a say in the economy!"
 DEN_fundthebanks:0 "Fund the Banks!"
 DEN_fundthebanks_desc:0 "Our great King shall personally fund the country's banks to increase the speed of our recovery from the Depression."
 DEN_protectourexports:0 "Our Trade!"
 DEN_protectourexports_desc:0 "We must carefully choose our trade partners! This way our precious Danish goods don't fall into the hands of the enemy."
 DEN_ourtrade:0 "Our Trade!"
 DEN_danishpigs:0 "Danish Pigs!"
 DEN_danishpigs_desc:0 "Now that we have a designated trade partner we can trust, we can open our pig meat industry to them and begin make this country rich again!"
 DEN_goldenage:0 "A New Golden Age!"
 DEN_goldenage_desc:0 "With the help of our great King, Denmark shall enter a new golden age of economic prosperity."
 DEN_littlemanjobs:0 "Jobs for the Little Man!"
 DEN_littlemanjobs_desc:0 "Many Danes are unemployed and turning poor. The King shall set a stop to this!"
 DEN_massiveconstructs:0 "Massive Construction Projects"
 DEN_massiveconstructs_desc:0 "Many businessmen have come forward with construction projects. We should consider these if we wan't people working again."
 DEN_storbeltbro:0 "Build The "Storbæltsbro""
 DEN_storbeltbro_desc:0 ""Storbæltsbroen" or "The Great Belt Bridge" will connect Fyn and Sjælland. Not only will this improve our infrastructure but it will provide thousends of jobs for the people! The bridge will take some time to build though."
 DEN_monarchynodepression:0 "Recover from The Depression!"
 DEN_monarchynodepression_desc:0 "Our great King has done what the politicians couldn't: Restore Denmark's prosperity!"
 DEN_newtrade:0 "New Trade "
 DEN_newtrade_desc:0 "We must decide who we are going to trade with. Our goods shall not fall into enemies of Denmark!"
 DEN_pigmeat:0 "Pig Meat Exports"
 DEN_pigmeat_desc:0 "One of our major exports is Pig meat. Maybe the should consider expanding this industry and it's exports."
 DEN_filmforbund:0 "'Socialistisk Filmforbund'"
 DEN_filmforbund_desc:0 "The "Socialist Film-Union" wil be a state-funded organization that will promote the art of filmmaking. We will teach our filmmakers to not include "corrupt" and "greedy" ideals in their art."
 DEN_fiveyearplan:0 "Five Year Plan"
 DEN_fiveyearplan_desc:0 "We will start nationwide economic plans rebuild the national economy."
 DEN_farmercollectives:0 "Setup Farmer Collectives!"
 DEN_farmercollectives_desc:0 "The Danish farmers will be 'persuaded' to join our new farmer collectives. All of of their produce will, of course, be owned by the state."
 DEN_feedthecities:0 "Feed The Cities!"
 DEN_feedthecities_desc:0 "With a new wave of industrialisation, our cities will need their extra surplus of food. There's plenty to go around! Isn't there?"
 DEN_fabriksbyer:0 "'Fabriksbyer'"
 DEN_publicmonuments:0 "Public Monuments"
 DEN_publicmonuments_desc:0 "The wokers are hungry for jobs. Why not satisfy this hunger making them build worker's monuments to remember the ones who died to save the Motherland."
 DEN_ric_desc:0 "The "Revolutionary Industry Union" will be established to rebuild the economy."
 DEN_replacerif:0 "Replace The RIF"
 DEN_rif:0 "Form The RIF"
 DEN_replacerif_desc:0 "With the 'Economic Revolution' in place there is no need for the RIF. We will have to choose what to have as an repacement."
 DEN_arbejdsfront:0 "Setup The "Arbejdsfront""
 DEN_arbejdsfront_desc:0 "The "Worker's Front" be established to make sure workers do what we tell them to."
 DEN_removeourenemies:0 "Remove our Enemies"
 DEN_removeourenemies_desc:0 "Some people oppose our reforms. Some people disappear."
 DEN_bunkerseverywhere:0 "A Bunker in every city!"
 DEN_bunkerseverywhere_desc:0 "The workers need jobs and we'll give them just that. Our national defence is lacking and a enemy invasion could be just around the corner. Why not let the worker commit to his patriotic duty and help build our defences!"
 DEN_gunineveryhand:0 "A Gun in every hand!"
 DEN_gunineveryhand_desc:0 "Unemployment is still a problem. Lack of equipment is still a problem. Why not solve both problems at once?"
 DEN_refineries:0 "Research Refineries"
 DEN_refineries_desc:0 "Modern technology might just what we'll need to achieve autarky, when it comes to oil."
 DEN_digforoil:0 "Drill for Oil"
 DEN_visitvillages:0 "Visit The Villages & Farms"
 DEN_visitvillages_desc:0 "Our great Fører will visit the countryside and listen to people's problems. Not only will this enhance the Fører's image, we will also finally get around to solve the agricultural crisis."
 DEN_prepareforwar:0 "National Mobilization "
 DEN_prepareforwar_desc:0 "Now that the country has recovered from the depression, we can begin the mobilization of the country. Our armies shall be ready, when the time comes."
 DEN_nationalmobilization:0 "National Mobilization"
 DEN_fundarmymonarchy:0 "Fund The Army"
 DEN_fundarmymonarchy_desc:0 "Our army is pathetic! An increase in military spending is in order."
 DEN_tradeunionswhat:0 "Trade Unions?"
 DEN_tradeunionswhat_desc:0 "We must decide our policy on the trade unions. The Unions were instrumental in the revolution, but many of our Congressmen and Party members want to centralize the unions to the point that they can controlled by the goverment. Others want the complete opposite, the right for our unions to have a say in goverment policy."
 DEN_forsvaret:0 "Forsvaret"
 DEN_forsvaret_desc:0 ""Forsvaret" shall protect Denmark, whatever path it took."
 DEN_partyban_desc:0 "Democracy is nothing but a taint on the national pride of our Rige! It shall we washed away from our history."
 DEN_haaren:0 "Hæren"
 DEN_haaren_desc:0 ""Hæren" is the Danish army. It is small, weak and outdated. Maybe we should change that? Or is that too expensive"
 DEN_modernizethearmy:0 "Modernize Hæren"
 DEN_modernizethearmy_desc:0 "Army is weak and therefore we are weak. How can we defend ourselves like this?"
 DEN_rigsvaarnet:0 "Rigsværnet"
 DEN_rigsvaarnet_desc:0 ""Rigsværnet" will be the new replacement for 'Hæren'. Rigsværnet will succeed where Hæren failed: actually be a competent army."
 DEN_folkehaaren:0 "Folkehæren"
 DEN_folkehaaren_desc:0 ""Folkehæren" shall be the army of the people! It shall not commit to imnperialist wars or protect greedy landowners! It shall be a army for the people, by the people."
 DEN_superiorfirepower:0 "Focus on Artillery"
 DEN_superiorfirepower_desc:0 "By focusing on raw firepower, we will preserve our manpower."
 DEN_mobilewarfare:0 "Focus on Mobility"
 DEN_mobilewarfare_desc:0 "Tanks, trucks and airplanes! We will make our enemies fall apart then they face our Pansers on the field!"
 DEN_grandbattleplan:0 "Focus on Planning"
 DEN_grandbattleplan_desc:0 "With extensive planning and preparation, everything is possible."
 DEN_killfascists:0 "Destroy The Fascists!"
 DEN_killfascists_desc:0 "The DNSAP is nothing but a group of filthy scum! They must be removed now!"
 DEN_pansertropper:0 "Pansertropper"
 DEN_pansertropper_desc:0 "We will increase the organization of our tanks by organizing them into the new "Pansertropper"."
 DEN_lynkrig:0 "Lynkrig"
 DEN_lynkrig_desc:0 ""Lynkrig" or "Lighting War" is our new doctrine that will ensure that our pansers know what they are doing and that they are doing it effectively, on the battlefield."
 DEN_learnfromthegreatwar:0 "Learn from The Great War"
 DEN_learnfromthegreatwar_desc:0 "Artillery tactics were highly developed during the Great War. We can learn from this."
 DEN_tacticalwarfare:0 "Tactical Warfare"
 DEN_tacticalwarfare_desc:0 "Advanced tactics and massive bombardments will lead the way to victory."
 DEN_generalstaff:0 "Reorganize the General Staff"
 DEN_generalstaff_desc:0 "General staff must me reorganized, so we can prepare for future military operations."
 DEN_defensivewarfare:0 "Defensive Warfare"
 DEN_defensivewarfare_desc:0 "A good defence is a even better offence."
 DEN_flyvertropper:0 "Hærens Flyvertropper"
 DEN_flyvertropper_desc:0 ""Hærens Flyvertropper" is our small group of outdated airplanes and is the closest thing we have to modern airforce. Maybe it's time to change this."
 DEN_modernfighters:0 "Mordern Fighters"
 DEN_modernfighters_desc:0 "The first step to creating a modern airforce, is new and better fighters."
 DEN_marienflyvevaasen:0 "Marinens Flyvevæsen"
 DEN_marienflyvevaasen_desc:0 ""Marinens Flyvevæsen" (the naval branch of our airforce) must be modernized, so it can compete with the enemy."
 DEN_airsupport:0 "Air Support"
 DEN_airsupport_desc:0 "Airplanes must be developed that can support our land forces in battle."
 DEN_tacticalbombing:0 "Tactical Bombing"
 DEN_tacticalbombing_desc:0 "By destroying the enemys homefront, we can win the war!"
 DEN_thenewairfoce:0 "The New Airforce"
 DEN_thenewairfoce_desc:0 "We shall combine our two minor airforces into one greater. Our new modern airforce will be the pride of our nation!"
 DEN_mechanized:0 "Mechanized Troops"
 DEN_soovaarnet:0 "Søværnet"
 DEN_soovaarnet_desc:0 "Denmark's navalpower is pathetic compared to our great naval legacy. This must change."
 DEN_dockyards:0 "Expand our Dockyards!"
 DEN_dockyards_desc:0 "If were going to have a better navy, we're going to need to increase our naval production."
 DEN_destroyersandcruisers:0 "Destroyers and Cruisers"
 DEN_destroyersandcruisers_desc:0 "Destroyers and Cruisers are what we need!"
 DEN_submarines:0 "Submarine Doctrine"
 DEN_submarines_desc:0 "Hidden submarines raiding enemy convoys and starving the their people, is the way to go!"
 DEN_grandfleet:0 "The Grand Fleet"
 DEN_grandfleet_desc:0 "We shall build ourselves a grand fleet that will make even the British look at us with respect!"
 DEN_danishadmiralty:0 "Danish Admiralty"
 DEN_danishadmiralty_desc:0 "The Danish admiralty must be experienced and ready to protect the country at anytime."
 DEN_ulvegrupper:0 "Ulvegrupper"
 DEN_ulvegrupper_desc:0 "Submarines will be organized into 'Ulvegrupper' (Wolf groups). These groups will patrol the sea and raid the enemy convoys."
 DEN_navalguns:0 "Naval Guns"
 DEN_navalguns_desc:0 "Our great ships shall blast the enemy away with their mighty naval guns!"
 DEN_marines:0 "Danish Marines"
 DEN_marines_desc:0 "The navy must develop marine troops to capture enemy land during an invasion."
 DEN_mechanized_desc:0 "Mechanized troops is the future. Speed is everything."
 DEN_danmarktilejderen:0 ""Danmark til Ejderen!""
 DEN_danmarktilejderen_desc:0 "Denmark must restore it's rightful control over Schleswig-Holstein. Schleswig shall be annexed and a Holstein buffer state."
 DEN_greaterdenmark:0 "DEN_greaterdenmark"
 DEN_domination:0 "Dominate The North Sea!"
 DEN_domination_desc:0 "We shall reunite with Norway, destroy the Swedish threat and dominate the North Sea! The norwegians are nothing but danes, corrupted by Swedish culture and tradition!"
 DEN_unitethenorth:0 "Unite The North!"
 DEN_unitethenorth_desc:0 "The legacy of the Kalmar Union will never be forgotten. The North must be dominated and united to stand against the tide of communism!"
 DEN_restoreourhonour:0 "Restore our Honour!"
 DEN_restoreourhonour_desc:0 "Ever since our shameful defeat in1864, our nation has followed a policy of neutrality. No more! We must restore our honour and conquer ourselves a new empire!"
 DEN_germanfriendship:0 "Friendship with Germany!"
 DEN_germanfriendship_desc:0 "The Germans are a proud people, worthy of our friendship. Even if we have a history of conflict with Germany, we must realize that german suppory might just be what we need to succed in our ambitions!"
 DEN_fascistfriendsweden:0 "Friendship with Sweden!"
 DEN_fascistfriendsweden_desc:0 "We might have a history of war with our Scandinavian brother, but we must realize that there is more to gain from Swedish friendship than from Swedish war."
 DEN_retakescania:0 "Retake Skåne and Gotland"
 DEN_retakescania_desc:0 "We have a ancestral right to retake Skåne and Gotland from the Swedish scum!"
 DEN_recolonizescania:0 "Recolonize Skåne and Gotland"
 DEN_fascistretakecolonies:0 "Retake The Colonies!"
 DEN_fascistretakecolonies_desc:0 "We must retake our colonies! They might not be of much value but they are rightful Danish clay!"
 DEN_fascistclaimeastindies:0 "Claim our Indian Possessions!"
 DEN_fascistclaimeastindies_desc:0 "We want our Indian Possessions back!"
 DEN_claimthewestindiesfascist:0 "Claim The West Indies!"
 DEN_claimthewestindiesfascist_desc:0 "We sold our possessions in the West Indies to the United States in 1917. They are now known as the "US Virgin Islands". We want our islands back!"
 DEN_fascistsclaimgoldcoast_desc:0 "We owned parts of Ghana. We want it back!"
 DEN_fascistsclaimgoldcoast:0 "Claim The Gold Coast!"
 DEN_demandoosel:0 "Demand Øsel!"
 DEN_demandoosel_desc:0 "We shall send Estonia a simple decision; return Øsel to their rightful owners or war."
 DEN_recolonizescania_desc:0 "The territory we have regained is still tainted by Swedes. We must pursue a policy of "recolonization* in the Skåne and Gotland"
 DEN_recolonizeoosel:0 "Recolonize Øsel!"
 DEN_recolonizeoosel_desc:0 "Øsel must be integrated into the Rige! The lesser races cannot continue to live on this rightful territory of Denmark!"
 DEN_danishsupremacy:0 "Danish Supremacy!"
 DEN_nordicsupremacy:0 "Nordic Supremacy!"
 DEN_nordism_desc:0 "National-Socialist Nordism is the new policy of the Rige! We will expand our political efforts in the north and unite under the banner of Pan-Scandinavianism!"
 DEN_nordism:0 "Nordism"
 DEN_danishsupremacy_desc:0 "While the other Scandinavian are of course aryan, we must remember that our blood is the purest of them all. We are superior than our brothers, so it is of course our duty to control them."
 DEN_nordicsupremacy_desc:0 "Nordicism is fact. The nordic people is the most aryan in the world. We must unite or we will be crushed by the lessers!"
 DEN_issuenordicclaims:0 "Issue our Claims!"
 DEN_issuenordicclaims_desc:0 "It is time to announce our claims of the north to the public!"
 DEN_swedishputsch:0 "The Swedish Putsch"
 DEN_swedishputsch_desc:0 "Our Agents and Nordists are ready to take over Sweden. If we succeed, Sweden will be accepted into the Rige with open arms! But if we fail, there may only be one way for unification. War."
 newfocus_200_desc:0 "Our Agents and Nordists are ready to take over Sweden. If we succeed, Sweden will be accepted into the Rige with open arms! But if we fail, there may only be one way for unification. War."
 DEN_norwegianputsch_desc:0 "Our Agents and Nordists are ready to take over Norway. If we succeed, Norway will be accepted into the Rige with open arms! But if we fail, there may only be one way for unification. War."
 DEN_norwegianputsch:0 "The Norwegian Putsch"
 DEN_interventioninsweden:0 "Intervention in Sweden"
 DEN_interventioninsweden_desc:0 "It is time to liberate Sweden from itself."
 DEN_interventioninnorway:0 "Intervention in Norway"
 DEN_interventioninnorway_desc:0 "It is time to liberate Norway from itself."
 DEN_integratenorway:0 "Integrate Norway!"
 DEN_integratenorway_desc:0 "Norwegians will be loyal citizens of the future Nordic Rige."
 DEN_integratesweden:0 "Integrate Sweden!"
 DEN_integratesweden_desc:0 "The Swedish must be tamed as they continue to resist us."
 DEN_declarenordicrige:0 "Declare The Nordic Rige!"
 DEN_declarenordicrige_desc:0 "We have completed our war of unification in the north. Now the Greater Nordic Rige shall thrive!"
 DEN_crushfinland:0 "Crush Finland!"
 DEN_crushfinland_desc:0 "The Finns are a disgusting people. They are not deserving of independence."
 DEN_friendshipwithfinland:0 "Friendship with Finland!"
 DEN_friendshipwithfinland_desc:0 "Finland is worthy of our friendship. "
 DEN_claimgreaterfinland:0 "Claim East Karelia!"
 DEN_claimgreaterfinland_desc:0 "East Karelia is ours!"
 DEN_estonia:0 "Demand Estonia!"
 DEN_estonia_desc:0 "All of Estonia belongs to the North!"
 DEN_nordicdemandoosel:0 "Demand  Øsel!"
 DEN_nordicdemandoosel_desc:0 "Demanding anything other than Øsel may cause diplomatic problems with our allies."
 DEN_integratestonia:0 "Integrate Estonia"
 DEN_integratestonia_desc:0 "Estonians must be subjugated and their land recolonized by Nordic settlers."
 DEN_integrateoosel:0 "Integrate Øsel"
 DEN_integrateoosel_desc:0 "Øsel shall have a new population, supporting of our goverment."
 DEN_hamburgconference:0 "The Hamburg Conference"
 DEN_hamburgconference_desc:0 "With German backing, Norway will have no choice but to submit to us."
 DEN_invadenorway:0 "Invade Norway!"
 DEN_invadenorway_desc:0 "Norway and Denmark shall be one again!"
 DEN_integrationofnorway:0 "Integration of Norway"
 DEN_integrationofnorway_desc:0 "Norwegians shall stand together with the Danes!"
 DEN_claimsonsweden:0 "Claims on Sweden!"
 DEN_claimsonsweden_desc:0 "Both Denmark and Norway have lost territory to Sweden. We must reclaim our land from Sweden and install a puppet goverment in Sweden."
 DEN_integratetheswedishlands:0 "Integrate The Swedish Lands"
 DEN_integratetheswedishlands_desc:0 "We have regained our domination of the Swedish. We have taken back lands integral to the Greater Danish-Norwegian Rige! These lands must be integrated."
 DEN_rigsprotektoratsverige:0 "Rigsprotektorat Sverige"
 DEN_rigsprotektoratsverige_desc:0 "We have formed the new Rigsprotektorat in Sweden. This new protectorate will act as puppet state that will forever make the Swedish people docile to us. We will have to choose a Rigsprotektor, who will control the state."
 DEN_antibritainpolicy:0 "Anti-British Policy"
 DEN_antibritainpolicy_desc:0 "Our destiny is dominte the North Sea. Therefore there can be no independent British nation. Great Britain belongs to the Rige!"
 DEN_friendshipwithbritain:0 "Friendship With Britain!"
 DEN_friendshipwithbritain_desc:0 "Britain and Denmark have shared values. We may need their support in the future."
 DEN_operationbluetooth:0 "Operation Blåtand"
 DEN_operationbluetooth_desc:0 "The Final Struggle is upon us! It is time to take down the British beast! Great Britain is Danish!"
 DEN_prepareforinvasionofbritain:0 "Prepare for a Invasion"
 DEN_prepareforinvasionofbritain_desc:0 "A Invasion of Britain hasn't happened in since the Norman conquests. We must prepare and plan, if we are to succed."
 DEN_integrationofbritain:0 "Integration of Britain"
 DEN_integrationofbritain_desc:0 "Britain has been defeated. The land shall soon become truly Danish. Then Great Britain is integrated, Denmark shall take it's place as a major power of the world!"
 DEN_socialistneutrality:0 "Socialist Neutrality"
 DEN_socialistneutrality_desc:0 "We shall not engage in petty imperialist war. We shall build our own socialist utopia with neutrality."
 DEN_directordersfrommoscow:0 "Direct Orders From Moscow"
 DEN_directordersfrommoscow_desc:0 "We shall retrieve direct orders from the Comintern. Moscow knows what's best."
 DEN_directordersfromgermany:0 "Direct Orders From Berlin"
 DEN_directordersfromberlin:0 "Direct Orders From Berlin"
 DEN_directordersfromberlin_desc:0 "We can trust Berlin. Our compliance is needed for Gernany's plans."
 DEN_scandinaviansocialistrevolts:0 "The Scandinavian Revoltution"
 DEN_scandinaviansocialistrevolt:0 "The Scandinavian Revoltution"
 DEN_scandinaviansocialistrevolt_desc:0 "The wave of revoltution can felt in the north. Scandinavia has been divided by Kings for too long. The tide of Communism will liberate Scandinavia and Break the chains of the Worker!"
 DEN_directordersfromparis:0 "Direct Orders From Paris"
 DEN_directordersfromparis_desc:0 "With communism triumphant in France, we can trust them. We need their protection and they need control of the Danish belts."
 DEN_fundrevolutionaries:0 "Train Revolutionaries"
 DEN_fundrevolutionaries_desc:0 "Communists in Sweden and Norway"
 DEN_trainrevolutionaries:0 "Train Revolutionaries"
 DEN_trainrevolutionaries_desc:0 "Many Scandinavian communists are flocking to Denmark to see our succesful revolution. Some of these may not able to come back. We should train these people and prepare them to liberate their homeland. "
 DEN_aarhuscongress:0 "Aarhus Congress"
 DEN_aarhuscongress_desc:0 "The Aarhus Congress will be held. Together with other Communists from our allies and Scandinavia. We will need the support of the Scandinavian communists if the liberation is to succeed."
 DEN_revolutioninsweden:0 "Revolution in Sweden!"
 DEN_revolutioninsweden_desc:0 "It is time to liberate Sweden from bourgeoisie dictatorship!"
 DEN_revolutioninnorway:0 "Revolution in Norway!"
 DEN_unificationtreaty:0 "Unification Treaty"
 DEN_unificationtreaty_desc:0 "With the revolutions triumphant, we shall unite in the name of internationalism!"
 DEN_thefinnishquestion:0 "The Finnish Question"
 DEN_thefinnishquestion_desc:0 "What to do with Finland? Should Finland be integrated into our nation or the USSR? Maybe a independent Finland prefered."
 DEN_liberatefinland:0 "Liberate Finland!"
 DEN_liberatefinland_desc:0 "Look out Finnish workers! Your liberation is coming!"
 DEN_thechurch:0 "The Church?"
 DEN_thechurch_desc:0 "Many of our supporters are losing faith in us because of our terror campaign against the old bourgeoisie ideal. We must decide what to do with the Church of Denmark. Many of our supporters are christians, but they didn't expect the revolution would bring persecution. Most of the DKP hardliners still support nationalizing Church property. Should we protect the Church or leave it to it's fate?"
 DEN_meetwithstauning:0 "Meet with Stauning"
 DEN_meetwithstauning_desc:0 "It was wise for the Social democrats to merge with us, but Stauning might have other plans for the future of Denmark."
 DEN_hangtheking:0 "Hang The King!"
 DEN_hangtheking_desc:0 "Our tyrant king fled to the Atlantic, planning his return. There will be no return! We shall save his enslaved Workers and hang him in the name of Revolution!"
 DEN_theicelandicquestion:0 "The Icelandic Question"
 DEN_theicelandicquestion_desc:0 "Many of the Icelandic workers were expecting independence then we liberated their homeland. Should they have it?"
 DEN_moollerplanen:0 "Mølllerplanen"
 DEN_moollerplanen_desc:0 "John Christmas Møller has laid out a new plan for economic stability. We should follow it and rebuild Denmarks economy."
 DEN_socialreformen_desc:0 "K. K. Steincke has proposed a set of reforms that help the poor people of Danish society. Welfare for all!"
 DEN_taxreformsmooller:0 "Tax Reforms"
 DEN_taxreformsmooller_desc:0 "Our current taxes are inefficient and useless. The poor can't pay and we will change that."
 DEN_strengthenthelaws:0 "Stengthen The Laws!"
 DEN_strengthenthelaws_desc:0 "Our laws are weak and don't bring the protection they should! Time to reform them!"
 DEN_workwithvenstre_desc:0 "We can't save Denmark alone! With Venstre we can!"
 DEN_abandonneutrality:0 "Abandon Neutrality!"
 DEN_armedneutrality_desc:0 "Until now, we have followed a policy of "defenceless neutrality". This policy supported the idea that Denmark had no hope of victory in case of invasion. This is an foolish assumption! With enough defences and a strong army, not even the Germans will destroy us!"
 DEN_militrayfunding:0 "Military Funding"
 DEN_militrayfunding_desc:0 "The military needs funding if our plans shall come to fruition."
 DEN_devaluekrone_desc:0 "If some politicians hate it, we have to devalue the krone if this economy is going to survive!"
 DEN_newtradepartners:0 "New Trade Partners?"
 DEN_newtradepartners_desc:0 "Outside help may be just what we need."
 DEN_meetwiththeemployers:0 "Meet with the Employers"
 DEN_meetwiththeemployers_desc:0 "The Employers"
 DEN_banthednsap:0 "Ban the DNSAP!"
 DEN_banthednsap_desc:0 "The DNSAP are threatening our democracy! They are nothing but scum and should be removed!"
 DEN_dannevirke:0 "A new Dannevirke?"
 DEN_dannevirke_desc:0 "The old fortress of Dannevirke was legenday until 1864 where our armies had no choice but to abandon it. We will build a new fortress that shall protect Denmark!"
 DEN_lookforprotection:0 "Look for Protection!"
 DEN_lookforprotection_desc:0 "We will need alliances in the coming years."
 DEN_rebuildbusinesses:0 "Rebuild Businesses"
 DEN_rebuildbusinesses_desc:0 "Many of our businesses are completely starved by the labour strikes. They will need help from the state to survive."
 DEN_supportthefarmers:0 "Support The Farmers!"
 DEN_supportthefarmers_desc:0 "The farmers are the people the most harmed by the depression! They will need help from the state too."
 DEN_alliancewithgermany:0 "Alliance With Germany!"
 DEN_alliancewithgermany_desc:0 "The Scleswig Question was solved peacefully in the aftermath of the Great War. There is no reason to still see Germany as a threat."
 DEN_alliancewithfrance:0 "Alliance With France!"
 DEN_alliancewithfrance_desc:0 "We can't trust the Germans. France can't trust the Germans. We should ally with France."
 DEN_alliancewithbritain:0 "Alliance With Britain!"
 DEN_alliancewithbritain_desc:0 "Britain might find it useful controlling the Danish belts with us. Clearly we are deserving of their protection!"
 DEN_alliancewithpoland:0 "Alliance With Poland!"
 DEN_alliancewithpoland_desc:0 "The Polish "Intermarium" share common interests as us. If we join, the "Intermarium" may be able to control the baltic sea."
 DEN_germanindustry:0 "German Industry"
 DEN_germanarmstreaty:0 "German Arms Treaty"
 DEN_germanarmstreaty_desc:0 "Germany has superior weapons and equipment than us. They should share their technology with us."
 DEN_britishnavaltreaty:0 "British Naval Treaty"
 DEN_britishnavaltreaty_desc:0 "Britain rules the waves and we want to too!"
 DEN_frenchtechnologytreaty:0 "French Technology Treaty"
 DEN_frenchtechnologytreaty_desc:0 "France should share their technology with her allies!"
 DEN_polishworkers:0 "Polish Workers"
 DEN_polishworkers_desc:0 "Denmark needs as many people it can get, working in the factories. Maybe an exchange is in order."
 DEN_anewkingdom:0 "A New Kingdom!"
 DEN_anewkingdom_desc:0 "We have made a new and better Danish Kingdom, that will not collapse like the old one."
 DEN_restoredemocracy:0 "Restore Democracy"
 DEN_restoredemocracy_desc:0 "Danish democracy has been saved thanks to the King. Fascists and Communists will not be part of this new restored democracy though."
 DEN_pursuearmedneutrality:0 "Pursue Armed Neutrality"
 DEN_pursuearmedneutrality_desc:0 "To protect Denmark, we must have a armed military ready at all times!"
 DEN_claimflensborg:0 "Claim Flensborg"
 DEN_claimflensborg_desc:0 "How can anybody say Flensborg is not Danish?!"
 DEN_birthempire_desc:0 "The King shall be crowned Emperor or "Kejser" of Denmark. Denmark will be mighty!"
 DEN_unionwithnorway:0 "Union with Norway?"
 DEN_unionwithnorway_desc:0 "With both Denmark and Norway under attack from Germany, maybe we should consider forming a union between our two countries."
 DEN_scandinaviandefenceunion:0 "The Scandinavian Defence Union!"
 DEN_scandinavianpassportunion:0 "Scandinavian Passport Union"
 DEN_scandinavianpassportunion_desc:0 "A passport union between the member-states of the Union, will allow the people to travel freely between countries!"
 DEN_scandinavmonetaryunion:0 "Scandinavian Monetary Union"
 DEN_scandinavmonetaryunion_desc:0 "The Scandinavian Monetary Union was effectively ended with the outbreak of the Great War. We should try and reestablish it."
 DEN_nordiceconomicarea:0 "Nordic Economic Area"
 DEN_nordiceconomicarea_desc:0 "Some members of the Nordic Council have proposed establishing a economic zone for Scandinavia to increase posperity."
 DEN_nordiccouncil:0 "Nordic Council"
 DEN_nordiccouncil_desc:0 "To promote friendship and cooperation between Scandinavia, we should establish the Nordic Council."
 DEN_scandinaviandefenceunion_desc:0 "Scandinavia will defend itself together!"
 DEN_scandinavianfriendship:0 "Scandinavian Friendship"
 DEN_scandinavianfriendship_desc:0 "The rest of Scandinavia are our friends! Why shouldn't we be friends?"
 DEN_subjugatescandinavia:0 "Subjugate Scandinavia!"
 DEN_subjugatescandinavia_desc:0 "The Empire shall retake lost territories in Scandinavia, whatever the cost!"
 DEN_annexnorway:0 "Annex Norway!"
 DEN_annexnorway_desc:0 "Norway shall be forced into a union with Denmark!"
 DEN_integratethenorwegians:0 "Integrate The Norwegians"
 DEN_integratethenorwegians_desc:0 "Norway is now Danish. They don't seem to understand this."
 DEN_invadetheswedish:0 "Invade The Swedish!"
 DEN_invadetheswedish_desc:0 "This is the final war with the Swedes. The one that will decide the fate of all of Scandinavia. Let us win this war with honour and pride!"
 DEN_anewunion:0 "A New Union?"
 DEN_anewunion_desc:0 "With the Swedish destroyed, some members of the King's inner circle are proposing that we should establish a personal union with the Swedes."
 DEN_kingdomofsweden:0 "Kingdom of Sweden"
 DEN_kingdomofsweden_desc:0 "A new Swedish Kingdom with a Glücksburg on the throne! But who should take this responsibility?"
 DEN_enforceconscription:0 "Enforce Conscription"
 DEN_enforceconscription_desc:0 "Until now conscription"
 DEN_purgedisloyalarmymen:0 "Purge Disloyal Armymen"
 DEN_purgedisloyalarmymen_desc:0 "With the collapse of civil order that happened before the King's coup, many armymen have radicalized, some even refusing orders. We can't have this! The army needs to be loyal to it's king!"
 DEN_pushforunification:0 "Push For Unification!"
 DEN_pushforunification_desc:0 "With the succes of our many pan-scandinavian policies, we should try and move for a unified Scandinavian state. Before this can happen though, we must decide the nature of this new union."
 DEN_claimaaland:0 "Claim Åland"
 DEN_claimaaland_desc:0 "Neither Finland or Sweden should have this archipelago. It's belongs to the Rige!"
 DEN_friendshipwithfinlan:0 "Friendship With Finland"
 DEN_friendshipwithfinlan_desc:0 "Finland and Denmark needs to stand together against bolshevism!"
 DEN_fortresskingdom:0 "Fortress Kingdom"
 DEN_fortresskingdom_desc:0 "Denmark will be like impregnable fortress. We shall never surrender!"
 DEN_scandinavianconfed:0 "Scandinavian Confederacy"
 DEN_scandinavianconfed_desc:0 "This union must not destroy the national dentities of Denmark, Sweden and Norway. A decentralized confederacy is desired."
 DEN_scandinavianfederation:0 "Scandinavian Federation"
 DEN_scandinavianfederation_desc:0 "All of the member-states must answer to the Federal Goverment. Without this, the country will fall apart in no time."
 DEN_Govermentcollapses_desc:0 "Oh dear."
 DEN_thekingsteps_desc:0 "The King is here for us!"
 DEN_dkpvictory_desc:0 "The Workers have had enough!"
 DEN_dnsapvictory_desc:0 "The Fører shall save this country!"
 DEN_kingsmen:0 "The King's Men"
 DEN_kingsmen_desc:0 "A secret police required to defend the Monarchy."
 DEN_appointkonservative_desc:0 "The Conservative party under John Christmas Møller might be able work together with us."
 DEN_gowitharmy_desc:0 "The army can be trusted as always."
 DEN_Govermentcollapses:0 "The Goverment Collapses!"
 DEN_civilprotectionact_desc:0 "The "Borger Beskyttelseslov" will protect the public from all counter-revolutionary forces!"
 DEN_revolutioninnorway_desc:0 "It is time to liberate Norway from bourgeoisie dictatorship!"
 DEN_bancommies_desc:0 "Saying communists are humans is.. debatable to say the least."
 DEN_nationwiderallies:0 "Nationwide Rallies"
 DEN_nazischools_desc:0 "The schools aren't teaching the next generation the right things! We have to change this, now!"
 DEN_declarerige:0 "Declare A New Rige!"
 DEN_rigsbank:0 "Form The Rigsbank"
 DEN_writegrundlov:0 "Write a New Constitution"
 DEN_secretpolice:0 "The Secret Police"
 DEN_secretpolice_desc:0 "Some people just need to be removed. Silently."
 
 continuous_naval_production:0 "Naval Production"
 continuous_naval_production_desc:0 "By focusing resources on our shipyards and exempting skilled shipbuilders from military service, we can dramatically reduce production time for ships."
 continuous_air_production:0 "Air Production"
 continuous_air_production_desc:0 "We can reorganize our aviation industry to eliminate waste and streamline production."
 continuous_non_factory_construct:0 "Construction Engineering"
 continuous_non_factory_construct_desc:0 "There is still a lot of slack in our construction industry. By focusing our attention on it, we can achieve a significant improvent in construction speed. Unfortunately, the production of machine tools has proven a major bottleneck in the expansion of our heavy industry, so they won't benefit from efforts in this area. "
 continuous_reduce_training_time:0 "Army Training"
 continuous_reduce_training_time_desc:0 "By creating specialized advanced training units within each division, we can deploy even divisions that would previously have been held back to finish training to the front."
 continuous_suppression:0 "Resistance Suppression"
 continuous_suppression_desc:0 "By infiltrating the major resistance groups in occupied territory and turning their leaders, we can significantly reduce the amount of damage they can do."
 continuous_repair:0 "Construction Repair"
 continuous_repair_desc:0 "We will form specialized repair teams from factory and construction workers and centrally control their deployment to improve reconstruction of damaged infrastructure."
 continuous_tech_share:0 "Technology Sharing"
 continuous_tech_share_desc:0 "We will encourage our research institutes and universities to reach out to their counter parts in allied countries. This will gain us a tech sharing bonus."
 continuous_boost_freedom:0 "Increase Autonomy"
 continuous_boost_freedom_desc:0 "By reorganizing our colonial bureaucracy and recruiting native administrators, we will, in time, be able to take charge of our own affairs."
 continuous_restrict_freedom:0 "Suppress Subjects"
 
continuous_restrict_freedom_desc:0 "Our colonial subjects have gotten rather silly ideas about things like "self-determination" or "national independence". It is time to disabuse them of these notions."

