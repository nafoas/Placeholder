 GEN_asia_approach_japan:0 "Approach Japan"
 GEN_asia_approach_japan_desc:0 "The Japanese are a Rising Power in Asia. In the past decade, they have been expanding into China piece-by-piece, and have built themselves an impressive military industry in the Home Islands. We should seek to ally with them."
 GEN_asia_approach_britain:0 "Approach the United Kingdom"
 GEN_asia_approach_britain_desc:0 "The British have a great empire spanning the planet, to ignore such a powerful player would be foolish, we can establish an embassy in their capital and start aligning ourselves to them."
