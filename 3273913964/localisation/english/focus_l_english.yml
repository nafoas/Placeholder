 DEN_kanslergade:0 "Meeting at Kanslergade"
 DEN_kanslergade_desc:0 "A meeting will be held on the 29th to try and solve the economic crisis in the country. The parties must seek a compromise.  If not, Denmark could see the rise of communism or even nazism."
 DEN_kanslergadeagree:0 "Kanslergadeforliget"
 DEN_kanslergadeagree_desc:0 "The meeting was a success! Venstre has agreed to cooperate with the ruling parties and we will soon bring this country back together!"
