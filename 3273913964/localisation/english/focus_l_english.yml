 SPR_ieu:0 "Iberian Economic Union"
 SPR_ieu_desc:0 "Our new friendship with Portugal can be a great boom for our nations' economies if we coordinate. A loose Iberian Economic Union should be the first step towards Iberian prosperity!"
 SPR_lisbon_barcelona:0 "Lisbon-Barcelona Highway"
 SPR_lisbon_barcelona_desc:0 "From Lisbon to Barcelona, the Iberian Highway will greatly improve communication and trade between our countries."
 SPR_iberia_military:0 "Iberian Military Academy"
 SPR_iberia_military_desc:0 "We must stand ready to defend each other, and through joint training and strategy exchanges we should be able to fight better, alone and together."
 SPR_sevilla_port:0 "Develop Cádiz Ports"
 SPR_sevilla_port_desc:0 ""
 SPR_colombia:0 "Befriend Colombia"
 SPR_colombia_desc:0 ""
 SPR_peru:0 "Approach Peru"
 SPR_peru_desc:0 ""
 SPR_exchanges:0 "Student Exchanges"
 SPR_exchanges_desc:0 ""
 SPR_associated:0 "Associated Universities"
 SPR_associated_desc:0 ""
 SPR_mediate:0 "Conflict Mediation"
 SPR_mediate_desc:0 ""
 SPR_brazil:0 "The Brazilian Question"
 SPR_brazil_desc:0 ""
 SPR_chile:0 "Reach Out To Chile"
 SPR_chile_desc:0 ""
 SPR_hispano_american_oil:0 "Hispano American Oil"
 SPR_hispano_american_oil_desc:0 ""
 SPR_mexico:0 "Befriend Mexico"
 SPR_mexico_desc:0 ""
 SPR_venezuela:0 "Befriend Venezuela"
 SPR_venezuela_desc:0 ""
 SPR_argentina:0 "Befriend Argentina"
 SPR_argentina_desc:0 ""
 SPR_cultural:0 "Cultural Initiatives"
 SPR_cultural_desc:0 ""
 SPR_equals:0 "Recognition as Equals"
 SPR_equals_desc:0 ""
 SPR_olivenza:0 "Olivenza Plebiscite"
 SPR_olivenza_desc:0 ""
 SPR_befriend_por:0 "Befriend Portugal"
 SPR_befriend_por_desc:0 "A friendly, democratic government has taken control of Portugal. We should approach them for our ambitious cooperation plans."
 SPR_liberate_por:0 "Liberate Portugal"
 SPR_liberate_por_desc:0 "Portugal is suffering under the reactionary yoke! We need to support the Portuguese democratic opposition that is currently exiled in Madrid, and destroy the Estado Novo by force. We need Britain to agree though..."
 SPR_war_against_fascism:0 "The War Against Fascism"
 SPR_war_against_fascism_desc:0 "The most decisive war of human history has begun. We  can't stay idle as the free peoples of the world fight against the evils of fascism: we need to join the war!""
 SPR_anti_fascist_fortress:0 "Línea Pirineos"
 SPR_anti_fascist_fortress_desc:0 "The P Line, officially Organización defensiva del Pirineo (Defensive Organization of the Pyrenees), will be a line of fortifications from Irún to Figueras designed to protect the Peninsula from attacks comming from France. Theorically the line plans for the construction of 10000 bunkers across the mountain range."
 SPR_fortify_baleares: "Fortify Mallorca"
 SPR_fortify_baleares_desc: ""
 SPR_fortify_canarias: "Fortify Canarias"
 SPR_fortify_canarias_desc: ""
 SPR_fortify_algeciras: "Protect the Strait"
 SPR_fortify_algeciras_desc: ""
 SPR_inspire_soldiers:0 "The Republic Needs You!"
 SPR_inspire_soldiers_desc:0 "Our army has been... skeptical with the liberal Republic, at best. Now that the nation is under threat, we need to inspire liberal, republican nationalism in the population, that inspires them to join the Army and defend the Republic!"
 SPR_cooperate_allies:0 "Allied Cooperation"
 SPR_cooperate_allies_desc:0 "Now that we have joined an alliance, we need to cooperate so that we can get the most out of it, and together, win the war!"
 SPR_food_imports:0 "Secure Food Imports"
 SPR_food_imports_desc:0 "The war threatenes our food supply, and we might face a famine soon. We need to secure food imports from our allies so that we avoid famine."
 SPR_ask_american_air_sup:0 "Ask for American Air Support"
 SPR_ask_american_air_sup_desc:0 "The United States have an enormous amount of factories, and their production levels are staggering. We could ask President [USA.GetLeader] for some support for our airforce: modern planes and better organization and tactics."
 SPR_joint_tungsten_prospect:0 "Compañía Aliada del Wolframio"
 SPR_joint_tungsten_prospect_desc:0 "There's lots of untapped tungsten in Galicia waiting for us to get it. We can set up, together with our allies, a mining company that ensures that we all have enough tungsten, and that our enemies don't."
 SPR_revive_spirit_1808:0 "Revive the Spirit of 1808"
 SPR_revive_spirit_1808_desc:0 "The Peninsula has fallen, but it isn't the first time this happens. Back in 1808, the people got together, organized, and staged a massive revolt against Napoleon that ultimately kicked him out of Spain. We need to revive the spirit 1808, uniting our people into a common, patriotic cause: kicking the invaders out!"
 SPR_contact_requetes:0 "Contact the Requetés"
 SPR_contact_requetes_desc:0 "The carlist Requetés are still around, and they don't trust our government for a second. However, they can't stand the occupation, and should be willing to collaborate in the uprising we are planning."
 SPR_contact_communist_guerrillas:0 "Secure Leftist Support"
 SPR_contact_communist_guerrillas_desc:0 "The Communist, Socialist and Anarchist militias that have formed after the occupation have wildly different goals and they are all opposed to our liberal Republic. However, they should be willing to join our uprising plans, as we have a powerful common enemy."
 SPR_guerra_independencia:0 "Guerra de Independencia"
 SPR_guerra_independencia_desc:0 "The time has come! It is time for Spain to free itself from the invader and kick them out of our precious country. For Spain and for the Republic, arise!"
 spr_join_ww2:0 "§YWe will join the War against Fascism!§!"
 spirit_dos_mayo_tt:0 "Spanish Guerrilla"
 carlist_join_ind_tt:0 "§YThe§! §gCarlists§! §Ywill join in our uprising!§!"
 left_join_ind_tt:0 "§YThe§! §RLeftists§! §Ywill join in our uprising!§!"
 spr_indep_tt:0 "The §CRepublicans§! will rebel in §YMadrid§! and §YAndalusia§! \nThe §gCarlists§! will rebel in §YNavarra§! and §YBasque Country§! \nThe §RLeftists§! will rebel in §YCatalonia§! and §YValencia§!"
 
 
 SPR_18_julio:0 "18 de Julio"
 SPR_18_julio_desc:0 "The military coup has failed! Despite this, lots of divisions have defected to the treacherous nationalists, and their Army of Africa can be a serious threat. The war has begun."
 SPR_arm_people:0 "Arm The People"
 SPR_arm_people_desc:0 "Although the old governemnt was reluctant to the idea of arming the people, José Giral has realized that the socialist, anarchist and communist militias are the only thing that can stop the fascists at this point. Let us distribute weapons to the workers!"
 SPR_french_help:0 "Ask France For Help"
 SPR_french_help_desc:0 "France is a democratic Republic, like us, so we should ask them for help against this dangerous coup. We'll need small arms, artillery, and especially planes."
 SPR_no_pasaran:0 "¡No Pasarán!"
 SPR_no_pasaran_desc:0 "We need a massive propaganda effort so that our soldiers stop retreating, or Madrid might fall to the fascists. Madrid will be our Verdún. Resist!"
 SPR_single_pay:0 "One Pay For Everyone"
 SPR_single_pay_desc:0 "If we want to transform the militias into a proper army, a good first step would be to centralize payment and make it homogeneous. Those who refuse to comply and lack discipline won't receive pay."
 SPR_discipline:0 "Impose Discipline"
 SPR_discipline_desc:0 "Anarchist enthusiasm needs to be lowered a bit. What we need right now is discipline or the fascists will win every battle. Sin Disciplina no hay Victoria!"
 SPR_brigadas_mix:0 "Brigadas Mixtas"
 SPR_brigadas_mix_desc:0 "Following the model of the communist militia Quinto Regimiento, Largo Caballero has decided to create 6 Mixed Brigades. They will form the basis of the new army of the Republic."
 SPR_call_unity:0 "Call For Unity"
 SPR_call_unity_desc:0 "Tensions between anarchists and socialists on one side, and communists and republicans on the other, are rapidly increasing. We need to make a call for Anti-Fascist Unity and revive the spirit of the Popular Front. The fascists will easily defeat us if we are not united."
 SPR_moscow_gold:0 "Moscow Gold"
 SPR_moscow_gold_desc:0 "The Soviets have accepted to support us in this struggle. However, before we receive anything, they want the Gold Reserves of the Bank of Spain as payment. Let us send those to Moscow, then."
 SPR_western_trust:0 "Trust In The West"
 SPR_western_trust_desc:0 "France has agreed to support us, and Britain seems to allow it. We can rely on western powers and avoid Soviet manipulations, keeping the PCE under control."
 SPR_international:0 "International Brigades"
 SPR_international_desc:0 "Thousands of volunteers across the world have organized to fight in Spain for the anti-fascist cause! They are mostly French, but there are also Germans, Italian exiles, Poles, British, Americans and more! We need to send these men to the front as soon as we can."
 SPR_crisis_37:0 "Crisis of May 37"
 SPR_crisis_37_desc:0 "As the CNT and the POUM defy the Government, it is clear that something needs to change. Either Largo Caballero continues in power, in a more revolutionary direction, or moderate socialist Juan Negrín becomes Head of Government with communist support!"
 SPR_revolution:0 "Revolutionary Cabinet"
 SPR_revolution_desc:0 "Communists and Republicans have betrayed the Popular Front and the Revolution! We need to rely on popular enthusiasm and revolutionary violence to win the war, or we might end up as a bourgeois Republic again."
 SPR_revol_army:0 "Ejército Revolucionario"
 SPR_revol_army_desc:0 "The Revolutionary Army of the Republic operates on a militia structure, with elected officers and reliance on numbers rather than discipline. Discipline is fascist!"
 SPR_behind_their:0 "Behind Their Lines!"
 SPR_behind_their_desc:0 "By promoting Revolutionary activity instead of strict discipline, we might be able to fight a Guerrilla war behind the Nationalist lines, to disrupt their supply lines and their communications."
 SPR_collectivize:0 "Collectivize The Fields"
 SPR_collectivize_desc:0 "All farms, despite protests from communists and republicans, need to be collectivized right now! Collective farms have worked reasonably well, and they will form the basis of the new socialist economy!"
 SPR_dem_factories:0 "Democratic Factories"
 SPR_dem_factories_desc:0 "Factories need to be managed by committees that are democratically elected by the workers themselves. We can't wage a war to liberate the workers with weapons made by exploitation and opression."
 SPR_liberate_women:0 "Liberate Women"
 SPR_liberate_women_desc:0 "Everyone is completely free from their chains, and that includes women. We must ensure that the Women's Liberation that happened during the Revolution results in full gender equality once Libertarian Communism is archieved."
 SPR_comunismo_libertario: "Proclaim Libertarian Communism"
 SPR_burn_chur:0 "Burn More Churches"
 SPR_burn_chur_desc:0 "The only Church that enlightens the people is the one that's in flames! We need to continue the anti-clerical Revolution and completely root out the putrid Catholic church from our society!"
 SPR_hunt_burg:0 "Hunt The Bourgeoisie"
 SPR_hunt_burg_desc:0 "Most of the bourgeoisie have supported the military coup, and those who have remained loyal to the Republic are still against the Revolution. We will retake the Class War in Spain with one decisive blow that destroys the upper classes!"
 SPR_sov_puppets:0 "Eliminate Stalinists"
 SPR_sov_puppets_desc:0 "The PCE is just a puppet of Stalin and his murderous regime. We need to destroy them now or they might impose their Red Fascism on us when they have the chance."
 SPR_final_offensive:0 "La Ofensiva Final"
 SPR_final_offensive_desc:0 "It is time for the final offensive. Neither capitalists nor stalinists will help us to destroy the fascist scum, so the Spanish people shall take arms and do it themselves with an unrelenting show of force!"
 SPR_negrin:0 "The Negrín Cabinet"
 SPR_negrin_desc:0 "Doctor Juan Negrín, a socialist and former Minister of Finances, has been appointed the new Head of Government. He enjoys the support of communists, republicans and moderate socialists, and he is determined to restore order and win this war!"
 SPR_restore_ord:0 "Restore Order"
 SPR_restore_ord_desc:0 "Order must be restored! We need to re-enforce the Constitution into this chaos and stop the revolutionaries if we want western support. Collectivized farms will be returned to their rightful owners, priests will be restored to their churches, and we will transition towards a War Economy!"
 SPR_destroy_crime:0 "Punish Criminals"
 SPR_destroy_crime_desc:0 "Many criminals disguised their horrendous acts at the beggining of the war, like murders, assaults and robberies, as acts of \"Revolutionary justice\". We need to end this and punish those who have participated in the bloodbath of the first months of the war."
 SPR_fai_barbarians:0 "FAI Barbarians"
 SPR_fai_barbarians_desc:0 "The FAI continues to defy our authority. They need to be put down before the stage a Revolution against the Revolution!"
 SPR_restore_personal:0 "Restore Personal Property"
 SPR_restore_personal_desc:0 "Personal property, from farms to factories, needs to be properly restored. That way, the west might be more inclined to support us, and the middle class will stop supporting the Nationalists."
 SPR_weapon_imports:0 "Intensify Weapon Imports"
 SPR_weapon_imports_desc:0 "We need more weapons! The USSR, Mexico, and even France need to know that it's either us or fascism, and their weapons will be of great help."
 SPR_call_western:0 "Call For Western Help"
 SPR_call_western_desc:0 "We need western help! Let Britain and France know that we are just another democracy threatened by fascism, and that if a war erupted between them and the fascist powers, we would be on their side."
 SPR_people_army:0 "Ejército Popular"
 SPR_people_army_desc:0 "The new Popular Army of the Republic has restored discipline over its pre-war counterpart. They will defend every inch of the Republic and destroy the fascists in a swift counter-attack!"
 SPR_train_militia_leaders:0 "Train Militia Leaders"
 SPR_train_militia_leaders_desc:0 "Militia leaders, like Líster, El Campesino or Modesto, need to be properly trained in the Art of War so that they are effective military leaders. Combining popular enthusiasm with military expertise is the key to victory!"
 SPR_la_gloriosa:0 "Strengthen La Gloriosa"
 SPR_la_gloriosa_desc:0 "La Gloriosa, as our people call the Spanish Republican Airforce ( FARE ) needs to be strenghtened. Our airforce is the vanguard of anti-fascism, that will crush without compassion, the black beast of reaction!"
 SPR_resistir_vencer:0 "Resistir Es Vencer"
 SPR_resistir_vencer_desc:0 "A War in Europe is just a matter of time. We need to resist, to resist and to resist, until the war starts and we can join the Allies. Resistir es Vencer!"
 SPR_amenaza_socialista:0 "La Amenaza Socialista"
 SPR_amenaza_socialista_desc:0 "The socialists are threatening our culture and our values, but we are stronger. We shall fight them until Spain is clear from the red scum, or die!"
 SPR_rev_general_mob:0 "General Mobilization"
 SPR_rev_general_mob_desc:0 "It is time to fully mobilize our army. Call the reserves and organize our men, we will have to fight!"
 SPR_rev_establish_rations: "Stablish Rationing"
 SPR_rev_establish_rations_desc: "TODO"
 SPR_rev_censor_press: "Censor the Press"
 SPR_rev_censor_press_desc: "We will issue a decree that censors the press as a \"wartime necessity\". This will allow us to control the narrative of what is happening to prevent information that could be vital for the war effort to reach out to the enemy, along with making sure that dangerous ideas dont spread across the nation and that the attrocities commited by our troops remain hidden to the population."
 SPR_military_steps:0 "The Military Steps In"
 SPR_military_steps_desc:0 "The weak civilian government couldn't handle the revolt. The army, the true guardian of spanish traditions, had no option but to step in and save the country."
 SPR_arrest_left_politicians:0 "Arrest Leftist Politicians"
 SPR_arrest_left_politicians_desc:0 ""
 SPR_choose_caudillo:0 "Choose A Caudillo"
 SPR_choose_caudillo_desc:0 "It is time to finally choose a Caudillo and unite behind him, and not die in petty disputes."
 SPR_arrest_officers:0 "Arrest Republican Officers"
 SPR_arrest_officers_desc:0 "All left-leaning officers (by that we mean everyone to the left of the CEDA) who did not support the coup will be arrested immediately, as they pose a threat to our rule."
 SPR_militarization:0 "Militarize The Factories"
 SPR_militarization_desc:0 "We know no worker's rights while the reds are attacking us. The military shall impose efficiency in the factories, and the workers will accept it or die."
 will_gain_requetes:0 "Will gain 6 militia divisions!"
 SPR_national_coalition:0 "The National Coalition"
 SPR_national_coalition_desc:0 "It is no time for divisions. All those who oppose communism shall form a coalition, led by Gil-Robles, to save this country."
 SPR_economic_control:0 "Total Economic Control"
 SPR_economic_control_desc:0 "We need all businesses and factories collaborating to the war effort. Those who oppose us shall be nationalized."
 SPR_estado_guerra:0 "Estado de Guerra"
 SPR_estado_guerra_desc:0 "It is time to declare the State of War. Civil liberties shall be restricted and the economy shall begun to mobilize."
 SPR_british_aid:0 "British Aid"
 SPR_british_aid_desc:0 "We have made some contacts with Britain, but it is time to send an official help petition against the communists."
 SPR_dissolve_cortes:0 "Dissolve The Cortes"
 SPR_dissolve_cortes_desc:0 "The first step of our political agenda will be dissolving the Parliament and handing all power to the government. If this is permanent or provisional, that's not yet decided."
 SPR_stood:0 "The Republic Has Stood"
 SPR_stood_desc:0 "In our darkest hour, we never gave up democracy. The Republic has survived against all odds, and now we have to make sure that this war never happens again."
 SPR_national_reconciliation:0 "National Reconciliation"
 SPR_national_reconciliation_desc:0 "We can't pretend that those who rebelled against us have dissapeared. They are still there, and we have to reconcile with them is we want to unite the country."
 SPR_prisioner_liberation:0 "Prisioner Liberation"
 SPR_prisioner_liberation_desc:0 "Our prisions are full with people that their only crime was joining the side they believed was better for them and their families. The best way to show them that the republic is better is liberating those without blood crimes."
 SPR_apologize:0 "Apologize For Our Crimes"
 SPR_apologize_desc:0 "We have comitted many crimes. The victims deserve recognition, so we shall publicly apologize for our crimes and give the victims recognition and help."
 SPR_foreign_threats:0 "Focus On Foreign Threats"
 SPR_foreign_threats_desc:0 "We can't remain divided with the world in flames. The only way to beat foreign dangers is to stay united."
 SPR_unite_people:0 "Unite The People"
 SPR_unite_people_desc:0 "We are not social democrats, liberals, conservatives or socialists. We are not castilians, catalans, galicians or basques. We are all spaniards, we are all brothers."
 SPR_war_memorial:0 "War Memorial"
 SPR_war_memorial_desc:0 "To fully commit to reconciliation, we shall build a war memorial in Cuelgamuros. It shall be a museum of the civil war, and a memorial of all the victims, even ours. It will of course be built with volunteer workforce."
 SPR_restore_parliament:0 "Restore The Parliament"
 SPR_restore_parliament_desc:0 "The war is over, and we should fully restore the powers of the Parliament, to become a democracy again."
 reopen_parliament:0 "§YThe Parliament will be enabled again!§!"
 SPR_normalize_politics:0 "Normalize Politics"
 SPR_normalize_politics_desc:0 "It is time for political parties to start running for regional elections, holding public debates, discussing laws in the Parliament... Become a normal democracy again."
 SPR_nunca_mas:0 "Nunca Más"
 SPR_nunca_mas_desc:0 "Never again. Never again shall Spain be divided. Never again shall our democracy be threatened. Never again shall brother fight against brother."
 SPR_non_negotiable:0 "Democracy Is Non-Negotiable"
 SPR_non_negotiable_desc:0 "If we show mercy with the rebels, they will undoubtly try again. The only way to save democracy is to be harsh on those who threaten it."
 SPR_kill_traitors:0 "Kill The Traitors"
 SPR_kill_traitors_desc:0 "Those rebel traitors, those politicians that called for the end of democracy, shall be processed and executed. That includes criminals that used the war as an excuse for their atrocities."
 SPR_ensure_victory:0 "Ensure Our Victory"
 SPR_ensure_victory_desc:0 "We can't relax one second. The enemies of democracy are still there, and we have to continue fighting them to ensure they never rise again."
 SPR_fifth_column:0 "La Quinta Columna"
 SPR_fifth_column_desc:0 "Those persons who belonged to anti-democratic organizations, those who fought against us, shall be monitored closely. We have to ensure they stay quiet."
 SPR_militant_democracy:0 "Militant Democracy"
 SPR_militant_democracy_desc:0 "We can't tolerate those who are intolerant. We can't give freedom to those who want to take it from us. We can't allow enemies of democracy to use it against us."
 SPR_ban_extremism:0 "Ban Extremism"
 SPR_ban_extremism_desc:0 "All extremist organizations and unions shall be banned and prosecuted. We can't give our enemies a place to meet."
 SPR_curtail_government:0 "Curtail Government Authority"
 SPR_curtail_government_desc:0 "The government was given special powers during the war. Now, with the reopening of the parliament, we can reduce government power in favour of the Congress."
 
 SPR_republican_victory:0 "The Republic Victorious"
 SPR_republican_victory_desc:0 "With our bravery and our determination, we have managed to crush the fascist coup without giving up the ideals of 1931. Now, the \"Victory Government\" has to work in the political, social and economical reconstruction of cour country."
 SPR_trial_generals:0 "Trial of the Rebel Generals"
 SPR_trial_generals_desc:0 "The treacherous generals who ignored their constitutional duty and rebelled against the Republic must be tried for their horrendous crimes. With the world watching this trial, we can't let our impulses to execute them all dominate us, we must conduct a fair trial."
 SPR_the_ceda_question:0 "The CEDA Question"
 SPR_the_ceda_question_desc:0 "The CEDA was the main right-wing party before the rebellion, and they betrayed the Republic by supplying the fascists with funds in the months prior to the coup. Gil-Robles had the nerve of asking us permission to return from exile to rebuild his party, while Luis Lucia and Manuel Giménez, conservatives who remained loyal to the Republic, have also their political aspirations."
 SPR_the_church_question:0 "The Church Question"
 SPR_the_church_question_desc:0 "The Catholic Church actively supported the fascist coup, and they were severely punished by it in the loyalist areas, with brutal anti-clerical murders and lootings. Some moderates in our cabinet have drafted a plan to restore catholic activity safely, under our terms, while the radicals pressure for a full state atheist approach."
 SPR_expand_sim:0 "Expand the SIM"
 SPR_expand_sim_desc:0 "Founded during the war, the Military Information Service must be expanded in order to fight against the fascist, monarchist and carlist militias that, despite their defeat, still roam the northern countryside. We must stand firm and crush this threat!"
 SPR_ley_reconstruccion:0 "Pass the \"Ley de Reconstrucción\""
 SPR_ley_reconstruccion_desc:0 "The \"Law for the Reconstruction of the Spanish Republic\", or simply the Law of Reconstruction, is projected to assign a big amount of funds for the rebuilding of damaged areas, while also attacking the famine problem. We must get it passed as soon as possible."
 SPR_question_collectivized_property:0 "The Question of Collectivized Property"
 SPR_question_collectivized_property_desc:0 "Many factories and farms were forcibly collectivized during the war as their owners fled or were executed by worker militias. We must decide what to do with these properties, from restoring them to their original owners to legitimize their new status."
 SPR_dissolve_autonomous_councils:0 "Dissolve Autonomous Councils"
 SPR_dissolve_autonomous_councils_desc:0 "Autonomous councils, like the ones in Asturias or Aragón, must be disbanded and those areas returned to the normal, civilian administration. The autonomous governments in the Basque Country and Catalonia shall also be put back under our full control, ending their wartime semi-independence."
 SPR_the_pce_question:0 "The PCE Question"
 SPR_the_pce_question_desc:0 "Still loyal, still part of the Popular Front, and still very influential, the PCE has become into the only opposition that our government faces. Although technically an ally, we must reduce their influence by any means necessary, or we might suffer the fate of Kerensky..."
 SPR_close_checas:0 "Close the \"Checas\""
 SPR_close_checas_desc:0 "With our justice system overwhelmed, the first months of the war saw the creation of a parallel justice system, embodied by the \"checas\", political prisions named like the Soviet chekas. We must close these prisions, disband the People's Courts, and restore the ordinary justice system."
 SPR_rein_in_militias:0 "Rein in the Militias"
 SPR_rein_in_militias_desc:0 "If we are to restore normalcy, we must get rid of the militias that are still organizing random checkpoints, looting private property and even executing \"suspicious fascists\". We must allow thousands of men to leave the army, with their compensation, so we an better control the rest and enforce discipline once and for all."
 SPR_suspend_state_alarm:0 "Suspend the State of Alarm"
 SPR_suspend_state_alarm_desc:0 "Ever since the rebellion was crushed, the State of Alarm was in effect, giving the government special powers and suspending certain constitutional rights. Now we are ready to replace the State of Alarm with the State of Prevention, that restores some rights and decreases government power, as the recovery ends."
 SPR_special_cortes_elections:0 "Special Cortes Elections"
 SPR_special_cortes_elections_desc:0 "The 3rd Legislature of the Republican Cortes must resume, but we need to hold special elections in some districts in order to replace dead, exiled or imprisioned deputies. This will allow us to recover some sense of normalcy."
 SPR_elections_forty:0 "1940 General Election"
 SPR_elections_forty_desc:0 "Finally, the elections are here. Republicans and Socialists have organized separate lists, and the country wonders which of those parties will lead Spain through the end of the Recovery..."
 SPR_socialist_victory:0 "PSOE Victory"
 SPR_socialist_victory_desc:0 "As expected, the Socialists have managed to win a plurality of seats in the new Cortes, and will be tasked with the formation of the new government. Their promised \"Plan Against Poverty\" will have to be enacted, along some other measures to ensure prosperity and national unity."
 SPR_negrins_thirteeen_points:0 "Negrín's 13 Points"
 SPR_negrins_thirteeen_points_desc:0 "Juan Negrín has managed to hold on to power, after leading us through the end of the civil war and the recovery phase. His 13 Points Manifesto, calling for Spain's independence and unity, can now be fulfilled."
 SPR_appeal_national_unity:0 "Appeal to National Unity"
 SPR_appeal_national_unity_desc:0 "Spanish Nationalism can be a powerful tool in uniting the population. By framing the fascist coup as a foreign invasion, and rallying our people behind the flag, we can overcome our divisions and unite behind our common, foreign enemies."
 SPR_invite_communist_ministers:0 "Invite Communist Ministers"
 SPR_invite_communist_ministers_desc:0 "The PCE left the Popular Front to form a \"People's Opposition\", but Negrín's call for national unity also include the communists. We should negotiate for their inclusion into the government, while keeping their influence at bay."
 SPR_police_reform:0 "Ley de Reforma Policial"
 SPR_police_reform_desc:0 "The Spanish police forces were divided before the war in the Civil Guard and the Assault Guard, along with the border security Carabineros corps. They were merged during the war, but now Negrín has been planning a more complete overhaul of the police structure that can guarantee stability against anarchists and fascists remnants."
 SPR_approve_the_pncp:0 "Approve the PNCP"
 SPR_approve_the_pncp_desc:0 "The National Plan Against Poverty (Plan Nacional Contra la Pobreza) has to be approved by the Cabinet and the Parliament if we want it to move forward. It includes an ambitious amound of funds for anti-famine, anti-iliteracy, housing, healthcare and other reconstruction programs, and was one of our main campaign promises."
 SPR_plan_nacional_hambre:0 "Plan Nacional Contra el Hambre"
 SPR_plan_nacional_hambre_desc:0 "To complement the anti-famine programs of the PNCP, we shall approve the National Plan Against Hunger. The Plan includes an overhaul of rationing, crackdown against the black market, an increase in food production and further food imports, from Argentina, the US and else. We must end the rampant famine on the countryside!"
 SPR_guarantee_access_healthcare:0 "Guarantee Acesss to Healthcare"
 SPR_guarantee_access_healthcare_desc:0 "The war and the postwar economic ruin has caused a massive decrease of sanitary conditions in the cities and in the countryside. We must make sure that everone can have access to a good doctor and a good hospital, and begin some hospital construction campaigns."
 SPR_encourage_sustainable_urbanization:0 "Encourage Sustainable Urbanization"
 SPR_encourage_sustainable_urbanization_desc:0 "Madrid and Barcelona are beginning to see lots of inmigration coming from the countryside. We have to avoid the creation of slums by approving some additional housing programs, guaranteeing sanitary conditions and giving every worker a home for his family."
 SPR_socialism_liberalism:0 "Socialism and Liberalism"
 SPR_socialism_liberalism_desc:0 "The new Head of Government, Indalencio Prieto, has always called himself a liberal AND a socialist. This might some uncompatible, but Prieto's government will unite the best of both worlds!"
 SPR_limited_amnesty_prieto:0 "Limited Amnesty Law"
 SPR_limited_amnesty_prieto_desc:0 "The Reconstruction period is over and Spain must move on. We shall issue an inmediate pardon to those without blood crimes, and try to review each judicial case more carefully. Showing some mercy is the best way of proving how we are better than the fascists."
 SPR_negotiate_basques:0 "Negotiate with the Basques"
 SPR_negotiate_basques_desc:0 "Prieto is a Basque himself, and he has ties with leaders of the basque regionalists of the PNV (catholics) and the ANV (secularists). We should negotiate with them in order to ensure their support in Parliament, and specially end the PNV's aims of declaring catholicism the official Basque religion."
 SPR_unity_through_prosperity:0 "Unity through Prosperity"
 SPR_unity_through_prosperity_desc:0 "If we guarantee every Spaniard a way out of poverty, and a future for his children, we will ensure that no one else is willing to participate in something as destructive as a civil war. With prosperity, we shall archieve unity!"
 SPR_republic_workers:0 "A Republic of Workers"
 SPR_republic_workers_desc:0 "The 1931 Constitution defined Spain as a Free Republic of Workers of all Classes, a Socialist request. With the implementation of our anti-poverty programs, and the livelihoods of millions improving, we can say that the Republic was a success for the working class."
 SPR_ir_victory:0 "IR-UR Victory"
 SPR_ir_victory_desc:0 "The joint Republican List of IR and UR has managed to win a plurality of seats in the new Cortes, and will form the basis of the new government. They'll have to fulfill their promises of normalcy and constitutionalism, along with finishing many reforms that were postponed during the war, such as the Estatutes of Autonomy."
 SPR_encourage_anti_fascist_culture:0 "Anti-Fascist Culture"
 SPR_encourage_anti_fascist_culture_desc:0 "Disgraced and left for dead politically, Casares Quiroga has won over President [SPR.GetLeader] and will lead the new government. His belligerence against fascism will be the core of our policies, in order to prevent further threats to the Republic."
 SPR_reafirm_front_strategy:0 "Reaffirm the Popular Front Strategy"
 SPR_reafirm_front_strategy_desc:0 "With the PCE out of the Popular Front, and the Socialists upset about their election defeat, the Front is on the brink of dissolution. We must renew our ties with the PSOE in order to preserve anti-fascist unity and keep a strong government in charge."
 SPR_monitor_conservative_groups:0 "Monitor Conservative Groups"
 SPR_monitor_conservative_groups_desc:0 "After the election, small conservative groups and associations have been popping up through the entire country. The Constitution guarantees their right to exist, but they must be closely monitored in order to detect potential hotbeds of fascist or monarchist activity."
 SPR_law_for_republican_education:0 "Law for a Republican Education"
 SPR_law_for_republican_education_desc:0 "The war provided us with an opportunity, allowing us to disband all catholic schools at once. Now we must draft a new curriculum in order to teach Republican values to our children, along with an expansion of literacy programs."
 SPR_continue_autonomy_process:0 "Continue the Autonomy Process"
 SPR_continue_autonomy_process_desc:0 "We must continue the process of drafting and approving Estatutes of Autonomy for all regions that want one. First things first, the Galician one will be implemented, then Andalusia, Valencia or Castilla are drafting their own, that should be reviewed and approved as well."
 SPR_ban_revolutionary_alliance:0 "Ban the Revolutionary Alliance"
 SPR_ban_revolutionary_alliance_desc:0 "The Revolutionary Alliance, made up of former POUMists, anarchists and caballeristas, took part in the election with a modest result. However, their continued criminal activities and assaults against right-wing citizens or liberals has led to an unsustainable situation. We must ban the Alliance and let each of its constituent groups to act separately."
 SPR_pass_public_works_program:0 "Approve a Public Works Program"
 SPR_pass_public_works_program_desc:0 "The Cortes must approve a Public Works program that can give our unemployed masses something to eat, and help us rebuilding the country."
 SPR_comprehensive_agrarian_reform:0 "Comprehensive Agrarian Reform"
 SPR_comprehensive_agrarian_reform_desc:0 "After the war, the agrarian situation is a complete chaos. Collective farms, small landowners, big landowners that are buying back their land... We must redistribute it in order to create small landowners, not collectives, and certainly not big properties again."
 SPR_pivot_towards_liberalism:0 "Pivot Towards Liberalism"
 SPR_pivot_towards_liberalism_desc:0 "Diego Martínez Barrio, the leader of the Republican Union, will lead the new government. His plans include a coalition with the liberals, toning down leftist rethoric and an attempt at reconciliation of the two divided Spains. Let's see if he can do it."
 SPR_invite_liberal_ministers:0 "Invite Liberal Ministers"
 SPR_invite_liberal_ministers_desc:0 "Politicians from the Liberal Coalition could be invited to the cabinet, including them in our working majority and strenghtening the Republic overall. It is time to look for more allies than just the socialists."
 SPR_new_treaty_vatican:0 "New Treaty with the Vatican"
 SPR_new_treaty_vatican_desc:0 "We should reapproach the Vatican, and discuss some issues like the question of catholic art and properties, and the one about education. We are in a position of power here, we can surely get a good deal?"
 SPR_grand_republican_coalition:0 "Grand Republican Coalition"
 SPR_grand_republican_coalition_desc:0 "From the socialists to the Republican right, we have managed to rebuild the Grand Coalition that took down the monarchy in 1931. With the far-right defeated in the battlefields, and the far-left relegated to the fringe of politics, national unity is all but secured."
 SPR_freedom_justice:0 "Freedom and Justice"
 SPR_freedom_justice_desc:0 "As the Constitution says: \"Spain is a Republic of workers of all clases, in a regime of freedom and justice\". Those ideals, the democratic ideals of 1931, must remain above the revolutionary ones of 1936, and secure a demeocratic future for our people."
 spr_unlock_army_tt:0 "§YUnlock National Focus:§! §GThe New Armed Forces§!"
 spr_unlock_postwar_tt:0 "§YUnlock National Focus:§! §GPost-War Recovery§!"
 continue_autonomy_tt:0 "§YWe shall continue to form autonomous governments in certain regions§!"
 
 SPR_new_armed_forces:0 "The New Armed Forces"
 SPR_new_armed_forces_desc:0 "The military coup attempt and the subsequent civil war caused dissaray within our ranks, forcing us to reorganize all 3 branches: Army, Airforce and Navy. Now we have to continue strenghtening our forces for the coming world conflict..."
 SPR_the_popular_army_rep:0 "The Popular Army of the Republic"
 SPR_the_popular_army_rep_desc:0 "The People's Army was created during the civil war to integrate militias and loyal soldiers, bringing discipline and unity to the frontlines. Now that it has won the conflict, we must decide the future direction of the People's Army."
 SPR_rely_career_officers:0 "Rely on Career Officers"
 SPR_rely_career_officers_desc:0 "While militia leaders like Modesto, Líster or Valentín González have served us well, they will always be less skilled than career officers like Miaja or Rojo. The Popular Army needs to abandon militias and fully professionalize."
 SPR_rely_militia_leaders:0 "Rely on Militia Leaders"
 SPR_rely_militia_leaders_desc:0 "The military coup that started the civil war shows that a professional military cannot be fully trusted. While career officers like Miaja and Rojo are very skilled and will continue to provide us with their invaluable service, we need to promote militia leaders like Modesto or Líster to inspire enthusiasm and secure army loyalty."
 SPR_promote_jose_miaja:0 "Promote José Miaja"
 SPR_promote_jose_miaja_desc:0 "José Miaja is a career officer, but he enjoys very good relations with anarchist and communist militia leaders, and the propaganda has made him quite popular. He can be a unifying figure to lead the new Popular Army!"
 SPR_promote_vicente_rojo:0 "Promote Vicente Rojo"
 SPR_promote_vicente_rojo_desc:0 "Vicente Rojo Lluch is the best of our generals. Although he is a catholic, he remained loyal to us, and his strategic planning has led us to victory. We need to give General Rojo a much bigger role in the new Popular Army!"
 SPR_promote_juan_modesto:0 "Promote Juan Modesto"
 SPR_promote_juan_modesto_desc:0 "Juan Guilloto León, popularly known as \"Modesto\" is by far the best of the militia leaders. He had experience fighting with the Spanish Army in Morocco, and later on he took some military strategy lessons in the USSR. He should play a bigger role in the new Popular Army."
 SPR_form_first_armored:0 "División de Ingenios Blindados"
 SPR_form_first_armored_desc:0 "Our armored corps should be expanded to form a full division. That will be the start of our motorization!"
 SPR_develop_unl:0 "Develop the UNL-36"
 SPR_develop_unl_desc:0 "The UNL-35, developed in Valencia and Alicante by the Levant Naval Union, is widely considered to be the best armored vehicle of the civil war. Now we should order the production of an improved design, the UNL-26; while also expanding the local factories."
 SPR_develop_trubia:0 "Expand the Trubia Arms Factory"
 SPR_develop_trubia_desc:0 "The Trubia Arms Factory, in Asturias, was the first company that created local armor designs. Now that the civil war is over, we should comission better designs, and expand the factories to make production faster and better!"
 SPR_merge_armored_schools:0 "Merge the Armor Schools"
 SPR_merge_armored_schools_desc:0 "During the civil war, 2 schools were opened to teach our soldiers how to use tanks effectively in battle: the School of Archena and the School of Carabanchel. Now the Army is proposing to merge those schools together, forming the Unified Armor School in Carabanchel, under the command of Rafael Sánchez-Paredes."
 SPR_remobilization_plan:0 "Veteran Mobilization Plan"
 SPR_remobilization_plan_desc:0 "Thousands of men have been demobilized now that the civil war is over, but should the need arise, we have a large reserve of experienced veterans that can easily be mobilized again."
 SPR_labora:0 "Labora Fontbernat M-1939"
 SPR_labora_desc:0 "The Labora Fontbernat submachine guns have been very useful during the civil war, but they are becoming outdated. We need to comission a new Labora Fontbernat M39, and expand the factory were they are produced in Olot, Catalonia."
 SPR_reinosa:0 "The Reinosa 105/26 Cannon"
 SPR_reinosa_desc:0 "The SECN is not limited to naval construction, they can build artillery as well. We should comission a new artillery design, to be built in the factory of Reinosa, Cantabria."
 SPR_ingenieros:0 "Escuelas de Mando y Enseñanza de Ingenieros"
 SPR_ingenieros_desc:0 "The military coup left our engineer corps severely tainted, so we must continue what we started during the civil war and expand the Engineering Schools. That way, we'll regain our pre-war engineer corps faster."
 SPR_diversify_trubia:0 "Diversify the Trubia Artillery Factory"
 SPR_diversify_trubia_desc:0 "The Trubia Artillery Factory has specialized in the construction of armored vehicles and conventional artillery pieces, but with enough money and support they should begin to design anti-tank and anti-air guns!"
 SPR_ejercito_maniobra:0 "Ejército de Maniobra"
 SPR_ejercito_maniobra_desc:0 "Although our army should be divided by territories, we should keep a mobile, reserve group that obeys directly to the General Staff, and it is used to perform planned offensives and help vulnerable fronts. This tactic was successful during the civil war, let us continue it."
 SPR_limited_amnesty:0 "Limited Amnesty"
 SPR_limited_amnesty_desc:0 "Although most nationalist officers have fled or have death penalties, we should allow some of them to rejoin the army. We need officers badly, and their influence will be still limited by the left-wing soldiers and generals."
 SPR_empower_estado_mayor:0 "Empower the Estado Mayor"
 SPR_empower_estado_mayor_desc:0 "During the civil war we managed to centralize army command after the disastrous first months of militia-based warfare, but now we need to go further. Only through the careful planning of General Rojo we shall be victorious!"
 SPR_alphabetic_war_plans:0 "Alphabetic War Plans"
 SPR_alphabetic_war_plans_desc:0 "Our General Staff should elaborate a series of alphabetic war plans that will be activated if war begins. For example, an invasion of France could be called \"Plan Q\" while the proposed invasion of Portugal has already been dubbed \"Plan L\""
 SPR_mandatory_military_training:0 "An Armed People"
 SPR_mandatory_military_training_desc:0 "If the coup attempt taught us anything is that we can't rely on a professional military to defend the people. The people must stay armed and ready to defend themselves, should the need arise."
 SPR_accelerate_officer_training:0 "Accelerate Officer Training"
 SPR_accelerate_officer_training_desc:0 "New officers need to replace those who rebelled! Militia leaders will take up this role, but we need to properly train them first."
 SPR_quinto_model:0 "The Quinto Regimiento Model"
 SPR_quinto_model_desc:0 "The communist Quinto Regimiento was the best militia of the starting months of the civil war, and the People's Army was created with heavy inspiration from it. We need to continue its legacy of discipline and anti-fascism!"
 SPR_expand_the_comissariat:0 "Recruit More Commissars"
 SPR_expand_the_comissariat_desc:0 "Political Comissars are an invaluable tool to keep the army loyal to the democratically elected government. We should recruit more of them, and make them more powerful."
 SPR_the_fare:0 "The FARE"
 SPR_the_fare_desc:0 "The FARE ( Fuerzas Aéreas de la República Española ) played a decisive role in the civil war. We must continue to expand and improve our airforce, in order to secure victory in any conflict!"
 SPR_arma_aviacion:0 "Arma de Aviación"
 SPR_arma_aviacion_desc:0 "The main branch of the FARE is the Arma de Aviación, that manages the airbases and the aerial operations. We must continue its expansion to ensure the FARE can wage war effectively."
 SPR_subsecretaria_aviacion:0 "Subsecretaría de Aviación"
 SPR_subsecretaria_aviacion_desc:0 "The lesser branch of the FARE is the Subsecretaría de Aviación, responsible for the design and construction of the planes. We must continue its expansion so that the FARE is adequately supplied."
 SPR_servicios_instruccion:0 "Servicios de Instrucción"
 SPR_servicios_instruccion_desc:0 "Under the Arma de Aviación there is the Instruction Services, necessary to form our new pilots. With a little help, our pilots should be experts before they start their first mission!"
 SPR_aereodromo_llanos:0 "Aereódromo de Los Llanos"
 SPR_aereodromo_llanos_desc:0 "The Los Llanos airbase, in Albacete, served as the FARE headquarters during the civil war. Its new importance can only be accompanied with a proper expansion."
 SPR_hispano_suiza_focus:0 "Hispano-Suiza Contracts"
 SPR_hispano_suiza_focus_desc:0 "The Hispano-Suiza company was one of the main suppliers of our airforce during the civil war. Their factories in Barcelona must be expanded, and new designs comissioned."
 SPR_servicio_af:0 "Servicio de Aviación y Fabricación"
 SPR_servicio_af_desc:0 "The Aviation and Fabrication Service ( SAF ) will oversee and coordinate air production and maintenance, in order to keep the airforce supplied and ready to attack."
 SPR_promote_hidalgo_cisneros:0 "Promote Hidalgo de Cisneros"
 SPR_promote_hidalgo_cisneros_desc:0 "General Ignacio Hidalgo de Cisneros has served the airforce dutifully during the civil war. Now he must be given a bigger role in the new FARE."
 SPR_restore_casa:0 "Restore CASA"
 SPR_restore_casa_desc:0 "During the war, the CASA factory of Getafe ( Madrid ) was moved to Valencia to continue air production. Now we must restore the original Getafe factory, and comission new bomber designs!"
 SPR_aereonautica_naval:0 "Aereonáutica Naval"
 SPR_aereonautica_naval_desc:0 "The Aereonáutica Naval is the branch of the FARE that handles naval aviation, mainly naval bombers. We need to comission new designs for it in order to ensure we can win naval supremacy!"
 SPR_reintegrate_dca:0 "Reintegrate the DCA"
 SPR_reintegrate_dca_desc:0 "The DCA ( Defense against Airships in Spanish ) has been put under both the army and the airforce alternatively during the civil war. This confusion must end: our anti-air services will be put under the FARE to increase its strategic importance!"
 SPR_marina_de_guerra:0 "Marina de Guerra de la República Española"
 SPR_marina_de_guerra_desc:0 "The Republic Navy has suffered greatly during the civil war. More than 80% of the naval commanders join the rebellion, and, although the sailors themselves took control of the ships, without commanders the navy was very inefficient. We need to restore and expand on our pre-war navy!"
 SPR_escuela_naval_popular:0 "Escuela Naval Popular"
 SPR_escuela_naval_popular_desc:0 "The People's Naval School was set up during the civil war, in order to compensate for our lack of naval commanders. Its expansion is necessary if we want to increase our naval quality."
 SPR_base_naval_malaga:0 "Base Naval Málaga"
 SPR_base_naval_malaga_desc:0 "During the civil war, the fascists managed to seize 2 of our 3 naval bases: Cádiz and Ferrol, leaving us with only Cartagena. To compensate this, efforts were made to adapt the Málaga port into a full naval base. Those efforts must be culminated now."
 SPR_remove_political_delegates:0 "Remove the Political Delegates"
 SPR_remove_political_delegates_desc:0 "Commissars and political delegates were introduced in the navy as a way to control sailor committees, but now that those committees are dissolved they have no use to use. Removing political interference in the navy will allow it to be more professional!"
 SPR_fill_cuerpo_general:0 "Fill the Cuerpo General"
 SPR_fill_cuerpo_general_desc:0 "When the civil war ended, the Cuerpo General had only 56 naval officers, out of the 600 that the pre-war navy had. We need to restora that number to ensure operational integrity."
 SPR_promote_buiza:0 "Promote Miguel Buiza"
 SPR_promote_buiza_desc:0 "Miguel Buiza Palacios has been the most important admiral of our civil war navy, and he must play a bigger role now that the war has been won."
 SPR_defensa_antisubmarina:0 "Defensa Antisubmarina"
 SPR_defensa_antisubmarina_desc:0 "The convoy raiding that we have suffered during the civil war has taught us the importance of a good defense against submarines. We need to focus our efforts on that front."
 SPR_secn_exp:0 "SECN Expansion"
 SPR_secn_exp_desc:0 "The Spanish Society of Naval Construction had to change its production to guns and planes during the civil war, but now that it is over, a grand expansion of their naval construction capabilities will hopefully see the Spanish Navy become strong again!"
 SPR_resume_battleship_production:0 "Resume Battleship Production"
 SPR_resume_battleship_production_desc:0 "The civil war is over, and the naval capabilities of the SECN have drastically increased; let us resume battleship construction to rule the seas!"
 SPR_integrate_mgae:0 "Reintegrate the MGAE"
 SPR_integrate_mgae_desc:0 "The Basque Auxiliary Navy was useful during the civil war, but now it is essential that their ships return to direct government control, instead of being Aguirre's private navy."
 SPR_mgae_appear:0 "§YThe Basque Navy will be available for service in Bilbao!§!"
 SPR_modern_carrier:0 "Build a modern Carrier"
 SPR_modern_carrier_desc:0 "Our naval strategists have felt the way the wind is blowing, and our navy will be very ineffective unless we manage to design and build a modern carrier."
 
 SPR_ley_oficiales_ascensos:0 "Ley de Oficiales y Ascensos"
 SPR_ley_oficiales_ascensos_desc:0 "The issue of Azaña's military reform is still important in our national politics. The debate has reached the Parliament, and if the Law of Officers and Promotions is passed, our army could be reformed from the ground up... As long as that's in our interest, of course."
 SPR_africanistas:0 "Go With the Africanistas"
 SPR_africanistas_desc:0 "The Parliament has rejected the Law of Officers and Promotions, so the Army will continue under the leadership of the Africanistas. This faction, made up of former Rif War officers, opposes reforms and has strong right-wing views."
 SPR_jemc_franco:0 "JEMC: Francisco Franco"
 SPR_jemc_franco_desc:0 "The new Chief of Staff (Jefe del Estado Mayor Central, JEMC) will be General Francisco Franco, a well-known and skillful general that has earned the sympathies of the political right. His vision for the army is very much focused on expanding the Army of Africa and use its experience for our national benefit."
 SPR_zaragoza_academy:0 "Reopen the Zaragoza Military Academy"
 SPR_zaragoza_academy_desc:0 "The Zaragoza Military Academy was closed down by Azaña in 1931, with Franco as its Director. He now has asked us to reopen it, and frankly, it will be probably very benefitial for our army."
 SPR_expand_regulares:0 "Expand the GFRI"
 SPR_expand_regulares_desc:0 "The Grupo de Fuerzas Regulares Indígenas (aka Regulares) are volunteer infantry troops composed of Moroccan recruits from Ceuta and Melilla. Their experience and ferocity are unparalleled, and for that reason General Franco has proposed to create more of these units in order to improve our offensive capabilities in North Africa."
 SPR_alto_estado_mayor:0 "Reorganize the General Staff"
 SPR_alto_estado_mayor_desc:0 "The Central General Staff shall be reorganized into the High General Staff, in order to improve its capabilities and centralize it further under Franco."
 SPR_compulsory_military_service:0 "Compulsory Military Service"
 SPR_compulsory_military_service_desc:0 "Azaña's reforms, back in 1931, reduced the military service, and forbid anyone who didn't want to be sent to Africa to be sent there. We must reverse these changes and make military service longer and compulsory."
 SPR_preemptive_army_expansion:0 "Preemptive Army Expansion"
 SPR_preemptive_army_expansion_desc:0 "The Army was greatly downsized back in 1931, but the situation in Europe demands a reversal in this policy. We must expand our military and recall more retired officers in order to be ready to defend against any future threat."
 SPR_amnesty_right_officers:0 "Amnesty for Right-Wing Officers"
 SPR_amnesty_right_officers_desc:0 "Many army officers retired when the Republic was proclaimed in 1931, while others left the country altogether because of their extreme right-wing views. We can't let this talent go to waste, so we must recall this men into service!"
 SPR_legion_espanola:0 "Expand the Legion"
 SPR_legion_espanola_desc:0 "The Spanish Legion was formed in 1920 following the model of the French Foreign Legion. They have been our elite force in Africa during the hardest years of the Rif War, and are now guardin."
 SPR_jemc_goded:0 "JEMC: Manuel Goded"
 SPR_jemc_goded_desc:0 "General Manuel Goded Llopis already served as Chief of Staff during the first years of the Republic, but his supposed involvement in Sanjurjo's coup attempt discredited him. His abilities cannot be underestimated, so he must be appointed Chief of Staff once more, in order to reform the Army and bring it up to European standards."
 SPR_cooperate_police:0 "Cooperate with the Police Forces"
 SPR_cooperate_police_desc:0 "Before undertaking any military reform, we must coordinate with the police forces in order to launch a campaign against terrorism inside the Republic. Anarchists, falangists and separatists, they all will be brought to justice for their crimes against order and stability!"
 SPR_higher_standards:0 "Demand Higher Standards"
 SPR_higher_standards_desc:0 "Our soldiers and our officers need to be more professional and disciplined. General Goded has noted some faults in this regard that the Army should fix immediately, and if that means longer trainings and fewer recruits, then so be it. We can't let this situation continue."
 SPR_modernize_infanteria_marina:0 "Modernize the Infantería de Marina"
 SPR_modernize_infanteria_marina_desc:0 "With Italy's expanionist foreign policy in the Mediterranean, we can no longer expect our country to be safe. For that reason we need to reverse the order to disband the corps that Azaña gave with his petty reforms, and instead give more financing to the corps."
 SPR_academia_caballeria:0 "Valladolid Cavalry Academy"
 SPR_academia_caballeria_desc:0 "Azaña closed down te Valladolid Cavalry Academy and transformed it into a Museum. General Goded deems this decision as absurd, so he has asked us to reopen it and expand our cavalry divisions. They may help us gaining some speed and offense as our motorized force is developed."
 SPR_academia_toledo:0 "Toledo Infantry Academy"
 SPR_academia_toledo_desc:0 "The Infantry Academy of Toledo is now the backbone of our military training system, after the closure of the Zaragoza Academy. It must be expanded and goven more funds."
 SPR_reorganise_emc:0 "Reorganise the EMC"
 SPR_reorganise_emc_desc:0 "The Central General Staff (Estado Mayor Central) must be reorganized, with more innovative and professional officers being brought in. We need to develop new strategies if we want to come out on top in the upcoming war!"
 SPR_finish_azana_reforms:0 "Finalize Azaña's Reforms"
 SPR_finish_azana_reforms_desc:0 ""
 SPR_jemc_batet:0 "JEMC: Domingo Batet"
