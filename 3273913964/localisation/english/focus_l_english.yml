 SPR_casa:0 "Invest In CASA"
 SPR_casa_desc:0 "We need to invest heavily in Construcciones Aereonáuticas Sociedad Anónima to increase their air production capabilities."
 SPR_seize:0 "Seize Civilian Planes"
 SPR_form_dga:0 "Form the DGA"
 SPR_form_dga_desc:0 "We will re-organize the Aeronáutica Militar into the Dirección General de Aeronáutica (DGA). Whis new organization will be responsible for all technical, administrative and training aspects of both military and civil aeronautics. The aviation corps will then be divided into two branches: Military Aeronautics, dependent on the Army (as before), and Naval Aeronautics, which will provide support to the Navy."
 SPR_license_hawker_fury: "License the Hawker Fury"
 SPR_license_martin_b10: "Buy the Martin B-10"
 SPR_independent_airforce: "An Independent Airforce"
 SPR_invest_hispano_suiza: "Invest in Hispano-Suiza"
 SPR_expand_cuatro_vientos: "Expand Cuatro Vientos"
 SPR_world:0 "Our Place In The World"
 SPR_world_desc:0 "After decades of isolation, we can finally look outwards and begin determining our place in this troublesome world."
 SPR_recover_catalonia:0 "Restore Constitutional Order in Catalonia"
 SPR_recover_catalonia_desc:0 "The time has come for us to restre Constitutional order in Catalonia, destroying the petty separatists that have taken over it."
 SPR_negotiate_catalonia:0 "Negotiate with Catalonia"
 SPR_negotiate_catalonia_desc:0 "The Catalan Republic has proven itself able to be independent, and an invasion would cripple relations between our peoples. Instead, we could propose them a special Autonomy status, that can work for everybody."
 SPC_recover_cat:0 "Bring the Revolution to Catalonia"
 SPC_recover_cat_desc:0 "Catalonia has been allowed to exist as a bourgeois state for too long! We must march in and complete the Spanish Revolution!"
 SPR_sanction:0 "Contain Italy"
 SPR_sanction_desc:0 "Italy is our greatest threat, and we have to tackle their fascism and totalitarianism. We shall prepare an attack on Italy, to ensure our safety!"
 SPR_france:0 "Approach France"
 SPR_france_desc:0 "France is concerned, like us, about italian expansionism. We should try to get their help in an hypothetical invasion of Italy."
 SPR_uk:0 "Befriend The UK"
 SPR_uk_desc:0 "The United Kingdom is one of Italy's enemies, and they should be wiling to work with us to tackle their expansionism."
 SPR_germans:0 "Court the Germans"
 SPR_germans_desc:0 "Germany and Italy have a bad relationship, perhaps we should court the germans so they are more cooperative with us in the Leage of Nations."
 SPR_renault:0 "Renault Contracts"
 SPR_renault_desc:0 "We shall make a contract with Renault to share some of their truck and tank advancements to our army, with the permission of the French Army of course."
 SPR_advisors_fr:0 "French Advisors"
 SPR_advisors_fr_desc:0 "French military advisors shall help us modernize our military doctrine and organization."
 SPR_submarines_ger:0 "German Engineers"
 SPR_submarines_ger_desc:0 "We will try to reach a deal with the Germans so they can send us advisors and engineers in submarine building. Both nations will greatly benefit from this transaction, we get expertise and the germans get money."
 SPR_mauser:0 "Mauser Contracts"
 SPR_mauser_desc:0 "Mauser will help modernize and improve our infantry equipment designs, reinforcing our army."
 SPR_trade_uk:0 "Trade Treaty With The UK"
 SPR_trade_uk_desc:0 "We have to collaborate with the United Kingdom to improve our economy. They'll be interested in our raw goods, and we shall get some sweet investments from british companies."
 SPR_fighter_uk:0 "Study British Fighters"
 SPR_fighter_uk_desc:0 "Britain may be willing to let us study some of their monoplane fighter designs (for a price of course), so we can more quickly modernise our Airforce."
 SPR_break_italy:0 "Break Italy"
 SPR_break_italy_desc:0 "The time has come. Italy shall be defeated, and fascism will be exterminated from the earth!"
