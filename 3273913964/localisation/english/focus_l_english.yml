#  SPR_admiralty_desc:0 "If we are going to have a small navy, we'll need to be smarter than the enemy. To do so, we'll renew our admiralty, incorporating new talents."
#  SPR_cartagena:0 "Expand Cartagena Dockyard"
#  SPR_cartagena_desc:0 "Cartagena is our main gate to the Mediterranean, and it needs to be expanded dramatically to increase our naval production."
#  SPR_traffic:0 "Secure Our Traffic"
#  SPR_traffic_desc:0 "We can't allow submarines to raid our shipping. We shall modernize escorts and destroyers to keep our convoys safe."
#  SPR_battleship:0 "Battleship Modernization"
#  SPR_battleship_desc:0 "We need big ships if we want to compete with other powers, and we'll dedicate all our resources to archieve this goal."
