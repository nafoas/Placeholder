 SPR_republican_constitution:0 "The 1931 Constitution"
 SPR_republican_constitution_desc:0 "After King Alfonso XIII was forced the flee the country, the new provisional government of Alcalá-Zamora called for constituent elections, that were won by the leftist, republican parties. After months of debate and deliberations, the Cortes have finally approved the new Constitution of the Spanish Republic!"
 SPR_law_agrarian_reform:0 "Ley de Reforma Agraria"
 SPR_law_agrarian_reform_desc:0 "The Agrarian Reform is a longtime goal for the republicans and the socialists. Peasants work in miserable conditions while big landowners become rich without leaving their palaces, while those workers that protest are fired and thrown into starvation. This won't happen anymore: we shall redistribute property and create smaller landowners."
 SPR_agrarian_reform_institute:0 "Agrarian Reform Institute"
 SPR_agrarian_reform_institute_desc:0 "In order to oversee the land redistribution efforts, we shall create an Agrarian Reform Institute ( IRA in Spanish ). The Parliament might underfund it though..."
 SPR_decreto_intensificacion:0 "Allow Property Occupations"
 SPR_decreto_intensificacion_desc:0 "Landowners are refusing to hire more workers, leaving land below its capacity just to protest against the Agrarian Reform. Big masses of unemployed, angry peasants with nothing to lose are just a bomb waiting to explode, so we should allow families to occupy and work privately owned land, at least temporarily."
 SPR_nationalize_church_properties:0 "Nationalize Church Properties"
 SPR_nationalize_church_properties_desc:0 "The Catholic Church has kept the people in chains for centuries, but their reign is over! The first step will be nationalizing Church properties and art, as the Constitution says."
 SPR_law_defense_republic:0 "Ley de Defensa de la República"
 SPR_law_defense_republic_desc:0 "Monarchists and anarchists are determined to destroy our Republic! In order to stop them, we should declare monarchism illegal, and set up various emergency states ( Alarm, Siege, War ) to suspend individual rights if democracy is under threat."
 SPR_crush_sanjurjada:0 "Crush the Sanjurjada"
 SPR_crush_sanjurjada_desc:0 "General Sanjurjo, with the support of monarchists and disgruntled generals, has launched a military coup in Sevilla. However, lack of army support and a general strike called by the UGT and the CNT have caused the failure of the coup! Now we must decide what to do with Sanjurjo."
 SPR_continue_military_reform:0 "Continue the Military Reform"
 SPR_continue_military_reform_desc:0 "Azaña, as War Minister of the first provisional government, started a military reform that wanted to reduce the number of officers, making the Army more professional and more suited to fight other countries, instead of supressing our own dissenters. We must continue to offer these old officers retirement in exchange of a pay."
 SPR_labour_reform:0 "Labour Reform"
 SPR_labour_reform_desc:0 "Labour Minister Largo Caballero, one of the main socialist leaders, has proposed to pass certain reforms that would benefit the workers, such as collective bargaining, paid holidays, protection of the right to strike, and extending the mixed juries system to the industries and the services."
 SPR_Azana_government:0 "Azaña's Second Government"
 SPR_Azana_government_desc:0 "Alcalá-Zamora, in protest for the anti-clerical spirit of the Constitution, has resigned. While we can offer him the Presidency, Manuel Azaña shall become the new Head of Government, in a coalition with the Socialists."
 SPR_rustic_leases:0 "Law of Rustic Leases"
 SPR_rustic_leases_desc:0 "The Agrarian Reform is complete! But the fight is not over since a new reformist project, the Ley de Arrendamientos Rústicos (Law of Rustic Leases), has been drafted by the ministry of Agriculture. We will attempt to vote and pass it in parliament."
 SPR_agrarian2:0 "Moderate the Agrarian Reform"
 SPR_agrarian2_desc:0 "The Agrarian Reform was maybe too radical. We have to continue it, but we can moderate it to make it more acceptable our southern landowners."
 SPR_reopen:0 "Reopen Catholic Schools"
 SPR_reopen_desc:0 "The previous government tried to reform the education, but they ended up closing more schools than they built. We have to reopen catholic schools to guarantee that every child has an education."
 SPR_gil_robles:0 "Gil-Robles Military Reform"
 SPR_gil_robles_desc:0 "Gil-Robles is the new war minister, and he will start a grand army reform, bringing more experienced ( and right-wing ) generals to the higher ranks."
 SPR_chapaprieta:0 "Chapaprieta Fiscal Reforms"
 SPR_chapaprieta_desc:0 "Joaquín Chapaprieta, the new minister of Finances, has grand plans for Spain. A sharp austerity program will strengthen the economy, or that's what he thinks."
 SPR_a_government_all_spaniards:0 "A Republic for All Spaniards"
 SPR_a_government_all_spaniards_desc:0 "After the left-wing radicalism of Azaña and his socialist allies, the Radicals will bring the moderation and common sense needed to build a Republic for all Spaniards!"
 SPR_stabilizing_economy_bn:0 "Stabilizing the Economy"
 SPR_stabilizing_economy_bn_desc:0 "During these last 2 years, the economy has been an aftertought for the leftist cabinets, more focused on their utopian social reforms. We need to stabilize the economy, reduce unemployment, and pay back our debts if we want to prosper."
 SPR_new_pw_program:0 "A Public Works Program?"
 SPR_new_pw_program_desc:0 "Some reformist-minded ministers of our cabinet are suggesting a public works programme to reduce unemployment and build infrastructure across the country. However, with the opposition of conservatives, we need to make a decision..."
 SPR_ley_restricciones:0 "Ley de Restricciones"
 SPR_ley_restricciones_desc:0 "Chapaprieta's pet project, the Restrictions Law will help us balance the public accounts with a tax reforms and a rebalancing of public expenses, including a 5 million pesetas fund to develop and industrialize our nation."
 SPR_reducing_our_debt:0 "Reducing our Debt"
 SPR_reducing_our_debt_desc:0 "Cutting back our debt from 5% to 4% should be our goal for 1935, but afterwards we should think bigger: wiping out our debt will do inmense good to our economy."
 SPR_balance_public_spending:0 "Rebalance Public Spending"
 SPR_balance_public_spending_desc:0 "Some degree of liberalization reforms are needed to avoid incuring in more debt. We can also use this opportunity to redirect funds to more important things, such as education."
 SPR_fairer_taxation:0 "A Fairer Taxation"
 SPR_fairer_taxation_desc:0 "Closing some loopholes and implementing a degree of progressiveness in our tax system will increase our revenue, make the system more fair, and hopefully reduce unrest among the middle and lower classes."
 SPR_begin_rectification:0 "Begin the Rectification"
 SPR_begin_rectification_desc:0 "Rectifying the radical reforms undertaken by Azaña and the socialists won't be easy, with our cabinet divided between more republican minded Radicals, and conservative agrarians and CEDAists. We must decide how far should we go for each counter-reform."
 SPR_revise_military_reform:0 "Revise the Military Reform"
 SPR_revise_military_reform_desc:0 "War Minister Diego Hidalgo has proposed a partial rectification of Azaña's military policies, by promoting key right-wing generals such as Franco. Some Radicals protests against this move, deeming it as dangerous for the Republic, while conservatives think that it doesn't go further and the law should be repealed in its entirety."
 SPR_amnesty_law_lerroux:0 "An Amnesty Law?"
 SPR_amnesty_law_lerroux_desc:0 "One of the CEDA's first demands is the release of Sanjurjo and the conspirators of his 1932 coup attempt, along with the return of several nobility titles and their corresponding lots of land. Refusing this could be lethal for our majority, but President Alcalá-Zamora won't be too happy about it..."
 SPR_the_religious_question:0 "The Religious Question"
 SPR_the_religious_question_desc:0 "Secularist decrees passed by Azaña designed 1934 as the year where church subsidies would be extinguished completely. However, thousands of clergymen would be left without a way to sustain themselves, so a rectification has been proposed to give them a small pension. This has again, divided the cabinet and the country..."
 SPR_the_education_question:0 "The Education Question"
 SPR_the_education_question_desc:0 "With the religious issue settled, for now, we must now look to education. The reopening of religious schools is on the table, along with the removal of the prohibition of teaching catholicism in public schools. We must decide how far should we go."
 SPR_the_agrarian_question:0 "The Agrarian Question"
 SPR_the_agrarian_question_desc:0 "The Agrarian Reform, unfinished and underfunded, is the main issue the conservatives has with Azaña's government. Differing voices, even within the CEDA, ask for either a minor amendment or a full repeal of the law. We should also consider the response any counter-reform will have on the countryside, where many jornaleros depend on it to feed their families..."
 SPR_the_social_question:0 "The Social Question"
 SPR_the_social_question_desc:0 "Industrial owners are pressuring us to repeal Largo Caballero's labour reform, such as the mixed juries laws. We must consider the stability of the coalition and the possible response on the streets this measure would have before proceeding though."
 SPR_dealing_revolutionaries:0 "Dealing with the Revolutionaries"
 SPR_dealing_revolutionaries_desc:0 "With the last revolutionaries in Asturias crushed, we must now decide how far our repression should go. Should workers who participated in the strikes be fired? Should socialist-affiliated officials in the labour ministry be removed? Should any death penalty be issued or lifted? Our cabinet will have to take all of these decisions."
 
 SPR_democracy_triumphant:0 "Democracy Triumphant!"
 SPR_democracy_triumphant_desc:0 "With Spain finally pacified and radicals neutralized, we can now be sure that Democracy has triumphed in this country, defying the totalitarian trend the world is taking."
 SPR_end_protectionism:0 "End Protectionism"
 SPR_end_protectionism_desc:0 "Protectionism has been a constant in Spanish policy since the early 19th Century. We need to lower tariffs so that our industries and businesses can truly prosper."
 SPR_healthcare_all:0 "Create the Seguridad Social"
 SPR_healthcare_all_desc:0 "A strong Social Security system can guarantee healthcare and pensions for our workers, installing a strong social safety net that prevents radicalism. Let us prepare the law!"
 SPR_tourism_boom:0 "Tourism Boom"
 SPR_tourism_boom_desc:0 "With our sunny beaches, our historical monuments and our stunning mountains and valleys, we have what's necessary for becoming a major touristic destination. Let us create a Ministry for this purpose, and begin a propaganda campaign across the world!"
 SPR_constitution_ed:0 "Constitutional Education"
 SPR_constitution_ed_desc:0 "Schools can teach those values that they deem necessary, but every single one of them shall teach the Constitution and its values: Democracy, Equality, Freedom and Republicanism. That way we'll have a generation of free citizens in a few years!"
 SPR_liberal_patriot:0 "Liberal Patriotism"
 SPR_liberal_patriot_desc:0 "The far-right has tried to take over Spanish patriotism, perverting it and transforming it into toxic nationalism. We should associate our country with the ideas of Democracy and Republicanism so we can all feel proud of it!"
 SPR_artists:0 "Support Our Artists"
 SPR_artists_desc:0 "During these last years, we have experience what some people call a 'Silver Century' in arts, second only to the Siglo de Oro  ( 16th and 17th Centuries ). Specially, we should support the Generación del 27 and its main representatives, like Lorca, Alberti and others. Picasso, and the Sinsombrero, should be given support, too."
 SPR_tolerant_society:0 "A Tolerant Society"
 SPR_tolerant_society_desc:0 "The right and the left have long sought the complete destruction of the other, but the moderation of political position that has happened during these last months should prevent further violence and promote national unity."
 SPR_language_recognition:0 "Language Recognition"
 SPR_language_recognition_desc:0 "We need to recognize Catalan, Galician and Basque languages and make them official in their respective regions. However, it will be the Central Government the responsible for the promotion and teaching of these languages, or the regional governments might use them as a way to promote separatism."
 SPR_judiciary:0 "Reforma Judicial"
 SPR_judiciary_desc:0 "The Courts have worked surprisingly well during the Republic, even as chaos engulfed the rest of the country. With some minor reforms we can streamline judicial procedures and reinforce the independence of the Judiciary."
 SPR_end_corruption:0 "End Corruption"
 SPR_end_corruption_desc:0 "Corruption has been widespread so far, and the Straperlo scandal that brought down the Lerroux government is the evidence. We need to crack down hard on corruption to ensure the people trust their institutions."
 SPR_shining_light:0 "Shining Light Of Freedom"
 SPR_shining_light_desc:0 "The Republic has managed to fulfill its goals of creating a free, equal society. The Spanish model shall guide other newly-created democracies to success!"
 SPR_popular_front_cabinet:0 "Republican Cabinet"
 SPR_popular_front_cabinet_desc:0 "After being ousted from power in 1933, Manuel Azaña is leading the Republic again, in a coalition with all the left. This new cabinet will make sure that the spirit of 1931 guides the Republic forward!"
 SPR_finish:0 "Finish The Agrarian Reform"
 SPR_finish_desc:0 "Our government's top priority is to finish the agrarian reform, that will solve our massive problem of violence and poverty in the south. Let's begin with the redistribution, for Spain and for the Republic!"
 SPR_workday:0 "The Fight Against Unemployment"
 SPR_workday_desc:0 "Unemployment empowers the upper classes and gives them the upper hand when negotiating with their employees. We need to pursue an ambitious policy against unemployment, and we shall do so through several initiatives, like the continuation of the Public Works or the improvement of the Employment Offices. This will hopefully calm the social situation a bit."
 SPR_education_all:0 "Education For All"
 SPR_education_all_desc:0 "The best way to pull a country out of obscuratism and superstition is making sure that everyone receives a proper education. Now it is the time to do it."
 SPR_healthcare:0 "Free Healthcare Projects"
 SPR_healthcare_desc:0 "Although we don't have the means yet for a full-scale healthcare network, we can start drafting and testing it in key areas, to ensure we can get it done as soon as possible."
 SPR_basque_aut:0 "Basque Estatute of Autonomy"
 SPR_basque_aut_desc:0 "The Basque Estatute of Autonomy was approved back in the Reformist Biennium, yet it was repealed by Lerroux and the PRR. We must setup the basque regional government immediately."
 SPR_vote_galicia:0 "Vote On The Galician Estatute"
 SPR_vote_galicia_desc:0 "The Galician Estature, the next logical step after Catalan and Basque ones, is almost ready. It just needs to be voted on a referendum, a referendum we can't lose."
 SPR_andalusian:0 "Andalusian Autonomy Plans"
 SPR_andalusian_desc:0 "Many voices are advocating for Andalusian Autonomy. We believe in a decentralized Spain, so we must start drafting a responsible, yet innovative, Andalusian Estatute of Autonomy to continue our federalization agenda."
 SPR_integral:0 "España Integral"
 SPR_integral_desc:0 "The España Integral concept was introduced back in 1931, allowing regions to gain autonomy with the approval of the Parliament. As more and more regions begin drafting their Estatutes, we can tell this concept has been put to practice!"
 SPR_defend_rep:0 "Defend The Republic"
 SPR_defend_rep_desc:0 "The Republic has many enemies, and we can't pretend that we can defeat them through weakness and doubts. We must strike decisevely, once and for all!"
 SPR_falange_crack:0 "Crackdown on Falange"
 SPR_falange_crack_desc:0 "The fascist organization Falange can, without a doubt, be labelled as a terrorist organization for their violent activities. We must ban them, arrest its leadership and confiscate their weapons!"
 SPR_arrest_ja_tt:0 "§YJosé Antonio Primo de Rivera will be arrested!§!"
 ja_arrested_flag:0 "Arrested José Antonio"
 SPR_handle_cnt:0 "Handle The CNT"
 SPR_handle_cnt_desc:0 "The CNT continues to desestabilize the Republic with their constant strikes and protests. The new economic measures should hopefully decrese their membership, and if we strictly enforce public order we should hopefully disminish the strength of the recalcitrant anarchists."
 SPR_purge_army:0 "Purge The Army"
 SPR_purge_army_desc:0 "Unfortunately, the Army is full of reactionary and anti-republican generals. We must take action before having to face a coup d'état!"
 SPR_catholic_influence:0 "Counter Catholic Influence"
 SPR_catholic_influence_desc:0 "A large part of our society, influenced by the Catholic Church, is still against our Republic. We must counter this social influence isolating and combatting the Church!"
 SPR_republican_society:0 "A Republican Society"
 SPR_republican_society_desc:0 "During the last months, support for the Republic is steadily rising. We can affirm without a doubt that democracy is what the people wants, and they will fight for it if necessary."
 SPR_march_forward:0 "The Republic Marches Forward"
 SPR_march_forward_desc:0 "We are victorious! All threats to the Republic are beaten, the economy is back on its tracks, and the regions are happy and loyal. The Second Republic is Marching Forward!"
 SPR_wage:0 "Minimum Wage Reform"
 SPR_wage_desc:0 "Many union leaders are advocating for a minimum wage reform, that would help gaining worker's support for the government. We should look into that."

 SPR_ceda:0 "CEDA Cabinet"
 SPR_ceda_desc:0 "Gil-Robles is the new head of government. Now it is the time to decide if we are going to reform the Republic - or destroy it from within."
 SPR_moderate_ceda:0 "Moderate Primacy"
 SPR_moderate_ceda_desc:0 "We shall rule from the Constitution, following democratic principles. Fascism is a failed ideology anyway"
 SPR_centre:0 "Approach the Centrists"
 SPR_centre_desc:0 "We supported PRR's centrist government, and now we expect them to do the same. We need liberal support!"
 SPR_order_ceda:0 "Re-Enforce Order"
 SPR_order_ceda_desc:0 "Without too much violence, without exceeding ourselves, we shall restore order in our country. The law is there to be followed!"
 SPR_gimenez:0 "Gimenez Fernandez Agrarian Reform"
 SPR_gimenez_desc:0 "Our minister Manuel Giménez Fernández has a proposal from an alternative, more moderate, agrarian reform. This would help to solve the situation in the southern countryside."
 SPR_worker_rights_ceda:0 "Extend Worker's Rights"
 SPR_worker_rights_ceda_desc:0 "It may not be ideal for the economy, but we need to avoid a civil war. Workers rights shall be guaranteed and enforced, and those factory owners who break the law shall be punished."
 SPR_catholic_unions:0 "Catholic Trade Unions"
 SPR_catholic_unions_desc:0 "We would have a better control over the workers if the Church stopped siding with the rich and became more sympathetic with the lower classes. Catholic trade unions will be the key to archieve social unity."
 SPR_catholic_schools:0 "Catholic Schools"
 SPR_catholic_schools_desc:0 "Republicans say the care about education, yet they close schools just because they are catholic! We shall guarantee that every child gets an education, and if their school is catholic, then so be it."
 SPR_subsidy:0 "Restore Church Subsidy"
 SPR_subsidy_desc:0 "The Church collaborates with the state in education, charity and moral issues. They need to be rewarded, and the catholic cult will be sustained by the state!"
 SPR_caritas:0 "Caritas"
 SPR_caritas_desc:0 "We will promote catholic charity and social ideas to lift thousands out of poverty!"
 SPR_radical_ceda:0 "Radicals In Control"
 SPR_radical_ceda_desc:0 "How could people think we would preserve the Republic!? We shall destroy this godless democracy!"
 SPR_police_ex:0 "Guardia Civil Expansion"
 SPR_police_ex_desc:0 "We shall expand the police to better deal with leftist radicals and separatist terrorists!"
 SPR_suspend_cons:0 "Suspend The Constitution"
 SPR_suspend_cons_desc:0 "Constitutional rights block our way. We will suspend the Constitution to defend Spain and its values!"
 SPR_break:0 "Break The Left"
 SPR_break_desc:0 "It is the time. With constitutional rights out of the way, and a reinforced policeforce, we will crackdown on the reds and kill them all!"
 SPR_restore:0 "Restore The Constitution"
 SPR_restore_desc:0 "Now that Spain is clean, we can restore constitutional rights for the good spaniards."
 SPR_abolish:0 "Abolish The Constitution"
 SPR_abolish_desc:0 "We'll never let the reds come back. The Constitution will be suspended and we will rule with an iron fist. ¡Viva El Jefe!"
 SPR_reform:0 "Constitutional Reform"
 SPR_reform_desc:0 "The Constitution of 1931 is too hostile towards catholics. We shall reform it and bring a new Constitution to Spain, one that doesn't disciminate christians."
 SPR_third_rep:0 "The Third Republic"
 SPR_third_rep_desc:0 "The Third Spanish Republic, will correct the mistakes of the Second while preserving democracy and freedom. We earned it."
 SPR_ban_extreme:0 "Ban Extremist Parties"
 SPR_ban_extreme_desc:0 "The CNT, the PCE, the POUM, all those organizations promote violence and totalitarianism and shall be banned. Our liberal allies are also suggesting a ban on Falange and the JONS..."
 SPR_appease:0 "Public Order Act"
 SPR_appease_desc:0 "The strikes, protests, and even coup attempts have made it very clear that the Law for the Defense of the Republic didn't go far enough. We need a new Law of Public Order, and hope that the situation calms down for a bit."
 SPR_1933:0 "1933 Parliamentary Election"
 SPR_1933_desc:0 "The results of this special election are clear: The right has won. The centrist PRR will now form a cabinet with the winners of the election, the rightist CEDA. We have yet to see the extent of their reforms."
 SPR_revise_labor:0 "Revise Labor Legislation"
 SPR_revise_labor_desc:0 "The reforms passed by the previous government are very unprofitable and we should consider replacing them by more flexible ones."
 SPR_trusting:0 "A Trusting Market"
 SPR_trusting_desc:0 "The economy will improve if the market trusts our country to invest in. That will also raise employment, calming the social situation."
 SPR_please_ceda:0 "Appease The CEDA"
 SPR_please_ceda_desc:0 "We have agreed to all of CEDA's reforms. They should be more calmed and wiling to work with us and with the Republic."
 SPR_readjust:0 "Budjet Readjustment"
 SPR_readjust_desc:0 "We are spending too much money: it is time to make harsh spending cuts to put the economy afloat."
 SPR_depression:0 "Out Of The Depression"
 SPR_depression_desc:0 "It is time to get Spain out of the dirt and transform this country into an industrialized nation."
 SPR_mines:0 "Open New Mines"
 SPR_mines_desc:0 "To support our industry we need raw goods, and there are plenty of them untapped in Asturias and Malaga. We have to get them!"
 SPR_pef:0 "Plan De Enlaces Ferroviarios"
 SPR_pef_desc:0 "We should finish the PEF, signed in 1932, to bailout railway companies and avoid the breakup of our transport network."
 SPR_links:0 "Expand Maritime Links"
 SPR_links_desc:0 "We are have a very rough terrain, but the Mediterranean is a very friendly sea to sail in. We should use it to connect our cities to complement land connections."
 SPR_connecting:0 "Connect Our Country"
 SPR_connecting_desc:0 "If we want to have a capable industry we need to have every city connected to our transport network."
 SPR_employment:0 "Create More Employment"
 SPR_employment_desc:0 "No man will be unemployed in the new Spain. We need workers and builders, engineers and teachers. Let the construction begin!"
 SPR_urbanisation:0 "Support Urbanisation"
 SPR_urbanisation_desc:0 "Spain is a mainly rural country. If we want to modernize, we need to encourage inmigration to the cities, where factories are."
 SPR_catalan:0 "Catalan Textile Industry"
 SPR_catalan_desc:0 "Catalan textile industry is very strong and we get a lot of benefits from it. We should make state investments in it to ensure it remains profitable."
 SPR_basque:0 "Basque Heavy Industry"
 SPR_basque_desc:0 "Basque Steel is bringing steady profits to our economy, and we need to expand it further."
 SPR_3rep:0 "Constitutional Reform"
 SPR_pf:0 "Popular Front Victory"
 SPR_cedavic:0 "CEDA Victory"
 SPR_agrarian3:0 "Finish Agrarian Reform"
 SPR_agrarian4:0 "Solve The Agrarian Problem"
 SPR_centrist:0 "Centrist Government"
