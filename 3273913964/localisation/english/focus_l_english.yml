 SPR_army_decisions:0 "The Spanish Army"
 SPR_army_decisions_desc:0 "War looms over Europe, but our military is completely unprepared for it, full of incompetence, corruption and with obsolete equipment. If we plan ahead and begin preparing now, we will be able to have a capable force once war finally breaks out."
 SPR_recall_miguel_ponte:0 "Recall Miguel Ponte"
 SPR_recall_luis_orgaz:0 "Recall Luis Orgaz"
 SPR_recall_fidel_davila:0 "Recall Fidel Dávila"
 SPR_recall_juan_vigon:0 "Recall Juan Vigón"
 SPR_recall_kindelan:0 "Recall Alfredo Kindelán"
 SPR_pardon_varela:0 "Recall José Enrique Varela"
