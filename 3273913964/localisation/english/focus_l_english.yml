 SPR_fund_secn:0 "Give more funds to SECN"
 SPR_fund_secn_desc:0 "We need a bigger navy if we want to secure our coasts. To achieve this, we should give SECN more funds."
#  SPR_mediterranean:0 "Mediterranean Navy"
#  SPR_mediterranean_desc:0 "We are a mediterranean nation, and we should focus on defending our longest coast using small ships and escorts, while using the Mediterranean to launch naval invasions."
#  SPR_light:0 "Light Ship Modernization"
#  SPR_light_desc:0 "To fight in the Mediterranean, we will use light ships, so we need to modernize them."
#  SPR_amphibious:0 "Amphibious Warfare"
#  SPR_amphibious_desc:0 "The best use we can give to our fleet is transporting our armies to the enemiy shores, taking them by surprise."
