 DDR_politics_start_desc:0 "The First Party congress has determined the direction of our government, who must now determine the direction of the Nation!"
 DDR_KAPD_start:0 "KAPD: Councilism"
 DDR_KAPD_start_desc:0 "The Kommunistische Arbeiter-Partei Deutschlands, or Communist Workers' Party of Germany, is a Council Communist party. It is an ultra-left splinter of the KPD, and support a more libertarian view of Marxism."
 DDR_KPD_start:0 "KPD: The Stalinist Tendency"
 DDR_KPD_start_desc:0 "The Kommunistische Partei Deutschlands, or Communist Party of Germany, is the mainstream Communist Party in Germany. It, like many other European Communist Parties, has been increasingly Stalinized, and wishes to mirror Soviet political policies."
 DDR_KPDO_start:0 "KPDO: The Right Opposition"
 DDR_KPDO_start_desc:0 "The Kommunistische Partei Deutschlands (Opposition), or Communist Party of Germany (Opposition) is a right-wing splinter group of the KPD. They believe that the Soviet Union should not interfere with other Communist parties, and are against the Stalinization of the KPD. There is also some Bukharnist tendencies within the party."
 DDR_SAPD_start:0 "SAPD: Centrist Marxism"
 DDR_SAPD_start_desc: "The Sozialistische Arbeiterpartei Deutschlands, or Socialist Workers' Party of Germany, is a splinter group from the SPD. They are Centre Marxists, more left than the SPD, but not so far as the Communists. They believe in using both Revolutionary Techniques and Reformism to accomplish the creation of a soscialist state."
 DDR_RDP_start:0 "RDP: A Pacifist State"
 DDR_RDP_start_desc:0 "The Radikaldemokratische Partei, or Radical Democratic Party, is a small group of Liberal Socialists who put a great focus on pacifism. They believe in a more free version of socialism, but do not believe in spreading the Revoultion or Reform by force."
 DDR_SPD_start:0 "SPD: A Democratic Republic"
 DDR_SPD_start_desc:0 "The Sozialdemokratische Partei Deutschlands, or Social Democratic Party of Germany, is a, well, Social Democratic Party. It is the largest Left-Wing party in Germany, along with the Communists, and they believe in maintaing a real Democratic Republic rather than a Socialist Republic. They do not believe in ending Capitalism (completely) or banning other parties from operating."
 DDR_KGRNB_start:0 "KGRNS: The National Socialists"
 DDR_KGRNB_start_desc: "The Kampfgemeinschaft Revolutionärer Nationalsocialisten, or Combat League of Revolutionary National Socialists, is another name for the Strasserist Black Front. They present an ultranationalistic version of socialism, which has a strange amount of similarity to Stalinism. They call for German superiority over Euorpe, instead of World or European Revolution. "
 DDR_KAPD_decentralization:0 "Dezentralisierung"
 DDR_KAPD_decentralization_desc:0 "We will decentralize our government to give the people a proper voice in government!"
 DDR_KAPD_support_AAUE:0 "Support the AAUE"
 DDR_KAPD_support_AAUE_desc:0 "We will make the Allgemeine Arbeiter-Union – Einheitsorganisation (German Worker's Union) the sole trade union in the German Commune."
 DDR_ban_nazis:0 "Ban National Socialists"
 DDR_ban_nazis_desc:0 "We will order the end of National Socialism in Germany. It is expected that many of them will run to the Strasserists anyways."
 DDR_trotsky_legacy:0 "Legacy of Karl Liebknecht"
 DDR_trotsky_legacy_desc:0 "A Personality Cult is a dangerous thing, but making Karl Liebknecht into a national symbol should be alright, in moderation."
 GER_are_trotskyites:0 "Trotskyites!"
 DDR_KAPD_end_paras:0 "End of Paramilitaries"
 DDR_KAPD_end_paras_desc:0 "We will order the end of paramilitary divisions in Germany. We must restore order!"
 DDR_KAPD_permanent_revolution: "Permanente Revolution"
 DDR_KAPD_permanent_revolution_desc:0 "We must be in a state of Permanent Revolution! We must always work to spread Marxism to the world!"
 DDR_KPD_merge_party_and_state:0 "Merge Party and State Bureaucracy"
 DDR_KPD_merge_party_and_state_desc:0 "Mirroring the developments in the Soviet Union, we will merge the party bureaucracy with the state bureaucracy to create a more stable and powerful government."
 DDR_KPD_purge_other_communists:0 "Purge the Communist Party"
 DDR_KPD_purge_other_communists:0 "The Left and Right Communists are dangerous for our nation. We must make sure that they cannot operate."
 DDR_KPD_KPDO_end_other_political_parties:0 "Ban Non-Socialist Parties"
 DDR_KPD_KPDO_end_other_political_parties_desc:0 "We must get rid of counter-revolutionary elements before they strike against us!"
 DDR_KPDO_peasant_autonomy:0 "Peasant Autonomy"
 DDR_KPDO_peasant_autonomy_desc:0 "We will give the peasants some autonomy to allow them some freedom."
 DDR_KPDO_reconicle_stalinists:0 "Reconcile Stalinists"
 DDR_KPDO_reconicle_stalinists_desc:0 "We will offer Unity to the Stalinist KPD. We must unite to fight the Fascists!"
 DDR_KPD_KPDO_stamp_out_paramilitaries:0 "Stamp out Paramilitary Divisions"
 DDR_KPD_KPDO_stamp_out_paramilitaries_desc:0 "We will prevent Paramiliary Organzations from operating within our country."
 DDR_KPD_KPDO_personality_cult:0 "Personality Cult"
 DDR_KPD_KPDO_personality_cult_desc:0 "We will build a personality cult around our leaders to better control the population!"
 DDR_KPD_KPDO_socialism_in_one_country:0 "Socialism In One Country"
 DDR_KPD_KPDO_socialism_in_one_country_desc:0 "We will focus on creating socialism in one country rather than spreading the Revolution!"
 DDR_SAPD_union_congress:0 "Kongress der Industrieunion"
 DDR_SAPD_union_congress_desc:0 "An Industrial Union Congress, seperated from the Political Congress, would go a long way into securing workers' rights."
 DDR_SAPD_freidenker:0 "Freidenker-Vereinigung"
 DDR_SAPD_freidenker_desc:0 "A German \"Freethinkers'\" Assosiation would be useful in redefining the role of religion and science in our country."
 DDR_SAPD_Arbeitersportbewegung:0 "Arbeitersportbewegung"
 DDR_SAPD_Arbeitersportbewegung_desc:0 "A \"Worker Sport\" Movement allows the laborers to enjoy the leisure, friendly competition, and excersize provided by athletics."
 DDR_SAPD_lure_in_opposition:0 "Attract the Fringes"
 DDR_SAPD_lure_in_opposition_desc:0 "With some effort, we could bring fringe politicans and members of the KPDO and the SPD to join our party."
 DDR_SAPD_revolution_in_one_country:0 "Revolution in One Country"
 DDR_SAPD_revolution_in_one_country_desc:0 "We will work to permanently revolutionize Germany, to the extent that other countries will want to follow our example!"
 DDR_SAPD_paramilitaries:0 "End Paramilitary Operations"
 DDR_SAPD_paramilitaries_desc:0 "With stability (mostly) restored to our country, we can force the Paramilitary divisions in our country to disband."
 DDR_SPD_rights_for_all: "Guarantee Rights for All Peoples"
 DDR_SPD_rights_for_all_desc: "It is our role as human beings to ensure that people can peacefuly coexist in our nation. Germans, Jews, Poles, anybody will have equal rights in the German Republic!"
 DDR_SPD_expand_schools:0 "Education Subsidies"
 DDR_SPD_expand_schools_desc:0 "If we increase access to education, our people will be more literate, and will be able to do better research."
 DDR_SPD_welfare_state:0 "Welfare State"
 DDR_SPD_welfare_state_desc:0 "We must provide for the people's needs, such as healthcare and unemployment subsidies, if necessary."
 DDR_SPD_end_paramilitary:0 "End Paramilitary Opposition"
 DDR_SPD_end_paramilitary_desc:0 "We must end the existance of Paramilitary Divisions in our country, and restore order."
 DDR_SPD_anti_clericalism:0 "Anti-Clericalism"
 DDR_SPD_anti_clericalism_desc:0 "The Church has too much power over our people. We must decrese its policial influence, yet still allow people to worship their gods."
 DDR_SPD_maintain_democracy:0 "Maintain Democracy"
 DDR_SPD_maintain_democracy_desc:0 "Democracy is the cornerstone of Germany (well, now at least), and we must fight to preserve it from Fascists and Communists."
 DDR_KGRNB_remove_nazis:0 "Purge the Hitlerites"
 DDR_KGRNB_remove_nazis_desc:0 "We must eliminate Hitler and his cronies from our society, to prevent their corruption of National Bolshevism."
 DDR_KGRNB_remove_paras:0 "Dissolve Paramilitary Organizations"
 DDR_KGRNB_remove_paras_desc:0 "Paramilitaries only serve to erode German Culture and the Socialist Spirit. This must be ended!"
 DDR_KGRNB_dictatorship:0 "A Proletariat Dictatorship"
 DDR_KGRNB_dictatorship_desc:0 "People's Democracy is a sham. The only way Germany will be reborn is if the State takes Full Control. It should still sound good to the people, anyways."
 DDR_KGRNB_national_revolution:0 "A National Revolution"
 DDR_KGRNB_national_revolution_desc:0 "Creating a revolution inside Germany and with German Culture is more important than creating an international revolution!"
 DDR_KGRNB_integrate_KPD:0 "Anti-Communist Propaganda"
 DDR_KGRNB_integrate_KPD_desc:0 "We should move the population away from Communism and towards National Socialism."
 DDR_KGRNB_preserve_german_culture:0 "Preserve German Culture"
 DDR_KGRNB_preserve_german_culture_desc:0 "We must preserve German Culture, as it is the superior revolutionary culture!"
 DDR_politics2_start: "Zweiter Parteitag"
 DDR_politics2_start_desc:0 "Now that the Second Party Congress is complete, we can now go about to securing our political future!"
 DDR_KAPD_start2:0 "KAPD: Workers' Destiny"
 DDR_KAPD_start2_desc:0 "Das Schicksal der Arbeiter gehört ihnen! This is the new propaganda coming out of the KAPD offices. It meas \"The Workers' Destiny is Their Own!\", meaning that the worker's Councils are in charge, not a central government." 
 DDR_KPD_start2:0 "KPD: Einheit"
 DDR_KPD_start2_desc:0 "It is clear that Einheit, or Unity, is the core of the Stalinist Agenda, not Equality or Freedom."
 DDR_KPDO_start2:0 "KPDO: Growing into Socialism"
 DDR_KPDO_start2_desc:0 "Part of the KPDO's Policies include allowing some Free Market activity, to allow the Middle and Upper Classes to \"grow into\" Socialism."
 DDR_SAPD_start2:0 "SAPD: Calm Revolution"
 DDR_SAPD_start2_desc:0 "The SAPD's policies go back and forth between Revolution and Reform, leading supporters to call it the \"Calm Revolution\". Critics on the Left call it the \"Mild Revolution\", and Critics on the Right call it the \"Puppet Revolution\", claiming that they are basically Communists in disguise. No matter which is true, the Revolution continues."
 DDR_SPD_start2:0 "SPD: Der Nagel"
 DDR_SPD_start2_desc:0 "The SPD has earned itself the nickname of \"Nagel\", or Nail, refering to the Nail which sticks out most. Of course, it gets hit down. This refers to the SPD being the most right-wing party (other than the KGRNS) in the Republic, and are thus under constant attack by the other Socialist Parties."
 DDR_KGRNB_start2: "KGRNS: Die Injektion"
 DDR_KGRNB_start2_desc:0 "In this case, Injektion (injection) refers to the KGRNS injecting Ultranationalism into Socialism. Or Socialism into Ultranationalism. The Party itself cannot agree, and may end up splitting in the future..."
 DDR_KAPD_decentralize2:0 "Dezentralisierungsplan \"Luxemburg\""
 DDR_KAPD_decentralize2_desc:0 "The Luxemburg Decentralization Plan, named after Rosa Luxemburg, will loosen the grip Berlin has on the regional parliaments, and the grip the regional parliaments have on the municipalities."
 DDR_KAPD_volkspost:0 "Gemeinschaftspost"
 DDR_KAPD_volkspost_desc:0 "Instituting a Community Post will be one of the few remaining responsibilities of the central government, although much of the bureaucratic work will be left to the different provinces of Germany."
 DDR_KPD_dekulakization:0 "German De-Kulakization"
 DDR_KPD_dekulakization_desc:0 "Like the Soviets did, we must eliminate our middle class and upper class to allow socialism to develop!"
 DDR_KPD_wolga_wolga:0 "\"Wolga-Wolga\""
 DDR_KPD_wolga_wolga_desc: "New movies and songs about the Germans living in Russia (mostly around the Volga River) would help to foster cooperation between our two countries! We can even dub Stalin's favorite movie \"Volga-Volga\" into German!"
 DDR_KPDO_register_kulaks:0 "Kulak Registration"
 DDR_KPDO_register_kulaks_desc:0 "We will require that any who partake in free-market activities register for a liscence. Just so we can keep track of the economy. That's all."
 DDR_KPDO_centralization:0 "Zentralisierung"
 DDR_KPDO_centralization_desc:0 "We will begin decreasing the power of the state congresses!"
 DDR_SAPD_strikes:0 "Strike Mediation"
 DDR_SAPD_strikes_desc:0 "We will allow strikes against factories in the country, but require that managers and officials use mediation to get the workers back in the factory, as long as the strikes remain peaceful."
 DDR_SAPD_free_education:0 "Free Education"
 DDR_SAPD_free_education_desc:0 "We will offer free education for people under the age of 35 in Germany, to keep us on the scientific cutting edge!"
 DDR_SPD_secular_education:0 "Secular Education"
 DDR_SPD_secular_education_desc:0 "We will force Secular Education on the children of Germany, as religion has no place in our country!"
 DDR_SPD_lower_voting_age:0 "Lower the Voting Age"
 DDR_SPD_lower_voting_age_desc:0 "We will lower the voting age from 20 to 18 to make our younger population more interested in politics!"
 DDR_KGRNB_political_religion:0 "Political Religion"
 DDR_KGRNB_political_religion_desc:0 "We will make Politics so important in our nation that it almost seems like religion."
 DDR_KGRNB_german_superiority:0 "Enact Racial Laws"
 DDR_KGRNB_german_superiority_desc:0 "Enacting Racial Laws is an important part of National Socialist Theory."
 DDR_politics3_start:0 "Dritter Parteitag"
 DDR_politics3_start_desc:0 "Now that the Third Party Congress is done, we can continue to build socialism in Germany!"
 DDR_KAPD_start3:0 "KAPD: Worker Support"
 DDR_KAPD_start3_desc:0 "The KAPD's platform for the next three years focuses on Nation-Wide labour reform. Even though the central government has little power, they still must apply some standards for our people."
 DDR_KPD_start3:0 "KPD: Reinheit in der Partei"
 DDR_KPD_start3_desc:0 "The Party must remain pure in order to usher in true communism!"
 DDR_KPDO_start3:0 "KPDO: Status Quo"
 DDR_KPDO_start3_desc:0 "We will seek to defend the Status Quo of our country, seeing as we have gotten some kind of order."
 DDR_SAPD_start3:0 "SAPD: Maintainance"
 DDR_SAPD_start3_desc:0 "Now that we have a revolutionary society, we now have to maintain order in the state."
 DDR_SPD_start3:0 "SPD: Enemies on All Sides"
 DDR_SPD_start3_desc:0 "The SPD is the only pro-democracy party in the Republic. We must prevent the people from going to more radical ideologies!"
 DDR_KGRNB_start3:0 "KGRNS: National Fervor"
 DDR_KGRNB_start3_desc:0 "Now that we have control of the country, we must stir fervor for the people and the expansion of the nation!"
 DDR_KAPD_tie_together_congresses:0 "Link Political and Industrial Congresses"
 DDR_KAPD_tie_together_congresses_desc:0 "With the growing amount of Industrial Congresses and meetings, we need to make sure that they can work smoothly with the political councils."
 DDR_KAPD_central_regulations:0 "Central Regulatory Measures"
 DDR_KAPD_central_regulations_desc:0 "Even though the individual provinces and municipalities have a large amount of autonomy, we must make sure that there is some consistancy within the Commune."
 DDR_KPD_great_purge:0 "Große Säuberung"
 DDR_KPD_great_purge_desc:0 "There are many reactionaries, fascists, and Trotskyists hiding in our midst! We must hunt them down and destroy them! §RThis will give a negative bonus to the military, however, army experience will go up a little faster."
 DDR_KPD_recruit_from_right:0 "Recruit from the Right"
 DDR_KPD_recruit_from_right_desc:0 "We will try to get those in the country who still support Nationalist beliefs to be Left-Wing Radicals rather than Right-Wing!"
 DDR_KPDO_looser_trade_unions:0 "Loosen Grip on Trade Unions"
 DDR_KPDO_looser_trade_unions_desc:0 "We currently tightly control all the trade unions in this country. We should loosen our grip so that there is less dissent against us."
 DDR_KPDO_inner_party_democracy:0 "Inner Party Democracy"
 DDR_KPDO_inner_party_democracy_desc:0 "Allowing some democracy within the country, but only within the party, will allow for some freedom of choice and expression."
 DDR_SAPD_worker_gardens:0 "Arbeitergärten"
 DDR_SAPD_worker_gardens_desc:0 "The Berlin Workers' Gardens will help to make the city a beautiful worker paradise!"
 DDR_SAPD_party_by_workers:0 "Party of the Workers"
 DDR_SAPD_party_by_workers_desc:0 "The SAPD is a party by the workers, for the workers, and of the workers!"
 DDR_SPD_fight_right:0 "Marginalize the Right"
 DDR_SPD_fight_right_desc: "We will campaign to end the influence of far-right groups in the country."
 DDR_SPD_fight_left:0 "Marginalize the Left"
 DDR_SPD_fight_left_desc:0 "We will campaign to end the influence of far-left groups in this country."
 DDR_KGRNB_hold_rallies:0 "Hold Rallies"
 DDR_KGRNB_hold_rallies_desc:0 "Pro-National Bolshevik Rallies will rally the people to our side!"
 DDR_KGRNB_enforce_atheism:0 "State Atheism"
 DDR_KGRNB_enforce_atheism_desc:0 "We will enforce Atheism on the people, as religion takes away from devotion to the state!"
 DDR_decide_on_united_front:0 "Debate the United Front"
 DDR_decide_on_united_front_desc: "Parties like the KPDO and SPD want to have a united front against Hitler's National Socialists. We must go down this path to decide the strength of the nation!"
 DDR_united_front:0 "Form the United Front!"
 DDR_united_front_desc:0 "We must form a united front against Fascism! We have to show the Rightists that we cannot be defeated!"
 DDR_no_united_front:0 "Go It Alone"
 DDR_no_united_front_desc:0 "Not Forming the United Front would be best. We will not cooperate with our enemies! §RThis could lead to civil war, so be careful...§"
 DDR_merge_parties:0 "Unite The Parties"
 DDR_merge_parties_desc:0 "To properly combat the Fascists, the Socialist parties in our nation must combine into the \"Socialist Unity Party\"."
 DDR_no_merge_parties:0 "Seperate Parties"
 DDR_no_merge_parties_desc:0 "Even if we decided that the parties are working together, it would be best if they remained seperate entities. The Socialists will bow to no one, as Comrade Lenin wanted!"
 DDR_state_ownership:0 "State Ownership"
 DDR_state_ownership_desc:0 "The Party Congress has decided that Germany will have a completely socialist economy!"
 DDR_kolkhoz:0 "LPG"
 DDR_kolkhoz_desc:0 "In a collective farm (known as a Landwirtschaftliche Produktionsgenossenschaft), many families work the land and share the harvest, which, is of course, then nationalized."
 DDR_sovkhoz:0 "VEG"
 DDR_sovkhoz_desc:0 "In a state farm, or Volkseigenes Gut, the workers work the land and the harvest is directly nationalized."
 DDR_private_farms:0 "Private Farms"
 DDR_private_farms_desc:0 "Of course, some farms should still be privatly owned to foster growth."
 DDR_begin_collectivization:0 "Collectivization"
 DDR_begin_collectivization_desc:0 "Now that we have collective farms set up, we can continue to Collectivize other sectors of the population."
 DDR_begin_great_turn:0 "Große Wende"
 DDR_begin_industrialization:0 "Begin Industrialization"
 DDR_begin_industrialization_desc:0 "A larger industry means more employment, and more employment means that we can get rid of this economic depression faster!"
 DDR_invest_in_equipment:0 "Invest in Equipment"
 DDR_invest_in_equipment_desc:0 "Better equipment would allow our workers to produce more efficiently!"
 DDR_get_rich:0 "Get Rich!"
 DDR_get_rich_desc:0 "Allowing a \"Neue Reichen\" Class to grow a little bit would help to stimulate our stagnating economy."
 DDR_wealth_caps:0 "Put a Cap on Wealth"
 DDR_wealth_caps_desc:0 "Although we want people to be rich, we don't want them to be too rich."
 DDR_state_ownership_remove_econ_crisis:0 "End the Economic Crisis!"
 DDR_state_ownership_remove_econ_crisis_desc:0 "We will declare the end of the Economic Crisis!"
 DDR_state_ownership_1st_5_year_plan:0 "1st Five-Year Plan"
 DDR_state_ownership_1st_5_year_plan_desc:0 "The First Five-Year Plan shall ensure that the country's economy continues to grow!"
 DDR_state_ownership_civ_effort_1:0 "VEB"
 DDR_state_ownership_civ_effort_1_desc:0 "The Publicly Owned Operation, or Volkseigener Betrieb, will ensure that the consumer needs for our population and state needs are met."
 DDR_state_ownership_nationalize_volkswagon:0 "Nationalize Volkswagon"
 DDR_state_ownership_nationalize_volkswagon_desc:0 "We must nationalize Volkswagon to use their designs and methods to provide cheap and quality transportation for our people."
 DDR_state_ownership_inf_effort_1:0 "Volksbahn"
 DDR_state_ownership_inf_effort_1_desc:0 "The People's Highway will ensure that we can get our military supplies around the country quickly and efficiently!"
 DDR_state_ownership_inf_effort_2:0 "Expand Railways"
 DDR_state_ownership_inf_effort_2_desc:0 "We need to expand the railways to better move around people and supplies."
 DDR_state_ownership_mil_effort_1:0 "Arsenal of Socialism"
 DDR_state_ownership_mil_effort_1_desc:0 "More Military factories means that we can defend our Socialism at any time, anywhere!"
 DDR_state_ownership_mil_effort_2:0 "Expand the Arsenal"
 DDR_state_ownership_mil_effort_2_desc:0 "We must expand our Arsenal of Socialism if we wish to Spread the Revolution!"
 DDR_state_ownership_2nd_5_year_plan:0 "2nd Five-Year Plan"
 DDR_state_ownership_2nd_5_year_plan_desc:0 "The Second Five-Year plan would ensure that our economy does not stagnate after the success of the First!"
 DDR_state_ownership_mil_effort_3:0 "Continued Military Factory Construction"
 DDR_state_ownership_mil_effort_3_desc:0 "Constructing more military factories would expand the Arsenal of Socialism!"
 DDR_state_ownership_better_factories:0 "Improve Worker Training"
 DDR_state_ownership_better_factories_desc:0 "Better Training for Workers would go a long way in increasing our production capabilities."
 DDR_steel_mills:0 "Nationalize the Steel Mills!"
 DDR_oil_experiments:0 "New Oil Plants"
 DDR_oil_experiments_desc:0 "We must build oil refineries to fuel our vehicles!"
 DDR_second_research_slot:0 "Expand Universities"
 DDR_second_research_slot_desc:0 "Expanded Universities means more students, which means better research for our nation!"
 DDR_market_socialism:0 "Socialist Market Economy"
 DDR_market_socialism_desc:0 "We will maintain at least some capitalist systems to make sure that the people of Germany do not starve."
 DDR_small_state_farms:0 "VEG"
 DDR_small_state_farms_desc:0 "We will make some small state farms in order to ensure a baseline miniumum amount of food inventory, in case of famine."
 DDR_market_socialism_food_stamps:0 "Expanded Food Stamp Programs"
 DDR_market_socialism_food_stamps_desc:0 "To Avoid widespread famine and hunger, we will make sure that those who cannot afford food can have enough to survive in at least some comfort."
 DDR_market_socialism_farm_redistribution:0 "Farm Redistribution"
 DDR_market_socialism_farm_redistribution_desc:0 "Taking land from the Junkers and other elites and giving it to the farmers would help our population, but anger the nobles..."
 DDR_market_socialism_VEB:0 "VEB"
 DDR_market_socialism_VEB_desc: "State-Owned Buisnesses will ensure that the people have a minimum level of material comforts."
 DDR_market_socialism_Socialism_with_German_Characteristics:0 "Socialism with German Characterstics"
 DDR_market_socialism_Socialism_with_German_Characteristics_desc:0 "We will achieve Socialism, but with a German twist allowing private enterprise as well!"
 DDR_market_socialism_public_works:0 "Public Works"
 DDR_market_socialism_public_works_desc:0 "We will perform some public works to get the economy back on track!"
 DDR_market_socialism_cooperatives:0 "Cooperatives"
 DDR_market_socialism_cooperatives_desc:0 "More Workers' Cooperatives will help to stabilize the regime."
 DDR_market_socialism_increased_regulation:0 "Increased Regulation"
 DDR_market_socialism_increased_regulation_desc:0 "We will increase regulations on private enterprises to ensure that everybody pays their share."
 DDR_market_socialism_fair_competition:0 "Fair Competition"
 DDR_market_socialism_fair_competition_desc:0 "Under a Capitalist System, the Large Companies force the smaller ones into bankrupcy, creating Oligarchies and Monopolies. We will put legislation in place to prevent that!"
 DDR_market_socialism_fix_economy:0 "Fix the Economy"
 DDR_market_socialism_fix_economy_desc: "We now have the ability to declare an end to the economic crisis!"
 DDR_market_socialism_western_rails:0 "Westbahn"
 DDR_market_socialism_western_rails_desc:0 "We will build more infrastructure in the west!"
 DDR_market_socialism_eastern_rails:0 "Ostbahn"
 DDR_market_socialism_eastern_rails_desc:0 "We will build more infrastructure in the east!"
 DDR_market_socialism_civilian_effort1:0 "Construct New Factories"
 DDR_market_socialism_civilian_effort1_desc: "New factories would ensure that the state has an increased ability to build military and civilian constructions."
 DDR_market_socialism_civilian_effort2:0 "Invite Western Buisnesses"
 DDR_market_socialism_civilian_effort2_desc:0 "If Western firms came and invested in our situtation, the economy would have a great boost!"
 DDR_market_socialism_mil1:0 "Military Preparedness"
 DDR_market_socialism_mil1_desc:0 "Even if we do not want to fight, we must still be ready to defend ourselves!"
 DDR_market_socialism_mil2:0 "Arm the Country"
 DDR_market_socialism_mil2_desc:0 "If we wish to be able to defend ourselves and spread Socialism, we must be ready to fight!"
 DDR_trade_focus:0 "Wants to Trade"
 DDR_market_socialism_more_trade:0 "Focus on Trade"
 DDR_market_socialism_more_trade_desc:0 "We will focus on trading with our neighbors!"
 DDR_market_socialism_resource_subsidies:0 "Resource Production Subsidies"
 DDR_market_socialism_resource_subsidies_desc:0 "Mining Companies, with a little bit of a boost (and some nationalization) should be better able to find and purify mineral resources for the military!"
 DDR_oil_trade_focus:0 "Wants Oil"
 DDR_market_socialism_oil_trade:0 "Oil Trade"
 DDR_market_socialism_oil_trade_desc:0 "We need more Oil and Rubber. We will begin befriending those nations who have them!"
 DDR_market_socialism_oil_factories:0 "New Oil Refinaries"
 DDR_market_socialism_oil_factories_desc:0 "Oil Refinaries would give us oil and rubber, which our military desperately needs."
 DDR_market_socialism_support_unions:0 "Support the Unions!"
 DDR_market_socialism_support_unions_desc:0 "With a larger industrial base, we need to make sure that all of the trade unions are organized"
 DDR_market_socialism_research_slot: "Research Cities"
 DDR_market_socialism_research_slot_desc:0 "Creating Research Cities would allow us to perform research without the hassles of civilian life."
 DDR_renounce_the_treaty:0 "Renounce the Treaty of Versailles!"
 DDR_renounce_the_treaty_desc:0 "The Treaty of Versailles is a pox upon our nation! We will renounce it, and begin to re-arm!"
 DDR_electronics_research:0 "Electronics Research"
 DDR_electronics_research_desc:0 "We need to develop new computers to aid our research teams."
 DDR_fund_research:0 "Fund Research Projects"
 DDR_fund_research_desc:0 "We need to increse funding to our research projects."
 DDR_radar_effort:0 "Radar Effort"
 DDR_radar_effort_desc:0 "We need to improve our Radar Technology to get more information about our enemies."
 DDR_rocketry_effort:0 "Rocketry Primacy"
 DDR_rocketry_effort_desc:0 "We need to focus on Rocketry to perform small, but devastating, strikes on our enemies' industries and populations."
 DDR_nuclear_effort:0 "Nuclear Primacy"
 DDR_nuclear_effort_desc:0 "We need to focus on Nuclear Technology to perform large and disheartening strikes on our enemies' morale."
 DDR_standing_army_decided:0 "Standing Army Policy"
 DDR_standing_army_decided:0 "Militia Army Policy"
 DDR_standing_army:0 "A Standing Army"
 DDR_standing_army_desc:0 "Continuing with a standing army would be best to defend our nation and spread the revolution!"
 DDR_militia_army:0 "A Grand Militia"
 DDR_militia_army_desc:0 "The Revolution will be defended and spread by the working people! We will rely on militias!"
 DDR_mass_assault:0 "Army of the People"
 DDR_mass_assault_desc:0 "The People make up the core of the army, so we must develop new tactics and strategies to work in such a manner."
 DDR_grand_battleplan:0 "Army of the Officers"
 DDR_grand_battleplan_desc:0 "The core of our army is the strategy with which it fights. We must continue to modernize!"
 DDR_mobile_warfare:0 "Army of Tanks"
 DDR_mobile_warfare_desc:0 "Armored and Motorized vehicles shall make up the core of our army. We must figure out how to use them effectively in battle."
 DDR_superior_firepower:0 "Army of Artillery"
 DDR_superior_firepower_desc:0 "We will rely on artillery to hit the enemy from afar, thus preserving German lives."
 DDR_raise_militias:0 "Raise Militias"
 DDR_raise_militias_desc:0 "With our reliance on militias, we can spend some time quickly raising a few militias right now."
 DDR_spec_ops:0 "Special Forces Training"
 DDR_spec_ops_desc:0 "We need to make sure that our military is capable of fighting in all kinds of terrain and situations."
 DDR_artillery_research:0 "Better Artillery Research"
 DDR_artillery_research_desc:0 "With our reliance on artillery, we need to make sure that we have the greatest artillery possible!"
 DDR_tank_research:0 "Armor Research"
 DDR_tank_research_desc:0 "Stronger tanks will allow us to better encircle and destroy our enemies!"
 DDR_support_equipment:0 "Support Equipment Research"
 DDR_support_equipment_desc:0 "Auxillary units increase the performance of our soldiers in battle. We should invest in making them more effective."
 DDR_motorized:0 "Motorized Research"
 DDR_motorized_desc:0 "Motorized units will be faster than normal infantry!"
 DDR_infantry_weapons:0 "Firearm Research"
 DDR_infantry_weapons_desc:0 "More efficient and powerful weapons would help our soldiers take down the enemy!"
 DDR_doctrines:0 "Doctrine Research"
 DDR_doctrines_desc:0 "With new equipment, we need new doctrines to help us use them effectively!"
 DDR_mechanized_research:0 "Mechanized Research"
 DDR_mechanized_research_desc:0 "Motorized troops could soon be supplemented by Mechanized Soldiers, so we need to be ready for this development."
 DDR_tank_innovations:0 "Tank Innovations"
 DDR_tank_innovations_desc:0 "Even if tanks are not our primary focus, it would still be good to have some armor on hand."
 DDR_navy_start:0 "Volksmarine"
 DDR_navy_start_desc:0 "A Strong Navy is essential to our nation, if we are to challenge Britain for Naval Supremacy!"
 DDR_navy_Baltic_Sea:0 "A Baltic Navy"
 DDR_navy_Baltic_Sea_desc:0 "Our navy will be based on small, fast ships such as destroyers and submarines."
 DDR_navy_North_Sea:0 "A North Sea Navy"
 DDR_navy_North_Sea_desc:0 "Our navy will be based on large, powerful ships such as battleships and carriers."
 DDR_sub_research:0 "Submarine Effort"
 DDR_sub_research_desc:0 "Better Submarines means that we will be able to take down convoys easier, a must if we are to fight in the Baltic."
 DDR_destroyer_research:0 "Destroyer Effort"
 DDR_destroyer_research_desc:0 "Destroyers are very capable of protecting our own convoys and taking down enemy submarines. We need to invest in them!"
 DDR_cruiser_research:0 "Cruiser Effort"
 DDR_cruiser_research_desc:0 "No matter where our navy is based, we need cruisers to act as mid-range heavy hitters."
 DDR_battleship_research:0 "Battleship Effort"
 DDR_battleship_research_desc:0 "To Challenge Britain, we need strong battleships to deliver a lot of damage and soak up a lot of hits."
 DDR_carrier_research:0 "Carrier Effort"
 DDR_carrier_research_desc:0 "Britain has their own aircraft carriers, so we need some to counter them!"
 DDR_fleet_in_being:0 "Large Fleet Tactics"
 DDR_fleet_in_being_desc:0 "We will research tactics best used with a large, slow fleet."
 DDR_trade_interdiction:0 "Fast Fleet Tactics"
 DDR_trade_interdiction_desc:0 "We need to develop new strategies conducive to our fast fleet. They are perfect for starving out other nations!"
 DDR_more_dockyards:0 "Additional Dockyard Construction"
 DDR_more_dockyards_desc:0 "We need to build new and improved dockyards!"
 DDR_conscript_vessels:0 "Conscript Vessels"
 DDR_conscript_vessels_desc:0 "We will quickly take some convoys, or something, and refit them into destroyers!"
 DDR_navy_doctrine_2:0 "Doctrine Effort"
 DDR_navy_doctrine_2_desc:0 "We need to continue to develop new strategies for our navy."
 DDR_rocketry_research:0 "Rocketry Innovations"
 DDR_rocketry_research_desc:0 "With missles, we can hit our enemies from far away without risking planes or our lives."
 DDR_air_force_doctrines2:0 "Aerial Doctrine Effort"
 DDR_air_force_doctrines2_desc:0 "We need new strategies that go with our new technology."
 DDR_amerika_bomber:0 "Liberation Bombers"
 DDR_amerika_bomber_desc:0 "Sometimes to free people, we must destroy. These new bombers will destroy enemy factories, enabling us to spread the revolution!"
 DDR_heavy_fighter_research:0 "Bomber Escorts"
 DDR_heavy_fighter_research_desc:0 "We need to create escort fighters to protect our bombers from enemy aircraft."
 DDR_bomber_research:0 "Bomber Research"
 DDR_bomber_research_desc:0 "We need to create new bombers to harass enemy troops and destroy buildings."
 DDR_naval_bomber_research:0 "Naval Attack Aircraft"
 DDR_naval_bomber_research_desc:0 "With Naval Bombers, we can attack enemy ships from above!"
 DDR_CAS_research:0 "Close Air Support Research"
 DDR_CAS_research_desc:0 "Close Air Support are sort of light bombers, that we can use to destroy enemy troops."
 DDR_air_start:0 "Luftstreitkräfte"
 DDR_air_start_desc:0 "We need an Airforce to supplement our Army, and attack the enemies from above, as well as from around!"
 DDR_air_force_doctrines:0 "Improve Air Doctrines"
 DDR_air_force_doctrines_desc:0 "We will improve our aerial tactics with maneuvers learned at Lipetsk Air Base."
 DDR_fighter_innovations:0 "Light Air Innovations"
 DDR_fighter_innovations_desc:0 "We need to innovate our lighter aircraft to be able to defeat enemy fighters!"
 DDR_heavy_innovations:0 "Heavy Air Innovations"
 DDR_heavy_innovations_desc:0 "We need to improve our heavier aircraft in order to better hit enemy troops and buildings."
 DDR_fighter_research:0 "Fighter Primacy"
 DDR_fighter_research_desc:0 "We will focus on developing light aircraft to achieve air superiority."
 DDR_bomber_research:0 "Bomber Primacy"
 DDR_bomber_research_desc:0 "We need to focus on bombers in order to take advantage of air superiority."
 DDR_remained_in_LON:0 "Remained in the League of Nations"
 DDR_league_is_with_us:0 "We wish to remain in the league of nations."
 DDR_league_is_against_us:0 "The League of Nations seeks to stifle us!"
 DDR_remove_league:0 "Leave the League of Nations"
 DDR_remove_league_desc:0 "The League of Nations is nothing but a device meant to stifle Germany! We must leave it to be able to assert ourselves in this world."
 DDR_stay_in_league:0 "Remain in the League of Nations"
 DDR_stay_in_league_desc:0 "We must show our support of the League of Nations, and to peace!"
 DDR_wants_peace:0 "Committed to Peace"
 DDR_western_direction:0 "Western Direction"
 DDR_western_direction_desc:0 "We will look to foreign policy options in Western Europe."
 DDR_declare_the_west_as_enemy:0 "The West is our Enemy"
 DDR_declare_the_west_as_enemy_desc:0 "The West is the ultimate enemy. Full of Kings, Capitalism, and Imperialism, we must go and crush their ambitions!"
 DDR_wants_friend:0 "Germany Wants to Reconcile"
 DDR_declare_the_west_as_friend:0 "Attempt to Reconcile the West"
 DDR_declare_the_west_as_friend_desc:0 "The West is our ally against the evils of the Fascists! We must unite to fight this evil!"
 DDR_plebiscite_in_saarland:0 "Plebiscite in Saarland"
 DDR_plebiscite_in_saarland_desc:0 "We will demand that the Plebiscite in the Saarland be held, as the League of Nations mandated. Even if we are not part of it, we still want our land back!"
 DDR_reoccupy_rhineland:0 "Remilitarize the Rhineland"
 DDR_reoccupy_rhineland_desc:0 "We will march our troops into the Rhineland to show that Germany is back on the world stage!"
 DDR_renegotiate_rhineland:0 "Renegotiate the Rhineland - First Phase"
 DDR_renegotiate_rhineland_desc:0 "We still want military access to the Rhineland, but we do not want to antagonize the Western Allies. We will renegotiate with France to slowly allow ourselves access to the Rhine."
 DDR_renegotiate_rhineland2:0 "Renegotiate the Rhineland - Second Phase"
 DDR_renegotiate_rhineland2_desc:0 "With more diplomatic hoops and loopholes, we will surely be able to get access to the Rhineland!"
 DDR_claim_28_836:0 "Claim Elsaß-Lothringen"
 DDR_claim_28_836_desc:0 "Elsaß-Lothringen is rightful German Land, and we must show the French that we must own the land, not them!"
 DDR_neutral_28_836:0 "Remain Neutral on the Border Issue"
 DDR_neutral_28_836_desc:0 "We will remain neutral on the status of Alsace-Lorraine, and perhaps try to negotiate for it later."
 DDR_relinquish_28_836:0 "Relinquish Claims on Alsace-Lorraine"
 DDR_relinquish_28_836_desc:0 "Alsace-Lorraine is undeniably French, and we can do nothing to dispute this fact."
 DDR_war_with_France:0 "Spread the Revolution to France"
 DDR_war_with_France_desc:0 "The French Reactionaries are a false government, pretending to represent the people whiler eally exploiting the workers! We must impose the true order on the French!"
 DDR_FRA_friendship:0 "Friendship"
 DDR_relinquishes_AL:0 "Relinquished Claims on our land"
 DDR_friendship_with_France:0 "Friendship with the French"
 DDR_friendship_with_France_desc:0 "With our new stance on the French Border, we can approach them in peace and friendship."
 DDR_negotiate_for_28:0 "The Treaty of Elsaß"
 DDR_negotiate_for_28_desc:0 "The French province of Alsace has a lot of Germans and German Speakers. We can negotiate with the French to bring the province into the fold."
 DDR_naval_rivalry:0 "Naval Rivalry"
 DDR_anglo_german_rivalry:0 "Anglo-German Naval Rivalry"
 DDR_anglo_german_rivalry_desc:0 "The German Navy is instrumental in spreading Socialism. We need to make sure it is powerful enough to rival Britain's!"
 DDR_anglo_german_cooperation:0 "Anglo-German Naval Cooperation"
 DDR_anglo_german_cooperation_desc:0 "We will ask the United Kingdom if they wish to enter into a treaty of friendship and anti-fascist Cooperation with us. Should they accept, we will help them with their Submarine designs, and they could help us with our navy as well."
 DDR_anglo_german_friendship:0 "Anglo-German Friendship"
 DDR_anglo_german_friendship_desc:0 "With our new era of cooperation, Germany and the United Kingdom can now be friends!"
 DDR_maritime_war:0 "The Maritime War"
 DDR_maritime_war_desc:0 "We need to put the British in their place, and end their exploitation of the workers and the Native Peoples of Africa and Asia!"
 DDR_fund_british_communists:0 "Fund British Communists"
 DDR_fund_british_communists_desc:0 "Now that we are at war with the Evil Empire, we can begin to fund some British Groups who would not mind our victory..."
 DDR_fund_seperatist_communists:0 "Fund British Seperatists"
 DDR_fund_seperatist_communists_desc:0 "Now that we are at war with the Evil Empire, we can begin to fund some Welsh and Scottish Groups who would like to see independance from London..."
 DDR_revolt_in_britain:0 "The British Revolution"
 DDR_revolt_in_britain_desc:0 "Now that we have funded relevant groups in Britain, we can instigate a revolt to assure our victory!"
 DDR_attack_the_netherlands:0 "War with the Netherlands"
 DDR_attack_the_netherlands_desc:0 "We should fight the Netherlands to secure a Germanic Socialist Union."
 DDR_befriend_the_netherlands:0 "Defend the Netherlands"
 DDR_befriend_the_netherlands_desc:0 "A treaty of defense with the Netherlands would go a long way in preventing the Fascists from attacking our frontiers."
 DDR_attack_belgium_and_luxembourg:0 "War With Belgium and Luxembourg"
 DDR_attack_belgium_and_luxembourg_desc:0 "Belgium and Luxembourg contain German and Germanic minorities. We need to go to war to seize our rightful territories."
 DDR_alliance_for_eupen: "Alliance for Territory"
 DDR_alliance_for_eupen_desc:0 "The Belgian Territory of Eupen is really our territory, so we can ask the Belgians to allow us to take it back, and in exchange, we can enter in an alliance with them."
 DDR_fund_flemish_communists:0 "Fund Flemish Seperatists"
 DDR_fund_flemish_communists_desc:0 "The VKP, or Flemish Communist Party, is a Flemish-Interest Leninist party that we could fund in order to destabilize Belgium."
 DDR_flemish_revolt:0 "Revolt in Flanders"
 DDR_flemish_revolt_desc:0 "We can now order the VKP to revolt!"
 DDR_central_direction: "Central European Intrests"
 DDR_central_direction_desc:0 "We must show our interest in Central European matters."
 DDR_go_for_pan_german_socialism:0 "A Pan-German State"
 DDR_go_for_pan_german_socialism_desc:0 "To complete the German Revolution, we must unite the German Peoples in Central Europe!"
 DDR_revolts_in_central_europe:0 "Central European Revolution"
 DDR_revolts_in_central_europe_desc:0 "We must bring Socialism to Central Europe from the inside, not through violence."
 DDR_war_with_Switzerland:0 "Bring the Revolution to Switzerland"
 DDR_war_with_Switzerland_desc:0 "It would be a waste of time to negotiate with the Pimple of Capitalism. We must bring Socialism to Switzerland through force!"
 DDR_anschluss:0 "Demand Austrian Integration"
 DDR_anschluss_desc:0 "Austria is a natural part of Germany. Maybe they would like to become a province formally?"
 DDR_sudetenland:0 "Demand the Sudetenland"
 DDR_sudetenland_desc:0 "The Sudetenland would be an integral part of Germany, should Czechoslovakia cede it to us."
 DDR_war_with_cze:0 "Operation Green"
 DDR_war_with_cze_desc:0 "We must launch an invasion of Czechoslovakia to bring Socialism to the Workers of Prague!"
 DDR_demand_annexation_of_cze:0 "Occupation of Czechoslovakia"
 DDR_demand_annexation_of_cze_desc:0 "We need to occupy Czechoslovakia to secure our borders! This isn't imperialism. Not at all."
 DDR_war_with_italy:0 "Crush the Italian Fascists!"
 DDR_war_with_italy_desc:0 "Rome is the heart of the Fascist Counter-Revolution. Mussolini and his puppet-king must be destroyed once and for all!"
 DDR_sponsor_the_SPO:0 "Sponsor the SPÖ"
 DDR_sponsor_the_SPO_desc:0 "The Sozialdemokratische Partei Österreichs (Social Democratic Party of Austria) is a Social Democratic Party in Austria (strangely enough) that actually wishes to unite with Germany, somewhat. We should sponsor them to potentially unify our two countries!"
 DDR_sponsor_the_KPO:0 "Sponsor the KPÖ"
 DDR_sponsor_the_KPO_desc:0 "Although the Kommunistische Partei Österreichs (Communist Party of Austria) doesn't actually support German Unification, it would still be nice to have an ally on our Southern Border."
 DDR_Austrian_revolution: "Spark the Austrian Revolution"
 DDR_Austrian_revolution_desc:0 "Our chosen friends in Austria have enough support to revolt against the government! We shall give them the order to do so!"
 DDR_fund_czechoslovakian_communists:0 "Fund Czechoslovakian Socialists"
 DDR_fund_czechoslovakian_communists_desc:0 "Some Czechoslovakian parties would not mind our support to help their country transition to a socialist government."
 DDR_fund_slovakian_communists:0 "Fund Slovakian Seperatists"
 DDR_fund_slovakian_communists_desc:0 "It would be more in our favor to allow the Slovakians to rise up and, with our help, establish their own state in the region."
 DDR_cze_revolution:0 "The Battle of Bratislava"
 DDR_cze_revolution_desc:0 "We shall order the Socialists in Czechoslovakia to revolt! Soon, all of Central Europe will be safe for Socialism!"
 DDR_back_tito:0 "Back Tito"
 DDR_back_tito_desc:0 "Josep Broz Tito in Yugoslavia would make a good ally for Germany. We should support his movement."
 DDR_yug_revolution:0 "The Yugoslav Revolution"
 DDR_yug_revolution_desc:0 "For far too long, the Yugoslav people have been shackled in the chains of the Monarchy! With our help, Tito will free the people and take down the bourgeoisie!"
 DDR_fund_ita_communists:0 "Supply Italian Partisans"
 DDR_fund_ita_communists_desc:0 "Through our intelligence networks, we have been in contact with Italian anti-fascist groups. We should arm them to take the fight to Mussolini!"
 DDR_italian_revolt:0 "Bella Ciao"
 DDR_italian_revolt_desc:0 "The partisans are ready for battle! May their honor be maintained, and may the Fascists fall! The Counter-Revolution dies in Rome!"
 DDR_scandinavia:0 "The Frozen North"
 DDR_scandinavia_desc:0 "We must secure our Northern Front to protect from potential flanking by the British and Soviets."
 DDR_war_with_denmark:0 "War With Denmark"
 DDR_war_with_denmark_desc:0 "The Danish Capitalists pose a danger to our border. To make sure that we are safe, they must be pacified."
 DDR_denmark_mutual_defense_treaty:0 "Treaty of Schleswig"
 DDR_denmark_mutual_defense_treaty_desc:0 "With a treaty of non-aggression and Defense with Denmark, our Northern border will be secured."
 DDR_alliance_with_denmark:0 "Alliance with Denmark"
 DDR_alliance_with_denmark_desc:0 "We need to form a formal Alliance with Denmark to us to really help Denmark and Spread the Revolution!"
 DDR_war_with_sweden:0 "Spread the Revoultion to Sweden"
 DDR_war_with_sweden_desc:0 "The Swedes are part-way to the revolution with their welfare-state policies. We need to...help them go all the way!"
 DDR_sweden_trade:0 "Trade With Germany"
 DDR_trade_with_sweden:0 "Trade Agreements with Sweden"
 DDR_trade_with_sweden_desc:0 "The Swedes provide us with many raw materials; we should seek to deepen ties between our countries."
 DDR_ally_with_sweden:0 "Alliance with Sweden"
 DDR_ally_with_sweden_desc:0 "An alliance with Sweden would go a long way in ensuring peace and stability in Scandinavia."
 DDR_war_with_norway:0 "A Red Skagerrak"
 DDR_war_with_norway_desc: "Norway stands in the way of the European Revolution! We must bring Socialism to Northen Scandinavia the hard way!"
 DDR_guarantee_norway:0 "The Treaty of Oslo"
 DDR_guarantee_norway_desc:0 "We will propose a treaty of mutual defense with the Norwegians. We need to help them defend from Capitalist Aggression."
 DDR_ally_norway:0 "Alliance with Norway"
 DDR_ally_norway_desc:0 "A Formal Alliance with Norway is the best way to prevent dangerous influences from spreading to Scandinavia"
 DDR_war_with_finland:0 "War with Finland"
 DDR_war_with_finland_desc:0 "Finland is a Black Spot on Scandavia. A Republic, worse than a Monarchy, they have the gall to claim that they are free from oppression."
 DDR_ally_finland:0 "Alliance with Finland"
 DDR_ally_finland_desc:0 "We must guard Finland from Soviet Oppression! An Alliance will help them keep the Russian Scourge out of their countries!"
 DDR_eastern_europe:0 "The White Eagle and the Russian Bear"
 DDR_eastern_europe_desc:0 "To safeguard our Eastern Frontier, we have to deal with the Polish state and the Soviet Union."
 DDR_claims_on_Poland:0 "Claims on Poland"
 DDR_claims_on_Poland_desc:0 "There are some Germans still living in Polish-Occupied Lands! We shall declare them as our own so that Poland knows what's coming for them!"
 DDR_war_with_Poland:0 "War with Poland"
 DDR_war_with_Poland_desc:0 "Poland shall know our wrath when we finally Bring them the Revolution! We will make Lenin proud!"
 DDR_defend_poland:0 "Defend Poland"
 DDR_defend_poland_desc:0 "We will show Poland our support by guaranteeing their independence from the Soviet Union!"
 DDR_send_poland_guns:0 "Give Poland Arms"
 DDR_send_poland_guns_desc:0 "Sending Poland weapons would allow them to better arm their military and defend their lands."
 DDR_send_poland_advisors:0 "German Advisors in Poland"
 DDR_send_poland_advisors_desc: "Poland needs to modernize their military. We shall send them some advisors to help out."
 DDR_ally_poland:0 "Alliance with Poland?"
 DDR_ally_poland_desc:0 "An alliance with Poland would better help to ensure stability in the Region!"
 DDR_work_with_USSR:0 "Work with the Soviet Union"
 DDR_work_with_USSR_desc:0 "We must work with our Soviet Brothers to ensure a European Revolution!"
 DDR_war_with_Soviet_union:0 "War with the Soviets"
 DDR_war_with_Soviet_union_desc:0 "We need to bring down the Soviets to ensure the fall of their false Socialism!"
 DDR_pact_with_USSR:0 "Pact with the Soviet Union"
 DDR_pact_with_USSR_desc:0 "We shall sign a pact with the Soviet Union to ensure that neither we or them get dominance in Eastern Europe."
 DDR_join_comintern:0 "Join the Comintern"
 DDR_join_comintern_desc:0 "We shall join the Comintern to help spread Communism accross the Globe!"
 DDR_demand_klaipeda:0 "Demand Memelland"
 DDR_demand_klaipeda_desc:0 "The Memelland is a soviergn territory of Germany! We shall demand it's return!"
 DDR_baltic_war:0 "War in the Baltics"
 DDR_baltic_war_desc:0 "We must bring Socialism back to the Baltic States!"
 DDR_alliance_with_LIT:0 "Alliance with Lithuania"
 DDR_alliance_with_LIT_desc:0 "As long as Lithuania agrees to certain...conditions, we don't we why they can't keep Memel."
 DDR_baltic_alliance:0 "Baltic Alliance"
 DDR_baltic_alliance_desc:0 "The Baltics are in danger of being absorbed by the Soviet Union. We should help them defend themselves."
 DDR_ally_turkey:0 "Alliance with Turkey"
 DDR_ally_turkey_desc:0 "Turkey should be our ally in the German-Soviet war. We need them to help us strike at their oil, and split their lines!"
 
 bavarian_focus:0 "Bavarian Focus Tree"
 BAV_republic_start:0 "The Republic Established"
 BAV_republic_start_desc:0 "The country is free, now the people will be too: they will be able to make their voices heard in the Landtag!"
 BAV_constitutional_monarchy_start:0 "The Monarchy and the Constitution"
 BAV_constitutional_monarchy_start_desc:0 "The country is free, and thanks to the guidance of the King, we will be able to preserve democracy in Germany!"
 BAV_absolute_monarchy_start:0 "The King In Control"
 BAV_absolute_monarchy_start_desc:0 "The country is free, and thanks to the guidance of the King, we will be able to preserve the Wittelsbach legacy!"
 BAV_fascist_start:0 "The Bavarian State"
 BAV_fascist_start_desc:0 "The Bavarian country is free, and our Marshal will ensure that it remains independent and prosperous! Praise the Marshal!"
 BAV_communism_start:0 "BSB: Luxemburgist Revival"
 BAV_communism_start_desc:0 "Ernst Toller and his Bayerische Spartakusbund have been elected to the Bavarian Landtag. They favor Liberatarian Marxism and Council Communism. They claim that this would be the best way to ensure freedom for the Bavarian people."
 BAV_social_democracy_start:0 "BSPD: Friendship Among Peoples"
 BAV_social_democracy_start_desc:0 "The Social Democrats still consider themselves the Bavarian branch of the Social Democratic Party of Germany. They favor Re-Unification under the condition that Germany re-installs democracy or allows Socialists to take control."
 BAV_agrarian_start:0 "BB: Focus on Agrarian Life"
 BAV_agrarian_start_desc:0 "The Bavarian Farmer's League is an agrarian group; They choose to focus on enriching the life of the peasant farmer over the rest of the citizenry. It is expected that they will initiate land reform shortly. It is also liberal and anti-clerical."
 BAV_conservative_start:0 "BVP: Bavarian Traditionalism"
 BAV_conservative_start_desc:0 "The Bavarian People's Party has achieved its main goal: securing the independence of the Bavarian People. Now it must lead them to a future of democracy that no German has seen before!"
 BAV_decentralization:0 "Implement Council Communism"
 BAV_decentralization_desc:0 "To start, we will decentralize our government. All towns and workplaces will have councils, managed by the workers and the people. They will elect themselves and manage themselves. The executives will be the Executive Officers, who are elected only to serve as a facilitator for congresses and meetings. In this vain, there will be no Head of State or Government. There will still be a Central Council, or a Volksrat, to manage foreign affairs, the military, etc; Elections will still continue, even with other political parties."
 BAV_luxemburgist_ideals:0 "Luxemburgist Ideals"
 BAV_luxemburgist_ideals_desc:0 "Luxemburgist Ideals of self-managment, freedom, and democracy will always have a home in our nation!"
 BAV_red_guard:0 "The Red Guard"
 BAV_red_guard_desc:0 "Even though we are a Libertarian Society, we must still have a unit that deals with foreign threats and plots against the government. German agents, Fascist Saboteurs, that kind of thing."
 BAV_militias:0 "People's Militias"
 BAV_militias_desc:0 "We will rely on Militias to defend our country rather than a Standing Army."
 BAV_soviet_republic:0 "Proclaim the Soviet Republic"
 BAV_soviet_republic_desc:0 "With our new reforms, we a truly a Repulic of Soviets. We shall celebrate!"
 BAV_rights_for_all:0 "Rights for All"
 BAV_rights_for_all_desc:0 "Germans, Italians, Jews, no matter: They will all be treated equally in Bavaria!"
 BAV_tax_the_rich:0 "Tax the Rich"
 BAV_tax_the_rich_desc:0 "We will make sure that the Rich pays their fair share. We can then re-invest this money into welfare programs."
 BAV_welfare_state:0 "Welfare State"
 BAV_welfare_state_desc:0 "By ensuring financial stability for the people, we can ensure stability for the nation."
 BAV_education_subsidies:0 "Education Subsidies"
 BAV_education_subsidies_desc:0 "We will fund college education so that our people are more proffesional and educated."
 BAV_abolish_fascism:0 "Abolish Fascism"
 BAV_abolish_fascism_desc:0 "Fascism is a plague on the nation; We will ban it so that our people are protected."
 BAV_agriculture_subsidies:0 "Agricultural Subsidies"
 BAV_agriculture_subsidies_desc:0 "We will subsidize the farmers to ensure their prosperity."
 BAV_diminish_clerical_influence:0 "Diminish Clerical Influence"
 BAV_diminish_clerical_influence_desc:0 "We will dminish clerical influence in our nation in order to ensure that the state remains liberal."
 BAV_land_ownership:0 "Farmer Land Ownership"
 BAV_land_ownership_desc:0 "We will reform the land ownership laws to ensure that the farmers own the land they work and the crops they harvest."
 BAV_recognize_industry:0 "Farmer-Worker Cooperation"
 BAV_recognize_industry_desc:0 "We will recognize the necessity of the Working Class Laborer in the cities, so we can better create goods for our people."
 BAV_political_catholicism:0 "Political Catholicism"
 BAV_political_catholicism_desc:0 "We will directly involve the church with the state. However, this will anger many of our people."
 BAV_concordat_with_pope:0 "Concordat with the Pope"
 BAV_concordat_with_pope_desc:0 "Representatives from our country will visit the Vatican to ensure the pope that Bavaria will remain a Catholic country."
 BAV_heritige_assosiation:0 "Bavarian Heritage Assosiation"
 BAV_heritige_assosiation_desc:0 "We will open up a new ministry dedicated to showing the achievements and events that define our new country!"
 BAV_bavaria_on_the_danube:0 "Bayern Auf Donau"
 BAV_bavaria_on_the_danube_desc:0 "While the Prussians celebrate the Rhine, we choose to celebrate the Danube!"
 BAV_ban_communism:0 "Ban Communism"
 BAV_ban_communism_desc:0 "Communism is a plague on our nation. Should we allow it to exist, the Internationalists shall plunge Bavaria into Ruin and destruction!"
 BAV_bhkb_start:0 "BHDB: Loyalty to the King"
 BAV_bhkb_start_desc:0 "King Ruppert is our leader, and the members of the Bayerischer Heimat- Und Königsbund are his loyal subjects."
 BAV_state_religion:0 "State Religion"
 BAV_state_religion_desc:0 "We will make Catholicism our state religion to allow the King to better rule the nation."
 BAV_woo_conservatives:0 "Woo Conservatives"
 BAV_woo_conservatives_desc:0 "Getting the Nationalists and Conservatives in the BHKP would greatly strengthen our power base."
 BAV_ban_communism2:0 "Ban Communism"
 BAV_ban_communism2_desc:0 "Communism is a threat to the Royal Dictatorship! We must eliminate it while we still have the chance!"
 BAV_eliminate_fascist_influence:0 "Eliminate Fascist Influence"
 BAV_eliminate_fascist_influence_desc:0 "Fascism is also a threat to the Royalty. We must end its influence over our people!"
 BAV_lower_noble_power:0 "Lower the Nobles' Status"
 BAV_lower_noble_power_desc:0 "We must elevate the King over the nobles so they do not terribly ambitious."
 BAV_cult_of_army:0 "Cult of The Army"
 BAV_cult_of_army_desc:0 "The Bavarian Army was the key to the liberation of Bavaria. The People will worship the heroes as holy soldiers, sent to preserve the civilians' way of life!"
 BAV_cult_of_marshal:0 "Cult of The Marshal"
 BAV_cult_of_marshal_desc:0 "Marshal von Epp was the key to the liberation of Bavaria. The People will worship him as the Führer!"
 BAV_fascist_real_start:0 "NSDAP: An Aryan State"
 BAV_fascist_real_start_desc:0 "The National Socialists are dedicated to extreme jingoism and racial purity. They see the reconquest of Germany as the Ultimate goal of Bavaria."
 BAV_military_youth:0 "Military Youth"
 BAV_military_youth_desc:0 "We need a military youth to prepare teenagers for conscription. However, the more teenagers train, the less are working in the factories..."
 BAV_legacy_of_freikorps_epp:0 "Legacy of Freikorps Epp"
 BAV_legacy_of_freikorps_epp_desc:0 "The Marshal's army fought the Communists in 1919, and they will continue to fight them now!"
 BAV_new_fascist_beauracracy:0 "The New Beauracracy"
 BAV_new_fascist_beauracracy_desc:0 "A new political structure is necessary if we are to efficiently control the country."
 BAV_ban_other_parties:0 "Ban Other Political Parties"
 BAV_ban_other_parties_desc:0 "The NSDAP will be the sole party in Bavaria!"
 BAV_name_decision:0 "Embrace the Reich Identity?"
 BAV_name_decision_desc:0 "Should we call ourselves a \"State\" or call ourselves a \"Reich\"?"
 BAV_new_economic_plan:0 "New Economic Plan"
 BAV_new_economic_plan_desc:0 "No matter our chosen government, the state still needs to take some effort to jumpstart the economy."
 BAV_infrastructure1:0 "Bayerische Staatseisenbahn"
 BAV_infrastructure1_desc:0 "Improving the Bavarian State Railways will serve to improve our nation's ability to transport people and equipment through the nation."
 BAV_infrastructure2:0 "Military Railways"
 BAV_infrastructure2_desc: "By designating new rail lines for exclusive military use, we can better improve the efficiency of our supply lines."
 BAV_construction_tech:0 "Improved Construction"
 BAV_construction_tech_desc:0 "By improving our construction methods we can build more military buildings faster."
 BAV_scout_for_mining_resources:0 "Scout for Resources"
 BAV_scout_for_mining_resources_desc:0 "We will look for resources to make our economy more self-sufficient."
 BAV_civilian_industry:0 "Industrial Effort"
 BAV_civilian_industry_desc:0 "More Industry means that we can build buildings faster."
 BAV_civilian_industry2:0 "Industrial Effort 2"
 BAV_civilian_industry2_desc:0 "Even more industry would better enable us to trade and build more industry."
 BAV_military_industry:0 "Military Effort"
 BAV_military_industry_desc:0 "More Military Industry would enable us to make more weapons for our army."
 BAV_research_slot:0 "Fund the University of Munich"
 BAV_research_slot_desc:0 "The Ludwig Maximilian University of Munich will be able, with extra funding, to help our military research!"
 BAV_second_research_slot:0 "Second Research Slot"
 BAV_second_research_slot_desc:0 "With even more industry, we can do more research projects."
 BAV_army_start:0 "Army Doctrine"
 BAV_army_start_desc:0 "We need to develop new army doctrines to better fight our enemies."
 BAV_infantry_weapons:0 "Infantry Weapons Effort"
 BAV_infantry_weapons_desc:0 "We need to develop new weapons for our soldiers to better defeat enemy invaders."
 BAV_support_weapons:0 "Support Division Research"
 BAV_support_weapons_desc:0 "We need support divisions to better enhance our soldiers' capabilities."
 BAV_artillery:0 "Artillery Effort"
 BAV_artillery_desc:0 "We will research better artillery to shell the enemy from far away!"
 BAV_mountaineers:0 "Army Mountaineers"
 BAV_mountaineers_desc:0 "We need soldiers trained in Mountain Combat to better defend our South."
 BAV_defensive:0 "Defensive Focus"
 BAV_defensive_desc:0 "Our main goal will be to defend our land against invaders!"
 BAV_offensive:0 "Offensive Focus"
 BAV_offensive_desc:0 "Our main goal will be to attack other nations!"
 BAV_fort_building:0 "Die Wacht an der Donau"
 BAV_fort_building_desc:0 "We will set up a line of fortifications on the Danube river to prevent Germany from getting across."
 BAV_armor_construction:0 "Tank Research"
 BAV_armor_construction_desc:0 "We need to research new Armor designs to better spearhead into the Enemy's territory."
 BAV_navy_start:0 "Naval Effort"
 BAV_navy_start_desc:0 "With our new coastline, we need a navy to protect it!"
 BAV_destroyers:0 "Destroyer Effort"
 BAV_destroyers_desc:0 "We need destroyers to hunt down enemy submarines!"
 BAV_submarines:0 "Submarine Effort"
 BAV_submarines_desc:0 "We need submarines to destroy enemy transports!"
 BAV_submarines_primacy:0 "Submarine Primacy"
 BAV_submarines_primacy_desc:0 "Submarines are more important than Destroyers!"
 BAV_destroyers_primacy:0 "Destroyer Primacy"
 BAV_destroyers_primacy_desc:0 "Destroyers are more important than Submarines!"
 BAV_heavy_cruisers:0 "Heavy Cruiser Primacy"
 BAV_heavy_cruisers_desc:0 "We need heavy cruisers more than light cruisers!"
 BAV_light_cruisers:0 "Light Cruiser Primacy"
 BAV_light_cruisers_desc:0 "We need light cruisers more than heavy cruisers!"
 BAV_battleship_effort:0 "Battleship Effort"
 BAV_battleship_effort_desc:0 "The Battleship is the spine of the navy!"
 BAV_navy_dockyards:0 "Construct Naval Dockards"
 BAV_navy_dockyards_desc:0 "Now that we have a coastline, we need naval dockyards to build an actual navy!"
 BAV_air_force_start:0 "Aerial Doctrine Effort"
 BAV_air_force_start_desc:0 "We need to research Aerial Doctrines for our planes."
 BAV_fighters:0 "Fighter Effort"
 BAV_fighters_desc:0 "We need to research better fighters to maintain air superiority."
 BAV_fighters_primacy:0 "Light Aircraft Primacy"
 BAV_fighters_primacy_desc:0 "We need light aircraft more than heavy aircraft!"
 BAV_bombers:0 "Tactical Bomber Effort"
 BAV_bombers_desc:0 "We need to research tactical bombers for our airforce."
 BAV_heavy_primacy:0 "Heavy Aircraft Primacy"
 BAV_heavy_primacy_desc:0 "We need more heavy aircraft than we need light air craft."
 BAV_cas:0 "Close Air Support Effort"
 BAV_cas_desc:0 "We need close air support to supplement our ground troops."
 BAV_strat_effort:0 "Strategic Air Effort"
 BAV_strat_effort_desc:0 "With Strategic Bombers, we will be able to damage enemy infrastructure and factories."
 BAV_rocketry:0 "Rocketry Effort"
 BAV_rocketry_desc:0 "Rockets will let us attack our enemies from afar without risking human lives. Well, Bavarian lives anyways."
 BAV_on_the_world_stage:0 "Bavaria on the World Stage"
 BAV_on_the_world_stage_desc:0 "We need to decide what Bavaria's policy towards the world and the rest of German will be."
 BAV_reconciliation_with_germany:0 "Reconciliation with Germany"
 BAV_reconciliation_with_germany_desc:0 "We wish to reconcile with Germany, and eventually rejoin them. We could either join Germany as a province, join as a Dominion, or join as a member of their alliance."
 BAV_wants_reconcile:0 "Wants to Rejoin"
 BAV_neutral_bavaria:0 "Bavarian Neutrality"
 BAV_neutral_bavaria_desc:0 "We will choose to defend Bavarian independance without being an aggessor."
 BAV_greater_bavaria:0 "Claim Greater Bavaria"
 BAV_greater_bavaria_desc:0 "We will attempt to expand into other parts of South Germany."
 BAV_south_germany:0 "A South German State"
 BAV_south_germany_desc:0 "We will attempt to create a South German state, as was done by the North before Unification."
 BAV_new_germany:0 "A New Germany!"
 BAV_new_germany_desc:0 "We are the legitimate German government, and we shall enforce this on the False Rulers!"
 BAV_wait_for_politics:0 "Once Germany's Politics align with ours, a decision will become available."
 BAV_annexed_by_GER:0 "Reunion!"
 BAV_annexed_by_GER_desc:0 "We shall seek to be directly annexed by Germany!"
 BAV_subject_of_GER:0 "Submission!"
 BAV_subject_of_GER_desc:0 "We shall seek to become an autonomous province of Germany!"
 BAV_alliance_with_GER:0 "Alliance"
 BAV_alliance_with_GER_desc:0 "We shall seek to join the Germans in an alliance."
 BAV_war_with_germany:0 "War With Germany"
 BAV_war_with_germany_desc:0 "We will take the offensive to the Germans!"
 BAV_south_german_federation:0 "South German Federation"
 BAV_south_german_federation_desc:0 "We will seek to create a Federation of South Germans!"
 BAV_south_german_confederation:0 "South German Confederation"
 BAV_south_german_confederation_desc:0 "We will seek to create a decentralized Federation of South Germans!"
 BAV_south_german_federation_AUS:0 "Invite Austria"
 BAV_south_german_federation_AUS_desc:0 "We will invite Austria to join our Federation."
 BAV_south_german_federation_CZE:0 "Demand Southern Sudetenland"
 BAV_south_german_federation_CZE_desc:0 "We will demand the German majority-area of Southern Czechoslovakia from Prague!"
 BAV_south_german_federation_ITA:0 "Demand South Tyrol"
 BAV_south_german_federation_ITA_desc:0 "South Tyrol still has a population of Germans, We should force the Italians to give it to us!"
 BAV_south_german_federation_YUG:0 "Demand Slovenia"
 BAV_south_german_federation_YUG_desc:0 "We will demand Slovenia, with its small population of Germans, to become part of the Federation!"
 BAV_south_german_confederation_AUS:0 "Invite Austria"
 BAV_south_german_confederation_AUS_desc:0 "We will invite Austria to our faction, as they are true South Germans!"
 BAV_south_german_confederation_ITA:0 "Demand Tyrolean Freedom"
 BAV_south_german_confederation_ITA_desc:0 "We will demand that Italy give us South Tyrol to decide its fate."
 BAV_south_german_confederation_YUG:0 "Demand Slovenian Freedom"
 BAV_south_german_confederation_YUG_desc:0 "We will demand that Yugoslavia give us Slovenia to decide that fate of the Slovenians and South Germans!"
 BAV_win_war_for_survival:0 "War of Independance"
 BAV_win_war_for_survival_desc:0 "If we are to win the war, we must rally!"
 BAV_hasty_develop_industry:0 "Hastily Develop Industry"
 BAV_hasty_develop_industry_desc:0 "We must quickly develop some industry if we want to survive!"
 BAV_hasty_develop_industry2:0 "Quick Military Factories"
 BAV_hasty_develop_industry2_desc:0 "We must quickly develop military industry if we want weapons for our army!"
 BAV_old_rifles:0 "Use Old Rifles"
 BAV_old_rifles_desc:0 "We must find and use old rifles, as any help is accepted!"
 BAV_quick_fortificatons:0 "Quick Fortifications"
 BAV_quick_fortificatons_desc:0 "We must hastily erect fortifications to better defend our cities!"
 
