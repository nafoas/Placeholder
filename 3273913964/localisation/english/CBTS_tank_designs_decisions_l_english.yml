 FRA_design_somua_s35: "Design the SOMUA S35"
 FRA_form_51e_bcc: "Form the 51e. Bataillon de Chars de Combat"
 FRA_form_51e_bcc_desc: "We will recreate the 51st BCC after the dissolution of the 511e Régiment de Chars de Combat. It will be comprised of all the FCM 2C heavy tanks from the 511e RCC and placed under the command of Major Fournet. The 2C chars are very heavy and powerful tanks that were made in 1919 to break the German lines, but after the war they became rapidly obsolete and now are used as propaganda tools to boost morale. The propaganda films of these behemoths destroying old structures, knocking down trees, and crossing bodies of water have instilled in the public a sense that the 2C is an \"indestructible super tank\" of sorts. Now it's time to prove its might on the battlefield!"

