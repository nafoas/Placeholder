 ### France ###
 FRA_new_tank_designs:0 "Request New Tank Designs"
 FRA_new_tank_designs_desc:0 "Tanks are an important part of modern warfare that proved their usefulness in the last war. France has, since then, been at the forefront of tank design and engineering, and we want it to stay that way. So, time for some new ideas! We will send out requests to major manufacturers around the country that we are looking for new prototypes."
