 DEN_danish_neutrality:0 "Danish Neutrality"
 DEN_danish_neutrality_desc: "Despite being occupied by Germany, Denmark still mantains itself as neutral in the global conflict."
#  DEN_danish_neutrality_desc:0 "Since the crushing defeat of 1864, Denmark has followed a strict policy of absolute neutrality. Most politicians agree, that if war ever came, Denmark would have no hope of survival."
 DEN_lockout:0 "Lockout!"
 DEN_german_occupation:0 "German Occupation"
 DEN_german_occupation_desc:0 "As a result of the cooperative attitude of the Danish authorities, German officials have claimed that they would \"respect Danish sovereignty and territorial integrity, as well as neutrality\". Holding that the Danes are \"fellow Nordic Aryans\" and their only strong interest in Denmark being the copious amount of agricultural products, the German authorities have been inclined towards lenient terms with the Danish: by making Denmark a de-facto protectorate that is able to maintain much of the former control over domestic policy.\nThe Danish government has remained somewhat intact and parliament continues to function more or less as it had before. The police and judicial system have remained in Danish hands, and unlike most occupied countries, King Christian X continues to be the Danish head of state.\n\nThe majority of Danes are unwillingly compliant towards the German invaders. This includes the Danish government, a coalition cabinet encompassing all major political parties headed by Thorvald Stauning's Social Democrats, who had been strongly opposed to the Nazi party before the war. Nonetheless, the government has pursued a strategy of cooperation, hoping to maintain democracy and Danish control in Denmark for as long as possible."
