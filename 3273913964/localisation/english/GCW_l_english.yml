 GCW_WGR_widespread_chaos4:0 "Widespread Chaos"
 
 GCW_WGR_disbanded_army:0 "Disbanded Army"
 GCW_WGR_disbanded_army_desc:0 "Most of the Reichswehr has defected to the Nationalist side, leaving us with few professional soldiers and lots of militias. The shortage of officers has only exacerbated this problem, so we must hold on until the militias are experienced enough to form the basis of a new, Republican army."
