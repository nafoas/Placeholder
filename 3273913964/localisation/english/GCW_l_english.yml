 GER_agrarian_subsidies:0 "Agrarian Subsidies"
 GER_protected_monopolies:0 "Protected Monopolies"
 GER_privatizations:0 "Ongoing Privatization"
 
 FOCUS_FILTER_REICHSWEHR:0 "Reichswehr/Volksheer"
 FOCUS_FILTER_MILITARY_PRODUCTION:0 "Military Production"
 FOCUS_FILTER_REACTIONARY:0 "Reactionary"
 FOCUS_FILTER_HARZBURG_FRONT:0 "Harzburg Front"
 FOCUS_FILTER_NAZI:0 "National Socialist"
 FOCUS_FILTER_FOREIGN_GCW:0 "Foreign Contacts"
 FOCUS_FILTER_AGRICULTURAL:0 "Agriculture"
 FOCUS_FILTER_ECONOMIC:0 "Economy"
 germany_sturmabteilung:0 "Sturmabteilung Leader"
 germany_sturmabteilung_desc:0 "This leader is part of the National Socialist Storm Trooper corps."
 germany_rightist:0 "Nationalist Sympathies"
 germany_rightist_desc:0 "This leader has anti-democratic and nationalist sympathies."
 germany_reactionary:0 "Reactionary Sympathies"
 GER_reichswehr_party:0 "Reichswehr"
 GER_reichswehr_party_long:0 "Reichswehr"
 
 GER_cw_tree:0 "National Salvation Government Tree"
 GER_National_Salvation_Gov:0 "The National Salvation Government" 
 GER_National_Salvation_Gov_desc:0 "The Weimar Republic has failed, but the Harzburg Front stands ready to seize the ship of state. The democratic politicians may have sold Germany out to the Marxists, traitors, and foreign capital, but the National Salvation Government shall punish the sell-outs and restore Germany to its proper place in Europe!"
 GER_Occupy_Local_Councils:0 "Occupy Local Councils"
 GER_Occupy_Local_Councils_desc:0 "In order to enforce our authority at the local level, SA and Stahlhelm troopers will occupy and abolish local councils, replacing them with a government representative. This will ensure that orders from the central government are carried out in full."
 GER_Reorganize_The_Reichswehr:0 "Reorganize the Reichswehr"
 GER_Reorganize_The_Reichswehr_desc:0 "To efficiently manage military affairs during the Civil War, we will embark on a partial reorganization of the Reichswehr to account for the dual commands of the generals and the SA."
 GER_Abolish_Trade_Unions:0 "Abolish Trade Unions"
 GER_Abolish_Trade_Unions_desc:0 "Trade unions are instruments of national division. They enable subversive forces to divide the German nation under the guise of so-called \"class struggle\" and egalitarian visions. To prevent acts of sabotage, we will immediately abolish all trade union activity."
 GER_Abolish_Leftist_Organizations:0 "Abolish Leftist Organizations"
 GER_Abolish_Leftist_Organizations_desc:0 "One of our main goals is to save Germany from the Marxists! As such, now that we are in control of local political offices, we can formally abolish all leftist organizations in the country."
 GER_Local_Recruitment_Campaigns:0 "Local Recruitment Campaigns"
 GER_Local_Recruitment_Campaigns_desc:0 "We should spend time engaging in a recruitment campaign for the armed forces. Propaganda and rallies should help to bolster our numbers when we meet the enemy in battle!"
 GER_Promote_Veteran_Soldiers:0 "Promote Veteran Soldiers"
 GER_Promote_Veteran_Soldiers_desc:0 "Veteran soldiers of the Great War should come to the forefront as leaders in our military! Their experiences will be indispensable against our foes."
 GER_Increase_Military_Production:0 "Increase Military Production"
 GER_Increase_Military_Production_desc:0 "To secure Germany against the Republican and Communist governments, we obviously need weaponry. As such, we will organize the establishment of production lines for equipment and firearms that we desperately need."
 GER_Big_Business_Contacts:0 "Contact Major Corporations"
 GER_Big_Business_Contacts_desc:0 "Major industrialists are a bit wary about our government. On one hand, they appreciate the return of an authoritarian government, but are unsure as to the NSDAP's attitude towards their firms. We must reassure them that our government has every intention of promoting their business activities."
 GER_Attack_the_Courts:0 "Attack the Courts"
 GER_Attack_the_Courts_desc:0 "The courts remain an enemy of the Harzburg Front. We shall remove unsympathetic members of the judiciary, and replace them with our own."
 GER_Arrest_Enemy_Sympathizers:0 "Arrest Enemy Sympathizers"
 GER_Arrest_Enemy_Sympathizers_desc:0 "Now that the leftist organizations are abolished, we can work on arresting ranking members of the leftist and centrist parties to prevent enemy spies from sabotaging our military efforts."
 GER_Improve_Military_Railways:0 "Improve Military Railways"
 GER_Improve_Military_Railways_desc:0 "We need to improve military railways to ensure that we can get equipment and supplies where we need them to be. As such, we will spend time working on our networks."
 GER_Approach_Mussolini:0 "Approach Mussolini"
 GER_Approach_Mussolini_desc:0 "Like-minded governments might be willing to grant us recognition and send us equipment if we ask them. We shall start sending feelers to Mussolini's Italy to test the waters and try to achieve international legitimacy through his actions."
 GER_Talk_to_the_Reichsbank:0 "Talk to the Reichsbank"
 GER_Talk_to_the_Reichsbank_desc:0 "We need to approach the Reichsbank for funding, or else we might not be able to pay the industrialists for the services we need. There will of course be an understanding that failure to cooperate will be met with consequences."
 GER_Install_Nationalist_Bureaucrats:0 "Install Nationalist Bureaucrats"
 GER_Install_Nationalist_Bureaucrats_desc:0 "We are now in a position to entrench our dictatorship by developing our bureaucracies in local municipalities. This will supposedly ensure that our orders are carried out more effectively and that the populace becomes more receptive to National Socialist ideology."
 GER_Stettin_Decree:0 "The Stettin Decree"
 GER_Stettin_Decree_desc:0 "One of our other major goals is the exclusion of Jews from public life. The Stettin Decree will prohibit Jewish participation in government, the judiciary, and universities. In addition, they will be prohibited from managing large companies."
 GER_Propaganda_in_the_Military:0 "Propaganda in the Military"
 GER_Propaganda_in_the_Military_desc:0 "In order to spread National Socialism to the soldiers, we will cut training time in favor of ideological education. Though senior officers might protest, this is merely to ensure that no soldier makes an attempt to hinder our efforts."
 GER_Expand_Hitler_Youth:0 "Expand Hitler Youth"
 GER_Expand_Hitler_Youth_desc:0 "Hitler Youth, the NSDAP organization for young men, teaches our children National Socialist ideology and prepares them for the National Dictatorship. As such, this organization should be expanded, to the Conservatives' chagrin..."
 GER_Regulate_the_Agricultural_Market:0 "Regulate the Agricultural Market"
 GER_Regulate_the_Agricultural_Market_desc:0 "We will introduce new regulations to the agricultural market to protect farmers from the excesses of the free market. Limits on imports and barriers for certain food alternatives should drive prices up and thus increase farmers' incomes."
 GER_Pressure_Smaller_Enterprises:0 "Pressure Small Enterprises"
 GER_Pressure_Smaller_Enterprises_desc:0 "Small-and-Medium-businesses are not considered trustworthy by the members of the Harzburg Front. We will pressure them into serving the government's interests should they wish to continue doing business."
 GER_GCW_failed_coup:0 "§GThe DNVP and Reichswehr have attempted, but failed, to coup our government.§!"
 GER_GCW_Harzburg_Front_survives:0 "§GThe Harzburg Front has survived because we have given concessions to the DNVP and the Reichswehr.§!"
 GER_GCW_successful_coup:0 "§GThe DNVP and the Reichswehr have taken over the government from Hitler and the NSDAP.§!"
 GER_National_Socialist_Revolution:0 "National Socialist Revolution"
 GER_National_Socialist_Revolution_desc:0 "We have been betrayed by Bourgeois forces in our government. The DNVP and the Reichswehr conspired, but failed, to take over the government to serve their own interests. We shall now engage in a purge of the government, dismissing conservative members of the government and arresting those responsible for this act of treason!"
 GER_The_Harzburg_Front_Survives:0 "The Harzburg Front Survives"
 GER_The_Harzburg_Front_Survives_desc:0 "Even though we have had to reduce our grip on the state, the Harzburg Front has managed to maintain unity, even if what little trust there was has begun to break down. Regardless, we can move forwards with our vision for Germany towards the stabilization of the National Dictatorship."
 GER_Die_Alte_Garde:0 "Die Alte Garde"
 GER_Die_Alte_Garde_desc:0 "The madman Hitler and his cronies threatened to subject Germany to their dystopian delusions, but the DNVP and the Reichswehr have saved the country. We should now spend time purging the government of leading Hitlerists, so we can have our Old Kaiser Wilhelm back again."
 GER_Convert_Civilian_Planes:0 "Convert Civilian Planes"
 GER_Convert_Civilian_Planes_desc:0 "We have some experienced pilots; some trained on light aircraft here in Germany, and others at the Kampffliegerschule Lipetzk, established in secret by the Reichswehr and the Red Army. We should convert some civilian planes to military fighter planes to secure air superiority over the German skies."
 GER_Arrest_Monarchist_Sympathizers:0 "Arrest Monarchist Sympathizers"
 GER_Arrest_Monarchist_Sympathizers_desc:0 "Influential members of local communities may have monarchist sympathies. We should arrest them to prevent the spread of anti-National Socialist ideologies."
 GER_Blut_und_Bloden:0 "Blut und Bloden"
 GER_Blut_und_Bloden_desc:0 "Part of our ideology is the concept of \"Blood and Soil\", the idea that peasants should be tied to the land on the basis of \"race\". To implement this theory, we will pass the Reichserbhofgesetz (State Hereditary Law), so that family farms of a certain size will be inherited by either Primogeniture or Ultimogeniture, and their sale and lease will be forbidden."
 GER_Shift_Responsibilities_to_the_Military: "Shift Responsibilities to the Military"
 GER_Shift_Responsibilities_to_the_Military_desc:0 "As part of our agreement with the Reichswehr, we will grant the General Staff more political responsibilities. This will include the Provisional Reich Ministry for Economics and Finance, which will be given to General Georg Thomas, ensuring that the war effort is the sole focus of the German economy."
 GER_Integrate_the_SA:0 "Integrate the SA"
 GER_Integrate_the_SA_desc:0 "We promised to subordinate the Sturmabteilung into the Reichswehr and end the period of Dual Commands. As such, we will move SA command under the General Staff. This might irk SA leaders, but it should help improve our military effectiveness."
 GER_Ensure_Clerical_Loyalty:0 "Ensure Clerical Loyalty"
 GER_Ensure_Clerical_Loyalty_desc:0 "The Protestant Clergy are far more comfortable with our government than they were with Hitler, but we should make sure that they - and the Catholics for that matter - hold no ideas of resistance among them."
 GCW_GER_Establish_Volksheer_tt:0 "§Y4 new §GSturmabteilung Divisions§!§Y will be raised.§!"
 GER_Establish_the_Volksheer:0 "Establish the Volksheer"
 GER_Establish_the_Volksheer_desc:0 "Due to the Reichswehr betrayal, we have to pursue other means of military command. One of these ideas - the one Sturmabteilung leaders have the most enthusiasm for - is the People's Militia project. In practice, this entails the subordination and integration of the Reichswehr into the SA, which will become the Volksheer."
 GER_Occupy_the_Banks:0 "Occupy the Banks"
 GER_Occupy_the_Banks_desc:0 "Since the Bankers have proved themselves to be turncoats, we should occupy and nationalize the banks to protect state interests. They will now be managed by representatives appointed by the Provisional Reich Ministry for Economics and Finance."
 GER_Break_up_Junker_Estates:0 "Break up Junker Estates"
 GER_Break_up_Junker_Estates_desc:0 "As punishment for their allegiance to the DNVP, the Junkers' estates will be seized and broken up for state usage or the establishment of Erbhöfe."
 GER_Leave_Junkers_Alone:0 "Leave the Junkers Alone"
 GER_Leave_Junkers_Alone_desc:0 "We will leave large landowners alone, much to the chagrin of some members of the NSDAP. We need their moral and traditional leadership to secure social stability."
 GER_Motorized_Experiments:0 "Motorized Experiments"
 GER_Motorized_Experiments_desc:0 "To modernize our military, we will experiment with the motorization of our foot soldiers. That is to say, we will see if it is feasible to put them in large trucks and drive them to battle instead of marching them to and fro."
 GER_Support_Traditional_Militarism:0 "Support Traditional Militarism"
 GER_Support_Traditional_Militarism_desc:0 "We will lend symbolic support for traditional Prussian militarism and its values: honor, strength, and above all, loyalty."
 GER_Absorb_the_NSDAP:0 "Absorb the NSDAP"
 GER_Absorb_the_NSDAP_desc:0 "Now that we have freed ourselves from that horrid Hitler, it is time to absorb the NSDAP into the DNVP. The NSDAP will be abolished, and its members will be offered free membership in our party instead."
 GER_Practice_New_Maneuvers:0 "Practice New Manuevers"
 GER_Practice_New_Maneuvers_desc:0 "The Volksheer has a radically different structure than the Reichswehr. To be militarily effective, it needs to spend time formulating and practicing new maneuvers that take advantage of its mass base."
 GER_Distribute_Mein_Kampf:0 "Distribute Mein Kampf"
 GER_Distribute_Mein_Kampf_desc:0 "Volksheer training will, of course, include a course in ideological education. Hitler's magnum opus will be distributed, read, and studied thoroughly by every soldier, even at the expense of actual military training."
 GER_The_Travemunde_Decree:0 "The Travemünde Decree"
 GER_The_Travemunde_Decree_desc:0 "Since the major industrial firms sided with the Reichswehr and DNVP over us in the attempted coup, it is only fair to deprive them of the ability to conduct business. As such, ownership of large corporations will be transferred from their traditional owners to National Socialist Party elites, who can manage them as they see fit."
 GER_Arrest_Conservative_Professors:0 "Arrest Conservative Professors"
 GER_Arrest_Conservative_Professors_desc:0 "University Professors with Conservative sympathies will be arrested and removed for teaching undesirable ideologies to their students. This should ensure ideological homogeneity among university faculty."
 GER_Create_National_Cartels:0 "Create National Cartels"
 GER_Create_National_Cartels_desc:0 "We will form a system of national cartels based on the different sectors of industry. This will protect the interests of major industrialists while enabling our government to ensure that they are producing what we need them to."
 GER_Form_the_Military_Economic_Board:0 "Form the Military-Economic Board"
 GER_Form_the_Military_Economic_Board_desc:0 ""We will not interfere with the business interests of the major industrial firms, but we will form a Military-Economic Board that will enable state interests to efficiently cooperate with business interests to secure our military needs."
 GER_Privileges_for_Junkers:0 "Privileges for Junkers"
 GER_Privileges_for_Junkers_desc:0 "The Junkers (the major Prussian industrialists, landowners, and nobility) would be a positive influence on our government, as their moral leadership would defend the traditional order that we so desire!"
 GER_Work_with_Rifle_Makers:0 "Work with Rifle Makers"
 GER_Work_with_Rifle_Makers_desc:0 "We will work with our rifle-making companies to design new models for our infantry. They might give us the edge on the enemy in battle!"
 GER_Expand_Conscription:0 "Expand Conscription"
 GER_Expand_Conscription_desc:0 "To staff the Volksheer, we need to conscript soldiers from the population as much as we can. This will prevent reactionary elements from the Stahlhelm or Reichswehr from gaining influence in our military"
 GER_Integrate_the_Stahlhelm:0 "Integrate the Stahlhelm"
 GER_Integrate_the_Stahlhelm_desc:0 "The Stahlhelm's continued existence is a relic of the Dual Command, and should be disbanded immediately. We will keep its structure in place for the time being, as it is not unlike the Volksheer, but it will be subordinated to Sturmabteilung leadership."
 GER_Decentralize_Industry:0 "Decentralize Industry"
 GER_Decentralize_Industry_desc:0 "Industrial life is a far cry from the idyll sphere of the German Bauer. We can try to offset urbanism by building factories in unindustrialized areas, thus allowing everyone to interact with nature on their own terms."
 GER_Expand_our_Industrial_Base:0 "Expand our Industrial Base"
 GER_Expand_our_Industrial_Base_desc:0 "We need to expand our industrial base in order to meet our military needs. The new factories will be built in existing industrial areas to benefit from local expertise and infrastructure."
 GER_Study_Military_Mobility:0 "Study Military Mobility"
 GER_Study_Military_Mobility_desc:0 "The General Staff will study the development of new strategies and tactics that make use of motorized and armored units."
 GER_Secure_the_Support_of_Senior_Officers:0 "Secure the Support of Senior Officers"
 GER_Secure_the_Support_of_Senior_Officers_desc:0 "We have to secure the support of senior officers in order to ensure political unity in our government. Thus, we will establish clandestine programs to channel \"gifts\" to senior officers to secure their loyalty."
 GER_Secure_Hohenzollern_Support:0 "Secure Hohenzollern Support"
 GER_Secure_Hohenzollern_Support_desc:0 "Hohenzollern support for our government would provide a much-needed boost to our legitimacy in the public eye. We will court the former royals with promises of privileges and status."
 GER_Experiences_of_the_Great_War:0 "Experiences of the Great War"
 GER_Experiences_of_the_Great_War_desc:0 "Our officers' experiences in the Great War will be of use in this conflict. We will have them study and update our tactics to match the conditions of the civil war"
 GER_Benefits_for_Farmers:0 "Benefits for Farmers"
 GER_Benefits_for_Farmers_desc:0 "We will establish a program to expand agrarian subsidies to ensure that farmers can earn a living regardless of produce, meat, and dairy prices. It should also stimulate purchases given that individual farmers will have more purchasing power. This will fulfill one of our promises and help us appeal to the peasants."
 GER_Promote_New_Leaders:0 "Promote New Leaders"
 GER_Promote_New_Leaders_desc:0 "To offset the subordination of Reichswehr commanders to the SA, we will promote members of the Volksheer to that of top generals."
 GER_Study_Motorization:0 "Study Motorized Armies"
 GER_Study_Motorization_desc:0 "We will attempt to study the effects of motorization on our military structure, as it might be useful to truck our units around rather than have them march everywhere."
 GER_Limit_Small_Businesses:0 "Limit Small Businesses"
 GER_Limit_Small_Businesses_desc:0 "To protect the interests of large businesses, we will place limits on the establishment of small enterprises. All businesses with less than 200.000 Reichsmarks in capital will be closed down, and new businesses must have over 400.000 Reichsmarks to legally establish themselves."
 GER_Reformulate_Strategies:0 "Reformulate Strategies"
 GER_Reformulate_Strategies_desc:0 "We will spend time further reformulating strategies to make the most use of the resources and manpower we have on hand."
 GER_Absorb_the_Reichslandbund:0 "Absorb the Reichslandbund"
 GER_Absorb_the_Reichslandbund_desc:0 "The Reich Agrarian League has been a steadfast ally to our government, and thus should be absorbed into the DNVP to present a front of unity."
 GER_Privatize_State_Owned_Services:0 "Privatize State-Owned Services"
 GER_Privatize_State_Owned_Services_desc:0 "As part of our support for the interests of major industrialists, we will privatize state-owned services. This should make the markets more efficient and thus protect Germany's immense industrial needs."
 GER_Protect_Monopolies:0 "Protect Monopolies"
 GER_Protect_Monopolies_desc:0 "We will aim to protect monopolies in Germany, which will create jobs and spur the growth of major industrial firms. As such, we will put restrictions on smaller enterprises and lift restrictions on major corporations."
 GER_Create_the_Office_of_Fuhrer:0 "Create the Office of the Führer"
 GER_Create_the_Office_of_Fuhrer_desc:0 "The National Socialist government is now in control of Berlin, our dear capital, and thus we can establish the office of the Führer (leader) for Adolf Hitler, leader of the Third German Reich!"
 GER_Focus_on_Conscription:0 "Focus on Conscription"
 GER_Focus_on_Conscription_desc:0 "In order to improve our military effectiveness, we will expand conscription into the Reichswehr. This will also prevent conflict between Reichswehr soldiers, former SA-men, and Stahlhelm members."
 GER_Retrain_Militiamen:0 "Retrain Militiamen"
 GER_Retrain_Militiamen_desc:0 "Instead of expanding conscription, we need to retrain former militiamen so that they are up to par with the rest of the Reichswehr. This will reduce ideological conflict within the ranks and better appease the conservative generals."
 GER_Absorb_the_Alldeutscher_Verband:0 "Absorb the Alldeutscher Verband"
 GER_Absorb_the_Alldeutscher_Verband_desc:0 "The Alldeutscher Verband is an old organization, but it provided the precursor to the pan-German nationalist ideology espoused by our government. They will be absorbed into the DNVP as a semi-autonomous gentlemans' club."
 GER_Distribute_Military_Contracts:0 "Distribute Military Contracts"
 GER_Distribute_Military_Contracts_desc:0 "To meet the growing needs of our military, we need to distribute military production contracts to our major corporations. They will produce the equipment we need to overtake the Republicans and Bolsheviks!"
 GER_Pan_German_Dictatorship:0 "The Pan-German Dictatorship"
 GER_Pan_German_Dictatorship_desc:0 "Now that we are pulling ahead to victory, all Germans can see that it is the Harzburg Front Government that has the nation's best interests in mind! Long live the Harzburg Front! Long live the Pan-German Dictatorship!"
 GER_Proclaim_Regency:0 "Proclaim the Regency"
 GER_Proclaim_Regency_desc:0 "The conservative government is in charge of Berlin and our enemies have begun to fall. It is time to proclaim Herr Hugenberg the Regent of the Third German Empire!"
 GER_Admirality_Shakeup:0 "Review the Admirality"
 GER_Admirality_Shakeup_desc:0 "We will review and reorganize the admirality in the wake of the division of the navy. To ensure that shipments reach our shores, we need the best commanders we can find!"
 
 GER_GCW_Recognized_Nationalists:0 "Recognized the Nationalists as the legitimate German government."
 GER_GCW_Did_Not_Recognize_Nationalists:0 "Did not recognize the Nationalists as the legitimate German government."
 GER_GCW_Recognized_Nationalists_Ext:0 "Recognized a rival government during the German Civil War."
 ger_civil_war.1.t:0 "[From.GetLeader] Calls for Aid"
 ger_civil_war.1.d:0 "The shock of the German Civil War has put the whole world on edge, and Rome is no different. We have been closely watching the conflict, taking note of each side and quietly establishing feelers with the various governments that claim to represent Germany and her people. However, we have gotten official requests for recognition and arms from [From.GetLeader]'s government in [From.Capital.GetName]. Few in our government have much faith in the German Nationalists, as Hitler is generally seen as a delusional loose cannon among the far-right. We recognize that overtly supporting the Nationalists would ingratiate us with their government should they win, but also might irk the other German governments and the surrounding countries, none of whom are enthusiastic about an officially irredentist Germany."
 ger_civil_war.1.a:0 "We will assist their cause!"
 ger_civil_war.1.b:0 "We will stay neutral for the time being."
 ger_civil_war.2.t:0 "Mussolini Sends Arms"
 ger_civil_war.2.d:0 "Benito Mussolini and the Italian government have, at our request, officially recognized our government and sent us a shipment of firearms for the Reichswehr. Once the trains arrived in [This.Capital.GetName], German soldiers met their Italian counterparts, and the Italian Captain in charge of the operation had dinner with the German Major overseeing the offloading. The weapons and ammunition will be added to our stockpile, and then will be sent to the front without haste. With such an ally by our side, there is no way that we could possibly lose this conflict!"
 ger_civil_war.2.a:0 "Bravo!"
 ger_civil_war.3.t:0 "Mussolini Remains Neutral"
 ger_civil_war.3.d:0 "Benito Mussolini and his government in Italy have ignored our requests for recognition and aid. Despite our diplomats' best efforts, where they nearly resorted to begging, the Italian government refuses to budge, as they officially regard the civil war as \"an internal matter\" that we need to solve ourselves. It seems that they would be ready to parlay with anyone to save their own skin!"
 ger_civil_war.3.a:0 "We have been betrayed!"
 ger_civil_war.4.t:0 "Demands from the Reichswehr"
 ger_civil_war.4.d:0 "Our government contains three main political factions: the NSDAP, the DNVP, and the Reichswehr. With our support base, we National Socialists currently dominate political affairs, which has led to a great deal of worry in the other two camps. Their fears are well founded: our political doctrine maintains that the NSDAP should be an all-encompassing political force, meaning that the DNVP should be abolished and the Reichswehr should be entirely subordinated to the political leadership. This is obviously something that the \"Conservative\" factions wish to avoid for their own sakes.\n\nOver the past few days, Herr Hitler has been working with representatives from the Reichswehr to work out a \"compromise\" that would support the interests of both sides. In reality, the Reichswehr have been demanding political autonomy and participation in decision-making, while our Leader is trying to water down their requests. With both sides refusing to give in, the Senior Officers have given the government an ultimatum: Either accept the Reichswehr's demands, or lose the military's political support."
 ger_civil_war.4.a:0 "It seems that we must accept these demands."
 ger_civil_war.4.b:0 "The Generals should be focusing on the war, not playing politics!"
 ger_civil_war.5.t:0 "The DNVP Demands Certain Ministries"
 ger_civil_war.5.d:0 "Like the Reichswehr, the German National People's Party has become increasingly anxious about the future of our government. The DNVP and its leaders know full well that once we no longer have need of them, they will be simply cast aside in favor of total NSDAP dominance. As such, with the tacit support of the Reichswehr, DNVP leader Alfred Hugenberg has demanded that the DNVP be guaranteed certain positions in the government, such as the heads of the Reich Ministries of Foreign Affairs, Agriculture, Postal Services (all currently provisional positions) and a guarantee for several ministers without portfolio. Unlike the Reichswehr, Hugenberg cannot publicly sever the DNVP and NSDAP's ties, even if the relationship has begun to wear a bit thin, so we should have more room with which to work in."
 ger_civil_war.5.a:0 "They may have these ministries."
 ger_civil_war.5.b:0 "These ministries are already staffed with those who can best serve the Leader."
 ger_civil_war.6.t:0 "The Rights of Major Corporations"
 ger_civil_war.6.d:0 "The original 25-Point Platform of the NSDAP featured several policies targeted at the major industrial corporations and landowners of our nation, such as the breaking up of major estates and the nationalization of key industries. Though Herr Hitler does not actually believe in these parts of the program, many NSDAP members, particularly in the SA, consider them to be a core pillar of National Socialism. These self-described \"revolutionaries\" have made members of the DNVP and the industrialist community nervous, as they fear for their positions and status. DNVP officials, representing the business community, have asked our government for official guarantees that the government would not take radical action against major industries and landowners. They have become increasingly clear that they might denounce our government if we refuse..."
 ger_civil_war.6.a:0 "We have no intention of harming Germany's Industry!"
 ger_civil_war.6.b:0 "The industrialists should be more concerned about what they could do for us."
 ger_civil_war.7.t:0 "The Reichswehr Demands SA Subordination"
 ger_civil_war.7.d:0 "Since the start of our civil conflict, the Reichswehr, Stahlhelm, and Strumabteilung have been operating in coordination, but with each body autonomous from the others. Though the Stahlhelm has, by its own initiative, more-or-less subordinated itself to the Reichswehr, SA high command remains separate from the traditional military. This has led to significant conflict between the two armies, as the Reichswehr sees the SA as a gang of dim-witted fanatics, while SA leaders see the Reichswehr as an institution led by \"reactionary pigheads\", according to SA-Stabschef Ernst Röhm.\n\nReichswehr leaders have been complaining about the Dual Command since the beginning of the civil war, and it has now come to a head. Reichswehr leaders have been meeting with Hitler himself to demand the integration of the SA into the Reichswehr and the end of the Dual Command. Although we do not need to take immediate action, if we do not make this concession, the Reichswehr has again threatened to end political support for our government."
 ger_civil_war.7.a:0 "We will commit to SA integration."
 ger_civil_war.7.b:0 "The situation shall remain as it is!"
 ger_civil_war.8.t:0 "National Socialism and the Church"
 ger_civil_war.8.d:0 "Though much of the National Socialist base have backgrounds in the Landeskirchen, German Lutheran, Calvinist, or Prussian Churches, many members of the Party Leadership show open disdain for Christianity and Christian practices, deeming it to be overly based in Judaic tradition. By contrast, the DNVP leadership often shows respect for the Churches, even if they themselves are not very religious, as they see Germany as a naturally (Protestant) Christian nation. They fear that the NSDAP might do away with what they see as a traditionalist and monarchist institution that they seek to defend. Ergo, the DNVP has demanded that we commit to the political autonomy of the German Churches."
 ger_civil_war.8.a:0 "A loyal Church is a useful tool. We shall respect the Churches for now."
 ger_civil_war.8.b:0 "All institutions must be brought into the sphere of National Socialism, without exceptions!"
 GER_GCW_open_harzburg_front:0 "§YThe Harzburg Front has §!§GSurvived and its path is now open in the Focus Tree.§!"
 GER_GCW_Stralsund:0 "Stralsund"
 GER_GCW_Ostmark:0 "Ostmark"
 GER_GCW_Rostock:0 "Rostock"
 ger_civil_war.9.t:0 "The [GER.GERGetRallyLocation] Rally"
 ger_civil_war.9.d:0 "At a ceremonial rally held by the NSDAP, DNVP, and the Reichswehr, Adolf Hitler - the Führer - laid out the agreed upon policy goals of the National Salvation Government. In short, these are:\n - The establishment of an ethnocentrist \"national community\" based on the Führerprinzip\n - The armament and expansion of the Reichswehr to be comparable to other European armies\n - The elimination of \"Judeo-Bolshevik\" influences in German life\n - The protection of German agriculture and manufacturing from foreign competition\n\nPresented to the thunderous roars of \"Heil!\", this plan marks a clear shift in the future of Germany. However, there is much still left to do..."
 ger_civil_war.9.a:0 "Long Live the Harzburg Front!"
 GER_GCW_seize_Hitler:0 "§YThe Company will try to seize Hitler by force!§!
 GER_GCW_arrest_Hitler:0 "§YThe Company will demand Hitler's surrender!§!
 ger_civil_war.10.t:0 "The [GER.GERGetRallyLocation] Incident"
 ger_civil_war.10.d:0 "At a meeting of NSDAP party elites in a beerhouse in Stralsund, Herrn Hitler, Goebbels, Röhm, and others were planning the future of the NSDAP and the Harzburg Front. Though the area had been cordoned off for their safety, curious onlookers could on occasion catch a glimpse of Hitler pacing about or railing against \"that pimple Hugenberg\". Hundreds, if not thousands, came to try and catch a glimpse of the Leader, but eventually interest waned, and the crowd began to disperse. At approximately 17:30, as the meeting continued, a Reichswehr Company, numbering about 120 soldiers, arrived at the beerhouse and surrounded it. Within their ranks, one could count 16 horsemen and an armored car. Though the Beerhouse's current patrons had noticed the Reichswehr movements, they were quickly informed that the Reichswehr had intercepted a potential threat to the Leader's life, and had operated alone to prevent the spread of information. Satisfied with this explanation, Hitler and his men continued to plot. At 18:15, they were distrubed by the Reichswehr once again."
 ger_civil_war.10.a:0 "The Soldiers came forward, disarming Hitler's Guards and arresting the Leader!"
 ger_civil_war.10.b:0 "The Major loudly announced: \"Herr Hitler, you are under arrest!\""
 GER_GCW_successful_coup_tt:0 "§YAdolf Hitler has been §!§GRemoved, the DNVP has taken power, and their path in the Focus Tree is now open.§!"
 GER_GCW_failed_coup_tt:0 "§YThe Putsch against Adolf Hitler has been §!§GFoiled, the Nazis have taken full power for themselves, and their path in the Focus Tree is now open.§!"
 ger_civil_war.11.t:0 "Aftermath of the [GER.GERGetRallyLocation] Incident"
 ger_civil_war.11.d:0 "Yesterday evening, Hitler’s meeting with other NSDAP elites came to a sudden end when they were detained by a Reichswehr deployment. The soldiers simultaneously restrained the National Socialist leaders with handcuffs, leg cuffs, and blindfolds, and disarmed Hitler’s SS and SA guards at gunpoint (one SS-man attempted to fight back, and was promptly shot). Once all targets were detained, a military truck arrived, in which Hitler and his cronies were unceremoniously packed into. The truck drove to a military camp outside of town, where they were placed in holding cells until the next morning. (The SA and SS guards, on the other hand, will be detained in a Stralsund constabulary for a while). Once dawn broke, Adolf Hitler, Rudolf Heß, Joseph Goebbels, Ernst Röhm, and Heinrich Himmler were tied up on posts, blindfolded, offered a last smoke, and executed by firing squad at 07:42.\n\nUpon receiving the news of Hitler’s death, Herr Hugenberg and General von Witzleben met with Hermann Göring, the most senior surviving member of the NSDAP, and Karl Ernst, the second-in-command of the SA. They were informed of the death of their colleagues (but were given very little explanation) and were promptly installed as the heads of the NSDAP and SA until further notice. At about 13:00, Herr Hugenberg gave a radio broadcast informing the public of Hitler’s death. He announced that a new cabinet would be formed from members of the DNVP and the Reichswehr. He also announced that the SS - at this point consisting of over fifty thousand men, would be disbanded. The German public - including the DNVP and the Reichswehr - privately rejoiced at the news. Many came to regard Hitler as a blowhard at best and a madman at worst, meaning that his removal from power has been celebrated across Germany, and indeed, the world."
 ger_civil_war.11.a:0 "Finally, the Lunatic is dead!"
 ger_civil_war.12.t:0 "A Putsch Foiled!"
 ger_civil_war.12.d:0 "Yesterday evening, Hitler’s meeting with other NSDAP elites was interrupted by a company of soldiers who demanded that Hitler and those with him willingly surrender to arrest, giving them fifteen minutes to agree. However, they did not count on the existence of a side door in the beer house, which opened up into the neighboring building. With the fifteen minute window, SA and SS guards were able to efficiently (if a bit clumsily) evacuate the Leader and his associates across a few buildings to the other side of the square, where a secondary vehicle was parked outside for security. Without any soldiers present, most were able to escape to an SA office a few towns over, where they were able to send a telegram to the [From.Capital.GetName] Gau office. Ernst Röhm, unable to keep up with the others, was successfully detained, and thus left behind.\n\nIn the middle of the night, SA and SS bands went across the streets of our Capital, attempting to arrest leading members of the DNVP and Reichswehr, known to have anti-Hitler sympathies, for their alleged complicity in the Putsch. Though most were taken quietly, a few high-ranking officers were killed in violent shootouts. Röhm soon was freed from detention as well. In a radio broadcast, Hitler described the attempt on his life, and decreed that the Harzburg Front was dissolved. All civil, military, and political organizations are to come under the jurisdiction of the National Socialist German Workers’ Party, meaning that Hitler is now the undisputed Leader of our nation!"
 ger_civil_war.12.a:0 "Long Live the National Revolution!"
 
 GCW_postwar_economic_destruction:0 "Postwar Economic Destruction"
 GCW_postwar_economic_destruction_desc:0 "Although the civil war has been won, our economy has been severely affected by all the fighting. Factories and destroyed, railways need to be urgently repaired, there are major food shortages everywhere, and millions of Germans have been left wounded, dead or without the ability to feed themselves. We need to rebuild Germany as soon as we can!"