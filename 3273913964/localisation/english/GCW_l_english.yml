 ddr_gcw.1.t: "Elections to the Volksrat"
 ddr_gcw.1.d: "Today marked the first elections to the People's Council. Voters lined up by the hundreds at each polling booth to cast their ballot for their preferred representatives from the socialist and left-liberal parties. In addition, Zentrumspartei candidates have been allowed to participate provided that they do not proclaim allegiance to the bourgeois Hindenburgite government.\n\nEven though the United Front parties have a tentative alliance, tensions were high in party campaign offices. Though KPD campaigners expect a plurality of votes, they have become increasingly concerned about the rising popularity of other United Front groups. The KPDO-SAPD combined ticket, formed early in the campaign, and the ever-present SPD ticket have provided alternatives to those uncomfortable with Marxism-Leninism. The KAPD, previously thought to be a group dying to splits and factionalism, has seen a small revival on a platform of extreme revolutionary attitudes; without connection to Soviet attitudes and rejecting the \"bureaucratism\" of the other parties.\n\nRegardless, the election is over, and the votes have been counted. All that remains is to announce the winner."
 ddr_gcw.1.a: "The KPD wins a strong plurality of votes!"
 ddr_gcw.1.b: "The KPD wins a plurality, but United Front parties also perform well."
 
 ddr_gcw.2.t: "Electing a Provisional President"
 ddr_gcw.2.d: "The Central Committee has chosen to invest executive power in a provisional President. They will be responsible for enforcing and promulgating legislation passed by the CC. Though we are unsure as to our preferred post-war method of electing the president, the provisional president will be elected from among the Central Committee members. The KPD delegation has put forth Wilhelm Pieck, a party veteran and present member of the party leadership. The KPDO and SAPD delegations have agreed on Max Seydewitz, an eager socialist, keen on reform. The Central Committee has voted, the votes have been counted, and the CC Chairman announced that the winner was..."
 ddr_gcw.2.a: "Pieck from the KPD delegation!" 
 ddr_gcw.2.b: "Seydewitz from the SAPD/KPDO delegation!"
 
 ddr_gcw.3.t: "The Religious Question"
 ddr_gcw.3.d: "Once of the key points of debate within the United Front is the treatment of religion in Germany. Though a large majority of Germans are religious to some degree, the KPD insists on a policy of State Atheism. The communists insist that religious institutions are bastions of reactionarism, and should be forcibly occupied by our police and military - and indeed, several have been already. However, other revolutionaries are less enthusiastic about such a policy. They worry that the promotion of atheism would see a strong backlash in public opinion. Instead, they say that we should leave the churches and synagogues alone, and worry more about the ongoing conflict. A third group has emerged to offer what they see as a compromise: the state can lightly promote atheism and denounce religious reactionarism, but also leave individual institutions alone. It is up to the Central Committee to vote on a decision."
 ddr_gcw.3.a: "The power of religion should be brought down entirely!"
 ddr_gcw.3.b: "We will denounce religious institutions as reactionary, but take no further action."
 ddr_gcw.3.c: "We will leave religious institutions alone at this time."
 
 ddr_gcw.4.t: "Relations with the German-Jewish Community"
 ddr_gcw.4.d: "In the years preceding the Second Revolution, we attempted to win over voters by a synthesis of nationalism and socialism. Though we are still committed to this idea, even the Party leadership has to admit that serious errors were made. This includes the Party's turn to anti-Semitic rhetoric, which has alienated German Jews, causing their underparticipation in the Communist Party. Though a significant proportion of younger Jews support the SAPD or KPDO,  the rest of the German-Jewish community is sympathetic to the centre-left or bourgeois \"left" parties, such as the DStP and the SPD. Therefore, the KPD leadership sees the need to amend relations with the German Jews as a matter of political dominance. Which way should we approach this problem?"
 ddr_gcw.4.a: "We will create a Jewish Section within the KPD." 
 ddr_gcw.4.b: "We will run special propaganda aimed at recruiting German Jews to the United Front."
 ddr_gcw.4.c: "We will publicly denounce and apologize for our actions." 
 ddr_gcw.4.e: "We will not take action at this time." 
 
 ddr_gcw.5.t: "Diplomatic Missions from the German Communists"
 ddr_gcw.5.d: "Since the beginning of the German Civil War, we have been conducting preliminary diplomatic operations in the socialist-controlled areas to gauge exactly how much we should be involved. Recently, however, we have received diplomats in Moscow asking us to specifically recognize their government and provide material aid to the Volksarmee. It is up to the Politburo to decide our course of action."
 ddr_gcw.5.a: "The German Communists urgently require our assistance!"
 ddr_gcw.5.b: "We should stay out of the conflict for the time being."
 
 DDR_SOV_recognition:0 "Recognized Us"
 DDR_SOV_recognition_rev:0 "Official Recognition"

 ddr_gcw.6.t: "Aid from the USSR."
 ddr_gcw.6.d: "The Soviet Union has responded to our requests with an official statement of recognition of our government. The news has made KPD and United Front members jubilant, with small celebrations across our entire territory. More crucially, the USSR has sent nearly two thousand kits of infantry equipment, forty-eight artillery pieces, sixty trucks, and twelve fighter planes. These are sure to help us completely conquer the counterrevolutionary compacts!"
 ddr_gcw.6.a: "Solidarity and Friendship!" 
 
 ddr_gcw.7.t: "The USSR refuses to Aid Us"
 ddr_gcw.7.d: "Our efforts to convince the USSR to publicly take our side have been for nothing: as Soviet diplomats hurriedly explained to our representatives in Moscow, supporting our side would risk provoking a military response from the western powers. We were assured that we can win the war on our own, but we cannot help but feel that their assurances lack sincerity."
 ddr_gcw.7.a: "So much for solidarity."
 
 ddr_gcw.8.t: "The Quota Debate"
 ddr_gcw.8.d: "As some people have noticed, a civil war is currently ravaging Germany, and it is a war that we intend to win. However, some insist that in order to win, we need to set stringent quotas for farmers and workers to ensure that the Volksarmee has enough supplies. Others assert that such measures will be unpopular and unproductive in the long-term, seeing as how such \"harvest taxes\" contributed to the 1921 Russian agricultural crisis. They instead argue for very low quotas, if any are to be established in the first place. The Central Committee has debated, and the issue has come to a vote."
 ddr_gcw.8.a: "We must establish strong quotas to supply our army."
 ddr_gcw.8.b: "We should establish quotas, but they should be minimal." 
 ddr_gcw.8.c: "We should not establish quotas at all."
 
 ddr_gcw.9.t: "The Searches"
 ddr_gcw.9.d: "The Young Communists came in the dawn, as was their way. The group of 20, armed with pistols, marched to the former nobleman's mansion, eagerly announced their arrival, and under the supervision of their Party Commissar, began their mission. They swept through the entire grounds, taking note of everything, from the lowliest garden equipment in the shed to the priceless 18th century furniture in the foyer. Every suit (German, French, and Italian), radio (four German, made in Dortmund; and two English, made in Manchester) and spoon (mostly German, with some imported Italian ware) were accounted for. All the nobleman could do is sit and watch.\n\nBy dusk, the search was complete, and the battalion was enjoying snacks and some cigarettes in the front yard. The Commissar conferred with the group's leader, and then went to speak with the nobleman. The nobleman and his family were to go to the local government office to be given new lodgings, and the mansion, the grounds, and most of the things in it) were now state property, to be used for a socially useful purpose. He was assured that he would get a pension (though he was only in his early fifties) and that he would be allowed to keep a small portion of his wealth, though this didn't comfort him as he was taken to the city centre..."
 ddr_gcw.9.a: "The Young Communists are Breaking the Monopoly on Wealth! Join Today!"

 ddr_gcw.10.t:0 "Allow Soldier Committees?"
 ddr_gcw.10.d:0 "This week, several reports coming from the Volksarmee leadership are complaining about the continued existance of soldier committees that argue against the decisions of their officers, and refuse to accept any kind of discipline. Thee most sensible course of action would be to disband those committees, but our propagandists warn about the implications of disbanding councils and enforcing a hierarchy. What should we do with this issue?"
 ddr_gcw.10.a:0 "Our officers must work with the committees"
 ddr_gcw.10.b:0 "Disband them at once!"
 
