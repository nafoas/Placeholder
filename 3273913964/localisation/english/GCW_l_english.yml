 wgr_civil_war.6.b:0 "The Revolution will triumph!"
 wgr_civil_war.7.b:0 "We must save the Fatherland!"
 
 gcw.1.t:0 "Reactionary Uprising!" 
 gcw.1.d:0 "After months of rising tensions, the monarchists have finally taken action and attempted a military coup against Adolf Hitler and the NSDAP. Thanks to our loyal soldiers and generals, this coup has failed everywhere except in Pomerania, where Ludwing Beck and Alfred Hugenberg have managed to gather their supporters, expel the NSDAP from the area, and proclaim a new \"National Government\". With this new enemy in our rear, we must quickly transfer troops from the main fronts in order to crush the petty reactionaries and secure the Führer's rule over the East, and eventually, the whole Germany!"
 gcw.1.a:0 "We must destroy this rebellion!"
 gcw_play_nazi_tt:0 "§YContinue to play as the NSDAP Government§!"
 gcw.1.b:0 "The Nazis must be crushed!"
 gcw_play_react_tt:0 "§YPlay as the Reactionary uprising§!"
 
 gcw_news.1.t:0 "The German Civil War"
 gcw_news.1.d:0 "To the surprise of nobody, the fragile situation in Germany has just taken a drastic turn for the worse, as both the ultranationalists of the NSDAP under Adolf Hitler, and the stalinists of the KPD under Ernst Thälmann have revolted against the Weimar Republic, proclaiming rival governments in Breslau and Essen, respectively. A country in crisis since its defeat in the Great War, the weak Republic was unable to deal with the Great Depression, along with the polarisation of the German society that led to an explosion of political violence and paramilitaries, with [WGR_chancellor]'s government, a last-ditch attempt to save the Republic, failing to stabilise Germany. \n\nAs the frontlines are drawn and the soldiers mobilize, the battle for Germany begins..."
 gcw_news.1.a:0 "For the German worker!"
 gcw_news.1.b:0 "For the German freedom!"
 gcw_news.1.c:0 "For the German nation!"
 gcw_news.1.e:0 "It was inevitable"
 
 gcw_news.2.t:0 "Nationalist Victory in Germany"
 gcw_news.2.d:0 "With the collapse of the last Republican and Communists holdouts, [GER.GetLeader] has announced to the whole world that the civil war in Germany is now over, as the country has been finally reunited under the Nationalist movement. \n\n[GER_gcw_end_status]."
 GER_is_nazi:0 "Hitler's victory has not been easy, as he had to face a coup attempt from the more reactionary and traditionalist sectors oh his initial coalition. After defeating the coup, Hitler has doubled down on National Socialist rethoric, and will likely continue his expansionist, militarist and racist policies now the whole of Germany is under his control."
 GER_is_dnvp:0 "Although initially led by Hitler, the Nationalists underwent a drastic change when the reactionaries and the Army ousted him in a coup, replacing him with Alfred Hugenberg, leader of the monarchist DNVP. Due to this, many expect a restoration of the German Hohenzollern monarchy, now that Germany is pacified."
 GER_no_change:0 "Hitler's government, an uneasy coalition of the NSDAP, the DNVP and the Reichswehr, has stood united during the entire war, but experts predict that it is very likely to dissolve in the coming months. In any case, the ultranationalist policies of this \"Harzburg Front\" will now be fully implemented, such as a German rearmament and the recovery of lost territories..."
 gcw_news.2.a:0 "Deutschland über alles!"
 gcw_news.2.b:0 "Heil dir im Siegerkranz!"
 gcw_news.2.c:0 "They were the strongest side after all"
 
 gcw_news.3.t:0 "Republican Victory in Germany"
 gcw_news.3.d:0 "With the surrendering of the last Nationalist and Communist holdouts, German Acting President [WGR.GetLeader] has announced that the civil war in Germany is finally over, as the Republican army is finally in control of the whole country. \n\nDespite being initially caught by surprise, the Republican government managed to restore order in its controlled territory and rebuild its army with Reichsbanner militias, that have proved crucial for their victory in the conflict. The Chancellor and his cabinet have now called an early Presidential Election, and the ruling coalition has already begun preparing some measures of economic relief in order to rebuild the destroyed country."
 gcw_news.3.a:0 "Einigkeit und Recht und Freiheit!"
 gcw_news.3.b:0 "That's good news!"
 gcw_news.3.c:0 "Capitalist rule is maintained with blood"
 gcw_news.3.e:0 "That was unexpected"
 
 gcw_news.4.t:0 "Communist Victory in Germany"
 gcw_news.4.d:0 "With the destruction of the last Republican and Nationalist holdouts, [DDR.GetLeader] has declared the German Civil War over, and the beggining of the peaceful construction of socialism in Germany. Parades with red flags and Soviet flags have been held in Germany's major cities to celebrate, with the \"Victory Parade\" being scheduled for tomorrow in Berlin. \n\nDespite being the weakest faction at the beggining of the civil war, the Communists and their allies have been able to overcome their enemies thanks to their superior industry and the decisive Soviet aid, along with several mistakes commited by their Nationalist and Republican rivals. Now the red flag flies from Köln to Sttetin, as the Revolution that failed in 1919 finally triumphed now."
 gcw_news.4.a:0 "Proletarier aller Länder, vereinigt Euch!"
 gcw_news.4.b:0 "A victory for the working class!"
 gcw_news.4.c:0 "The Revolution claims another nation..."
 gcw_news.4.e:0 "Bloody bolsheviks!"
 
 WGR_anti_commie_push:0 "Anti-Communist Push"
 WGR_republican_push:0 "Defense of the Republic"
 WGR_antifa_push:0 "Anti-Nationalist Push"
 GCW_civil_war_idea:0 "German Civil War"
 GCW_civil_war_idea_desc:0 "The time has come. Politics have failed, and now Germany must decide its destiny in the field of battle. Even though spilling our people's blood is tragic, we can't allow our enemies to take over our dear Fatherland: we shall fight to the last man!"
 DDR_german_revolution:0 "Die Deutsche Revolution"
 DDR_german_revolution_desc:0 "After being destroyed by the treacherous Social Fascists in 1919, the German Revolution is now back in full force. As the workers rise up to secure a better future under Socialism, our leadership reports problems with discipline and organization, that may spell doom for our cause if they are not fixed quickly."
 DDR_kpd_primacy:0 "KPD Primacy"
 DDR_kpd_primacy_desc:0 "Despite the large number of parties and unions that make up the Revolutionary Alliance, the KPD is clearly the main ruling party, with Chairman Thälmann leading the Revolution. However, the KPD's control over the Revolution is far from certain, and it could see its leadership contested or reasserted, depending on how the Revolution goes."
 GER_divided_army:0 "The Dual Command"
 GER_divided_army_desc:0 "There is a stark contrast between our more professional units, made up mostly of former Reichswehr men, and our SA militias, that can bring numbers, but not quality, to the table. Professional units and SA members will distrust each other until we manage to reform our army, or purge one of those halves altogether."
 GER_reactionary_plot:0 "The Harzburg Front"
 GER_reactionary_plot_desc:0 "With Hitler at the helm of the Nationalist movement, and the SA armed and more influential, many old-guard reactionaries are worried. Monarchist and Conservative Reactionaries are not entirely comfortable with the NSDAP's ostensibly revolutionary politics, and thus might seek to confront Hitler to demand certain concessions." 
 GER_reactionary_plot_removed:0 "The Harzburg Front"
 GCW_WGR_widespread_chaos:0 "Widespread Chaos"
 GCW_WGR_widespread_chaos_desc:0 "With the breakdown of the Republican order, chaos has engulfed Germany. Communists and Nationalists seem united and organized towards their goal, but our attempts to restore order in loyalist areas have been failed thus far. We'll need to reassert the Republic's authority in order to fight effectively."
 GCW_WGR_widespread_chaos1:0 "Widespread Chaos"
 GCW_WGR_widespread_chaos1_desc:0 "With the breakdown of the Republican order, chaos has engulfed Germany. Communists and Nationalists seem united and organized towards their goal, but our attempts to restore order in loyalist areas have been failed thus far. We'll need to reassert the Republic's authority in order to fight effectively."
