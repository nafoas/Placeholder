 DDR_kpd_leadership:0 "Asserted KPD Leadership"
 DDR_kpd_leadership_desc:0 "As the Revolution progresses, the KPD seems to be reinforcing their control over it. The other leftist parties remain in a subordinate position, and will continue as such unless they make a powerful move..."
 DDR_kpd_control:0 "Complete KPD Control"
 DDR_kpd_control_desc:0 "The KPD has managed to completely solidify its control over the Revolution, and the rule of the party is now without question. The fate of Germany is clear..."
 DDR_contested_leadership:0 "Contested Leadership"
 DDR_contested_leadership_desc:0 "As surprising as it may be, the KPD has seen its influence reduced as the SAPD-led Opposition attempts to take the throne. The winner of this struggle is unclear..."
 DDR_opposition_leadership:0 "Opposition Leadership"
 DDR_opposition_leadership_desc:0 "With the KPD leadership shattered, the so-called \"Opposition\", formed by basically every party other than the KPD, has taken the leadership of the Revolution. The KPD might still be a threat to their dominance though..."
 DDR_opposition_control:0 "Complete Opposition Control"
 DDR_opposition_control_desc:0 "The Opposition is now fully in control of the German Revolution, with the KPD threat completely defused. Disputes between the many parties that make up this coalition makes governance difficult however..."
 
 DDR_power_struggle:0 "The Power Struggle"
 DDR_power_struggle_desc:0 "As the Revolution progresses, leftwing organizations are waging their own political battle to decide who will rule Germany once the reactionaries are defeated. With the threat of a complete KPD takeover, being by far the largest party, the minor leftist parties have rallied together against them, forming the so-called \"Opposition\" to contest KPD dominance over the Revolution... \n\n§RCurrent KPD Dominance: [?DDR_kpd_power]%§!\n§YStrengthening or weakening the KPD's hold over the Revolution is needed to alter the KPD Primacy spirit. Changing this spirit is itself necessary to secure KPD rule after the war, or remove them from power altogether!§! \n\n\nUnited Front Unity is: [DDR_UF_Unity] \n§CLow Unity may have som unforseen consequences...§!"
 
