 DDR_limit_sapd_influence:0 "Limit SAPD Influence"
 DDR_remove_disloyal_ministers:0 "Remove Disloyal Ministers"
 DDR_decentralize_power:0 "Decentralize the Power Structure"
 DDR_remove_kpd_ministers:0 "Replace KPD Ministers"
 DDR_remove_thalmann:0 "Vote to Replace Thälmann"
 
 WGR_state_emergency:0 "A State of Emergency"
 WGR_state_emergency_desc:0 "Diplomacy has failed, and the current political climate is going to destroy the Republic unless something is done. With President Hindenburg's support, a State of Emergency shall be enacted, and the Chancellor shall rule by decree until the crisis is over."
 WGR_focus_communists:0 "Focus on the Communists"
 WGR_focus_communists_desc:0 "The Bolsheviks of the KPD and the other minor parties are a threat the German people, and their way of life. We must focus all of our efforts to weaken the communists, in case they are planning an uprising..."
 WGR_strengthen_our_position:0 "Strengthen our Own Position"
 WGR_strengthen_our_position_desc:0 "Focusing on the Nationalists or the Communists would just give the other side a carte blanche to overthrow the Republic. We must remain calm, and mobilize those Germans that still believe in the Republic, in order to prevent its collapse."
 WGR_focus_nationalists:0 "Focus on the Nationalists"
 WGR_focus_nationalists_desc:0 "The despicable National Socialists and their reactionary satellites have been trying to impose their totalitarian views since 1923. They are clearly the biggest threat to the Republic, and our efforts must focus on destroying this threat before they can organize an uprising!"
 WGR_crackdown_red_paramilitaries:0 "Eliminate Communist Paramilitaries"
 WGR_crackdown_red_paramilitaries_desc:0 "The Rotfront and the other communist paramilitaries are the most important threat to law and order. We must send in the police and the army in order to finally destroy their ability to operate, recruit and stockpile arms."
 WGR_crackdown_red_paramilitaries_tt:0 "§YThe number of starting militia divisions for the Communists is reduced by §!§G5§!"
 WGR_ban_kpd:0 "Ban the KPD"
 WGR_ban_kpd_desc:0 "The Communist Party can be rightly accused of plotting to overthrow the Republic, and surrender German sovereignty to Moscow. Combined with their violent activities, it should be enough to ban them."
 WGR_break_strikes:0 "Break the Strikes"
 WGR_break_strikes_desc:0 "Socialist strikers in the Rhineland are a threat to the economy, and might form the basis of the future Revolution unless we stop them now. Send in the Army and destroy the strikers!"
 WGR_break_strikes_tt:0 "§YThe number of starting offmap military factories for the Communists is reduced by §!§G3§!"
 WGR_anti_communist_militias:0 "Form Anti-Communist Militias"
 WGR_anti_communist_militias_desc:0 "The only way to curb the growing socialist influence is to inspirate an anti-communist sentiment in our population. That way, we'll be able to form some anti-communist paramilitary groups that will keep the Rotfront in check. They might not be entirely loyal to the Republic though..."
 WGR_anti_communist_militias_tt:0 "§GThe Republicans will gain 6 additional militia divisions once the war starts!§! \n§RThe Nationalists will gain 3 additional militia divisions once the war starts!§!"
 WGR_raid_commie_stockpiles:0 "Raid Communist Stockpiles"
 WGR_raid_commie_stockpiles_desc:0 "The Communists have been smuggling arms from the USSR, or at least that's what our intelligence reports. We should organize a big raid into their secret stockpiles in order to prevent their use in an insurrection."
 WGR_raid_commie_stockpiles_tt:0 "§YThe number of starting infantry equipment for the Communists is reduced by §!§G2000 \nThe Republicans will gain 1000 additional infantry equipment once the war starts!§!"
 WGR_cooperate_reichswehr:0 "Cooperate with the Reichswehr"
 WGR_cooperate_reichswehr_desc:0 "The Reichswehr is not very committed to the defense of the Republic, but they are very enthusiastic about our anti-communist crackdown. We must stop communists from infiltrating the Reichswehr, and then use it to kick the communists out of our lands!"
 WGR_cooperate_reichswehr_tt:0 "§YThe number of starting infantry divisions for the Communists is reduced by §!§G3§! \n§RThe Nationalists will gain 1 additional infantry division once the war starts!§!"
 WGR_secure_brandenburg:0 "Secure Brandenburg"
 WGR_secure_brandenburg_desc:0 "As the Communists seem decided to go through with their Revolution, we must prepare for the worst. Several intelligence reports warn us about the communist cells in Eastern and Southern Brandenburg, so we must send in Reichswehr to root them out and restore full control into those areas."
 WGR_secure_brandenburg_tt:0 "§GThe Republicans gain guaranteed control over all of §YBrandenburg§! when the civil war starts!§!"
 WGR_secure_thuringen:0 "Sweep Thüringen"
 WGR_secure_thuringen_desc:0 "Thüringen is a Communist bastion, and in the event of a Revolution, its position would allow the reds to easily cut our territory in half and sweep the South. We can't allow that, we must send in the Army to properly restore our control over the area."
 WGR_secure_thuringen_tt:0 "§GThe Republicans gain guaranteed control over all of §YThüringen§! when the civil war starts!§!"
 WGR_secure_mainz:0 "Into Mainz"
 WGR_secure_mainz_desc:0 "The main Communist stronghold is the Rhineland: with cities like Essen or Köln ready to join the Revolution. If we allow anti-communist militias to take positions in Mainz, we should be able to overwhelm the Communists in the Rhineland through a quick and decisive offensive, leaving them on the brink of defeat."
 WGR_secure_mainz_tt:0 "§GThe Republicans gain guaranteed control over all of §YMainz§! when the civil war starts!§!"
 WGR_strike_first_blow:0 "Strike the First Blow"
 WGR_strike_first_blow_desc:0 "The time has come. We must declare Martial Law and send in the Army to disband the Communist movement and arrest Thälmann and the other bolshevik leaders. If this moves them into Revolution, then so be it, we are ready!"
 WGR_strike_first_blow_tt:0 "§RThis will start the Civil War inmediately!§!"
 WGR_negotiate_union_leaders:0 "Negotiate with Union Leaders"
 WGR_negotiate_union_leaders_desc:0 "Unions and strikers have some legitimate concerns, and we can't afford a Revolution in the Rhineland anyway. We must appease the union leaders in order to make Communism less popular for the working class."
 WGR_negotiate_conservatives:0 "Negotiate with Conservatives"
 WGR_negotiate_conservatives_desc:0 "Negotiating with the DNVP moderates, and other independent conservatives, might force them to rethink their alliance with the NSDAP, hopefully preventing a full-on Nationalist uprising. We have nothing to lose here..."
 WGR_buy_time:0 "Buy Time"
 WGR_buy_time_desc:0 "Our intelligence reports are disheartening: our negotiating efforts will not prevent a civil war, but only delay it. We must prevent it from catching us off-guard, so we'll continue to pretend to negotiate with the radicals, while we secretly begin preparing for the war as well."
 WGR_secure_stockpiles:0 "Secure the Stockpiles"
 WGR_secure_stockpiles_desc:0 "Nationalist and Communist agents threaten our weapon stockpiles, seeking to arm their militias in preparation for the conflict. We'll need loyal men to secure those stockpiles, ensuring that they continue in our hands once the war begins."
 WGR_secure_stockpiles_tt:0 "§GThe Republicans will gain 1500 additional infantry equipment when the war starts!§!"
 WGR_arm_reichsbanner:0 "Arm the Reichsbanner"
 WGR_arm_reichsbanner_desc:0 "With our stockpiles secured, we must inmediately supply arms to the Reichsbanner Schwarz-Rot-Gold and other loyal organizations that can defend the Republican order. They'll be very useful if the Nationalists or the Communists attempt to take over..."
 WGR_arm_reichsbanner_tt:0 "§GThe Republicans will gain 3 additional militia units when the war starts!§! \n§YUnlock Preparation Decision: §CExpand the Reichsbanner§!, giving 3 additional militias each time.§!"
 WGR_secret_imports:0 "Secret Weapon Imports"
 WGR_secret_imports_desc:0 "Now that we have made sure that seditionists are not able to steal from our weapon stockpiles, we must begin to secretly import weapons to abroad, in preparation for the conflict. We can't trust German industries: the bosses would tip the Nationalists and the workers would do the same with the Communists..."
 WGR_secret_imports_tt:0 "§GThe Republicans will gain 800 additional infantry equipment when the war starts!§! \n§YUnlock Preparation Decision: §CSecret Arms Imports§!, giving 1200 additional equipment each time.§!"
 WGR_sway_industrialists:0 "Sway the Industrialists"
 WGR_sway_industrialists_desc:0 "Industrialists, worried about the rise of communism, are mostly siding with the Nationalists, and we can't allow that. We need some secret meetings with them, linking the Nationalist cause with a \"brown anti-capitalist Revolution\", and promising them that the Republic is the only guarantee to order and propiety. That will sway at least some of them..."
 WGR_sway_industrialists_tt:0 "§GThe Republicans will gain 2 additional offmap military factories when the war starts!§! \n§YUnlock Preparation Decision: §CSecret Business Meetings§!, giving 3 additional factories each time.§!"
 WGR_sway_military_leaders:0 "Secure Military Loyalty"
 WGR_sway_military_leaders_desc:0 "The Reichswehr is a hotbed of Nationalist activity, with some reports even hinting at some Communist infiltration as well! We need to make concessions to military leaders, while performing purges and inspections in order to ensure most of the military stays loyal to the Republic."
 WGR_sway_military_leaders_tt:0 "§GThe Republicans will gain 4 additional infantry divisions when the war starts!§! \n§YUnlock Preparation Decision: §CReichswehr Inspections§!, giving 1 additional infantry division each time.§!"
 WGR_republican_propaganda:0 "Republican Propaganda"
 WGR_republican_propaganda_desc:0 "The KPD and the NSDAP have been allowed to distribute their propaganda unopposed, turning our people against each other, and while we could shut them down, a more effective approach would be to counterattack. Our own propaganda push will make people realise that the Republic is the future!"
 WGR_plans_against_communists:0 "Prepare Loyalist Recruitment"
 WGR_plans_against_communists_desc:0 "With the Reichswehr loyalty in question, we must expect to rely on militias at the start of the coming conflict. We need to transfer arms stockpiles to loyal areas, and begin preparing recruitment so that our troops are ready at a moment's notice."
 WGR_plans_against_communists_tt:0 "§GThe Republicans will gain 5 additional militia units when the war starts!§!"
 WGR_plans_against_nationalists:0 "Fortify Loyalist Areas"
 WGR_plans_against_nationalists_desc:0 "Southern Germany and Berlin are Republican strongholds, and we must be ready to defend them. We can, for now, begin preparing some rudimentary fortifications across the Main and the Rhine, for example."
 WGR_plans_against_nationalists_tt:0 "§GWe will gain some forts along the Main and the Rhine once the war starts!§!"
 WGR_pull_trigger:0 "Brace for the Impact"
 WGR_pull_trigger_desc:0 "With the situation rapidly deteriorating, we must stand ready for the worst. Our preparations will continue in secret, until either the Communists or the Nationalists decide to act."
 WGR_pull_trigger_tt:0 "§GThe Republicans will gain defensive bonuses once the war starts!§!"
 WGR_ban_sa:0 "Ban the SA"
 WGR_ban_sa_desc:0 "The SA is the main source of political violence in Germany. Those bandits that roam our cities, terrorizing the honest Germans, were allowed to exist by Papen and Schleicher due to their ties with the Nazis, but now they must be banned for the preservation of the Republican order!"
 WGR_ban_sa_tt:0 "§YThe number of starting militia divisions for the Nationalists is reduced by §!§G5§!"
 WGR_disrupt_nsdap_speeches:0 "Disrupt NSDAP Rallies"
 WGR_disrupt_nsdap_speeches_desc:0 "We are not strong enough to ban the NSDAP, but we should limit their rallies and move to arrest their main orators, in order to stop their propaganda from deceiving the people. Hitler himself should be arrested, but that will probably end up in a massive bloodshed at the moment..."
 WGR_investigate_reichswehr:0 "Investigate the Reichswehr"
 WGR_investigate_reichswehr_desc:0 "The Reichswehr is a hotbed of Nationalist activity, and that can't be allowed. It is time to purge the Reichswehr and, if necessary, downsize it further to prevent a coup. If they stop being loyal, they will pay the consequences!"
 WGR_investigate_reichswehr_tt:0 "§YThe number of starting infantry divisions for the Nationalists is reduced by §!§G4§!"
 WGR_infiltrate_nationalists:0 "Infiltrate the Nationalist Leadership"
 WGR_infiltrate_nationalists_desc:0 "Nationalist politicians and military commanders are planning an uprising, possibly starting in Prussia and Pomerania and moving west into Berlin. If we want to precisely counter their plans, we need to infiltrate their leadership and get more intel!"
 WGR_infiltrate_nationalists_tt:0 "§YAttack bonuses for the Nationalists will last §G60§! less days.§! §CIf this number ends up negative, they'll receive a penalty instead!§!"
 WGR_nationalize_disloyal_industries:0 "Nationalize Disloyal Industries"
 WGR_nationalize_disloyal_industries_desc:0 "Industrialists are showing their lack of loyalty to the Republic by entering in secret talks with the Nationalists. Now that we still can, let's show them the strength of the Reich by nationalizing their industries, preventing the traitors from using them against us!"
 WGR_nationalize_disloyal_industries_tt:0 "§YThe number of starting offmap factories for the Nationalists is reduced by §!§G2§!"
 WGR_form_antifascist_militias:0 "Form Anti-Fascist Militias"
 WGR_form_antifascist_militias_desc:0 "The government has slowly realized that the civil war is unavoidable. If we want to prepare for it, promoting Anti-Fascist sentiment and recruiting anti-fascist militias will be a good idea to counter the Nationalist growth. It might have some unforseen consequences though..."
 WGR_form_antifascist_militias_tt:0 "§GThe Republicans will gain 4 additional militia divisions once the war starts!§! \n§RThe Communists will gain 4 additional militia divisions once the war starts!§!"
 WGR_secure_mecklenburg:0 "Secure Mecklenburg"
 WGR_secure_mecklenburg_desc:0 "Mecklenburg is the key that connects the Nationalist stronghold in Pomerania and Prussia with their militias in Holstein. We need to send in militias and loyal soldiers to stop the Nationalists from seizing Mecklenburg in the event of civil war."
 WGR_secure_mecklenburg_tt:0 "§GThe Republicans gain guaranteed control over §YMecklenburg§! when the civil war starts!§!"
 WGR_secure_silesia:0 "Recover Upper Silesia"
 WGR_secure_silesia_desc:0 "Upper Silesia holds thousands of angry militias that are rabidly opposed to Nationalist encroachment... Polish militias, to be more exact. It might be risky, but we could covertly support them, along with our own anti-fascist German militias. That should be enough to open up a front on the Nationalist rear."
 WGR_secure_silesia_tt:0 "§GThe Republicans gain guaranteed control over §YOberschlesien§! when the civil war starts!§!"
 WGR_secure_northwest:0 "Enforce Order in the Northwest"
 WGR_secure_northwest_desc:0 "The Northwest, specially the cities of Bremen and Meppen, are SA strongholds that can be a severe nuisance, if not a threat from the rear. We need to send in loyal militia and soldiers to clean up the area and ensure its loyalty to the Republic."
 WGR_secure_northwest_tt:0 "§GThe Republicans gain guaranteed control over §YBremen and Meppen§! when the civil war starts!§!"
 WGR_cross_oder:0 "Cross the Oder"
 WGR_cross_oder_desc:0 "The time has come. We shall order the Reichswehr to cross the Oder and destroy the Nationalist leadership in the east. And when they predictably rebel, our militias and loyal soldiers will be ready to finally purge fascism from Germany once and for all!"
 
 DDR_second_revolution:0 "Die Zweite Revolution"
 DDR_second_revolution_desc:0 "Fifteen years ago, the German workers and peasants nearly achieved emancipation from capitalist wage slavery. From the Kiel Mutiny to the Bavarian Soviet Republic, the flames of socialism nearly washed away reactionarism and imperialism, only to be put out by counterrevolutionary elements. It is time to right that wrong, and take what is ours."
 DDR_create_volksarmee:0 "Create the Deutsche Volksarmee"
 DDR_create_volksarmee_desc:0 "The German People's Army fights for socialism and national liberation against the capitalist and fascist Reichswehr. The Volksarmee will not practice the reactionary traditions of nobleman-officers and privileges for superiors; we will be like the Soviet Red Army instead!"
 DDR_confiscate_guns:0 "Confiscate Guns"
 DDR_confiscate_guns_desc:0 "In order to arm the Volksarmee, we need to confiscate weapons from the populace and any reactionary organizations. This will also allow us to disarm potential counterrevolutionary cells."
 DDR_ramp_up_recruitment:0 "Ramp up Recruitment"
 DDR_ramp_up_recruitment_desc:0 "In order to win the war, we need soldiers! We will thus expand our recruitment propaganda campaign, and institute heavier conscription."
 DDR_organize_chain_command:0 "Organize a Chain of Command"
 DDR_organize_chain_command_desc:0 "Despite the egalitarian nature of socialist ideology, we need to establish a clear chain of command in the Volksarmee. In such a crisis, we need to ensure that those giving orders know what they are doing."
 DDR_allow_soldier_committees:0 "Allow Soldier Committees?"
 DDR_allow_soldier_committees_desc:0 "Even though we intend to follow a hierarchical military structure, many in our government - and indeed the Volksarmee - believe that the soldiers should at least get some say in how things are run. To that end, they recommend the establishment of soldier committees, where representatives elected from the enlisted men will at least advise command on local conditions and address grievances."
 DDR_increase_discipline:0 "Enforce Discipline"
 DDR_increase_discipline_desc:0 "Looting and burning is an unacceptable practice for the People's Army. The idea that it is in any way allowed for a German Revolutionary to steal from the German people must be stamped out with extreme prejudice."
 DDR_professional_force:0 "A Professional Force"
 DDR_professional_force_desc:0 "Our army should be well-trained and professional. It might be smaller than using a massive militia, but our soldiers will be capable and disciplined."
 DDR_popular_force:0 "A Popular Force"
 DDR_popular_force_desc:0 "The basis of the Volksarmee should be on a large, but relatively untrained militia. Though we might not get the most capable soldiers, we will be able to overwhelm the enemy by numbers alone."
 DDR_focus_nationalists:0 "Focus on the Nationalists"
 DDR_focus_nationalists_desc:0 "Hitler and Hugenberg are a greater threat than the Republicans. We should focus a majority of our operations and propaganda against them. We are the only anti-fascist force in Germany, after all!"
 DDR_focus_republicans:0 "Focus on the Republicans"
 DDR_focus_republicans_desc:0 "Hitler and Hugenberg are on the ropes; it is the Republicans who most threaten the revolution at this moment. We should direct the majority of our propaganda and operations against them. We can't allow a repeat of 1918!"
 DDR_expand_interbrigaden:0 "Expand the Interbrigaden"
 DDR_expand_interbrigaden_desc:0 "There are more than Germans among our ranks. Sympathetic Spaniards, Americans, Britons, and Frenchmen have crossed the border and have created their own \"International Brigades\". We should formally allow for their expansion."
 DDR_form_armoured_brigade:0 "Form an Armoured Brigade"
 DDR_form_armoured_brigade_desc:0 "In order to break a hole in the frontlines we must establish the first armoured brigade of the Volksarmee."
 DDR_fix_supply_issues:0 "Fix Supply Issues"
 DDR_fix_supply_issues_desc:0 "We should focus attention on the various supply line issues affecting the Volksarmee. The soldiers need equipment and rations in order to fight, so this must take some priority."
 DDR_recruitment_propaganda:0 "Increase Recruitment Propaganda"
 DDR_recruitment_propaganda_desc:0 "In order to build a large militia, we need manpower. Therefore, we must engage in another round of propaganda to inspire the young proletarians of Germany to join the Volksarmee!"
 DDR_redirect_production:0 "Redirect Industrial Production"
 DDR_redirect_production_desc:0 "The power of the people will save us on the battlefields, but also in the factories. We need to use propaganda to convince the various unions and commitees to focus all their efforts into military production, without using more severe measures."
 DDR_rekindle_enthusiasm:0 "Rekindle Revolutionary Enthusiasm"
 DDR_rekindle_enthusiasm_desc:0 "The stresses of the war are causing the people's enthusiasm for the Revolution to wear thin. A round of revolutionary propaganda should mitigate this loss of momentum."
 DDR_adapt_tactics:0 "Adapt our Tactics"
 DDR_adapt_tactics_desc:0 "We have met the enemy in battle, and are familiar with their strategy. We should review our strategies and tactics to figure out a way to outmaneuver them."
 DDR_total_discipline:0 "Total Discipline"
 DDR_total_discipline_desc:0 "The Revolution demands total discipline from Revolutionaries great and small. We are in the middle of a conflict; this is no time to be dizzy with success."
 DDR_militarize_production:0 "Militarize War Production"
 DDR_militarize_production_desc:0 "We must manage the production of military equipment in a military manner. Our soldiers need a plentiful supply of quality weapons if they are to take down the reactionaries, so unions and commitees that disagree with the incresed quotas will be stamped out!"
 DDR_disband_militias:0 "Disband the Militias"
 DDR_disband_militias_desc:0 "As part of our commitment to a professional Volksarmee, we will disband the ragtag militias that formed at the start of the revolution, and give the militioners a chance to reintegrate into the Volksarmee proper."
 DDR_overhaul_tactics:0 "Overhaul our Strategies"
 DDR_overhaul_tactics_desc:0 "We have combat experience; we know our own shortcomings. We should reevaluate our maneuvers to account for our unique situation."
 DDR_abolish_bourgeois_parliaments:0 "Abolish Bourgeois Institutions"
 DDR_abolish_bourgeois_parliaments_desc:0 "Bourgeois parliaments are forever tainted with counterrevolutionary airs, and are thus unreformable. We will thus abolish local and regional assemblies in order to build them back from the ground up in a revolutionary manner."
 DDR_support_local_councils:0 "Support the Local Arbeiterräte"
 DDR_support_local_councils_desc:0 "In the chaos of the civil war, local workers', peasants', and soldiers' councils have been formed to manage municipal affairs. It would do us good to recognize and lend support to these revolutionary institutions."
 DDR_send_representatives:0 "Send our Representatives"
 DDR_send_representatives_desc:0 "Until the civil war is over and we can stabilize our affairs, we will send KPD officials to act as local government boards. Fellow members of the United Front may protest, but there is no denying that the KPD is far larger than the others, and is thus in the best place to manage local affairs."
 DDR_create_politburo:0 "Create the Politbüro des Zentralkomitees"
 DDR_create_politburo_desc:0 "The Political Bureau of the Central Committee is to be modeled on the Soviet Politbyuro. As an executive committee, it will be responsible for directing our revolutionary work, but is technically subordinate to the Central Committee. At this time, the Politbüro will consist of high-ranking members of United Front parties."
 DDR_chairman_thalmann:0 "Strengthen Chairman Thälmann"
 DDR_chairman_thalmann_desc:0 "Ernst Thälmann, the chairman of both the KPD and the Politbüro, requires additional powers to enable a speedy response to crises during the civil war. He should therefore be entrusted with additional capabilities in determining Party and State policy."
 DDR_democratic_centralism:0 "Follow Democratic Centralism"
 DDR_democratic_centralism_desc:0 "Democratic Centralism is a doctrine created by Lenin and used by the All-Union Communist Party in the USSR. The doctrine stipulates that all decisions made by a body of the party (by majority vote) is binding on the entire body, all bodies subordinate to it, and the entire party in general. Is by this method that the German Socialist Republic should be governed."
 DDR_elections_volksrat:0 "Elections to the Volksrat"
 DDR_elections_volksrat_desc:0 "We will hold a popular election to the People's Council, in which all United Front parties will be allowed to participate. The People's Council shall be our legislative organ, responsible for lawmaking. It is here where the decisions in our country shall be made."
 DDR_elect_president:0 "Elect a Provisional President"
 DDR_elect_president_desc:0 "Instead of vesting additional powers to the Chairman of the Politbüro, we should elect a provisional president among United Front leaders to promulgate laws, represent the Socialist Republic abroad, and respond in times of crisis."
 DDR_socialist_propaganda:0 "Intensify Propaganda Efforts"
 DDR_socialist_propaganda_desc:0 "In order to inspire the people to fight on our side and support our revolutionary cause, we need an intense propaganda campaign. Posters must be drawn and films must be made to promote the aims of the United Front!"
 DDR_womens_participation:0 "Ensure Women's Participation"
 DDR_womens_participation_desc:0 "We must endeavor to ensure that women are active in political life. The emancipation of the workers cannot be complete without the emancipation of women!"
 DDR_expand_youth:0 "Support Socialist Youth Organizations"
 DDR_expand_youth_desc:0 "We will not live under Communism, but our children will. Therefore, in order to encourage support for the Revolution among younger people, we will provide support for Socialist Youth Organizations. They will disseminate Party directives, news, and remind people to be vigilant for counterrevolutionary sabotage."
 DDR_support_kpd:0 "Guarantee KPD Primacy"
 DDR_support_kpd_desc:0 "As we repeatedly assert, the KPD is the only party in Germany that truly represents the workers. The KPDO, KAPD, SAPD, and SPD are, at best, petty bourgeois organizations designed to divide the German working classes, sell out the country, and defend the old order. Thus, the KPD should take the lead in redirecting these parties' efforts."
 DDR_united_front_gcw:0 "A United Front"
 DDR_united_front_gcw_desc:0 "Even though the KPD is the revolutionary vanguard that will inevitably lead Germany to national and social liberation, we cannot win alone. For the time being, we must unconditionally support the German United Front so that capitalism, royalism, and fascism are crushed by the workers' power!"
 DDR_declare_republic:0 "Declare the Socialist Republic"
 DDR_declare_republic_desc:0 "Berlin is ours, and the war is being won. We can now declare the founding of the German Socialist Republic! The Eagle and the Swastika will fall, and, from the Ruhr to Silesia, the Hammer and Sickle will rise!"
 DDR_arrest_nazis:0 "Hunt Down NSDAP Sympathizers"
 DDR_arrest_nazis_desc:0 "First and foremost, we have to hunt down Hitlerist sympathizers to prevent the continuation of fascist banditry and thuggery in Germany. We will thus move against mid and high level members of the NSDAP."
 DDR_disband_counterrevolutionary:0 "Dissolve Reactionary Organizations"
 DDR_disband_counterrevolutionary_desc:0 "Organizations that promote reactionary aims, whether military, civil, or social in nature, should be prohibited and forcibly dissolved. We cannot risk allowing these organizations to grow into counterrevolutionary cells."
 DDR_focus_army:0 "Focus on the Volksarmee"
 DDR_focus_army_desc:0 "Though internal vigilance is important, we do not have the manpower to focus on fighting our internal enemies while the fascists and capitalists are trying to beat down our door. Available resources should primarily go to the army."
 DDR_focus_rote_garde:0 "Create the Rote Garde"
 DDR_focus_rote_garde_desc:0 "The Red Guards will be the Defenders of the Revolution on the home front. They will be responsible for ensuring that internal counterrevolutionary activity is prevented, thus preventing capitalism from taking back its roots in Germany."
 DDR_religious_question:0 "Our Policy Towards Religion"
 DDR_religious_question_desc:0 "Although many United Front supporters profess atheism or irreligion, we do not have a concrete policy towards religion in Germany. Though some promote state atheism on the grounds that religious institutions are counterrevolutionary, others promote secularism in order to appeal to a broader base of support. Therefore, we must figure out our policies towards the various religions in the country."
 DDR_jewish_relations:0 "Amend Jewish Relations"
 DDR_jewish_relations_desc:0 "In the last several years, KPD policy and rhetoric has become increasingly nationalistic. This has come to include some semi-official endorsement of anti-semitic attitudes, which caused a split in the party in the late 1920's. If we are to appeal to German Jews, we have to review our policies towards their status in society."
 DDR_arrest_royalists:0 "Move Against the Royalists"
 DDR_arrest_royalists_desc:0 "Much like the national socialists, leading monarchists in Germany should be found and arrested in order to prevent them from engaging in reactionary activity. In addition, now-former nobles should be either arrested or watched closely for the same reason."
 DDR_take_down_imperial:0 "Destroy Imperial Symbols"
 DDR_take_down_imperial_desc:0 "Imperial statues and symbols in Germany should be taken down and eventually replaced with modern, revolutionary, and socialist iconography."
 DDR_nationalize_large_estates:0 "Nationalize Large Estates"
 DDR_nationalize_large_estates_desc:0 "The large farming estates of Germany's elite should be nationalized without haste. The peasants suffer with their humble plots while the noblemen and the rich keep their feudalistic territories to themselves. This must be rectified!"
 DDR_redistribute_land:0 "Land Redistribution"
 DDR_redistribute_land_desc:0 "We will redistribute nationalized farmland to the German smallholders. This will enable them to grow larger crops, and thus see greater profits. It will encourage equality between farmers, rather than concentrate wealth in the hands of the elite."
 DDR_collective_management:0 "Collective Management"
 DDR_collective_management_desc:0 "Workers in nationalized industries will manage themselves cooperatively rather than rely on state bureaucrats. We will also encourage cooperative management in the private sector, in order to transform the German economy into a worker-owned system."
 DDR_expropiate_heavy_industry:0 "Expropiate Heavy Industry"
 DDR_expropiate_heavy_industry_desc:0 "Privately-held heavy industry will be nationalized by the state and used for socially and politically useful purposes. This will involve the development of public works to provide employment and the construction of military facilities for the civil war. Through expropriation, we will deal a heavy blow to monopoly capitalism!"
 DDR_nationalize_banks:0 "Nationalize the Banks"
 DDR_nationalize_banks_desc:0 "The banking system, the nest of parasitic capitalism, will be placed entirely under state control. We will put an end to the system of predatory lending, as the banks will become non-profit institutions."
 DDR_bureaucratic_management:0 "Bureaucratic Management"
 DDR_bureaucratic_management_desc:0 "Workers in nationalized industries will be managed by the government bureaucracy. This can ensure that production targets are being met without interruption. This will enable us to construct socialism in Germany from the ashes of capitalism!"
 DDR_contact_ussr:0 "Contact the USSR"
 DDR_contact_ussr_desc:0 "We should establish official contacts with the USSR, our erstwhile ideological ally. Official recognition from the USSR should give us more legitimacy in the eyes of the world, and enable us to officially receive aid from the Red Army."
 DDR_expand_soviet_aid:0 "Expand Soviet Aid"
 DDR_expand_soviet_aid_desc:0 "Though the Soviet Union may be sending us some aid already, we should work to officially expand the funneling of arms and volunteers to our borders. The civil war must be won, and Moscow, as an ally of the World Proletariat, has a duty to aid us!"
 DDR_enforce_red_union:0 "Enforce Red Union Primacy"
 DDR_enforce_red_union_desc:0 "The Catholic, Nationalist, and the so-called \"Free\" trade unions cannot be trusted. The DGB, DHV, ADGB, and the FAUD must be pressured into merging with the KPD trade union, the Revolutionäre Gewerkschafts-Opposition."
 DDR_ban_trade_unions:0 "Ban Unsympathetic Trade Unions"
 DDR_ban_trade_unions_desc:0 "Trade unions whose members are unsympathetic to socialist ideology -- such as the Catholic Deutscher Gewerkschaftsbund or the far-right Deutschnationale Handlungsgehilfen-Verband -- should be prohibited in order to prevent infiltration by counterrevolutionary elements."
 DDR_quota_debate:0 "The Quota Debate"
 DDR_quota_debate_desc:0 "Though the needs of the civil war are great, several in the United Front leadership are apprehensive towards the idea of agricultural and production quotas. They argue that establishing stringent quotas puts extra - and unsocialistic - pressure on the workers. This debate has stalled the increase in military production that others feel is necessary. A final vote should be held to solve the issue."
 DDR_dethrone_elites:0 "Dethrone the Elites"
 DDR_dethrone_elites_desc:0 "The wealthy of our nation have had their land redistributed and their factories nationalized. Now, it is time to go after their exorbitant wealth. Young Communists will go from mansion-to-mansion and door-to-door to search and seize the bourgeois' luxuries!"
 DDR_monopoly_trade:0 "Establish a Monopoly on Trade"
 DDR_monopoly_trade_desc:0 "Even if we tentatively allow Petty Bourgeois merchants to continue their business, we cannot allow them to sell out the nation and the workers. Therefore, external trade will become the sole prerogative of the State."
 DDR_nationalize_utilities:0 "Nationalize Utilities"
 DDR_nationalize_utilities_desc:0 "Electricity, Natural Gas, and Water distribution will be entirely nationalized and managed by the state. Ergo, these utilities will be provided to our people free of charge."
 DDR_strict_rationing:0 "Strict Rationing"
 DDR_strict_rationing_desc:0 "The needs of the civil war continue to hammer away at our people. However, the military needs food and resources, or else the war will be lost. Therefore, we should impose more strict rationing for the time being."
 DDR_military_railways:0 "Military-Controlled Railways"
 DDR_military_railways_desc:0 "We will grant the military full control over railways for the time being. This will ensure that our troops and their equipment get full priority."
 
 wgr_gcw.1.t:0 "Hindenburg is dead!"
 wgr_gcw.1.d:0 "With the entire country collapsing in civil war, President Paul von Hindenburg's situation was complicated. With his health rapidly declining, his friends and allies defecting to the Nationalists, and disgusted by the explosion of revolutionary violence, Hindenburg had remain secluded in his new office in Stuttgart, after the government forcefully moved him out of Berlin. Today, one of his aides has reported his death, presumably from severe stress that caused a heart attack. \n\nDespite some conservatives in the DVP being saddened by his death, the bulk of the remaining loyalist parties are somewhat relieved, fearing that Hindenburg's ties with the Nationalists could have threatened the integrity of the Republic. However, the question of who should become the new Head of State now arises. Hindenburg's expected successor as per the Constitutional Amendment of December 1932, Erwin Bumke, has betrayed the Republic and joined the Nationalists. With little clue about what to do next, Chancellor [WGR_chancellor] has decided to invoke Article 51 of the Constitution, and will assume the functions of Head of State until the Reichstag can pass a law clarifying the matter."
 wgr_gcw.1.a:0 "Rest in Peace"
 
 wgr_gcw.2.t:0 "The SPD's Proposal"
 wgr_gcw.2.d:0 "With the NSDAP out of the Reichstag, the SPD is now, once again, the largest political party in the Republic. With the death of Hindenburg and the defection of many reactionary Reichswehr officers, the SPD sees this war as an opportunity to install true republicanism in Germany, without needing alliances with the far-right like in 1918. In order to archieve so, and as the largest party in the Reichstag, Otto Wels has proposed Chancellor [WGR_chancellor] the reformation of the Weimar Coalition (SPD-DStP-Zentrum) under their leadership. This would exclude the DVP, which the SPD distrusts, but perhaps this sort of government can archieve the popular mobilization we need to win this war. Should we accept this?"
 wgr_gcw.2.a:0 "For a new Weimarer Koalition!"
 wgr_gcw.2.b:0 "We have to refuse"
 
 wgr_gcw.3.t:0 "The Vacant Presidency"
 wgr_gcw.3.d:0 "Following article 51 of the Constitution, the Reichstag is now debating what to do with the vacant Presidency. Leaders of all parties have agreed to officially pass a law granting the powers and duties of the Reichspräsident to someone until the war is won and elections can be held, without officially making him President. The Chancellor has defended his continuation as the functional Head of State and Government, arguing that a strong leadership is needed during this times of war. On the other hand, several SPD members have proposed Paul Löbe, the President of the Reichstag after Göring joined the rebellion, as the new provisional Head of State. Some DVP members have argued that the Constitution does not allow the President to be a member of the Reichstag, while the defenders of Löbe say that he wouldn't be President, just acting as such. As the debate progressed, the option to simply appoint a prominent politician from our coalition began gaining more and more ground..."
 wgr_gcw.3.a:0 "The Reichskanzler shall continue as provisional Head of State!"
 wgr_gcw.3.b:0 "Paul Löbe is our man!"
 wgr_gcw.3.c:0 "Compromise with the DStP: Pick Dietrich!"
 wgr_gcw.3.e:0 "Compromise with the Zentrum: Pick Adenauer!"
 wgr_gcw.3.f:0 "Compromise with the DVP: Pick Dingeldy!"
 
 wgr_gcw.4.t:0 "Republican Germany asks for help!"
 wgr_gcw.4.d:0 "In a desperate move, the conservative Republican government of Germany has officially asked our government for support in their struggle against the communists and the fascists. While the strength of the pacifist movement makes the cabinet reluctant, the people generally support Republican Germany, and sending them some planes and equipment wouldn't hurt."
 wgr_gcw.4.a:0 "We shall send help"
 wgr_gcw.4.b:0 "We can't support them, sorry"
 
 wgr_gcw.5.t:0 "Britain sends help!"
 wgr_gcw.5.d:0 "The United Kingdom has answered our call, and hundreds of planes, guns and other equipment are arriving to our ports. While they have refused to send further shipments, this one is big enough as it is, so we can be satisfied with our diplomatic efforts."
 wgr_gcw.5.a:0 "We must be thankful!"
 
 wgr_gcw.6.t:0 "Britain refuses to send help"
 wgr_gcw.6.d:0 "Fearing the pacifist movement, the British cowards have refused to send us any help. They don't know that if we fall to fascism or communism, they are next..."
 wgr_gcw.6.a:0 "Bastards"
 
 WGR_defense_republic:0 "Die Verteidigung der Republik"
 WGR_defense_republic_desc:0 "The time has come. We must defend the Republic and its ideals of freedom and equality with our lives if necessary. This is Germany's darkest hour, but with our determination, we shall be victorious!"
 WGR_order_mobilization:0 "Order a General Mobilization"
 WGR_order_mobilization_desc:0 "We must mobilize all men and women that still believe in the Republic, either to be conscripted or to produce guns for our forces. The people of Germany will save it once more!"
 WGR_emergency_powers:0 "Emergency Powers"
 WGR_emergency_powers_desc:0 "In these times of civil war, petty political discussions have no place. We must pass a law in the Reichstag that grants the Reichskanzler emergency powers \"as long as a state of civil war exists between the German Reich and any rebel group\". We must be careful, to avoid any possible loopholes..."
 WGR_convene_reichstag:0 "Reconvene the Reichstag"
 WGR_convene_reichstag_desc:0 "Many members of the Reichstag have joined the rebels, fled, or have been arrested or executed. We must reassemble those deputies that remain alive and free, and restart the Parliamentary process properly."
 WGR_weimar_coalition:0 "The Weimar Coalition"
 WGR_weimar_coalition_desc:0 "Like in 1919, the Republic will only be saved by a Grand Coalition of those parties that are fully committed to republicanism: the SPD, the DStP (successors of the DDP) and the Zentrum. Together, under the leadership of Reichstkanzler Otto Wels, the Republic will prevail!"
 WGR_bourgeois_bloc:0 "The Bourgeois Bloc"
 WGR_bourgeois_bloc_desc:0 "With communists in open rebellion, the marxists of the SPD can't be trusted. We must form a coalition of those parties that believe in capitalism and liberalism: the DVP, the Zentrum and the DStP. Together we'll be able to defeat the fascists and the communists, and defend our ideals of order and freedom!"
 WGR_restore_order:0 "Restore Order"
 WGR_restore_order_desc:0 "The rebellion of the Reichswehr and many police forces has left the country in chaos, as militias and criminals run rampant. We must restore some semblance of order to our controlled territory if we are going to win this war."
 WGR_centralize_police:0 "Centralize the Police Forces"
 WGR_centralize_police_desc:0 "We must transfer control of the regional police forces from the Länder to the Reichskanzler and his cabinet. This way, we'll be able to coordinate our forces and restore order way more effectively. The Länder will protest, though; so we have to have some assurances ready."
 WGR_dissolve_committees:0 "Dissolve Soldier Committees"
 WGR_dissolve_committees_desc:0 "In an outburst of Republican enthusiasm, many Reichsbanner militias have formed soldier committees in a similar way to the socialists. This cannot stand: we must disband all committees and enforce the proper military hierarchy."
 WGR_communist_crackdown:0 "Go After the Communists"
 WGR_communist_crackdown_desc:0 "Communist sympathizers and militias still pose a threat to our stability. We need to get rid of them in order to ensure order is maintained, either through arrests or other... extreme methods."
 WGR_rightist_crackdown:0 "Crackdown on the Nationalists"
 WGR_rightist_crackdown_desc:0 "Nationalist sympathizers are still infiltrated in our government and in the army. We must use our police forces to investigate, arrest and execute any potential Nationalist threat that comes from our very own government."
 WGR_reorganize_judiciary:0 "Reorganize the Judiciary"
 WGR_reorganize_judiciary_desc:0 "With many high-ranking judges joining the Nationalists, and the breakdown of order during the first weeks of the war, our judiciary is in shambles. We need to restore it quickly, and in the meantime, popular courts will speed up the trials of reactionary and bolshevik traitors."
 WGR_align_unions:0 "Align Loyal Unions"
 WGR_align_unions_desc:0 "Unions loyal to the Zentrum and the SPD must be incorporated into the government, rallying the workers to our cause and helping us fight communist propaganda here and abroad."
 WGR_limit_unions:0 "Limit Union Activity"
 WGR_limit_unions_desc:0 "Communist infiltration within labor unions, even in those with ties with the SPD or the Zentrum, is too big to be ignored. We must limit their activity to ensure discipline in the workplace, combatting nationalist propaganda in the process."
 WGR_deal_schleicher_clique:0 "Move Against Military Cliques"
 WGR_deal_schleicher_clique_desc:0 "Formed Chancellor Kurt von Schleicher and his military clique have remained loyal to the Republic due to their intense hatred of Hitler, but they are by no means committed to the Republicans ideals. We could get rid of them for good, or incorporate them into the fight in order to undermine the Nationalist cause."
 WGR_not_italy:0 "Deutschland ist Nicht Italien!"
 WGR_not_italy_desc:0 "The world has been expecting Germany to follow Italy and fall to fascism since 1930, but we shall show them what a true German stands for. Germany is not Italy! Germany will never fall to fascism!"
 WGR_arm_people:0 "Distribute Arms to the People"
 WGR_arm_people_desc:0 "One of the first measures to be approved by the new government will be the distribution of arms to the people. The war has shown us that the old professional army has failed us, so we will need the force of the German people to defend the Republic!"
 WGR_arm_people_tt:0 "§G6 Militia Divisions will be recruited!§!"
 WGR_reinvigorated_propaganda:0 "Reinvigorated Propaganda"
 WGR_reinvigorated_propaganda_desc:0 "For more than a decade, the German people has been apathetic to the ideal of the Republic. We need to launch a propaganda campaign to mobilize the people against fascism, communism and monarchism, rallying the nation under the black-red-gold flag!"
 WGR_volkskrieg:0 "Kämpfe für die Republik!"
 WGR_volkskrieg_desc:0 "Fight for the Republic! Fight for equality and freedom! Fight against Stalin's and Mussolini's puppets that want to subjugate Germany!"
 WGR_expand_reichsbanner_cw:0 "Expand the Reichsbanner"
 WGR_expand_reichsbanner_cw_desc:0 "The Reichsbanner Schwarz-Rot-Gold has been the backbone of our armies, and will continue to be under the new government. Recruitment will be expanded, arms will be distributed, and militiamen will be properly trained, in order to gradually replace or absorb the Reichswehr."
 WGR_organize_volunteers:0 "Organize International Volunteers"
 WGR_organize_volunteers_desc:0 "Groups of volunteers from all across the world have come to fight alongside the German people in their struggle against bolshevism and specially fascism. We need to properly organize them so that they can be deployed in battle."
 WGR_organize_volunteers_tt:0 "§G4 Militia Divisions will be recruited!§!"
 WGR_sideline_reichswehr_leaders:0 "Sideline Old Reichswehr Leaders"
 WGR_sideline_reichswehr_leaders_desc:0 "Those Reichswehr leaders that lacked the guts to join the fascists still remain a potential fifth column that could sabotage our war efforts. We need to gradually sideline them in favor of militia leaders, whose loyalty is out of question."
 WGR_seize_civilian_planes:0 "Seize Civilian Planes"
 WGR_seize_civilian_planes_desc:0 "In times of emergency, dire measures are needed. Acting President [WGR.GetLeader] shall sign a decree ordering the seizure of all planes used by civilians, be it by particulars, sport organizations, airlines or postal services; and their incorporation into the war effort if possible."
 WGR_enlist_intellectuals:0 "Enlist the Intellectuals"
 WGR_enlist_intellectuals_desc:0 "German intellectuals, or at least those who haven't joined the Communists, should be incorporated into the war effort, employing them to make propaganda and support our cause abroad."
 WGR_emergency_nationalizations:0 "Emergency Nationalizations"
 WGR_emergency_nationalizations_desc:0 "All assets owned by companies with proven or suspected loyalties to either rebel faction shall be seized and nationalized immediately. The economic war effort will probably benefit from this measure."
 WGR_streamline_arms_prod:0 "Streamline Arms Production"
 WGR_streamline_arms_prod_desc:0 "We can't destroy the rebels if our men lack guns and artillery; so we need to properly streamline their production with propaganda and technical innovations."
 WGR_mobilize_german_worker:0 "Mobilize the German Worker"
 WGR_mobilize_german_worker_desc:0 "In order to wage a \"Popular War\", the workers shall be mobilized, not only to fight in the frontlines but also to stay in their factories and increase their efforts to produce as much as they possible can. With the people united in this effort, the Republic will endure!"
 WGR_secret_gun_imports:0 "Intensify Arms Imports"
 WGR_secret_gun_imports_desc:0 "Arms imports from Western countries began with the war, but now we need to place larger orders and commit more funds in order to increase our arms input."
 WGR_international_antifa_call:0 "International Call Against Fascism"
 WGR_international_antifa_call_desc:0 "Let us contact the most influential newspapers, radio stations and trade unions worldwide in order to call for help against the fascists. Every good person who truly hates fascism needs to know that we count on their help."
 WGR_secure_agrarian_production:0 "Expand Agrarian Production"
 WGR_secure_agrarian_production_desc:0 "If we want to sustain the war effort, we need to feed our armies; so we sould probably do something about agrarian committees and centralize agrarian production in order to better control its output."
 WGR_wartime_planning:0 "Wartime Economic Planning"
 WGR_wartime_planning_desc:0 "In times like this, private initiative cannot be placed above the survival of the Republic. Most aspects of the economy shall be directly controlled by the government, or be placed under strict oversight, in order to ensure that we are using all our resources to beat the rebels!"
 WGR_deal_spd:0 "Deal with the SPD"
 WGR_deal_spd_desc:0 "Despite our refusal to form a SPD-led cabinet, we need to cooperate with the SPD in some capacity. They are very popular with our workers and our soldiers, after all."
 WGR_concessions_bvp:0 "Concessions to the BVP"
 WGR_concessions_bvp_desc:0 "The Bavarian People's Party is now the last significant right-wing force that remains outside our coalition (and the Nationalists). We shall integrate them into the government in order to increase our support in Bavaria."
 WGR_kriegskoalition:0 "Formalize the Kriegskoalition"
 WGR_kriegskoalition_desc:0 "The War Coalition of the DStP, the DVP, the Zentrum and the BVP will stand strong against fascists and communists, preserving order and stability within the framework of the Republic."
 WGR_not_russia:0 "Deutschland ist nicht Russland!"
 WGR_not_russia_desc:0 "Despite the growth of the bolshevik threat, we will show the world that Germany is not Russia, that Germany will stay free of red influence, that Germany will remain proud and strong!"
 WGR_disband_unruly_militias:0 "Disband Unruly Militias"
 WGR_disband_unruly_militias_desc:0 "Unruly and undisciplined Reichsbanner militias that refuse to follow orders will be immediately disbanded. We need to restore some semblance of professionalism and discipline to the army if we want to win."
 WGR_strict_professionalism:0 "Strict Army Professionalism"
 WGR_strict_professionalism_desc:0 "Our soldiers need to know that the Republic won't allow anything other than strict discipline and professionalism. Gone aree the days of chaotic militias, as the Reichswehr is rebuilt!"
 WGR_contacts_britain:0 "Contacts with Britain"
 WGR_contacts_britain_desc:0 "British conservatives must be horrified with the violence displayed by the fascists and the communists. If we can convince His Majesty's Governemnt that our victory will guarantee order and stability, we should be able to get more aid from them."
 WGR_cooperate_reichswehr_leaders:0 "Cooperate with Reichswehr Leaders"
 WGR_cooperate_reichswehr_leaders_desc:0 "Those Reichswehr commanders that remained loyal to the Republic are far more skilled than the militia commanders that have arised during the war. They shall be given good positions in the new army, in order to fully use their skill."
 WGR_support_church:0 "Support from the Church"
 WGR_support_church_desc:0 "The Catholic Church should be hostile to the reds, as well as to the Nazis and the radically protestant DNVP. The Zentrum will lead a diplomatic initiative to get the support of the Church, rallying catholics to our cause."
 WGR_cooperate_loyal_companies:0 "Cooperate with Loyal Companies"
 WGR_cooperate_loyal_companies_desc:0 "Many companies have committed treason and joined Hitler, but others have remained loyal, and cooperation with the private sector is essential to win this war. Let us reach out to those companies, then."
 WGR_strengthen_military_sector:0 "Strengthen the Military Sector"
 WGR_strengthen_military_sector_desc:0 "The military sector has been specially inclined to join the Nationalists, but cooperating to expand those companies that remained loyal can get us an increase in military production."
 WGR_fix_railways:0 "Repair the Railways"
 WGR_fix_railways_desc:0 "The war and the fighting have left the railway network utterly destroyed. If we want supplies to reach the frontlines and important urban centers, we need to repair it at once."
 WGR_militarized_production:0 "Militarized Production"
 WGR_militarized_production_desc:0 "Unions and committees that slow down production must be stamped out. The Reichswehr will take over the factories and impose strict discipline, until the war is won."
 WGR_kriegsproduktionsburo:0 "Create the Kriegsproduktionsbüro"
 WGR_kriegsproduktionsburo_desc:0 "The Office of War Production will serve as a proper organ to coordinate economic efforts between the Reich government and the armament companies. We need to win the war together!"
 WGR_integrated_war_effort:0 "An Integrated War Effort"
 WGR_integrated_war_effort_desc:0 "The government, the workers, the Reichswehr and the loyal private companies are coming together to defeat both threats to freedom and order, in an integrated war effort that has managed to overcome all difficulties!"
 WGR_coordinating_reichswehr:0 "Coordinate with the Reichswehr"
 WGR_coordinating_reichswehr_desc:0 "The Reichswehr is not only a professional army, but also an organization that has been secretly rearming for years by themselves. We should use their expertise to ramp up our military production."
 
 GER_recruitment_propaganda: "Recruitment Propaganda"
