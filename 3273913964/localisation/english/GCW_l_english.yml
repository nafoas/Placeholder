 DDR_german_revolution2:0 "Die Deutsche Revolution"
 DDR_german_revolution2_desc:0 "After being destroyed by the treacherous Social Fascists in 1919, the German Revolution is now back in full force. As the workers rise up to secure a better future under Socialism, our leadership reports problems with discipline and organization, that may spell doom for our cause if they are not fixed quickly."
 DDR_german_revolution_pop:0 "Die Deutsche Revolution"
 DDR_german_revolution_pf:0 "Die Deutsche Revolution"
 DDR_redirected_prod:0 "Redirected Production"
 DDR_milit_prod:0 "Militarized Production"
 DDR_anti_nat:0 "Anti-Nationalist Focus"
 DDR_anti_rep:0 "Anti-Republican Focus"
 DDR_enhaced_supply:0 "Enhaced Supply"
