l_english:
 old_guard:0 "Old Guard"
 old_guard_desc:0 "This leader is a veteran with many years of military service. However, this has caused him to become rooted in older ways of war."
 caring_leader:0 "Caring Leader"
 caring_leader_desc:0 "This leader is known to care for their soldiers, and has built up an honest rapport with them."
 brilliant_strategist:0 "Offensive Strategist"
 brilliant_strategist_desc:0 "This officer is gifted in planning offensives. One of the best leaders our country has ever known, they will be remembered for their skill."
 inflexible_strategist:0 "Defensive Strategist"
 inflexible_strategist_desc:0 "This officer is gifted in planning defensives. One of the best leaders our country has ever known, they will be remembered for their skill."
 politically_connected:0 "Politically Connected"
 politically_connected_desc:0 "This leader has cultivated extensive connections among the political leadership."
 war_hero:0 "War Hero"
 war_hero_desc:0 "A veteran decorated for their actions in combat, this leader is well respected among the rank-and-file."
 career_officer:0 "Career Officer"
 career_officer_desc:0 "This officer is a veteran with many years of military service under their belt."
 trait_cautious:0 "Cautious"
 trait_cautious_desc:0 "This leader is very cautious and does not like to engage in offensive manuevers."
 trait_reckless:0 "Reckless"
 trait_reckless_desc:0 "This officer often engages in reckless offensives, even if it puts their own life at risk."
 media_personality:0 "Media Personality"
 media_personality_desc:0 "Always needing to be in the spotlight, this leader is as concerned with their own image as they are with military matters."
 harsh_leader:0 "Harsh Leader"
 harsh_leader_desc:0 "Always demanding discipline, this leader's command grates on the soldiers. However, they can get results."
 bearer_of_artillery:0 "Bearer of Artillery"
 bearer_of_artillery_desc:0 "This leader has experience in using artillery pieces and commanding artillery units."
 infantry_officer:0 "Infantry Officer"
 infantry_officer_desc:0 "This leader is experienced in commanding infantry units."
 cavalry_officer:0 "Cavalry Officer"
 cavalry_officer_desc:0 "This officer is experienced in commanding cavalry units."
 armor_officer:0 "Armour Officer"
 armor_officer_desc:0 "This leader is experienced in commanding armoured units."
 cannot_promote:0 "Cannot Promote"
 cannot_promote_desc:0 "This General cannot be promoted to a higher rank (for gameplay reasons)."
 decided_planner:0 "Stubborn Planner"
 decided_planner_desc:0 "Though this leader can draw up plans very quickly, they are usually not very good."

