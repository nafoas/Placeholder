 POL_market_liberalism_party:0 "SN"
 POL_market_liberalism_party_long:0 "Stronnictwo Narodowe\n\n§gAfter a long preparatory period, Stronnictwo Narodowe (National Party) was founded on October 7, 1928. \n\nHowever, this did not mean the realization of the OWP's demands, as the SN was in fact a continuation of the liquidated ZLN. The anti-Sanationist group from the conservative-nationalist Christian National Party also joined the new party.\n\nAlthough there were a few OWP activists in the leadership of the SN, they were in the minority. There was a clear affiliation of the OWP with the SN, but in 1929 - after discussions - the OWP's field of activity was basically narrowed to youth and workers' circles.§"
