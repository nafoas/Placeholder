 POL_neutrality_party:0 "BBWR"
 POL_neutrality_party_long:0 "Bezpartyjny Blok Współpracy z Rządem\n\n§gThe BBWR (Nonpartisan Bloc for Cooperation with the Government) was formed in 1927 during the pre-election period for legislative bodies.\n\nThe BBWR Parliamentary Club (in the Sejm and Senate 1928 - 30) included deputies and senators representing, in addition to the most diverse spheres of society, the following political groupings:\n\nNational Right Party (Stronnictwo Prawicy Narodowej),\n\nChristian-Agricultural Party (Chrześcijańskie Stronnictwo Rolnicze),\n\nConservative Organization of State Labor (Organizacja Zachowawcza Pracy Państwowej),\n\nCatholic People's Party (Stronnictwo Katolicko Ludowe),\n\nUnion of the Middle Class(Zjednoczenie Stanu Średniego),\n\nLabor Party (Partia Pracy),\n\nUnion for the Repairment of Republic (Związek Naprawy Rzeczypospolitej).\n\nAfter the 1930 elections, the BBWR club also included representatives of the Peasant Union and the National Labor Party (NPR-Left).\n\nIn general, these groups do not carry out any major independent action in the field, and their activists mainly work within the BBWR; this should also explain the widespread phenomenon that all political groups, which found themselves on the political plane of the Bloc, do not show much organizational vitality.\n\nTherein lies the "strength" of the bloc, which, based on such moral foundations and trusting in the ideological guidance of Marshal Pilsudski, who is the "personification of the independence deed from the period of captivity", a person whom even the greatest enemies cannot accuse of being "guided by personal considerations", can boldly carry out its tasks, disregarding the opinion of those who "can only find common ground for "demolishing and undermining the State." \n\nThe BBWR was conceived as a superior organization for those organized or politically unorganized groups of society that set the welfare of the state as their highest goal and are prepared to pursue it through harmonious cooperation with the factors that govern it. Such a formulation of the position by the initiators of the concept of the bloc is justified by the fact that in the present day, in a strongly expanded society, the role of each social group undoubtedly reflects on the fate of the state, and the disharmony prevailing among them with a complete acquaintance with the interests of the state as a whole and the lack of coordination between society and the government can be dangerous to the existence of any state organism, and even more so to Poland in its first years after regaining independence.\n\nThe Non-Partisan Bloc for Cooperation with the Government therefore sets for itself, as a primary task, to shift the role of the citizen in the State from passive and defensive to active and cooperative. The Bloc accomplishes this task by gathering in its ranks individuals, distinguished among their surroundings by an active attitude to public life, individuals capable of bringing new positive values into this life.§"
 POL_monarchism_party:0 "BBWR"
 POL_monarchism_party_long:0 "Bezpartyjny Blok Współpracy z Rządem"
 POL_nationalism_party:0 "OWP"
 POL_nationalism_party_long:0 "Obóz Wielkiej Polski\n\n§gOn December 4, 1926, Obóz Wielkiej Polski (Camp of Great Poland) was founded, in a sense against the ZLN (People's National Union), but on the initiative of the party's activists gathered around Dmowski.\n\nThe task of the OWP was to transform the ideological and tactical assumptions of the nationalist movement and realize the replacement of the ZLN with a new political party. The OWP was to play only a preparatory role, working among members and sympathizers of the ZLN and in other circles. The future nationalist party was imagined not as a simple extension of the ZLN, but as a consolidation of the entire right, including groups in other parties gravitating toward nationalism.\n\nThe OWP's ideological declaration was concise and rather vague. It operated with nationalist phraseology, addressing it to all of Polish society. The OWP considered itself an organizer of the conscious forces of the nation, leading it toward greatness in domestic and international relations. Faith, civilization and statehood were considered the basis of national life.\n\n It demanded for the Roman Catholic religion the position of the ruling religion, demanded a close relationship between the Church and the state, and based the education of youth on the principles of the Roman Catholic religion. At the same time, the principle of freedom of conscience was accepted, but with reservations regarding the duty to defend religion from attack and to defend the nation from actions sowing decay in religious life. Polish civilization was to be characterized by devotion to tradition, a sense of duty to the nation, a sense of hierarchy and discipline, moral discipline, and the struggle against factors that decay or weaken the nation.\n\nA strong statehood was demanded in the name of securing external interests, the assurance of labor tranquility and the freedom to shape its conditions, the defense of youth from depravity, the fight against lawlessness, the suppression of anarchy.§"
 POL_fascism_party:0 "OWP"
 POL_fascism_party_long:0 "Ruch Młodych Obozu Wielkiej Polski\n\n§gIn 1927, Ruch Młodych OWP (Youth Movement of the OWP) was separated, with the Executive Department at the head.\n\nThe Youth Movement soon formed a nationwide organization, maintaining the division into units that was in force throughout the OWP.\n\nThe leadership instances were the youth divisions at all levels. Autonomous worker-craft sections were formed in the OWP, which also came under the influence of the Youth Movement.\n\nAfter the organizational separation of the Youth Movement, it turned out that the so-called 'Old Nationalists' did exercise leadership, but they were only a small minority in the OWP.\n\nIn 1931, the autonomy of the Youth Movement was abolished. This meant, in practice, giving the entire OWP the character that the Youth Movement had previously had.§"
 
