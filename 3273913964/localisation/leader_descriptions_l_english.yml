 POLITICS_Walter_Harold_Covert_DESC:0 "(September 13, 1865 – May 13, 1949). Walter Covert was the 16th governor of Nova Scotia. He was a corporate lawyer and a member of the Conservative Party."
 POLITICS_MOHAMMED_ZAHIR_SHAH_DESC:0 "(16 October 1914 – 23 July 2007). The New King of Afghanistan after the assasination of his father, this 19 year old monarch has to govern this rural and backwards country, while protecting its independance from its neighbors."
 POLITICS_HUEY_LONG_DESC:0 "A Democrat and an outspoken populist, Long denounced the wealthy elites and the banks. Initially a supporter of Franklin D. Roosevelt during his first 100 days in office, Long eventually came to believe that Roosevelt's "New Deal" policies did not do enough to alleviate the issues of the poor. In time, he developed his own solution; the "Share Our Wealth" program, which would establish a net asset tax, the earnings of which would be redistributed so as to curb the poverty and homelessness epidemic nationwide during the Great Depression."
 POLITICS_FRANKLIN_DELANO_ROOSEVELT_DESC:0 "In spite of being unable to walk unaided, Roosevelt returned to public office by winning election as Governor of New York in 1928. He was in office from 1929 to 1933 and served as a reform Governor, promoting programs to combat the economic crisis besetting the United States at the time. In the 1932 presidential election, Roosevelt defeated Republican President Herbert Hoover in a landslide. Roosevelt took office while the United States was in the midst of the Great Depression, the worst economic crisis in the country's history."
 POLITICS_FUAD_DESC:0 "Fuad I came to the throne of Egypt and Sudan in 1917 after the death of his brother Hussein Kamel, and in the first years of his rule saw the 1919 Egyptian Revolution, official ending of the British Empire’s protectorate over Egypt, and the transition from a Sultanate to a Kingdom. Throughout his rule he has worked against the British-imposed constitution, which he suspended in 1930, and granted himself extensive royal powers to diminish the role of the democratically elected parliament. Fuad has also been a large sponsor of organisations like the Egyptian Geographic Society, and was instrumental in the foundation of Cairo University and the Royal Archives of Egypt."
 POLITICS_FAROUK_DESC:0 "Farouk I, known by his subjects as “Al Malik Al Mahbub” or “The Beloved King” is the youngest King of Egypt in modern times, ascending to the throne at only 16 years old. He has had a rebellious and mischievous personality since he was a child and still continues to act with the same naivety and self-centredness as he always has, and constantly spends the government’s money on lavish shopping sprees in Europe, fast cars, and other extravagances. His carefree nature has also caused problems for the government, as he frequently embarrasses both himself and them with his various antics."
 POLITICS_ABELARDO_RODRIGUEZ_DESC:0 "Abelardo Rodriguez, a soldier during the Mexican Revolution, he rose to prominence during the interwar period inside the PNR, and after a quick debate in the aftermath of Ortiz Rubio's resignation, he was chosen as the new Mexican President. While at heart a social democrat, he is unable to implement all his planned policies because of the influence of the Jefe Maximo. As 1933 dawns he is finally ready to start ruling his country, ¡Viva México! "
 POLITICS_JOSE_VASCONCELOS_DESC:0 "José Vasconcelos a popular intellectual figure in México, leaded the PNAR during its last days, and always proved to be a flexible and, honorable man, willing to take the stands necessary to help México and, while he is seen as an extremist by some and, inconsistent by others, there is no question that he is a very popular figure."
 POLITICS_HERNAN_LABORDE_DESC:0 "Leader of the ¨Partido Comunista Mexicano¨ the activist, Hernan Laborde who has fought since 1924 for workers´ rights, fighting for better conditions in a union, while his ideas have been seen as radical or extremist he is seen as the face of mexican communism and, if he play his hands right he might become the first communist leader in the Americas"
 POLITICS_ADALBERTO_TEJADA_DESC:0 "Leading the ¨Partidos Socialistas de Izquierda¨ Adalberto Tejada a revolutionary and an anti-clerical activist Adalberto is seen as a radical revolutionary that wants to reduce church influence, and expand the governments power, while some of his policies are moderate, it remains to be seen if he is a socialist or, a much more radical revolutionary"
 POLITICS_ANTONIO_VILLAREAL_DESC:0 "A revolutionary and, a commander Antonio Villareal had a interesting life, fighting for what he thought was right even if he lost, like his participation in the rebellion of Adolfo de la Huerta but, that doesn´t mean he has given up and now he will run to be elected in the next election with the ¨Confederacion Revolucionaria de Partidos Independientes¨ his future unclear now."
 POLITICS_LUIS_MORONES_DESC:0 "Luis N. Morones had an interesting political carrier, while his party the ¨Partido Laborista Mexicano¨ was the biggest party in the 1920´s, he himself never leaded the country and, his party collapsed after he was accused of using Obregon´s death to his advantaged and, now he has a difficult trail to go but, if he succeds México will be reborn as the democratic country so many died to create"
 POLITICS_LAZARO_CARDENAS_DESC:0 "A Leader in the revolution Lazaro Cardenas has proven to be a devout follower of the principles of the revolution, willing to do what is necessary for his country, and while he has proven his loyalty to Calles for a while, it is obvious that they have different ideas, and that Cardenas wishes to get rid of the schackles of the Maximato."
 POLITICS_MANUEL_TREVINO_DESC:0 "Manuel Treviño leader of the ¨Partido Nacional Revolucionario¨ was an artillery officer in wartime and while he is seen as the most experienced politician in México because of his work as leader of the party he is not the main candidate, but with the right decision that can soon change, Manuel may soon be sitting in the President´s Chair."
 POLITICS_JESUS_GUIZAR_DESC:0 "A rabid and, devout catholic Jesús Degollado Guízar joined the Cristero war against the atheist government of Plutarco E. Calles and, while he himslef survived the war many if his brothers in arms didn´t and, he was forced to continue a less violent ¨Segunda Cristiada¨mostly by himself and, other leaders, while they are still popular the Cristero Remnants will need a miracle to defeat the government"
