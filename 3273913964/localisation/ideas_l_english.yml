 SPR_agrarian_problem:0 "The Agrarian Problem"
 SPR_agrarian_problem_desc:0 "Spain is still an agrarian country, although its conditions vary greatly depending on the region. While in the north, land properties tend to be small, in the south (Andalusia and Extremadura, mainly), most of the land is owned by big landowners and worked, usually below its capacity, by the jornaleros, often with miserable conditions. \n\nTensions in the southern countryside have been going up since the late 19th Century, but now that the Republic has tried to redistribute the land, with the landowners throwing thousands of people into unemployment in protest, the region has been turned into a bomb waiting to explode..."
