 GER_support_nationalists:0 "Support Nationalist Spain"
 GER_support_nationalists_desc:0 "The war in Spain is an excellent opportunity to test our weaponry, to display our power to the world, and hopefully to secure Spain as an ally in the future. The straits of Gibraltar and the Spanish tungsten are very tempting targets, but first we must ensure [SPA.GetLeader] wins the war!"
 GER_create_hisma:0 "Create HISMA"
 GER_create_hisma_desc:0 "We need to carry the Army of Africa across the straits of Gibraltar. The Spanish-Moroccan Transport Society is a good initiative to do so, and must be created now!"
 GER_operation_feuerzauber:0 "Operation Feuerzauber"
 GER_operation_feuerzauber_desc:0 "The Operation Feuerzauber ( Magic Fire ) will send the Spanish Nationalists the equipment they need to continue their rebellion."
 GER_condor_legion:0 "Condor Legion"
 GER_condor_legion_desc:0 "The Condor Legion shall be our main unit in Spain. It will be formed by our best fighters, bombers and pilots, and it will ensure Nationalist air superiority for the duration of the war."
 GER_condor_legion_expand:0 "Expand the Condor Legion"
 GER_condor_legion_expand_desc:0 "The Condor Legion is doing an admirable job in Spain, and they will do an even better one if their ranks are bolstered!"
 GER_send_tanks:0 "Send Tanks to Spain"
 GER_send_tanks_desc:0 "The Reds lack strong anti-tank guns. We can use that to our advantage if we ensure that the Nationalists have a strong Armored Division."
 GER_send_artillery:0 "Send Artillery to Spain"
 GER_send_artillery_desc:0 "Normal artillery, but also anti-tank and anti-air guns, must be sent to the Spanish Nationalists to strengthen their resolve."
 GER_learn_from_scw_tanks:0 "Lessons from the War: Armor"
 GER_learn_from_scw_tanks_desc:0 "Our fighting in Spain is being very useful, as we are learning lots of things about tanks and armor."
 GER_learn_from_scw_plane:0 "Lessons from the War: Air"
 GER_learn_from_scw_plane_desc:0 "Our fighting in Spain is being very useful, as we are learning lots of things about air warfare."
 condor_sent:0 "Has sent the Condor Legion"
 
