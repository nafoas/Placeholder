 #Tangier International Zone
 tangier_protocol_idea:0 "The Tangier Protocol"
 tangier_protocol_idea_desc:0 "Since the end of the 19th century, Tangier's geographic location made it a cockpit of European diplomatic and commercial rivalry in Morocco. This conbined with the fact that the seat of every foreign delegation in Morocco was in Tangier made the city an international issue.\nThus, to prevent any posible conflicts (like the 1st Moroccan Crisis) the representatives of Spain, France and the United Kingdom signed in 1923 an agreement establishing the city of Tangiers as an international zone. Later the governments of Italy, Portugal, the Netherlands and Belgium adhered to the convention in 1928.\nThe Zone has its own appointed International Legislative Assembly, which is subject to supervision by a Committee of Control composed of the career consuls of the participating powers. In addition to legislating its own laws, the zone has a special tariff regime, a mixed court of justice and its own police."
 tangier_refugee_paradise:0 "The Multicolor City"
 tangier_refugee_paradise_desc:0 "The Creation the International Zone has promoted the formation of a cosmopolitan society where Muslims, Christians and Jews live together with reciprocal respect and tolerance.\nIn addition, Tangier has also become a refugee heaven where men and women with many different political and ideological tendencies find refuge. Including Spaniards from the right or the left, Moroccan dissidents, Jews and Homosexuals. Many of the latter have been able to live an openly \"out\" life in the Zone.\n\nAs a result, the International Zone has earned a reputation for diversity, tolerance and bohemianism; which has made it a tourist hotspot for famous writers and actors."
 tangier_protocol_is_active_tt:0 "§RThe Tangier Protocol has been abandoned§! £trigger_no"
 
