 #Tibet
 
 TIB_ancient_regime:0 "Ancient Regime"
 TIB_ancient_regime_desc:0 "Little has changed in Tibet for hundreds of years in terms of the economy and general populace; serfs, peasants, chiefdoms, holy warriors, powerful landowning aristocrats, etc are everywhere without radios, cars, modern equipment or any contact with the rest of the world outside cities. The country is also plagued by issues like corruption, banditry, nepotism and poor communication, and is very decentralised as a notable portion of the population are actually under quasi-independent chiefdoms, lordships and monasteries outside much direct control from the central government. Things taken for granted elsewhere in the world like schools, scientists and specialists are almost nonexistent even in the capital as basic education is given only to monks and the wealthy. The only advantage of this is that the population has low political consciousness and as a result no political parties exist and no one questions the ancient theocratic system of government."
 TIB_precarious_independence:0 "Precarious Independence"
 TIB_precarious_independence_desc:0 "As the main Chinese Government claims sovereignty over all of the widest extent of geographical China, including Tibet, countries which recognise the Republic of China therefore cannot also have relations with Tibet in most cases. Additionally, because of our shaky independence from China there is a looming threat that the Chinese may try to reassert control over Tibet once again in the future if they manage to deal with the threats of Japan, Warlordism and the Communists. The UK and some of its Himalayan dependencies like Nepal and Sikkim are the only countries to have consistent contact and relations with us, and are our main lifeline for importing weapons and machinery from the West. As a result of this, there is only minimal contact, trade, news, etc from the rest of the world, and there is almost no innovation in technology unless traded to us by the British."
 TIB_dysfunctional_army:0 "Dysfunctional Army"
 TIB_dysfunctional_army_desc:0 "Following a series of intrigues and incidents in the 20s, the parliamentary religious faction defeated the modernist pro-British military faction under the Dalai Lama’s ex-protege Tsarong, forcing the Dalai Lama to slash funding and demote most of its officers involved in the military conspiracy. After being forced to betray his close friend and ally, the Dalai Lama has become increasingly jaded and reactionary, and is no longer the youthful, westernising moderniser he once was. Since this incident the ruling monastic elite has intentionally kept a weakened army to prevent a military faction ever challenging them again.Today the status of Tibet’s army can be accurately summed up by the statement of Commander-in-Chief Cangra: “The Tibetan Government has absolutely no idea of military organization, administration or training. The military authorities, even if they had the knowledge, have no power to apply it. The troops are untrained, unreliable, and unpopular with the country. The Tibetan Official hierarchy are quite indiscriminately pitchforked into civil or military jobs regardless of their qualifications. In fact, it is justifiable to say that, except for the fact that they possess a certain number of modern weapons, which few of them know how to use, the army has advanced but little from its condition in 1904.” This is only a few of the problems with Tibet’s army"; troops are banned from ever firing their weapons outside combat even while training, there are no machine guns at all in the country, troops are scattered and isolated all over the country and lack regional commanders, the nation’s entire supply of ammunition is kept locked in one room which can only be opened by the presence of the Lonchen (Prime Minister), the Military Commander-in-Chief, and the entire Kashag (Parliament). Many active soldiers wear ragged uniforms and have to beg or steal to get by. Troops are spread incredibly thinly across the border and could be easily broken through and destroyed by a determined enemy."

 
 #China
 
 CHI_the_chinese_civil_war:0 "The Chinese Civil War"
 CHI_the_chinese_civil_war_desc:0 "Ever since the 1927 Shanghai Massacre, the Communist Party of China has been in open opposition to the Kuomintang's rule over China and have sought to overthrow them using guerilla tactics and sabotage. The prevailing conflict has been within a series of 'Encirclement Campaigns' launched by the Nationalist Government, although they have not as of yet succeeded in halting the ongoing conflict."
 CHI_japanese_threat:0 "Japanese Threat"
 CHI_japanese_threat_desc:0 "In recent years Japan has shown increasing interest in explotation and conquest of China in order to fuel their nation's desperation for national resources and land. This expansionist ambition was most notably manifested in the Mukden Incident of 1931, leading to Japan's total subjugation of Manchuria and establishment of a collaborationist government de jure led by former Qing Emperor Puyi."
 CHI_incompetent_military:0 "Incompetent Military"
 CHI_incompetent_military_desc:0 "The National Revolutionary Army is largely corrupt, inexperienced and underequipped, and has a huge lack of tanks, artillery, ships or planes. Its' only strength lies in the large manpower of the nation, although the army is such an unpopular career that new recruits are often violently forced by other soldiers to join and keep recruitment levels high."
 CHI_nanjing_decade:0 "Nanjing Decade"
 CHI_nanjing_decade_desc:0 "Beginning with the success of Chiang Kai-Shek's 1927 Northern Expedition, the economy of China has generally seen a period of prosperity and increased confidence in the nation's stability as a whole. In this time there has been huge leaps forward in infrastructure, education and industrial growth."
 CHI_economic_difficulties:0 "Economic Diffuculties"
 CHI_economic_difficulties_desc:0 "Although China has seen many great leaps forward economically and industrially in recent years, ultimately corruption and incompetence are still endemic to the nation. This has been worsened by the Great Depression starting in 1929, which hurt our largely-agrarian economy very badly as crop prices fell significantly."

