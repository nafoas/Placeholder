 SPR_inefficient_military:0 "Inefficient Military"
 SPR_inefficient_military_desc:0 "For decades, the Spanish Army has lagged behind in both leadership, morale and equipment, more fit to suppress its own population than to fight other countries. The various defeats in Morocco and the tensions between the Africanistas and the Junteros has seemingly been out to rest by Primo de Rivera's 1923 coup. But the disproportionate number of officers, the outdated equipment and the old military organization still remain. \n\nEven though Azaña has tried to solve these issues during his tenure as War Minister, offering retirement to lots of officers and creating the División Orgánica, the Spanish Army will need further reform; without provoking the officers into a coup, that is."
 SPR_inefficient_military2:0 "Inefficient Military"
 SPR_inefficient_military2_desc:0 "For decades, the Spanish Army has lagged behind in both leadership, morale and equipment, more fit to suppress its own population than to fight other countries. The various defeats in Morocco and the tensions between the Africanistas and the Junteros has seemingly been out to rest by Primo de Rivera's 1923 coup. But the disproportionate number of officers, the outdated equipment and the old military organization still remain. \n\nEven though Azaña has tried to solve these issues during his tenure as War Minister, offering retirement to lots of officers and creating the División Orgánica, the Spanish Army will need further reform; without provoking the officers into a coup, that is."
 SPR_backwards_economy0:0 "Backwards Economy"
 SPR_backwards_economy0_desc:0 "Spain is not a very industrialized country, as the primary sector of the economy makes up most of the output and takes up most of the workforce. Our weak industry, based mainly around the Catalan textile sector and Basque steel, is sustained through a protectionist trade policy that has been in effect for almost a century. \n\nEven though these policies led us to being relatively unaffected by the Great Depression, we still need to further industrialize our country and reduce our reliance on agriculture. This can be accomplished through either public works or further liberalization."
