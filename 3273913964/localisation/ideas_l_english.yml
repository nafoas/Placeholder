 spain_new_imperialism:0 "The New Spanish Empire"
 spain_new_imperialism_desc:0 "Four hundred years ago we began building one of the biggest empires the world has ever seen. The glory of Spain was unmatched, only petty disputes and betrayals made us lose what we had archieved. Luckily for Spain, a new government has taken over, a new government that won't hesitate in building the empire Spain deserves: in Africa and in Europe! Viva España!"
