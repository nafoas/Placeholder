 illiterate_population:0 "Illiterate Population"
 illiterate_population_desc:0 "The vast majority of our people can't even read or write. Unless we start to focus in providing education for our population, our research and innovation potential will be much lower than other nations'."
 illiterate_population2:0 "Illiterate Population"
 illiterate_population2_desc:0 "The majority of our people can't even read or write. Unless we start to focus in providing education for our population, our research and innovation potential will be much lower than other nations'."
 SA_illiterate_population:0 "Literacy problem"
 SA_illiterate_population_desc:0 "A considerable amount of our population is poor, and thus lacks access to proper basic education wich makes them illiterate. Unless we start focusin in providing a better access to education, our research and innovation potential will be much lower than other nations."
 SA_illiterate_population_2:0 "Inefficient Education System"
 SA_illiterate_population_2_desc:0 "Our Education system lacks the funding and/or the tools to properly teach the population. This creates a scarcity of students with higher education, that affects our country's advance in research and innovation."
 underdeveloped_industry:0 "Underdeveloped Industry"
 underdeveloped_industry_desc:0 "Our industry is almost nonexistant, as we still rely mostly on the rural economy. We should consider to acquire better tools and to build new factories to modernize our economy fully."
 GEN_exploit_resources:0 "Resource Extraction Program"
 GEN_railway_project_idea:0 "Railway Projects"
 
 new_deal:0 "New Deal"
 new_deal_desc:0 "A set of policies and programs initiated by Franklin D. Roosevelt, a reaction to the hardships suffered during the Great Depression."
 wilkies_new_deal:0 "Willkie's New Deal"
 wilkies_new_deal_desc:0 "Although Wendell Willkie opposed to some of FDR's suggestions for expanding the New Deal, some aspects have been supported and retained by the new president."
