 CAT_no_passaran:0 "No Passaran"
 CAT_divided_society:0 "Divided Society"
 CAT_divided_society_desc:0 "Our society is completely divided. Liberals support a parliamentary Republic, be it a Catalan Republic or a Democratic Spanish Republic, while workers look to the Socialist uprising in Spain. Catholics and Carlists are also concerned with our Secularist policies and support a Conservative, Catholic Catalonia, within or without Spain. If we want to survive, we'll have to unite our people."
 CAT_divided_society2:0 "Divided Society"
 CAT_divided_society2_desc:0 "Our society is completely divided. Liberals support a parliamentary Republic, be it a Catalan Republic or a Democratic Spanish Republic, while workers look to the Socialist uprising in Spain. Catholics and Carlists are also concerned with our Secularist policies and support a Conservative, Catholic Catalonia, within or without Spain. If we want to survive, we'll have to unite our people."
 CAT_independence_war:0 "Independence War"
 CAT_independence_war_desc:0 "While few, our soldiers are completely devoted to the ideal of a catalan republic. We shall fight until our last breath, for our nation and for our freedom!"
 CAT_reform_agrarian:0 "Agrarian Reform"
 CAT_free:0 "A Liberal Republic"
 CAT_textile_industrialists:0 "Ties with the Textile Sector"
 CAT_catalan_mine_expansion:0 "Catalan Mine Expansion"
 CAT_disorg_army:0 "Disorganized Army"
 CAT_disorg_army_desc:0 "We have won our independence, but our army is very disorganized. Nationalist militias are associated with different political parties, and on top of that there's the militarized section of the Mossos d'Esquadra and the proffessional soldiers that make up the official Catalan Army. We'll have to organize this if we want to fight again."
 CAT_disorg_army2:0 "Disorganized Army"
