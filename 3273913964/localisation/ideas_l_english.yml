 neutrality_idea:0 "Neutral Foreign Policy"
 neutrality_idea_desc:0 "This nation has declared neutrality in current global affairs. Neutrality is sometimes viewed as a craven stance, but this nation trusts that when the dust settles, those who didn't take sides may be better off than those who did."
 anti_soviet_pact:0 "Anti-Soviet Pact"
 anti_soviet_pact_refused_call:0 "Refused To Honor Anti-Soviet Pact"
 anti_soviet_pact_refused_call_desc:0 "This nation did not honor the Anti-Soviet Pact when called to war. This has caused the people to doubt the current government and spurred a rise in communist supporters."
 anti_soviet_pact_desc:1 "If one country in the pact is attacked by the Soviet Union, all other members will be called to war. Member already at war with Soviet Union will not be called."
 ideological_fanaticism_focus:0 "Ideological Fanaticism"
 political_commissars_focus:0 "Political Commissars"
 mex_divided_mexico:0 "Divided Mexico"
 mex_divided_mexico_desc:0 "Mexico is divided by pesky Caudillos, who think themselves as ruler of their states, while not responding to the central government"
 mex_the_maximato_shaky:0 "The Maximato - Shaky Influence"
 mex_the_maximato_shaky_desc:0 "The Maximato is on its last legs. While Calles has gotten away with complete control of the Maximoto for a long time, the cracks are beginning to show, and other party members are now jockeying to replace him. But even with all his problems, the \"Jefe Maximo\" is still the one with the final say in things."
 mex_the_maximato_destroyed:0 "The Maximato - Destroyed"
 mex_the_maximato_destroyed_desc:0 "Now that the \"Jefe Maximo\" is finally gone we can start reforming the country, but that doesn´t mean that his influence is over, and now we have the job of fixing the scars Calles left in this country"
 mex_the_maximato_solidified:0 "The Maximato - Solidified "
 mex_the_maximato_solidified_desc:0 "Treviño´s Presidency  have provento be what Calles needed to continue with the Maximato, while now his power is secured he shall not lower his guard, and he will continue to rule behind the chair with an iron hand"
 mex_the_jefe_maximo:0 "El Jefe Maximo"
 mex_the_jefe_maximo_desc:0 "Plutarco Elias Calles also known as the \"Jefe Maximo\" is the real power behind the President but he has given more liberty to his puppets to stabilize the Maximato and has given himslef the power to depose them if pushed to much"
 mex_deal_with_the_church:0 "Deal With The Church"
 mex_deal_with_the_church_desc:0 "Our treaty with the church is based on non-intervention in each others affairs, and for the church to avoid any type of political activities. While the treaty is balanced for now, further actions from the government could change it."
 mex_friendship_with_the_church:0 "Friendship with the Church"
 mex_friendship_with_the_church_desc:0 "The Church has been persecuted without mercy, and that has been the wrong way to go, so now we shall leave them some liberties in order to wing their favour once again"
 mex_state_catholicism:0 "State Catholicism"
 mex_state_catholicism_desc:0 "Finally after a long time Catholicism is our state religion, the support of the church will indeed get us lots of support, but some conssesions will be made to maintining it"
 mex_secularization:0 "Secularization"
 mex_secularization_desc:0 "While our previous deal with the church was good it didn´t go far enough, now this new policy is going to go as far as removing most of the influence of the church out of politics"
 mex_state_atheism:0 "State Atheism"
 mex_state_atheism_desc:0 "It is time to stop and oppose this outdated institution that is religion, our new law will make it illegal to follow this archaic institutions, while this might not be popular, but it is necessary"
 mex_great_depression:0 "The Great Depression"
 mex_great_depression_desc:0 "While The Great Depression hit America the hardest, it also hit Mexico, as it is a country dependent on the USA for imports and exports.  As 1933 begins the country has yet to recover from the economic hit."
