 spain_diplomatic_balance:0 "Diplomatic Balance"
 spain_diplomatic_balance_desc:0 "Joining a side of the war directly would be an irresponsible move, especially now that we just fought a deadly civil war. We shall only enter the war if we have enough guarantees that our country won't be invaded, and that we will be able to get some of the spoils.\n\n§RAligment variables with Britain and Germany go from -10 to +10. When one increases, the other decreases. If we get close enough to a country, we'll be able to join their faction, but the other may also take reprisals!§!\n\n§YAlignment Towards Britain: [?Root.british_drift]\nAlignment Towards Germany: [?Root.german_drift]§!"
