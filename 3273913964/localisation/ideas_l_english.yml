 ITA_expand_ctv_alt_desc:0 "The Corpo Truppe Volontarie has been quite successful in Spain, but the war effort demands us to send even more men!"
 ITA_aviazione_legionaria_alt:0 "Aviazione Legionaria"
 ITA_aviazione_legionaria_alt_desc:0 "The air aspect can't be neglected in modern warfare. We must send our own planes to secure air superiority over Iberia!"
