 agrarian_gra_desc:0 "As a part of the agrarian reform, we should try to redistribute land in the province of Granada.\n§YSeats supporting the law: [?Root.supseat]/[?Root.min_sup_seat]§!"
 agrarian_subsidy:0 "Agrarian Subsidy"
 agrarian_subsidy_desc:0 "The new small owners need resources to get their lands going. We should try to approve a new programme of subsidies for small owners and finishing the last land redistributions in La Mancha..\n§YSeats supporting the law: [?Root.supseat]/[?Root.min_sup_seat]§!"
 pass_bad1:0 "Pass Law: Land Redistribution in Badajoz"
 pass_bad1_desc:0 "We need to convince a majority of the parliament if we want to pass this law."
 pef_funds1:0 "Additional PEF funds"
 pef_funds1_desc:0 "The PEF (Plan de Enalces Ferroviarios) is an ambitious plan to expand railroads all across Spain. However, it needs funds to be effective, and the Parliament has to approve them.\n§YSeats supporting the law: [?Root.supseat]/[?Root.min_sup_seat]§!"
 pef_funds2:0 "PEF: Renovation of Railroad Stations"
 pef_funds2_desc:0 "The PEF is an ambitious plan to expand railroads all across Spain. However, it needs funds to be effective, and the Parliament has to approve them. This time additional funding for station renovation will be debated.\n§YSeats supporting the law: [?Root.supseat]/[?Root.min_sup_seat]§!"
 pef_funds3:0 "PEF: Decentralize Rail Network"
 pef_funds3_desc:0 "The PEF is an ambitious plan to expand railroads all across Spain. However, it needs funds to be effective, and the Parliament has to approve them. This time additional funding for decentralization of the network will be debated.\n§YSeats supporting the law: [?Root.supseat]/[?Root.min_sup_seat]§!"
 pef_funds4:0 "Pass the Highway Plan"
 pef_funds4_desc:0 "The PEF has ended succesfully and the rail network is fully modernized. Now we need to go further and start preparing highway construction.\n§YSeats supporting the law: [?Root.supseat]/[?Root.min_sup_seat]§!"
 prog_tax:0 "Progressive Taxation Act"
 prog_tax_desc:0 "If the richs pay more and the poor pay less, the government will have more money at its disposal and public industry can be expanded. It will be difficult to pass though.\n§YSeats supporting the law: [?Root.supseat]/[?Root.min_sup_seat]§!"
 spr_ley_congregaciones:0 "Ley de Confesiones y Congregaciones Religiosas"
 spr_ley_congregaciones_desc:0 "The Law on Religious Confessions and Congregations develops articles 26 and 27 of the Constitution and establishes that religious orders and congregations must be registered in a special Registry of the Ministry of Justice; it regulates public worship; it abolishes the State's "worship and clergy" endowment and eliminates other official subsidies; it nationalizes part of the ecclesiastical patrimony (temples, monasteries, seminaries, etc. ) although they remain at the disposal of the Church; it attributes to the State the power to veto certain religious appointments; and finally, it establishes the closing of Catholic secondary schools by October 1 and primary schools by December 31, 1933.\nIt also forbids religious orders to "exercise commerce, industry or agricultural exploitation by themselves or through an intermediary" and "to engage in the exercise of teaching" except for that "which they organize for the formation of their own members".\n\n§YSeats supporting the law: [?Root.supseat]/[?Root.min_sup_seat]§!"
 school_build:0 "School Building Plan"
 school_build_desc:0 "We need extra funding for school building, to make up for closed catholic schools. The Parliament will have to provide the funds.\n§YSeats supporting the law: [?Root.supseat]/[?Root.min_sup_seat]§!"
 rustic_leases:0 "Rustic Leases Act"
 rustic_leases_desc:0 "As a part of the agrarian reform, we need to pass the Rustic Leases Act. The right and the centre are stauchly opposed to this, so we must negotiate with all options open.\n§YSeats supporting the law: [?Root.supseat]/[?Root.min_sup_seat]§!"
 close_cath:0 "Catholic Press Restrictions"
 close_cath_desc:0 "Catholic Newspapers are constantly agitating against our precious Republic. It may be undemocratic, but for the greater good, we can restrict their press.\n§YSeats supporting the law: [?Root.supseat]/[?Root.min_sup_seat]§!"
 SPR_explain_parliament:0 "Parliament Explanation"
 SPR_explain_parliament_desc:0 "A short explanation of how Parliament works"
 spain_alb1:0 "Revise Mixed Juries Law"
 spain_alb1_desc:0 "The Mixed Juries law passed by Largo Caballero and the republicans in 1931 is too revolutionary. It must be revised and limited to ensure stability. Workers won't like it, though.\n§YSeats supporting the law: [?Root.supseat]/[?Root.min_sup_seat]§!"
 spain_alb2:0 "Ley de Reforma Sindical"
 spain_alb2_desc:0 "It is time to limit Union activity to ensure our factories and entreprises prosper. We must be ready for a backslash in the streets, however.\n§YSeats supporting the law: [?Root.supseat]/[?Root.min_sup_seat]§!"
 spain_alb3:0 "Revise Work Contracts Law"
 spain_alb3_desc:0 "The Work Contracts law passed by Largo Caballero and the republicans in 1931 is too revolutionary. It must be revised and limited to ensure stability. Workers won't like it, though.\n§YSeats supporting the law: [?Root.supseat]/[?Root.min_sup_seat]§!"
 spain_alb4:0 "Ley de Estabilidad Laboral"
 spain_alb4_desc:0 "After reforming old republican labour legislation, it is the time of passing a new law, more responsible, that grants the workers the rights they deserve for being spanish citizens.\n§YSeats supporting the law: [?Root.supseat]/[?Root.min_sup_seat]§!"
 spain_aag1:0 "Stop Land Redistributions in Western Andalusia"
 spain_aag1_desc:0 "In order to guarantee private property and stability, we have to stall the Agrarian Reform process in Western Andalusia.\n§YSeats supporting the law: [?Root.supseat]/[?Root.min_sup_seat]§!"
 spain_aag2:0 "Stop Land Redistributions in Extremadura"
 spain_aag2_desc:0 "In order to guarantee private property and stability, we have to stall the Agrarian Reform process in Extremadura.\n§YSeats supporting the law: [?Root.supseat]/[?Root.min_sup_seat]§!"
 spain_aag3:0 "Stop Land Redistributions in Eastern Andalusia"
 spain_aag3_desc:0 "In order to guarantee private property and stability, we have to stall the Agrarian Reform process in Eastern Andalusia.\n§YSeats supporting the law: [?Root.supseat]/[?Root.min_sup_seat]§!"
 spain_aag4:0 "Dissolve the Agrarian Reform Institute"
 spain_aag4_desc:0 "The IRA ( Instituto de Reforma Agraria ) is pointless now that the reform has been overturned, so it must be abolished and dissolved.\n§YSeats supporting the law: [?Root.supseat]/[?Root.min_sup_seat]§!"
 galicia_mining:0 "Wolframium Extraction Funds"
 galicia_mining_desc:0 "Many experts are pointing to Galicia as a big source of tungsten. We should ask the Congress for funding for these miner activities.\n§YSeats supporting the law: [?Root.supseat]/[?Root.min_sup_seat]§!"
 expand_secn:0 "SECN Expansion Act"
 expand_secn_desc:0 "To expand our shipbuilding capabilities, we have to give more funds to the SECN to allow them to build and support more shipyards.\n§YSeats supporting the law: [?Root.supseat]/[?Root.min_sup_seat]§!"
 infantry_mod:0 "Infantry Modernization Program"
 infantry_mod_desc:0 "Our weapons are very outdated, and the Army needs more funds to renovate them. Those funds have to be authorized by the Parliament.\n§YSeats supporting the law: [?Root.supseat]/[?Root.min_sup_seat]§!"
 expand_jae:0 "Expand the JAE"
 expand_jae_desc:0 "The Junta para Ampliación de Estudios ( Studies Expansion Junta ) might be useful for our scientific development, and it must be expanded.\n§YSeats supporting the law: [?Root.supseat]/[?Root.min_sup_seat]§!"
 SPR_jae_expanded:0 "Junta para Ampliación de Estudios"
 emergency_draft:0 "Extend Military Service"
 emergency_draft_desc:0 "Our military high command has asked us for more recruits, but to do that the Congress has to give its approval.\n§YSeats supporting the law: [?Root.supseat]/[?Root.min_sup_seat]§!"
 SPR_italian_fund:0 "The Italian War Fund"
 SPR_italian_fund_desc:0 "The military high command has planned some key structures that should be built before the war starts, like forts and railways. To start these constructions, we have to ask the Parliament for the funds first.\n§YSeats supporting the law: [?Root.supseat]/[?Root.min_sup_seat]§!"
 SPR_will_grant_funds:0 "§YIf the law is passed, military buildup decisions against Italy will be unlocked§!"
 spain_lbr1:0 "Liberalize Railways in Madrid"
 spain_lbr1_desc:0 "To ensure competition and efficiency, the railways shall be fully liberalized in the region of Madrid!§YSeats supporting the law: [?Root.supseat]/[?Root.min_sup_seat]§!"
 spain_lbr2:0 "Liberalize Railways in Valencia"
 spain_lbr2_desc:0 "To ensure competition and efficiency, the railways shall be fully liberalized in the region of Valencia!§YSeats supporting the law: [?Root.supseat]/[?Root.min_sup_seat]§!"
 spain_lbr3:0 "Liberalize Railways in Castilla"
 spain_lbr3_desc:0 "To ensure competition and efficiency, the railways shall be fully liberalized in the region of Castilla!§YSeats supporting the law: [?Root.supseat]/[?Root.min_sup_seat]§!"
 spain_lbr4:0 "Liberalize Railways in Andalucía"
 spain_lbr4_desc:0 "To ensure competition and efficiency, the railways shall be fully liberalized in the region of Andalucía!§YSeats supporting the law: [?Root.supseat]/[?Root.min_sup_seat]§!"
 spain_lbr5:0 "Liberalize Railways in Aragón"
 spain_lbr5_desc:0 "To ensure competition and efficiency, the railways shall be fully liberalized in the region of Aragón!§YSeats supporting the law: [?Root.supseat]/[?Root.min_sup_seat]§!"
 spain_tax1:0 "Tax Cuts for Big Businesses"
 spain_tax1_desc:0 "It is outrageous the amount of money that our people has to to pay in form of taxes. We will promote tax reductions to big businesses.\n§YSeats supporting the law: [?Root.supseat]/[?Root.min_sup_seat]§!"
 spain_tax2:0 "Tax Cuts for Small Businesses"
 spain_tax2_desc:0 "It is outrageous the amount of money that our people has to to pay in form of taxes. We will promote tax reductions to small businesses.\n§YSeats supporting the law: [?Root.supseat]/[?Root.min_sup_seat]§!"
 spain_tax3:0 "Reduce Consumer Taxes"
 spain_tax3_desc:0 "It is outrageous the amount of money that our people has to to pay in form of taxes. We will promote tax reductions to the average citizen.\n§YSeats supporting the law: [?Root.supseat]/[?Root.min_sup_seat]§!"
 SPR_ley_governadores_civ:0 "Ley de Gobernadores Civiles"
 SPR_ley_governadores_civ_desc:0 "We shall increase the power of the government-appointed governors to reduce power of military authorities and local townhalls.\n§YSeats supporting the law: [?Root.supseat]/[?Root.min_sup_seat]§!"
 spain_basque_autonomy_vote:0 "Vote the Basque Statute of Autonomy"
 spain_basque_autonomy_vote_desc:0 "The Basque people have voted to create a statute of autonomy for Euskadi. It's time to give them what they want.\n§YSeats supporting the law: [?Root.supseat]/[?Root.min_sup_seat]§!"
 SPR_generalitat_suspended: "The Generalitat has been suspended"
 SPR_end_generalitat:0 "Suspend the Generalitat of Catalonia"
 SPR_end_generalitat_desc:0 "After the failed rebellion carried out illegally by the Catalans, the government has decided to suspend the Generalitat of Catalonia indefinitely (the CEDA demanded the repeal of the Statute instead) and the Generalitat will be replaced by the Consejo de la Generalidad (Council of the Generalitat) appointed by the Government, and with a \"president\" called Governor General of Catalonia (a military governor). The first one will be Colonel Francisco Jiménez Arenas, who will act as "accidental president" of the Generalitat from now on. The Parliament of Catalonia will be closed and around 100 town councils will be dissolved and replaced by management commissions made up of right-wing politicians.\n\n§YSeats supporting the law: [?Root.supseat]/[?Root.min_sup_seat]§!"
 spain_tax_cuts_mis_ped: "Modify the Pedagogical Missions"
 spain_tax_cuts_mis_ped_desc: "To mitigate the radical cut in the economic allocation approved by the right-wing groups in the government (grouped in CEDA), the Missions project will be modified. Funds allocated to the Instituto Libre de Enseñanza and the Misiones Pedagogicas will be cut down (although such costs cannot be very significant considering that the personnel are volunteers and many of the materials have been donated or given by Republican families through the popular libraries). The CEDA wants to sabotage the project in any way possible: in their point of view, the project to educate and bring culture to the most isolated and backward villages of Spain, as well as building new schools, is a plot of the left to convert the peasants into radicalized socialist agitators."
 spain_con1:0 "Ley de Servicio Educativo"
 spain_con1_desc:0 "While closing catholic schools is not a bad idea per se, it is useless if the area has no public school to absorb those students. We shall protect catholic schools until more public schools are built.\n§YSeats supporting the law: [?Root.supseat]/[?Root.min_sup_seat]§!"
 spain_con2:0 "Reformed Church Subsidy"
 spain_con2_desc:0 "While we can't give the church the amounts of money they got before, giving them a small amount of money for charity would help reconcile with catholics.\n§YSeats supporting the law: [?Root.supseat]/[?Root.min_sup_seat]§!"
 spain_con3:0 "Restore Civil Rights"
 spain_con3_desc:0 "Civil Rights have restricted, due to threats to the Republic, since almost 1931. We should restore them to win back the people.\n§YSeats supporting the law: [?Root.supseat]/[?Root.min_sup_seat]§!"
 spain_con4:0 "Ley de Libertad de Prensa"
 spain_con4_desc:0 "Many governments have tried to restrict the press in one way or another. It is time to protect freedom of the press with a specific law.\n§YSeats supporting the law: [?Root.supseat]/[?Root.min_sup_seat]§!"
 
