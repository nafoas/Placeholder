 sisu:0 "Sisu"
 sisu_desc:0 "Sisu is the uniquely Finnish expression for the resilience of the nation's people. Finland has faced harsh odds and will do so again."
 
 great_depression:0 "The Great Depression"
 great_depression_desc:0 "The Stock Market Crash of 1929 and the subsequent economic crisis has affected almost all countries in the world, including us. We need to take measures to tackle this problem and we need to do it quickly."
 great_depression2:0 "The Great Depression"
 great_depression2_desc:0 "The Stock Market Crash of 1929 and the subsequent economic crisis has affected almost all countries in the world, including us. We need to take measures to tackle this problem and we need to do it quickly."
