 ITA_support_nationalists:0 "Support Nationalist Spain"
 ITA_support_nationalists_desc:0 "The war in Spain is an excellent opportunity to test our weaponry, to display our power to the world, and hopefully to secure Spain as an ally in the future. The straits of Gibraltar and the Balearic Islands are very tempting targets, but first we must ensure the reds are crushed!"
 ITA_ctv:0 "Corpo Truppe Volontarie"
 ITA_ctv_desc:0 "Sending only equipment is not enough. The only way to ensure the Nationalists are victorious is by deploying our troops directly."
 ITA_expand_ctv:0 "Expand the CTV"
 ITA_expand_ctv_desc:0 "The Corpo Truppe Volontarie has been quite successful in Spain, but the war effort demands us to send even more men!"
 ITA_aviazione_legionaria:0 "Aviazione Legionaria"
 ITA_aviazione_legionaria_desc:0 "The air aspect can't be neglected in modern warfare. The Spanish Airforce is mostly loyal to the Republicans, so we must send our own planes to secure air superiority over Iberia!"
 ITA_ctv_sent:0 "Send the CTV to Spain"
 ITA_ctv_sent_again:0 "Sent more troops to Spain"
 ITA_disrupt_republican_shipping:0 "Disrupt Republican Shipping"
 ITA_disrupt_republican_shipping_desc:0 "Republicans rely on Soviet food imports to survive. If we use the Regia Marina to attack their supply line, they might have starvation problems, being easier targets for the the Nationalists."
 ITA_send_guns_spain:0 "Send Ammunition to Spain"
 ITA_send_guns_spain_desc:0 "The Nationalists seem to have a shortage of ammunition and small arms. We need to send them a shipment of those!"
 ITA_send_arty_spain:0 "Send Artillery to Spain"
 ITA_send_arty_spain_desc:0 "The Spanish Nationalists lack artillery, we need to send them a shipment so that they can fight properly."
 
 ITA_support_nationalists_alt:0 "Support Nationalist Spain"
 ITA_support_nationalists_alt_desc:0 "The war in Spain is an excellent opportunity to test our weaponry, to display our power to the world, and hopefully to secure Spain as an ally in the future. The straits of Gibraltar and the Balearic Islands are very tempting targets, but first we must ensure the reds are crushed!"
