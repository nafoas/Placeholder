 POR_shattered_republicanism:0 "Shattered Republicanism"
 POR_shattered_republicanism_desc:0 "Since the collapse of the corrupt and unstable Republic a number of years ago, all moderate opposition to the Salazar regime has almost completely fell apart. Salazar has succeeded at winning countless former Conservatives and Monarchists to his cause, and has been able to use his charisma to rally the population to his side. The only remaining opposition comes from the Portuguese Communist Party, National Syndicalists, and small pro-democracy groups exiled in Paris and Madrid."
 POR_salazars_lesson:0 "A Lição de Salazar"
 POR_salazars_lesson_desc:0 "''Salazar's Lessons'' refers to Salazar's transfiguration of Portugal into a highly centralised, ultraconservative, technocratic, corporate state ruled by a broad coalition of rightist forces with minimal opposition. Salazar himself is a talented economist, succeeding at almost completely avoiding the effects of the Great Depression and promoting Portugal as an economically and political independent pluricontinental empire with strong Catholic basis."

