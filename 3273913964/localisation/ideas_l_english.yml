 SPR_misiones_peda:0 "Pedagogical Missions"
 SPR_misiones_peda_desc:0 "\"We are a traveling school that wants to go from town to town. But a school where there are no tuition books, where there is no need to learn with tears, where no one will be brought to his knees as in the past. Because the government of the Republic that sends us, has told us to come, first of all, to the villages, to the poorest, to the most hidden and abandoned, and that we come to teach you something, something that you do not know because you are always so alone and so far from where others learn it, and because no one until now has come to teach it to you; but that we come also, and first of all, to amuse you.\"\n\n-Manuel Bartolomé Cossío, president of the Board of Trustees of the Pedagogical Missions."
