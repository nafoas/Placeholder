 spain_estabilish_control:0 "Political Control"
 spain_estabilish_control_desc:0 "A new leader has been elected, however, his control is far from secure. We can use the war to install a stronger authority and purge our rivals, even though that would extend the war, bringing even more destruction to our country. We can also try to end the war quickly, but that may be politically damaging in the long run.\n\n§RYou will receive a political penalty at the end of the war unless you reach 100% political control by then!§!\n\n§YOur political control is: [?Root.spa_control]%§!"
