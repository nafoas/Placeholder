gre_internal.2.t:0 "Greek Coup of 1935"
gre_internal.2.d:0 "blah blah"
gre_internal.2.a:0 "Democracy woo hoo"


gre_internal.3.t:0 "Monarchist Coup"
gre_internal.3.d:0 "On October 10th 1935, Minister of War Georgios Kondylis and several other officers called on Prime Minister Tsaldaris and forced him to resign. Kondylis forced President Alexandros Zaimis to name him the new premier. Later that day, Kondylis forced Zaimis to resign, declared himself Regent, abolished the Republic and decided to prepare a plebiscite for the return of the monarchy on November 3th."
gre_internal.3.a:0 "Well, that escalated quickly."

gre_internal.4.t:0 "Monarchist Referendum"
gre_internal.4.d:0 "In 1935, Prime Minister and Regent Georgios Kondylis, a former pro-Venizelos military officer, became the most powerful political figure in Greece. On 10 October, he compelled Panagis Tsaldaris to resign as Prime Minister and took over the government, suspending many constitutional provisions in the process. Kondylis, who had now joined the Conservatives, decided to hold a referendum in order to re-establish the monarchy, despite the fact that he used to be a supporter of the anti-monarchist wing of Greek politics.\n\nThe referendum was scheduled to take place on 3 November per resolution 'on the abolition of the republic' of 10 October 1935\n\nThe official tally showed that 98 percent of the voters supported the return of George II—an implausibly high total that could have only been obtained through massive fraud. Indeed, the vote took place under less-than-secret conditions.\n\nObservers of the time expressed serious doubts about the vote's legitimacy. Besides the implausibly high 'yes' vote, the vote was held in far-from-secret circumstances. Voters dropped a blue piece of paper into the ballot box if they supported the king's return, or a red paper to retain the republic. Anyone who cast a red paper risked being beaten up."
gre_internal.4.a:0 "'I love democracy!'"

gre_internal.5.t:0 "Return of the King"
gre_internal.5.d:0 "After more than a decade of living in exile in London, George II 'King of the Hellenes' finally returned to his homeland."
gre_internal.5.a:0 "Long Live King George II!"

gre_internal.6.t:0 "Government of Konstantinos Demertzis"
gre_internal.6.d:0 "The government of Konstantinos Demertzis was the first government after the restoration of the Kingdom in Greece.\n\nKing George II reaffirmed his re-ascension to the throne, and after failing to co-operate with the already existing government of George Kondylis, due to their disagreement over whether or not to grant amnesty to the participants of the 1st March Coup of 1935, (amnesty that the king was determined to provide), the King appointed the moderate political and reputable lawyer, Konstantinos Demertzis, in order to complete the work of the Fifth Parlement, the revision the Constitution and prepare the elections."
gre_internal.6.a:0 "Long live Premier Demertzis"

gre_internal.7.t:0 "Greek Elections of 1936"
gre_internal.7.d:0 "The restoration of the monarchy did not solve Greek internal divisions, and the elections of 1936 showed this clearly by producing a parlament divided almost evenly between the Liberals and Populists, along with fifteen Communists deputies. Since the bitter divisions betweeen the Venizelists and monarchists made it impossible for the major parties to cooperate and form a coalition government, the other option was for one party to turn the Communists for support. In 1936 the Greek Communist Party (KKE) was on the fringe of the political scene. Although they did not enjoy widespread support, with the fifteen seats they won as a result of the 1936 election, the Communists were able to control the balance of power in the Greek parliament. \n\nBoth major parties began talks with the Communists in order to secure their cooporation in forming a government, and the Liberals actually managed to reach an agreement with them, but these effort at political compromise were stillborn. When news of a possible Liberal-KKE coalition leaked out, Alexandros Papagos, the minister of army affair, with the support of the chiefs of the air force, navy, and gendarmerie, informed the king that the armed forces would not tolerate a governmen backed by the Communists.\n\n"
gre_internal.7.a:0 "Another unstable parlament? Can not be!"

gre_internal.8.t:0 "New Minister of Defense"
gre_internal.8.d:0 "The King has decided Ioannis Metaxas fits perfectly for a role of Minister of Defense."
gre_internal.8.a:0 "Long live Minister Metaxas!"

gre_internal.9.t:0 "2nd Government of Konstantinos Demertzis"
gre_internal.9.d:0 "After weaks of hung parliament we have finally managed to form a goverment, Konstantinos Demertzis shall become the Prime Minister yet again."
gre_internal.9.a:0 "Long live Premier Demertzis!"

gre_internal.10.t:0 "Death of Premier"
gre_internal.10.d:0 "Konstantinos Demertzis, our Prime Minister, has died today of a heart attack. The King decided Ioannis Metaxas, the Deputy Prmie Minister, shall take his post."
gre_internal.10.a:0 "Wise choice"

gre_internal.11.t:0 "Vote of Confidence"
gre_internal.11.d:0 "King George II had held close relations with Metaxas in the past and appointed Metaxas as Prime Minister of Greece in May 1936. Upon becoming Prime Minister, Metaxas made clear his discontent with the political deadlock between feuding political blocs in Greece's parliament and the rising labour unrest being exploited by the Communist Party of Greece. Metaxas quickly sought to crush dissent including labour unrest in the form of decrees that did not require acceptance by the Greek parliament."
gre_internal.11.a:0 "Long live Premier Metaxas!"

gre_internal.12.t:0 "Macedonian Strikes"
gre_internal.12.d:0 "The appointment of Metaxas as prime minister caused a strike wave all across the country with Macedonia being the center of the protests and strikes. On 29 April 1936, the tobacco farmers of Macedonia went on a strike to protest his appointment and on 9 May a general strike began in Thessaloniki."
gre_internal.12.a:0 "Traitors!"

gre_internal.13.t:0 "State of Emergency"
gre_internal.13.d:0 "On August 4, 1936, Metaxas gained the King's support for a decree that dissolved parliament. He declared martial law, suspended civil rights such as liberty of the subject, and mobilized transport and public workers to support him. Metaxas justified these actions as necessary to prevent communist revolution. Numerous arrests were made of leftist leaders and others following these proclamations. Metaxas abolished all political parties including his own, ruling as an official independent. This date is considered the beginning of Metaxas' totalitarian rule known as the 4th of August Regime.\n\nMetaxas was referred to by supporters as the Archigos (Leader) and promised to create a "New State" in Greece that called for Greeks to wholly commit themselves to the nation with self-control as the Spartans had done. Supporters of the 4th of August Regime justified Metaxas' dictatorship on the basis that the 'First Greek Civilization' involved the Athenian dictatorship of Pericles who had brought ancient Greece to greatness. \n\nMetaxas introduced widespread strict censorship of the press and banned literature of authors considered taboo by the regime, including literature by Karl Marx, Sigmund Freud, Leo Tolstoy, Fyodor Dostoyevsky, and Immanuel Kant. \n\nMetaxas sought the creation of a disciplined younger generation as being critical for the future of Greece and for the strengthening of his regime and its principles that world entrench the Third Greek Civilization. In October 1936 the regime created the National Youth Organization of Greece (EON) that gained 200,000 members by 1938 and by 1939 when youth membership in the EON became mandatory, it absorbed the Boy Scouts of Greece. Members of the EON took an oath of fidelity to the principles of the 4th of August that included: embracing the institutions of the monarchy; support of national pride and faith of the Greek civilization; opposition to parliamentarianism and communism; support of the development of egalitarian, non-individualistic, virtuous citizens."
gre_internal.13.a:0 "'Neon Kratos!'"



#ideas
GRE_national_schism:0 "Memories of National Schism"
GRE_national_schism_desc:0 "The National Schism, sometimes called The Great Division, began as a series of disagreements between King Constantine I and Prime Minister Eleftherios Venizelos regarding the foreign policy of Greece in the period of 1910–1922 of which the tipping point was whether Greece should enter the Great War.\n\nVenizelos was in support of the Allies and wanted Greece to join the war on their side, while the pro-German King wanted Greece to remain neutral, which would favor the plans of the Central Powers.\n\nThe disagreement had wider implications, since it would also affect the character and role of the king in the state. The dismissal of Venizelos by the King resulted in a deep personal rift between the two and in subsequent events their followers divided into two radically opposed political camps affecting the wider Greek society.\n\nThis division is still alive in Greek society, , the conflict between the Venizelists(liberals) and Populits(monarchists) splits the nation and sparks conflicts in every aspect of public life. It might have serious implications for the future of Hellenic Republic."

