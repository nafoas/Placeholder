  ##Sec
  
 ##Events

 ALB_italian_influence.1.t:0 "Italy invests in Albania"
 ALB_italian_influence.1.d:0 "The Italian ambassador has today announced that Italy shall be begginning investments in Albania, while this may be beneficial to us in the short term, it remains to be seen whether this is simply a sign of good will, or part of an Italian plot to take over the entire country..." 
 ALB_italian_influence.1.a:0 "We will accept the proposals."
 ALB_italian_influence.2.t:0 "Italy sends a Military Delegation"
 ALB_italian_influence.2.d:0 "An Italian boat has today arrived down in Tirana, carrying members of the Italian army, keen to assist us in developing our own armed forces. While there help is gratefully accepted, it remains to be seen whether this is simply a sign of good will, or part of an Italian plot to take over the entire country... "
 ALB_italian_influence.2.a:0 "We will accept the propsals..."
 ALB_italian_influence.3.t:0 "Albania Hampers our Influence"
 ALB_italian_influence.3.d:0 "News from across the Adriatic reports that the Albanians have begun a propaganda campaign directed at their general populace, promoting anti-Italian sentiment in their country."
 ALB_italian_influence.3.a:0 "Damn those pesky Albanians..."
 ALB_italian_influence.4.t:0 "Albania Promotes local Industries"
 ALB_italian_influence.4.d:0 "News from various Italian companies in Albania have reported that the local government has begun a campaign against Italian led companies there, promoting the influence of local businesses and industries."
 ALB_italian_influence.4.a:0 "They will come to realize their mistakes"
 ALB_italian_influence.5.t:0 "Albania Nationalizes the Electric companies"
 ALB_italian_influence.5.d:0 "The Albanian government has today taken the decision to nationalize the electric companies within the nation, including several of our own companies operating there. This is a disaster for our efforts to influence the Albanian government and people."
 ALB_italian_influence.5.a:0 "We'll let this one slide..."
 ALB_italian_influence.5.b:0 "They have gone too far!"

  
