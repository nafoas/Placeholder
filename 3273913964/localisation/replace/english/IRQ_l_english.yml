 ### ideas ###
 IRQ_underdeveloped_nation:0 "Underdeveloped Economy"
 IRQ_underdeveloped_nation_desc:0 "Despite attempts at progress in recent years, Iraq remains a backwards and underdeveloped country by western standards. Proper industry and infrastructure are few and far between and many parts of the country have barely evolved from a feudal state. It will require much effort and sacrifice to bring Iraq into the modern era."
 IRQ_divided_nation:0 "A Divided Nation"
 IRQ_divided_nation_desc:0 "While on paper Iraq is a united country in reality it is nothing more than a colonial cosntruct, a a stitched together mob of numerous ethicities and religions under the yoke of the Arab Sunni Elite. Kurds, Yazidis, Assyrians, and Shiites, are only a few of the many peoples that dont truly feel at home in Iraq, and could potentially challenge it in the future."
 IRQ_land_law_1932:0 "Land Distribution Law of 1932"
 IRQ_land_law_1932_desc:0 "At the beginning of the decade, something of an agricultural boom started in Iraq. Many merchants, tribal sheiks, and other notables have now began clamouring for more land to be granted to them for their ever-growing farm businesses. Our government was only too happy to facilitate this and in 1932, the process of land granting was expedited to give greater swaths of arable land to these farming magnates. While increasing our crop yields considerably, it has also centralized farmland around an ever shrinking group of wealthy landlords, stealing away the freedoms many independent farmers once enjoyed, and depriving them of their social mobility."
 IRQ_illiterate_populace:0 "Illiterate Populace"
 IRQ_illiterate_populace_desc:0 "While it was once the center of the academic world, Iraq has fallen from its status considerably. The intelligentsia occupies a minute portion of our society, and most of our populace can’t even read."

