 spain.300.t:0 "The Assasination of José Castillo"
 spain.300.d:0 "It was another summer night in Madrid. As the sun set, and the heat stopped, many \"madrileños\" took the opportunity, as always, to go out for a walk. One of these people was Assault Guard Lieutenant José del Castillo Sáenz de Tejada, who, despite being warned of a possible attempt on his life, had decided to go for a walk with his wife in the neighborhood of Chueca. Castillo was a former soldier, now member of the Assault Guard, with ties to the Socialist Party and the 1934 Revolution, in which he refused to repress the rebelled workers. He was sent to prision, and joined the Assault Guard after the triumph of the Popular Front in February. At around 10:00 PM, four extreme-right gunmen, which have been identified by falangists or carlists by different sources, shot him by surprise, without giving him time to defend himself. He was taken to a nearby hospital, where he was declared dead. His friend and fellow Assault Guard Lieutenant, Fernando Condés, is outraged, and he has decided to take his revenge on the right..."
 spain.300.a:0 "Will this violence ever stop?"
 
 spain.301.t:0 "The Assasination of Calvo Sotelo"
 spain.301.d:0 "After Castillo was declared dead, his friend Fernando Condés and other members of the Assault Guard, along with Socialist militias, met in the Pontejos Barracks, determined to take revenge for the attack. First, they asked the Security Minister to go to search for a prominent falangist, but when they arrived they realized the address was false. The group of policemen and socialist militias then decided to go search Antonio Goicoechea, the leader of Renovación Española, but when they arrived, he wasn't home. Gil-Robles was also proposed as a target, but he was on holiday. As they were driving through Velázquez Street, one of them remembered that José Calvo-Sotelo, another monarchist leader, lived there, so they went to search him. They told him that he needed to come with them to the Dirección General de Seguridad. Calvo Sotelo resisted, citing his parliamentary inmunity and the Constitution, but finally agreed to go with them after Condés identified himself as a Civil Guard. After driving about 200 meters, socialist militant and Prieto bodyguard Luis Cuenca shot Calvo Sotelo in the back of the head, killing him instantly. His body was left in the Almudena Cementery, where it was discovered this morning. \nThe murder of one of the most prominent opposition leaders by security forces has left the right furious..."
 spain.301.a:0 "Uh oh..."
 
 spain.302.t:0 "A Military Plot?"
 spain.302.d:0 "Our electoral victory in February didn't sit well with many army officers, that are rumoured to be planning a military coup, similar to the 1932 Sanjurjada. Our scarce evidence points at Emilio Mola, military commander of Pamplona, as the leader of the plotters, whith the collaboration of the carlists and the falagists. Although it is unclear the position of many generals, like Cabanellas, Queipo de Llano or Francisco Franco, we should appoint loyal generals like Molero or Batet, to positions of power. Let's hope they can stop the military plot..."
 spain.302.a:0 "We need to be careful now"
 
 spain.303.t:0 "Alfonso Carlos de Borbón dies"
 spain.303.d:0 "Alfonso Carlos de Borbón, the carlist pretender to the Spanish throne, as died today at age 87, in Austria, when a military truck rolled over him. His death officially marks the end of the carlist line, that split from the main legitimist line in 1833. According to carlist succession rules, the new pretender would be ironically, Alfonso XIII, unifying both lines into the legitimist one. Many carlists have refused to accept this, and have appointed Alfonso Carlos' nephew, Javier de Borbón, as new regent, breaking their very own succession law. In any case, chaos is assured within the carlist movement..."
 spain.303.a:0 "At least they'll fight each other now!"
 
 spain.304.t:0 "The Spanish Electoral System"
 spain.304.d:0 "As the Cortes are dissolved, political parties, left and right, big and small, prepare their strategy and campaign for the upcoming November election. This is very important, because coalitions and small differences in vote numbers can result in big changes on the final seat allocation. \n\nFor the upcoming election, Spain is divided in 60 electoral districts. These are each of the 50 provinces, and the cities of Ceuta, Melilla, Madrid, Barcelona, Bilbao, Valencia, Zaragoza, Murcia, Sevilla and Málaga, that form their own district. Each district elects a number of deputies proportional to its population, roughly one per 50000 people. Each voter can vote for a number of deputies, around 80% of the total deputies of the district. For example, Burgos elects 8 deputies, and each voter can only vote for 6. Then the 8 most voted candidates are elected to the Cortes as long as they have obtained at least 20% of the total vote, if not, a second round is held that elects the vacant seats. \n\nIn practice, this means that the people will vote for \"lists\", and all deputies in the list gain a similar number of votes. For example, in Burgos, during the last election, the right-wing voters all voted for the 6 candidates included in the Right-Wing List, which, as the most voted one, won 6 seats, while the left could only win the remaining 2, despite a difference of 1000 votes between both sides. This forces parties to form big coalitions, disproportionally punishing parties that go alone, and forcing larger, more moderate parties to give smaller, radical ones spots on their electoral lists, as it only takes 1000 votes to swing an entire province. \n\nIn 1931, the left-wing forces consolidated in big Republican Lists that managed to win almost everywhere (Burgos was one of the exceptions), securing an artificial majority in Parliament, as the right was disunited and disorganized. Now, with the formation of the CEDA and the growing opposition of the PRR to the government, the right could very well win most of the provinces and form a new majority..."
 spain.304.a:0 "This is complicated"
 
 spain.305.t:0 "Formation of the Right-Wing Union"
 spain.305.d:0 "As the election approaches, the CEDA is trying to secure a victory in as many districts as possible. In order to do so, they have begun to form electoral alliances with everyone to the right of the PRR, including the monarchist Renovación Española, the carlist Comunión Tradicionalista, the agrarians, the centrist republicans, the catalan regionalist Lliga, and even the fascist Falange Española, whose leader, José Antonio Primo de Rivera, has been given the second place in the right-wing list in Cádiz. This coalition, named \"Unión de Derechas\" or \"Frente de Derechas\" is likely to see significant success in the coming election."
 spain.305.a:0 "Will they gain a majority?"
 
 spain.306.t:0 "The Leftist Campaign"
 spain.306.d:0 "As the election approaches and the right organizes, the left has begun to do so as well. Azaña's AR (Republican Action) and the PSOE have formed electoral alliances in some provinces, often including the Radical Republican Socialist Party (PRRS) and other small centre-left parties. With the women, a more conservative demographic, voting for the first time, and the disgruntled CNT refusing to participate, the left-wing parties are expected to lose a big amount of seats. Even Azaña, the last Head of Government, has refused to lead the leftist list in Madrid, as it is expected to do very poorly, and has instead been given a place in Prieto's socialist list in Bilbao. Meanwhile, the communist PCE has been given a spot in the left-wing list in Málaga, a expected socialist stronghold."
 spain.306.a:0 "The future seems bleak for them"
 
 spain.307.t:0 "The Popular Front Campaign"
 spain.307.d:0 "The election is approaching, and the coalition between republicans, socialists, communists and syndicalists, the so-called \"Popular Front\" (a name that Azaña has never accepted) has begun organizing its campaign. Their program includes a grand amnesty for those imprisioned during the Revolution of 1934, the continuation of the reforms of the previous Azaña government, and some limited economic reform of centre-left inspiration. The republicans, IR and UR, have repeatedly rejected the socialists proposals, such as collective ownership of land and factories, or mass nationalizations. Regarding the new government that will be formed if the Popular Front wins, the socialists have refused to join it, agreeing to support a cabinet made up exclusively of republicans belonging to either IR, the leading force of the coalition, and UR. \n\nAs the CNT has refused to attack the Popular Front (unlike in the 1933 election), and the workers mobilize to stop the advance of fascism, this coalition is expected to gain a significant amount of seats, but will they gain enough votes to lead the new government?"
 spain.307.a:0 "¡Hay que acabar con el fascismo!"
 
 spain.308.t:0 "The Right-Wing Campaign"
 spain.308.d:0 "The dissolution of the Cortes has caught Gil-Robles and the CEDA off-guard, and they are clearly failing to form a strong coalition that can dispute the election to the Popular Front. In some provinces, the CEDA has formed joint lists with the centrists and what remains of the PRR, in others, they have chosen to coalition with the far-right. Meanwhile, Calvo Sotelo's monarchists, the Renovación Española, have formed their own National Bloc, that seeks to unite the right under his leadership; while the Falange has refused to join the rest of the right again and will present their own lists. These lack of unity can be seen in the right-wing rethoric, that focuses more on opposing the Popular Front rather than proposing new measures. Despite their ambitious campaign and the vast funding they have, the right will likely lose this election unless they shake things up."
 spain.308.a:0 "¡Por Dios y por España!"
 
 spain.309.t:0 "The Centrist Campaign"
 spain.309.d:0 "As the left and the right prepare themselves to clash in the ballot box, one man works desperately to prevent that from happening. That man is the Head of Government, Manuel Portela Valladares. A liberal politician, he used to participate in several cabinets during the constitutional monarchy period, when elections were manipulated from above, and he is determined to repeat that strategy in order to prevent an outright leftist or rightist majority. With the full support of President Alcalá-Zamora, Portela has created the National Republican Centre Party, and has begun to appoint new provincial governors in order to better control election results. He seeks to gain around 120 deputies, enough to form a government with the republicans and leave both the radical left and the right in the opposition. His enormous unpopularity, and the fact that it is much more difficult to manipulate elections now that it used to be, makes his goals almost impossible, but he is determined to do it."
 spain.309.a:0 "It seems hopeless..."
 
 spain.310.t:0 "The Regionalist Campaign"
 spain.310.d:0 "Political parties, left and right, have begun to join either the Popular Front, the CEDA-led coalition or even the weak centrists, hoping to gain a good amount of seats in the upcoming election. The regional parties are no exception. \n\nIn Catalonia, there are 2 main political forces. The right-wing Lliga, led by Cambó, has joined in a coalition with the CEDA and the monarchists, that will concur to the elections in Catalonia with the name \"Front Catalá de l'Ordre\" (Catalan Front of the Order). The Catalan left, led by Esquerra Republicana, has joined in a coalition as well, similar to the Popular Front, that will be named \"Front d'Esquerres\" (Left-Wing Front). This Catalan, leftist coalition seeks mainly to regain the autonomy that Catalonia lost in the Revolution of 1934, as well as the rest of the Popular Front program. \n\nIn the Basque Country, the Basque Nationalist Party, of conservative, clerical ideology, has decided to alone to the election, and they are expected to do well in Vizcaya and Guipúzcoa. Its leftist, anti-clerical counterpart, the Basque Nationalist Action (ANV) has joined the Popular Front lists. Overall, the Basque parties aim to approve their own Estatute of Autonomy, blocked by Lerroux, and to negotiate further concessions from the central government. \n\nIn Galicia, the local regionalist and nationalist movement has much less support among the population, but nevertheless the Galeguista Party is managing to steadily gain popularity. They have decided to join the Popular Front in their lists in Galicia, which has caused an split of the right wing of the party, that has formed the Dereita Galeguista (Galician Right). Although less organized and popular than Basques and Catalans, the Galeguistas seek to gain an Estatute of Autonomy of their own. \n\nIt is clear that the territorial policy will be something of great importance during the next Parliamentary term, and as the Popular Front embraces federalism, and the right denounces the \"destruction of Spain\", the electoral campaign continues..."
 spain.310.a:0 "Federalist or Centralism?"

 basque_aut.1.t:0 "The Basque autonomic plebiscite"
 basque_aut.1.d:0 "Here goes some info about the Estatuto de Estela, the Basque autonomy proposals in general, the positions of each party on the issue (Carlists, PNV, Socialists, Radicals...) and finally info about the referendum (I's objectives, how much the people support it, etc)."
 basque_aut.1.a:0 "Will the Basques finally get autonomy?"

 basque_aut.2.t: "Results of the Plebiscite"
 basque_aut.2.d: "The results of the Basque Autonomic Plebiscite have been counted! Participation has been very high, reaching more than 90% in both Guipuzcoa and Vizcaya while in Álava it reached 58.35%. The results by Circunscription are as follows:\n\n                         Favorable Votes (%)                   Adverse Votes (%)\nÁlava:                         46.40                                         11.94\nGuipuzcoa:                 89.52                                          1.46\nVizcaya:                      88.44                                          1.89\n\nThe people of Vizcaya and Guipuzcoa have overwhelmingly voted in favor of the auntomony estatute; while in Álava the favorable votes have not reached the majority of the census, most likely due to the opposition of the Carlists (Alava is a province that, like Navarre, has a lesser Basque nationalist identity due to the strong implantation of Carlism). Either way the referendum has passed, but the results in Álava will probably complicate things..."
 basque_aut.2.a: "Congratulations!"

 basque_aut.3.t:0 "Support the Basque statute of autonomy?"
 basque_aut.3.d:0 "Since the plebiscite was inconclusive in the Province of Álava it seems that the autonomic process has stalled quite a bit, which is good for us as we don't have any interest in voting it in parliament. However, we could take advantage of this situation to gain support of the PNV deputies in exchange of our support of the Basque statute of Autonomy; although our principal ally, the CEDA, and the Traditionalists won't like this decision at all and will probably opose it. What should we do?"
 basque_aut.3.a:0 "Make the offer to the PNV" 
 basque_aut.3.b:0 "Don't do it"

 basque_aut.5.t:0 "CEDA opposes our initiative"
 basque_aut.5.d:0 "It was almost midnight when the telephone at Lerroux's house rang. The old radical leader got up from his armchair and picked up the phone: on the other end was Gil-Robles, who as usual had an energetic and somewhat rushed way of speaking. He had called to inform that his group was totally and firmly opposed to the proposal to support the Basque statute of autonomy which Lerroux himself had promoted. This position was not at all unexpected since the CEDA had always been fervently against autonomy; yet Lerroux had hoped to convince him to accept, but after almost an hour of conversation on the phone the right-wing politician's position remained unchanged.\n\nWithout the support of the CEDA the radicals do not have enough seats to pass legislation on their own, having to resort to agreements and concessions with the Cedistas or risk paralyzing the Cortes. With this in mind, Lerroux had no choice but to give up and withdraw support for the Basque Statute."
 basque_aut.5.a: "Welp..."

 PNV_will_support_parliament_tt: "§GThe PNV will support most of our laws in parliament!§!"

 basque_aut.4.t:0 "Basque Autonomic process paralyzed!"
 basque_aut.4.d:0 "Today a Traditionalist Basque deputy in the cortes has proposed the exclusion of Álava from Basque autonomy, claiming that the necessary majority (50%) had not been reached in the referendum held on November 5 (precisely because of the opposition of the Carlists to the statute), which combined with the allegations of the traditionalists regarding possible irregularities in the plebiscite, has led to the temporal suspension of the autonomic process."
 basque_aut.4.a:0 "Oh no!, anyways..."
 
 SPR_join_dem_germany:0 "Alliance with Germany"
 spain.141.t:0 "Alliance with Spain?"
 spain.141.d:0 "We have comitted with the Spanish cause against Italy, and now we need to honour our promises. Should we accept Spain in our alliance?"
 spain.141.a:0 "Of course"
 spain.141.b:0 "Better to avoid conflict"
 
 spain.142.t:0 "Germany accepts our proposal"
 spain.142.d:0 "Honouring their promises, the Germans have accepted us in their alliance, and will assist us against Italy."
 spain.142.a:0 "That's great!"
 
 spain.143.t:0 "Germany refuses our offer!"
 spain.143.d:0 "The Germans have broken their promises and they have refused to let us into their alliance. We stand alone against Italy, for now."
 spain.143.a:0 "Outrageous!"
 
