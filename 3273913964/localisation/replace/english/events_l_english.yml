 spain.15.t:0 "A new fascist party"
 spain.15.d:0 "The son of the former dictator Miguel Primo de Rivera, José Antonio Primo de Rivera, has created a new political party, of fascist ideology, called \"Falange Española\". It seems that Spanish fascism is organizing itself..."
 spain.15.a:0 "Keep an eye on them"
 
 spain.16.t:0 "The PRR splits"
 spain.16.d:0 "Dissatisfied with Lerroux policy, the most progressive wing of the PRR led by Diego Martínez Barrio, has left the party and created its own: the PRD or Partido Radical Demócrata (Radical Democratic Party). This movement is a blow for Lerroux, but he keeps the government and most of his party loyal"
 spain.16.a:0 "Lerroux has been \"betrayed\" again"
 
 spain.17.t:0 "The creation of Unión Republicana"
 spain.17.d:0 "Today the PRD (Partido Radical Demócrata) and the PRRS (Partido Republicano Radical Socialista) have announced their unification into a new republican party: the Republican Union. Both have denounced the authoritarian tendencies of the right and of the socialists in the past, now proposing a union of republicans in the face of such threats.\n The socialist radicals have imposed an ideology very similar to that adopted by the PRRS years before, and the radical democrats, more pragmatic, have secured a majority in the organs of the new party. The nine-member executive committee of the party includes Gordón, Moreno Galvache, Pedro Sánchez Márquez and Fernando Valera; the historical founder of the PRRS, Benito Artigas, has been elected president of the national council which included two representatives from each province. This new party seems to be a breath of fresh air for Republican centrism."
 spain.17.a:0 "Interesting"
 
 spain.18.t:0 "Ramon y Cajal Dies"
 spain.18.d:0 "The famous cientist Santiago Ramón y Cajal, winner of the Nobel Prize in 1906 due to his neuro-science work, has passed away today in his house in Madrid. One of the greatest figures in our history has been lost."
 spain.18.a:0 "Descanse en Paz"
 
 spain.19.t:0 "A new catholic newspaper"
 spain.19.d:0 "Today, the catholic newspaper Ya! has published its first edition. The newspaper is likely going to be another platform for the right to attack the Republic, as they consider it 'godless'"
 spain.19.a:0 "Let them have their news..."
 
 spain.20.t:0 "Motion of Confidence"
 spain.20.d:0 "After the Casas Viejas incidents of january, the government seemed on the brink of collapse. However, it has passed the motion of confidence voted today in the Parliament. This however is only a temporary lifesaver of the government, as the vote has shown how divided the left is..."
 spain.20.a:0 "At least we won!"
 
 spain.21.t:0 "Renovación Española announces its programme"
 spain.21.d:0 "In a big act held today in Madrid, monarchist party Renovación Española has announced its political goals to their sympathizers. They seem to advocate for an absolute, corporate and catholic monarchy, and the complete derogation of the republican reforms. While the party itself is small, monarchism within the general staff could be dangerous..."
 spain.21.a:0 "Watch them closely!"
 
 spain.22.t:0 "The Birth of Izquierda Republicana"
 spain.22.d:0 "After their crushing defeat in the last elections, Azaña's republicans have decided to merge as many republican parties as they can, as the electoral law favours coalitions. Azaña's party (Acción Republicana) has joined the Galician Autonomous Republican Organization (ORGA) of Casares Quiroga, the PRRSI (Independent Radical Socialist Republican Party) of Marcelino Domingo and Álvaro de Albornoz, and other small parties such as the autonomous republican parties of Álava and Navarre, as well as part of the Federation of Republican Centers of Guipuzcoa; to form a new party known as Izquierda Republicana (Republican Left). This union makes a republican victory in the coming elections a likely scenario."
 spain.22.a:0 "Learn from your mistakes..."
 
 spain.23.t:0 "Election of 1936"
 spain.23.d:0 "The time has come. The Popular Front, a broad alliance of syndicalists, communists, socialist and republicans, stands against the coalition between the CEDA, what remains of the PRR and the liberal and centre-right minor parties. The left seems determined to win this time, and their defeat could lead to a bigger revolution than the one of 1934. On the other hand, the military is convinced that the Republic is ineffective, and if the people chose to 'vote wrong' they might try to seize power. The two Spains are facing eachother in this electoral showdown... Who will win?"
 spain.23.a:0 "The Popular Front!"
 spain.23.b:0 "The CEDA!"
 
 spain.24.t:0 "The Popular Front"
 spain.24.d:0 "The \"Republican Conjuction\" announced last year by IR, UR and the small, liberal PNR was not enough for Azaña, who wanted to include the Socialists in his coalition, as they were from 1931 to 1933. However, Largo Caballero demanded that if the PSOE joined the coalition, then the PCE, the POUM and the small Syndicalist Party would join in as well. Today IR, UR and the PSOE ( representing the PCE, the POUM and the PS ) have officially signed the agreement, after the National Republican Party of Felipe Sánchez Román left it, citing the Communist presence as unacceptable. Regionalist, left-wing parties such as the Catalan Republican Left, the Galeguista Party or the Basque Nationalist Action are expected to join this electoral pact, that has already been called \"The Popular Front\"."
 spain.24.a:0 "A new hope for the left"

 spain.25.t:0 "Formation of the CEDA"
 spain.25.d:0 "José María Gil-Robles, leader of Acción Popular, has founded today, in a grand rally, the Spanish Confederation of Autonomous Right. This new party, a result of the union of almost all right-wing parties in Spain, prioritizes the defense of catholicism and anti-socialism as its main values. In other things, such as republicanism, they are split in right-wing and moderate wings. The formation of this party greatly reinforces the right."
 spain.25.a:0 "The right unites"

 spain.26.t:0 "Municipal Elections"
 spain.26.d:0 "Today municipal elections were held in almost all cities in Spain. Although republicans maintain their majority in most of the major cities, the right has advanced in almost all regions."
 spain.26.a:0 "Worrisome" 
 
 spain.27.t:0 "Political Violence"
 spain.27.d:0 "The elections of february were both the result and the catalyst for the political polarization of the spanish society. With extremists groups becoming bigger, the number of violent incidents started by falangists, anarchists and other extremist militias has severly increased. Leaders of both the far-right and the far-left are even demanding a civil war so they can finally purge the other. This civil war is becoming more likely as days pass..."
 spain.27.a:0 "Spain is suffering"
 
 spain.28.t:0 "Remove Alcalá-Zamora?"
 spain.28.d:0 "President Niceto Alcalá-Zamora is a staunch republican, but he is also very catholic and opposes the newly elected Popular Front government. Azaña is not fond of the President either, so some left-wing deputies have proposed to get rid of Alcalá-Zamora and elect a new President. In order to do that, we need to something against him, and we luckily we have it. When Alcalá-Zamora dissolved the Cortes in December, the right, angry about losing their majority, called the move illegal. Now we can agree with the right and use the lack of legality of this dissolution to remove the President. However, some fear this might bring uneccesary instability to the Republic, as Alcalá-Zamora's term ends in only one year..."
 spain.28.a:0 "He needs to go"
 
 spain.280.t:0 "The Parliament votes to remove Alcalá-Zamora"
 spain.280.d:0 "As expected, the Parliament as overwhelmengly voted against President Alcalá-Zamora. The right couldn't forget how he disssolved the Cortes elected in 1933, in which they had a majority; the centre was upset with the President due to the appointment of Azaña as Head of Government, and the left was eager to remove the conservative catholic from power. President of the Cortes [SPR_president_cortes] will now become the provisional President, until a new one is elected. Manuel Azaña has shown interest in the position, and his election seems certain."
 spain.280.a:0 "He won't oppose us now"
 will_remove_zamora:0 "§YWe will begin the Parliamentary process to remove President Alcalá-Zamora!§!"
 
 spain.281.t:0 "Manuel Azaña elected as President"
 spain.281.d:0 "Manuel Azaña, the current Head of Government and the leading figure of left-wing republicanism, has been elected today as President of the Republic. In a session held in the Retiro Park, the compromisarios have voted overwhelmengly in favour of Azaña, with 754 votes in favour out of a total of 847. The CEDA has abstained, but otherwise every party, from the communist PCE to the conservative republicans of the PRC have voted for him. He will now become the 2nd President of the Spanish Republic, after the provisional presidency of [SPR.GetLeader]."
 spain.281.a:0 "Now we'll need a new Head of Government!"
 
 spain.29.t:0 "The New Government"
 spain.29.d:0 "With Azaña appointed Head of State, we must choose a new head of government. Thre are two options: The left-wing republican Casares Quiroga, friend of Azaña; and the formation of a new coalition with the support of the centre and the centre-left to avoid the ire of the right; that would be lead by moderate republican Martínez Barrio. Who we'll choose?"
 spain.29.a:0 "Quiroga will preserve the status quo!"
 
#  spain.46.t:0 "UGT vs CNT"
#  spain.46.d:0 "After extending union rights, the UGT and the CNT are competing for power. The latter is anarcho-syndicalist and violent, while the UGT is more moderate. What should we do?"
#  spain.46.a:0 "Collaborate with the UGT to crush the CNT!"
#  spain.46.b:0 "Ban both!"
 
#  spain.47.t:0 "CNT crushed"
#  spain.47.d:0 "Unable to compete with the UGT and the government at the same time, the CNT has been disarmed, and has lost a lot of affiliates after a brutal propaganda campaign. Anarchism has been defeated, and the UGT is now friendly to the government."
#  spain.47.a:0 "Perfect!"
 
 spain.57.t:0 "Military plot uncovered!"
 spain.57.d:0 "Loyal elements in the army have informed us about an ongoing plot to oust the government! General Mola, the head of the conspiracy, has managed to flee, but other high ranking conspiirators such us General Goded have been arrested. The question is: what to with the plotters?"
 spain.57.a:0 "Our independent judiciary will handle this!"
 spain.57.b:0 "Execute them!"
 
 spain.60.t:0 "Fascist Unification"
 spain.60.d:0 "The two fascist organizations, Falange and the national syndicalists of the JONS, have joined today forming the FE-JONS. Fascism is growing under our noses..."
 spain.60.a:0 "They are still very small"
 
 spain.61.t:0 "Occupation of Ifni"
 spain.61.d:0 "Although Ifni was recognized by the french as spanish territory long ago, it was yesterday when spanish soldiers took possesion of the place. The spanish flag flies over another city."
 spain.61.a:0 "Long live Spain! Long live the Republic!"
 
 spain.62.t:0 "The Aznalcóllar Events"
 spain.62.d:0 "3 days ago, (on the 29th of April) a group of four Falangists came to Aznalcóllar to sell and disseminate their ideological magazine ARRIBA. Apparently these Falangists were met by a group of leftists, which inevitably led to a heated argument between the two groups, resulting in the stabbing of the Falangist Adrián Iruzta. The next day 20 Falangists came to continue selling their magazine. A two-hour fight ensued in which, due to a stone in the head, the Falangist Manuel García Míguez, a Galician immigrant and industrial expert, fell to the ground and was shot at point-blank range. The leftist who shot the Falangist also died in the same confrontation. The final result was two dead and five wounded. The leftist gang somehow managed to drive the fascists out of the Sevillian town, the latter retreating to Sanlúcar la Mayor, where they were arrested and imprisoned by the authorities.\n\nThe first session of the trial was held today, where the actual leader of the Falange, José Antonio Primo de Rivera, presented himself as defense attorney for the Falangists. They are charged with manslaughter, and the prosecutor has already asked for 14 years in prison for each of them."
 spain.62.a:0 "Damned Fascists"
 
 spain.63.t:0 "Vuelta a España 1935"
 spain.63.d:0 "Yesterday ended the first Tour of Spain in bicycle, with belgian Gustaf Deloor ending in first place. Let's hope the event is repeated next year!"
 spain.63.a:0 "Cheers!"
 
 spain.64.t:0 "Engineering Schools Strike"
 spain.64.d:0 "In protest for our new Surveyors Law, the engineering schools have started an strike, to denounce that the government tries to limit their freedom."
 spain.64.a:0 "The law passes!"
 
 spain.65.t:0 "Day of the Republic"
 spain.65.d:0 "Today, 14th of April, is the anniversary of the proclamation of the Second Spanish Republic back in 1931. That day, the people of Spain took the streets and celebrated their newly earned freedom, and is our duty to protect it."
 spain.65.a:0 "¡Viva la República!"
 
 spain.66.t:0 "Federico García Lorca - Llanto por Ignacio Sánchez Mejías"
 spain.66.d:0 "One of the greatest poets of Spain, Federico García Lorca, has published today his new poem book. The theme is the lament for the death of his friend, the writer and bullfighter Ignacio Sánchez Mejías, who died last year due to an injury caused by a bull. The poems, as usual in this author, are very passionate and full of feelings, although some despise him due to his homosexuality."
 spain.66.a:0 "We all love our poets!"
 
 spain.100.t:0 "Peace at last!"
 spain.100.d:0 "Finally, it seems that peace has returned to Spain. Our negotiations have payed off, and we now look towards a bright, democratic, future."
 spain.100.a:0 "Viva la Democracia!"
 
#  spain.67.t:0 "Innauguration Speech"
#  spain.67.d:0 "Gil-Robles was sworn in today as head of government, and he is about to make his first speech to the Parliament as President of the Council of Ministers. What will he say?
#  spain.67.a:0 "An integrating speech!"
#  spain.67.b:0 "An agressive speech!"
 
#  spain.69.t:0 "An offer from Prieto"
#  spain.69.d:0 "Surpising news! Prieto has offered Gil-Robles a deal to preserve peace. He demands more worker rights and the reaffirmation of the labour laws passed under the social democrat government, and they also have a strange demand: they want the CNT to be crushed, as that organization cannot be trusted. In exchange, they will calm the masses and disarm their militias. What should we do?"
#  spain.69.a:0 "That's a reasonable offer"
#  spain.69.b:0 "We don't obey socialist rabble"
 
#  spain.71.t:0 "Prieto speaks against the CNT"
#  spain.71.d:0 "In a socialist meeting held today, Prieto has denounced the CNT as 'violent fascistic collaborators' and he called for 'cutting ties with this dangerous movement'. CNT delegates, visibly surpised, have said that the socialist have some kind of agreement with the government..."
#  spain.71.a:0 "...and they are right"
 
#  spain.72.t:0 "Operation Lepanto"
#  spain.72.d:0 "The time has arrived! The police and the army are ready to crush the CNT once and for all! ¡Por España y por la República!"
#  spain.72.a:0 "Attack!"
 
#  spain.73.t:0 "The Battle of Zaragoza"
#  spain.73.d:0 "Bad news! The anarchists are resisting the attacks of General Cabanellas in Zaragoza. It seems they "
#  spain.73.a:0 "Retreat and wait"
#  spain.73.b:0 "Send more men! Crush them"
 
#  spain.74.t:0 "Victory in Zaragoza"
#  spain.74.d:0 "Success! The additional men sent to Zaragoza managed to break the anarchist militias, executing Durruti and eliminating the last hold of CNT resistance. Peace has returned!"
#  spain.74.a:0 "¡Viva España y viva la República!"
 
 spain.76.t:0 "A General Strike"
 spain.76.d:0 "The arrival of Gil-Robles to power was regarded by the left as an attempt to install fascism, and resistance is growing in the streets day by day. The CNT-FAI and UGT have declared a general strike all across the country. There have been reports of insolated uprisings of socialist protesters in several small cities and towns, while in the big cities there has been a considerable resistance against police forces, which have been unable to disperse the massive amount of protesters. If we don't repress all this nonsense quick enough it could escalate into a full-blown revolution!"
 spain.76.a:0 "Declare the State of War!"
 
 spain.77.t:0 "Formation of leftist militias"
 spain.77.d:0 "The disorganized leftist revoltershave begun to form organized groups with clear objectives and leadership. Several militias have assaulted banks, churches and police stations in hit-and-run attacks throughout the country, with the assualt guard and the civil guard being unable to fully roout them out. "
 spain.77.a:0 "This is not good..."
 
 spain.78.t:0 "Militias seize arm depots!"
 spain.78.d:0 "The number of political killings is rising day by day, but yesterday the violence reached new heights: an ammunitions park was assaulted, the men killed and the ammunition and weapons seized by a mixture of CNT and PSOE militias. Militarymen are outraged and several prominent leftists are being randomly arrested and even executed by military units."
 spain.78.a:0 "Uh oh..."
 
 spain.79.t:0 "1937 Presidential Election"
 spain.79.d:0 "Alcalá-Zamora's term is over, and a new President has to be elected. There are three main candidates: the conservative republican Miguel Maura, backed by incumbent Alcalá-Zamora and most of the right, the well-known republican Manuel Azaña, who has the support of the left, and the 'conciliatory' candidate, Diego Martínez Barrio, who enjoys the support of a confusing coalition of centrist parties. Who shall win?"
 spain.79.a:0 "Miguel Maura!"
 spain.79.b:0 "Diego Martínez Barrio!"
 spain.79.c:0 "Manuel Azaña!"
 spain.79.e:0 "Álvaro de Albornoz!"
 
 spain.80.t:0 "1942 Presidential Election"
 spain.80.d:0 "After 6 years of Presidency, Manuel Azaña's term is over and a new President has to be elected. There are three main candidates: the conservative republican Miguel Maura, supported by most of the right and widely respected as one of the fathers of the Republic; the centrist Diego Martínez Barrio, who promises that he will be an impartial President and is supported by the centrist parties; the radical leftist Álvaro de Albornoz, who is supported by the Socialists and finally the republican José Giral, who promises to continue building on the legacy of Manuel Azaña. Who will win?"
 spain.80.c:0 "José Giral!"
 
 spain.81.t:0 "1937 Parliamentary Election"
 spain.81.d:0 "After these intense four years, the Parliament has completed its first full term since the proclamation of the Republic, and it is time for another election, this time with a more calmed society. There are three main coalitions: The conservative-republican coalition between the Conservative Republican Party and the CEDA, the centrist Alianza Centrista Republicana led by Manuel Portela and Joaquín Chapaprieta, and finally the IR-UR republican coalition led by Manuel Azaña and Diego Martínez Barrio. Who shall lead Spain in the next 4 years?"
 spain.81.a:0 "The IR-UR coalition!"
 spain.81.b:0 "The ACR!"
 spain.81.c:0 "The CEDA-PRC coalition!"
 
 spain.82.t:0 "1940 Parliamentary Election"
 
 spain.83.t:0 "1943 Presidential Election"
 spain.83.d:0 "The current President's term has ended, and a new one must be elected. Who shall be elected?"
 spain.83.b:0 "The centrist Manuel Rico!"
 
 spain.200.t:0 "Elections Cancelled"
 spain.200.d:0 "The President has issued today an emergency decree, cancelling the scheduled elections because of the war. Political parties understand and support this decision."
 spain.200.a:0 "We'll vote after we win!"
 
 spain.201.t:0 "1941 Parliamentary Election"
 spain.201.d:0 "Four years have passed, and it is time for the spanish people to renovate the Parliament and the Government. There are three main coalitions: The conservative-republican coalition between the Conservative Republican Party and the CEDA, the centrist Alianza Centrista Republicana, and finally the IR-UR republican coalition. Who shall lead Spain in the next 4 years?"
 
 spain.202.t:0 "Presidential Election of 1948"
 spain.202.d:0 "The current President's term has ended, and a new one must be elected. Who shall win?"
 spain.202.b:0 "The centrist Clara Campoamor!"
 spain.202.c:0 "The socialist Indalecio Prieto!"
  
 spain.207.t:0 "The new President of the Parliament"
 spain.207.d:0 "Today the new Cortes have been constituted, and so congress must choose the new President of the Parliament. All deputies have already casted their vote, and the winner is..."
 spain.208.c:0 "Marcelino Domingo (IR)"
 spain.207.a:0 "Santiago Alba Bonifaz (PRR)"
 spain.207.b:0 "Rafael Guerra del Río (PRR)"
 spain.207.c:0 "Luis Lucia Lucia (CEDA)"
 spain.208.a:0 "Diego Martínez Barrio (UR)"
 spain.208.b:0 "Álvaro de Albornoz Liminiana (IR)"
 spain.208.f:0 "Miguel Maura Gamazo (PRC)"
 spain.208.g:0 "José Duato Chapa (CEDA)"
 spain.208.h:0 "Juan Pujol Martínez (CEDA)"
 spain.130.a:0 "Fernando de los Ríos Urruti (PSOE)"
 spain.130.b:0 "Marcelino Domingo Sanjuán (IR)"
 spain.130.c:0 "Manuel Blasco Garzón (UR)"
 spain.130.e:0 "Manuel Becerra Fernández (PCNR)"
 spain.130.f:0 "Nicasio Velayos Velayos (PAE)"
 spain.130.g:0 "Cándido Casanueva Grojón (CEDA)"
 spain.130.h:0 "Juan Torres Sala (CEDA)"
 spain.131.a:0 "Rodolfo Llopis Ferrándiz (PSOE)"
 spain.131.b:0 "Antonio Velao Oñate (PSDR)"
 spain.131.c:0 "Fernando Valera Aparicio (PSDR)"
 spain.131.e:0 "Luis Bardají López (PLD)"
 spain.131.f:0 "Pedro Matutes Noguera (PLD)"
 spain.131.g:0 "Antonio Arnedo Monguilán (PPR)"
 spain.131.h:0 "Jesús Pabón (PPR)"
 
 spain.101.t:0 "Spain asks for support"
 spain.101.d:0 "[SPR.GetNameDef] seems determined to put an end to the Italian regime, but they are too weak to do that on their own. They have asked us, as the democracy that we are, to support them in their fight against fascism. Of course, this request is absolutely absurd and much of the military and the cabinet have rejected such idea."
 spain.101.a:0 "We'll stand against fascism, no matter what!"
 spain.101.b:0 "No thanks"
 
 spain.102.t:0 "Britain gives us support"
 spain.102.d:0 "Great News! The United Kingdom has accepted to support us in our campaign against Italy. They will provide some limited assistance during a war with Italy."
 spain.102.a:0 "That's great!"
 
 spain.103.t:0 "Britain refuses to give support"
 spain.103.d:0 "The British Foreign Ministry has refused to support us in any war against Italy. They claim that the United Kingdom wishes to not be involved in any imperialistic warmongering, and that if we engage in a war of aggression against any nation there will be international consequences for us, the bad type of consequences."
 spain.103.a:0 "Sounds like a threat"
 
 spain.105.t:0 "France gives us support"
 spain.105.d:0 "The French Republic has accepted to support us in our campaign against Italy. They will provide some assistance during our war preparations, and they are open to enter the war if we ask them."
 
 spain.106.t:0 "France refuses to give support"
 spain.106.d:0 "It appears that [FRA.GetNameDef] has refused any support of our cause. Apparently they didn't like our insinuations and have warned our diplomats that any possible war of aggression provoqued by the Spanish government will be met will international condemnation. They themselves will be the first to impose sanctions on us."

 ENG_gave_support_on_ita: "The UK supported us in our pretensions"
 FRA_gave_support_on_ita: "France supported us in our pretensions"
 
 spain.111.t:0 "Liberating Portugal"
 spain.111.d:0 "We have finally taken down the evil Portuguese regime, and now, as we promised, it is time to create a new, free, Portuguese Republic, more open to our interests."
 spain.111.a:0 "Another country liberated"
 
 spain.112.t:0 "Spain requests military aid"
 spain.112.d:0 "Recently the president of the Spanish Republic himself has held a surprise meeting with our embassador in Barcelona about a very urgent topic. After a long discussion our embassador has sent a telegram to London informing about the requests of the President: after consultation and aproval of the republican war cabinet, they formally request us to send military aid to the Spanish Republic. They argue that since we are at war with a fascist power and they are currently fighting a war with fascism in their own country, we could join forces and mutually support eachother against such threats. That would involve, of course, to violate the Non-Intervention Agreement.\nIt's not clear if the nationalists would join the war against us any time soon, even if they win the civil war, so to our alliance there is no strategic benefit in helping them win their civil war; in fact it would fource us to divert men and resources away from the main threat, which could be fatal. On the other hand, the british and french publics are more synpathetic to the republican cause now that we are at war with Germany, refusing to help them (again) could cause political backlash at home. What should be our response?"
 spain.112.a:0 "We will help you."
 spain.112.b:0 "Sorry but no."
 
 spain.113.t:0 "The British response"
 spain.113.d:0 "Good news! The British have accepted our request of military aid. After much deliberation their cabinet has agreed to send military forces to help us win the war as quickly as possible, before the Germans can pose any meaningful threat of invasion. With our joint forces we shall defeat fascism!"
 spain.113.a:0 "Hurra!"
 
 spain.114.d:0 "Bad news! The British have rejected our request of military aid. They argue that helping us would not only divert precious men and resources from their main military opponent, but also that winning the war in Spain would not bring any strategic benefit for their alliance, as they belive the Nationalists don't pose any military threat and probably won't attack them.\nOnce again we are abandoned by the idiocy and selfishness of the western powers, who prefer to let democracy die at the hands of fascists and reactionaries if that means saving up on resources. They do not realize that with that strategy, they themselves could be the next to fall."
 spain.114.a:0 "Traidores!"
 
 spain.115.t:0 "Spain wants to join our alliance"
 spain.115.d:0 "Feeling threatened by european powers, the Republic of Spain has asked for a military alliance between our two countries. Such an alliance would secure the southern border and strengthen our position in Africa and the Mediterranean, however, they could drag us into unnecessary wars. Shall we accept?"
 spain.115.a:0 "Of course!"
 spain.115.b:0 "Too risky"
 
 spain.116.t:0 "[FROM.GetNameDef] accepts"
 spain.116.d:0 "Good news! The [FROM.GetAdjective] have accepted, and now we are officially part of their alliance."
 spain.116.a:0 "We are safer now"
 
 spain.117.t:0 "[FROM.GetNameDef] rejects an alliance with us"
 spain.117.d:0 "Bad news! [FROM.GetName] has rejected our offer for an alliance. We'll have to search for another partner."
 spain.117.a:0 "Never trust the [FROM.GetAdjective]"
 
 spain.118.t:0 "Spain asks for support for their airforce"
 spain.118.d:0 "Our allies in the Spanish Republic are asking for some material and doctrinal expertise that can help them setting up their airforce. We could send some of our designs, engineers and pilots to help them in their mission of controlling the Iberian skies..."
 spain.118.a:0 "Sure, why not?"
 spain.118.b:0 "We have better things to focus on"
 
 spain.119.t:0 "The Americans Response"
 spain.119.d:0 "Great news! The US has accepted to send some planes and pilots to support our nascent airforce. Now we have to focus on destroying our enemies on the skies!"
 spain.119.a:0 "That's good"
 
 spain.120.t:0 "The Americans Response"
 spain.120.d:0 "Bad news! The Americans have refused to provide support for our airforce, for reasons that are not clear yet. We are on our own."
 spain.120.a:0 "Vaya..."
 
 spain.121.t:0 "Meeting with Fal Conde"
 spain.121.d:0 "After the invasion and the occupation of our country, carlist militias reorganized and began to fight back in Navarra and the Basque Country, clashing against both the occupation forces and the other resistance militias. However, their lack of organization has led to several arrests and the near dismantlement of their militias. The carlist Manuel Fal Conde has accepted to participate in a National Revolt if we arm his militias and promise them control over Navarra. In exchange, they'll stop clashing with leftist militias..."
 spain.121.a:0 "We need these men!"
 
 spain.122.t:0 "Meeting with Cipriano Mera and Valentín González"
 spain.122.d:0 "The anarchist Cipriano Mera is the leader of the MRPE, Milicias de Resistencia Popular Española, an anti-stalinist, leftist militia group that is fighting the occupation forces in Catalonia, Aragon and Valencia. He has agreed to join our planned uprising, but there was still one problem: the MOP ( Milicia Obrera Patriótica ), the communist militia, led by Valentín González. After a heated debate, both organizations have agreed to support the uprising, citing the need to kick out the fascists as the only thing they have in common."
 spain.122.a:0 "Their support is very much welcome!"
 
 spain.123.t:0 "Revolt in Spain!"
 spain.123.d:0 "Our garrison forces in the Iberian Peninsula have been warning about increased Resistance activity for some time, but we ignored them and the result is here. At the behest of the exiled Republican Government, the carlists, the anarchists, the communists and even some disillusioned falangists have organized their militias and seized some key cities of Spain. We need to crush this rebellion quickly or our enemies might invade us through Iberia..."
 spain.123.a:0 "How could this happen?!"
 
 spain.124.t:0 "The Revolution has been crushed!"
 spain.124.d:0 "Our brave troops have managed to quell the Asturian revolt, bringing an end to the socialist Revolution. Now we must deal with the aftermath of the revolt: the status of the Socialist Party, the imprisioned and fired workers, and the polarization and fear this eruption of violence has caused."
 spain.124.a:0 "Victory!"
 
 spain.125.t:0 "Dissolution of the Cortes"
 spain.125.d:0 "4 years have passed since the last General Election, and following Article 53 of the Constitution, President [SPR.GetLeader] has dissolved the Cortes and called for a new Election. To oversee the legislative power until the new Cortes are constitued, the \"Permanent Deputation\" has been assembled, with deputies from the biggest political parties. It will act as a Parliament until the one is formed, which according to the Constitution will be around 30 days after the elections."
 spain.125.a:0 "The election campaign begins!"
 
 spain.132.t:0 "Alcalá-Zamora Dissolves the Cortes"
 spain.132.d:0 "Portela's government has failed to gather any significant parliamentary support. A while ago the CEDA called for a motion of no-confidence and the appointment of Gil-Robles as Head of Government, with the deadline for the house of representatives to dictate is supposed to end today. Alcalá-Zamora, realizing that Portela lacks support and the only alternative is a CEDA-led government, has dissolved the Cortes and called for a General Election, scheduled for February 16th. The left is probably going to unite, while Portela is trying to build up a centrist party that can be a kingmaker between the left and the right..."
 spain.132.a:0 "Elections are coming!"
 
 spain.133.t:0 "Second Portela Government"
 spain.133.d:0 ""
 spain.133.a:0 "Ok"
 spr_cortes_closed:0 "§RParliament will be closed for 30 days§!"
 
 spain.134.t:0 "Permanent Deputation Plots to Oust Government"
 spain.134.d:0 "Right-wing deputies demand a meeting of the Permanent Deputation on January 2 to oust the new government. The Permanent Deputation is convened on January 7 to rule while Parliament is out of session."
 spain.134.a:0 "Oh no..."
 
 spain.135.t:0 ""
 spain.135.d:0 ""
 spain.135.a:0 ""
 
 spain.138.t:0 "Andalusian Autonomy Assembly"
 spain.138.d:0 "After the approval of the Catalan Estatute of Autonomy, many regions have begun to draft their own. Today the Assembly of Andalusian Autonomy has ended in Córdoba, where representatives from most Andalusian provinces have approved the Bases for their own Estatute. However, although the proposal was approved, the small number of voters have disillusioned the Andalucista movement and its leader, Blas Infante. Despite this, the movement for Andalusian Autonomy goes on."
 spain.138.a:0 "Everyone wants autonomy?"
 
 spain.139.t:0 "A Proposal from Spain"
 spain.139.d:0 "The Spanish Ambassador has handed today a proposal from their foreign ministry to our President [ROOT.GetLeader]. They are proposing an economic agreement between our nations, that would facilitate trade, investment and knowledge exchange between our countries. Offers have also been sent to Portugal and other Latin American countries, as the Spanish Republic seeks to create an \"Ibero-American Economic Cooperation Treaty\" that brings prosperity to both sides of the Atlantic. Should we agree?"
 spain.139.a:0 "It will be beneficial for both nations!"
 spain.139.b:0 "It would be better for us to refuse"
 spain_rightist:0 "Rightist"
 spain_rightist_desc:0 "This general has sympathies towards the political right."
 
