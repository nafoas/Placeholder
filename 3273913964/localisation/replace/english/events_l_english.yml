 occupation.85.t:0 "Offer Italy Land"
 occupation.85.d:0 "ENTER CONTEXT HERE"
 occupation.85.a:0 "Grant the land to those pesky Italians."
 occupation.85.b:0 "No, it's our land."

 occupation.86.t:0 "Offer Übermurgebiet to Hungary?"
 occupation.86.d:0 "Now that Yugoslavia has fallen and our armies occupied the lands known as 'Slovenia' one question remains: what to do with Übermurgebiet (Prekmurje). The Hungarians have been claiming Übermurgebiet since it was stripped from them in the treaty of Trianon and would probably want it back. Although they did not participate in the invasion of Yugoslavia, they are friendly to our regieme and we don't really need Übermurgebiet for nothing; we could cede them the strip of land as a sign of friendship and collaboration. We could also not do that and keep the land to ourselves, what should we do?"
 occupation.86.a:0 "Give it back to Hungary."
 occupation.86.b:0 "It stays with us."

 occupation.87.t:0 "Germany offers Muravidék"
 occupation.87.d:0 "Amaizing news have come out today from the German embassy in Budapest! [GER.GetNameDef] has decided to cede us Muravidék (Prekmurje) as a sign of friendship and collaboration with our regieme, despite us not entering the war against Yugoslavia. Although the Germans haven't given any condition to this increible gift, it's obvious they will try to use it to ask us a favour in the future, forcing our hand to do what they want. But nevertheless its a gift we should not refuse. "
 occupation.87.a:0 "Nagyon köszönöm!"

 occupation.88.t:0 "Yugoslavia's Fate"
 occupation.88.d:0 "ENTER CONTEXT HERE"
 occupation.88.a:0 "Let's sign the new treaty."

 occupation.89.t:0 "The Fate of Dubrovnik"
 occupation.89.d:0 "ENTER CONTEXT HERE"
 occupation.89.a:0 "It's rightful Croatian land."
 occupation.89.b:0 "Dubrovnik belongs to Serbia."
# End of yug event chain
 
 occupation.90.t:0 "The Occupation of the Siberian Far East"
 occupation.90.d:0 "The Siberian Far East is now under our control. Should we release it as a puppet?"
 occupation.90.a:0 "Yes, of course!"
 occupation.90.b:0 "No, it must be completely occupied by our forces."
 
 occupation.91.t:0 "A New Government for Eastern Siberia?"
 occupation.91.d:0 "Now that Far Eastern Siberia is under imperial control, we must decide on what government to install there. The Army recommends Oi Shigemoto, a politician and retired General. During our intervention in the Russian Civil War, Baron Shigemoto rose to command the Vladivostok Expeditionary Force, and would thus better acclimate to ruling over the largely Russian population. The Army is confident that Baron Shigemoto would competently ensure that Imperial interests are being served in the region.\n\nHowever, other government members recommend that we send a former Russian citizens to rule the territory to appease the population. Some recommend Nikolai Gondatti, a Russo-Italian nobleman and politician from the Tsarist era. This former Governor of Amur led Russia during the fight with the Bolsheviks, and has been working in Harbin ever since. His supporters note that he has some level of popularity among the Russian emigrants, and his statesmanship was highly praised by the Russian Imperial Government.\n\nOur final choice is Nikolai Volodchenko, a former General of the Imperial Russian Army. Though he fought against Japan in 1905, he has lived in Harbin as a journalist since the Bolsheviks took over. Advocates for his governorship say that he would be able to raise a decent enough army to defend the frontier without wasting  Japanese resources. Others have concerns that as a Russian general, he may harbor anti-Japanese sentiments. In the end, it is up to us to choose..."
 occupation.91.a:0 "Baron Shigemoto will serve our interests!"
 occupation.91.b:0 "Governor Gondatti shall rule well!"
 occupation.91.c:0 "General Volochenko can rally the people!"

