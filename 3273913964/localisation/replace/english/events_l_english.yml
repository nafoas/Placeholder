 china.1.t:0 "The Marco Polo Bridge Incident"
 china.1.d:0 "Japanese soldiers recently launched an attack on the strategic Marco Polo Bridge just south of Beijing, but they were repelled by our brave soldiers. No doubt this is an orchestrated event aimed at placing blame on us and forcing us to surrender more territory - just like the Mukden Incident when the Japanese invaded Manchuria. \n\nHow should we respond?"
 china.1.a:0 "We have reached the breaking point!"
 china.1.b:0 "We can ill afford a war with Japan."
 china.2.t:0 "Germany Withdraws Advisors"
 china.2.d:0 "Germany has caved in to Japanese diplomatic pressure, and decided to withdraw their military advisors from our country! Von Falkenhausen promised at a farewell dinner that he would not reveal any of our battle plans to the Japanese, but the end of German support is sure to hurt our military."
 china.2.a:0 "We will have to make do without them."
 china.3.t:0 "Poor Sino - German Relations"
 china.3.d:0 "Our deteriorating relationship with Germany has resulted in them recalling all of their military advisors from our country."
 china.3.a:0 "Chinese officers will finish what they started!"
 china.4.t:0 "Military Advisors Detained"
 china.4.d:0 "As we are now in a state of war with Germany, all of their military advisors that were present in our country have been detained. Von Falkenhausen and a few of his cronies managed to elude our grasp, and have returned to Europe!"
 china.4.a:0 "Good riddance!"
 china.5.t:0 "Cornered No More"
 china.5.d:0 "The Red Army once survived in a state of what seemed like hopelessness, but since the Long March several years back, the tide has slowly turned. With significant territorial advances, our role as an underdog is a thing of the past. Having fought through this time of struggle, our desperation is now behind us. Mao Zedong has gone from guerrilla army leader to chairman."
 china.5.a:0 "Long live the People's Republic!"
 china.6.t:0 "Preparing Attack Against Communists"
 china.6.d:0 "After the long retreat of the Communist Party of China's Red Army, they have managed to regroup and establish themselves in Shaanxi. Their continued effort to turn the rural population against us and seek support from the Soviet Union suggest that they might grow more powerful if left to their own devices. However, many of the surrounding warlords, despite supporting our government, are unwilling or unable to make the necessary sacrifices for an effective attack.\n\nIt's currently unclear whether the Red Army is still recuperating or ready to face us in battle, but time is not on our side. To strengthen our political position, we need to strike against the communists."
 china.6.a:0 "Strongarm local warlords into the offensive."
 china.6.b:0 "Recruit local outlaws to fight for us."
 china.6.c:0 "Rely on local volunteers who oppose the communists."
 china.6.tt:0 "§YIf the PRC chooses to confront the attack:§!\n"
 china.6.tt_2:0 "§YIf the PRC chooses to retreat:§!\n"
 china.7.t:0 "Kuomintang Launch Offensive"
 china.7.d:0 "Although we have escaped certain defeat through the Long March, the nationalists are not planning to let us grow stronger without more confrontations. Our spies suggest they are mounting an offensive against us, which could weaken our political support if we try to retreat further.\n\nWe don't know how committed the Kuomintang are to pushing us back right now. Trying to confront them carries significant risks. If the local warlords have been rallied to support the attack, our chances may be slim. On the other hand, retreating now when we have finally stopped may not be an option."
 china.7.a:0 "Confront the attack with whatever means we can afford!"
 china.7.b:0 "Retreat into isolation."
 china.8.t:0 "Communists Retreat"
 china.8.d:0 "Discovering our planned offensive through their local spy network, the CPC have withdrawn their Red Army further into Shaanxi. Although this deprived us of the opportunity to further weaken their numbers, this has shown that the communists are not ready to confront us, despite what their propaganda says. To some extent, the effort has still worked to our benefit."
 china.8.a:0 "Cowards!"
 china.9.t:0 "Victory Against Communists"
 china.9.d:0 "Our commitment to routing the Red Army has been successful, at least for now. Despite gaining information about the attack, the communists decided to confront our forces and lost. They have now been forced to withdraw further and many of the locals have grown skeptical of their ability to deliver on their promises of overthrowing our government."
 china.9.a:0 "And rightly so!"
 china.10.t:0 "Communists Repel Attack"
 china.10.d:0 "Having gained information about our plans to launch an offensive beforehand, the Red Army was prepared and confronted our attack. The troops we had managed to assemble in this area, where our power base is weak, were insufficient to defeat the communist forces. \nSadly, the attack has been turned against us and seen as a sign of the Red Army's recovery after their long retreat."
 china.10.a:0 "It won't help them in the long run."
 china.11.t:0 "Defeat Against the Kuomintang"
 china.11.d:0 "Despite our best efforts to repel the attack of locally assembled troops supporting the nationalist government, our preparations were insufficient to stop it. With significant losses, we have been forced into a new retreat, albeit shorter.\n\nConfronting the nationalists before we had fully recovered may have been a mistake. Our magnificent recovery in the Long March instilled hope in our supporters, but now, seeds of doubt have been sown."
 china.11.a:0 "We will recover and win the faith of the people again."
 china.12.t:0 "Victory Against the Kuomintang"
 china.12.d:0 "Challenging the Kuomintang offensive has worked in our favor. The locally assembled troops sent to confront the Red Army were not prepared for our knowledge of the impending attack and were defeated, all serving as a warning to nearby warlords that attacking us can be costly. \n\nThe nationalists have only proven that they underestimate us as a foe, and that the People's Republic is once again on the rise."
 china.12.a:0 "Political Power grows out of the barrel of a gun."
 china.13.t:0 "Clash with Communist Guerrillas"
 china.13.d:0 "With both us and the Chinese Red Army barely having recovered from our previous offensive, our mutual troop presence close to the border has reignited the conflict. In addition to the local warlords and militias, we have considered moving in more troops from elsewhere.\n\nAlthough this may not give us opportunity to crush the communist menace once and for all, it would be an important ideological victory to show that they will not be allowed to expand further."
 china.13.a:0 "We must draw the line now!"
 china.13.b:0 "We can't afford another confrontation."
 china.14.t:0 "Defeat in [From.GetName]"
 china.14.d:0 "Despite our efforts to push show that the communists will not be allowed to expand their influence outside of where they have currently taken refuge, we could not afford to commit enough resources to win the conflict along the [From.GetName] border.\n\nThe sporadic conflicts with communist militias slowly turned out more and more in their favor, which in the end made the campaign a failure in demonstrating that we have the situation under control. If their popular support keeps increasing, the communists could turn out to be a genuine threat."
 china.14.a:0 "Troubling."
 china.15.t:0 "Victory in [From.From.GetName]"
 china.15.d:0 "After a number of smaller encounters in the outskirts of our controlled territory, the conflict with the Kuomintang appears to have turned to our advantage. Although maintaining constant pressure has been taxing on our troops and supplies, the effort has been worthwhile. \n\nNo decisive battles have been fought, we have won a slow victory this time, which has strengthened the faith in our cause and fanned the flames of the revolution once again."
 china.15.a:0 "This will not be soon forgotten!"
 china.16.t:0 "Defeat in [From.GetName]"
 china.16.d:0 "Our efforts to wage an indirect war against the increased Kuomintang presence has proven disastrous. The nationalists were simply more dedicated to pushing us back than we thought, perhaps expecting the impact this failure would have on our reputation. Although our army is once again safe to recover, for now, the losses have not gone unnoticed by the locals, and rumors of the failure of the revolution are already spreading to nearby villages."
 china.16.a:0 "The revolution is far from dead!"
 china.17.t:0 "Victory in [From.From.GetName]"
 china.17.d:0 "Our efforts to draw the line against the threat of communism have been successful. The CPCs guerrilla campaigns in response to our increased troop presence in regions surrounding their power base failed to anticipate our dedication to stopping them. This show of strength, although not entirely without costs, has convinced many of the locals who previously gave their tacit support to [From.GetLeader] and his party have now begun to realize that China can never be united under such an ideology."
 china.17.a:0 "Let us hope they remember."
 china.18.t:0 "Clash with Nationalist Army"
 china.18.d:0 "While we have still barely recovered from their previous offensive, the nationalists appear to be increasing their troop presence in the areas close to our border. Clearly, they are trying to show that they once again have us contained and that the Great March only delayed their final strike against the CPC. We cannot let the people think this is true."
 china.18.a:0 "We cannot afford to spend our time recovering."
 china.100.t:0 "China Comes Under Further Attack"
 china.100.d:0 "Like a cat Japan advances and took Korea. They sought to humiliate us with their twenty-one demands, they occupy Manchuria and now they advance again. Well, no more, China will fight to her last to be free. In a speech to the people, [Root.GetLeader] appealed to all [Root.GetAdjective], that they stand together or face certain doom alone."
 china.100.a:0 "For China!"
 china.101.t:0 "China Is Under Attack"
 china.101.d:0 "It is time we stand together against our common foe, the Japanese. Let us lay aside petty squabbles and fight as a strong, united China!"
 china.101.a:0 "United we are strong!"
 china.101.b:0 "We must fight off the invaders!"
 china.102.t:0 "China Is Under Attack"
 china.102.d:0 "With the Soviet Union occupied with the war against Germany we have been advised that they will no longer be able to provide the same amount of protection as they have done in the past. It will be in our best interests to gain the support of the KMT and join them in their war against Japan."
 china.102.a:0 "United we are strong!"
 china.102.b:0 "Let us fight back the Japanese menace together."
 china.102.c:0 "Our interests are best protected by the mighty Soviet"
 china.103.t:0 "China Unites"
 china.103.d:0 "[From.GetName] has chosen to join us in the fight against the Japanese. United we will drive the invader back."
 china.103.a:0 "United we are strong!"
 china.104.t:0 "China Is Under Attack"
 china.104.d:0 "China is under attack. The warlords are putting aside their grievances to fight against the invading Japanese forces. This is an opportunity to advance the interests of the CPC, we can show the people of China that it is us and not the decadent KMT who are the true future for China. Should we join the fight as well and ensure that there is a future for China?"
 china.104_PRC_SOV_reinforcements:0 "Will receive 10 divisions from Soviet."
 china.104.a:0 "United we are strong!"
 china.104.b:0 "They will have to handle Japan without our help"
 china.104.tt:0 "\nNorthern China and Manchuria can now be liberated in the name of the [Root.GetName].\n"
 china.105.t:0 "China Unites"
 china.105.d:0 "[From.GetName] wants us to join forces in the fight against Japan. They have already joined the [From.GetFactionName] and are ready to put aside old grievances to stand against the Japanese invasion."
 china.105.a:0 "United we are strong!"
 china.105.b:0 "We will allow them some control of our nation during the coming war"
 china.106.t:0 "China Unites"
 china.106.d:0 "[From.GetName] has joined [Root.GetFactionName] and are ready to fight."
 china.106.a:0 "We will chase the Japanese devils from our lands"
 china.107.t:0 "No Longer United"
 china.107.d_PRC_joined:0 "[Root.GetFactionName] has served its purpose. There is no longer an enemy to stand united against. Mao Zedong is consolidating his hold over the territories in Northern China. However what hope will they have against our victorious armies."
 china.107.d_PRC_refused:0 "With the end of the war the true patriots have triumphed. It is time to settle scores with those who hid while we bled."
 china.107_tt:0 "@PRC §YPeople's Republic of China§! takes control over Chinese states in §YNorthern China§! and §YManchuria§!\n"
 china.107.a:0 "We no longer have a common enemy"
 china.108.t:0 "Communism Advances"
 china.108.d:0 "Our role in the struggle against the hated Japanese dogs has given much prestige to the CPC. More and more people are seeing that we are the future for China, especially in comparison to the corrupt Kuomintang. Party cadres are already organising these people into a new army that will swim the peasant sea."
 china.108.a:0 "We must bolster our ranks"
 china.108_PRC_SOV_reinforcements_2:0 "Receive 20 divisions"
 china.109.t:0 "Fight For China!"
 china.109_tt:0 "§YGain claims on mainland China§!\n"
 china.109.d:0 "It is time to rid China of the sickness that is the Kuomintang. We will liberate every Chinese and have a united people under the wise leadership of Mao."
 china.109.a:0 "To War!"
 china.110.t:0 "[From.GetName] Declares War"
 china.110.d:0 "[From.GetName] and the [From.GetLeader] cabinet has declared war on us."
 china.110.a:0 "To War!"
 china.111.t:0 "No Longer United"
 china.111.d:0 "[Root.GetFactionName] has served its purpose. There is no longer an enemy to stand united against. We have used the time wisely to build up our support across Northern China and Manchuria and now it is time to formalise our control in this region."
 china.111.a:0 "We no longer have a common enemy"
 china.200.t:0 "Joining the People's Republic of China"
 china.200.d:0 "Having broken with the nationalist Kuomintang to liberate the people, we must now join forces with the existing People's Republic of China to avoid splintering the movement. The enemies of China have always relied on our infighting to weaken us; the new socialist state will not make such a mistake!"
 china.200.a:0 "United we will defeat the nationalists!"
 china.201.t:0 "Communist Revolters Join the Republic"
 china.201.d:0 "Having broken free from nationalist control, Chinese revolutionaries who sympathize with our cause have made the decision to join their state with ours under the leadership of [Root.GetLeader]. Now and henceforth, there shall be one united People's Republic of China."
 china.201.a:0 "We must join to protect our comrades!"
 china.202.t:0 "Communist uprisings in [CHI_communist_state.GetName]"
 china.202.d:0 "The growing communist support in [CHI_communist_state.GetName] has come to a breaking point. Government facilities have been overrun and the rebels have declared that they no longer consider themselves a part of [Root.GetName]. We have effectively lost all control of [CHI_communist_state.GetName] to the communist regime."
 china.202.a:0 "We must quell this communist menace!"
 china.203.t:0 "Communist uprisings in [CHI_communist_state.GetName]"
 china.203.d:0 "Having broken free from nationalist control, Chinese revolutionaries who sympathize with our cause have made the decision to join their state with ours under the leadership of [Root.GetLeader]. Now and henceforth, there shall be one united [Root.GetName]."
 china.203.a:0 "We welcome our communist brothers!"
 china.204.t:0 "A [Root.GetAdjective] Capital"
 china.204.d:0 "With the end of the Chinese Civil War, it is time for us to consolidate power in China and show the people that we are the modern incarnation of the Middle Kingdom. We are the state that will guide them into the future.\n\nTo this end, we should have a capital befitting our great state."
 china.204.a:0 "We shall govern from the old Northern Capital."
 china.204.b:0 "We shall govern from the old Southern Capital."
 china.204.c:0 "There is no need to move the seat of government."
 CHI_no_united_front:0 "There will be no cooperation against external threats."
 
 bavaria.45.t:0 "How Parliament Works"
 bavaria.45.d:0 "For starters, a more in-depth explanation can be found in Progress Report 21, on our subreddit, CBTSmod.\n\nParliament is a system meant to simulate the major legislative body of democratic governments.\n\nTo begin the voting process, select a law in the Parliament category (might be called something different depending on country, such as Senate or Reichstag) in the decisions tab. After that, the voting process starts. You have time (30 days by default) to garner enough support for the measure.\n\nEvery ideology can have seats in the parliament. This is determined in different ways in different countries. To pass a law, you have to have the support of at least the amount of seats shown, which should be half of the total seats, rounded to the nearest integer. Some parties will automatically support your policies, others you have to negotiate for.\n\nNegotiating constists of selecting the relevant decision, and either agreeing to the party in question's demands, and gaining their support, or denying both.\n\nIf the law passes, you will gain the bonuses as shown in the tooltip. If not, you will suffer a penalty. If you passed the law while promising other parties concessions, those will be applied as well."
 bavaria.45.a:0 "Alright."
 bavaria.45.b:0 "Don't show me this again."
 
 spa.1.t:0 "The Salamanca Meeting"
 spa.1.d:0 "Our main generals have gathered in Salamanca to decide who will rule the new Spain. After Sanjurjo's death, we have two main options: elect a Generalísimo, or set up a Regency, officially restoring the monarchy. As the generals debate, a consensus is eventually reached..."
 spa.1.b:0 "We shall elect a Generalísimo!"
 spa.1.c:0 "Set up a Regency!"
 
 spa.2.t:0 "A Generalísimo?"
 spa.2.d:0 "The generals in Salamanca have agreed to appoint one of them as leader. The strongest candidate is Francisco Franco, general of the Army of Africa and whose cunning political ability have rallied alfonsines and falangists behind him. Other generals consider Emilio Mola, the original organizer of the uprising, as a possible leader. If no one can gather a wide consensus, then the National Defense Junta will have to be maintained, with Cabanellas as figurehead..."
 spa.2.a:0 "Franco will save Spain!"
 spa.2.b:0 "Mola shall crush the reds!"
 spa.2.c:0 "Cabanellas shall continue to lead us."
 
 spa.3.t:0 "The Question of the Monarchy"
 spa.3.d:0 "The Junta has agreed restore the monarchy, by stablishing a regency until the King can safely return to the country after the war ends. However, they disagree on who should lead that Regency. Each monarchist faction has its own candidate: Alfonsines propose general Alfredo Kindelán, an aviator an staunch supporter of the exiled royal family. Carlists support Javier de Borbón, their current royal candidate, to lead the Regency. They argue that Javier has already a royal claim and that he is able to inspire the soldiers better than Kindelán. Who will the Junta choose?"
 spa.3.a:0 "Kindelán shall be Regent!"
 spa.3.b:0 "Javier shall be Regent!"
 
 spa.4.t:0 "A new country"
 spa.4.d:0 "We have won the war, and now the Falange, with José Antonio Primo de Rivera at the helm, can fulfill its objective of an integral fascist state."
 spa.4.a:0 "Viva la Falange!"
 
 spa.5.t:0 "A new country"
 spa.5.d:0 "We have won the war, and general Franco can finally start his political projects. Change it all without changing anything..."
 spa.5.a:0 "Viva Franco!"
 
 spa.6.t:0 "A new country"
 spa.6.d:0 "We have won the war, and General Mola has to decide how the new Spain will be."
 spa.6.a:0 "Install a Military Junta"
 spa.6.b:0 "Create an authoritarian Republic"
 
 spa.7.t:0 "A new country"
 spa.7.d:0 "We have won the war, and the carlists are finally occupying the throne."
 spa.7.a:0 "Dios, Patria, Rey!"
 
 spa.8.t:0 "A new country"
 spa.8.d:0 "We have won the war, and Kindelan has ended his regency. Alfonso XIII has just returned, and big feasts are beign held in Burgos to celebrate it."
 spa.8.a:0 "Viva el Rey!"
 
 spa.9.t:0 "A new country"
 spa.9.d:0 "We have won the war, and general Cabanellas has declared a new Republic, that will correct the mistakes of the last."
 spa.9.a:0 "Viva la nueva República!"
 
 spa.10.t:0 "A new country"
 spa.10.d:0 "We have won the war, and general Sanjurjo has to decide how will the new Spain be."
 spa.10.a:0 "Install a military junta"
 spa.10.b:0 "Invite the King!"
 
 spa.11.t:0 "The new Republic"
 spa.11.d:0 "We have installed a new Republic, but we have to clarify the role of the military. Some people defend that the army should continue its rule over the new Republic, while others propose that generals should step down in favour of civilian politicians."
 spa.11.a:0 "The Military won the War, the Military keeps control!"
 spa.11.b:0 "A general will be President, and Gil-Robles will have executive powers."
 spa.11.c:0 "Cede power to Gil-Robles!"
 
 spa.12.t:0 "Our Government"
 spa.12.d:0 "After some intial measures, we have to decide how exactly will we rule. The national syndicalists and the falangists are proposing the creation of the Spanish National Republic, that would embrace revolutionary fascism. On the other hand, the General Staff and the Church want to create a Spanish State, embracing a more traditional and aristocratic fascism. José Antonio will hold today a big act in Madrid, when we will announce the creation of..."
 spa.12.a:0 "The National Republic!"
 spa.12.b:0 "The Spanish State!"
 
 spa.13.t:0 "Alfonso XIII dies"
 spa.13.d:0 "Bad news! Our king Alfonso XIII has died in his sleep last night! While the nation enters in a state of mourning, Alfonso's son Juan seems ready to assume the crown."
 spa.13.a:0 "El Rey ha muerto..."
 
 spa.14.t:0 "The King's speech"
 spa.14.d:0 "After the dead of Alfonso XIII, his son Juan, now Juan III, has delivered his first speech to the nation. He has called for unity in this hard days and he hoped that \"stability and patriotism don't come at the cost of freedom\". The military is still figuring what does that mean..."
 spa.14.a:0 "...larga vida al Rey!"
 
 spa.15.t:0 "Juan III adresses the Cortes"
 spa.15.d:0 "The new king Juan III has adressed the Cortes today. He has defended the renovation of the monarchy and he has attacked the hardliners because of their authoritarianism and their little respect for civilian powers."
 spa.15.a:0 "That's very true"
 spa.15.b:0 "We can't allow this!"
 
 spa.16.t:0 "Palace Coup!"
 spa.16.d:0 "Surprising news from the royal palace! A group of disgruntled military men has stormed the palace and they hold the king hostage. What will they do?"
 spa.16.a:0 "Juan's brother Jaime shall be the new king!"
 spa.16.b:0 "Juan can remain as a powerless king!"
 
 spa.20.t:0 "A new government"
 spa.20.d:0 "In a surpising move, the King has dismissed the previous reactionary government, installing the christian democrats in power. The new government has already pledged their support for the reforms."
 spa.20.a:0 "Down with reactionaries!"
 
 spa.21.t:0 "The King calls for Elections"
 spa.21.d:0 "After the appointment of the new moderate government, the king has called today for general elections in a month to 'allow the people to participate'. The conservatives and the liberals have already created their new parties to run for this election."
 spa.21.a:0 "How terribly exciting!"
 
 spa.22.t:0 "The General Election"
 spa.22.d:0 "The time has come. Liberals and Conservatives are fighting in the ballot box, but only one can be victorious. Who will win?"
 spa.22.a:0 "The Conservatives!"
 spa.22.b:0 "The Liberals!"
 
 spa.23.t:0 "The Royal Estatute"
 spa.23.d:0 "It is clear that we have to do something to properly organize the state after the palace coup. To do so, we have planned to write a Royal Estatute, that will act as a pseudo-Constitution given to the people by their king. The question is wether to allow some liberties or promulgate an authoritarian estatute."
 spa.23.a:0 "Only the King is fit to rule!"
 spa.23.b:0 "We need to listen to our people"
 
 spa.24.t:0 "The Return to Civilian Rule"
 spa.24.d:0 "After some reforms, the army has finally stepped down in favour of Gil-Robles, who has assumed all powers. Now the CEDA has begun to write a Constitution, although the nature of it remains to be seen..."
 spa.24.a:0 "We have a new President!"
 
 spa.25.t:0 "Democrats push their agenda"
 spa.25.d:0 "Bad news! Christian-democrats within the CEDA have been pushing their reformist agenda during the drafting of the new Constitution, insisting on allowing elections again. Meanwhile, the far-right sector of the CEDA demands the supression of democracy and the creation of a new Republic under the strong leadership of Gil-Robles. What should we do?"
 spa.25.a:0 "We must support democracy"
 spa.25.b:0 "Gil-Robles is our leader, now and forever!"
 
 spa.26.t:0 "The General Election"
 spa.26.d:0 "After finishing the new Constitution, it is time for our people to vote. The main choices are the christian democrat conservatives or the liberals. Whoever wins, they have a though road ahead, building this third Republic."
 spa.26.a:0 "The Conservatives!"
 spa.26.b:0 "The Liberals!"
 
 spa.27.t:0 "General Elections"
 spa.27.d:0 "After this brief junta rule, we are back to democracy. Conservatives and liberals are the main contenders of this election, and it is up to the people who will rule."
 
 spa.30.t:0 "Ban civilian organizations?"
 spa.30.d:0 "We are a military regime, and some members of the government are suggesting that civilian organizations have no place here. However many civilians support us and banning them as well could do more harm than good..."
 spa.30.a:0 "Sign the ban!"
 spa.30.b:0 "No need"
 
 spa.31.t:0 "The new national army"
 spa.31.d:0 "'All units of the MNP shall be integrated into the Land Army, with all men maintaining their military rank upon joining the Army. Those officers of the Regular Army that lose their command to the MNP counterparts will leave the army with a monetary compensation within 2 months.' \n\nThat first decree of José Antonio caused outrage in the military, however, the worst for them was yet to come: \n\n'The Land Army, now known as the National Army, is under the direct command of El Jefe ( José Antonio ) and the Falange party, through the National Secretary for the Army, appointed directly by El Jefe.'"
 spa.31.a:0 "Approved"
 
 spa.32.t:0 "Redistributing our land"
 spa.32.d:0 "'All those landowners that own more land that the area determined by the National Secretary for Agriculture and José Antonio shall immediately give that surplus land to Falange, that shall redistribute it fairly to agrarian workers in extreme poverty without ties to socialist or liberal groups. Resisting to these actions will count as High Treason and Falange will confiscate all of the land the revolter had.'  \n\nWith this decree, José Antonio has reduced the power of big landowners, that oppose our revolutionary rethoric, while increasing the regime's support among the people."
 spa.32.a:0 "Approved"
 
 spa.33.t:0 "Fuero del Trabajo"
 spa.33.d:0 "With more decrees, José Antonio has given more power to Falange's workers union, el Sindicato Vertical, while granting the workers some rights such as payed holidays, 8h workday and a good minimum wage. Those factories that resist the measure and those that can't afford it shall be immediately nationalized."
 spa.33.a:0 "For the spanish workers!"
 
 spa.34.t:0 "The Wealth Limit Decree"
 spa.34.d:0 "'Those persons that own more money that the number specified by José Antonio shall immediately give their surplus money to Falange. Holding more money that the limit will count as High Treason, and the infractor will see all his/her properties nationalized and money taken' \n\nThis decree, written by José Anonio <<because spaniards are a strong people that don't need luxuries, they only need to serve their faterland>> caused outrage within spanish elites, that are seeing their power broken. Even some church members have had to ask Falange for a special permission <<in the name of God>> that was finally approved in exchange of the full, unconditional support of the Spanish Church."
 spa.34.a:0 "Luxuries make us weak"
 
 spa.35.t:0 "Purges in the General Staff"
 spa.35.d:0 "'All military commanders that oppose the National Republic and Falange shall be immediately arrested, their assets seized, and their rank removed.' \n\nWith this decree, our secret police has started to arrest monarchist and republican generals all across Spain. Meanwhile, Juan Yagüe, the new Chief of Army, has promoted those men <<with proven loyalty>>. While this has angered the army, our control over it has increased."
 spa.35.a:0 "Those who resist shall pay!"
 
 spa.36.t:0 "Franco moves to El Pardo"
 spa.36.d:0 "After winning the Crusade and assuming total power, our Caudillo had to choose a new residence. While the Royal Palance of Madrid was proposed, and Franco's wife Carmen Polo loved the idea of being like a queen, Franco has chosen El Pardo to not anger the monarchists. From this palace in the outskirts of Madrid, the new Spain will be ruled."
 spa.36.a:0 "I bet he'll like hunting near the palace!"
 
 spa.37.t:0 "Queipo de Llano critisizes the government"
 spa.37.d:0 "General Queipo de Llano, known for his hostility towards Franco, has critisized the government's decision of granting a medal to the city of Valladolid and not to Sevilla, the city that Queipo took at the beggining of the war and ruled during the conflict. Using this as an excuse, Franco has decided to send him as ambassador to Italy, where he won't be a threat."
 spa.37.a:0 "Paca la Culona took his revenge"
 
 spa.38.t:0 "The Second Franco Government"
 spa.38.d:0 "After winning the war, we need a new government. Franco has decided to drift towards falangism, and thus he incorporates some key figures of falangism such as Serrano Suñer in the Foreign Ministry, dismissing General Jordana, a known anglophile. Other notable appointment was a carlist for the justice ministry, Esteban Bilbao, who has some crazy ideas such as making Franco appear in the coins."
 spa.38.a:0 "A new government for a new Spain!"
 
 spa.39.t:0 "Frente de Juventudes"
 spa.39.d:0 "In a decree published yesterday, the government has merged all youth organizations into the Frente de Juventudes, subdued into the single party Falange as the other one-party regimes. The organization has a clear aim: indoctrinating the young spaniards with Falange's ideology, with military marches and organization for boys and cleaning and cooking-related activities for girls. The organization also plans Air and Naval sections to better train its members for war."
 spa.39.a:0 "New blood to strengthen Spain!"
 
 spa.40.t:0 "Sindicato Español Universitario"
 spa.40.d:0 "During the Republic, it was the student's organization of Falange, but it was too small to do anything. Now Franco has made it the only legal student's organization, merging all the rest into it and making its membership compulsory to obtain advantages such as scholarships. With this organization the regime hopes to have the students controlled, although the catholic student's organization that got dissolved didn't like that one bit."
 spa.40.a:0 "Better keep an eye on the universities"
 
 spa.41.t:0 "Sección Femenina"
 spa.41.d:0 "The Femenine Section was founded in 1934 as the femenine wing of Falange, but since the end of the Crusade it has grown considerably. Led by the sister of José Antonio, Pilar, the femenine section is dedicated to charity in these hard times, managing the charity organization Auxilio Social. They are also a propaganda organization for women, dedicated to preserving the legacy of José Antonio, El Ausente, and managing femenine education."
 spa.41.a:0 "Women must also work for their country!"
 
 spa.42.t:0 "The Begoña incident"
 spa.42.d:0 "Bad news! Yesterday, two falangists threw grenades into a church where a group of carlists, including General Varela, were holding a service for those fallen in the Crusade, because apparently they were shouting 'Long Live the King, Down with Franco'. Carlists have demanded action against the falangists and their strongman in the government, Serrano Suñer, while falangists want to punish the carlists for their lack of loyalty."
 spa.42.a:0 "Punish both Falange and the carlists, that will strengthen Franco!"
 spa.42.b:0 "The carlists are right, Falange caused the attack"
 spa.42.c:0 "Falange is right, those carlists can't be trusted..."
 
 spa.43.t:0 "Ley Constitutiva de las Cortes"
 spa.43.d:0 "To better organize the state and give the appearance of being a democracy, the Caudillo has created a pseudo-Parliament for the country, the Cortes. Its members, called procuradores, are not in the Cortes after being elected by the people, they are there due to their charges ( bishops, Falange members, etc. ). The Cortes also lack legislative initiative, they can only approve what the Caudillo proposes, and since he is the one that appoints the procuradores, it is rather pointless. With this he hopes to improve Spain's international reputation and the popularity of the regime."
 spa.43.a:0 "You wanted democracy? Have some democracy!"
 
 spa.44.t:0 "Raza"
 spa.44.d:0 "Today the film Raza was premiered in Madrid, and it has become a huge sucess. The film, whose director is José Luis Sáenz de Heredia, depicts the story of a traditional spanish family, the Churruca, and the three brothers of that family: a monk that is assasinated by the anarchists, a hero of the civil war, and a republican politician that eventually regrets it and supports the nationalists. The script of the film has been written by Franco himself, who relfects his main ideological points in the film: catholicism, militarism, and anti-liberalism. With famous actors in it such as Alfredo Mayo and Ana Mariscal, the film has become a huge success."
 spa.44.a:0 "A true masterpiece"
 
 spa.45.t:0 "Scandal in the Sindicato Vertical"
 spa.45.d:0 "Surprising news! Today it was discovered that Gerardo Salvador Merino, the leader of the Sindicato Vertical and a fanatic national-syndicalist, was a freemason in the past. Merino, who was on his honeymoon when he discovered the news, quickly came to Madrid to defend himself, but it is quite evident that he is guilty. This is likely a move by the more moderate generals against the radical falangists."
 spa.45.a:0 "Replace him"
 
 spa.46.t:0 "Yola"
 spa.46.d:0 "Today Yola, a musical comedy written by Sáenz de Heredia and Vázquez Ochando, with argentinian singer Celia Gámez as its main star, was premiered in Madrid. It was huge success, and critics noted that this piece moves spanish musical comedies closer to american ones."
 spa.46.a:0 "Get me a seat!"
 
 spa.47.t:0 "Geneve Manifesto"
 spa.47.d:0 "The legitimist pretender, Juan de Borbón, son of Alfonso XIII, has demanded the return of the monarchy yesterday in the swiss newpaper Journal de Genève. He called for unity under the monarchy and rejected the currect regime. After the manifesto, Juan has begun to attempt to get foreign support. However, his efforts seem to be fruitless, for now."
 spa.47.a:0 "Those monarchists can't stay quiet!?"
 
 spa.48.t:0 "Government crisis!"
 spa.48.d:0 "Bad news! The anti-falangist army officers that are part of the government have threatened to resign, protesting for the rising influece of Falange within the government. In particular, they demand the replacement of Serrano Suñer and the appointment of the anti-falangist general Valentín Galarza as Security Minister. The falangists however have also made their threats if Franco gives in to the military."
 spa.48.a:0 "Side with Falange!"
 spa.48.b:0 "Try to compromise!"
 spa.48.c:0 "Side with the military!"
 
 spa.49.t:0 "The Catholic Kingdom"
 spa.49.d:0 "Today the Cortes have approved the new Law for the Protection of the Faith, which is esentially the reversal of decades of slow secularisation. With this law, the Church gains complete control over the education, coupled with an extensive subsidy and the return of many assets to them. In addition, harsh laws were created punishing atheism, secularism, and other christian denominations such as protestantism. Islam has been banned in mainland Spain, and the Cortes have approved sending missionaries to the colonies as well. This reinforces our devotion towards God!"
 spa.49.a:0 "We shall preserve the Reconquista!"
 
 spa.50.t:0 "The Patriotic Kingdom"
 spa.50.d:0 "New laws are passed in the Cortes, this time concerning the idea of the fatherland. Constructions of monuments to our past glories have begun all across Spain, while new holidays were stabilished such as the 'Blas de Lezo Day'. It is the glory of our ancestors what will keep this country united and ready to fight."
 spa.50.a:0 "¡Viva España!"
 
 spa.51.t:0 "The Decentralized Kingdom"
 spa.51.d:0 "After months of deliberation, the Cortes have approved the restoration of the Fueros in Navarra and Basque Country, together with the restoration of the medieval institutions of the old Crown of Aragon. Now each region has the rights it deserves, and its nobility will rule their regions locally instead of messing with the central government. We are stronger now!"
 spa.51.a:0 "¡Viva la Tradición!"
 
 spa.52.t:0 "A new King"
 spa.52.d:0 "Regent Javier de Borbón is ready to choose a new King for Spain. There are three options: first, the most obvious one, would be crowning Javier himself as king of Spain as Javier I. While this option is popular in carlist circles, others say that in order to unite all spanish monarchists, we should crown Juan, the son of Alfonso XIII, as King Juan III. This has legal basis, as when the previous carlist claimant died, Alfonso XIII inherited the carlist claim. However, there's other pretender: Carlos Pío de Habsburgo, supported by more extremist carlists. Choosing him would mean the return of the Habsburgs to Spain, something that many don't want but fits well with our imperialist propaganda. Who shall receive the crown?"
 spa.52.a:0 "Javier shall be our new king!"
 spa.52.b:0 "Juan III will lead us to reconciliation!"
 spa.52.c:0 "Carlos Pío de Habsburgo, for an Habsburg restoration!"
 
 spa.54.t:0 "Spain grants us naval access!"
 spa.54.d:0 "Looking to improve their relations with us, [FROM.GetLeader] has offered the german navy full access to Spanish dockyards, a move that would greatly expand our naval range. This will likely anger Britain though..."
 spa.54.a:0 "Good"
 
 spa.55.t:0 "Spain grants Tungsten exploitation rights!"
 spa.55.d:0 "While we have been interested in the Galician tungsten mines for some time now, the Spanish Government has decided to grant us full access to the mines. While we have greatly increased our tungsten reserves, they'll benefit from a massive entry of german capital."
 spa.55.a:0 "A good deal"
 
 spa.53.t:0 "Spain sends workers to Germany"
 spa.53.d:0 "As our men leave for the frontlines, it is clear that we need more workers. To solve this problems, Spain has sent some of its unemployed workers to work in our factories. While this is good for us, it also means we'll have to treat these workers like actual people instead of slaves..."
 spa.53.a:0 "They are welcome!"
 
 spa.56.t:0 "Spain ends tungsten shipments"
 spa.56.d:0 "Bad news! The treacharous Spaniards have decided to end their tungsten shipments, due to allied pressure or maybe a betrayal by their government. Anyway, some options to retake 'our' tungsten are on the table..."
 spa.56.a:0 "We could invade them, right?"
 
 spa.57.t:0 "Spain increases trade with Britain!"
 spa.57.d:0 "It seems that the Spanish Government is seeking better relations with our enemies in Britain, and they have sign a new trade treaty that will help Spain recover from the post-war. However, this move could move Spain closer to an alliance with the British and thus it is very dangerous for us."
 spa.57.a:0 "Not good"
 
 spa.58.t:0 "The Spanish Diplomatic Situation"
 spa.58.d:0 "News arrive from our embassy in Madrid. It seems that the new Spanish Government that came out of the civil war, while nationalistic, is reticent to join our alliance. Our agents also report an increase in British activities, a sign that the British are using subterfuge and intimidation to keep Spain out of the war. We should get involved too if we want to gain a new ally, and access to Gibraltar."
 spa.58.a:0 "We shall convince them"
 unlock_alignment:0 "§YDecisions concerning Spanish Diplomatic Alignment unlocked in the decisions menu.§!"
 unlock_alignment2:0 "§YUnlocks the alignment minigame!§!"
 
 spa.59.t:0 "The Spanish Diplomatic Situation"
 spa.59.d:0 "News arrive from our embassy in Madrid. It seems that the new Spanish Goverment that came out of the civil war, while nationalistic, is reticent to join Germany in their struggle. Our agents report an increase of German underground activity aimed at getting Spain to join them. For the security of Gibraltar, it is of utmost importance that we avoid an Spanish entry into the war, using all the means that are at our disposal."
 spa.59.a:0 "Our diplomacy will prevent a disaster..."
 
 spa.60.t:0 "Spain grants Germany tungsten exploitation rights"
 spa.60.d:0 "Troubling news. Spain has decided to grant Germany access to their tungsten mines in Galicia, granting Germany a big tungsten supply without any need of ships. We need to do something about this now..."
 spa.60.a:0 "Maybe some threats will do?"
 
 spa.61.t:0 "German submarines based in Spain"
 spa.61.d:0 "Some of our ships have been attacked while sailing through the straits of Gibraltar, and our spies have found out why: Spain is granting shelter to German submarines. We need to stop this if we don't want our trade to be further strangled."
 spa.61.a:0 "We can't allow this!"
 
 spa.62.t:0 "Britain is bribing our officers!"
 spa.62.d:0 "The British government, hoping to keep us out of the war, is bribing many of our main officers and ministers through the banker Juan March. With the bribed officers constantly advising against an allaince with Germany, this pushes us closer to Britain..."
 spa.62.a:0 "Is everything allowed?"
 
 spa.63.t:0 "The British Prime Minister praises our government"
 spa.63.d:0 "In a speech yesterday, the British Prime Minister has praised our government for our policy of non-belligerence, saying the United Kingdom is \"satisfied with the actions taken by the Spanish government, and eager for further cooperation between the two nations.\". [SPA.GetLeader] is quite happy about this."
 spa.63.a:0 "Well, he is not wrong..."
 
 spa.64.t:0 "Anglophile sentiment is on the rise"
 spa.64.d:0 "Anglophile elements in the Army and the Government are slowly increasing their influence, probably due to secret British support. Propaganda efforts undertaken by the British Embassy are also making Anglophilia slightly more popular."
 spa.64.a:0 "So we like them now?"
 
 spa.65.t:0 "The United Kingdom sends relief"
 spa.65.d:0 "Supposedly concerned with the economic destruction caused by the civil war, the British have sent food and supplies to our country. It is no secret however, that this is just a move that seeks to distance us from Germany."
 spa.65.a:0 "They do something right for once..."
 
 spa.66.t:0 "Threats from the UK"
 spa.66.d:0 "A message has arrived from the British Embassy in Madrid. The message says the the British Government is \"concerned\" with our recent alignment towards Germany, and that they may retaliate with actions such as a naval blockade. If they do that, we will starve, so perhaps we need to be more careful."
 spa.66.a:0 "Pirates!"
 
 spa.67.t:0 "Meeting with the Portuguese Ambassador"
 spa.67.d:0 "The Portuguese Ambassador in Madrid has met today with our foreign minister. He is concerned with our recent alignment towards Germany, and he stated the he would rather see Portugal and Spain deciding their war policy together as allies. We suspect that Britain is behind this, but our ties to Portugal are certainly forcing our hand..."
 spa.67.a:0 "Using a third country?"
 
 spa.68.t:0 "Britain demands the end of German shipbasing rights!"
 spa.68.d:0 "The British have issued a complaint through their Embassy in Madrid, pointing out that as a supposed neutral country they have evidence that several German ships have been stationed in our ports. They demand the inmediate end of this situation, in order to honor our neutrality. Should we accept this?"
 spa.68.a:0 "It would be wise to accept"
 spa.68.b:0 "So what?"
 
 spa.69.t:0 "Spain accepts our demands"
 spa.69.d:0 "The Spanish Embassy has just sent us a message, apologizing for the German shipbasing rights and promising to end those as soon as possible. We have won a diplomatic victory."
 spa.69.a:0 "Our ships should be a bit more secure now"
 
 spa.71.t:0 "Spain ends our Shipbasing Rights"
 spa.71.d:0 "Our Ambassador in Madrid reports that the Spanish Government has decided to agree with British demands, giving us a deadline to withdraw all our shipping and supplies from all Spanish ports. It seems Spain is drifting away from us."
 spa.71.a:0 "They act like British puppets!"
 
 spa.72.t:0 "Spain rejects our demands!"
 spa.72.d:0 "The Spanish Government has officialy denounced our Embassy as liars, saying that they are a neutral country and our accusations of granting shipbasing rights to Germany are completely made up. They don't seem to care about our threats..."
 spa.72.a:0 "Who do they think they are!?"
 
 spa.73.t:0 "The United Kingdom demands the end of tungsten shipments"
 spa.73.d:0 "The British Embassy in Madrid has issued a formal complaint for the shipments of tungsten that we are selling to Germany. Although there is nothing illegal in this action, they are still determined to end the German tungsten supply, so they are unofficially demanding us to stop selling tungsten to the Germans..."
 spa.73.a:0 "We'll keep the tungsten then"
 spa.73.b:0 "Our tungsten, our decision!"
 
 spa.74.t:0 "Spain accepts our demands"
 spa.74.d:0 "The Spanish Government has accepted our demands, and our agents in the Pyrenees report that the tungsten shipments have stopped. The Germans also seem furious, so we surely scored a goal here."
 spa.74.a:0 "They were wise"
 
 spa.75.t:0 "Spain refuses our demands"
 spa.75.d:0 "[SPA.Get.Leader] has ignored our demands and his government is continuing to sell tungsten to the Germans. There is nothing we can do except perhaps a military intervention..."
 spa.75.a:0 "They don't seem to realize the current situation..."
 
 spa.76.t:0 "The British Embargo"
 spa.76.d:0 "Seeing our increasingly pro-german position, the British have decided to end all their trade with us. This is a heavy blow to our fragile post-war economy, so we'll need to find alternative markets."
 spa.76.a:0 "They will always be pirates!"
 
 spa.77.t:0 "The British Blockade"
 spa.77.d:0 "As we continue to drift towards Germany, the United Kingdom has decided to weaken us at all costs, blockading our maritime trade with all nations and our communications with the Canary Islands. Our economy, that had a big reliance on foreign imports, has been destroyed. We need to break that blockade..."
 spa.77.a:0 "They leave us with one choice..."
 
 spa.78.t:0 "Spain wants to negotiate"
 spa.78.d:0 "After the blockade we imposed on the Spanish trade, their economic and social situation has been worsening day after day. The Spanish Government now claims that they have drifted away from the Germans, and demand the end of the blockade. Should we accept?"
 spa.78.a:0 "We'll lift the blockade"
 spa.78.b:0 "Perhaps we should continue..."
 
 spa.79.t:0 "The British end the blockade"
 spa.79.d:0 "Pleased with our recent diplomatic moves, the British Government has finally decided to end the naval blockade, allowing us to freely trade with the rest of the world. We need to buy food, fast."
 spa.79.t:0 "Thank god!"
 
 spa.80.t:0 "The British refuse!"
 spa.80.d:0 "The British Government has refused to end the blockade, saying that they need more proof of our commitment to the neutrality cause. This will cause economic problems..."
 spa.80.a:0 "Those damned pirates!"
 
 spa.81.t:0 "Wilhelm Canaris arrives"
 spa.81.d:0 "The Chief of the Abwhehr, the German intelligence, has arrived today in Madrid. He has been sent by [GER.GetLeader] to convince us to join the war on his side, but his behavior so far has been strange. In a meeting with [SPA.GetLeader], he has actually advised us to stay out of the war, so it is clear that he is actually against [GER.GetLeader] and his war. However, the fact that the Germans have sent him proves that they care about our entry into the war, and we shouldn't irritate them..."
 spa.81.a:0 "Listen to Canaris!"
 spa.81.b:0 "We still favor the Germans"
 
 spa.82.t:0 "Hans Lazar arrives!"
 spa.82.d:0 "Sent by the Reich Propaganda Ministry, German journalist Josef Hans Lazar has arrived today in Madrid. He has already begun to arrange meetings with the main newspaper directors of Spain, and he seems to be hell-bent into controlling the information Spain gets about the war to favour Germany. His propaganda efforts will certainly push us in a more pro-german direction..."
 spa.82.a:0 "So they are controlling us?"
 
 spa.83.t:0 "Falangists in Berlin"
 spa.83.d:0 "Seeking to sway Falange to their cause, [GER.GetLeader] has invited several high-ranking falangists to a visit in Berlin, with the approval of our ambassador, Espinosa de los Monteros. After they returned, they have begun to push for us to join the Germansin their war."
 spa.83.a:0 "What are they doing up there?"
 
 spa.84.t:0 "Germany offers relief"
 spa.84.d:0 "Seeking to improve relations with us, and hopefully make us join their war, Germany has offered us some economic relief to fight against the devastiation caused by the civil war. This help certainly makes [SPA.GetLeader] to view the Germans in a more positive light..."
 spa.84.a:0 "Thanks!"
 
 spa.85.t:0 "Message from the German Embassy"
 spa.85.d:0 "At the behest of [GER.GetLeader], the German Embassy is Madrid has sent [SPA.GetLeader] a message, reminding us of all the help provided by the Germans during our civil war. They want us to return that help by joining the war in the side of Germany. Our government is certainly divided in the issue..."
 spa.85.a:0 "They actually have a point..."
 
 spa.86.t:0 "Himmler visits Spain"
 spa.86.d:0 "Heinrich Himmler, leader of the German SS, has arrived to Madrid today after visiting Irún and Burgos. He has seen a military parade, bullfighting, and finally has visited [SPA.GetLeader] in his Palace. He has urged him to join the war on behalf of the Germans, as they are eager to get to Gibraltar to cut the British supply routes. Tomorrow, Himmler will visit Toledo and then leave Madrid, but his visit has left [SPA.GetLeader] thinking... what if we joine dthe Germans?"
 spa.86.a:0 "So much pressure"
 
 spa.87.t:0 "German troops in Southern France!"
 spa.87.d:0 "Our recent alignment towards the British has provoked the Germans, and they want to show that they can retaliate if we continue our policy. Our agents have detected an unusual amount of German divisions in Southern France around Bourdeaux, so they might be preparing for a invasion... We have to be careful."
 spa.87.a:0 "Dangerous"
 
 spa.88.t:0 "German embargo"
 spa.88.d:0 "Wary of our recent alignment towards the British, Germany has announced an embargo on our goods and trade. This will certainly make our fragile economy suffer, so we shoul look into repairing our relations with Germany..."
 spa.88.a:0 "Bastards!"
 
 spa.89.t:0 "German demands"
 spa.89.d:0 "The Germans are not pleased with our recent trade policy towards Britain, and they have demanded us to stop it. Consequences might be dire if we dare to refuse."
 spa.89.a:0 "Agree to their demands"
 spa.89.b:0 "We are sovereign!"
 
 spa.90.t:0 "Spain accepts"
 spa.90.d:0 "Wisely, [SPA.GetLeader] has agreed to our demands and greatly decreased trade between Spain and Britain, worsening relations between those two countries."
 spa.90.a:0 "Good"
 
 spa.91.t:0 "Spain refuses"
 spa.91.d:0 "Foolishly, Spain has chosen to defy us and say that they will maintain their trade with the British. Perhaps we should consider other kind of... solutions..."
 spa.91.a:0 "Someone is asking for an invasion..."
 
 spa.92.t:0 "Spain ends trade with us"
 spa.92.d:0 "Pressured by the Germans, Spain has decided to end most of their trade with us. This move aligns Spain closer to Germany, making their entry into the Axis more likely..."
 spa.92.a:0 "Apply our own pressure, then!"
 
 spa.93.t:0 "Spain demands Gibraltar!"
 spa.93.d:0 "After months of tensions building up near the Rock, the Spanish government has officially demanded our withdrawal from Gibraltar. What should we respond?"
 spa.93.a:0 "We can't afford conflict with Spain"
 spa.93.b:0 "It is ours!"
 
 spa.94.t:0 "[FROM.GetName] withdraws from Gibraltar"
 spa.94.d:0 "After receiving our demands, the [FROM.GetAdjective] government has decided to follow them and withdraw their troops from the Rock. Gibraltar is ours!"
 spa.94.a:0 "Finally!"
 
 spa.95.t:0 "[FROM.GetName] refuses our demands"
 spa.95.d:0 "The [FROM.GetAdjective] government has decided to refuse our demands. Now we must look into other ways to get what we want..."
 spa.95.a:0 "Damn"
 
 spa.96.t:0 "Gibraltar is ours!"
 spa.96.d:0 "After a decisive strike of our brave forces, the British have surrendered and they have withdrawn from Gibraltar. With this, 2 centuries of colonialism on our own soil are over!"
 spa.96.a:0 "The injustice has been repaired!"
 
 spa.97.t:0 "Defeat in Gibraltar"
 spa.97.d:0 "After weeks of fighting, our soldiers have retreated from Gibraltar, unable to break its numerous fortifications. Perhaps we need a more prolongued attack?"
 spa.97.a:0 "A shame!"
 
 spa.98.t:0 "Withdrawal from Gibraltar"
 spa.98.d:0 "Our new circumstances have forced our soldiers to retreat from Gibraltar. We need to plan our next offensive once things have calmed a bit."
 spa.98.a:0 "We'll be back!"
 
 spa.99.t:0 "Victory in Gibraltar!"
 spa.99.d:0 "After weeks of fighting the Spanish assault, our forces have managed to kick them out of the Rock, securing full control of Gibraltar once more. We are victorious!"
 spa.99.a:0 "Gibraltar is ours and it always will be!"
 
 spa.100.t:0 "Defeat in Gibraltar!"
 spa.100.d:0 "After fighting the Spanish assault hard, our forces have finally been overrun and had to retreat from the Rock. The lost of Gibraltar, a very important strategic asset, can be very damaging..."
 spa.100.a:0 "Our boys did their best"
 spa.100.b:0 "Let us take our revenge!"
 
 spa.101.t:0 "Spain retreats from Gibraltar"
 spa.101.d:0 "The change of the circumstances in Spain has forced their troops to retreat from Gibraltar. They promise that they'll return, however."
 spa.101.a:0 "At least they are out!"
 
 spa.102.t:0 "Spain is attacking Gibraltar!"
 spa.102.d:0 "Defying their supposed neutrality, Spain has begun an armed assault of the Rock of Gibraltar, and they are currently fighting against our armed garrison. This is an act of war, so should we declare it, or trust in our garrison to defend the Rock?"
 spa.102.a:0 "This is an act of war!"
 spa.102.b:0 "We can't afford a war with Spain now"
 
 spa.103.t:0 "Britain attacks Spain!"
 spa.103.d:0 "The British have declared war in Spain in response for their recent attack on Gibraltar, so they should be willing to join our alliance..."
 spa.103.a:0 "They must join our sphere!"
 spa.103.b:0 "Let them fight alone!"
 unlock_gibraltar_decisions:0 "§YUnlock Decisions to deal with our claims in Gibraltar!§!"
 
 spa.108.t:0 "Spain wants to join the [ROOT.GetFactionName]"
 spa.108.d:0 "The new Spanish government, after some efforts to recover from the destruction of the civil war, has officially asked for an alliance with us. Should we accept?"
 spa.108.a:0 "They are welcome!"
 spa.108.b:0 "Better not"
 
 spa.109.t:0 "[FROM.GetNameDef] has accepted!"
 spa.109.d:0 "The [FROM.GetAdjective] government has accepted, and now we are a member of the [FROM.GetFactionName]. Now we'll fight against our common enemies!"
 spa.109.a:0 "That's good"
 
 spa.110.t:0 "[FROM.GetNameDef] has refused!"
 spa.110.d:0 "The [FROM.GetAdjective] government has foolishly refused our offer, so our alliance proposal has been turned down. We are on our own, for now."
 spa.110.a:0 "Damn"
 
 spa.111.t:0 "German Economic Aid"
 spa.111.d:0 "After fully committing to their cause, the Germans have decided to send relief and economic aid to help us recover from the civil war devastation. Food, machines, vehicles and experts are entering the country, and will hopefully help us put our economy back on track soon; as this also benefits Germany."
 spa.111.a:0 "That's good!"
 
 spa.112.t:0 "A Proposal from Germany"
 spa.112.d:0 "Today the German government has sent us an interesting proposal related to our mining operations in Galicia and León. They propose to set up a joint mining company that can maximize tungsten and steel output, and develop the economy of the area. In exchange, they would claim some of the tungsten production, but the expanded output may outweight what we give to Germany. Should we agree?"
 spa.112.a:0 "Sounds like a good idea!"
 spa.112.b:0 "We must refuse"
 
 spa.113.t:0 "Spain accepts our proposal!"
 spa.113.d:0 "Good news! Spain has accepted our proposal, and mining operations will begin as soon as we can. This is an economic victory for Germany!"
 spa.113.a:0 "That's good"
 
 spa.114.t:0 "The Spanish refuse!"
 spa.114.d:0 "Our Spanish \"allies\" have refused our proposal for a joint exploitation of their tungsten. They think that it would mean giving up their sovereignty to us, however, they should think twice before refusing the Führer's demands..."
 spa.114.a:0 "Ridiculous!"
 
 spa.115.t:0 "Pro-German Coup!"
 spa.115.d:0 "Bad news! In a coup probably staged by the Germans, falangist militias have surrounded the Pardo Palace, the residence of the Cadillo Franco, and demanded him to stand down and allow the formation of a new, falangist government that can truly enforce the falangist ideals. With most generals remaining indecisive, Agustín Muñoz-Grandes finally decided to assemble some troops and met with the falangists in the Palace. After a brief conversation, Muñoz-Grandes ordered his troops to..."
 spa.115.a:0 "Arrest the Franco and assume control!"
 spa.115.b:0 "Arrest the plotters and restore order!"
 
 spa.70.t:0 "The Valley of the Fallen"
 spa.70.d:0 "One of the main projects of Francisco Franco is the construction of a great monument that conmemorates his victory in the Civil War. To that effect, he has conceived the construction of the Valley of the Fallen, that will be built in Cuelgamuros, in northern Madrid. Designed by Pedro Muguruza, the monument will be a grand crypt for the fallen in the \"Glorious Crusade\", with a grand monumental cross, the biggest in the world, to be built on top. The monument will serve to reaffirm our victory over the treacherous \"anti-Spain\", and to honour the glory of both the fallen in the Crusade and the General Franco, saviour of Spain. Construction has already begun, but the slow speed of it is making some people suggest to use republican prisioner labor..."
 spa.70.a:0 "For our victory over the Anti-Spain!"

 scw_play_republicans.tt:0 "§RPlay as the Republicans§!"
 scw_play_nationalists.tt:0 "§RPlay as the Nationalists§!"
 
 scw.1.t:0 "Military Coup Attempt!"
 scw.1.d:0 "At exactly 5:00 PM, Lieutenant colonel Máximo Bartomeu, in collaboration with colonel Solans and Lieutenant colonels Seguí and Gazapo, has declared the State of War in Melilla, in the name of General Franco, \"Commander in Chief of all Forces in Morocco\". General Romerales, commander of the Circunscripción Oriental, along with other loyalist military leaders, has been arrested by the plotters, that have deployed the Legion and the Regulares in Melilla and begun rounding up local socialists and republicans. Colonels Sáenz de Buruaga and Yagüe have declared the State of War in Tetouan and Ceuta, respectively, after hearing the news from Melilla. After the surrender of the last loyalist strongholds, the airbases of Atalayón and Samia Ramel, the entire Spanish Protectorate of Morocco has fallen under the control of these rebels. Now we must wonder what will these rebels do next..."
 scw.1.a:0 "We must stop this coup!"
 scw.1.b:0 "The Army will save Spain!"
 
 scw.2.t:0 "Peninsular Troops join the coup"
 scw.2.d:0 "One day after the initial uprising in the Protectorate, the plot has continued as planned and several military garrisons have rebelled against the government. In Sevilla, General Queipo de Llano has managed to depose General Villa-Abrile, commander of the 2nd Division, and is currently fighting Governor José María Varela and the loyal Assault Guard over control of the city. In Valladolid, Andrés Saliquet and Miguel Ponte have arrested General Nicolás Molero and took control of the 7th Division, with the support of the local police forces that had joined the uprising. In Burgos, General Domingo Batet had attempted to control the situation by arresting General González de Lara, a known plotter, but he was soon released by the the Guardia Civil, which proceeded to arrest Batet and declare the State of War in Burgos. In Coruña, Lieutenant Colonel Luis Tovar, along with the Civil Guard, have managed to declare the State of War in Galicia, arresting Governor Francisco Pérez Carballo and General Salcedo, who had remained reluctant to join the coup. In Navarra, General Mola and the Requetés have quickly taken control of the region after arresting and executing the local commander of the Guardia Civil, José Rodríguez Medel, who had remained loyal to the government. In Zaragoza, General Cabanellas has declared the State of War and joined the uprising despite anarchist riots, while General Goded secured control of the Baleares before flying to Barcelona, where due to the failure of the coup, he was arrested. The coup has also failed in Madrid, Valencia, Bilbao, Málaga and Murcia, leaving us in a difficult situation."
 scw.2.a:0 "We will be victorious!"
 
 scw.3.t:0 "Organizing the Army"
 scw.3.d:0 "The dust has settled, and we are certain of how many units are loyal to us. Also, some right-wing militias have taken arms to defend their country!"
 scw.3.a:0 "A la batalla!"
 
 scw.4.t:0 "Destroy them!"
 scw.4.d:0 "As our forces secure control of the countryside, columns are being organized in Burgos, Valladolid, Zaragoza and Pamplona, with the goal of taking Madrid and ending the war! It seems that the war won't be long..."
 scw.4.a:0 "Crush the reds!"
 
 scw.5.t:0 "First movements"
 scw.5.d:0 "The dust has settled in Andalusia, where Queipo de Llano has secured control over Sevilla after crushing resistance in the more popular neighborhoods of Triana and Macarena. Following his orders, Colonel Ciriaco Cascajo has declared the State of War in Córdoba and secured control of the city after bombarding the office of the Governor. In Cadiz, General Varela has finally managed to surrender the local government after the arrival of some African troops, securing the key port for us. General Aranda, in Oviedo, has also rebelled against the government, although he remains isolated from the rest of our forces, while anarchist militias have secured Eastern Aragon away from us."
 scw.5.a:0 "Keep advancing!"
 
 scw.6.t:0 "First movements"
 scw.6.d:0 "The dust has settled in Andalusia, where Queipo de Llano has secured control over Sevilla after crushing resistance in the more popular neighborhoods of Triana and Macarena. Following his orders, Colonel Ciriaco Cascajo has declared the State of War in Córdoba and secured control of the city after bombarding the office of the Governor. In Cadiz, General Varela has finally managed to surrender the local government after the arrival of some African troops, securing the key port for the fascists. General Aranda, in Oviedo, has also rebelled against the government, although he remains isolated from the rest of the rebel forces, while anarchist militias have secured Eastern Aragon in their attempt of retaking Zaragoza."
 scw.6.a:0 "Keep defending!"
 
 scw.7.t:0 "The people in arms!"
 scw.7.d:0 "After knowing of the military coup attempt, several left-wing paramilitary units, along with enthusiastic defenders of our Republic, have taken arms to defend their freedom, our freedom. They are already demand a full handing of weapons to the people, which would give us a lot of men, but quite poorly trained."
 scw.7.a:0 "Adelante Hijos del Pueblo!"
 SPR_cw_militias:0 "Columnas de Milicianos"
 SPR_international_brigades:0 "International Brigades"
 
 scw.8.t:0 "Part of the Fleet joins us"
 scw.8.d:0 "We had planned a big revolt within the naval officers to take control of the navy, but the government noticed it and called the sailors to defend the Republic and defeat the rebel officers. The sailors have mostly succeded, but still a few boats defected to us."
 scw.8.a:0 "Damned reds"
 
 scw.9.t:0 "Rebel Sympathies in the Army"
 scw.9.d:0 "The intial uprisings in Madrid, Valencia, Barcelona and other loyalist areas have been crushed, but many officers remain sympathetic to the rebel cause, witing for us to send them to the front to defect. Some members of the government are proposing to disband the Army and rely on militias instead. They are not effective, but reliably loyal."
 scw.9.a:0 "Damned rebels!"
 
 scw.11.t:0 "The Flight of Sanjurjo"
 scw.11.d:0 "Sanjurjo has been chosen as head of our new state. A plane was sent to Portugal to pick him up, but due to the weight of his bag, full of military clothing, the plane fell into a forest. As the people approached the broken plane, they discovered that..."
 scw.11.a:0 "Sanjurjo is dead!"
 scw.11.b:0 "Sanjurjo is alive!"
 
 scw.10.t:0 "Peninsular troops join the coup!"
 scw.10.d:0 "One day after the initial uprising in the Protectorate, the plot has continued as planned and several military garrisons have rebelled against the government. In Sevilla, General Queipo de Llano has managed to depose General Villa-Abrile, commander of the 2nd Division, and is currently fighting Governor José María Varela and the loyal Assault Guard over control of the city. In Valladolid, Andrés Saliquet and Miguel Ponte have arrested General Nicolás Molero and took control of the 7th Division, with the support of the local police forces that had joined the uprising. In Burgos, General Domingo Batet had attempted to control the situation by arresting General González de Lara, a known plotter, but he was soon released by the the Guardia Civil, which proceeded to arrest Batet and declare the State of War in Burgos. In Coruña, Lieutenant Colonel Luis Tovar, along with the Civil Guard, have managed to declare the State of War in Galicia, arresting Governor Francisco Pérez Carballo and General Salcedo, who had remained reluctant to join the coup. In Navarra, General Mola and the Requetés have quickly taken control of the region after arresting and executing the local commander of the Guardia Civil, José Rodríguez Medel, who had remained loyal to the government. In Zaragoza, General Cabanellas has declared the State of War and joined the uprising despite anarchist riots, while General Goded secured control of the Baleares before flying to Barcelona, where due to the failure of the coup, he was arrested. The coup has also failed in Madrid, Valencia, Bilbao, Málaga and Murcia, leaving us in a more favorable situation."
 scw.10.a:0 "Traitors!"
 
 scw.14.t:0 "Our government resigns"
 scw.14.d:0 "The government, incapable of dealing with the coup, has resigned. The President, after a failed attempt at a centrist coalition, has swiftly replaced it with a leftist coalition led by republican chemist José Giral."
 scw.14.a:0 "We needed a renovation"
 
 scw.12.t:0 "José Giral resigns"
 scw.12.d:0 "José Giral has resigned, and we need to decide our new Head of Government. There is a consensus in the left about the appointment of Largo Caballero, who may be the only person that can convince anarchists, communists and republicans to work together."
 scw.12.a:0 "Appoint Largo Caballero!"
 
 scw.13.t:0 "Alcalá-Zamora resigns"
 scw.13.d:0 "Alcalá Zamora, incapable of dealing with the situation, has resigned as President. He has been immediately replaced by Azaña, the leader of the republicans."
 scw.13.a:0 "That wasn't really surprising..."
 
 scw.15.t:0 "The Barcelona incident"
 scw.15.d:0 "Disaster! Refusing to obey orders from the government, the anarchists and the POUMists have risen up in Barcelona! Although they have already been supressed, we need to do something with Largo Caballero, as the communists and the moderates both want to see him out."
 scw.15.a:0 "Keep Largo Caballero and kick the communists from the cabinet!"
 scw.15.b:0 "Replace Caballero with Negrín"
 
 scw.16.t:0 "The Valencia incident"
 scw.16.d:0 "The socialists, moderates and radicals alike, have demanded in Valencia the formation of a socialist led cabinet, as their militias are doing most of the fighting. After the proclamation, violence erupted between socialist militias and government representatives. What should we do?"
 scw.16.a:0 "Appoint Largo Caballero as Head of Government!"
 scw.16.b:0 "Appoint Prieto as Head of Government!"
 scw.16.c:0 "Crackdown on rebel militias."
 
 scw.17.t:0 "Death of Durruti"
 scw.17.d:0 "Bad news... Anarchist militia leader Buenaventura Durruti has died today, shot by an unknown gunner. The CNT has lost one of their most important men."
 scw.17.a:0 "Rest in Peace, you will be missed..."
 
 scw.18.t:0 "Badajoz Taken"
 scw.18.d:0 "Our troops have secured the capital of Extremadura, and our lands will be connected soon. However, we need to decide how will we deal with the reds in Badajoz."
 scw.18.a:0 "Slash and Burn!"
 scw.18.b:0 "We are all spaniards"
 
 scw.19.t:0 "Bilbao Taken"
 scw.19.d:0 "Our troops have secured the capital of the basques, and our the north will be ours soon. However, we need to decide how will we deal with the separatists in Bilbao."
 
 scw.20.t:0 "Barcelona Taken"
 scw.20.d:0 "Our troops have secured the capital of Catalonia, taking one of the bastions of the Republic. However, we need to decide how will we deal with the reds and the separatists in Barcelona."
 
 scw.21.t:0 "Valencia Taken"
 scw.21.d:0 "Our troops have secured the city of Valencia, and the Republic has lost one of its main fortresses. However, we need to decide how will we deal with the reds in Valencia."
 
 scw.22.t:0 "Madrid Taken"
 scw.22.d:0 "¡Hemos Pasado! Despite the strong republican resistance, our troops have triumphally entered Madrid, the capital. The Republic is now about to collapse, as their units desert and go home, and their leadership starts taking flights to France."
 
 scw.23.t:0 "Nationalist Atrocities"
 scw.23.d:0 "We have received yet another word of nationalist atrocities comitted in one of their newly taken cities. Our men seem more determined to avoid their fate."
 scw.23.a:0 "That's right! Not an inch!"
 
 scw.24.t:0 "Madrid is lost"
 scw.24.d:0 "They have passed. Madrid has fell to the nationalists, and our troops are deserting en masse. It seems we have lost the war."
 scw.24.a:0 "This can't be over..."
 
 pce_has_full_power:0 "The PCE has full power"
 cnt_has_full_power:0 "The CNT has full power"
 
 scw.25.t:0 "Replace President Azaña?"
 scw.25.d:0 "It is time to make an important decision. The Head of State is still Manuel Azaña, leader of the republicans, and he has started to make moves immediately after the end of the celebrations. Some ministers have proposed to use our militias, that already control the state de facto, to depose the President and take full power for ourselves. It has risks, but it may be necessary to save our cabinet."
 scw.25.a:0 "Take full power!"
 scw.25.b:0 "Azaña is no threat"
 
 scw.26.t:0 "Azaña dismisses the cabinet!"
 scw.26.d:0 "President Azaña began his political moves as soon as the post-war celebrations were over. He contacted some republican, professional officers, and with troops loyal to him, managed to secure control over Madrid and Barcelona. Meanwhile, he pressured for an emergency meeting of the Parliament, where the republican majority read statements from repressed nationalists, priests and capitalists to denounce the government as violent. When it was the turn of the government's spokesperson, the Speaker of the Cortes stopped him, starting a tumult in the Parliament that was solved with the arrest of many of our deputies and ministers, including the head of government. With the government in prision, Azaña has replaced it with a centre-left cabinet led by Casares Quiroga, who has ordered the immediate disarmament of revolutionary militias."
 scw.26.a:0 "The Revolution is over!"
 
 scw.27.t:0 "The Spanish Republic asks for help!"
 scw.27.d:0 "Spanish Head of Government José Giral has wrote a letter to ours, relating the dangerous military coup that has taken place there and asking for weapons and planes. Shall we send support?"
 scw.27.a:0 "We stand with the democrats!"
 scw.27.b:0 "That would create domestic tensions..."
 
 scw.28.t:0 "France intervenes in the Spanish Civil War"
 scw.28.d:0 "France has decided to upset global peace by sending support to the Spanish Republicans. We can try to pressure them to withdraw, to preserve peace, or just tolerate it."
 scw.28.a:0 "Demand France to withdraw from Spain"
 scw.28.b:0 "They are just supporting the legal government..."
 
 scw.29.t:0 "The French refuse"
 scw.29.d:0 "Foolishly, the French have refused to aid us in our fight against the coup. We are on our own."
 scw.29.a:0 "They must prefer the fascists!"
 
 scw.30.t:0 "British warnings"
 scw.30.d:0 "Britain has warned us they we don't have their backing in our decision to support the Spanish Republic, and we are on our own if retaliatory action is taken by Germany or Italy. Should we reconsider our decision?"
 scw.30.a:0 "Stop all support and embrace Non-Intervention!"
 scw.30.b:0 "We are a sovereign nation and we support whoever we want!"
 
 scw.31.t:0 "France sends support"
 scw.31.d:0 "Great news! France has promised to send some support, and some planes have already crossed the border. We expect more help coming soon."
 scw.31.a:0 "That is great!"
 
 scw.32.t:0 "The French withdraw their support"
 scw.32.d:0 "Apparently due to British pressure, France has decided to embrace Non-Intervention and veto arms sales to our country, cutting their support. We'll have to rely on other countries, if any country is wiling to help us..."
 scw.32.a:0 "Are they really going to abandon us to the fascists!?"
 
 scw.33.t:0 "Support Republican Spain?"
 scw.33.d:0 "The fascists have risen up against the Spanish Republic. They are a liberal, capitalistic regime, however their ideological allies, Britain and France, seem to prefer the fascists, so the people of Spain is alone in the fight. Several people have proposed that we should support the Spanish instead. It would stop the advance of fascism, reinforce the Communist Party of Spain, give us a chance to purge ideological enemies in Spain and align Spain towards our bloc. However, we have already comitted to Non-Intervention..."
 scw.33.a:0 "We'll stop fascism in Spain!"
 scw.33.b:0 "We can't break our commitments"
 
 scw.34.t:0 "The USSR sends support"
 scw.34.d:0 "It is not our prefered ally, but we are no position to reject any help. The USSR have offered to send guns, ammunition, food, advisors and tanks to help us in our fight against the fascist hydra. They demand the gold of the Bank of Spain in return."
 scw.34.a:0 "Any help us welcome"
 
 scw.35.t:0 "Spanish Gold arrives!"
 scw.35.d:0 "The gold of the Bank of Spain left the port of Cartagena a week ago, and it has safely arrived to Odessa. It has 510 tons of gold in pesetas, dollars, francs, pounds or liras, to name a few, that will be used to pay for our help against the fascist. The gold is now in route towards Moscow."
 scw.35.a:0 "We can now begin!"
 sov_unlock_spr_dec:0 "§GUnlock decisions to support Spain!§!"
 
 fra_can_support_spr:0 "§GSpain will be able to get French support through decisions!§!"
 fra_not_support_spr:0 "§RBlock Spanish decisions to get French support!§!"
 sov_unlock_spr_gold:0 "§GWe will unlock decisions to support Spain once they send a payment!§!"
 soviets_promised_sup:0 "The Soviets have promised support"
 france_promised_sup:0 "The French have promised support"
 
 scw.36.t:0 "The International Brigades"
 scw.36.d:0 "The Comintern and the French Communist Party have organized the recruitment of international volunteers, from all around the world, to help us in the fight. They have arrived today from France, where they had assembled, and stand ready to die for our cause. Despite most of them being communist, their main motivation is not spreading the Revolution but fighting fascism."
 scw.36.a:0 "With our comrades, fascism is doomed!"
 
 SPR_mixta:0 "Brigadas Mixtas"
 
 scw.37.t:0 "The Mixed Brigades"
 scw.37.d:0 "In order to replace the chaotic columns of militias created during the first days of the war, the government has decided to create 6 Mixed Brigades, following the model of the communist Quinto Regimiento. These brigades have 4 infantry batallions, and auxiliary units of artillery and reconaissance, although lack of materials prevents these support units to be formed. This is a step forward in the creation of a professional army."
 scw.37.a:0 "Tercera Brigada Mixta, primera línea de fuego!"
 
 scw.38.t:0 "Growing power of the PCE"
 scw.38.d:0 "The Communist Party of Spain has grown too powerful within our army ranks. With anarchists and republicans purged, the communists seems ready to take over the government."
 scw.38.a:0 "We shall remain united"
 scw.39.t:0 "Growing Power of the CNT"
 scw.39.d:0 "The CNT-FAI has gained too much influence within our ranks, and many members are proposing a coup. With communists and republicans unable to do anything, it seems more likely each day."
 scw.40.t:0 "Growing power of the republicans"
 scw.40.d:0 "The republicans, strangely, have managed to gain a lot of power within our army ranks, and now it's being said that they are planning a coup to put Prieto and his aides in power. We have to decide how to deal with them"
 
 5_ana_inf:0 "\n§G+5 Anarchist Influence§!"
 5_lib_inf:0 "\n§G+5 Democratic Influence§!"
 5_com_inf:0 "\n§G+5 Communist Influence§!"
