 romania.102.t:0 "The Romanians Surrender"
 romania.102.d:0 "In a surprising move, Romanian King Michael I has dismissed the pro-german cabinet and asked us for peace, as they fear that the collapse of the front may be inminent. We could accept their surrender and work with them to fight the Axis on the Balkans, or we could ignore their claims and crush them..."
 romania.102.a:0 "We accept the Romanian surrender"
 romania.102.b:0 "Onwards to Bucarest!"
