l_english:
#----------------------------------------------

 ### World Events ###
 news.2.t:0 "Paris World’s Fair Beggins"
 news.2.desc:0 "Today marked the opening of the Exposition Internationale des Arts et Techniques dans la Vie Moderne, the largest world's fair since the 1933 exposition in Chicago, in Paris. Like the last fair, the theme of this one is modern technology, the arts, and progress, and many nations have attended with exhibits to showcase their latest mechanical innovations and most daring architectural designs. Dignitaries and socialites from around the world have flocked to see the exhibits and demonstrations. The two most remarked upon exhibits were those of the Soviet Union and Germany, situated opposite one another. The Germans showcased Speer’s signature stripped neoclassicism. The Soviet pavilion, designed by Boris Iofan, was topped with a statue of worker and peasant raising a hammer and a sickle in solidarity. Both architects were presented with the Grand Prix for their innovative work."

 cbts_news.1.t: "USSR Invades Finland"
 cbts_news.1.desc: "Peace in the Baltic region was shattered today as the Red Army advanced across the Finnish border following weeks of deteriorating diplomatic relations between Finland and the Soviet Union. Following repeated refusals by the Finnish government to amend the border between the two nations, the USSR claimed that Finland has demonstrated hostile intentions after allegedly launching an artillery bombardment of a border village. Despite Finland’s vehement denials, the Soviet Union broke off diplomatic relations and has begun its anticipated invasion.\n\nNo one is sure how long Finland can resist the Soviet juggernaut alone, but given the massive imbalance in military strength between the two it seems unlikely Finland will be able to survive without foreign assistance."
 cbts_news.1.a: "Tulta munille!"
 cbts_news.1.b: "Let us reclaim Finland!"
 cbts_news.1.c: "Troubling"

 cbts_news.2.t: "USSR Expelled from the League of Nations"
 cbts_news.2.desc: "In response to the unprovoked invasion of Finland by the USSR, the League of Nations has voted to expel the Soviet Union as a member. This act remains purely symbolic, however, as no member state seems willing to join the war on Finland’s side.Having arisen from the lofty idealism of President Woodrow Wilson, the League of Nations was critically undermined by a lack of US membership and has only continued to sink into irrelevance as rogue international actors such as Italy, Germany, and Japan have repeatedly violated its mandates. Now, with the Soviet invasion of Finland well underway, it seems difficult not to argue that the League has ultimately failed in its mission to preserve peace.\nIt seems unlikely anyone will take the League of Nations seriously, going forward."
 cbts_news.2.a: "So much for peace"
 cbts_news.2.b: "Oh no! Anyways..."

 cbts_news.3.t: "Arab General Strike in Palestine"
 cbts_news.3.desc: "Increasing tensions in British Mandatory Palestine between British authorities and Jews versus the Arab population have reached a new high following a series of high-profile killings by Jewish and Arab radicals. Stoked by the increasing British support for Jewish immigration to Palestine and the accompanied rising economic and political influence thereof, Arab leaders have called for a general strike to put pressure on British officials to curtail the influx of Jews and the increasing British move towards Zionism.\n\nGiven the prior British disinterest in making meaningful concessions to the Arab population, it seems likely that violence in Palestine is only going to grow in time."
 cbts_news.3.a: "Bloody hell, someone find Peel"
 cbts_news.3.b: "This is not going to end well..."

 cbts_news.4.t: "Japan withdraws from the League"
 cbts_news.4.desc: "The Japanese delegation has defied the world by withdrawing from the League of Nations Assembly today, after the assembly voted to accept the Lytton Commission’s report, recommending Japan to withdraw her troops occupying Manchuria, by an overwhelming majority (42 to 1, Japan voting against it). Before the vote was held, Japan’s chief delegate to the League, Matsuoka, made a quixotic and impassioned speech in which he implored not to accept the report \"for the sake of peace in the Far East\", stating that \"(...) Manchuria belongs to us by right.\" After the vote ended, Matsuoka and the Japanese delegation walked down the hall in a dramatic and symbolic exit, which caused an eruption of mingled hisses and applauses in the crowded galleries."
 cbts_news.4.a: "Japan will always be the mainstay of peace and order in the Far East."
 cbts_news.4.b: "The only thing Japan wants is to conquer and subjugate. Liars."
 cbts_news.4.c: "A very worrying development."

 cbts_news.5.t: "USSR admitted into the League of Nations"
 cbts_news.5.desc: "Following France’s initiative 30 member countries proposed the USSR to join the League. 3 days later, the Soviet Union accepted the offer and joined as a permanent member of the Council. Even before this, the country worked closely with various committees of the League of Nations on a wide range of international issues. They had been granted entry following a vote in which 39 members voted in favour, with 3 votes going against and 7 in abstention. Not a single vote went against the Soviet inclusion in the Council of the League, however representatives of ten countries abstained.\nThis marks an important diplomatic development in Europe and for the world."
 cbts_news.5.a: "A French diplomatic victory, indeed."
 cbts_news.5.b: "An important development indeed."


