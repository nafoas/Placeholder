 -5_com_inf:0 "\n§R-5 Communist Influence§!"
 -5_lib_inf:0 "\n§R-5 Republican Influence§!"
 10_ana_inf_5_com_inf:0 "\n§R +10 Anarchist Influence, +5 Communist Influence§!"
 3_com_inf:0 "\n§G+3 Communist Influence§!"
 3_lib_inf:0 "\n§G+3 Republican Influence§!"
 can_spr_allies:0 "§GYou will be able to ask [ENG.GetFlag] §YBritain§! and [FRA.GetFlag] §GFrance§! for military aid if a major war breaks out with [GER.GetFlag] §RGermany§! and/or [ITA.GetFlag] §RItaly.§!§!"
 spr_sov_not_like:0 "§RThe Soviets won't like this!§!"
 spr_gain_six_militia:0 "§G6 Militia Divisions will be recruited!§!"
 spr_crisis_barcelona:0 "Has had the Crisis of May 37"
 disable_sov_help:0 "\n§RDecisions to help Republican Spain will be disabled!§!\n"
 unlocked_control_spa:0 "\n§YUnlock Political Control mechanics in the Decisions tab!§!"
 
 scw.41.t:0 "Proffesional Officers Complain"
 scw.41.d:0 "A letter has arrived today to the minister of national defense. Written by a group of proffesional militarymen, they say that they want to defend the Republic, but the lack of discipline of the anarchist militias is causing problems at the front. Should we take action?"
 scw.41.a:0 "Enforce discipline!"
 scw.41.b:0 "Discipline? What are we, fascists?"
 
 scw.42.t:0 "Anarchist Riots"
 scw.42.d:0 "The loss of authority after the military coup led to a wave of crime and killings through our cities. Now violence against the symbols of the burgoisie and the church has reached a whole new level, and republicans and even communists are demanding our government to take action. Should we do it?"
 scw.42.a:0 "This is unacceptable! Restore order!"
 scw.42.b:0 "The Revolution demands blood..."
 
 scw.43.t:0 "NKVD Activity"
 scw.43.d:0 "Since we let soviet advisors into the country, the NKVD has used the opportunity to quietly hunt trotskists and anarchists. However, complaints of torture and brutality have become too loud, and they have reached the Ministry of Security. Should we try to limit the NKVD agents? We rely on Soviet Aid though..."
 scw.43.a:0 "It's the price we have to pay..."
 scw.43.b:0 "We should limit their operations"
 
 scw.44.t:0 "Militias target politicians"
 scw.44.d:0 "The orgy of blood against the 'reactionaries' continues. However, this time, a mob of militias has arrested a group of famous liberal politicians, that are undoubtly republican. Various politicians, including President Azaña, have demanded their liberation, however, is the militias the ones that hold power now."
 scw.44.a:0 "Order their liberation!"
 scw.44.b:0 "We are powerless to stop it"
 
 scw.45.t:0 "Consejo de Aragón"
 scw.45.d:0 "After some deliberation, the CNT comitees have formed the Aragon Regional Defense Council, a CNT-dominated council that will regulate the militias and the economy of the area. This is an abvious attempt of the CNT to implement libertarian communism, however, they have asked us for our permission. It's likely that even without our permission they will go on with it, though."
 scw.45.a:0 "Recognize it by decree"
 scw.45.b:0 "Try to dissolve it!"
 
 scw.46.t:0 "Anarchists join the Catalan Government"
 scw.46.d:0 "In a surprising move, Catalan president Lluis Companys has dissolved the Anti-Fascist Militias Comitee, and ha invited the anarchists to join his cabinet. While this movement strengthens both the Catalan government and the anarchists, some point at the lack of legality in this action, and asked the government to prevent this expansion of anarchist influence."
 scw.46.a:0 "Companys has our approval"
 scw.46.b:0 "That's illegal! No concessions to the anarchists!"
 
 scw.47.t:0 "Amnesty for rightists?"
 scw.47.d:0 "Today the Council of Ministers is meeting to decide the fate of 64 rightist prisioners. The liberal sectors of the cabinet have proposed to concede an amnesty, but to do so they need a majority of the council of ministers, and the communists seem determined to not concede any amnesty. What option will win the vote?"
 scw.47.a:0 "Concede the amnesty"
 scw.47.b:0 "Fascists deserve to be punished"
 
 scw.48.t:0 "Social Revolution!"
 scw.48.d:0 "After arming the people, we unleashed the fury of the lower classes. With the government's authority non-existent, hordes of furious workers and peasants have taken arms all across Republican Spain to destroy churches, mansions, rightist newspapers, casinos, etc. In the countrysides, fields are being collectivized, while in the cities churches are being burned and priests murdered. News arriving from Andalusia and Extremadura, where the fascists are brutally executing thousands of peasants and leftists, serve to infuriate the masses, fueling the violence. As thousands of rich or right-wing people try to flee the country or seek refuge in the embassies, one thing is clear: we'll have to restore our authority, or the liberal Republic will burn as well."
 scw.48.a:0 "We are powerless to stop them..."
 
 scw.49.t:0 "Factionalism in the Army"
 scw.49.d:0 "With our proffesional officers and units rebelling against the Republic, many workers have taken arms to defend it. As a result, our army is very divided: the old officers and units are loyal to liberal democracy, while the majority of militias seem to support the CNT-FAI and libertarian communism. There's also the PCE and its disciplined militias, that could prove decisive against the fascists."
 scw.49.a:0 "We should try to be united"
 unlock_strug:0 "§YRepublican Power Struggle Decisions unlocked in the decisions tab!§!"
 
 scw.50.t:0 "Agricultural Collectivization?"
 scw.50.d:0 "In the early days of the Civil War, armed peasants began collectivizing the big landowners' properties, as most of them had fled the country or had been executed. In place of the old properties, the peasants have set up agricultural cooperatives, where every peasant shares what he produces with the rest in a cooperative economy. While they have worked reasonably well, communists and liberals demand their decollectivization, citing the need of western support and the reduction of revolutionary power as the main reason. What should we do?"
 scw.50.a:0 "We must uphold Private Property principles"
 scw.50.b:0 "The land belongs to the people!"
 
 scw.51.t:0 "The first Anti-Fascism Day"
 scw.51.d:0 "In the middle of the victory celebrations, the government has decided to institute this day as the first Anti-Fascism Day, that will conmemorate the defeat of the fascist viper and the reactionary beast in the battlefields. This will serve to show our people, and the world, that Spain is a country free of fascism."
 scw.51.a:0 "International fascists beware!"
 
 scw.52.t:0 "Anti-Fascism Day"
 scw.52.d:0 "Today marks the aniversary of our victory in the Fascist Revolt. The people is celebrating this occassion with parades, feasts and dances, while the Parliament makes its yearly Anti-Fascist declaration, barring the fascists from entering political life. As the sun sets, a grand act is held to remember the fallen in the War, and to hear the Head of Government's and President's speech."
 scw.52.a:0 "Revolutionary spirit lives on!"
 
 scw.53.t:0 "Soviet Ammunition arrives!"
 scw.53.d:0 "A shipment of Soviet guns and ammunition has arrived today to our ports. The communists have claimed that this shipment is their merit and are using this as propaganda to increase their power. We have more guns, at least."
 scw.53.a:0 "Take them fast!"
 
 scw.54.t:0 "Soviet Artillery arrives!"
 scw.54.d:0 "A shipment of Soviet cannons has arrived today, ready to be used by our forces. Communists claim this was all thanks to them, as usual."
 scw.54.a:0 "Time to bombard the fascists!"
 
 scw.55.t:0 "Soviet Tanks arrive!"
 scw.55.d:0 "Today is a great day, as a shipment of tanks has arrived from the USSR. The fascists lack anti-tank guns, and this will allow us to roll over them."
 scw.55.a:0 "Fascists beware!"
 
 scw.56.t:0 "Soviet Food arrives!"
 scw.56.d:0 "Today arrived a shipment of food from the USSR. This food will serve to delay the impeding famine and win the people, or at least the communists claim that."
 scw.56.a:0 "Distribute it to the people!"
 
 scw.57.t:0 "Soviet Advisors arrive!"
 scw.57.d:0 "A group of Soviet military advisors have arrived today from Moscow to help us organize our forces. With them also comes a group of NKVD officers that will most likely be used by the communists to hunt their enemies."
 scw.57.a:0 "They are welcome"
 
 scw.58.t:0 "Soviet Fighters arrive"
 scw.58.d:0 "A shipment of Soviet Fighters has arrived today to our ports, ready to be mounted and ready to be used to secure the skies away from the fascists."
 scw.58.a:0 "Assemble them immediately"
 
 scw.59.t:0 "Soviet Bombers arrive"
 scw.59.d:0 "A shipment of Soviet Bombers has arrived today to our ports, ready to be used to punish the fascists troops on the ground!"
 scw.59.a:0 "The fascists shall suffer!"
 
 scw.60.t:0 "Spain purges the communists!"
 scw.60.d:0 "After the government of the Spanish Republic was taken over by revolutionary socialists and their anarchist allies, they began speaking against the Communist Party of Spain and their war strategy. Now they have finally banned the PCE and imprisioned their leaders. The PCE is however a member of the Comintern and this act can't go unanswered if we want to maintain credibility."
 scw.60.a:0 "Withdraw all our support for them!"
 scw.60.b:0 "Fascism is still a bigger threat"
 
 scw.61.t:0 "The USSR withdraws their support"
 scw.61.d:0 "The Soviet Government has decided to punish our actions against the PCE, stopping all their support for our cause. Apparently, they thought that we are still fighting thanks to their guns and not thanks to our revolutionary spirit."
 scw.61.a:0 "Who needs them?!"
 
 scw.62.t:0 "Political Control"
 scw.62.d:0 "We have just taken power, and will lead the righteous Spain during this Crusade and beyond. However, many of our supposed allies are dissatisfied with this. Our leadership is far from secure and if we don't use the war to secure authority and centralize all political decision-making, the future Spain might have some serious troubles. \n\nIf we end the Civil War before we fully control the state apparatus, we will incur in severe consequences later, such as lack of political capital and social stability. However, ending the war quickly would reduce military losses and buy us more time to restore the economy before the looming global conflict erupts. What strategy shall we follow?"
 scw.62.a:0 "We will see..."
 
 scw.63.t:0 "The Execution of Francisco Franco"
 scw.63.d:0 "Madrid dawned today with lots of expectation, as the execution of Francisco Franco, the leader of the fascist rebels, was scheduled for this morning. A jury had charged him with \"Military Rebellion, High Treason, Illegal Arrest, Abuse of Power and Crimes against the People\", and sentenced him to death. This morning he was taken out of his cell by government representatives and armed militias, and taken to the prision courtyard, where the Interior Minister read a short statement, detailing his responsibility in the deaths of thousands of spaniards and the destruction caused by the military uprising. Visibly nervous, he was taken to the gallows, where he was the hanged. After that his body was thrown into a common grave, with militias starting celebrations all cross the country. These celebrations ended badly in Ferrol, where a group of socialists tried to burn down the house of the General's familiy and were stopped by the Assault Guard."
 scw.63.a:0 "Hang the fascist bastard!"

 scw.64.t:0 "The first Post-War Elections"
 scw.64.d:0 "The Second Republic has triumphed over the fascist rebels, and the Constitution of 1931 has managed to prevail. The Parliament elected in the turbulent election of 1936 has reached the end of its term, and a new one must be elected. As disputes between Socialists and Republicans over who should lead the government intensify, they have decided to form separate lists and ask the people, while pledging to continue their cooperation after the election, no matter the winner. The frontrunner is the PSOE, with their \"Plan Against Poverty\" attracting support from urban and rural workers alike, along with impoverished peasants and militias. \n\nThe other party with chances to win is Izquierda Republicana and its coalition partner Unión Republicana, led by Manuel Azaña and Diego Martínez Barrio respectively, although Azaña's poor health made Santiago Casares Quiroga the main IR leader. They are running on a moderate platform, presenting themselves as the true defenders of the Constitution of 1931 and pledging to uphold both equality and private property principles. They have the quiet support of liberals and many defeated conservatives, seeing them as the only alternative to socialism. \n\nAs the votes are counted and the results arrive, one party has managed to win a plurality of votes, and that party is..."
 scw.64.a:0 "PSOE!"
 scw.64.b:0 "The IR-UR Coalition!"
 
 scw.65.t:0 "Franco captured!"
 scw.65.d:0 "It had been a long day for general Franco. In the morning, his loud discussion with José Antonio Primo de Rivera, his second-in-command, threatened to break the political unity archieved in the Salamanca Meeting. With this thoughts on his mind, he went to have lunch with general Varela, in order to discuss the status of the war fronts. After a long talk, the pilot of Franco's plane warned him that he was wary of flying late, yet Franco and Varela continued. It was 20:00 when Franco finally left Varela's headquarters and prepared to return to Salamanca by plane. \n\nLittle he knew about the developments in the cockpit. The main pilot, refusing to fly that late, left the command of the plane to the secondary pilot. Although in other circumstances Franco, who is known for being excessively cautious, would have personally guided the plane back to Salamanca, he was completely focused on the issue of his discussions with José Antonio, and his plans of dismissing him and assume more absolute power. This plans however, could never come to fruition, as the secondary pilot was secretly a republican. With nobody supervising him, he took control of the plane and flew towards republican territory, with Franco on board. \n\n It was pretty late when Franco's airplane landed in the Barajas Airport. When he realized where he was, he tried to enter the cockpit with his guards, however republican security officers quickly entered the plane and disarmed Franco and his security detachment. While Franco was taken to prision, the Republican Government announced his capture to the whole world..."
 scw.65.a:0 "Franco is gone! José Antonio shall take full power!" 
 scw.65.b:0 "We got the bastard!"
 
 scw.67.t:0 "José Antonio takes over!"
 scw.67.d:0 "As soon as the news of Franco's capture arrived in Salamanca, José Antonio Primo de Rivera ordered his blueshirt militias to occupy the city. With complete control of the city, he delivered a speech to a massive crowd, where he assumed leadership before the National Defense Junta could react. He promised to crush the red scum, bring National-Syndicalism to Spain, and begin a new age of Spanish Imperialism. With the crowd cheering for him, the Junta had no option but to recognize his leadership, as long as the war lasts. José Antonio however has no intentions of giving up power..."
 scw.67.b:0 "Una, Grande y Libre!"
 
 scw.68.t:0 "Franco killed in prision"
 scw.68.d:0 "The capture of Franco did not end the war, as we hoped, but we still expected to trade a decent quantity of prisioners for him. That didn't happen, as José Antonio Primo de Rivera, the new leader of the fascists, refused to even discuss the return of Franco, probably with political intentions. The useless prisioner quickly became a problem for the prision authorities, as hordes of militias tried to assault the prision repeatedly to kill him. To finally end the problem and win a propaganda victory, the Government finally ordered the National Republican Guard to shoot him in prision and throw his body to a common grave. The hypocrite José Antonio then protested the action, promising to avenge him."
 scw.68.b:0 "...y Franco se va a paseo!"
 
 scw.69.t:0 "The Basque Provisional Government"
 scw.69.d:0 "The Basque Estatute of Autonomy was proposed in 1931, and it had a long process before it could come to effect. The victory of Lerroux in 1933 saw the approval of the Estatute paralyzed, but after the Election of 1936 the new Parliament finished the process and approved the Estatute. Even with the civil war raging on, today the President of the Basque Provisional Government, José Antonio Aguirre, was sworn in. He was elected by representatives of all city councils of the unoccupied Basque Country, and he belongs to the catholic right-wing Basque Nationalist Party ( PNV in spanish, EAJ in basque ). He is determined to preserve public order, freedom of worship and basque self-government, creating a special situation compared to the rest of the loyalist areas, that find themselves in the middle of a social revolution. This so called basque oasis may be easy pray for the fascists though..."
 scw.69.b:0 "Soon Galicia will have one as well!"
 
 scw.70.t:0 "Military Coup!"
 scw.70.d:0 "Even though we have been soundly defeated in multiple fronts, the hopes of a war in Europe moved the government to persist in a policy of resistance. However, several generals and politicians, tired of the war, have finally decided to oust the government and negotiate a peace with the fascists. Led by Segismundo Casado, they have beaten communists and government loyalists, forcing the Head of Government to go to exile, while they formed a National Defense Council, with Miaja acting as its figurehead and with representatives of many leftist factions. It seems that the Republic is lost..."
 scw.70.a:0 "Traitors!"
 SPR_consejo:0 "Consejo Nacional de Defensa"
 SPR_consejo_long:0 "Consejo Nacional de Defensa"
 
 scw.71.t:0 "Red generals coup their government!"
 scw.71.d:0 "Tired of the war and defeated on all fronts, some red generals have decided to defy their government and its policy of resistance, installing a new National Defense Council with the support of many leftist factions. Soldiers of the red army are meanwhile deserting en masse, leaving the trenches empty, as major red leaders run to exile. It seems that we only need one last offensive to win the war."
 scw.71.a:0 "Attack!"
 
 scw.72.t:0 "Military Coup!"
 scw.72.d:0 "Even though we have been soundly defeated in multiple fronts, the hopes of division within the red camp moved our government to persist in a policy of resistance. However, several generals and right-wing politicians, tired of the war, have finally decided to oust our leader and negotiate a peace with the reds. Led by Queipo de Llano, they have beaten falangists and carlists, creating a National Defense Council. They have arrested [SPA.GetLeader], however the reds are not very eager to negotiate now they seem to be winning. As our front collapses and many generals and politicians flee, one thing is clear: we have lost..."
 scw.72.a:0 "Traitors!"
 
 scw.725.t:0 "Fascist generals coup their government!"
 scw.725.d:0 "Tired of the war and defeated on all fronts, a clique generals have been planning a coup for some time (or that is what our spies tell us) and apparently it has been put in motion this morning. Led by Queipo de Llano, the coup plotters broke into the office of [SPA.GetLeader], demanding him to step down or face consequences. After his refusal to do so, 3 of the guards accompanying the plotters swooped down on their former leader and arrested him.\nRight after, the plotters wasted no time and proclaimed the formation of a new \"National Defense Council\" on the radio, which was met with overwhelming support from several military officers and moderate politicians, followed by a declaration that they would seek a peace with us.\n\n Falangists and carlists, sensing an preventive purge on the nationalist ranks by the council, are now fleeing the rebel cities and stablishing themselves in insolated areas like forests and mountains; our intelligence thinks they are preparing to wage a guerrilla war as the front against the fascists is now collapsing."
 scw.725.a:0 "Wonderful news!"
 
 scw.78.t:0 "The Badajoz Massacre"
 scw.78.d:0 "After taking the city of Badajoz, the nationalists troops have started a wave of killings and rapings in the city. The defeated republicans were taken to the bullfighting site and, in front of all the town authorities, they were used for human bullfighting and then executed. Various reporters have already covered this atrocity."
 scw.78.a:0 "What? That's a lie!"
 scw.78.b:0 "Barbarians"
 
 scw.79.t:0 "Paracuellos Massacre"
 scw.79.d:0 "After hearing that the nationalists soldiers were coming to Madrid, the scared republicans turned on their right-wing prisioners, afraid of their possible liberation. Thus their mass execution was ordered, and now their bodies lie in a common grave at Paracuellos del Jarama"
 scw.79.a:0 "Red barbarians!"
 scw.79.b:0 "To make an omelette you have to crack some eggs..."
 
 scw.81.t:0 "Guernica Bombing"
 scw.81.d:0 "The village of Guernica, a symbol for the basque people, has been brutally bombed by german and italian aviation yesterday. The tree of Guernica, symbol of the basques, has survived, but a lot of people who was peacefully going to the market didn't. This is one of the first bombings over civilian targets..."
 scw.81.a:0 "Fascism is death"
 
 scw.80.t:0 "Malaga-Almería Road Massacre"
 scw.80.d:0 "After the nationalist victory in Malaga, a column of scared civilians fled the city and went towards Almeria. However, italian planes bombed them in the Malaga-Almeria road, and thousands of old people, women, and above all children lay dead on the road. Why Italy bombed a column of fleeing civilians remains unexplained."
 scw.80.a:0 "Put me with the italian ambassador..."
 scw.80.b:0 "Fascists have no soul"
 
 scw.82.t:0 "Move capital to Valencia?"
 scw.82.d:0 "The nationalists are getting closer to Madrid. Some people are suggesting that we should move the government to Valencia, while others say that such choice would decrease our morale. What should we do?"
 scw.82.a:0 "Move the capital"
 scw.82.b:0 "We stay!"
 
 scw.83.t:0 "The Return of Prince Juan"
 scw.83.d:0 "After formally restoring the monarchy with General Kindelán as our regent, Prince Juan de Borbón, son of King Alfonso XIII, has triumphally returned to Spain. After being received in our provisional capital by a cheering crowd, he delivered a short speech, urging everyone to fight for the King, for Tradition, and for Order. This movement is another blow for carlism."
 scw.83.a:0 "Welcome!"
 SPA_agr_counter:0 "Agrarian Counter-Reform"
 SPA_church_carlist:0 "Church Privileges"
 
 scw.84.t:0 "The breakup of the Popular Front"
 scw.84.d:0 "After winning the war and holding the elections, the Popular Front had lost its purpose. The communist PCE has announced that it will stop supporting the government in the Parliament to become the \"People's Opposition\" while some moderate liberals and some radical socialists have also expressed their intentions of leaving the ruling coalition. The left-wing Republicans and the moderate Socialists have already announced their continued cooperation, in the form of a new \"Republican Front\""
 scw.84.a:0 "It was expected"
 
 scw.85.t:0 "Italian ammunition arrives!"
 scw.85.d:0 "Worried about our shorcomings, the Italians have decided to send a shipment of ammunition and small arms to sustain our war effort."
 scw.85.a:0 "That's good"
 
 scw.86.t:0 "Italian Artillery arrives!"
 scw.86.d:0 "Worried about our lack of equipment, the Italians have sent us a shipment or artillery pieces and ammunition. They say that they hope this shipment help us maintain our troops supplied."
 scw.86.a:0 "We are very thankful"
 
 scw.87.t:0 "Aviazione Legionaria"
 scw.87.d:0 "The Italians are worried about our complete lack of planes, due to the airforce staying mostly loyal to the Republic. In order to combat the FARE, the Italians have sent a big shipment of planes and pilots to secure air superiority. They intend to opperate from the Balearic Islans, and they have called themselves the \"Aviazione Legionaria\" ( Aviación Legionaria ). Let us hope they are useful."
 scw.87.a:0 "Welcome to Spain!"
 SPA_legion_arrive:0 "§YThe Aviazione Legionaria will be deployed in the Balearic Islands!§!"
 
 spa_shipment_delay:0 "80 days have passed since the last shipment"
 
 scw.88.t:0 "Italy is raiding our convoys!"
 scw.88.d:0 "Various reports coming from our Navy and the British Merchant Marine have noticed sudden attacks to our maritime supply routes, and these reports point to the Italian Regia Marina as the responsible. It is clear that they want to prevent us from buying food in the USSR so that we starve. There's really nothing we can do at this point..."
 scw.88.a:0 "Denounce them!"
 
 scw.89.t:0 "Intervene in Spain?"
 scw.89.scw.d:0 "The military rebellion in Spain has not been very successful so far, but the Spanish Nationalists are insisting in their struggle. While the Foreign Ministry is reluctant to support a rebellion against a country with fifteen thousand German citizens and a thousand German companies, the Party thinks differently. They argue that if the Nationalists win they could be a potential ally against the British, and since they have aspirations to retake Gibraltar they could be of much help in a war against the UK; not to mention their mineral resources. The Army and Air ministries are also eager to test their new planes, tanks and doctrines; the war in Spain being the perfect opportunity to do so... Should we get involved?"

 scw.89.scr.d:0 "The Socialist Rebellion in Spain has not been very successful so far, but the  are insisting in their struggle. The the Foreign Ministry and the Party are very keen in supporting the republicans against the trecherous communists who want to overthrow them. The main argument to intervene in the conflict is that if the Republicans win with our help, they could potentially become our ally in a future war with the UK since they have aspirations to retake Gibraltar. It would basically be a long term investment to ensure our advantage in a war with the English or the French. Furthermore, we would also stop the spread of bolshevism to Spain and deny the soviets of a new ally. The Army and Air ministries are also eager to test their new planes, tanks and doctrines; the war in Spain being the perfect opportunity to do so... Should we get involved?"
 scw.89.a:0 "Of course, we will!"
 ger_unlock_scw_decisions:0 "§YUnlock Decisions to intervene in Spain!§!"
 scw.89.b:0 "No, we have more important things to attend to."
 
 scw.90.t:0 "Germany offers support"
 scw.90.d:0 "German businessmen operating in the Protectorate of Morocco have informed us that the German Government is willing to support our cause. We can expect German planes, arms or perhaps even men coming in the following days and weeks."
 scw.90.a:0 "We should be thankful!"
 
 scw.91.t:0 "HISMA"
 scw.91.d:0 "In order to help our soldiers to cross the straits of Gibraltar, the Germans have created the Spanish-Moroccan Transport Society, or HISMA. Hopefully it is useful."
 scw.91.a:0 "Alright"
 
 scw.92.t:0 "The Condor Legion"
 scw.92.d:0 "Seeking to test their new planes and help us win the war in the air, Germany has started Operation Rügen Winter, creating a new volunteer unit called the Condor Legion. They come with quality fighters, bombers and pilots, and will be decisive for this war."
 scw.92.a:0 "To battle!"
 
 scw.93.t:0 "Expansion of the Condor Legion"
 scw.93.d:0 "The Germans are pretty happy with the Condor Legion, and they have expanded it with more planes and men. With this, air supperiority is practically secure."
 scw.93.a:0 "The reds are screwed!"
 
 scw.94.t:0 "Operation Feuerzauber"
 scw.94.d:0 "Germany has approved the execution of Operation Feuerzauber ( Magic Fire ), and will send lots of supplies to us. We expect that their supplies are enough to sustain our war effort."
 scw.94.a:0 "Gracias!"
 
 scw.95.t:0 "Tanks from Germany"
 scw.95.d:0 "Germany is not satisfied with only sending aerial forces, and now they have sent a group of light tanks to participate in the war. They will smash through the Republican lines!"
 scw.95.a:0 "Let's crush the reds!"
 
 scw.96.t:0 "Artillery from Germany"
 scw.96.d:0 "The Germans have sent us an artillery shipment. Anti-tank, anti-air and normal artillery pieces will serve to equip our divisions and destroy Republican tanks!"
 scw.96.a:0 "Useful"
 
 scw.98.t:0 "Mola is dead!"
 scw.98.d:0 "Emilio Mola, the \"Director\", organizer of the uprising that begun the civil war, is dead. His plane crashed against the ground near the town of Alcocero, near Burgos, due to the bad weather. His death significantly eases Franco's path to absolute power."
 scw.98.a:0 "What happens with plane crashes!?"
 
 scw.99.t:0 "The death of Cabanellas"
 scw.99.d:0 "General Miguel Cabanellas, one of the most important leaders at the start of our uprising, has died today due to his old age. One of our potential rivals is gone."
 scw.99.a:0 "How convenient"
 
 scw.100.t:0 "Civil War over!"
 scw.100.d:0 "The war is over, and the Republic has crushed the rebels! It's time to rebuild our country and mend the rift in our society. Viva la República!"
 scw.100.a:0 "The fascist beast defeated by the people!"
 
 scw.101.t:0 "Civil War over!"
 scw.101.d:0 "In the day of today, captive and disarmed the Red Army, National Troops have reached their last military objectives. The war is over."
 scw.101.a:0 "A new Spain rises!"
 
 scw.110.t:0 "The Nationalists are defeated!"
 scw.110.d:0 "The remaining fascist forces in the Peninsula have capitulated, and [SPA.GetLeader] has apparently left the country, seeking to organize a government in exile. While we are still at war, the conflict in Spain seems to be over, for now."
 scw.110.a:0 "¡Viva la República!"
 
 scw.111.t:0 "The Republicans are defeated!"
 scw.111.d:0 "The remaining red forces in the Iberian Peninsula have surrendered to our troops, and our control over Spain seems to be secure. The Republican government and its President, [SPR.GetLeader], have left the country and set up a government in exile, disputing our legitimacy. Although the war continues elsewhere, the conflict in Spain seems to be over, for now."
 scw.111.a:0 "¡Viva España!"
 
 scw.201.t:0 "The Church Question"
 scw.201.d:0 "With the war behind us, it is time to review our relations with the Catholic Church. Its activity was completely shut down in our controlled areas at the start of the war (except in the Basque Country), yet millions of catholics remain, and we should look into a solution to this problem. The first option would be to simply allow the Church to resume full activity under our protection, our leftist allies wouldn't like this, but our catholic population will. Other option would be to force some concessions on the Church; mainly making them renounce to education, many of their art, and allow us to monitor their services. The final option would be to refuse to give any protection to the Church, this would likely result in militias harassing catholics and preventing them to resume their activity. What should we do?"
 scw.201.a:0 "We should make sure that all catholics can attend mass"
 scw.201.b:0 "If the Church accepts the Republic, they'll enjoy our protection"
 scw.201.c:0 "The militias will take care of this"
 
 scw.202.t:0 "The CEDA Question"
 scw.202.d:0 "José María Gil-Robles, the former leader of the CEDA, has officially asked us permission to return to Spain and resume political activity. He actively collaborated in the coup, handing his camapaign chest over to the plotters, so his newfound democratic ideals are doubtful; yet a permanent ban on conservatism would be unconstitutional and damaging in the long run. As an alternative option, we could force Gil-Robles to remain in exile, but allow other conservative parties to be formed, under the leadership of republican conservatives such as Luis Lucia, Miguel Maura or Manuel Giménez. We should now make a choice."
 scw.202.a:0 "Allow Gil-Robles to return and to rebuild his party"
 scw.202.b:0 "The CEDA shall remain banned, but other conservative parties are allowed"
 scw.202.c:0 "Right-wing parties should remain banned for now!"
 SPR_prc:0 "PRC"
 SPR_prc_long:0 "Partido Republicano Conservador"
 SPR_pae:0 "PAE"
 SPR_pae_long:0 "Partido Agrario Español"
 
 scw.203.t:0 "The Question of Collectivized Property"
 scw.203.d:0 "Thousands of farms, factories, businesses and other assets were forcefully collectivized at the start of the war, as our authority collapsed and the Revolution took hold. With the fascists defeated, some of those owners affected by the collectivizations are demanding the restoration of their stolen properties, but many members of the cabinet have reservations about this. Some of these owners have ties to fascists and other far-right groups, and even those who don't may stir up serious unrest if we decide to ignore the will of the workers. An alternative solution would be to give compensation to former owners that have no ties with the fascists, although that might be too time consuming. The Minister of Finances is waiting for our decision, what should we do?"
 scw.203.a:0 "Return all properties to their rightful owners!"
 scw.203.b:0 "Set up a comission to investigate the claimants and give compensations"
 scw.203.c:0 "Give a token compensation and forget about it"
 
 scw.204.t:0 "The PCE Question"
 scw.204.d:0 "The Communist Party of Spain has gathered considerable influence within our government, our administration and our military. Although they lack enough support to seize power, and they remain an ally of our coalition, they can be a threat to our democracy down the line. Thus, in a private meeting, the Head of Government and President [SPR.GetLeader] discussed possible courses of actions to reduce the PCE influence. The President suggested to bring up all crimes committed by the PCE during the war in order to discredit them, while the Head of Government proposed a more pragmatic approach, approving measures to limit Soviet influence in national politics. As the discussion was coming to an end, President [SPR.GetLeader] looked at the files and said: \"Do we really need to do this?\""
 scw.204.a:0 "Let's bring up their civil war crimes to discredit them!"
 scw.204.b:0 "Try to limit Soviet influence in our politics"
 scw.204.c:0 "The PCE is our ally, no need for slander"
 
 scw.205.t:0 "The Barcelona Trials"
 scw.205.d:0 "In the Palace of Justice of Barcelona, those fascist generals that haven't been able to flee to exile await their trial. Among them, there are big names such as Queipo de Llano, Andrés Saliquet or Franco himself, who has been trying to contact his family in Portugal unsuccesfully. However, there are thousands of people involved in the coup awaiting trial, such as officers, governors, politicians, priests, right-wing intellectuals and even the carlist pretender, Javier de Borbón, who was captured near Pamplona. Hundreds of international observers have come to Barcelona to watch the trial and take notes, putting some significant pressure on the court and on its selected President, the conservative republican Mariano Gómez González. \n\nAs the trials progress, the sentences are about to be read out loud in the court room. What will be the fate of those who betrayed their oath to defend the Republic?"
 scw.205.a:0 "Franco: death penalty. The rest, life imprisonment"
 scw.205.b:0 "Generals shall be executed, the rest will go to prision"
 scw.205.c:0 "Death penalty for all rebel generals, governors and major politicians"
 
 scw.206.t:0 "Special Elections for the 3rd Republican Cortes"
 scw.206.d:0 "Elections were held today across Spain to fill the vacant seats in the Parliament after the war left many deputies dead, imprisioned or exiled. The northern regions had the most seats to fill, as their leftist deputies were mostly executed when the war began, and their right-wing ones were mostly exiled. The results have favoured the Socialists, the Republicans and the Liberal Coalition, that has managed to barely win some provinces in Galicia and Castilla in the abscence of any major conservative parties. Maura's Republican Conservative Party has won Soria and got 2nd place in Zamora, Ávila, Palencia and Lugo, turning them into the only real conservative force within the Republic. President [SPR.GetLeader] has already released a statement praising the Spanish people for the relative high turnout of these special elections, and foreign reporters seem surprised by the relative normalcy in which the vote was held, after a brutal civil war."
 scw.206.a:0 "A victory for democracy!"
 
 scw.207.t:0 "Formation of the Liberal Coalition"
 scw.207.d:0 "The liberal parties remained mostly loyal through the war, but kept a low profile in the face of the leftist Revolution. With the war over, Manuel Portela, of the National Republican Centre Party, and Felipe Sánchez Román, of the National Republican Party, have put up a joint statement announcing the creation of the \"Liberal Coalition\", inviting all remaining centrist forces to join \"in order to prevent a leftist takeover of the Republic\". Clara Campoamor has also taken her chance to restore the old PRR, after Lerroux and the old wing were discredited by corruption scandals (and some say that Lerroux even supported the fascists), and announced its incorporation to the new Coalition. It seems that we have a new political opponent..."
 scw.207.a:0 "They are essential for the normalization of our Republic!"
 SPR_cl_long:0 "Coalición Liberal"
 SPR_cl:0 "CL"
 
 scw.208.t:0 "Growth of the Republican Conservative Party"
 scw.208.d:0 "Luis Lucia Lucia, Manuel Giménez Fernández and Ángel Ossorio y Gallardo, prominent conservatives who opposed the fascist coup, have jointly announced their incorporation into Miguel Maura's Republican Conservative Party. Maura, the son of Antonio Maura, Prime Minister during much of the Alfonso XIII years, was a member of the first Republican government in 1931, and devoted himself to the creation of a republican, democratic right (without much success). With these 3 big politicians joining his party, the PRC has begun experiencing a big growth, specially in Castilla and Galicia. Exiled monarchists and fascists have labelled these moderate conservatives as traitors, but despite these threats many conservatives seem decided to have a voice in government and let the liberal Republic flourish once and for all."
 scw.208.a:0 "We welcome conservatives into our Republic!"
 
 scw.209.t:0 "The Revolutionary Socialist Party"
 scw.209.d:0 "Disgruntled with the moderate direction of the PSOE, and the apparent end to the Revolution, many socialist politicians, led by Luis Araquistáin, have left the party and created the Revolutionary Socialist Party, calling for the overthrow of the Republic through strikes, riots and other violent actions. Although many of the new party are his followers, Largo Caballero, old and tired, has decided to remain in the PSOE and mend relations with Prieto. It seems that the Socialist Party is no longer divided, and will be able to sustain the Republic much more effectively than before the war."
 scw.209.a:0 "Good riddance"
 SPR_prs:0 "PRS"
 SPR_prs_long:0 "Partido Revolucionario Socialista"
 
 scw.210.t:0 "The Revolutionary Alliance"
 scw.210.d:0 "The new Revolutionary Socialist Party, the remains of the Syndicalist Party and the POUM have today announced their merger into the Revolutionary Alliance, with the goal of repeating the social Revolution of 1936 and destroy the liberal system fully this time. Their other ideas are very loose, as one might expect in a coalition of syndicalists, anarchists, trotskists, radical socialists and other groups; but they may pose a problem if they start organizing strikes and other actions."
 scw.210.a:0 "They never get tired"
 SPR_ar:0 "AR"
 SPR_ar_long:0 "Alianza Revolucionaria"
 
 scw.211.t:0 "Forming a new government"
 scw.211.d:0 "The [SPR.GetRulingParty] has won the election, but now President [SPR.GetLeader] must task one of their leaders with the formation of a new government. Who shall lead Spain for the next 4 years?"
 scw.211.a:0 "Juan Negrín will continue to lead the government!"
 scw.211.b:0 "Indalecio Prieto is our man"
 scw.211.c:0 "Azaña's right hand man: Casares Quiroga"
 scw.211.e:0 "The leader of the UR: Martínez Barrio!"
 SPR_chose_hog:0 "§YWe have appointed a new head of government§!"
 SPR_held_forty_elections:0 "§YThe 1940 General Elections have been held§!"
 
 scw.212.t:0 "The Anti-Fascist Veterans Association"
 scw.212.d:0 "The Ministry of National Defense has announced today the creation of the Anti-Fascist Veterans Association (Asociación de Veteranos Antifascistas, AVA). Those veterans that sign up will enjoy a guaranteed income, reserved government jobs, lower taxes, easier access to education and a retirement pension. Despite the good reception of the initiative, reports of the AVA turning down veterans that served with anarchist militias is already stiring some tensions. After a brief meeting with the cabinet, the Minister of National Defense announced that..."
 scw.212.a:0 "All veterans are welcome in the association"
 scw.212.b:0 "The AVA is only for those who served in the professional army"
 
 scw.213.t:0 "Unrest in the Protectorate"
 scw.213.d:0 "In the early hours of the fascist coup, the government order our airforce to bomb Tetuán and other northern Moroccan cities. This pushed the locals into supporting the fascists, serving in their armies and unleashing their fury on our innocent people, raping, looting and murdering everyone and everything on their way. With our control over the Protectorate restored, unrest is once again rising among the people of the Rif. Our garrisons in Melilla, Larache, Ceuta and Tetuán are all reporting the creation of subversive, nationalist groups that may pose a problem down the line."
 scw.213.a:0 "Set up a comission to investigate the situation"
 
 scw.214.t:0 "The Pedroso Report"
 scw.214.d:0 "The comission we formed to investigate the situation at the Rif, chaired by Socialist deputy Manuel Martínez Pedroso, has finally sent us their recommendations. They warn against a possible repeat of the rebellions that rocked the Protectorate during the 1910s, and caused the end of the Constitutional Monarchy, so they advise us to reinforce security in the Protectorate, sending additional men to police the interior and crush and insurgency before it arises. However, this was not unanimous, as Tomás Peire Caballero, a liberal member of the comission, has released his own recommendations, advising us to improve the conditions of the natives through an ambitious education, healthcare and construction program. Pedroso has privately supported this proposal, adding that full equality betwen Spaniards and Moroccans in the area would significantly calm the rising tensions."
 scw.214.a:0 "We will reinforce our troops in the Protectorate"
 scw.214.b:0 "Follow Peire's advice: improve native conditions"
 
 spainf.1.t:0 "What to do with the revolters?"
 spainf.1.d:0 "We have defeated the socialists, but now we have to decide what to do with them. Should we moderate the repression, like the liberals suggest, or maybe do harsh crackdown on left-wing groups, as Gil-Robles proposes. What should we do?"
 spainf.1.a:0 "Harsh repression!"
 spainf.1.b:0 "Mild repression!"
 
 spainf.2.t:0 "Beggining of the 5 year plan"
 spainf.2.d:0 "The 5 year plan has begun, and we must choose what to focus our production on in the following months."
 spainf.2.a:0 "A pair of Battleships!"
 spainf.2.b:0 "We need cruisers!"
 spainf.2.c:0 "We will build some destroyers!"
 spainf.3.a:0 "Construct a carrier!"
 spainf.6.a:0 "Let's just end this..."
 spainf.3.t:0 "Battleships built"
 spainf.3.d:0 "Our comission has been completed, and we must choose what to focus our production on in the following months."
 spainf.4.t:0 "Cruisers built"
 spainf.4.d:0 "Our comission has been completed,, and we must choose what to focus our production on in the following months."
 spainf.5.t:0 "Destroyers built"
 spainf.5.d:0 "Our comission has been completed,, and we must choose what to focus our production on in the following months."
 spainf.6.t:0 "Carrier built"
 spainf.6.d:0 "Our comission has been completed,, and we must choose what to focus our production on in the following months."
 
 spainf.7.t:0 "Seizing Civilian Planes"
 spainf.7.d:0 "Our military personnel has already gone to our controlled airports and seized some civilian planes. The question is: what do we do with them?"
 spainf.7.a:0 "They will be fighters!"
 spainf.7.b:0 "They will be bombers!"
 
 spain.1.t:0 "Introduction"
 spain.1.d:0 "Spain has gone through a tough century. After the war with Napoleon and the loss of the empire, the country became increasingly divided in 2 halves hostile to each other: progressives and conservatives, that have taken different names through history. Fights between liberals and absolutists, isabelines and carlists, moderates and progressives, monarchists and republicans, federalists and unionists and socialists and capitalists have shaped these last hundred years and have left a huge divide between these two halves of the population. \n\n After the massive unrest experienced by the country during the Bolshevik Triennium ( 1918-1921 ), General Miguel Primo de Rivera stepped in and abolished the Constitution with the agreement of King Alfonso XIII, creating a military dictatorship. While this dictatorship brought stability, the shock of the Depression and the growing opposition led to the removal of Primo de Rivera and the installation of a provisional military government that called City Council Elections in all of Spain for the 12th April 1931. Suprisingly, republicans won in the main cities, which made the King leave the country. The Second Republic was born. \n\n Of course this Republic is not without problems. The centre-left cabinet formed after the 1931 general election relies on the socialists to stay on power, and has approved many reforms ( Agrarian, Military, Labour, Education ) that have angered the right, that attempted a coup last year led by General Sanjurjo. The coup failed and the government, led by Manuel Azaña, is strong. For now..."
 spain.1.a:0 "Let us prevail!"
 
 parliament_available_tt:0 "§Y§GCalm Before the Storm§! has a §RParliament mechanic§!. [SPR.GetFlag] §WSpain§!, as a §3Parliamentary Republic§!, has access to it in the decisions tab.§!"
 
 spain.0.t:0 "The Constitution of the Spanish Republic"
 spain.0.d:0 "The Second Spanish Republic is defined by its Constitution, made in 1931, as a Free Republic of Workers of all classes, where sovereignty resides on the people. In practical terms, Spain is a Parliamentary System with Separation of Powers, multi-partidism and freedom of speech and reunion. \n\n The Head of State is the President of the Spanish Republic, elected for a period of 6 years by the compromisarios, elected themselves by the people directly. Since 1931 the President is Niceto Alcalá-Zamora, an old conservative and a staunch republican. Executive power lies at the hands of the President of the Council of Ministers, who leads the government and chooses the ministers. He is chosen by the President of the Republic, and can be deposed by a vote of no confidence in the Parliament. Now the President of the Council is Manuel Azaña Díaz, leader of the leftist republicans, since the election of 1931. \n\n The Republic has an uni-cameral Parliament, also known as the Congress of the Deputies. The Parliament wields very strong powers, as it is able to depose both the President of the Republic and the President of the Council, propose laws, authorize the government to rule by decree (although they can always oversee the process) and approve regional Estatutes of Autonomy, and of course they need to approve any law the government proposes. This reliance on Parliament rather than in a strong executive is likely to cause instability in the future."
 spain.0.a:0 "The Constitution guarantees freedom and democracy!"
 
 spain.400.t:0 "Anarchist Insurrection Defeated"
 spain.400.d:0 "Despite initial resistance to the railway workers' proposal for a general strike last month, the Catalan Regional Defense Committee finally agreed to García Oliver's proposal of an insurrection to \"stop the consolidation of the Bourgeois Republic\", which was set to begin the first week of 1933. Thus the year began with a CNT bombing in La Felguera (Asturias), and what followed was a tumultous week where the anarchists burned down the church of Real de la Jara (Sevilla), occupied the townhall of Pedro Muñoz (Ciudad Real), and bombed more places in Gijón, La Felguera, Madrid and Gestalgar (Valencia). As anarchist agitation spread through Sevilla, Zaragoza and Asturias, the climax of the insurrection was reached today as anarchist militants attempted to assault the barracks of Carabanchel, La Montaña and María Cristina, in Madrid, and the barracks of Atarazanas, in Barcelona. After a brief shootout, the army has dispersed the anarchists and restored order in both cities. Despite some remaining agitation in Sevilla and Castellón, our reports indicate that the insurrection has been mostly put down, as with the 1932 Alto Llobregat insurrection. Despite failing at overthrowing the Republic, the CNT is managing to slowly erode the unity of the republican-socialist cabinet..."
 spain.400.a:0 "What a way to begin the New Year"
 
 spain.2.t:0 "The Casas Viejas Massacre"
 spain.2.d:0 "Following the CNT calls for insurrection, and despite their failure in the rest of Spain, a group of anarchist peasants occupied yesterday the townhall of the small town of Casas Viejas, in Cádiz. As usual, they proclaimed libertarian communism, cut the telephone lines, and surrounded the local Civil Guard Garrison. A group of Civil and Assault Guards was sent to relieve the garrison, but when they arrived they began arresting the protesters. Some of them took refuge in a nearby house, owned by a 76-year old anarchist militant nicknamed \"Seisdedos\" (Six-Fingers). The house was attacked by the Assault Guard with machine guns and rifles, and then burnt, following orders from Captain Rojas and General Director of Security Arturo Menéndez. All the protesters, except one, died burnt alive or shot by the police. At 4:00 AM, Rojas' men withdrew to their barracks, but aiming for a revenge, they continued arresting and executing local anarchists on the spot until they were ordered to withdraw. \n\n19 men, 2 women and 1 child have died at the hands of the police. The CNT is outraged, and has intensified their militancy against the Republic, while both the right and the left have begun to attack President Azaña, saying that it was him who ordered the executions. Although this is not true, our government has been very weakened."
 spain.2.a:0 "A Disaster!"

 spain.30.t:0 "The Law of Congregations Being Debated in Parliament"
 spain.30.d:0 "The Law on Religious Confessions and Congregations develops articles 26 and 27 of the Constitution and establishes that religious orders and congregations must be registered in a special Registry of the Ministry of Justice; it regulates public worship; it abolishes the State's "worship and clergy" endowment and eliminates other official subsidies; it nationalizes part of the ecclesiastical patrimony (temples, monasteries, seminaries, etc. ) although they remain at the disposal of the Church; it attributes to the State the power to veto certain religious appointments; and finally, it establishes the closing of Catholic secondary schools by October 1 and primary schools by December 31, 1933.\nIt also forbids religious orders to "exercise commerce, industry or agricultural exploitation by themselves or through an intermediary" and "to engage in the exercise of teaching" except for that "which they organize for the formation of their own members"."
 spain.30.a:0 "Ok"

 spain.31.t:0 "The Law of Congregations Approved by Parliament"
 spain.31.d:0 "The Law on Religious Confessions and Congregations has been approved by the parliament. It is now on the way to the President's desk to be signed."
 spain.31.a:0 "Fantastic!"
 
 spain.401.t:0 "Agrarians and Conservatives protest against the Agrarian Reform"
 spain.401.d:0 "Our insistence in carrying out the Agrarian Reform has been drawing the ire of the more conservative sectors of society since 1931. In August of that year they created the Asociación Nacional de Propietarios de Fincas Rústicas, \"in defense of the legitimate right of property\", and using the old cacique networks and the continuous appeal to the intervention of the Guardia Civil they boycotted the application of the \"agrarian decrees\". Likewise, in the Cortes, the agrarian minority carried out a spectacular obstruction of the debates on the Agrarian Law, which contributed notably to the delay in its approval.\n\nToday, an Economic-Agrarian Assembly was held in Madrid which has brought together the landowners and the right-wing parties to protest against the proposed law of Rustic Leases, and to demand the resignation of Agriculture Minister Marcelino Domingo. This campaign has managed to mobilize large sectors of the conservative peasantry of the northern half of Spain (the non-landowning half) and has also somehow succeeded in paralyzing the new law.\nEver since the failure of Sanjurjo's coup in August last year, opposition to the Agrarian Reform has laid low, but this protest may be a sign of future things to come..."
 spain.401.a:0 "Their only objective is for Spain to rot."

 spain.32.t: "The Church denounces us!"
 spain.32.d: "Today, upon learning that the Law of Confessions and Religious Congregations has been approved (although the president has not yet signed it) the Spanish cardinals and bishops, headed by the new Cardinal Primate Isidro Gomá y Tomás (who has succeeded the controversial Cardinal Segura last month), have made public an episcopal letter that considers the law \"a harsh outrage to the divine rights of the Church\", condemns \"all the interferences and restrictions by which this law of aggressive exception places the Church under the dominion of the civil power\" and calls for the mobilization of Catholics against the government."
 spain.32.a: "Meh"
 
 spain.402.t:0 "The Pope protests against the Government"
 spain.402.d:0 "Yesterday, after the promulgation of the Law of Congregations, the encyclical \"Dilectissima Nobis\" of Pope Pius XI was made public. In it he condemns the \"anti-Christian spirit\" of the Spanish regime, affirming that the Law of Congregations \"can never be invoked against the imprescriptible rights of the Church\", and calls for mobilization of all Catholics against the Republic. The Encyclical states:\n\"Faced with the threat of such enormous damage, we strongly recommend to the Catholics of Spain that, leaving aside recriminations and lamentations and subordinating to the common good of the homeland and of religion every other ideal, they should all unite, disciplined, for the defense of the faith and to ward off the dangers that threaten civil society itself.\"\n\nThere are rumors that the church is going to excommunicate the authors of the law on congregations, among them the president for signing the law. This news has sown desolation and horror in the family of the president, who is a convinced Catholic. They report a tearful scene between the Bishop of Madrid and the President's wife. All over Madrid there is a rumor that the President is going to resign, although it is very unlikely."
 spain.402.a:0 "Who cares about what the Pope has to say?"
 
 spain.403.t:0 "Alcalá-Zamora dismisses Azaña!"
 spain.403.d:0 "Upset by the passing of the Law of Religious Organizations and Congregations, the catholic President Niceto Alcalá-Zamora has decided to finally sign the law, but he has also dismissed Manuel Azaña has Head of Government. Now he must find a new one among the Republican ranks, however, the rivalry between Lerroux and the Socialists may prove a significant obstacle in the formation of the new government..."
 spain.403.a:0 "Is that the end for Azaña?"
 
 spain.404.t:0 "Azaña reappointed"
 spain.404.d:0 "Seeing how an alternative majority to the republican-socialist coalition is almost impossible, President Alcalá-Zamora has decided to reappoint Manuel Azaña as Head of Government. His new cabinet is almost a carbon copy of the last one, except for the Foreign Ministry, where Socialist Fernando de los Ríos will replace Luis de Zulueta, who will become the next Ambassador to Germany. Although the republican-socialist coalition will continue for now, this episode proves how easy is for President Alcalá-Zamora to end it anytime he wants. And he is not very happy with the PSOE in the cabinet..."
 spain.404.a:0 "Wait, really?"
 
 spain.405.t:0 "Rightists denounce the Public Order Law"
 spain.405.d:0 "As the Public Order Law is debated by the Cortes, its authoritarian nature has alarmed the right, specially the moderates. While Gil-Robles has simply warned the socialists that the Law could turn against them soon, the Agrarian Minority has denounced that the Law leaves the citizens at the mercy of the government, while the christian-democrat Ossorio y Gallardo has said that most of the Law is unconstitutional. The government has ignored the warnings and the process to pass the law continues, as the cabinet wants to have more tools at its disposal to fight the anarchist threat."
 spain.405.a:0 "They want us to surrender to the anarchists!?"
 
 spain.406.t:0 "Construction of the Chamartín Station Begins"
 spain.406.d:0 "Since the mid-nineteenth century the historical location of the so-called North Station -actually located to the West- has buried Madrid in the depths of the Cuesta de San Vicente, as the city is walled by the geological ridge to the west making it partially isolated. This limitation determines that iron road networks have to ford the ridge and avoid the slopes that surround Madrid from west to south. As a result, the development of Madrid is short-circuited by the railroad itself, which cuts through the hamlet introducing insurmountable discontinuities dotted with industrial areas near the tracks to link to the transport of goods by train, all with very adverse effects on the population of Madrid and the capital's economy.\n\nAware of such an obvious and expensive hindrance, both Prieto and Azaña have opted to devise an effective way to juggle it. Given that the natural expansion of the city is oriented in the direction of the northern part of Madrid, they initially decided to plan the area urbanistically. But now, as a pioneering measure, they have arranged to move the location of the administrative center of the State to the macro-building of the Nuevos Ministerios, with a station located underneath it. In addition, Prieto has opted for the subway-railway axis that will connect the main railway station of Atocha with Chamartín, by means of a 7-km long tunnel that contemplates connecting bypass lines for freight, peripheral residential areas and long-distance routes.\n\nResistance to innovation has led the most backward sectors to pejoratively baptize the tunnel with the name of \"Tubo de la Risa\" (Tube of Laughter), a name inspired by an old fairground attraction."
 spain.406.a:0 "We need to reorganize the railway network!"
 
 spain.407.t:0 "Doubts in the PSOE"
 spain.407.d:0 "After almost 2 years being part of the ruling cabinet, the Socialist Party is starting to have doubts about their strategy. Indeed, clashes between the police and socialist militants, such as the ones in Castilloblanco and Arnedo one year ago, and the more recent Casas Viejas massacre leave the party in a hard position, so many PSOE and specially UGT (General Union of Workers, the PSOE trade union) politicians want to leave the government, be it by supporting it from the outside, as defended by Public Works Minister Prieto, or by leaving it completely, as defended by the UGT, afraid by the growth of its rivals of the CNT. Caballero refuses to leave the government, arguing that his reforms in the Labour Ministry are not complete, and that the Republicans can't resist the right by themselves. As the pressure builds up inside the party, another Casas Viejas or a similar crisis might convince the Socialists that their job inside the government is done, leaving Azaña alone against the right."
 spain.407.a:0 "Let's hope that doesn't happen"
 
 spain.408.t:0 "4th Congress of the Radical Republican Socialist Party"
 spain.408.d:0 "Today the Radical Republican Socialist Party, or PRRS for short, held their 4th Congress in Madrid. Founded in 1929, the jacobin and social-democratic PRRS has been one of the main sources of support for the Republic, joining the San Sebastián Pact and the Provisional Government, and coming in 3rd place in the 1931 General Election, behind the PSOE and the PRR. However, since the formation of the Azaña cabinet, which they are part of, the party has grown increasingly divided. The right-wing faction, led by the veterinarian Félix Gordón Ordás, wants to see the socialists out of government and an increased collaboration with the PRR, fearing a socialist revolution. Meanwhile, the leftist faction, led by Agriculture Minister Marcelino Domingo, supports the alliance with the socialists and the more radical aspects of Azaña's reforms. This division is slowly destroying the party, and, despite the apparent agreement reached between the two factions in the Congress, many journalists and experts believe that the PRRS is heading towards its dissolution."
 spain.408.a:0 "If they split, what will happen to our majority?"
 
 spain.409.t:0 "Economic Downturn"
 spain.409.d:0 "Despite our initial resistance to the worst effects of the Great Depression, isolated as we are from the world economy thanks to our century-long protectionist policy, the recent economic news are not good. The bad crops, the economic fear that followed the fall of the monarchy, the labour and agrarian reforms and the worldwide Depression are all causing a massive increase in unemployment, which now is hitting the 10% line. Of those unemployed, more than 50% are peasants, so we can expect greater unrest in the coming months."
 spain.409.a:0 "We did not need this!"
 
 spain.410.t:0 "Strike numbers go up!"
 spain.410.d:0 "As the economic downturn continues and unemployment increases, the poor situation has caused a massive spike in strike frequency, registering 300% more strikes this year than in 1930. It seems that the measures enacted by Largo Caballero's Labour Ministry are not having the desired effect of bringing peace to our society, or maybe the CNT is working to bring us down... In any case, we have to expect intensified protests from both the workers and the higher classes during the coming weeks to months."
 spain.410.a:0 "All these concessions did nothing to placate them?"
 
 spain.411.t:0 "Lerroux denounces our government!"
 spain.411.d:0 "Today, the leader of the opposition Alejandro Lerroux has denounced our government in a fiery speech in the Cortes, calling it a \"socialist dictatorship\" and a \"complete disaster\". Lerroux's PRR has been the main opposition force to our cabinet since they left in in late 1931, and with the right largely absent from the Parliament, Lerroux's speeches have made him the preferred choice of the more liberal-minded middle class that wants the socialists out of the government. In fact, it is said that the only things preventing Lerroux to form a new government are his abbrasive personality and his rivalry with President Alcalá-Zamora, as both men compete to lead the Republican alternative to Azaña's left. In any case, the PRR's parliamentary harassment has been a pain during these 2 years, and will continue to be until the government falls or Lerroux is replaced by someone more agreeable, like his second-in-command Diego Martínez Barrio."
 spain.411.a:0 "Can't he shut up for once!?"
 
 spain.412.t:0 "Magna Asamblea Nacional"
 spain.412.d:0 "Today, of all the most important business organizations (the Confederación Gremial, the Confederación Patronal and the Unión Económica) have gathered in Madrid in a \"Grand National Assembly\" to demand once again a change in the composition of the mixed juries, and an end to the republican-socialist coalition. For its part, the Spanish Confederation of Agricultural Employers has accused the Socialists and their policies in the Ministry of Labor of having transferred \"the hateful class war\" from the city to the countryside, in addition to requesting the revision of the Agrarian Reform Law for being \"unlawful and anti-economical\".\nAlthough it is to be expected given our agenda, these protests do nothing but build up the pressure inside our government coalition, as well as giving the radicals a political weapon to erode our government..."
 spain.412.a:0 "Damned Landowners"
 
 spain.413.t:0 "Elections to the Constitutional Court"
 spain.413.d:0 "Although officially created in 1931, the Constitutional Court has been assembled during this year, with PRRS member Álvaro de Albornoz chosen to lead it. Yesterday elections were held to choose 15 out of the 25 members of the Court; those allocated to the city councils and chosen in a regional fashion. The results show a catastrophic defeat for the ruling coalition, as they have only been able to win 5 out of the 15 contested seats. The other 10 went to the PRR, the CEDA and the Basque nationalists. Azaña knows that President Alcalá-Zamora has been waiting for an excuse to dismiss him again, so after the defeat he has rushed a confidence motion through the Cortes. Even if it passes, Azaña's future as Head of Government is very much unlikely."
 spain.413.a:0 "What a defeat..."
 
 spain.414.t:0 "Azaña Resigns"
 spain.414.d:0 "Despite winning the Motion of Confidence in the Cortes, Azaña has resigned as Head of Government after President Alcalá-Zamora told him that he had lost the confidence of the Presidency. Now Alcalá-Zamora has chosen to ditch the republican-socialist coalition and form instead a Republican Concentration without the socialists, but including the PRR and other centre to centre-right republicans, along with Azaña's AR, the PRRS and other minor parties. The man chosen to lead this coalition is none other than Alejandro Lerroux, the leader of the PRR. As Lerroux forms this new cabinet however, there is little faith in it succeeding..."
 spain.414.a:0 "Lerroux will lead the Republican Concentration!"
 
 spain.415.t:0 "Tumultuous Parliament Session"
 spain.415.d:0 "Less than a month after the formation of the Republican Concentration under Lerroux, the coalition is dire danger due to today's turbulent parliamentary session. Instead of trying to amend relations with his coalition partners of AR, Lerroux began his speech insistently attacking Azaña's government. As expected, Azaña replied that he was still acting as the lead of the opposition leader, and seeing how the Head of Government was not interested in the stability of the coalition, his left-wing Republicans would leave it at once. What followed was a violent exchange between Lerroux, who called Azaña a \"snake\", Azaña himself and Prieto, who pitched in to defend the previous republican-socialist cabinet. At the end of the day, Prieto announced that the PSOE would present a No-Confidence motion against Lerroux, and with the left republicans out of the coalition, the fall of the government is very likely."
 spain.415.a:0 "Lerroux couldn't keep his mouth shut"
 
 spain.416.t:0 "Cabinet debates Public Works"
 spain.416.d:0 "Another day, another debate inside the Council of Ministers. The issue is Luis Lucia's proposal for a Public Works programme to create employment, a common initiative in this times of Depression. However, Chapaprieta's strict spending policies would have to be relaxed in order to provide adequate funds for this program, and his wing of technocratic independents won't be pleased with that decision. It is up to Lerroux to decide if we should approve the program or stick with fiscal conservatism..."
 spain.416.a:0 "Our budget couldn't handle it!"
 spain.416.b:0 "Approve a more limited program"
 spain.416.c:0 "Lucia will have his way: approve the full program!"
 
 spain.417.t:0 "Cabinet debates the Military Reform"
 spain.417.d:0 "One of the first issues at hand is the rectification of Azaña's Military Reform. War Minister and PRR member Diego Hidalgo has proposed to keep the reform, as it is good for our military capabilities, but to promote several right-wing africanista generals that were demoted during Azaña's tenure. For example, the former Director of the Zaragoza Military Academy Francisco Franco would be promoted to division general, and many other military leaders such as Emilio Mola or Manuel Goded would be allowed back in the armed forces. Gil-Robles is proposing to go further, legally removing some aspects of Azaña's reform, while the more republican ministers of the cabinet are horrified by both proposals and warn us against the promotion of anti-republican leaders such as Franco to positions of power..."
 spain.417.a:0 "Hidalgo's proposal sounds reasonable"
 spain.417.b:0 "We need to repeal the reform in its entirety"
 spain.417.c:0 "We can't allow reactionaries back in the Armed Forces"
 
 spain.418.t:0 "What to do with Sanjurjo?"
 spain.418.d:0 "One of the main points of our agreement with the CEDA is the release of Sanjurjo and other collaborators of his coup attempt that are still in prison. President Alcalá-Zamora has warned against such a move, and he might even refuse to sign the decree. Gil-Robles won't move an inch though, so we have to decide which party do we want to alienate..."
 spain.418.a:0 "Release Sanjurjo immediately!"
 spain.418.b:0 "Send Sanjurjo to exile in Portugal"
 spain.418.c:0 "Putschists like him can rot in jail!"
 
 spain.419.t:0 "Cabinet debates the Religious Question"
 spain.419.d:0 "With Azaña ousted from power, the time has come for the right to reverse his anti-clerical reforms. As it is common, there are disagreements within the cabinet about how far our counter-reform should go. We can approve a token subsidy for impoverished clergymen, guarantee the free exercise of catholic rituals and return some assets to the jesuits, or we can go further an fully comply with the CEDA's demands: repeal of Azaña's laws and the restoration of the subsidy that was in place during the monarchy. It is up to Lerroux, the former anti-clerical agitator, to decide."
 spain.419.a:0 "Some minor compensations will suffice"
 spain.419.b:0 "Approve the token subsidy and compensate the Jesuits"
 spain.419.c:0 "The CEDA is right: full repeal of Azaña's laws!"
 
 spain.420.t:0 "Cabinet debates the Education Question"
 spain.420.d:0 "With the religious issue solved for now, we must now turn to something closely related to it: Education. The reopening of catholic schools is on the table, but the CEDA wants to go even further and restore catholicism as a compulsory subject in the schools' curricula. This has been met with fierce opposition from the more republican-minded sectors of the cabinet, led by Education Minister Filberto Villalobos, whose Bachillerato Plan preserves the secularist spirit of the Constitution. Once again, we have to choose which side to back..."
 spain.420.a:0 "Reopening catholic schools will suffice"
 spain.420.b:0 "Try to reach a compromise solution"
 spain.420.c:0 "Follow the CEDA's proposal: reintroduce religion to schools!"
 
 spain.421.t:0 "Cabinet debates the Agrarian Question"
 spain.421.d:0 "Bitter debate is once again raging inside the Council of Ministers, this time about the issue of the Agrarian Reform. All parties inside our coalition agree in reversing Azaña's policies on the matter, but 3 different courses of action may be taken. The most moderate proposal comes, strangely, from the CEDA, or more specifically from the moderate Manuel Giménez Fernández. Following a social catholic doctrine, Fernández wants to guarantee the rights of new settlers, give legal cover to many land occupations, and continue the redistribution efforts albeit at a slower pace than under Azaña. The second proposal comes from Agriculture Minister and PRR member Cirilo del Río. This plan consists on leaving the main Agrarian Reform law intact and let the land redistribution proceed, while also repealing most of the other agrarian decrees that prevent landowners from abusing their workers or leaving them deliberately unemployed as a punishment. Finally, the radicals of the Agrarian Party have a different idea. Landowner and agrarian leader Nicasio Velayos has demanded the expulsion of many settlers from their new lands, the end of redistributions and a severe cut on subsidies. What path should we take?"
 spain.421.a:0 "Giménez Fernández's moderation is the right idea"
 spain.421.b:0 "Cirilo del Río's proposal is the most sensible choice"
 spain.421.c:0 "Nicasio Velayos is right! Out with socialist policies!"
 
 spain.422.t:0 "Cabinet debates the Social Question"
 spain.422.d:0 "The time has come for us to review Largo Caballero's labour legislation, at the request of industrial owners and right-wing parties. This time the Radical Party wants to strike a moderate tone, mindful of the strength of the CNT and the UGT, proposing only a partial revision of Caballero's reforms. However, CEDA politician José Oriol has demanded a full repeal of Caballero's decrees, and the enactment of further legislation to restrict union activity. It is up to Lerroux which path to follow..."
 spain.422.a:0 "The PRR is right. We can't ignore the unions"
 spain.422.b:0 "The CEDA is right. We must crush these upstart socialists!"
 
 spain.423.t:0 "What to do with the Revolutionaries?"
 spain.423.d:0 "The Revolution has been crushed! Under the leadership of generals López Ochoa and Franco, the socialists of Asturias have been destroyed, while general Batet has arrested the rebellious Catalan government. Now we have to decide how far should we go with the repression. President Alcalá-Zamora and the Republicans are requesting us to be moderate, while the right is outraged and wants to see harsh punishments. It's not an easy decision to make, and it may determine the fate of our coalition in the upcoming election..."
 spain.423.a:0 "Repression should be proportional"
 spain.423.b:0 "This coup attempt can't go unpunished!"
 
 SPR_radicalise_right:0 "§RThis will radicalize the Right!§!"
 SPR_radicalise_left:0 "§RThis will radicalize the Left!§!"
 spr_crushed_asturias:0 "The §YAsturias Revolution§! has been crushed"
  
 spain.3.t:0 "General Elections Called!"
 spain.3.d:0 "As expected, Lerroux's government lost the confidence of the Cortes shortly after his exchange with Azaña, so he had to resign. Refusing to recreate the republican-socialist coalition, President Alcalá-Zamora has instead opted to appoint a republican government led by PRR second-in-command Diego Martínez Barrio, who immediately dissolved the Parliament and called for new elections, scheduled for late November. The socialists, angry about being left out of the caretaker government, have cut all ties with the Republicans, and will go to the elections alone. Meanwhile, the CEDA sees this as a big opportunity..."
 spain.3.a:0 "Let us prepare our campaign"
 
 spain.4.t:0 "Elections of 1933"
 spain.4.d:0 "The results are here! It seems that there are two clear winners of this election: the Radical Republicans (PRR) and the new CEDA party, that have managed to take most seats in the Cortes thanks to the electoral law, that favours coalitions. The socialists have lost lots of seats, while Azaña's republicans have been decimated. This disaster for the left can be explained by their disunity, punished by the electoral system, but also by the CNT decision of abstaining instead of supporting the left-wing parties, caused by their anger over the Casas Viejas killings earlier this year. This was also the first Spanish election in which the women voted, as per the 1931 Constitution."
 spain.4.a:0 "Lerroux will form a new government!"
 
 spain.5.t:0 "CEDA asks for ministers"
 spain.5.d:0 "Gil Robles has demanded Lerroux the inclusion of various CEDA ministers in his cabinet. While the proposal has logic, given that the CEDA is the largest party in the parliament and has been supporting Lerroux for some time now, the left is declaring that doing it would be 'the gateway to fascism'"
 spain.5.a:0 "We have no other choice"
 
 spain.6.t:0 "Socialist Revolution!"
 spain.6.d:0 "After the inclusion of the CEDA ministers, the socialist party has organized, with the support of the CNT and the UGT, a grand insurrection in all the country to 'prevent the rise of fascism'. However, the revolution has failed in every place, with the exception of Asturias. The Asturian Soviet that now challenges the government is weak, but if it survives long enough it may inspire more workers to rise up in revolt!"
 spain.6.a:0 "We will crush the rebels!"
 spain.6.b:0 "Por el Pueblo Trabajador! (Play as the revolutionaries)"
 asturias_rebellion:0 "§RThe Workers will rise up in Oviedo!§!"
 
 spain.7.t:0 "Catalonia declares independence!"
 spain.7.d:0 "Catalan President Lluis Companys has just declared the independence of Catalonia! He is now moving towards the Barcelona garrison, with hopes of convincing them to join his side. Will we have to fight in another front?"
 spain.7.a:0 "Let's see what happens"
 
 spain.8.t:0 "Revolt contained"
 spain.8.d:0 "General Domingo Batet, leader of the Barcelona garrison, has done what we expected: he has taken the city and arrested Companys. Catalonia is back under our control!"
 spain.8.a:0 "Good news"
 
 spain.9.t:0 "Catalonia Revolts"
 spain.9.d:0 "Surprising news arrive from Barcelona! General Domingo Batet, leader of the Barcelona garrison, has been imprisioned by his own troops, that have declared their support for the new Catalan Republic! We have lost control over Catalonia, as the catalan 'National Defense Militia' occupies the countryside. It seems war will solve this..."
 spain.9.a:0 "Cataluña es España!"
 spain.9.b:0 "Visca Catalunya Lliure!"
 
 spain.10.t:0 "The Straperlo Affair"
 spain.10.d:0 "Games of chance - especially roulette - are forbidden in Spain, as well as in most European countries. However, in the 1930s, numerous models of pseudo-roulettes became popular, which were happily operating in large casinos all over the continent. Businessmen Daniel Strauss, Perle and Lowann saw an opportunity to make quick money from this, so they created a fraudulent roulette game (popularly known as \"estraperlo\" after the names of its three promoters) and then reached an economic agreement with government politicians to exploit it in the Casino of San Sebastian. Several figures in the orbit of the Radical Party would use their influence to obtain the authorization, in exchange for a percentage in the business.\nAt the beginning of September the game was banned by the San Sebastian police after it was shown to be fraudulent (as the wheel was controlled by a button, therefore the banker won whenever he wished), which made Strauss almost go bankrupt, so he threatened Lerroux with making the bribes public if he did not offer him compensation. Lerroux refused, so Strauss presented a complaint to the President of the Republic in which he demanded \"compensation\" for the installation expenses of the game in the casinos of San Sebastián and Formentor, and for the bribes he claimed to have paid to politicians of the Radical Republican Party and to "relatives and friends" of its leader Alejandro Lerroux. Attached to the letter, was a dossier with the entire corruption scheme.\nAlcalá Zamora showed it to Lerroux, who was then the president of the government, but the latter gave it no importance and apparently told him that \"it would be very difficult to prove his alleged contacts with Strauss\".\n\nAfter the government crisis in mid-September, when Lerroux renounced to continue heading the government (there are rumors that Alcalá Zamora forced him to resign when he learned of the Strauss dossier), the President transferred the denunciation to the new government presided by Joaquín Chapaprieta and forced him to have the case debated in the Cortes, where a parliamentary commission has been formed to investigate the case.\nThe discovery of this \"Estraperlo Scandal\", as the press calls it, has caused the popularity of the Radical Party and its leader to plummet."
 spain.10.a:0 "Outrageous!"

 spain.144.t: "The end of the Estraperlo Case"
 spain.144.d: "Congress had never been as lively as it was yesterday. The seats of the hemicycle were completely filled and the tribunes were crowded. The scandal of the \"estraperlo\" had overtaken even the Italian-Abyssinian war in terms of interest.\nThe opinion of the parliamentary commission was read in the midst of a sepulchral silence. During this time, Lerroux looked straight ahead, with his arms crossed and seemingly calm. When it was the turn of the mayor of Madrid, Salazar Alonso, who came in his best suit and who, being under indictment, spoke with emotion in his own defense. Don Alejandro himself, although no one was accusing him frontally, spoke to exonerate his entourage, although he did so incoherently, and referred to himself as a tired and worn-out old man in the service of the Republic. Nobody applauded his intervention.\nThen Primo de Rivera asked for the word. His speech was brief and intense, and ended with a sentence that caused a storm in the Chamber:\n\"Here there is no more and no less than a case of general disqualification of a political party: the disqualification of the Radical Party\" he said nailing his gaze on the Radicals.\nIn his reply, Gil-Robles reiterated that the denunciation in no way concerned the personal conduct of Don Alejandro Lerroux, and recalled that the Government had acted with total efficiency, immediately transmitting it to the competent courts. \"In short, all this is a plot. A crude attempt by the left to divide the coalition of the right, ladies and gentlemen\" he concluded.\n\nOnce again everyone was at each other's throats in the Chamber. Lerroux remained hieratic, oblivious to the fray. Soon a secret ballot was held, in which everyone went down to vote for or against the indictment. Almost all the defendants were indicted: José Valdivia, Eduardo Benzo Cano, Sigfrido Blasco-Ibáñez, Aurelio Lerroux, Juan Pich y Pon, Santiago Vinardell and Miguel Galante. The only one who was spared was Salazar Alonso, former Minister of the Interior, who was the one who signed the permit and received a bribe of 100,000 pesetas.\nWhen the vote was over and the total exculpation of Salazar Alonso was known, a penetrating voice was heard exclaiming, \"Long live the estraperlo!\"—It was José Antonio Primo de Rivera, who looked at them all, from his seat, with a mocking smile on his lips.\n\nAs for Lerroux, he resigned today from his post as minister along with the other radical minister implicated in the affair, Juan José Rocha; he has also retired from politics temporarily. In his absence, Santiago Alba will lead the party."
 spain.144.a: "A big blow for the Radicals"

 spain.145.t: "The Nombela-Tayá Affair"
 spain.145.d: "A few days ago, the Inspector General of Colonies, Antonio Nombela, accused several leaders of Lerroux's party, especially the Undersecretary of the Presidency of the Government, Moreno Calvo, of having fraudulently resolved a file in which the West Africa Company, owned by the Catalan businessman Antonio Tayá, was compensated with three million pesetas for the loss of two ships in Equatorial Guinea.\n\nNombela, a disciplined military aviator, who had participated in the war in Morocco in 1921 and was decorated with the Laureate Cross of San Fernando, was appointed General Inspector of Colonies in 1934 and quickly gained prestige as an efficient colonial manager, fully involved in the service to the Guinean society. That is why when he came across a corrupt plot from Madrid that was trying to plunder the coffers of the Colonial Treasury, he refused to pay the compensation and turned to some members of the government to denounce the case, namely the CEDA ministers José María Gil Robles and Luis Lucia, but was ceased by the government for doing so.\nAfter his unjust dismissal, Nombela took a complaint to the president of the Cortes in which he gave a full account of everything that had happened, accompanied by documents that proved his accusations. Very quickly the president reported the complaint to the Cortes, where a parliamentary commission of investigation was formed, much like in the estraperlo scandal. But unlike the latter, Alejandro Lerroux is directly implicated, since as president of the government he had signed the file that approved the compensation.\nWhen the parliamentary debate took place a few days later, Lerroux was not able to give convincing explanations about the accusations of corruption, but nevertheless he was exonerated of everything in the vote.\n\nThis second scandal seems to have been the final nail in the coffin for Lerroux and the Radical Party, which have now become politically dead."
 spain.145.a: "Another one?"
 spain.11.t:0 "Lerroux's Government Falls"
 spain.11.d:0 "It seems that the question of the scope of the reform of the Constitution and the return of some of the competences to the Generalitat, which had been suspended on the occasion of the "October Revolution", have opened a crisis in the government. Lerroux has taken advantage of the resignations of the Minister of the Navy, Antonio Royo Villanova, a furious anti-Catalanist member of the Agrarian Party who demanded the repeal of the Statute of Autonomy of Catalonia, and his party colleague Nicasio Velayos Velayos, to dissolve his government and renounce to continue at its head."
 spain.11.a:0 "Oh"
 
 spain.12.t:0 "A new government"
 spain.12.d:0 "Lerroux has resigned, and a new government must be formed. Alcalá-Zamora has decided to replace Lerroux with a trustworthy man without parliamentary backing, Finance Minister Joaquín Chapaprieta, who has accepted the post in view of the danger of a dissolution of the Cortes. The new cabinet has maintained the radical-cedist alliance and is now formed by three ministers from the CEDA, three from the Radical Republican Party (one of them being Lerroux as minister of State), one agrarian and one from the Lliga Catalana. The presidential threat of dissolution of parliament has forced Gil-Robles, who has maintained his position as Minister of War, to support the new government. Although he did so in discontent as he wasn't called to govern when his group is the one with the largest number of deputies."
 spain.12.a:0 "Let's hope this one lasts longer than its predecessor."
#  spain.12.b:0 "The CEDA!"

 spain_ceda: "Spain - CEDA Tree"
 
 spain.13.t:0 "How will we govern?"
 spain.13.d:0 "Gil-Robles will be the new head of government, but his intentions are unknown. Some figures of his party, such as Luis Lucia or Manuel Gimenez, want to form a new centre-right govenrment with the liberals and reform the Republic towards a christian democracy. However, the radical wing of the CEDA wants to destroy the republic and create a new corporatist regime. What will Gil-Robles choose?"
 spain.13.a:0 "Gil-Robles forms a centre-right government"
 spain.13.b:0 "Gil-Robles forms a right-wing government"
 
 spain.14.t:0 "Chapaprieta Resigns"
 spain.14.d:0 "Frustrated by the recent failures of his administration, president Chapaprieta has resigned. Alcalá-Zamora wants another centrist cabinet, even if the idea lacks parliamentary support, so he tried to entrust the formation of a new government to Miguel Maura and then to Chapaprieta again, but both failed to achieve a stable cabinet. Manuel Portela, a politician famous for being \"an expert in manufacturing electoral victories by means of rancid caciquial tricks\", was then given the mission to form a stable government; which he managed to do.\nBut the new government may not last very long as now the CEDA, who wants to reach power, has decided to call for a motion of no-confidence as soon as the next parliament session begins. After this declaration and for the government to survive, Alcalá-Zamora has took advantage of the presidential prerogative and has closed the Cortes for 30 days."
 spain.14.a:0 "Portela won't last long..."
 
