 postwar.2.t:0 "Transfer Bialystok to Poland?"
 postwar.2.d:0 "Bialystok and Radymno were annexed by us after the 1939 partition, but is clear that these areas do not wish to be part of the Belarusian and Ukranian SSRs respectively. As our troops march into Poland, some have suggested to give those territories to our Polish "allies". Our plans for the post-war already involve the creation of a loyal communist state in Poland so this shouldn't be an issue."
 postwar.2.a:0 "We shall return the territory"
 postwar.2.b:0 "Those lands belong to the USSR!"
 
