 gcw_flavor.1.t:0 "Graf Zeppelin Destroyed in Terrorist Bombing"
 gcw_flavor.1.desc:0 "Shocking news today, as the Graf Zeppelin, the famous airship which completed the first intercontinental passenger flight and aerial circumnavigation of the globe, has been destroyed in an explosion over Freiburg. The incident claimed the life of aviation pioneer and head of the airship company DELAG, Hugo Eckener, who was captaining the vessel as well as all members of the crew. According to observers, the Graf Zeppelin, which was distributing pro-Republican leaflets over Freiburg and had been adorned with loyalist slogans, was suddenly engulfed in a ball of fire, and quickly crashed to the ground in a fiery heap on the outskirts of the city. Shortly after the incident, a nationalist guerrilla organization, the National Socialist Revolutionary Defense Battalion, claimed responsibility for the attack having planted a timed bomb in one of the airship’s gasbags prior to takeoff. In a radio broadcast later that evening, the organization’s commander cited Eckener’s outspoken republican loyalties and participation in loyalist propaganda efforts in the ongoing civil war as the motivation behind the bombing.\n\nPrior to the outbreak of the civil war, Eckener who had achieved national fame for his high-profile flights, had been considered as a potential anti-radical unity candidate by the SPD and Zentrum in 1932 before Hindenburg had committed to a reelection campaign. When open conflict began, Eckener offered his services to the beleaguered republican government, and in the early months of the war used the Graf Zeppelin in propaganda flights to rally support against the Nationalist and Communist factions. Several governments have issued condemnations of the attack, and aeronautical enthusiasts around the world have held quiet gatherings in his honor."
 gcw_flavor.1.a:0 "Fascist Barbarians!"
 gcw_flavor.1.a:0 "Death to the Enemies of the Fatherland!"

 gcw_flavor.2.t:0 "The Strasbourg Incident"
 gcw_flavor.2.desc:0 "On the early morning hours of [?Global.date.GetDateStringNoHourLong], a detachment of 300 men from the Communist-aligned Rhineland Free People’s Militia left their temporary headquarters in Offenburg and crossed the border from Germany into France, infiltrating the nearby forest. French border patrol units had been put on high alert as the fighting between the German factions in the ongoing civil war had approached the border territory, but were caught off guard by the speed of the advance and the comparatively small size of the attacking force. The local French border units engaged elements of the militia in a brief firefight, and called for reinforcements from nearby garrisons. By mid-morning, members of the Militia had seized and fortified two villages on the outskirts of Strasbourg, including a radio station, where they began broadcasting calls for a revolution against the \"corrupt bourgeois government\". While some members of the local Communist Party quickly attempted to organize a haphazard city-wide strike action, the overwhelming majority of citizens stayed indoors, and only a few local hoodlums engaged in opportunistic violence against storefronts. The arrival of the local Gendarme attachment quickly put an end to the incidents in Strasbourg proper. By early afternoon, when it was clear a French Revolution was not in the offing, the members of the FVR quickly fled back over the border, leaving 23 people dead, mostly members of the militia.\n\nThe event has sparked widespread outrage in France, and has been a political disaster for the PCF. Several Communist Party headquarters have already been attacked in vigilante reprisals. The German communist provisional government has blamed the incident on an overzealous local cadre leader, and already KPD Chairman Thalmann has used the incident to call for greater centralization of the Volksarmee under vanguardist leadership. The French Prime Minister has responded by further reinforcing the border guard, and declared any further incursions would be dealt with by \"swift military action\" even going so far as to threaten an intervention in the conflict should the \"territorial integrity of France be violated\"."
 gcw_flavor.2.a:0 "Alsace-Lorraine ne sera plus jamais Allemande!"
 gcw_flavor.2.b:0 "What were they thinking?"
 gcw_flavor.2.c:0 "We must be careful"
 gcw_flavor.2.d:0 "Interesting"
