l_english:
 #ideas
 AUS_treaty_saint_germain:0 "Treaty of Saint-Germain-en-Laye"
 AUS_treaty_saint_germain_desc:0 "Signed in 1919, the Treaty of Saint-Germain-en-Laye was the end of the Great War between Austria and the Entente. The provisions destroyed the Empire of Austria-Hungary, breaking it up into several successor states. This destroyed the Austrian Economy, as Austria no longer had a large amount of arable land or economic backing. The Treaty also blocks Austria from uniting with Germany in any kind of Anschluß, whether political or economic. This Treaty overall has made many Austrians bitter, and they wish for more."
 AUS_great_depression:0 "Great Depression"
 AUS_great_depression_desc:0 "The collapse of the American Stock Exchange severely damaged the Austrian Economy. After the collapse of Creditanstalt Bank, we tried to form a customs union with Germany, but this effort was blocked by the French. It is clear that more extraordinary measures must be taken to carry Austria through the crisis."
 AUS_fragile_democracy:0 "Fragile Democracy"
 AUS_fragile_democracy_desc:0 "Austria is a polarized country, with the Social Democrats and Christian Social Party as the dominant political forces. However, our democracy is being strained by this division, with events such as the July Revolt of 1927 showing the Christian Social's willingness to look the other way while the Right-Wing Heimwehr Paramilitary force murders leftists. Furthermore, National Socialist agitators have been fighting the Social Democrats and Communists as the local branch of Hitler's German Movement."
