 ### Flavour Events ###
 eng_flavour.1.t:0 "Launch of the R102"
 eng_flavour.1.desc:0 "Imperial Airways is celebrating the successful maiden voyage of its new zeppelin, the R102, which docked at the mooring mast atop the Empire State Building on the morning of October 25th. Unlike earlier vessels, the R102 builds on German innovations in zeppelin design; it is able to carry 80 passengers, and like the [Hindenburg_Get_Name] it has its own restaurant, promenade, and lounge with live music. It will offer nonstop round-trip service from London to New York City, Montreal, Toronto and Washington DC.\n\nIn order to raise public enthusiasm for the project, and the investments necessary to build the Zeppelin, Imperial Airways has capitalized on national rivalry between Germany and the United Kingdom. Slightly faster than its German competitors, it is now the fastest way to cross the Atlantic.\n\nThe R102 is the first airship constructed by Britain since the R101 disaster in 1930; the vessel had crashed on its maiden voyage to India, killing 48 of the 54 people aboard. In 1929 Britain had adopted the Imperial Airship Scheme, a plan to connect the population centers of the Empire together by a fleet of airships, significantly cutting down travel times, however the plan was cancelled, and the remaining zeppelin scrapped, following the disaster. The continued safety record and commercial success of the German airship [Hindenburg_Get_Name], however, prompted a limited readoption of plan, and construction of the R102 began earlier this year, with new ships expected to follow."
 eng_flavour.1.a:0 "Britain joins the airship race!"
 
