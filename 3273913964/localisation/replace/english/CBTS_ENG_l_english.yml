 ##National Government (-1935) Politics
 ENG_unlock_related_laws:0 "§YThe following Acts may become available as the game progresses:§!"
 ENG_NAT_Start:0 "The National Government"
 ENG_unlock_cruelty_to_dogs:0 "§GProtection of Animals (Cruelty to Dogs) Act 1933§!"
 ENG_unlock_protecc_animals:0 "§GProtection of Animals Act 1934§!"
 ENG_NAT_Start_desc:0 "Formed in the aftermath of the Great Depression, the Conservative-dominated National Government is a coalition of the Conservative Party, Liberal National Party, and right-wing defectors from Labour. Together, they must try and weather the storm of the Economic Crisis and try and return prosperity to Britain."
 ENG_NAT_Protect_Animals:0 "Prevent Animal Abuse"
 ENG_NAT_Protect_Animals_desc:0 "Animal Cruelty must be stopped at every turn! We will extend the Protection of Animals act to prohibit cruelty against canines, and prohibit cruelty against horses and bulls, which include using untrained horses or bulls in dangerous spectacles."
 ENG_unlock_whaling_industry_regulation:0 "§GWhaling Industry (Regulation) Act 1934§!"
 ENG_need_scottish_laws:0 "§YThe following acts also require §CReforms in Scotland§!§Y to be unlocked:§!"
 ENG_unlock_trout_act_scotland:0 "§GTrout (Scotland) Act 1933§!"
 ENG_unlock_illegal_trawling_scotland:0 "§GIllegal Trawling (Scotland) Act 1933§!"
 ENG_NAT_Animal_Regulations:0 "Fishing Regulations"
 ENG_NAT_Animal_Regulations_desc:0 "We shall establish regulations in order to prohibit whaling from occuring within our waters, and regulate Trout Fishing and Illegal Trawling in Scotland."
 ENG_unlock_visiting_forces:0 "§GVisiting Forces (British Commonwealth) Act 1933§!"
 ENG_NAT_Visiting_Forces:0 "The Visiting Forces Act"
 ENG_NAT_Visiting_Forces_desc:0 "We will establish provisions for military forces of the British Commonwealth when they visit or serve in any other part of the Commonwealth. It will allow for more standard disciplining procedures and the combination of forces."
 ENG_unlock_petrol_act:0 "§GPetroleum (Production) Act 1934§!"
 ENG_NAT_Petrol:0 "The Petroleum Production Act"
 ENG_NAT_Petrol_desc:0 "We shall nationalize all crude oil in the United Kingdom, provided that it has not yet been extracted. In addition, licenced extraction operations shall not be nationalized. However, the Board of Trade will have the right to grant licences to extract oil."
 ENG_unlock_maritime_museum_act:0 "§GNational Maritime Museum Act 1934§!"
 ENG_NAT_Maritime_Museum:0 "The National Maritime Museum"
 ENG_NAT_Maritime_Museum_desc:0 "We will establish a National Maritime Museum in Greenwich Park. Greenwich has been associated with maritime activity since Roman times, and so is a natural place to build such a museum."
 ENG_unlock_land_purchase_NI:0 "§GNorthern Ireland Land Purchase (Winding Up) Act 1935§!"
 ENG_NAT_Wind_Up_Land_Purchase:0 "Liquidate the Northern Irish Rent Programme"
 ENG_NAT_Wind_Up_Land_Purchase_desc:0 "Our system of Land Rent in Northern Ireland has met with little success. It is thus in the government's interest to end this land reform program. The Land Purchase Commission shall be Liquidated, and the program will be over."
 ENG_unlock_elec_supply:0 "§GElectricity (Supply) Act 1935§!"
 ENG_NAT_Electricity_Supply_Act:0 "Regulate Electricity Suppliers"
 ENG_NAT_Electricity_Supply_Act_desc:0 "We shall make provisions for the Central Elecricty Board to regulate, by arrangement, any private generators. This should allow us to have better control of the Board's finances and stopping any unauthorized operations."
 ENG_unlock_children_act:0 "§GChildren and Young Persons Act 1933§!"
 ENG_NAT_Children_Young_Persons:0 "Prevent Child Abuse"
 ENG_NAT_Children_Young_Persons_desc:0 "We shall establish provisions to prohibit the abuse of children and young persons, as well as restrict the practice of Child Labour. We will also provide provisions for the legal rights of children, and the proper punishment of those who contravene the act."
 ENG_unlock_firearms_1933:0 "§GFirearms and Imitation Firearms (Criminal Use) Act 1933§!"
 ENG_unlock_firearms_1934:0 "§GFirearms Act 1934§!"
 ENG_NAT_Firearms:0 "Restrict Firearm Ownership"
 ENG_NAT_Firearms_desc:0 "We shall enact measures to restrict the usage of firearms and better clarify the definitions of imitation firearms. In addition, the punishment for breaking the Firearms Act will become more clearly defined. This should help to make Britain a safer place."
 ENG_unlock_nationality_aliens:0 "§GBritish Nationality and Status of Aliens Act 1933§!"
 ENG_NAT_Nationality:0 "Amend the British Nationality Act"
 ENG_NAT_Nationality_desc:0 "We shall amend the British Nationality and Status of Aliens Act to make it clear that the Wife of a British Subject shall in turn be a British Subject, and shall not cease to be a Subject in case of divorce, unless she takes an Alien Husband. Furthermore, the Wife of a Naturalized Alien shall too have the ability to gain British Citizenship."
 ENG_unlock_incitement_to_disaffection:0 "§GIncitement to Disaffection Act 1934§!"
 ENG_NAT_Incitement_to_Disaffection:0 "The Incitement to Disaffection Act"
 ENG_NAT_Incitement_to_Disaffection_desc:0 "We shall make it a crime to attempt to incite desertion among the armed forces. Anyone trying to cause our soldiers to willfully neglect their duties shall be considered a criminal, and shall risk two years in prison."
 ENG_unlock_married_women:0 "§GLaw Reform (Married Women and Tortfeasors) Act 1935§!"
 ENG_NAT_Married_Women:0 "Married Women's Rights"
 ENG_NAT_Married_Women_desc:0 "We shall amend existing laws to provide for the protection of married women's rights. Married women shall be allowed to own and manage their own finances and property, and have the ability to engage in contracts. However, while they will also be able to sue other people in court, they will be equally capabable of being sued themselves, and are subject to bankrupcy law."
 ENG_unlock_admin_of_justice_misc:0 "§GAdministration of Justice (Miscellaneous Provisions) Act 1933§!"
 ENG_unlock_admin_of_justice_appeals:0 "§GAdministration of Justice (Appeals) Act 1934§!"
 ENG_unlock_law_reform_misc:0 "§GLaw Reform (Miscellaneous Provisions) Act 1934§!"
 ENG_unlock_admin_of_justice_scotland:0 "§GAdministration of Justice (Scotland) Act 1933§!"
 ENG_NAT_Justice_Reform:0 "Legal Reform"
 ENG_NAT_Justice_Reform_desc:0 "We shall establish provisions for small legal reforms in the United Kingdom. Legal procedures and bureaucracies will be modernized and simplified, and more legal quagmires will be cleared up. For example, Scottish judge nominees will no longer have to go through the ancient trial practice, and legal cases will continue against a deceased defendent's (or in favor of a deceased plaintiff's) estate."
 ENG_NAT_Scotland_Acts:0 "Reforms in Scotland"
 ENG_NAT_Scotland_Acts_desc:0 "We shall enact new legislation pertaining only to Scotland. We shall plug loopholes in the Church of Scotland Act 1925, to prevent abuse of power. We shall also seek to more clearly define the punishment of perjurers and transfer a couple of duties shall be transfered to the Secratary of State for Scotland."
 ENG_unlock_scottish_laws:0 "§YLaws pertaining to Scotland found in other focuses will be unlocked.§!"
 ENG_unlock_false_oaths:0 "§GFalse Oaths (Scotland) Act 1933§!"
 ENG_unlock_church_of_scotland:0 "§GChurch of Scotland (Property and Endowments) Amendment Act 1933§!"
 ENG_unlock_assessor_public_undertakings:0 "§GAssessor of Public Undertakings (Scotland) Act 1934§!"
 ENG_unlock_evidence_act:0 "§GEvidence (Foreign, Dominion and Colonial Documents) Act 1933§!"
 ENG_unlock_foreign_judgements:0 "§GForeign Judgments (Reciprocal Enforcement) Act 1933§!"
 ENG_NAT_Foreign_Judgements:0 "Foreign Legal Reform"
 ENG_NAT_Foreign_Judgements_desc:0 "We shall enact provisions to better provide for the use of foreign or colonial documents in court, and to better enforce foreign judgements on individuals in the United Kingdom, provided those countries do the same."
 ENG_unlock_vagrancy_act:0 "§GVagrancy Act 1935§!"
 ENG_NAT_Vagrancy:0 "Amend the Vagrancy Act"
 ENG_NAT_Vagrancy_desc:0 "We will amend the Vagrancy Act, 1824 to change the definition of \"rogue\" and \"vagabond\" to a) remove the need to have visible means of sustenance and b) only apply the definition to those who have been directed to, and refused, a \"reasonably accessible place of shelter.\""
 ##Tory tree
 ENG_Tory_Start:0 "Conservative Victory"
 ENG_Tory_Start_desc:0 "Once again, the forces of stability and order have prevailed. Under the current leadership, the Conservative Party hopes to enact moderate reforms and modernize our legal system. In addition, we hope to provide better conditions for the working people, and protect our finances from deficit."
 ENG_Tory_Housing_Act:0 "The Housing Act"
 ENG_Tory_Housing_Act_desc:0 "With the Housing Act, we will give local councils more authority to develop and improve housing areas (especially for the working class), deal with unsafe and unsanitary houses, as well as the ability to hire contractors for these purposes. The act will also give homeowners more rights and make home construction safer for the occupants."
 ENG_unlock_housing_act:0 "§GHousing Act 1936§!"
 ENG_Tory_Public_Health_Act:0 "Improve Public Health"
 ENG_Tory_Public_Health_Act_desc:0 "We will give local authorities more power to enforce sanitary conditions in their jurisdictions. This should drastically improve the public well-being. In addition, we will allow local authorities to promote health resorts, promote sport, and allow traders to discharge waste into the sewers."
 ENG_unlock_public_health_act:0 "§GPublic Health Act 1936§!"
 ENG_health_resorts_act:0 "§GHealth Resorts and Watering Places Act 1936§!"
 ENG_voluntary_hospitals_act:0 "§GVoluntary Hospitals (Paying Patients) Act 1936§!"
 ENG_drainage_act:0 "§GPublic Health (Drainage of Trade Premises) Act 1937§!"
 ENG_physical_training_act:0 "§GPhysical Training and Recreation Act 1937§!"
 ENG_unlock_tithe_act:0 "§GTithe Act 1936§!"
 ENG_Tory_Tithe_Act:0 "The Tithe Act"
 ENG_Tory_Tithe_Act_desc:0 "We shall abolish the tithe rentcharge (a tax on Church land collected in the form of the produce of that land), and we shall charge annuities instead. This will help modernize our legal system by exchanging a 100-year-old form of tax for something more up-to-date."
 ENG_Tory_Trunk_Roads_Act:0 "The Trunk Roads Act"
 ENG_Tory_Trunk_Roads_Act_desc:0 "With this act, the Minister of Transport will be the highest authority for the management of certain highways (to be designated \"trunk roads\") in Great Britain. The Minister will be able to delegate duties to local governments as necessary."
 ENG_unlock_trunk_roads_act:0 "§GTrunk Roads Act 1936§!"
 ENG_unlock_geneva_convention_act:0 "§GGeneva Convention Act 1937§!"
 ENG_Tory_Geneva_Convention_Act:0 "Adopt Article 28"
 ENG_Tory_Geneva_Convention_Act_desc:0 "We must adopt Article 28 of the Geneva Convention (ratified in Geneva in 1929), which deals with the treatment of the wounded. It shall be unlawful to imitate the stylings of the Red Cross."
 ENG_Tory_Architects_Registration_Act:0 "Registration of Architects"
 ENG_Tory_Architects_Registration_Act_desc:0 "This act shall restrict the title of \"Architect\" to architects registered with the government, who thus have a license to practice their profession."
 ENG_unlock_architect_act:0 "§GArchitects Registration Act 1938§!"
 ENG_Tory_Public_Order_Act:0 "Protect against Militant Agitation"
 ENG_Tory_Public_Order_Act_desc:0 "With the worrying activity of Oswald Mosley's Blackshirts, we should enact a law that would prohibit political militias and paramilitaries from holding rallies and engaging in violence."
 ENG_unlock_public_order:0 "§GPublic Order Act 1936§!"
 ENG_unlock_land_registration_act:0 "§GLand Registration Act 1936§!"
 ENG_unlock_population_statistics_act:0 "§GPopulation (Statistics) Act 1938§!"
 ENG_Tory_Land_Registration_Act:0 "The Land Registration Act"
 ENG_Tory_Land_Registration_Act_desc:0 "We shall amend the Land Registration Act, 1925 and the Land Trasnfer Act, 1897 to better handle the registration of titles and provide for the partial closing of the Middlesex Deeds Registry. In addition, we will make further provisions for a commission to collect statistics about our population."
 ENG_Tory_Civil_List_Act:0 "Manage the Civil List"
 ENG_Tory_Civil_List_Act_desc:0 "With the passing of King George V, we must promulgate a new act that provides funds for the Crown and Royal Family. In addition, we should make new provisions to decide on Regents for the Throne is necessary."
 ENG_unlock_civil_list_1936:0 "§GCivil List Act 1936§!"
 ENG_unlock_civil_list_1937:0 "§GCivil List Act 1937§!"
 ENG_unlock_regency_act:0 "§GRegency Act 1937§!"
 ENG_Tory_Hours_of_Employment_Act:0 "Adopt Conventions on Work Hours"
 ENG_Tory_Hours_of_Employment_Act_desc:0 "We should adopt the Conventions created by the General Conference of the International Labour Organization in regards to the working hours of women. The Hours of Employment (Conventions) Act will thus supercede other acts where applicable."
 ENG_unlock_hours_of_employment:0 "§GHours of Employment (Conventions) Act 1936§!"
 ENG_Tory_Crown_Lands_Act:0 "Manage Crown Lands"
 ENG_Tory_Crown_Lands_Act_desc:0 "We shall make provisions to allow the Commissioners of Works to build public and police offices on Crown lands."
 ENG_unlock_crown_lands:0 "§GCrown Lands Act 1936§!"
 ENG_Tory_Cinematograph_Act:0 "Regulate the Film Industry"
 ENG_Tory_Cinematograph_Act_desc:0 "The relatively new film industry should be increasingly regulated. We shall pass an act prohibiting the distribution of films which involve animal cruelty in their production. In addition, we shall restrict unethical cinema booking practices and make sure that British films are fairlyh distributed. In addition, we must make provisions for the fair treatment of filmmaking employees."
 ENG_unlock_cinema_1937:0 "§GCinematograph Films (Animals) Act 1937§!"
 ENG_unlock_cinema_1938:0 "§GCinematograph Films Act 1938§!"
 ENG_unlock_telegraphs:0 "§GImperial Telegraphs Act 1938§!"
 ENG_Tory_Coal_Act:0 "The Coal Act"
 ENG_Tory_Coal_Act_desc:0 "It is in the national interest to allow the government to nationalize unworked coal mines or deposits. We shall establish a Commission to manage the extraction, to begin reducing coal-mining operations, and to promote the welfare of the miners themselves.§!"
 ENG_unlock_coal_act:0 "§GCoal Act 1938§!"
 ENG_make_nationalization:0 "§RMake the Nationalization Modifier - past s_team§!"
 ENG_Tory_Factories_Act:0 "The Factories Act"
 ENG_Tory_Factories_Act_desc:0 "The Factories Act shall enforce safety regulations in nearly every aspect of factory work. We will make sure factories are clean, sanitary, safe, and with the proper supplies of drinking water, washing facilities, changing rooms, benches, and first-aid. In addition, provisions will be made to enforce the proper reporting of accidents, and the acting on said incidents. Working hours and holidays will also be provided for."
 ENG_unlock_factories_act:0 "§GFactories Act 1937§!"
 ENG_Tory_Holidays_with_Pay:0 "Guarantee Paid Holidays"
 ENG_Tory_Holidays_with_Pay_desc:0 "We will enable government wage reulators to make provisions for paid holidays for workers. The Minister of Labour will also be able to assist voluntary private programs in doing the same."
 ENG_unlock_holidays_with_pay:0 "§GHolidays with Pay Act 1938§!"
 ENG_Tory_Trade_Marks_Act:0 "Protect Trade Marks"
 ENG_Tory_Trade_Marks_Act_desc:0 "We shall make substantial provisions for the registration, usage, and protection of trade marks. We shall also make provisions for legal cases pertaining to these matters."
 ENG_unlock_trade_marks:0 "§GTrade Marks Act 1938§!"
 ENG_unlock_infanticide_act:0 "§GInfanticide Act 1938§!"
 ENG_unlock_cancer_act:0 "§GCancer Act 1939§!"
 ENG_unlock_camps_act:0 "§GCamps Act 1939§!"
 ENG_unlock_nursing_homes_scotland:0 "§GNursing Homes Registration (Scotland) Act 1938§!"
 ENG_Tory_Infanticide_Act:0 "Promote Healthy Living"
 ENG_Tory_Infanticide_Act_desc:0 "We shall make provisions for the protection of infants from infaticide, and the proper prosecution of those who allow their infants to die. In addition, we shall create provisions for the better treatment of cancer, promote outdoor camps, and to allow for proper registration and inspection of Scottish Nursing Homes."
 ENG_unlock_civil_defense:0 "§GCivil Defense Act 1939§!"
 ENG_Tory_Civil_Defense_Act:0 "The Civil Defense Act"
 ENG_Tory_Civil_Defense_Act_desc:0 "We shall enact provisions to provide for civil defense. This includes the construction and designation of underground public shelters, the requirement of air raid shelter construction by certain private institutions, the usage of public utilities in case of war, the usage of camouflage, the ability of the government to properly deal with casualties or evacuate the population, along with other provisions."
 ENG_unlock_marriage_act_1939:0 "§GMarriage Act 1939§!"
 ENG_Tory_Marriage_Act:0 "The Marriage Act"
 ENG_Tory_Marriage_Act_desc:0 "We shall make provisions for marriages where one party resides in Scotland, and the other resides in England."
 ENG_unlock_local_goernment_act:0 "§GLocal Government (Reform) Act 1940§!"
 ENG_Tory_Local_Government_Reform_Act:0 "Reform Local Government"
 ENG_Tory_Local_Government_Reform_Act_desc:0 "In 1929, Neville Chamberlain pushed through the Local Government Act 1929 to redefine municipal boundaries. The time has now come to devolve more power onto the Council Authorities, allowing the Government to handle larger projects."
 ENG_unlock_school_leaving_age:0 "§GEducation (School Leaving Age) Act 1939§!"
 ENG_Tory_School_Leaving_Age_Act:0 "Raise the School Leaving Age"
 ENG_Tory_School_Leaving_Age_Act_desc:0 "We shall raise the minimum school-leaving age to 15, which should allow for our citizens to become better educated and cut down on harmful child labour practices."
 ENG_unlock_child_labour_prohibition_act:0 "§GChild Labour (Prohibition) Act 1940§!"
 ENG_Tory_Child_Labour_Prohibition_Act:0 "Prohibit Child Labour"
 ENG_Tory_Child_Labour_Prohibition_Act_desc:0 "In a landmark piece of legislation, we shall abolish the employment of children under the age of fifteen, and prohibit the employment of those between the ages of fifteen and eighteen in environemtns such as factories or mines."
 ##Labour Tree
 ENG_Labour_Start:0 "Labour Victory"
 ENG_Labour_Start_desc:0 "Labour has once again won control of the government. As keeping with our Fabian and Ethical Socialist principles, we are expected to enact policies that would assist the country in gradually transitioning to socialism. Currently, our plans include establishing a national healthcare system and nationalizing key industries and utilities."
 ENG_unlock_scotland_finance_housing_act:0 "§GHousing (Financial Provisions) (Scotland) Act [This.Get1946]§!"
