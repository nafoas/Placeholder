 #ideas
 ENG_Pacifism:0 "Pacifism"
 ENG_Pacifism_desc:0 "The Great War took an enourmous toll on our country, but helped us bring in welfare and secured our country's international standing. Regardless, most Britons would refuse to go or send their children to die in the Trenches for a second time."
 ENG_Pacifism2:0 "Moderate Pacifism"
 ENG_Pacifism2_desc:0 "The Great War took an enourmous toll on our country, but helped us bring in welfare and secured our country's international standing. Regardless, most Britons would refuse to go or send their children to die in the Trenches for a second time."
 ENG_Pacifism3:0 "Weak Pacifism"
 ENG_Pacifism3_desc:0 "The Great War took an enourmous toll on our country, but helped us bring in welfare and secured our country's international standing. Regardless, most Britons would refuse to go or send their children to die in the Trenches for a second time."
 ENG_Great_Depression:0 "Great Depression"
 ENG_Great_Depression_desc:0 "The collapse of the American Economy has had a dreadful effect on the British Economy. Although not as severe as in America or Germany, our heavy industry output fell by a third and unemployment has risen to 70% in some areas. However, thanks to phenomena like the Housing Boom, it is clear that the worst is behind us."
 ENG_Great_Depression_2:0 "Great Depression"
 ENG_Great_Depression_2_desc:0 "The collapse of the American Economy has had a dreadful effect on the British Economy. Although not as severe as in America or Germany, our heavy industry output fell by a third and unemployment rose to 70% in some areas. However, it has become increasingly clear that the economy is on a slow path to recovery."
 ENG_Great_Depression3:0 "Great Depression"
 ENG_Great_Depression3_desc:0 "The collapse of the American Economy has had a dreadful effect on the British Economy. Although not as severe as in America or Germany, our heavy industry output fell by a third and unemployment rose to 70% in some areas. However, it has become increasingly clear that the economy is on a slow path to recovery."
 ENG_Empire:0 "The Sun Never Sets"
 ENG_Empire_desc:0 "The British Empire at present covers about a quarter of the globe, and has made the Isles very rich. However, while it allows us to conscript from the colonies, it costs money to maintain, and unrest in India and Ireland should be dealt with lest it get out of control."
