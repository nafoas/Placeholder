 ENG_Labour_Housing_Act:0 "The Housing Act"
 ENG_Labour_Housing_Act_desc:0 "With the Housing Act, we will give local councils more authority to develop and improve housing areas (especially for the working class), deal with unsafe and unsanitary houses, as well as the ability to hire contractors for these purposes. The act will also give homeowners more rights and make home construction safer for the occupants."
 ENG_unlock_trade_disputes_act:0 "§GTrade Disputes and Trade Unions Act [This.Get1946]§!"
 ENG_unlock_industrial_assurance_act:0 "§GIndustrial Assurance and Friendly Societies Act [This.Get1948]§!"
 ENG_Labour_Trade_Disputes:0 "Lift Restrictions on Workers' Strikes"
 ENG_Labour_Trade_Disputes_desc:0 "The Trade Disputes and Trade Unions Act, 1927 put restrictions on strikes meant to coerce the government to take action and had provisions designed to limit the Labour Party's funding. Labour sees this act as vindictive and spiteful, and thus it shall be repealed."
 ENG_unlock_public_health_scotland:0 "§GPublic Health (Scotland) Act [This.Get1946]§!"
 ENG_Labour_Public_Health_Act:0 "Improve Public Health"
 ENG_Labour_Public_Health_Act_desc:0 "We will give local authorities more power to enforce sanitary conditions in their jurisdictions. This should drastically improve the public well-being. In addition, we will allow local authorities to promote health resorts, promote sport, and allow traders to discharge waste into the sewers. Finally, we will make greater provisions for preventing infanticide and the treatment of cancer."
 ENG_unlock_education_act:0 "§GEducation Act [This.Get1946]§!"
 ENG_Labour_Education_Act:0 "The Education Act"
 ENG_Labour_Education_Act_desc:0 "It is imperative that we provide a quality education to all British students. Thus, we shall make provisions for the enlargement of schools, the division of overly concentrated schools, and additional powers for the schools to provide materials. We shall also empower local authorities with more autonomy in their decisions."
 ENG_unlock_agriculture_act_1947:0 "§GAgriculture Act [This.Get1947]§!"
 ENG_unlock_agriculture_wages_act_1948:0 "§GAgricultural Wages Act [This.Get1948]§!"
 ENG_unlock_agriculture_wages_scotland_act_1949:0 "§GAgricultural Wages (Scotland) Act [This.Get1949]§!"
 ENG_unlock_agriculture_holdings_act_1948:0 "§GAgricultural Holdings Act [This.Get1948]§!"
 ENG_unlock_agriculture_holdings_scotland_act_1949:0 "§GAgricultural Holdings (Scotland) Act [This.Get1949]§!"
 ENG_unlock_agriculture_scotland_act_1948:0 "§GAgriculture (Scotland) Act [This.Get1948]§!"
 ENG_unlock_hill_farming_act:0 "§GHill Farming Act [This.Get1946]§!"
 ENG_Labour_Land_Registration_Act:0 "Enact Land Reform"
 ENG_Labour_Land_Registration_Act_desc:0 "We should enact provisions for extensive land reform in England, Wales, and Scotland. Among better provisions for land registration, we must help farmers using price controls and standards on management, renting, and the establishment of an Agricultural Land Commission, along with other wage controls."
 ENG_Labour_Public_Order_Act:0 "Block the BUF"
 ENG_Labour_Public_Order_Act_desc:0 "The pretentions of Mosley and his Blackshirts worry many in the establishment on both sides of the House. Therefore, we will establish a ban on political paramilitaries. This should effectively neuter Mosley's attempt at aggressive stunts."
 ENG_unlock_coal_nationalization_act:0 "§GCoal Industry Nationalisation Act [This.Get1946]§!"
 ENG_unlock_electricity_act:0 "§GElectricity Act [This.Get1947]§!"
 ENG_unlock_transport_act:0 "§GTransport Act [This.Get1947]§!"
 ENG_unlock_gas_act:0 "§GGas Act [This.Get1948]§!"
 ENG_Labour_Nationalize_Infrastructure:0 "Nationalize Key Infrastructure"
 ENG_Labour_Nationalize_Infrastructure_desc:0 "We shall nationalize key resource and infrastructure operations in order to force them to serve national and social interests rather than private profit. We shall create a National Coal Board, a British Electricity Authority, the British Transport Commission, and gas boards under council control."
 ENG_water_act:0 "§GWater Act 1945§!"
 ENG_unlock_cable_and_wireless_act:0 "§GCable and Wireless Act [This.Get1946]§!"
 ENG_unlock_bank_of_england_act:0 "§GBank of England Act [This.Get1946]§!"
 ENG_Labour_Nationalize_Utilities:0 "Nationalize Key Utilities"
 ENG_Labour_Nationalize_Utilities_desc:0 "In order to properly achieve social reform, we must bring finance and utilities into public ownership. Thus, we shall nationalize the Bank of England, some Communication Firms, and establish standards for water distribution. Most crucially, we will establish a National Health Service to provide full medical assistance to all Britons free of charge."
 ENG_unlock_nhs_act:0 "§GNational Health Service Act [This.Get1946]§!"
 ENG_Labour_Civil_List:0 "Manage the Civil List"
 ENG_Labour_Civil_List_desc:0 "With the passing of King George V, we must promulgate a new act that provides funds for the Crown and Royal Family. In addition, we should make new provisions to decide on Regents for the Throne is necessary."
 ENG_unlock_new_towns_act:0 "§GNew Towns Act [This.Get1946]§!"
 ENG_unlock_public_works_loans_act:0 "§GForestry Act [This.Get1947]§!"
 ENG_unlock_forestry_act:0 "§GPublic Works Loans Act [This.Get1946]§!"
 ENG_unlock_utilities_street_works_act:0 "§GPublic Utilities Street Works Act [This.Get1950]§!"
 ENG_unlock_indorgdev_act:0 "§GIndustrial Organization and Development Act [This.Get1947]§!"
 ENG_Labour_New_Towns_Act:0 "Municipal Development"
 ENG_Labour_New_Towns_Act_desc:0 "We shall enact provisions for the development of new and modern municipalities, as well as the development of public works and the conservation of forests."
 ENG_unlock_companies_act:0 "§GCompanies Act [This.Get1948]§!"
 ENG_unlock_factories_act_labour:0 "§GFactories Act [This.Get1948]§!"
 ENG_Labour_Companies_Act:0 "Safety and Company Laws"
 ENG_Labour_Companies_Act_desc:0 "We must enact laws to provide for more streamlined company laws, such as those relating to shares, incorporation, and management, especially for cooperative associations. In addition, we shall make sweeping reforms in the field of safety, as we will enforce high standards in factories. This will also come on regulations on child labour."
 ENG_unlock_fire_services_act:0 "§GFire Services Act [This.Get1947]§!"
 ENG_Labour_Fire_Services:0 "Restructure Fire Brigades"
 ENG_Labour_Fire_Services_desc:0 "We shall devolve authority over fire brigades from the National Government to local and/or regional councils. This should make their management more efficient and responsive."
 ENG_unlock_town_plan_scotland_act:0 "§GTown and Country Planning (Scotland) Act [This.Get1947]§!"
 ENG_unlock_shops_act:0 "§GShops Act [This.Get1950]§!"
 ENG_unlock_statutory_instruments_act:0 "§GStatutory Instruments Act [This.Get1946]§!"
 ENG_unlock_crown_procedures_act:0 "§GCrown Proceedings Act [This.Get1947]§!"
 ENG_unlock_northern_ireland_act:0 "§GNorthern Ireland Act 1947§!"
 ENG_unlock_criminal_justice_act:0 "§GCriminal Justice Act [This.Get1948]§!"
 ENG_unlock_local_government_act:0 "§GLocal Government Act [This.Get1948]§!"
 ENG_unlock_local_government_scotland_act:0 "§GLocal Government (Scotland) Act [This.Get1947]§!"
 ENG_unlock_justice_of_the_peace_act:0 "§GJustice of the Peace Act [This.Get1949]§!"
 ENG_unlock_juries_act:0 "§GJuries Act [This.Get1949]§!"
 ENG_Labour_Legal_Reform:0 "Legal Reforms"
 ENG_Labour_Legal_Reform_desc:0 "We shall make efforts to enact provisions that would deal with legal reforms. In particular, we will enact criminal justice reforms and regional government reforms. This should make our systems modern and humane."
 ENG_unlock_rep_of_people_act:0 "§GRepresentation of the People Act [This.Get1948]§!"
 ENG_unlock_national_assistance_act:0 "§GNational Assistance Act [This.Get1948]§!"
 ENG_Labour_Rep_of_People:0 "Ban Corrupt Electoral Practices"
 ENG_Labour_Rep_of_People_desc:0 "With the Representation of the People Act, we will make more provisions for local elections and the abolishment of certain corrupt practices associated with elections."
 ENG_Labour_National_Assistance:0 "Improve Welfare Services"
 ENG_Labour_National_Assistance_desc:0 "We will repeal Tory laws about the poor and replace them with modernized provisions for the National Assitance Board and local authorities to provide welfare for the disabled, sick, aged, or other unemployed. These provisions include welfare payments and housing."
 ENG_unlock_cinema_1949:0 "§GCinematograph Films Production (Special Loans) Act [This.Get1949]§!"
 ENG_Labour_Films:0 "Regulate the Movie Industry"
 ENG_Labour_Films_desc:0 "The relatively new film industry should be increasingly regulated. We shall pass an act prohibiting the distribution of films which involve animal cruelty in their production. In addition, we shall restrict unethical cinema booking practices and make sure that British films are fairlyh distributed. In addition, we must make provisions for the fair treatment of filmmaking employees."
 ENG_unlock_british_nationality:0 "§GBritish Nationality Act 1948§!"
 ENG_unlock_marriage_1949:0 "§GMarriage Act [This.Get1949]§!"
 ENG_Labour_British_Nationality:0 "Nationality and Marriage"
 ENG_Labour_British_Nationality_desc:0 "We will enact provisions to provide for a new category of citizen called \"Citizen of the United Kingdom and Colonies\" that applies to all born or naturalized in the UK or the colonies. We will also enact provisions to prohibit incestous/affinty marriages and child marriages. The Marriage Act will also establish that marriages have to be held during the day."
 ENG_unlock_designs_act:0 "§GRegistered Designs Act [This.Get1949]§!"
 ENG_Labour_Designs:0 "Protect Registered Designs"
 ENG_Labour_Designs_desc:0 "We shall make greater provisions for the registration and protection of copyright, patents, and undisclosed information. This should help modernize our patent and corporate legal systems."
 ENG_unlock_civil_defense_labour:0 "§GCivil Defense Act [This.Get1949]§!"
 ENG_Labour_Civil_Defense:0 "The Civil Defense Act"
 #Come back to w/scripted loc
 ENG_Labour_Civil_Defense_desc:0 "We shall enact provisions to provide for civil defense. This includes the construction and designation of underground public shelters, the requirement of air raid shelter construction by certain private institutions, the usage of public utilities in case of war, the usage of camouflage, the ability of the government to properly deal with casualties or evacuate the population, along with other provisions."
 #Rearmament
 ##Starting
 ENG_Rearm_Invest_NI:0 "Invest in Northern Ireland"
 ENG_Rearm_Invest_NI_desc:0 "In order to kickstart economic recovery in Northern Ireland, we will invest in projects in and around Belfast. This should get people back to work and jumpstart our industry."
 ENG_Rearm_Invest_Scotland:0 "Invest in Scotland"
 ENG_Rearm_Invest_Scotland_desc:0 "We will invest in Scottish Industry in order to get the Scots back to work. Of course, as we must deal with areas of high unemployment, we will target industrial areas for building."
 ENG_Rearm_Invest_Northern_England:0 "Invest in Northern England"
 ENG_Rearm_Invest_Northern_England_desc:0 "Northern England contains some of our major industrial centers, such as Manchester, Liverpool, and Sheffield. These have been some of the hardest hit communities in Britain, so we must invest in the area to get it back on its feet."
 ENG_Rearm_Invest_Wales:0 "Invest in Wales"
 ENG_Rearm_Invest_Wales_desc:0 "We must invest in the Welsh Economy in order to get the workers back on their feet. Investing in railways will help us with our coal mining industry, and provide some employment."
 ENG_Rearm_Invest_Southern_England:0 "Invest in Southern England"
 ENG_Rearm_Invest_Southern_England_desc:0 "Southern England is our industrial core. Thus, it has been one of the hardest hit areas, with many workers going unemployed. We must invest in the South in order to get our economy back on track."
 ENG_owns_belfast:0 "§RWe have lost control of Belfast.§!"
 ENG_owns_scotland:0 "§RWe have lost control of Scotland.§!"
 ENG_owns_NE:0 "§RWe have lost control of Northern England.§!"
 ENG_owns_SE:0 "§RWe have lost control of Southern England.§!"
 ENG_owns_Wales:0 "§RWe have lost control of Wales.§!"
 ENG_small_public_works:0 "§YWe will increase public works spending§!"
 ###Pacifism
 ENG_Rearm_Civilian_Development:0 "Peaceful Development"
 ENG_Rearm_Civilian_Development_desc:0 "Developing a strong military is both unnecessary and inhuman. We should spend our resources building factories for civilian use in order to improve people's live and accelerate the transition to socialism."
 ENG_pacifist_development:0 "Industrial Development Board"
 ENG_pacifist_development2:0 "Industrial Development Board"
 ENG_pacifist_development2a:0 "Industrial Development Board"
 ENG_pacifist_development2b:0 "Industrial Development Network"
 ENG_Rearm_Industrial_Planning_Board:0 "Form the IMB"
 ENG_Rearm_Industrial_Planning_Board_desc:0 "We must form an Industrial Development Board in order to coordinate the development of industry in our country. The IDB will work to both steer private initiative and build state-owned factories for the public interest. This should provide employment to workers and bureaucrats."
 ENG_Rearm_Peace_Railways:0 "Expand Railway Services"
 ENG_Rearm_Peace_Railways_desc:0 "In order to provide better transport to our people, we must build more railway lines. This will increase our service capacity for passengers, goods, and equipment."
 ENG_subtract_mil_spending:0 "§YWe will decrease defense spending.§!"
 ENG_Rearm_Take_Money_From_Defense:0 "Re-Allocate Money from the Defense Budget"
 ENG_Rearm_Take_Money_From_Defense_desc:0 "In order to pay for the IDB's activities, we should take money from defense spending, as we will not need it anyways."
 ENG_Rearm_Peace_Balance_Industry:0 "Balanced Development"
 ENG_Rearm_Peace_Balance_Industry_desc:0 "We cannot build all our industry in London and Manchester. We must balance our industrial distribution in order to provide employment accross the country and not oversaturate certain areas."
 ENG_Rearm_Modern_Roads:0 "Modernize our Roads"
 ENG_Rearm_Modern_Roads_desc:0 "We must make a concerted effort to modernize our highways and roads. This will improve the shipment of goods and people's movement accross the country."
 engine_bonus:0 "Engine Research"
 ENG_Rearm_Modern_Industry:0 "Modernize our Industry"
 ENG_Rearm_Modern_Industry_desc:0 "We must spend time researching new industrial technologies and methods in order to better improve our industrial output."
 ENG_Rearm_Command_Planning:0 "The Direct Investment Plan"
 ENG_Rearm_Command_Planning_desc:0 "We will focus on constructing and managing state-owned factories to compete with the private market. This will help end private capital's monopoly on our industry without the need for violent expropriation."
 ENG_Rearm_Indicative_Planning:0 "The Directed Manufacturing Plan"
 ENG_Rearm_Indicative_Planning_desc:0 "Instead of primarily building factories ourselves, we will focus on working with private firms and providing incentives to steer the economy in a direction that would serve the national and popular interest. Though perhaps a slower method, this form of indicative planning can provide more stability in the long run."
 ENG_Rearm_Planning_Network:0 "Establish a Planning Network"
 ENG_Rearm_Planning_Network_desc:0 "The IMB will need several regional boards to better coordinate activity. These boards would manage regional affairs at the direction of the IMB in London."
 ENG_Rearm_Rely_on_Regional_Boards:0 "Rely on Regional Boards"
 ENG_Rearm_Rely_on_Regional_Boards_desc:0 "With the establishment of the Planning Network, the central IMB should be a mere coordinating body, whereas the regional boards should be the main instrument of development."
 ENG_Rearm_Learn_from_Experience:0 "Learn from Experience"
 ENG_Rearm_Learn_from_Experience_desc:0 "As the IMB and the regional boards continue to function, our bureaucrats' skills will improve over time. This will ensure the smooth long-term operation of the network."
 ###Shadow Scheme
 ENG_Rearm_Shadow_Scheme:0 "The Shadow Scheme"
 ENG_Rearm_Shadow_Scheme_desc:0 "It has long been a conservative goal to rearm Britian in the face of possible conflict in Europe. However, instead of directly rearming using specialized factories, we must contact private industries and have them build equipment for us \"in the shadow of\" their already experienced departments. This will disperse our factories and make our construction more efficient."
 ENG_shadow_scheme:0 "Shadow Rearmament"
 ENG_shadow_scheme2:0 "Shadow Rearmament"
 ENG_shadow_scheme3:0 "Shadow Rearmament"
 ENG_Rearm_Contact_Private_Companies:0 "Contact Private Companies"
 ENG_Rearm_Contact_Private_Companies_desc:0 "We must start by contacting private companies, particularly those in the airplane market, to get them to start building engines and supplies for military use. This way, we can get a head start on fighting the enemy in the air."
 ENG_Rearm_Shadow_Factories:0 "Establish Shadow Factories"
 ENG_Rearm_Shadow_Factories_desc:0 "We can now begin the large-scale process of establishing shadow factories to improve our military production capabilities."
 ENG_air_panic:0 "Air Panic"
 ENG_Rearm_Air_Panic:0 "The Air Panic"
 ENG_Rearm_Air_Panic_desc:0 "There have been reports of a strong push to develop better warplanes on the Continent, and this has sent the populace, the government, and the military into a tizzy. Thus, we will divert resources into air production."
 ENG_Rearm_Dispersion:0 "Dispersed Production"
 ENG_Rearm_Dispersion_desc:0 "Decentralizing our military production sites would go a long way to prevent our output from being severly damaged by enemy bombing."
 ENG_Rearm_Shadow_Switching:0 "Flexible Production"
 ENG_Rearm_Shadow_Switching_desc:0 "The Shadow Scheme can also help us retain production efficiency when switching to new outputs. This is done through the practical experience of the workers in the factory and the technical experience of our engineers."
 ENG_Rearm_Factory_Scotland:0 "Factories in Scotland"
 ENG_Rearm_Factory_Scotland_desc:0 "We must also remember to build shadow factories in Scotland in order to boost employment and further disperse our production."
 ENG_Rearm_Air_Engines:0 "Engine Development"
 ENG_Rearm_Air_Engines_desc:0 "We must develop new airplane engines for our warplanes in order to compete with those on the continent."
 ENG_Rearm_Expand_Capability:0 "Expand our Production Capability"
 ENG_Rearm_Expand_Capability_desc:0 "We have to expand our production if we hope to compete with other European nations. Through the shadow scheme, we will build more factories for necessary equipment."
 ###Direct Rearmament
 ENG_Rearm_Direct:0 "Prepare for War"
 ENG_Rearm_Direct_desc:0 "The Fascist Menace will not wait until we are ready to fight. We must use all our resources to prepare a fighting force should the Fascists try and expand in Europe!"
 ENG_labour_rearmament:0 "National Rearmament Board"
 ENG_labour_rearmament2:0 "National Rearmament Board"
 ENG_Rearm_National_Rearmament_Board:0 "The National Rearmament Board"
 ENG_Rearm_National_Rearmament_Board_desc:0 "We will form a National Rearmament Board to direct the rearmament of our nation. The NRB will be responsible for developing factories capable of supporting our military's needs."
 ENG_Rearm_Factories:0 "Establish State Armament Factories"
 ENG_Rearm_Factories_desc:0 "We will establish state-owned arms factories in order to arm our soldiers. This way, we can also compete with the private corporations and limit the ability of the capitalists to wage war!"
 ENG_Peace_Crusade:0 "The Peace Crusade"
 ENG_Peace_Crusade_desc:0 "We shall position our rearmament program as the preparation of a grand \"Peace Crusade\". Though this is not what we originally meant, it is soon coming time to need a strong military. Fascist powers threaten peace on the continent, and we need to be able to fight back!"
 ENG_Rearm_Belfast_Arms_Factory:0 "The Belfast Rifle Factory"
 ENG_Rearm_Belfast_Arms_Factory_desc:0 "In an effort to diversify our investments, we will build an arms factory in Belfast. This should both help local employment efforts and make sure our arms production is somewhat distributed."
 ENG_Rearm_Continue_Preparations:0 "Divert Resources to the Military"
 ENG_Rearm_Continue_Preparations_desc:0 "We must divert resources to military construction in order to ensure that we can defend Europe from the Fascists!"
 ENG_Rearm_Labour_Private:0 "Coordinate with Private Companies"
 ENG_Rearm_Labour_Private_desc:0 "Though we oppose the capitalist warmongers, we must work with private companies in order to ensure that we can defend ourselves against our common enemies."
 ###In between
 ENG_Rearm_Infantry_Equipment:0 "New Infantry Small Arms"
 ENG_Rearm_Infantry_Equipment_desc:0 "Inproving our infantry's firearms would help us get an edge up on the enemy's soldiers. The development of the Owen, the Vickers-Berthier, and the Lee-Enfield No.5 is thus an urgent use of resources."
 ENG_Rearm_Support_Equipment:0 "Support Units"
 ENG_Rearm_Support_Equipment_desc:0 "We must improve the performance our support units. Reconnaissance units, engineer batallions, and field hospitals must be ready to act at all times!"
 ENG_Rearm_Continue_Mechanization:0 "Continue Mechanization"
 ENG_Rearm_Continue_Mechanization_desc:0 "Cavalry on horseback is backwards and antiquated. We shall replace our cavalry units with motorized and mechanized units to become a modern army, unrivaled by anyone."
 ENG_Rearm_Army_Doctrine:0 "Iterate on our Doctrine"
 ENG_Rearm_Army_Doctrine_desc:0 "We should rework our current army strategies to match our new equipment. We can no longer base our tactics on just cavalry and riflemen now that armour and trucks are commonlace."
 ENG_Rearm_Conscription:0 "Re-Introduce Conscription"
 ENG_Rearm_Conscription_desc:0 "The threat of war is imminent. In order to prepare the United Kingdom for the approaching conflict, we must re-introduce conscription to ensure that we have a fighting force ready to defend Europe!"
 ENG_Rearm_Tanks:0 "Hire Armoured Vehicle Engineers"
 ENG_Rearm_Tanks_desc:0 "We have to hire more engineers to help design armoured vehicles. If we are to compete with the armies of Europe, we will need quality tanks to punch our way through their lines."
 ENG_Rearm_Air_Command:0 "Restructure our Air Command"
 ENG_Rearm_Air_Command_desc:0 "We should reorganize the RAF in order to better coordinate our aerial activities. We will thus create the Fighter, Bomber, and Coastal Commands."
 ENG_Rearm_Naval_Air_Arm:0 "Fleet Air Arm"
 ENG_Rearm_Naval_Air_Arm_desc:0 "The Fleet Air Arm, at the insistance of the Admirality, will be transfered to Royal Navy control. The navy will now be responsible for innovating our naval aircraft."
 ENG_Rearm_Strategic_Bombers:0 "Strategic Bomber Development"
 ENG_Rearm_Strategic_Bombers_desc:0 "Our air strategy is to destroy our enemies' infrastructure and industry from afar. Thus, we need new bombers to be able to carry out said missions."
 ENG_Rearm_Dockyard:0 "Build New Drydocks"
 ENG_Rearm_Dockyard_desc:0 "If we are to prepare for an upcoming conflict, we must make sure that the Royal Navy has enough drydocks to repair our ships and build new war vessels."
 ENG_Consult_Admirality:0 "Consult the Admirality"
 ENG_Consult_Admirality_desc:0 "If the Royal Navy is to be effective, the Admirality must iterate on our strategies, especially as new technologies come into play. This will ensure that we will not fall behind!"
 ENG_Rearm_Ship_Models:0 "Design New Battleships"
 ENG_Rearm_Ship_Models_desc:0 "If we are to maintain a modern navy, we must design new and modern battleships to surpass those of the continent and North America."
 ENG_Rearm_Cruisers:0 "Light Cruiser Development"
 ENG_Rearm_Cruisers_desc:0 "We must develop light cruisers to serve as a fast but powerful component of our fleets. We are currently planning to designate these the Town-class and the Colony-class."
 ENG_Rearm_Destroyers:0 "The Tribal-Class Destroyer"
 ENG_Rearm_Destroyers_desc:0 "The Tribal-class Destroyer will be our new class of destroyer ships. Small and fast, they will displace 1884 metric tons and will be 115 meters long. They will be armed with anti-arcrat guns, torpedo tubes, and depth charges."
 ENG_Rearm_Carriers:0 "The Illustrious-Class Carrier"
 ENG_Rearm_Carriers_desc:0 "We shall develop a new model of aircraft carrier known as the Illustrious-class. At 226 meters long and displacing 23369 metric tons, they will be able to withstand 454 kilogram bombs, as they are meant to serve in the home and Mediterranean theaters."
 ##Colonial
 ENG_Colonial_Start:0 "Colonial Policy"
 ENG_Colonial_Start_desc:0 "The British Empire, at this moment, coveres approximately one-quarter of the Earth's surface. Our policy is generally hands-off as long as profit returns to the Home Isles. However, if we are to mantain order and control, we must get hands-on at some points."
 ###Africa
 ENG_Colonial_Africa:0 "African Policy"
 ENG_Colonial_Africa_desc:0 "The British Empire in Africa controls a contiguous swath of land from Cape Town to Cairo, as well as some land in Nigeria, British Cameroon, Gold Coast, Sierra Leone, the Gambia, and Somalia. We have interests in developing this land for our own usage."
 ENG_Colonial_Africa_Education:0 "English-Language Education"
 ENG_Colonial_Africa_Education_desc:0 "We shall make an effort to build schools in Africa to teach the Africans the English Language. This measure should help us in securing our interests on the continent."
 ENG_Colonial_Africa_Infrastructure:0 "African Railways"
 ENG_Colonial_Africa_Infrastructure_desc:0 "In an effort to bring more resources and produce from Africa to Europe, we shall continue to build railways on the continent."
 ENG_Colonial_Africa_Ghana_Authorities:0 "Gold Coast: Native Authorities Ordinance"
 ENG_Colonial_Africa_Ghana_Authorities_desc:0 "We shall combine the Gold Coast's colonial government and native authorities into a single system managed by the Governor. Native rulers will be given sweeping authority, but will ultimately answer to the central government."
 ENG_Colonial_Africa_Sierra_Leone_Native_Administration:0 "Sierra Leone: Native Administration"
 ENG_Colonial_Africa_Sierra_Leone_Native_Administration_desc:0 "We shall introduce a system of Native Administration based on Lord Frederick Lugard's system in Northern Nigeria. Native rulers will be functionally autonomous, but subordinate to the Protectorate."
 ENG_Colonial_Africa_Ghana_Native_Treasuries_Ordinance:0 "Gold Coast: Native Treasuries Ordinance"
 ENG_Colonial_Africa_Ghana_Native_Treasuries_Ordinance_desc:0 "For the first time in history, the colonial government in Gold Coast will have funds made available for local projects. This should help us develop the colony for our purposes."
 ENG_Colonial_Africa_Nigeria_Prohibition:0 "End Prohibition in Northern Nigeria"
 ENG_Colonial_Africa_Nigeria_Prohibition_desc:0 "Alcohol has been prohibited in Northern Nigeria since 1912. It has come time to end the practice, which is very unpopular among the pagan population of the region."
 ENG_Colonial_Africa_Nyasaland:0 "Nyasaland: The Native Trust Lands Order"
 ENG_Colonial_Africa_Nyasaland_desc:0 "In 1904, the Governor of Nyasaland gained the power to reserve lands for Native African usage rather than for European settlers. However, these lands can still be converted to freeheld land, which hurts the African communities. We shall put a stop to the conversion to protect our interests in the area."
 ENG_Colonial_Africa_Nyasaland_Small_Land_Purchase:0 "Nyasaland Land Redistribution"
 ENG_Colonial_Africa_Nyasaland_Small_Land_Purchase_desc:0 "We will purchase under-used land and redistribute them to landless Africans. This would possibly help us stimulate African agriculture while avoiding unrest."
 ENG_Colonial_Africa_Rhodesia_Bledisloe_Commission:0 "The Bledisloe Commission"
 ENG_Colonial_Africa_Rhodesia_Bledisloe_Commission_desc:0 "Under pressure of European settlers and the colonial government in Southern Rhodesia, we will appoint a commission to investigate the uniting of Southern Rhodesia, Northern Rhodesia, and Nyasaland as a single colony. Led by Lord Bledisloe, we estimate that this commission will take about two years to complete its work."
 ENG_Bledisloe_tt:0 "§YThe Bledisloe Commission will begin its work, and we will receive notification when it is complete.§!"
 eng_colonial.1.t:0 "The Bledisloe Commission's Recommendations"
 eng_colonial.1.d:0 "After about two years of hard work, the Bledisloe Commission has finished looking into the possibility of establishing Northern Rhodesia, Southern Rhodesia, and Nyasaland as a single colony. However, the majority of the Commission has recommended that although Africans would benefit from our business, in order for any actual benefits to come about, Southern Rhodesia would have to end its racialist policies and accept African representation in some manner. However, the establishment of a single colony would make it harder for us to manage at the moment although an early union of Northern Rhodesia and Nyasaland might be feasible. On the other hand, a minority of the Commission - including Lord Bledisloe himself - favored immediate unification of the territories."
 eng_colonial.1.a:0 "An interesting proposal."
 ENG_Colonial_North_Sudan_Advisory_Council:0 "Form the NSAC"
 ENG_Colonial_North_Sudan_Advisory_Council_desc:0 "Though Sudan is formally an Anglo-Egyptian Condominimum, we really have most of the influence there. To weaken the Egyptians and prepare the North Sudanese for self-government, we shall form a North Sudan Advisory Council to represent each of the six provinces."
 ENG_Colonial_Africa_Expand_Bases:0 "Expand African Naval Bases"
 ENG_Colonial_Africa_Expand_Bases_desc:0 "Now that we are in war, we should take this opportunity to expand naval bases in Africa. They might need to host larger fleets and transport more supplies."
 ENG_Colonial_Kenya_Marketing_Controls:0 "Kenyan Market Controls"
 ENG_Colonial_Kenya_Marketing_Controls_desc:0 "We will put additional leverage on the Kenyan economy to secure our interests. We must make it more efficient for output to reach London, even if that means interfering with the economy."
 ENG_Colonial_Kenya_Elites:0 "Sideline Kenyan Elites"
 ENG_Colonial_Kenya_Elites_desc:0 "Traditional Rulers in Kenya should be politically marginalized so that we can get on with our agenda. If the opposition is unable to oppose our interests, we should be able to make Kenya into a model colony soon enough."
 ENG_Colonial_Kenya_Leave_Farmers_Alone:0 "Respect Traditional Agriculture"
 ENG_Colonial_Kenya_Leave_Farmers_Alone_desc:0 "The Kikuyu people have long suffered under British Rule. Their land share slowly dwindled as British Settlers arrived, and their income diminished accordingly. We should try to reverse these trends by putting a formal end to Kikuyu land appropriation."
 ENG_Colonial_Kenya_Land_Transfer:0 "Favor British Settlers"
 ENG_Colonial_Kenya_Land_Transfer_desc:0 "We shall continue the program of favoring British Settlers over local Kikuyu farmers. Though the Kikuyu will continue to be disgruntled at our policies, they are not represented politically, and thus can do very little about it."
 ENG_Colonial_Kenya_Industry:0 "Develop Industry in Kenya"
 ENG_Colonial_Kenya_Industry_desc:0 "We shall strive to improve the Native Kenyans' living conditions by introducing state-owned industry, where they will be paid better wages than if they worked for a settler farm."
 ENG_Colonial_Kenya_Settlers:0 "Settle the Central Highlands"
 ENG_Colonial_Kenya_Settlers_desc:0 "We will continue to encourage British Settlement of the Kenyan Central Highlands. We want them to farm and send the produce back to London."
 ENG_Colonial_Supervise_Education:0 "Supervise Kenyan Education"
 ENG_Colonial_Supervise_Education_desc:0 "We will supervise education in Kenya to make sure that English and the British Way of Life is being taught in schools."
 ENG_Colonial_Imprison_Dissidents:0 "Imprison Nationalist Leaders"
 ENG_Colonial_Imprison_Dissidents_desc:0 "With the ongoing war, we cannot waste time in polemics with African Nationalist dissidents. As such, we shall imprison them so their nationalism will not endanger our control of the colonies."
 ENG_Colonial_Representation:0 "Improve Local Representation"
 ENG_Colonial_Representation_desc:0 "We shall increase the level of African representation in colonial governments. Though these reforms will not be significantly large, they should be enough to placate some nationalists."
 ###Europe
 ENG_Colonial_Europe:0 "Mediterranean Policy"
 ENG_Colonial_Europe_desc:0 "Our colonies in Malta and Gibraltar are vital to the survival of the empire. If we cannot secure the mediterranean, we cannot ensure the safety of the Suez Canal, and thus our supply lines to the Eastern part of the Empire."
 ENG_Colonial_Europe_Gibraltar_Airfield:0 "Link Gibraltar to the Iberian Peninsula"
 ENG_Colonial_Europe_Gibraltar_Airfield_desc:0 "We should build an airport on Gibraltar to facilitate transport between Spain and our holdings. The airfield can also be used to service military planes should the need arise."
 ENG_Colonial_Europe_Gibraltar_Bunkers:0 "Fortify the Rock"
 ENG_Colonial_Europe_Gibraltar_Bunkers_desc:0 "With recent tensions flairing up in Europe, it is imperative that we defend Gibraltar from attack. We will build defensive fortifications inland to defend from a Spanish assault, and by the coast to defend from any naval invasions."
 ENG_Colonial_Europe_Gibraltar_Infrastructure:0 "Expand Gibraltar's Infrastructure"
 ENG_Colonial_Europe_Gibraltar_Infrastructure_desc:0 "In order to benefit Gibraltar's population and expand links to the mainland, we must improve Gibraltar's road and railways."
 ENG_gibraltar_infra:0 "Improved Gibraltar's Infrastructure"
 ENG_Colonial_Europe_Gibraltar_Anti_Air:0 "Anti-Air Emplacements"
 ENG_Colonial_Europe_Gibraltar_Anti_Air_desc:0 "If we lose the war in the air, we will lose it on land as well. Thus, we must build extensive anti-air emplacements in Gibraltar to ensure that it can defend itself from bombings."
 ENG_Colonial_Europe_Gibraltar_Expand_Airfield:0 "Expand the Airfield"
 ENG_Colonial_Europe_Gibraltar_Expand_Airfield_desc:0 "Now that war is upon us, we must expand the Gibraltar Airfield so that would better meet our military needs."
 ENG_Colonial_Europe_Gibraltar_Naval_Base:0 "Expand Gibraltar Ports"
 ENG_Colonial_Europe_Gibraltar_Naval_Base_desc:0 "We should expand our port facilities in Gibraltar, so that it can accomodate greater levels of civilian shipping and military infrastructure."
 ENG_Colonial_Europe_Gibraltar_Fuel_Silo:0 "Expand Gibraltar's Fuel Storage Capabilities"
 ENG_Colonial_Europe_Gibraltar_Fuel_Silo_desc:0 "As our fuel refining output increases, our fuel storage needs grow. Therefore, we will build fuel silos in Gibraltar for naval purposes."
 ENG_Colonial_Europe_Gibraltar_College:0 "Establish Gibraltar College"
 ENG_Colonial_Europe_Gibraltar_College_desc:0 "We will establish a State-Run College in Gibraltar to provide postsecondary education to the Gibraltarians. This should help endear us to the population and better provide for their wellbeing."
 ENG_Colonial_Europe_Gibraltar_Self_Government:0 "Establish the GCC"
 ENG_Colonial_Europe_Gibraltar_Self_Government_desc:0 "Under pressure of the Association for the Advancement of Civil Rights, we will establish an elected Gibraltar City Council to provide the Gibraltarians with a measure of self-government."
 ENG_Colonial_Europe_Gibraltar_Womens_Suffrage:0 "Extend Womens' Suffrage to Gibraltar"
 ENG_Colonial_Europe_Gibraltar_Womens_Suffrage_desc:0 "Women have had the right to vote in the UK since 1918. However, we will extend the right for Gibraltarian Women to vote in Gibraltarian elections, whic has not yet been done."
 ENG_malta_cultural_issue:0 "§YWe have chosen to end Maltese Autonomy§!"
 ENG_malta_cultural_issue_italian_allowed:0 "§YWe have chosen to allow Malta to teach Italian in schools.§!"
 ENG_malta_cultural_issue_ignored:0 "§YWe have chosen to ignore Malta's Cultural Issues.§!"
 ENG_Colonial_Europe_Malta_Rescind_Autonomy:0 "Rescind Maltese Autonomy"
 ENG_Colonial_Europe_Malta_Rescind_Autonomy_desc:0 "If the Maltese cannot agree on their budget and cultural issues, then we will have to rescind their autonomy, suspend their parliament, and make them a Crown Colony once again."
 ENG_Colonial_Europe_Malta_Ignore_Cultural_Issues:0 "Keep out of Malta's Cultural Affairs"
 ENG_Colonial_Europe_Malta_Ignore_Cultural_Issues_desc:0 "We do not have the time or the interest to get involved with Malta's budgetary or cultural issues."
 ENG_Colonial_Europe_Malta_English_as_Official_Language:0 "Establish Official Languages"
 ENG_Colonial_Europe_Malta_English_as_Official_Language_desc:0 "To London, the Maltese Language Issue has a simple solution: from now on, English and Maltese will be the official languages of the Crown Colony."
 ENG_Colonial_Europe_Malta_Constitutional_reforms:0 "Reform the Maltese Constitution"
 ENG_Colonial_Europe_Malta_Constitutional_reforms_desc:0 "In order to move Malta back to a self-governing structure, reforms to the Maltese Constitution must be made in order to prevent this situation from arising again."
 ENG_Colonial_Europe_Malta_Defenses:0 "Establish Defenses in Malta"
 ENG_Colonial_Europe_Malta_Defenses_desc:0 "In case of Italian Attack, we must have emplacements ready in Malta to repel Italian naval invasions."
 ENG_Colonial_Europe_Malta_Restore_Self_Government:0 "Restore Maltese Self-Government"
 ENG_Colonial_Europe_Malta_Restore_Self_Government_desc:0 "The 1946 National Assembly has drafted and promulgated a new constitution for Malta. They are now ready for self-government once more."
 eng_colonial.2.t:0 "The Port at Famagusta"
 eng_colonial.2.d:0 "After beginning construction in 1931, the expansion of the Port in Famagusta, Cyprus is finally complete. Under the supervision of the local Governor, Sir Richmond Palmer, the port is now capable of holding ships up to 9,000 tons, around four times as much as it could before 1931. This is sure to improve our military capabilities in the region."
 eng_colonial.2.a:0 "Excellent Work!"
 eng_colonial.3.t:0 "The \"Palmerokratia\""
 eng_colonial.3.d:0 "In seeming retaliation for the 1931 revolt, the Governor of Cyprus, Sir Herbert Richmond Palmer, has instituted new repressive measures towards the populace. He has restricted school operations, prohibited trade unions, and other measures meant to end local politics from engendering nationalism. This is already unpopular among the population, and has become known as the \"Palmerokratia\"."
 eng_colonial.3.a:0 "Shame."
 ENG_allowed_italian:0 "Allowed Italian Lessons in Maltese Schools."
 eng_colonial.4.t:0 "The Maltese Language Question"
 eng_colonial.4.d:0 "Malta's 1932 Constitution makes it so Italian is not taught in schools, as Malta is not culturally Italian. However, 15% of the population still speaks Italian, and some, like Maltese Nationalist Politician Enrico Mizzi wish to bring Malta closer to Italy culturally by introducing Italian languague lessons as an option for Maltese children. This is obviously intolerable for us, but there are three ways out.\n\nThe first would be to dissolve the Maltese parliament over a budgetary issue caused by such an idea, annul the constitution, and end Maltese self-government for the time being. This would put all control over education and language in the Governor's hands. The second would be to let Mizzi's plan go ahead while keeping watch on the situation. The third, and most uncomfortable option, would be to retract the ban on Italian education, which would better endear us to the people and perhaps foster better relations with Fascist Italy. It is up to the colonial office to make a choice..."
 eng_colonial.4.a:0 "Withdraw the constitution."
 eng_colonial.4.b:0 "Let the issue go."
 eng_colonial.4.c:0 "Retract the ban on Italian in schools."
 ###Americas
 ENG_Colonial_North_America:0 "The Americas"
 ENG_Colonial_North_America_desc:0 "Britain has a substantial presence in North America. Though Canada is an autonomous Dominon, we still have British Guyana, British Honduras, the British West Indies, and the failing Dominion of Newfoundland. Therefore, we must pay some attention to their affairs."
 ENG_Colonial_Newfoundland_Act:0 "The Newfoundland Issue"
 ENG_Colonial_Newfoundland_Act_desc:0 "The wake of the Great Depression has shown the Dominion of Newfoundland to be unsustainable. As such, the Newfoundland Assembly has asked us to resume direct control over the colony. Once the Newfoundland Royal Commission finishes its work, we can go about deciding what to do with the errant Dominion."
 eng_colonial.5.t:0 "The Newfoundland Royal Commission"
 eng_colonial.5.d:0 "After it began its work in February, the Newfoundland Royal Commission has looked into the situtation in Newfoundland and released its report. After the Newfoundland Assembly declared the Dominion to be unsustainable, they requested that we take control of the colony. Instead, we appointed a royal comission led by Lord Amulree to look into the situation.\n\nThe Commisssion recommends that we suspend Newfoundland's autonomy until the area can be self-sufficient. The new government would be made up of six Commissioners that answer to the Governor. Each Commissioner would be responsible for one administrative division. London would also be responsible for Newfoundland's finances until it is once again able to provide for itself."
 eng_colonial.5.a:0 "Thank you for your work!"
 ENG_new_assem_act_on_commish:0 "§YThe Newfoundland Assembly will make preparations for the integration process.§!"
 ENG_begin_integrate_new:0 "§GWe will begin the process of integration.§!"
 eng_colonial.6.t:0 "The End of the Newfoundland Assembly"
 eng_colonial.6.d:0 "Following the recommendations of the Newfoundland Royal Commission, the Newfoundland Assembly has voted to dissolve and abolish itself. Prime Minister Frederick C. Alderice, a businessman of the United Newfoundland Party, has asked us once again to suspend the Dominion government and install a commission instead. It is now up to us to make the preparations."
 eng_colonial.6.a:0 "We will do so as soon as possible!"
 eng_colonial.7.t:0 "The Newfoundland Commission of Government"
 eng_colonial.7.d:0 "It has now come time to assume direct governance of the now late Dominion of Newfoundland. As per the Amulree Commission, we are prepared to appoint a Commission of Government to manage the region. We would thus be responsible for the region's finances and defense. Alternatively, we could pass administration of the colony to Canada, as Canada neighbors the former Dominion and would thus be able to manage its affairs more efficiently. Thirdly, we could appoint our own commission, but keep Newfoundland somewhat responsible for its own government, with London participating in a supplamentary role."
 eng_colonial.7.a:0 "We will establish the Commission"
 eng_colonial.7.b:0 "We will pass the responsibility for Newfoundland to Canada."
 eng_colonial.7.c:0 "We will establish the Commission, but give it some autonomy."
 ENG_solved_newfoundland:0 "§GThe Newfoundland Issue has been solved."
 eng_colonial.8.t:0 "Public Works in British Honduras"
 eng_colonial.8.d:0 "The last few years have been very hard on British Hondurans. Labour activism led to incidents such as the Unemploayed Brigade march in 1934 and groups such as the Labourers and Unemployed Association. Though a recent sedition law has helped to silence the opposition, the Governor has still had to respond by creating barely useful public works for little pay. Though the British Hondurans remain poor and angry, these policies have resulted in the constructin of some 300 kilometers of roads in the colony. Recently, a new constitution was passed to introduce some measures of political representation, but it restricts the franchise to the richest 2%."
 eng_colonial.8.a:0 "It seems agitation will continue."
 eng_colonial.9.t:0 "The Moyne Commission"
 eng_colonial.9.d:0 "The British West Indies have been hard-hit by the Great Depression. This has caused high levels of unrest in the last few years, which has only been staved off by paltry reforms. In addition, growing threats in Europe prove that we need to make sure that workers are not motivated to sabotage our oil supplies. Therefore, we can appoint a West India Royal Commission led by Walter Guinness, 1st Baron Moyne to try and ascertain what actions should be taken, and if possible, prove our rule in the region is benevolent. Does the government think the Commission will be a useful idea?"
 eng_colonial.9.a:0 "Get there as soon as possible!"
 eng_colonial.9.b:0 "This is a waste of time."
 eng_colonial.10.t:0 "The Moyne Report"
 eng_colonial.10.d:0 "We formed the Moyne Commission to prove that our rule in the West Indies is beneficial for the natives. The results have proved the exact opposite. The People of the West Indies still live in conditions that remind one of 18th century slavery. The results are so horrid that we will not publish the report in full for several years, only the recommendations. Employment in the West Indies offers terrible conditions for very little pay, to the point where Commissioners began to openly assist and provide recommendations to local trade unions (which has proved to be a popular measure).\n\nThe Commission recommends that we spend one million pounds over twenty years - a truly paltry amount - to improve conditions including education and health services. The report also recommends that we build a culture where women stay home to tend to their families to open up more opportunity for men. It remains up to parliament to decide how to implement the report."
 eng_colonial.10.a:0 "We will follow the report's suggestions."
 eng_colonial.10.b:0 "We shall take minimal action and leave it up to the Governors."
 eng_colonial.10.c:0 "We will do more than the report suggests."
 ###East Asia
 ENG_Colonial_East_Asia:0 "East Asian Policy"
 ENG_Colonial_East_Asia_desc:0 "Malaya is the Jewel of our Empire. Its huge rubber gathering projects provide the empire with a lot of resources and a lot of money. Singapore and Hong Kong, on the other hand, are vital strategic areas, and no time must be wasted on their protection."
 ENG_Colonial_East_Asia_Reorganize_Malaya:0 "The Federal Secretary"
 ENG_Colonial_East_Asia_Reorganize_Malaya_desc:0 "We wil reorganize the Malayan government to establish the office of Federal Secretary in the Federated Malay States. The Federal Secretary will be responsible for coordination, and will report to the Governor of the Sraits Settlements."
 ENG_Colonial_East_Asia_Singapore_Fuel_Silo:0 "Expand Singaporean Fuel Storage Capability"
 ENG_Colonial_East_Asia_Singapore_Fuel_Silo_desc:0 "If Singapore is going to be the home of our East Asian Fleet, it must have sufficient fuel storage capabilities. Thus, we will expand the fuel silo sites in the area."
 ENG_Colonial_East_Asia_Singapore_Naval_Base:0 "The Singapore Strategy"
 ENG_Colonial_East_Asia_Singapore_Naval_Base_desc:0 "To house an ever-growing fleet, we need a massive naval base in Singapore. This means that Singapore will the basis of our naval operations in the East."
 ENG_Colonial_East_Asia_Singapore_Railways:0 "Improve Singaporean Railways"
 ENG_Colonial_East_Asia_Singapore_Railways_desc:0 "In order to improve the lot of the Singaporeans, we will expand infrastructure in the region. This should both provide some jobs and allow for more efficient social services."
 ENG_Colonial_East_Asia_Singapore_Industry:0 "Direct Singaporean Development"
 ENG_Colonial_East_Asia_Singapore_Industry_desc:0 "If Socialism is to be brought to Singapore, then we must take actual effort to develop it. Singaporean industry will be sponsored and directed so that the natives can boast capital of their own, and end the colonialist economic monopoly."
 ENG_Colonial_East_Asia_Singapore_Trade_Unions:0 "Legalize Trade Unions in Singapore"
 ENG_Colonial_East_Asia_Singapore_Trade_Unions_desc:0 "Trade unions in Singapore should be legalized so that the Singaporeans can fight for better working conditions and wages. Without trade unions, socialism cannot be brought to Singapore!"
 ENG_Colonial_East_Asia_Singapore_Rubber:0 "Expand Singapore Rubber Harvesting"
 ENG_Colonial_East_Asia_Singapore_Rubber_desc:0 "If Malaya is the Jewel of our Empire, then Singapore is the Jewel of Malaya. We should develop Singapore's natural rubber refinement in order to diversify its economy."
 ENG_Colonial_East_Asia_Singapore_Dockyard:0 "Expand the Singapore Drydock"
 ENG_Colonial_East_Asia_Singapore_Dockyard_desc:0 "A large naval base will require a large drydock to go along with it, as ships will need to repair after battle. In addition, we will be able to build replacements for any ships lost in battle."
 ENG_Colonial_East_Asia_Singapore_Coastal_Bunker:0 "Singaporean Naval Defenses"
 ENG_Colonial_East_Asia_Singapore_Coastal_Bunker_desc:0 "If the Japanese are going to attack Singapore from the water, we must have coastal defenses ready to meet them."
 ENG_Colonial_East_Asia_Singapore_Bunker:0 "Singaporean Land Defenses"
 ENG_Colonial_East_Asia_Singapore_Bunker_desc:0 "Should the Japanese land in Malaya and attack Singapore from the north, we must be prepared to defend the settlement on land as well. Thus, defensive lines must be built."
 ENG_Colonial_East_Asia_Singapore_Naval_Base_2:0 "Expand the Naval Base"
 ENG_Colonial_East_Asia_Singapore_Naval_Base_2_desc:0 "We should expand the Singapore Naval Base further in order to accommodate a larger fleet. This will be vital in a war in East Asia."
 ENG_Colonial_East_Asia_Legalize_Political_Parties:0 "Legalize Political Parties in Malaya"
 ENG_Colonial_East_Asia_Legalize_Political_Parties_desc:0 "It is time that we relaxed our hold on Malaya and introduced self-government on the peninsula. To that end, we will begin by legalizing political parties in the region."
 ENG_Colonial_East_Asia_Malaya_Status_Quo:0 "Maintain the Status Quo"
 ENG_Colonial_East_Asia_Malaya_Status_Quo_desc:0 "The status quo in Malaya works very well for London. Resources are flowing in, as do the profits. We therefore see no reason to change much about the sitution."
 ENG_Colonial_East_Asia_Malaya_Public_Services:0 "Expand Public Services"
 ENG_Colonial_East_Asia_Malaya_Public_Services_desc:0 "We should expand public services in Malaya in order to provide for the Malayans' well being. This will help maintain order in the region."
 ENG_Colonial_East_Asia_Malaya_Rubber:0 "Expand Malayan Rubber Refinement"
 ENG_Colonial_East_Asia_Malaya_Rubber_desc:0 "In order to keep up with the demands of the growing transport industry, we must expand our rubber harvesting operations in Malaya."
 ENG_Colonial_East_Asia_Malaya_Reduce_Sultan_Powers:0 "Reduce the Sultans' Powers"
 ENG_Colonial_East_Asia_Malaya_Reduce_Sultan_Powers_desc:0 "The Unfederated Malay States are still nominally ruled by traditional Sultans under a British Protectorate. We should take futher steps to reduce the Sultans' authority to better facilitate the creation of a single Malayan administrative union."
 ENG_Colonial_East_Asia_Malaya_Remove_Sultans:0 "Remove the Sultans"
 ENG_Colonial_East_Asia_Malaya_Remove_Sultans_desc:0 "We can now take action to remove the Sultans from their authority, and thus provide no obstacle to the creation of a Malayan Union."
 ENG_Colonial_East_Asia_Malaya_Malayan_Union:0 "Establish the Malayan Union"
 ENG_Colonial_East_Asia_Malaya_Malayan_Union_desc:0 "We are now in a position where we can establish the Malayan Union, where the Malay States (both Federated and Unfederated) and the Straits Settlements (excluding Singapore) will be considered to be a single administrative unit. Moreover, we will try to make it easier for Indian and Chinese immigrants to gain Union citizenship. However, these policies are not likely to be popular among the populace..."
 ENG_Colonial_East_Asia_Malaya_Education:0 "Improve Education in Malaya"
 ENG_Colonial_East_Asia_Malaya_Education_desc:0 "We should improve education services in Malaya, in order to develop an educated, consious, and subsequently self-sufficient populace."
 ENG_Colonial_East_Asia_Malaya_Trade_Unions:0 "Legalize Malayan Trade Unions"
 ENG_Colonial_East_Asia_Malaya_Trade_Unions_desc:0 "We must allow the Malayan workers to organize into trade unions so that they can fight back against capitalist resource exploitation!"
 ENG_Colonial_East_Asia_Federate_Remaining_States:0 "Federate the Unfederated States"
 ENG_Colonial_East_Asia_Federate_Remaining_States_desc:0 "We shall absorb the Unfederated Malay States into the Federated portion of the peninsula. This will enable us to better coordinate development of the region and introduce Responsible Government in the region"
 ENG_Colonial_East_Asia_Meet_With_Sultans:0 "Meet with the Sultans"
 ENG_Colonial_East_Asia_Meet_With_Sultans_desc:0 "We shall meet with the Sultans of the Malay States to explain our intentions and plan for creating a Malayan Federation. By ensuring them that their traditional place in society will be more-or-less assured we can gain their and their people's support."
 ENG_Colonial_East_Asia_Reassure_Nationalists:0 "Reassure Nationalists"
 ENG_Colonial_East_Asia_Reassure_Nationalists_desc:0 "A propagana campaign to assure Malayan nationalists that our recent political reorganization on the peninsula is in the Malayans' best interest is necessary. The idea of self-government should placate most of them."
 ENG_Colonial_East_Asia_Local_Elections:0 "Hold Local Elections"
 ENG_Colonial_East_Asia_Local_Elections_desc:0 "We can now hold local elections in Malaya. Malayan parties will be able to gain seats in local councils and enact local policy. This is meant to introduce Malayans to the democratic process, and hopefuly prepare them for parliamentary politics."
 ENG_Colonial_East_Asia_Malayan_Federation:0 "Establish the Federation of Malaya"
 ENG_Colonial_East_Asia_Malayan_Federation_desc:0 "We shall enact Responsible Government in Malaya, giving the Malayans the ability to elect their own representatives, while the Sultans remain as the \"heads of state\" for each Malyan State. Malaya will, for the time being, be represented by Governor Sir Gerard Edward James Gent."
 ENG_Colonial_Hong_Kong_Coastal_Forts:0 "Hong Kong Naval Defenses"
 ENG_Colonial_Hong_Kong_Coastal_Forts_desc:0 "Should the Japanese try to invade Hong Kong from the sea, we must be ready to repel them. Thus, defenses must be built in and around Hong Kong."
 ENG_Colonial_Hong_Kong_Gin_Drinkers_Line:0 "The Gin Drinker's Line"
 ENG_Colonial_Hong_Kong_Gin_Drinkers_Line_desc:0 "We should establish an inland defensive line in Hong Kong in order to repel any Japanese or Chinese invasion by land."
 ENG_Colonial_Hong_Kong_Young_Plan:0 "The Young Plan"
 ENG_Colonial_Hong_Kong_Young_Plan_desc:0 "We shall enact ordinances to introduce representative democracy in Hong Kong. This should help put the residents of Hong Kong on our side and stave off nationalism."
 ###Middle East
 ENG_peel_commission_unlocked:0 "§RUnrest has flared up in Mandatory Palestine.§!"
 eng_colonial.11.t:0 "Arab Unrest in Palestine"
 eng_colonial.11.d:0 "Unrest in Mandatory Palestine has been on the rise since the death of rebel leader Izz ad-Din al-Qassam in November 1935. Lately, an Arab uprising has begun with the killing of three Jewish truck drivers by Palestinain militants, which the Jewish paramilitary Irgun quickly responded to. This led to tit-for-tat attacks by Arabs and Jews, such as the Bloody Day in Jaffa. One week ago, the Arab National Committee was formed to advocate for the nationalists, and a general strike began. Though the strike was initially worker-led, political leaders have got involved, who today formed the Arab High Committee. The AHC has resolved to continue the strike until Jewish immigration and land purchase was prohibited, as well as the establishment of a Palestinian assembly. It seems that we might have a full-scale revolt on our hands."
 eng_colonial.11.a:0 "What can be done about it?"
 ENG_do_peel_commission:0 "§YWe are now able to assemble the Peel Commission to study the unrest.§!"
 ENG_Colonial_Middle_East:0 "Middle Eastern Policy"
 ENG_Colonial_Middle_East_desc:0 "We generally maintain a hands-off policy in the middle east due to our large number of protectorates, but on occasion, we must be involved."
 ENG_Colonial_PAL_Peel_Commission:0 "The Peel Commission"
 ENG_Colonial_PAL_Peel_Commission_desc:0 "In order to study and correct for the Arab Revolt in Mandatory Palestine, we will send a commission led by Lord Peel to investigate the situation and give recommendations. We expect violence to abate during the commission's work."
 ENG_peel_takes_year:0 "§GThe Peel Commission will begin its work. Recommendations should come in just over a year.§!"
 ENG_arab_revolt:0 "§RThe Arab Revolt has Resumed§!"
 eng_colonial.12.t:0 "Violene Escalates in Mandatory Palestine"
 eng_colonial.12.d:0 "The Arab population of Mandatory Palstine have nearly unanimously rejected our proposals for peace in the region, and with the assassination of Acting District Commissioner of the Gallilee Lewis Andrews, the revolt has begun once more. We should be prepared to face terrorist attacks from the Arab rebels and see Jewish terrorist counterattacks against the Arabs. Overall, we will have to take action to end this revolt, whether it be military or diplomatic."
 eng_colonial.12.a:0 "And it will go on for the next 50 years in all probability."
 ENG_reject_peel:0 "§YWe have rejected the Peel Commission.§!"
 ENG_reconsider_peel:0 "§YWe have chosen to reconsider the Peel Commission.§!"
 eng_colonial.13.t:0 "The Peel Commission"
 eng_colonial.13.d:0 "After over a year, the Peel Commission has finished its work and presented its findings. The report concluded that the ongoing Arab Revolt in Mandatory Palestine was caused by nationalism, antagonism to Jewish settlement, and economic and political inequality in the region. However, the Commission also found that the original mandate did not forsee such a high level of Jewish immigration, which was hastened by the international situation. The report goes on to say that although the Arabs had economically benefited from Jewish immigration, the political situtation has detoriorated, and then blames the Arabs for their grievences with the Jews.\n\nThe report concludes that the Mandate is no longer sustainable, and recommends that it should be partitioned into an Arab state and a Jewish state. However, the Arab side would be financially unsustainable (as Jews contribute more to the Mandate's treasury). It also recommends the eventual exchange of population between the territories, which would have to move, at most 225,000 Arabs, but only 1,250 Jews.\n\nNeedless to say, the Arab side has unanimously rejected the Peel Plan. They see it as an attempt at economic disenfranchisement, as the plan would give the Jews the best land and force the movement of hundreds of thousands of Arabs. Furthermore, many in the Arab leadership do not want an eventual union with Transjordan. The Jewish reaction has been far different. Though some moderate leaders are enthusiastic about the proposal, radicals wish to see the whole of Palestine turned over to a Jewish state. The only thing that is clear is that this will not be so easy."
 eng_colonial.13.a:0 "This is intolerable! We must find another way."
 eng_colonial.13.b:0 "I suppose it would do for now."
 ENG_Colonial_PAL_Reject_Peel:0 "Reject the Peel Plan"
 ENG_Colonial_PAL_Reject_Peel_desc:0 "The Peel Plan should be rejected outright, as it puts too much pressure onto the Arabs. We want to see an equitable agreement between the Jews and the Arabs instead of unequal partition."
 ENG_Colonial_PAL_Suppress_Revolt:0 "A Military Solution"
 ENG_Colonial_PAL_Suppress_Revolt_desc:0 "We must meet the revolt with a strong military response. We cannot tolerate terrorist actions against our government, and thus we will work to quell the revolt by force."
 ENG_Colonial_PAL_Meet_With_Al_Husseini:0 "Meet with Amin al-Husseini"
 ENG_Colonial_PAL_Meet_With_Al_Husseini_desc:0 "Hajj Amin Al-Husseini, Grand Mufti of Palestine, is one of the leading figures of Palestinian Nationalism. If we meet with him, we might be able to reach a common understanding."
 ENG_Colonial_PAL_Develop_Palestine:0 "Develop the Palestinian Arab Economy"
 ENG_Colonial_PAL_Develop_Palestine_desc:0 "In order to address the problems that caused the revolt in the first place, we will invest into the Arab economy in the Mandate. This should create more equality between the Arabs and Jews, and hopefully help come to some conciliation."
 ENG_Colonial_PAL_Concede_to_Nationalists:0 "Establish the Palestinian Assembly"
 ENG_Colonial_PAL_Concede_to_Nationalists_desc:0 "We will concede to the Palestinian nationalists' demands. First, we will enact limits on Jewish immigration. Second, we will prohibit the purchase of Arab land by Jews. Thirdly, we will establish a Palestinian Assembly to help us work with towards the establishment of Responsible Government that would work to establish an understanding between the Arabs and the Jews."
 ENG_Colonial_PAL_Cooperate_with_Nashashibi:0 "Work with the Nashashibis"
 ENG_Colonial_PAL_Cooperate_with_Nashashibi_desc:0 "The Nashashibis are a powerful family in Palestinian Politics. They are moderate nationalists, and have cautiously accepted the Peel Plan. Therefore, we can work with them to restore order in Jerusalem by sending \"Peace Brigades\" to fight the rebels."
 ENG_Colonial_PAL_Cooperate_with_Haganah:0 "Cooperate with Haganah"
 ENG_Colonial_PAL_Cooperate_with_Haganah_desc:0 "Haganah is a Jewish Paramilitary Group that operates in Mandatory Palestine. Haganah is relatively moderate, especially compared to the splitter faction Irgun. We should cooperate with them in order to restore order to the region."
 ENG_Colonial_PAL_1939_White_Paper:0 "The White Paper of 1939"
 ENG_Colonial_PAL_1939_White_Paper_desc:0 "In response to the international situation, it would be unwise to provoke an important minority that could easily defect to the enemy. Therefore, we will give in to the nationalists' demands for the limiting of Jewish Immigration and Land Purchases."
 ENG_Colonial_PAL_Keep_Fighting:0 "Increase our Military Presence"
 ENG_Colonial_PAL_Keep_Fighting_desc:0 "We shall continue to fight the revolt with military force. We must increase our military presence in the region in order to better smoke out rebel militias and their leaders."
 ENG_released_palestine:0 "Gave us our freedom."
 ENG_partitioned_palestine:0 "Partitioned our land."
 ENG_Colonial_PAL_release_Palestine:0 "End the Mandate"
 ENG_Colonial_PAL_release_Palestine_desc:0 "We have spent the last several years working with the Palestinian Assembly to build responsible government in the region. It is time to end our authority in Palestine, and turn over the land to the Arabs. Though this will hurt our relations with the Jews, we have tried to make an arrangement that would work for both populations."
 ENG_Colonial_PAL_Partition_Palestine:0 "The Partition of Palestine"
 ENG_Colonial_PAL_Partition_Palestine_desc:0 "The time has come to end the Mandate of Palestine. We will partition it according to internationally-agreed-upon plans to provide both the Jews and the Arabs with their own states. While this would hurt relations with the Arabs, we would gain the trust of the Jews."
 ENG_Colonial_Anglo_Egyptian_Treaty:0 "Anglo-Egyptian Treaty"
 ENG_Colonial_Anglo_Egyptian_Treaty_desc:0 "We will offer a treaty to the Egyptians that would increase their autonomy somewhat. Under the terms of the agreement, we will remove our troops to the Suez Canal zone and Alexandria. Egypt will also be able to make foreign treaties, and we will supply and train the Egyptian Army. In addition, we would be able to intervene in case of war."
 ENG_game_limit_restrictions:0 "§YAt time of writing, Hearts of Iron IV cannot model such soldier withdrawal.§!"
 eng_colonial.14.t:0 "Britain Offers a Treaty"
 eng_colonial.14.d:0 "The British have agreed to renegotiate our terms of independence as the Egyptian people emphatically want complete independence from the United Kingdom. Under the terms of the new treaty, British forces will be removed from Egypt (except for the Suez Canal zone and Alexandria), though the British will still supply and train our army. In addition, we will be able to make treaties with foreign countries. If we were independent, we would have the choice to sign this treaty or not, but in reality, we do not have a choice."
 eng_colonial.14.a:0 "I suppose it works for us."
 eng_colonial.15.t:0 "Egypt Signs the Treaty"
 eng_colonial.15.d:0 "Egypt has signed the treaty we have presented to them. Under its terms, we will be restricted in our ability to station troops in Egypt (except in times of war) and we will allow them some autonomy. Hopefully, this should somewhat placate Egyptian nationalists."
 eng_colonial.15.a:0 "Not like they had much choice."
 ENG_Colonial_Egyptian_Socialism:0 "Pressure Egypt to Legalize Socialism"
 ENG_Colonial_Egyptian_Socialism_desc:0 "In the 1920's, the Conserative government twisted the Egyptians' arm to force them to ban socialist parties. We will do the opposite, and pressure the Egyptians to legalize them once more."
 eng_colonial.16.t:0 "Pressure from the United Kingdom"
 eng_colonial.16.d:0 "In the 1920's, the British government forced us to ban socialist parties. Since these parties are anti-royalist, we were not terribly upset at the prospect of prohibiting them. However, the Labour Government in London is pressuring us to re-legalize these parties. Though we would normally have a choice, in this case, we cannot resist British pressure."
 eng_colonial.16.a:0 "Now we have republicans to deal with?"
 ENG_Colonial_Cairo_Base:0 "Expand the Cairo Base"
 ENG_Colonial_Cairo_Base_desc:0 "If there is a war with the Italians, we must have a strong military presence in North Africa. Thus, we will expand our military base in Cairo, despite our agreements with the Eygptians."
 ENG_Colonial_Abdeen_Palace:0 "The Abdeen Palace Incident"
 ENG_Colonial_Abdeen_Palace_desc:0 "There is low support for the War Effort in Egypt. By pressuring [EGY.GetLeader] to appoint a Wafd Party government, we theorize that they will be able to improve support in the country and limit the influence of pro-Axis elements."
 eng_colonial.17.t:0 "The Abdeen Palace Incident"
 eng_colonial.17.d:0 "For the past several months, the British have been calling on us to reject pro-Axis elements in our administration and appoint the Wafd Party as the government. This reversal of British policy comes due to the low support in Egypt for the war effort. Today, however, was different. British forces surrounded Abdeen Palace to demand that King [This.GetLeader] appoint a Wafd government or abdicate!\n\nNervously, the King began to sign the abdication papers. However, Prince Hassanein intervened by speaking Turkish (which the British representative, Sir Miles Lampson, does not know), and tries to convince the King to appoint the nationalist government. At the end of the day..."
 eng_colonial.17.a:0 "...a Wafd government was formed!"
 ENG_Colonial_Egyptian_Trade_Unions:0 "Support Egyptian Trade Unions"
 ENG_Colonial_Egyptian_Trade_Unions_desc:0 "Trade unions exist in Egypt, though are far less prevalent than in the United Kingdom. We should begin programs to support their activities and foster their growth."
 eng_colonial.18.t:0 "Anglo-Egyptian Trade Union Activity"
 eng_colonial.18.d:0 "Though trade unions exist in Egypt, they are few and far between. However, the Labour Government in Britain has been trying to form links with our trade unions in an attempt to foster their growth. Over the past month, there have been meetings between Anglo union representatives and Egyptian organizers. They have exchanged notes, tactics, and ideas. Some in our government suspect that money has even changed hands..."
 eng_colonial.18.a:0 "We must watch the situation carefuly."
 ENG_Colonial_Suez_Infrastructure:0 "Expand Canal Zone Infrastructure"
 ENG_Colonial_Suez_Infrastructure_desc:0 "The Suez Canal is one of our most vital possessions. In order to properly maintain, manage, and defend it, we must improve infrastructure in the Canal Zone."
 ENG_Colonial_Develop_Egypt:0 "Develop Egyptian Industry"
 ENG_Colonial_Develop_Egypt_desc:0 "To ensure that Egypt is a modern and self-sufficient nation, we must expand industrial activity in the country. Therefore, we will invest in the construction of a new factory in Egypt."
 ENG_jordan_treaty:0 "§YIf Jordan signs the Treaty, they will become independent!§!"
 ENG_egypt_treaty:0 "§YIf Egypt signs the Treaty, they will become independent!§!"
 ENG_Colonial_Release_Jordan:0 "The Treaty of London"
 ENG_Colonial_Release_Jordan_desc:0 "It has come time to end the British Mandate in Transjordan. As such, we will present a treaty that would supersede the Organic Law of 1928 that would recognize Transjordan as an independent state and lift any restrictions on foreign policy and finances, but allow us to maintain a military presence."
 eng_colonial.19.t:0 "The Treaty of London"
 eng_colonial.19.d:0 "In accordance to the burgeoning independence movement in Transjordan, the British have presented us with a treaty that would overrule the Organic Law of 1928. Under the terms of the treaty, we will become fully independent without restrictions on our foreign policy. However, the British will still be able to maintain a military force in the region, though at their own expense. They will also be able to seize private land for such reasons. Should we sign the treaty?"
 eng_colonial.19.a:0 "Of course!"
 eng_colonial.19.b:0 "This is a bad idea."
 ENG_Colonial_Release_Egypt:0 "Withdraw to the Canal Zone"
 ENG_Colonial_Release_Egypt_desc:0 "Due to the high levels of nationalism in Egypt, it would be best to withdraw our forces to the Canal Zone. Though we will still be present militarily and politically, we will have very little influence on Egypt from here on out."
 eng_colonial.20.t:0 "British Forces Withdraw from Egypt"
 eng_colonial.20.d:0 "As nationalist sentiment continues to rise in our country, the British have thought it best to withdraw most of their forces to the Suez Canal Zone. While this means that we are nominally autonomous, the British still maintain minor military and political presences in our nation. It would take action to get rid of them completely..."
 eng_colonial.20.a:0 "It would be best not to anger them."
 #New - Libya
 ENG_Emirate_of_Cyrenaica:0 "The Emirate of Cyrenaica"
 ENG_Colonial_Release_Egypt_desc:0 "With the freedom of Egypt, we can turn west to Libya. Although our military administration has so far been undisturbed, the Libyans are beginning to question our alliance with them, and there are increasing calls for self-government in the territory. We can start with Cyrenaica, where we shall create a British-aligned regime under the Emir Idris."
 ENG_Recognize_Libyan_Independence:0 "Recognize Libyan Independence"
 ENG_Recognize_Libyan_Independence_desc:0 "Following the Libyan rebellion under Idris I, The Libyan provisional government has remained a staunch ally to us. We should aim to grant Libya full independence, and formally announce our withdrawal from the territory. This would allow Libya to enter the world stage as a properly independent nation."
 ###India
 ENG_Colonial_India:0 "Manage the Raj"
 ENG_Colonial_India_desc:0 "Our Indian Colonies can largely manage their own affairs, but in order to deal with the Indian Independence Movement, we must get involved sometimes."
 ENG_dominion_raj:0 "§YWe have promised to make the Raj an Imperial Dominion.§!"
 ENG_Colonial_Gov_of_India_Act:0 "The Government of India Act"
 ENG_Colonial_Gov_of_India_Act_desc:0 "In order to move the Raj towards a system of Responsible Government, we must introduce a new act that brings direct elections, a federal court, and more autonomy for the provinces. Thus, we shall draft an act to do just that."
 ENG_draft_goi:0 "§GWe will draft the Government of India Act.§!"
 ENG_bill_goes_to_commons:0 "§YThe bill will go to the House of Commons, and will be voted on in a week.§!"
 eng_colonial.21.t:0 "Hardliners Reject the Government of India Bill"
 eng_colonial.21.d:0 "Based on white papers and select committees, we have drafted the Government of India Act, 1935 in order to move towards a Responsible Government in India. The act features a reorganization of provinces, an end to the diarchy introduced in 1919 (done in an attempt to involve Indians in administration), introduce direct elections, establishing a Federal Court, and allow Indian representatives in the provinces. Ultimately, the goal is to allow India to federalize under a responsible Commonwealth government.\n\nHowever, a group of Conservatives known as \"Diehards\" - such as Winston Churchill - have come out in opposition to the bill. They argue that it provides too much autonomy for the Indians, and gives Britain too little control over local affairs. As such, they demand extra safeguards to ensure that we can maintain control of the region. How should we react?"
 eng_colonial.21.a:0 "We appease the diehards."
 eng_colonial.21.b:0 "The bill will go to the House as it is."
 eng_colonial.21.c:0 "If the diehards will not support it as it is, we cannot send it to the House."
 eng_colonial.22.t:0 "The Amended Government of India Act is Passed"
 eng_colonial.22.d:0 "Due to the opposition of the \"diehards,\" we have had to amend the Government of India act somewhat. We have added extra \"safeguards\" to ensure that the British governor can intervene should anything go against London's interests, and removed direct elections for the lower house. Today, the House of Commons voted on the bill, which passed and will go on to recieve Royal Assent.\n\nThe Act has already been rejected by the Indians, including both Hindus and Muslims. The act does too much to keep our control of the colony rather than transfer government functions to the Indians. Nehru has denounced it, as has Jinnah, so it seems that there is more work to do in this regard."
 eng_colonial.22.a:0 "A step forward, or back?"
 eng_colonial.23.t:0 "The Government of India Act is Passed"
 eng_colonial.23.d:0 "Despite the opposition of the \"diehards,\" we have decided to present the Government of India Act to the House of Commons anyways. In an upset, the Labour Party has surprisingly decided to vote in favor of the Act (on the grounds that it lays a positive framework for the establishment of Indian self-rule), allowing it to pass. Despite this, the bill has not been largely accepted in India. Though nationalist leaders such as Nehru and Jinnah regard the law as insufficient, even they have had to admit that the passing of the act raises the possibility for an equitable solution."
 eng_colonial.23.a:0 "Where do we go from here?"
 eng_colonial.24.t:0 "The Government of India Act Fails to Pass"
 eng_colonial.24.d:0 "Despite the opposition of the \"diehards,\" we have decided to present the Government of India Act to the House of Commons anyways. Without the support of the rest of the party and with the abstenation of the Labour party, the bill has failed to pass. This has been met with outrage by both Hindu and Muslim Indian nationalists, who see the result as proof that India should work towards immediate independence."
 eng_colonial.24.a:0 "We've gone nowhere."
 ENG_separate_Burma:0 "§YBurma will become a separate colony from the Raj.§!"
 ENG_Colonial_Separate_Burma:0 "Separate Burma from the Raj"
 ENG_Colonial_Separate_Burma_desc:0 "Burma will be separated from India and granted a fully elected assembly. However, this will not be popular among some Burmese, as they feel like it is just a ploy to prevent them from seeing the effects of reforms in India."
 ENG_owns_burma_road:0 "§GWe own and control all Rangoon, Mandalay, Kachin, and Upper Shan.§!"
 ENG_Colonial_Burma_Road:0 "The Burma Road"
 ENG_Colonial_Burma_Road_desc:0 "To help the Republic of China fight the Japanese invaders, we must build a highway network in Burma to supply [CHI.GetLeader] with arms."
 ENG_Colonial_Pay_Indian_War_Expenses:0 "Pay Indian War Expenses"
 ENG_Colonial_Pay_Indian_War_Expenses_desc:0 "We will pay for India's war expenses out of our own pockets. This will help us prevent India from going bankrupt and avoid the possibility that the Indians will feel that we are making them pay for our wars."
 ENG_pay_for_raj_expenses:0 "Reimbursement from the United Kingdom"
 ENG_pay_for_raj_expenses_send:0 "Indian War Expense Reimbursement"
 ENG_make_raj_dominion:0 "§GThe British Raj will become a Dominion at the end of the tree.§!"
 ENG_Colonial_Dominion_of_India:0 "Promise to Establish the Dominion of India"
 ENG_Colonial_Dominion_of_India_desc:0 "In an effort to move toward total Indian independence, we will work towards passing the Dominion of India Act in order to establish self-rule in the country. Over the next 10 or so years, we can help the Indians build structures to enable us to pull out without any issues."
 ENG_Colonial_India_Cripps_Mission:0 "The Cripps Mission"
 ENG_Colonial_India_Cripps_Mission_desc:0 "In an effort to boost Indian morale, we will send Labour Party member Stafford Cripps to negotiate with the Muslims and the Indian National Congress for continued Indian support. If successful, we should be able to peacefully transition to Indian self-rule and keep their support for the war."
 ENG_cripps_time:0 "§YCripps will attempt to negotiate with the Nationalists, and we will know the results in about one week.§!"
 ENG_cripps_succeed:0 "§GThe Cripps Mission Succeeded.§!"
 ENG_cripps_failed:0 "§RThe Cripps Mission Failed.§!"
 ENG_quit_india:0 "§RThe Quit India Movement has been launched.§!"
 eng_colonial.26.t:0 "The Quit India Movement"
 eng_colonial.26.d:0 "At a session of the All-India Congress Committee, Indian Nationalist leader Mahatma Gandhi has launched the \"Quit India Movement\" to demand \"An Orderly British Withdrawal\" from the Raj. The declaration calls for immediate Indian independence and mass civil disobediance to achieve this goal.\n\nDespite the INC's enthusiasm, conservative Hindu, communist, and Muslim groups have rejected the Movement, arguing that the needs of the war are more important. Other groups, such as the Rashtriya Swayamsevak Sangh (National Volunteer Organization) have offered to participate, but outside of INC jurisdiction."
 eng_colonial.26.a:0 "We must arrest the INC leadership!"
 ENG_Colonial_India_Transfer_Duties:0 "Begin Transferring Administrative Duties"
 ENG_Colonial_India_Transfer_Duties_desc:0 "We shall begin the transition from a British-led civil service to an Indian-led civil service. Slowly, more Indian bureaucrats will be recruited, allowing us to promote others to replace the British representatives."
 ENG_Colonial_India_Arrest_INC:0 "Arrest the INC Leadership"
 ENG_Colonial_India_Arrest_INC_desc:0 "With the Quit India Movement, it has become apparent that the INC are enemies that we cannot allow to go free lest they succeed in damaging the war effort too much."
 ENG_Colonial_India_Infrastructure:0 "Expand Indian Infrastructure"
 ENG_Colonial_India_Infrastructure_desc:0 "We shall expand India's rail network in order to supply our troops and move resources to our ports."
 ENG_Colonial_Strengthen_Position:0 "Strengthen our Position"
 ENG_Colonial_Strengthen_Position_desc:0 "With the end of the War, we can use this as an opportunity to strengthen our position in the British Raj to avoid independence movements from weakening the empire!"
 ENG_Colonial_Indian_Independence:0 "Withdraw from India"
 ENG_Colonial_Indian_Independence_desc:0 "It has become clear that our position in India is untenable. Ergo, we will pull out of India and transfer its administration to the Indians. We will also create a separate Pakistan in Northwest India and Bengal, as per the wishes of the Muslim League."
 ENG_Colonial_Talk_to_Moderates:0 "Talk to the Moderates"
 ENG_Colonial_Talk_to_Moderates_desc:0 "We should talk to Moderate Indian Nationalists in the CNP and INC such as Chakravarti Rajagopalachari to gain support for our push for Indian Dominionhood."
 ENG_Colonial_Talk_to_Ghandi:0 "Meet with the Radicals"
 ENG_Colonial_Talk_to_Ghandi_desc:0 "Meeting with the radical figures in the INC to get support for our efforts to grant India self-rule might not be met with unanimous support, especially from those like Ghandi or Nehru, but it might do enough to get us the edge."
 ENG_Colonial_Talk_to_Muslims:0 "Promise a Partition"
 ENG_Colonial_Talk_to_Muslims_desc:0 "We will have to meet with the Muslim League to promise the existance of a separate Dominon of Pakistan. Without it, we cannot hope to gain their support."
 ENG_Colonial_India_Transfer_Civil_Service:0 "Transfer the Civil Service"
 ENG_Colonial_India_Transfer_Civil_Service_desc:0 "We will work on fast-tracking the promition of Indians into prominent positions in the Raj Civil Service. This will facilitate the transfer of power from the British to the Indians. In addition, we will assume administration of the Raj's Arabian territory."
 ENG_Colonial_India_Legalize_Trade_Unions:0 "Liberalize Trade Union Law"
 ENG_Colonial_India_Legalize_Trade_Unions_desc:0 "Previous trade union legislation allowed the our authorities to closely monitor the trade unions and strike when there is sign of dissent. We will liberalize the laws to better resemble trade union legislation in Britain."
 ENG_make_india_dominions:0 "§OIndia§! and §GPakistan§! will become §Ydominions§!. §RBurma§! will become §Yindependent§!."
 ENG_free_india_subcont:0 "§OIndia§!, §GPakistan§!, and §RBurma§! will become §Yindependent.§!"
 ENG_Colonial_India_Establish_Dominions:0 "Establish the Dominions"
 ENG_Colonial_India_Establish_Dominions_desc:0 "We shall now fulfill our promises and establish the Dominions of India, Bengal-Pakistan, and Burma!"
 ENG_Colonial_Ceylon:0 "The Dominion of Ceylon"
 ENG_Colonial_Ceylon_desc:0 "We should not ignore the needs of the Ceylonese! We shall establish an independent Ceylon as one of our Dominions."
 #colonial 27-41 by Torpak
 eng_colonial.27.t:0 "Royal Air Force Mutiny in the Raj"
 eng_colonial.27.d:0 "Today a RAF contingent situated in the Indian subcontinent began a mutiny. The protests, which began in Karachi entailed a collective refusal to prepare kits for inspection, followed by further refusals to wear proper uniforms on parade. These actions are reportedly motivated by the slow demobilization of British troops from the Raj and clearly demonstrate the airmen's desire for a more orderly and rapid withdrawal procedure."
 eng_colonial.27.a:0 "Prepare to try these seditious agitators."
 eng_colonial.28.t:0 "Royal Indian Navy Mutiny"
 eng_colonial.28.d:0 "Today a mutiny broke out in the coasts of Bombay, involving more than 20,000 sailors in 78 ships and shore establishments demanding better work conditions. The mutineers began a general strike in Bombay which has spread to other cities, and was joined by elements of the Royal Indian Air Force, a contingent of which is still striking and local police forces. There have also been reliable reports detailing British Army disobedience and support from the Communist Party of India."
 eng_colonial.28.a:0 "Prepare the martial courts for these confused servicemen."
 eng_colonial.29.t:0 "Royal Indian Army Mutiny"
 eng_colonial.29.d:0 "Today a contingent of around 40.000 soldiers and reservists of the Indian Army stationed in Calcutta started protesting their work conditions and "disorderly-conducted" tasks such as cargo transportation. The demonstrators had dropped their infantry weapons and some of them were caught carrying knives when the police force arrived on the scene to detain them."
 eng_colonial.29.a:0 "This is getting out of hand!"
 eng_colonial.30.t:0 "Indian National Congress Leaders Agitate"
 eng_colonial.30.d:0 "Despite not supporting the previous actions of the armed forces, the INC leadership has ended their neutrality on the matter and has started openly voicing support for the protests which were only supported by the Communist Party of India previously."
 eng_colonial.30.a:0 "They will not be able to run their mouths in the court." 
 eng_colonial.31.t:0 "Indians Revolt!"
 eng_colonial.31.d:0 "Ever since the last week, several manifestants from the INC and the AIML have been protesting against the British authorities and our conduct in the Raj. Unfortunately, in a particularly heated exchange between our forces and the protesters, Abul Kalam Azad, one of the INC leaders, was critically-hurt and later succumbed to his wounds. INC's leadership has openly interpreted this as a sign that their movement should drop peaceful independence as their mandate, launching a mass protest that escalated into an armed revolt in the provinces that are militantly pro-INC."
 eng_colonial.31.a:0 "We will end their puny independence movement just like in 1858."
 india_take_action_tt:0 "§RNot taking action of the negociations can lead to disastrous consequences!§"
 eng_colonial.32.t:0 "Accomplishing Indian Independence"
 eng_colonial.32.d:0 "The situation in India has escalated in a way that we could not have imagined. It is clear that establishing native rule over the Indian subcontinent has become a top priority for British diplomacy, to ensure that the crown jewel of the empire is bid the appropriate farewell. To this end, there are several conversations that we will need to have with local leaders to safeguard the smooth transitioning of power."
 eng_colonial.32.a:0 "Let's talk with the Muslim League"
 eng_colonial.32.b:0 "Let's talk with the Indian National Congress"
 eng_colonial.33.t:0 "Talks with Jinnah"
 eng_colonial.33.d:0 "The long-serving and popular leader of the All-India Muslim League, Muhammad Ali Jinnah and his political party have long clamored for an independent Muslim nation to be established in the northwestern part of the Indian subcontinent. Due to the highly heterogenous nature of the subcontinent, the establishment of Pakistan is a not a matter of debate, but a question still stands: the question of Bengal. The province, which is informally divided into religious boundaries, has been the stage to conflict between the West and the East, between Hindus and Muslims. Jinnah and many other Muslim nationalists believe that such a division should not occur as it would put the eastern section of the province at an economic disadvantage and therefore they support a united Bengal under Pakistani control."
 eng_colonial.33.a:0 "We agree, Bengal should be incorporated into Pakistan"
 eng_colonial.33.b:0 "We should consult the INC first"
 eng_colonial.34.t:0 "Talks with the INC"
 eng_colonial.34.d:0 "On the opposite side of the scale, the INC supports the notion that Bengal be divided into two, into East and West Bengal. Influential Hindu nationalist Shyama Prasad Mukherjee believes that in the condition that Bengal is united, the Hindus would not get equitable treatment as they would become the minority. The INC similarly believes that the division of Bengal would be a more feasible way of maintaining stability in the subcontinent and end the debate on the Bengali question."
 eng_colonial.34.a:0 "They raise important points"
 eng_colonial.35.t:0 "INC Objects Against Jinnah's Proposal"
 eng_colonial.35.d:0 "As was clear, the INC and the AIML are embroiled in controversy about the status of Bengal. Muhammad Ali Jinnah's proposal of a united Bengal under Pakistani control has been met with much criticism and the INC has made it clear that they will not support the proposal under any circumstances."
 eng_colonial.35.a:0 "We need to follow the INC's lead if we want to preserve peace"
 eng_colonial.35.b:0 "Enough, we've already given INC enough concessions"
 eng_colonial.36.t:0 "The Radcliffe Line"
 eng_colonial.36.d:0 "Under the leadership of Viscount Radcliffe, the chairman of the two Indian Boundary Committees, demarcation lines deciding the Raj's fate have been drafted. This is a historic occasion and we can only hope that his proposal is met with support throughout all communities."
 eng_colonial.36.a:0 "If the majority agrees, these will be the borders"
 eng_colonial.36.b:0 "Such a large enclave must be granted seperate independence"
 eng_colonial.37.t:0 "Pakistani Independence"
 eng_colonial.37.d:0 "After years of conflict and battle for dominance, the Raj will be finally divided accordingly to the Radcliffe Line, that is..."
 eng_colonial.37.a:0 "Pakistan and India split Bengal"
 eng_colonial.37.b:0 "Pakistan and Bangladesh get independence!"
 eng_colonial.37.c:0 "Pakistan gets all of Bengal"
 eng_colonial.38.t:0 "Indian Independence"
 eng_colonial.38.d:0 "As the British flags fly high for the last time in our crown jewel, a wave of sentimentality grips the Empire's elite. Much was done to keep India under our rule, but it is finally time to let them go."
 eng_colonial.38.a:0 "Then, it's over"
 eng_colonial.39.t:0 "Burmese Independence"
 eng_colonial.39.d:0 "With the recent drive for decolonization in the Indian subcontinent, the native leaders of the seperately-administered state of Burma have issued a declaration of independence. The previously nominally-independent Burma is now also diplomatically seperate from the crown."
 eng_colonial.39.a:0 "If they fought so hard for it..."
 eng_colonial.40.t:0 "The Future of the Indian Sea Islands"
 eng_colonial.40.d:0 "Although they have been struggling for not as long as the Indians, the Ceylonese independence movement has existed since 1915. As such, the House of Commons has voted to establish the Dominion of Ceylon as part of our efforts to grant self-government to the Asian colonies."
 eng_colonial.40.a:0 "Welcome to the family, Ceylon"
 eng_colonial.40.b:0 "Ring up the other dominions and push for full decolonization now!"
 eng_colonial.41.t:0 "Labour's Vision for the Indian Subcontinent"
 eng_colonial.41.d:0 "One of Labour's signature policies is to push for complete self-rule for the crown's colonies, especially for the Indian subcontinent. The British delegation is ready to work for this goal and we will meet with prominent Indian powers right away."
 eng_colonial.41.a:0 "We will not divide and conquer, invite Bose too"
 eng_colonial.41.b:0 "We cannot afford to have the controversial Bose in the negotiations"
 ##Foreign
 ###Cause of Peace (Historical)
 ENG_Cause_of_Peace_Start:0 "The Cause of Peace"
 ENG_Cause_of_Peace_Start_desc:0 "If we truly wish to see a peaceful world, then we must actively strive for it. Thus, it is the duty of the United Kingdom to promote peaceful resolution worldwide."
 ENG_talks:0 "Diplomatic Talks"
 ENG_Peace_Talks_with_America:0 "Meet with the Americans"
 ENG_Peace_Talks_with_America_desc:0 "We should foster positive relations with the United States. If we are ever in danger, then President [USA.GetLeader] might just be willing to come to our aid."
 GER_annexed_austria:0 "[GER.GetFlag]§YGermany§! §Rhas annexed Austria.§!"
 GER_annexed_sudeten:0 "[GER.GetFlag]§YGermany§! §Rhas annexed the Sudetenland.§!"
 GER_annexed_cze: "[GER.GetFlag]§YGermany§! §Rhas annexed the Sudetenland.§!"
 GER_moving_on_POL:0 "[GER.GetFlag]§YGermany§! §Rhas begun to move on Poland.§!"
 ENG_Peace_Talks_with_France:0 "Contacts with the French"
 ENG_Peace_Talks_with_France_desc:0 "We must meet with the French to ensure that if conflict comes, we are on the same side. We will meet with the French foreign minister and President [FRA.GetLeader]."
 ENG_Peace_Appeasement:0 "Appeasement"
 ENG_Peace_Appeasement_desc:0 "We should continue to appease Germany in order to make time for our military to rearm. We are not ready for a war at this moment, and should we get into a conflict, the security of the Empire cannot be definately assured."
 ENG_Soviet_Expansionism:0 "§YGermany is docile, but the Soviets have begun to cause tension.§!"
 ENG_Peace_Collective_Security:0 "Collective Security"
 ENG_Peace_Collective_Security_desc:0 "We must organize an alliance across Europe in order to combat the Germans. A mutual defensive pact between us, the French, the Poles, and the Czechs will go a long way to suffocating [GER.GetLeader]'s ambitions."
 ENG_Peace_Approach_USSR:0 "Approach the USSR"
 ENG_Peace_Approach_USSR_desc:0 "In an effort to foster peace in the region, we should approach the USSR and attempt to improve relations."
 ENG_Peace_Ally_France:0 "Anglo-French Alliance"
 ENG_Peace_Ally_France_desc:0 "In order to contain Germany, we must reach out to the French to establish a formal military alliance."
 eng_foreign.1.t:0 "Joining the [ENG.GetFactionName]"
 eng_foreign.1.d:0 "The British have offered a formal military alliance with us. In short, we will agree to support each other if attacked as a deterrance to nationalist and communist expansion in Europe. Should we agree to this proposal?"
 eng_foreign.1.a:0 "Of course, it's common sense."
 eng_foreign.1.b:0 "We do not need Anglo assistance!"
 eng_foreign.2.t:0 "[From.GetNameDef] joins the Allies"
 eng_foreign.2.d:0 "The [From.GetAdjective] government has decided to join our military alliance. As such, we will now defend each other against all threats!"
 eng_foreign.2.a:0 "Hooray!"
 eng_foreign.3.t:0 "[From.GetNameDef] refuses to join the Allies"
 eng_foreign.3.d:0 "The [From.GetAdjective] government has decided to remain neutral and go on their own. As such, we will not defend each other at all."
 eng_foreign.3.a:0 "Shame."
 ENG_Peace_Ally_Czechoslovakia:0 "Anglo-Czech Defensive Agreement"
 ENG_Peace_Ally_Czechoslovakia_desc:0 "Now that the Germans have gotten their mitts into Austria, it won't be long before they shove their ugly mugs in Czechoslovakia's face. We should look to defend the Czechs from German expansionism."
 ENG_Peace_Ally_Poland:0 "Anglo-Polish Agreement"
 ENG_Peace_Ally_Poland_desc:0 "We must extend our guarantee of Poland's independence to a formal military alliance. Should Poland be attacked by Germany, we shall promise to come to their aid, and they will promise to come to ours."
 ENG_Peace_Defend_Poland:0 "Guarantee Polish Independence"
 ENG_Peace_Defend_Poland_desc:0 "Should the Germans move against the Poles, we will be ready to defend their independence! This should hopefully deter the Germans from invading, at least at this point in time."
 ENG_ita_annexed_alb:0 "§REither has been annexed by or is at war with Italy.§!"
 ENG_Peace_Defend_Greece_Romania:0 "Defend Greece and Romania"
 ENG_Peace_Defend_Greece_Romania_desc:0 "With the Italian annexation of Albania, we must apply our guarantees to Greece and Romania to ensure that Mussolini doesn't get involved in the Balkans."
 ENG_Peace_Ally_Greece_Romania:0 "Anglo-Balkan Alliances"
 ENG_Peace_Ally_Greece_Romania_desc:0 "We should approach Greece and Romania in order to bring them into our alliance. This will ensure that Mussolini and the Germans don't get involved in the Balkans."
 ENG_arms_embargo:0 "Spanish Arms Embargo"
 ENG_arms_embargo_trade:0 "Spanish Arms Embargo"
 ENG_Spanish_Arms_Embargo:0 "Embargo the Spanish Factions"
 ENG_Spanish_Arms_Embargo_desc:0 "The United Kingdom is divided on which side to support in the Spanish Civil War. Arming any of the sides will only exacerbate the divisions at home and escalate the conflict in Spain. Therefore, we will choose to embargo both sides."
 ENG_Support_Republicans:0 "Support the Republicans"
 ENG_Support_Republicans_desc:0 "The Spanish have become one of the first to engage in an anti-fascist struggle. Thus, we shall arm them against the nationalists and organize volunteer brigades to go and fight the fascists."
 eng_foreign.4.t:0 "Help from Britain"
 eng_foreign.4.d:0 "[From.GetNameDef] has offered us arms in our fight against the nationalists. This package would include many kits of infantry equipment, fifty planes, and a solid amount of financial and political support. In addition, they intend to organize a brigade of over 5000 volunteers and pilots to aid our struggle. Britain's involvement will thus legitimize our government in the world stage. Should we accept their offer?"
 eng_foreign.4.a:0 "We welcome our British Comrades!"
 eng_foreign.4.b:0 "We do not need their help."
 eng_foreign.5.t:0 "The [From.GetAdjective] Government accepts our Assistance"
 eng_foreign.5.d:0 "As our offer of assistance has been accepted, our equipment and volunteers have already made it to Spain, where they will fight against the Fascists. It is our hope that they fight well and make it back alive."
 eng_foreign.5.a:0 "Best of Luck!"
 eng_foreign.6.t:0 "The [From.GetAdjective] Government refuses our Assistance"
 eng_foreign.6.d:0 "[From.GetNameDef] has refused our offer to send equipment, planes, and volunteers to assist them against the Fascists. As such, our volunteers will remain at home, and our equipment will thus be used for other purposes."
 eng_foreign.6.a:0 "Best of luck to the [From.GetAdjective]s?"
 ENG_Support_Catalonia:0 "Support Catalonia"
 ENG_Support_Catalonia_desc:0 "Neither Spanish faction is to our liking. One is too socialist, the other too conservative. However, the new nation of Catalonia is more to our liking, as it is a democratic state that is open to our anti-fascist cause."
 eng_foreign.7.t:0 "Help from Britain"
 eng_foreign.7.d:0 "[From.GetNameDef] has offered us arms in our fight against the nationalists. This package would include many kits of infantry equipment, twelve planes, and a solid amount of financial and political support. In addition, they intend to organize a brigade of about 2000 volunteers and pilots to aid our struggle. Britain's involvement will thus legitimize our government in the world stage. Should we accept their offer?"
 eng_foreign.7.a:0 "We welcome our British Comrades!"
 eng_foreign.7.b:0 "We do not need their help."
 eng_foreign.8.t:0 "The [From.GetAdjective] Government accepts our Assistance"
 eng_foreign.8.d:0 "As our offer of assistance has been accepted, our equipment and volunteers have already made it to Catalonia, where they will fight against the Fascists. It is our hope that they fight well and make it back alive."
 eng_foreign.8.a:0 "Best of Luck!"
 eng_foreign.9.t:0 "The [From.GetAdjective] Government refuses our Assistance"
 eng_foreign.9.d:0 "[From.GetNameDef] has refused our offer to send equipment, planes, and volunteers to assist them against the Fascists. As such, our volunteers will remain at home, and our equipment will thus be used for other purposes."
 eng_foreign.9.a:0 "Best of luck to the [From.GetAdjective]s?"
 ENG_trade:0 "Trade Negotiations"
 ENG_sent_assistance:0 "Sent Military Equipment"
 ENG_Catalonian_Trade_Deal:0 "Trade Agreement with Catalonia"
 ENG_Catalonian_Trade_Deal_desc:0 "We should establish trade agreements with [CAT.GetNameDef]. This will ensure that we can increase our consumer exports and allow the Catalonians to access whatever resources they need."
 ENG_Catalonian_Alliance:0 "Anglo-Catalonian Treaty"
 ENG_Catalonian_Alliance_desc:0 "We should invite the Catalonians to our alliance network. This will ensure that the young nation can survive against Fascist and Communist aggression and develop their military to an acceptable level."
 ENG_Meet_with_Republic:0 "Meet with the Republicans"
 ENG_Meet_with_Republic_desc:0 "We should meet with the Spanish in order to establish friendly formal relations with them. This will improve their legitimacy internally and pave the way for an alliance."
 ENG_investment:0 "Encouraged Investment"
 eng_foreign.10.t:0 "British Investment"
 eng_foreign.10.d:0 "After our successful talks, the British have encouraged private businesses to invest in our industry. They apparently wish to make sure our economy can recover in order to position us as a potential ally against Fascist aggresion abroad."
 eng_foreign.10.a:0 "We welcome their assistance!"
 ENG_Economic_Assistance:0 "Encourage Investment in Spain"
 ENG_Economic_Assistance_desc:0 "If we want to get the Spanish back up on their feet, we must encourage private companies to invest in Spain. This will position them as a possible ally against Fascist expansionism."
 ENG_Spanish_Trade:0 "Trade Deals with Spain"
 ENG_Spanish_Trade_desc:0 "We must encourage trade deals with the Spanish in order to assure that they can access British goods and resources. This will enable us to increase our exports and enable them to recover from the civil war."
 ENG_Spanish_Alliance:0 "Anglo-Spanish Treaty of Alliance"
 ENG_Spanish_Alliance_desc:0 "We must prepare to fight the Fascist menace, and thus we should form an alliance with the Spanish in order to ward off Italian ambitions. With the Spanish on our side, our position in the Mediterranean will be strong and protected!"
 ENG_Portuguese_Alliance:0 "Activate the Portugese Alliance"
 ENG_Portuguese_Alliance_desc:0 "In order to ensure that Iberia is a Bulwark of anti-fascism, we must activate our alliance with Portugal. Though they support the conservative elements in Spain, they have engaged in anti-fascist politics at home, and thus would serve as a good model to other conservative dictators to follow."
 ENG_embargo_trade:0 "Embargo"
 ENG_embargo:0 "Embargo"
 ENG_Embargo_Nationalists:0 "Embargo the Nationalists"
 ENG_Embargo_Nationalists_desc:0 "In order to prevent the Nationalists from benefiting from their victory, we will establish an embargo on Spain in order to prevent them from using British resources."
 ###Anti-Fascist Diplomacy
 ENG_Anti_Fascist_Start:0 "The Torch of Freedom"
 ENG_Anti_Fascist_Start_desc:0 "With the expansion of far-right ideologies into Europe, we must engage in a policy of collective security with our fellow European nations to contain ultranationalist expansionism."
 ENG_Anti_Fascist_Approach_Czechs:0 "Approach the [CZE.GetAdjective]s"
 ENG_Anti_Fascist_Approach_Czechs_desc:0 "With the Anschluss, Germany's next clear target is [CZE.GetNameDef], as their German frontier, the Sudetenland, is populated by Germans. We should approach the [CZE.GetAdjective]s to open up the possibility of an alliance."
 ENG_fix_pacifism_tt:0 "§GOne Level of Pacifism will be corrected for.§!"
 ENG_Anti_Fascist_Czech_Alliance:0 "Treaty of Prague"
 ENG_Anti_Fascist_Czech_Alliance_desc:0 "We should sign a treaty of alliance with [CZE.GetNameDef] in order to properly defend them from German And Hungarian Aggression."
 ENG_Anti_Fascist_Embargo_Hungary:0 "Embargo Hungary"
 ENG_Anti_Fascist_Embargo_Hungary_desc:0 "In order to curtail Hungarian expansionism, it is imperative that we establish an embargo on them to prevent their military from rearming with our resources."
 ENG_Anti_Fascist_Protect_Romania:0 "Protect Romania"
 ENG_Anti_Fascist_Protect_Romania_desc:0 "We should bring the Romanians into our alliance network in order to protect them against Hungarian and Bulgarian aggression. Thus, we will send our envoys to Bucharest to sign a treaty of alliance."
 eng_foreign.11.t:0 "Arms from the UK"
 eng_foreign.11.d:0 "The United Kingdom has offered to help supply our army with infantry equipment kits and nearly 50 artillery pieces. Should we accept, it might go a decent way to modernizing and equiping our army against foreign threats. Should we accept this offer?"
 eng_foreign.11.a:0 "Of course!"
 eng_foreign.11.b:0 "We do not need their help."
 ENG_yug_accepted_offer:0 "§GYugoslavia accepted our supplies.§!"
 ENG_yug_refused_offer:0 "§RYugoslavia rejected our supplies.§!"
 eng_foreign.12.t:0 "[From.GetNameDef] Accepts our Supplies"
 eng_foreign.12.d:0 "At the pressure of the [From.GetAdjective] Army, [From.GetNameDef] has accepted our offer of infantry equipment and artillery. Thus, said equipment has already been shipped and will soon arrive in [From.GetAdjective] hands."
 eng_foreign.12.a:0 "Excellent!"
 eng_foreign.13.t:0 "[From.GetNameDef] Rejects our Supplies."
 eng_foreign.13.d:0 "The [From.GetAdjective] government has rejected our offer of small arms and artillery pieces. As such, we will be able to use said equipment for our own purposes."
 eng_foreign.13.a:0 "Shame."
 ENG_Anti_Fascist_Yugoslavia_Arms:0 "Arm Yugoslavia"
 ENG_Anti_Fascist_Yugoslavia_Arms_desc:0 "We should arm Yugoslavia against the Italians, Hungarians, and Bulgarians. We will offer them several hundred packages of small arms and nearly fifty artillery pieces."
 ENG_Anti_Fascist_Yugoslavia_Alliance:0 "Anglo-Yugoslav Treaty"
 ENG_Anti_Fascist_Yugoslavia_Alliance_desc:0 "We should establish an alliance with Yugoslavia in order to protect it from its neighbors. Italy, Germany, Hungary, Bulgaria and even Albania have ambitions on Yugoslav territory, and thus need our help most of all."
 ENG_Anti_Fascist_Embargo_Italy:0 "Embargo Italy"
 ENG_Anti_Fascist_Embargo_Italy_desc:0 "Italian ambitions in the Mediterranean and the Balkans cannot be tolerated. The Italians must be embargoed in order to hamper their military preparations."
 ENG_Anti_Fascist_Ally_Greece:0 "Protect Greece"
 ENG_Anti_Fascist_Ally_Greece_desc:0 "Greece will likely be the target of Italo-Bulgarian aggression. Therefore, we should try to sign a treaty affirming our recognition of Greek territorial integrity."
 ENG_Anti_Fascist_Approach_Poland:0 "Anglo-Polish Diplomatic Contacts"
 ENG_Anti_Fascist_Approach_Poland_desc:0 "We should move to establishing friendly relations with the Poles in order to facilitate further cooperation against German aggression."
 ENG_Anti_Fascist_Planes_to_Poland:0 "Polish Plane Campaign"
 ENG_Anti_Fascist_Planes_to_Poland_desc:0 "We shall offer the Poles sixty-four fighter planes to help them fight against the Germans. However, we can secretly send some of our engineers as well to help them research new designs."
 eng_foreign.14.t:0 "The British offer Fighter Planes"
 eng_foreign.14.d:0 "Diplomats from the United Kingdom have offered to send our military sixty-four fighter planes to protect our skies against German aggression. In addition, they offer to send some of their engineers in secret to help us keep up with advances in figher plane technology. Should we accept this offer?"
 eng_foreign.14.a:0 "Of course!"
 eng_foreign.14.b:0 "We do not need this."
 eng_foreign.15.t:0 "Poland Accepts our Fighter Planes"
 eng_foreign.15.d:0 "The Polish Government has accepted our offer of fighter planes. They have already landed in Poland, and our pilots are instructing the Poles on its operation. In addition, a group of engineers have been brought to Poland (ostensibly on an industrial assignment) in order to help the Poles design newer fighter planes."
 eng_foreign.15.a:0 "Excellent!"
 eng_foreign.16.t:0 "Poland Refuses our Fighter Planes"
 eng_foreign.16.d:0 "The Polish Government has refused our offer of fighter planes, as they feel that they can manage such affairs on their own."
 eng_foreign.16.a:0 "If they say so."
 ENG_Anti_Fascist_Ally_Poland:0 "Anglo-Polish Alliance"
 ENG_Anti_Fascist_Ally_Poland_desc:0 "We should establish an alliance with Poland so that if they are attacked, we will be able to instantly go to war with their enemies!"
 ENG_Anti_Fascist_Embargo_Germany:0 "Embargo Germany"
 ENG_Anti_Fascist_Embargo_Germany_desc:0 "As a show of protest against German expansionism, we will install a total embargo on German goods. British resources will not go to Germany, and German exports will not come to the UK!"
 ENG_French_Summit:0 "Summit with France"
 ENG_French_Summit_desc:0 "We must meet with the French in order to open up the possibility of an alliance. Without them, it will be far harder to fight our enemies on the continent."
 ENG_French_Research:0 "Franco-British Research Agreement"
 ENG_French_Research_desc:0 "We should propose a mutual research assistance agreement to the French. We would be willing to help them with fighter plane technology if they are willing to help with our armoured vehicle engineering."
 eng_foreign.17.t:0 "Research Agreement Proposal from [FROM.GetNameDef]"
 eng_foreign.17.d:0 "Diplomats from [FROM.GetNameDef] have sent a message from the government proposing a mutually beneficial research treaty. In short, we would get help with designing new fighter planes while we would help [From.GetAdjective] engineers with their armoured vehicle designs. Should we accept this deal?"
 eng_foreign.17.a:0 "This seems reasonable."
 eng_foreign.17.b:0 "We do not need their help!"
 eng_foreign.18.t:0 "France Agrees to our Proposal"
 eng_foreign.18.d:0 "The French have agreed to our research proposal. Our engineers have already arrived in Paris, while theirs have begun acclimating to the Northern English climate. Hopefully, this agreement will end up allowing French planes and British tanks to serve together on the battlefield as friends rather than as enemies."
 eng_foreign.18.a:0 "We do not want war, but we will be ready for one."
 eng_foreign.19.t:0 "France Rejects our Proposal"
 eng_foreign.19.d:0 "The French have rejected our research proposal out of concerns of third-party espionage. They would rather the two of us keep our secrets to ourselves."
 eng_foreign.19.a:0 "Fair Enough."
 ENG_French_Trade:0 "Trade with France"
 ENG_French_Trade_desc:0 "We should open up trading channels with France in order to facilitate mutually beneficial economic arrangements. This will, of course, increase the ties between our two countries and increase the need for us to defend each other."
 ENG_French_Alliance:0 "Anglo-French Mutual Alliance"
 ENG_French_Alliance_desc:0 "We must bring the French into our alliance network in order to secure the security of Europe against aggressive expansion. This will enable us to defend France if necessary, and facilitate French cooperation with the rest of Europe."
 ENG_German_Summit:0 "Summit with Germany"
 ENG_German_Summit_desc:0 "Germany should be one of our main allies in Europe. Now that they have conquered Hitlerism and Bolshevism domestically and the threat of German warmongering has thus passed, we can now begin to treat them as Europeans once again."
 ENG_German_Trade:0 "Liberalize Trade with Germany"
 ENG_German_Trade_desc:0 "We should open up more trade with Germany to enable them to better build up their economy. If they are using British resources for their goods, then everyone is better off."
 ENG_German_Payment_Reduction:0 "Reduce German Reparation Payments"
 ENG_German_Payment_Reduction_desc:0 "In order to get the Germans publically on our side, we should reduce their reparation payment requirements in order to allow for their economy to be competative in Europe."
 eng_foreign.20.t:0 "Britain Lowers Reparation Payment Targets"
 eng_foreign.20.d:0 "The British, in an attempt to get the German public on their and our side, have lowered our targets for reparation payments. As such, it has become easier for us to meet our deadlines, something which all offices of government are relieved about."
 eng_foreign.20.a:0 "Thank you, Britian?"
 ENG_German_Alliance:0 "Anglo-German Alliance"
 ENG_German_Alliance_desc:0 "Germany could potentially be a major ally on the continent. We should thus look to include them in our alliance network."
 ###Anti-Communist Diplomacy
 ENG_Anti_Communist_Start:0 "The Defence of Europe"
 ENG_Anti_Communist_Start_desc:0 "It is imperative that we engage in a collective security campaign to prepare for the defense of Europe against the Godless Communists. If we are not careful, then the forces of Marxism will overrun Europe, leaving us helpless to stop them."
 ENG_against:0 "Against our Government"
 ENG_anti_soviet:0 "§YThe United Kingdom is of an Anti-Soviet persuasion.§!"
 ENG_anti_DDR:0 "§YThe United Kingdom is of an Anti-German persuasion.§!"
 ENG_Anti_Communist_Soviet:0 "The Menace in Moscow"
 ENG_Anti_Communist_Soviet_desc:0 "Soviet Leader [SOV.GetLeader] has his fingers in politics all over Europe. In order to protect Europe from a Communist takeover, we must engage in Anti-Soviet politics."
 ENG_Anti_Communist_Poland:0 "Our Partners in Poland"
 ENG_Anti_Communist_Poland_desc:0 "If we are to successfuly defend from Communist expansionism in Europe, we must recognize Poland as a major partner in this matter."
 ENG_Anti_Communist_Germany:0 "The Beast in Berlin"
 ENG_Anti_Communist_Germany_desc:0 "German Leaser [DDR.GetLeader] has proved that Communism can and has advanced into Central Europe. If we do not oppose it now, then the Communists will come for us!"
 ENG_sov_aiming_for_finland:0 "§RThe USSR has turned their sights towards Finland.§!"
 ENG_sov_aiming_for_baltics:0 "§RThe USSR has turned their sights towards the Baltic States.§!"
 ENG_sov_aiming_for_romania:0 "§RThe USSR has turned their sights towards Romania.§!"
 ENG_Anti_Communist_Arm_Finland:0 "Send Arms to Finland"
 ENG_Anti_Communist_Arm_Finland_desc:0 "The USSR has begun making aggressive proposals towards Finland, and should war come to the young nation, it is not expected that the Finns can last long agaisnt the Soviet waves. Ergo, we must send arms to the Finns so that they can properly resist."
 ENG_Anti_Communist_Ally_Finland:0 "Alliance with Finland"
 ENG_Anti_Communist_Ally_Finland_desc:0 "We must deter Soviet aggression by signing a treaty of alliance with Finland. If we pledge to defend Finland, then the USSR will be more reluctant to attack them."
 ENG_Anti_Communist_Guarantee_Baltics:0 "Guarantee the Baltic States"
 ENG_Anti_Communist_Guarantee_Baltics_desc:0 "The Baltic States are small, weak, and unable to defend themselves from their massive neighbor. We should sign a treaty with the three tiny nations pledging to defend them from Red Aggression."
 ENG_Anti_Communist_Ally_Romania:0 "Anglo-Romanian Alliance"
 ENG_Anti_Communist_Ally_Romania_desc:0 "Romania is a definate target of the USSR. [SOV.GetLeader] has claimed Bessarabia as rightful Soviet territory (it was a Russian Imperial territory before 1917), so we must pledge to protect Romania!"
 ENG_Anti_Communist_Embargo_USSR:0 "Embargo the USSR"
 ENG_Anti_Communist_Embargo_USSR_desc:0 "The USSR should not be allowed to arm their military with British resources. We will immediately establish a moratorium on trade with the Soviet Union."
 ENG_Anti_Communist_Arm_Poland:0 "Send Arms to Poland"
 ENG_Anti_Communist_Arm_Poland_desc:0 "Poland requires equipment to fight against any invading powers. Ergo, we should help them fill in the gaps in their equipment needs by sending firearms and artillery pieces."
 eng_foreign.21.t:0 "The British Offer Anti-Tank Emplacements"
 eng_foreign.21.d:0 "The United Kingdom has offered to help supply our army with 50 anti-tank emplacements. Should we accept, it might go a decent way to modernizing and equiping our army against foreign threats. Should we accept this offer?"
 eng_foreign.21.a:0 "Of course!"
 eng_foreign.21.b:0 "We do not need their help."
 eng_foreign.22.t:0 "[From.GetNameDef] Accepts our Supplies"
 eng_foreign.22.d:0 "At the pressure of the [From.GetAdjective] Army, [From.GetNameDef] has accepted our offer of anti-tank equipment. Thus, said equipment has already been shipped and will soon arrive in [From.GetAdjective] hands."
 eng_foreign.22.a:0 "Excellent!"
 eng_foreign.23.t:0 "[From.GetNameDef] Rejects our Supplies."
 eng_foreign.23.d:0 "The [From.GetAdjective] government has rejected our offer of anti-tank emplacements. As such, we will be able to use said equipment for our own purposes."
 eng_foreign.23.a:0 "Shame."
 ENG_Anti_Communist_Anti_Tank_Poland:0 "Send Anti-Tank Emplacements"
 ENG_Anti_Communist_Anti_Tank_Poland_desc:0 "We should offer the Polish some anti-tank emplacements to enable them to fight more technologically advanced armies."
 ENG_Anti_Communist_Poland_Ally:0 "Alliance with Poland"
 ENG_Anti_Communist_Poland_Ally_desc:0 "In order to make sure that Poland's territory is respected, we will establish a mutual pact of alliance with Warsaw. This should deter foreign aggression, and enable us to respond to it in kind."
 ENG_Anti_Commnist_Arm_Czechs:0 "Arm Czechoslovakia"
 ENG_Anti_Commnist_Arm_Czechs_desc:0 "For the Czechoslovaks to survive against Red German Aggression, we must send them arms. We will send firearms and artillery pieces to back their already strong arms industry."
 ENG_Anti_Commnist_Ally_Czechs:0 "Treaty of Bratislava"
 ENG_Anti_Commnist_Ally_Czechs_desc:0 "We must formally agree to protect Czechoslovakia against any invaders on the continent. Additionally, should Germany try and attack us, the [CZE.GetAdjective] Army will come to our aid."
 ENG_Anti_Commnist_Approach_Italy:0 "Approach the Italians"
 ENG_Anti_Commnist_Approach_Italy_desc:0 "We should hold secret talks with the Italians in order to agree on our positions against the Reds in Berlin."
 ENG_Anti_Commnist_Ally_Italy:0 "Alliance with the Italians"
 ENG_Anti_Commnist_Ally_Italy_desc:0 "It is imperative that we establish an alliance with Italy in order to serve as a deterrant to Berlin's machinations."
 ENG_Anti_Communist_Embargo_Germany:0 "Embargo Germany"
 ENG_Anti_Communist_Embargo_Germany_desc:0 "In order to strangle the German economy, we must place an embargo on trade with the Reds. This should hopefully prevent them from arming with our resources."
 ENG_Support_Spanish_Nationalists:0 "Support the Spanish Nationalists"
 ENG_Support_Spanish_Nationalists_desc:0 "We must support the Spanish Nationalists in their quest to defend their civilization against the Communists. Should the Soviets be allowed to gain a foothold in Iberia, they will never leave!"
 ENG_Embargo_Republicans:0 "Embargo Spain"
 ENG_Embargo_Republicans_desc:0 "With the defeat of [SPA.GetLeader]'s forces, we must embargo the Spanish Republic in order to ensure that the USSR can get less influence in Iberia and Western Europe."
 ENG_Recognize_NatSpa:0 "Recognize [SPA.GetLeader]'s Government"
 ENG_Recognize_NatSpa_desc:0 "We should formally recognize the new Spanish Conservative government in order to secure their support against European Communism and Soviet Expansionism."
 ENG_Recognize_Send_Arms:0 "Send Guns to Spain"
 ENG_Recognize_Send_Arms_desc:0 "The Spanish Army is certainly tired after their victory. We should send them modern weaponry to prepare them for future conflicts."
 ENG_Recognize_Send_Investment:0 "Encourage Investment in Spain"
 ENG_Recognize_Send_Investment_desc:0 "We should encourage British Companies to invest in Spain. If they are to be a friendly power, then we need some of our meat in their pie."
 ENG_Ally_NatSpa:0 "Anglo-Spanish Pact of Mutual Protection"
 ENG_Ally_NatSpa_desc:0 "Having Spain as an ally would be a large boon to our efforts in the Mediterranean. We must establish such a pact at once."
 ENG_Ally_Portugal:0 "The Old Alliance"
 ENG_Ally_Portugal_desc:0 "Our alliance with Portugal must be extended into their joining of our alliance network. Portugal will help us fight the Communists wherever they may be!"
 ##Wartime
 eng_war.1.t:0 "War is upon us!"
 eng_war.1.d:0 "The European pot has finally boiled over, as war has come to the United Kingdom. We must now fully mobilize to meet the enemy head-on, as we move to preserve the liberty and balance of Europe. Though the army might be a bit lacking, our navy and air force are the strongest in the world, and we shall hopefully be remembered as the victors..."
 eng_war.1.a:0 "Good luck, everyone."
 ENG_wartime_tree:0 "United Kingdom Wartime Focus Tree"
 eng_war.2.t:0 "George Lansbury Resigns"
 eng_war.2.d:0 "With the declaration of war on the United Kingdom, we can see that the doctrine of pacifism practiced by our government has failed. Public and political outcry has quickly turned against George Lansbury, and his resignation is demanded in all corners of Britain. Seeing the quick turn of public opinion against Labour, the elderly prime minister has resigned from his posts. Clement Attlee has been made prime minister and leader of the Labour Party in his place."
 eng_war.2.a:0 "Let's get down to business!"
 eng_war.3.t:0 "The Labour-Liberal Coalition"
 eng_war.3.d:0 "When the war began, it quickly became clear that a National Unity Coalition was necessary to put political concerns behind us, in order to focus on the war effort, especially with a somewhat controversial Labour government in power. As such, the Labour government has been searching for coalition allies in Parliament. Though the Liberals and even MacDonald's National Labour Organization have agreed to join the government, the Conservatives and their Liberal National allies have refused. It seems as though they do not want to play second fiddle to a Labour government. Ergo, we will have to continue the war with a Labour-Liberal coalition."
 eng_war.3.a:0 "It's something, at least."
 eng_war.4.t:0 "Chamberlain Holds On"
 eng_war.4.d:0 "Though the war began uncertainly, Neville Chamberlain has proved to be a leader capable of keeping the ship steady during the conflict. The conduct of the war has so far been one of capability and calm, rather than panic and chaos. To that end, the prime minister has managed to assemble a tighter coalition of the right and centre-right to ensure stability."
 eng_war.4.a:0 "Well played, Chamberlain!"
 eng_war.5.t:0 "Neville Chamberlain Resigns"
 eng_war.5.d:0 "With [?This.eng_debate_root.GetNameDef]'s attack on [?This.eng_debate_from.GetNameDef], Neville Chamberlain's leadership has come under heavy fire. An effective vote of no confidence during the ensuing debates has strongly reduced his majority, leading to the necessity of a coalition government. However, it has become increasingly clear that Labour will not serve in the government under Chamberlain, but they are willing to work with an alternative Conservative leader. Therefore, Chamberlain has resigned as PM (though keeps his post as party leader).\n\nBut who should replace him? The King wanted the Viscount Halifax, but Halifax himself does not want the position, as he feels he is not a tough enough leader for the war. Thus, Winston Churchill, up to now regarded as a rogue in the party, has been named Prime Minister, and has assembled a new cabinet."
 eng_war.5.a:0 "Shall we fight on the beaches?"
 eng_war.6.t:0 "Guilty Men"
 eng_war.6.d:0 "A new book has been published by the Left Book Club called \"Guilty Men\", and has already made major waves in the country. Written by the enigmatic \"Cato\", the book blames fifteen public figures (Stanley Baldwin and Neville Chamberlain among them) for the disasterous foreign policy of the previous decade that led to the current war. They blame them for appeasing the enemy and failing to equip the armed forces, and call these policies \"deliberate surrender\" to aggression. Guilty Men proclaims: \"let the guilty men retire\"."
 eng_war.6.a:0 "Who is this Cato?"
 eng_war.7.t:0 "End of the War in Europe"
 eng_war.7.d:0 "The War in Europe is Over! With the surrender of the last enemy forces in Europe, the British people are celebrating wildly. However, with the end of the war, there should come new elections. As such, the current government will survive in a caretaker capacity, and elections will be held in two months."
 eng_war.7.a:0 "Hip Hip Hooray!"
 ###Army
 ENG_Army_Start:0 "Increase Conscription"
 ENG_Army_Start_desc:0 "It has become clear that even an increased level of conscription is unsatisfactory. Therefore, we must increase conscription to the general population. Those between the ages of 18 and 51 will be required to serve in some capacity."
 ENG_Army_Artillery_Designs:0 "Focus on Artillery Designs"
 ENG_Army_Artillery_Designs_desc:0 "If our military is to defeat the enemy in combat, we need stronger artillery pieces to batter their troops. Therefore, we must divert resources to our artillery design division."
 ENG_artillery_prod:0 "Artillery Production"
 ENG_Army_Artillery_Production:0 "Focus on Artillery Production"
 ENG_Army_Artillery_Production_desc:0 "Artillery is cheap enough to design. If we are to defeat the enemy, then we need a lot of artillery to face them with, or else having advanced artillery will be pointless."
 ENG_Army_Armour_Research:0 "Improve our Tank Corps"
 ENG_Army_Armour_Research_desc:0 "Our armoured brigades should have the best tanks available. Thus, we will focus on designing new armoured vehicles."
 ENG_mechanization:0 "Mechanization of the Army"
 ENG_Army_Mechanized:0 "Continue Mechanization"
 ENG_Army_Mechanized_desc:0 "Now that we are at war, we have more incentive to push through the mechanization of the Army. Though this process started in the mid-30's, it is imperative that we modernize our military as soon as possible."
 ENG_Army_Anti_Aircraft:0 "Anti-Aircraft Models"
 ENG_Army_Anti_Aircraft_desc:0 "If we are to fight an enemy with a strong air force, then we must counter with a strong anti-air component. This requires strong anti-air brigades, which in turn requires advanced technology."
 ENG_Army_Raiders:0 "Establish the Commandos"
 ENG_Army_Raiders_desc:0 "We should establish a special formation capable of conducting amphibious raids on enemy shores. The force will land, cause damage, and then quickly leave, in a similar fashion to the Boer Commandos during the Boer wars."
 ENG_home_guard:0 "Home Guard"
 ENG_stay_behind:0 "Stay-Behind Units"
 ENG_Army_Home_Guard:0 "Establish the Local Defence Volunteers"
 ENG_Army_Home_Guard_desc:0 "We shall establish a citizen militia of Local Defence Volunteers that will guard key strategic areas on the home isles and, should the enemy land on our shores, work to slow down their advance."
 ENG_Army_Auxiliary_Units:0 "Auxiliary Units"
 ENG_Army_Auxiliary_Units_desc:0 "We shall establish two secretive stay-behind plans in case of enemy invasion. The first will involve the Auxiliary Units, which is nominally a part of the Home Guard, but their true intention is to disrupt the enemy occupation and occupation from the rear, though not for the long-term. Long-term resistance will be handled by the SIS, though this \"office\" will really begin expansion if the occupation begins."
 ENG_Army_Expand_ATS:0 "Expand the ATS"
 ENG_Army_Expand_ATS_desc:0 "The Auxiliary Territorial Service is the women's branch of the army. Though some work in traditional roles such as cooks and clerks, others work in driving, inspection, and even combat roles such as anti-aircraft spotting. The ATS should be expanded as it is becoming increasingly clear that women are capable of handling military duties."
 ENG_womens_branch:0 "Auxiliary Territorial Service"
 ENG_Army_Parachutists:0 "Form the Parachute Regiment"
 ENG_Army_Parachutists_desc:0 "We should begin training Parachutists, who would be able to drop from the air behind enemy lines."
 ENG_Army_SAS:0 "The Special Air Service"
 ENG_Army_SAS_desc:0 "We should form a new commando regiment capable of undertaking special operations including raiding and special reconaissance. Such a force will have to be staffed by only a select kind of soldier. They will be selected for this task because they are the best, the elite, and they all know what to do."
 ENG_Army_Lessons_of_War:0 "Lessons of War"
 ENG_Army_Lessons_of_War_desc:0 "As the war continues, we have encountered new strategies, ideas, and kinds of warfare. As such, we should invest additional resources into researching new tactics to compensate."
 ###Navy
 ENG_Navy_Start:0 "Mobilize the Navy"
 ENG_Navy_Start_desc:0 "The Navy is the mightiest arm of our military, and likely one of the more necessary components. Defending our isles from invasion must be a priority, and thus the Royal Navy must constantly be improved upon."
 ENG_Navy_Dockyards:0 "Establish new Drydocks"
 ENG_Navy_Dockyards_desc:0 "A navy at war means a navy that loses ships at some point. We must build new drydocks in order to incrase our naval output."
 ENG_Navy_Destroyers:0 "The Q and R-Class"
 ENG_Navy_Destroyers_desc:0 "We must research newer and stronger models of destroyers for the Royal Navy. The proposed Q class would displace over 1700 tonnes and have a maximum range of 8658 km. In addition, it would carry several torpedoes and fourteen guns. The R class would be similar, but be a minelayer and depth charger."
 ENG_Navy_Submarine:0 "The V-Class"
 ENG_Navy_Submarine_desc:0 "Our proposed V-class submarine would be 62 meters long and travel at a speed of of 21 km/h. It would carry 33 sailors and be able to fire eight torpedoes out of any one of four 53 cm tubes."
 ENG_Navy_Battleships:0 "The King George V-Class"
 ENG_Navy_Battleships_desc:0 "The proposed King George V-class would be the first of our modern battleships. Displacing 43,000 tons, it will have its own radar, several guns, strong armor, and even its own seaplanes."
 ENG_Navy_Cruiser:0 "The Minotaur-Class"
 ENG_Navy_Cruiser_desc:0 "The proposed Minotaur-class cruiser  will be 170 m long and carry 18 gun emplacements, including anti-aircraft weapons. In addition, it will cary two torpedo tubes. It will have a maximum range of 15,000 km on 1,850 tons of fuel."
 ENG_Navy_Carrier:0 "The Audacious-Class"
 ENG_Navy_Carrier_desc:0 "Carriers are the future of naval combat. The ability to rain down hell from above is an unresistable strategy. To that end, we will design the Audacious-class carrier to carry over 50 planes."
 ENG_Navy_Churchills_Anchor:0 "Consult Sir Dudley Pound"
 ENG_Navy_Churchills_Anchor_desc:0 "We shall consult Admiral of the Fleet Sir Alfred Dudley Pickman Rogers Pound on strategy in order to formulate sufficient anti-submarine and anti-surface fleet tactics."
 ENG_trade_interdiction:0 "Interdiction Strategies"
 ENG_Navy_Interdiction_Strategies:0 "Trade Interdiction"
 ENG_Navy_Interdiction_Strategies_desc:0 "If the enemy loves to sink our convoys so much, we shall see how much they like it if we do it to them!"
 ENG_Navy_Expand_Womens_Branch:0 "Expand the WRNS"
 ENG_Navy_Expand_Womens_Branch_desc:0 "The WRNS (or Wrens, the Womens' Royal Naval Service) serve in support and technical roles, ranging from cooks to analysts and electricians. It is slowly becoming more apparent that the Wrens are equally capable as the men are, so their list of responsibilities and the size of the organization should be expanded."
 ENG_Navy_Doctrine:0 "Protect our Naval Supremacy"
 ENG_Navy_Doctrine_desc:0 "We must protect our supremacy of the waves! As such, we must sink additional resources into floating new tactics in the naval high command. Hopefully, some new ideas will swim to the top."
 ENG_Air_Start:0 "Guarding the Skies of the Isle"
 ENG_Air_Start_desc:0 "Protecting the Isles means we must ensure that we have a modern air force. Day and night, the battle shall go on for the freedom of Europe!"
 ENG_air_panic2:0 "Increased Air Production"
 ENG_Air_Rachet_Production:0 "Increase Airplane Output"
 ENG_Air_Rachet_Production_desc:0 "If we are to have an effective air force, then we must drastically increase our production of airplanes. Fighters, bombers, and everything in between are necessary!"
 ENG_commonwealth_training:0 "British Commonwealth Air Training Plan"
 ENG_Air_Commonwealth_Training_Plan:0 "Establish the BCATP"
 ENG_Air_Commonwealth_Training_Plan_desc:0 "The British Commonwealth Air Training Plan will be a massive effort to train pilots in Canada, Australia, and New Zealand (South Africa will have a similar arrangement in the Joint Air Training Scheme). This will ensure that our the empire's pilots - and those from allied countries - will be as competent as ours!"
 eng_foreign.24.t:0 "Joint Pilot Training with the United Kingom"
 eng_foreign.24.d:0 "The United Kingdom has decided to establish a Commonweatlh Air Training plan to help train pilots from the Commonwealth and allied countries. As such, we have the option of joining this plan, or to reject Britain's help and train pilots on our own. How shall we respond?"
 eng_foreign.24.a:0 "We accept!"
 eng_foreign.24.b:0 "We refuse!"
 ENG_Air_Fighter:0 "Refine our Fighter Designs"
 ENG_Air_Fighter_desc:0 "Though the Spitfire and Hurricane are more than satisfactory, new light fighter designs would work to make sure that we can keep up with enemy developments."
 ENG_Air_Bombing:0 "Continue our Bombing Strategies"
 ENG_Air_Bombing_desc:0 "Our studies before the war have established that strategic bombing is likely our best bet. Therefore, we shall continue researching tactics to implement this strategy."
 ENG_Air_Seaplanes:0 "Support the Fleet Air Arm"
 ENG_Air_Seaplanes_desc:0 "Supporting the Royal Navy's aviation program would lead to the design of newer naval aircraft, capable of taking off from carriers and fighting enemy fleets from above."
 ENG_Air_Bombers:0 "New Bomber Designs"
 ENG_Air_Bombers_desc:0 "If we are to be able to bomb the enemy, especially from the home isles, then we must design new bombers with more range and firepower."
 ENG_bouncing_bomb_bunker_buster:0 "Bouncing Bombs & Bunker Busters"
 ENG_Bouncing_Bomb_Bunker_Buster:0 "Bouncing Bombs and Bunker Busters"
 ENG_Bouncing_Bomb_Bunker_Buster_desc:0 "Bouncing Bombs and Bunker Busters are solutions to various problems we are having with strategic bombing. The bouncing bomb will help us take our enemy dams by skipping along the surface of the water until it hits the target. The bunker buster will be able to penetrate deeper into the ground to hit at underground factories."
 ENG_night_bombing:0 "Nighttime Bombing"
 ENG_Nighttime_Bombing:0 "Nighttime Training"
 ENG_Nighttime_Bombing_desc:0 "Hitting enemy infrastructure in the night is harder in the day, but it is also harder for them to spot our planes. We should train our pilots to be better nighttime pilots, so that we can outmaneuver the enemy at night."
 ###Political
 ENG_War_Politics_Start:0 "Britain at War"
 ENG_War_Politics_Start_desc:0 "Tensions in Europe have finally come to the United Kingdom. We are now at war to protect the balance of the Continent and the freedom of European countries. In a broadcast to the nation, the Prime Minister has announced that we must steel ourselves if we are to be victorious."
 ENG_War_Politics_Secrets:0 "Protect Official Secrets"
 ENG_War_Politics_Secrets_desc:0 "With the passing of the Official Secrets Act, we shall more clearly define the scope of the sharing of official secrets, and clarify how the government is allowed to investigate it."
 ENG_war_loans:0 "Wartime Loans"
 ENG_War_Politics_National_Loans:0 "The National Loans Act"
 ENG_War_Politics_National_Loans_desc:0 "The Government must be able to take a large amount of loans in order to fund the war effort. As such, we will have to pass an act giving us such authority."
 ENG_War_Politics_War_Damage:0 "War Damage Provisions"
 ENG_War_Politics_War_Damage_desc:0 "It is imperative that we provide for the rights of the people in regards to the damage of property due to the war. In addition, all parties, including the government, shall also absolve ourselves of responsibility for the damage, and thus we will have no obligation for its repair."
 ENG_War_Politics_Finance_War:0 "Finance the War"
 ENG_War_Politics_Finance_War_desc:0 "If we are to properly finance our military, we must drastically increase its budget. This is the reason we have taken so many loans."
 ENG_War_Politics_Prepare_People:0 "Prepare the People"
 ENG_War_Politics_Prepare_People_desc:0 "We must engage on a propaganda campaign to get people to support the war effort. A strong military begins at home, so we must create a strong home front as well."
 ENG_War_Politics_Compensation:0 "Provide for Compensation"
 ENG_War_Politics_Compensation_desc:0 "We must have provisions to compensate our subjects for sacrifices that go towards the war effort. This should support stability at home."
 ENG_lib_lab_gov:0 "§GWe have formed a§! §RLabour§!§G-§!§YLiberal§! §GGovernment§!."
 ENG_wartime_government:0 "§GWe have formed a§! §YGrand Coalition§!."
 ENG_War_Labour:0 "The Labour-Liberal Government"
 ENG_War_Labour_desc:0 "This war makes the first time that Labour has controlled the government during a war, and during such a major war, we need as much assistance as possible. Though the Conservatives stubbornly refuse to form a coalition with us, the Liberals have agreed to join the government in an effort to preserve stability."
 ENG_War_Prohibit_BUF:0 "Prohibit the BUF"
 ENG_War_Prohibit_BUF_desc:0 "Our war with Fascist powers requires a strong home front. We cannot risk the possibility of disruption by a \"Fifth Column\" of domestic fascists. Therefore, the British Union of Fascists must be prohibited, and its leaders must be arrested."
 ENG_War_Coalition:0 "The Wartime Coalition"
 ENG_War_Coalition_desc:0 "With Chamberlain's ousting and new premiership of Winston Churchill, a wartime coalition has been formed to preserve parliamentary order during the crisis. It is clear that we have many years of war ahead of us."
 ENG_War_Prohibit_CPGB:0 "Ban the CPGB"
 ENG_War_Prohibit_CPGB_desc:0 "Our war with Bolshevist powers means that we cannot tolerate the possibility of Communistic subterfuge. Thus, the Communist Party of Great Britain will be abolished, and its leaders will be arrested."
 ENG_cpgb_seats:0 "§YCPGB seats will go to the ILP.§!"
 ENG_buf_seats:0 "§YBUF seats will go to the Conservatives.§!"
 ENG_War_Tory_National_Coalition:0 "The Chamberlain Ministry Holds On"
 ENG_War_Tory_National_Coalition_desc:0 "The Chamberlain war ministry has escaped from the votes of no confidence, but it is clear that it must do more to inspire the people's confidence in the government if the war is to go smoothly."
 ENG_national_government_wartime:0 "§GThe§! §qChamberlain War Ministry§!§G has Survived.§!"
 ENG_War_Tenancy_Act:0 "Protect Tenants' Rights"
 ENG_War_Tenancy_Act_desc:0 "We should enact a law giving tenants proper rights to ensure that they do not lose their homes, even at the expense of the landlord. In addition, the tenant shall have protections in the event of war-related incidents."
 ENG_war_damage_act:0 "The War Damage Act"
 ENG_war_damage_act_local_gov:0 "The War Damage (Local Government) Act"
 ENG_War_Damage_Act:0 "The War Damage Act"
 ENG_War_Damage_Act_desc:0 "The previous war damage provisions were not satisfactory. We must establish a War Damage Commission to oversee such matters and give it sufficient powers to procure necessary resources and ensure stability."
 ENG_War_Housing_Law:0 "Additional Council Houses"
 ENG_War_Housing_Law_desc:0 "We must strive to build additional housing for those who have inadvertently lost their homes due to the war."
 ENG_War_Increase_Spending:0 "Increase Public Spending"
 ENG_War_Increase_Spending_desc:0 "Now that the war is over in Europe, we must look to build a post-war economy. Though some in our government call for Austerity once more, we shall reject it in favor of stimulus. This will enable the people to have enough support to get their own affairs in order."
 ENG_War_Superannuation_Act:0 "The Superannuation Scheme"
 ENG_War_Superannuation_Act_desc:0 "We must enact legislation preventing the loss of benefits of those serving in the armed forces or in other war-related employment."
 ENG_large_education_spend_tt:0 "§YWe wil drastically increase education spending.§!"
 ENG_War_Education_Act:0 "The Education Act"
 ENG_War_Education_Act_desc:0 "We must re-examine our education system and provide for the mass education of all British children, not just the privaleged. This shall be the beginning of a welfare state, as it is painfully clear that one is becoming necessary."
 ENG_subtract_medium_public_works:0 "§YWe will decrease spending on public works.§!"
 ENG_War_Austerity:0 "The Economy Drive"
 ENG_War_Austerity_desc:0 "Now that the war is over in Europe, we must begin rebuilding our economy. However, we are in massive debt, so we must engage in an austerity campaign in order to avoid defaulting on our loans."
 ENG_minister_of_works:0 "Ministry of Works and Planning"
 ENG_War_Minister_of_Works:0 "Ministry of Works and Planning"
 ENG_War_Minister_of_Works_desc:0 "We will establish the Ministry of Works and Planning to manage construction and public works in the country. This will allow us to coordinate some sections of the home front."
 ENG_War_Landlord_Act:0 "The Landlord Act"
 ENG_War_Landlord_Act_desc:0 "The Rights of Tenants and Landlords are both important, so we will enact a law providing for the rights of tenants and landlords during wartime. In short, it will be harder for the landlords to evict tenants, but the tenants will have to share responsibility for repairs."
 ENG_War_Landlord_and_Tenant:0 "Landlords and Tenants"
 ENG_War_Landlord_and_Tenant_desc:0 "We should make provisions for the relationship between tenants and landlords in regards to war damage. Effectively, we seek to make tenants less responsible for making rent and repairing their buildings in the event of war-related damage."
 ENG_War_Local_Gov_War_Damage:0 "The War Damage (Local Government) Act"
 ENG_War_Local_Gov_War_Damage_desc:0 "London cannot be held responsible for fixing war-related damage in all parts of the country. We will shift funds to local authorities so that they can deal with such things themselves."
 ENG_War_Pensions_Appeal:0 "Establish Pension Appeal Tribunals"
 ENG_War_Pensions_Appeal_desc:0 "We must guarantee all the ability to appeal for their pensions in the event of an error by the Minister of Pensions."
 ENG_War_Private_Education_Act:0 "Increase Funding for Private Schools"
 ENG_War_Private_Education_Act_desc:0 "We shall increase state funding for private schools so that we can guarantee a stronger education for British children."
 ENG_War_Naval_Pensions:0 "The Naval Pensions Act"
 ENG_War_Naval_Pensions_desc:0 "In the navy, one can see the seven seas, but in the navy, life is very hard for thee. We should increase sailors' pensions to compensate them for their tiring work."
 ENG_War_Public_Works:0 "Loans for Public Works"
 ENG_War_Public_Works_desc:0 "Our public works require that we take loans to pay them. We shall enact legislation to do just that."
 ENG_fuel_power:0 "Ministry of Fuel and Power"
 ENG_War_Fuel_and_Power:0 "Ministry of Fuel and Power"
 ENG_War_Fuel_and_Power_desc:0 "We shall establish the Ministry of Fuel and Power to better coordinate the development of fuel refining and power generation across Great Britain."
 ENG_War_Coal_Act:0 "Amend the Coal Acts"
 ENG_War_Coal_Act_desc:0 "We shall amend the existing coal acts to disolve the Coal Mines National Industrial Board and provide more protection for those working in these industries."
 ENG_War_Water_Act:0 "Water Utility Planning"
 ENG_War_Water_Act_desc:0 "We shall confer the responsibility and all necessary powers needed to properly plan for the distribution and usage of water supplies onto the Ministry of Health."
 ENG_War_Local_Authorities_Loans:0 "Local Authority Loans"
 ENG_War_Local_Authorities_Loans_desc:0 "We shall prohibit local authorities from borrowing from anyone else other than the Public Works Loan Commission. This will keep our debt lower than if we let them borrow willy-nilly."
 ###
 ENG_War_Homefront_Start:0 "The Home Front"
 ENG_War_Homefront_Start_desc:0 "War has come to the Isles, so we must prepare the people to meet the enemy not just in combat, but also at home. We must keep calm, carry on, and win the war!"
 ENG_War_Homefront_Purchase_Supplies:0 "Purchase Supplies"
 ENG_War_Homefront_Purchase_Supplies_desc:0 "We need munitions as soon as possible. Therefore, we will purchase supplies from producers immediately rather than investing in industry for the long-term."
 ENG_War_Homefront_Invest_Industry:0 "Invest in Industry"
 ENG_War_Homefront_Invest_Industry_desc:0 "We should invest in constructing new military industry installations in order to properly supply our troops. All output must be oriented toward the war effort, as strategic needs come first."
 ENG_War_Homefront_Civilian_Industry:0 "Balance with Civilian Needs"
 ENG_War_Homefront_Civilian_Industry_desc:0 "We should try and achieve some balance with civilian industry. If civilian industry falters, than military industry will soon follow suit."
 ENG_War_Homefront_More_Military:0 "Expand our Industrial Capability"
 ENG_War_Homefront_More_Military_desc:0 "It is imperative that we build more military production facilities. No matter how good our soldiers and officers are, we ultimately need equipment to win the war."
 ENG_War_Homefront_Equality_of_Sacrifice:0 "Equality of Sacrifice"
 ENG_War_Homefront_Equality_of_Sacrifice_desc:0 "With the possibility of being cut off from our empire, we must inspire the civilian population to donate their metal to the war effort. Garden railings, pots and pans, and any extra bit will go into the factory lines!"
 ENG_War_Homefront_Dockyard:0 "Expand Dockyard Capacity"
 ENG_War_Homefront_Dockyard_desc:0 "We must expand our dockyard capacity to be able to better repair and expand the Royal Navy."
 ENG_womens_land_army:0 "Women's Land Army"
 ENG_War_Homefront_Expand_Womens_Land_Army:0 "Expand the WLA"
 ENG_War_Homefront_Expand_Womens_Land_Army_desc:0 "The Women's Land Army was reintroduced shortly before the war so that women could work in agriculture, replacing men who were called to military service. We should expand the organization now that we have sharply increased conscription."
 ENG_rationing:0 "Rationing"
 ENG_victory_gardens:0 "Rationing & Victory Gardens"
 ENG_War_Homefront_Rationing:0 "Begin Rationing"
 ENG_War_Homefront_Rationing_desc:0 "With our limited stocks of food and other supplies, we must introduce a rationing program to ensure that we do not run mass shortages."
 ENG_War_Homefront_Victory_Gardens:0 "Victory Gardens"
 ENG_War_Homefront_Victory_Gardens_desc:0 "The Victory Garden campaign will encourage our citizens to dig their own private gardens for food supply. This should relieve pressure on the national agricultural industry and thus mitigate the effects of rationing."
 ENG_womens_corps:0 "WLA & WTC"
 ENG_War_Homefront_Timber_Corps:0 "Women's Timber Corps"
 ENG_War_Homefront_Timber_Corps_desc:0 "Much like the Women's Land Army, we will establish the Women's Timber Corps to replace men who had left for the military. These women, known as Lumber Jills, will work in the forestry industry."
 ENG_mobilize_women:0 "Working Women"
 ENG_War_Homefront_Mobilize_Women:0 "Working Women"
 ENG_War_Homefront_Mobilize_Women_desc:0 "As the men go off to war, it shall be the women who take their place in the factories. Women in all walks of life must be mobilized for their patriotic duties!"
 ENG_War_Homefront_Continue_Electronics_Research:0 "Continue Electronics Research"
 ENG_War_Homefront_Continue_Electronics_Research_desc:0 "The United Kingdom must remain at the forefront of electronic technology. Thus, additional resources must be siphoned to the research labs."
 ENG_security_service:0 "Security Service"
 ENG_security_service_lar:0 "Security Service"
 ENG_War_Homefront_MI5:0 "Reform the Security Service"
 ENG_War_Homefront_MI5_desc:0 "If the Security Service is to be effective, we need to restructure it to be a modern organization."
 ENG_intelligence_service:0 "Security Intelligence Service"
 ENG_intelligence_service_lar:0 "Security Intelligence Service"
 ENG_War_Homefront_MI6:0 "Expand the Security Intelligence Service"
 ENG_War_Homefront_MI6_desc:0 "In order to better fight the war, we need intelligence. For the accurate procurement of intelligence, we must expand the Security Intelligence Service so it has the resources to do so."
 ENG_bletchley_park:0 "Bletchley Park"
 ENG_War_Homefront_Bletchley:0 "Give Them What They Want"
 ENG_War_Homefront_Bletchley_desc:0 "Bletchley Park's operations are of the utmost importance. They must be given high priority in intelligence resource allocation."
 ENG_War_Homefront_bombe:0 "The Bombe"
 ENG_War_Homefront_bombe_desc:0 "TODO"
 ###Foreign
 ENG_same_side:0 "Fighting on the Same Side"
 ENG_need_war_ger:0 "§YWe need to be at war with Germany to take this focus!§!"
 ENG_War_Foreign_Germany:0 "War with Germany"
 ENG_War_Foreign_Germany_desc:0 "Our war with Germany requires that we take diplomatic initiatives to stifle their legitimacy and resource acquisition."
 ENG_exiled_governments:0 "§GWe are hosting exiled governments.§!"
 ENG_exiled_governments_no:0 "§YWe are not hosting exiled governments.§!"
 ENG_exiled_manpower:0 "§GEvery Exiled Nation we are hosting will grant us 1000 soldiers and £air_experience 5."
 ENG_recognized:0 "Recognized our Government"
 ENG_need_war_sov:0 "§YWe need to be at war with the USSR to take this focus!§!"
 ENG_War_Foreign_USSR:0 "War with the Soviet Union"
 ENG_War_Foreign_USSR_desc:0 "It has finally come time to fight the Bolsheviks. In order to prevent their further expansion, we must take diplomatic initiatives to strengthen our position in the relevant regions."
 ENG_War_Foreign_Anti_Soviet:0 "Anti-Soviet Propaganda"
 ENG_War_Foreign_Anti_Soviet_desc:0 "Anti-Soviet Propaganda is necesssary to convince the population of the necessity of our war."
 ENG_War_Foreign_Relations_with_Turkey:0 "Relations with Turkey"
 ENG_War_Foreign_Relations_with_Turkey_desc:0 "We must approach the Turks to establish decent relations between our two nations. Turkey is historically friendly with the USSR, so we need to ensure that, at the very least, they do not fall too deep in the Soviet sphere of influence."
 ENG_War_Foreign_Invade_Afghanistan2:0 "Operation Everest"
 ENG_War_Foreign_Invade_Afghanistan2_desc:0 "In order to start another front in Soviet Central Asia, we must invade Afghanistan to establish a land border. Surely it cannot go wrong for a fourth time."
 ENG_War_Foreign_Invade_Iran2:0 "Operation Oak Leaf"
 ENG_War_Foreign_Invade_Iran2_desc:0 "In order to widen the front against the USSR, we should invade Iran. First, we would secure Iranian oil fields, but more importantly, we would open up routes to invade Turkmenistan, Armenia, and Azerbaijan.
 ENG_russian_militia:0 "§GA Division of Russian Infantrymen and Militiamen will appear in Portsmouth.§!"
 ENG_War_Foreign_Russian_Emigres:0 "Contact the Russian Diaspora"
 ENG_War_Foreign_Russian_Emigres_desc:0 "We should contact the millions of Russians and their children who live outside of the USSR, whether they were forced out by the Civil War or emigrated for other reasons. We should surely be able to find seven thousand men willing to fight on our side to free their motherland."
 ENG_War_Foreign_Access_in_Norway:0 "Ultimatum to Norway"
 ENG_War_Foreign_Access_in_Norway_desc:0 "We need to be able to open up another front against the Soviets in the North. Pressuring the Norwegians to allow us to ship our munitions and march our troops through their land would be a great boon for the war effort."
 ENG_War_Foreign_Summit_with_Sweden:0 "Summit with Sweden"
 ENG_War_Foreign_Summit_with_Sweden_desc:0 "Though Sweden is usually officially neutral, they generally have a strong anti-Bolshevik opinion. Therefore, we should meet with the Swedes to ensure that they are, even if unofficially, on our side."
 eng_foreign.25.t:0 "Demands from the United Kingdom"
 eng_foreign.25.d:0 "The United Kingdom has demanded that we allow them to move soldiers through their territory in order to help the Finns against the Soviet Union. Though some conservative and radical nationalist figures in our society would rather we allow the British to fight the Bolsheviks, much of the government wants to maintain neutrality in this conflict. How shall we respond?"
 eng_foreign.25.a:0 "We shall help the British in their campaigns!"
 eng_foreign.25.b:0 "[This.GetNorSweApproval]"
 eng_foreign.26.t:0 "The [From.GetAdjective]s Grant us Access"
 eng_foreign.26.d:0 "[From.GetNameDef] has allowed our military to transport soldiers and equipment through their lands. This should enable us to assist Finland and open another front against the USSR."
 eng_foreign.26.a:0 "Excellent."
 eng_foreign.27.t:0 "The [From.GetAdjective]s Refuse our Demands"
 eng_foreign.27.d:0 "[From.GetNameDef] has refused to allow our military to transport soldiers and equipment through their lands. Though some of our government wish to respect the [From.GetAdjective]s wishes, others wish to invade and install a friendlier government. What shall we chose?"
 eng_foreign.27.a:0 "We should not interfere with their affairs."
 eng_foreign.27.b:0 "If they do not stand with us, they stand against us!"
 ENG_imperialist_warmonger:0 "We will not bow to Imperialist Demands!"
 ENG_want_to_stay_neutral:0 "We would rather remain neutral."
 ENG_War_Foreign_Swedish_Intervention:0 "Ultimatum to Sweden"
 ENG_War_Foreign_Swedish_Intervention_desc:0 "To establish more efficient supply lines to the Karelian front, we must demand that Sweden grant us military access through their territory. If they refuse, we may come to blows with the Lions of the North..."
 ENG_War_Foreign_Invite_Finland:0 "Invite Finland to the Allies"
 ENG_War_Foreign_Invite_Finland_desc:0 "Finland's war with the USSR requires that we formally invite them to the allies to better facilitate their survival against the Red Menace."
 ENG_allied_forces_idea:0 "Allies Forces Act"
 ENG_War_Foreign_Allied_Forces:0 "The Allied Forces Act"
 ENG_War_Foreign_Allied_Forces_desc:0 "We should make provisions permitting governments-in-exile in our territory to train divisions in our territory. This should help with morale, resistance, and manpower."
 ENG_allied_forces_act:0 "§GEach Government-in-Exile we host will gain increased manpower and army experience gain.§!"
 ENG_War_Foreign_US_Lend_Lease:0 "Befriend the US"
 ENG_War_Foreign_US_Lend_Lease_desc:0 "We should improve relations with the US in order to get their diplomatic and material support."
 ENG_War_Foreign_US_Destroyers_for_Bases:0 "Destroyers for Bases"
 ENG_War_Foreign_US_Destroyers_for_Bases_desc:0 "We should negotiate a trade with the United States: They would send us 50 destroyers, while we would turn over bases in North America and the Caribbean."
 eng_foreign.36.t: "US Rejects our counteroffer"
 eng_foreign.36.desc: "PLACEHOLDER text. The USA has rejected our counteroffer of recieving ships in exchange of military bases on the western indies."
 eng_foreign.36.a: "We'll try another day"
 eng_foreign.28.t:0 "Destroyers for Bases"
 eng_foreign.28.d:0 "The British have been pleading to us for a delivery of destroyers. In exchange for fifty destroyers, we would be able to open bases in Newfoundland, the Bahamas, Jamaica, Saint Lucia, Trinidad, Antigua, and British Guiana. These bases would have 99-year leases and be entirely rent-free. Should we accept this offer?"
 eng_foreign.28.a:0 "Aprove the Deal."
 eng_foreign.28.b:0 "Reject once again."
 eng_foreign.29.t:0 "America Accepts our Proposal!"
 eng_foreign.29.d:0 "The Americans have accepted our proposal to exchange bases in Newfoundland and the British West Indies for fifty new destroyers. We will now be able to use these destroyers in our war effort."
 eng_foreign.29.a:0 "Excellent!"
 eng_foreign.30.t:0 "America Rejects our Proposal"
 eng_foreign.30.d:0 "The United States has rejected our proposal to exchange bases in Newfoundland and the British West Indies for fifty new destroyers. We will have to make do with our own equipment."
 eng_foreign.30.a:0 "Shame."
 ENG_War_Foreign_Tizard_Mission:0 "The Tizard Mission"
 ENG_War_Foreign_Tizard_Mission_desc:0 "Our researchers have made several strides in scientific progress, but we do not have the material resources capable of producing newer models. We should send delegations, led by Henry Tizard, to the United States to get the resources needed."
 ENG_tizard_mission:0 "Tizard Mission"
 eng_foreign.31.t:0 "The Tizard Mission"
 eng_foreign.31.d:0 "A British Delegation led by Henry Tizard has been petitioning us to provide the United Kingdom with resources necessary to build their advanced technology, which they are running out of resources for. In exchange, they offer the secrets to these new technologies, which if produced in mass quantities, will give them a definite edge against their enemies. The question is, shall we accept the proposal?"
 eng_foreign.31.a:0 "Of course!"
 eng_foreign.31.b:0 "We should not get involved."
 eng_foreign.32.t:0 "The Tizard Mission is Successful!"
 eng_foreign.32.d:0 "The Americans have agreed to supply us with necessary resources to construct advanced tools and stations needed in the war effort. Henry Tizard, the mission's leader, shall be hailed as a national hero!"
 eng_foreign.32.a:0 "Salvation!"
 eng_foreign.33.t:0 "The Tizard Mission Fails"
 eng_foreign.33.d:0 "Henry Tizard and his team have failed to procure the necessary resources needed to build our advanced stations and tools. Despite our advanced technological inventions, we will have to make do without them."
 eng_foreign.33.a:0 "Without the Americans, we are doomed!"
 ENG_us_forces_act:0 "The United States of America (Visiting Forces) Act"
 ENG_War_Foreign_US_Forces_Act:0 "Immunity for American Forces"
 ENG_War_Foreign_US_Forces_Act_desc:0 "As our most important ally, we should grant US soldiers immunity from British court-martials. If they are to break laws, they will be tried in their own courts."
 eng_foreign.34.t:0 "The London Economic Conference"
 eng_foreign.34.d:0 "The conference ended today with sour looks as representatives of 65 different countries return home dissatisfied with the results. Preparations for the meeting began in October 1932. Britain's departure from the gold standard in the summer of 1931 ensured that much of the preparatory discussions for the monetary portion of the agenda focused on the question of how to persuade Britain back onto gold. But the monetary landscape changed significantly after the U.S. dollar left gold in April 1933. As a consequence, European countries still committed to gold found their currencies under renewed pressure and begged Britain and the United States to do something about it. In May 1933, the United States offered to negotiate a temporary stabilization agreement between the world's leading currencies, however, France rejected the U.S. offer, demanding instead a permanent stabilization agreement. The bankers thought a deal was within their grasp when Franklin Roosevelt's infamous \"bombshell message\". In it the president condemned the \"old fetishes of so-called international bankers\" for the gold standard and underlined his commitment to currency depreciation as a means of invigorating the international economy."
 eng_foreign.34.a:0 "Oh Blimey!"
 eng_foreign.35.t:0 "King Faisal I of Iraq raises the issue of Alexandratta"
 eng_foreign.35.d:0 "In a meeting at the Hyde Park Hotel held between King Faisal I and our government's ambassador to Iraq, Francis Humphyrs, the former stated that he harbors concerns about the possiblity of Turkish encroachment on the Sanjak of Alexandratta, a territory under French mandate rule that is claimed by the Turkish government. Faisal I elaborated on his concerns by claiming that the French had already struck a deal with the Turks to transfer this territory to them and that if such a deal goes through, Turkey might be emboldened to seek out Mosul. \nThere does not seem to be much merit in what Faisal I purports, as there is neither much evidence to suggest that France cut a deal with Turkey nor does there seem to be any real Turkish effort to break the stipulations of 1926 regarding Mosul. Nevertheless, we might have to bear in mind what was said in this meeting."
 eng_foreign.35.a:0 "Worrying?"
 ##Labour events
 eng_internal.2.t:0 "The London City Council Election"
 eng_internal.2.d:0 "In a major upset, the Labour Party has taken control of the London City Council. The local branch of the Conservative Party, the Municipal Reform Party had controlled the council for nearly 30 years. However, in this year's election, the Labour party had gained 34 seats to win 69 our of the 124 seats, achieving a bare majority. The Municipal Reform Party lost 28 seats, and now only have 55 seats. The Liberal Party, known to have had no chance, lost all its seats to Labour."
 eng_internal.2.a:0 "But there was low turnout!"
 eng_internal.3.t:0 "LCC Raises Property Taxes"
 eng_internal.3.d:0 "London City Council, under the leadership of Labour Politician Herbert Morrison has run through the 2,000,000 Pounds Sterling that the Conservative party had managed to save. These funds had been spent on social programs, but to continue them, Morrison has raised taxes on London properties. The new rates are 31%, meaning Londoners pay seven shillings for every pound their property is worth."
 eng_internal.3.a:0 "It is necessary for Labour's commendable initiatives."
 eng_internal.3.b:0 "Abominable! We can use this to help sway voters!"
 eng_internal.4.t:0 "LCC Welfare Services"
 eng_internal.4.d:0 "The Labour-Controlled London City Council has constantly been been enacting reforms to help the City's poor. They have formed a local health service to provide medicine to those who need it, modernized hospitals to approach the cutting edge of medical science, created new housing initiatives to provide shelter to the homeless, and opened up more spots for secondary education. London has also begun improving parks and infrastructure, such as highways and improved bridges. More amenities are being built, and the city is becoming cleaner."
 eng_internal.4.a:0 "Very popular initiatives, indeed."
 eng_internal.5.t:0 "Labour Adopts a new Platform"
 eng_internal.5.d:0 "Over the last few days, the Labour Party has held its annual conference. This year, they held it in Southport under the supervision of Chairman W. Smith. During the conference, the party approved Labour's new program, titled \"For Socialism and Peace\". The party has decided to formally commit itself to the nationalization of land, banking, transport, resource extraction and refinement, utilities, and the establishment of a National Investment Board (it seems that Labour wishes to experiment with central planning). In addition, on the advice of the Socialist Medical Association, Labour has decided to establish a National Health Service to provide medical assistance to all Britons."
 eng_internal.5.a:0 "We'll see where this takes them..."
 eng_internal.6.t:0 "George Lansbury Resigns"
 eng_internal.6.d:0 "Though Labour might be an antiwar party, no-one hates war more than its leader, George Lansbury. Since becoming the party leader, he has pushed Christian Pacifist programs into Labour's program, calling for the United Kingdom to totally disarm as an example to the rest of the world. However, his attitude, compared with the rising militarist mood in continental Europe, has alienated many in the party and the trade unions. Despite their opposition to aggressive wars, other Labourites believe that Britian should still be able to defend itself. During the 1935 annual conference, Lansbury's positions were attacked, which he defended passionately. However, Ernst Bevin (the Leader of the Transport and General Workers' Union) declared Lansbury's actions to be putting personal beliefs before party policy. Lansbury has seen the way this was going, and has thus resigned as party leader."
 eng_internal.6.a:0 "Clement Attlee will lead the party until the leadership election."
 eng_internal.7.t:0 "[This.GetLabourLeader] Wins the Labour Party Leadership Election"
 ENG_attlee_loc:0 "Clement Attlee"
 ENG_morrison_loc:0 "Herbert Morrison"
 ENG_greenwood_loc:0 "Arthur Greenwood"
 eng_internal.7.d:0 "After the resignation of Labour Party Leader George Lansbury, a leadership election became necessary to choose his successor. In this contest, there were three candidates. The first, Deputy Leader Clement Attlee, had been the interim leader since Lansbury resigned two weeks ago. However, in reality, Attlee had been doing much of the work of the Leader of Opposition rather than the elderly Lansbury and the inexperienced Stafford Cripps. The second candidate was London City Council leader Herbert Morrison. Morrison had spend the last year-and-a-half enacting popular social reforms in London, making him an important in the Labour Party. He is an advocate of state nationalization and management of utilities. In addition, he was Ramsey MacDonald's Minister of Transport in 1929, but lost the position when MacDonald split from the Labour party. The final candidate was Arthur Greenwood, the Minister of Health in the aforementioned MacDonald ministry. He is also an active freemason with the New Welcome Lodge, which is historically associated with Labour.\n\nAfter two rounds of voting, it was found that [This.GetLabourLeader] will take up the mantle of Leader of the Labour Party. They are expected to carry the party into the next election."
 eng_internal.7.a:0 "Congratulations!"
 eng_internal.8.t:0 "The King and Country Debate"
 eng_internal.8.d:0 "Today, Kenelm Hubert Digby of St. Johns College proposed a motion to The Oxford Union Society (the pre-eminent debating society in the Empire) entitled \"This House will under no circumstances fight for its King and country.\" The ensuing debate featured Digby defending the proposal (supported by philosopher Cyril Joad) and K. R. F. Steel-Maitland (of Balliol College) attacking it (supported by barrister Quintin Hogg).\n\nDigby, said to have a rough style unsuitable for the Union, began by declaring \"It is no mere coincidence that the only country fighting for the cause of peace, Soviet Russia, is the country that has rid itself of the war-mongering clique. The justification urged for the last war was that it was a war to end war. If that were untrue it was a dastardly lie; if it were true, what justification is there for opposition to this motion tonight?\" Hogg responded by arguing that a weak Britain would only invite war on the Continent, and that a strong Britain is necessary as a deterrent, positioning the Japanese Invasion of Manchuria as an example. Joad then declared that modern weaponry had made war too horrible to consider as an offensive option, and advocated a Gandhian response to invasion rather than a military response.\n\nAt the end of the debate, the final vote had carried the motion 275 to 153, according to President Frank Hardie. Being such a prestigious organization, this is sure to have reprocussions on the United Kingdom..."
 eng_internal.8.a:0 "What is wrong with the younger generation?"
 eng_internal.9.t:0 "The Peace Ballot"
 eng_internal.9.d:0 "Over the last several months, volunteers have been canvassing the nation on behalf of the League of Nations Union's \"National Declaration committee\" presenting a five-question survey to the people. It asked if Britain should remain a Member of the League of Nations, and whether the Nations of the world should willingly disarm. as well as defend other nations by force. This initiative was sponsored by the Labour Party, the Liberal Party, many clerics, and even some local Conservatives. Today in Royal Albert Hall, Lord Robert Cecil presented the results. According to the Union, the results show that the United Kingdom, and indeed all nations, should aspire to collective disarmament and security. A total of 11.6 million people participated in the survey. It seems that Pacifism is in the United Kingdom's future."
 eng_internal.9.a:0 "But what if other nations decide to re-arm?"
 eng_internal.10.t:0 "The Unity Campaign"
 eng_internal.10.d:0 "Formed in 1932, the Socialist League is a lobbying group inside the Labour Party that aims to bring Labour to the left. Created from the Guild Socialist Society for Socialist Inquiry and Propaganda, the League consists of about 3000 intellectuals with their own platform. They feel that a socialist government, once in power, should grant itself emergency powers and violently put down any Capitalist reaction. This has alienated several labourites who are committed to strict parliamentarism.\n\nRecently, the Socialist League has launched a joint Unity Campaign to try and bring together all leftist forces in the country, including the Independent Labour Party and the Communist Party. Though a few prominent labourites agree with the campaign, such as Michael Foot, the rest of the party feel alienated.[This.GetUnityReaction]"
 ENG_socialist_league_choice:0 " We should now choose what to do with the League, as they have grown too radical for their own good..."
 ENG_labour_disafilliated_sl:0 " Labour has thus chosen to disaffiliate themselves from the Socialist League, leaving the Unity Campaign on its own."
 eng_internal.10.a:0 "[This.GetLeagueChoice]"
 ENG_disaffiliate_league:0 "We must dissociate ourselves from the League."
 ENG_league_already_disaf:0 "Their gamble failed."
 eng_internal.10.b:0 "A curious idea."
 eng_internal.11.t:0 "The Socialist League Dissolves"
 eng_internal.11.d:0 "After its separation from the Labour Party (or rather, Labour Party's separation from it), the Socialist League has been forced to dissolve due to lack of support. Though a \"Labour Unity Committee\" has been formed within Labour, international events suggest that it likely will go nowhere."
 eng_internal.11.a:0 "A lost battle."
 ##BUF events
 eng_internal.12.t:0 "Mosley Announces a March in the East End"
 eng_internal.12.d:0 "Ever since the Olympia riot, the British Union of Fascists has become increasingly antisemitic. Anti-Jewish propaganda is now a central piece of BUF rhetoric. The movement has spent much of its resources into recruitment in London's East End, a historically Jewish neighborhood. However, recently, Oswald Mosley has announced that to celebrate the fourth anniversary of the BUF's founding, the BUF will organize a march through Stepney, a district of the East End with a large Jewish population."
 eng_internal.12.a:0 "We must watch this very carefully."
 eng_internal.13.t:0 "Stepney Organizes against the BUF March"
 eng_internal.13.d:0 "Mosley's announcement of the BUF's October march through the East End has worried the residents of Stepney. The Eastenders have started to become disillusioned with already established Jewish groups, whom they precieve as uninterested and inactive. As such, they have begun to organize an opposition themselves. Many of the residents are already affiliated with trade unions, so in conjunction with their unions and groups such as the Communist Party, they have begun to establish their own network.\n\nToday, 86 organizations met in the East End to establish the Jewish People's Council against Fascism and Antisemitism to organize and lead the counter-protesters."
 eng_internal.13.a:0 "The tension is mounting..."
 eng_internal.14.t:0 "Petition to ban the Fascists' March"
 eng_internal.14.d:0 "As it gets closer to the Fourth of October, the residents of the East End are getting increasingly anxious. In just a couple of days, Mosley's Blackshirts will be marching through the heart of a Jewish neighborhood. But even in the last few months, several Blackshirt and otherwise Fascist organizers have attempted to canvas the area, making locals worried. The tension is palpable enough that yesterday, five mayors from East London met with the Home Office and urged the government to prohibit the march. Today, the Jewish People's Council delivered a petition of about 100,000 signatures asking for the Home Office to prevent the Fascists from marching. It is now up to the Home Secratary to decide on a course of action."
 eng_internal.14.a:0 "We should not obstruct political campaigns."
 eng_internal.14.b:0 "We must not let the forces of instability seize London!"
 ENG_cable_street_blocked:0 "§YThe BUF has been blocked from marching in the East End.§!"
 ENG_cable_street:0 "§YThe Battle of Cable Street has occured.§!"
 eng_internal.15.t:0 "The Battle of Gardiner's Corner"
 eng_internal.15.d:0 "Today was the day the Eastenders had been dreading. Oswald Mosley and about 3000 Blackshirts attempted a march through the Jewish neighborhood. They were met by about 20,000 Anti-fascists, nominally led by the Jewish People's Council and Communist Party of Great Britain MP Phil Piratin. The anti-fascist grouping consisted of a loose coalition of Anarchists, Communists, Labourites, Irish workers, and Jewish Organizations. They had built roadblocks and barricades in order to prevent the Blackshirts from marching through. 6000 policemen, led by Sir Philip Game, were deployed in order to keep order and prevent violence. However, it was to no avail.\n\nThe first conflict of the day began when members of the Jewish Ex-Serviceman's Association, marching down Whitechapel Road, were blocked and then beaten by police. The anti-fascists had constructed barricades using trams at Gardiner's Corner in order to prevent the Blackshirts from entering the East End. Unclear of how to proceed, the police decided to clear the barricade, which they did with limited success. However, as the marchers cautiously attempted to pass through, a brawl somehow broke out (the fascists blame the anti-fascists, the anti-fascists blame the fascists, and the police can't find a definate party at fault). Though the police attempted to clear the way and prevent violence - though sometimes resorting to violence themselves - the anti-fascists managed to beat back the Blackshirts, as they greatly outnumbered the fascists.\n\nAt the end of the day, over two thousand people have been injured, and many have been arrested, though few Blackshirts have been taken into custody. While the JPC is arranging legal support, it is expected to be of little use. Though the Leftist, Jewish, and mainstream press (including some Tory papers) have declared victory against the Blackshirts, the BUF have used this opportunity to victimize themselves, and are expected to see a surge in membership."
 eng_internal.15.a:0 "What happens now?"
 eng_internal.16.t:0 "The Battle of Cable Street"
 eng_internal.16.d:0 "Today was the day the Eastenders had been dreading. Oswald Mosley and about 3000 Blackshirts attempted a march through the Jewish neighborhood. They were met by about 20,000 Anti-fascists, nominally led by the Jewish People's Council and Communist Party of Great Britain MP Phil Piratin. The anti-fascist grouping consisted of a loose coalition of Anarchists, Communists, Labourites, Irish workers, and Jewish Organizations. They had built roadblocks and barricades in order to prevent the Blackshirts from marching through. 6000 policemen, led by Sir Philip Game, were deployed in order to keep order and prevent violence. However, it was to no avail.\n\nThe first conflict of the day began when members of the Jewish Ex-Serviceman's Association, marching down Whitechapel Road, were blocked and then beaten by police. Unable to pass through tram barricades at Gardiner's Corner, the police decided to allow the Blackshirts to march through Cable Street, in the south. However, the anti-fascists were prepared, as they had already set up barricades consisting of an overturned lorry, broken glass, and marbles. People threw items from the windows including fruits, vegetables, and human waste. The Police were unable to clear the barricades, leaving no available path for the march. As such, Sir Philip Game demanded that Mosley turn his marchers back and leave. Left with no other option, Mosley called off the march.\n\nAt the end of the day, about 175 people have been injured, and about 80 anti-fascists were arrested, compared to only five fascists. While the JPC is arranging legal support, they are expected to be given heavy penalties. Communist, Jewish, and other Anti-Fascist press units are declaring victory against the fascists, but the BUF has begun to victimize themselves, claiming to have suffered against \"Communist-Jewish Violence\"."
 eng_internal.16.a:0 "Mosley did not pass!"
 eng_internal.17.t:0 "The Standoff at Gardiner's Corner"
 eng_internal.17.d:0 "Today was the day the Eastenders had been dreading. Oswald Mosley and about 3000 Blackshirts attempted a march through the Jewish neighborhood. They were met by about 12,000 Anti-fascists, nominally led by the Jewish People's Council and Communist Party of Great Britain MP Phil Piratin. The anti-fascist grouping consisted of a loose coalition of Anarchists, Communists, Labourites, Irish workers, and Jewish Organizations. They had built roadblocks and barricades in order to prevent the Blackshirts from marching through. 6000 policemen, led by Sir Philip Game, were deployed in order to keep order and prevent violence. However, it was to no avail.\n\nThe first conflict of the day began when members of the Jewish Ex-Serviceman's Association, marching down Whitechapel Road, were blocked and then beaten by police. Despite the anti-fascist barricades, the anti-fascists seemed shaken and nervous. They had not expected such a large police presence, and many Communist Party members had not turned up, as the CPGB had decided, despite the pressure from East End activists (including Piratin), to hold an Anti-Fascist Rally in Hyde Park instead. After police had cleared out the barricade at Aldgate, they tentatively attempted to form a wall between the fascists and the anti-fascists. Though the anti-fascists attempted to break through the police lines and threw items (including vegetables, fruit, and human waste) from the windows, the Blackshirts were able to pass through.\n\nAt the end of the day, about 115 people had been injured, and many anti-fascists were arrested. While the JPC is arranging legal support, this effort is expected to be fruitless. Though Piratin and other grassroots CPGB activists have been praised in the Leftist, Jewish, and even some mainstream press media, the Communist Party leadership has come under heavy fire for their inaction, with many members leaving for the ILP or other groups. The BUF, on the other hand, has declared \"Complete Victory\" in the march, and is expected to see a growth in support."
 eng_internal.17.a:0 "What happens now?"
 eng_internal.18.t:0 "The Mile End Pogrom"
 eng_internal.18.d:0 "Today marks one week since the Blackshirt March in the East End. In retaliation for the anti-fascist victory, about two hundred young men - members of the BUF - ran through Stepney, breaking shop windows and attacking those who they thought were of Jewish ethnicity. They used iron bars and hatchets, and ended up burning a car. To make matters worse, they threw a woman and a child through a shop window. This has ended up being one of the most shocking pogroms in British history."
 eng_internal.18.a:0 "The Government sends its condolences to the victims."
 eng_internal.19.t:0 "Mosley gains Momentum"
 eng_internal.19.d:0 "Sir Oswald Mosley is a political curiousity, to say the least. The womanizing nobleman married high; even royalty attended the ceremony. He began his political career as a Conservative MP for Harrow after the Great War, but later crossed the floor to join the Labour Party and the Independent Labour Party over a disagreement in Irish policy. By this time, he had won a reputation as a great orator, though some saw him as no better than a sophist. However, by 1930, he became disillusioned with Labour after they refused to adopt his \"Mosley Memorandum\" to correct for the Great Depression, that advocated for the creation of a protectionist and corporatist economy, with strong public works and nationalization programs. He left Labour and formed the New Party, though it met with little success. In 1932, he visited Benito Mussolini in Italy during a study of Italian Fascism, and subsequently adopted Fascism himself.\n\nMosley formed the British Union of Fascists in October 1932, and quickly gained a following. Though this following has never been large, it is still devoted. The BUF has its own paramilitary mirroring Mussolini's Blackshirts, and its own newspapers. Today marks a significant step in the development of the BUF. The Daily Mail, a tabloid paper owned by Lord Rothermere, has published an article by Lord Rothermere himself declaring \"Hurrah for the Blackshirts!\", in defense of Mosley and Lord Rothermere's personal friend, Benito Mussolini."
 eng_internal.19.a:0 "We must wait and see what effect this has."
 eng_internal.20.t:0 "The Olympia Rally"
 eng_internal.20.d:0 "Over the last few months, violent altercations between BUF Blackshirts and anti-fascist protesters have caused the BUF's middle-class support to decline. However, today's rally at the Olympia Exhibition Centre was far different. The Facist demonstrators were met by counter demonstrators, including communists, socialists, trade unionists, liberals, and even a few conservatives. As they continued to chant and heckle, the Blackshirts began attacking them to drive them out. Most of the press has already condemned this sort of thuggery, and the BUF is expected to see further decline."
 eng_internal.20.a:0 "What brutishness!"
 ##FarAut Party stuff
 eng_internal.21.t:0 "The End of the British Fascists"
 eng_internal.21.d:0 "Founded as the \"British Fascisti\" in 1923, Rotha Lintorn-Orman's group aimed to emulate what they saw as Mussolini's success. However, the organization only adopted a Fascistic platform relatively recently in competition with Oswald Mosley's New Party and the BUF. For seven years, the BF was more of a Conservative Ultra-Royalist group focused more on anti-communism than fascism. Though the BF claimed to have 200,000 members in 1926, their actual membership was actually closer to only a few thousand.\n\nAfter the BF's propaganda failure during the General Strike of 1926 (in which the BF predicted an attempt at a \"Bolshevik takeover\" when the strike was mostly peaceful), the party began a sharp decline. Though they attempted to correct for this by adopting more concrete fascist ideology and stylings, many of its members left, either for more moderate groups or more radical groups.\n\nFor the last couple of years, the BF had remained a fringe group around Lintorn-Orman, as her mother had funded the whole thing. However, her mother, Branch Lintorn-Orman, had got wind that her money was being spent on drugs, alcohol, and sex, and subsequently pulled out her funding. Another patron then demanded the repayment of a 500 pound loan, thus causing the BF to go bankrupt. The BF is all but formally dissolved."
 eng_internal.21.a:0 "The BF went out without a fight."
 eng_internal.22.t:0 "Rotha Lintorn-Orman Dies"
 eng_internal.22.d:0 "Rotha Lintorn-Orman, the leader of the late British Fascists, has died today in the Canary Islands at the age of 40. For many years, her lifestyle has involved the considerable use of drugs and alcohol, causing rumors to appear about her engaging in lewd debauchary. This caused her mother, Branch Lintorn-Orman to pull her funding from the BF, causing it to effectively dissolve. However, though Lintorn-Orman has been taken ill, she had still continued her lifestyle until her death. It seems her body could not take it any longer."
 eng_internal.22.a:0 "What a waste."
 eng_internal.23.t:0 "The British People's Party"
 eng_internal.23.d:0 "Ever since the events at Olympia and in the East End, the British Union of Fascists has been in steady decline. Recently, ex-BUF member John Beckett and other splitters have set up a rival organization, the British People's Party. Though the party espouses British Fascism, it has adopted elements of the Social Credit theory of C.H. Douglas, which the BUF did not. As the British people are thoroughly anti-fascist, it seems as though the BPP's sole marketable issue is its anti-war policy. However, their policy is specifically opposition to war with fascist powers instead of a general pacifist platform. For now, the BPP has failed to attract any significant following, meaning the BPP will likely remain on the fringe."
 eng_internal.23.a:0 "Another bother to deal with."
 ##Abdication Crisis
 eng_internal.24.t:0 "King George V has Died"
 eng_internal.24.d:0 "King George V died yesterday after 11:00 PM. For the last several years, his health had been in steady decline (exacerbated by his heavy smoking habits), but the popular King remaind steadfast. On 15 January 1936, he became bedridden with a cold. His strength depleted as he continously fell unconsious, but was kind to his visitors every time he woke up. His physicians report that he died painlessly, and a funeral will be arranged immediately.\n\nKing George will be succeeded by his eldest son Edward, the Prince of Wales. To the people, he is known to be handsome and fashionable, though in private, Edward is known to be heavily racist, unsympathetic to others, and more concerned with womanizing than ruling. The latter has given the government enough worry to send the Metropolitan Police Special Branch to spy on him with his latest lover, American divorcée Wallis Simpson. The late King George had little good to say on Edward, predicting that he will \"ruin himself within twelve months.\""
 eng_internal.24.a:0 "The King is dead! Long Live the King!"
 eng_internal.25.t:0 "Wallis Simpson Divorces her Husband"
 eng_internal.25.d:0 "King Edward VIII is known to the establishment as a womanizer. However, he seems to have found love in Wallis Simpson, a woman who today filed for divorce from her second husband. Their affair had been an open secret for a while now. Though the British press has been silent, the world has been kept informed by efforts of the dominions' press agencies, most notably the Canadians. Now that Mrs. Simpson is filing for divorce, the American press have announced that her marriage to King Edward VIII is imminent. Though our press remains silent, they will not for long...\n\nIn the upper echelons of British society, opposition to the potential marriage is high. Politicians and the Royal Family feel that Simpson's background is unbefiting for a queen, and some oppose it on the grounds that she is American. Others oppose the marriage on religious grounds, and the Church of England doesn't approve of remarriage before the death of the former spouse, and as the King is the Head of the Church, this would cause a conflict. There is also major political opposition to the King. Many in the establishment feel that Edward wants to interfere with politics, which is absolutely outside his role as figurehead. In addition, there is evidence that Mrs. Simpson may a Fascist agent.\n\nRumors surround the King's relationship, and Mrs. Simpson has a very poor reputation among the establishment. Evidence that she was cheating on the King has earned her a reputation as a \"tart\". Some think that she is a golddigger, while others assume that she cured him of sexual deviancy."
 eng_internal.25.a:0 "This scandal cannot be looked over!"
 eng_internal.26.t:0 "The Three Choices"
 eng_internal.26.d:0 "It is clear that the British people would never accept Wallis Simpson as Queen Consort. As the King is meant to act with the consent of the cabinet, the Prime Minister has threatened to resign should the marriage go through. Upon recieving this news, the King responded that he was prepared to abdicate to marry Mrs. Simpson. In response, the PM offered the three options: A standard royal marriage, a morganatic marriage that would deny Simpson the title of Queen Consort, and abdication.\n\nIn meetings with the PMs of the dominions, it became clear that the dominions - whose press had already known of the affair since the summer - would not accept the marriage, making option three more likely. The political establishment - both the government and the opposition - is resoundly against the marriage, meaning that support for King Edward is mostly from the fringes and renegades of British politics."
 eng_internal.26.a:0 "What do we have for Royalty?"
 eng_internal.27.t:0 "The King's Speech?"
 eng_internal.27.d:0 "Today, King Edward VIII met with the Prime Minister. With the support of Winston Churchill and Lord Beaverbrook, Edward proposed a radio broadcast in which he would say that he intended to marry Mrs. Simpson morganatically. The Prime Minister saw this as unacceptably unconstitutional and showed the crown to be interfering with political matters. In short, Edward cannot have Mrs. Simpson and the throne."
 eng_internal.27.a:0 "What now?"
 eng_internal.28.t:0 "King Edward VIII Abdicates"
 eng_internal.28.d:0 "Six days ago, after being told that he cannot appeal to the people as it would break his constitutional neutrality, King Edward VIII has decided to abdicate. Yesterday, he signed the written abdication notices at Ft. Belvedere in Surrey. With his three brothers as witnesses, it will be put into law by Parliament today. Though the dominions are following suit, Ireland has used the opportunity to amend their constitution to remove the King and Governor-General from its text at all.\n\nToday, Edward, now Duke of Windsor, made a speech on BBC radio apologizing for being unable to reconcile his feelings with his duty, and ultimately he chose his feelings. He will leave for Austria tomorrow. Prince Albert, Duke of York will become the King of the United Kingdom, under the name of George VI!"
 eng_internal.28.a:0 "Finally, the crisis is over."
 ###Related
 eng_internal.29.t:0 "Stanley Baldwin Resigns"
 eng_internal.29.d:0 "Stanley Baldwin has led the Conservative Party for just over 15 years. His push for the expansion of democracy and his handling of the Abdication Crisis has earned him much popularity. However, citing poor health, he has decided to retire. Yesterday, his last act was to raise the salaries of the ministers of parliament, which included a salary for the leader of the opposition. Today, he will be become a knight of the Garter and Earl Baldwin of Bewdley. Taking his place will be Neville Chamberlain, a former government minister and Conservative Party veteran."
 eng_internal.29.a:0 "Farewell, Earl Baldwin!"
 eng_internal.30.t:0 "Duke Edward toures [This.GetEdwardTour]"
 ENG_duke_nazi_germany:0 "Germany"
 ENG_duke_fascist_italy:0 "Italy"
 eng_internal.30.d:0 "Despite having abdicated, Edward, Duke of Windsor was very keen to give his wife, Wallis Simpson, the experience of a state visit. Thus, he had been arranging a tour of [This.GetEdwardTour]. [This.DescribeEdwardTour]"
 ENG_duke_nazi_germany_desc:0 "On the eleventh of October, the Duke and Duchess arrived in Germany via train, stopping at Friedrichstraße station in Berlin. However, few actually saw them as they were rushed away by the SS to the Kaiserhof Hotel. At first, Joachim von Ribbentrop hosted them at Horcher's, the most prestigious restaurant in the city, and met with Albert Speer and the Goebbels'. They also met Reichsminister of Labour Robert Ley, who was to be their chaperone.\n\nFor the next week-and-a-half, the Duke and Duchess were driven around for a massive propaganda effort, and shown full Royal honors. They went to a Wagnerian concert, inspected SS troops, and visited Hermann Göring at Carinhall. They also visited a Hitler Youth centre and a Krupp Panzer factory, where the workers greeted them with Hitler salutes, which the Duke gladly returned. On the 22nd of October, the main event was held. The Duke was able to meet with Adolf Hitler himself at the Berghof (while the Duchess was having tea with Rudolf Hess), which has caused our government great concern.\n\nAfter the meeting, they stayed at the Vier Jareszeiten Hotel in Munich, where the couple hosted an NSDAP Kreisleiter (county leader), and then visited Rudolf and Ilse Hess. They left Germany the following day."
 ENG_duke_fascist_italy_desc:0 "On the eleventh of October, the Duke and Duchess arrived in Italy via train, stopping at Roma Termini station in Rome. However, few actually saw the couple arrive as they were rushed away by the OVRA to the Hotel d'Inghilterra. At first, Galeazzo Ciano hosted them at his estate, where the couple met with many high-ranking Fascist politicians, where they met the Minister of Public Works, Giuseppe Cobolli Gigli, who was to be their chaperone.\n\nFor the next week-and-a-half, the Duke and Duchess were driven around and shown a massive propaganda operation, while they were given full Royal honors. They went to a concert featuring the music of Ottorino Respighi, inspected Blackshirt troops, and visited Giuseppe Bottai (Minister of National Education) at his home, where the Duke and the Minister exchanged Anti-Semtic sentiments.\n\nOn the 22nd of October, the main event was held. The Duke and Duchess were able to meet with Benito Mussolini himself in Rome, though not with the King as the Duke had hoped, which has caused our government great concern.\n\nAfter the meeting, which apparently proved fruitless, they went back to their hotel, where they recieved several important guests from the Italian Military and the National Fascist Party, including the Cianos. They left Italy the following day."
 eng_internal.30.a:0 "Worrying indeed."
 eng_news.1.t:0 "The Death of George V"
 eng_news.1.d:0 "King George V of Great Britain and Northern Ireland died in London yesterday after 11:00 PM. He had become bedridden five days earlier due to a cold, though his health had been in decline for several years. The King was extremely popular among the people, as he helped to change the image of the royalty from an upper-class institution to a cross-class symbol of stability.\n\nThe King will be succeeded by his eldest son, Edward. Now known as Edward VIII, the new King is popular for his good looks and fashion sense. However, the King is younger and inexperienced, and it remains to be seen what he makes of his new role."
 eng_news.1.a:0 "Now it is Edward who serves."
 eng_news.2.t:0 "Edward VIII Abdicates"
 eng_news.2.d:0 "King Edward VIII of Great Britain and Norther Ireland has abdicated his throne to marry his lover, American divorcée Wallis Simpson. After Mrs. Simpson ended her second marriage, Edward VIII intended to marry her as soon as possible, but the political establishment and many sectors of the population disapproved of the proposed marriage. Thus, the King chose to abdicate.\n\nEdward, now the Duke of Windsor, has been succeeded by his brother, Albert, now King George VI. It is expected that unlike his brother, George VI will continue in his father's tradition of political neutrality and projection of stability."
 eng_news.2.a:0 "The world welcomes the new King!"
 ##Ireland goes free
 eng_internal.31.t:0 "The End of the Irish Free State"
 eng_internal.31.d:0 "On July 1st, 1937, the Irish Free State voted to repeal and replace its constitution with 56.5% of the vote. The new constitution comes into effect today, effectively ending Irish participation in the Commonwealth. Though Ireland is technically not a republic yet, all references to the King have been removed, and the King has no representative in Ireland, with these responsibilities passing to the office of the President. Though some in our country see these events as a blow for the Empire, the Government is content to protest against claims to Northern Ireland."
 eng_internal.31.a:0 "Farewell Ireland, and may you prosper!"
 ##Labour Industrial Democracy
 eng_internal.32.t:0 "The Industrial Democracy Plan"
 eng_internal.32.d:0 "A group of Labour-affiliated intellectuals have today submitted a proposal to the party arguing for their \"Industrial Democracy Plan.\" The proposal argues that along with our nationalization programmes, we must introduce elements of democratic management and union control in state-owned workplaces. Essentially, though major decisions would still be made by the state bureaucracy or local councils (depending on who owns the workplace), minor decisions, such as those relating to working conditions, maintainance, and perhaps even local management would be done democratically by the workers, on a one-worker-one-vote basis.\n\nThough the proposal does admit that this will hamper efficiency in the short term, the situation would soon stabilize as a workflow is found. They argue that this will then lead to greater efficiency than before as the workers - who are obviously on-site and thus know the conditions firethand - will be able to more accurately allocate resources than some far-off bureaucrat. The proposal then goes on to say that once this arrangement has become commonplace in the United Kingdom and it has been shown to be efficient, we can then begin to pressure private companies to do the same."
 eng_internal.32.a:0 "A smashing idea!"
 eng_internal.32.b:0 "We cannot afford to adopt the proposal at this time."
 ENG_unlock_industrial_democracy_act:0 "§GIndustrial Democracy Act [This.Get1952]§!"
 #Great Depression
 eng_internal.33.t:0 "Recovery from the Depression"
 eng_internal.33.d:0 "The past five years have been uncertain ones amidst the Great Depression. At its worst, industrial output fell by a third and unemployment rose to about 70%. However, it has recently become clear that the economy has begun to recover. The housing market is booming, output is increasing, and people are slowly getting back to work."
 eng_internal.33.a:0 "Excellent!"
 ENG_depression_recovering:0 "§GWe have begun to recover from the Great Depression.§!"
 eng_internal.34.t:0 "End of the Great Depression"
 eng_internal.34.d:0 "With our recent economic activity, the Great Depression seems to have ended in the United Kingdom. Government investment has put Britons back to work and stiumlated demand, allowing the market to recover. Economists are optimistic that the crisis is over, and the newspapers are reporting an increase of activity. It seems that we have triumphed!"
 eng_internal.34.a:0 "Finally!"
 #Other
 eng_internal.35.t:0 "Ramsay MacDonald Resigns"
 eng_internal.35.d:0 "Ever since 1933, Prime Minister Ramsay MacDonald's declining mental health has been a concern for many within our government. The man has grown increasingly isolated during his tenure as Prime Minister, frustrated about being kicked out of the Labour Party he worked so hard to build and letting his mostly Conservative cabinet run the country. The constant attacks he has been facing from hardliner conservatives like Churchill, or nationalist newspapers such as the Saturday Review, have also tired him, and acknowledging his poor state, he has resolved to resign as Prime Minister. The leader of the Conservative Party, who up until now had served as Lord President of the Council, Stanley Baldwin, will become the new Prime Minister, allowing MacDonald to take Baldwin's old, more ceremonial office. With this move, the Conserative Party is now officially in control of the government, something that may help them in the upcoming general election scheduled for November."
 eng_internal.35.a:0 "Farewell"
 #elections
 eng_election.1.t:0 "[This.ENG_Election_Winner] The [Date.GetYear] General Election"
 ENG_labour_wins_title:0 "Labour Wins"
 ENG_tory_wins_title:0 "The Conservatives Win"
 eng_election.1.d:0 "Today's General Election saw Labour and the National Government compete for the Britons' votes. [This.Eng_Election_Desc]"
 eng_election.1.a:0 "Congratulations!"
 ENG_labour_gain_from_tory:0 "In an upset, the Labour Party, Britain's preeminent socialist party, has soundly defeated the Tories, and will thus form a government. The Party's plans include nationalization of extractive industries and utilities, the expansion of social programs such as healthcare and education, and an attempt at central planning. In interviews with voters, the Daily Herald has found that Londoners have overwhelmingly supported Labour, likely because of Herbert Morrison's social programs back in 1934. In Manchester, the Manchester Guardian found that voters have become fed up with the National Government, and have thus voted Labour in order to, as one man put it, \"bring about real change, you know?\""
 ENG_labour_hold:0 "As expected, the Labour Party's support has held, meaning that they will continue to rule the country for the time being. All in all, they hope to continue their social and economic reforms. In Newcastle, The Journal found that voters have \"continued to be won over by the promises of Socialism, regardless of how much Labour's policies have improved their lives.\" In Edinburgh, Labour's support has grown, as Labourite policies have brought new hospitals to the area. And of course, London remains a stronghold of the party, which has grown fond of the education and healthcare programs that Labour has enacted."
 ENG_tory_hold:0 "As expected, the Conservative Party has managed to hold a majority, meaning that they will form a new government. An incoming Tory MP told The Times that \"we hope to continue on our given path, even as we move away from Austerity and confront the new challenges that face Britain\". The Daily Herald found that London voters \"want the stability promised by the Conservatives, and despite London City Council's social welfare policies, are wary of Radical Labour reforms.\" In Devonshire, the Sidmouth Herald affirmed that the \"people of Devonshire have rejected Labour's empty promises, and have sided with a government that represents the interest of the rural community.\" It is clear that the Conservatives' message has resonated with the people."
 ENG_tory_gain_from_labour:0 "In an upset, the Conservative Party has managed to defeat Labour, meaning that once again, a Tory government will be formed. The Oxford Times has written that \"Though previously optimistic about socialist reforms, many Oxfordshire residents have now rejected Labour, finding that their promises were empty.\" In contrast, the New Leader wrote that \"The Capitalist Media has convinced the rural, middle, and even some of the working class that policies that directly benefit them are 'overintrusive', leading to this disaster at the polls\". An outgoing Labour MP told the Leicester Mercury that \"the results are a definate shame, but this is only a temporary setback for Labour. Four more years of Tory rule, and the people should realize again that the Conservative Party offers nothing to the working people of this country.\""
 eng_election.2.t:0 "Election Cancelled due to War"
 eng_election.2.d:0 "Normally, today would be the date of our General Election. There would have been mass campaigns by competing factions, and candidates warring over the public's trust. However, due to the World War, the General Election has been cancelled in order to maintain a united country focused entirely on the war effort."
 eng_election.2.a:0 "Maybe in five years, the war will be over..."
