 ##House of Commons
 ENG_House_of_Commons:0 "House of Commons"
 ENG_House_of_Commons_desc:0 "The House of Commons is our Lower House, and is our main Legislative Body. Meeting in the Palace of Westminister, the House of Commons is the successor to the Parliament of England, which has existed since the 13th century. The House of Commons is not governed by a single Constitutional document but rather several documents split between various acts.\n\n§YTotal Coalition Seats:§! §C[?This.ENG_coalition_seats]§!\n\n[This.ENGComSeatLoc][This.ENGRevSocSeatLoc][This.ENGDemSocSeatLoc][This.ENGSocDemSeatLoc][This.ENGSocLibSeatLoc][This.ENGMarLibSeatLoc][This.ENGLibConSeatLoc][This.ENGSocConSeatLoc][This.ENGAutSeatLoc][This.ENGAutDesSeatLoc][This.ENGFarAutSeatLoc][This.ENGFasSeatLoc]\n§YTotal Seats:§! §C[?This.ENG_total_seats]§!\n§YSeats Needed:§! §C[?This.ENG_supseat]/[?This.ENG_seats_needed]§!"
 ENGComSeats:0 "§YCommunist Seats:§! §C[?This.ENG_com_seats]§!\n"
 ENGRevSocSeats:0 "§YIndependent Labour Seats:§! §C[?This.ENG_revsoc_seats]§!\n"
 ENGDemSocSeats:0 "§YLabour Seats:§! §C[?This.ENG_demsoc_seats]§!\n"
 ENGSocDemSeats:0 "§YNational Labour Seats:§! §C[?This.ENG_socdem_seats]§!\n"
 ENGSocLibSeats:0 "§YLiberal Seats:§! §C[?This.ENG_soclib_seats]§!\n"
 ENGMarLibSeats:0 "§YIndependent Liberal Seats:§! §C[?This.ENG_marlib_seats]§!\n"
 ENGLibConSeats:0 "§YNational Liberal Seats:§! §C[?This.ENG_libcon_seats]§!\n"
 ENGSocConSeats:0 "§YConservative Seats:§! §C[?This.ENG_soccon_seats]§!\n"
 ENGAutSeats:0 "§YHigh Tory Seats:§! §C[?This.ENG_aut_seats]§!\n"
 ENGAutDesSeats:0 "§YUltra-Royalist Seats:§! §C[?This.ENG_autdes_seats]§!\n"
 ENGFarAutSeats:0 "§YUltranationalist Seats:§! §C[?This.ENG_faraut_seats]§!\n"
