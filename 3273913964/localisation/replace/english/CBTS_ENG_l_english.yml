 ##Communists
 eng_parliament.1.t:0 "Negotiating with the CPGB: Raising Taxes"
 eng_parliament.1.d:0 "In order to pass our motion through the House of Commons, we have come to the Communist Party of Great Britain for support. However, the Communist Party is adamant that if we would like their votes, we must agree to raise taxes on the middle and upper classes. Shall we accept these terms?"
 eng_parliament.1.a:0 "We need their support."
 eng_parliament.1.b:0 "We refuse to work for a Soviet Britain!"
 eng_parliament.2.t:0 "Negotiating with the CPGB: Welfare Payments"
 eng_parliament.2.d:0 "In order to pass our motion through the House of Commons, we have come to the Communist Party of Great Britain for support. However, the Communist Party is adamant that if we would like their votes, we must agree to raise spending on welfare programs. Shall we accept these terms?"
 eng_parliament.2.a:0 "We need their support."
 eng_parliament.2.b:0 "We refuse to work for a Soviet Britain!"
 ##RevSocs
 eng_parliament.3.t:0 "Negotiating with the ILP: The Living Wage"
 eng_parliament.3.d:0 "In order to pass our motion through the House of Commons, we have come to the Independent Labour Party for support. However, the ILP insists that we increase \"Living Wage\" payments, which unlike traditional minimum wage increases, will be paid directly to the workers from the treasurty. Should we accept this offer?"
 eng_parliament.3.a:0 "This seems like a fair trade."
 eng_parliament.3.b:0 "Socialism in Our Time? Bah!"
 eng_parliament.4.t:0 "Negotiating with the ILP: The Unemployment Allowance"
 eng_parliament.4.d:0 "In order to pass our motion through the House of Commons, we have come to the Independent Labour Party for support. However, the ILP insists that we increase the Unemployment Allowance, to allow those who are currently out of work to mitigate their situation. Shall we accept their offer?"
 eng_parliament.4.a:0 "This seems like a fair trade."
 eng_parliament.4.b:0 "Socialism in Our Time? Bah!"
 ##DemSocs
 eng_parliament.5.t:0 "Negotiating with Labour: Raising Taxes"
 eng_parliament.5.d:0 "In order to pass our motion through the House of Commons, we have come to the Labour Party for support. However, Labour will only vote for our motion if we agree to raise taxes accordingly, in order to pay for welfare programs. Should we accept this proposal?"
 eng_parliament.5.a:0 "We can agree to that."
 eng_parliament.5.b:0 "This would mean inspectors all round!"
 eng_parliament.6.t:0 "Negotiating with Labour: Public Works Spending"
 eng_parliament.6.d:0 "In order to pass our motion through the House of Commons, we have come to the Labour Party for support. However, Labour will only vote for our motion if we agree to raise spending on public works programs accordingly, in order to provide employment. Should we accept this proposal?"
 eng_parliament.6.a:0 "We can agree to that."
 eng_parliament.6.b:0 "This would mean inspectors all round!"
 ##SocDems
 eng_parliament.7.t:0 "Negotiating with the NLO: Raising Tariffs"
 eng_parliament.7.d:0 "In order to pass our motion through the House of Commons, we have come to the National Labour Organization for support. However, the only way we can get the NLO to support our motion is to promise a small increase in tariffs. This move would be designed to protect British industry from foreign competition. Should we accept this offer?"
 eng_parliament.7.a:0 "A worthwile offer."
 eng_parliament.7.b:0 "Labour Power means Free Trade!"
 ##SocLibs
 eng_parliament.8.t:0 "Negotiating with the Liberals: Lowering Tariffs"
 eng_parliament.8.d:0 "In order to pass our motion through the House of Commons, we have come to the Liberal Party for support. However, the Liberals demand a decrease of tariffs in exchange for their votes. This move would be designed to decrease costs for British manufacturers, which would decrease costs for the consumers. Should we accept this proposition?"
 eng_parliament.8.a:0 "Their terms are acceptable."
 eng_parliament.8.b:0 "Free Trade won't bring Restored Prosperity!"
 eng_parliament.9.t:0 "Negotiating with the Liberals: The Education Budget"
 eng_parliament.9.d:0 "In order to pass our motion through the House of Commons, we have come to the Liberal Party for support. However, the Liberals demand an increase of the education budget in exchange for their votes. This move would be designed to provide more funds for the schooling of British children, enabling them to have more opportunities in life. Should we accep this proposition?"
 eng_parliament.9.a:0 "Their terms are acceptable."
 eng_parliament.9.b:0 "Education won't bring Restored Prosperity!"
 ##MarLibs
 eng_parliament.10.t:0 "Negotiating with the Independent Liberals: Lowering Tariffs"
 eng_parliament.10.d:0 "In order to pass our motion through the House of Commons, we have come to Lloyd George's Liberals for support. However, should we accept their support, we would have to lower tariffs on imports. This is a move designed to decrease costs on producers and consumers. Should we accept this offer?"
 eng_parliament.10.a:0 "We shall honor the great statesman."
 eng_parliament.10.b:0 "Lloyd George's cause is not our own."
 ##LibCons
 eng_parliament.11.t:0 "Negotiating with the LNP: Raising Tariffs"
 eng_parliament.11.d:0 "In order to pass our motion through the House of Commons, we have come to the Liberal National Party for support. However, as their cause includes protectionism, we will have to raise tariffs in order to secure their support. This is designed to protect British industry from cheap foreign consumer goods. Should we accept this offer?"
 eng_parliament.11.a:0 "This seems reasonable."
 eng_parliament.11.b:0 "The Simonites will get nothing from us!"
 ##SocCons/Aut/AutDes
 eng_parliament.12.t:0 "Negotiating with the Conservatives: Raising Tariffs"
 eng_parliament.12.d:0 "In order to pass our motion through the House of Commons, we have come to the Conservative Party for support. However, they insist that they will only support our motion if we raise tariffs, in a move to protect British businesses from foreign competition. Should we accept this compromise?"
 eng_parliament.12.a:0 "It seems we should."
 eng_parliament.12.b:0 "Our country cannot afford that choice."
 eng_parliament.13.t:0 "Negotiating with the Conservatives: Improving Medical Care"
 eng_parliament.13.d:0 "In order to pass our motion through the House of Commons, we have come to the Conservative Party for support. However, they insist that they will only support our motion if we increase the budget on workers' health insurance, to ensure the poor's well-being. Should we accept this compromise?"
 eng_parliament.13.a:0 "It seems we should."
 eng_parliament.13.b:0 "Our country cannot afford that choice."
 ##FarAuts
 eng_parliament.14.t:0 "Negotiating with the BPP: Raising Tariffs"
 eng_parliament.14.d:0 "In order to pass our motion through the House of Commons, we have come to the British People's Party for support. However, it has become apparent that they will only vote for our motion if we promise increased tariffs"
 eng_parliament.14.a:0 "We shall have to agree."
 eng_parliament.14.b:0 "We do not need Beckett's advice."
 ##Fascists
 eng_parliament.15.t:0 "Negotiating with the BUF: Raising Tariffs"
 eng_parliament.15.d:0 "In order to pass our motion through the House of Commons, we have come to the British Union of Fascists for support. The insist that because protection of British industry historically built up our national strength, they cannot back our motion without an assurance that we will raise tariffs. How should we respond?"
 eng_parliament.15.a:0 "This is a reasonable argument."
 eng_parliament.15.b:0 "We will not March with Mosley!"
 eng_parliament.16.t:0 "Negotiating with the BUF: Raising Defense Spending"
 eng_parliament.16.d:0 "In order to pass our motion through the House of Commons, we have come to the British Union of Fascists for support. The insist that because a strong military is key to national defense and the economy, they cannot back our motion without an assurance that we will raise defense spending. How should we respond?"
 eng_parliament.16.a:0 "This is a reasonable argument."
 eng_parliament.16.b:0 "We will not March with Mosley!"
 #Automatic Agreeing
 eng_parliament.17.t:0 "The CPGB supports our Motion"
 eng_parliament.17.d:0 "Communist Party MPs have declared their support for our motion in the House of Commons. When it comes time to vote, they will vote in support of the motion. In an article with the Daily Worker, an MP described the measure as \"imperative to developing class consiousness in Britain, bringing us one step closer to revolution.\""
 eng_parliament.17.a:0 "An interesting development."
 eng_parliament.18.t:0 "The ILP supports our Motion"
 eng_parliament.18.d:0 "Independent Labour Party MPs have declared their support for our motion in the House of Commons. When it comes time to vote, they will vote in support of the motion. An article in the New Leader describes the motion as \"an important reform in improving the lot of the British worker.\""
 eng_parliament.18.a:0 "An interesting development."
 eng_parliament.19.t:0 "The Labour Party supports our Motion"
 eng_parliament.19.d:0 "Labour Party MPs have declared their support for our motion in the House of Commons. When it comes time to vote, they will vote in support of the motion. In an a series of interviews published in The Daily Herald, Labour members described the motion as \"a great benefit for the nation and the people.\""
 eng_parliament.19.a:0 "A useful development."
 eng_parliament.20.t:0 "The NLO supports our Motion"
 eng_parliament.20.d:0 "National Labour Organization MPs have declared their support for our motion in the House of Commons. When it comes time to vote, they will vote in support of the motion. Newspapers across the country have declared that \"MacDonald's organization, though regarded by Left-Wingers as traitors, still insist that their actions are beneficial for the working class.\""
 eng_parliament.20.a:0 "A curious development."
 eng_parliament.21.t:0 "The Liberal Party supports our Motion"
 eng_parliament.21.d:0 "Liberal Party MPs have declared their support for our motion in the House of Commons. When it comes time to vote, they will vote in support of the motion. In an interview with the News Chronicle, a Liberal MP described the motion as \"Another way that we can move Britiain forward.\""
 eng_parliament.21.a:0 "A curious development."
 eng_parliament.22.t:0 "Lloyd George's Liberals support our Motion"
 eng_parliament.22.d:0 "David Lloyd George's Independent Liberals have declared their support for our motion in the House of Commons. When it comes time to vote, they will vote in support of the motion. In an interview with the Manchester Guardian, Goronwy Owen described the motion as \"A policy that works for everyone.\""
 eng_parliament.22.a:0 "A curious development."
 eng_parliament.23.t:0 "The Liberal National Party supports our Motion"
 eng_parliament.23.d:0 "Liberal National Party MPs have declared their support for our motion in the House of Commons. When it comes time to vote, they will vote in support of the motion. In a statement given to reporters outside of Westminster, one of the Party's MPs described the motion as being \"Agreeable with the intentions of the National Liberals.\""
 eng_parliament.23.a:0 "A curious development."
 eng_parliament.24.t:0 "The Conservative Party supports our Motion"
 eng_parliament.24.d:0 "Conservative Party MPs have declared their support for our motion in the House of Commons. When it comes time to vote, they will vote in support of the motion. An article by the Times describes the motion as a \"Sensible Measure needed in Britain Today\", along with agreeing statements from some Conservative MPs."
 eng_parliament.24.a:0 "A curious development."
 eng_parliament.25.t:0 "The BPP supports our Motion"
 eng_parliament.25.d:0 "British People's Party MPs have declared their support for our motion in the House of Commons. When it comes time to vote, they will vote in support of the motion. Their newspaper, The People's Post, declared the motion to be \"A key factor in transforming Britain into a Syndical and Corporate State.\""
 eng_parliament.25.a:0 "An interesting development."
 eng_parliament.26.t:0 "The BUF supports our Motion"
 eng_parliament.26.d:0 "British Union of Fascist MPs have declared their support for our motion in the House of Commons. When it comes time to vote, they will vote in support of the motion. An article in Action (the Party's Newspaper) described the motion as \"A sign of things to come\", and \"Proof that the British Government understands, yet is too cowardly to admit, the need for a Corporate arrangement in Britain.\""
 eng_parliament.26.a:0 "An interesting development."
