 #Intro events
 eng_introduction.1.t:0 "The United Kingdom in 1933"
 eng_introduction.1.d:0 "In 1918, the United Kingdom of Great Britain and Northern Ireland stood victorious after the defeat of the German Empire in the Great War. The British Empire, at present, spans one-fourth of the Earth's surface practically unchalleneged. However, recent events have threatened the political and economic stability of the nation. The Great Depression of 1929 caused output to plummet by a third, and though we are through the worst of the crash, millions are still unemployed and many live in poverty. This quickly led to the election of the first Labour government in late 1929, which was toppled two years later by scandal. We are at present governed by the Conservative-dominated National Government, a coalition of Labour defectors, national liberals, and conservatives, who together have an extreme majority in the House of Commons.\n\nOther trends have also begun to grip the nation. The advancement of British technology (some of the best in the world!) has given rise to mass consumerism and mass media. A wave of pacifism has sweeped political discussion, particularly among the youth. Many have begun to argue for the use of diplomatic channels instead of military force, even when faced with danger. And finally, colonial liberation movements have slowly begun to pick up speed, particularly in India, Egypt, and the Mandate of Palestine.\n\nWhile the Navy remains strong, the army and the air force have begun to suffer. Though we are making steady progress in the mechanization of our land forces, our soldiers are still few in number. Developments in the aeronautical field have continued, though the Royal Air Force has not been necessary for the last fifteen years, though this may change soon..."
 eng_introduction.1.a:0 "I'd like to know more."
 eng_introduction.1.b:0 "That's enough."
 eng_introduction.2.t:0 "The Major Parties in the United Kingdom"
 eng_introduction.2.d:0 "Due to the first-past-the-post system of voting, British politics is heavily skewed towards larger parties. This has resulted in a largely two-party system. The larger of the two parties is the Conservative and Unionist Party. Conservatives, sometimes called \"Tories\", support middle and upper-class lifestyles and values. They are socially conservative, strongly anti-socialist, and defend a market economy with limited welfare measures. However, they are not afraid to intervene in the economy if it is absolutely necessary. Furthermore - and this is an extremely contentious topic in the current political atmosphere - the Conservatives strongly support protectionism. In addition to upper and middle-class support, the Conservatives have support from the agrarian sector,\n\nThe Conservatives' main rival is the Labour Party. Originally a common organizing committee for worker-oriented political groups, Labour soon grew into the largest socialist party in the United Kingdom by far. Unlike socialist parties in continental Europe, Labour's ideology is not based on Marxism. It is instead based on Ethical Socialism and Fabianism. In short, Labour rejects violent revolution in favor of a parliamentary transition to socialism. They support policies considered to be radical in Britain, such as a national healthcare program and the nationalization of key industries. They are also traditionally sympathetic to the cause of Indian independence."
 eng_introduction.2.a:0 "And the minor parties?"
 eng_introduction.2.b:0 "That's quite a lot."
 eng_introduction.3.t:0 "The Minor Parties in the United Kingdom"
 eng_introduction.3.d:0 "Alongside the two major parties, several minor parties exist with parliamentary representation. Chief among them is the Liberal Party. Formerly a very large party, it is currently a shadow of its former self due to the loss of its working-class support to the Labour Party. Recently, the Liberals suffered splits as factions (such as David Lloyd George's \"Independent Liberals\" and the Liberal National Party) broke with the party due to their stances towards protectionism (as the liberals are supporters of free trade) and the National Government (the liberals were originally members, but left due to the National Government's protectionism). The Liberal National Party was formed in 1931 by dissidents in the Liberal Party who supported protectionist policies (though more out of the pressure of the Great Depression rather than conviction). As such, they remain members of the National Government and are drawing increasingly closer to the Conservative Party.\n\nFurther to the left sits the National Labour Organization. Formed by former Labour Prime Minister Ramsey MacDonald (now considered to be a traitor by the rest of Labour), these Labour dissidents split from Labour to support the National Government. MacDonald is currently Prime Minister. Like the rest of the National Government, National Labour also supports protectionism.\n\nEven further to the left, we find the Independent Labour Party. Formed even before the Labour Party, they were eclipsed by Labour as they began to disaffiliate themselves from each other over differences in policies. More radical than Labour, Independent Labour wishes to use parliamentary means to achieve even more radical reforms, such as the establishment of a Living Wage.\n\nFinally, at the fringes sit the Communist Party of Great Britain and the British Union of Fascists. Though the former gets a seat or two on occasion, neither party has a large amount of influence outside of their own circles."
 eng_introduction.3.a:0 "Very interesting!"
 #traits
 peoples_king:0 "People's King"
 unpopular_king:0 "Non-Traditional Ruler"
 POLITICS_EDWARD_VIII_DESC:0 "Born in 1894, Edward Albert Christian George Andrew Patrick David Windsor, now King Edward VIII, has been King since his father died in January 1936. Unlike his father, who was hugely popular in the nation, Edward is more unorthodox, prefering his womanizing lifestyle to his traditional role as figurehead. As such, many members of the British elite despise him, and many politicians are worried that Edward might overtstep his bounds and get involved in Parliament. However, he is very fond of a certain Mrs. Simpson, an American socialite. It remains to be seen what he makes of his reign..."
 POLITICS_GEORGE_V_DESC:0 "Born in 1865, George Frederick Ernst Albert Windsor, or King George V has been King since 1910. Due to a Conservative panic over Socialism and Republicanism, King George became incredibly active, visiting workers, farmers, and the sick to promote the image of the Monarchy across class lines. It was an incredibly successful initiative, and the King is now hugely popular accross Britain, which has even led the Labour Party to abandon Republicanism. The King's health however, is on the decline. He enjoys stamp collecting, game shooting, and promotes middle-class values."
