 eng_by_election.1.t:0 "Ashford By-Election"
 eng_by_election.1.d:0 "After the Conservative MP Michael Knatchbull's succession to the peerage last month, elections are being held in his constituency of Ashford to determine his successor. A traditionally conservative seat, it was won by the Liberals in 1929, and now their candidate Roderick Kedward wants it back. Despite many Liberal MPs still sitting in the government benches of the House of Commons, Kedward announced that, if elected, he would sit in the opposition benches, making the election a vote in favour or against the current National Government. And while a swing against the Conservative Party is expected, there's also the issue of Labour potentially splitting the anti-tory vote to consider. As the polls close and the votes are counted, the new MP is..."
 eng_by_election.1.a:0 "Patrick Spens (Conservative)"
 eng_by_election.1.b:0 "Roderick Kedward (Liberal)"
 
 eng_by_election.2.t:0 "Hitchin By-Election"
 eng_by_election.2.d:0 "After the death of incumbent Conservative MP Antony Bulwer-Lytton in a plane crash, new elections were called in his constiuency of Hitchin, Hertfordshire. to fill the vacant seat. Although a swing against the National Government is expected, many doubt the ability of Labour to win this traditionally Conservative seat. As the polls close and the votes are counted, the new MP is..."
 eng_by_election.2.a:0 "Arnold Wilson (Conservative)"
 eng_by_election.2.b:0 "William Bennett (Labour)"
 
 eng_by_election.3.t:0 "Fulham East By-Election"
 eng_by_election.3.d:0 "After the death of Conservative MP Kenyon Vaughan-Morgan, elections were called to fill his vacant seat of Fulham East, London. Despite being considered a safe Conservative seat, Labour candidate John Wilmot hopes to pull of an upset victory by campaigning on pacifism against the Conservative candidate William Waldron, a well-known proponent of rearmament. The entire National Government is watching this election, as it could test the mood of the country regarding the pacifism issue. As the polls close and the votes are counted, the new MP is..."
 eng_by_election.3.a:0 "William Waldron (Conservative)"
 eng_by_election.3.b:0 "John Wilmot (Labour)"
 
 eng_by_election.4.t:0 "Basingtoke By-Election"
 eng_by_election.4.d:0 "After the sudden resignation of sitting Conservative MP Gerard Wallop, new elections have been called in his constituency of Basigntoke, in Hampshire. The main issue of the campaign is foreign policy, be it in favour of the National Government's isolationist approach or against. National Liberal ministers and party leaders have personally endorsed the Conservative candidate, while the Liberal leader, Sir Herbert Samuel, did the same with his candidate yesterday in a small meeting. As the polls close and the votes are counted, the new MP is..."
 eng_by_election.4.a:0 "Henry Drummond Wolff (Conservative)"
 eng_by_election.4.b:0 "John Foot (Liberal)"
 
 eng_by_election.5.t:0 "Upton By-Election"
 eng_by_election.5.d:0 "With the resignation of incumbent Conservative MP Alfred Chotzner, new elections have been called to fill the vacant seat in his constiuency of Upton, Essex. Everyone expects Labour candidate Benjamin Walter Gardner	to win back his seat, as he did in 1923 and 1929, but this is far from guaranteed. As the polls close and the votes are counted, the new MP is..."
 eng_by_election.5.a:0 "John Macnamara (Conservative)"
 eng_by_election.5.b:0 "Benjamin Walter Gardner (Labour)"
 
 eng_by_election.6.t:0 "Lambeth North By-Election"
 eng_by_election.6.d:0 "After the death of incumbent Liberal MP Frank Briant, new elections have been called to fill his seat of Lambeth North, a borough constituency in South London. Being hotly contested between the Labour candidate George Strauss and the late Liberal MP Frank Briant, who won his seat in the 1931 landslide against Labour, many doubt that the Liberals can hold this seat. As the polls close and the votes are counted, the new MP is..."
 eng_by_election.6.a:0 "J. W. Simpson (Liberal)"
 eng_by_election.6.b:0 "George Strauss (Labour)"
 
 eng_by_election.7.t:0 "Liverpool Wavertree By-Election"
 eng_by_election.7.d:0 "After the incumbent Conservative MP Ronald Nall-Cain succeed to the peerage as Baron Brocket, new elections were called to fill his seat of Liverpool Wavertree. Despite the enourmous advantage the Conservatives enjoyed over Labour in this constituency in 1931, an independent conservative candidate may split the vote and deliver a victory to the Labour candidate Joseph Cleary. This independent is none other than Randolph Churchill, the only son of former First Lord of the Admiralty and Chancellor of the Exchequer Winston Churchill, a prominent conservative hardliner. As the polls close and the votes are counted, the new MP is..."
 eng_by_election.7.a:0 "James Platt (Conservative)"
 eng_by_election.7.b:0 "Joseph Cleary (Labour)"
 
 eng_by_election.8.t:0 "Liverpool West Toxteth By-Election"
 eng_by_election.8.d:0 "With incumbent Conservative MP, Clyde Tabor Wilson, being appointed as a metropolitan police magistrate, new elections have been called to fill up his seat. Liverpool West Toxteth has been hotly contested between Conservative and Labour for a decade, with Labour candidate and trade unionist Joseph Gibbins holding the seat before the Conservative landslide of 1931. Now he expects to win it back, becoming the only MP to win 2 times the sames seat in different by-elections. As the polls close and the votes are counted, the new MP is..."
 eng_by_election.8.a:0 "J.W.J. Cremlyn (Conservative)"
 eng_by_election.8.b:0 "Joseph Gibbins (Labour)"