l_english:
 #generic leftist european tree
 #Politics
 GEN_LEFT_POL_start:0 "Arise, ye Workers from Your Slumber"
 GEN_LEFT_POL_start_desc:0 "The [This.GetAdjective] Working Class has triumphed, and is now in control of the nation! We shall immediately begin reforms that aim to eliminate the power of the capitalist exploiters."
 GEN_Recent_Great_Purges:0 "Recent Purges"
 GEN_LEFT_POL_Great_Purge:0 "The [This.GetAdjective] Purge"
 GEN_LEFT_POL_Great_Purge_desc:0 "Our Government is filled with Counterrevolutionaries who would like nothing better than to see our liberative order destroyed! We must find and eliminate these traitors."
 GEN_LEFT_POL_Light_Purge:0 "Ideological Correctness"
 GEN_LEFT_POL_Light_Purge_desc:0 "We shall find and dismiss those who are ideologically incompatible with public service in our nation, but go no farther."
 GEN_LEFT_POL_Anti_Liberal:0 "Anti-Liberal Propaganda"
 GEN_LEFT_POL_Anti_Liberal_desc:0 "We must begin a propaganda campaign aimed at taking down Liberal thought. Those who would defend the enslavement of the workers must also be removed from public life, with extreme prejudice."
 GEN_LEFT_POL_Anti_Fascist:0 "Anti-Fascist Campaign"
 GEN_LEFT_POL_Anti_Fascist_desc:0 "If we allow Fascism to fester in our nation, it will mean the death of the Proletarian State. We must root out Fascists immediately!"
 GEN_LEFT_POL_Secret_Police:0 "Improve the Secret Police"
 GEN_LEFT_POL_Secret_Police_desc:0 "Our Secret Police needs to be able to find all counterrevolutionaries and foreign spies, and bring them to trial. Socialism requires vigilance!"
 GEN_LEFT_POL_Politicized_Judciary:0 "Politicized Judiciary"
 GEN_LEFT_POL_Politicized_Judciary_desc:0 "Our Judiciary should act upon the orders of the Party, in order to better deal with political dissidents. The survival of the Party must take priority over justice."
 GEN_LEFT_POL_Independent_Judiciary:0 "Independent Judiciary"
 GEN_LEFT_POL_Independent_Judiciary_desc:0 "Our judicial system shall remain independent of political interference. Courts are meant to serve justice, not serve the Party's agenda."
 GEN_LEFT_POL_Leninism:0 "Follow Lenin"
 GEN_LEFT_POL_Leninism_desc:0 "Without Lenin, the Socialist Revolution could never have begun! Thus, we follow Lenin's Lead!"
 GEN_LEFT_POL_Our_Own_Path:0 "Our Own Path"
 GEN_LEFT_POL_Our_Own_Path_desc:0 "Lenin's brutality showed that he had betrayed the Revolution for his own gain, proving that Leninism is not True Socialism. We shall forge our own path and show that Socialism can be a force for good!"
 GEN_LEFT_POL_Dictatorship_Proletariat:0 "Dictatorship of the Proletariat"
 GEN_LEFT_POL_Dictatorship_Proletariat_desc:0 "Our state is governed by the Party, a Vanguard of Intellectual Elites who, with a large bureaucracy, organize the workers and build Socialism! We will operate on the principles of Democratic Centralism, where all decisions made by the Central Committee become the Party Line."
 GEN_LEFT_POL_Centralized_Authority:0 "Empower the Central Council"
 GEN_LEFT_POL_Centralized_Authority_desc:0 "In order to better safeguard our Socialist Order, we should give the Central Authority more power. This would allow them to more efficiently coordinate the construction of Socialism."
 GEN_LEFT_POL_Decentralized_Authority:0 "Empower the Local Councils"
 GEN_LEFT_POL_Decentralized_Authority_desc:0 "Local Worker and Soldier Councils should be empowered to make decisions themselves, in order to better build a Socialist Democracy. They will truly have control of the means of production!"
 GEN_LEFT_POL_Social_Conservatism:0 "Establish a Social Order"
 GEN_LEFT_POL_Social_Conservatism_desc:0 "Ideas such as Gender Equality are foreign influences designed to weaken our government. We must codify an established social order, as only the New [This.GetAdjective] Man can truly build a Communist Utopia!"
 GEN_LEFT_POL_Social_Progressive:0 "Progressive Reforms"
 GEN_LEFT_POL_Social_Progressive_desc:0 "We should begin enacting reforms that improve the Social Equity of our people, such as Gender and Ethnic Equality."
 GEN_socialist_patriotism:0 "Socialist Patriotism"
 GEN_LEFT_POL_Nationalism:0 "Socialist Patriotism"
 GEN_LEFT_POL_Nationalism_desc:0 "Lenin and Stalin say that Patriotism and Socialism are not incompatible. The People must always be ready to defend the Nation from Counterrevolutionary Attack!"
 GEN_LEFT_POL_Internationalism:0 "Internationalism"
 GEN_LEFT_POL_Internationalism_desc:0 "Marx says that war is only conducted at the behest of the Capitalist Class. Thus, as a Socialist Nation, war should avoided whenever possible. We should, on the other hand, sponsor Socialist Revolutions when we get the chance."
 GEN_LEFT_POL_Socialist_Education:0 "Socialist Education"
 GEN_LEFT_POL_Socialist_Education_desc:0 "Our youth shall learn the value of Socialism from our schools. Teachers will be politically trained, and instructed to glorify Socialism at every opportunity."
 GEN_socialist_education:0 "Political Education"
 GEN_LEFT_POL_Economics:0 "Scientific Economics"
 GEN_LEFT_POL_Economics_desc:0 "The Liberalist \"Science\" only promotes inequality and oppression. Our Scientific Socialism promotes equality!"
 GEN_command_economy:0 "Planned Economy"
 GEN_market_socialist_economy:0 "Market Socialist Economy"
 GEN_LEFT_POL_Command_Economy:0 "Command Economy"
 GEN_LEFT_POL_Command_Economy_desc:0 "The Economy should be managed by the State Bureaucracy. Orders shall come from [Root.Capital.GetName] and be carried out by local officials, and ultimately, the workers. However, such a system is bound to be bogged down by bureaucratic trappings and does not really involve the workers in decisions."
 GEN_LEFT_POL_Self_Management:0 "Self-Management"
 GEN_LEFT_POL_Self_Management_desc:0 "The state should take a more relaxed hand to economic affairs. The main driving force of our economy will be cooperative and collective enterprises self-managed by the workers. Such a system allows the state less influence on the building of socialism, but guarantees the workers more rights, and frees the economy from bureaucratic harrasment."
 GEN_forced_collec:0 "Forced Collectivization"
 GEN_voluntary_collec:0 "Voluntary Collectivization"
 GEN_LEFT_POL_Forced_Collectivization_desc:0 "All production units in our nation should be collectivized, by force if necessary. Failing to do so will result in the re-emergence of the oppresive class."
 GEN_LEFT_POL_Forced_Collectivization:0 "Forced Collectivization"
 GEN_LEFT_POL_Voluntary_Collectivization:0 "Voluntary Collectivization"
 GEN_LEFT_POL_Voluntary_Collectivization_desc:0 "Collectivization should be entirely voluntary. People will be able to work for themselves if they like, and even own some of their own land. However, they will not be allowed too many employees, and those employees must have some input on management decisions."
 GEN_LEFT_POL_Provide_Employment:0 "People's Infrastructure Projects"
 GEN_LEFT_POL_Provide_Employment_desc:0 "We will begin a state-managed program to provide employment to those who have lost their employment during economic restructuring. They will mainly work on building highways and railways."
 GEN_LEFT_POL_Control_Unions:0 "Control the Unions"
 GEN_LEFT_POL_Control_Unions_desc:0 "Unions should be Bureaucratic Entities, with the purposes of educating the workers in ideological matters and hosting events to boost morale."
 GEN_LEFT_POL_Empower_Unions:0 "Empower the Unions"
 GEN_LEFT_POL_Empower_Unions_desc:0 "The Unions should be influential politically. If the workers are able to elect representatives to the unions to which they belong, it will help create equality in our nation."
 GEN_red_guard:0 "Red Guard"
 GEN_LEFT_POL_Paramilitary:0 "The Red Guard"
 GEN_LEFT_POL_Paramilitary_desc:0 "The Red Guard shall protect our streets from undesirable elements, namely counterrevolutionaries and foreign spies!"
 GEN_commissars:0 "Political Commissars"
 GEN_LEFT_POL_Commisssars:0 "Political Commissars"
 GEN_LEFT_POL_Commisssars_desc:0 "Every military action must have some sort of political purpose we can use to our advantage. Guaranteeing this advantage is the job of the Political Commissar. While a great agent of the political leadership, they are generally detested by career officers."