TUR_anti_socialist_laws_desc:0""
TUR_strikes_right:0"Workers Freedom"
TUR_strikes_right_desc:0""
TUR_economic_recovery_trade:0"Trade Deficit"
TUR_economic_recovery_trade_desc:0"In old Ottoman times the state’s trade was mostly controlled by non-muslim minorities,such as greeks and armenians. But know after the independence war, the population exchange happened and our trade has been effected from that. But now our state is recovering itself. And we must start closing our trade defict."
TUR_reform_central_bank:0"Reform Turkish Central Bank"
TUR_reform_central_bank_desc:0"By reforming our central bank we can improve loans and keep the economy afloat."
TUR_indigenous_industry:0"Indigenous Industry"
TUR_indigenous_industry_desc:0"We can't rely on other nations for equipment and basic goods. We need to produce it ourselves unlike in the Ottoman days where our industry was non existing and under influence of foreign nations."
TUR_heavy_industry:0"Heavy industry investments"
TUR_heavy_industry_desc:0""
TUR_airplane_industry:0"Vecihi Hürkuş Aviation Company"
TUR_airplane_industry_desc:0""
TUR_machine_part_industry:0"Heavy Machine Parts"
TUR_machine_part_industry_desc:0""
TUR_rejuvante_heavy_industry:0"Rejuvenate Heavy Industry"
TUR_rejuvante_heavy_industry_desc:0""
TUR_custom_tariffs:0"OPDA Payments"
TUR_custom_tariffs_desc:0"OPDA meaning Ottoman Public Debt Adminstration is an institution which collects debt for the European powers. When we defaulted in 1881 the European powers started collecting the debt in our own lands. This is unacceptable for a modern nation. We should finish the debt so we can ensure economic independence."
TUR_finish_OPDA:0"Finish The OPDA"
TUR_finish_OPDA_desc:0""
TUR_Limit_imports:0"Limit Imports"
TUR_Limit_imports_desc:0"Limiting imports is essential for a self sufficient nation. We need to get rid of dependencies on other nations."
TUR_infrastructure:0"Bosphorus Infrastructure"
TUR_infrastructure_desc:0"Our railways in the bosphorus is lacking. We need to improve our infrastructure in order to ensure growth."
TUR_infrastructure2:0"Karadeniz Infrastructure"
TUR_infrastructure2_desc:0"Ìur infrastructure in the Karadeniz region is lacking we should improve the railway system here. By improving the railway system we can make sure any deployment against the Soviet Union in the east wil go smoothly."
TUR_economy_recovered:0"Economy Recovered"
TUR_economy_recovered_desc:0"Our economy has recoverd and improved. In the war of independence our economy was almost non existing. Now we can finally say that thats not the case anymore our gdp has been growing rapidly. "
TUR_increase_chromium:0"Increase Izmit Mines Capacity"
TUR_increase_chromium_desc:0"We have vast amounts of chromium in our soil. We should improve the output so we can make more profit."
TUR_civilian_industry:0"Yap-Işlet-Devret"
TUR_civilian_industry_desc:0"Our civilian industry is lacking. As the state we should encourage the civilian industry. By building industry and running it as the state we wil encourage investments."
TUR_mic:0"Savunma Sanayi"
TUR_mic_desc:0"Savunma sanayi meaning military industry in Turkish. Wil be expanded in order to equip our military."
TUR_increase_iron:0"Increase Edirne Mining Output"
TUR_increase_iron_desc:0"Vital for any nation is iron. We wil expand our iron ore mines, so we can ensure our nations survival."
TUR_pashabahce:0"Pasabahce Glass"
TUR_pashabahce_desc:0"Our policiy of statism demands us to invest in civilian industry. "
TUR_war_preparation:0"War Preparation"
TUR_war_preparation_desc:0"We should prepare for war. The communist in the north want the straits. The Italians want our coastlines. The British want to enslave our nation. The Germans our resources. But we wil stay independent forever."
TUR_focus_exports:0"Export Focus"
TUR_focus_exports_desc:0"We should become a exporting nation instead of a consuming one. So we can assert our place in the world stage."
TUR_merinos:0"Merinos Investments"
TUR_merinos_desc:0"Our policiy of statism demands us to invest in civilian industry."
TUR_war_economy_focus:0"War Economy"
TUR_war_economy_focus_desc:0"Let us switch to war economy."
TUR_national_economy:0"Independent National Economy"
TUR_national_economy_desc:0"Our national economy has improved so much since our great leader Mustafa Kemal Pasha has taken the lead. Were would we be without him ? Our economies future looks bright with him in charge."



########## DIPLOMACY
TUR_diplomacy:0"Misak I Milli"
TUR_diplomacy_desc:0"Misak I milli meaning the National Oath of the Turkish Nation. Was a decision made by the late Ottoman Parliament in which our homeland was defined. Mustafa Kemal said "It is the nation's iron fist that writes the Nation's Oath which is the main principle of our independence to the annals of history.""
TUR_hatay:0"Hatay Referendum"
TUR_hatay_desc:0"The Sanjak of Hatay is included in the National Oath and has a large Turkish community. The treaty of Lausanne hasn't clearly defined our borders in the middle east. We hold a strong claim to this region as it was the Turkish homeland for 40 centuries. We should take this case to the league of nations and demand a referendum. "
