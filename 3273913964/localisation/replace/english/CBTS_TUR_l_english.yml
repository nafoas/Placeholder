#national Focus
 TUR_straits:0 "The straits question"
 TUR_straits_desc:0 "The treaty of Lausanne made us demilitarize the bosporus straits. The treaty of Lausanne was signed in 1923 in our moment of weakness. It is time to reassert our territorial integrity."
 TUR_convention:0 "Hold a convention "
 TUR_convention_desc:0 "The time has come to renegotiate the treaty of Lausanne. We wil hold a convention at Montreux to discuss this with the great powers."
 TUR_enter_troops:0 "Enter our troops"
 TUR_enter_troops_desc:0 "We renegotiated the treaty. We are now able to remilitarize the bosporus. "
 TUR_embrace_neutrality:0 "Embrace neutrality"
 TUR_embrace_neutrality_desc:0 "Now that we have secured the bosporus we should declare our neutrality and allow shipping through the straits."
 TUR_jewish_scientist:0"Invite Jewish scientists"
 TUR_jewish_scientist_desc:0""
 TUR_continue_reforms:0 "Continue reforms"
 TUR_continue_reforms_desc:0 "Now that we have reasserted our territorial integrity, we can continue to implement reforms."
 TUR_six_arrows:0 "Six Arrows"
 TUR_six_arrows_desc:0 "The six arrows stand for the principles of Kemalism. We wil reform our country by these six arrows."
 TUR_republicanism:0 "Republicanism"
 TUR_republicanism_desc:0 ""Cumhuriyetcilik" meaning republicanism is the ideal which wil replace the centuries old decadent Ottoman Absolute monarchy. Every Turk is equal."
 TUR_reformism:0 "Reformism"
 TUR_reformism_desc:0 "In order to survive a nation needs to keep up and reform the society.To Kemalist populism envision a sociality that emphasizes work and national unity. Populism in Turkey is to create a unifying force that brings a sense of the Turkish state and the power of the people to bring in that new unity."
 TUR_populism:0 "Populism"
 TUR_populism_desc:0 "The political powers lies within the Turkish people and noone else. "
#  TUR_nationalism:0 "Nationalism"
#  TUR_nationalism_desc:0 "Ne mutlu Türküm diyene. Meaning "How happy is the one who calls themself a Turk." is the new motto of out nation. May Allah save the Turkish nation"
 TUR_laicite:0"Laicite"
 TUR_laicite_desc:0"In order to achive a smooth democratic process we need to curb the influence of the clergy. The best way to do is seperation of state and religion."
 TUR_statism:0"Statism"
 TUR_statism_desc:0"Introduce statist policies to make sure the Turkish people are rightly guided by the state."
 TUR_new_turkish_republic:0"New Turkish Republic"
 TUR_new_turkish_republic_desc:0"With our completed reforms our state wil become stronger than ever. Our nation wil uphold the principles of Kemalism in the highest regards."
 TUR_research_slot_1:0"Progress"
 TUR_research_slot_1_desc:0"We have made significant scientific advancements."
 TUR_islamist_opposition:0"Islamist opposition"
 TUR_islamist_opposition_desc:0"Our policies of Laiciti has caused trouble with the islamists. We need to curb their infleunce in the country in order to take our society forward."
 TUR_continue_crackdown:0"Continue crackdown"
 TUR_continue_crackdown_desc:0"Cracking down on these islamist is necessary in order to complete the reforms. We cannot tolerate these reactionaries."
 TUR_istiklal_mahkemesi:0"Istiklal mahkemesi"
 TUR_istiklal_mahkemesi_desc:0"We need restart the Istiklal Tribunalas in order to swiftly punish te islamist reactionairies. Just like we did with Sheikh Said rebellion."
 TUR_compromise:0"Compromise"
 TUR_compromise_desc:0"Appear to make compromises with the islamist in order to gain time to push our reforms."
 TUR_infiltration_lodges:0"Infiltrate lodges"
 TUR_infiltration_lodges_desc:0"The sufi lodges are full of islamist. We need to infiltrate these areas with our Diyanet imams. If we can infiltrate them we can control them and make sure they aren't a threat."
 TUR_strong_diyanet:0"A strong Diyanet"
 TUR_strong_diyanet_desc:0"The Diyanet is the commision of religious affairs in Turkey. The Caliphate and the Islamic institutions were replaced with the diyanet who's loyalties are with the state. A Strong Diyanet wil ensure that the religious people of our state wil be loyal citizens."
TUR_jew_scientist:0"Jewish Scientist"
TUR_jew_scientist_desc:0""

####economic focuses
TUR_economic_recovery:0"Economic Recovery"
TUR_economic_recovery_desc:0"The Turkish economy has been destroyed by the war of independence. Before the war of independence the Ottoman states economy was not independent. The economy was controlled by foreign powers. We wil not suffer the same fate as our ancestors."
