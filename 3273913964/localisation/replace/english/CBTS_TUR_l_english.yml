# EVENTS

tur.1.t:0 "The Republic of Turkey"
tur.1.d:0 "After the defeat of the Central Powers in the First World War, the Ottoman Empire was humiliated. Large swaths of territory were divided between the victorious Allied Powers, and even Constantinople herself, jewel of the empire, fell victim to the occupation of those powers which had lay the old empire low in the brutal and bloody fighting. However, the occupations would not last. With the landing of Greek forces to engage in their portion of the occupation, Turkish nationalists rose in revolt, fighting a war against the occupying forces under a decorated and experienced commander of the First World War, hero of the Empire Mustafa Kemal Pasha. He would lead a two-year long nationalist war against the forces of Greece, Britain, and France, eventually emerging triumphant after regaining many lost territories and ensuring the independence of the region. The postwar period saw much reformation of the area, as the Ottoman Empire collapsed and a new Turkey took her place, with secularization and modernization sweeping away the old and replacing it with a newer, modern nationstate. Kemal would eventually be named "Atatürk" for his actions in liberalizing and industrializing Turkey, a name which means "Father of the Turks", reflecting his importance in the establishment of the Turkish nation. The new Turkey finds itself neutral in a region with simmering conflicts, finally ready to begin to ensure its place on the world stage. Atatürk and his belief system reign supreme, and his party, the Republican People's Party, holds nearly complete control over the nation- a liberal autocracy, so to speak."
tur.1.a:0 "Long live Atatürk"

tur.2.t:0 "Montruex Convention"
tur.2.d:0 "We need to hold a convention with the great powers. In this convention we will demand changes to the treaty of Lausanne signed in 1923. The main change wil be te remilitarization of the bosporus straits. We wil remilitarize it because its our territory, but we wil ensure that international shipping is allowed.  "
tur.2.a:0 "Hold the convention"

tur.3.t:0 "Remilitarization"
tur.3.d:0 "Now that the Montreux convention has been held, and the great powers have agreed. We will send our troops to enter Istanbul and Edirne."
tur.3.a:0 "Enter our troops"

tur.4.t:0 "Political Islam"
tur.4.d:0 "Even after abolishing the Caliphate and exiling the house of Osman there are stil reactionairies who resist our rule and oppose our rule. We need to get rid of them. This is not an easy task because the islamists are in every layer of society present. Our biggest tool is Diyanet the new Turkish ministry of religion. By increasing their power we can ensure support from the general population."
tur.4.a:0 "Push reforms"

tur.5.t:0"Hatay Referendum"
tur.5.d:0"We should take the issue of Hatay to the league of nations. On the principle of right to selve determination we should be able to make a case."
tur.5.a:0"Send our diplomats"

tur.6.t:0"Hatay Referendum"
tur.6.d:0"The new Turkish Republic has issued a statement in the league of nations on the state of Aleppo. The New Turkish Republic claims that they have right to the sanjak of Hatay. The sanjak of Hatay is an area with a lot of Turks and has a long history of Turkish rulers. No matter what the French Republic should look what is in the best intrest of the state. If we accept the so called Referendum we would get the Turks on our side. If not we wil have another enemy who will ally itself with the Germans. "
tur.6.a:0"Decline"
tur.6.b:0"Accept"

tur.7.t:0"France Declines"
tur.7.d:0"The colonialists French have declined our referendum prosposal. We have not given up on our claims. Hatay will become a part of the Turkish nation."
tur.7.a:0"Damn the French"

tur.8.t:0"France Accepts"
tur.8.d:0"The Republic of France has accepted our Referendum prosposal."
tur.8.a:0"Peace at home peace in the world"

