tur.12.t:0"Fevzi Cakmak takes power"
tur.12.d:0"The chief of the general staff Marshal Fevzi Cakmak Pasa has taken power after Ataturks death. Being the most influential commander after Ataturk, and with his death the only field marshal of Turkey besides Ataturk, made the grab to power very easy for Fevzi pasa. Fevzi Pasha moved swiftly after Ataturks death and arrested all opposition. His influence in the military made the power transition smooth. The Maresal has created a new party and made it the only legal party in Turkey. His new party called Millet Partisi (the nation party) now has all the seats in parliament. We hope that the Marshal will lead his nation to glory like Ataturk did."
tur.12.a:0"Basbug Fevzi Cakmak Pasa"

