l_english:
 #generic monarchist non-western tree
 #Politics
 GEN_MONARCHY_POL_start:0 "Old System, New Times"
 GEN_MONARCHY_POL_start_desc:0 "The Institution of the Monarchy has gone through many trials and tribulations in the Modern Era. However, we are determined to cling on to it, whether by reforming the office or doubling down on the Old Ways."
 GEN_MONARCHY_POL_Purge_Bureaucracy:0 "Align the Bureaucracy"
 GEN_MONARCHY_POL_Purge_Bureaucracy_desc:0 "In order for us to make any structural or legislative changes, we must first ensure that the bureaucracy is not staffed by those who would oppose our reforms."
 GEN_MONARCHY_POL_Meritocracy:0 "Encourage Meritocracy"
 GEN_MONARCHY_POL_Meritocracy_desc:0 "Our Civil Service should be staffed by those most capable of filling available positions. We will thus introduce a modern system of meritocratic training and examinations."
 GEN_MONARCHY_POL_Privaleged_Bureaucracy:0 "Privileged Bureaucracy"
 GEN_MONARCHY_POL_Privaleged_Bureaucracy_desc:0 "Civil Service positions should be reserved for our country's elite. Royalty, Nobility, and even influential Merchants should have the chance to influence bureaucratic appointments."
 GEN_local_bureaucracy:0 "Localized Bureaucracy"
 GEN_western_bureaucracy:0 "Westernized Bureaucracy"
 GEN_MONARCHY_POL_Western_System:0 "Cue from the West"
 GEN_MONARCHY_POL_Western_System_desc:0 "We will seek to emulate the Western Way of running a Government. If we seek to be respected on the world stage, we must adopt the ways of those who already are."
 GEN_MONARCHY_POL_Our_Own_Way:0 "The [This.GetAdjective] System"
 GEN_MONARCHY_POL_Our_Own_Way_desc:0 "Slavishly copying the Western Systems fails to take into account the practical realities in [This.GetNameDef]. Thus, we shall formulate a bureaucratic structure that meets our specific needs."
 GEN_MONARCHY_POL_Purge_Radicals:0 "Purge Radicals"
 GEN_MONARCHY_POL_Purge_Radicals_desc:0 "We must be wary of those who would seek to limit the Monarch's place in society. From outright Republicans to Constitutionalists, we must limit any chance of reforms gaining popular support."
 GEN_MONARCHY_POL_Place_For_The_Military:0 "A Place for the Military"
 GEN_MONARCHY_POL_Place_For_The_Military_desc:0 "We should allow the military to have political influence, in case our reforms get out of hand."
 GEN_military_influence:0 "Military Influence"
 GEN_MONARCHY_POL_Police:0 "Expand the Police"
 GEN_MONARCHY_POL_Police_desc:0 "Our police forces need more resources to fight modern crime, including political radicalism. Therefore, more funds will be directed to our law enforcement."
 GEN_MONARCHY_POL_Judges:0 "Align the Judiciary"
 GEN_MONARCHY_POL_Judges_desc:0 "Our Judicial Branch must be re-aligned so that judges that do not support the new bureaucratic organization are dismissed from office, and thus are less likely to rule against us."
 GEN_MONARCHY_POL_Monarchy_Survives:0 "Into the New Era!"
 GEN_MONARCHY_POL_Monarchy_Survives_desc:0 "The Monarchy has survived into the Modern Era! With the restructuring of the bureaucracy and elimination of opposition, we have ensured that the Monarchy, as an institution, will last forevermore!"
 GEN_reformist:0 "Reformism"
 GEN_reactionary:0 "Reactionarism"
 GEN_MONARCHY_POL_Modern_Structures:0 "Reform"
 GEN_MONARCHY_POL_Modern_Structures_desc:0 "We must seek to reform our state on modern centralist lines. The Monarchy and the Civilian Bureaucracy must not be beholden to outdated Clerical or Aristocratic interference."
 GEN_MONARCHY_POL_Traditional_Structures:0 "Reaction"
 GEN_MONARCHY_POL_Traditional_Structures_desc:0 "We must seek to maintain the power of our traditional institutions. The Nobility and the Clergy must have a strong influence on policy as a check to Monarchial Abuses."
 GEN_MONARCHY_POL_Curtail_Nobility:0 "Curtail the Nobility"
 GEN_MONARCHY_POL_Curtail_Nobility_desc:0 "The Nobility is an outdated symbol of feudalism, and worse, draws power away from the Monarch. We shall curtail their influence, though they will not appreciate it."
 GEN_MONARCHY_POL_Curtail_Clergy:0 "Limit the Clergy"
 GEN_MONARCHY_POL_Curtail_Clergy_desc:0 "We must curtail clerical influence on our country, though this may draw the clerics' ire. The Monarch rules here, not any diety!"
 GEN_MONARCHY_POL_Empower_Nobility:0 "Empower the Nobility"
 GEN_MONARCHY_POL_Empower_Nobility_desc:0 "The Nobility is an important [This.GetAdjective] Institution. We should seek to protect - or even expand - its influence on our country."
 GEN_MONARCHY_POL_Empower_Clergy:0 "Empower the Clergy"
 GEN_MONARCHY_POL_Empower_Clergy_desc:0 "The Clergy is the most sacred National Institution (behind the Monarchy, of course), so we must endeavour to expand clerical influence on society."
 GEN_MONARCHY_POL_Glory_to_the_Monarch:0 "Glory to the Monarchy!"
 GEN_MONARCHY_POL_Glory_to_the_Monarch_desc:0 "Whether we are going forwards or backwards, all should understand the power of the Monarchy. The Institution provides strength, stability, and hope to the people!"
 GEN_MONARCHY_POL_Social_Modernization:0 "Liberalize Society"
 GEN_MONARCHY_POL_Social_Modernization_desc:0 "Westernizing our country means social progression. Thus, we will improve Women's Rights, introduce modern fashion (and discourage traditional dress), promote ethnic equality, etc."
 GEN_social_modern:0 "Modern Society"
 GEN_social_backwards:0 "Traditional Society"
 GEN_MONARCHY_POL_Social_Reaction:0 "Keep the Social Order"
 GEN_MONARCHY_POL_Social_Reaction_desc:0 "The introduction of Western Progressivism would invite Radicalism and Republicanism. In order to keep our political order, we must reinforce the Traditional Social Order."
 GEN_MONARCHY_POL_Economy:0 "Analyze the Economy"
 GEN_MONARCHY_POL_Economy_desc:0 "We must take a look at our current economic structures to determine how to best reorganize it for the modern age."
 GEN_modern_economy:0 "Industrialization"
 GEN_MONARCHY_POL_Modern_Economy:0 "Cautious Modernization"
 GEN_MONARCHY_POL_Modern_Economy_desc:0 "To keep up with the West and to keep [This.GetAdjective] workers competative, we have to introduce new industries and industrial methods. However, with Western Economic Practices comes Western Economic Ideologies..."
 GEN_traditional_economy:0 "Traditional Economics"
 GEN_MONARCHY_POL_Traditional_Economy:0 "Economic Traditionalism"
 GEN_MONARCHY_POL_Traditional_Economy_desc:0 "We've spent centuries as an agrarian-merchant society, and we're doing just fine. We should resist the influence of modern economic structures, though new technology is always welcome."
 GEN_MONARCHY_POL_Statism:0 "Guide Economic Growth"
 GEN_MONARCHY_POL_Statism_desc:0 "The State should play an active role in encouraging and developing new industries. Subsidies and State-Owned Corporations would ensure that [This.GetAdjective] Industry has a base to grow on."
 GEN_economic_statism:0 "State-Directed Growth"
 GEN_free_market:0 "Market-Based Growth"
 GEN_MONARCHY_POL_Free_Market:0 "Free Market"
 GEN_MONARCHY_POL_Free_Market_desc:0 "A Liberal Economy would encourage our people to start building up their own industries, both great and small. However, we would have less say on how this is done, and with whom as business partners."
 GEN_MONARCHY_POL_Protectionism:0 "Protect Emerging Industries"
 GEN_MONARCHY_POL_Protectionism_desc:0 "We must encourage people to buy [This.GetAdjective], in order to ensure that our indsustries can survive to be competative on the world market."
 GEN_MONARCHY_POL_Imports:0 "Lower Trade Barriers"
 GEN_MONARCHY_POL_Imports_desc:0 "We must lower trade barriers in order to get the resources we need to build industry. Failing to do so would cause a sharp decrease in consumer activity."
 GEN_MONARCHY_POL_Education:0 "Improve Access to Education"
 GEN_MONARCHY_POL_Education_desc:0 "The revenue gained from our economic growth can be put to use improving access to education."
 GEN_education:0 "Education Spending"
 GEN_feudal_agriculture:0 "Feudal Structures"
 GEN_feudal_agriculture2:0 "Feudal Structures"
 GEN_MONARCHY_POL_Feudal_System:0 "Maintain Feudalist Structures"
 GEN_MONARCHY_POL_Feudal_System_desc:0 "Though somewhat modernized, the system of landowners and lieges works to our advantage, especially when it comes to keeping the country stable. We will maintain this system!"
 GEN_MONARCHY_POL_Military:0 "Import Western Weapons"
 GEN_MONARCHY_POL_Military_desc:0 "Instead of trying to develop our own arms industries, we will simply negotiate agreements for regular shipments from the West."
 GEN_MONARCHY_POL_Agrarianism:0 "Continue Agrarianism"
 GEN_MONARCHY_POL_Agrarianism_desc:0 "We do not need industry if our agriculture is sufficiently strong! It will give us something to trade, and give the people something to eat."
 GEN_MONARCHY_POL_Central_Bank:0 "The Central Bank"
 GEN_MONARCHY_POL_Central_Bank_desc:0 "Establishing a Central Bank would allow the population - both the common man and the elites - to better manage their money. This enables them to become more wealthy."