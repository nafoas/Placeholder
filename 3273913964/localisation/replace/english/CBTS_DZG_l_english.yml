 #ideas
 DZG_Polish_Economic_Control:0 "Polish Economic Control"
 DZG_Polish_Economic_Control_desc:0 "As per the Treaty of Versailles, The Free City of Danzig is technically an independent state, but in a customs union with Poland. The port of Westerplatte and the major Railway are controlled by Polish authorities, and Poland has a contingent of soldiers stationed in the city. Poland therefore controls the economy of Danzig, which is a major source of contention between the German Population - who could not have been more anti-Polish already - and the authorities.\n\nDanzig was Poland's principle port until the building of the Gdynia port. The Polish Authority has since made Gdynia their principle port, leading to a decline of the Danzig Economy."
 DZG_Racial_Discrimination:0 "Anti-Polish Sentiment"
 DZG_Racial_Discrimination_desc:0 "The Population of Eastern Germany never thought highly of the Poles. Danzigers in particular generally think of Poles and Slavs as scum, and their hatred of the Poles is bested only of their hatred of the Jewish population. Students are known to attack Poles in the street with the tacit approval of the Government.\n\nThe already anti-Polish views of the inhabitants (which was the basis behind the Free City in the first place) has been exacerbated by Polish economic and military restrictions. These feelings are definately not going away any time soon."
 DZG_Free_State:0 "Die Freistadt"
 DZG_Free_State_desc:0 "Being a League of Nations Free City, Danzig has been barred from building an army, navy, and air force. The closest thing to an armed forces is the Schutzpolizei, which serves as law enforcement. The Free City's government is controlled by the Volkstag (People's Diet), but the \"nation\" is represented abroad by the unelected High Commissioner, appointed by the League of Nations, and the Polish foreign ministry. This only serves to increase revanchist thought in the City."
