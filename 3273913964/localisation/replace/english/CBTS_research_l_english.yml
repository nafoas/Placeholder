 ###    Special Forces Technologies    ###
 
 mountain_infantry:0 "Mountain Infantry"
 mountain_infantry_desc: "Infantry units properly equipped for the harsh climate and fighting in mountainous terrain."
 tech_mountaineers:0 "Mountaineers I"
 tech_mountaineers_desc:0 "Combat in mountain ranges exposes troops to many perils, but sometimes cannot be avoided. We can minimize these risks by providing our soldiers with specialized training for this environment."
 tech_mountaineers2:0 "Mountaineers II"
 tech_mountaineers2_desc:0 "Going beyond survival, our forces can be trained to use mountains to their advantage. With light equipment and mule transports, they can maneuver this terrain better than other infantry."
 tech_mountaineers3:0 "Mountaineers III"
 tech_mountaineers3_desc:0 "Preparing for the most arduous mountain missions in high altitudes and low temperatures will require extraordinary training and discipline from our mountain troops."
 tech_mountaineers4:0 "Mountaineers IV"
 tech_mountaineers4_desc:0 "Preparing for the most arduous mountain missions in high altitudes and low temperatures will require extraordinary training and discipline from our mountain troops."
 tech_mountaineers5:0 "Mountaineers V"
 tech_mountaineers5_desc:0 "Preparing for the most arduous mountain missions in high altitudes and low temperatures will require extraordinary training and discipline from our mountain troops."
 airborne_infantry:0 "Airborne Infantry"
 airborne_infantry_desc:0 "With discoveries such as the airplane, parachuting specialized troops over enemy territory to secure key strategic positions could be vital for the success of an offensive army."
 paratroopers:0 "Paratroopers I"
 paratroopers_desc:0 "By incorporating airborne forces into our army, we can make forced entries and position key troops in previously inaccessible areas, allowing for new tactical opportunities."
 paratroopers2:0 "Paratroopers II"
 paratroopers2_desc:0 "Transitioning from small operations with only a few paratroopers to larger airborne divisions paves way for massive airborne landings, taking these forces beyond a novelty to a natural part of warfare."
 paratroopers3:2 "Paratroopers III"
 paratroopers3_desc:2 "Learning to adapt paradrop operations according to weather, standardizing equipment such as jump boots and extended specialized training will minimize the confusion and risks involved in these dangerous missions."
 paratroopers4:0 "Paratroopers IV"
 paratroopers4_desc:0 "Further training and more focus on coordination aswell as improved parachutes will grant airborne units better ability to attack and eliminate key positions for the enemy."
 naval_infantry:0 "Naval Infantry"
 naval_infantry_desc:0 "We must train specialized troops to be able to invade enemy territory and establish a beachhead for a later full-scale invasion."
 marines:0 "Marines I"
 marines_desc:0 "Troops specializing in amphibious warfare are growing ever more indispensable. Improvised methods and equipment become things of the past as our naval infantry is supported by specialized landing craft and training."
 marines2:0 "Marines II"
 marines2_desc:0 "Amphibious warfare requires constant innovation. Improved logistical support and portable harbors can enable our marines to perform landings that may otherwise have been impossible."
 marines3:0 "Marines III"
 marines3_desc:0 "Marines can be more than just amphibious infantry. In the future, our marine corps will be among the most disciplined and organized special forces."
 infantry_based_marines:0 "Amphibious Infantry"
 infantry_based_marines_desc:0 "The amphibious infantry, marines, is the most important element during a naval invasion. We must ensure that our troops are properly trained and ready for a naval assaut."
 mechanized_marines:0 "Mechanized Marines"
 mechanized_marines_desc:0 "Experiences has shown that it is often difficult to secure a beachhead during an invasion without armour support. We should seek to mechanize and equip our marines as much as possible with amphibious vehicles in order to easier secure a beachhead."
 marines4:0 "Marines IV"
 marines4_desc:0 "Marines can be more than just amphibious infantry. In the future, our marine corps will be among the most disciplined and organized special forces."
 marines5:0 "Marines V"
 marines5_desc:0 "Marines can be more than just amphibious infantry. In the future, our marine corps will be among the most disciplined and organized special forces."
 special_missions:0 "Special Missions"
 special_missions_desc:0 "Often cut off from supply and the support of other brigades, the special forces must be trained to execute missions with fine precision."
 improve_the_special_forces:0 "Improve Special Forces Program"
 improve_the_special_forces_desc:0 "Special Forces consists only of the highly trained elite soldiers in our nation. We should seek to improve the special forces with more training and strategic decision-making. Fight smarter, not harder!"
 expand_the_special_forces_program:0 "Expand Special Forces Program"
 expand_the_special_forces_program_desc:0 "In a time of need and despair the nation must first and foremost produce as many fighting units as possible. By focusing on quantity, we can amass a large force of special forces, capable of harassing and destroying the enemy."
 extensive_enviroment_training:0 "Extensive Enviromental Training"
 extensive_enviroment_training_desc:0 "We need to be able to fight in the harshest of environments. With the right training and equipment, our troops will be able to fight in the most extreme conditions."
 tech_special_forces:0 "Special Forces"
 tech_special_forces_desc:0 "Unconventional fighting requires specialist training. We need to ensure that our troops are prepared and able to adapt to harsh conditions."
 special_forces_infantry_support:0 "Infantry Support"
 special_forces_infantry_support_desc:0 ""
 semi_modern_special_forces:0 "Semi-Modern Special Forces"
 semi_modern_special_forces_desc:0 "Special Forces must be trained to be able to handle critical situations. Their position in the army is not to support the infantry, but rather to execute special operations across the frontlines."
 modern_special_forces:0 "Modern Special Forces"
 modern_special_forces_desc:0 "Special Forces are valuable for how they can support our infantry, and to soften our enemy. Our infantry will then later attack and destroy whatever they meet upon."
 
 
 
 ###    Infantry Technologies    ###
 
 improved_infantry_weapons1:0 "Improved Infantry Weapons I"
 improved_infantry_weapons1_desc:0 "Personal and crew served weapons for infantry as well as the various other bits of kit a soldier needs. Improved weapon models and more specialized equipment."
 improved_infantry_weapons2:0 "Improved Infantry Weapons II"
 improved_infantry_weapons2_desc:0 "Personal and crew served weapons for infantry as well as the various other bits of kit a soldier needs. Improved weapon models and more specialized equipment."
 improved_infantry_weapons3:0 "Improved Infantry Weapons III"
 improved_infantry_weapons3_desc:0 "Personal and crew served weapons for infantry as well as the various other bits of kit a soldier needs. Further Modernized to include personal Assault Rifles and anti-tank rockets. Improved availability of weapons previously distributed to a limited extent."
 improved_infantry_weapons4:0 "Improved Infantry Weapons IV"
 improved_infantry_weapons4_desc:0 "Personal and crew served weapons for infantry as well as the various other bits of kit a soldier needs. Further Modernized to include personal Assault Rifles and anti-tank rockets. Improved availability of weapons previously distributed to a limited extent."
 improved_infantry_weapons5:0 "Improved Infantry Weapons V"
 improved_infantry_weapons5_desc:0 "Personal and crew served weapons for infantry as well as the various other bits of kit a soldier needs. Further Modernized to include personal Assault Rifles and anti-tank rockets. Improved availability of weapons previously distributed to a limited extent."
 support_weapons1:0 "Support Weapons I"
 support_weapons1_desc:0 "More streamlined automatic weapons and sniper equipment will lead to a more deadly army."
 support_weapons2:0 "Support Weapons II"
 support_weapons2_desc:0 "Automatic weapons are becoming more portable. Submachine guns have already proven effective and the development of hand-held support weapons must continue."
 support_weapons3:0 "Support Weapons III"
 support_weapons3_desc:0 "The development of automatic weapons which combine the aspects of light and heavy machine guns allows versatility in how our infantry employ their equipment."
 support_weapons4:0 "Support Weapons IV"
 support_weapons4_desc:0 "While maintaining and improving reliability of machine guns, we can also experiment with higher firing rates to ensure lethality of the constant stream of bullets."
 support_weapons5:0 "Support Weapons V"
 support_weapons5_desc:0 "With the increased use of assault rifles, developing reliable automatic weapons that can be used in any environment by all soldiers is a priority for a modern army."
 night_vision:0 "Night Vision I"
 night_vision_desc:0 "Being able to see the enemy without being seen is key to night operations. With the invention of infra-red technology, we can outfit our army with devices which, though unwieldy, makes this possible."
 night_vision2:0 "Night Vision II"
 night_vision2_desc:0 "Early infra-red scopes, although initially intended for use by snipers, had a limited vision range. As both portability and vision improves, these devices can be used by more troops operating at night.""
 infantry_grenade:0 "Hand Grenade"
 infantry_grenade_desc:0 "Hand Grenades are small egg-formed explosive bombs that can be thrown thrown into enemy lines, where fragmentation will inflict heavy casualties on enemy infantry troops."
 infantry_mortar1:0 "Infantry Mortar I"
 infantry_mortar1_desc:0 ""
 infantry_mortar2:0 "Infantry Mortar II"
 infantry_mortar2_desc:0 ""
 improved_mechanised1:0 "Improved Mechanized I"
 improved_mechanised1_desc:0 "Improvements in the way Mechanized is used will make our Mechanized even deadlier than before."
 improved_mechanised2:0 "Improved Mechanized II"
 improved_mechanised2_desc:0 "Improvements in the way Mechanized is used will make our Mechanized even deadlier than before."
 improved_motorised1:0 "Improved Motorized"
 improved_motorised1_desc:0 "Improvements in the way Motorized is used will make our Motorized even deadlier than before."
 improved_rocket_motorised1:0 "Improved Motorized Rocket Artillery"
 improved_rocket_motorised1_desc:0 "Improvements in the way Rocket Artillery is used will make our Rocket Artillery even deadlier than before."
 
 ###    Industry Technologies    ###
 
 
 synth_oil_experiments:0 "Synthetic Oil Experiments"
 synth_oil_experiments_desc:0 "To reduce dependence on oil, processes to manufacture substitutes from other substances and materials can be researched."
 early_refining:0 "Early Refining"
 early_refining_desc:0 "Crude oil can be refined into a number of substances and materials vital to any modern war. Staying ahead in these methods will be necessary to build a modern industry."
 oil_processing:0 "Oil Processing"
 oil_processing_desc:0 "A network of factories for synthetic distillation and refining of oil products is the next step towards ensuring the fuel supply for our nation."
 improved_oil_processing:0 "Improved Oil Processing"
 improved_oil_processing_desc:0 "Moving previously experimental methods for distillation to large-scale operations will allow us to adapt better to available materials and needs."
 advanced_oil_processing:0 "Advanced Oil Processing"
 advanced_oil_processing_desc:0 "New experimental purification techniques like hydrotreating can be used in oil manufacturing to greatly improve the final product."
 modern_oil_processing:0 "Modern Oil Processing"
 modern_oil_processing_desc:1 "Our oil refinineries can be further improved with new advanced oil processing methods like hydrocracking, alkylation, mercaptan oxidation and isomerization."
 synth_rubber_experiments:0 "Synthetic Rubber Experiments"
 synth_rubber_experiments_desc:0 "To reduce dependence on rubber, processes to manufacture substitutes from other substances and materials can be researched, as we already have done with synthetic oil."
 rubber_processing:0 "Rubber Processing"
 rubber_processing_desc:1 "Industrial processing of synthetic rubber is needed to reduce our dependency on natural rubber."
 improved_rubber_processing:0 "Improved Rubber Processing"
 improved_rubber_processing_desc:1 "Large scale production of synthetic rubber is possible with new processes to accelerate dehydrogenation reactions."
 advanced_rubber_processing:0 "Advanced Rubber Processing"
 advanced_rubber_processing_desc:1 "A general purpose synthetic rubber recepie with improved processes such as dodecyl mercaptan polymerization modifiers will allow us to expand synthetic rubber production."
 modern_rubber_processing:0 "Modern Rubber Processing"
 modern_rubber_processing_desc:1 "Moving to more optimized polymerization processes will result in lower costs and higher output."
 fuel_silos:0 "Fuel Storage"
 fuel_silos_desc:0 "Mass Storage of fuel requires a complex set of tanks, pipes, and valves to ensure it is both secure and readily available."
 improved_fuel_silos:0 "Improved Fuel Storages"
 improved_fuel_silos_desc:0 "Storage of fuel requires tanks, pipes and valves. By improving our storages, we can both ensure that it's more secure, aswell as the maximum capacity can be expanded at any need."
 fuel_capacity1:0 "Fuel Capacity I"
 fuel_capacity1_desc:0 "With our modern machines and production, there will always be a need for fuel. If we expand our fuel capacity enough, we can be independent of our own fuel capacity in a time of war."
 fuel_capacity2:0 "Fuel Capacity II"
 fuel_capacity2_desc:0 "With our modern machines and production, there will always be a need for fuel. If we expand our fuel capacity enough, we can be independent of our own fuel capacity in a time of war."
 fuel_capacity3:0 "Fuel Capacity III"
 fuel_capacity3_desc:0 "With our modern machines and production, there will always be a need for fuel. If we expand our fuel capacity enough, we can be independent of our own fuel capacity in a time of war."
 fuel_capacity4:0 "Fuel Capacity IV"
 fuel_capacity4_desc:0 "With our modern machines and production, there will always be a need for fuel. If we expand our fuel capacity enough, we can be independent of our own fuel capacity in a time of war."
 fuel_capacity5:0 "Fuel Capacity V"
 fuel_capacity5_desc:0 "With our modern machines and production, there will always be a need for fuel. If we expand our fuel capacity enough, we can be independent of our own fuel capacity in a time of war."
 fuel_refining:0 "Fuel Refining I"
 fuel_refining_desc:0 "Advancements in chemical cracking allow for better yield of light fuels from oil."
 fuel_refining2:0 "Fuel Refining II"
 fuel_refining2_desc:0 "Better planning of refinery layouts reduce wastage of fuels."
 fuel_refining3:0 "Fuel Refining III"
 fuel_refining3_desc:0 "Improved reclamation methods allow refining fuel from by-products."
 fuel_refining4:0 "Fuel Refining IV"
 fuel_refining4_desc:0 "New developments in chemical engineering allow the refining of fuel from new sources."
 fuel_refining5:0 "Fuel Refining V"
 fuel_refining5_desc:0 "Using new methods and improved layouts in the construction of refineries dramatically increases throughput while reducing wastage."
 fuel_refining6:0 "Fuel Refining VI"
 fuel_refining6_desc:0 "Using new methods and improved layouts in the construction of refineries dramatically increases throughput while reducing wastage."
 fuel_refining7:0 "Fuel Refining VII"
 fuel_refining7_desc:0 "Using new methods and improved layouts in the construction of refineries dramatically increases throughput while reducing wastage."
 fuel_refining8:0 "Fuel Refining VIII"
 fuel_refining8_desc:0 "Using new methods and improved layouts in the construction of refineries dramatically increases throughput while reducing wastage."
 anti_bombing_measures1:0 "Anti-bombing Measures I"
 anti_bombing_measures1_desc:0 "If we want to ensure the continuous wartime production as we currently have, we need to prepare both the military production and the civilian population to counteract the enemy bombing. By expanding and improving the use of air raid sirens, blackouts and air raid shelters, we will then limit the damage of the bombers."
 anti_bombing_measures2:0 "Anti-bombing Measures II"
 anti_bombing_measures2_desc:0 "Having previously focused on what we can do to protect our industry, we've come to realise that we can also initialize measures to destroy the enemy bombers. Strengthening the anti-air installations in our cities should sooner or later deplete the enemy of their bomber-force."
 great_war_assembly_line:0 "Great War Assembly Line"
 great_war_assembly_line_desc:0 "First modern assembly lines - this will help expanding our production."
 factory_electrification:0 "Factory Electrification"
 factory_electrification_desc:0 "Finalizing the electrification of our factories will give a higher production efficiency."
 interwar_machine_tools:0 "Interwar Machine tools"
 interwar_machine_tools_desc:0 ""
 concentrated_production:0 "Concentrated Production"
 concentrated_production_desc:0 "With the increased attention around the maximum capacity of our production, we can improve the methods and expand this limit, which would lead to a bigger production."
 versatile_production:0 "Versatile Production"
 versatile_production_desc:0 "Focusing on improving the structure and organization around the production, we can reach our production limit at a faster rate."
 mass_production_1:0 "Mass Production"
 mass_production_1_desc:0 "With assembly lines we can specialize parts of our industry to for better production effiency."
 mass_production_2:0 "Improved Mass Production"
 mass_production_2_desc:0 "As we expand our factories we can also expand our mass production methods, and implement it on a larger scale which will give higher production output."
 improved_assembly_line:0 "Improved Assembly Lines"
 improved_assembly_line_desc:0 "By improving the already implemented assembly lines, we can make them more reliable and efficient."
 advanced_assembly_line:0 "Advanced Assembly Lines"
 advanced_assembly_line_desc:0 "By improving the already implemented assembly lines, we can make them more reliable and efficient."
 modern_assembly_line:0 "Modern Assembly Lines"
 modern_assembly_line_desc:0 "By improving the already implemented assembly lines, we can make them more reliable and efficient."
 industry1:0 "Improved Industrial Capacity I"
 industry1_desc:0 "Expanding and improving earlier methods of production, we can expand our industrial capacity which will allow us to produce at a higher and more efficient way, improving our production in both the aspects of quality and quantity."
 industry2:0 "Improved Industrial Capacity II"
