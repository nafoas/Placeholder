 light_aircraft_desc:0 "The first planes, only posessing one engine, these planes are designed for use by a single person. These planes form the main body of any airforce, where they produce great results at a relative low cost."
 medium_aircraft_desc:0 "Planes that have dual-engines and are usually manned by more than a single person. These planes do excellent in bombing missions, or to intercept bombing missions."
 heavy_aircraft_desc:0 "Heavy Planes fitted with quad-engines, which allows these planes fly at a high altitude and carry a huge number of explosives, however it does have a high cost, both in production and in personell."
 
 ###    Land Doctrine Technologies    ###
 
 totale_krieg:0 "Total War"
 totale_krieg_desc:0 "The conflict which decides our faith, our future and our history will either be an enormous failure or a great success. To ensure we stand as victors after this conflict, we must mobilize every man and woman in our country to work on a collective goal of victory. If we don't achieve victory, we will be dust in the books of history." 
 concentration_of_tanks:0 "Concentration of Tanks"
 concentration_of_tanks_desc:0 "The tanks’ role in the great war was to support the infantry and let the infantry break through. Evidently by how defences worked, this wasn’t very effective, partly because the tanks had to wait for the infantry to pursue any weakness. By concentrating our tanks in battalions, or even in whole divisions, we can attack our enemy so swiftly that they wouldn’t have time to react."
 battle_of_annihilation:0 "Battle of Annihilation"
 battle_of_annihilation_desc:0 "To defeat our enemy, we must destroy them on a tactical level. With an overwhelming force we can deal a fatal blow to our enemy’s armies, and without any armies they will stand undefended against us. We will fight to the death if necessary."
 counter-battery_fire:0 "Counter-battery fire"
 counter-battery_fire_desc:0 "The weapons in the battlefield which deal the most damage are those who can endlessly attack us while they are protected. If we manage to locate where the enemy are firing from, we can attack their position, and repel their attacks."
 force_of_will:0 "Force of will"
 force_of_will_desc:0 "Defeating an enemy through sheer power will never succeed without the peoples’ and the soldiers’ will on our side. With enough encouragement, our troops will attack like there is no afterlife, for their sole goal is to fight, fight and only fight."
 
 human_wave_doctrine:0 "Human Wave Doctrine"
 static_defense:0 "Static Defense"
 infiltration_tactics:0 "Infiltration Tactics"
 artillery_barrage:0 "Artillery Barrage"
 defence_in_depth2:0 "Defence in Depth"
 total_war:0 "Tank Warfare"
 WW1_DOCTRINE_TITLE:0 "GREAT WAR DOCTRINE"
 WW1_DOCTRINE_DESC:0 "Experiences and tactics evolved from the Great War."
 
 ###    Support Company Technologies    ###
 
 interwar_artillery:0 "Artillery Upgrade I"
 interwar_artillery_desc:0 "With more modern materials and mechanisms, howitzers and field guns from the Great War can be rechambered and modernized for modern warfare."
 artillery2:0 "Artillery Upgrade II"
 artillery2_desc:0 "Upgrading old pieces can only get us so far. New howitzer designs will be needed, taking advantage of new hydraulic recoil devices and longer barrels."
 artillery3:0 "Artillery Upgrade III"
 artillery3_desc:0 "To enable heavier guns on lighter carriages, muzzle brakes can be included in howitzer designs."
 artillery5:0 "Artillery Upgrade IV"
 artillery5_desc:0 "Artillery designs with lower silhouettes will be more difficult for the enemy to target."
 artillery7:0 "Artillery Upgrade V"
 artillery7_desc:0 "Lessons learned in the development of different types of artillery can be cross-applied to the design of other pieces."
 artillery9:0 "Artillery Upgrade VI"
 artillery9_desc:0 "Developing light-weight artillery capable of being broken down for transport will make it possible to bring artillery support to areas previously difficult to reach."
 mountain_gun:0 "Mountain Gun"
 mountain_gun_desc:0 "The mountainous terrain of Northern India led to the development of an artillery piece that could be dismantled and carried on muleback to wherever it was needed."
 rocket_artillery2:0 "Rocket Artillery Upgrade I"
 rocket_artillery2_desc:0 "Self-propelled artillery utilizing multiple rockets will be able to cause large-scale destruction rapidly, while maintaining mobility to avoid counter-fire."
 rocket_artillery3:0 "Rocket Artillery Upgrade II"
 rocket_artillery3_desc:0 "Sacrificing range for impact, we can mount heavier rockets on larger vehicles. Operating in teams, these artillery batteries can cooperate to reload and relocate quickly."
 rocket_artillery5:0 "Rocket Artillery Upgrade III"
 rocket_artillery5_desc:0 "Spin-stabilized rockets can increase the range of lighter artillery batteries."
 rocket_artillery7:0 "Rocket Artillery Upgrade IV"
 rocket_artillery7_desc:0 "Further analysis of the rocket artillery indicates that improvement of the rocket projective is necessary to make rocket artillery more deadly in the field."
 antiair1:0 "Anti-Air Upgrade I"
 antiair1_desc:0 "Experience from the Great War allows us to develop the way Anti-Air equipment is utilized."
 antiair3:0 "Anti-Air Upgrade II"
 antiair3_desc:0 "To target high-flying aircraft, longer cartridges and barrels will be needed on anti-air guns."
 antiair4:0 "Anti-Air Upgrade III"
 antiair4_desc:0 "With faster reloading mechanisms, anti-air guns carrying large rounds can still maintain necessary firing rates."
 antiair6:0 "Anti-Air Upgrade IV"
 antiair6_desc:0 "Surface-to-air missiles are the future of anti-aircraft warfare. Developing a mobile platform for these should be our next goal."
 antiair8:0 "Anti-Air Upgrade V"
 antiair8_desc:0 "As radar systems improve, employing radar direction of anti-aircraft guns becomes more viable. Keeping up with this technology will allow us to make some of the most accurate anti-air systems available."
 antiair9:0 "Anti-Air Upgrade VI"
 antiair9_desc:0 "Combining modern systems of radar, computerization and autoloaders will be necessary to react quickly against faster aircraft."
 antiair11:0 "Anti-Air Upgrade VII"
 antiair11_desc:0 "Using modern computers we can better calculate and aim against the enemy air support."
 antitank1:0 "Anti-Tank Upgrade I"
 antitank1_desc:0 "The importance of effective anti-tank weapons was established in the Great War. Introducing a new generation of these weapons will be necessary to combat modern tank designs."
 antitank3:0 "Anti-Tank Upgrade II"
 antitank3_desc:0 "Most anti-tank guns are so far fairly light. Larger caliber guns will be required to combat heavier tanks with sloped armor."
 antitank4:0 "Anti-Tank Upgrade III"
 antitank4_desc:0 "New versatile anti-tank guns employing armor-piercing discarding sabot shots can penetrate the armor of nearly any tank."
 antitank6:0 "Anti-Tank Upgrade IV"
 antitank6_desc:0 "HEAT (high-explosive anti-tank) rounds can be used in anti-tank artillery to make up for limited muzzle velocity."
 antitank9:0 "Anti-Tank Upgrade V"
 antitank9_desc:0 "Better rounds for better piercing of enemy armour."
 
 ###    Support Company Technologies    ###
 
 tech_recon:0 "Recon Company I"
 tech_recon_desc:0 "Sending smaller groups to scout ahead before moving in the main force allows us to gather intelligence about where the enemy is and how many we are facing."
 tech_recon2:0 "Recon Company II"
 tech_recon2_desc:0 "Reconnaissance missions are often dangerous and casualties are high. Preparing our patrols to move and withdraw rapidly and equipping them to clear obstacles placed by the enemy will increase their chances of coming back alive."
 tech_recon3:0 "Recon Company III"
 tech_recon3_desc:0 "Improvements in radio technology change the way reconnaissance missions can be executed, enabling rapid communication of the gathered intelligence."
 tech_recon4:0 "Recon Company IV"
 tech_recon4_desc:0 "Deep reconnaissance operations, mixing espionage, guerilla operations and commando training, will aid our tactical choices and allow us to adapt our decision-making rapidly."
 tech_recon5:0 "Recon Company V"
 tech_recon5_desc:0 "Reconnaissance relies on spotting and sending intelligence, improving operational structures would allow us to deploy and withdraw at a higher pace."
 tech_engineers:0 "Engineer Battalion I"
 tech_engineers_desc:0 "Construction of fortifications and breaching obstacles make combat engineers vital in the field. Giving our engineers a versatile role enables us to deploy them in the diverse situations where they will be needed."
 tech_engineers2:0 "Engineer Battalion II"
 tech_engineers2_desc:0 "With modern equipment and high explosives, our engineers can go beyond their traditional tasks and surprise the enemy with their ingenuity, at land and sea."
 tech_engineers3:0 "Engineer Battalion III"
 tech_engineers3_desc:0 "Military engineering projects are approaching a larger scale. The construction of advanced infrastructural aid enables operations requiring supplies beyond what is normally available in the field."
 tech_engineers4:0 "Engineer Battalion IV"
 tech_engineers4_desc:0 "Maintaining local mobility while constructing what would previously have been considered permanent fortifications and supply systems, combat engineers of the future will ensure that no matter where our troops are attacked, they will be prepared."
 tech_engineers5:0 "Engineer Battalion V"
 tech_engineers5_desc:0 "Expanding the tools available for the engineering unit let's them improve their ingenuity and give us an infrastructural and structural advantage over our enemies."
 hospital_tech:0 "Field Hospitals"
 logistics_tech:0 "Logistics Company"
 recon_tech:0 "Reconnaissance Company"
 tech_field_hospital:0 "Field Hospital I"
 tech_field_hospital_desc:0 "A casualty doesn't need to mean a dead soldier. Having immediate medical attention available for our wounded brought back to the rear is the first step towards ensuring this."
 tech_field_hospital2:0 "Field Hospital II"
 tech_field_hospital2_desc:0 "By establishing the use of portable hospitals, bringing the medical care to where it is needed, we can stop many unnecessary deaths and permanent injuries."
 tech_field_hospital3:0 "Field Hospital III"
 tech_field_hospital3_desc:0 "Surgery is among the most common emergency procedures needed in the field. Procedures and tools for this must be available closer to the front, and we must ensure that skilled surgeons are part of the military medical units."
 tech_field_hospital4:0 "Field Hospital IV"
 tech_field_hospital4_desc:0 "Although many improvements have been made in field medicine, many advances are improvised and we lack an established doctrine. With more experience, we can explain the role of these units more clearly and make improvised innovations permanent fixtures."
 tech_field_hospital5:0 "Field Hospital V"
 tech_field_hospital5_desc:0 ""
 tech_logistics_company:0 "Logistics Company I"
 tech_logistics_company_desc:0 "Having specialized Logistics Officers among our ranks will ensure that support networks are leveraged to minimize waste."
 tech_logistics_company2:0 "Logistics Company II"
 tech_logistics_company2_desc:0 "Adapting our risk analyses to the new circumstances of war will improve the safety of our logistical support."
 tech_logistics_company3:0 "Logistics Company III"
 tech_logistics_company3_desc:0 "Continued statistical evaluation of troop supply needs contribute to maximizing the utility of our resources."
 tech_logistics_company4:0 "Logistics Company IV"
 tech_logistics_company4_desc:0 "Developing standardized classifications for supplies will minimize confusion and make planning more efficient."
 tech_logistics_company5:0 "Logistics Company V"
 tech_logistics_company5_desc:0 ""
 tech_military_police:0 "Military Police I"
 tech_military_police_desc:0 "Regular troops may be able to manage occupation for a shorter period of time, but they are first and foremost soldiers. Integrating military police into our forces will ensure we have people on the ground to respond to resistance and investigate sabotage."
 tech_military_police2:0 "Military Police II"
 tech_military_police2_desc:0 "By engaging in regular police duties in occupied territories, such as traffic control and maintaining public order, our military police can minimize the chaos and confusion which partisan movements thrive in."
 tech_military_police3:0 "Military Police III"
 tech_military_police3_desc:0 "Cooperating with local spy networks and informers established before occupation, our military police can proactively prepare for where resistance is likely to arise."
 tech_military_police4:0 "Military Police IV"
 tech_military_police4_desc:0 "Safely policing occupied territory is as much about returning to normalcy as it is about ruthlessly eliminating opposition. Our military police must ensure that this process starts early, to ensure safety for soldiers and civilians alike."
 tech_military_police5:0 "Military Police V"
 tech_military_police5_desc:0 ""
 tech_signal_company:0 "Signal Company I"
 tech_signal_company_desc:0 "Establishing and maintaining communications in the field has always required special skills. With the advent of new communications and detection technology in the Great War, new possibilities for the practice lie ahead."
 tech_signal_company2:0 "Signal Company II"
 tech_signal_company2_desc:0 "Signal companies focusing on communication between the different branches of the military can ensure that ground forces are able to coordinate efforts with sea and air operations and plan their movements more rapidly."
 tech_signal_company3:0 "Signal Company III"
 tech_signal_company3_desc:0 "Increasingly portable communications technology is more viable to be personally carried as a backpack. This increased mobility of signal corps must be utilized."
 tech_signal_company4:0 "Signal Company IV"
 tech_signal_company4_desc:0 "Among our signal specialists are people with unparalleled first-hand knowledge of field use of this equipment. By involving them in the research of new communication technologies, we can make use of their expertise."
 tech_signal_company5:0 "Signal Company V"
 tech_signal_company5_desc:0 ""
 tech_maintenance_company:0 "Maintenance Company I"
 tech_maintenance_company_desc:0 "Maintenance, repair and overhaul are important to keep military equipment reliable and safe to use. Having companies dedicated to this will ensure that it's given appropriate attention."
 tech_maintenance_company2:0 "Maintenance Company II"
 tech_maintenance_company2_desc:0 "Routine operational maintenance procedures minimize the risks of equipment breaking down and alerts troops to replace it before it does."
 tech_maintenance_company3:0 "Maintenance Company III"
 tech_maintenance_company3_desc:0 "Making sure that our troops always have the basic materials in the field to perform common repairs will prevent the continued use of equipment known to be damaged."
 tech_maintenance_company4:0 "Maintenance Company IV"
 tech_maintenance_company4_desc:0 "Experiences with designing for active redundancy in the Great War can be renewed to work with more modern equipment to make maintenance easier."
 tech_maintenance_company5:0 "Maintenance Company V"
 tech_maintenance_company5_desc:0 ""
 
 ###    USA Technologies    ###
 
 skip_bombing:0 "Skip Bombing"
 skip_bombing_desc:0 ""
 
 ###    Air Doctrine Technologies    ###
 
 naval_bombing:0 "Naval Bombing"
 naval_bombing_desc:0 "Bombing key harbours and ports could potentially give us an advantage on the theatre of war."
 
 ###    Engineering Technologies    ###
 
 diesel_engine:0 "Diesel Engine"
 diesel_engine_desc:0 "Engines capable of compressing air and fuel into harvesting energy has already made previous steam engines obsolete. The diesel engine is a necessarity to any modern vehicle."
 tank_engine1:0 "Tank Engine I"
 tank_engine1_desc:0 "A rudimental yet powerful and fuel-consuming engine that is fitted to move the tank."
 tank_engine2:0 "Tank Engine II"
 tank_engine2_desc:0 "As armoured warfare is developing rapidly it is fundamental to improve the heart of any tank; the tank engine. By basing our new tank engines off an aircraft engine we will ensure that it has enough power."
 tank_engine3:0 "Tank Engine III"
 tank_engine3_desc:0 "Armoured tanks have gone from being a niche weapon in the Great War to being an essential tool in conducting an offensive in todays war. It is necessary to develop new tank engines so we may manufacture more power, faster and bulkier tanks than before!"
 tank_engine4:0 "Tank Engine IV"
 tank_engine4_desc:0 "Tank engines need to be not only as powerful as the tank demands, but also be reliable, easy to repair and little fuel-consuming."
 plane_engine1:0 "Aircraft Engine I"
 plane_engine1_desc:0 "If we want to produce anything that's capable of flying, it is necessary for us to have proper engines that fits in an airframe yet powerful enough to keep the vehicle over ground."
 jet_engines:0 "Jet Engines"
 plane_engine2:0 "Aircraft Engine II"
 plane_engine2_desc:0 "The future of aerial doctrine is said to be with the bomber. Earlier aircraft engines must be upgraded to increase its' range, speed and power to ensure we can bomb enemy territory, aswell as defend ours."
 plane_engine3:0 "Aircraft Engine III"
 plane_engine3_desc:0 "The interwar engines' speed, maneuverability and range has become obsolete with new technology, airframes and aerial doctrine all demanding a more powerful engine. Aerial warfare is in constant change, and having the best aircraft engine will be vital if we wish to win any war."
 early_radar:0 "Early Radar"
 early_radar_desc:0 ""
 monopulse_radar:0 "Monopulse Radar"
 monopulse_radar_desc:0 ""
 modern_radar:0 "Modern Radar"
 modern_radar_desc:0 ""
 radio:0 "Radio"
 radio_desc:0 "Adopting the inventions of amateur radio operators and extending the use of FM radio will reduce radio interference and allow us to find new uses for radio technology."
 early_radar:0 "Early RADAR"
 early_radar_desc:0 "The development of RADAR, Radio Detection and Ranging, allows using radio waves to detect physical objects. Research is highly secretive, considering the impact these inventions could have on locating units."
 decimetric_radar:0 "Decimetric Radar"
 decimetric_radar_desc:0 "Many units rely on the element of surprise for their efficiency. Development of decimetric radar allows us to deprive them of this advantage."
 improved_decimetric_radar:0 "Improved Decimetric Radar"
 improved_decimetric_radar_desc:0 "The use of radar has already proven crucial, but our decimetric radar sets are too few to ensure good coverage. Fitting more units with radar will allow us to maximize our technological edge."
 centimetric_radar:0 "Centimetric Radar"
 centimetric_radar_desc:0 "New radar operating in the microwave bands enable us to detect objects too small for previous radars to pick up."
 improved_centimetric_radar:0 "Improved Centimetric Radar"
 improved_centimetric_radar_desc:0 "Introducing cutting-edge radar techniques like monopulse radars in key operations will allow for extreme tracking accuracy."
 advanced_centimetric_radar:0 "Advanced Centimetric Radar"
 advanced_centimetric_radar_desc:0 "Despite our advanced radars, there are still ways for the enemy to avoid detection. New developments like the Pulse-Doppler radar allows us to eliminate many of these limitations in our equipment."
 analog_computers:0 "Analog Computers"
 analog_computers_desc:0 "Constructing machines capable of advanced differential analysis will radically change what sort of machine-assisted calculations can be made."
 early_electromechanical_computers:0 "Early Electromechanical Computers"
 early_electromechanical_computers_desc:0 "Developing a theoretical groundwork for modern computers and constructing electromechanical machines to start putting them into practice will be the first steps into this realm of possibilities."
 enigma_machine_tech: "Enigma Machine"
 bombe_tech: "Bombe"
 cryptologic_bomb_tech: "Bomba kryptologiczna" #Bomba or Cryptologic Bomb
#  improved_electromechanical_computers:0 "Improved Electromechanical Computers"
#  improved_electromechanical_computers_desc:0 "Electronic digital computers can now be made which are programmable. Although still expensive and large, these machines allow for intelligence analysis far beyond human capacity."
#  electromechanical_computer:0 "Electromechanical Computer"
#  electromechanical_computer_desc:0 "Beginning to work on computers capable of storing programs and making use of transistors will put us on the path to a Digital Revolution where these machines may be used in nearly any field."
 basic_encryption:1 "Encryption - Polyalphabetical Ciphers"
 basic_encryption_desc:0 "With new methods of communication comes new risks for interception. Rotor cipher machines can be used to allow for rapid, complex encryption."
 improved_encryption:1 "Encryption - Cyclic Permutations"
 improved_encryption_desc:0 "Limitation in the randomization of cipher machines can be exploited to break the ciphers. By improving the randomness of the rotor mechanics, we can make this kind of cryptanalysis more difficult."
 advanced_encryption:1 "Encryption - Pulse-code Modulation"
 advanced_encryption_desc:0 "Technological improvements and hard-earned experience allows us to implement more traffic flow security measures in our communication."
 semi_modern_encryption:1 "Semi-modern Encryption"
 semi_modern_encryption_desc:0 "Encryption for the semi-modern era1"
 modern_encryption:1 "Modern Encryption"
 modern_encryption_desc:0 "Encryption for the modern era!"
 basic_decryption:1 "Decryption - Frequency Analysis"
 basic_decryption_desc:0 "Cryptanalysis is increasingly becoming an advanced mathematical science. Systems like card catalogs and devices like cyclometers can aid the necessary work."
 improved_decryption:1 "Decryption - Side-channel Attack"
 improved_decryption_desc:0 "The development of more sophisticated computers allows for new applications of cryptanalysis methods like differencing, which can be used to break advanced cyphers when combined with new hand codebreaking methods."
 advanced_decryption:1 "Decryption - Automated Deduction"
 advanced_decryption_desc:0 "The increased computation power that improved our cryptanalysis so far threatens to create nearly unbreakable ciphers in the future. To stay ahead, we must be prepared to work more aggressively on gaining inside information on the technology."
 semi_modern_decryption:1 "Semi-modern Decryption"
 semi_modern_decryption_desc:0 "Decryption for the semi-modern era!"
 modern_decryption:1 "Modern Decryption"
 modern_decryption_desc:0 "Decryption for the modern era!"
 nuclear_physics:0 "Nuclear Research"
 nuclear_physics_desc:0 "Ever since the discovery of the neutron in 1932, have the potential in the atomic field has exploded. If we pursue the secrets of the atom, whatever we find is sure to change the future for the next generation, possibly forever."
 atomic_research:0 "Atomic Research"
 atomic_research_desc:0 "In nuclear fission, splitting the atom yields enormous amounts of energy and limitless destructive capability."
 nuclear_res:0 "Nuclear Physics"
 nuclear_res_desc:0 "By researching deeper into the physics of the atom, we can potentially yield weapons of mass destruction."
 nucelar_production:0 "Expanded Nuclear Production"
 nucelar_production_desc:0 "We can improve the production and deployment of our nukes. In this new world, we will be gods."
 elemental_fire_control_system:0 "Elemental Fire Control System"
 elemental_fire_control_system_desc:0 "Improved communications with the bridge and improved optics gives us better oportunities of firing, and improves coordination."
 basic_fire_control_system:0 "Basic Fire Control System"
 basic_fire_control_system_desc:0 "All fire of the ship's guns is controlled from a central position, ensuring a tighter grouping of shots and increases accuracy."
 improved_fire_control_system:0 "Improved Fire Control System"
 improved_fire_control_system_desc:0 "By entering course, speed and distance of a target, a mechanical computer can accurately predict where the target will be when the next salvo is ready to fire."
 advanced_fire_control_system:0 "Advanced Fire Control System"
 advanced_fire_control_system_desc:0 "A large and complex mechanical computer that tracks a large number of inputs about both the target, the firing ship as well as weather conditions and sea state allows very accurate ballistic calculations."
 modern_fire_control_system:0 "Modern Fire Control System"
 modern_fire_control_system_desc:0 "A large and convoluted computer tasked identifying, targetting and firing at the enemy ships."
 ship_radar1:0 "Decimetric Naval Search Radar"
 ship_radar1_desc:0 "Radar equipment fitted for a central positioning within ships, which would easier spot, locate and target enemy ships."
 ship_radar2:0 "Improved Decimetric Naval Search Radar"
 ship_radar2_desc:0 "Radar equipment fitted for a central positioning within ships, which would easier spot, locate and target enemy ships."
 ship_radar3:0 "Centrimetric Gunnery Radar"
 ship_radar3_desc:0 "Radar equipment fitted for a central positioning within ships, which would easier spot, locate and target enemy ships."
 ship_radar4:0 "Integrated Fire Control Radar"
 ship_radar4_desc:0 "Radar equipment fitted for a central positioning within ships, which would easier spot, locate and target enemy ships."
 ship_radar5:0 "Modern Fire Control Radar"
 ship_radar5_desc:0 "Radar equipment fitted for a central positioning within ships, which would easier spot, locate and target enemy ships."
