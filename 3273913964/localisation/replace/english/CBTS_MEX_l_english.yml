  MEX_valor:0 "Valor"
  MEX_valor_desc:0 "W.I.P"
  MEX_lealtad:0 "Lealtad"
  MEX_lealtad_desc:0 "W.I.P"
  
  #Cardenas 1
  MEX_cardenaspresidency:0 "President Cardenas"
  MEX_cardenaspresidency_desc:0 "After a \"close\" election Lazaro Cardenas has been sworn as president. Another loyal puppet of the Jefe Máximo, right?"
  MEX_adopttheplansexenial:0 "Adopt the Plan Sexenial"
  MEX_adopttheplansexenial_desc:0 "The \"Plan Sexenial\" was a six year plan designed by the Cardenistas in the goverment to help industralize México and kickstart its economy. We must now adopt it and continue Mexico's progress foward."
  MEX_secularismnotatheism:0 "Secularism not Atheism"
  MEX_secularismnotatheism_desc:0 "While Calles´s Policies were to end religión in México, we know that doing so will destroy Mexican culture. As such the church will be respected, but removed from politics"
  MEX_reducechurchinfluence:0 "Reduce Church Influence"
  MEX_reducechurchinfluence_desc:0 "While Calles´s policies have reduce church influence, the Church still retains considerable power in the local governments. We need to put an end to that."
  MEX_disbandthecrpi:0 "Disband the CRPI"
  MEX_disbandthecrpi_desc:0 "The CRPI is a big organization, we need to get rid of it. If we can´t, we must at least try to destroy their political power."
  MEX_animportantmorning:0 "An Important Morning"
  MEX_animportantmorning_desc:0 "The plan is ready, the pieces are set, and we have the excuse. It is time for the \"Jefe Máximo\" to leave the country he has worked so hard to oppress."
  MEX_thepresidentknowsbest:0 "The President Knows Best"
  MEX_thepresidentknowsbest_desc:0 "While the \"Jefe Máximo\" still calls the shots, Cardenas is getting more say power in the government, which has Calles on high alert."
  MEX_reducetreviotoafigurehead:0 "Reduce Treviño to a Figurehead"
  MEX_reducetreviotoafigurehead_desc:0 "After many complaints from Treviño about Cardenas, he made a move essentially forcing him into the background. While Calles decided not to say anything, it is very obvious that he is suspicious."
  MEX_meetingsintheparty:0 "Meetings in the Party"
  MEX_meetingsintheparty_desc:0 "Cardenas has begun some closed discussions with important party members. It looks like he is planning something, but who knows what?"
  MEX_expandourinfluence:0 "Expand our Influence"
  MEX_expandourinfluence_desc:0 "Cardenas is gaining supporters within the party and while that is not bad at first sight, Manuel Treviño, the party leader, is worried about what could happen next."
  MEX_disbandthepnar:0 "Disband the PNAR"
  MEX_disbandthepnar_desc:0 "While PNAR isn´t very influenctial on its own. However its leaders are. We need to make sure they don´t unify, or they will be a danger"
  MEX_createthecnc:0 "Create the CNC"
  MEX_createthecnc_desc:0 "The \"Confederación Nacional Campesina\" will be created to help farmers organize and get more say in the government. It will be lead by politician Graciano Sánchez"
  MEX_createthectm:0 "Create the CTM"
  MEX_createthectm_desc:0 "The \"Confederación de Trabajdores Mexicanos\" will be created to give workers a better say, and it will be lead by Socialist politician and activist, Vicente Lombardo Toledano"
  
  #Cardenas2
  MEX_backdownonsocialisteducation:0 "Back down on Socialist Education"
  MEX_backdownonsocialisteducation_desc:0 "The most important problem with socialist education is the anti-clerical influence on it. Beacause of this we will cooperate with the church to educate the people"
  MEX_removetoledano:0 "Remove Toledano"
  MEX_removetoledano_desc:0 "Toledano has showed his true face, and because of the weakening of the CTM, the president was able to relpace him with Fidel Velásquez"
  MEX_preservetheconstitution:0 "Preserve the Constitution"
  MEX_preservetheconstitution_desc:0 "Recent occurences in politics are not enough to warrant a change in the Constitution, and as such the document will stay intact"
  MEX_reformtheejidosystem:0 "Reform the Ejido System"
  MEX_reformtheejidosystem_desc:0 "The Ejido System has helped a lot of people, but it is flawed and as as such it must be fixed"
  MEX_laborlawsreforms:0 "Labor Laws Reforms"
  MEX_laborlawsreforms_desc:0 "Labor Laws must be implemented to make sure that the worker-employer relationship remains healthy and respectful"
  MEX_limitcncspower:0 "Limit CNC´s Power"
  MEX_limitcncspower_desc:0 "While the CNC has done a lot of good things, reports of corruption and power abuse has forced the president to limit it´s influence in government"
  MEX_moderatedreforms:0 "Moderated Reforms"
  MEX_moderatedreforms_desc:0 "Cardenas has decided to promote his reforms in a more moderate way and push them by compromising"
  MEX_oilimprovement:0 "Oil Improvement"
  MEX_oilimprovement_desc:0 "With his plans to expand the economy, Cardenas decided to begin investment in the Oil Industry"
  MEX_limitedlandreform:0 "Limited Land-Reform"
  MEX_limitedlandreform_desc:0 "While we all know that a land reform is necessary, doing it in the scale proposed will do more bad than good. Therefore the reform will be limited"
  MEX_controlednationalization:0 "Controled Nationalization"
  MEX_controlednationalization_desc:0 "Now that deals have been made, and a compromise has been reached, we will nationalize our oil while giving a 10% share to the oil companies for 3 years"
  MEX_secularenforcement:0 "Secular Enforcement"
  MEX_secularenforcement_desc:0 "The Church is still excerting significant influence on the policies of the government. That is intolerable and must be dealt with now."
  MEX_socialistidemocracy:0 "Social Democracy"
  MEX_socialistidemocracy_desc:0 "Democarcy is the most important part of México, and as such it shall be maintained and defended"
  MEX_compromisewiththebritish:0 "Compromise with the British"
  MEX_compromisewiththebritish_desc:0 "The Company ¨Petróleo El Águila¨ is the main petroleum company and it is owned by the English. As such it must be dealt with to adhere to our oil policies."
  MEX_securethecnc:0 "Secure the CNC"
  MEX_securethecnc_desc:0 "The CNC was created with the purpose of helping peasents, and it should remain funded so it can accomplish that function"
  MEX_pushlaborlaws:0 "Push Labor Laws"
  MEX_pushlaborlaws_desc:0 "We need to push laws that make sure that workers are protected and worker abuses never happens."
  MEX_peasantsector:0 "Peasant Sector"
  MEX_peasantsector_desc:0 "The Peasant Sector will make sure that the agrarain reforms and policies set in place by the government are obeyed."
  MEX_blindeyetothechurch:0 "Blind Eye to the Church"
  MEX_blindeyetothechurch_desc:0 "The church has some influence in our country, but the persecution of it´s followers must end. A blind eye sometimes helps keep stability."
  MEX_socialistdemocracy:0 "Democratic Socialist"
  MEX_socialistdemocracy_desc:0 "Socialism is the best thing that has happened to México and as such it shall be maintained."
  MEX_nationalizetheoil:0 "Nationalize the Oil"
  MEX_nationalizetheoil_desc:0 "Now it is the time to take what is ours! Mexican Oil will no longer be foreign property! Hurray!"
  MEX_anexpropriationlaw:0 "An Expropriation Law?"
  MEX_anexpropriationlaw_desc:0 "Cardenas has planned to nationalize many of the resources that were extracted from Mexican soil but only now he is pushing for such a policy."
  MEX_article27:0 "Article 27"
  MEX_article27_desc:0 "Article 27 says that the property of all land and water within national territory is originally owned by the nation. Resources in national territory are property of the nation and private exploitation may only be carried out through concessions"
  MEX_militarysector:0 "Military Sector"
  MEX_militarysector_desc:0 "The Military Sector will make sure that the armed forces are maintaned and upgraded when need be."
  MEX_treatywiththedutch:0 "Treaty with the Dutch"
  MEX_treatywiththedutch_desc:0 "The Company ¨Royal Dutch Shell¨ owns a big part of the shares in the oil companies and we shall negotiate with them for more control by the government."
  MEX_reformtheconstitution:0 "Reform the Constitution"
  MEX_reformtheconstitution_desc:0 "After implementing varios reforms, the president had decided to reform the constitution to better suit the changes implemented during his prescidency."
  MEX_destroythecaudillos:0 "Destroy the Caudillos"
  MEX_destroythecaudillos_desc:0 "Now that the Cedillo rebellion has failed, we have the excuse to charge and destroy all Mexican \"Caudillos\" in the country."
  MEX_improvetheoilindustry:0 "Improve the Oil Industry"
  MEX_improvetheoilindustry_desc:0 "With many plans in his mind, Cardenas has decided to employ more investments in the Oil Industry"
  MEX_popularsector:0 "Popular Sector"
  MEX_popularsector_desc:0 "The Popular Sector will make sure that the people are heard and to secure a free and succesful México"
  MEX_supportejidos:0 "Support Ejidos"
  MEX_supportejidos_desc:0 "The Ejido System has helped a lot of people and we need to make sure they keep doing so."
  MEX_thenewprm:0 "The New PRM"
  MEX_thenewprm_desc:0 "With the recent changes in the party it is time for it to be reborn as the Partido de la Revolución Mexicana. This is a new age for México!"
  MEX_thefourgreatsectors:0 "The Four Great Sectors"
  MEX_thefourgreatsectors_desc:0 "The new versión of the PNR will be built on four Sectors. The Worker Sector, the Peasent Sector, the Military Sector and the Popular Sector"
  MEX_cardenasrealpresidency:0 "Cardenas’ Real Presidency"
  MEX_cardenasrealpresidency_desc:0 "Now that The \"Jefe Máximo\" is out of the picture it is time for Cardenas to implement his reforms. The question is now how moderate or radical the reforms should be?"
  MEX_startlandredistribution:0 "Start Land Redistribution"
  MEX_startlandredistribution_desc:0 "Many peasents are still working in land they don´t own. It is time to give land to the peasents so they can make a living"
  MEX_toledanosecuresthectm:0 "Toledano secures the CTM"
  MEX_toledanosecuresthectm_desc:0 "Vicente Toledano, a stalinist who had worked with the government has shown his true face. However at this point he is too powerful to be removed. We must keep an eye on him."
  MEX_workersector:0 "Worker Sector"
  MEX_workersector_desc:0 "The Workers Sector will make sure that workers all around the country get the help and rights that they deserve."
  MEX_socialistseducation:0 "Socialists Education"
  MEX_socialistseducation_desc:0 "We need to fight religious fanatism and ignorance! To do that we need a socialized and anti-religious education system in place."
  MEX_alloutreforms:0 "All Out Reforms"
  MEX_alloutreforms_desc:0 "Cardenas has decided to promote his more radical reforms and push them as hard as possible"

  #Cardenas FP
 MEX_anewmxicointheamericas:0 "A New México in the Americas"
 MEX_anewmxicointheamericas_desc:0 "While Mexico is not yet a great power, it is now a diplomatic and political force that must be heard and watched. We are now a rising nation ready to cross onto the world stage."
 MEX_foreign_policy_cardenas:0 "Cardenas´ Foreign Policy"
 MEX_foreign_policy_cardenas_desc:0 "Now that our country is finally free of despotic power hungry dictators it is time to enter onto the world stage."
 MEX_findnewdeals:0 "Find New Deals"
 MEX_findnewdeals_desc:0 "Because of our violent and sudden nationalization all of our previous trading partners have abandoned use. We must now find new ones."
 MEX_compromisewiththeoldones:0 "Compromise with the Old Ones"
 MEX_compromisewiththeoldones_desc:0 "While our relations with our old partners are strained, we can compromise with them to reactivate our trade deals and make the situation better for both of us."
 MEX_openmoredeals:0 "Open More Deals"
 MEX_openmoredeals_desc:0 "While our trade deals are secured, we can´t depend on a single trade partner or we could be forced to make concessions. We have to make sure we diversify our trade deals"
 MEX_compensatetheamericans:0 "Compensate the Americans"
 MEX_compensatetheamericans_desc:0 "We have yet to compensate many of our American trading partners. We must do it to secure our nation, lest their government intervenes in favor of their corporations"
 MEX_trustrecovered:0 "Trust Recovered"
 MEX_trustrecovered_desc:0 "Finally after making many concessions, compensations and negotiations we have regained the trust of the market. The oil will be able to flow once again!"
 MEX_spanishcivilwar:0 "Spanish Civil War"
 MEX_spanishcivilwar_desc:0 "The Iberian Peninsula is in conflict! We must support our Spanish brothers and sisters to make sure democracy and republicanism is maintained in Iberia."
 MEX_treatywiththesecondrepublic:0 "Treaty with the Second Republic"
 MEX_treatywiththesecondrepublic_desc:0 "The Spanish Republic has done the same thing we have and evaded an ideological conflict that could have killed millions. This is our opportunity to open relations with them"
 MEX_americanpolicy:0 "American Policy"
 MEX_americanpolicy_desc:0 "Our policy regarding the USA is one of the most important things that have to be decided as this could affect not only trade but legitimacy and internal stability. We shall choose very carefully"
 MEX_searchforallies:0 "Search for Allies"
 MEX_searchforallies_desc:0 "While the Americans are a powerful nation they are mostly isolationist at the moment. We can use that to our advantage and start expanding our diplomacy towards the South"
 MEX_latinamericandiplomacy:0 "Latin American Diplomacy"
 MEX_latinamericandiplomacy_desc:0 "Latin America has a similar culture and history to ourselves. We can exploit that to make sure we can stand a chance to the American Influence \"Divided we Fall, United we Win\""
 MEX_anewforeignpolicy:0 "A New Foreign Policy"
 MEX_anewforeignpolicy_desc:0 "We need to make sure we can have good relations with a large number of countries as possible so we are not isolated politically again."
 MEX_mexicoisbackinbusiness:0 "Mexico is back in Business."
 MEX_mexicoisbackinbusiness_desc:0 "After regaining trust and reestablishing ourselves in the Americas, Mexico is ready to become a part of the International Community"
 MEX_solidifytradedeals:0 "Solidify Trade Deals"
 MEX_solidifytradedeals_desc:0 "While our prestige was damaged because of our nationalization of the oil industry, we can still solidify our trade deals with our current benefactors."
 MEX_friendlypolicy:0 "Friendly Policy"
 MEX_friendlypolicy_desc:0 "While many of the mexican people still hate the USA for its past incursions in our country, that doesn't deny the fact that if we want to survive we must remain friendly to them."
 MEX_maintaindistance:0 "Maintain Distance"
 MEX_maintaindistance_desc:0 "While we plan to maintain a friendly policy with the USA, that doesn´t mean we trust them and as such we must maintain a relation of not friends but not enemies."
 MEX_compensateoilcompanies:0 "Compensate Oil Companies"
 MEX_compensateoilcompanies_desc:0 "After the nationalization of the oil industry various companies have decided that Mexico should be punished and have boycotted our economy. We will compensate them in order for them to stop."
 
