l_english:
 #goals

#Pascual´s Resignation
  MEX_choose_his_succesor:0 "Choose his Succesor"
  MEX_choose_his_succesor_desc:0 "After Ortiz's Resignation the party has decided to debate on who is going to replace the late unloyal president. Four options are available: Alberto J. Pani, Joaquin Amaro, Juan Jose Rios and Abelardo L. Rodriguez"
  MEX_juan_jose_rios:0 "Juan José Ríos"
  MEX_juan_jose_rios_desc:0 "After much discussion, Juan José Ríos, Secretary of Governance, was chosen as the interim president until the 1934 elections"
  MEX_joaquin_amaro_dominguez:0 "Joaquin Amaro Dominguez"
  MEX_joaquin_amaro_dominguez_desc:0 "After much discussion, Joaquin Amaro Dominguez, Director of the \"Heroico Colegio Militar\", was chosen as the interim president until the 1934 elections"
  MEX_alberto_j_pani:0 "Alberto J. Pani"
  MEX_alberto_j_pani_desc:0 "After much discussion, Alberto J. Pani, Secretary of Hacienda, was chosen as the interim president until the 1934 elections"
  MEX_pascual_resignation:0 "Pascual's Resignation"
  MEX_pascual_resignation_desc:0 "After discussions within the party about the amount of power President Ortiz Rubio had, he decided to resign his position leaving a tense situation in the country."
  MEX_abelardo_l_rodriguez:0 "Abelardo L. Rodriguez"
  MEX_abelardo_l_rodriguez_desc:0 "After much discussion, Abelardo L. Rodriguez, Minister of Economy, was chosen as the interim president until the 1934 elections"

 #Army1
  MEX_a_real_mexican_army:0 "A Real Mexican Army"
  MEX_a_real_mexican_army_desc:0 "A real Mexican Army made with mexican weapons is being born and now we must announce to everyone we are ready!"
  MEX_el_ejercito_mexicano:0 "El Ejercito Mexicano"
  MEX_el_ejercito_mexicano_desc:0 "The Mexican Army is a proud force but it is hopelessly under-equiped. We must fix that if we want to defend our homeland"
  MEX_new_truck_industry:0 "New Truck Industry"
  MEX_new_truck_industry_desc:0 "The motorization of the Army is one of the most important parts of modern warfare, keeping our troops supplied and getting them to the battefield is key."
  MEX_remember_the_salina:0 "Remember the Salina"
  MEX_remember_the_salina_desc:0 "The Salina was the first and only tank made by Mexico. That needs to change now."
  MEX_foreign_licenses:0 "Foreign Licenses"
  MEX_foreign_licenses_desc:0 "Now that we have finally finished negotiations, it is time to start producing these designs and fit them into our national army"
  MEX_reform_the_army:0 "Reform the Army"
  MEX_reform_the_army_desc:0 "While we have resolved many equipment problems, we are still yet to solve the most important problem. The Army itself."
  MEX_home_made_mexican_air_force:0 "Home Made Mexican Air Force"
  MEX_home_made_mexican_air_force_desc:0 "The Mexican Air Force needs to be made of Mexican ariplanes and so it shall be."
  MEX_naval_designers:0 "Naval Designers"
  MEX_naval_designers_desc:0 "We must secure our seas and local naval development will making sure they meet our standards!"
  MEX_soviet_trucks:0 "Soviet Trucks"
  MEX_soviet_trucks_desc:0 "The Soviet Union have some remaining trucks that are not being used right now. We could try to buy them before it is too late"
  MEX_german_tanks:0 "German Tanks"
  MEX_german_tanks_desc:0 "While in the Soviet border we found out that the German government was secretly training tank divisions in the U.S.S.R. We can negotiate a price for our silence"
  MEX_italian_planes:0 "Italian Planes"
  MEX_italian_planes_desc:0 "Italians have proven to our ambasadors that their planes are superior to others in the world. We might want to use them."
  MEX_revive_mondragon_business:0 "Revive Mondragon´s Business"
  MEX_revive_mondragon_business_desc:0 "Mondragón was a man who invented many things including artillery cannons and rifles. We need to revive this business"
  MEX_foreign_equipment:0 "Foreign Equipment"
  MEX_foreign_equipment_desc:0 "We do not have enough money and resources to build and design weapons ourselves so we must request designs and spare equipment from other countries."
  MEX_local_equipment:0 "Local Equipment"
  MEX_local_equipment_desc:0 "We can not depend on foreign puppeteers to control our usage of technology, especially one as important as military. Everything we use in war is going to be "MADE IN MEXICO""
  MEX_american_artillery:0 "American Artillery"
  MEX_american_artillery_desc:0 "The Americans have an large stockpile of artillery. We should ask them to send us some of it to better relations."
  MEX_british_guns:0 "British Guns"
  MEX_british_guns_desc:0 "The British have reduced their army size after The Great War, we may be able to negotiate for some of that old equipment"
  MEX_armament_manufacter:0 "Armament Manufacter"
  MEX_armament_manufacter_desc:0 "The Armaments Industry has been forgoten for some time. It is time to make sure it doesn't stay that way"
  MEX_the_mondragon_rifle:0 "The Mondragon Rifle"
  MEX_the_mondragon_rifle_desc:0 "The Mondagron was the first semi-automatic rifle ever made. We need to make sure we maintain that technological supperiority"
  MEX_japanese_ships:0 "Japanese Ships"
  MEX_japanese_ships_desc:0 "The Japanese have shown to be a dominant naval power. We might want to negotiate the usage of old ships."
  
  #Abelardo´s Presidency
  MEX_abelardo_presidency:0 "Abelardo's Presidency"
  MEX_abelardo_presidency_desc:0 "With the resignation of Ortiz, Minister of Economy, Abelardo Rodriguez, has been named interim president until new elections are called."
  MEX_socialist_education:0 "Socialist Education"
  MEX_socialist_education_desc:0 "Socialist \"Non-Clerical\" Education has been on the governments mind for some years, is time to start implementing it."
  MEX_minimun_wage:0 "Minimun Wage"
  MEX_minimun_wage_desc:0 "It´s time to make our first step in avoiding workers´ rights violations, establishing a minimun wage in the workplace."
  MEX_reform_the_banco_de_mexico:0 "Reform the \"Banco de Mexico\""
  MEX_reform_the_banco_de_mexico_desc:0 "After all of the previous reforms we now have to catch the big fish and reform the \"Banco de México\""
  MEX_plan_sexenial:0 "Plan Sexenial?"
  MEX_plan_sexenial_desc:0 "The plan Sexenial was pushed by the Cardenistas to for it's \"original and principal goals of the revolution\". While it is seen with contempt in the party, it is important to review it."
  MEX_reforma_ley_de_patrimonio_ejidal:0 "Reforma Ley de Patrimonio Ejidal"
  MEX_reforma_ley_de_patrimonio_ejidal_desc:0 "The Law of Ejidal Patrimony refers to land or \"ejidos\" owned before the land redistribution program. While it is good in intention, it needs to be reformed."
  MEX_reforma_antireelecionista:0 "Reforma Antireelecionista"
  MEX_reforma_antireelecionista_desc:0 "President Abelardo Rodriguez will reform the anti-reelection laws modified by Obregon to allow his reelection to make sure that no one reelects themsleves anymore."
  MEX_banco_hipotecario_y_de_obras_publicas:0 "Banco Hipotecario y de Obras Publicas"
  MEX_banco_hipotecario_y_de_obras_publicas_desc:0 "The BNHUOP was formed to help mexican cities to recover from the Mexican Revolution, The Cristero War, and the Great Depression under President Abelardo Rodriguez"
  MEX_ley_ouam:0 "Ley O.U.A.M"
  MEX_ley_ouam_desc:0 "The \"Ley Organica de la Universidad Nacional Autonoma de México\" will make sure that the full potential of the industry is achieved."
  MEX_ley_contra_monopolios:0 "Ley Contra Monopolios"
  MEX_ley_contra_monopolios_desc:0 "Based on the anti-monopoly laws aplied in the U.S.A, Abelardo´s administration has passed a law that expands the government´s influence in companies to stop abuse of power over workers."
  MEX_short_glory:0 "Short Glory!"
  MEX_short_glory_desc:0 "Abelardo while having a short reign can be called one of the least corrupt and most successful president in proportion to the time he had" 
  MEX_open_palacio_de_bellas_artes:0 "Open Palacio de Bellas Artes"
  MEX_open_palacio_de_bellas_artes_desc:0 "The Palacio de Bellas Artes began it's construction under Porfirio Diaz, but construction was interrupted during the Revolution. After more than 20 years its construcition is finally finished!"
  MEX_coerce_the_church:0 "Coerce the Church"
  MEX_coerce_the_church_desc:0 "The church tend to think they still have power. We must make them remember who they serve now. We don´t serve them, they serve us."
  MEX_ley_de_beneficiencia_privada:0 "Ley de Beneficiencia Privada"
  MEX_ley_de_beneficiencia_privada_desc:0 "This law will make sure to regulate altruistic organisms to make sure they do as they have, and do not use loopholes to their advantage."

 #Army 2
  MEX_amovingfortress:0 "A Moving Fortress"
  MEX_amovingfortress_desc:0 "Heavy Tanks are the way foward if we are focusing on fighting a defensive war. Experts have proven moving fortresses can move along the front to absorb the blunt of the damage"
  MEX_legacyofzapata:0 "Legacy of Zapata"
  MEX_legacyofzapata_desc:0 "Zapata teaches us that Guerilla tactics, and that the mobilization of the Mexican people, is necessary to win any war. We are in one and as such we must remember his teachings"
  MEX_legacyofobregon:0 "Legacy of Obregon"
  MEX_legacyofobregon_desc:0 "Obregon used Battle Plans and competent officers successfully to be the only General in the Revolution who was never defeated in battle. His lessons must be heard and learned by offciers today."
  MEX_reformthearmy:0 "Reform the Army"
  MEX_reformthearmy_desc:0 "The Army is still in the same state it was in the 1920´s! We need to fix that, the only question is How?"
  MEX_learnfromtherevolution:0 "Learn from the Revolution"
  MEX_learnfromtherevolution_desc:0 "The Revolution has taught us that a war is not won only on the battle plan table by commanders, but by men and women fighting on the battlefield. We must learn from this"
  MEX_useourofficers:0 "Use our Officers"
  MEX_useourofficers_desc:0 "Our Officers are veterans from the Revolution and they know how to implement these reforms to the army. As such we shall let them do it"
  MEX_tankdestroyers:0 "Tank Destroyers"
  MEX_tankdestroyers_desc:0 "While Air Defense is important, Tanks are being developed with such speed that we need weapons that are able to counter them"
  MEX_grandbattleplan:0 "Grand Battle Plan"
  MEX_grandbattleplan_desc:0 "We must plan our strategies to follow before blood is spilled. This help us can avoid a large number of casualties"
  MEX_trenchwarfare:0 "Trench Warfare"
  MEX_trenchwarfare_desc:0 "We will build fortifications and trenches to make sure we defend in the most efficent way possible. We must keep the enemy from entering the interior of our country"
  MEX_replaceourofficers:0 "Replace Our Officers"
  MEX_replaceourofficers_desc:0 "Most of our current officers don´t agree with these ideas but we have a newer generation of officers who are willing to implement them. We must get rid of the old guard and open the path to a new generations of soldiers."
  MEX_trainingprograms:0 "Training Programs"
  MEX_trainingprograms_desc:0 "Because of our focus on a more professional force we must make sure training is efficient and effective in creating the best force it can."
  MEX_refromthesoldaderas:0 "Refrom the Soldaderas"
  MEX_refromthesoldaderas_desc:0 "The Soldaderas are a proud force but we now need them as support troops rather than frontline units. This will let us support a longer frontline."
  MEX_amexicangeneralstaff:0 "A Mexican General Staff"
  MEX_amexicangeneralstaff_desc:0 "A General Staff is needed to plan and execute plans of war. As such Mexico shall have one with the most elite and experienced generals Mexico can offer"
  MEX_aprofessionalarmy:0 "A Professional Army"
  MEX_aprofessionalarmy_desc:0 "A Professional Army, while smaller than a conscription army, will be able to take more hits without collapsing and will be a sign to the world that Mexico is not to be messed with"
  MEX_expandthesoldaderas:0 "Expand the Soldaderas"
  MEX_expandthesoldaderas_desc:0 "Having women in the army is opposed by most of the world but the revolution has taught us that women are necessary for national defense"
  MEX_supportbrigades:0 "Support Brigades"
  MEX_supportbrigades_desc:0 "While our Infantry is important on its own, we need special troops to do specific rolls like reconnaissance or engineering"
  MEX_trainthesierras:0 "Train the Sierras"
  MEX_trainthesierras_desc:0 "The Mountains and \"Cerros\" are a big part of Mexican geography. Because of this we must train special units to work and use this terrain to  our advantage"
  MEX_newrifles:0 "New Rifles"
  MEX_newrifles_desc:0 "While rifles like the Mondragon are still in use, they are outdated and as such we must start replacing them with newer and more modern rifles"
  MEX_abigarmy:0 "A Big Army"
  MEX_abigarmy_desc:0 "Mexico need a large army that intimidates our enemies into thinking twice before attacking us. With an army of this size, we will be able to blunt an attack from any side"
  MEX_newartillerydesigns:0 "New Artillery Designs"
  MEX_newartillerydesigns_desc:0 "Artillery is very important in modern warfare and the more we put into their development the better"
  MEX_massassault:0 "Mass Assault"
  MEX_massassault_desc:0 "Mobilizing the population to make sure any enemy trying to conquer us will have to pay in blood and tears is an important task that must be seen to."
  MEX_moilizethereserves:0 "Mobilize the Reserves"
  MEX_moilizethereserves_desc:0 "We have reserves ready to be deployed, if our army is very big then it is unlikely anyone would try to attack us"
  MEX_preparetheguerrillas:0 "Prepare the Guerrillas"
  MEX_preparetheguerrillas_desc:0 "Zapata successfully ran a guerrilla campaign in the south of Mexico for years. If we want to make a war in Mexico so costly that no one wants to try and invade us, we need to make sure we can´t be successfully occupied without resistance"
  MEX_airdefence:0 "Air Defence"
  MEX_airdefence_desc:0 "Tanks are dangerous but we know from The Great War that Air-Warfare is the future and as such we need to have the upper hand in it"
  MEX_afastconqueror:0 "A Fast Conqueror"
  MEX_afastconqueror_desc:0 "Tanks are the key to win but because of our terrain we can´t afford big or ambitious tanks, so we shall conform with a fast and reliable model"
  MEX_abalancedtank:0 "A Balanced Tank"
  MEX_abalancedtank_desc:0 "While big and powerfull tanks are needed we must think in a realistic way and go for a balanced approach on the armored front."
  MEX_siempreleales:0 "¡Siempre Leales!"
  MEX_siempreleales_desc:0 "The Army issue has been dealt with and Mexico is ready for war. The army is now proud and brave once again. \"¡Siempre Leales!\" shall be their war cry!"
 
  #Navy
  MEX_reformthenavy:0 "Reform the Navy"
  MEX_reformthenavy_desc:0 "The Mexican Navy has been ignored for long enough it is time for it to be reformed and improved."
  MEX_promoteheribertojara:0 "Promote Heriberto Jara"
  MEX_promoteheribertojara_desc:0 "Heriberto Jara has been the man most involved in the creation of the Navy's Secretary but his naval experience is limited so he plans to use his known land experiences with submarines."
  MEX_promotecarloscastillo:0 "Promote Carlos Castillo"
  MEX_promotecarloscastillo_desc:0 "Carlos Castillo Breton is an Aviation enthuasiast and has been responsible for the training of pilots in the sea and due to that he has decided that 1 or 2 Carriers will be enough for protection of our merchant marine."
  MEX_promoteothonpblanco:0 "Promote Othon P. Blanco"
  MEX_promoteothonpblanco_desc:0 "Othon P. Blanco is an old school admiral but he is the most experienced Admiral available in the Mexican Navy so following his instructions of a few big guns to intimidate our oponents and to hit strong when needed my be our best bet."
  MEX_newsubmarinedesigns:0 "New Submarine Designs"
  MEX_newsubmarinedesigns_desc:0 "W.I.P"
  MEX_submarinewarfare:0 "Submarine Warfare"
  MEX_submarinewarfare_desc:0 "W.I.P"
