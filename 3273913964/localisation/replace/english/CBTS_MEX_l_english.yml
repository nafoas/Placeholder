  MEX_GATHERING_STORM_DESC:0 "This last Century hasn't been kind on México and after years of war, economic downfall, and political assasinations the country was finally secured by Plutarco E. Calles better known as the \"Jefe Maximo\" wheter this is to last or not is still doubtful, but one thing is clear México has a rocky way to go."

  #events
  mex_political.1.title:0 "The United Mexican States in 1933"
  mex_political.1.desc:0 "After the end of the Mexican Revolution in the 1920's, Mexico has had a troublesome past. After the Revolution, President Álvaro Obregón left the government, being replaced by Plutarco Elías Calles, who started a war with the deeply Catholic population in Mexico, known as \"La Guerra Cristera\". This undeclared war lasted from 1926 to 1929, after which Obregón tried to take back the presidency. While he won the elections, he was murdered before being able to do anything of significance and was succeeded by Emilio Portes Gil. Thanks to Portes Gil, Calles managed to secure control of the Country, using the president as his puppet. This puppetry is known as the \"Maximato\", and held strong with the successor of Portes Gil, Pascual Ortiz Rubio, and now with Abelardo Rodríguez after Ortiz Rubio's resignation just a few months ago. However, Rodriguez has had a difficult task governing, being unable to take many decisions since he took power."
  mex_political.1.a:0 "The Future is Unclear"
  mex_political.2.title:0 "PNR´s Candidate"
  mex_political.2.desc:0 "The time has come to choose our own candidate for the presidency. While an inside candidate seems obvious, Calles may be tempted to get a candidate from another party as his influence in this one is weakening."
  mex_political.2.a:0 "A PNR Candidate"
  mex_political.2.b:0 "A Coalition Candidate"
  mex_political.3.title:0 "A PNR Candidate"
  mex_political.3.desc:0 "Calles decided that it was better to trust a candidate from within the party and after some thinking and decisión making the candidate shall be..."
  mex_political.3.a:0 "Lazaro Cardenas"
  mex_political.3.b:0 "Manuel Treviño"
  mex_political.4.title:0 "A Coalition Candidate"
  mex_political.4.desc:0 "Calles decided that it was better play safe by electing a coalition candidate that depends on our party to be able to rule. A better puppet"
  mex_political.4.a:0 "Luis N. Morones"
  mex_political.4.b:0 "Jose Vasconcelos"
  mex_political.5.title:0 "A Cold Morning"
  mex_political.5.desc:0 "Calles was awaken in the middle of the morning by a knock on his door. When he was about to stand up soldiers burst the door open and pointed guns at him. He demmanded an explanation, but then discovered that he had to leave the country now. With armed soldiers sorrounding him he didn´t have much of a choice. He took his things and was ready to leave for the USA. The ¨Jefe Maximo¨is no more!"
  mex_political.5.a:0 "No one is going to miss him"
  mex_political.6.title:0 "Cardenas sworn as President"
  mex_political.6.desc:0 "After some \"Perfectly Fair\" Elections, today, December 1st 1934, Lazaro Cardenas del Rio has been sworn in as the new President of the United Mexican States"
  mex_political.6.a:0 "Hurray!"
  mex_political.7.title:0 "Formation of the PAN"
  mex_political.7.desc:0 "Yesterday the Social Conservative \"Partido Accion Nacional\" was formed by various intellectuals and it is currently leaded by Former UNAM Principal Manuel Gomez Morin"
  mex_political.7.a:0 "A Future Rivalry is in the Making"
  mex_political.8.title:0 "Dissolvment of the PSI, Division in the PCM"
  mex_political.8.desc:0 "Yesterday the Far-Left \"Partido Socialista de Izquierdas\" was formally dissolved by its leadership. In other news the Partido Comunista Mexicano has divided after its main leaders Hernan Laborde and Valentin Campa were kicked out by the Stalinist Loyalists. While Laborde still claims to lead the party, this only serves to make it weaker"
  mex_political.8.a:0 "The Far Left is Collapsing"
  mex_political.9.title:0 "Formation of the UNS"
  mex_political.9.desc:0 "Recently Radical Catholics have united in a new political organization called the \"Union Nacional Synarquista\". While this is obviously just the Cristeros formally uniting in a political organization, their new and younger leaders, mainly its current leader, Jose Antonio Urquiza, ideas are worrysome."
  mex_political.9.a:0 "The Cristeros have a new face"
  mex_political.10.title:0 "Assasination Attempt on Jose Antonio Urquiza"
  mex_political.10.desc:0 "As young politician Jose Antonio Urquiza walked in the train station he was attacked by a would be assasin! He was rushed to hospital immediatly. Upon his arrival in the hospital he is...."
  mex_political.10.a:0 "Jose is Dead! Salvador shall take over"
  mex_political.10.b:0 "Jose is alive! God showed him his favor"
  mex_political.11.title:0 "Formation of the FFPM"
  mex_political.11.desc:0 "W.I.P"
  mex_political.11.a:0 "Keep an eye on them."  
  mex_political.12.title:0 "Enact State Catholicism?"
  mex_political.12.desc:0 "W.I.P"
  mex_political.12.a:0 "Enact State Catholicsm"
  mex_political.12.b:0 "The time has passed"
  mex_political.13.title:0 "Recovery from the Great Depression"
  mex_political.13.desc:0 ""
  mex_political.13.a:0 "Finally"
  mex_political.14.title:0 "The PAN and the UNS Merge"
  mex_political.14.desc:0 "After some dealing and worrying of the leftwing policies of the ruling party, the Partido Acción Nacional and the Union Nacional Sinarquista have united in a common right wing goal of opposing the left wing policies that have been happening, Luis Cabral Lobato has been offered and accepted the Candidacy for the next elections, with this one thing stands clear, the Right is United once more."
  mex_political.14.a:0 "This is worrysome!"
