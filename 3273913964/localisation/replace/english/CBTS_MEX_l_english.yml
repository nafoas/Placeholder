  mex_political.22.title:0 "The Red Shirt Scandal"
  mex_political.22.desc:0 "A Local Newspaper in Tabasco just published an article connecting President Francisco José Mujica with infamous and hated Former Militia Leader Tomas Garrido Canabal who was exiled by popular demand on 1935 by President Lazaro Cardenas. \n \n This article has told the story since the time when Canabal served on the revolutionary army under Mujica himself with it citing and revealing that Mujica was behind the appointment of Canabal as Governor of Tabasco, this has generated outcry on Tabasco which then has led to more Nation Wide National Outcry. \n \n The PDM under Ezequiel P. Peñaloza has declared that Mujica should face consequences for \"Appointing a Criminal Caudillo\" and the PFM under Luis C. Lobato has declared Mujica a traitor for \"Supporting a Terrorist who ordered the death of countless men, women and children\" while Mujica's position has clearly been shaken there is still some hope to keep it together.\n \n One thing we know for sure this isn't going  to be pretty."
  mex_political.22.a:0 "This could end badly"
  mex_political.23.title:0 "The Limits on the Church"
  mex_political.23.desc:0 "W.I.P"
  mex_political.23.a:0 "Let's keep enforcing Secularism"
  mex_political.23.b:0 "Let's bring back the Non Intervention"
  mex_political.24.title:0 "Tellez Sworn in"
  mex_political.24.desc:0 "W.I.P"
  mex_political.24.a:0 "The Calm after the Storm"
  mex_political.25.title:0 "PRM Collapses"
  mex_political.25.desc:0 "Everything has gone worse than before, after Mujica resigned too try and prevent another civil war things went down very fast, the former diehard supporters of Mujica leaded by Adalberto Tejeda have formed the Partido Socialista Revolucionario breaking part of the PRM then the Radical Cardenists and Moderate Mujica Supporters have left the party and formed the Partido Socialista Nacional, after which the remaining parts of the PRM led by new President Ignacio Garcia Tellez re-formed the Partido Constitucional Progresista, the country seems to be getting more unstable and it is obvious the PCP won't be able to win, the only question is. \n\n What now?"
  mex_political.25.a:0 "Well Shit...."
  mex_political.26.title:0 "PDM Elected"
  mex_political.26.desc:0 "W.I.P"
  mex_political.26.a:0 "Let's hope he can manage"
  mex_political.27.title:0 "PFM Elected"
  mex_political.27.desc:0 "W.I.P"
  mex_political.27.a:0 "The Greatest Irony"  
  mex_political.28.title:0 "Cristero Generals Offer Service"
  mex_political.28.desc:0 "W.I.P"
  mex_political.28.a:0 "Perfect Oportunity"
  mex_political.29.title:0 "Approaching the Scandal"
  mex_political.29.desc:0 "After the Scandal went ahead in the last few days a two main options have been established, One and the one supported by moderates and Cardenas himslef is to focus on damage control trying to rebuild Mujica's Image.\n\nThe Second option is much more radical and it is supporter by some of the most radical revolutionaries being recalling Canabal, and declaring Martial Law across the country to do the final steps in building a true Socialist Republic. \n\nWhile the 2nd option is more alinged with Mujica's Ideology the first one is more realistic and is less likely to backfire.\n\n In the end Mujica chooses too."
  mex_political.29.a:0 "Focus on Damage Control"
  mex_political.29.b:0 "Give the get go to declare Martial Law! §r(No Effect)§!"  
  mex_political.30.title:0 "The Mexico City Protests"
  mex_political.30.desc:0 "While focusing on damage control has keep the country from falling to chaos a recent small protest in Mexico City has escalated to the biggest Protests ever since the Revolution, once again we have two choices.\n\nWe can either let the protests go as long as it doesn't become violent or order troops to clean out the streets, while cleaning out the streets might sound like the better choice it is certainly incredibly risky.\n\nAfter some ponderance Mujica chooses too."
  mex_political.30.a:0 "This will pass with time"
  mex_political.30.b:0 "Order the Army to Fire at the Traitors!"  
  mex_political.31.title:0 "All back to normal"
  mex_political.31.desc:0 "After some time and Mujica's public speaches and propaganda going against the idea that he supported Cabral in any way the situation seems to have finally calmed. \n\n the elections are close and it is time for Mujica to choose a succesor, he has choosen Secretary of Governance Ignacio Garcia Tellez, a Cardenist and follower of his ideals."
  mex_political.31.a:0 "What a Relief!"  
  mex_political.32.title:0 "The Army refuses to Fire"
  mex_political.32.desc:0 "While the Mexican Army is no stranger to shooting civilians General Adrian Castrejon Castrejon Military Commander in charge of the Army in Mexico City has refused to comply with the order.\n\n This action has triggered a chain of events after the Media found out about the order to fire, discontent turned to protests, and portests to riots, the country is beginning to fall apart and Mujica is to blame, now his only choice giving by his party is too resign, but something else seems to be breewing, as division inside the party continues to grow."
  mex_political.32.a:0 "This can't get worse..... right?"  
  mex_political.33.title:0 "The Election Issue"
  mex_political.33.desc:0 "The PCP an't win but some members have sugested making sure the PDM win and then uniting with them so that the power goes smoothly to a more sympathetic side to our cause, Tellez himslef is very doubtful due to the issue of being able to pull it off, after some talking Tellez has made his decision..."
  mex_political.33.a:0 "Give Peñaloza this favor"  
  mex_political.33.b:0 "We can't risk it, Run a Clean Election"  
