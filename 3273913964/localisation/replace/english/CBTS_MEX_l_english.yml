  MEX_divided_mexico:0 "Divided Mexico"
  MEX_divided_mexico_desc:0 "Mexico is divided by pesky Caudillos who think themselves ruler of their states. They do not respond to the central government and are pestilent nuisances."
  MEX_the_maximato_shaky:0 "The Maximato - Shaky Influence"
  MEX_the_maximato_shaky_desc:0 "With previous scandals Calles has lost some of the control he once had. However the Maximato is still firmly in place"
  MEX_deal_with_the_church:0 "Deal With The Church"
  MEX_deal_with_the_church_desc:0 "After the end of the ¨Cristiada¨ A deal was made between the Church and the government. While for now it had been respected, further events might change that"
  MEX_great_depression:0 "The Great Depression"
  MEX_great_depression_desc:0 "The great depression, while hitting America hard, also hit Mexico, as it is a country dependant on the USA for imports and exports. As of now the country has yet to recover from such a stab at the economy"
  mex_political_army:0 "Politicized Army"
  mex_political_army_desc:0 "The National Army is full of political officers and generals who care more about their ideological squables than the country. That is detrimental to our armed forces effectivness."
  mex_political_army1:0 "Depoliticization of the Army"
  mex_political_army1_desc:0 "The Army is finally being depolitized, but the shall be implemented slowly to handle the transition."
  mex_political_army2:0 "Loyal Officer Corps"
  mex_political_army2_desc:0 "The new reforms in the armed forces will ensure loyalty to México and will ensure that officers know that voicing \"ideas against the will of the people\" will be severly punished"
  mex_outdated_military:0 "Outdated Military"
  mex_outdated_military_desc:0 "The army in both tactics and equipment is outdated. While still in the revolutionary age, a hard meaningful push to improve the situation will greater our odds in a future conflict"
  mex_legacy_of_zapata:0 "Legacy of Zapata"
  mex_legacy_of_zapata_desc:0 "Emiliano Zapata presented Mexico with Mass Mobilization and Guerrilla tactics that would make a war with Mexico too much for any neighbouring country to handle as the cost would be to great"
  mex_legacy_of_zapata1:0 "Legacy of Zapata"
  mex_legacy_of_zapata1_desc:0 "Emiliano Zapata presented Mexico with Mass Mobilization and Guerrilla tactics that would make a war with Mexico too much for any neighbouring country to handle as the cost would be to great"
  mex_legacy_of_zapata2:0 "Legacy of Zapata"
  mex_legacy_of_zapata2_desc:0 "Emiliano Zapata presented Mexico with Mass Mobilization and Guerrilla tactics that would make a war with Mexico too much for any neighbouring country to handle as the cost would be to great"
  mex_legacy_of_zapata3:0 "Legacy of Zapata"
  mex_legacy_of_zapata3_desc:0 "Emiliano Zapata presented Mexico with Mass Mobilization and Guerrilla tactics that would make a war with Mexico too much for any neighbouring country to handle as the cost would be to great"
  mex_legacy_of_obregon:0 "Legacy of Obregon"
  mex_legacy_of_obregon_desc:0 "Alvaro Obregon introduced brilliant tactics and planning methods that would make Mexico a trap in which any one trying to invade would have to deal with a well armed, trained, and fortified enemy"
  mex_legacy_of_obregon1:0 "Legacy of Obregon"
  mex_legacy_of_obregon1_desc:0 "Alvaro Obregon introduced brilliant tactics and planning methods that would make Mexico a trap in which any one trying to invade would have to deal with a well armed, trained, and fortified enemy"
  mex_legacy_of_obregon2:0 "Legacy of Obregon"
  mex_legacy_of_obregon2_desc:0 "Alvaro Obregon introduced brilliant tactics and planning methods that would make Mexico a trap in which any one trying to invade would have to deal with a well armed, trained, and fortified enemy"
  mex_legacy_of_obregon3:0 "Legacy of Obregon"
  mex_legacy_of_obregon3_desc:0 "Alvaro Obregon introduced brilliant tactics and planning methods that would make Mexico a trap in which any one trying to invade would have to deal with a well armed, trained, and fortified enemy"
  mex_soldaderas:0 "Soldaderas"
  mex_soldaderas_desc:0 "The Soldaderas are a proud organization that will greatly increase the amount of troops we are able to field"
  mex_mobilzed_reserves:0 "Mobilize the Reserervists"
  mex_mobilzed_reserves_desc:0 "The Reserves are usually called at only the moment they are needed. But if we mobilize them before the final moment we can make sure they are well trained and ready for action"
  mex_guerrilla_warfare:0 "Guerrilla Warfare"
  mex_guerrilla_warfare_desc:0 "With good reserves and great amount of troops, national \"Guerrillas\" can be mobilized to make sure to give hell to any invader that tries to invade Mexico."
  mex_training_programs:0 "Training Programs"
  mex_training_programs_desc:0 "Now that we are focusing on a professional army, we need to make sure that every soldier is as experienced as possible."
  mex_reformed_soldaderas:0 "Reformed Soldaderas"
  mex_reformed_soldaderas:0 "The Soldaderas have a new pupose as medics and auxiliary troops in order to maximize efficency. They will be prepped and properly deployed onto the battlefield."
  mex_general_staff:0 "Mexican General Staff"
  mex_general_staff_desc:0 "Now it is time for our best generals to meet and plan for possible conflicts that may arise. We must always be prepared for the worst."
  MEX_corporation_outrage:0 "Corporation´s Outrage"
  MEX_corporation_outrage_desc:0 "Due to our recent action in the nationalization of resources, some corporations and Mexican companies have decided to boycott our economy."
  MEX_limited_outrage:0 "Limited Outrage"
  MEX_limited_outrage_desc:0 "While our nationalization was controlled and with limited outside controversies, it is still a taint on mexican business that must be fixed."
  MEX_nationalization_fallout:0 "Nationalization Fallout"
  MEX_nationalization_fallout_desc:0 "After our violent and rapid nationalization of resources, the international community has reacted in a negative way and we must work to regain a foothold in the market"
  MEX_deals_solidified:0 "Deals Solidified"
  MEX_deals_solidified_desc:0 "After some negotiations we have finally come into an agreement with our current partners to make sure that our economic ties don't fall apart"
  MEX_new_deals:0 "New Deals"
  MEX_new_deals_desc:0 "After some treaties and negotiations we have new partners that will access our marke. We can finally bargain with our old partners from a position of strenght"
  MEX_american_outrage:0 "American Outrage"
  MEX_american_outrage_desc:0 "The Americans are the only ones that we didn't compensate and they are still angry about that."
  MEX_remaining_fallout:0 "Remaining Fallout"
  MEX_remaining_fallout_desc:0 "While we have mostly dealt with and solved the issues that arose due to our resource nationalization, there are still many thing that have to be fixed"
  MEX_foreign_limbo:0 "Foreign Limbo"
  MEX_foreign_limbo_desc:0 "While our market issues have been solve there is still an air of mistrust and non-cooperation that can only be solved by showing off a new Mexico on the world stage"
  MEX_lack_of_trust:0 "Lack of Trust"
  MEX_lack_of_trust_desc:0  "Our nationalization of Oil has left us with a market that doesn´t trust us and that isn´t willing to invest in Mexico."
