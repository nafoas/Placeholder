  MEX_reformtheairforce:0 "Reform the Airforce"
  MEX_reformtheairforce_desc:0 "W.I.P"
  MEX_followantoniocardenas:0 "Follow Antonio Cardenas"
  MEX_followantoniocardenas_desc:0 "W.I.P"
  MEX_followluisfarrel:0 "Follow Luis Farrel"
  MEX_followluisfarrel_desc:0 "W.I.P"
  MEX_followrobertofierro:0 "Follow Roberto Fierro"
  MEX_fighterproyects:0 "Fighter Proyects"
  MEX_fighterproyects_desc:0 "W.I.P"
