 #ideas
 NZL_Great_Depression:0 "Great Depression"
 NZL_Great_Depression_desc:0 "The Collapse of the American Stock Market and subsequent British Crisis has had similar effects on the New Zealander economy. Exports have fallen and unemployment is high. Although the worst is behind us, the Government's response has been Austerity, which has alienated may lower-class voters."
 NZL_Westminster_Debate:0 "Westminster Debate"
 NZL_Westminster_Debate_desc:0 "According to the 1931 Statue of Westminster, New Zealand and the other Dominions are to be de facto independent, with London being unable to make laws for us without our consent. However, New Zealand has so far hesitated to adopt the Statue, as we would prefer that London handle our foreign policy and national defense."
