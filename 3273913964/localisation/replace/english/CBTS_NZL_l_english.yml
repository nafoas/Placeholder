 #event
 nzl_internal.1.t:0 "George Monckton-Arundell becomes Governor-General"
 nzl_internal.1.d:0 "His military background made an impression with our cabinet ministers"
 nzl_internal.1.a:0 "Welcome Viscount of Galway"
 nzl_internal.2.t:0 "Cyril Louis Norton Newall becomes Governor-General"
 nzl_internal.2.d:0 "On 1 September 1937, Newall was appointed as Chief of the Air Staff, the military head of the RAF. He was promoted to Marshal of the Royal Air Force on 4 October 1940 and retired from the RAF later that month.Politically, he has a lukewarm relationship with the Prime Minister, Peter Fraser – 'I can't persuade myself that he is all he quite appears to be', Newall noted in a private report – but the two worked together effectively"
 nzl_internal.2.a:0 "Welcome Lord Newall"
