  KML_Rebellion_desc:0 "The Kumul Rebellion, started in 1931, is aimed at overthrowing the corrupt and intolerant rule of Jin Shuren, governor of Xinjiang, in Urumqi, and with this, restoring the Kumul Khanate, which Jin Shuren had previously annexed. With the help of Ma Zhongying of Gansu, Hoya-Niyaz Haji, and Yulbars Khan, the Rebellion has been largely successful... so far."

