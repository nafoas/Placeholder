l_english:
#Events
 POR_naval_revolt.1.t:0 "A Naval Revolt?"
 POR_naval_revolt.1.desc:0 "Today at 01:00 AM an unknown wireless operator tipped off the Admiralty about an inminent naval revolt organized by the Organização Revolucionária da Armada (a left-wing group with links to the Portuguese Communist Party). The purpose of this naval revolt, led by the NRP Dão and the NRP Alfonso de Albuquerque, is to sail to a Spanish port in the Mediterranean and take part in the Spanish Civil War alongside the [?transfer_revolt_ships_target.GetName]'s fleet.\n\nHowever, some members of the Admiralty have questioned the veracity of this information, claiming that this anonymous tip is too especific and too sudden to be true. They argue that it might even be a decoy with the purpose of distracting us, while the real revolt happens in some other place. Other officials have suggested that we should dispatch a boat to survey the situation of the fleet and thus find out what's going on. What should we do?"
 POR_naval_revolt.1.a:0 "It's clearly a trap. Don't do anything"
 POR_naval_revolt.1.b:0 "Send a boat"
 POR_naval_revolt.2.a:0 "Merda"
 POR_naval_revolt.2.b:0 "Send them to Tarrafal!"
 POR_naval_revolt.3.t:0 "Mutiny report"
 POR_naval_revolt.3_s_desc:0 "Today reports from the Admiralty inform us about a full fledged naval revolt that happened yesterday around 3:00 AM. Allegedly, some navy officers received an anonymous message alerting them of an impending mutiny located in the Tagus river estuary (where the portuguese navy is anchored). They decided to send a boat to survey the situation of the fleet and figure out what was happening. Upon seeing the Admiralty boat, most of the rebel crews realized their plot had been discovered and chose not to revolt, except the crews of the Afonso de Albuquerque and Dão that, by then, had already mutinied. At 3:00 AM the boat approached the NRP Alfonso de Albuquerque to communicate with the vessel's commanders. The muteneers (who held their officers below deck at gunpoint) worried that they had been discovered, so they attempted to lure the Admiralty officers aboard to subdue them, but they realized what was happening and fled in their boat.\n\nOne hour later the alarm was raised ashore, alerting the coastal artillery of the muteneers intentions, but due to a heavy mist they could not target the ships. Taking advantage of this the rebel's ships began their departure, following each other out at fifteen minute intervals.By the time the fog cleared the two ships were very far from port and on their way to Spain. We estimate that at least [?POR_sailors_var] sailors took part in the revolt."
 POR_naval_revolt.3_f_desc:0 "Today reports from the Admiralty inform us about an attempted mutiny that happened yesterday around 3:00 AM. Allegedly, some navy officers received an anonymous message alerting them of an impending revolt located in the Tagus river estuary, where the portuguese navy is anchored. They decided to send a boat to survey the situation of the fleet and figure out what was happening. Upon seeing the Admiralty's boat, most of the Portuguese sailors realized their plot had been discovered and chose not to revolt. By then the crews of the NRP Afonso de Albuquerque and the NRP Dão had already mutinied, forcing their officers below deck at gunpoint. The sailors on the Alfonso attempted to lure the Admiralty officers aboard, but the officers realized what was happening and fled in their boat. One hour later the alarm was raised ashore, alerting the coastal artillery of the muteneers intentions, but due to a heavy mist they could not target the ships.\n\nAt 07:30 Afonso and Dão raised steam and proceeded down the river at about 8 knots. By then the mist had cleared and the shore batteries opened fire. A loyal submarine opened fire on the Alfonso with a machine gun. Afonso's bridge was destroyed in the engagement and her engines were crippled. Dão, caught in the cross-fire between two forts, was also hit and both ships ran aground. The crews raised white flags to signal their surrender, later Government forces boarded the 2 ships and arrested its crews. In total [?POR_sailors_arrested] sailors have been arrested and [?POR_sailors_dead] sailors have died in the fight; including the leader of the revolt , a sailor from the NRP Dão, who committed suicide."
 POR_naval_revolt.3.a:0 "Merda"
 POR_naval_revolt.3.b:0 "The communist revolt has been crushed"
