 ground_attack_plane_airframe_0:0 "Early Ground-Attack Airframe"
 ground_attack_plane_airframe_0_desc:0 "Since the early days of the Great War, aviation has advanced in leaps and bounds. This airframe represents the culmination of these developments, but it is clear that its growth potential is limited."
 ground_attack_plane_airframe_1:0 "Basic Ground-Attack Airframe"
 ground_attack_plane_airframe_1_desc:0 "In recent years, a number of new technologies has emerged, allowing for the construction of very capable, yet small, planes. This airframe represents just the first step on that road."
 ground_attack_plane_airframe_2:0 "Improved Ground-Attack Airframe"
 ground_attack_plane_airframe_2_desc:0 "With improved aerodynamics and more robust construction, this airframe represents a clear step forward compared to the basic model."
 ground_attack_plane_airframe_3:0 "Advanced Ground-Attack Airframe"
 ground_attack_plane_airframe_3_desc:0 "Thoroughly optimized for performance, this airframe represents the absolute maximum of what can be done with a piston-driven airplane."
 ground_attack_plane_airframe_4:0 "Modern Ground-Attack Airframe"
 ground_attack_plane_airframe_4_desc:0 "This airframe is designed to take advantage of the great speeds offered by modern engines and solve some of the structural problems that come with flying at high sub-sonic speeds."

 bomb_locks_lb:0 "Bomb Racks"
 bomb_locks_lb_desc:0 "Mountings for small bombs under the wings or the fuselage allow the plane to attack ground targets with some hope of success."

