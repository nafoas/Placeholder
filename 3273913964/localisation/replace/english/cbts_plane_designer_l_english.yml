 lmg_defense_turret_single_desc:0 "A light machine gun in a turret, normally facing the rear of the aircraft."
 lmg_defense_turret_triple:0 "Triple Light MG Defense Turret"
 lmg_defense_turret_triple_desc:0 "A set of three light machine guns in a electrically-powered turret. Normally facing the rear of the aircraft."

