 gondola: "Gondola"
 gondola_desc: "Gondola is the general term for the usually-armored ventral casemate-style positions used on many military bomber aircraft, especially on German designs, where they are usually known as Bodenlafette, often shortened to Bola. Gondolas are either used to house a gunner or a bombardier."
