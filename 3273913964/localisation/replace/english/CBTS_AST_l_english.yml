 AST_bill_1_title:0 "The Funny Act (1933)"
 AST_bill_1_desc:0 "The Funny Act is an act written to make Australia as funny as possible via the installation of a fascist government, and the granting of wargoals on all nearby countries."
 AST_bill_1_onintro:0 "Change in popularity of Fascism: §G5.00%§!"
 AST_bill_1_onpass:0 "Change in popularity of Fascism: §G45.00%§!\n§YNew Guard§! becomes the ruling party."
