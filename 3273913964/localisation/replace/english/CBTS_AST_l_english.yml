 #event
 ast_internal.1.t:0 "Alexander Hore-Ruthven becomes Governor-General"
 ast_internal.1.d:0 "With his military record and experience, Gowrie was seen as an obvious choice to succeed Sir Isaac Isaacs when he retired as Governor-General. In accordance with established practice Prime Minister Joseph Lyons was offered several alternatives, but Lyons had no intention of recommending another Australian to the post. At the time, non-Labor Prime Ministers always appointed British Governors-General."
 ast_internal.1.a:0 "Welcome Earl of Gowrie"

 
