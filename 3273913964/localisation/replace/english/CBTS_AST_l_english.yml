 #ideas
 AST_Great_Depression:0 "Great Depression"
 AST_Great_Depression_desc:0 "Since the mid-1920's, the Australian Economy had already begun to decline, as it was heavily dependent on the exports of wool and wheat. Therefore, the Great Depression severely affected Australia, with the generally accepted figure of 29% unemployment bringing a landslide victory for the Australia Labour Party in 1929."
 AST_Decentralized_Army:0 "Decentralized Army"
 AST_Decentralized_Army_desc:0 "Since the end of the Great War, the Australian Army has had two components. The first is the trained and equipped Regular Army, and the second is the untrained and poorly-equipped Militia. If we are to fight in the coming years, we will need to dramatically reform our army structure." 
