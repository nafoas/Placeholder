l_english:
 #ideas
 FIN_Great_Depression:0 "Great Depression"
 FIN_Great_Depression_desc:0 "Keynesian Economic policies and the decision to take the Finnish Markka off the Gold Standard in 1931 have helped the Finnish economy  to surmount the country’s economic plight rather well. Reduced demand for forest industry exports and shortages of agricultural goods have still hurt the countryside, where the income from the sales of raw wood is important to farm owners. The government and municipalities have helped to alleviate the situation somewhat with various Public Works programs."
 FIN_Radical_Agitation:0 "Radical Agitation"
 FIN_Radical_Agitation_desc:0 "Ever since the Finnish Civil War of 1918, the political extremes in Finland have remained bitterly opposed to the prevailing status quo. The Republic only narrowly avoided an armed Fascist coup in 1932 at Mäntsälä, and various Radical Nationalist right-wing groups such as the Academic Karelia Society still demand the annexation of Eastern Karelia. And despite extensive police surveillance and laws banning anti-government activities, the illegal Finnish Communist Party continues to operate as well, plotting to organize a new revolution in Finland at the first possible opportunity."
 FIN_Language_Issues:0 "Language Issues"
 FIN_Language_Issues_desc:0 "The Status of Swedish language is a divisive political issue in Finland. The young republic was part of Sweden for 800 years, and most of the political, economic and cultural elites belong to the Swedish-speaking minority. The strife for the legal position of Swedish and Finnish languages has continued for decades. It has to be solved one way or another, or it will continue to divide Finnish society."
 FIN_Agrarian_Reforms:0 "Popular Reforms"
 FIN_Agrarian_Reforms_desc:0 "The laws on municipal democracy, radical land reform and universal compulsory education have endeared the state to the general population, especially in the countryside. Citizens outside the political extremes are slowly coming around to the view that the republic supports their interests, and they have begun to support it in kind."
 #WinterWar
 FIN_Spirit_of_the_Winter_War:0 "Talvisodan Henki"
 FIN_Spirit_of_the_Winter_War_desc:0 "The Soviet Union has made a serious mistake if they think their imperialistic ambitions will be successful. We will take all measures in our power to form a solid defense against this ruthless attack. Let them pay for every step forward in our land!"
 fin_external.1.t:0 "Soviet Invasion!"
 fin_external.1.d:0 "The USSR has invaded Finland under the pretext of \"Finnish Attack\". These are obvious hypocritical lies, as the Soviets fired artillery shells towards Finnish soil and then accused us of attacking them. Moscow is trying to decieve the world to justify their imperialistic ambitions: to annex Finland into the USSR by force. Although we are outnumbered by far, the Finnish spirit shall overpower whatever the Russians throw at us. We will keep our country and people independent!"
 fin_external.1.a:0 "Alas Ryssät Punaiset!"
 FIN_Winter_War:0 "The Winter War"
 FIN_Winter_War_desc:0 "The Soviet attack is upon us, and we must fight the Bolsheviks on our home ground. Though we have made defensive preparations, our army is very much unprepared for the Red Assault. Therefore, we must adapt our tactics to these situations and appeal to foreign organizations for help."
 FIN_survive:0 "Defend Yourself!"
 FIN_survive_desc:0 "If we can hold out against the USSR, we can force them to the negotiating table!"
 fin_external.2.t:0 "We Have Lost!"
 fin_external.2.d:0 "The USSR has successfully invaded our lands, and we can no longer hold on to the defense. It is with a heavy heart that the military high command and the foreign office encouraged our government to surrender. Should we surrender, the Soviets are expected to demand territories in Karelia, as well as the peninsula of Hanko as a naval base."
 fin_external.2.a:0 "We will do what we must."
 fin_external.2.b:0 "We will never surrender!"
 fin_external.3.t:0 "The Treaty of Moscow"
 fin_external.3.d:0 "In light of our recent invasion, the Finns have surrendered to the Red Army. We are now meeting with them in Moscow to discuss terms. Under the final version of the treaty, we would seize Salla, Petsamo, Viipuri, and lease the Hanko peninsula as a naval base. Is this an acceptable outcome?"
 fin_external.3.a:0 "We shall take it!"
 fin_external.3.b:0 "We must seize all Finland!"
 fin_external.4.t:0 "Victory!"
 fin_external.4.d:0 "We have defeated the Red Beast and defended our territory! We are now in a position to force Moscow to the table and get them to back off. Under the terms of the treaty, they would have to recognize our soveirgn territory[This.FinTurnOverStates]. They would also have to pay us reparations (though as the Ruble is non-convertible, we will have to take it in goods) to cover our war costs. Should we try and make peace?"
 fin_external.4.a:0 "Of course!"
 fin_external.4.b:0 "We should keep fighting!"
 FinGetsRepola:0 " We can also force them to recognize our ownership of Repola, a Karelian region that we have historical claims on"
 fin_external.5.t:0 "The Treaty of Helsinki"
 fin_external.5.d:0 "It is plain to see that we have lost the war with Finland. They have successfully beaten back our forces, and demand that we surrender to avoid further humiliation. Even some of our favored military experts are telling us to surrender. We could of course send diplomats to Helsinki to sign their treaty, or we could continue to fight. What shall it be?"
 fin_external.5.a:0 "We must surrender."
 fin_external.5.b:0 "We shall fight on!"
 fin_external.6.t:0 "The Treaty of Helsinki"
 fin_external.6.d:0 "We have just signed peace with the USSR in Helsinki. Though we get little in the way of territory, we get material reperations and the rare opportunity to humiliate the USSR. The whole world will now know that the "mighty" Red Army and Bolshevik ideology was unable to defeat a country several times smaller. This is expected to have devestating effects within the USSR, as any confidence the people had in their government will undoubtedly be destroyed."
 fin_external.6.a:0 "Venäläisen Verikoiran Karkoittaa!"
 fin_external.7.t:0 "The USSR Refuses to Surrender"
 fin_external.7.d:0 "To save themselves from international humilitation, the Red Dogs have refused to surrender to our forces and accept defeat. Though the whole world can see that the Red Army is ineffective and bloated, they choose to humiliate themselves further by fighting. In addition, we shall establish the territories of Repola and Porajärvi as core Finnish territory, which will inspire both the people at home and the troops on the front."
 fin_external.7.a:0 "Karjalan Armeija Kestää Sen."
 #Continuation War
 FIN_Continuation_War:0 "The Continuation War"
 FIN_Continuation_War_desc:0 "Now that the USSR is on the receiving end of a major invasion, we can declare our intentions to join the war against them! This will open up another front in the war, forcing the Reds to divide their forces. We will attempt to move our forces into Karelia in order to take our rightful territory back and expand our borders to East Karelia."
 FIN_start_cont_war:0 "Help [From.GetNameDef] against the USSR!"
 FIN_common_enemy:0 "Common Enemy"
 FIN_betrayed:0 "Betrayed Us!"
 fin_external.8.t:0 "Finland Begins the Continuation War"
 fin_external.8.d:0 "Finland has sent us a message saying that within a few days, they will join our war against the USSR. Their stated aims are to avenge the winter war, secure their pre-1940 territories, and attempt to establish a presence in East Karelia."
 fin_external.8.a:0 "A Welcome Ally!"
 FIN_moscow_armistice:0 "Armistice with the USSR"
 FIN_moscow_armistice_desc:0 "The USSR has gained the upper hand in the greater conflict, meaning that our situation is hopeless. It is therefore in our best interests to establish peace with the USSR, which is hopefully not too unfavorable..."
 fin_external.9.t:0 "The Moscow Armistice"
 fin_external.9.d:0 "Now that we have gained the upper hand in the war, Finland has chosen to surrender. Once again, we have met with their diplomats in Moscow. Under the terms of the final treaty, we will force them to cede us the region of Petsamo and accept the 1940 borders otherwise, pay us US$300M in commodities over six years, ban parties that we consider fascist, and legalize the Communist Party of Finland. Finland will also have to remove German troops from its territory. Should we accept this treaty, or push through all of Finland?"
 fin_external.9.a:0 "We accept these terms."
 fin_external.9.b:0 "Finland shall be liberated!"
 fin_external.10.t:0 "The Moscow Armistice"
 fin_external.10.d:0 "The Reds have enforced yet another peace on us, and we have had to surrender to some humiliating terms. We will have to give up yet more territory and pay reparations to the USSR over six years, but the worst part is, we will have to legalize the Communist Party. This is truly the end of our hopes of a Greater Finland."
 fin_external.10.a:0 "And now we must force our former ally out of our land."
