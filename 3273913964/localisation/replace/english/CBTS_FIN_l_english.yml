 ##Karelia Conflict
 KR_Escalation:0 "Sihvo's War"
 KR_Escalation_desc:0 "Named after its progenitor, General Aarne Sihvo, the Finns have began a conflict in [FIN.GetKarClaims] over territory. The Finns advocate for uniting Karelia with Finland as the Karelians are ethnically related to the Finns. As the USSR is collapsing, the Finns seek to hasten the process by engaging the Soviets in a series of medium-scale skirmishes reminiscent of the expeditions of the 1920's. While this plan risks large-scale war and Soviet Counterattack, Sihvo is \"certainly persistant with his little war\", according to one English Politician.\n\nLocal Tension: §Y[?global.KR_Tension|0]§!\n§RIf tension reaches 100, a full-scale war will break out!§!"
 FIN_Full_Claim:0 "the Karelian Region"
 FIN_Rep_Claim:0 "the Regions of Repola and Porosozero"
 KR_attack_Murmansk:0 "Start a Skirmish in Murmansk"
 KR_attack_Karelia:0 "Start a Skirmish in Karelia"
 KR_attack_Repola:0 "Start a Skirmish in Repola"
 KR_attack_Olonets:0 "Start a Skirmish in Olonets"
 KR_planning_attack:0 "An attack is already being planned!"
 KR_counterclaim:0 "Claim Finnish Lands"
 KR_counterclaim_desc:0 "Having successfully beaten back the Finnish attack, we can claim parts of Finland as our own territory!"
 KR_attack_isthmus:0 "Start a Skirmish in the Karelian Isthmus"
 KR_attack_Viipuri:0 "Start a Skimrish in Viipuri"
 KR_claim_victory:0 "Claim Victory"
 KR_claim_victory_desc:0 "We have fulfilled our military objectives, and if we can hold on to them, then we can force our enemy to see that we are the true victors in this war."
 KR_start_war:0 "Conflict Escalation"
 KR_start_war_desc:0 "The Karelian Conflict has escalated too far! If it does not end immediately, we will be facing a large-scale war!"
 fin_civil_war.11.t:0 "Failure in Karelia"
 fin_civil_war.11.d:0 "\"Sihvo's War\" has ended with a total failure on our part. We have failed to prevent the enemy from achieving their aims. This will have a severe effect on the credibility of our government, as we have thrown away thousands of lives for nothing."
 fin_civil_war.11.a:0 "Damn!"