 ##Politics
 ARM_2RCW_Politics_Start:0 "Armenia is Free!"
 ARM_2RCW_Politics_Start_desc:0 "The Armenian Nation will soon be free from foreign oppression! The Soviets will be taken to task and Armenia will be strengthened to take on all would-be conquerors!"
 ARM_2RCW_National_Revolution:0 "The National Revolution"
 ARM_2RCW_National_Revolution_desc:0 "The unfortunate truth is that our Fatherland faltered in 1921. This is because the ARF only attempted a Social Revolution without a distinct National Character. Surely if we correct for this mistake, we should be able to succeed!"
 ARM_2RCW_Social_Revolution:0 "The Social Revolution"
 ARM_2RCW_Social_Revolution_desc:0 "One of our goals is to completely restructure Armenian society on Dashnak principles. Russian Feudalism was succeeded by Soviet Bureaucratism, with no real change for Armenia. Armenian society will become based on Equal Opportunity for All!"
 ARM_2RCW_Churches:0 "Reopen the Church"
 ARM_2RCW_Churches_desc:0 "The Armenian Churches were heavily persecuted by the Georgian Butcher. This has left Armenia in a spiratual crisis. If we are to achieve a National Rebirth, we must allow Spiratual Life to flourish again."
 ARM_2RCW_Speech:0 "Loosen Restrictions on Expression"
 ARM_2RCW_Speech_desc:0 "The people will be able to express themselves freely, so as long as it is not against the National Revolution. If they choose to criticize our independence, they'll be sent to prison as a dirty Bolshevik!"
 ARM_2RCW_Enemies_on_All_Sides:0 "Enemies on All Sides"
 ARM_2RCW_Enemies_on_All_Sides_desc:0 "Turks, Georgians, Russians, Bolsheviks, Azeris, Iranians, pah! If given the chance they would take total advantage of Armenia. We truly have enemies on all sides!"
 ARM_antagonize:0 "Chose to Antagonize Neighbors"
 ARM_2RCW_Democratic_Commitments:0 "Democratic Commitments"
 ARM_2RCW_Democratic_Commitments_desc:0 "The Democratic Process must be put on hold during the Revolutionary War, but we will promise that true Multi-Party Democracy shall come once the conflict ends."
 ARM_democratic_expections:0 "§YOur people will expect us to deliver on this promise.§!"
 ARM_2RCW_Ethnic_Equality:0 "Ethnic Equality"
 ARM_2RCW_Ethnic_Equality_desc:0 "It is vital that we outlaw all forms of national chauvanism. Despite our largely homogenous population, many Armenians feel justified in hating Turks, Azeris, Georgians, and even Russians. This cannot go on."
 ARM_2RCW_Red_Guard:0 "Form the Red Guard"
 ARM_2RCW_Red_Guard_desc:0 "The Red Guard shall be our State Militia, with the responsibilities of defending towns from bandit attacks and supplementing the army on the Fatherlands' Territory."
 ARM_red_guard:0 "Red Guard"
 ARM_2RCW_Top_Down:0 "Top-Down Organization"
 ARM_2RCW_Top_Down_desc:0 "Armenian Society should be reorganized through a Top-Down method, where commands come from the Central Government and carried out by local leaders."
 ARM_2RCW_Bottom_Up:0 "Bottom-Up Organization"
 ARM_2RCW_Bottom_Up_desc:0 "Armenian Society should be reorganized through a Bottum-Up method, where local leaders determine the best course of action and ask the Central Government for approval and assistance."
 #Economics
 ARM_2RCW_Economics_Start:0 "Mobilize the People"
 ARM_2RCW_Economics_Start_desc:0 "The Armenian economy is extremely lacking, especially compared to the Bolshevik Oppressor. If we are to defend our freedom, we must establish a military economy!"
 ARM_2RCW_Reform_Collective_Farms:0 "Koltntesutyun Reform"
 ARM_2RCW_Reform_Collective_Farms_desc:0 "The Bolshevik Collective Farms sounded good on paper: the land and produce would be owned and managed by those working it. In practice, it became another state-run nightmare, established by force. We shall reform them to be truly democratically managed."
 ARM_collective_reform:0 "Collective Farm Reform"
 ARM_2RCW_Decollectivize:0 "Decollectivization"
 ARM_2RCW_Decollectivize_desc:0 "The Collective Farm system was a complete failure. It is time to end the institution for good, so it can be replaced with True Socialist Reforms. Thus, for now, all land will be fairly partitioned among the peasants."
 ARM_Disband_State_Farms:0 "Disband State Farms"
 ARM_Disband_State_Farms_desc:0 "The \"State Farm\" was a Soviet state-run agricultural production unit. These will be totally disbanded, and the farmers will be allowed to determine the land's future democratically."
 ARM_people_market:0 "People's Market Economy"
 ARM_Mixed_Economy:0 "The People's Market"
 ARM_Mixed_Economy_desc:0 "Armenian Independence requires that the people's strengths be entirely captured and directed against the enemy! Ergo, there is room for State, Collective, and Private Ownership, but no room for exploitation!"
 ARM_Foreign_Loans:0 "Take Foreign Loans"
 ARM_Foreign_Loans_desc:0 "We may have enemies on all sides, but we can likely find foreign countries or firms ready to lend us money for our defense."
 ARM_Foreign_Weapons:0 "Purchase Foreign Weapons"
 ARM_Foreign_Weapons_desc:0 "We can purchase foreign weapons to aid our military production. We want to build up industry of course, but we must defend our lands first!"
 ARM_Mil_Factory:0 "Armenian Defense Industry"
 ARM_Mil_Factory_desc:0 "It is imperative that we establish a defense industry immediately. In addition to providing the military with equipment, we would be providing employment as well."
 ARM_Steel:0 "Expand Mining Operations"
 ARM_Steel_desc:0 "Armenia has quite a lot of mineral deposits. We should expand our iron mining operations to become competative in the world market."
 ARM_Infrastructure:0 "Expand Local Infrastructure"
 ARM_Infrastructure_desc:0 "Armenian Infrastructure is in terrible condition, and with our mountainous terrain, our soldiers need expanded rail and roadways to be able to transport supplies and equipment."
 ARM_Civilian_Industry:0 "State-Owned Construction Firms"
 ARM_Civilian_Industry_desc:0 "A state-owned construction firm would do well to server our military's interests."
 ARM_Industrial_Tech:0 "Industrial Technology"
 ARM_Industrial_Tech_desc:0 "We cannot rely on our neighbors to provide reliably friendly trade relations. Thus, we must ensure that we are technologicaly advanced."
 #military
 ARM_2RCW_Military_Start:0 "A New Armenian Army"
 ARM_2RCW_Military_Start_desc:0 "A Strong and Independent Armenia needs an army to defend it against foreign threats."
 ARM_guerrilla_warfare:0 "Guerrilla Warfare"
 ARM_2RCW_Guerilla_Warfare:0 "Guerilla Tactics"
 ARM_2RCW_Guerilla_Warfare_desc:0 "We cannot fight the Bolshevik Imperialists in open combat. We must train our soldiers to fight in the shadows instead!"
 ARM_2RCW_Infantry_Equipment:0 "Develop Local Firearms"
 ARM_2RCW_Infantry_Equipment_desc:0 "We must rely on local brainpower to create new firearm designs for the army."
 ARM_2RCW_Mountaineers:0 "Mountain Men"
 ARM_2RCW_Mountaineers_desc:0 "Armenia is mostly mountainous terrain, so if we improved our mountaineering methods, we could better fight the invaders!"
 ARM_2RCW_Support_Troops:0 "Support Battalions"
 ARM_2RCW_Support_Troops_desc:0 "Engineers, Reconiteures and Radiomen would all improve the effectiveness of our military."
 ARM_2RCW_Artillery:0 "Artillery Equipment"
 ARM_2RCW_Artillery_desc:0 "We must develop new artillery designs in case we get the ability to actually mass-produce artillery pieces."
 ARM_2RCW_Doctrine:0 "Develop New Doctrines"
 ARM_2RCW_Doctrine_desc:0 "Now that our military is in some sort of shape, we can begin theorizing new tactics and strategies."
 #decisions
