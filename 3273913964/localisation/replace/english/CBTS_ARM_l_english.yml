 ARM_ethnic_tensions:0 "Ethnic and Sectarian Tensions"
 ARM_ethnic_tensions2:0 "Ethnic and Sectarian Tensions"
 ARM_ethnic_tensions3:0 "Ethnic and Sectarian Tensions"
 ARM_ethnic_tensions_desc:0 "Armenia generally has an Armenian population (nearly 83% in the last census), but there is still a large amount of internal tension. Our largest minority, the Azerbaijanis, long to be part of Azerbaijan, especially as the Dashnaks are considered to be discriminatory against non-Armenians.\n\nDespite the intense Soviet persecution of Armenian Religion, Armenian Coptic and Catholic Churches have survived both in the Diaspora and the Underground. Tensions between the two Catholic branches, Echmiadzin and Cicilia, have caused great strain on the Diaspora, and will surely do so to an independent Armenia."
 ARM_ethnic_tensions2_desc:0 "Armenia generally has an Armenian population (nearly 83% in the last census), but there is still a large amount of internal tension. Our largest minority, the Azerbaijanis, long to be part of Azerbaijan, especially as the Dashnaks are considered to be discriminatory against non-Armenians.\n\nDespite the intense Soviet persecution of Armenian Religion, Armenian Coptic and Catholic Churches have survived both in the Diaspora and the Underground. Tensions between the two Catholic branches, Echmiadzin and Cicilia, have caused great strain on the Diaspora, and will surely do so to an independent Armenia."
 ARM_ethnic_tensions3_desc:0 "Armenia generally has an Armenian population (nearly 83% in the last census), but there is still a large amount of internal tension. Our largest minority, the Azerbaijanis, long to be part of Azerbaijan, especially as the Dashnaks are considered to be discriminatory against non-Armenians.\n\nDespite the intense Soviet persecution of Armenian Religion, Armenian Coptic and Catholic Churches have survived both in the Diaspora and the Underground. Tensions between the two Catholic branches, Echmiadzin and Cicilia, have caused great strain on the Diaspora, and will surely do so to an independent Armenia."
 ARM_foreign_diaspora:0 "Foreign Diaspora"
 ARM_foreign_diaspora_desc:0 "After the Armenian Genocide and the destruction of the First Republic, a large Diaspora of Armenians found themselves scattered across the globe, particularly in the United States of America, Lebanon, France, Ukraine, and Canada. The Diaspora has continued to keep Armenian political activity alive through the Dashnaks, such as lobbying governments to recognize their struggle. Recently, members of the diaspora have been sending financial support to Yerevan to help us achieve lasting independence. Our government hopes to bring them home once peace is achieved." 
 ARM_dreams_of_ararat:0 "Dreams of Ararat"
 ARM_dreams_of_ararat2:0 "Dreams of Ararat"
 ARM_dreams_of_ararat_desc:0 "Visible from Yerevan, Mount Ararat is one of the greatest symbols for Armenian Nationalists. Held by Turkey, the alleged \"Holy Mountain\" has been featured in religious texts, poems, and even on the Armenian coat of arms. The nationalist fervor that now strikes Armenia can be summarized as a desire for the Mountain to reside in Armenian Territory alongside the other Armenian Irridentist Claims."
 ARM_dreams_of_ararat2_desc:0 "Visible from Yerevan, Mount Ararat is one of the greatest symbols for Armenian Nationalists. Held by Turkey, the alleged \"Holy Mountain\" has been featured in religious texts, poems, and even on the Armenian coat of arms. The nationalist fervor that now strikes Armenia can be summarized as a desire for the Mountain to reside in Armenian Territory alongside the other Armenian Irridentist Claims."
 ARM_agrarian_population:0 "Agrarian Population"
 ARM_agrarian_population_desc:0 "A large majority of Armenians still live in rural areas. The lack of population concentration will make industrializing our territory very difficult."
