 #events
 arm_civil_war.1.t:0 "The National Revolution"
 arm_civil_war.1.d:0 "For far too long, Armenians have been denied the dignity of nationhood. Ottoman oppresion and Russian lies cannot stifle the Armenians' love of freedom. Though we have declared our country to be free, the Bolsheviks are coming to re-oppress our nation. Let them come, we are ready for them!"
 arm_civil_war.1.a:0 "To Arms!"
 arm_civil_war.2.t:0 "Taronakan Militias"
 arm_civil_war.2.d:0 "Taronakan is a group of so-called \"Tribalists\" who believe in an extremely radical form of Armenian Nationalism. Borrowing from Fascism, the Taronakan's ideology (Taronism) features an intense devotion to the creation of an Armenian state through the rebirth of Armenian cultural and spiratual identities. Although no longer part of the ARF, this movement has been growing within the Dashnak organization, with new adherents seeing it as a way to achieve both a national and a social revoltion. Founder Garegin Nzhdeh has announced the formation of two Taronist Militias, partially composed of ARF members. It seems that whether we like it or not, the Ultranationalists are now part of our movement."
 arm_civil_war.2.a:0 "We will keep a close eye on them..."
 #internal
 arm_internal.1.t:0 "Ethnic Tensions Escalate"
 arm_internal.1.d:0 "Despite our commitment to ethnic equality, minorities feel that we are not doing enough to actually enforce the law. Armenians have reacted to the Equality Statute quite badly, and in reaction, have only increased their attacks on minority groups. Seeing an Azeri or a Russian being attacked in the street is not a rare occurance, and many times, the local authorities seem to be indifferent."
 arm_internal.1.a:0 "What horror!"
 arm_internal.2.t:0 "Anti-Communist Mobs"
 arm_internal.2.d:0 "Ever since the Armenian people overthrew Bolshevik rule, Communist activists have been trying to organize in an attempt to undermine the National Revolution! In response, the citizens have taken it upon themselves to find and disperse these Enemies of the People. However, these often violent confrontations have done little to impress some members of our government, who feel that the citizens should not be able to take the law into their own hands, and a softer touch is needed. On the other hand, nobody seems that keen to stop them..."
 arm_internal.2.a:0 "Patriots or Punishers?"
 arm_internal.3.t:0 "Yerevan Today"
 arm_internal.3.d:0 "\"Yerevan Today\" is the first Conservative newspaper published in Armenia since 1920. The eight-page paper celebrated its inaugural issue with a celebration of the National Revolution, the Government, and the Army. It mainly focuses on the ways Armenia has improved since the Bolshevik Yoke has been thrown off. The paper maintains that political and religious affairs have been on the rise, which will lead Armenia into a Holy Position of Glory!"
 arm_internal.3.a:0 "All should read \"Yerevan Today\"!"
 arm_internal.4.t:0 "Economic Upturn"
 arm_internal.4.d:0 "Ever since our economic positions became clear, the economy has been steadily improving. The combination of Private, Public, and Collective ownership has enabled people to put their skills to use in the methods that they choose, rather than having exploiters tell them what to do. Yerevan has seen the rise of small businesses, generally craftspeople, grocers, and the like. Although Armenians remain poor, their standard of living has at least stabilized now that there is an economy to participate in."
 arm_internal.4.a:0 "Hopefully this can continue.".
 arm_internal.5.t:0 "Bolshevik Protest"
 arm_internal.5.d:0 "Armenian Bolsheviks enjoy the social status of Traitors in the same way that Armenian Patriots did 20 years ago. However, they have managed to form a large protest in Yerevan, in which they decry political violence and demand the transfer of power to a HKK Central Committee. Counter-protesters have shown up as well, and the situation has become tense. If we don't stop the protests now, it may lead to violence."
 arm_internal.5.a:0 "Let them continue."
 arm_internal.5.b:0 "Shut it down."
 arm_internal.6.t:0 "Cultural Festival"
 arm_internal.6.d:0 "Yerevan was the site of a large cultural festival today. People came from all over the city to celebtrate Armenian Music, Dance, Theater, and Cusine. The party lasted from the early afternoon well into the night, and allowed the people - including some soldiers - to relax and take their mind off of the war. This is sure to give our people a much-needed morale boost."
 arm_internal.6.a:0 "A Great Success!"
 arm_internal.7.t:0 "Intense Party Debate"
 arm_internal.7.d:0 "A debate in the Yerevan Party Committee became extremely tense after a debate between the left and right wings. Essentially, the right holds that we should increase the politicization of the army so that they will have more morale in the battlefield. The left, on the other hand, thinks the army should be apolitical so they would have more time for training. If it were not for the security guards, this debate would have turned into a fight! It is up to us to decide which faction to side with."
 arm_internal.7.a:0 "The Left!
 arm_internal.7.b:0 "The Right!"
 arm_internal.8.t:0 "Taronist Rally Turns Violent"
 arm_internal.8.d:0 "A Taronist Rally in Yerevan occured today in the Square (formerly Lenin Square) right outside the Government House. The 40 or so Taronists sang patriotic songs, chanted Taronist slogans, and listned to a speech by their leader, Garegin Nzhdeh in which he decried the Bolshevik and Azeri oppressors and declared support for the National Revolution, and read out a list of demands. However, a Marxist band arrived and began to denounce the ARF and Taronists. After some back-and-forth yelling, the Taronists and Marxists began fighting, which lasted until soldiers could arrive to break them up and arrest the rioters."
 arm_internal.8.a:0 "Horiffic!"
