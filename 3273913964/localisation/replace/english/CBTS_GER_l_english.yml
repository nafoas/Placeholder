 ##Other Politics
 GER_DNVP_Restore_Monarchy:0 "Restore the Monarchy"
 GER_DNVP_Restore_Monarchy_desc:0 "Now that the National Socialists are out of the way, we can restore the Hohenzollern Dynasty to the German Throne, just as we promised all those years ago!"
 GER_DNVP_Destroy_SA:0 "Destroy the Sturmabteilung"
 GER_DNVP_Destroy_SA_desc:0 "We have tolerated the National Socialist Militia for too long! The thuggery of the Hitlerists will end!"
 GER_DNVP_Demobilize:0 "Demobilization"
 GER_DNVP_Demobilize_desc:0 "The war is over. We have won, the people are tired, and all that remains is to demobilize and allow peace to reign."
 GER_DNVP_Create_Faction:0 "The Berlin Axis"
 GER_DNVP_Create_Faction_desc:0 "We must create a network of alliances if we are to be victorious. Our alliance shall be called the Berlin Axis, as the whole world will be centered on Berlin!"
 GER_DNVP_Demobilize_Rations:0 "End Rationing"
 GER_DNVP_Demobilize_Rations_desc:0 "The people want to go back to a peacetime economy, and we will end rationing programs to help them do so."
 
 GER_faction_tooltip:0 "Click to see ways to spend Factional Influence."
 
 GER_Hitlerist_Factionalism:0 "Political Factions"
 GER_Hitlerist_Factionalism_desc:0 "There are three factions vying for influence in Germany. The Military Faction represents the Wehrmacht (excluding the SS) and the officer corps. The Party Faction represents the NSDAP and the Bureaucracy, and the SS Faction represents Himmler and his Paramilitary.\n\nThe Military has §Y[?GER.GER_Hitler_Army_Points]§! Points of Influence.\nThe Party has §Y[?GER.GER_Hitler_Party_Points]§! Points of Influence.\nThe SS has §Y[?GER.GER_Hitler_SS_Points]§! Points of Influence."
