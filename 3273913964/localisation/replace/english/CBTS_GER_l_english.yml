 GER_Dezemberprogramm_1933: "December Programm 1933"
 #Naval Expansion
 GER_Naval_Expansion:0 "Naval Expansion"
 GER_Naval_Expansion_desc:0 "Our navy is severly lacking. If we are to compete with Britain and France, it must be expanded."
 GER_Plan_D_Mission:0 "Plan D"
 GER_Plan_D_Mission_desc:0 "Plan D is Karl Dönitz's plan for naval expansion. It warrants that the Navy must consist of several hundred submarines in order to starve the British from colonial resources."
 GER_Plan_Z_Mission:0 "Plan Z"
 GER_Plan_Z_Mission_desc:0 "Plan Z is Erich Raeder's Plan for naval expansion. It warrants that the Navy must consist of several Aircraft Carriers, Battleships, a large amount of Heavy Cruisers, and many smaller ships to properly engage enemy fleets."
 #Other
 GER_Hitler_Second_NAP_With_Poland:0 "Renew the Non-Aggression Pact with Poland"
 GER_Hitler_Second_NAP_With_Poland_desc:0 "Our non-aggression pact with Poland technically lasts 10 years. However, we should threaten to rescind the pact unless Danzig is returned to the Reich."
 #Bitter Loser
 GER_Bitter_Loser:0 "Improving National Spirit"
 GER_Bitter_Loser_desc:0 "The German People are very bitter about the loss in the Great War. The only way they will be satiated is victory, either in diplomacy or war!"
 GER_Got_Paris:0 "Occupation of Paris"
 GER_Got_Paris_desc:0 "Paris, the city of Lights is now under our control! At long last we have avenged the humiliating defeat of the previous war. Rache!"
 GER_Got_London:0 "Capture of London"
 GER_Got_London_desc:0 "We have captured London! If we can keep it, we can improve the spirit of the German People!"
 GER_Got_Moscow:0 "Capture of Moscow"
 GER_Got_Moscow_desc:0 "We have captured Moscow! If we can keep it, we can improve the spirit of the German People!"
 #Big Buildings
 GER_Welthaupstadt_Germania:0 "Gesamtbauplan für die Reichshauptstadt"
 GER_Welthaupstadt_Germania_desc:0 "Now that we have the construction materials and personnel to spare, we should embark on the greatest construction project known to man - Welthaputstadt Germania. The Comprehensive Construction Plan for the Reich Capital includes grand constructions such as the Volkshalle, the Prachtallee, the Großer Platz, and other grand infrastructure projects that will cement Berlin as the World Capital!"
 GER_Volkshalle:0 "Build the Volkshalle"
 GER_Volkshalle_desc:0 "The Volkshalle, or \"People's Hall\", will be the official meuseum of National Socialism, where artifacts will be kept and propaganda mercilessly repeated in order to ensure public worship of the Führer."
 GER_Avenue_of_Splendors:0 "Build the Prachtalee"
 GER_Avenue_of_Splendors_desc:0 "The axis of Berlin's new organization will be the Practhalee, or \"Avenue of Splendors\". Comparable to Michigan Avenue in Chicago or the Arbat in Moscow, this will be a five kilometer long boulevard, built specifically for military parades. As a result, it will need new tunnels, as it will be closed to motor traffic."
 GER_Avenue_of_Splendors_train_stations:0 "Train Stations for the Prachtalee"
 GER_Avenue_of_Splendors_train_stations_desc:0 "Now that the Avenue of Splendors is complete, we need two new train stations at each end of the avenue. The Nordbahnhof in the north, and the Südbahnhof in the south. Anhalter Bahnhof will be turned into a swimming pool."
 GER_Grand_Plaza:0 "Build the Großer Platz"
 GER_Grand_Plaza_desc:0 "The Granad Plaza will be an open square encompassed by the Führer's Palace, the old Reichstag, the Reich Chancellry, the Oberkommando des Wehrmachts headquarters, and the Volkshalle."
 GER_Arch_Of_Triumph:0 "Build the Triumphbogen von der Führer"
 GER_Arch_Of_Triumph_desc:0 "Tbe Führer's Arch of Triumph will be able to fit the French Arc de Triomphe within its opening, in order to remind the world that it is Germany, not France, that is triumphant. The names of the Two Million German dead in the First World War will be carved into the structure."
 GER_Rename_Berlin:0 "Rename Berlin"
 GER_Rename_Berlin_desc:0 "Now that our major renovations are done, we can rename Old Berlin to a more fitting title: \"Germania\"!"

 GER_Linz_Project:0 "Jugendstadt des Führers"
 GER_Linz_Project_desc:0 "Linz - now known by it's cermonial title of \"City of the Führer's Youth\" - will become the new cultural center of the Reich. It was chosen for two main reasons. First, it is the birthplace of Adolf Hitler, and second, Hitler's innate distate of Vienna drove him to plan Linz as a \"German Budapest\". It will include an art museum, large houses, a new Wehrmacht Headquarters, and an observatory."
 GER_Build_Fuhrermuseum:0 "Build the Führermuseum"
 GER_Build_Fuhrermuseum_desc:0 "The Führer Museum will be the largest painting collection in Europe, where we will display looted artwork from across the Continent. Its design is based on the House of German Art in München, and will be the centerpiece of the Hitlerzentrum, or \"Hitler Center\"."
 GER_Build_Hitler_Center:0 "Build the Hitlerzentrum"
 GER_Build_Hitler_Center_desc:0 "The \"Hitler Center\" will be the grand cultural center of the Reich. It shall contain community buildings to promote Volksgemeinschaft and unity."
 GER_Linz_Housing:0 "Advanced Housing Projects"
 GER_Linz_Housing_desc:0 "We should use Reichswerke Hermann Göring to bring in workers from Vienna in order to build housing in the outskirts of Linz and on the Danube. These housing projects will provide even more reason to make Vienna a backwater."
 GER_Linz_kdf_Hotel:0 "Build a Kraft durch Fruede Hotel"
 GER_Linz_kdf_Hotel_desc:0 "A Hotel for the \"Strength through Joy\" Program will icnrease Linz's status in the opinion of the working people. Therefore, it should be a priority."
 GER_Linz_Party_House:0 "Build a NSDAP Party Headquarters"
 GER_Linz_Party_House_desc:0 "With Roderich Fick's new party house, Party Headquarters in the Gau - and all of Ostmark - will be moved to Linz!"
 GER_Linz_Olympic_Stadium:0 "Build the Reichsstadium"
 GER_Linz_Olympic_Stadium_desc:0 "The Reich Olympic Stadium will be a massive stadium, used for all National Level Sporting Events, and will be able to sit over 20,000 people. It will remind people of the athletic prowess of the German People."
 GER_Linz_Wehrmacht_Headquarters:0 "Build a new Wehrmacht Headquarters"
 GER_Linz_Wehrmacht_Headquarters_desc:0 "Command of the armed forces in Ostmark will be handled from Linz. Hidden behind the Alps, it is even more defensible than Vienna!"
 GER_Linz_Observatory:0 "Build an Observatory"
 GER_Linz_Observatory_desc:0 "In order to counter the \"pseudo-science\" and the influence of the Catholic Church, an observatory must be built. It will be used to represent Ptolemy, Copernicus, and Hörbiger, considered by the Führer to be three of the greatest minds in Europe."
 GER_Linz_Bridge:0 "Build the Nibelungen Bridge"
 GER_Linz_Bridge_desc:0 "The Nibelungen Bridge will be a massive suspension bridge to cross the Danube, and will have artwork depicting the Nibelungen saga of Norse Mythology, along with equestrian statues of Siegfried, Kriemhild, Gunther, and Brünhild."

 GER_Bavarian_Projects:0 "Bavarian Projects"
 GER_Bavarian_Projects_desc:0 "It has been decided that München, Bayreuth, Würzburg, and Weimar will be remodeled on the orders of the Führer, and in the same style of the new Berlin and Linz. These projects will be smaller, but will be no less important to establishing our New Order. München, the Capital of the Movement will be the central focus of these projects." 
 GER_Munich_Party_Museum:0 "München: Build the Parteimuseum"
 GER_Munich_Party_Museum_desc:0 "As the Capitol of the National Socialist Movement, München will be given a Party Museum, to show the people the early days of the German Workers' Party, and the fledgling NSDAP. Of course, propaganda and lies will be infused throughout, yet our aim is not to tell the truth, but to overwhelm the Volk with our might!"
 GER_Munich_Luftwaffe_Strasse:0 "München: Build the Luftwaffestraße"
 GER_Munich_Luftwaffe_Strasse_desc:0 "\"Air Force Street\" will be a grand, half-kilometer long avenue in the center of München, in the style of the Prachtalee in Berlin. It will be decorated by statues of German Aces, and in the center, there will be a gazebo with an authentic Messerschmitt BF-109 inside it. This will show the people the power of our air force!"
 GER_Munich_Airport:0 "München: Build the Reichsflughaven \"Hermann Göring\""
 GER_Munich_Airport_desc:0 "The Hermann Göring Imperial Airport will be a major hub for Germans wishing to tour the Fatherland, but it will also be able to be used for military purposes. Such a project may be inconvenient, but we have the power to build it anyways. Named after the Chief of the Luftwaffe, the airport will be adorned with a giant portrait of the Reich Minister of Aviation as propaganda, to remind people exactly who won the war in the air."
 GER_Bayreuth_Festspielhaus:0 "Bayreuth: Remodel the Festspielhaus"
 GER_Bayreuth_Festspielhaus_desc:0 "National Socialist leaders love the annual Bayreuth Festival, in which composer Richard Wagner is celebrated for his genius. However, the Richard Wagner Festival Theatre could do with some remodeling. Redoing it in the National Socialist style would connect Germany's Imperial Past to its current National Socialist present, making it effective propaganda."
 GER_Bayreuth_Gauforum:0 "Bayreuth: Build the Gauforum"
 GER_Bayreuth_Gauforum_desc:0 "The Gauforum will be a government building combined with a marching square. It will symbolise the power of the National Socialists in the town, and will occasionally feature military marches. This is especially significant due to Bayreuth's proximity to the Sudetenland."
 GER_Wurzburg_Residenz:0 "Würzburg: Build the Reichsmuseum"
 GER_Wurzburg_Residenz_desc:0 "Housed within the Würzburger Residenz - a grand palace in Würzburg - The Imperial Museum shall showcase the lifestyle and power of the old German Kings. It will remind people that although we have surpassed the power of the Old Empire, the New Empire has a different mindset than decadence and wealth. At least officially."
 GER_Wurzburg_Fortress:0 "Würzburg: Expand the Festung Marienberg"
 GER_Wurzburg_Fortress_desc:0 "The Marienberg Fortress shall be expanded to serve as an arms depot for the army. It will house surplus equipment and a training site."
 GER_Weimar_Rename:0 "Weimar: Rename the City"
 GER_Weimar_Rename_desc:0 "The name \"Weimar\" is tainted in the National Socialist view because of its association with the former republic. Therefore, it will be renamed Franz-List-Stadt."

 GER_Rhine_Projects:0 "Rhine Projects"
 GER_Rhine_Projects_desc:0 "In the West, Köln, Düsseldorf, Heidelberg, Münster, Saarbrücken, Waldbröl, and Wuppertal are all in need of National Socialist replanning. The Remilitarization of the Rhineland was the Reich's first military victory, and it will be celebrated as such."
 GER_Koln_Wehrmacht_Headquarters:0 "Köln: Build a new Wehrmacht Headquarters"
 GER_Koln_Wehrmacht_Headquarters_desc:0 "Köln is the seat of the Militärbereichshauptkommandoquartier (Military Area Command Headquarters) for the Münster Military District. However, with the construction of a new, grand, Headquarters, Köln will be the Military Capital of all of Western Germany!"
 GER_Koln_Monument:0 "Köln: Build a Monument"
 GER_Koln_Monument_desc:0 "A monument to the Fallen of the War will serve to remind the people of those who sacrificed everything for our Reich, and to instruct the people to do the same."
 GER_Dusseldorf_Worker_Museum:0 "Düsseldorf: Build the Arbeitermuseum"
 GER_Dusseldorf_Worker_Museum_desc:0 "The Museum of the Workers will showcase German Industrial might in a place where the people can appreciate the laborers that make their lives possible. It will be a nice place to promulgate National Socialist Propaganda; as long as nobody thinks to check further, we should be undetected."
 GER_Dusseldorf_Party_Headquarters:0 "Düsseldorf: Build a Party Headquarters"
 GER_Dusseldorf_Party_Headquarters_desc:0 "Düsseldorf shall become the seat of Party Headquarters in Northwestern Germany."
 GER_Heidelberg_Train_Depot:0 "Heidelberg: Build a Train Depot"
 GER_Heidelberg_Train_Depot_desc:0 "Heidelberg already has excellent infrastructure. We should build a train depot there to serve Western and Central Germany."
 GER_Munster_Wehrmacht_Headquarters:0 "Münster: Build a new Wehrmacht Headquarters"
 GER_Munster_Wehrmacht_Headquarters_desc:0 "While Münster is currently the headquarters of the 6th Military District, a new large military headquarters will make it the Headquarters for the Wehrmacht in Northwest Germany, even including Holland."
 GER_Munster_Saarbrucken_Plebiscite_Monument:0 "Saarbrücken: The Plebiscite Memorial"
 GER_Munster_Saarbrucken_Plebiscite_Monument_desc:0 "Saarbrücken came back to Germany in a plebsicite, and we should build a new memorial to commemorate the occasion!"
 GER_Waldbrol_Tractors:0 "Waldbröl: Build the Volkstraktorenwerke"
 GER_Waldbrol_Tractors_desc:0 "Envisioned by Dr. Robert Ley, The National Tractor Plants will bring workers to Waldbröl, which would serve his intention in making Waldbröl a large city."
 GER_Wuppertal_Reich_Church_Headquarters:0 "Wuppertal: Build a Reich Church Headquarters"
 GER_Wuppertal_Reich_Church_Headquarters_desc:0 "Wuppertal will become the regional seat of the Reich Evangelical Church. From here, it will serve all of Western and Central Germany. This is meant to overshadow the Christian Resistance in the city."

 GER_Hannover_Projects:0 "Hannover Projects"
 GER_Hannover_Projects_desc:0 "Much like their southern brethren, Hannover, Bremen, and Oldenburg will be redone with National Socialist planning, to serve as propaganda."
 GER_Hannover_Tank_Museum:0 "Hannover: Build the Panzermuseum"
 GER_Hannover_Tank_Museum_desc:0 "The Hannover Museum of Tanks will show off the power of the German War Machine, and point out the \"inferiority\" of captured enemy machines."
 GER_Bremen_Navy_Museum:0 "Bremen: Build the Kreigsmarinemuseum"
 GER_Bremen_Navy_Museum_desc:0 "The Naval Museum will showcase the Reich's overseas power, and celebrate its triumphs over larger enemy navies and convoys!"
 GER_Oldenburg_Rokker_Street:0 "Oldenburg: Build Heinz-Rökker-Straße"
 GER_Oldenburg_Rokker_Street_desc:0 "A proud son of Oldenburg, Heinz Rökker is a german fighter ace, who shot down 63 aircraft at night. He definitely deserves a promotion and his own re-constructed street in Oldenburg."

 GER_Nordstern_Projects:0 "Nordstern"
 GER_Nordstern_Projects_desc:0 "Trondheim has already been developed as a naval base, but the Führer wishes for it to be a new metropolis, with a population of three hundred thousand inhabitants. It will need a larger port, grand housing projects, and work provided for the immigrants. The Führer also wants shipyards, a coastal fort, connections to the Autobahn, and an art museum."
 GER_Nordstern_Port:0 "Expand the Port"
 GER_Nordstern_Port_desc:0 "In order to house our fleet, we need to expand the Trondheim Port."
 GER_Nordstern_Dockyard:0 "Expand Trondheim Dockyards"
 GER_Nordstern_Dockyard_desc:0 "We need dockyards to expand our fleet. We shall build some at Nordstern in order to make sure that it can produce ships, even if it is disconnected from the mainland."
 GER_Nordstern_Housing:0 "Housing Projects"
 GER_Nordstern_Housing_desc:0 "In order to be a metropolis, Nordstern will need people. And in order to house the people, we must build houses for them."
 GER_Nordstern_Factory:0 "Work for the Immigrants"
 GER_Nordstern_Factory_desc:0 "The Colonial Population will need work, so we should build a factory for them to work in."
 GER_Nordstern_Coastal_Fort:0 "Expand the Atlantikwall"
 GER_Nordstern_Coastal_Fort_desc:0 "Nordstern will be a major city, so we need to build a coastal fort to protect the city from naval invaders."
 GER_Nordstern_Autobahn_norway:0 "Connect Nordstern to the Autobahn - Norway"
 GER_Nordstern_Autobahn_norway_desc:0 "We should build a highway to connect Nordstern to the rest the Reich. The plan is to build an autobahn across the Little and Great Belts of Denmark and further through southwest Sweden and Norway to connect the northern outpost with Germany proper."
 GER_Nordstern_Autobahn_sweden:0 "Connect Nordstern to the Autobahn - Sweden"
 GER_Nordstern_Autobahn_sweden_desc:0 "We should build a highway to connect Nordstern to the rest the Reich. The plan is to build an autobahn across the Little and Great Belts of Denmark and further through southwest Sweden and Norway to connect the northern outpost with Germany proper."
 GER_Nordstern_Autobahn_denmark:0 "Connect Nordstern to the Autobahn - Denmark"
 GER_Nordstern_Autobahn_denmark_desc:0 "We should build a highway to connect Nordstern to the rest the Reich. The plan is to build an autobahn across the Little and Great Belts of Denmark and further through southwest Sweden and Norway to connect the northern outpost with Germany proper."
 GER_Nordstern_Art_Museum:0 "Build the Nordmuseum"
 GER_Nordstern_Art_Museum_desc:0 "The Northern Museum will be a display of German and Nordic Art, meant to imply that the Nordic Countries are rightfully German, and thus solidifying our control."
 GER_Nordstern_Rename:0 "Formally Declare Nordstern"
 GER_Nordstern_Rename_desc:0 "Now that our construction is complete and immigrants are coming in, we can formally declare Trondheim to be Nordstern, the North Star of the Reich!"

 GER_Prussian_Projects:0 "Prussian Projects"
 GER_Prussian_Projects_desc:0 "In line with the remodeling in the West and the South, Breslau, Danzig, Königsberg, Memel, and Posen will be redesigned. They will be remade to showcase our success in battle!"
 GER_von_Pohl_Street:0 "Breslau: Build Hugo-von-Pohl-Straße"
 GER_von_Pohl_Street:0 "Hugo von Pohl was a German Admiral during the First World War, commanding the High Sees Fleet, who is notable for advocating for unristricted submarine warfare. We shall create a large avenue in Breslau, called Hugo von Pohl Street, to showcase this hero!"
 GER_Danzig_Party_Headquarters:0 "Danzig: Build a Party Headquarters"
 GER_Danzig_Party_Headquarters_desc:0 "Danzig will become the seat of NSDAP headquarters for West Prussia, Posen, and East Prussia. A Grand Building is thus required to accomodate this request."
 GER_Posen_Military_Headquarters:0 "Posen: Build a Wehrmacht Headquarters"
 GER_Posen_Military_Headquarters_desc:0 "A new Wehrmacht Headquarters in Posen would do well in case something happens in occupied Poland that we have to take care of quickly."
 GER_Konigsberg_Fortress:0 "Festung Königsberg"
 GER_Konigsberg_Fortress_desc:0 "Building up a fort in Königsberg will prevent the city from being taken in the event of military failure."
 GER_Memel_Trade_Center:0 "Memel: Build a Trade Center"
 GER_Memel_Trade_Center_desc:0 "The Memel Trade Center will be a glorious showroom, built to show off new technologies and the industrial power of the Reich."
 GER_Saxon_Projects:0 "Saxon Projects"
 GER_Dresden_Courthouse:0 "Dresden: Remodel the Münchner Platz"
 GER_Dresden_Courthouse_desc:0 "The Münchner Platz is notable for the large amounts of death penalties it hands out to dissidents. We should remodel it to show the power of National Socialist \"Justice\"!"

 GER_Austrian_Projects:0 "Austrian Projects"
 GER_Austrian_Projects_desc:0 "The First Real Territorial Addition to the Reich, Ostmark should also be redesigned in Speer's style. Salzburg, Innsbruck, and Graz will be reconstructed."
 GER_Salzburg_Mozartfestspiel:0 "Salzburg: Build the Mozartfestspiel"
 GER_Salzburg_Mozartfestspiel_desc:0 "The Mozart Festival Theatre will be a grand orchestral center, built to display the works of Wolfgang Amadeus Mozart, noted Austrian - now German - composer."
 GER_Innsbruck_Anchsluss_Monument:0 "Innsbruck: A monument for the Anchshluss"
 GER_Innsbruck_Anchsluss_Monument_desc:0 "A monument commemorating the Return of Austria to the Reich shall be built in the Great City of Innsbruck."
 GER_Graz_Museum:0 "Graz: Build the Heiliges-Römisches-Reich-Museum"
 GER_Graz_Museum_desc:0 "The Holy Roman Empire Museum will teach the people about the First Reich, the one that actually lasted one thousand years. Of course, it will be filled with Francophobic and Anti-Slavic Propaganda, although we prefer to call it German patriotism."

 GER_Pabst_Plan:0 "Neue deutsche Stadt Warschau"
 GER_Pabst_Plan_desc:0 "Concieved by Friederich Pabst, the New German City of Warsaw will be a total reconstruction of Warsaw ans a colonial capital. It will House the German Elite of the Generalgouvernement, and serve as a transportation hub."
 GER_Pabst_Parteivolkshalle:0 "Build a Parteivolkshalle"
 GER_Pabst_Parteivolkshalle_desc:0 "The People's Party Hall in the new Warsaw will be built in place of the Royal Castle in Warsaw, and will be the seat of the NSDAP in the Generalgouvernement."
 GER_Pabst_Elite_Homes:0 "Build Homes for the Elite"
 GER_Pabst_Elite_Homes_desc:0 "The Party Elite of the Generalgouvernement will need new homes for their families. Additionally, the clerks in the city will need rooms of their own. We should build it for them."
 GER_Pabst_Transportation:0 "Build a new Train Depot"
 GER_Pabst_Transportation_desc:0 "A Train Depot will be necessary, as all regional capitals should also have large transportation capabilities."
 GER_Prag_Plan:0 "The Prag Plan"
 GER_Prag_Plan_desc:0 "Prague will be subjected to Redesigning on the model of Warsaw. Although the reconstruction will not be as extensive, it will still make Prague into a model city."
 GER_Prag_Headquarters:0 "Build a Wehrmacht Headquarters"
 GER_Prag_Headquarters_desc:0 "A new Wehrmacht Headquarters in Prague will be instrumental in quashing any revolt that our Germanization efforts would cause."
 GER_Prag_Party:0 "Build a Party Headquarters"
 GER_Prag_Party_desc:0 "A Grand New Party Headquarters will show the population of Prague that German Overlordship is here to stay, in an Empire that will last one thousand years. If we can pay off our debt, that is."
 GER_Dismantle_Maginot_Metz:0 "Dismantle the Maginot Line in Metz"
 GER_Dismantle_Maginot_Elsass:0 "Dismantle the Maginot Line in Elsaß"
 GER_Alliances:0 "Germany on the World Stage"
 GER_Alliances_desc:0 "In order to survive as a power, [This.GetNameDef] needs to ally itself with other countries. This way, Germany and its allies would mutually defend each other and join in offensive wars, if necessary. We could join another country's alliance, or we could create our own faction."
 GER_Create_Axis:0 "Our Own Alliance"
 GER_Create_Axis_desc:0 "Germany shall not join the alliance of any other nation. Germany shall be a world Hegemon, so we shall create our own Faction! The Axis Powers will be champions of militarism, supporters of Fascism and National Socialism, and we shall aim to break the Western Capitalists and the Eastern Bolsheviks."
 GER_uk_accepted_naval_coop:0 "[ENG.GetNameDef] has accepted our proposal of naval cooperation."
 GER_uk_accepted_naval_coop_wgr:0 "[ENG.GetNameDef] has accepted our proposal of naval cooperation."
