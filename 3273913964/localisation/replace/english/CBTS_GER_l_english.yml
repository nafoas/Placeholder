 ger_introduction.1.d:0 "No matter who you ask, Germany is in danger. Whether the threat is on the left, right, or in the centre, there is always a threat. This is the cause and the product of instability that has lasted for 14 years, from the end of the Great War to this new year. On 11 November 1918, the German Empire surrendered to the combined forces of the United Kingdom, Third French Republic, and the United States, ending four years of bloody trench warfare. The subsequent revolutions brought down the Kaiser and established a republic, while at the same time leading to the downfall of the old communist movement in the country. The Treaty of Versailles, which entirely neutered our military, and the subsequent occupations and economic hardships - culminating in the hyperinflation crisis of 1923 - has led to the rise of both far-left and far-right movements. We have been plagued by political aassassinations, the machinations of influential figures, internal coups, and now the Great Depression.\n\nAt the helm of our fragile republic sits the General Paul von Hindenburg. The Hero of the Great War, General Hindenburg had been granted sufficient powers that his opponents feared would transition Germany into a dictatorship, though this has so far not happened. The old man is supported by the conservatives in the republic, and are seen by some as the last barrier between republic and revolution. However, he is nearly 90 years old, and in failing health. It is clear that whatever direction Germany goes, he will not live to see it..."
 ger_introduction.1.a:0 "What of the right?"
 ger_introduction.1.b:0 "I'm not interested."
 ger_introduction.2.t:0 "Hitler, Hugenberg, and the German Far-Right"
 ger_introduction.2.d:0 "Some people wish to categorize German politics into two camps: nationalist and anti-nationalist. The nationalists' arguments are based on the \"Stab-in-the-Back\" myth, which holds that the economic deficiencies that led to Germany's defeat in the Great War were caused by sabotage which was allegedly perpretrated by Marxists and Jews. This only serves to fuel the nationalists' already-established Anti-Semitism. The nationalists generally want to replace the parliamentary republic (which they view as weak and controlled by Marxists and/or Jews) with a dictatorial regime, and some even wish to restore the Hohenzollern monarchy that was deposed 15 years ago.\n\nAnd out of all the nationalists, the most well-known is Adolf Hitler of the National Socialist German Workers' Party (NSDAP). A veteran of the Great War, he joined the German Workers' Party (now the NSDAP) in Munich, and soon became its leader. The failed Beer Hall Putsch in Bavaria led to the arrest of the Hitlerist Leadership, which in turn has helped Hitler to establish a powerful personality cult, which seems to be the only thing uniting the Party. The NSDAP calls for the end of the parliamentary system and the establishment of a National Socialist state where the Führer (leader) has absolute power. Hitler would use this power to elminate the precieved influence of \"Judeo-Bolshevik\" saboteurs and \"Jewish Capitalist\" elites. He would then rebuild Germany's military strength in defiance of international regulations, and move to retake Germany's lost lands, as well as fighting the Poles and USSR in order to colonize their land and eliminate Bolshevik influence from Moscow.\n\nThe other primary German Nationalist organization is the German National People's Party (DNVP), led by the virulent nationalist Alfred Hugenberg. Like the Hitlerists, the DNVP wish to establish a far-right dictatorship, but with a few key differences. First, they wish to restore the German Monarchy. Second, unlike the NSDAP's proclaimed anti-capitalist stance, the DNVP is unapologetically capitalist, and support major firms. Finally, where Hitler and his group uses revolutionary rhetoric, the DVNP is remarkedly conservative instead. Though they only pull in about a third of the votes as Hitler does, they are still a force to be reckoned with."
 ger_introduction.2.a:0 "And the left?"
 ger_introduction.2.b:0 "That's enough for me."
 ger_introduction.3.t:0 "Thälmann and the German Far-Left"
 ger_introduction.3.d:0 "The Communist Party of Germany (KPD) was formed in 1918 by Revolutionary Socialists who had broken off of the Social Democratic Party over their opposition to the \"Imperialist\" war. After the failure of the November Revolution, the deaths of Rosa Luxemburg and Karl Liebknecht, and the victory of the Soviets in the Russian Civil War, the KPD became a Pro-Soviet and Pro-Stalinist organization under the leadership of Ernst Thälmann, a veteran and a longtime SPD member from Hambug. Thälmann was also the USSR's prefered KPD leader, as they made sure he remained the Chairman after he was removed for covering up embezzlement.\n\nUnder the direction of the Soviet-controlled Comumunist International, the KPD are currently pursuing a policy of non-cooperation with the other Marxist parties, as they are considered to be electoral competitors. This especially refers to the SPD, who are seen as \"Social Fascists\" for their policies of reformism. Though opposed to the platform of the National Socialists, they both collaborate on occasion against the Social Democrats. However, any overtures made to the SPD by the KPD have likewise been rejected by the SPD's right-wing. Thus, the KPD has declared itself to be the only anti-fascist party in Germany. The KPD's platform mirrors that of the Soviet Party, the All-Union Communist Party. It calls for the establishment of a Marxist-Leninist One-Party State and the nationalization of all industry. Recently, to the dismay of some KPD members and even Soviet observers, the KPD has taken an Anti-Semitic and nationalist route in order to gain middle class votes from the National Socialists, which has helped to spur an internal party conflict between Thälmann and Heinz Neumann, who sees the Hitlerists as a greater threat.\n\nHowever, the KPD is not the only Far-Left Movement in Germany. Parties that splintered off from the KPD include the Communist Party of Germany (Opposition), a Right Opposition group that formed in response to the embezzlement scandal; and the Lenin League, a left opposition group that sided with the Soviet Politician Grigory Zinoviev, who had recently been defeated by Stalin in a power struggle. The Socialist Workers' Party of Germany (SAPD) formed as a leftist splinter group form the SPD in 1931. They support a united anti-fascist front, and aim for a partially revolutionary course. Other groups include the anarcho-syndicalist Free Workers' Union of Germany and the Council Communist German Workers' Party."
 ger_introduction.3.a:0 "So who remains?"
 ger_introduction.3.b:0 "I understand"
 ger_introduction.4.t:0 "The SPD and the German Centre-Left"
 ger_introduction.4.d:0 "Though the current government is made out of right-wing nationalists, General Kurt von Schleicher's government is - for the time being - straddling the line between radical nationalism and right-wing parliamentarism. Though von Schleicher has authoritarian tendencies, he refuses to engage in assassinations and putsches, prefering to use political means to get his way. Though outwardly pro-Hitler, he wishes to use the National Socialists as a pawn in his bid to take over Germany. Though a nationalist, he is more concerned about building up the army and ending parliamentary democracy than about expansionism and Anti-Semitism, thus setting him apart from the Far-Right.\n\nHowever, a few centre and centre-adjacent parties remain. The largest of these is the Social Democratic Party of Germany (SPD). The SPD is a Reformist Marxist party that led the revolution that brought down the Monarchy, fought the Socialist Revolutionaries, and ruled Germany until 1920. The party supports a gradual transition to a socialist society within the framework of liberal democracy, and thus choose to work with the \"Bourgeoisie\" parties against far-right and far-left extremists. This has had the effect of alienating the Social Democrats from more Left-Wing parties. The SPD has its own factional issues, as there is a left wing, which is more focused on socialist ideas, and a right wing, which is content with a welfare state.\n\nTo the SPD's immediate right sits the Left-Liberal German State Party (DStP). Formerly the German Democratic Party, the DDP merged with the far-right Young German Order in 1928, leading to its electoral collapse and the resignation of the far-right members. A shell of its former self, the DStP continues to adhere to Socially Liberal ideals, such as social security, the protection of democracy, and encouragement of private enterprise. The party also supports social progressivism, and as such has a base of minorities, educational professionals, and some members of the middle class."
 ger_introduction.4.a:0 "And the Centre-Right?"
 ger_introduction.4.b:0 "Good enough."
 ger_introduction.5.t:0 "Zentrum and the German Centre-Right"
 ger_introduction.5.d:0 "The German People's Party (DVP) is a national liberal party that has lost most of its relevance. Though it used to have Gustav Stresseman, an internationally respected democrat, since his death the party has moved to the right. They seek to restore the monarchy and pursue free-market policies.\n\nFinally, there is the Catholic Centre Party (Zentrum). Zentrum is nominally socially conservative, but has somewhat left-wing economics, with a faction that is more accepting of such policies. Zentrum is the main Centre-Right party, and supports the democratic system while opposing the SPD. It is clear that if German Democracy is to survive, these varied parties will need to set aside their differences and unite against the extremists!"
 ger_introduction.5.a:0 "Quite a situation."
 ger_introduction.6.t:0 "Dynamic Focus Trees"
 ger_introduction.6.d:0 "Calm Before the Storm uses a system of Dynamic Focus Trees. This means that as the game progresses, your trees may recieve different components or switch to new trees entirely. This ensures that we can add large trees for different scenarios without causing over-clutter."
 ger_introduction.6.a:0 "Alright, I understand!"

 ger_army.11.t: "Dezemberprogramm 1933"
 ger_army.11.d: "The decision to expand the army has been made. The December program, launched by Truppenamt Chief Ludwig Beck, provides for the stablishment of a standing 21 division army by march 1938, from which a mobilizable 63 Division wartime army will emerge. The old Reichwehr infantry divisions will disappear and in their place new Divisions will be raised, but all of the new divisions will take a cover name to prevent the world from noticing our breach of the treaty."
 ger_army.11.a: "Finally!"
 ger_army.12.t: "The Führer urges acceleration"
 ger_army.12.d: "Today Hitler has urged the cceleration of the December program, conforming with Beck, as he felt that the emphasis of the buildup should be on the first two years. To accomodate for the change of pace, the 21 divisions will be raised with less equipment and personnel than planned, but we will have time to fill them later on."
 ger_army.12.a: "As you wish"

 ger_army.0.t: "Blomberg's Report"
 ger_army.0.d: "Today General Werner von Blomberg, acting as one of the main channels of the Reichwehr, has sent a report to Hindenburg in which he urges the President to end Schleicher's government and appoint Adolf Hitler as Chancellor. The General argues that his arch-rival Schleicher's attempts to create the Wehrstaat had clearly failed, and that Germany needed a new approach to forming the Wehrstaat. \"In the current situation - he believes - Schleicher's government could only stay in power by proclaiming martial law and by authorizing the Reichswehr to crush popular opposition. In doing so, the military would have to kill hundreds, if not thousands of German civilians; any régime established in this way could never expect to build the national consensus necessary to create the Wehrstaat\".\n\nThis view is shared by the majority of the Reichwehr commanders, who have very favorable views towards the Nazi Party and its ideals, and is the reason of the military ever more frequent pressure on Hindenburg to appoint Hitler."
 ger_army.0.a: "Ominous"
 ger_army.1.t: "Hammerstein-Equord warns Hindenburg"
 ger_army.1.d: "Concerned about the recent requests of Army Generals on Hindenburg to appoint Hitler as chancellor, General Kurt von Hammerstein-Equord, the Army Commander-in-chief and close friend of Schleicher, arranged an audience with the president this morning to warn him about the dangers of appointing Adolf Hitler. In response, Hindenburg assured Hammerstein-Equord that \"he would not even consider making that Austrian corporal the minister of defense or the chancellor\". It remains to be seen if his words have truth in them..."
 ger_army.1.a: "An Austrian ruling Germany? what a joke!"
 ger_army.2.t: "General Blomberg recalled"
 ger_army.2.d: "Amid wild rumors of a potential putsch by Schleicher, today Hindenburg —without informing the chancellor, Schleicher, or the army chief of staff, General Kurt von Hammerstein— recalled General Werner von Blomberg from the World Disarmament Conference in Geneva to return to Berlin. It looks like the move to recall Blomberg, a prominent pro-nazi general and main rival of Hammerstein-Equord within the Reichsheer, is a manouver of the President to replace Schleicher as defense minister and therefore prevent the alledged coup. Seeing into this, Hammerstein-Equord urged a protest to Hindenburg, but was ignored.\n\nWhen Blomberg arrived at the railroad station in Berlin, he was met by two officers, General Kuntzen and Oskar von Hindenburg. Kuntzen had orders from Hammerstein for Blomberg to report at once to the Defense Ministry; he was sent in an attempt to intercept Blomberg and prevent him from meeting the President. Meanwhile Oskar von Hindenburg, the adjutant and son of President Hindenburg, had orders for Blomberg to report directly to the Palace of the Reichspräsident.\n\nMuch to Kuntzen’s consternation, Blomberg chose to go with Oskar to meet the president, who swore him in as the new defense minister. This was done in an unconstitutional manner, as the president can only swear in a minister after receiving the advice of the chancellor, which he obviously had not consulted. This move, although unconstitutional, serves as a devastating blow to von Schleicher’s position, as it signals to the whole government that he has lost the confidence of the President."
 ger_army.2.a: "Schleicher's government seems doomed"
#In late January 1933, President Hindenburg—without informing the chancellor, Schleicher, or the army commander, General Kurt von Hammerstein—recalled Blomberg from the World Disarmament Conference to return to Berlin.
#Upon learning of this, Schleicher guessed correctly that the order to recall Blomberg to Berlin meant his own government was doomed.
#When Blomberg arrived at the railroad station in Berlin on 28 January 1933, he was met by two officers, Adolf-Friedrich Kuntzen and Oskar von Hindenburg, adjutant and son of President Hindenburg. Kuntzen had orders from Hammerstein for Blomberg to report at once to the Defense Ministry, while Oskar von Hindenburg had orders for Blomberg to report directly to the Palace of the Reich President.
#Over and despite Kuntzen's protests, Blomberg chose to go with Hindenburg to meet the president, who swore him in as defense minister.
#This was done in a manner contrary to the Weimar constitution, under which the president could only swear in a minister after receiving the advice of the chancellor.
#Hindenburg had not consulted Schleicher about his wish to see Blomberg replace him as defense minister because in late January 1933, there were wild (and untrue) rumors circulating in Berlin that Schleicher was planning to stage a putsch.
#To counter alleged plans of a putsch by Schleicher, Hindenburg wanted to remove Schleicher as defense minister as soon as possible.
#Two days later, on 30 January 1933, Hindenburg swore in Adolf Hitler as Chancellor, after telling him that Blomberg was to be his defense minister regardless of his wishes.

 ger_army.3.t: "Blomberg sacks Wilhelm Adam"
 ger_army.3.d: "Back in January of this year, Blomberg's first act as defense minister was to sack the chief of the Ministeramt, Ferdinand von Bredow, and replace him with Nazi General Walter von Reichenau. Since then Blomberg has slowly carried out a purge of the officers associated with his hated archenemy (Schleicher); like General Eugen Ott, the chief of the Wehramt, who back in June was dismissed and sent to Japan as an observer, and now General Wilhelm Adam, the chief of the Truppenamt, who today was sacked and replaced with Ludwig Beck. Little by little the Schleicher faction that had dominated the army since 1926 is now finally meeting its end."
 ger_army.3.a: "I didnt like them anyways."
