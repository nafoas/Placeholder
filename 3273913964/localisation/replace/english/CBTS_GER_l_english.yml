 #SS Coup
 ger_internal.92.t:0 "Assassination attempt in Berlin!"
 ger_internal.92.d:0 "With our recent losses of German land, many in the government had begun to lose confidence in the Führer. This has come to a head as a bomb blast could be heard from the direction of the Reich Chancellery. This obviously caused high levels of panic in Berlin, as police and military officials rushed to the scene. However, they were met by a cordon of SS-men who told them that the area was off-limits and to wait for the SS to finish their assessment.\n\nGeneral Alfred Jodl had refused to accept these answers. Using a company of soldiers and an armored car, he managed to coerce some of the SS to abandon their post and let him through. The company then stormed the building, with a squadron rushing directly to Hitler's office. As he waited in ernst, Jodl rushed to the radio when he heard the captain in charge calling him. His heart raced as the captain told him..."
 ger_internal.92.a:0 "...Hitler was dead and that Himmler had declared himself Führer in his place."
 ger_internal.92.b:0 "...Hitler was wounded, but alive, and that the SS had attempted to murder him!"
