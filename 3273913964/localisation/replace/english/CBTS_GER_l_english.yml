 inexperienced_micromanager_hitler:0 "Amateur"
 inexperienced_micromanager_hitler_desc:0 "Amateurishness was one of Hitler's dominant traits. He had never learned a profession and basically had always remained an outsider in all fields of endeavour. Like many self-taught people, he had no idea what real specialized knowledge really meant. Without any sense of complexities of any great task, he boldly assumed one function after another. Unburdened by standard ideas, his quick intelligence sometimes conceived unusual measures which a specialist would not have hit on at all. The victories of the early years of the war can literally be attributed to Hitler's ignorance of the rules of the game and his layman's delight in decision making. Since the opposing side was trained to apply rules which Hitler's self-taught autocratic mind did not know and did not use, he achieved surprises. These audacities, coupled with military superiority, were the basis of his early successes.\nBut as soon as setbacks occurred he suffered shipwreck, like most untrained people. Then his ignorance of the rules of the game was revealed as another kind of incompetence; then his defects were no longer strengths. The greater the failures became, the more obstinately his incurable amateurishness came to the fore."
 
