 ger_flavor.20.t:0 "A new flag for Germany"
 ger_flavor.20.d:0 "After the appointment of Hitler as Chancellor, it is clear that the Republic was something of the past, and the black-red-gold flag needed to be scrapped. Today President Hindenburg has signed a Presidential decree declaring the old imperial black-white-red flag, together with the NSDAP flag, as the new symbols of the country. Many wonder if the imperial flag will stick for long, as Hindenburg is very old and Hitler has no desire to keep it around..."
 ger_flavor.20.a:0 "We return to our roots!"
 ger_restore_imperial_tt:0 "§YThe Imperial black-white-red flag will become the official flag of Germany!§!"
 ger_flavor.21.t:0 "The NSDAP discards the Imperial Flag!"
 ger_flavor.21.d:0 "In a rally in Nuremberg, the NSDAP has announced the end of the dual flag arrangement installed by Hindenburg in 1933, and declared the Nazi flag as the only symbol of the country. Herrmann Göring has even declared that, despite honoring the imperial flag, it's under threat of becoming a reactionary symbol, and thus was scrapped. One might wonder why Göring considers the NSDAP to be anti-reactionary, despite our frequent idealisation of the past..."
 ger_flavor.21.a:0 "A new flag for a new Reich!"
 ger_nazi_flag_tt:0 "§YThe NSDAP flag will become the official flag of Germany!§!"
 unlock_nazi_focuses_tt:0 "§GAs Hitler assumes total control, more focuses will become available!§!"
 ger_enabling_act_passed:0 "The §YEnabling Act§! has been passed"
 GER_start_integration_tt:0 "§YWe will begin to transform Germany into a National Socialist Dictatorship§!"
 ger_reichstag_fire_tt:0 "§YThis may convince President Hindenburg to limit certain rights and liberties!§!"
 ger_reichstag_fire_done:0 "The Reichstag Fire has happened"
 ger_new_reichstag_hitler:0 "A new Reichstag has been elected"
 ger_flavor.22.t:0 "The Reichstag Fire"
 ger_flavor.22.d:0 "The Reichstag has been attacked! At 21:00 yesterday, the Berlin firefighters received a call from the Reichstag, claiming that it was on fire. When the arrived, the entire Chamber of Deputies was in flames, and after some efforts they managed to put out the fires. The police has arrested Marius van der Lubbe, a Dutch communist, accusing him of being the culprit of the attack, while the recently appointed Chancellor Hitler accuses the communists of plotting to destroy Germany, and it is said that he is preparing to crack down on them using the fires as an excuse. This has made some people suspicious about a possible Nazi involvement in the fires, although nobody would dare to say that in public... \n\nAn accident or a plot, no one can deny that the Reichstag Fire has been very useful for Hitler's dictatorial aims..."
 ger_flavor.22.a:0 "How convenient!"
 ger_flavor.23.t:0 "Public Works projects approved"
 ger_flavor.23.d:0 "In an effort to combat the economic crisis, the Schleicher cabinet has approved today an ambitious Public Works program that expects to reduce the unemployment rate and build some needed infrastructure. With this move the deeply unpopular chancellor also expects to regain some popularity; but many doubt that Schleicher's government will last long enough to reap the effects of this program..."
 ger_flavor.23.a:0 "We need to fight the crisis!"
 ger_flavor.24.t:0 "A motion of no confidence?"
 ger_flavor.24.d:0 "After Schleicher refused to let the Reichstag go into recess, many politicians have warned that once the Parliament is reconvened on January 31st, it will start a Motion of No Confidence against the Chancellor. Schleicher is deeply unpopular amongst the people, but he is also disliked amongst the politicians, as the the National Socialists and former Chancellor Franz von Papen are working to bring him down and form their own coalition government with the DNVP. If we want to keep this cabinet afloat, we need to dissolve the Reichstag, but we need Hindenburg's approval for that..."
 ger_flavor.24.a:0 "The Reichstag needs to be dissolved!"
 ask_hindenburg_tt:0 "§YWe will ask President Hindenburg to dissolve the Reichstag§!"
 ger_flavor.25.t:0 "Hindenburg refuses our request!"
 ger_flavor.25.d:0 "Something unexpected has happened, as President Hindenburg has refused to dissolve the Reichstag as we requested. It seems that Franz von Papen's hatred of Schleicher has caught Hindenburg's ear, and it is clear that the President wants the Chancellor to resign. It is said that Papen and Hitler have an arrangement about a coalition government, but the DNVP and the more centrist parties are also potential options for the Chancellorship..."
 ger_flavor.25.a:0 "Schleicher must resign..."
 GER_britain_accepts_treaty:0 "Britain has signed the Anglo-German Naval Treaty"
 GER_atlantikwall:0 "Atlantikwall"
 GER_atlantikwall_desc:0 "After occupying France and the Low Countries, we can't allow the British, the Americans or any enemy to launch a naval invasion and seize our new lands. We must undertake the construction of the Atlantikwall, a grand line of fortifications that will run from Denmark to Spain and will ensure Western Europe stays in our hands!"
 unlock_atlantikwall_tt:0 "§YUnlocks §GDecisions§! to build coastal fortifications cross the Western European coast!§!"
 GER_atlantikwall_expand:0 "Extend the Atlantikwall"
 GER_atlantikwall_expand_desc:0 "With Iberia in our hands, we might need to expand our original Atlantikwall plans to include the coast of Portugal and Northern Spain. It will be more expensive, but an invasion would be worse..."
 unlock_atlantikwall_iberia_tt:0 "§YUnlocks additional §GDecisions§! to build coastal fortifications across the Western Iberian coast!§!"
 GER_fortify_gibraltar:0 "Fortify Gibraltar"
 GER_fortify_gibraltar_desc:0 "With Gibraltar in our hands, we must make sure that the British are unable to ever recover it. Fortifications shall be built in Gibraltar for this purpose."
 GER_economic_coop_spain:0 "Send Relief to Spain"
 GER_economic_coop_spain_desc:0 "Spain has been devastated by the civil war. Now that they are our ally, it is our best interest to ensure that their economy is up and running as soon as possible, so relief shall be sent to Spain for this purpose."
 GER_madrid_berlin_plot:0 "The Madrid-Berlin Plot"
 GER_madrid_berlin_plot_desc:0 "Although he is our ally, General Franco has been very cautious about his support for our cause. Thankfully, our agents in Spain have been coordinating a growing opposition to Franco, made up of Falangists and disgruntled officers. Witth enough support, we can oust Franco and install a more... loyal leader."
 GER_joint_tungsten_exploitation:0 "Found the SDGGW"
 GER_joint_tungsten_exploitation_desc:0 "The Hispano-German Galician Wolfram Company shall expand mining operations in Northern Spain dramatically, ensuring our needs for tungsten are met."
 GER_exploit_portuguese_resources:0 "Exploit Portuguese Resources"
 GER_exploit_portuguese_resources_desc:0 "Portugal is ours! Now we can begin to use their massive tungsten mines to our benefit, and expand them further."
 GER_static_defense_doctrine:0 "Static Defense Doctrine"
 GER_static_defense_doctrine_desc:0 "We can't cede any inch of conquered land to the Soviets. Our troops need to defend every position to the last man and to the last bullet, and the Bolsheviks will eventually have to concede."
 GER_fortress_cities:0 "Fortress Cities"
 GER_fortress_cities_desc:0 "In order to better defend our eastern conquests, several cities shall be turned into fortresses, where wave after wave of enemy troops is held back by a smaller, but courageous, German force."
 GER_elastic_defense_doctrine:0 "Elastic Defense Doctrine"
 GER_elastic_defense_doctrine_desc:0 "There is no point in defending what can't be defended. We should fight a flexible war of retreats and counter-attacks that will see our armies advance further east, and will wear the Soviets down."
 GER_infrastructure_reinforce:0 "Bolster Offensive Infrastructure"
 GER_infrastructure_reinforce_desc:0 "If we want to have flexibility in the frontlines, we need a good infrastructure network that can quickly move our troops around. Let us begin our efforts in that area."
 GER_supress_resistance:0 "Bandenbekämpfung"
 GER_supress_resistance_desc:0 "Bandenbekämpfung, the \"War Against Bandits\" is how we call the ever-increasing conflict between our eastern armies and the local Resistance. We need to intensify policing and supression efforts to pacify the East once and for all!"
 GER_the_new_german_sphere:0 "The New German Sphere"
 GER_the_new_german_sphere_desc:0 "Although inside our borders this conflict is being sold as a struggle for living space, and a racial conflict, for foreign propaganda we need to focus on the fight against communism. That way we should be able to create a network of satellites that will help us rule the new Europe!"
 GER_pressure_finland:0 "Pressure Finland"
 GER_pressure_finland_desc:0 "Finland is fighting its own war againts the USSR, diverting troops from our fronts, but should they peace out the Soviets would find themselves in a stornger position. We should pressure the Finns to keep fighting, possibly in exchange of an alliance or other kinds of aid."
 GER_form_roa:0 "Form the ROA"
 GER_form_roa_desc:0 "Although we despise them, Russian deserter Vlasov is interested in creating an Anti-Communist Russian unit that would fight alongside our armies. Although we have no intentions of creating a natively-ruled Russia, this could be useful for propaganda purposes."
 GER_fall_blau:0 "Fall Blau"
 GER_fall_blau_desc:0 "The time has come to fulfill one of the goals of the invasion: the conquest and exploitation of the Caucasian oilfields, along with the occupation of Stalingrad. Let us prepare our troops and launch the attack!"
 GER_maikop_oilfields:0 "Repair the Maikop Oilfields"
 GER_maikop_oilfields_desc:0 "We have taken the Maikop oilfields, but the Soviets managed to damage them severely before we arrived. Now we need to repair and expand them, in order to secure an steady input of fuel."
 
 GER_break_ussr:0 "Eastern Offensive"
 GER_fortress_cities:0 "Fortress Cities"
 GER_supression_idea:0 "Bandenbekämpfung"
 
 fin_external.11.t:0 "German Pressure"
 fin_external.11.d:0 "Rumours of defeatism within our government have caused great concern to the Germans. To prevent our exit from the war, they have \"proposed\" a mutual cooperation treaty in exchange of our continuation in the war. There are some veiled threats if we refuse, but the Soviets are also menacing. What should we do."
 fin_external.11.a:0 "We'll do as the Germans say"
 fin_external.11.b:0 "We'll keep our freedom of movement!"
 GER_FIN_pressure_tt:0 "§YThis will prevent a Finnish-Soviet peace agreement for a year!§!"
 GER_Mission_Fall_Blau:0 "Fall Blau"
 
 GER_atlantikwall_decisions:0 "The Atlantikwall"
 GER_atlantikwall_decisions_desc:0 "In order to protect our newly acquired territories in Western Europe from an Allied invasion, we must construct a massive chain of coastal fortifications that protects the Reich from the British or the Americans. Now we need to decide where to focus our construction efforts."
