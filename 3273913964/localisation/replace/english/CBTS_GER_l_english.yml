 #focuses
 german_focus_dnvp:0 "DNVP Focus Tree"
 GER_DNVP_Politics_Start:0 "Block oder Brei"
 GER_DNVP_Politics_Start_desc:0 "A True Conservative Party cannot afford to cooperate with dangerous Liberals to preserve the weak \"Republic\". We are solid, not mash!"
 GER_DNVP_Politics_Coalition:0 "Search for Coalition Partners"
 GER_DNVP_Politics_Coalition_desc:0 "Some of our goals coincide with that of other parties, so we should explore the possibility of working with them to pursue our goals of establishing an authoritarian monarchy!"
 GER_DNVP_Politics_No_Coalition:0 "[GER_DNVP_coal_loc]"
 GER_DNVP_Politics_No_Coalition_desc:0 "As we are not in coalition with the National Socialists, we are free to make our own path with no hinderences!"
 wp_coal_dnvp:0 "Coalition with the DVP"
 dnvp_no_coal:0 "We Rule Alone"
 GER_DNVP_Politics_Nazi_Coalition:0 "The Völkisch Coalition"
 GER_DNVP_Politics_Nazi_Coalition_desc:0 "While Hitler is working for us now, soon he will get ambitions of his own. We must tread carefully. However, cooperation between nationalist parties will mean that we will soon be able to establish Volksgemeinschaft!"
 GER_DNVP_Politics_Arrest_Nazis:0 "Arrest Nazi Leaders"
 GER_DNVP_Politics_Arrest_Nazis_desc:0 "The National Socialists are as dangerous as the Communists! As they are the larger group, we must arrest their leaders for Conspiracy to Overthrow the Government!"
 GER_DNVP_Politics_Junker_Confidence:0 "Meet with the Junkers"
 GER_DNVP_Politics_Junker_Confidence_desc:0 "We must assure the Junkers and other influencial Germans that their support will be rewarded, as our interests align with theirs."
 GER_DNVP_Politics_Political_Protestantism:0 "Protestant Values"
 GER_DNVP_Politics_Political_Protestantism_desc:0 "If we adhere to Lutheran Teachings, we can surely come out of this crisis!"
 GER_DNVP_Politics_New_Bismarck:0 "The New Bismarck"
 GER_DNVP_Politics_New_Bismarck_desc:0 "Alfred Hugenberg clearly possess all the qualities that Otto von Bismarck had. He is smart, prudent, and devoted to improving the nation! If the people don't understand this, then maybe Hugenberg's media companies will help them."
 GER_DNVP_Politics_Nazi_Voters:0 "Appeal to NSDAP Voters"
 GER_DNVP_Politics_Nazi_Voters_desc:0 "Emphasis on Agrarianism, Conservative Paternalism, and Nationalism can win over some voters from the NSDAP."
 GER_DNVP_Politics_DNVP_Women:0 "Der Deutsche Nationale Frauenbund"
 GER_DNVP_Politics_DNVP_Women_desc:0 "The German National Women's League should be the government's official women's activist organiztion. By \"activist\" we of course mean the dissemination of Nationalist, Traditionalist, and Antisemitic Propaganda. Women have been very active in the DNVP, and they can continue to do so through the DNF."
 GER_DNVP_Politics_Laud_Farmer:0 "Laud the Farmer"
 GER_DNVP_Politics_Laud_Farmer_desc:0 "A Farmer leads a pure way of life, away from the disgusting factories and the chaos of the cities."
 GER_DNVP_Politics_Stahlhelm:0 "The Stahlhelm Question"
 GER_DNVP_Politics_Stahlhelm_desc:0 "The Stahlhelm is the DNVP's paramilitary force. However, President Hindenburg is demanding that we do something with them as part of his anti-paramilitary policy. The government has to meet and consider different options."
 GER_DNVP_SA_demands:0 "§YWe will send our demands to Hitler.§!\n"
 GER_DNVP_Politics_Disband_SA:0 "Demand the Dissolution of the SA"
 GER_DNVP_Politics_Disband_SA_desc:0 "The Tyranny of the Sturmabteilung must not be allowed to continue, as the people will grow to hate any sanctioning of political harrassment by those drunken goons. We must tell Hitler that the NSDAP must disband the SA if they wish to remain in the coalition."
 GER_DNVP_Politics_Paramilitary_Emergency:0 "The Paramilitary Problem"
 GER_DNVP_Politics_Paramilitary_Emergency_desc:0 "President Hindenburg must be given emergency powers, as the threat of anti-establishment paramilitary groups grow."
 GER_DNVP_Politics_Commie_Emergency:0 "The Communist Crisis"
 GER_DNVP_Politics_Commie_Emergency_desc:0 "The Threat of Communist Groups looms too high to ignore. President Hindenburg must be given emergency powers to deal with it."
 GER_DNVP_Politics_Fight_Paramilitaries:0 "Move Against the Paramilitaries"
 GER_DNVP_Politics_Fight_Paramilitaries_desc:0 "The Freikorps will be disarmed and the SA, Reichsbanner, and Rotfront will be destroyed by military means!"
 GER_DNVP_Politics_Ban_Communism:0 "Ban Communism"
 GER_DNVP_Politics_Ban_Communism_desc:0 "Now that the President has emergency powers, we can ban Communism and Communist Groups! This will be vital to ensuring that Germany is strong!"
 GER_DNVP_Politics_Break_Trade_Unions:0 "Break the Trade Unions"
 GER_DNVP_Politics_Break_Trade_Unions_desc:0 "Socialist Trade Unions engage in illegal activity, so they must be destroyed." 
 GER_DNVP_Politics_Ban_SPD:0 "Ban the SPD"
 GER_DNVP_Politics_Ban_SPD_desc:0 "The SPD promotes policies that would go against the Volksgemeinschaft, and are the last vestige of resistance to our dictatorship. Ergo, they must be banned and removed from the public eye."
 GER_Blood_And_Soil:0 "Blood and Soil"
 GER_DNVP_Politics_Blood_and_Soil:0 "Blut und Bloden"
 GER_DNVP_Politics_Blood_and_Soil_desc:0 "The Peasants must remember that not only do they farm for themselves, they farm for their race and Reich!"
 GER_DNVP_Trade_Union:0 "Deutscher Reichsarbeiterbund"
 GER_DNVP_Politics_New_Trade_Union:0 "A National Trade Union"
 GER_DNVP_Politics_New_Trade_Union_desc:0 "A new national trade union would be a better replacement for the old decentralized unions that worked against the national interest."
 GER_DNVP_Politics_Ban_Liberals:0 "Ban the Liberal Parties"
 GER_DNVP_Politics_Ban_Liberals_desc:0 "The Liberal Democrats seek to see our society destroyed by weakness and indecisiveness. The Liberal Parties will be destroyed instead!"
 GER_DNVP_Politics_Break_Nazis:0 "Destroy the National Socialists"
 GER_DNVP_Politics_Break_Nazis_desc:0 "Hitler's NSDAP is a gang of thugs, and although the warlords of the party have been arrested, the party itself must still be eliminated."
 GER_DNVP_Politics_Hindenburg:0 "Hindenburg is Dead"
 GER_DNVP_Politics_Hindenburg_desc:0 "The Great Lion Hindenburg has died, and now that he is gone, we can carry out his legacy in a New German State!"
 GER_DNVP_Politics_Kaiser:0 "The Restoration"
 GER_DNVP_Politics_Kaiser_desc:0 "After 16 years, the deepest wishes of the German Right has come true, as Kaiser Wilhelm III now sits at the throne of Germany!"
 GER_DNVP_Politics_Fuhrer:0 "The Führer"
 GER_DNVP_Politics_Fuhrer_desc:0 "A Kaiser would only be an impediment to the Völkisch Coalition. True Volksgemeinschaft can only come from a single, strong Führer!"
 GER_DNVP_Politics_Gerepo:0 "Geheime Reichspolizei"
 GER_DNVP_Politics_Gerepo_desc:0 "The Secret Imperial Police will protect our new empire to the best of its ability. It will have the authority - provided by the Hugenberg Constitution - to arrest anybody and disband any organization that is against the regime."
 GER_DNVP_Politics_Gestapo:0 "Geheime Staatspolizei"
 GER_DNVP_Politics_Gestapo_desc:0 "The Secret State Police will protect our new order. Headed by one of the heads of the NSDAP, Hermann Göring, we must keep extra sure that the National Socialists do not use it to solve petty party squabbles."
 GER_DNVP_Politics_Nobility:0 "Aristocratic Restorations"
 GER_DNVP_Politics_Nobility_desc:0 "While the constitution provides for the existance of a nobility, the former nobility's titles have not yet been officially restored. We must decide on a course of action."
 GER_DNVP_Politics_Downplay_Monarchism:0 "Sideline the Monarchists"
 GER_DNVP_Politics_Downplay_Monarchism_desc:0 "Although Monarchism is still part of our Program, it is clear that the time is not right to restore the Monarchy."
 GER_DNVP_Politics_Remove_Nazi:0 "Deal with the NSDAP"
 GER_DNVP_Politics_Remove_Nazi_desc:0 "Now that the DNVP has been established as the dominant power in Germany, the only remaining threat is the NSDAP. Hitler's National Socialists pose a threat to our order, chiefly due to the personal ambitions of Hitler and his cronies."
 GER_DNVP_Politics_Keep_Nazi:0 "Preserve the Völkisch Coalition"
 GER_DNVP_Politics_Keep_Nazi_desc:0 "Our coalition with the NSDAP is working for us. We should preserve the coalition, so as long as Hitler's personal ambitions do not get in the way."
 GER_DNVP_Politics_Destroy_Unions:0 "Destroy the Trade Unions"
 GER_DNVP_Politics_Destroy_Unions_desc:0 "Unions are anti-government agitational organizations, and must be shut down with extreme prejudice."
 GER_DNVP_Politics_Strike_Breaking:0 "Strike Breakers"
 GER_DNVP_Politics_Strike_Breaking_desc:0 "Workers may still try and strike, even if they are not organized. We have to launch a propaganda campaign to get them to break their own strikes!"
 GER_DNVP_Politics_Imperial_Youth_League:0 "Reichsjungendbund"
 GER_DNVP_Politics_Imperial_Youth_League_desc:0 "The Imperial Youth League will be a sort of scouting organization that teaches the youth the value of our German Culture."
 GER_DNVP_Industry_Contacts:0 "Industry Contacts"
 GER_DNVP_Politics_Industry_Contacts:0 "Industry Contacts"
 GER_DNVP_Politics_Industry_Contacts_desc:0 "Both the DNVP and NSDAP were bankrolled by certain large businesses. We should work to preserve these ties."
 GER_DNVP_Rearm_Conference:0 "Rearmament Conference"
 GER_DNVP_Rearmament:0 "Secret Rearmament"
 GER_DNVP_Politics_Rearmament_Conference:0 "Rearmament Conference"
 GER_DNVP_Politics_Rearmament_Conference_desc:0 "Rearmament is a large priority for us and our military backers, so we must meet with leaders in the defense industry to determine our course of action."
 GER_DNVP_Politics_Racial_Laws:0 "Anti-Jewish Laws"
 GER_DNVP_Politics_Racial_Laws_desc:0 "At the insistance of our National Socialist allies, we will implement laws prohibiting Jews from serving in the armed forces and limiting their economic activities. Although many in our party are Anti-Semitic, some worry that the establishment of racial laws is going too far..."
 GER_DNVP_Politics_Pan_Germanism:0 "Pan-Germanism"
 GER_DNVP_Politics_Pan_Germanism_desc:0 "The German Fatherland is not united! German Speakers living in countries such as Austria and Poland prevent us from establishing Volksgemeinschaft!"
 GER_DNVP_Politics_Traditionalism:0 "Traditionalism"
 GER_DNVP_Politics_Traditionalism_desc:0 "Germans and Progressivism are incompatible, and we must work to prevent Germans from adopting deviant ideas."
 GER_DNVP_Politics_State_Religion:0 "State Lutheranism"
 GER_DNVP_Politics_State_Religion_desc:0 "Lutheranism, being created in Germany, is the only real religion compatible with the German Soul. Catholicism and other major Christian religions will be tolerated, but their members will be blocked from achieving political influence."
 GER_DNVP_Politics_Protestant_Union:0 "A Protestant Trade Union"
 GER_DNVP_Politics_Protestant_Union_desc:0 "A Religious Trade Union serves to increase output and allow workers to air grievences."
 GER_Trad_Edu:0 "Traditionalist Education"
 GER_DNVP_Politics_Trad_Edu:0 "Traditionalist Education"
 GER_DNVP_Politics_Trad_Edu_desc:0 "To ensure tthat the youth of our nation is ready for a Pan-Germanic Era, they must be given the correct education!"
 GER_DNVP_Politics_Coerce_Churches:0 "Coerce the Churches"
 GER_DNVP_Politics_Coerce_Churches_desc:0 "Any Liberal-Minded Clergymen are a danger to the regime and should be properly dealt with."
 GER_DNVP_Politics_Public_Opinion:0 "Improve Public Opinion"
 GER_DNVP_Politics_Public_Opinion_desc:0 "We have managed to stabilize the nation and improve public opinion to a satisfactory level."
 GER_DNVP_Politics_Reich_Reborn:0 "The Reich Reborn"
 GER_DNVP_Politics_Reich_Reborn_desc:0 "Our reforms are complete, and we can now declare that the Kaiserreich has been reborn!"
 GER_DNVP_Politics_Nationalism_Over_Socialism:0 "Nationalismus Über Sozialismus"
 GER_DNVP_Politics_Nationalism_Over_Socialism_desc:0 "Despite our coalition with the NSDAP, we must remind National Socialists to keep Nationalism primary, and Socialism secondary."
 GER_DNVP_Politics_Expand_Veteran_Association:0 "Expand Veterans' Associations"
 GER_DNVP_Politics_Expand_Veteran_Association_desc:0 "Right now, only veterans who choose to associate themselves with the DNVP are allowed influence in these organizations. NSDAP aligned veterans must also be allowed influence - but not too much."
 GER_DNVP_Politics_End_Electoral_Cycle:0 "End the Electoral Cycle"
 GER_DNVP_Politics_End_Electoral_Cycle_desc:0 "Nominally, we are supposed to hold elections every five years, but with the lack of political freedoms, these elections are simply no longer necessary. Liberalism has been quashed!"
 GER_DNVP_Politics_NSDAP_Governors:0 "NSDAP Governors"
 GER_DNVP_Politics_NSDAP_Governors_desc:0 "Right now, loyal DNVP supporters - some even from the old nobilit - govern our provinces by appointment. Hitler has long pressured us into allowing his National Socialist Cronies to govern provinces, particularly where NSDAP support is strong. The question is, to what degree should we allow NSDAP governors?"
 GER_DNVP_Politics_Disband_Bundesrat:0 "Disband the Reichsrat"
 GER_DNVP_Politics_Disband_Bundesrat_desc:0 "The Imperial Council is where the different states of Germany are represented. However, now that all the states get their orders directly from Berlin, the Council is no longer necessary."
 GER_DNVP_Politics_Nordicism:0 "Nordicism"
 GER_DNVP_Politics_Nordicism_desc:0 "Pan-German ideas are not enough for a truly German Society. A Pan-Nordic concept of history is necessary, and thus Germany should lay claim to all Germanic lands!"
 ##Economics
 ###Farmer
 GER_DNVP_Save_Peasants:0 "Saving the Farmers"
 GER_DNVP_Farmer_tt:0 "Gains National Spirit §YSaving the German Farmer§!, which grants (Daily Political Power Gain: §R-0.02§!, Monthly Population: §G+2.0%§!, Max Factories in a State: §R-2.0%§!, Consumer Goods Factor: §Y-2.0%§!).\n"
 GER_DNVP_Farmer_Start:0 "Saving the German Farmer"
 GER_DNVP_Farmer_Start_desc:0 "Ours is an Agrarian party, therefore we must work to support the German Farmers. Herr Hugenberg sees the peasant as the ideal small business owner, and (relucantly) advocates for some economic statism to create the German Small-Farmer Class."
 GER_DNVP_Farmer_tt1:0 "Modify National Spirit §YSaving the German Farmer§! by\nDaily Political Power Gain: §R-0.02§!\nMonthly Population: §G+2.0%§!\nMax Factories in a State: §R-2.0%§!\nConsumer Goods Factor: §Y-5.0%§!\n"
 GER_DNVP_Farmer_tt2:0 "Modify National Spirit §YSaving the German Farmer§! by\nDaily Political Power Gain: §R-0.04§!\nMonthly Population: §G+4.0%§!\nMax Factories in a State: §R-4.0%§!\nConsumer Goods Factor: §Y-4.0%§!\n"
 GER_DNVP_Farmer_tt3:0 "Modify National Spirit §YSaving the German Farmer§! by\nDaily Political Power Gain: §G+0.1§!\n"
 GER_DNVP_Farmer_tt4:0 "Modify National Spirit §YSaving the German Farmer§! by\nDaily Political Power Gain: §G+0.05§!\nMonthly Population: §R-2.0%§!\n"
 GER_DNVP_Farmer_tt5:0 "Modify National Spirit §YSaving the German Farmer§! by\nConsumer Goods Factor: §Y+1.0%§!\n"
 GER_DNVP_Farmer_ttx:0 "Modify National Spirit §YSaving the German Farmer§! by\nConsumer Goods Factor: §Y-2.0%§!\n"
 GER_DNVP_Farmer_tt6:0 "Modify National Spirit §YSaving the German Farmer§! by\nDaily Political Power Gain: §G+0.03§!\nMax Factories in a State: §R-1.0%§!\nConsumer Goods Factor: §Y+3.0%§!\n"
 GER_DNVP_Farmer_tt7:0 "Modify National Spirit §YSaving the German Farmer§! by\nDaily Political Power Gain: §R-0.10§!\nMonthly Population: §G+4.0%§!\nConsumer Goods Factor: §Y-5.0%§!\n"
 GER_DNVP_Farmer_tt8:0 "Remove National Spirit §YSaving the German Farmer§!.\n"
 GER_DNVP_Farmer_Stimulate:0 "From Below"
 GER_DNVP_Farmer_Stimulate_desc:0 "The government cannot and should not save the farmers directly, but allow them to save themselves."
 GER_DNVP_Farmer_Direct:0 "From Above"
 GER_DNVP_Farmer_Direct_desc:0 "If we do not intervene in helping the poor farmers accumulate wealth, then who will?"
 GER_DNVP_Farmer_Debt_Cancelling:0 "Cancel Minor Debts"
 GER_DNVP_Farmer_Debt_Cancelling_desc:0 "Any farmer with debts totalling 2500 Reichsmarks or less will have their debts forgiven. This should allow them to begin to recover on their own."
 GER_DNVP_Farmer_No_Forclosures:0 "Moratorium on Forclosures"
 GER_DNVP_Farmer_No_Forclosures_desc:0 "If the German Farmer is to survive as a class, the last thing that should happen is that they lose their land. Therefore, we will not allow farmers to lose their homes."
 GER_DNVP_Farmer_Internal_Colonization:0 "Internal Colonization"
 GER_DNVP_Farmer_Internal_Colonization_desc:0 "Sending German Farmers to Silesia and other lands populated by non-Germans will both allow us to provide them with more farming space and make those lands truly German."
 GER_DNVP_Farmer_Margarine:0 "Limit Margarine Production"
 GER_DNVP_Farmer_Margarine_desc:0 "Margarine, being a cheap substitute for butter, is very popular right now due to the poor economy. Unfortunately, this hurts our dairy farmers. Ergo, new limits on margarine production have to become law, at least temporarily."
 GER_DNVP_Farmer_Minimum_Prices:0 "Ensure Minimum Prices"
 GER_DNVP_Farmer_Minimum_Prices_desc:0 "A new government corporation must be set up to buy crops from farmers at minimum prices, so that if they cannot sell to a market or store, then they can at least earn a living."
 GER_DNVP_Farmer_Done:0 "The Farmers Protected"
 GER_DNVP_Farmer_Done_desc:0 "Our agrarian program has allowed the German Farmers to recover to a satisfatory level."
 GER_DNVP_Farmer_Tariffs:0 "Crop Tariffs"
 GER_DNVP_Farmer_Tariffs_desc:0 "Competition from abroad is wrecking our agricultural industry. We must encourage people to Buy German!"
 ###Industry
 GER_DNVP_Industry_Start:0 "Saving German Industry"
 GER_DNVP_Industry_Start_desc:0 "Seeing as the DNVP represents German Industrialists, it would be daft to fail to pay attention to the Industrial Strength of our nation."
 GER_DNVP_Industry_Laissez_Faire:0 "Hands-Off Approach"
 GER_DNVP_Industry_Laissez_Faire_desc:0 "If we end Weimar policies of meddling in the economy, the Industrial Sector should recover naturally."
 GER_DNVP_Industry_Statism:0 "Industrial Statism"
 GER_DNVP_Industry_Statism_desc:0 "As much as we loath to admit it, statism in the Industrial Sector is necessary to keep key industries afloat."
 GER_DNVP_Industry_Privatization:0 "Privatization"
 GER_DNVP_Industry_Privatization_desc:0 "State-owned industry and infrastructure should be privatized to put less pressure on the government."
 GER_DNVP_Industry_Lower_Taxes:0 "Lower Taxes"
 GER_DNVP_Industry_Lower_Taxes_desc:0 "Lowering Taxes on the Germans is paramount to securing a wealthy society."
 GER_DNVP_Industry_Deregulation:0 "Deregulation"
 GER_DNVP_Industry_Deregulation_desc:0 "There are too many regulations on German companies. This prevents them from using their resources efficiently. A massive deregulation effort should correct this problem."
 GER_DNVP_Industry_Protectionism:0 "Protectionism"
 GER_DNVP_Industry_Protectionism_desc:0 "Imports are killing our consumer goods industry. People would rather buy Cheap British Junk than Quality German Goods. Tariffs must go up immediately, and all Patriotic Citizens must Buy German!"
 GER_DNVP_Industry_Military:0 "Military-Industrial Complex"
 GER_DNVP_Industry_Military_desc:0 "Close Cooperation between the State and the Military Industry will greatly assist our re-armament."
 GER_DNVP_Industrial_Council:0 "Betriebsrat"
 GER_DNVP_Industry_Council:0 "Der Betriebsrat"
 GER_DNVP_Industry_Council_desc:0 "The Industrial Council will be a quadriannual meeting of the heads of various German businesses and government ministries to determine the direction of re-armament and economic recovery."
 GER_DNVP_Industry_Done:0 "Big Business is Saved"
 GER_DNVP_Industry_Done_desc:0 "The major industrial leaders have been saved from the terrors of government intervention and global trade!"
 ###Rearmament
 GER_DNVP_Rearmament:0 "Begin Official Rearmament"
 GER_DNVP_Rearmament_desc:0 "We have been rearming our nation for over a decade, but now is the time we can cast off the shackles and officially restore the Glory of Germany's Military!"
 GER_DNVP_Rearmament_Land_idea:0 "Land Rearmament"
 GER_DNVP_Rearmament_Naval_idea:0 "Naval Rearmament"
 GER_DNVP_Rearmament_Land:0 "Expand the Army"
 GER_DNVP_Rearmament_Land_desc:0 "If we are to expand Germany and become a global empire, we must have a strong land force. And a strong land force needs weapons and armor!"
 GER_DNVP_Rearmament_Naval:0 "An Imperial Navy"
 GER_DNVP_Rearmament_Naval_desc:0 "A global empire requires a large navy capable of defeating the British anywhere on the globe!"
 GER_DNVP_Rearmament_Land_IG_Farben:0 "Support IG Farben"
 GER_DNVP_Rearmament_Sweden_Trade:0 "Swedish Iron"
 GER_DNVP_Rearmament_Sweden_Trade_desc:0 "Despire our Protectionist policies, it has become clear that we need imported iron for our fist!"
 GER_DNVP_Rearmament_German_Coal:0 "German Coal"
 GER_DNVP_Rearmament_German_Coal_desc:0 "It would be better for us to strengthen the coal mining industry rather than rely on foreign trade."
 GER_DNVP_Rearmament_Mil_Factory:0 "Subsidize Defense Companies"
 GER_DNVP_Rearmament_Mil_Factory_desc:0 "Although we are usually opposed to such policies, allowing Weapons Makers to produce more weapons will ultimately be beneficial to our country!"
 GER_DNVP_Rearmament_Infrastructure:0 "Reichsautobahn"
 GER_DNVP_Rearmament_Infrastructure_desc:0 "New Highways will improve our ability to get soldiers and equipment accross Germany!"
 GER_DNVP_Rearmament_Naval_Infrastructure:0 "Naval Infrastructure"
 GER_DNVP_Rearmament_Naval_Infrastructure_desc:0 "Improving access to our ports would greatly improve our ability to supply our ships and soldiers."
 GER_DNVP_Rearmament_Airports:0 "New Airports"
 GER_DNVP_Rearmament_Airports_desc:0 "New Airfields will allow us more options when it comes to deploying our air squadrons."
 GER_DNVP_Rearmament_Dockyards:0 "Support Blohm und Voß"
 GER_DNVP_Rearmament_Dockyards_desc:0 "If we are to have a mighty navy, we must build more dockyards. Blohm und Voß, an old shipbuilding company, shall be our main naval contractor."
 GER_DNVP_in_power:0 "The §YDNVP§! is in power."
 GER_DNVP_Rearmament_Focus_on_Fuel:0 "Fuel Storage"
 GER_DNVP_Rearmament_Focus_on_Fuel_desc:0 "A large navy cannot go anywhere without fuel. And if we have a lot of fuel, we must build silos to store them in."
 GER_DNVP_Rearmament_Chromium:0 "Turkish Chromium"
 GER_DNVP_Rearmament_Chromium_desc:0 "The assembly of Capital Ships requires chromium, so we must secure a trade deal with the Turks, as they have Chromium in abundance."
 GER_DNVP_Rearmament_Dockyards_2:0 "Increased Dockyard Effort"
 GER_DNVP_Rearmament_Dockyards_2_desc:0 "All German Shipbuilders should be focused on constructing military vessels!"
 GER_DNVP_War_Economy:0 "Mobilization or Death!"
 GER_DNVP_War_Economy_desc:0 "If we are to survive upcoming wars, we must mobilize the economy. If our economy is not prepared, then the army will falter!"
 GER_DNVP_War_Economy_Factory_Conversion:0 "Factory Conversion"
 GER_DNVP_War_Economy_Factory_Conversion_desc:0 "The needs of the consumer is not as important during a state of war. It is paramount that our soldiers are armed and fed!"
 GER_DNVP_War_Economy_Rations:0 "Ration Program"
 GER_DNVP_War_Economy_Rations_desc:0 "A Patriotic German can sacrifice all comforts when his country calls on him! A Rationing Program should be easy to withstand if it is for the good of the nation!"
 GER_DNVP_Rations:0 "War Rations"
 GER_DNVP_Rations_desc:0 "A Patriotic German can sacrifice all comforts when his country calls on him! A Rationing Program should be easy to withstand if it is for the good of the nation!"
 GER_DNVP_War_Economy_Order_for_Labour:0 "Worker's Cross for Labour"
 GER_DNVP_War_Economy_Order_for_Labour_desc:0 "A new award for extraordinary work can be a powerful incentive for people to work harder..."
 GER_DNVP_War_Economy_Expand_Production:0 "Expand Arms Production"
 GER_DNVP_War_Economy_Expand_Production_desc:0 "In war, the country with the most production will fight best. We must be that country!"
 GER_DNVP_War_Economy_Oil:0 "Expand Synthetic Fuel Production"
 GER_DNVP_War_Economy_Oil_desc:0 "If Germany is to survive this war, we need a reliable source of fuel. Trade will not be sufficient, so we must subsidize synthetic fuel plants."
 GER_DNVP_War_Economy_Dockyard:0 "The Grand Fleet"
 GER_DNVP_War_Economy_Dockyard_desc:0 "Our fleet needs to be able to repair and replace ships quickly and efficiently. More dockyards should satisfy this need."
 GER_DNVP_Harvest:0 "Victory Harvest"
 GER_DNVP_War_Economy_Harvest:0 "Harvest for the Nation"
 GER_DNVP_War_Economy_Harvest_desc:0 "A Great Harvest is what we need to build morale and enable us to win the war."
 GER_DNVP_Industrial_Council_War:0 "Kriegsindustrieller Rat"
 GER_DNVP_War_Economy_Industrial_Council:0 "Kriegsindustrieller Rat"
 GER_DNVP_War_Economy_Industrial_Council_desc:0 "The War Industrial Council will be an advisory group representing German Defense Companies that will help the Political Leadership where best to send resources."
 GER_DNVP_War_Economy_Internal_Colonization2:0 "Continue Internal Colonization"
 GER_DNVP_War_Economy_Internal_Colonization2_desc:0 "Sending farmers to conquered Polish lands will help make those lands irrefutably German."
 GER_DNVP_War_Economy_Trade:0 "Trade with our Friends"
 GER_DNVP_War_Economy_Trade_desc:0 "European Countries aligned with us ideologically are deserving of our money, and we are deserving of their resources."
 ##Foreign Policy
 GER_DNVP_Foreign_Policy_Start:0 "Außenpolitik"
 GER_DNVP_Foreign_Policy_Start_desc:0 "Foreign Policy is a definate priority of our Party. Hostility to Liberalism and Bolshevism is just as important as our dream of a Pan-German state. We shall also seek to retake our former colonial possesions in Africa."
 GER_DNVP_Leave_League:0 "Leave the League"
 GER_DNVP_Leave_League_desc:0 "The League of Nations is the enemy of Germany. It endorses Liberal Democracies that only seek to stifle the growth of a Pan-Germanic Völkisch State. Therefore, Germany must announce that she is leaving the League."
 GER_DNVP_Saarland:0 "Plebiscite in the Saarland"
 GER_DNVP_Saarland_desc:0 "The Vile French hold a key portion of our territory: The Saarland. The League of Nations holds that we should be able to hold a plebiscite in the region (despite our having left it), so we shall demand that it is held at once!"
 GER_DNVP_Rhineland:0 "Remilitarize the Rhineland"
 GER_DNVP_Rhineland_desc:0 "Our Territories on the Rhine will not be truly free unless we send our soldiers in to remilitarize it. We may face pushback from France and Britain, but it is worth the risk."
 GER_DNVP_Claim_Lands:0 "Stake our Claims"
 GER_DNVP_Claim_Lands_desc:0 "The Western Tyrants stole our rightful territories in the Treaty of Versailles. It is time to officially claim them once again!"
 GER_DNVP_Claim_Colonies:0 "Reichskolonialbund"
 GER_DNVP_Claim_Colonies_desc:0 "Every great power has a right to overseas colonies, and our African and East Asian possesions were taken from us during the Great War. While our East Asian possesions are out of our reach, Britain and France should have to pay for their thefts in Africa!"
 GER_DNVP_Colonial_Management:0 "Reichskolonialamt"
 GER_DNVP_Colonial_Management_desc:0 "The Imperial Colonial Office shall replace the Colonial League, as we now control land in Africa. We must spend time reorganizing the new colonies in order to consolidate German Rule over the territory. Headed by the Lion of Africa Paul von Lettow-Vorbeck, Germany shall once again be an Imperialist Giant!"
 GER_DNVP_War_With_France:0 "Invade France"
 GER_DNVP_War_With_France_desc:0 "The French are the principle enemy of Germany. They control rightful German lands and sponsor anti-German activities. They must be brought to heel."
 GER_DNVP_Manstein_Plan:0 "The Manstein Plan"
 GER_DNVP_Manstein_Plan_desc:0 "Proposed by Erich von Manstein, this iteration of the old Schlieffen plan would involve an attack on the Netherlands, Belgium, and Luxemburg to move around French Defenses."
 GER_DNVP_Operation_Moltke:0 "Operation Moltke"
 GER_DNVP_Operation_Moltke_desc:0 "Named after the General who took Schleswig in the first place, Operation Moltke will take advantage of France and Britain's distractedness and push north into Denmark, to force them to return our rightful lands." 
 GER_DNVP_Invade_Norway:0 "Secure the Skaggarak"
 GER_DNVP_Invade_Norway_desc:0 "The Danish Straights must be secured against Naval Intrusions. By seizing Norway, we will be able to ensure that our enemies cannot invade through the Baltic Sea."
 GER_DNVP_Basing_Norway:0 "Basing Rights in Norway"
 GER_DNVP_Basing_Norway_desc:0 "We should be able to station soldiers and fleets in Norway in order to better fight the English Menace. However, if we can get a diplomatic solution to this problem, it would be ideal."
 GER_DNVP_Guarantee_Finland:0 "Guarantee Finland"
 GER_DNVP_Guarantee_Finland_desc:0 "We must ask the Finnish if they are willing to accept our guarantees of their independence. If they accept, we will be obligated to help if they are attacked by a foreign power."
 GER_DNVP_Entreat_Spain:0 "Entreat Spain"
 GER_DNVP_Entreat_Spain_desc:0 "Our Friends in Spain might have an interest in French land, so we can offer some land in return for their participation in the war."
 GER_DNVP_Claim_Poland:0 "Claims on Poland"
 GER_DNVP_Claim_Poland_desc:0 "While the West might be the principle enemy, our primary direction of expansion will be eastward. Poland holds a lot of territory brutally taken from us in the Disaster of 1918. It has been a long time since, so we must correct this mistake."
 GER_DNVP_Agitate_in_Poland:0 "Agitation in Poland"
 GER_DNVP_Agitate_in_Poland_desc:0 "Our agents can be sent to Poland to rile up the population. This can help us discern the reaction to an invasion as well as destabilize the Polish State."
 GER_DNVP_Work_With_Danzig:0 "Coordinate with Danzig"
 GER_DNVP_Work_With_Danzig_desc:0 "An offer of cooperation with the Germans in Danzig should be met with total approval. We shall arrange for our Casus Belli in Poland to be a Danziger Rebellion against Polish Authority. Danzig will try to free itself and join the Reich, while we will send troops to secure the newly seceeded regions, causing war."
 GER_DNVP_Invade_Poland:0 "Polenfeldzug"
 GER_DNVP_Invade_Poland_desc:0 "The Poles have insulted us for too long! They dangle our territories right in front of us, just out of reach. It is time to right this wrong; to take back what is ours! To war!"
 GER_DNVP_Demand_Memel:0 "Demand the Memelland"
 GER_DNVP_Demand_Memel_desc:0 "Memel is a region separated from us by the Treaty of Versailles. As the region has a sigificant population of Germans, we should demand its return to the Reich."
 GER_DNVP_Core_Poland:0 "Heim ins Reich"
 GER_DNVP_Core_Poland_desc:0 "Our Polish Provinces have returned to the Reich. It is time to establish concrete rule there."
 GER_DNVP_Invade_Baltic:0 "Invade the Baltic"
 GER_DNVP_Invade_Baltic_desc:0 "We cannot have a Pan-German state without our Baltic cousisns. Therefore, we should invade the Baltic States to establish German Rule in the region."
 GER_DNVP_Ally_Baltic:0 "The Baltic Alliance"
 GER_DNVP_Ally_Baltic_desc:0 "The defense against Bolshevism cannot occur without the defense of the Baltic States. Should they fall, the Reds would be invited to invade Eastern Prussia, and later, Germany itself!"
 GER_DNVP_Attack_USSR:0 "Destroy the [This.GetRussia]"
 GER_DNVP_Attack_USSR_desc:0 "The Empire to our east is an abomination that must be destroyed. White Ruthenia and Ukraine are prime areas for German colonization, and by bringing Moskau to its knees, we bring an entire continent to our heel!"
 GetRussiaBolsheviks:0 "Bolsheviks"
 GetRussiaRussians:0 "Russians"
 GER_DNVP_Customs_Union_Aus:0 "Customs Union with Austria"
 GER_DNVP_Customs_Union_Aus_desc:0 "The annexation of Austria cannot be done in one fell swoop. The first step to the Ancshluß is a customs union with Austria, intended to bring them into our Sphere of Influence. From there, we can use economic pressures as leverage."
 GER_DNVP_AUS_Military_Option:0 "The Military Option"
 GER_DNVP_AUS_Military_Option_desc:0 "It is clear that the Austrians cannot be pressured into joining the Reich. However, the military option remains..."
 GER_approach_GDVP_tt:0 "§YWe will approach the GDVP.§!\n"
 GER_approach_DNSAP_tt:0 "§YWe will approach the NSDAP.§!\n"
 GER_DNVP_AUS_GDVP:0 "Use the GDVP"
 GER_DNVP_AUS_GDVP_desc:0 "The Großdeutsche Volkspartei (Greater German People's Party) is the Austrian analog to the DNVP. Although they are far more liberal, they are incredibly nationalist and seek to see unification between Austria and Germany. With a coordinated effort, we believe that we can peacefully pressure Austria into accepting our rule."
 GER_DNVP_AUS_DNSAP:0 "Use the NSDAP"
 GER_DNVP_AUS_DNSAP_desc:0 "The  Nationalsozialistische Deutsche Arbeiterpartei (National Socialist German Workers' Party) is ideologically compatible with our National Socialist partners. As they are the most pro-German nationalist group in Austria, we should use them to force the Nationalrat to accept our rule!"
 GER_DNVP_Sudetenland:0 "Demand the Sudetenland"
 GER_DNVP_Sudetenland_desc:0 "The Treaty of St. Germain wrongfully stole rightful German territories from Austria. As we have corrected the Austrian Mistake, it is now time to correct the Sudeten Error."
 GER_DNVP_Summit_with_Italy:0 "Italo-German Summit"
 GER_DNVP_Summit_with_Italy_desc:0 "We and the Italians have mutual interests, so it would be prudent to arrange a summit to explore various avenues of cooperation. We are interested both in seeing Italy join our alliance and securing the interests of the Tyrolean Volksdeutsche."
 GER_DNVP_Yugoslavia:0 "Treaty of Hvar"
 GER_DNVP_Yugoslavia_desc:0 "If Italy will not join our Sphere of Influence, then we must try and make other friends. We can try and entreat Yugoslavia into joining our alliance due to our mutual Anti-Italian interests. We would also recognize Yugoslav Claims in Albania and Greece, if the opportunity arises."
 GER_DNVP_Invade_Italy:0 "Secure Südtirol"
 GER_DNVP_Invade_Italy_desc:0 "South Tyrol is home to a large amount of Germans (approximately 200,000), so it must become part of our Reich! As Italy refuses our advances, we must take the territory for ourselves."
 GER_DNVP_Hungary:0 "Treaty of Eger"
 GER_DNVP_Hungary_desc:0 "Since we have mutual Anti-Yugoslav interests, an Alliance with Hungary is only natural. They will be interesed in an alliance mainly because it allows them to use us as leverage against the Romanians, Yugoslavs, and Czechoslovaks as those countries hold Hungary's claimed territories."
 GER_DNVP_Demand_Slovenia:0 "Liberate Slovenian Volksdeutsche"
 GER_DNVP_Demand_Slovenia_desc:0 "Northern Slovenia is home to a German Minority in Maribor. If we are to truly create a Pan-German State, we would demand that Yugoslavia cede this territory to us. Furthermore, our allies might also want parts of Slovenia, so we should send offers where we can."
 ####Goerdeler
 german_focus_dnvp_goerdeler:0 "DNVP: Goerdeler Focus Tree"
 GER_goerdeler_in_power:0 "§YC.F. Goerdeler§! is the Reichskanzler."
 GER_DNVP_Goerdeler_Start:0 "Friedens und Wohlfahrt"
 GER_DNVP_Goerdeler_Start_desc:0 "The Kaiser has vested responsibility of the Chancellorship in the celebrated econonomist Dr. Carl Frederich Goerdeler. Howver, his appointement likely comes from his wish to restore the Prussian Constitutional System rather than maintain Hugenberg's power base. On the other hand, he has been flirting with the creation of a new system..."
 GER_DNVP_Goerdeler_New_Monarchy:0 "The Constitutional Dream"
 GER_DNVP_Goerdeler_New_Monarchy_desc:0 "The People are weary of the dictatorship. According to Herr Goerdeler, it would be prudent to transition to a Constitutional Monarchy with free elections. Herr Goerdeler envisions a party-less democracy, with First-Past-the-Post voting, and based heavily on Lutheranism."
 GER_DNVP_Goerdeler_Prussian_Constitutionalism:0 "The Good Old Times"
 GER_DNVP_Goerdeler_Prussian_Constitutionalism_desc:0 "The Hugenberg Dictatorship went too far. The optimal system of government for Germany is the system of the Second Empire. Under the Prussian Constitution, Germany had the strongest Army and largest Economy on Mainland Europe!"
 GER_DNVP_Goerdeler_Reshuffle_Reichstag:0 "Reshuffle the Reichstag"
 GER_DNVP_Goerdeler_Reshuffle_Reichstag_desc:0 "With Hugenberg's stench in the Reichstag, we cannot hope to get our policies approved, even though the Diet is largely a rubber-stamping committee. We must give it a thorough cleaning so that true reforms can begin."
 GER_DNVP_Goerdeler_Expand_Municipal_Powers:0 "Expand Municipal Powers"
 GER_DNVP_Goerdeler_Expand_Municipal_Powers_desc:0 "Love of God begins at the home, so local politics must be given a larger emphasis. Cities and Towns will be given more room to make their own decrees rather than simply carrying out Berlin's orders. We will also encourage Town Halls so that bureaucrats can better understand the needs of the people."
 GER_DNVP_Goerdeler_Nobles_Rule_Again:0 "The Nobles Shall Rule Again"
 GER_DNVP_Goerdeler_Nobles_Rule_Again_desc:0 "The Nobles must be given room to Rule, rather than simply act as fronts for Hugenberg-esque machinations. The Nobles shall be given the power to convene State Diets, appoint politicians, and have veto power over State and Local ordinances."
 GER_DNVP_Goerdeler_Democracy_10_Commandments:0 "Democracy of the 10 Commandments"
 GER_DNVP_Goerdeler_Democracy_10_Commandments_desc:0 "Although our government shall be a Democracy, it shall not be the Weak Democracy of the Republic. Our Democracy will by guided by Spiritualist Christianityrather than Materialist Nonsense."
 GER_DNVP_Goerdeler_Equality_Among_Christians:0 "Equality Among Christians"
 GER_DNVP_Goerdeler_Equality_Among_Christians_desc:0 "Catholic or Lutheran, the Branch of Christianity is irrelevant to the new government. However, the Government will lean towards supporing Lutheran Churches over Catholic interests."
 GER_DNVP_Goerdeler_Enforce_Lutheranism:0 "Enforce State Lutheranism"
 GER_DNVP_Goerdeler_Enforce_Lutheranism_desc:0 "Why should we support Catholics when they are clearly heretics? The state should be entirely Lutheran, even if the Catholics and Jews are allowed to vote."
 GER_DNVP_Goerdeler_Landtage:0 "Die Landtage"
 GER_DNVP_Goerdeler_Landtage_desc:0 "The Restoration of State Diets, or Landtage, will ensure that the people have representation at the state level. They will have their own Minister-Presidents and assemblies able to make laws that more accurately reflect local sentiments. The Landtage will also have the ability to elect half the members of the Reichstag."
 GER_DNVP_Goerdeler_Empower_Reichstag:0 "Empower the Reichstag"
 GER_DNVP_Goerdeler_Empower_Reichstag_desc:0 "The Reichstag must be more than a rubber-stamping committee. Without actual debate and lawmaking, it becomes nothing more than a fancy-horse show. It will, of course, be subordinate to the Kaiser's will."
 GER_DNVP_Goerdeler_Exports:0 "Encourage Exports"
 GER_DNVP_Goerdeler_Exports_desc:0 "If the German Economy is going to be competative, we need to encourage our companies to export, or else we will be overrun by American and British manufacturers."
 GER_DNVP_Goerdeler_Protestant_Trade_Union:0 "A New Trade Union"
 GER_DNVP_Goerdeler_Protestant_Trade_Union_desc:0 "If we are to unite the German People, a State Trade Union will be necessary. However, it should actually have an affect on National Policy, and its membership will be compulsory."
 GER_DNVP_Goerdeler_Expand_Civil_Rights:0 "Expand Civil Rights"
 GER_DNVP_Goerdeler_Expand_Civil_Rights_desc:0 "Hugenberg's Dictatorship was far too strict when it came to civil rights. We can relent a little, and grant a limited measure of freedom to the people."
 GER_Reichstandehaus:0 "Reichständehaus"
 GER_Bundesrat:0 "Bundesrat"
 GER_DNVP_Goerdeler_Reichstandehaus:0 "Reichständehaus"
 GER_DNVP_Goerdeler_Reichstandehaus_desc:0 "The Imperial Corporate House will be our legislative Upper House, with members chosen from the Clergy, University faculty, the Bourgious Businessmen, and Trade Union Leaders. This council will help us achieve unity by allowing representatives of the various classes in Germany to voice their opinions and settle grievences."
 GER_DNVP_Goerdeler_Bundesrat:0 "Bundesrat"
 GER_DNVP_Goerdeler_Bundesrat_desc:0 "We shall restore the Federal Council of Old, where representatives from the different Länder meet to help us direct national policy. It allows for policy to be more indicative of the situation in the Länder, rather than enforcing suboptimal laws on them."
 #parties for Parteigesetz
 GER_Disband_Commun_DNVP_party:0 "K"
 GER_Disband_Commun_DNVP_party_long:0 "Kommunisten"
 GER_Disband_RevSoc_DNVP_party:0 "R"
 GER_Disband_RevSoc_DNVP_party_long:0 "Revolutionäre"
 GER_Disband_DemSoc_DNVP_party:0 "S"
 GER_Disband_DemSoc_DNVP_party_long:0 "Sozialisten"
 GER_Disband_SocDem_DNVP_party:0 "D"
 GER_Disband_SocDem_DNVP_party_long:0 "Demokraten"
 GER_Disband_SocLib_DNVP_party:0 "B"
 GER_Disband_SocLib_DNVP_party_long:0 "Bürger"
 GER_Disband_MarLib_DNVP_party:0 "L"
 GER_Disband_MarLib_DNVP_party_long:0 "Liberalen"
 GER_Disband_LibCon_DNVP_party:0 "M"
 GER_Disband_LibCon_DNVP_party_long:0 "Moderaten"
 GER_Disband_SocCon_DNVP_party:0 "K"
 GER_Disband_SocCon_DNVP_party_long:0 "Konservativen"
 GER_Disband_Author_DNVP_party:0 "K"
 GER_Disband_Author_DNVP_party_long:0 "Konservativen"
 GER_Disband_Monarc_DNVP_party:0 "M"
 GER_Disband_Monarc_DNVP_party_long:0 "Monarchisten"
 GER_Disband_Nation_DNVP_party:0 "N"
 GER_Disband_Nation_DNVP_party_long:0 "Nationalisten"
 GER_Disband_Fascis_DNVP_party:0 "F"
 GER_Disband_Fascis_DNVP_party_long:0 "Faschisten"
 GER_DNVP_Goerdeler_Parteigesetz:0 "Parteigesetz"
 GER_DNVP_Goerdeler_Parteigesetz_desc:0 "The Party Law mandates that no parties - Including the DNVP - may exist in the new German Democracy. Candidates must now earn government posts through competence rather than affiliation."
 GER_DNVP_Goerdeler_First_Elections:0 "The First Elections"
 GER_DNVP_Goerdeler_First_Elections_desc:0 "Now that the proper structures are in place, we can hold the first elections next month. Under our system, half the Reichstag will be directly elected by the people, and the other half indirectly elected by Landtage and other structures. this ensures that we hold a majority, or near majority."
 GER_DNVP_First_Elections:0 "§YElections will be held next month.§!\n"
 GER_DNVP_Goerdeler_Kaiser_Powers:0 "Transfer Power to the Kaiser"
 GER_DNVP_Goerdeler_Kaiser_Powers_desc:0 "The final step in our plan is to transfer the Kaiser's old powers - granted by the Prussian Constitution - back to him. This way, we can nearly fully achieve a return to the Old Ways."
 GER_DNVP_Goerdeler_Prussian_Constitutionalism_End:0 "Prussian Constitutionalism"
 GER_DNVP_Goerdeler_Prussian_Constitutionalism_End_desc:0 "The Reforms are complete, and we have now successfully returned to the days of the Second Reich, when Germany was still respected on the World Stage. Soon, the entire world will know the Glory of God and Light of the Kaiser..."
 ##Seldte Tree
 GER_seldte_in_power:0 "§YFranz Seldte§! is the Reichskanzler."
 german_focus_dnvp_stahlhelm:0 "Stahlhelm Focus Tree"
 GER_DNVP_Seldte_Start:0 "Volk und Vaterland"
 GER_DNVP_Seldte_Start_desc:0 "The Hugenberg Dictatorship was promising, but weakened by Hugenberg putting himself and the nobility before loyalty to the Kaiser and the State. Now that the Stahlhelm is in control of the country, we can make Germany respectable again, as Mussolini has done in Italy."
 GER_DNVP_Devotion_to_Party:0 "Devotion to the Party"
 GER_DNVP_Devotion_to_Party_desc:0 "The German People should base their lives around the structure of the Party, not their petty interpersonal squabbles."
 GER_DNVP_Devotion_to_State:0 "Devotion to the State"
 GER_DNVP_Devotion_to_State_desc:0 "For far too long, the German State has been a vehicle for Capitalist gain and Marxist humiliation. This prostitution of Germany and its people ends now!"
 GER_DNVP_Devotion_to_Kaiser:0 "Devotion to the Kaiser"
 GER_DNVP_Devotion_to_Kaiser_desc:0 "Whether you are a Fascist or not, you can at least be assured that the Kaiser watches over and protects all Germans, and that they have nothing to fear from his light."
 GER_DNVP_Arbeitverfassung:0 "Arbeitverfassung"
 GER_DNVP_Arbeitverfassung1:0 "Arbeitverfassung"
 GER_DNVP_Stahlhelm_Arbeitverfassung:0 "Arbeitverfassung"
 GER_DNVP_Stahlhelm_Arbeitverfassung_desc:0 "Much like our friend Mussolini has done in Italy, we too will secure Workers' Rights in the name of a Labour Constitution. Under the terms of the constitution, the workers would have better job security, but the employers would have more security against strikes."
 GER_DNVP_Stahlhelm_Productive_Capitalism:0 "Bodenständigen Kapitalismus"
 GER_DNVP_Stahlhelm_Productive_Capitalism_desc:0 "While the State and the Party support the efforts of the manufacturing industries, unproductive capitalism should be abolished. Capitalism will only be allowed if it produces, not speculates, and, most importantly, it must not work against the goals of the state."
 GER_DNVP_Chamber_of_Corporations:0 "Verbandsrat"
 GER_DNVP_Stahlhelm_Chamber_of_Corporations:0 "Verbandsrat"
 GER_DNVP_Stahlhelm_Chamber_of_Corporations_desc:0 "The Council of Corporations will be a new form of legislative body where the state chooses delegates based on their occupation. These include, for example, representatives from the Reichsarbeiterbund, representatives of the farmers, or representatives of the technical professions."
 GER_DNVP_Stahlhelm_Personality_Cult:0 "Establish a Personality Cult"
 GER_DNVP_Stahlhelm_Personality_Cult_desc:0 "Although the Hugenberg Dictatorship made steps in this direction, it did not emphatically push the greatness of the Reichskanzler at every possible opportunity. However, Herr Hugenberg was an old Aristocratic Soup Sucking Goat, while the Führer is the savior of Germany!"
 GER_DNVP_Stahlhelm_Oath_of_Service:0 "Oath of Service"
 GER_DNVP_Stahlhelm_Oath_of_Service_desc:0 "Hugenberg did not think it necessary to put pressure on the army due to the military's overwhelming support for the DNVP. However, as they are not as enthusiastic about Fascism, we must require all soldiers to sign an oath of obedience to the State, the Führer, and the Kaiser."
 GER_DNVP_Stahlhelm_Paramilitary:0 "Jungstahlhelm"
 GER_DNVP_Stahlhelm_Paramilitary_desc:0 "Before the Stahlhelm Period, the Stahlhelm was a militia where adults were conscripted for a three-month service every five years, but the Young Stahlhelm was voluntary. Membership in the Jungstahlhelm will now be mandatory, as we can use the organization to prepare our youth for their eventual military service."s
 GER_DNVP_Stahlhelm_Cult_of_Action:0 "Cult of Action"
 GER_DNVP_Stahlhelm_Cult_of_Action_desc:0 "The Thought is pointless, and comes to nothing. The only thing that matters is direct action, whether at work or in war."
 GER_DNVP_Stahlhelm_Redraw_Provinces:0 "Redraw Provinces"
 GER_DNVP_Stahlhelm_Redraw_Provinces_desc:0 "The Aristocratic Divisions of the German State are a horror to behold. It is a miracle that anything was ever governed there successfully. We will redraw the provinces to reintroduce sanity to our administrative divisions."
 GER_DNVP_Stahlhelm_Fascist_Council:0 "Großer Faschistischer Rat"
 GER_DNVP_Stahlhelm_Fascist_Council_desc:0 "The Great Council of Fascism will be, like in Mussolini's Italy, our main legislative body. It will have the power to appoint deputies and ministers, choose the line of succession, and create, discuss, and vote on legislation."
 GER_DNVP_Stahlhelm_Disband_Reichstag:0 "Disband the Reichstag"
 GER_DNVP_Stahlhelm_Disband_Reichstag_desc:0 "With The Great Council of Fascism, why do we need a Reichstag? The body shall be dissolved, and its members may be appointed as members of the political leadership elsewhere."
 GER_DNVP_Stahlhelm_Pan_Germanism:0 "The Pan-German Dream"
 GER_DNVP_Stahlhelm_Pan_Germanism_desc:0 "The people must never lose sight of the Pan-German Dream. Soon the time will come where all Germans are united under one banner!"
 GER_DNVP_Stahlhelm_New_German:0 "The New German"
 GER_DNVP_Stahlhelm_New_German_desc:0 "To achieve the dream, our state requires that Germans reform themselves. The New German is athletic, eats healthily, and works hard, not that they were before, of course."
 GER_DNVP_Stahlhelm_Kraft_durch_Fruede:0 "Kraft Durch Freude"
 GER_DNVP_Stahlhelm_Kraft_durch_Fruede_desc:0 "The German worker needs a break every now and then. We must provide relaxations services for them as a way to win them over."
 GER_DNVP_Stahlhelm_Battle_For_Culture:0 "Battle for Culture"
 GER_DNVP_Stahlhelm_Battle_For_Culture_desc:0 "The German Culture is constantly under attack by foreign influences and dangerous ideologies. France, England, America, and the Marxists all consipire to take away the Germans' Soul away from them. A Battle for Culture is thus necessary to retake our heritage!"
 GER_DNVP_Stahlhelm_Secularization:0 "State Secularization"
 GER_DNVP_Stahlhelm_Secularization_desc:0 "With the survival of the nation on the line, there is no time for petty squabbles between Christians. All God-Fearing Germans must be united in our struggle."
 GER_DNVP_Stahlhelm_Kaiser_Museum:0 "The Imperial Museum"
 GER_DNVP_Stahlhelm_Kaiser_Museum_desc:0 "To showcase the great works of art and music of the Old Empires, we shall create an Imperial Museum in Weimar, that will both show our greatness and discredit the Old Republic!"
 GER_DNVP_Stahlhelm_Germany_United_Strong:0 "Deutschland, Vereint und Stark"
 GER_DNVP_Stahlhelm_Germany_United_Strong_desc:0 "Thanks to our timely intervention, Germany has been entirely remade. We are now United and Strong!"
 #events
 GER_DNVP_WP_coal:0 "§GIn Coalition with the DVP.§!"
 GER_DNVP_no_coal:0 "§RNo Coalition.§!"
 GER_DNVP_nazi_coal:0 "§YIn Coalition with the NSDAP.§!"
 ger_internal.27.t:0 "Finding a Coalition Partner"
 ger_internal.27.d:0 "Our government is in somewhat dire straits, as we have a very small minority. The only option available to us right now is to assemble a coalition. Our first option is to work with the Deutsche Volkspartei, a middle-class conservative party. Although they are not as radically nationalist as we are, we have similar economic interests and a similar voter base. However, we would have to give their politicans positions in our government. We can offer the post of interior minister to the former mayor of Duitsberg, Karl Jarres. This would assure people that our regime will be milder than they expect, at least for now.\n\nAlternatively, we can ally with the NSDAP. Hitler's national socialists have the support of a third of the nation, and having them as part of our coalition (and Hitler as Deputy Chancellor) will win our government support. However, if we let them get too influential, they may try and take power for themselves. We will also offer to make Otto Georg Thierack the Interior Minister, which would show NSDAP voters that we want to carry out the policies they support. Which option shall we choose?"
 ger_internal.27.a:0 "Go with the DVP."
 ger_internal.27.b:0 "Neither Coalition is worth our time."
 ger_internal.27.c:0 "We must work with the NSDAP."
 ger_internal.28.t:0 "NSDAP Loses Members"
 ger_internal.28.d:0 "Our coalition agreement seems to have created a shift in the NSDAP's politics. Approximately 20% of its members have resigned, some citing Hitler's willingness to be subordinate to us, others complaining about Hitler's cooperation with \"Reactionaries\". Although this does decrease our power, it also lowers Hitler's personal influence, making his organization easier to manage."
 ger_internal.28.a:0 "This is a good thing for us."
 ger_internal.29.t:0 "The Stahlhlem Question"
 ger_internal.29.d:0 "Although the Stahlhelm is our party's militia, we have been charged by the President to eliminate the influence of paramilitaries in Germany. Therefore, the current status of the Stahlhelm cannot stand. What should we do instead?"
 ger_internal.29.a:0 "Integrate the Stahlhelm into the reservists."
 ger_internal.29.b:0 "Declare them to be an Official Militia."
 ger_internal.29.c:0 "We have no choice but to disband the Stahlhelm."
 ger_internal.30.t:0 "Hitler Refuses our Demands"
 ger_internal.30.d:0 "In a heated back-and-forth, Adolf Hitler has refused to disband the SA, despite his distrust of the organization. He accused Hugenberg of \"sabotaging the forces of purity\" and \"conciliation towards undesirable political elements\". However, as per the terms of the demands, we should end the coalition with the Nazis. Should we follow through, or has Hitler called our bluff?"
 ger_internal.30.a:0 "Hitler's help is not worth chaos."
 ger_internal.30.b:0 "Unfortunately, we need Hitler."
 GER_DNVP_no_sa:0 "§GThe SA has been disbanded.§!"
 ger_internal.31.t:0 "Hitler Disbands the Sturmabteilung"
 ger_internal.31.d:0 "After agreeing to our demands, Hitler gave a speech to a large gathering of Storm Troopers in which he announced the end of the SA. He said that as the Völkisch Coalition already controls the government, The SA no longer has a purpose. He urged his supporters to go back to the fields and the factories, saying that they will be more useful there.\n\nAt the same time, a contingent of soldiers led by Lieutenant-Colonel Wilhelm Keitel have intercepted SA leader Ernst Röhm and his entourage and attempted to arrest him. He resisted arrest, and after a short battle, was shot and killed."
 ger_internal.31.a:0 "Everything has gone according to plan!"
 ger_internal.32.t:0 "SA Clique Breaks with Hitler"
 ger_internal.32.d:0 "A many former Sturmabteilung troopers have broken with Hitler after he announced the dissolution of the organization. Some have gone to the Freikorps, some left-wing national socialists have even joined the Rotfrontkämpferbund, but others have joined Walter Stennes's Nationalsozialistische Kampfbewegung Deutschlands (National Socialist Fighting League of Germany). The NSKD is a Leftist National Socialist organization that seeks to overthrow capitalism and nationalize capital and land. Although still a minor force, they have recently swelled in number."
 ger_internal.32.a:0 "They will be destroyed along with the Communists!"
 GER_DNVP_yes_sa:0 "§RThe SA continues to exist.§!"
 GER_DNVP_Restoration_wilhelm_tt:0 "§GCrown Prince Wilhelm will be crowned Kaiser Wilhelm III!§!\n"
 GER_DNVP_Restoration_ferdinand_tt:0 "§GCrown Prince Ferdinand will be crowned Kaiser Ferdinand I!§!\n"
 GER_DNVP_Restoration:0 "§YRestored the Monarchy.§!"
 GER_DNVP_Fuhrer_tt:0 "§GAlfred Hugenberg will be made Führer of all Germany!§!\n"
 GER_DNVP_Fuhrer:0 "§YHugenberg was made Führer§!\n"
 ger_internal.33.t:0 "President Hindenburg Dies"
 ger_internal.33.d:0 "Our President, Paul von Hindenburg, has died today of lung cancer. The Lion of Prussia had led our country both in War and in Peace, and his funeral will ensure that the Great Hero will be mourned accross the nation.\n\nErwin Bumke has taken up the mantle of Reichspräsident as was agreed upon previously, and being of our party, is ready to sign of on whatever Herr Hugenberg puts on his desk. [This.RestorationEventGer]."
 ger_internal.33.a:0 "Heil dir im Siegerkranz!"
 ger_internal.33.b:0 "Hitler shall have his way, for now."
 DNVP_Restoration_Nazis:0 "We had planned to hold a referendum that would abolish the office of the Reichspräsident and restore the Hohenzollern dynasty, but Hitler and the NSDAP has threatened to leave the coalition. It is clear that Hitler is not bluffing, as our informants report the possibility of a restoration to be his greatest fear. Shall we acceed to his wishes, or hold the referendum anyways?"
 DNVP_Restoration_No_Nazis:0 "We have already begun holding a referendum that would abolish the office of the Reichspräsident and restore the Hohenzollern dynasty. With our control over the nation's politics and the destruction of our political rivals, the referendum is only a formality at this point."
 ger_internal.34.t:0 "Hugenbergsche Reichsverfassung"
 ger_internal.34.d:0 "After nearly thirty days of work, the DNVP government has created the new Constitution of the German Empire, colliquily called Hugenberg's Imperial Constitution. Some excerpts include:\n\nArticle 1: The form of government is to be a Monarchy bound by this constitution.\nArticle 3: The German Emperor may dismiss the Imperial Chancellor with the agreement of a majority of the Imperial Cabinet, and may appoint anybody to the position with the agreement of half the Imperial Diet.\nArticle 14: Sedition and Libel against the government are outlawed. All other forms of speech are premitted.\nArticle 21: All organizations, political or otherwise, are legal unless they promote un-constitutional activities."
 ger_internal.34.a:0 "Gott mitt Uns!"
 ger_internal.35.t:0 "Restoration of the Nobility"
 ger_internal.35.d:0 "Ever since the restoration of the Kaiser and the establishment of the Hugenberg Constitution, the nobles have been demanding the official restoration of their lands and titles. The constitution provides for a nobility (especially since von Hugenberg was ennobled), but there are several higher titles that the Party is reluctant to restore. The most glaring example is the Kingdom of Bavaria. Although the Wittlesbachs should be restored under the Emperor, this would give the Bavarians too much authority for the Party's liking. What shall we do?"
 ger_internal.35.a:0 "Officially restore the old Nobility."
 ger_internal.35.b:0 "Restore the Nobility, but devolve higher titles."
 ger_internal.35.c:0 "Restore no titles; we shall create a new, more loyal, aristocracy!"
 ger_internal.36.t:0 "The Fate of the NSDAP"
 ger_internal.36.d:0 "Hitler's personal ambitions have grown too large for our liking. A plan is already in motion to arrest him and his loyal cronies, but there is some hesitation to ban the relatively popular party altogether. Some have had the idea to allow the NSDAP to serve as an official opposition party, representing the workers while we represent the farmers and nobility. We would still control elections, and we would prevent NSDAP entry into the government. Should we enact this plan, or get rid of the National Socialists entirely."
 ger_internal.36.a:0 "The National Socialists are too dangerous."
 ger_internal.36.b:0 "A controlled opposition would work for us."
 ger_internal.37.t:0 "NSDAP Governors"
 ger_internal.37.d:0 "Hitler has long demanded that we allow NSDAP cronies to serve as provincial governors. For a long time we have put him off with polite assurances, but he has brought the problem to us in a way that we cannot escape it any longer. Hitler demands that the NSDAP be able to serve as governors on an equal level to their DNVP counterparts, but we can likely get him to agree to some limits. We can offer to allow National Socialist governors when there is sufficient support for the Party in a state. Alternatively, we can just refuse outright. What shall we do?"
 ger_internal.37.a:0 "There is no harm in acceeding to this demand."
 ger_internal.37.b:0 "Allow limited governorships."
 ger_internal.37.c:0 "No, no and a thousand times no!"
 ger_internal.38.t:0 "Disappointed Consumers"
 ger_internal.38.d:0 "Due to our measures against margarine, prices of dairy products and margarine itself have risen. This is obviously unpopular with German consumers, who blame Herr Hugenberg personally for this. On the other hand, the farmers have proven to be loyal supporters of the DNVP, and seem to support these measures."
 ger_internal.38.a:0 "Prices will normalize eventually."
 ####Kaiser vs Hugenberg Chain
 Restore_Titles:0 "Titles, "
 ger_internal.39.t:0 "Memorandum from the Kaiser"
 ger_internal.39.d:0 "\"To His Excellency Alfred Hugenberg,\n\nThe crown is concerned about your treatment of the nobility. Loyal Germans - party members even - have been left at the wayside, ignored in favor of party interests. Therefore, the Crown asks that you restore the [This.TitlesOrNo]Responsibilties and Duties of the Nobility at once.\n\nHis Imperial Majesty, by the Grace of God,\nKaiser [GER.GetLeader] von Hohenzollern\"\n\nThis memorandum just came from the Kaiser's office. Obviously, some power-hungry nobles have managed to catch his ear, otherwise he would never have bothered to notice national affairs. Regardless, this is something we now have to deal with. Shall we empower the nobility, or leave the old wet sock out to dry?"
 ger_internal.39.a:0 "It would be easier to give His Majesty what he wants."
 ger_internal.39.b:0 "Gift the nobles a few thousand Reichsmarks, that should shut them up."
 ger_internal.39.c:0 "[GetKaiserName] can take his memo and stuff it!"
 ger_internal.40.t:0 "The Kaiser Demands an Adelsrat"
 ger_internal.40.d:0 "Using the success of his previous \"efforts\", that Windbag-Womanizer [GetKaiserName] now seeks to fill our government with his cronies using a Council of the Nobility, where the Nobles in our country would be able to help decide policy! Of course, if we allow this, we must carefully make sure that the Adelsrat is controlled - at least mostly - by members of the DNVP. However, most of the DNVP elite are horrified at such a proposal, as it would take power away from the DNVP in the Reichstag. Should we allow the Kaiser to get his way, or do we stand firm?"
 ger_internal.40.a:0 "The Kaiser's wish is our command."
 ger_internal.40.b:0 "We must stand firm!"
 ger_internal.41.t:0 "Kaiser [GetKaiserName] Demands a Consitutional Amendment"
 ger_internal.41.d:0 "The Kaiser takes us for a fool! He thinks that so far, because we have appeased him, he can demand more of us! He has demanded that we repeal the statue (in the constitution) that prevents him from dismissing and appointing a Reichskanzler without cabinet and Reichstag approval! Does the alcoholic idiot really think that we will endager ourselves in this manner?"
 ger_internal.41.a:0 "If we wish to stay in power, he must be allowed to think so."
 ger_internal.41.b:0 "This goes too far!"
 ger_internal.42.t:0 "Hugenberg Enobled"
 ger_internal.42.d:0 "For his services to Germany, the Monarchy, and the Nation, the Kaiser has decided to grant Alfred Hugenberg - rather Graf Alfred von Hugenberg - a Hereditary Title. In a grand ceremony attended by representatives from all the German Noble houses and Hundreds of Prominent Party Members, The Kaiser, flanked by the heads of the various Lutheran Churches in Germany, proclaimed Alfred Hugenberg to be a Count of the German Empire! After the ceremony, there was a Grand Party in the Berlin Palace, and a second party - largely for DNVP members - at von Hugenberg's personal residence. The DNVP considers this to be the Party's greatest achievement, as the enoblement of the Party Leader is sure to cement our rule over Germany, and increase our influence over the Kaiser himself!"
 ger_internal.42.a:0 "Für Gott, Reichskanzler, und Vaterland!"
 ger_internal.43.t:0 "Bribery Pays Off"
 ger_internal.43.d:0 "Instead of empowering the nobility, it has turned out to be far simpler to forwards gifts of several thousand Reichsmarks to the complainers in the hope that it will shut them up. This gamble has so far paid off, with all of the dissident nobles rescinding their support for this Anti-Party effort. Should the Kaiser complain, then he will have no backers, and thus no legs to stand on..."
 ger_internal.43.a:0 "The Kaiser is likely too busy with his mistress to notice."
 ger_internal.44.t:0 "Nobles back Hugenberg"
 ger_internal.44.d:0 "Herr Hugenberg arrived at the Berlin Palace today, to explain to the Kaiser exactly why he has not taken steps other than give the Kaiser vague promises. Herr Hugenberg took Graf Otto von Bülow - a noble and a naval officer - with him to explain his position. Graf von Bülow explained that the nobles no longer felt that empowerment was necessary, as it would interfere with the Government's work. Herr Hugenberg then explained that the Government has more important things to spend resources on, and that restoring the Nobles' powers would be a waste of time at the moment."
 ger_internal.44.a:0 "Hopefully, the Kaiser suspects nothing."
 ger_internal.45.t:0 "The Kaiser Protests Bribery Programs"
 ger_internal.45.d:0 "One way or another, Kaiser [GER.GetLeader] has found out about our bribery of the Nobility, and has demanded that we cease this sort of corruption at once. Evidently, the Old Wet Sock has decided that he would rather spend the money on his mistresses! In any case, [GER.GetLeader] has no legs to stand on, as the nobles nearly universally back us, at least as far as we know. Should we end our bribery programs, or stand up to His Glorious Majesty?"
 ger_internal.45.a:0 "His Majesty shall have his way."
 ger_internal.45.b:0 "The Kaiser should remember who put him on the throne!"
 ger_internal.46.t:0 "The Kaiser Scolds Hugenberg"
 ger_internal.46.d:0 "Even though we have ended our Bribery Program, the Kaiser still felt that it was necessary to scold Herr Hugenberg in front of the cabinet. Apparently our \"reckless corruption\" and \"disregard for the leader\" (he thinks he's actually in charge!) threaten the safety and security of our regime. While the cabinet has paid attention out of respect, this rant has continued for nearly fifteen minutes, and nerves are beginning to wear thin. The Kaiser's personal aide attempted to get him back on topic (we were discussing defense spending), but to no avail. The old windbag is apparently not a wet sock, but a dry one full of hot air. Herr Hugenberg himself is itching to reply as his face is going beet red from anger..."
 ger_internal.46.a:0 "We apologize for our actions, Your Majesty"
 ger_internal.46.b:0 "Now listen here, you impudent-"
 ger_internal.47.t:0 "Rumors Abound!"
 ger_internal.47.d:0 "Over the last two weeks, rumors have been spreading about the frosty relationship between the Kaiser and the Kanzler. They alledge Herr Hugenberg's habit of insulting the Kaiser has gotten to impossible levels. And since complaining about the Monarch has become the Reichskanzler's favorite pastime, these rumors are largely true, if exaggerated. Somehow, these rumors managed to reach the Kaiser, who has summoned Herr Hugenberg and demanded an explanation."
 ger_internal.47.a:0 "These rumors are entirely false!"
 ger_internal.47.b:0 "Let me tell you something..."
 ger_internal.48.t:0 "The Kaiser Writes to Hugenberg"
 ger_internal.48.d:0 "The Kaiser's personal aide has just delivered a letter to the Reichskanzler's office. Herr Hugenberg opened it with trepidation, but instead of a dismissal, it was a commendation. The Kaiser wrote that although the two have their differences, he clearly sees that Hugenberg has done a good job in improving Germany's situation, and hopes for a better relationship in the future."
 ger_internal.48.a:0 "And the old goat couldn't tell us that personally?"
 ger_internal.49.t:0 "Ultimatum from the Kaiser"
 ger_internal.49.d:0 "In light of our refusal to cancel the secret bribery program, the Kaiser has childishly given us an ultimatum: to cancel the program, or the Kaiser will reveal the program to the Reichstag. The threat is simple to undestand (remember who thought ot it): either we do what the Kaiser wants or he tries to find backing among people who largely know of the secret program anyways. It's an empty threat, and we are clearly secure in our position. How shall we respond?"
 ger_internal.49.a:0 "It is safer to relent."
 ger_internal.49.b:0 "We don't even have to respond!"
 ger_internal.50.t:0 "Insult in the Cabinet"
 ger_internal.50.d:0 "At an important cabinet meeting this week, Herr Hugenberg and the Kaiser began arguing over defense spending. The Kaiser felt that it was too high, and Hugenberg says that it cannot be changed. The Kaiser snapped back, \"You'll do it anyway, you coward\". A quite hush has gone over the conference room and Herr Hugenberg composes his response..."
 ger_internal.50.a:0 "Your Majesty, please, the money transfers have already been made..."
 ger_internal.50.b:0 "And who put you on the throne, you hedonist schoolboy?"
 ger_internal.51.t:0 "Fight in the Cabinet!"
 ger_internal.51.d:0 "Tensions between the Kaiser and Herr Hugenberg have finally come to a boil, as the two had a row unheard of in history. They traded epithets such as \"Old Goat\", the now-infamous \"Old Wet Sock\", \"Soup Sucker\", and more. They discussed topics - in a less than mature manner - such as each other's competence, lineages (mothers in particular), wealth, education, military service, and other things stricken from the public record, only to be alledged by those in the adjecent rooms. This has gone on for a solid hour, and is only now showing signs of slowing down. The Cabinet Ministers are stunned at these outbursts, and it has become clear that National Affairs cannot go on like this..."
 ger_internal.51.a:0 "Herr Reichskanzler, Your Majesty, Please calm down..."
 ger_internal.52.t:0 "The Kaiser's Favor Lost"
 ger_internal.52.d:0 "After these recent developments, the Kaiser has declared to the cabinet that he demands that Hugenberg be removed, as it can only be done with a majority vote by the cabinet. While at any other time such a vote would be unanimously in favor of Herr Hugenberg, after these recent outbursts and scandals, such a vote is less certain. As is provided by the constitution, the Reichskanzler has the right to defend themselves. Herr Hugenberg took a moment to collect his thoughts, and made ready to speak..."
 ger_internal.52.a:0 "Who has done more for Germany than Herr Hugenberg?"
 ger_internal.52.b:0 "What has this childish fool done for us?"
 ger_internal.53.t:0 "Hugenberg's Removal"
 ger_internal.53.d:0 "As nobody wants a Kaiser and a Chancellor to be permanently at odds with each other, the cabinet has voted to remove Herr Hugenberg from the Chancellorship. Therefore, it is up to the Kaiser to appoint a new Reichskanzler. The first obvious candidate is Carl Frederich Goerdeler, whose clique is more moderate than Hugenberg. They have flirted with the idea of creating a constitutional monarchy, but are likely to support a return to the Pre-1918 system. The other candidate is Reinhold Quaatz, who was close to Hugenberg politcally and socially, yet lacks the influence and the Gusto of the former leader. [This.StahlhelmChoice]Which politician shall we choose?"
 Choose_Stahlhelm:0 "A third possible Reichskanzler is Franz Seldte, leader of the Stahlhelm. The Stahlhelm, our national militia, is a party clique which advocates for an imitation of Mussolini's system - albeit far more Anti-Semitic - rather than National Conservatism or National Socialism. Seldte is personally not a fearsome individual, but the Kaiser sympathizes with him, as Kaiser [GetKaiserName] was himself part of the Stahlhelm! "
 ger_internal.53.a:0 "Goerdeler is the right choice."
 ger_internal.53.b:0 "Quaatz will be satisfactory."
 ger_internal.53.c:0 "Seldte has the right ideas."
 ger_internal.54.t:0 "Kaiser [GetKaiserName] Demands Power to Remove the Chancellor"
 ger_internal.54.d:0 "Now that he thinks he has established dominance, Kaiser [GetKaiserName] has decided to demand a change to the constitution that would allow him to change the Reichskanzler without restrictions, a move clearly aimed at removing Herr Hugenberg. He protested that the clause is there to secure stability and ensure the safety of the government, but the Kaiser had none of it. Will we agree to this rediculous demand, or will we stand up to him?"
 ger_internal.54.a:0 "Better to Agree."
 ger_internal.54.b:0 "The Kaiser can't have everything he wants!"
 ger_internal.55.t:0 "The Kaiser's Speech"
 ger_internal.55.d:0 "Convening a special session of the Reichstag, the Kaiser has given a speech denouncing the Hugenberg Government's misuse of state funds, deception of the Germans and the Crown, and Hugenberg's poor personality. Saying that such a man is a sorry excuse for a German, the Kaiser drew attention to his own efforts to preserve the integrity of the DNVP regime, and ended the speech by scolding Hugenberg once more."
 ger_internal.55.a:0 "Nobody was surprised, really."
 ger_internal.56.t:0 "Goerdeler's Retort"
 ger_internal.56.d:0 "During Herr Hugenberg's attempted speech, in which he tried to defend his actions, Herr Goerdeler - leader of a clique in the Party - jumped up and attacked Hugenberg for putting personal power before the Good of the Country, Integrity, and Honesty in the eyes of God. This had quite an effect on the Reichstag, which errupted into shouting matches for a solid seven minutes before the situation calmed down. This time, Kaiser [GetKaiserName] merely watched and listened."
 ger_internal.56.a:0 "I hope nobody got hurt because of that upstart."
 ger_internal.57.t:0 "Nobles Back Kaiser [GetKaiserName]"
 ger_internal.57.d:0 "Influential members of the Nobility have issued a statement protesting our treatment of them, and issue their backing to Kaiser [GetKaiserName]. While normally we would pretend not to notice, several of these nobles are high-ranking party members with families in the Reichstag, so any mistreatment of them makes us look bad. However, this may increase our standing with the people a little bit..."
 ger_internal.57.a:0 "And the Kaiser cannot do anything about it!"
 ger_internal.58.t:0 "Kaiser [GetKaiserName] Insults Hugenberg in Public"
 ger_internal.58.d:0 "Today a public gala was held in the Berlin Palace to celebrate German Nationalist Artwork. It was a grand affair, with the biggest names in Germany making an appearance. During conversation with some guests, the Kaiser attempted to impress them by mocking Herr Hugenberg, calling him \"An Old Fat Soup-Sucking Goat\". Some way or another, this news quickly reached Herr Hugenberg, who has decided to speak with the Kaiser on this matter. Walking up to the Kaiser and introducing himself to his guests, he explained that he has \"heard that the crown has some sort of complaint\" against the Hugenberg Cabinet, and that \"All concerns should be out in the open\". The Kaiser explained that Hugenberg's failure to follow directions has caused some tension between the offices of the Crown and the Chancellorship. Hugenberg then explained that such orders are not for the Kaiser to make, as it says in the constitution. \"Damn the Constitution!\" replied the Kaiser. \"I am the Kaiser, and you shall do as I say!\". Hugenberg - red as a beet from fury - must now compose his response..."
 ger_internal.58.a:0 "I have been in Politics for longer than you have ever controlled anything!"
 ger_internal.58.b:0 "If that is how you feel about it, Your Gracious Majesty shall have all that he wishes..."
 ger_internal.59.t:0 "Public Row"
 ger_internal.59.d:0 "Both the Kaiser and the Reichskanzler have snapped, and have spent the last hour in a screaming match. They discussed topics - in a less than mature manner - such as lineages, health, wealth, power, and things only alleged by the guests. They traded epithets such as \"Fat Goat\" and \"Impudent Liberal\", to the horror of onlookers. The older guests were largely appalled at this barbarity, yet others seemed to enjoy and encourage it. Although reporters were quickly rushed out of the room, this didn't stop the bellowing rage from reaching several rooms over. This has gone on for an hour, and is only now starting to wind down..."
 ger_internal.59.a:0 "One of them has to go!"
 ger_internal.60.t:0 "The Scandal Spreads"
 ger_internal.60.d:0 "Although both Hugenberg and the Kaiser have done their best to save face, news of the Row at the Gala has made its way to every corner of Germany. Although not reported in the domestic press (it was widely featured in foreign papers), gossip has proved to be the superior medium of news. Although the gossip is somewhat exaggerated, the rumors being spread are more or less true; that the Kaiser and Reichskanzler had a barbaric argument, neither likes the other, and the Kaiser is considering Hugenberg's removal..."
 ger_internal.60.a:0 "It is clear that they cannot work together."
 ger_internal.61.t:0 "The Kaiser Demands More Power"
 ger_internal.61.d:0 "Kaiser [GetKaiserName] has summoned a cabinet meeting in which he demanded that the government transfer some of its power to him. Specifically, he asks for more control over the Chancellorship and foreign policy. Deliberations in the cabinet have brought up Hugenberg's backing down as the definate cause of this request, but it is clear that the kaiser is too busy with his mistresses to even use this power. It is also clear that he intends to hold the threat of dismissal over Herr Hugenberg to ensure that his demands are met more often. How shall we respond?"
 ger_internal.61.a:0 "It is safe to give him this power."
 ger_internal.61.b:0 "We shall take no risks!"
 ger_internal.62.t:0 "Female Suffrage"
 ger_internal.62.d:0 "An important issue for any Democracy - even our Conservative one - is the issue of Female Suffrage. And in this regard, the cabinet seems to be somewhat stuck. Although the Cabinet feels generally that women are the inferior sex, some feel that allowing women to vote would be an important concession to Liberal and Socialist interests. They also point out that the DNVP is very popular among protestant middle class women (not to mention the many female Party Activists), and it would be in our party's favor to institute Female Suffrage."
 ger_internal.62.a:0 "A God-Fearing Woman makes a good voter."
 ger_internal.62.b:0 "We pander to no-one."
 ger_internal.63.t:0 "Election Results: [This.GetWinningLocalization] Victory"
 ger_internal.63.d:0 "[This.GetWinningLocalization] candidates have won a [This.GetWinSize] victory in this year's elections, [This.GetWinningDesc]. Seats in the Reichstag have been allocated, with the indirect voting system giving the Conservatives a definite edge."
 ger_internal.63.a:0 "Congratulations are in order."
 Rightist_Victory:0 "Rightist"
 Rightist_Victory_Desc:0 "due to a recent growth in support in rural areas and among the middle class. Recent DNVP reforms, as well as lingering nationalism, were also a decisive factor"
 Centre_Rightist_Victory:0 "Centre-Rightist"
 Centre_Rightist_Victory_Desc:0 "supported by disaffected Conservatives embittered by protectionism. This vote is their protest against rising prices caused by our tariffs"
 Centre_Victory:0 "Centrist"
 Centre_Victory_Desc:0 "which seems to indicate a swing away from the radicalism of the left and right and a desire for greater reforms"
 Centre_Leftist_Victory:0 "Centre-Leftist"
 Centre_Leftist_Victory_Desc:0 "largely thanks to an increase in support from university students and minorities, but also a swing from small business owners who feel snubbed by the DNVP's backing of large businesses"
 Leftist_Victory:0 "Leftist"
 Leftist_Victory_Desc:0 "as the DNVP dictatorship has caused the word \"Conservative\" to leave a poor taste in the mouths of many. These voters feel that they can use our system as a vehicle for Marxist reforms"
 Major_Victory:0 "landslide"
 Regular_Victory:0 "definate"
 Minor_Victory:0 "minor"
 Reshuffle_Parliament_tt:0 "§YSeats in the Reichstag will be reallocated.§!\n"
 ger_internal.64.t:0 "Negotiations with the Authoritarians: Increased Military Spending"
 ger_internal.64.d:0 "The Authoritarians are willing to support our motion on the condition that we increase military spending for a period of 90 days. Should we accept?"
 ger_internal.64.a:0 "We accept."
 ger_internal.64.b:0 "We cannot accept this."
 GER_DNVP_Goerdeler_Interest_Leninist:0 "VfoA"
 GER_DNVP_Goerdeler_Interest_Leninist_long:0 "Verein für öffentliche Arbeiten"
 GER_DNVP_Goerdeler_Interest_RevSoc:0 "AAK"
 GER_DNVP_Goerdeler_Interest_RevSoc_long:0 "Arbeiters Außenpolitische Komitee"
 GER_DNVP_Goerdeler_Interest_DemSoc:0 "DKhL"
 GER_DNVP_Goerdeler_Interest_DemSoc_long:0 "Deutsches Kampagne für ein höheres Lebensstandard"
 GER_DNVP_Goerdeler_Interest_SocDem:0 "BGD"
 GER_DNVP_Goerdeler_Interest_SocDem_long:0 "Bewegung für Gleichheit und Demokratie"
 GER_DNVP_Goerdeler_Interest_SocLib:0 "BB"
 GER_DNVP_Goerdeler_Interest_SocLib_long:0 "Bürger Bewegnung"
 GER_DNVP_Goerdeler_Interest_MarLib:0 "CF"
 GER_DNVP_Goerdeler_Interest_MarLib_long:0 "Charta für den Freihandel"
 GER_DNVP_Goerdeler_Interest_LibCon:0 "FL"
 GER_DNVP_Goerdeler_Interest_LibCon_long:0 "Freiheitsliga"
 GER_DNVP_Goerdeler_Interest_SocCon:0 "CFF"
 GER_DNVP_Goerdeler_Interest_SocCon_long:0 "Christliche Förderation für den Frieden"
 GER_DNVP_Goerdeler_Interest_Aut:0 "DKK"
 GER_DNVP_Goerdeler_Interest_Aut_long:0 "Deutsches Kulturelles Komitee"
 GER_DNVP_Goerdeler_Interest_AutDes:0 "GZsP"
 GER_DNVP_Goerdeler_Interest_AutDes_long:0 "C. F. Goerdelers Zentrum für soziale Politik"
 GER_DNVP_Goerdeler_Interest_FarAut:0 "AV"
 GER_DNVP_Goerdeler_Interest_FarAut_long:0 "Alldeutscher Verband"
 GER_DNVP_Goerdeler_Interest_Fas:0 "FVD"
 GER_DNVP_Goerdeler_Interest_Fas_long:0 "Front für die Vereinigung aller Deutschen"
 ger_internal.65.t:0 "The [This.GetInterestGroup]"
 ger_internal.65.d:0 "[This.GetInterestGroupDesc]"
 ger_internal.65.a:0 "We will follow this development."
 LeninistInterestGroup:0 "Public Works Associaion"
 LeninistInterestGroupDesc:0 "Although poltical parties are explicitly banned, public advocacy groups are not. The Public Works Association, or the Verein für öffentliche Arbeiten, is a public interest group that advocates for Government Centralization and increased public spending. They are ostensibly Marxist-Leninist, with several prominant KPD members - and members of the Reichstag - being members of the organization. However, because the organization does not partake in organization of candidates, it cannot be banned as a political party."
 RevSocInterestGroup:0 "German International Affairs Committee"
 RevSocInterestGroupDesc:0 "Some Marxists disallusioned with the DKhL and suspicious of the VfoA have formed their own public advocacy group, the Workers' International Affairs Committee. The group campaigns for recognition of the class struggle, both in Germany and abroad. Their pamphlets espouse Marxist propaganda against the Kaiser and Herr Goerdeler, specifically Herr Goerdeler's pro-industrial policies."
 DemSocInterestGroup:0 "German Campaign for a Higher Living Standard"
 DemSocInterestGroupDesc:0 "Der Deutsches Kampagne für ein höheres Lebensstandard, or the German Campaign for a Higher Living Standard, is a public interest group formed by former SPD members. They advocate for greater public spending in welfare. The group praises the ideas of housing projects and increased investment in medical services, as well as unemployment and elder pensions. They decry Herr Goerdeler for working upholding the privilages of the nobility and the monarchy."
 SocDemInterestGroup:0 "Movement for Equality and Democracy"
 SocDemInterestGroupDesc:0 "The Movement for Equality and Democracy has been formed as a public advocacy group by former members of the SPD after being kicked out of the DKhL for \"moderatism\". They call for a more proportional system of representation and the end of indirect voting, saying it benefits those in power and not those who actually want to implement social change. They also campaign for an equality statue that would guarantee rights for Jews, Poles, Czechs, and Sorbs."
 SocLibInterestGroup:0 "Citizen's Movement"
 SocLibInterestGroupDesc:0 "Unlike its Leftist counterparts, the Bürger Bewegnung is a democratic reformist group that does not seek to challenge the current economic system all too much. Although they call for regulations and higher taxes on the rich, they primarily focus on securing individual liberty and cooperation between different facets of German life. Led by economist Alexander Rüstow, they campaign for limited welfare, regulation, and a more effective Democratic Process."
 MarLibInterestGroup:0 "Free Trade Charter"
 MarLibInterestGroupDesc:0 "Formed by Classical Liberal Economists, the Charta für den Freihandel argues that the regime's protectionism causes inflation which cannot be sustained in the long term. Mostly appealing to middle business owners, this group chooses to eschew discourse on Democracy and focus entirely on economic matters."
 LibConInterestGroup:0 "Freedom League"
 LibConInterestGroupDesc:0 "The Freedom League was formed out of a desire to see mild democratic reforms and free trade economics at the same time, which distances it from the Pro-Tariff groups on its ideological left. Although candidates that the FL supports largely benefit from the unbalanced voting processes, they wish to see a more balanced system, largely to limit the ability of Leftist candidates to campaign in favor of democratic reforms."
 SocConInterestGroup:0 "Christian Federation for Freedom"
 SocConInterestGroupDesc:0 "The Christliche Förderation für den Frieden is a grouping of Devout Conservative Christians and Clergymen that advocate for Catholic-Lutheran cooperation, as well as social equality, and traditional values."
 AutInterestGroup:0 "German Cultural Committee"
 AutInterestGroupDesc:0 "The German Cultural Committee was formed by Conservative activists directly in response to the formation of the VfoA. The Committee is part advocacy group, part historical society, which holds events and parades celebrating German artistic and national accomplishments. Several conservative members of the Reichstag have joined this group, and sometimes give speeches at their events."
 FarAutInterestGroup:0 "Pan-German League"
 FarAutInterestGroupDesc:0 "A revival of the old Alldeutscher Verband, the Pan-German League is a nationalist organization dedicated to creating a Greater German State through any means necessary. This state would include Austria, old Imperial Territory, and the Sudetenland. However, this state would be incredibly discriminatory against Poles and Jews on the basis of racial \"theory\". They also call for the German colonization of the East, and the restoration of the Hugenberg Dictatorship."
 AutDesInterestGroup:0 "C. F. Goerdeler Centre for Social Policy"
 AutDesInterestGroup:0 "Colliqually known as the Goerdeler Centre, this organization is a self-proclaimed \"think tank\" on the British and American models, dedicated to solving the issues of the moral and traditional decay in Germany. The Centre preaches that Christian Devoutness, loyalty to the Kaiser and Goerdeler's Democracy, and a strong military will ensure Germany's position as a center of moral purity."
 FasInterestGroup:0 "Ethnic German Unification Front"
 FasInterestGroupDesc:0 "Made up of Stahlhelm Members and National Socialists, the Front is an obstensibly Hitlerist organization that argues for the salvation of the German people through aggressive Xenophobia and Expansionism. They argue in favor of workers' rights and the abolition of the monarchy, as well as limits on private property rights, and the establishment of a dictatorship on the lines of Führerprinzip."
 ger_internal.66.t:0 "Failed Personality Cult?"
 ger_internal.66.d:0 "Alfred Hugenberg may have not pursued an overbearing personality cult, but he was still known as a forceful personality. His - shall we say - energetic rudeness made him a memorable figure to the public, even to the sections that despised him. Herr Seldte, on the other hand, is a timid and unaggressive leader, which makes our efforts of establishing a personality cult somewhat contradictory. The people quietly make jokes juxtaposing the quiet and - in their view - shy Seldte with the image we are trying to push on them."
 ger_internal.66.a:0 "They don't take us seriously?"
 GER_DNVP_Inflation:0 "Inflation"
 GER_DNVP_Inflation2:0 "Inflation"
 GER_DNVP_Inflation_Controlled:0 "Controlled Inflation"
 GER_DNVP_Inflation_Runaway:0 "Runaway Inflation"
 ger_internal.67.t:0 "Inflation?"
 ger_internal.67.d:0 "Our protectionist policies have had an unfortunate - although not altogether unanticiapted - inflationary affect on the German Economy. As it costs more to get resources into the country, production costs have increased, making it necessary for companies to cut production. As supply has decreased, prices have increased to reduce demand. There has been much grumbling among the public, but their complaints are entirely understandable. However, once our industry is back on track and people are buying German, the inflation will plateau, and hopefully even reverse itself."
 ger_internal.67.a:0 "That's the economy!"
 ger_internal.67.b:0 "We cannot allow this."
 ger_internal.68.t:0 "Workers Laid Off"
 ger_internal.68.d:0 "In response to rising production costs, Industrial Firms have resorted to laying off workers to save money. Although this in theory will make prices cheaper, many people are now out of a job and cannot afford the products, even at lower prices. The public has started to complain that the government does nothing for them, and radical opinions have gained in popularity..."
 ger_internal.68.a:0 "It'll all blow over."
 ger_internal.69.t:0 "Inflation Plateaus Out"
 ger_internal.69.d:0 "Inflation has slowed to a point where we can safely consider there to be no risk of economic collapse. The public was somewhat happy about the announcement, but still remain somewhat disappointed by the status quo. It is apparent that they simply do not understand that these things take time."
 ger_internal.69.a:0 "Do not worry."
 ger_internal.70.t:0 "Inflation Speeds Up!"
 ger_internal.70.d:0 "We have a crisis! Instead of slowing down like we thought it would, inflation is speeding up. This runaway has caused panic among the people and businesses, and production has greatly slowed down. The government is also in chaos trying to figure out how to deal with the situation. It seems that we have two options: Try and weather the storm, or lower tariffs to correct for it."
 ger_internal.70.a:0 "Weather the Storm!"
 ger_internal.70.b:0 "Lower Tariffs!"
 ger_internal.71.t:0 "People Grow Weary of the Dictatorship"
 ger_internal.71.d:0 "The German People seem to be exhausted by the dictatorship. All the rules and bureaucracy have worn them down to a point where resistance becomes more of a desk job than a cause. But overall, the censorship and police activity have upset the Germans, and the fear of war does not help the situation either."
 ger_internal.71.a:0 "What are they going to do about it?"
 GER_DNVP_Corruption:0 "Widespread Corruption"
 ger_internal.72.t:0 "Corruption Spreads"
 ger_internal.72.d:0 "A bribe here, a special favor there, this is normal in [This.GetNameDef]. While we teach that a True German is Incorruptible, it is common knowledge that a large majority of German Bureaucrats - some even at the highest levels - engage in corruption. Bureaucrats, important and irrelevant, take bribes daily, which seems to be the only way that anything can get done. Policemen take bribes to ignore crimes, and on occasion extort bribes from innocent passersby. Foreign observers make comparisions with the levels of corruption in Fascist Italy and Bolshevik Russia, which humiliates us further."
 ger_internal.72.a:0 "This is not a state, but an extorsion ring!"
 ger_internal.73.t:0 "The Kaiser Assasinated!"
 ger_internal.73.d:0 "During an official balcony speech, Kaiser Wilhelm III was shot and killed! He was giving a speech about the Great German State and Pan-Germanism, when three shots rang out from the crowd. The second bullet missed the Kaiser and broke the window behind him, while the first hit his chest, and the third his abdomen. While the doctors immediately rushed to his side in the palace, they found that the bullet was lodged in such a way that removing it would cause the Kaiser to bleed out faster. Although they tried removing it, the Kaiser died within the hour. The two assassins were caught by Police as they tried to flee, and have been quickly found out as former members of the KPD.\n\nWilhelm III's first son, also named Wilhelm, had given up his royal status to marry a noblewoman of much lower rank. Therefore, the Late Kaiser's second son, Louis Ferdinand will ascend to the throne as Kaiser Ferdinand I, German Emperor. The office of the Crown has declared a week of mourning, and the Late Kaiser's Funeral will be at the end of the week."
 ger_internal.73.a:0 "The Marxists shall pay for this!"
 ger_internal.74.t:0 "Assassination Attempt on the Kaiser!"
 ger_internal.74.d:0 "During an official balcony speech on Pan-Germanism, Kaiser Wilhelm III was shot at and nearly killed. During a pivotal moment in the speech, three shots rang out from the crowd. The first bullet hit and broke the window behind him, the second hit his abdomen, and the third shot missed the palace entirely. As the two assassins tried to flee, both were caught by Police, and were quickly found out to be former members of the KPD. This has sparked an uproar among the conservatives of the nation, not to mention the political leadership.\n\nMeanwhile, the Kaiser was carried back into the palace where doctors were able to quickly remove the bullet and patch the Kaiser back up. They say he will be healthy again in a few months."
 ger_internal.74.a:0 "Long Live the Kaiser!"
 GER_DNVP_Crackdown_Communists:0 "Crackdown on Communists"
 GER_DNVP_Crackdown_Communists_desc:0 "Being responsible for the attack on the Palace, the Communists clearly haven't been dealt with enough. We must root them out!"
 ger_internal.75.t:0 "Hitler Complains to Herr Hugenberg"
 ger_internal.75.d:0 "Deputy Führer Adolf Hitler arrived to the Führer's office and began to complain about our aristocratic policies. Evidentely, he managed to get his drug habit under control for a few minutes. By this time, the NSDAP is trying to present itself as a workers' party, while the DNVP is supported by the middle and upper classes. Hitler himself has nothing against the middle and upper class workers and industrialists, but he detests our dealings with the Junkers and Nobility. He wants us to improve the lives of the working people of the nation, such as the capitalists, the factory workers, and the middle class proffesionals. Hitler demands the breakup of the nobles' estates and ending our toleration for their titles."
 ger_internal.75.a:0 "He's right, the nobles are a burden on us."
 ger_internal.75.b:0 "What nonsense!"
 ger_internal.76.t:0 "The Nobles Complain"
 ger_internal.76.d:0 "After withdrawing our support for them, representatives of the nobility have come to the Führer's office to complain. They say that as loyal Germans and Party Members, we have no right to cast them aside for that junkie Hitler. They demand a reversal of these policies at once."
 ger_internal.76.a:0 "What's done is done."
 ger_internal.76.b:0 "We can compromise on this issue."
 ger_internal.76.c:0 "Very well, we shall do so."
 ger_internal.77.t:0 "Nobles Withdraw Support"
 ger_internal.77.d:0 "Due to our shift to producerism, the nobles have officially withdrawn support for our Party. They claim that we have been taken in by Hitler, the National Socialists, and some Marxist influences. Interestingly, this has given us an edge with public relations, as the people reacted well to the new policies. In either case, representatives from different noble families have been coming to us and directly complaining to the Führer, with no end in sight."
 ger_internal.77.a:0 "Impress them with vague promises."
 ger_internal.77.b:0 "Be silent, but ultimately, do nothing."
 ger_internal.78.t:0 "Our Promises Work"
 ger_internal.78.d:0 "After offering promises of wealth and estates to the nobles, their complaints have mostly ceased. Although we will have to deal with them in the future, we should be able to think of something by then. In the meantime, we are now free to enact policy without these burdens on our shoulders."
 ger_internal.78.a:0 "The plan worked."
 ger_internal.79.t:0 "Industrialists Pledge Further Support"
 ger_internal.79.d:0 "Our producerist policies directly benefit anyone who is involved with production. As they own the manufacturing companies, our Industrialists are quite happy about these policies. Therefore, they have written to the Führer pledging even more support for the DNVP and the State."
 ger_internal.79.a:0 "Good to know."
 ger_internal.80.t:0 "The New Order"
 ger_internal.80.d:0 "With the influence of the nobility curtailed, a new order can arise in Germany. Capitalism and Producerism together will make us into the greatest power in all of history! With the DNVP representing the Middle, Upper, and Peasant classes and the NSDAP representing the workers, we can truly achieve Volksgemeinschaft."
 ger_internal.80.a:0 "We have won!"
 ger_internal.81.t:0 "Hitler Mocks the Führer"
 ger_internal.81.d:0 "A public reception was held today in order of an exemplary class of cadets. People were eating well, drinking fine champagne, and generally having a good time. However, perhaps they were having too much fun, as it was reported that Deputy Führer Adolf Hitler called Herr Hugenberg a \"[This.GetInsult]\" during conversation with the cadets' training officers. Being a staunch supporter of the Führer, this officer told Herr Hugenberg at once! It is clear that Hitler has become embittered by our rejection of his producerism. Herr Hugenberg confronted Hitler at once, and began discussing a few guests - who happen to be aristocrats and DNVP Members, including members of the von Bülow family - to guage Hitler's reaction. Hitler ended up calling these guests the \"poisoners, intriguants, burdens on society\", as well as adding in some of his usual Anti-Semitism. When the Führer attempted to address Hitler's first argument, the Deputy Führer replied \"and you, you [This.GetInsult], enable this weakness". Herr Hugenberg was flabbergasted for a second, and composed his response..."
 ger_internal.81.a:0 "Silence, you ungrateful addict!"
 ger_internal.81.b:0 "I cannot agree with this position."
 LiberalCompromiserInsult:0 "Liberal Compromiser"
 DefenderInsult:0 "Monarchist Fraud"
 ger_internal.82.t:0 "Public Row"
 ger_internal.82.d:0 "Our fun party has turned into a verbal deathmatch between the Führer and the Deputy Führer. The relationship - which was already wearing thin - has been now entirely eroded by ideological differences. The two discussed Hugenberg's weight and Hitler's drug habit, Hugenberg's father and Hitler's mother, and other things that are only alledged by guests and foreign reporters. Although attempts to hide the scandal have been made, these have been met with low effort and little success. It is clear that DNVP/NSDAP cooperation cannot continue."
 ger_internal.82.a:0 "Has the era come to an end?"
 ger_internal.83.t:0 "Hitler Slanders Hugenberg Further"
 ger_internal.83.d:0 "As it turns out, Deputy Führer is still bitter, as he mockingly called the Führer \"that Soup-Sucking Hippopotomous\" to an officer. Of course, we found out, and the Führer and Deputy Führer are currently discussing the situation with the rest of the cabinet. However, it is clear that the situation cannot continue like this. Either the NSDAP has to change, or leave this coalition..."
 ger_internal.83.a:0 "The National Socialists must be removed from the Government."
 ger_internal.83.b:0 "Only Hitler has to go!"
 ger_internal.84.t:0 "The End of the Völkisch Coalition"
 ger_internal.84.d:0 "In light of recent events, The Führer has decided to end the Völkisch coalition. Despite Former Deputy Führer Adolf Hitler's protests, Members of the NSDAP will no longer be involved in government unless they join the DNVP, and many higher level National Socialists will be arrested."
 ger_internal.84.a:0 "This was a bad idea in the first place."
 ger_internal.85.t:0 "Hitler Resigns and is Arrested"
 ger_internal.85.d:0 "After much deliberation, the NSDAP has decided to remove Hitler as their leader (in part spurred by his arrest). Afer even more deliberation, it was decided that the leader of the Conservative Faction of the DNVP, Hermann Göring, will lead the NSDAP. As he is conservative enough for our tastes, the Völkisch Coalition can continue existing."
 ger_internal.85.a:0 "A compromise that works for everyone!"
 ger_internal.86.t:0 "The NSDAP Collapses"
 ger_internal.86.d:0 "Clearly, the two things that kept the NSDAP together were Hitler's Drug Addled Rages and being in government. Without both of thsee, the party has fallen apart. Factions loyal to Goebbels, Himmler, Rosenberg, and others have broken off and formed their own groups in opposition to our regime. Of course, they have promptly been arrested."
 ger_internal.86.a:0 "This does benefit the DNVP."
 ###External
 ger_external.159.t:0 "German Agitation"
 ger_external.159.d:0 "Recent protests and stirrings by our German population have begun to worry our government. The people have increasingly begun to call for a return of territories to Germany; a few even calling for the annexation of Poland into Germany." By analyzing recent border activity, it becomes clear that [From.GetNameDef] is sending agitators to rile up our population. It is almost as though they are testing the waters..."
 ger_external.159.a:0 "Poland shall fight to the last!"
 game_over_tt:0 "§RWe will be annexed into Poland.§!\n"
 DZG_annex_into_Germany:0 "§RWe will be annexed into Germany.§!\n"
 GER_Danzig_Direct_Rule:0 "§YWe will establish direct rule in Danzig.§!\n"
 ger_external.160.t:0 "Communiqué from Germany"
 ger_external.160.d:0 "Our government has received a secret set of instructions from Berlin, detailing a plan to return Danzig to German Rule. Under the plan, the Germans would prompt us to declare our return to Germany while German troops cross the border. Poland is expected to protest, and this move will likely cause a war. The only thing we need to do for the moment is send a message of acknowledgement and agreement to Berlin."
 ger_external.160.a:0 "Anything to return to Germany!"
 ger_external.160.b:0 "The plan is too risky."
 ger_external.161.t:0 "Danzig Agrees to the Plan"
 ger_external.161.d:0 "The Danziger Government has agreed to go forwards with our plan to retake the city, and thus all of German Poland. Therefore, all that remains is our command..."
 ger_external.161.a:0 "All according to plan."
 ger_external.162.t:0 "Danzig Refuses the Plan"
 ger_external.162.d:0 "The Danziger Government has refused to go forwards with our plan to retake the city. They claim that is too risky, and that they do not wish to cause a destructive war."
 ger_external.162.a:0 "That was the point of the plan."
 ger_external.163.t:0 "Conspiracy in Danzig!"
 ger_external.163.d:0 "Polish Intelligence has intercepted a series of communications between Danzig and Berlin detailing a conspiracy to start a war with Poland. Germany intends to order Danzig to declare its return to Germany, which would provide Germany with an excuse to bring troops into the city. It is clear that they intend to start a war. Several in our government and military command think the best solution is to occupy Danzig immediately, however a few caution that it might invite German aggression. How shall we respond?"
 ger_external.163.a:0 "Danzig shall be occupied!"
 ger_external.163.b:0 "Let us wait and see..."
 ger_external.164.t:0 "Poland Occupies the City"
 ger_external.164.d:0 "It is obvious that Poland has learned about our conspiracy with Berlin, as they have just sent a contingent of soldiers to occupy the city. The German government has been arrested and the Police Force has been disbanded. Additionally, National Socialist militias have been diarmed and arrested. It is clear that German Rule over Danzig is at an end."
 ger_external.164.a:0 "But how did they find out?"
 ger_external.165.t:0 "Ethnic German Protests"
 ger_external.165.d:0 "After our occupation of Danzig, ethnic Germans in the West have taken to the streets to protest what they see as oppression and ethnic discrimination, despite supporting such policies enacted towards Poles. It is clear that Germany intends to destroy our nation from the inside, and are using agitators to rile up the populace."
 ger_external.165.a:0 "This will cool down eventually."
 ger_external.166.t:0 "Poland Occupies Danzig!"
 ger_external.166.d:0 "The Poles clearly intercepted our communications with Danzig, or else they would not have so brazenly occupied the city. In responce, our agitators have triggered a large round of protests, but it is up to us how to continue. We have the opportunity to take advantage of Polish instability to attempt to seize all of their German-inhabited lands. However, some worry that we are not ready for such a war. How shall we proceed?"
 ger_external.166.a:0 "To War!"
 ger_external.166.b:0 "We must bide our time."
 ger_external.167.t:0 "Germany Initiates the Plan"
 ger_external.167.d:0 "Berlin has sent us an urgent message ordering us to implement the plan, as agreed upon earlier. We will immediately declare our intention to rejoin Germany and open the border to German troops."
 ger_external.167.a:0 "Here goes nothing."
 ger_external.168.t:0 "Germany Occupies Danzig"
 ger_external.168.d:0 "The Danzig Government has just announced that due to complaints against our control, the Free City is rejoining Germany as a province. However, Germany also demands that we allow them to occupy former Imperial lands to unify the German People. This demand means that we would lose a lot of industry and population."
 ger_external.168.a:0 "This is unacceptable!"
 ger_external.169.t:0 "Poland Refuses to Turn Over Territory"
 ger_external.169.d:0 "Despite our seizure of Danzig, the Poles have refused to turn over any territory to us. Of course, this was entirely expected, and we are now clear to start a war with the Poles!"
 ger_external.169.a:0 "To War!"
 ger_external.169.b:0 "We must bide our time."
 ger_external.170.t:0 "Germany Proposes Customs Union"
 ger_external.170.d:0 "[From.GetNameDef] has proposed that we enter into a customs union with them. Under the agreement, tariffs between both countries would be erased, enabling our companies to get much needed resources, but allowing German firms to export to Austria en masse. In exchange for joining the union, we would have to give up defensive agreements with all other nations, but we would get a defensive pact with Germany. Should we agree to this proposal?"
 ger_external.170.a:0 "We need German resources."
 ger_external.170.b:0 "We need to protect our businesses."
 ger_external.171.t:0 "Austria Joins our Customs Union"
 ger_external.171.d:0 "Today, we celebrate the creation of the German National Economic Zone, where Germany and Austria have totally free trade between each other. Now, German businesses have a weaker country to export to without reprocussions. We can now use this customs union to pressure the Austrians into acceding to some other demands..."
 ger_external.171.a:0 "All according to plan!"
 ger_external.172.t:0 "Austria Refuses Customs Agreement"
 ger_external.172.d:0 "The Austrian Government has decided that they do not wish to enter into a customs agreement with us. They cite a weak Austrian economy and commitments to other nations. They wish our economy the best of luck, but they do not wish to become part of it."
 ger_external.172.a:0 "Damn!"
 GER_austro_agreement:0 "§GAustria has joined our Customs Union.§!"
 GER_no_austro_agreement:0 "§RAustria has refused to join our Customs Union.§!"
 ger_external.173.t:0 "Austria Cancels Agreements with Us"
 ger_external.173.d:0 "Austria and Germany have just announced that they are creating a customs union together, called the German National Economic Zone. However, part of the provisions state that Austria would not be allowed to maintain alliances and other military pacts with other nations. Therefore, Austria has been cemented as part of the German Sphere of Influence."
 ger_external.173.a:0 "Shame."
 ger_external.174.t:0 "Germany Proposes Anschluß Plan"
 ger_external.174.d:0 "The German Government has approached our party - not our government - and proposed a coordinated effort to achieve the annexation of Austria into Germany. Under this plan, our party's efforts would be in part directed and funded by the German Government, as we apply pressure on the rest of the Nationalrat. upon annexation, the GDVP would be integrated into the DNVP, which is largely ideologicall compatible. Should we agree to this plan?"
 ger_external.174.a:0 "Großdeutschland shall rise!"
 ger_external.174.b:0 "We would prefer a different partner."
 ger_external.175.t:0 "The [This.AustriaPartyCoopAcro] Agrees to Cooperate"
 ger_external.175.d:0 "The [This.AustriaPartyCoop] has decided to concentrate a lot of its effort on achieveing the Anschluß in coordination with our government. If we can help improve their popularity and pressure the Austrian government enough, we can demand the annexation!"
 ger_external.175.a:0 "Schön!"
 DNVP_Work_With_Nazis:0 "Nationalsozialistische Deutsche Arbeiterpartei"
 DNVP_Work_With_NazisAcro:0 "NSDAP"
 DNVP_Work_With_GDVP:0 "Großdeutsche Volkspartei"
 DNVP_Work_With_GDVPAcro:0 "GDVP"
 ger_external.176.t:0 "The [This.AustriaPartyCoopAcro] Refuses to Cooperate"
 ger_external.176.d:0 "Our overtures to the [This.AustriaPartyCoop] have been refused as they cite ideological incompatibility and economic interests. While this comes as a shock to many, it is clear that other options have to be considered."
 ger_external.176.a:0 "We hope the military is ready for some exercize..."
 ger_external.177.t:0 "Germany Publishes Pan-German Propaganda"
 ger_external.177.d:0 "We knew the [GER.AustriaPartyCoopAcro] was begining to agitate for a unification with [GER.GetNameDef], but the German government has just spent time and money publishing Pro-German propaganda in the form of pamphlets and radio broadcasts. This is sure to have an effect on our population."
 ger_external.177.a:0 "Damn!"
 AUS_knows_about_interference:0 "This must be Germany's doing."
 AUS_does_not_know_about_interference:0 "Odd..."
 ger_external.178.t:0 "[GER.AustriaPartyCoopAcro] Increases Activity"
 ger_external.178.d:0 "The [GER.AustriaPartyCoop] have been far more active in regards to party rallies and propaganda in recent weeks. This must be because they have seen a spike in funding."
 ger_external.178.a:0 "[This.AustriaPartyIncreaseActivity]"
 ger_external.179.t:0 "German Lobbyists"
 ger_external.179.d:0 "Several German politicians have visited our offices lately to push for unification. They have been a non-stop pest, using gifts, rhetoric, and other vile means to sway our politicians. Although they are universally hated in Austria, they have managed to pressure our government somewhat."
 ger_external.180.t:0 "Demands from Germany"
 ger_external.180.d:0 "The Germans have demanded that we surrender control of our territory to them immediately, on threat of war. Should we acceed to their demands, Austria will cease to be an independent state, and will be made into a constituent part of [From.GetNameDef]. Should we refuse, we will likely be invaded by Germany, and many Austrians could potentially defect. How shall we respond?"
 ger_external.180.a:0 "We have no choice but to accept."
 ger_external.180.b:0 "For God and Austria!"
 ger_external.181.t:0 "Anschluß Achieved!"
 ger_external.181.d:0 "Austria has surrendered, and has allowed our troops to occupy the former country. The Austrians will be given full German citizenship, and Austrian Marks will be accepted as legal tender for the time being. To prevent a resurgence of Austrian Nationalism, Austria will not be make into a constituent kingdom, but three Duchies: Tyrol, Austria, and Styria."
 ger_external.181.a:0 "The dream has come true!"
 anschluss_militias:0 "§GPro-German Militias will join us.§!\n"
 ger_external.182.t:0 "Austria Refuses the Anschluß"
 ger_external.182.d:0 "To the detriment of their population, the Austrian Government has decided to resist our efforts to liberate the Austrians from the confines of the Versailles Treaty. It is clear that the military option was the best after all."
 ger_external.182.a:0 "Austria shall be free under Germany!"
 ger_external.183.t:0 "Austria Repudiates the Anschluß"
 ger_external.183.d:0 "We have failed to put sufficient pressure on the Austrian Government, so we have been forced to end this endevour. The Austrians were clearly more capable of managing this affair than we were."
 GER_ITA_summit_start:0 "§GThe Summit will begin in §!§YOne Month§!§G, unless §!§RWar is declared§!.\n"
 ger_external.184.t:0 "Germany Proposes a Summit"
 ger_external.184.d:0 "[From.GetAdjective] Diplomats have passed along a message from [From.GetGerKanzler], the Chancellor of Germany, in which they formally request a diplomatic summit to discuss cooperation and the treatment of the Tyrolean Germans. Although a few of our vetaran diplomats are sceptical, several of our staff feel that we might be able to secure economic guarantees from Germany, and therefore bolster our own position. How shall we respond."
 ger_external.184.a:0 "We welcome this initiative."
 ger_external.184.b:0 "We don't need Germany!"
 GER_Failed_ITA_Summit:0 "§RFailed Summit with Italy§!"
 GER_successful_summit_ITA:0 "§GSuccessful Summit with Italy§!"
 ger_external.185.t:0 "Italy Refuses to Hold Summit"
 ger_external.185.d:0 "The Italian Government has refused our request for a summit. This severely limits our possible interactions with Italy. It seems we will have to take other measures to secure the interests of the Volksdeutsche."
 ger_external.185.a:0 "We can ally with other nations..."
 ger_external.186.t:0 "Italy Agrees to Hold Summit"
 ger_external.186.d:0 "The Italian Foreign Ministry has agreed to hold a summit with us, as they see the potential for economic and military cooperation. They are interested to explore different avenues of our mutual interests."
 ger_external.186.a:0 "Excellent!"
 ger_external.187.t:0 "The Summit Begins!"
 ger_external.187.d:0 "After a month of preparations, we can finally sit down with our [This.GetGerOrIta] counterparts and discuss policy. While we have a variety of mutual interests, it is expected that there will be a singular discussion priority. [This.GerOrItaRequest]"
 ger_external.187.a:0 "We will let Germany go first."
 GER_ITA_first_request:0 "§YGermany§! shall make their §Gfirst request§!.\n"
 ger_external.187.b:0 "We would like to discuss the Volksdeutsche."
 ger_external.187.c:0 "We would like to discuss a military alliance."
 ger_request:0 "It has been previously agreed that we would set the topics, so we must decide whether we would like to discuss the Tyrolean Germans or the possibility of a Military Alliance with Italy."
 italy_request:0 "It has been previously agreed that Germany would begin discussion, so we will let them make the first move."
 ger_external.188.t:0 "The Tyrolean German Question"
 ger_external.188.d:0 "The German delegation is concerned that there are nearly two hundred thousand Germans living outside of Germany's border. They wish to discuss ways to correct this situation and achieve a fair decision that would benefit the German POpulation in South Tyrol. We feel that we can either offer autonomy or the repatration of the South Tyroleans, in exchange for economic assistance."
 ger_external.188.a:0 "We can offer autonomy to the Tyroleans."
 ger_external.188.b:0 "We can offer to repatriate the Tyrolean Germans to Germany."
 ger_external.189.t:0 "The Italian Offer"
 ger_external.189.d:0 "The Italians have responded that they are willing to [This.ITAOffer] in exchange for economic assistance. While some of the delegation feel that this is acceptable, a few expansionists wish for us to demand the territory, seeing as the Germans have no reason to give it up. How shall we respond?"
 ger_external.189.a:0 "We want territory!"
 ger_external.189.b:0 "This deal works for us."
 ger_repatriation:0 "repatriate the Tyrolean Germans to Germany"
 ger_autonomy:0 "grant the Tyrolean Germans autonomy"
 ger_external.190.t:0 "Germany Accepts our Offer"
 ger_external.190.d:0 "The German Delegation has accepted our offer to [GER.ITAOffer] for economic assistance. The Germans will send us heavy machinery immediately. We look forwards to further cooperation in the future!"
 ger_external.190.a:0 "Excellent!"
 ger_external.191.t:0 "Germany Demands Southern Tyrol"
 ger_external.191.d:0 "Instead of accepting our very generous offer, the Germans have decided to demand that we transfer Southern Tyrol to them! This caused an uproar among the Italian delegation, and the Germans have stormed out of the room!"
 ger_external.191.a:0 "So much for a \"Fair Deal\"."
 ger_external.192.t:0 "Successful Summit"
 ger_external.192.d:0 "The Italo-German Summit is an unprecedented success! The German and Italian Delegations have managed to resolve their differences well, and have opened up an opportunity for future cooperation!"
 ger_external.192.a:0 "Excellent!"
 ger_external.193.t:0 "Germany Requests Alliance"
 ger_external.193.d:0 "The German Delegation has asked us if we would like to enter into a military alliance with them. Under the terms of the agreement, both nations would be able to call the other into war. In exchange, we would get economic assistance. Should we accept this offer?"
 ger_external.193.a:0 "We need this alliance!"
 ger_external.193.b:0 "We do not need this alliance."
 ger_external.194.t:0 "Italy asks for Economic Assistance"
 ger_external.194.d:0 "The Italian delegation has expressed interest in entering into a mutual alliance, but they cannot do so until we guarantee that we will send them heavy machinery. If we cannot guarantee this, then we will have failed. What shall we say?"
 ger_external.194.a:0 "The equipment can come immediately."
 ger_external.194.b:0 "Germany gives equipment to no-one!"
 ger_external.195.t:0 "Failed Summit"
 ger_external.195.d:0 "The German and Italian summits have failed to come to a mutual understanding and have left the table disgusted of the other. It is clear that Italo-German cooperation is a dead dream."
 ger_external.195.a:0 "We shall have to find other avenues of cooperation."
 ger_external.196.t:0 "German Industrial Equipment Arrives!
 ger_external.196.d:0 "As promised, the Germans have sent us industrial equipment and have thus kept their end of the bargain. This summit is a success!"
 ger_external.196.a:0 "Italy and Germany will always fight together!"
 ger_external.197.t:0 "The Treaty of Hvar"
 ger_external.197.d:0 "Our government has recently been meeting with German diplomats to work out terms for a mutual military alliance. The final proposal is that we would join Germany's alliance, where any member can call any other member into their wars. We have also secured a clause that ensures that Germany would not protest if we were to annex lands from Italy, Greece, or Albania in exchange for special treatment for Ethnic Germans. This treaty would be a great boon to our Anti-Italian defensives, and enables us to take back our rightful lands. Should we accept this treaty?"
 ger_external.197.a:0 "Germany shall have our help!"
 ger_external.197.b:0 "Our Interests lie elsewhere."
 ger_external.198.t:0 "Yugoslavia Signs the Treaty of Hvar"
 ger_external.198.d:0 "Over a period of a fortnight, we have worked out a treaty with Yugoslavia. Under the terms of the treaty, Yugoslavia would join our alliance network, meaning that both parties can call the other into their wars. We have also given Yugoslavia a blank cheque for annexations in the Balkans (and in Italy), while at the same time securing special treatment for Yugoslav Citizens who happen to be Ethnic Germans, such as the right to travel to and from Germany without a visa."
 ger_external.198.a:0 "Italy shall be destroyed!"
 GER_YUG_refuse_hvar:0 "§RYugoslavia has refused the Treaty of Hvar.§!"
 ger_external.199.t:0 "Yugoslavia Refuses the Treaty of Hvar"
 ger_external.199.d:0 "Citing National Security and Economic Concerns, [YUG.GetNameDef] has refused to sign the Treaty of Hvar. Under the terms of the agreement, Germany and Yugoslavia would become allies. However, it is clear that Yugoslavia wishes to align itself with other nations, or they would not have refused us."
 ger_external.199.a:0 "Shame."
 ger_external.200.t:0 "The Treaty of Eger"
 ger_external.200.d:0 "Our government has recently been meeting with German diplmoats to work out terms for a mutual military alliance. The final proposal is that we would join Germany's alliance network, where we would be obligated to come to the wars of other member nations if they ask, as we would be able to call other nations into our wars. However, in exchange for some special privalages for German Hungarians, we will be allowed to annex parts of Slovakia, Romania, and Yugoslavia with Germany's approval. Should we sign this treaty?"
 ger_external.200.a:0 "This alliance will be beneficial."
 ger_external.200.b:0 "We do not need the German Yoke."
 ger_external.201.t:0 "Hungary Signs the Treaty of Eger"
 ger_external.201.d:0 "The Hungarians have decided to join our alliance, and have thus signed the Treaty of Eger. Under the terms of the treaty, Hungary will become part of our alliance network and give some cultural autonomies to Ethnic Germans in Hungary. However, we would be obligated to come to Hungary's assistance during wars and allow their annexations of claimed territories."
 ger_external.201.a:0 "Excellent!"
 ger_external.202.t:0 "Hungary refuses the Treaty of Eger"
 ger_external.202.d:0 "Hungary has refused to join our alliance based on what they call \"National Security Concerns\". They clearly see our influence is being dangerous, and despite our best efforts, we cannot convince them that we are their friends."
 ger_external.202.a:0 "Shame."
 ger_external.203.t:0 "Germany offers us Slovenian Land"
 ger_external.203.d:0 "The German government has approached us with an offer to divide Slovenia. The Germans want the North, as it has a German Minority, but if we wish, the Germans will also pressure the Yugoslavs into giving us [This.GetClaimYUG]. Should we accept this deal?"
 ger_external.203.a:0 "More territory is always good for us."
 ger_external.203.b:0 "No, it is too dangerous."
 Ljubljana:0 "Ljubljana"
 Prekmurje:0 "Prekmurje"
 ger_external.204.t:0 "[From.GetNameDef] Accepts our Proposal"
 ger_external.204.d:0 "The [From.GetAdjective] Government has met our secret message with approval. If the Yugoslavs fold, we will pressure them into turning over [From.GetClaimYUG] to the [From.GetAjective]s' hands.
 ger_external.204.a:0 "A good proposition for all!"
 ger_external.205.t:0 "[From.GetNameDef] Refuses our proposal"
 ger_external.205.d:0 "The [From.GetAdjective] Government has met our secret message with refusal, citing concerns over their military preparations. If the Yugoslavs fold, we will not try to pressure them into turning over [From.GetClaimYUG] to the [From.GetAjective]s' hands.
 ger_external.205.a:0 "This helps nobody."
 ger_external.206.t:0 "Germany Demands Slovenia"
 ger_external.206.d:0 "[GER.GetNameDef] has demanded Northern Slovenia on the grounds that there is a German Minority in the region. According to them, we oppress and destroy the German-ness of the \"Volksdeutsche\" in the region, and they seek to liberate these people. [This.ExpandedSLV]If we do not accept this ultimatum, we may face war. What shall we do?"
 ger_external.206.a:0 "We do not want a war."
 ger_external.206.b:0 "Yugoslavia cannot be destroyed!"
 Expand_SLV:0 "Additionally, they demand that we turn over [This.ExpandSLV2]"
 Expand_SLV_Both:0 "Ljubljana to Italy and Prekmurje to Hungary, due to their respective minorities."
 Expand_SLV_ITA:0 "Ljubljana to Italy, due to the Italian Minority there."
 Expand_SLV_HUN:0 "Prekmurje to Hungary, due to the Hungarian Minority there."
 ger_external.207.t:0 "Yugoslavia Folds to our Demands"
 ger_external.207.d:0 "Yugoslavia has decided to avoid a war by turning over all the territory we have demanded. We have therefore liberated the Slovenian Volksdeutsche from their former oppressors!"
 ger_external.207.a:0 "A great accomplishment!"
 ger_external.208.t:0 "Yugoslavia Resists!"
 ger_external.208.d:0 "The Yugoslav government has told us that they will not be turning over any territory to any foreign power, and that if we are to declare war, then they invite us to do so."
 ger_external.208.a:0 "Their insolence must be punished."
 ger_external.208.b:0 "We have more important matters to deal with."
 ger_external.209.t:0 "Yugoslavia Folds"
 ger_external.209.d:0 "Yugoslavia has surrendered to German demands, and as part of our deal, we have recieved [This.GetClaimYUG]. This is a joyious day for us, as we have expanded our territory!"
 ger_external.209.a:0 "[This.GetClaimYUG] shall never be taken from us!"
 Blank:0 ""
 ###flavor
 ger_flavor.16.t:0 "Kampf des Kaisers"
 ger_flavor.16.d:0 "A new play premired today in the Berlin Wintergarten Threatre, called \"Kampf des Kaisers\". The Struggle of the Kaiser depicts Crown Prince - at the time - Wilhelm's efforts to restore the Monarchy in Germany. His conflicts with Ex-Kaiser Wilhelm II (confirming that most Germans thought of him as a traitor), and mistreatment by the Republican Government endear him to the audience, who are satisfied to see him finally rise to the throne at the end.\n\nHowever, the play is just as much about the DNVP as it is about the Kaiser, with Herr Hugenberg featuring prominently as the Kaiser's main ally. Even Herr Goerdeler, Hugenberg's rival in the party, is depicted positively. He voices caution but ultimately stands by Hugenberg and the Kaiser. The play has proven to be a hit, with adults praising it every waking hour, and with children reenacting the battle scene by playing \"Whites vs Golds\" (referencing the colors of the Imperial and Republican flags). The Kaiser himself was satisfied with it, and it is set to be performed across the country."
 ger_flavor.16.a:0 "As long as the Sun rises each morning, it shall rise over the German Empire!"
 ger_flavor.17.t:0 "Der Verräter"
 ger_flavor.17.d:0 "Der Verräter (The Traitor) is a new film that was recently screened at the Berlin Wintergarten Theatre. The film follows a Communist (left unnamed, only known as \"Proletarisch Genosse\") throughout the Great War and his efforts to protest and act against the war, especially during the opening years when Germany was winning. The film also satirizes Communist Organization and Ideology, with the Proletarian Comrade sitting through a four hour long speech and a debate on whether or not car theft is Marxist. The film comes to a climax when the Comrade leads an attack against an army supply cache, killing an officer and spitting on his body. After a shootout, the Communists are arrested, tried, and sentenced to death. The film has proven to be a hit, and Director Leni Rhiefenstahl has been praised both domestically and internationally for her innovative filming techniques."
 ger_flavor.17.a:0 "\"There are two kinds of people - Germans and Workers\"."
 ger_flavor.18.t:0 "Vorbeck"
 ger_flavor.18.d:0 "A new film premired today in German Cinemas. \"Vorbeck\" tells the story of Paul von Lettow-Vorbeck's campaigns in German East Africa. Over the course of 117 minutes, all four years of the war are covered, and the film ends with von Lettow-Vorbeck's return to Germany and the parade held in his honor. The ending of the film makes note - through the character of Franz Seldte - that von Lettow-Vorbeck is proof of Germany's ability to fight, which is taken as proof of the Stab-in-the-Back.\n\nDespite being a massive success, the General himself hated the film. He degrades the actors as \"Ideological Simpletons\" and the depiction of the Askari soldiers as \"Racist, Backwards, and written by Swines\". However, he complements the depiction of the Battle of Tanga, except that it shows the British as cowards and fools."
 ger_flavor.18.a:0 "A Hero and a Party Member!"
 ###Test
 ger_test.2.t:0 "African Colonies Test"
 #Decisions
 GER_DNVP_Colonial_Management_cat:0 "Reichskolonialamt"
 GER_DNVP_Colonial_Management_cat_desc:0 "The Imperial Colonial Office has just been formed to manage our newly taken African Possesions. We will need to transfer authority from the military occupation to the civilian bureaucracy, and consolidate our power."
 German_West_Africa_state_tt:0 "§YState will be designated as Togolandn Territory.§!\n"
 GER_DNVP_Togo_Start:0 "Consolidate Togoland"
 GER_DNVP_Togo_Start_desc:0 "We can begin to move our territories in Togoland from a military occupation to a civilian bureaucracy. The Capital of Togoland will be in Lomé and governed by Walter von Keudell, an ardent forester."
 GER_DNVP_Kamerun_Start:0 "Consolidate Kamerun"
 GER_DNVP_Kamerun_Start_desc:0 "We can begin to move our territories in Kamerun from a military occupation to a civilian bureaucracy. The Capital of Kamerun will be in Jaunde and will be governed by Hans Joachim von Rohr, a loyal member of the Agrarian League and our Reichstag."
 GER_DNVP_Tanganyika_Start:0 "Consolidate Tanganyika"
 GER_DNVP_Tanganyika_Start_desc:0 "We can begin to move our territories in East Africa from a military occupation to a civilian bureaucracy. The Capital of Tanganyika will be in Dar es Salaam, and will be governed by the interim Reichspräsident Erwin Bumke."
 GER_DNVP_Namibia_Start:0 "Consolidate Namibia"
 GER_DNVP_Namibia_Start_desc:0 "We can begin to move our territories in Southwest Africa from a military occupation to a civilian bureaucracy. The Capital of Namibia will be in Windhuk, and will be governed by the veteran officer Wilhelm Henning."
 GER_Colonial_Occupation:0 "Colonial Consolidation"
 GER_Colonial_Occupation2:0 "Colonial Consolidation"
 GER_Colonial_Occupation3:0 "Colonial Consolidation"
 ##Anschluss
 GER_DNVP_Anschluss_cat:0 "Anschluß"
 GER_DNVP_Anschluss_cat_desc:0 "If we are to annex Austria into the Reich, we will need to cooperate with the [This.AustriaPartyCoopAcro] to properly pressure the government into acceding to our demands. We must direct and fund the [This.AustriaPartyCoopAcro]'s activities in order to present a united front.\n\n[This.AustriaPartyCoopAcro] Popularity: §Y[This.AustriaPartyCoopGetPop]§!\nPressure on the Austrian Government: [?This.AUS_gov_pressure]"
 Anschluss_Pan_German_Propaganda:0 "Spread Pan-German Propaganda"
 Anschluss_Pan_German_Propaganda_desc:0 "Using our media connections to spread Pan-German leaflets and radio programs throught Austria is a good supplement to the [This.AustriaPartyCoopAcro]'s activities."
 Anschluss_Fund_Party:0 "Fund the [This.AustriaPartyCoopAcro]"
 Anschluss_Fund_Party_desc:0 "Sending funds to the [This.AustriaPartyCoop] is necessary to ensure that they can keep up their activities."
 Anschluss_Lobbyists:0 "Send Lobbyists to Austria"
 Anschluss_Lobbyists_desc:0 "Sending politicians and hired lobbyists to work for our interests is a good way to put pressure on Austria, but lobbyists are generally unpopular."
 Anschluss_Send_Arms:0 "Send Arms to the NSDAP"
 Anschluss_Send_Arms_desc:0 "Giving weapons to the National Socialists is sure not to backfire. It will help us put additional pressure on the Austrian Government."
 Anschluss_Send_Demands:0 "Demand the Anschluß"
 Anschluss_Send_Demands:0 "We have put sufficient pressure on the Austrian government to get them to listen to our demands. We shall now demand that they sign over their country to us!"
 DNVP_Work_With_NazisPop:0 "[?AUS.party_popularity@fascism|%0]"
 DNVP_Work_With_GDVPPop:0 "[?AUS.party_popularity@market_liberalism|%0]"
 GER_DNVP_Pressure_Add_7:0 "Pressure on Austria will increase by §G7§!.\n"
 GER_DNVP_Pressure_Add_5:0 "Pressure on Austria will increase by §G5§!.\n"
 GER_DNVP_Pressure_Add_3:0 "Pressure on Austria will increase by §G3§!.\n"
 GER_DNVP_Pressure_Add_2:0 "Pressure on Austria will increase by §G2§!.\n"
 GER_DNVP_Pressure_Subt_3:0 "Pressure on Austria will decrease by §G3§!.\n"
 GER_DNVP_Pressure_Subt_4:0 "Pressure on Austria will decrease by §G4§!.\n"
 GER_DNVP_Pressure_Subt_5:0 "Pressure on Austria will decrease by §G5§!.\n"
 AUS_gov_pressure_90:0 "At least §Y90§! Pressure on the Austrian Government.\n"
 AUS_gov_pressure_70:0 "At least §Y70§! Pressure on the Austrian Government.\n"
 AUS_DNVP_Anschluss_cat:0 "Counter-Anschluß"
 AUS_DNVP_Anschluss_cat_desc:0 "It has become clear that Germany wishes to leverage their economic power to achieve our annexation. They intend to do this by using the [GER.AustriaPartyCoop] to spread propaganda and put pressure on our government, so if we wish to preserve our independence, we must return the favor...\n\n[GER.AustriaPartyCoopAcro] Popularity: §Y[GER.AustriaPartyCoopGetPop]§!\nPressure on the Austrian Government: [?GER.AUS_gov_pressure]"
 Counter_Anschluss_National_Identity:0 "Emphasize National Identity"
 Counter_Anschluss_National_Identity_desc:0 "Convincing people to reject the idea of Austria as part of Germany is key to protecting our independence."
 Counter_Anschluss_Catholic_Identity:0 "Emphasize [This.GetIdentity] Identity"
 Counter_Anschluss_Catholic_Identity_desc:0 "[This.GetIdentityDesc]"
 AUS_catholic_identity:0 "Catholic"
 AUS_catholic_identitydesc:0 "Catholic Austrians would suffer under a Protestant Germany! None may forget this!"
 AUS_social_identitydesc:0 "The Austrian Community would suffer under a German yoke! None may be allowed to forget this!"
 Counter_Anschluss_Raid_Nazis:0 "Raid National Socialist Cells"
 Counter_Anschluss_Raid_Nazis_desc:0 "We have proof that the Germans are sending arms to National Socialist rebels. A raid can both eliminate the cell and secure the arms for ourselves."
 Counter_Anschluss_Repudiate:0 "Repudiate the Anschluß"
 Counter_Anschluss_Repudiate_desc:0 "We have won the political fight; we have managed to repel the interests of the Germans to such a point that we can denounce and permenently prevent any attempts by Germany to annex us!"
 ##Reichstag
 GER_DNVP_Reichstag:0 "The Reichstag"
 GER_DNVP_Reichstag_desc:0 "The Reichstag is the Lower House of our Legislative branch. The [?This.GER_total_seats] delegates spend their time proposing and debating bills and policy. For a bill to be passed, at least half of the members of the Reichstag have to vote in favor of the law. If they are not already voting for it, then negotiations can secure their support.\n\n§CCoalition Seats: §!§Y[?This.GER_coalition_seats]§!\n\n§YLeninist Seats: [?This.GER_com_seats]\n\nRevolutionary Socialist Seats: [?This.GER_rso_seats]\n\nDemocratic Socialist Seats: [?This.GER_dso_seats]\n\nSocial Democratic Seats: [?This.GER_sde_seats]\n\nSocial Liberal Seats: [?This.GER_sli_seats]\n\nMarket Liberal Seats: [?This.GER_mli_seats]\n\nLiberal Conservative Seats: [?This.GER_cen_seats]\n\nSocial Conservative Seats: [?This.GER_dem_seats]\n\nAuthoritarian Seats: [?This.GER_neu_seats]\n\nAutocratic Despotist Seats: [?This.GER_mon_seats]\n\nFar-Right Authoritarian Seats: [?This.GER_nat_seats]\n\nFascist Seats: [?This.GER_fas_seats]§!\n\n§CTotal Seats: §!§Y[?This.GER_total_seats]§!\n\n§CSeats needed to support our law: §!§Y[?This.WGR_supseat]/[?This.GER_seats_needed]§!\n\n§RRed§! Laws are §RMilitarist§!\nWhite Laws are Pacifist"
 WGR_negotiated_authoritarian_Increased_Military_Spending:0 "Authoritarians: Increased Military Spending"
 GER_negotiate_with_Authoritarian:0 "Negotiate with Authoritarians"
 GER_negotiate_with_Authoritarian_desc:0 "We should negotiate with the Authoritarians to garner support for our motion."
 GER_negotiate_with_Communists:0 "Negotiate with Communists"
 GER_negotiate_with_Communists_desc:0 "We should negotiate with the Communists to garner support for our motion."
