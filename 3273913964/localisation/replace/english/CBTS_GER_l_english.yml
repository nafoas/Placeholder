 #DAF
 GER_DAF:0 "German Labour Front"
 GER_DAF_desc:0 "The German Labour Front is the only legal trade union in the Reich. Its purpose, however, is not to support workers' rights through mediation, but to increase production. It works under the principle of the \"People's Community\", or Volksgemeinschaft. The front works to make sure that every possible amount of work is squeezed out of the workers, but to also provide the workers with job security in exchange for loyalty to the regime."
 GER_Change_Employment_Contracts:0 "Redraft Employment Contracts"
 GER_Change_Employment_Contracts_desc:0 "The old Weimar regulations gave way to low production and low job security. Our new laws will make sure that employers can get more out of their workers, but make it harder to fire workers without offense."
 GER_Improve_Working_Conditions:0 "Improve Working Conditions"
 GER_Improve_Working_Conditions_desc:0 "Giving the workers regularly scheduled breaks, standardized working times, and better cafeterias and canteens will help us ensure their loyalty."
 GER_Strength_Through_Joy:0 "Kraft durch Freude"
 GER_Strength_Through_Joy_desc:0 "Strength through Joy will be a leisure organization for workers, administrated by the German Labour Front. Its goal is to bring middle-class entertainment - such as the Cinema, luxury cruises, and sporting events all at low prices. This is a giant propaganda effort made to turn the workers from Social Democracy and Communism towards National Socialism."
 GER_KdF_Established:0 "The §YStrength through Joy§! Program has been established."
 GER_Volkswagen_dec:0 "Commision the Volkswagen"
 GER_Volkswagen_dec_desc:0 "We should make sure that Hitler's promise is kept; to make sure that a family-sized mid-ranged car is available at 1,000 Reichsmarks or less! However, beuraucratic officials and diplomats will be given first priority."
 GER_Beauty_of_Labor:0 "Schönheit der Arbeit"
 GER_Beauty_of_Labor_desc:0 "The Beauty of Labour propaganda ministry will work under the DAF to appease workers. It will campaign for a cleaner and more professional workplace, in exchange for absolute loyalty, of course."
