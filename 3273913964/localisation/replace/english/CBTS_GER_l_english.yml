 ger_army.13.t: "Blomberg promoted to Field Marshal"
 ger_army.13.d: "The rank of Generalfeldmarschall, although banned by the treaty of Versailles, has been reintroduced today with the promotion of Reichminister of War Werner von Blomberg. The Führer decided to award the general the honor of being the first Field Marshal of Germany (after the rank was banned) for his loyalty and diligence. To fill Blomberg's rank of Generaloberst, the Chief-of-staff of the army Werner von Fritsch will be promoted, as well as granted the rank and authority of a Reichminister (but without the formal title)."
 ger_army.13.a: "Congratulations, Herr Blomberg."

 GER_Hitler_Communists_Banned:0 "The Communists have been banned."
 GER_Hitler_Ban_Communists:0 "Ban Communism"
 GER_Hitler_Ban_Communists_desc:0 "The Communists are the only real threat to the NSDAP at this moment. We must ban them and make sure that they cannot coordinate against us!"
 GER_Hitler_SPD_Banned:0 "The Social Democrats have been banned."
 GER_Hitler_Ban_SPD:0 "Ban the SPD"
 GER_Hitler_Ban_SPD_desc:0 "The Social Democratic Party of Germany had voted against the Enabling act. We should ban them to prevent any resistance in the future."
 GER_Reinhardt:0 "Reinhardt Program"
 GER_Plain_Autobahns:0 "Reichsautobahnen"
 GER_Autobahn_Cat:0 "[Root.GER_Autobahn]"
 GER_Autobahn_Cat_desc:0 "[Root.GER_Autobahn_Desc]"
 GER_Plain_Autobahns_Desc:0 "Infrastructure Projects are incredibly vital to our economic program. Central to our planning are the Reich Highways; a massive network of roads criss-crossing Germany. The \"Führer's Roads\" have already become a central piece of National Socialist Propaganda, with plays and speeches about them. The workers of the Autobahn will also become central to propaganda, as they dig and build all the way across Germany!"
 GER_Reinhardt_Desc:0 "Infrastructure Projects are incredibly vital to our economic program. Central to our planning are the Reich Highways; a massive network of roads criss-crossing Germany. The \"Führer's Roads\" have already become a central piece of National Socialist Propaganda, with plays and speeches about them. The workers of the Autobahn will also become central to propaganda, as they dig and build all the way across Germany!\n\nAccompanying the Autobahnen are new infrastructure projects outlined in the Reinhardt Program. This program calls for massive tax relief and public construction projects, including Bridge Construction and Housing Construction."
 #Autobahnen
 ger_projects.1.t: "The 1933 Berlin Motor Show"
 ger_projects.1.desc: "Today the International motor show (Internationale Automobil-Ausstellung, IAA) began in Berlin, being inaugurated by recently appointed Chancellor Adolf Hitler, who in the opening speech announced a new major road construction programme of \"National Highways\" for Germany, along with some tax benefits for car owners and state-funded motorsport events. This programme is designed to put many young unemployed German men to work, to help combat the astoundingly high levels of unemployment in Germany while also improving the national infrastructure.\nHitler presented this supposed Autobahn programme as a necessity and the future measure of a people, \"as railroads are in the past\". It remains to be seen, however, if these measures will prove to be effective in combating German economic strife, or if this is only rhetoric to appeal to the masses."
 ger_projects.1.a: "Interesting"
 ger_projects.2.t: "The First Shoveling of Dirt"
 ger_projects.2.desc: "Today a crowd of 720 unemployed German men marched to the Frankfurt Stock Exchange where they were ceremonially invested with shovels as Reichsautobahn workers, then from there accompanied by SA men, marched behind Todt and Jakob Sprenger, the Reichsstatthalter of Hesse, to the bank of the river Main where the Führer awaited. After a series of speeches that roused up the men, Hitler himself was to inaugurate work on the autobahn system with the first ceremonial shoveling of dirt to form the base of an embankment. He plunged his shovel into the mound of dirt repeatedly and after some time two of the workers "sprang to help him", working until the mound had been dealt with in an orderly fashion. An inspiring picture of the Führer hard at work, sweating from his brow as he dug, was snapped at that moment and probably will be extensively used in propaganda. With the ceremony now over, work on the autobahn that will connect Frankfurt to Darmstadt has now officially begun."
 ger_projects.2.a: "This is real construction work!"
 ger_projects.3.t: "The opening of the 2nd Arbeitsschlacht"
 ger_projects.3.desc: "PLACEHOLDER"
 ger_projects.3.a: "Fanget an!"
 ger_projects.4.t: "Sabotage"
 ger_projects.4.desc: "While the vast majority of the German people support Hitler in his endeavors, there are some elements in the Reich diametrically opposed to him and his party. Insolated acts of resistance against the regime appear from time to time but they rarely succed in filtering out to the public. But in the past days, what we believe is Ludwig Gehm and his associates of the now outlawed ISK party (International Socialist Combat League) caused a sensation by attempting to sabotage the ceremonial first shoveling of dirt in Frankfurt.\nOn the night before the ceremony, the Frankfurt ISK snuck into the worksite and painted counter slogans on the roadway and on the bridges: \"Hitler = war\", \"Down with Hitler\". Additionaly, some of the large speakers were made unusable. The following morning, what was written on the bridges was hastly covered with swastika flags, and the roadways were covered with sand. But the rain and the vehicles made the writings on the roadway legible again during the ceremony. In fact the propaganda film for the inauguration act later had to be cut in numerous places in order to keep the whole thing hidden, but most of the people present in the act saw the slogans, including the Führer (who was livid) and other high Nazi officials.\nThis act of \"resistance\" has opened a small hole in our propaganda effort to make the world believe the whole German population supports our regime; a hole that our enemies could exploit to destabilize our regime. We must find the perpretators on this attack on the Reich and hang them!."
 ger_projects.4.a: "Damn it"

