 GER_reichsautobahn_Projects:0 "Reichsautobahn Project"
 GER_reichsautobahn_Projects_desc:0 "Infrastructure Projects are incredibly vital to our economic program. Central to our planning are the Reichsautobahns; a massive network of controlled-access highways that will connect all corners of the Reich. The aim is to create a modern transport system that effectively combats unemployment, enables Germans to explore and appreciate their country and to provide military applications.\n\nThese \"Führer's Roads\" (as they have been dubbed by the Party) will also act as a central piece of National Socialist propaganda, promoting a strong public appeal for the execution of the project under the Third Reich and alienating worker support from the communists and socialists."
 GER_pass_the_autobahn_project_law:0 "Law on the Establishment of a 'Reichsautobahn' Enterprise"
 GER_pass_the_autobahn_project_law_desc:0 "This law provides for the establishment of a subsidiary of the Reichsbahn (called §WGesellschaft Reichsautobahnen§!) entrusting it with the construction and operation of the Autobahnen.\nThe participation of the Reichsbahn will help finance the project by contributing 3 billion RM for the construction of the roads, which will prove decisive for a quick start and a swift implementation. Furthermore, we will name §RFritz Todt§! as the §CGeneralinspektor für das Deutsche Straßenwesen§! (Inspector-General for the German Road System)."
 GER_take_over_HAFRABA:0 "Take over HaFraBa"
 GER_take_over_HAFRABA_desc:0 "§WHaFraBa:§! Association for the preparation of the motorway Hanseatic cities–Frankfurt–Basel; an organization established by the Weimar government to begin constructing a highway network across Germany.\n-------------------------------------------------------------\nVarious members of our party have called for the rejection of HaFraBa's plans for the Autobahnen and the complete abolishment of the thing as a whole. They argue that HaFraBa is \"a corporation subjected to Capitalist and Jewish economic interests\" since several members of the company's board are Jews; most notably Dr. Ludwig Landmann, the Mayor of Frankfurt. We will seize the oportunity and take over the company and their assets, which will prove helpful for the financing of the Reichsautobahn project."
 GER_form_GEZUVOR:0 "Form GEZUVOR"
 GER_form_GEZUVOR_desc:0 "We will incorporate HaFraBa, STUFA and other organizations into a new association known as §RGEZUVOR§! (Gesellschaft zur Vorbereitung der Reichsautobahn, Society for the Preparation of the Reichsautobahn). The task of said association is to determine the route of the Reichsautobahnen and to carry out and support all work of a technical, economic, transport policy and propaganda work that serves to prepare and promote the construction of the Reichsautobahnen. §CWilly Hof§! will be elected chairman of the GEZUVOR board as a reward for his loyalty to the party."
 GER_found_Gesellschaft_Reichsautobahnen:0 "Foundation of the Gesellschaft Reichsautobahnen"
 autobahn_construction_begins_in_months_tt:0 "The construction of the first sections of the §RAutobahnen§! will begin in some months!"
 GER_start_autobahn_building: "The first shoveling of dirt has been held"
