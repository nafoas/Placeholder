 truppenamt:0 "Truppenamt"
 truppenamt_desc:0 "After the Great War, the Versailles Treaty dissolved the Great German General Staff and forbid Germany to reconstitute it in any form. One year leater, Major General Hans von Seeckt, head of the military expert group adjunct to the German delegation, created a cover organisation for the German General Staff named the Truppenamt (Troop Office), with the objective to rethink and rewrite German doctrine as well as reorganise the Army to meet the requirements of the Versailles Treaty. During the following years the Truppenamt completely revised German tactical and strategic doctrine, reshaped the army with new regulations and formations, and used the limitations of the treaty to its advantage."
