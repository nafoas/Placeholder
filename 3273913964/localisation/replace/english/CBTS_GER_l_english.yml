 GER_military_ratout_disloyal_officers:0 "Purge Disloyal Officers"
 GER_military_ratout_disloyal_officers_desc:0 "To decrease the influence the Wehrmacht has on our politics, we must find and eliminate any disloyal officers."
 GER_military_increase_political_indoctrination:0 "Increase Ideological Indoctrination in the Military"
 GER_military_increase_political_indoctrination_desc:0 "Using Political Officers and Propaganda we can indoctrinate the soldiers with National Socialism, and inoculate ourselves against military rebellion."
 GER_military_blomberg_fritsch_affair:0 "The Blomberg-Fritsch Affair"
 GER_military_blomberg_fritsch_affair_desc:0 "Two high-ranking generals have spoken out against our military plans. They say that the \"Army is not ready\" for war and other such things. These generals are Werner von Blomberg and Werner von Fritsch. If they are allowed to continue, they could potentially hamper the war effort. Fortunately, the Gestapo has found that von Blomberg's recent marriage was to a woman convicted of Prostitution and Pornography! This comes as a shock to the army and national leadership, because Blomberg had drawn up measures against this himself. Futhermore, we can revive a forged SS document that charges von Fritsch with Sexual Deviancy. Even if he is not convicted, he would still have to resign to preserve the dignity of the Army."
 GER_military_create_OKW:0 "Re-Organize the Military"
 GER_military_create_OKW_desc:0 "In order to make sure that no branch of the military can supersede the other (and make sure that everything is under the direct control of Hitler) we shall create the Oberkommando der Wehrmacht, or OKW. All military branches will be subordinate to this branch, subject to direct orders from the Führer."
 GER_military_bribe_officers:0 "Bribe an Officer"
 GER_military_bribe_officers_desc:0 "We should be able to buy an officer's loyalty with some funds set aside from them. We control all funds anyways."
 GER_military_establish_konto_5:0 "Establish Konto 5"
 GER_military_establish_konto_5_desc:0 "Konto 5, officially called \"Compensation for Expenses\" - Aufwandsentschädigungen - will be our way of Bribing Senior Officers by paying them in thousands of Reichsmarks as a monthly salary. This should work wonders!"
 GER_prop_up_military:0 "Military Propaganda"
 GER_prop_up_military_desc:0 "We need to risk the military's influence growing to increase our manpower pool."
 GER_military_chaplains_dec:0 "Recruit Frontline Chaplains"
 GER_military_chaplains_dec_desc:0 "Bringing Preachers to the Front would hopefully get them all killed, but in the meantime, we might as well use them to inspire the troops."
 GER_early_clergy_draft:0 "§YThe §!§G\"Recruit Frontline Chaplains\"§!§Y Decision will become available once the Treaty of Versailles has been discarded.§!"
 GER_wip: "§RWIP§!"
 GER_Hitler_Party_Increase_Membership:0 "Increase Party Membership"
 GER_Hitler_Party_Increase_Membership_desc:0 "We should begin a propaganda campaign to increase party membership."
 GER_Hitler_Party_Hold_Rally:0 "Hold a Rally"
 GER_Hitler_Party_Hold_Rally_desc:0 "Holding a Rally would increase our influence on society!"
 GER_Hitler_SS_put_limits:0 "Limit the SS"
 GER_Hitler_SS_put_limits_desc:0 "The SS has grown dangerously powerful as of late. We must put limits on them to prevent Himmler from getting any ideas."
 GER_Hitler_SS_tightly_integrate:0 "Place New Bureaucratic Measures on the SS"
 GER_Hitler_SS_tightly_integrate_desc:0 "Himmler is going too far. We need to tightly integrate the SS into the bureaucracy, and prevent Himmler from getting too strong."
 GER_Hitler_SS_destroy:0 "Destroy the SS"
 GER_Hitler_SS_destroy_desc:0 "Himmler has grown far too strong; we need to destroy the SS once and for all!"
 GER_SS_go_away:0 "SS Influence will go down to §Y0§! and will no longer change."
 GER_Promote_Steiner:0 "Give Felix Steiner Field Command"
 GER_Promote_Kruger:0 "Give Walter Krüger Field Command"
 GER_Promote_Hausser:0 "Give Paul Hausser Field Command"
 GER_Promote_Dietrich:0 "Give Josef \"Sepp\" Dietrich Field Command"
 GER_Hitler_SS_Inspection:0 "Perform an Inspection of the SS"
 GER_Hitler_SS_Inspection_desc:0 "Peforming an \"Inspection\" of the SS will remind Himmler that it is us who is in charge, not him."
 #SS
 GER_SS_decisions:0 "Schutzstaffel Interactions"
 GER_SS_decisions_desc:0 "While the \"Protection Squadron\" began as Adolf Hitler's personal bodyguard, under the leadership of Heinrich Himmler it has grown into a larger paramilitary unit. Himmler himself is a madman - perhaps more so than Hitler - who believes in mysticism and Neo-Paganism. While the SS harbors pretentions of being some kind of elite force, in reality they are no more than alcoholic thugs in uniforms."
 GER_SS_increase_membership:0 "Increase SS Membership"
 GER_SS_increase_membership_desc:0 "A Propaganda Campaign to encourage Germans to join the SS will ultimately strengthen our government."
 GER_SS_indoctrinate_hitler_jungend_landdienst:0 "Indocrinate the Hitler-Jungend Landdienst"
 GER_SS_indoctrinate_hitler_jungend_landdienst_desc:0 "Bringing the Hitler Youth Land Service into the SS's fold will strengthen the SS, and thus our government."
 GER_SS_expand_SD:0 "Expand the Sicherheitsdienst"
 GER_SS_expand_SD_desc:0 "To make sure that the NSDAP and the SS can function unimpeded, we must strengthen the resources of the Security Service."
 GER_SS_supress_religious_organizations:0 "Supress Religious Organizations"
 GER_SS_supress_religious_organizations_desc:0 "Our government is blatantly anti-religious. We should use the SS to pressure relgious groups into submission."
 GER_SS_Give_Himmler_Gestapo:0 "Transfer Police Power to Himmler"
 GER_SS_Give_Himmler_Gestapo_desc:0 "Giving Himmler power over the Gestapo would consolidate our internal security under one umbrella."
 #SS Divisions - non historical ones: England, Scotland, Ireland, United States (North/South), Egypt, India, Spain, Portugal, Turkey, Greece
 GER_remove_equipment_tt:0 "The Necessary Amount of Equipment will be removed from the Stockpile.\n"
 GER_lutzow_tt: "§RSS Cavalry Division Florian Geyer and SS Cavalry Division Maria Theresia will be disbanded!§!"
 GER_create_panzer_division_tt:0 "A cYSS-Panzerdivision§! will be raised.\n"
 GER_create_panzergrenadier_division_tt:0 "A §YSS-Panzergrenadier-Division§! will be raised.\n"
 GER_create_gerbigs_division_tt:0 "A §YSS-Gebrigs-Division§! will be raised.\n"
 GER_create_kavallerie_division_tt:0 "A §YSS-Kavallerie-Division§! will be raised.\n"
 GER_SS_Division_1:0 "Expand the Leibstandarte SS Adolf Hitler"
 GER_SS_Division_1_desc:0 "The LSSAH is a small paramilitary force that originates from the first SS units to recieve military training in 1933, and that now play the role as Adolf Hitler's personal guard. After their bravery and obedience during the Röhm putsch, acting as the death squad that arrested and executed several SA Generals, they will be motorized and expanded into regimental size as a recognition of their actions. "
 GER_expand_LSSAH_to_panzer_division: "Expand the LSSAH into a Panzer Division"
 GER_expand_LSSAH_to_panzer_division_desc: ""
 GER_SS_Division_2:0 "Raise the SS Panzerdivision \"Das Reich\""
 GER_SS_Division_2_desc:0 "\"Das Reich\" a SS Panzer Division and will be used to supplement the army."
 GER_SS_Division_3:0 "Raise the SS Panzerdivision \"Totenkopf\""
 GER_SS_Division_3_desc:0 "\"Totenkopf\" will be a SS Panzer Division and will be used to supplement the army. Its initial composition will be out of members of the SS Heimwehr Milita and several Guards."
 GER_SS_Division_4:0 "Raise the SS Polizei Panzergrenadier Division"
 GER_SS_Division_4_desc:0 "Made out of members of the Ordnungspolizei, this division will be able to supplement the army."
 GER_SS_Division_5:0 "Raise the SS Panzer Division \"Wiking\""
 GER_SS_Division_5_desc:0 "Composed of volunteers from the Lowlands and/or the Nordic Countries, this SS Panzer Division can be used to supplement the army."
 GER_SS_Division_6:0 "Raise the SS Mountain Division \"Nord\""
 GER_SS_Division_6_desc:0 "\"Nord\" is a mountain division we can use to supplement Finnish units against the Bolsheviks."
 GER_SS_Division_7:0 "Raise the SS Volunteer Mountain Division \"Prinz Eugen\""
 GER_SS_Division_7_desc:0 "Composed of Ethnic German Volunteers from the Balkans, \"Prinz Eugen\" should be formed to fight against Yugoslav Partisans."
 GER_SS_Division_8:0 "Raise the SS Cavalry Division \"Florian Geyer\""
 GER_SS_Division_8_desc:0 "Composed of Ethnic German Volunteers from Banat and Transylvania, we can send \"Florian Geyer\" to the Eastern Front!"
 GER_SS_Division_9:0 "Raise the SS Panzer Division \"Hohenstaufen\""
 GER_SS_Division_9_desc:0 "Named after a historical German dynasty, \"Hohenstaufen\" should be sent to the Eastern Front!"
 GER_SS_Division_10:0 "Raise the SS Panzer Division \"Frundsberg\""
 GER_SS_Division_10_desc:0 "Named after Georg von Frundsberg, this division should be sent to the Eastern Front!"
 GER_SS_Division_11:0 "Raise the SS Volunteer Panzergrenadier Division \"Nordland\""
 GER_SS_Division_11_desc:0 "Composed of Nordic Volunteers, we can immediately send \"Nordland\" to the East!"
 GER_SS_Division_12:0 "Raise the SS Panzer Division \"Hitlerjungend\""
 GER_SS_Division_12_desc:0 "Composed of recruits fresh out of the Hitler Youth, \"Hitlerjungend\" should be immediately sent to France!"
 GER_SS_Division_13:0 "Raise the SS Waffen Mountain Division of the SS \"Handschar\""
 GER_SS_Division_13_desc:0 "With the help of the Grand Mufti of Jerusalem - Who is also a SS-Gruppenführer - we can recruit Muslim Bosnians and Catholic Croatians to serve in the \"Handschar\" Divisions."
 GER_SS_Division_14:0 "Raise the SS-Volunteer Division \"Galizien\""
 GER_SS_Division_14_desc:0 "Composed of Ukranians from Polish Galicia, \"Galizien\" will be happy to fight against the Bolsheviks!"
 GER_modernize_ss_panzergrenadier_template: "§YModernize SS-Panzergrenadier Divisions§!"
 modernize_panzergrenadier_tt: "§RNote: We can't switch division templates via scripting, so we recommend you to change them manually§!"
 GER_SS_Division_15:0 "Raise the First Latvian Waffen Grenadier Division of the SS"
 GER_SS_Division_15_desc:0 "Together with the Second Latvian division, the Latvian Legion works to keep the Soviets out of Latvia!"
 GER_SS_Division_16:0 "Raise the SS Panzergrenadier Division \"Reichsführer-SS\""
 GER_SS_Division_16_desc:0 "\"Reichsführer-SS\" Would be another Ethnic German Division that we need to send to Rome immediately."
 GER_SS_Division_17:0 "Raise the SS Panzergrenadier Division \"Götz von Berlichingen\""
 GER_SS_Division_17_desc:0 "\"Götz von Berlichingen\", composed of more ethnic Germans (and a few French volunteers), should immediately be sent to the West."
 GER_SS_Division_18:0 "Raise the SS Volunteer Panzer Grenadier Division \"Horst Wessel\""
 GER_SS_Division_18_desc:0 "Composed of Ethnic Germans from Hungary, \"Horst Wessel\" should be a useful Garrison unit."
 GER_SS_Division_19:0 "Raise the Second Latvian Waffen Grenadier Division of the SS"
 GER_SS_Division_19_desc:0 "Together with the First Latvian division, the Latvian Legion works to keep the Soviets out of Latvia!"
 GER_SS_Division_20:0 "Raise the First Estonian Waffen Grenadier Division of the SS"
 GER_SS_Division_20_desc:0 "Some of the Estonian People have decided to volunteer to serve Germany against Moscow's long arm!"
 GER_SS_Division_21:0 "Raise the First Albanian Waffen Mountain Division of the SS \"Skanderbeg\""
 GER_SS_Division_21_desc:0 "\"Skanderbeg\" should be formed to protect Albania and Kosovo against our enemies. It will be primarily composed of Albanian volunteers, and will be assisted by German specialists."
 GER_SS_Division_22:0 "Raise the SS Volunteer Cavalry Division \"Maria Theresia\""
 GER_SS_Division_22_desc:0 "Composed of Ethnic Germans from Hungary, \"Maria Theresia\" would be a useful ally against any invasions of Hungary."
 GER_SS_Division_23:0 "Raise the Second Croatian Waffen Mountain Division of the SS \"Kama\""
 GER_SS_Division_23_desc:0 "The Second Division staffed by Croatian and Bosnian Muslims, \"Kama\" would be a good garrison against Soviet Onslought!"
 GER_SS_Division_24:0 "Raise the SS Volunteer Panzer Grenadier Division \"Nederland\""
 GER_SS_Division_24_desc:0 "Although we already have a corps of Dutch Volunteers, expanding it into a Dutch Division may be worth our while."
 GER_SS_Division_25:0 "Raise the Waffen Mountain Division of the SS \"Karstjäger\""
 GER_SS_Division_25_desc:0 "\"Karstjäger\" will be a division formed from Ethnic Germans in Italy and Slovenia. We can use it to fight in Italy and the Balkans."
 GER_SS_Division_26:0 "Raise the First Hungarian Waffen Grenadier Division of the SS \"Hunyadi\""
 GER_SS_Division_26_desc:0 "\"Hunyadi\" will be a Hungarian division that we can use to defend against the Red Army!"
 GER_SS_Division_27:0 "Raise the Second Hungarian Waffen Grenadier Division of the SS \"Hungaria\""
 GER_SS_Division_27_desc:0 "\"Hungaria\" will be a Hungarian division that we can use to defend against the Red Army!"
 GER_SS_Division_28:0 "Raise the First Flemish SS Volunteer Division \"Langemarck\""
 GER_SS_Division_28_desc:0 "And expanded version of the SS Volunteer Legion \"Flandern\", \"Langemarck\" can defend Flanders from the English, French, and Americans!"
 GER_SS_Division_29:0 "Raise the SS Volunteer Grenadier Division \"Wallonien\""
 GER_SS_Division_29_desc:0 "Léon Degrelle's Walloon unit will be useful against any invasions of the Lowlands."
 GER_SS_Division_30:0 "Raise the First Italian Waffen Grenadier Division of the SS"
 GER_SS_Division_30_desc:0 "With Italians in the SS, we have begun a new era of German-Italian cooperation!"
 GER_SS_Division_31:0 "Raise the First White Ruthenian Waffen Grenadier Division of the SS"
 GER_SS_Division_31_desc:0 "Putting White Ruthenians in the SS will be an interesting experiment. We will eagerly reviewing their capacity to fight their former Bolshevik Overlords."
 GER_SS_Division_32:0 "Raise the SS Volunteer Grenadier Division \"Batschka\""
 GER_SS_Division_32_desc:0 "Ethnic Germans from the Bačka Region can be used to staff a new SS division."
 GER_SS_Division_33:0 "Raise the SS Volunteer Grenadier Division \"30. Januar\""
 GER_SS_Division_33_desc:0 "We need another SS division, quickly! The Invaders are close!"
 GER_SS_Division_34:0 "Raise the First French Waffen Grenadier Division of the SS \"Charlemagne\""
 GER_SS_Division_34_desc:0 "Composed of Sympathetic Frenchmetn, \"Charlemagne\" could possibly supplement the Army in the East or West."
 GER_SS_Division_35:0 "Motorize the 4th SS Polizei-Division"
 GER_SS_Division_35_desc:0 "We must transform the old horse-drawn divisions into powerful armored units that are up to the task to carry out Blitzkrieg!"
 GER_SS_Division_36:0 "Expand the Dirlewanger Brigade"
 GER_SS_Division_36_desc:0 "Expanding Dirlewanger's brigade of Criminals and Prisoners of War should prove to be interesting. Hopefully they can use their...talents for our purposes."
 GER_SS_Division_37:0 "Raise the SS Volunteer Cavalry Division \"Lützow\""
 GER_SS_Division_37_desc:0 "We will form a new SS Cavalry Division from the remnants of SS Cavalry Division Florian Geyer and SS Cavalry Division Maria Theresia. In addition, mostly under-age German, Hungarian Volkdeutsche, and ethnic Hungarian recruits will compose the unit."
 GER_SS_Division_38:0 "Raise the SS Panzer Grenadier Division \"Nibelungen\""
 GER_SS_Division_38_desc:0 "A small unit formed out of barely trained trainees, we are really scraping the bottom of the barrel."
 GER_SS_Division_39:0 "Raise the First Cossack Cavalry Division"
 GER_SS_Division_39_desc:0 "We should be able to put Don Cossacks to use agains the Bolsheviks."
 GER_SS_Division_40:0 "Raise the SS Volunteer Panzer Division \"Löwenherz\""
 GER_SS_Division_40_desc:0 "Now that we are under control of England, we can find some like-minded Englishmen to fight in the SS!"
 GER_SS_Division_41:0 "Raise the Waffen Mountain Division of the SS \"Uallas\""
 GER_SS_Division_41_desc:0 "Named after Scottish Hero William Wallace, This Scottish Division will be trained to hate the English so much that they would accept German overlordship!"
 GER_SS_Division_42:0 "Raise the SS Volunteer Panzergrenadier Division \"Banshee\""
 GER_SS_Division_42_desc:0 "By recruiting some virulent anti-British Irishmen into the SS, \"Banshee\" will soon be feared by London!"
 GER_SS_Division_43:0 "Raise the SS Volunteer Panzergrenadier Division \"Dixie\""
 GER_SS_Division_43_desc:0 "Forming an SS Division out of Americans in the Deep South would be an important step in playing the South agains the North."
 GER_SS_Division_44:0 "Raise the SS Panzerdivision \"Friedrich Wilhelm\""
 GER_SS_Division_44_desc:0 "Named after the Prussian General who helped win America its independence, this division will be the North's \"defense\" against the Dixies!"
 GER_SS_Division_45:0 "Raise the SS Volunteer Panzergrenadier Division \"Montu\""
 GER_SS_Division_45_desc:0 "Himmler is an Admirer of the Ancient Egyptians, and wants to revive that spirit by making an Egyptian SS Division!"
 GER_SS_Division_46:0 "Raise the First Indian Waffen Grenadier Division of the SS"
 GER_SS_Division_46_desc:0 "An Indian division of the SS would go a long way in our propaganda to get the Indians to side with us against the British!"
 GER_SS_Division_47:0 "Raise the SS Volunteer Panzergrenadier Division \"Visigoten\""
 GER_SS_Division_47_desc:0 "The Spanish People have Germanic Roots, at least according to Himmler. It is time to remind them of this."
 GER_SS_Division_48:0 "Raise the SS Volunteer Panzergrenadier Division \"Lusus\""
 GER_SS_Division_48_desc:0 "Said to be a companion of the Roman God Bacchus, this would be a good name for a unit composed of Portugese."
 GER_SS_Division_49:0 "Raise the Waffen Mountain Division of the SS \"Atatürk\""
 GER_SS_Division_49_desc:0 "Named after the founder of the Turkish Nation, \"Atatürk\" should be used to garrison occupied Turkish and Greek areas."
 GER_SS_Division_50:0 "Raise the Waffen Mountain Division of the SS \"Alexander\""
 GER_SS_Division_50_desc:0 "Named after the famous Macedonian King, \"Alexander\" is best used for anti-partisan operations in Greece."
 GER_Hitler_Military_Takeover:0 "Military Takeover"
 GER_Hitler_Military_Takeover_desc:0 "We have carelessly allowed the military to become far more influential in politics than our Bureaucracy. Wehrmacht Officers are giving SS Officers and NSDAP Officials snide looks, and feel far more comfortable criticizing our regime in private. If we do not act fast, top bureaucrats fear that we may face a military takeover!\n\n§RThe Military will take over the government if we do not get their influence below ours.§!"
 GER_Hitler_SS_Takeover:0 "SS Takeover"
 GER_Hitler_SS_Takeover_desc:0 "We have carelessly allowed the Schutzstaffel to become far more influential in politics than our Bureaucracy. Himmler's autonomy has made great leaps, and he almost operates as a government inside our government. Top Bureaucrats and Wehrmacht Officers feel that if we do not stop this expansion, the SS could try and take over Germany!\n\n§RThe SS will take over the government if we do not get their influence below ours.§!"

 ##Restrucred SS Stuff
 ger_internal.1.t:0 "A New Reichskanzler!"
 ger_internal.1.d:0 "Kurt von Schleicher has decided to resign his position as Reichskanzler. The Reichstag and the People do not support him, and President Hindenburg has to choose someone else for the position.\n\nHitler and his National Socialists have popular support, but Hitler is clearly delusional, and some are worried about the excesses of his potential Chancellorship. Alternatively, Alfred Hugenberg and the DNVP might be a better choice. They are slightly more moderate than the Nazis, and might be able to garner support through similar policies. Another possibility is for president Hindunburg to denounce anti-parliamentarism and attempt to continue the democratic process. However, it would be necessary for the liberal parties to form a Grand Coalition to ensure the survival of the republic. The Military on the other hand, has started to whisper about imposing Martial Law on the country. Although they are aware of the consequences, this might be the best course of action..."
 ger_internal.1.a:0 "A Far Right Candidate!"
 ger_internal.1.b:0 "A Democratic Candidate!"
 ger_internal.1.e:0 "Impose Martial Law!"
 
 ger_internal.2.t:0 "A Far-Right Candidate"
 ger_internal.2.d:0 "We have chosen to pick a far-right candidate as Reichskanzler. While most in our government support Adolf Hitler, the leader of the NSDAP, there are concerns that those who support him will be unable to control him. Hitler runs on an extremely racist and militarist platform, calling for a national revolution to fight communism and minorities. Although his radicalism is worrying, he is incredibly popular. Should he become Chancellor, he can restore stability quickly. He also has support from some influencial members of the General Staff.\n\nA less radical option is the leader of the DNVP, Alfred Hugenberg. Hugenberg is a bourgeois nationalist, who supports some level of militarism and expansionism, but is far less radical than Hitler. Although he is also racist, he does not follow Hitlerist Racial Theory. His party also supports the Restoration of the Hohenzollern Dynasty. Hugenberg is less popular, but his anti-revolutionary stance could help preserve the \"Old Germany\" while satiating the people's desire for revenge. However, Hugenberg has gained notoriety for categorizing President Hindenburg as a \"November Criminal\" responsible for Germany's defeat in the Great War. This has insulted the President on a personal level, but their views align more with each other than with the NSDAP. Shall we bite the bullet, or swallow our pride?"
 ger_internal.2.a:0 "Hitler and his National Socialists"
 ger_internal.2.c:0 "Hugenberg and his Nationalists"
 
 ger_internal.3.t:0 "President Hindenburg Denounces Extremism"
 ger_internal.3.d:0 "With von Schleicher's resignation, President Hindenburg has issued a statement denouncing Hitler, Hugenberg, and other far-right politicians and has decided to pick a new Reichskanzler from one of the centre parties. No matter which one he picks, they will definitely have a difficult time maintaining stability in the country."
 ger_internal.3.a:0 "The German Republic stands strong!"
 GER_swtich_to_wgr:0 "§RWe will change tags to the German Republic.§!"
 
 ger_internal.4.t:0 "The Communists take Control"
 ger_internal.4.d:0 "The KPD has taken control of the country thanks to President Hindenburg. While this has angered many conservatives and nationalists, Pieck, Ulbricht, and their cabinet will likely strive to keep stability in the country, and make sure that their hold does not loosen."
 ger_internal.4.a:0 "A New Era for Germany!"
 GER_swtich_to_ddr:0 "The Country becomes the §YPeople's Republic of Germany§"
 DDR_start_congress:0 "The Communist Party Congress shall Begin!"
 
 ger_internal.5.t:0 "A Military Government"
 ger_internal.5.d:0 "Democracy has failed us. To prevent National Socialist or Communist uprisings, President Hindenburg has decided to allow the Military to take power and impose Martial Law. General Ludwig Beck will lead the new government, but President Hindenburg will remain as Reichspresident. Upon his death, it is likely that the government will lapse into a military dictatorship."
 ger_internal.5.b:0 "At least there will be peace."
 
 ger_internal.6.t:0 "Germany in 1933"
 ger_internal.6.d:0 "Germany in 1933 is on the brink of collapse. After political upheaval at the end of the Great War forced the Kaiser out of Germany, established a republic, and quelled Socialist and Nationalist reactions, the economy took a huge tumble. Massive Hyperinflation in 1923 caused much turmoil, and the Great Depression of 1929 seems to have brought those fears back.\n\nIncensed by economic troubles and foreign influence, Political Extremism is the order of the day in Germany. Approximately Forty Percent of German voters support Far-Right parties, with about Thirty-Three Percent of those voters supporting the National Socialists. The Far-Right runs on an extremly Racist program, advocating for centralization and extreme reactions to the Treaty of Versailles and Germany's Economic woes. The Communists manage to pull in approximately 20 Percent of the vote, calling for a total overhaul of the economic and social systems.\n\nThe Military has been effectively neutered by the Treaty of Versailles. Limited to a few ships and One Hundred Thousand soldiers, the military has been one of the more influential supporters of Far-Right parties, but displease them, and they may try and take power themselves..."
 ger_internal.6.a:0 "I see."
 
 ger_internal.7.t:0 "Where is the Focus Tree?"
 ger_internal.7.d:0 "If you open the focus tree, you may notice that the focus tree only consists of the (locked) military branch. This is because the focus tree is dynamic. Once you choose a path (in about one month), the political, economic, and foreign trees will become visible. They are also different according to the path, so please keep that in mind as well."
 ger_internal.7.a:0 "I understand."
 
 ger_internal.8.t:0 "President Hindenburg Dies"
 ger_internal.8.d:0 "Paul von Hindenburg has died today of a metazided bladder at the age of 86. Considered to be a national hero, the former Field Marshal fought both on the battlefield and on the Reichstag floor. Serving as chief of the General Staff for three years and as President for Seven, he also served in the army of three nations: The Kingdom of Prussia, the German Empire, and the German Republic, for a total of 50 years.\n\nNotably, he was the last check on Hitler's Regime, and now that he is dead, Adolf Hitler is free to take full power as Führer und Reichskanzler of Germany. Today, the sun has finally set on the old Germany, and a new totalitarian Reich takes its place."
 ger_internal.8.a:0 "I wonder what the future holds..."
 
 ger_news.2.t:0 "Paul von Hindenburg Dies"
 ger_news.2.d:0 "President Paul von Hindenburg of Germany has died today from lung cancer, at the age of 86. The old conservative had seen Germany through the Great War and the turbulent republican period that followed. Hated by leftists and loved by conservatives, von Hindenburg will be given a state funeral of the highest honor.\n\n[From.GetPostHindenburg]"
 GER_Hitler_takes_full_power:0 "The day before von Hindenburg's death, Chancellor Adolf Hitler enacted legislation in which he would become the Führer (leader), making him head of state and government. With Hindenburg out of the way, there is no telling what Hitler, a definite firebrand, might do..."
 GER_Wilhelm_III_loc:0 "A few days before, the strongman-conservative Chancellor Alfred Hugenberg enacted legislation dictating the restoration of the Hohenzollern monarchy after von Hindenburg's death. Though this move has been denounced by the international community, it seems that the monarchists have achieved their final goal..."
 GER_Hugenberg_takes_full_power:0 "The day before von Hindenburg's death, Chancellor Alfred Hugenberg enacted legislation that made him head of state and government after von Hindenburg's death. Though he and the ruling German National People's Party would prefer to restore the monarchy, it seems that their alliance with the National Socialists have tied their hands..."
 GER_democratic_post_hindenburg:0 "As the German government had arranged beforehand, nationalist jurist Erwin Bumke will take the position of President until new elections can be arranged. It seems that if German democracy has been able to last so far, it might be able to survive further. Only time will tell whether the nation has healed..."
 ger_news.2.a:0 "Rest in Peace"
 
 ger_internal.9.t:0 "A Letter From Rudolf Hess?"
 ger_internal.9.d:0 "Karlheinz Pintsch, the personal aide of Deputy Reichsführer Rudolf Hess, has come to Hitler to deliver a letter. It has long been apparent that Hess has been marginalized within the government, with Martin Bormann taking over most of his duties. Hess is also acutely aware that Germany might not be infalliable, and that pursuing war on multiple fronts may be a bad idea. He has also taken many flight lessons, and has talked quietly with Nazi Resistance member Albrecht Houshofer. What does the note say?"
 ger_internal.9.a:0 "Hess has gone to make peace with the Allies? He Betrayed Us!"
 ger_internal.9.b:0 "He's going to be a bit late to work, that's alright."
 
 ger_internal.10.t:0 "Rudolf Hess Comes To Britain"
 ger_internal.10.d:0 "A plane landed today in Scotland. It contained German Deputy Reichsführer Rudolf Hess! He has come to convince the British Government to make peace with the Reich. Our officials have come to haul him off to prison instead."
 ger_internal.10.a:0 "Not Today, I'm Afraid."
 
 ger_internal.11.t:0 "Rudolf Hess Comes To Britain"
 ger_internal.11.d:0 "A plane crashed today in Scotland. It contained a dead body, found to be Deputy Reichsführer Rudolf Hess! Unfortunately, he died on impact. Why he was on the plane may never be known."
 ger_internal.11.a:0 "Interesting."
 
 ger_internal.12.t:0 "Paying off MEFO Debts"
 ger_internal.12.d:0 "Had we rearmed in the traditional manner, Britain and France would have become aware of our large deficit spending. In addition, we would not be able to borrow funds due to the low interest rate. To get around these problems, Hjalmar Schacht formed the Metallurgische Forschungsgesellschaft, a fake company to distribute these \"MEFO Bills\" to arms manufacturers, who would be able to convert them into Reichsmarks whenever they wished. After five years, the time has come to pay the companies the money they deserve!"
 ger_internal.12.a:0 "The Scheme Worked!"
 
 ger_internal.13.t:0 "The Economy Somewhat Recovers"
 ger_internal.13.d:0 "Due to natural market activity, the effects of the Great Depression have been somewhat abated. Although memory of the Hyperinflationary period does not help to restore confidence in this economy, the average German still cannot deny that their lives are getting somewhat better. However, despite our optimism, we shall just have to wait and see."
 ger_internal.13.a:0 "Hooray for Progress!"
 
 ger_internal.14.t:0 "The Economy has Recovered!"
 ger_internal.14.d:0 "The Great Depression no longer affects Germany! Through a combination of state policy and natural market activity, the German Economy has successfully mitigated the effects of the Great Depression. Although the average German is tentatively satisfied, the memories of the Crisis and the Hyperinflationary period still linger. The government, however, has lost no time in celebrating."
 ger_internal.14.a:0 "The Crisis is Over."
 
 ger_internal.15.t:0 "Der Endsieg!"
 ger_internal.15.d:0 "We are victorious; we have won the War! Our Enemies have been subdued and we have achieved our war aims. We can now focus on continuing the Development of National Socialism inside Germany, as well as interacting with our Reichskommissariats."
 ger_internal.15.a:0 "We have achieved peace."
 
 ger_internal.17.t:0 "The Oster Coup!"
 ger_internal.17.d:0 "Hans Oster, Ludwig Beck, and a group of officers and soldiers have stormed the Reichstag, and attempted to kill [GER.GetLeader]! At the end of the battle, an officer marched out of the building with a small guard of four, and announced that..."
 ger_internal.17.a:0 "...[GER.GetLeader] was dead, and the military has taken over the government!"
 ger_internal.17.b:0 "...[GER.GetLeader] was dead, but the conspirators have been defeated!"
 ger_internal.17.c:0 "...The Conspirators have been defeated and executed on the spot!"
 
 ger_internal.19.t:0 "Operation Valkyrie is launched!"
 ger_internal.19.d:0 "A Bomb has exploded in the Wolf's Lair, just meters from the Führer! As the dust settled, it was found that Hitler was..."
 ger_internal.19.a:0 "Alive!"
 ger_internal.19.b:0 "Dead!"
 
 ger_internal.20.t:0 "Operation Valkyrie: Aftermath"
 ger_internal.20.d:0 "After Hitler's Death, Herman Göring has declared himself Führer, and has ordered Major Remer, another conspirator, to arrest the others. What does the Major Do?"
 ger_internal.20.a:0 "Major Remer Follows his Orders"
 ger_internal.20.b:0 "Major Remer Shoots Göring!"
 
 ger_internal.21.t:0 "Operation Valkyrie: Success!"
 ger_internal.21.d:0 "Operation Valkyrie has succeeded! The Military is now in control of the country, and can carry on the war without Hitler's meddling!"
 ger_internal.21.a:0 "Gott Erhalte Deutschland! The Dictator is Dead!"
 
 ger_internal.22.t:0 "Operation Valkyrie: Failure!"
 ger_internal.22.d:0 "Operation Valkyrie has Failed! The National Socialists survive, and have gotten rid of the traitors!"
 ger_internal.22.a:0 "Even Harsher Restrictions Must Be Put In Place to Ensure Loyalty!"
 
 ger_internal.23.t:0 "Adolf Hitler Commits Suicide!"
 ger_internal.23.d:0 "Berlin has been taken! The great city, capital of the Reich, has fallen today to [64.Controller.GetAdjective] Invaders, after a very tense battle. Believing that a miracle would save the city, Hitler hid out until the very end, and eventually shot himself and had his body burnt to avoid capture. His mistress, Eva Braun, then poisoned herself. His death was announced to the people by the occupation forces. Some are in mourning, and some are rejoicing. Either way, it seems like the war will be over soon..."
 ger_internal.23.a:0 "This nightmare is finally coming to an end."
 
 ger_internal.24.t:0 "The Death of Fritz Todt"
 ger_internal.24.d:0 "Fritz Todt, the Reich Minister for Armaments and Ammunition, has just died in a plane crash near Rastenburg, East Prussia. In charge of infrastructure, he made sure that our soldiers got their equipment. However, in the wake of his death Albert Speer will be made the Reich Minister for Armaments and Ammunition."
 ger_internal.24.a:0 "Interesting."
 
 ger_internal.25.t:0 "Walther Wever Dies"
 ger_internal.25.d:0 "Lieutenant-General Walther Wever, the head of our Air Command, has died today in a plane crash, when the plane stalled and cartwheeled. It then crashed, causing the death of Wever and his flight engineer. As it turns out, the plane he was on was not properly checked before flight, and the gust locks were not removed. He will be given a state funeral."
 ger_internal.25.a:0 "Damn!"
 
 ger_internal.26.t:0 "Walther Wever Nearly Dies"
 ger_internal.26.d:0 "The head of our Air Command, Lieutenant-General Walther Wever, almost suffered a crash today when his plane stalled on takeoff. The pilot was able to correct for it, and immediately landed to check the plane. It has been found that the plane was not properly cleared for takeoff, and the mechanic has been charged with dereliction of duty."
 ger_internal.26.a:0 "At least the General is alright." 
 
 ger_external.1.t:0 "Germany Remilitarizes the Rhineland!"
 ger_external.1.d:0 "German Soldiers have marched into the Rhineland, and [From.GetLeader] has declared the region to once again be an integral part of Germany. Combined with Germany's policies of open re-armament, this clearly represents a threat to our nation's borders. If we act now in conjunction with the United Kingdom we can perhaps hope to stop Germany before they get even more aggressive, but such a move will not sit right with the people."
 ger_external.1.a:0 "We have no choice but to stay our hand."
 ger_external.1.b:0 "Tell Germany to back down or else!"
 
 ger_external.2.t:0 "The Rhineland Remilitarized!"
 ger_external.2.d:0 "Despite fears of French invasion, we have managed to march our soldiers all the way to the French Border! The Rhineland is now fully a part of Germany once again, as the French have backed down."
 ger_external.2.a:0 "Germany is Back!"
 
 ger_external.3.t:0 "France Threatens War over the Rhineland"
 ger_external.3.d:0 "The French have decided to puff their chest over what we can or cannot do withour sovereign lands! A telegram has arrived from the French Foreign Office that says that if German soldiers do not immediately leave previously demilitarized areas, the French army will attack! How are we to respond to this?"
 ger_external.3.a:0 "We are not yet ready for war"
 ger_external.3.b:0 "Let's see how serious the French really are!"
 
 ger_external.4.t:0 "[GER.GetNameDef] Backs Down"
 ger_external.4.d:0 "To stave off yet another war, [GER.GetLeader] has decided to accept our terms and order his troops away from the Rhineland. This is a great win for our government, as we have managed to both show our strength and damage the reputation of the German Regime."
 ger_external.4.a:0 "Another victory over the Germans!"
 
 ger_external.5.t:0 "Germany Refuses to Back Down"
 ger_external.5.d:0 "The Germans are operating under the delusion that we are incapable of defeating their meager forces. They are keeping their soldiers on our border, awaiting an attack. We likely can defeat them, but a war will definitely not be popular with the people. What shall we do?"
 ger_external.5.a:0 "Our government cannot afford the people's disatisfaction"
 ger_external.5.b:0 "We must secure our frontier! Attack!"
 
 ger_external.6.t:0 "France Backs Down!"
 ger_external.6.d:0 "Bowing to \"Political Pressure\", the French have decided to let us back into the Rhineland after we refused to back down! This is a great victory for the regime, and will serve as a great piece of propaganda for years to come!"
 ger_external.6.a:0 "All according to plan."
 
 ger_external.7.t:0 "France Asks for Backing"
 ger_external.7.d:0 "The French government has asked us to support them in threatening Germany over the Rhineland. Under the provisions of the agreement, we would be called into war alongside the French. Should we agree to this proposition?"
 ger_external.7.a:0 "Germany must not be allowed an inch."
 ger_external.7.b:0 "This is not our fight."
 RHI_called_into_war_tt:0 "§RShould war be declared, we will automatically be called in on the French side!§R\n"
 
 GER_RHI_ENG_came_to_aid:0 "Agreed to back us"
 GER_RHI_ENG_did_not_come_to_aid:0 "Refused to assist us"
 ger_external.8.t:0 "The United Kingdom Agrees to Back Us"
 ger_external.8.d:0 "The United Kingdom Foreign Office has sent us an urgent telegram agreeing to the terms of the agreement. They have just as much interest in stopping German Territorial ambitions as we do, so they have pledged to assist us accordingly."
 ger_external.8.a:0 "The Entente is back!"
 
 ger_external.9.t:0 "The United Kingdom Refuses to Intervene"
 ger_external.9.d:0 "The United Kingdom Foreign Office has sent us an urgent telegram declining the terms of the agreement. According to them, the UK is not \"Ready for War\" and \"The People do not wish war\". Well, when Germany attacks the West, we'll see who let them do this in the first place."
 ger_external.9.a:0 "We are confident we can defeat Germany on our own."
 
 ger_external.10.t:0 "War With Germany!"
 ger_external.10.d:0 "According to the terms of our agreement with the French, we must assist them in their conflict against Germany. Although the German Army is comparatively weak, we should make sure that the [FROM.FROM.GetRulingIdeology] is crushed for good."
 ger_external.10.a:0 "For King and Country!"
 
 ger_external.11.t:0 "The Rhineland Crisis has been Resolved!"
 ger_external.11.d:0 "The military leadership of France and the United Kingdom can rest easy, as the Rhineland Crisis has been resolved. Therefore, the agreement with the French has been mutually terminated."
 ger_external.11.a:0 "Peace in our time."
 
 ger_external.12.t:0 "The Anglo-German Naval Agreement"
 ger_external.12.d:0 "We have the opportunity to sign a treaty to prevent the Germans from re-arming their navy. While they do not really have to abide by the treaty, this would go a long way in preventing war with the resurgent German state. The Kriegsmarine would have to be within about one-third of our tonnage, ensuring that we still can defeat them in a battle. Should we agree to these treaties?"
 ger_external.12.a:0 "Yes, we shall"
 ger_external.12.b:0 "We cannot trust the Germans!"
 
 ger_external.13.t:0 "The British Sign the Treaty!"
 ger_external.13.d:0 "After weeks of preparation and negotiation, the British have allowed to let us partially re-arm our navy. This means we will be able to build up a powerful naval force without unnecessary international oversight, meaning that soon Germany, not Britain, shall rule the waves!"
 ger_external.13.a:0 "We shall be invincible!"
 
 ger_external.14.t:0 "The British have not signed the treaty"
 ger_external.14.d:0 "The British have decided against allowing us to rearm our navy, even partially. Thier arrogance will come back to haunt them when we walk into London!"
 ger_external.14.a:0 "We'll just re-arm anyways!"
 
 ger_external.15.t:0 "Cooperation with Germany?"
 ger_external.15.d:0 "The German Foreign Minstry has approached us with an offer of Naval Cooperation. We would help each other with our naval designs, and secure a bond between our countries. They have expressed concerns about Bolshevik activities from the Soviet Union and even their own Communists. They say that greater naval cooperation would help to strangle this \"Revolutionary\" movement before it can strangle them. Should we accept?"
 ger_external.15.a:0 "Better the Left than the Right, I guess."
 ger_external.15.b:0 "We cannot give the Nationalists any ground!"
 
 ger_external.16.t:0 "Britain Accepts the Treaty!"
 ger_external.16.d:0 "The British government has accepted our offer of cooperation, and will begin collecting several engineers to visit our drydocks. We shall do the same, of course."
 ger_external.16.a:0 "The Bolsheviks will go down!"
 
 ger_external.17.t:0 "Britain Refuses the Treaty!"
 ger_external.17.d:0 "The British government has refused our offer of cooperation, and would prefer to see their own navy stifled just to be superior to us."
 ger_external.17.a:0 "Their Arrogance knows no bounds!"
 
 ger_external.18.t:0 "Talks with Germany!"
 ger_external.18.d:0 "Diplomats and Military Experts from Germany have come to Hendaye to talk to us about a military alliance. They speak about our shared interests, such as seeing the British removed from Gibraltar. Declining would very much hurt our relations with the Germans and possibly cause [FROM.GetLeader] to attack us out of Fury.\n\nHowever, Spies from German Military Intelligence - who work with Germany's Enemies - have given us details on how to accept the alliance but keep us out of war. We shall have to claim territory in Southern France, Morrocco, Algeria, and of course, Gibraltar. To add insult to injury, we can ask for German Economic Assitance. This will reportedly not sit well with the Germans, who would deny our conditions outright. What shall we do?"
 ger_external.18.a:0 "Accept the Alliance!"
 ger_external.18.b:0 "Demand Concessions from the Germans."
 ger_external.18.c:0 "Profoundly Assure them of our Neutrality."
 
 ger_external.19.t:0 "Spain Accepts our Alliance!"
 ger_external.19.d:0 "[FROM.GetLeader] has decided to intervene and join the war on our side. Surely, they will be an ally worth cooperation with us!
 ger_external.19.a:0 "German Hegemony Grows Stronger!"
 
 ger_external.20.t:0 "Spain Refuses to Join the War."
 ger_external.20.d:0 "The Spanish have decided to remain neutral, despite the possible benefits that the War can bring them. We of course could invade them to make sure we get what we want..."
 ger_external.20.a:0 "Draw up the Invasion Plans!"
 ger_external.20.b:0 "Best to focus on other objectives."
 
 ger_external.21.t:0 "Spain Presents Conditions"
 ger_external.21.d:0 "The Spanish Diplomats have presented a list of territorial conditions that would be prerequisite for an alliance. These territories include Spanish Basque, Roussilion, the rest of Morroco, Oran, and Gibraltar - which we wanted to use as a military base. They also demand Economic Assistance in the form of industrial equipment and expertise. Should we accept their demands?"
 ger_external.21.a:0 "Might as well."
 ger_external.21.b:0 "Break off Talks!"
 
 ger_external.22.t:0 "Germany Accepts Our Terms"
 ger_external.22.d:0 "The Gamble to Remain Neutral has failed. Germany has accepted our terms, and per the terms of the agreement, we must now join the war on their on their side."
 ger_external.22.a:0 "Very Well, To Arms!"
 
 ger_external.23.t:0 "Germany Refuses Our Terms"
 ger_external.23.d:0 "The Germans have decided to break off talks due to our \"Outrageous\" Demands. Of course, that was how it was meant to be recieved. At least our Neutrality is assured, for now..."
 ger_external.23.a:0 "Thank you, German Military Intelligence!"
 
 ger_external.24.t:0 "Germany wants to Renegotiate the status of the Rhineland"
 ger_external.24.d:0 "Currently, the Rhineland is a demilitarized zone, but the Germans, now wanting to be our friend, have asked if they can gain military access to their lands again. They are open to negotiating in phases, however, and would take a partial remilitarization. For now."
 ger_external.24.a:0 "Allow them Full Access to the Rhineland!"
 ger_external.24.b:0 "Allow them Access to the East Bank."
 ger_external.24.c:0 "How do we know they won't betray us?"
 DDR_first_rhineland:0 "The First Rhineland Negotiations were a success!"
 DDR_full_rhineland:0 "We have full access to the Rhineland!"
 
 ger_external.25.t:0 "The First Negotiations are a Success!"
 ger_external.25.d:0 "The French Government has allowed us access to the Rhineland as we had hoped!"
 ger_external.25.a:0 "The Rhineland is now completely united with Germany!"
 
 ger_external.26.t:0 "The First Negotiations are a Success!"
 ger_external.26.d:0 "The French Government has allowed us access to the East Bank of the Rhine! While it is not all that we hoped for, it is at least something. The French say that they will consider giving us full access in about six months."
 ger_external.26.a:0 "At least Düsseldorf is available again."
 
 ger_external.27.t:0 "The First Negotiations are a Failure!"
 ger_external.27.d:0 "The French Government has denied our request to walk our troops back into the Rhineland. While this is a problem, they did say that they were open to more negotiations..."
 ger_external.27.a:0 "We must keep trying!"
 
 ger_external.28.t:0 "Review of the Rhineland"
 ger_external.28.d:0 "The Germans have remained peacefully behind the new lines we set behind the Rhineland. It seems as though we can trust them. Should we allow them full access to the Rhineland?"
 ger_external.28.a:0 "We shall allow this!"
 ger_external.28.b:0 "We cannot trust a German!"
 
 ger_external.29.t:0 "Back to the Rhineland!"
 ger_external.29.d:0 "The French have now allowed us to return to the Rhineland! We should forever be grateful to our French Friends!"
 ger_external.29.a:0 "Germany is now completely free!"
 
 ger_external.30.t:0 "The French do not allow us back into the Rhineland"
 ger_external.30.d:0 "The French have sent us a message saying that they would like us to hold off from moving into the Rhineland some more. They have betrayed us!"
 ger_external.30.a:0 "We will try to gain more of France's trust."
 ger_external.30.b:0 "We cannot trust a Frenchman! Move back in anyways!"
 
 ger_external.31.t:0 "Germany Remilitarizes Anyways"
 ger_external.31.d:0 "The Germans have marched back into the Rhineland despite our review! The Germans feel that they are strong and we are weak!"
 ger_external.31.a:0 "We have failed!"
 
 ger_external.32.t:0 "Germany asks for Eupen"
 ger_external.32.d:0 "Ever since we took Eupen-Malmédy from Germany in the Great War, they have shown interest in re-aquiring the region. They have come to us today with a new proposal: we would give them their territory back, and they would defend us from attack. While we are interested in peace with Germany, should we sign the treaty?"
 ger_external.32.a:0 "Of course! We look forwards to this new partnership."
 ger_external.32.b:0 "Defend us? From what?"
 
 ger_external.33.t:0 "Eupen-Malmedy is ours!"
 ger_external.33.d:0 "The Belgians have seen fit to give us Eupen-Malmedy. Now, however, if they are attacked, we are obligated to come to their aid!"
 ger_external.33.a:0 "But more territory has come home to [GER.GetNameDef]!"
 
 ger_external.34.t:0 "The Belgian Response"
 ger_external.34.d:0 "The Belgians have responded to our proposal with scorn. According to them, there is no threat for us to defend them from. Therefore, they see no reason to give us Eupen-Malmedy back."
 ger_external.34.a:0 "Their arrogance knows no bounds!"
 
 ger_external.35.t:0 "The Alsace Plebiscite"
 ger_external.35.d:0 "The [GER.GetAdjective] leader, [GER.GetLeader], has asked us to hold a plebiscite in Alsace to determine the future of the region. Should the Alastians vote in favor of becoming a German territory, we would cede the province to them. But if they vote to remain French, then the Germans promise to respect the results, and more importantly, our borders. Should we allow this plebiscite to happen?"
 ger_external.35.a:0 "We agree to this proposal?"
 ger_external.35.b:0 "Alsace has always been, and will always be, French!"
 
 ger_external.36.t:0 "Alsace votes to go with Germany"
 ger_external.36.d:0 "The population of Alsace has voted to go with the Germans. As such, German troops and administration has started to move in, while French personnel are leaving the area. We hope that this would only serve to enhance relations between our countries."
 ger_external.36.a:0 "The people have made their choice."
 
 ger_external.37.t:0 "Elsaß has returned!"
 ger_external.37.d:0 "The people of Elsaß have voted to return to Germany, it's righful owner. Our administration has moved into the region, and we can now use this as a propaganda tool, how our diplomats outmaneuvered the Frenchmen into giving us our rightful territory back at zero cost to us!"
 ger_external.37.a:0 "We have triumphed!"
 
 ger_external.38.t:0 "France Denies the Plebiscite"
 ger_external.38.d:0 "The French have denied us our requested Plebiscite! They claim that there is no need; that most of the Alastians don't identify with Germany, so there would be no point. Should we try and fight the French? Or should we maintain peace for the sake of friendship?"
 ger_external.38.a:0 "The French will pay for their insolence!"
 ger_external.38.b:0 "We must focus on the true enemy for now."
 
 ger_external.39.t:0 "Alsace decides to stay with France"
 ger_external.39.d:0 "The Alastians have decided that they would rather stay as part of our nation than part of the German Nation. It seems like the Alastians identify more with the French than with the Germans."
 ger_external.39.a:0 "And our territory remains intact"
 
 ger_external.40.t:0 "Alsace decides to stay with France"
 ger_external.40.d:0 "The Alastians have decided that they would rather stay as part of the French state than part of the German Nation. While normally, we would fight this injustice, we have to abide by the terms of the agreement. We shall respect France's territorial borders."
 ger_external.40.a:0 "For Now..."
 
 ger_external.41.t:0 "Hans Frank Threatens Austria"
 ger_external.41.d:0 "Bavarian Minister of Justice Hans Frank has made a speech threatening [AUS.GetNameDef] with invasion due to their Anti-National Socialist actions. Although no German units are prepared to follow through, it at least shows that we are willing to take action. However, this still may not have been the right idea."
 ger_external.41.a:0 "Our military is not back yet."
 
 ger_external.42.t:0 "Austria Threatened!"
 ger_external.42.d:0 "The Bavarian Minister of Justice, Hans Frank, has spoken up about invading Austria in response to our Anti-National Socialist policies. These threats are clearly empty, but perfectly establish German Foreign Policy Goals."
 ger_external.42.a:0 "Empty Threats, but Threats Nonetheless."
 AUS_hans_frank_threaten: "Hans Frank threatened us"
 
 ger_external.43.t:0 "Hans Frank's Tour"
 ger_external.43.d:0 "Hans Frank has come to Austria to tour the country and give speeches. Although he behaved himself in Vienna, in Graz he openly spoke against the Austrian State. We cannot tolerate this kind of agitation. What should we do with him?"
 ger_external.43.a:0 "Deport him back to Germany!"
 ger_external.43.b:0 "Let him Speak."
 AUS_hans_frank_agitated: "Hans Frank agitated agitated against us"
 
 ger_external.44.t:0 "Hans Frank Deported from Austria"
 ger_external.44.d:0 "Hans Frank's Tour of Austria has gone awry, as he took the opportunity to speak against the Austrian Government. Not wanting to take any risks, Austrian authorities have deported him."
 ger_external.44.a:0 "That Fool!"
 AUS_hans_frank_deported: "Deported Hans Frank"
 
 ger_external.45.t:0 "Fridolin Glass and His Unit"
 ger_external.45.d:0 "Commander Fridolin Glass of the Austrian SS has subordinated his unit, the Vienna SS-Standarte 89, directly to the SS in Berlin, breaking away from the SA-Oberabschnitt XI in Munich. This has only served to exacerbate tensions between the SA and the SS."
 ger_external.45.a:0 "We will watch Commander Glass"
 
 ger_external.46.t:0 "A Putsch in Austria?"
 ger_external.46.d:0 "Commander Fridolin Glass, the SS commander who notoriously broke from his SA Command earlier this year, has come together with Hauptschulungsleiter (Main Facilitator) Otto Wächter, Stabsleiter der Landesleitung Rudolf Weydenhammer, SS-Oberführer Alfred Rodenbücher and SA-Standartenführer Hanns Rauter to plan a coup against the Austrian Government. Such a coup would replace the current Austrian Leadership with a National Socialist leadership, which would then announce the annexation of Austria into Germany. "
 ger_external.46.a:0 "The plan looks like it may work!"
 
 ger_external.47.t:0 "The Austrian Putsch: Approving the Plan"
 ger_external.47.d:0 "Commander Glass and his fellow conspirators have presented the final version of the Austrian Coup Plan to the Führer. The personnel and equipment have been prepared, it is now up to Adolf Hitler to authorize it. Should the plan succeed, Austria will have a government that will work quickly to unite Austia with Germany. Should it fail, we could have a national crisis on our hands..."
 ger_external.47.a:0 "There is little risk; Authorization is Given!"
 ger_external.47.b:0 "The risk is too great."
 GER_Did_Not_Go_through_With_July_Putsch:0 "We did not try to create a Putsch in Austria."
 GER_Did_Do_Putsch:0 "We went through with the Putsch."
 
 ger_external.48.t:0 "The [GetMonth] Putsch!"
 ger_external.48.d:0 "Today, about 150 SS men, disguised as military officers and police, have stormed the Chancellery! Another cell has occupied the Radio-Verkehrs-Aktiengesellschaft station and are inciting National Socialists to revolt. Through all of the fighting, it is clear that the Chancellor has died, but what will happen next?"
 ger_external.48.a:0 "The Army sides with the Putschists!"
 ger_external.48.b:0 "The Army puts down the Revolt!"
 
 ger_external.49.t:0 "The [GetMonth] Putsch is a Success!"
 ger_external.49.d:0 "The old Austrian Government has fallen, and a new state rises in its stead! The new government has already ordered the Austrian Army to stand down, allowing German Soldiers to officially annex the country!"
 ger_external.49.a:0 "We have done it!"
 GER_Anchsluss_done:0 "The Anschluss has been completed."
 
 ger_external.50.t:0 "The [GetMonth] Putsch is a Failure"
 ger_external.50.d:0 "Glass's Plan failed, as the Austrian Army did not turn against the government as he predicted, but actively worked to put down the Putsch. Although the Austrian Chancellor was killed, [AUS.GetNameDef] survived. We could of course, threaten war. The Austrian Government might see annexation as a workable alternative to chaos..."
 ger_external.50.a:0 "Take Advantage of the Situation."
 ger_external.50.b:0 "We are not strong enough yet." 
 GER_Will_Annex_Austria:0 "§RThis will annex Austria into Germany!§!"
 AUS_dolfuss_dies: "§RChancellor Engelbert Dollfuss is murdered§!"
 
 ger_external.51.t:0 "Threats from Germany"
 ger_external.51.d:0 "Adolf Hitler has stated that if we do not back down and allow a National Socialist Government to take power immediately, they will invade! Should we defy their threats, we might be able to call on Italy to defend us. What should we do?"
 ger_external.51.a:0 "We have no choice but to surrender"
 ger_external.51.b:0 "We remain defiant!"
 
 ger_external.52.t:0 "Austria Folds"
 ger_external.52.d:0 "The Austrian Government has agreed to our demands, and a National Socialist Government has already taken it's place. The new government has already ordered the Austrian Army to stand down, allowing German Soldiers to officially annex the country!"
 ger_external.52.a:0 "The Anschluss is complete!"
 
 ger_external.53.t:0 "Austria Calls on Us!"
 ger_external.53.d:0 "The Austrians have called on us to prevent a German Invasion! Although Hitler's Army is weak, the Austrians fear that he can quickly mobilize and threaten their independence. Should we assist them?"
 ger_external.53.a:0 "Of course!"
 ger_external.53.b:0 "We have more important matters to attend to." 
 
 ger_external.54.t:0 "Italy Agrees to Support Us!"
 ger_external.54.d:0 "[ITA.GetNameDef] has agreed to give us military support in the case of German Invasion. With them on our side, this would hopefully be a strong deterrent against Hitler!"
 ger_external.54.a:0 "Thank God for Italy!"
 
 ger_external.55.t:0 "Italy Refuses to Support Us!"
 ger_external.55.d:0 "[ITA.GetNameDef] has frefused to give us support agains the Germans. Whether they are trying to appease Hitler or simply remain out of war, we cannot tell. All we can say, is that they are fools!"
 ger_external.55.a:0 "We shall have to face the Germans Alone!"
 
 GER_Italy_Defends_Austria_Yes:0 "The Austrians also have Italian Support, so a war with Austria would mean a war with Italy as well. "
 GER_Italy_Defends_Austria_No:0 ""
 ger_external.56.t:0 "Austria Remains Defiant!"
 ger_external.56.d:0 "The Austrians have refused to surrender! They have decided to call our bluff. It is now up to us to follow through on our threat or not. [Root.GER_Italy_Defends_Austria]What shall we do?"
 ger_external.56.a:0 "We must Annex Austria Now!"
 ger_external.56.b:0 "We cannot fight just yet."
 
 ger_external.57.t:0 "Germany Backs Down"
 ger_external.57.d:0 "Germany has decided not to infringe on Austrian Sovereignty (yet), so the crisis has been resolved. Life in [Root.GetNameDef] can go back to normal."
 ger_external.57.a:0 "Thank God!"
 
 ger_external.58.t:0 "The Austro-German Agreement"
 ger_external.58.d:0 "The Germans have asked us to be more leinent to the pro-German factions in our nation in return for respecting our sovereignty. This would, in purpose, declare Austria a German nation, and take us out of the Italian sphere of influence. This would greatly anger the Italians. Should we agree to the German proposal?"
 ger_external.58.a:0 "Austria is a German Nation!"
 ger_external.58.b:0 "Austria is an independent nation!"
 
 ger_external.59.t:0 "Austria Leaves our Sphere of Influence"
 ger_external.59.d:0 "We were very happy to have Austria in our sphere, until the Germans came and took them out of it. Austria has been declared to be a German state, and are now more friendly with the Nazis."
 ger_external.59.a:0 "Damn that [GER.GetLeader]!"
 
 ger_external.60.t:0 "Austria Signs the Agreement"
 ger_external.60.d:0 "The Austrians have signed the Austro-German Agreement, meaning pro-German influence in Austria has increased! We are one step closer to bringing Austria into Germany proper!"
 ger_external.60.a:0 "The Anschluss is coming!"
 
 ger_external.61.t:0 "Austria Refuses our Advances!"
 ger_external.61.d:0 "The Austrians have decided that we're not good enough for them. We have tried to normalize relations, but we have completely failed, apparently. They have chosen to stay with the Italians, even though we do not technically recognize their soverignty."
 ger_external.61.a:0 "Eh, we'll march into Vienna at some point!"
 
 ger_external.62.t:0 "The Anschluss"
 ger_external.62.d:0 "Germany has demanded that we submit to them, or face invasion! What should we say?"
 ger_external.62.a:0 "We shall resist the National Socialist Menace!"
 ger_external.62.b:0 "We shall accept the National Socialist demands."
 
 ger_external.63.t:0 "Austria Refuses the Anschluss"
 ger_external.63.d:0 "Our generous offer of annexation was refused by the Austrians. Shall we enforce our terms on them?"
 ger_external.63.a:0 "Austria shall see the error of their ways!"
 ger_external.63.b:0 "We must back down for now."
 
 ger_external.64.t:0 "Austria Accepts"
 ger_external.64.d:0 "Austria has accepted our demands and we are now free to annex the country."
 ger_external.64.a:0 "Austria has come home to the Reich!"
 
 ger_external.65.t:0 "The Munich Conference"
 ger_external.65.d:0 "Today, the Germans presented us with a proposal: That they would annex the German Speaking Areas of Czechoslovakia. This would include the Sudetenland, and give Zalozie (a contested area) to Poland. Should we accept, or risk [This.GetGerKanzler]'s Wrath?"
 ger_external.65.a:0 "In the interests of Peace, we accept the decision."
 ger_external.65.b:0 "Shouldn't the Czechs be here too?"
 
 ger_external.66.t:0 "The Munich Conference"
 ger_external.66.d:0 "Today, the Germans presented us with a proposal: That they would annex the German Speaking Areas of Czechoslovakia. The plan, already approved by Britain, would include the Sudetenland, and give Zalozie (a contested area) to Poland. Should we accept, or risk [This.GetGerKanzler]'s Wrath?"
 ger_external.66.a:0 "In the interests of Peace, we accept the decision."
 ger_external.66.b:0 "Shouldn't the Czechs be here too?"
 
 ger_external.67.t:0 "The Munich Diktat"
 ger_external.67.d:0 "The West has abandoned us! They would allow the Germans to take part of our homeland! We could try to defend our lands, or we could allow the Germans to take their claims, and hope they do no more..."
 ger_external.67.a:0 "We shall accept the terms."
 ger_external.67.b:0 "Czechoslovakia fights! Pravda vítězí!"
 
 ger_external.68.t:0 "The Munich Conference"
 ger_external.68.d:0 "Germany has approached the western powers in Munich about their claims to the Sudetenland. However, [From.GetNameDef] has spoken against their claims, and offer us an alliance. We could try to defend our lands, or we could allow the Germans to take their claims, and hope they do no more..."
 ger_external.68.a:0 "We shall accept the terms."
 ger_external.68.b:0 "Czechoslovakia fights! Pravda vítězí!"

 annex_sudetenland_tt:0 "§CThe Sudetenland will be annexed into the Reich!§!\n§YThe names of the cities in the Sudetenland will be changed to German§!"
 
 ger_external.69.t:0 "Czechoslovakia Accepts"
 ger_external.69.d:0 "[CZE.GetName] has accepted our offer of...protection of the Sudetenland. Maybe more cooperation is to come?"
 ger_external.69.a:0 "Perhaps."
 GER_cze_does_not_surrender:0 "Czechoslovakia does not turn over the Sudetenland"
 
 ger_external.70.t:0 "Czechoslovakia Refuses"
 ger_external.70.d:0 "[CZE.GetName] has refused our offer of...protection of the Sudetenland. Should we try to enforce our demands by force, the General Staff has drawn up Fall Grün, as a plan to invade the Czech lands. Should we invade them?"
 ger_external.70.a:0 "Absolutely!"
 ger_external.70.b:0 "We cannot fight just yet."
 
 GER_hitler_loc:0 "Hitler"
 GER_hugenberg_loc:0 "Hugenberg"
 GER_goerdeler_loc:0 "Goerdeler"
 GER_seldte_loc:0 "Seldte"
 GER_generic_loc:0 "Germany"
 
 ger_external.71.t:0 "The Occupation of Zaolzie"
 ger_external.71.d:0 "With all of the Chaos in Czechoslovakia, we could sneak into Zaolzie and annex it for ourselves."
 ger_external.71.a:0 "Zaolzie Nasze!"
 ger_external.71.b:0 "We had better back down for now."
 
 ger_external.72.t:0 "The First Vienna Award"
 ger_external.72.d:0 "Germany demands that we turn over Southern Slovakia, with its Magyar Minority, over to Hungary. How do we respond?"
 ger_external.72.a:0 "We have no choice but to accept."
 ger_external.72.b:0 "We cannot give any more ground!"
 
 ger_external.73.t:0 "The First Vienna Award"
 ger_external.73.d:0 "Czechoslovakia has accepted Germany's demands to turn over Southern Slovakia to us. Should we accept the territory?"
 ger_external.73.a:0 "Of course!"
 ger_external.73.b:0 "We had better not be aggressors."
 
 ger_external.74.t:0 "The First Vienna Award"
 ger_external.74.d:0 "The Czechoslovak government has refused to turn over southern Slovakia to the Hungarian Government. Should we respond in kind?"
 ger_external.74.a:0 "To War!"
 ger_external.74.b:0 "No, we should not go to war."
 
 ger_external.75.t:0 "The Vienna Crisis"
 ger_external.75.d:0 "Czechoslovakia has refused to turn over Southern Slovakia to us, and Germany has declared war to annex all of the country. Should we join them?"
 ger_external.75.a:0 "Of Course! For Greater Hungary!"
 ger_external.75.b:0 "We must not attack for now."
 
 ger_external.76.t:0 "Germany Demands Annexation"
 ger_external.76.d:0 "Germany has demanded our annexation to the Reich. We ignore their ultimatum and fight for our independence, but the chances for wining a confrontation with Germany are very slim without the help of Great Power like France or Britain. We must accept our fate."
 ger_external.76.a:0 "This is the end of Czechoslovakia"
 
 ger_external.77.t:0 "The Annexation of Czechoslovakia!"
 ger_external.77.d:0 "Czechoslovakia has allowed us to occupy their territory. However, we must now decide what to do with it"
 ger_external.77.a:0 "Set up a protectorate for the Czechs, and a separate satellite state for the Slovaks."
 ger_external.77.b:0 "Set up a protectorate and a satellite, but give Hungary some territory."
 ger_external.77.c:0 "Give Slovakia to Hungary."
 GER_given_carp:0 "Gave us Territory"
 GER_vienna_opinion:0 "First Vienna Award"
 GER_gives_hun_slo:0 "Gave us Slovakia"
 
 ger_external.78.t:0 "The Annexation of Czechoslovakia"
 ger_external.78.d:0 "We can occupy Carpathian Ruthenia, now that Slovakia is a German Satellite. Should we do it?"
 ger_external.78.a:0 "Yes, Absolultely!"
 ger_external.78.b:0 "No, not now."
 
 ger_external.79.t: "The Annexation of Czechoslovakia"
 ger_external.79.d:0 "Germany has offered us the occupation of the entirety of Slovakia. Should we take them up on that offer?"
 ger_external.79.a:0 "For Greater Hungary!"
 ger_external.79.b:0 "No, we should not."
 
 ger_external.80.t:0 "The New Czech Government"
 ger_external.80.d:0 "Now that the Czech lands are a German Subject, they need a new government."
 ger_external.80.a:0 "Alright."
 
 ger_external.81.t:0 "Germany demands Slovenia"
 ger_external.81.d:0 "Germany has demanded that we allow them to occupy Northern Slovenia on account of the German Minority present. Should we allow this insult to our nation?"
 ger_external.81.a:0 "It's only Slovenia"
 ger_external.81.b:0 "No! We must fight!"
 
 ger_external.82.t:0 "Yugoslavia Accepts"
 ger_external.82.d:0 "We are now able to occupy Slovenia. Yugoslavia has escaped our wrath."
 ger_external.82.a:0 "For Now..."
 
 ger_external.83.t:0 "Yugoslavia Insults Us!"
 ger_external.83.d:0 "Yugoslavia has decided that they are too good for us, and aren't letting us occupy their lands! We must come for what we deserve!"
 ger_external.83.a:0 "To War!"
 
 ger_external.84.t:0 "Operation Panzerfaust"
 ger_external.84.d:0 "Germany has launched a coup attempt against [HUN.GetLeader]! Members of the Pro-National Socialist Arrow Cross Party and disguised SS troops have marched on Budapest and are storming the Capital! What should we do?"
 ger_external.84.a:0 "Surrender to the Rebels, to prevent bloodshed."
 ger_external.84.b:0 "Send in the army and fight!"
 
 ger_external.85.t:0 "Operation Panzerfaust - Success!"
 ger_external.85.d:0 "The Arrow Cross Party, with the help of some of our Agents, managed to kill [HUN.GetLeader] and take over the government. We can either allow the Hungarians to remain independent, or force them to become our satellite, so that they do not interfere with the creation of our New Order."
 ger_external.85.a:0 "Hungary will be our satellite."
 ger_external.85.b:0 "Hungary may remain independent."
 
 ger_external.86.t:0 "Operation Panzerfaust - Failure"
 ger_external.86.d:0 "The Arrow Cross Party, with some of our Agents, was stopped from taking over the Hungarian Government, meaning our operation was a failure."
 ger_external.86.a:0 "Okay."
 
 ger_external.87.t:0 "Germany Demands our Annexation"
 ger_external.87.d:0 "The German government claims that our lands are an essential part of Greater Germany due to shared Swiss-German Heritage, and that we must surrender our territory to them. If we do not, the Germans may violate our neutrality. What should we do?"
 ger_external.87.a:0 "We shall submit to their demands"
 ger_external.87.b:0 "We must resist!"
 
 ger_external.88.t:0 "Switzerland Submits!"
 ger_external.88.d:0 "The Swiss government has surrendered to us, meaning a lot of lives have been spared! Now we can either annex the whole of it, or offer France and Italy some land corresponding to ethnic composition."
 ger_external.88.a:0 "Hooray!"
 ger_external.88.b:0 "Let us partition Switzerland with our allies!"
 
 ger_external.89.t:0 "Switzerland Fights!"
 ger_external.89.d:0 "Switzerland has rejected our offer of Union. We must invade to set things streight!"
 ger_external.89.a:0 "Switzerland shall come home, whether it wants to or not!"
 
 ger_external.90.t:0 "Germany Offers us Swiss Land"
 ger_external.90.d:0 "Because Graubünden and Ticino (Swiss Cantons) are not composed of Swiss-Germans, [GER.GetNameDef] offers us these lands, seeing as they are Swiss-Italian. Should we accept these territories, or leave it to the Germans?"
 ger_external.90.a:0 "These Lands are Italian Now."
 ger_external.90.b:0 "We had better not risk violating Swiss Neutrality."
 
 ger_external.91.t:0 "Germany Offers us Swiss Land"
 ger_external.91.d:0 "Because Romandie is not composed of Swiss-Germans, [GER.GetNameDef] offers us a large swath of land in Western Switzerland. Should we accept the Swiss-French into [FRA.GetNameDef], or not?"
 ger_external.91.a:0 "Better under us than the Germans."
 ger_external.91.b:0 "We don't want to infringe on Swiss Neutrality."
 
 ger_external.92.t:0 "The Second Vienna Award"
 ger_external.92.d:0 "The Germans have come to our government, and demanded that we turn over Northern Transylvania to Hungary. Shall we accept their demands?"
 ger_external.92.a:0 "Very well, we have no choice"
 ger_external.92.b:0 "No! We Shall Fight!"
 
 ger_external.93.t:0 "The Second Vienna Award"
 ger_external.93.d:0 "Romania has agreed to give Northern Transylvania to us, at the Germans' request."
 ger_external.93.a:0 "That's good."
 
 ger_external.94.t:0 "The Second Vienna Award"
 ger_external.94.d:0 "Romania has refused to turn over Northern Transylvania to the Hungarians. Shall we invade on the Hungarians' behalf?"
 ger_external.94.a:0 "Yes"
 ger_external.94.b:0 "No"
 
 ger_external.95.t: "The Vienna Crisis"
 ger_external.95.d:0 "Germany has gone to war with Romania to secure Transylvania for us. Shall we assist them?"
 ger_external.95.a:0 "Yes, we shall"
 ger_external.95.b:0 "No, we shall not."
 
 ger_external.96.t:0 "Germany Offers Alliance"
 ger_external.96.d:0 "[GER.GetNameDef] has offered to extend their alliance to us. They would come to our aid in offensive wars as well as defensive wars. We could make great use of this..."
 ger_external.96.a:0 "We will sign the treaty!"
 ger_external.96.b:0 "We want to maintain neutrality."
 
 ger_external.97.t:0 "Romania Joins Our Alliance!"
 ger_external.97.d:0 "The Romanian government has seen fit to join our alliance. Now, we will come to aid each other in our wars. They will be a valuable ally against the Bolsheviks!"
 ger_external.97.a:0 "We get their oil, as well."
 
 ger_external.98.t:0 "Romania Refuses To Join Our Alliance!"
 ger_external.98.d:0 "The Romanian government has seen fit to maintain their neutrality. Even after all we have done for them, they do not want to do anything for us!"
 ger_external.98.a:0 "We'll see about that, when they get rolled over by Russian Tanks."
 
 ger_external.99.t:0 "Formal Alliance With Germany"
 ger_external.99.d:0 "The German Government has approached us with an offer of alliance. While we are already technically allies, Germany would like us to enter their faction, probably to use us against the Bolsheviks. However, if we accept we would have a nearly free hand in the Balkans. Should we accept?"
 ger_external.99.a:0 "Yes, we should."
 ger_external.99.b:0 "No, not now."
 
 ger_external.100.t:0 "Hungary Joins The [GER.GetFactionName]"
 ger_external.100.d:0 "We are now formally allied to the Hungarians!"
 ger_external.100.a:0 "Hooray! Death to the Bolsheviks!"
 
 ger_external.101.t:0 "Hungary Does Not Join Our Faction"
 ger_external.101.d:0 "The Hungarians have decided to remain outside of any faction for now. However, they do not spurn our influence."
 ger_external.101.a:0 "Very Well."

 ger_external.105.t:0 "The Danish-German Treaty"
 ger_external.105.d:0 "Germany has demanded that we allow them land and sea access through our country. In exchange, they offer to give us a promise that if we are attacked, they would come to our aid. Should we accept this proposal?"
 ger_external.105.a:0 "We could use the protection."
 ger_external.105.b:0 "We don't need it!"
 
 ger_external.106.t:0 "Denmark Accepts Our Demands"
 ger_external.106.d:0 "The Danes have allowed us to move through their territory and use their naval bases for our fleets. In exchange, we have guaranteed their independence."
 ger_external.106.a:0 "We are grateful."
 
 ger_external.107.t:0 "Denmark Refuses Our Demands"
 ger_external.107.d:0 "The Danes are preventing us from moving through their territory. Should we go to war to force our will on them?"
 ger_external.107.a:0 "Yes!"
 ger_external.107.b:0 "No."
 
 ger_external.108.t:0 "Germany Demands Access"
 ger_external.108.d:0 "Germany has demanded that we allow them land and sea access through our country. Should we stand strong, or let them through?"
 ger_external.108.a:0 "Let Them Through..."
 ger_external.108.b:0 "Stand Strong!"
 
 ger_external.109.t:0 "Norway Accepts Our Demands"
 ger_external.109.d:0 "The Norwegians have allowed us to move through their territory and use their naval bases for our fleets."
 ger_external.109.a:0 "We are grateful."
 
 ger_external.110.t:0 "Norway Refuses Our Demands"
 ger_external.110.d:0 "The Norwegians are preventing us from moving through their territory. Should we go to war to force our will on them?"
 ger_external.110.a:0 "Yes!"
 ger_external.110.b:0 "No."

 ger_external.111.t:0 "Germany Offers Alliance"
 ger_external.111.d:0 "The Germans have offered to help us in our fight against our Enemies, namely the Soviets. Should we accept their offer?"
 ger_external.111.a:0 "Yes, we should!"
 ger_external.111.b:0 "No, we should not..."
 
 ger_external.112.t:0 "Finland Joins Our Alliance"
 ger_external.112.d:0 "The Finns have seen that an alliance with us is the superior choice. They have joined the [GER.GetFactionName], and we will cooperate to fight the Russians!"
 ger_external.112.a:0 "We are grateful."
 
 ger_external.113.t:0 "Finland Refuses Our Offer"
 ger_external.113.d:0 "While the Finns could use our help fighting the Soviets, they instead seek to maintain neutrality. Should we force them into our sphere, or leave them alone."
 ger_external.113.a:0 "Finland will know the Force of Germany!"
 ger_external.113.b:0 "They are not our concern right now."
 
 ger_external.114.t:0 "Germany Offers a Non-Aggression Pact"
 ger_external.114.d:0 "[GER.GetNameDef] has a proposal for us: They would recognize our borders if we were to end the Customs War. Should we accept?"
 ger_external.114.a:0 "To Protect our borders, anything."
 ger_external.114.b:0 "We do not deal with Snakes!"
 
 ger_external.115.t:0 "Poland Signs the Non-Aggression Pact!"
 ger_external.115.d:0 "The Poles have signed the Non-Aggression Pact we offered them. This buys us time to prepare for war!"
 ger_external.115.a:0 "We shall be victorious once more!"
 
 ger_external.116.t:0 "Poland Refuses the Non-Aggression Pact!"
 ger_external.116.d:0 "The Poles have refused to sign the Non-Aggression Pact we offered them. They're probably on to us!"
 ger_external.116.a:0 "They know we're coming, but it won't stop us..."
 
 ger_external.117.t:0 "Germany Offers to Renew the Non-Aggression Pact"
 ger_external.117.d:0 "The German Foreign Minister has presented us with a new offer. If we wanted to maintain our non-aggression pact, we would have to let [GER.GetNameDef] march into Danzig! Should we allow this for the sake of peace?"
 ger_external.117.a:0 "We might as well, to give us more time to re-arm."
 ger_external.117.b:0 "The Germans will win unless we give them no room to expand! We Refuse!"
 
 ger_external.118.t:0 "Poland Renews the Non-Aggression Pact"
 ger_external.118.d:0 "The Poles have allowed us to take Danzig in exchange for a new Non-Aggression pact. This will allow us to spend more time re-arming."
 ger_external.118.a:0 "Excellent!"
 
 ger_external.119.t:0 "Poland Does Not Renew the Non-Aggression Pact"
 ger_external.119.d:0 "Poland has not Renewed the Non-Aggression Pact because they do not want to let us take Danzig. Very well, the Pact is Cancelled!"
 ger_external.119.a:0 "We can go to war soon!"
 
 ger_external.120.t:0 "A Guarantee from Germany?"
 ger_external.120.d:0 "Germany has sent us an offer: in exchange for military access, Germany has offered to defend our indepdendence. Should we accept their offer?"
 ger_external.120.a:0 "An Alliance with Germany? Sure."
 ger_external.120.b:0 "Germany is a snake! We Refuse!"
 
 ger_external.121.t:0 "Poland Accepts Guarantee"
 ger_external.121.d:0 "The Polish Government has accepted our informal alliance. Now, we can better defend Europe from Bolshevism!"
 ger_external.121.a:0 "Hooray for Cooperation!"
 
 ger_external.122.t:0 "Poland Declines Guarantee"
 ger_external.122.d:0 "The Poles do not trust us enough to accept an informal alliance. Now, all we can do is declare war on them."
 ger_external.122.a:0 "Shame."
 GER_Poland_Accepts_Guarantee:0 "Poland Accepted our Guarantee"
 
 ger_external.126.t:0 "Danzig for Slovakia"
 ger_external.126.d:0 "The Germans, with their occupation of Czechoslovakia, have given us a new offer: They would give us Slovakia in exchange for Danzig, Westprußen, and Poznan. Slovakia has a higher population than the land we would give away. Should we accept their offer?"
 ger_external.126.a:0 "That is acceptable?
 ger_external.126.b:0 "Poland shall not give an inch!"
 
 ger_external.127.t:0 "Poland Accepts The Trade!"
 ger_external.127.d:0 "Poland has decided to give us our claims in exchange for Slovakia. This is an excellent deal for both sides!"
 ger_external.127.a:0 "Together, Europe will be ours!"
 
 ger_external.128.t:0 "Poland Declines The Trade"
 ger_external.128.d:0 "The Poles have decided that Slovakia is not worth giving up their coastline. While we get to keep Slovakia, we would have prefered Danzig."
 ger_external.128.a:0 "Europe will be ours, either way."
 
 ger_external.129.t:0 "Anti-Comintern Pact"
 ger_external.129.d:0 "The Germans have begun a multi-national effort to denounce the Comintern as an anti-nation organization. Should we join the pact?"
 ger_external.129.a:0 "The Comintern is the death of society!"
 ger_external.129.b:0 "We would rather not get involved."
 
 ger_external.130.t:0 "Anti-Soviet Pact"
 ger_external.130.d:0 "The Germans have begun an effort to amend the Anti-Comintern Pact to directly implicate the Soviet Union as the main enemy. All members of the pact will be mutually responsible for defense against the Soviets. Should we join the pact?"
 ger_external.130.a:0 "Bolshevism would be the death of us all if we do not get involved!"
 ger_external.130.b:0 "We would rather not get involved."
 
 ger_external.132.t:0 "The Anti-Soviet Pact is Activated"
 ger_external.132.d:0 "The Bolsheviks have attacked one of the members of the Anti-Soviet Pact! It is stated by the treaty that we must join the Pact in fighting off the Red Menace. Should we get involved?"
 ger_external.132.a:0 "We must defend, as the treaty states!"
 ger_external.132.b:0 "We would rather not get involved."
 
 ger_external.136.t:0 "Unholy Alliance"
 ger_external.136.d:0 "Germany offers us an alliance. Even though the Fascists do not like the Communists, We can work together to fight the filthy Capitalists, and resolve our differences later. Should we go through with it?"
 ger_external.136.a:0 "Of course. Together, Capitalism shall be defeated!"
 ger_external.136.b:0 "We cannot trust the Germans!"
 
 ger_external.137.t:0 "The Soviet Union Accepts the Alliance!"
 ger_external.137.d:0 "The Soviet Government has accepted our proposal, and has agreed to join the [GER.GetFactionName]. Together, Berlin-Moscow will conquer all!"
 ger_external.137.a:0 "Death to Capitalism, Hooray for Socialism, both National and International!"
 
 ger_external.138.t:0 "The Soviet Union Declines the Alliance!"
 ger_external.138.d:0 "The Soviet Government has denied our proposal, because they do not trust us! We will see how their arrogance has paid off when we occupy Moscow!"
 ger_external.138.a:0 "International Socialism will fall, and National Socialism will rise!"
 
 ger_external.139.t:0 "Germany accepts [SOV.GetNameDef] into [GER.GetFactionName]"
 ger_external.139.d:0 "The Germans, a fascist country, has accepted the Communist Soviet Union into our faction. Will we work with these Bolsheviks and their apologists, or go out on our own?"
 ger_external.139.a:0 "We will leave the Germans to their fate!"
 ger_external.139.b:0 "We now have a greater chance of defeating our enemies!"
 
 ger_external.140.t:0 "Fulfiling the Pact with the Soviets!"
 ger_external.140.d:0 "We currently own land that the Soviets claim as their own. Should we allow them to occupy it?"
 ger_external.140.a:0 "Yes, we must do our part."
 ger_external.140.b:0 "And give up this land? Of course not!"
 
 ger_external.141.t:0 "Germany Gives Land As Promised"
 ger_external.141.d:0 "The Germans have occupied land that they have agreed to give to us, and they are letting our soldiers occupy it."
 ger_external.141.a:0 "Long Live the Pact!"
 
 ger_external.142.t:0 "Germany Betrays the Pact"
 ger_external.142.d:0 "The Germans have decided not to give us the land that we deserved! The Pact is Broken!"
 ger_external.142.a:0 "The Germans will see the error of their ways."
 
 ger_external.143.t:0 "Fulfiling the Pact with the Germans!"
 ger_external.143.d:0 "We currently own land that the Germans claim as their own. Should we allow them to occupy it?"
 ger_external.143.a:0 "Yes, we must do our part."
 ger_external.143.b:0 "And give up this land? Of course not!"
 
 ger_external.144.t:0 "The Soviet Union Gives Land As Promised"
 ger_external.144.d:0 "The Soviet Union have occupied land that they have agreed to give to us, and they are letting our soldiers occupy it."
 ger_external.144.a:0 "Long Live the Pact!"
 
 ger_external.145.t:0 "The Soviets Betray the Pact"
 ger_external.145.d:0 "The Soviets have decided not to give us the land that we deserved! The Pact is Broken!"
 ger_external.145.a:0 "They will see the error of their ways."
 
 ger_external.146.t:0 "Ultimatum from Germany!"
 ger_external.146.d:0 "Germany has demanded that we turn over the Klaipėda region to them immediately. As the land was part of the German Empire, it has a German minority, and their soldiers are marching towards ours as we speak! What should we do?"
 ger_external.146.a:0 "Give them the land."
 ger_external.146.b:0 "We shall resist!"
 
 ger_external.147.t:0 "Memelland Returns!"
 ger_external.147.d:0 "The [From.GetAdjective] Government has decided to returned Memelland to the Reich! Their economy will suffer, but what do we care?"
 ger_external.147.a:0 "Heim Ins Reich!"

 ger_external.148.t:0 "[From.GetNameDef] Refuses our Ultimatum!"
 ger_external.148.d:0 "The [From.GetAdjective] Government have decided to deny our people their return to their homeland! We must come and take them by force!"
 ger_external.148.a:0 "They know what the alternative is!"
 
 ger_external.149.t:0 "Offer from Germany"
 ger_external.149.d:0 "Germany has offered us an alliance if we give them the Klaipėda region. What should we do?"
 ger_external.149.a:0 "Protection from the Russians is always welcome."
 ger_external.149.b:0 "We shall resist!"
 
 ger_external.150.t:0 "Offer from Germany"
 ger_external.150.d:0 "Germany has offered us an alliance against the Soviet Union. Should we accept?"
 ger_external.150.a:0 "Protection from the Russians is always welcome."
 ger_external.150.b:0 "We shall resist becoming part of the German Sphere."
 
 ger_external.151.t:0 "[FROM.GetNameDef] joins our alliance!"
 ger_external.151.d:0 "The [GER.GetFactionName] has a new Member!"
 ger_external.151.a:0 "Together, we will take down the Bolsheviks!"
 
 ger_external.152.t:0 "[FROM.GetNameDef] refuses our alliance!"
 ger_external.152.d:0 "We have been refused! We must go to war to prove our superiority!"
 ger_external.152.a:0 "[GER.GetNameDef] expands!"
 
 ger_external.153.t:0 "Germany Offers Alliance"
 ger_external.153.d:0 "The Germans have offered us an alliance in order to widen the front with the Russians. Should we accept this offer?"
 ger_external.153.a:0 "We should, maybe we can get some land this way."
 ger_external.153.b:0 "We would rather maintain our neutrality."
 
 ger_external.154.t:0 "Turkey joins our Alliance"
 ger_external.154.d:0 "[TUR.GetNameDef] have decided to join us in our war against the Russians. With a new front we can catch the [SOV.GetNameDef] off guard and take the Caucuses Oil Fields!"
 ger_external.154.a:0 "Together we are strong!"
 
 ger_external.155.t:0 "Turkey Refuses our Alliance"
 ger_external.155.d:0 "The Turks have refused our offer of alliance, prefering to maintain their neutrality. We will have to face the Soviets on one front, now."
 ger_external.155.a:0 "Damn!"
 
 ger_external.156.t:0 "Alliance with Germany?"
 ger_external.156.d:0 "The German Ambassador to [ENG.GetNameDef] has visited 10 Downing Street to lobby the Prime Minister. He has been campaigning very hard to convince the government to sign a treaty of alliance with [From.GetNameDef]. According to the treaty, Britain and Germany would have to mutually defend one another from attack and assist in offensive conflits if asked to. While this would help us form a united front against Communist Regimes in Europe, it would alienate the French and possibly the United States. Shall we allow Germany into the Allies?"
 ger_external.156.a:0 "Against Bolshevism, we must take every precaution!"
 ger_external.156.b:0 "Germany is the Real Threat!"
 
 ger_external.157.t:0 "Britain Accepts Our Offer"
 ger_external.157.d:0 "The United Kingdom has accepted our offer of alliance. We are now part of their faction, so if any member of the Allies are attacked, we should expected to come to their aid, and vice versa."
 ger_external.157.a:0 "Germany and the United Kingdom will together conquer the world!"
 
 ger_external.158.t:0 "Britain Rejects Our Alliance"
 ger_external.158.d:0 "The United Kingdom has rejected our offer of alliance. We have been left alone, despite intense lobbying by our ambassador."
 ger_external.158.a:0 "Britain will learn of their folly in time."
 
 ger_ss.1.t:0 "Himmler buys Wewelsburg"
 ger_ss.1.d:0 "Himmler has just bought Wewelsburg, a large castle in Westphalia, to serve as an SS training and ceremony centre."
 ger_ss.1.a:0 "Alright."
 
 ger_ss.2.t:0 "Himmler Establishes the First Junkerschule"
 ger_ss.2.d:0 "In order to better indoctrinate SS trainees with Himmler's ideology - as well as train them for service within the SS - Himmler has established \"Junker Schools\" to provide this training. These future officers learn how to be an effective officer, some combat skill, economic skill, but are primarily indoctrinated with National Socialist ideology. While the first of these has been established in Bad Tölz, Himmler plans to create a second one in Braunschweig."
 ger_ss.2.a:0 "If this benefits the Regime, then alright."
 
 ger_ss.3.t:0 "Heinrich Himmler Founds Nordland-Verlag"
 ger_ss.3.d:0 "Nordland-Verlag is a newly-founded SS-owned corporation. It is meant to publish SS propaganda. This should be interesting to watch, as Himmler has never conducted or managed a business in his life."
 ger_ss.3.a:0 "Interesting."
 
 ger_ss.4.t:0 "Himmler Acquires Allach Porcelain"
 ger_ss.4.d:0 "Using State Funds, Himmler has bought a Porcelain manufactory in Bavaria. He intends to use it to create art and memorabillia based on SS-Ideology."
 ger_ss.4.a:0 "Why does he need this, exactly?"
 
 ger_ss.5.t:0 "Himmler Transfers Administration of SS Businesses"
 ger_ss.5.d:0 "The Verwaltung und Wirtschafthauptamt Hauptamt (Administration and Business Office), managed by Oswald Pohl, will be taking over SS businesses, according to Himmler. This seems to be necessary because, as was a surprise to little in the Government, these businesses are not profitable."
 ger_ss.5.a:0 "He's just not going to learn, is he?"
 
 ger_ss.6.t:0 "Oswald Pohl creates the Deutsche Wirtschaftsbetriebe GmbH"
 ger_ss.6.d:0 "Due to the lack of training of SS managers, most SS businesses are at best barely profitable. To improve organization, the head of the SS Administration and Business Office, Oswald Pohl, has created German Businesses Limited, an umbrella corporation for these businesses."
 ger_ss.6.a:0 "Okay?"
 
 ger_ss.7.t:0 "Himmler Creates the Wirtscahfts- und Verwaltungshauptamnt"
 ger_ss.7.d:0 "Still not satisfied with his failed business ventures, Himmler has consolidated all of Oswald Pohl's ofices into one, the SS Main Economic and Administrative Office. All Administrative and Economic affairs will now go through this one office."
 ger_ss.7.a:0 "Another waste of time."
 
 ger_ss.8.t:0 "The SS and Mineral Water"
 ger_ss.8.d:0 "Although the SS literally has nearly 200 failed holding companies currently (still operating at a loss, mind you), Himmler has decided that the SS must take on a new challenger: The Mineral Water Industry. It has come to our attention that the SS now owns Seventy-Five Percent of all the Mineral Water Production in Germany."
 ger_ss.8.a:0 "So now the Mineral Water has joined a cult, essentially?"
 
 ger_ss.9.t:0 "Himmler Founds Ahnenerbe"
 ger_ss.9.d:0 "Himmler has created the Ancestral Heritage Organization as an umbrella agency to organize over fifty organizations. The purpose of these organizations is to find scientific evidence for Himmler's Mystic Racial Theories. Even some of the leadership of the Regime is thinking that maybe he's going too far."
 ger_ss.9.a:0 "This could perhaps be useful in propaganda, maybe."
 
 ger_ss.10.t:0 "The SS begins Anti-Religious Training"
 ger_ss.10.d:0 "It is no secret that our government sees religion as something to be controlled or eliminated, lest it pose a risk to our power. The SS has begun training their members to renounce Christianity, and have increased their attempts to push Himmler's Neo-Paganism on their trainees. They go so far as to have made-up wedding ceremonies and celebrations of the winter solstice."
 ger_ss.10.a:0 "Um...Alright?"
 
 ger_ss.11.t:0 "Himmler Expands SS Courts"
 ger_ss.11.d:0 "Although the Hauptamt SS-Gericht has existed for several years now, Himmler has increased funding for the SS Court Main Office in order to find and prosecute enemy agents and disloyal sabetouers."
 ger_ss.11.a:0 "Best of Luck?"
 
 ger_ss.12.t:0 "The Wehrmacht Demands a Cap on SS Recruitment"
 ger_ss.12.d:0 "Representatives of the Wehrmacht Leadership have asked us to place a cap on the SS's recruitment. They feel that if left unchecked, the SS could rise to be a force dangerous to both the German Military and the current Regime. Should we agree to their request?"
 ger_ss.12.a:0 "This seems to be the right thing to do."
 ger_ss.12.b:0 "It'll be fine if we don't."
 
 GER_military_coup_possible_tt:0 "If we do not sharply decrease military influence soon, we will face a military coup."
 
 GER_Called_Engels:0 "Friedrich Engels"
 GER_Called_Hindenburg:0 "Hindenburg"
 ger_flavor.1.t:0 "The [Root.GER_Name_Of_Airship] Disaster"
 ger_flavor.1.d:0 "Today, one of our airships, the LZ 129 [Root.GER_Name_Of_Airship] was destroyed while attempting a landing at Naval Air Station Lakehurst in New Jersey, USA. As it was docking with its designated mooring mast, a fire broke out on the port side as the wind changed and the ship had to change ballast configuration. The hydrogen in the airship soon ignited, bringing the [Root.GER_Name_Of_Airship] down in a firey blaze. All in all, 36 people died."
 ger_flavor.1.a:0 "A terrible tragedy."
 
 ger_flavor.2.t:0 "The [Root.GER_Name_Of_Airship] Incident"
 ger_flavor.2.d:0 "LZ 129 [Root.GER_Name_of_Airship] was almost destroyed today when mooring in New Jersey, USA. When approaching its mast at Naval Air Station Lakehurst, the wind suddenly changed direction, which could have caused a collision. Thankfully, the captain and the crew were able to adjust for the error, preventing any sort of disaster."
 ger_flavor.2.a:0 "Thankfully, everyone is alright."

 ger_flavor.31.t:0 "Launch of the Hindenburg"
 ger_flavor.31.desc:0 "In a unique feat of engineering, Germany has completed the maiden flight of the airship Hindenburg. At over 800 feet long, it is the largest aircraft in the history of world. The Zeppelin left from Friedrichshafen and arrived at the Lakehurst air station just outside of New York 61 hours later, on the morning of November 3rd. The Zeppelin is widely considered state-of-the-art and the future of transatlantic travel, and its construction began in 1931 under the supervision of Hugo Eckener, the head of the German airship company.\n\nThanks to the purchase of non-flammable Helium gas from the United States, the project was completed ahead of schedule and represents a milestone in airship passenger safety, delivering a propaganda victory to the Nazi regime. The Zeppelin can carry over 70 passengers and 50 crew, and is capable of completing a transatlantic flight from Friedrichshafen to New York in only 53 hours, by far faster than any available ship or flying boat service. The Zeppelin has a restaurant, a piano longue, writing room, promenade and even a smoking room.\n\nThe Hindenburg is scheduled to make regular round-trip flights from Germany to New York City and Rio de Janeiro, and alongside the Graf Zeppelin is meant to form the nucleus of a future fleet of airships which connect the major cities of the world. Though it’s primary purpose is to be a passenger vessel, the Hindenburg has already been scheduled for appearances at Nazi Party rallies and other state-sponsored events, dropping leaflets and broadcasting music, and the government has mandated that both its tail fins be adorned with massive Swastikas."
 ger_flavor.31.a:0 "A marvelous feat of German engineering!"

 ger_flavor.32.t:0 "Launch of the Graf Zeppelin II"
 ger_flavor.32.desc:0 "Capitalizing on the success of the Hindenburg in transatlantic flights, the national German Airship Company has unveiled the newest addition to its airfleet: the Graf Zeppelin II. The airship is built to supplement the aging Graf Zeppelin, which launched in 1928. The Zeppelin is a near-copy of the Hindenburg, and just as large, though it’s newer engines mean it can reach higher top speeds. During the ship’s maiden flight on October 7th, it passed over Nuremburg where it was observed by key members of the Nazi leadership – including Herman Goring - in a celebratory rally.\nThe airship will take over the Hindenburg’s South American routes, and will offer nonstop flights to Buenos Aries, Recife, Rio De Janeiro, Havana, and San Salvador, allowing the Hindenburg to expand it’s Transatlantic service to Toronto and Washington DC. Among the dignitaries which have already booked a flight to the Americas [Graf_II_king_Edward], the actor Hans Olden, as well as Lord Ernest Hamilton.\n\nInternational observers have commented that the successes of the German airship industry have raised the profile of German engineers and aviation technology abroad, and the speed and comparative luxury of the airships has only increased the demand for tickets on both sides of the Atlantic. These developments have generated a consistent stream of international propaganda victories for the Nazi regime, who have increased funding for the company to begin construction on a new generation of airships for transcontinental travel to Asia and Africa."
 ger_flavor.32.a:0 "Old-world luxury meets modern German engineering!"

 ger_flavor.33.t:0 "Launch of the Richthofen"
 ger_flavor.33.desc:0 "In the latest demonstration of its national technological advantages, the German Airship Company has commissioned another Hindenburg-class passenger Zeppelin into service. The Richthofen (LZ 131), named after the famous Great War aviator, represents several improvements over its sister ships; with larger fuel tanks it is capable of going farther without refueling, and climbing to higher altitudes.\nInnovating on experimental designs from during the Great War, the Zeppelin has a docking system so planes can make deliveries of mail and fresh food to the vessel while in flight, and includes a small motion picture theater on board – though the censorship policies of the Nazi government somewhat limits the selection. It expands the reach of the airship service into Asia and has been assigned to make roundtrip flights to Tokyo, with stops in Athens, Istanbul, New Delhi, Bangkok, and Seoul. Already, it has become a favored method of transport for European diplomats and industrialists heading to the far east.\n\nThe continued civilian expenditures for national prestige, however, has worn patience with the company thin in the upper echelons of the Nazi Party. With the deteriorating political situation on the continent, the staff of the Luftwaffe have requested that DELAG’s industrial production be shifted to conventional military armaments. As a result, many of the future plans for a larger fleet of civilian airships have been scrapped, and the development program put on an indefinite hiatus."
 ger_flavor.33.a:0 "Germany’s air supremacy is undisputed!"

 ger_flavor.34.t: "Ludendorff Passes Away"
 ger_flavor.34.desc: "Today, the private clinic "Josephinum" has announced that Erich von Ludendorff has passed away aged 72, from liver cancer.\nThe old general, famous for his role in during the Great War directing Germany's entire military strategy and war effort, was retired in Munich with his second wife. After the war, Ludendorff became a prominent nationalist leader, and a promoter of the stab-in-the-back myth, which posited that Germany's defeat and the settlement reached at Versailles were the result of a treasonous conspiracy by Marxists, Freemasons and Jews. He also became a pagan worshipper of the Nordic god Wotan (Odin) and started believing that war was the \"foundation of human society\", and that military dictatorship was the normal form of government in a society in which every resource must be mobilized. Some close people to him account that after the war, Ludendorff wanted Germany to go to war against all of Europe. These views combined with his notorious anti-semitism led him to co-instigate a pusch with Hitler in 1923. After having been acquitted of all his crimes during his trial in 1924, he ran for the March 1925 presidential election where he only scored a measly 1.1% of the vote, a humiliation for him.\n\nThis resulted in him parting ways with Hindenburg following the latter's victory in the election. Even refusing to stand beside the field marshal at the dedication of the Tannenberg memorial. He launched several abusive attacks on his former superior for not having acted in a \"nationalistic soldier-like fashion\". After retiring he wrote his most famous work, Der totale Krieg (The Total War), where he argued that a nation's entire physical and moral resources should remain forever poised for mobilization because peace was merely an interval in a never-ending chain of wars.\n\nBy the time Hitler was appointed Chancellor, and the Nazis gained power. Ludendorff had already distanced himself from them, with the Nazis doing the same due to Ludendorff's \"eccentric\" conspiracy theories. However, to the dismay of the recently-passed away general's wishes, he will be given a state funeral with the attendance of Führer Adolf Hitler. It's been planned to bury him in the \"Neuer Friedhof\" in Tutzing, Bavaria."
 ger_flavor.34.a: "The warmongering beast is finally dead"
 
 ger_flavor.3.t:0 "Triumph of the Will!"
 ger_flavor.3.d:0 "Triumph des Willens, or Triumph of the Will, a new movie by Leni Riefenstahl, has premiered today! It depicts the Nuremberg Rally of 1934. Although it is blatantly propaganda, it is loved by the party, especially Hitler, and thus it is sure to be a success!"
 ger_flavor.3.a:0 "Hitler himself congratulated Riefenstahl on her work."
 
 ger_flavor.4.t:0 "Olympia"
 ger_flavor.4.d:0 "Olympia, Leni Riefenstahl's new documentary about the 1936 Berlin Olympics has been released in Berlin. It was another success!"
 ger_flavor.4.a:0 "Sure to win awards around the world!"
 
 ger_flavor.5.t:0 "La Habanera"
 ger_flavor.5.d:0 "Detlev Sierck's new movie, La Habanera has premiered today! It features a Swedish woman who gets married on \"Puerto Rico\" (shot on the Canary Islands), who soon realizes her marriage is unhappy. Eventually, she manages to return to Sweden. The film also features National Socialist Propaganda, depicting the United States as the reasons for corruption and suffering on the Island."
 ger_flavor.5.a:0 "A decent watch."
 
 ger_flavor.6.t:0 "Titanic"
 ger_flavor.6.d:0 "Commissioned by Propaganda Minister Joseph Goebbels, this new Epic out of Tobis Films depicts the sinking of the RMS Titanic in 1912. The intent was to show the superiority of German Filmmaking techniques - which uses the SS Cap Arcona as a set and model ships for the sinking scene - and to pin the blame on British Greed. Of course, the German passangers are depicted in a noble manner, as it is National Socialist propaganda.\n\nHowever, it has become clear that the film must not run in Germany, as the scene of the sinking itself is too similar to the situation on the homefront, as it looks like civilians scrambling during a bombing raid. And though it is being shown outside of Germany, it is clear that the film will not be successful."
 ger_flavor.6.a:0 "Four Million Reichsmarks Wasted."
 
 ger_flavor.7.t:0 "Elections!"
 ger_flavor.7.d:0 "Elections called by Adolf Hitler took place today. While other parties were allowed to participate, the elections were far from legitimate, as Sturmabteilung thugs attacked the homes and offices of known socialists, as well as trade union centers. It was also marred by the arrest of over four thousand communists, including KPD leader Ernst Thälmann. The Communist party of Germany was then outlawed. To make matters worse, Hermann Göring has ordered police to fire on political opponents. Votes were also monitored by the SS, SA, and Stahlhelm, further ensuring a National Socialist majority." 
 ger_flavor.7.a:0 "This is a sham!"
 
 ger_flavor.8.t:0 "Elections of November 1933"
 ger_flavor.8.d:0 "The first \"elections\" called after the consolidation of National Socialist power, this election is unlike any other seen in Germany. Instead of voting for candidates in secret ballots, voters very publically were presented with a National Socialist (or pro-NSDAP \"guest\") candidate, and then voted \"yes\" or \"no\". Of course, anybody who thought about voting against a candidate were threatened, including entire communities. And when the votes were counted, all \"no\" votes were simply declared invalid, and discarded."
 ger_flavor.8.a:0 "Barbaric!"
 
 ger_flavor.9.t:0 "Elections of 1936"
 ger_flavor.9.d:0 "Elections were convened today as required by law. Like the elections of November 1933, the process was made to give the National Socialists all Reichstag seats, and cannot by any means be called a real election. In this election, minorities were prevented from voting, and on one occasion, Rhenish voters were put aboard the airships Graf Zepplin and the Hindenburg as they voted. Naturally, threats of violence and prison undermined most attempts to vote against the Regime, which were registered as invalid votes."
 ger_flavor.9.a:0 "Why bother with these false elections?"
 
 ger_flavor.10.t:0 "Elections of 1938"
 ger_flavor.10.d:0 "Elections were held today to further consolidate power under the National Socialists. This time, it seems that further elections are not necessary, aside from some to be held in the Sudetenland on its annexation. Not all \"against\" votes were discarded, they were actually registered, and our manipulation tactics have provided a - coerced - 99% majority for the National Socialists."
 ger_flavor.10.a:0 "Elections in Germany are now finished!"
 
 ger_flavor.11.t:0 "Hitler Youth Interfering with Education"
 ger_flavor.11.d:0 "The Hitlerjugend is the official youth movement of the Reich. Borrowing methods from the Boy Scout Movement, HJ members often go on camping and hiking trips. However, this clearly interferes with the childrens' education, as while they are hiking, they are not learning."
 ger_flavor.11.a:0 "Uneducated people are easier to brainwash..."
 
 ger_flavor.12.t:0 "The Confessing Church"
 ger_flavor.12.d:0 "In opposition to our anti-clerical policies, several Lutheran Pastors met in Barmen (in the Rhineland) to issue an official statement declaring the \"Bekennende Kirche\", or Confessing Church. They declared themselves to be independent of any Reich Organ, yet are not a full resistance movement."
 ger_flavor.12.a:0 "German Christians had better shy away from them."
 
 ger_flavor.13.t:0 "The Confessing Church's Memorandum"
 ger_flavor.13.d:0 "The Confessing Church, under the direction of Martin Niemöller, has issued a memorandum to [GER.GetLeader] protesting the Regime's treatment of the clergy. It denounced the regime's blatant anti-Christianity, rejected National Socialist Antisemitism, and demanded that we cease interfering with the Protestant Churches. Upon reading it, the Führer flew into a rage, blaming the Lutherans for assisting societal decline."
 ger_flavor.13.a:0 "Arrest these Traitors!"
 
 ger_flavor.14.t:0 "The White Rose"
 ger_flavor.14.d:0 "A new group, the self-styled \"die Weiße Rose\" has appeared in Germany. An apparently non-violent group, the resistance movement has begun to spread pamphlets denouncing National Socialist oppression, racism, and militarism. While we have not yet discovered these traitors, we must begin searching before they can establish contacts with other groups."
 ger_flavor.14.a:0 "The Gestapo will find them."

 ger_flavor.15.t:0 "Trial of the White Rose"
 ger_flavor.15.d:0 "The operatives of the White Rose have been found! The core group of siblings Hans and Sophie Scholl, their friends Alexander Schmorell, Willi Graf, Christoph Probst, and professor Kurt Huber were caught, interrogated, and scentenced to death on charges of treason."
 ger_flavor.15.a:0 "Yet they will be remembered as Heroes..."
 
 ger_endsieg.1.t:0 "Hegemony over the Churches"
 ger_endsieg.1.d:0 "After nightfall yesterday, the presence of armed guards - mostly from the SS - has increased around Churches. On daybreak, the Führer made a speech in front of NSDAP headquarters in Wittenberg (the birthplace of the Protestant Reformation), claiming that under his initiative, National Socialist operatives have managed to secure state influence over all Churches in the nation. This is mearly one step in eliminating Christianity from Germany."
 ger_endsieg.1.a:0 "An Interesting Development"
 
 ger_endsieg.2.t:0 "The Goal of the Kirchenkampf"
 ger_endsieg.2.d:0 "While many mid-level bureaucrats know about our opposition to the Churches, the public has largely been kept in the dark. However, with our preparations, it will be impossible to keep our objective private. Therefore we shall tell them. The objective of the Kirchenkampf is to  exterimanate \"foreign faiths imported to Germany in 800 AD\"! By the end of our operations, National Socialism will be the prevaling ideology in Germay!"
 ger_endsieg.2.a:0 "We must act slowly."
 
 ger_endsieg.3.t:0 "End of the Saints"
 ger_endsieg.3.d:0 "Over the last several weeks, our agents have been confiscating Christian artwork, to eventually destroy. This has been done in an effort to impede teachings of Saints, whose very existance in Christian teaching goes against the National Socialist worldview. Without artwork to inspire the people, it will be easier to stifle Christianity further in the future."
 ger_endsieg.3.a:0 "There are probably some remaining..."
 
 ger_endsieg.4.t:0 "The Swastika-Churches"
 ger_endsieg.4.d:0 "Our agents have gone around Germany forcing Churches and individuals to take down the Cross and replace them with Swastikas. This will ensure that National Socialism is present in every aspect of peoples' lives, now including the spiritual realm! Although not the most radical change in our plan, this is a very important step, and potentially once of the most risky."
 ger_endsieg.4.a:0 "There can't be any Crosses remaining in secret, right?"
 
 ger_endsieg.5.t:0 "A Change in Leadership"
 ger_endsieg.5.d:0 "Under cover of the night, Gestapo agents have arrested a large number of Clerics who have not yet subordinated their Churches to the Reich. They have been replaced by SS-Trained Reich Orators who will focus on teaching Loyalty to the State instead of Christianity itself. Of course, Christianity will be covered, but slowly phased out."
 ger_endsieg.5.a:0 "But will people trust their new shepards?"
 
 ger_endsieg.6.t:0 "Gestapo Anti-Clerical Operations"
 ger_endsieg.6.d:0 "The Gestapo have been working on finding dissident Clerics who have escaped our earlier replacement operations. These clerics have hidden admirably well, either with the Faithful or with anti-Regime resistance cells. Our domestic enemies have banded together in their opposition to our authority. However, most of them could not escape our clutches! We are Prevailing!"
 ger_endsieg.6.a:0 "Wait, the numbers don't match up..."
 
 ger_endsieg.7.t:0 "Crackdown on The Bible"
 ger_endsieg.7.d:0 "In a combined SS-Gestapo-Kripo operation, Publications of the Bible has been effectively shut down. The Book's existance is detrimental to our efforts, reminding people of the Word of God and drawing them away from our Propaganda. While we have not explicitly banned the Book itself (yet), it is hoped that our message is clear. No new Bibles will be made!"
 ger_endsieg.7.a:0 "There have been rumors of underground operations..."
 
 ger_endsieg.8.t:0 "The Bible Replaced"
 ger_endsieg.8.d:0 "Although the Bible is no longer being printed or distributed, the Book was still being used in Churches across the country. Our Reich Orators have been given copies of Mein Kampf, and have been ordered to begin reading from that instead of the Bible. They have begun doing this with Zealous Valor, and it is hoped that we would win some new converts."
 ger_endsieg.8.a:0 "The Gullible will be Ours!"

 ger_endsieg.9.t:0 "The Program Complete"
 ger_endsieg.9.d:0 "Now that we have finished implementing the Thirty-Point Plan, we can end our efforts for the time being. Rosenberg himself is content to watch Christianity die out (although some are concerned that people will continue to congregate in secret), while the Führer had hoped for slightly faster results."
 ger_endsieg.9.a:0 "Well, we tried."
 
 ger_endsieg.10.t:0 "Propagandist Preachers"
 ger_endsieg.10.d:0 "Some careful observers have noticed that Preachers in the Reich Church have been talking less about God and more about the Führer. This is all part of our plan of course, as we begin to turn the Reich Church from a Church to more of a political organization. It is our hope that eventually the members of the Reich church will kind of forget about God, and focus more on loyalty ot the state."
 ger_endsieg.10.a:0 "Most people don't even seem to notice."
 
 ger_endsieg.11.t:0 "Cultural Festivals"
 ger_endsieg.11.d:0 "Today marks the day of the first Reich Church German Cultural Festivals. These are grand displays of German Culture, from old Saxon and Nordic artifacts (mostly real) to modern cuisine and music. With people in costumes (and propagandists giving speeches), these displays are to ingrain German Culture in German Spiritual Life."
 ger_endsieg.11.a:0 "A Couple of Sausages for me, thanks!"
 
 ger_endsieg.12.t:0 "The Führer Denounces Occultism"
 ger_endsieg.12.d:0 "[Root.GetLeader] has made a short speech in which he denounced the occultic activity of some members of German society (more specifically, Himmler and the SS), and encouraged people to go to Reich Evangelical Churches. By encouraging this, [Root.GetLeader] hopes to diminish the power of the SS and strengthen his own Reich Church's position in German society."
 ger_endsieg.12.a:0 "Himmler won't be happy about this."
 
 ger_endsieg.13.t:0 "A Return to the Warrior Age"
 ger_endsieg.13.d:0 "Our Reich Church Preachers have begun explaining how violence against our enemies is completely acceptable, and should not be taken as a matter of emotion, but that of duty. Of course, those tired of war are less receptive, but some are taking to this question quite nicely. This idea was originally invented by Himmler for the SS, but it can be applied to the civilians as well."
 ger_endsieg.13.a:0 "Are The Old Gods back?"
 
 ger_endsieg.14.t:0 "Cutting Down on Christianity"
 ger_endsieg.14.d:0 "People are starting to notice that the Reich Church doesn't really give Christian Sermons anymore. This will not really go down very well, but with our totalitarian control, the Volk can't really do anything about it. Anyways, our Christianity is radically different, with our insistance that Original Sin doesn't really apply to Germans, among other things. The teachings of Christ simply do not fit in with a National Socialist Worldview."
 ger_endsieg.14.a:0 "Again, who's going to do something about it?"
 
 ger_endsieg.15.t:0 "The End of The Bible"
 ger_endsieg.15.d:0 "Our Propagandist Preachers have stopped teaching the Bible altogether, focusing on German Historical Lessons (warped to match our views, of course) and cultural knowledge. Eventually, the members of the Reich Church will stop believing in Christ altogether. However, some suspect that the people are teaching themselves in private..."
 ger_endsieg.15.a:0 "Slowly but Surely."
 
 ger_endsieg.16.t:0 "Gottgläubigkeit Popularity"
 ger_endsieg.16.d:0 "The Ministry of Propaganda has increased their production of pamphlets and radio speeches encouraging Gottgläubig, or God-Belief. This \"movement\" encourages people to believe in a Creator God without belonging to any specific Church. This ensures that we maintain control over the population while not eliminating religion altogether. In 1939, 3.5 Percent of Germans were Gottgläubige, but this number could be higher..."
 ger_endsieg.16.a:0 "But who is this \"God\" really?"
 
 ger_endsieg.17.t:0 "Anti-Atheist Propaganda"
 ger_endsieg.17.d:0 "Our government precives Atheists as a very dangerous element of society. The atheists disregard religious authority, so they are logically more disposed to resist our control. The Ministry of Propaganda has already begun spinning tales of how \"Atheists ruin the Volksgemeinschaft\" and other such horrors. We hope that this is enough without resorting to more...extreme measures."
 ger_endsieg.17.a:0 "It's not like they can hide, right?"
 
 ger_endsieg.18.t:0 "The Cultural Church"
 ger_endsieg.18.d:0 "Our Transformation of the Reich Church from Church to Cultural Organization is practically complete. Through our reforms, we have presented the Churches of Germany with a rival, one of Belief in a German God, rather than in Jesus Christ. We hope that we have managed to somwhat further cement our control over the people and thus all internal affairs in Germany."
 ger_endsieg.18.a:0 "We can't really do much else."
 
 ger_endsieg.19.t:0 "Factions in the NSDAP vie for Dominance"
 ger_endsieg.19.d:0 "Since our victory, the task of reconstruction and reorganization has fallen on the bureaucracy. However, it has become clear that there are several factions competing for the Führer's favor. Over several days, the factions have largely coalesced into two: the Radical Faction, led by Reich Minister of Public Enlightenment and Propaganda Josef Goebbels, and the Conservative Faction, led by [GER.GetLeader]'s personal secretary and Party Minister of the NSDAP Martin Bormann. The Radicals argue that several measures that were necessary before the war are no longer necessary, as they encourage corruption (for others), and the Conservatives argue that such measures have worked, and will continue to work. It is clear that the Führer must make a final decision to decide the future of the Reich."
 ger_endsieg.19.a:0 "Let the Game Begin!"
 
 GER_endsieg_congress_radical_point:0 "§YThe Radicals will Gain Influence.§!\n"
 GER_endsieg_congress_conservative_point:0 "§YThe Conservatives will Gain Influence.§!\n"
 
 ger_endsieg.20.t:0 "The Political Issue"
 ger_endsieg.20.d:0 "The first issue to be discussed is internal policy. The Radicals argue that more propaganda needs to be developed by the Cinema and not the Press, as the people have started turning towards the cinema. Without the Cinema's development - according to Goebbels - the people will start turning away from the State. The Radicals also argue that the bureaucracy needs to be reformed a little, first by limiting the excesses of the Elite (although they likely mean the Conservative elite), and second by increasing access to the Führer. According to Goebbels, Bormann is trying to control the Reich by controlling the Führer. Although it is clear that Goebbels wants this control for himself, presenting a threat to [Root.GetLeader] is usually a good way to get what one wants.\n\nThe Conservatives on the other hand argue for a continuation of current policy. Göring himself (a very prominant Conservative) is quoted as saying \"The Bureaucracy worked before the war and during the war, so why shouldn't it work after the war?\". They also claim that the corruption issue is not an issue, and point out that if Goebbels and the Radicals were in their position, they would have the same amount of excesses, possibly more. Bormann himself comments that he is not trying to take control from Hitler, but prevent Goebbels - who he says is far more ambitious - from doing the same. Who is right?"
 ger_endsieg.20.a:0 "Radical arguments win out."
 ger_endsieg.20.b:0 "The Conservatives won this round."
 
 ger_endsieg.21.t:0 "The Economic Issue"
 ger_endsieg.21.d:0 "The Radicals have pressured the Führer to allow government intervention into the economy. Although this goes against National Socialist principles, Goebbels often pesters [Root.GetLeader] on issues such as bankrupcy and subsidation. According to the Radicals, unless something is done quickly, the State will go bankrupt and the Economy will collapse. His points are laden with obvious propaganda, encouraging the Führer not be known as the man responsible for an economic crash. He says that closing unprofitable firms and taking away the SS's enterprises are also necessary to cushion the blow.\n\nAfter talking with Goebbels, [Root.GetLeader] usually goes to Bormann or Göring like a child worried about the monster in the closet, to get their opinion on the subject. They say - despite their lack of economic abilities - that although the debt isn't really a threat, some measures of Austerity could be useful to focus on paying off the debt. As Bormann points out, less government spending is in line with National Socialist Policies. Although [GER.GetLeader] considers the economy an afterthought himself, Goebbels' fearmongering has nonetheless shaken him. Which policy should be used?"
 ger_endsieg.21.a:0 "Intervensionism is Necessary!"
 ger_endsieg.21.b:0 "Austerity is Correct!"
 
 
 GER_SS_Exists_no:0 ""
 GER_SS_Exists_yes:0 "Interestingly, there are a few holdouts from both factions' opinions. Himmler's SS usually backs the Radicals, but this time they offer their own ideas on foreign policy. The SS offers its services to destabalize the political system of neutralist countries to ensure that the Reich remains a hegemon. According to Himmler, the SS is capable of maniupulating enemy populations to convert them to National Socialism. However, he never gets far in meetings with the Führer."
 ger_endsieg.22.t:0 "The Foreign Policy Debate"
 ger_endsieg.22.d:0 "Now that the Reich stands triumphant, there is a lot of debate on what our new foreign policy should be. The Radicals and factions backing the Radicals believe that Germany should be ready to send weapons and technical assistance to friendly groups, actual armed intervention should be kept to a minimum. Goebbels reasons that the Reich needs time to recover internally before moving to establish a Germanic World Empire. Radicals also advocate for trading links with neutralist nations, provided that they are not too ideologically out of line.\n\nIn a rare moment, the Conservatives mostly agree on principle. However, they support a greater degree of armed intervention, claiming that the Reich would be in danger if Germany did not send soldiers to secure its interests. They also support the use of the Wehrmacht to ensure that allied nations do not drift away from our influence, and to extort agreements favorable to Germany.\n\n[Root.GER_SS_Exists] Will the Radicals win out here, or will the Conservatives take this round?"
 ger_endsieg.22.a:0 "Intervention must be limited for now."
 ger_endsieg.22.b:0 "We might as well use our power!"
 
 GER_endsieg_interventionism:0 "Sided with the Radicals on economics."
 GER_endsieg_austerity:0 "Sided with the Conservatives on economics."
 
 GER_endsige_congress_last_event:0 "§YThe Führer will soon make his decision!§!"
 
 ger_endsieg.23.t:0 "The Reichskommissariat Question"
 ger_endsieg.23.d:0 "Only of the more hotly debated topics in the Reich Chancellery is the issue of the Reichskomissariats. The Radicals argue that Berlin should keep watch on the Reichskommissars with the increased presence of Liasons and Intelligence Officers. They figure that with the ambitious personalities of the NSDAP and their Collaborators, it is worth the effort to make sure that they do not try to undermine Berlin's operations for their own gain. To them, Reichskommariats are simply non-integrated German territory, and should be adnimistrated as such. Thusly, Berlin should watch to make sure that the administration only does what Berlin tells them to.\n\nThe Conservatives see Reichskommissariats as Autonomies to be integrated eventually, but are not yet integral to the Reich. Thus, they feel that as long as the Reichskomissars stay loyal to Berlin and follow the Chancellery's orders, Reichskomissariats should be allowed to pursue their own personal projects. Bormann makes the point that greater oversight leads to more clever disobediance, which raises some eyebrows as he acceidentaly identifies a flaw of the National Socialist Tyranny. Suffice it to say that this irony is not lost on the Führer."
 ger_endsieg.23.a:0 "Germany should watch its subjects like a hawk!"
 ger_endsieg.23.b:0 "A placated warlord is a loyal warlord."
 
 GER_Endsieg_Radical_Victory:0 "The Radical Faction is Dominant.\n"
 GER_Endsieg_Conservative_Victory:0 "The Conservative Faction is Dominant.\n"
 
 ger_endsieg.24.t:0 "Radicals Claim Victory!"
 ger_endsieg.24.d:0 "The Führer has decided to side with the Radicals in the Reich Chancellery. This means that Goebbels and his cohorts will be moved into more prestigious positions. For example, Goebbels has been named Minister of the Interior, and has already begun implementing his ideas. While the Conservatives cannot really do anything about this, they have begun to think of the Führer as weak-willed as he has succumbed to Goebbels' warmongering. Only time will tell if the Radicals can stop bankrupcy and prevent corruption..."
 ger_endsieg.24.a:0 "At least this is over."
 
 ger_endsieg.25.t:0 "Conservatives Claim Victory!"
 ger_endsieg.25.d:0 "It turns out that the Conservatives have managed to convince the Führer to side with them against the Radicals. Bormann and his group have already been promoted to higher positions. Most notably, Otto Georg Thierack has been promoted to Minister of the Interior, and has begun ordering propaganda to effect Conservative National Socialist policies. While the Radicals cannot change the situation, they have begun to come to the opinion that the Führer is getting complacent, not wishing to change the status quo, either out of laziness or out of stubborness."
 ger_endsieg.25.a:0 "Bormann is truly in control now."
 
 ger_endsieg.26.t:0 "Deadlock in the Chancellery"
 ger_endsieg.26.d:0 "The Führer has decided that both factions present good points, but he cannot decide which faction to support. Therefore, he has tabled these debates indefinetaly. This has angered both factions, and it is now unlikely that any noticeable changes of interior policy will come about."
 ger_endsieg.26.a:0 "What can we do now?"
 
 ger_endsieg.27.t:0 "Joseph Goebbels Found Dead!"
 ger_endsieg.27.d:0 "Joseph Goebbels has been found dead today in his residence. Investigators have ruled this a suicide, on the account that after rejection by the Führer, Goebbels became increasingly despondent and irritable. It was known that Goebbels acted like a puppy excited to see its master around the Führer, and the Führer's support of the Conservatives may have pushed him over the edge. He leaves behind his wife Magda and six children. He will be given a state funeral with numerous posthumous honors."
 ger_endsieg.27.a:0 "His family will miss him."
 
 GER_Hitler_Died_From_Drugs:0 "that his body collapsed due to drug abuse. His personal physician, Theodor Morell, recoreded that he regularly consumed amphetamines, barbituates, opiates, cocaine, potassium bromide, and atropa belladonna"
 GER_Hitler_Died_From_Syphillis:0 "that his body has atrophied due to advanced syphillis, among his other ailments. He has had irritable bowel syndrome, irregular hearbteat, coronary sclerosis, Parkinson's disease, tinnitus, giant-cell arteritis, and skin lesions"
 GER_Make_Goebbels_Fuhrer:0 "Luckily, he had already named Joseph Goebbels as his successor, so the transition of power should be smooth. Although Goebbels is not well liked in the Bureacracy, even by his own Radicals, it is not like other elite figures can really do anything about it. There will be a national week of mourning, but a day of celebration in the Reich Chancellery, as Goebbels has risen to the highest office in all of the Reich!"
 GER_Endsieg_Bormann_Fuhrer:0 "Luckily, he had already named Martin Bormann as his successor, so the transition of power should be smooth. Although Bormann is not well liked by the Radicals, it is not like they can really do anything about it. His Conservatives support him enough to prevent total administrative paralysis. There will be a national week of mourning, but a day of celebration in the Reich Chancellery, as Bormann has risen to the highest office in all of the Reich!"
 GER_Make_Goring_Fuhrer:0 "Unfortunately, he has not named a successor, causing a crisis in the Chancellery. After a few hours of debate, it was decided that Hermann Göring will become the new Führer. It is noted that he is popular with the people and with most bureuacrats. Therefore, he is the best choice for leader. There will be a national week of mourning, but a day of celebration in the Reich Chancellery, as Göring has risen to the highest office in all of the Reich!"
 ger_endsieg.28.t:0 "The Führer is Dead!"
 ger_endsieg.28.d:0 "[GER.GetLeader] has been found dead today, and the Elite is in shock. The cause of death seems to be [Root.GER_Hitlers_Death_Cause]. Bureaucrats are already busy deciding how to tell the people, his funeral processions, and more importantly, the future of the government.\n\n [Root.GER_Fuhrer_Loc]"
 ger_endsieg.28.a:0 "The Führer has died! Long live the Führer!"
 
 ger_endsieg.29.t:0 "Bankrupcy Imminent"
 ger_endsieg.29.d:0 "While our economic practices was fine when preparing for war, the debt is looming over us like a vulture, ready to strike once we default. If we do not act fast, we could possibly suffer through the worst economic crisis in German History!"
 ger_endsieg.29.a:0 "We must act quickly."
 
 ger_endsieg.30.t:0 "Bankrupcy Hits!"
 ger_endsieg.30.d:0 "We have failed to pay off our debts on time, and have thus defaulted and gone bankrupt. Due to our quasi-control over the economy, this means that production and construction has nearly ground to a halt. The situtation is made worse by our employment contracts that makes it hard for companies to lay off workers, meaning that they still have to be paid, causing further debt. This whole thing is a vicious cycle, and cannot be recifited quickly."
 ger_endsieg.30.a:0 "Mein Gott!"
 
 ger_antinazi.1.t:0 "Restoration of the Monarchy"
 ger_antinazi.1.d:0 "Now that our political structure has been thoroughly purged of National Socialist influence, it is time to decide whether or not to restore the Monarchy. Although the people respect [GER.GetLeader] for freeing them from the Nazis, Monarchism is a prevailing trait among the High Command and our Civilian Advisors. What seems to be the consensus (with one or two exceptions), is that nobody would like Wilhelm II to return to the throne. If anybody would take it, it would be Crown Prince Wilhelm, stylized as Wilhelm III. Although measuers would be taken to keep the Kaiser politically inactive, it is likely that the Crown Prince would want to get invovled. Should we restore the monarchy or not?"
 ger_antinazi.1.a:0 "The Monarchy would help legitimize our rule!"
 ger_antinazi.1.b:0 "Monarchism no longer has any place in Germany."
 
 ger_antinazi.2.t:0 "The Union Question"
 ger_antinazi.2.d:0 "With the National Socialists Destroyed, former members of destroyed Trade Unions have petitioned our government to allow them to operate. Although this would decrease our control of the state, it would placate the people and avoid a crisis, possibly including a Socialist Revolution. A third option would be to only allow Liberal Unions to form, and require them to swear an oath to the Military Government. Should we allow the unions to operate?"
 ger_antinazi.2.a:0 "Allow all Unions to operate."
 ger_antinazi.2.b:0 "Only allow Liberal Unions."
 ger_antinazi.2.c:0 "Continue the Ban."
 
 ger_antinazi.3.t:0 "Bankrupcy!"
 ger_antinazi.3.d:0 "Although Hitler's economic policies were effective in allowing us to re-arm, they have left a massive amount of debt across the board. Although we have attempted to pay off our debts, it has caught up to us, and we have defaulted. Thus, we have been forced to declare bankrupcy. It is likely that it will take a long time to correct this."
 ger_antinazi.3.a:0 "Damn Hitler and his Militarism!"
 
 ger_antinazi.4.t:0 "Hitlerist Sabotage"
 ger_antinazi.4.d:0 "Even though the National Socialists are no longer in control of Germany, Hitlerist terrorists continue to perform acts of sabotage against our military installations. Mostly comprised of former SS and SA operatives, these saboteurs have recently blown up a military installation, causing the deaths of a couple of personnel and destroying some of our property."
 ger_antinazi.4.a:0 "They Will Pay!"
 
 ger_himmler.1.t:0 "New SS Castles"
 ger_himmler.1.d:0 "The Führer has commissioned new castles for the SS. This is an early development in the plan to expand Himmlerism into a full-fledged religion. Himmler intends for the SS to perform cryptic ceremonies in these castles. They are also meant to serve as crypts for senior SS leaders, with the SS castle in Wewelsburg already being converted into a lavish tomb for Heinrich Himmler."
 ger_himmler.1.a:0 "It Begins..."
 
 ger_himmler.2.t:0 "New Ceremonies"
 ger_himmler.2.d:0 "In addition to Solstice Celebrations, Anniversary Celebrations, and Wedding Ceremonies designed especially for the SS, the SS Religious Planning Office has been busy drafting and practicing new ceremonies. For example, state holidays (such as the date of the Seizure of Power) will now be celebrated in the SS manner. They involve incantations and National Socialist propaganda, and Himmler hopes that these strange new rituals will actively replace Christian ceremonies in the Reich."
 ger_himmler.2.a:0 "Intersting."
 
 ger_himmler.3.t:0 "Attack on the Lutherans!"
 ger_himmler.3.d:0 "The last several weeks have been tough on Germany. Anti-National-Socialist clerics - and most other Lutheran clerics - have been arrested and sent to prisions on charges of treason! Their churchers have been expropriated for use by the state, either as party buildings or SS religious centers. Christian imagery has been destroyed, and lootings by even more unscrupulous SS men are common."
 ger_himmler.3.a:0 "We will have our way!"
 
 ger_himmler.4.t:0 "Operation Wien"
 ger_himmler.4.d:0 "Concieved by newly-promoted SS-Standartenführer Otto Skorzeny, Operation Wien has been underway for the last three months. Due to the position of the Catholic Church on the world stage and the international influence of the Pope, we have had to be very careful in removing the Catholics from Germany. Although we have done our best to act on reports of secret meetings, we cannot go everywhere, and the Church survives in Germany."
 ger_himmler.4.a:0 "This cannot be good..."
 
 ger_himmler.5.t:0 "Burning of the Book"
 ger_himmler.5.d:0 "After the ban placed on the printing, publication, distribution, and possesion of the Bible, many Germans had seen fit to keep them in private. In reaction, the SS performed a large operation to smoke out any remaining Bibles, and burnt them in town squares. Of course, it is possible that the people are cleverer than the SS, but they wouldn't dare defy us, right?"
 ger_himmler.5.a:0 "Now the real work can begin!"
 
 ger_himmler.6.t:0 "Indoctrination in Schools"
 ger_himmler.6.d:0 "Three Hours of each School Week will now be devoted to the study of Himmlerism, which will go hand-in-hand with the already-existing political education. It is hoped that the children pick up Himmlerism early, which would save us the effort of indoctrinating adults."
 ger_himmler.6.a:0 "If you can teach people about Christ, they can learn about Himmler."
 
 ger_himmler.7.t:0 "How Did Hitler Die?"
 ger_himmler.7.d:0 "To explain the takeover to the people, the propaganda department decided to tell them that the SS had to overthrow a cabal of Officers who had killed Adolf Hitler. However, we can interweave Hitler's death with Himmlerist theory, and teach how Hitler was a martyr who died for National Socialist ideals.\n\nMajor figures in the SS know, of course, that it was Himmler himself who fired the fatal shot."
 ger_himmler.7.a:0 "That wasn't hard to push."
 
 ger_himmler.8.t:0 "The Collective Unconsious"
 ger_himmler.8.d:0 "We will teach the people that the Germans are part of a \"collective unconsious\" that makes them a part of the whole. Obviously, this is meant to connect them with a more Völkisch worldview; i.e the view that they are part of a community, and not just individuals. However, the population doesn't seem to be taking this very well, even laughing at our propgandists in the streets."
 ger_himmler.8.a:0 "This is harder than we thought."
 
 ger_himmler.9.t:0 "The Avatar Theory"
 ger_himmler.9.d:0 "Even though the people do not much accept the \"Collective Unconsious\" theory, we still went ahead and told the people that the Office of the Führer is chosen by the unconsious of the German People. The German People, who know full well that they have not chosen anything, reject this theory completely, and have begun doubting the SS's authority."
 ger_himmler.9.a:0 "But they are supposed to believe our lies!"
 
 ger_himmler.10.t:0 "A Creator God"
 ger_himmler.10.d:0 "Although we reject Christianity, we still teach of the existance of some kind of Creator God. We acknowledge that some kind of Higher Being created the human race, but not in the way that Christianity teaches. We teach that God made humans unequal, justifying our racial pseudoscience. There is one problem, however: Who Is This god Person Anyway?"
 ger_himmler.10.a:0 "Well, we are not sure yet."
 
 ger_himmler.11.t:0 "Bankrupcy!"
 ger_himmler.11.d:0 "Our Debts have finally caught up to us, as it is clear that we must default on our debt and declare bankrpucy. It is clear that despite our best efforts, the National Socialist Economic Model is unsustainable, and what was meant to be a Reich of prosperity now proves to be a dystopia of poverty and misery. Despite this turn of events, we will do our best to keep control..."
 ger_himmler.11.a:0 "We Will Have Order!"
 
 ger_news.1.t:0 "Adolf Hitler Appointed German Chancellor"
 ger_news.1.d:0 "Upon the resignation of Reichskanzler Kurt von Schleicher, President Paul von Hindenburg has appointed Adolf Hitler of the NSDAP to the position. Running on a platform of extreme nationalism and xenophobia, Hitler - Called \"The Führer\" by his followers - advocates for a centralized dictatorship based on racial pseudoscience and Pan-Germanic Nationalism.\n\nHitler's participation in events such as the Beer Hall Putsch and his continued opposition to the German Republic have earned him respect from the people, who are moved by his many speeches. But even as the ceremonies finish, the National Socialists have already begun bringing Germany under their control..."
 ger_news.1.a:0 "Oh no"
 ger_news.1.b:0 "Ein Volk, ein Reich, ein Fürer!"
 ger_news.1.c:0 "*Gulp*"
 
 ger_test.1.t:0 "WhO wOuLd WiN"
 ger_test.1.d:0 "Hitlerist Tree Test"
 ger_test.1.a:0 "Hitler and his stupid mustasche"
 ger_test.1.b:0 "Methamphetamine Hitler"
 ger_test.1.c:0 "Hitler's Gone, Everyone"
 ger_test.1.e:0 "Himmler's Spooptober"
 
 GER_stahlhlem_coup_possible_tt:0 "If we are not careful, the Stahlhelm could coup the government."
 
 german_focus:0 "German National Focus"
 unlock_focuses:0 "Unlocks the below foci"
 GER_new_chancellor:0 "A New Reichskanzler has been Chosen!"
 GER_beck_in_power:0 "The Military has taken over"
 GER_political_start:0 "The New Reichskanzler"
 GER_political_start_desc:0 "We need to appoint a new Reichskanzler if we want any sort of stability in our country."
 GER_hitler_start:0 "NSDAP: Fascist Majority"
 GER_hitler_start_desc:0 "Hitler and his National Socialists are now the ruling party of the country. They believe in Racial Purity, collectiveness, corporatism, and German conquest of Europe."
 GER_strasser_start:0 "KGRNS: Fascist Minority"
 GER_strasser_start_desc:0 "Otto Strasser and his Strasserists are now in control of the country. While they are fascists, they are less radical than the Hitlerites. They are a left-leaning faction, with emphasis on the rights and prosperities of the worker."
 GER_hugenberg_start:0 "DNVP: Nationalism and Monarchism"
 GER_hugenberg_start_desc:0 "Alfred Hugenberg and his nationalists are now in control of the country. They are monarchists and nationalists, and will likely repress their people's rights and be aggressive to their neighbors. They also are likely to restore the Monarchy under Kaiser Wilhelm II Hohenzollern."
 GER_kaiser_start:0 "Return of the Kaiser"
 GER_kaiser_start_desc:0 "The Kaiser, Wilhelm II, has returned! While he was not able to keep Germany in one piece during the Weimar revolution, he might be able to do something different this time, through direct rule from the throne!"
 GER_beck_start:0 "Military Takeover"
 GER_beck_start_desc:0 "The German General Staff, now led by Ludwig Beck, has taken control of the country. Their only goal, so they claim, is to keep Germany in one piece, and, supposedly, return the country to a less provisional government..."
 GER_fire_decree:0 "The Reichstag Fire Decree"
 GER_fire_decree_desc:0 "The Fire at the Reichstag was totally caused by a Dutch Communist! We must retaliate! All civil liberties will be suspended!"
 GER_enabling_act:0 "The Enabling Act"
 GER_enabling_act_desc:0 "The Enabling Act and the Reichstag Fire Decree together serve to transform Germany into a Dictatorship under Adolf Hitler. He can pass laws by decree and has already suppressed civil liberties."
 GER_one_party_state:0 "One-Party State"
 GER_one_party_state_desc:0 "We are now in a position to ban all other political parties in Germany! We can finally put an end to this stupid \"Democracy\" and return Germany to its Imperial Glory."
 GER_nazi_propaganda:0 "Pro-National Socialist Propaganda"
 GER_nazi_propaganda_desc:0 "With an extensive propaganda campaign, we can turn the population towards Hitler and against the Bolsheviks, Republicans, and other Subversive organizations."
 GER_night_of_long_knives:0 "Operation Kolibri"
 GER_night_of_long_knives_desc:0 "Operation Kolibri, also known as the Night of the Long Knives or the Röhm Putsch, was a strike by the National Socialist government on their political rivals and the SA leadership."
 GER_no_state_parliaments:0 "Ban the Reichsrat"
 GER_no_state_parliaments_desc:0 "With the banning of the Reichsrat and individual State Parliaments, we can ensure that the whole Reich is ruled directly from Berlin."
 GER_rev_fasc:0 "Revolutionary Fascism"
 GER_rev_fasc_desc:0 "Revolutionary Fascism is the new ideology of our nation. It is a form of fascism with a strong emphasis on social justice and workers' rights. We can use this to our advantage in rallying the people."
 GER_party_conflicts:0 "Deal With The National Socialists"
 GER_party_conflicts_desc:0 "With the advent of Revolutionary Fascism, Hitlerite National Socialistsm is an outdated concept. We must deal with Hitler and his cronies swiftly."
 GER_strasser_one_party:0 "Destroy our Political Enemies"
 GER_strasser_one_party_desc:0 "With the end of the Hitlerites, we can now consolidate our grip on power by destroying political enemies."
 GER_hitler_youth:0 "Hitler Youth"
 GER_hitler_youth_desc:0 "Hitler Youth is the new youth division of our party. They learn about Germany, the Party, and how to fight, in order to one day serve in our armed forces."
 GER_assimilate_other_cultures:0 "Invest in Welfare"
 GER_assimilate_other_cultures_desc:0 "We shall invest in the people's Welfare, so that they become more used to the new Regime."
 GER_question_of_paramilitaries:0 "End Paramilitarism"
 GER_question_of_paramilitaries_desc:0 "We must confront the paramilitary organizations of the country in order to prevent anarchy."
 GER_strasser_radicalism:0 "Radicalism"
 GER_strasser_radicalism_desc:0 "We must radicalize our population to defend, and spread, Revolutionary Fascism whenever possible."
 GER_remove_commies:0 "Purge the Marxists"
 GER_remove_commies_desc:0 "We will go end the legality of the Communists and Socialists in Germany, for they threaten the safety of the nation."
 GER_law_and_order:0 "Law and Order"
 GER_law_and_order_desc:0 "We must tighten civil laws in order to maintain the security of the German people."
 GER_betray_nazis:0 "Betray the National Socialists"
 GER_betray_nazis_desc:0 "We must declare National Socialistsm illegal, because they are now the only threat to our power!"
 GER_glory_to_empire:0 "Glorify the Old Empire"
 GER_glory_to_empire_desc:0 "The Second Reich was the peak of Germany's existance. Under the DNVP, we can retake our old glory!"
 GER_no_more_paras:0 "Ending Paramilitary Operations"
 GER_no_more_paras_desc:0 "Paramilitary Operations pit German against German. This is unacceptable, as it goes against God's plans for Germany. We must Unite the People under Hugenberg."
 GER_fear_politics:0 "The Politics Of Fear"
 GER_fear_politics_desc:0 "We must rely on the politics of fear to rally the population to our side. After all, with Liberals, Socialists, and Fascists all around us, they have much to be afraid of."
 GER_absolutism:0 "Reformation of the DKP"
 GER_absolutism_desc:0 "The People will not appreciate a Royal Dicatatorship under the Kaiser's rule alone. We could replace von Mackensen and the current government with civilian leaders, in order to placate the public."
 GER_integrate_dnvp_zentrum:0 "Integrate Other Monarchists"
 GER_integrate_dnvp_zentrum_desc:0 "Monarchists belonging to other parties (such as the DNVP, DVP, and Zentrum) should be fully integrated into our administration."
 GER_dealing_with_the_commies:0 "End Left-Wing Opposition"
 GER_dealing_with_the_commies_desc:0 "The Communists abhor imperialist societies like this one. Thus, we need to decide how to deal with these dissidents."
 GER_monarchist_betray_nazis:0 "End Right-Wing Opposition"
 GER_monarchist_betray_nazis_desc:0 "Right now, the only remaining threat to our authority is the National Socialist Party. By arresting their leaders, we can end fascist resistance in our Empire!"
 GER_monarchism_no_paras:0 "End Paramilitary Opposition"
 GER_monarchism_no_paras_desc:0 "Paramilitary Opposition still exists in our country! We must utilize our police and military in arresting these dissidents!"
 GER_return_imperial_law:0 "Return of Imperial Law"
 GER_return_imperial_law_desc:0 "With the return of the Kaiser, we can bring back the Reichsstrafgesetzbuch, the Imperial Criminal Law code, which dates back to the old North German Confederation. With these laws, we can make sure that the Hohenzolleren Dynasty is forever in power!"
 GER_martial_law:0 "Declare Martial Law"
 GER_martial_law_desc:0 "We need to declare martial law to keep order on the streets. With National Socialists, Communists and Socialists all disappointed at the takeover, we need to make sure violence does not break out."
 GER_end_of_nazis_and_communists:0 "Eliminate Civilian Political Leaders"
 GER_end_of_nazis_and_communists_desc:0 "We are surrounded by enemies at all sides. We must eliminate the larger political factions in Germany if we are to operate effectively."
 GER_remove_paramilitary_beck:0 "End Paramilitary Interference"
 GER_remove_paramilitary_beck_desc:0 "While some Paramilitary groups have already stood down, some of the major opposition groups continue to operate in small gangs. We need to quickly and effectively hunt them down."
 GER_wehrstaat:0 "Wehrstaat"
 GER_wehrstaat_desc:0 "We shall proclaim the Wehrstaat, or Defense State, as the legitimate German Government. We will be a totalitarian Military Dictatorship, unrivaled in Europe!"
 GER_replace_civilian_leaders:0 "Replace Civilian Leaders"
 GER_replace_civilian_leaders_desc:0 "By replacing civilian mayors and governors with military representatives, we can better take control of government functions."
 GER_military_propaganda:0 "Military Propaganda"
 GER_military_propaganda_desc:0 "We need to use propaganda to show the German People that the General Staff is leading the country in the right direction."
 GER_new_germany:0 "A New Germany!"
 GER_new_germany_desc:0 "Germany has fought its internal struggle for too long; now it is united in body, name, and spirit!"
 GER_death_of_hindenburg:0 "The Death of Hindenburg"
 GER_death_of_hindenburg_desc:0 "President Hindenburg has passed away. However, with his legacy established, we can make way for even more sweeping reforms of our nation!"
 GER_establish_people_court:0 "Establish the Volksgerichtshof"
 GER_establish_people_court_desc:0 "The Volksgerichtshof, or People's Court, will allow us to order the execution of dissidents and spies while maintaining the illusion of lawfulness."
 GER_hitler_oath:0 "Der Führereid"
 GER_hitler_oath_desc:0 "All soldiers and civil servants will be made to take the Hitler Oath, in order to quell any rebellion against the regime!"
 GER_improve_reichspost: "Improve the Reichspost"
 GER_improve_reichspost_desc: "Our postal service, Deutsche Reichspost, will recive more subsidies to better serve our people and government."
 GER_consolidate_ss:0 "Consolidate the SS"
 GER_consolidate_ss_desc:0 "The Schutzstaffel is our official security force, but we will consolidate all the criminal and secret police forces under this national organization."
 GER_full_fuhrer_prinzip:0 "Führerprinzip"
 GER_full_fuhrer_prinzip_desc:0 "The \"Leader Principle\" ensures that all of our people and government functions are behind the Führer, Adolf Hitler!"
 GER_expand_civil_service:0 "Expand The Bureaucracy"
 GER_expand_civil_service_desc:0 "With an expanded civil service system, we will be able to make sure that the Führer's wishes are carried out!"
 GER_end_junker_powers:0 "End of the Junkers"
 GER_end_junker_powers_desc:0 "With our National-Socialist platform, we need to end the power of the Junkers in order to solidify our regime."
 GER_social_principle: "Sozialesprinzip"
 GER_social_principle_desc:0 "The Social Principle calls for a large people's government, with Herr Strasser as the representative of the People."
 GER_full_revolution:0 "Full Revolution"
 GER_full_revolution_desc:0 "We will perform a full Socialist Revolution, unlike the Half-Revolution proposed by Hitler."
 connection_to_stalinism:0 "Strasserist connections with Stalinism"
 GER_connection_to_stalinism:0 "Break up Large Estates"
 GER_connection_to_stalinism_desc:0 "Large Estates must be broken up in order to better serve Germany!"
 GER_fascist_councils:0 "Fascist Councils"
 GER_fascist_councils_desc:0 "Using Fascist People's Councils, we can make sure that the workers and peasants maintain some control in the government."
 GER_authoritarian_state:0 "Implement Autocracy"
 GER_authoritarian_state_desc:0 "Now that Hindenburg is dead, we no longer have to pretend to follow democratic ideals. We will establish an Autocratic Germany in the German Republic's place!"
 GER_political_protestantism:0 "Political Protestantism"
 GER_political_protestantism_desc:0 "We can begin bringing Protestantism into government functions in order to stave off the influence of the Zentrumspartei's political Catholicism, as well as other pluralist, secular, and atheist influences."
 GER_stalheim:0 "Integrate the Stalheim"
 GER_stalheim_desc:0 "The Stalheim, our official paramilitary group, shall be integrated into the army, to make the military more loyal to our rule."
 GER_reactionary_policy:0 "Reactionary Political Policies"
 GER_reactionary_policy_desc:0 "Our Reactionary Policies will limit the civil liberties of the people, and lower the social status of the poor. This should allow our government to be even more effective."
 GER_support_agrarian:0 "Support the Agrarian League"
 GER_support_agrarian_desc:0 "We must support our ally, the Reichs-Landbund, in order to maintain the support of the German Farmers."
 GER_pan_germanism:0 "Pan-German Propaganda"
 GER_pan_germanism_desc:0 "No matter where in Germany (or Austria...) you are from, you are still Germans, and we must work together to preserve the German Spirit!"
 GER_return_of_kaiser:0 "The Kaiser has Returned"
 GER_return_of_kaiser_desc:0 "The Kaiser has returned to Germany to lead our people into a new future, with the good help of Herr Hugenberg, of course."
 GER_elevated_junkers:0 "Elevate the Junkers"
 GER_elevated_junkers_desc:0 "Even though some nobles are part of the party, by integrating them into the DNVP and elevating their power, we can keep the Kaiser in check, and maintain the DNVP's authority."
 GER_new_bismark:0 "The New Bismarck"
 GER_new_bismark_desc:0 "Hugenberg has out-maneuvered his political rivals to reform the German Empire, a feat not seen since Bismarck's Unification of Germany!"
 GER_german_tradition:0 "German Tradition"
 GER_german_tradition_desc:0 "With the power of German Tradition, we can rally the people behind the Kaiser, to reclaim the borders of old, and then some..."
 GER_new_flagship:0 "A New Flagship"
 GER_new_flagship_desc:0 "With the Kaiser's Return, we will commision a new ship to celebrate: The SMS Kaiser Wilhelm I!"
 GER_new_flagship_oob:0 "New Imperial Flagship"
 GER_nobles_in_government:0 "Nobles in Government"
 GER_nobles_in_government_desc:0 "With an Imperial Administration, we can let the Nobles into more government position. Hopefully, they will be gratefull."
 GER_new_constitution:0 "Prussian Constitutionalism"
 GER_new_constitution_desc:0 "With a new Constitution, we can show the semblence of republicanism, however, it is the Kaiser that holds most of the power."
 GER_calm_populace:0 "Calm the Populace"
 GER_calm_populace_desc:0 "The people are still a little restless. We need to calm them down to preserve stability."
 GER_beauracratic_heirarchy: "Prussian Absolutism"
 GER_beauracratic_heirarchy_desc:0 "By establishing a large Bureaucracy, we can run the country without a Parliament."
 GER_divine_right:0 "Divine Right"
 GER_divine_right_desc:0 "We will claim the Divine Right of Kings to give our regime some legitimacy."
 GER_kulturkampf:0 "Second Kulturkampf"
 GER_kulturkampf_desc:0 "Another Kulturkampf will show the Germans how the Kaiser cares for their safety and culture!"
 kulturkampf:0 "Kulturkampf"
 GER_remove_socialism_from_empire:0 "Fight against Leftism"
 GER_remove_socialism_from_empire_desc:0 "We shall declare all leftist regimes to be illigitamate states, in order to rally more conservative (and possibly liberal) countries to our cause."
 GER_remove_socialism_modifier:0 "The German Empire is against Socialism"
 GER_remove_socialism_positive:0 "The German Empire is against Socialism"
 GER_monarchism_relation:0 "Like-Minded Monarchy"
 GER_connect_with_other_monarchies:0 "Befriend other Monarchies"
 GER_connect_with_other_monarchies_desc:0 "By brefriending other monarchies in Europe, we can establish a bulwark against Socialism and Republicanism."
 GER_lessen_martial_law:0 "Lessen Martial Law"
 GER_lessen_martial_law_desc:0 "With the country somewhat stable, we can lessen restrictions on civil liberties by a small amount, and allow some normality to return to Germany."
 GER_direct_rule_from_beck:0 "Direct Rule from Berlin"
 GER_direct_rule_from_beck_desc:0 "A few areas have some autonomy from Prussia. We must establish direct rule in order to maintain our power."
 GER_beck_purge_military:0 "Purge the Military"
 GER_beck_purge_military_desc:0 "There are still National Socialist and Communist holdouts in our military. We must find these influences and destroy them!"
 GER_basic_city_forts:0 "Rudimentary Urban Defenses"
 GER_basic_city_forts_desc:0 "We must build some small defenses to prepare for possible invasion! We will build in our most important cities: Berlin, Munich, and (for its strategic value) Köningsberg."
 GER_better_airports:0 "Improve Airports"
 GER_better_airports_desc:0 "We need to improve airports in our country, so that our people will feel better about the state and so military supplies can be better transfered."
 GER_becks_speech:0 "The Marshal's Speech"
 GER_becks_speech_desc:0 "Now that the people feel better about our regime, Marshal Beck shall make a speech declaring himself the supreme leader of the Wehrstaat!"
 GER_nazi_economy_start:0 "The Economic New Order"
 GER_nazi_economy_start_desc:0 "Now that we have gotten rid of the republicans, we can begin eliminating Capitalism and Bolshevism in our country to make way for National Socialism!"
 GER_begin_autobahn:0 "Begin Construction of the Reichsautobahn"
 GER_begin_autobahn_desc:0 "A large highway network would greatly increase civilian and military transport capabilities."
 GER_buisness_coop:0 "Co-operate with Private Buisnesses"
 GER_buisness_coop_desc:0 "By Co-operating with privately owned corporations, we can better mitigate the effects of the Great Depression on our country."
 GER_land_nationalisation:0 "Land Nationalization"
 GER_land_nationalisation_desc:0 "We still must nationalize some land and industries in order to better prepare Germany for war."
 GER_national_people_service:0 "Create the NSV"
 GER_national_people_service_desc:0 "The Nationalsozialistische Volkswohlfahrt, or National Socialist People's Welfare, will be the sole welfare institution in Germany, and will provide for the needs of all German citizens!"
 GER_mefo_bills:0 "Mefo Bills"
 GER_mefo_bills_desc:0 "Mefo Bills, created by Hjalmar Schacht, our Minister of Finance, will be a way for Germany to re-arm secretly, by issuing IOU's without spending traceble money."
 GER_hitler_trade_union:0 "Create the DAF"
 GER_hitler_trade_union_desc:0 "We will require all workers to join the Deutsche Arbeitsfront, or German Labor Front, in order to better control the economy."
 GER_hitler_remove_econ_crisis:0 "A Thriving Germany"
 GER_hitler_remove_econ_crisis_desc:0 "Now that we have invested in the German People and Buisnesses, we can declare the end of the economic crisis!"
 GER_hitler_industrial_I:0 "Industrial Effort I"
 GER_hitler_industrial_I_desc:0 "We shall continue to invest in construction and consumer goods factories."
 GER_hitler_military_I:0 "Military Effort I"
 GER_hitler_military_I_desc:0 "We must continue creating more factories to create military equipment."
 GER_hitler_military_II:0 "Military Effort II"
 GER_hitler_military_II_desc:0 "We must continue creating more factories to create military equipment."
 GER_hitler_military_III:0 "Military Effort III"
 GER_hitler_military_III_desc:0 "We must continue creating more factories to create military equipment."
 GER_expand_kr_society_hitler:0 "Expand the Kaiser Wilhelm Society"
 GER_expand_kr_society_hitler_desc:0 "We need to expand the Kaiser Wilhelm Society to teach German Science to the German people!"
 GER_July_program_1935:0 "July Programm of 1935"
 GER_July_program_1935_desc:0 "The General Staff has revised the 1933 December plans, which provided for the establishment of a standing 300,000 men strong army composed of 21 divisions by march 1938, to now be around 700,000 men and 36 divisions by October 1939; and later increase to the planned 63 divisions in 1941. This was not done without controversy, as the military leadership was in disagreement on how to proceed. Some favoured a slower establishment of formations while others wanted the inmediate formation of the 36 divisions. At the end a compromise has been reached and the plans now can proceed..."
 GER_July_program_1935_tt: "§YWe will create §C3§! more Infantry Divisions when we§! §Rannounce the creation of the Wehrmacht§!"
 GER_announce_creation_wehrmacht: "Announce the creation of the Wehrmacht"
 GER_announce_creation_wehrmacht_desc: "We will announce to the world our break of the Treaty of Versailles! We will no longer need the cover names for our divisions, so they will take their bona fide names. In addition, per the current Program of the army, we will create the 3 Panzer Division from the remains of the old Reichwehr Cavalry Divisions!"
 GER_Wehrmacht_1935: "Wehrmacht 1935"
 GER_first_panzer_divisions_tt: "§YThe §C1st§!, §C2nd§! and §C3rd§! Panzer Divisions will be created!§!"
 GER_side_with_autarchs:0 "Side with the Autarchs"
 GER_side_with_autarchs_desc:0 "By siding with the Autarchs, we can increase government participation in the economy, and we can faster prepare for war..."
 GER_finish_reichsautobahn:0 "Finish the Reichsauthobahn"
 GER_finish_reichsautobahn_desc:0 "We must finish the Reichsautobahn Project, as we promised!"
 GER_industrial_hitler_II:0 "Industrial Effort II"
 GER_industrial_hitler_II_desc:0 "By decreasing regulations on Buisnesses, we can better bolster the German Economy."
 GER_industrial_hitler_III:0 "Industrial Effort III"
 GER_industrial_hitler_III_desc:0 "We will allow some foreign investment in German Buisnesses, so that we can decrease the deficit."
 technocrat_trade:0 "German Trade Programs"
 technocrat_trade2:0 "German Trade Programs"
 GER_hitler_techno_trade:0 "Liberalized Trade Programs"
 GER_hitler_techno_trade_desc:0 "We can increase quotas and lower traffic so that we can foster cooperation with foreign powers."
 GER_four_year_plan:0 "Four-Year Plan"
 GER_four_year_plan_desc:0 "Göring's Four-Year Plan will make sure that the German Economy is ready for war within Four Years!"
 GER_goring_werke: "Nationalize the Iron Industry"
 GER_goring_werke_desc:0 "By establishing Reichswerke Hermann Göring, we can more effectively process iron into steel, and for a cheaper price."
 GER_chem_plant_experiments:0 "Chemical Plant Experiments"
 GER_chem_plant_experiments_desc:0 "By investing in Oil Refinaries, we can better support our War Machine, leading to a greater Autarchy."
 GER_strasser_economy_start:0 "The National Socialist Economy"
 GER_strasser_economy_start_desc:0 "Our National Socialist State will have a planned economy, similar to that of the Soviet Union, but different."
 GER_strasser_nationalize_land:0 "Junkerland in Deutschenhand"
 GER_strasser_nationalize_land_desc:0 "One of our first reforms must be to put the lands of the nobles into the hands of the German People!"
 GER_strasser_redistribute_wealth:0 "Wealth Redistribution"
 GER_strasser_redistribute_wealth_desc:0 "Now that the Noble's Lands are in Germany's Hands, it would be a trifle to...convince...the Junkers into giving up their wealth."
 GER_strasser_nationalize_railways:0 "Develop the Volksbahn"
 GER_srassser_nationalize_railways:0 "We need to redefine the Reichsbahn into the Deutsche Volksbahn, or German People's Rail Service."
 GER_strasser_nationalize_industry:0 "Nationalize Industry"
 GER_strasser_nationalize_industry_desc:0 "We must seize all industrial production in the country and put it to work for the Social Republic!"
 GER_strasser_nationalize_resource_production:0 "Nationalize Resource Refineries"
 GER_strasser_nationalize_resource_production_desc:0 "We must seize all resource refineries in Germany to develop our new war machine!"
 GER_strasser_nationalize_military:0 "Nationalize Military Industry"
 GER_strasser_nationalize_military_desc:0 "We will seize military industries in Germany to aid in our rearmament. Secretly, of course."
 GER_strasser_remove_econ_crisis:0 "Stabilize the Mark"
 GER_strasser_remove_econ_crisis_desc:0 "By stabilizing our currency and issuing trade restrictions, we can protect German Industries and re-develop the economy."
 GER_strasser_four_year_plan:0 "Four-Year Plan"
 GER_strasser_four_year_plan_desc:0 "A Stalin-Style Yearly Plan will help us maintain continued economic growth and keep us on the path to true National Socialism."
 GER_strasser_inf_I:0 "Infrastructure Effort I"
 GER_strasser_inf_I_desc:0 "We need new railways and roads to transport people and supplies."
 GER_strasser_inf_II:0 "Infrastructure Effort II"
 GER_strasser_inf_II_desc:0 "We need new railways and roads to transport people and supplies."
 GER_strasser_inf_III:0 "Infrastructure Effort III"
 GER_strasser_inf_III_desc:0 "We need new railways and roads to transport people and supplies."
 GER_strasser_mil_I:0 "Military Effort I"
 GER_strasser_mil_I_desc:0 "We need new factories to arm our new military."
 GER_strasser_mil_II:0 "Military Effort II"
 GER_strasser_mil_II_desc:0 "We need new factories to arm our new military."
 GER_strasser_mil_III:0 "Military Effort III"
 GER_strasser_mil_III_desc:0 "We need new factories to arm our new military."
 GER_strasser_civ_I:0 "Civilian Effort I"
 GER_strasser_civ_I_desc:0 "We need new factories to be able to construct new establishments and factories at a moment's notice."
 GER_strasser_civ_II:0 "Civilian Effort II"
 GER_strasser_civ_II_desc:0 "We need new factories to be able to construct new establishments and factories at a moment's notice."
 GER_strasser_civ_III:0 "Civilian Effort III"
 GER_strasser_civ_III_desc:0 "We need new factories to be able to construct new establishments and factories at a moment's notice."
 GER_expand_kr_society_strasser:0 "Expand the Kepler Institute"
 GER_expand_kr_society_strasser_desc:0 "With the newly-renamed Kaiser Wilhelm Society, we will be able to enhance our military and industrial capabilities even faster."
 GER_military_economy_start:0 "Military-Industrial Complex"
 GER_military_economy_start_desc:0 "While we will not make it official, we will begin the creation of a Military-Industrial Captialist state."
 GER_milind_railroads:0 "Military Railroads"
 GER_milind_railroads_desc:0 "We need to construct more railroads in order to better transport soldiers."
 GER_milind_railroads2:0 "Continued Railroad Construction"
 GER_milind_railroads2_desc:0 "We need to construct even more railroads in order to better transport supplies."
 GER_milind_civ_factory:0 "Militärischer Baudienst"
 GER_milind_civ_factory_desc:0 "The Militärischer Baudienst, or Military Construction Service will create a military department specifically for building military structures and factories."
 GER_milind_ban_unions:0 "Ban Trade Unions"
 GER_milind_ban_unions_desc:0 "We will force the Trade Unions in Germany to disband, in order to prevent leftist influences from brainwashing them!"
 GER_milind_support_agrarians:0 "Subsidies for Agriculture"
 GER_milind_support_agrarians_desc:0 "We will subsidize agriculture so that the German Farmers can have some relief from the economic crisis."
 GER_milind_support_miners: "Subsidies for Mining"
 GER_milind_support_miners_desc:0 "We will subsidize agriculture so that the German Mining Industry can have some relief from the economic crisis."
 GER_milind_clear_land:0 "Land Purchase Subsidies"
 GER_milind_clear_land_desc:0 "We will encourage people to start their own farms so that they can support the German People and Economy."
 GER_milind_scout_for_depositis:0 "Scout for Resources"
 GER_milind_scout_for_depositis_desc:0 "With our new mining subsidies, we can look for more deposits to support our army development."
 GER_milind_streamlined_economy:0 "Streamlined Economy"
 GER_milind_streamlined_economy_desc:0 "With our new subsidies and factories, we can declare our economy streamlined and recovered!"
 GER_milind_cut_down_on_trade:0 "Raise new Tariffs"
 GER_milind_cut_down_on_trade_desc:0 "With our economy back in shape, we need to cut down on exports in order to keep resources to develop a war machine!"
 GER_milind_milI:0 "Short Term Armament Plan"
 GER_milind_milI_desc:0 "We must increase our military capabilities quickly, to wage war now!"
 GER_milind_infI:0 "Long Term Armament Plan"
 GER_milind_infI_desc:0 "We must increase our military capabilities slowly, to make it more effective in future."
 GER_milind_milII:0 "Continue the Plan"
 GER_milind_milII_desc:0 "More Military Factories will increase our abilities to quickly arm troops."
 GER_milind_milIII:0 "Finish The Plan"
 GER_milind_milIII_desc:0 "At the end of this plan, we should have all the military factories we need to quickly wage war!"
 GER_milind_civI:0 "Develop Civilian Industry"
 GER_milind_civI_desc:0 "With increased civilian industry, we should be able to build more military buildings faster."
 GER_milind_civII:0 "Develop More Civilian Industry"
 GER_milind_civII_desc:0 "Although acceleration was slow, at top speed, we should be able to arm an enourmous force!"
 GER_expand_kr_society_milind:0 "Expand the Kaiser Wilhelm Society"
 GER_expand_kr_society_milind_desc:0 "With our expanded construction capabilities, we should be able to increase our scientific capabilities as well!"
 GER_remove_league:0 "Withdraw From the League of Nations"
 GER_remove_league_desc: "The League of Nations, useless as it is, stands against our plans for conquest!"
 GER_ambitions:0 "Ambitions on Us!"
 GER_western_ambitions:0 "Western Direction"
 GER_western_ambitions_desc:0 "We will fight against the Western Nations, including the Ultimate Enemy: Britain."
 GER_plebiscite_in_saarland:0 "Plebiscite in Saarland"
 GER_plebiscite_in_saarland_desc:0 "By Rule of Nations Decree, the Saarland should hold a referendum to determine its future. Even though we are no longer a league of nations member, we shall demand the referendum take place."
 GER_demilitarized_rhineland:0 "Remilitarized the Rhineland"
 GER_demand_saarland:0 "Demand the Saarland"
 GER_demand_saarland_desc:0 "We cannot trust the League of Nations with the Saarland, we must demand that the French turn over the land to us immediately!"
 GER_remilitarize_rhineland:0 "Remilitarize the Rhineland"
 GER_remilitarize_rhineland_desc:0 "The Franco-Soviet Treaty of 1935 is going to Encircle our state! We must remilitarize the Rhineland to prevent this from becoming a problem."
 GER_western_claims:0 "Claim Old Territories"
 GER_western_claims_desc:0 "The French and the Belgians claim some of our old territories. We need to make it clear that we want them back."
 GER_war_with_france:0 "War with France"
 GER_war_with_france_desc:0 "We must make it clear: France is our enemy, and now they shall fall!"
 GER_schleiffen_plan_part_two_steel_boogaloo:0 "Attack Belgium"
 GER_schleiffen_plan_part_two_steel_boogaloo_desc:0 "Going through Belgium and Luxembourg would be easier than going through the maginot line. We will also avoid having to invade the Netherlands which wold increase the amount of coast to defend from an English invasion. If the Schlieffen Plan almost succeded in the previous war, why not try it again."
 GER_around_maginot:0 "Fall Gelb"
 GER_around_maginot_desc: "To avoid the Maginot Line we shall invade through the low countries. Once they are secured we will move on to invade northen France like in the previous war. But this time Tanks will lead the charge!"
 GER_colonial_claims:0 "Form the RKB"
 GER_colonial_claims_desc:0 "We will form the Reichskolonialbund to show the world that we deserve to return to our old colonies!"
 GER_want_mittleafrika:0 "Claim Mittelafrika"
 GER_want_mittleafrika_desc:0 "We will work towards linking our former colonial lands with each other, even if we do not own them."
 GER_westwall:0 "Fortify the Westwall"
 GER_westwall_desc:0 "We must re-construct the Sigfried Line to defend Germany in case of attack!"
 GER_war_with_britian:0 "Operation Sealion"
 GER_war_with_britian_desc:0 "We must begin the operation to attack the United Kingdom. We will call it: Sealion..."
 GER_Invade_Ireland:0 "Unternehmen Grün"
 GER_Invade_Ireland_desc:0 "Operation Green is necessary to supplement our invasion of the United Kingdom. It will draw British Troops away from Great Britain, and prevent them from using Ireland as their own base. Furthermore, it will give us more ports and airbases."
 GER_annex_spain:0 "Attack Spain"
 GER_ally_with_spain:0 "Ally With Spain"
 GER_ally_with_spain_desc:0 "Spain is our ideological ally, so we should bring them into the war formally!\n\nDue to the lack of Spanish Civil War, this path is implemented, but unusable. Go to war for now."
 GER_war_with_spain:0 "War With Spain"
 GER_war_with_spain_desc:0 "Spain is another obstacle to our domination. Even if they aren't, we can still get to Gibralter through them."
 GER_ally_with_portugal:0 "Ally With Portugal"
 GER_ally_with_portugal_desc:0 "We might be able to swing Portugal into the war on our side, to better attack British Shipping."
 GER_fund_austrian_ss:0 "Fund Austrian SS"
 GER_fund_austrian_ss_desc:0 "We will fund the Austrian Branch of the SS in order to achieve a faster Anchluss of Austria."
 GER_july_putsch:0 "Order a Putsch in Austria"
 GER_july_putsch_desc:0 "We must order the National Socialists in Austria to attack the government and take over the country, for immediate annexation!"
 GER_anschluss:0 "Anschluss"
 GER_anschluss_desc:0 "Austria is German; There's no denying that. However, we must finally establish our administration and make it a true German Province!"
 GER_heim_ins_reich:0 "Heim ins Reich"
 GER_heim_ins_reich_desc:0 "Heim ins Reich, or Home to the Reich, will be our foreign policy from now on. We shall attempt to regain all of German land, from Memel to Antwerp!"
 GER_heim_ins_reich_id:0 "Proclaimed Grossdeutschland"
 GER_maintain_kleindeutschland:0 "Maintain Kleindeutschland"
 GER_maintain_kleindeutschland_desc:0 "We will seek to keep our Germany small, but we will still be vigilant for invaders!"
 GER_maintain_kleindeutschland_id:0 "Proclaimed intention to retake territories"
 GER_sudetenland:0 "Demand the Sudetenland"
 GER_sudetenland_desc:0 "In order to unite all the Germans, we must demand the Sudeteland from the Czechoslovaks."
 GER_sudetenland_war:0 "War for the Sudetenland"
 GER_sudetenland_war_desc: "The Czechs have refused our demands, and now we are ready for war!"
 GER_first_vienna_award:0 "First Vienna Award"
 GER_first_vienna_award_desc:0 "There is a significant Magyar minority in Slovakia. We should give Hungary Southern Slovakia to help weaken the Czechoslovak state."
 GER_annex_cze:0 "Partition Czechoslovakia"
 GER_annex_cze_desc:0 "The Czech Lands are the next target of our conquests. We must occupy their lands and create friendly regimes!"
 GER_demand_slovenia:0 "Demand Slovenia"
 GER_demand_slovenia_desc:0 "We should demand Slovenia from the Yugoslav Nation in order to either grow our nation, provide a way to go to war with them, or both."
 GER_war_with_yug:0 "War With Yugoslavia"
 GER_war_with_yug_desc:0 "We will go to War with Yugoslavia to add their territories to our Reich!"
 GER_demand_swi_annex:0 "Operation Tannenbaum"
 GER_demand_swi_annex_desc:0 "Switzerland holds many territories valuable to our Reich because of their German Speaking Population. The very existence of this direct democracy also serves to personally insult the Fürher. Ergo, we shall launch an invasion to take the \"Black spot of Europe\" off the map!"
 GER_attack_swi:0 "Operation Tannenbaum"
 GER_attack_swi_desc:0 "The Swiss people suffer under a liberal-democratic government. Pah! We shall show them that the German way is truly superior!"
 GER_second_vienna_award:0 "Second Vienna Award"
 GER_second_vienna_award_desc: "We will threaten Romania to turn over Northern Transylvania to the Hungarians, as many ethnic Magyars live there."
 GER_war_with_hun:0 "Operation Margarethe"
 GER_war_with_hun_desc:0 "We must go to war with Hungary in order to better control our borders."
 GER_arrow_cross_coup:0 "The Arrow Cross Party Controls Hungary"
 GER_remove_horthy:0 "Operation Panzerfaust"
 GER_remove_horthy_desc:0 "Although Horthy can cooperate with our government, we can assasinate him and install a National Socialist Party, instead."
 GER_friend_italy:0 "Germany Improved our Relations"
 GER_antag_italy:0 "Germany Decreased our Relations"
 GER_befriend_italy:0 "Befriend Italy"
 GER_befriend_italy_desc:0 "We can work with the Italians against our common enemies."
 GER_antagonize_italy:0 "Antagonize Italy"
 GER_antagonize_italy_desc:0 "Italy stands in the way of our Reich! We must take them down!"
 GER_austria_friend_modifier:0 "Brudershaft Treaty"
 GER_austria_friend_denied:0 "Austria denied our Friendship"
 GER_austria_accepted_treaty:0 "Austria Signed the Brudershaft Treaty."
 GER_befreind_austria:0 "The Brudershaft Treaty"
 GER_befreind_austria_desc:0 "We will sign a treaty of friendship with Austria, indicating that Germany and Austria are brothers, yet seperate."
 GER_invest_in_austria:0 "Invest in Austria"
 GER_invest_in_austria_desc:0 "We will invest in the Austrian economy to strengthen our influence in the country."
 GER_alliance_with_austria:0 "Alliance with Austria"
 GER_alliance_with_austria_desc:0 "We should extend our protection of Austria into a full alliance, just like before the First Weltkrieg!"
 GER_negotiate_rights_for_sud_germans: "Garantiebrief"
 GER_negotiate_rights_for_sud_germans_desc: "The Garantiebrief, or Treaty of Guarantees, will, in a similar vein to the Reichskonkordat, will Guarantee full rights and freedoms for Ethnic Germans living in [CZE.GetNameDef], and for Ethnic Czechs and Slovaks living in [GER.GetNameDef]. It will also allow German buisnesses to invest in Sudeten German-owned firms."
 GER_cze_accepts_guar_treaty:0 "[CZE.GetNameDef] has accepted the Garantiebrief"
 garantiebrief_yes:0 "[CZE.GetNameDef] has accepted the Garantiebrief"
 GER_cze_denies_guar_treaty:0 "[CZE.GetNameDef] has declined the Garantiebrief"
 garantiebrief_no:0 "[CZE.GetNameDef] has declined the Garantiebrief"
 CZE_did_not_sign_guar_treaty:0 "Declined the Garantiebrief"
 GER_cze_accepts_guns:0 "[CZE.GetNameDef] Accepted Arms Shipments."
 GER_cze_denies_guns:0 "[CZE.GetNameDef] Denied Arms Shipments."
 GER_send_arms_to_CZE:0 "Offer Arms to the Czechs"
 GER_send_arms_to_CZE_desc:0 "We will send arms to [CZE.GetNameDef] in order to help them fight against Hungarian or Polish Aggression."
 GER_alliance_with_cze:0 "Alliance with Czechoslovakia"
 GER_alliance_with_cze_desc:0 "We should propose an alliance to [CZE.GetNameDef] in order to better defend our Order against aggressors."
 GER_war_with_rom:0 "Operation Margarethe II"
 GER_war_with_rom_desc:0 "We are desparate for oil! We should attack Romania to secure their oil fields."
 GER_uses_DKP:0 "The German Conservative Party has been reformed."
 GER_affirm_romanian_borders:0 "Affirm Romanian Borders"
 GER_affirm_romanian_borders_desc:0 "We should let the Romanian people know that the Germans stand with them against all threats, and offer them protection."
 GER_rom_agrees_for_protection:0 "Romania has accepted German Protection"
 GER_rom_allows_guarantee:0 "Romania has accepted German Protection"
 GER_rom_does_not_allow_guarantee:0 "Romania has declined German Protection"
 GER_rom_does_not_agree_for_protection:0 "Romania has declined German Protection"
 GER_trade_with_romania:0 "Help Romania with Oil Production"
 GER_trade_with_romania_desc:0 "If we were to help Romania produce more oil, we could possibly secure ourselves trading rights."
 GER_agreed_to_expedition:0 "Romania agreed to let us scout for oil"
 GER_rom_found_oil:0 "Found Oil in Romania"
 GER_rom_found_oil2:0 "Found Oil in Romania"
 GER_rom_found_oil3:0 "Found Oil in Romania"
 could_take_time:0 "Should Romania Accept, the results might not be known for some time."
 GER_rom_does_not_allow_expedition:0 "Romania declined our expedition."
 GER_alliance_with_ROM:0 "Alliance with Romania"
 GER_alliance_with_ROM_desc:0 "We should expand our Guarantee of Romania and turn it into a formal alliance. We have common enemies, and we want to maintain access to Romanian Oil."
 GER_allow_greater_hungary:0 "Allow Greater Hungary"
 GER_allow_greater_hungary_desc:0 "Should we allow Hungary to grow strong, we could have a very effective ally against the Bolsheviks. However, should we accept Hungarian Expansion, we would alienate surrounding countries."
 GER_allowed_greater_hungary:0 "Allowed Us To Expand"
 GER_pressure_austria:0 "Pressure Austria for the Burgenland"
 GER_pressure_austria_desc:0 "Hungary claims the Burgenland, a border region between Austria and Hungary, as being their rightful land. We should force the Austrians to give up this land, to cement our friendship to the Hungarians.
 GER_alliance_with_hungary:0 "Alliance with Hungary"
 GER_alliance_with_hungary_desc:0 "We should formally ally Hungary to better help them become a regional power."
 GER_send_experts_to_YUG:0 "Send Military Experts to Yugoslavia"
 GER_send_experts_to_YUG_desc:0 "We should help the Belgrade Government against their enemies by sending German Advisers."
 GER_YUG_took_advisers:0 "Yugoslavia accepted our advisement."
 GER_YUG_not_took_advisers:0 "Yugoslavia denied our advisement."
 GER_send_guns_to_YUG:0 "Send Guns to Yugoslavia"
 GER_send_guns_to_YUG_desc:0 "We will offer weapons to Yugoslavia to help them develop a strong army."
 GER_alliance_with_yug:0 "Alliance with Yugoslavia"
 GER_alliance_with_yug_desc:0 "In order to better fight the Italians and Hungarians, we will offer a formal alliance to [YUG.GetNameDef]."
 GER_scandanavia:0 "Northern Direction"
 GER_scandanavia_desc:0 "Scandanavia is technically German and another front we have to deal with."
 GER_war_with_denmark:0 "Operation Weserübung: Denmark"
 GER_war_with_denmark_desc:0 "We will begin Operation Weserübung by invading Denmark. Our ultimate goal is to control the Skagerrak, but Denmark also controls Northern Schleswig, which we can take back!"
 GER_offer_to_DEN:0 "Defensive Treaty with Denmark"
 GER_offer_to_DEN_desc:0 "We should offer the Danes a guarantee of independence in exchange for letting us move troops through their territory. This would allow us to move without wasting resources on combat."
 GER_war_with_norway:0 "Operation Weserübung: Norway"
 GER_war_with_norway_desc:0 "We will continue Operation Weserübung by invading Norway, in order to prevent supplies from reaching Finland and to prevent an assault launched from Oslo."
 GER_war_with_sweden:0 "Invade Sweden"
 GER_war_with_sweden_desc:0 "Despite Sweden's neutrality policy, we will invade them to secure their Northern Resources."
 GER_trade:0 "Trade Deals with Germany"
 GER_war_with_finland:0 "Operation Weserübung: Finland"
 GER_war_with_finland_desc:0 "We will complete our Invasion of Scandinavia by attacking Finland, to secure another Front against the Soviets."
 GER_ally_finland:0 "Offer Finland Alliance Membership"
 GER_ally_finland_desc:0 "We should offer an alliance to [FIN.GetNameDef] to prevent the Soviets from extending their influence to Scandanavia."
 GER_non_aggression_with_poland:0 "Non-Aggression Pact with Poland"
 GER_non_aggression_with_poland_desc:0 "We should sign a treaty with Poland, in which we recognize each other's borders and end the Customs War. Really, we're just buying ourselves time to re-arm."
 GER_pol_does_NAP:0 "Poland Signs the Non-Aggression Pact"
 GER_pol_does_not_NAP:0 "Poland Does Not Sign the Non-Aggression Pact"
 GER_pol_does_NAP2:0 "Poland Renews the Non-Aggression Pact"
 GER_pol_does_not_NAP2:0 "Poland Does Not Renew the Non-Aggression Pact"
 GER_guarantee_pol:0 "Guarantee Poland"
 GER_guarantee_pol_desc:0 "We should offer a Guarantee to Poland, so that both the Poles and the Germans can work together against the Bolsheviks."
 GER_prepare_war_poland_focus:0 "Prepare for war with Poland"
 GER_prepare_war_poland_focus_desc:0 "We should start preparations for the inevitable war with Poland!"
 GER_war_with_poland:0 "War With Poland"
 GER_war_with_poland_desc:0 "The time has come! We will attack Poland in order to retake our rightful land, and impose our New Order over the Poles!"
 GER_alliance_with_poland:0 "Alliance with Poland"
 GER_alliance_with_poland_desc:0 "We should ally Poland to fight against the Bolsheviks! Together, we will end the Communist threat!"
 GER_danzig_for_slovakia:0 "Danzig for Slovakia"
 GER_danzig_for_slovakia_desc:0 "Compared to Danzig, Slovakia is nearly worthless to us. We will offer the Poles the chance to annex Slovakia, in exchange for the Danzig Corridor and Poznan."
 GER_anti_comintern_pact:0 "Anti-Comintern Pact"
 GER_anti_comintern_pact_desc: "We must create a treaty with other states that affirms the Comintern as an anti-civilization organization!"
 GER_accepted_anti_com_pact:0 "Anti-Comintern Pact Member"
 GER_war_with_sov:0 "Take Down the Bolshevik Menace"
 GER_war_with_sov_desc:0 "Now is the time we can finally get rid of the Soviet Union! By eliminating socialism in the east, we can ensure security for our nation!"
 GER_molotov_ribbentrop_pact:0 "Pact with the Soviet Union"
 GER_molotov_ribbentrop_pact_desc:0 "A Non-Aggression pact and informal alliance with the Soviet Union would allow us to expand in Poland and the West without fear of reprisal!"
 GER_alliance_with_SOV:0 "Alliance with the Soviet Union"
 GER_alliance_with_SOV_desc:0 "An alliance with the Soviet Union would go a long way; the industrial might of Germany and the Soviet Union combined would be an unstoppable force!"
 GER_did_not_join_alliance:0 "Did not join alliance!"
 GER_works_with_commies:0 "Works with Communists"
 GER_demand_memelland:0 "Ultimatum to Lithuania"
 GER_demand_memelland_desc:0 "Memelland is currently under the control of Lithuania. We must demand its return, or Lithuania will face war!"
 GER_memelland_for_alliance:0 "Treaty of Kaunas"
 GER_memelland_for_alliance_desc:0 "We will of the the Lithuanians protection if they let us annex the Memelland."
 GER_alliance_with_baltics:0 "The Baltic Treaty"
 GER_alliance_with_baltics_desc:0 "We will offer the Baltic nations protection from the Soviets. They are partly German anyways, so it works."
 GER_war_for_baltics:0 "Operation Beige"
 GER_war_for_baltics_desc:0 "We will launch an operation to take over the Baltic States, and secure a wider front against the Soviets."
 GER_our_own_faction:0 "Create Our Faction"
 GER_our_own_faction:0 "We will be the leader of our own alliance! We shall lead the world!"
 GER_join_allies:0 "Join the Allies"
 GER_join_allies_desc:0 "We will ask to join the British Faction in an attempt to isolate the Soviet Union."
 GER_join_comintern:0 "Join the Comintern"
 GER_join_comintern_desc:0 "We will ask to join the Soviet Alliance to help us defeat the Capitalist West."
 GER_oster_conspiracy_focus:0 "Success of the Oster Conspiracy"
 GER_oster_conspiracy_focus_desc:0 "The Oster Conspiracy has succeeded, killing the Führer and establishing Military Rule."
 GER_oster_conspiracy_choose_government:0 "Choose the New Government"
 GER_oster_conspiracy_choose_government_desc:0 "While the New Government will be a military dictatorship, we must choose if we are to restore Kaiser Wilhelm II."
 GER_oster_conspiracy_monarchy:0 "A Restored Monarchy"
 GER_oster_conspiracy_monarchy_desc:0 "We have chosen to restore the Monarchy under Wilhelm II!"
 GER_oster_conspiracy_military:0 "A Military Dictatorship"
 GER_oster_conspiracy_military_desc:0 "We have chosen to maintain the Military as the Ultimate Authority in Germany."
 GER_oster_restored_monarchy:0 "The Monarchy has been restored"
 GER_oster_military_dictatorship:0 "A military dictatorship has been maintained."
 GER_oster_purge_right_wing:0 "Purge the Right-Wing"
 GER_oster_purge_right_wing_desc:0 "We will arrest the top leaders of the Former Regime, some of which have already fled, and try them for their crimes."
 GER_oster_end_totalitarianism:0 "End Totalitarianism"
 GER_oster_end_totalitarianism_desc:0 "The New Government will be Authoritarian, but the excesses of the previous Regime was too much."
 GER_oster_royal_officers:0 "Royal Officers"
 GER_oster_royal_officers_desc:0 "We must integrate the Nobility and Royalty into the army to gain the support of our soldiers."
 GER_oster_military_royal_party:0 "A New Royalist Party"
 GER_oster_military_royal_party_desc:0 "We will create a new Military-Royalist party for our beauracrats and officers."
 GER_oster_military_autonomy:0 "Give the Military Autonomy"
 GER_oster_military_autonomy_desc:0 "Although the military rules the country, we will give the actual military high command distance from the Reichstag, so more efficient plans can be drawn up without the need to consider political repercussions."
 GER_oster_defensive_focus:0 "Even though the new government is anti-war, we must still be ready if anybody attacks us."
 GER_july_20_full_success:0 "Operation Valkyrie Completely Succeeded!"
 GER_july_20_focus:0 "The Success of Operation Valkyrie"
 GER_july_20_focus_desc:0 "The plot to kill Hitler has worked! Germany is now under control of the Military, DNVP, and members of the Zentrumspartei!"
 GER_july_20_end_nazism:0 "Eliminate National Socialist Influence"
 GER_july_20_end_nazism_desc:0 "We must destroy the National Socialists if we are ever to save Germany!"
 GER_july_20_clamp_down_politics:0 "Stabilize the Country"
 GER_july_20_clamp_down_politics_desc:0 "If we are to protect the German people, we must stabilize the government!"
 GER_july_20_loosen_chains:0 "Loosen the Chains"
 GER_july_20_loosen_chains_desc:0 "To secure the people's loyalty, we must increase their rights."
 GER_july_20_repair_effort:0 "Repair Effort"
 GER_july_20_repair_effort_desc:0 "We need to focus on repairing our nation if we are to survive!"
 GER_relinquish_claims:0 "Relinquish Claims on the West"
 GER_relinquish_claims_desc:0 "We shall relinquish our claims on the Western Powers in order to better fight in the East!"
 GER_denounce_democracy:0 "Denounce Democracy"
 GER_denounce_democracy_desc:0 "Democracy is an evil that must be crushed! Democracy allows people to wander off on their own, without guidance from the state! This cannot do!"
 GER_anglo_german_naval_agreement:0 "Anglo-German Naval Agreement"
 GER_anglo_german_naval_agreement_desc:0 "The British are concerned about our Naval Expansion. We shall sign a treaty assuring them that we will remain within about one-third of their tonnage. Obviously, we do not have to abide by this treaty..."
 GER_naval_treaty:0 "Anglo-German Naval Agreement"
 GER_franco_german_summit:0 "Franco-German Summit"
 GER_franco_german_summit_desc:0 "We should approach the French and assure them that we want to maintain peace with them."
 GER_anglo_german_naval_rivalry:0 "Anglo-German Naval Rivalry"
 GER_anglo_german_naval_rivalry_desc:0 "We shall continue to build up our navy, despite agreements with the British!"
 GER_anglo_german_naval_coop:0 "Anglo-German Naval Cooperation"
 GER_anglo_german_naval_coop_desc:0 "If Britain accepts some naval cooperation, then we could possibly better our naval technology, and even ally with the British against the Soviets!"
 GER_spanish_question:0 "The Spanish Question"
 GER_spanish_question_desc: "With the End of the Spanish Civil War, we can now choose how to interact with Spain. We can have them as allies, or as enemies to be Crushed! Which shall it be?"
 GER_eupen_for_defense: "Eupen for Defense"
 GER_eupen_for_defense_desc:0 "We shall offer the Belgians a guarantee of their indpendence, provided they cede Eupen-Malmady to us, of course."
 GER_renegotiate_rhineland:0 "Renegotiate the Rhineland"
 GER_renegotiate_rhineland_desc:0 "Instead of forcibly remilitarizing the Rhineland, we should talk with the French and get their permission to slowly move back into our territory."
 GER_anglo_german_respect_colonies:0 "A Concilliatory Policy"
 GER_anglo_german_respect_colonies_desc:0 "If we are to fight the French and the Soviet Union, we should at first make sure the British are on our side! While they will likely not allow us into their alliance without our being at war first, it is still an important step towards Anglo-German Hegemony!"
 GER_respect_colonies:0 "Respected our Colonial Borders"
 GER_plebiscite_in_alscase: "Plebiscite In Alsace"
 GER_plebiscite_in_alscase_desc:0 "Alsace still has a large German population. We should ask the French to hold a plebiscite, similar to the one in Saarland. However, we must assure them that we will respect the result as the natural borders of France and Germany."
 GER_austro_german_agreement:0 "Austro-German Agreement"
 GER_austro_german_agreement_desc:0 "An agreement with Austria would serve to take the Austrians out of the Italian Sphere and move it into ours. This would go a long way in bringing Austria closer to integration into the Reich, or the Anchshluss."
 GER_ally_ROM:0 "Alliance with Romania"
 GER_ally_ROM_desc:0 "An Alliance with Romania would go a long way in stopping the Soviets from expanding into Eastern Europe!"
 GER_ally_HUN_hir:0 "Ally Hungary"
 GER_ally_HUN_hir_desc:0 "Hungary must be brought into the alliance to reiforce the Anti-Bolshevik Bulwark!"
 AUS_stayed_with_italy:0 "Stayed in our sphere of influence"
 AUS_left_sphere:0 "Left our sphere of influence"
 GER_aus_came_to_us:0 "Came to our sphere"
 DIPLOMACY_MILACC:0 "Military Access"
 GER_alliance_with_TUR:0 "Alliance with Turkey"
 GER_alliance_with_TUR_desc:0 "With our ongoing war with the Russians, we should form an alliance with Turkey to present Moscow with a third front!"
 GER_opens_up_alliance_with_ENG:0 "§GThis allows us to make an alliance with the United Kingdom in case of war.§!"
 
 #Some of ^ should be removed, do after finishes new tree
 GER_unlocks_below_focuses:0 "§GThis Branch of the Focus Tree will be unlocked!§!"
 german_focus_hitler:0 "Hitlerist German Focus Tree"
 GER_Hitler_Politics_Start:0 "Gleichschaltung"
 GER_Hitler_Politics_Start_desc:0 "The National Socialist German Workers' Party is officially a National Socialist party claiming to represent the worker, but is really a platform for Adolf Hitler's personal Messiah Cult. These National Socialists believe that Hitler - and only Hitler - can save Germany."
 GER_Hitler_Politics_Reichstag_Fire_Decree:0 "Reichstag Fire Decree"
 GER_Hitler_Politics_Reichstag_Fire_Decree_desc:0 "The Reichstag fire is the perfect excuse to begin destroying German democracy. With Hindenburg's approval, we can now suspend many civil liberties, and effectively dismantle the KPD as a political organization through a wave of arrests."
 GER_Hitler_Politics_Enabling_Act:0 "Ermächtigungsgesetz"
 GER_Hitler_Politics_Enabling_Act_desc:0 "The Enabling Act, or, the \"Law to Remedy the Distress of People and Reich\" shall be our way to secure power in the nation by instituting full rule by decree. Essentially, the Reichskanzler will be able to enact policy without the Reichstag."
 GER_Hitler_Politics_Coordinate_Civil_Service:0 "Coordinate the Civil Service"
 GER_Hitler_Politics_Coordinate_Civil_Service_desc:0 "\"Coordination\" of the Civil Service means removing any non-Nazi Bureaucrat to ensure that our Government is perfectly in tune with our Ideology."
 GER_Hitler_Politics_Ban_Political_Parties:0 "Ban Rival Political Parties"
 GER_Hitler_Politics_Ban_Political_Parties_desc:0 "All Political Parties with the exception of the NSDAP will henceforth be banned! Only we will be allowed to wield political influence!"
 GER_Hitler_Politics_Centralize_Provinces:0 "Centralize the Provinces"
 GER_Hitler_Politics_Centralize_Provinces_desc:0 "Abolition of the Länder - the German Provincial Councils - and the subordination of local Bureaucracies to the Gaultiers should effectively make the Führer the ultimate authority in all Germany."
 GER_Hitler_Politics_Sondergehricht:0 "Sondergericht"
 GER_Hitler_Politics_Sondergehricht_desc:0 "\"Special Courts\" should be used as political courts, to eliminate dissidents and rivals."
 GER_Hitler_Politics_Work_Towards_The_Fuhrer:0 "Work Towards The Führer"
 GER_Hitler_Politics_Work_Towards_The_Fuhrer_desc:0 "In the new Bureaucracy, \"Working towards the Führer\" means to take actions and policies that are in line with Hitlerist ideology without direct orders from Hitler. Those who do so successfully are expected to gain favor. Additionally, Hitler will often give orders to bureaucrats, often making them oppose each other to get the job done."
 GER_Hitler_Politics_Hitler_Youth:0 "Integrate the Hitler Youth"
 GER_Hitler_Politics_Hitler_Youth_desc:0 "Although the Hitler Youth already exists as a Party Function, it should exist as both a Party and a State Organization, in line with our Gleichschaltung policies."
 GER_Hitler_Politics_Integrate_Far_Right_Groups:0 "Integrate Far-Right Political Groups"
 GER_Hitler_Politics_Integrate_Far_Right_Groups_desc:0 "Political Groups already on the Far-Right might as well become part of our Organizations. We need to do so anyways to establish complete control."
 GER_Hitler_Politics_Integrate_Clubs:0 "Integrate All Organizations"
 GER_Hitler_Politics_Integrate_Clubs_desc:0 "With the Political Groups out of the way, all other organizations, be they choirs, football clubs, even the lowliest of knitting circles, must come under Government Control. Only the Army and the Churches will remain seperate - for now."
 GER_Hitler_Politics_Create_Gestapo:0 "Create the Geheime Staatspolizei"
 GER_Hitler_Politics_Create_Gestapo_desc:0 "The Secret State Police will be our counter-dissident unit; finding and removing any kind of Anti-National Socialist activity."
 GER_Hitler_Politics_Increase_Propaganda:0 "National Socialist Propaganda"
 GER_Hitler_Politics_Increase_Propaganda_desc:0 "Increasing propaganda output will be key to securing a positive public opinion of the Regime."
 GER_Hitler_Politics_Purge_SA:0 "Operation Kolibri"
 GER_Hitler_Politics_Purge_SA_desc:0 "The Strasserists and the SA still pose a mild threat to our power. We must eliminate them by force."
 GER_Hitler_Politics_Kirchenkampf:0 "Kirchenkampf"
 GER_Hitler_Politics_Kirchenkampf_desc:0 "The Influence on Christianity on our New Order is unacceptable. We must immediately take steps to ensure that these two incompatible entities do not bring each other to ruin."
 GER_Hitler_Politics_Establish_Reich_Church:0 "Proclaim the Reich Evangelical Church"
 GER_Hitler_Politics_Establish_Reich_Church_desc:0 "Although we are Anti-Christian, we must first move to co-opt the Churches before outright removing them."
 GER_Hitler_Politics_Reichskonkordat:0 "Reichskonkordat"
 GER_Hitler_Politics_Reichskonkordat_desc:0 "The Concordat between the Holy See and the German Reich should be a temporary stopgap to turn some Catholics to our side, but there should be no reason for us to follow up on this agreement..."
 GER_Hitler_Politics_Move_Against_Churches:0 "Move Against the Churches"
 GER_Hitler_Politics_Move_Against_Churches_desc:0 "We cannot wait. Now is the time that Religious Influence leaves Germany!"
 GER_Hitler_Politics_Draft_Clergy:0 "Draft the Clergy"
 GER_Hitler_Politics_Draft_Clergy_desc:0 "The Clergy should be sent to the front lines. They will inspire the troops and hopefully get killed in the process."
 GER_Hitler_Politics_The_Death_of_Hindenburg:0 "The Death of Hindenburg"
 GER_Hitler_Politics_The_Death_of_Hindenburg_desc:0 "Hindenburg's Death is very tragic, of course. But, with him out of the way, we can begin even more repressive policies..."
 GER_Hitler_Politics_Oath_Of_Obedience:0 "Führereid"
 GER_Hitler_Politics_Oath_Of_Obedience_desc:0 "Now that Hindenburg is dead, we can go ahead and make all soldiers swear unconditional allegiance to the Führer."
 GER_Hitler_Politics_Peoples_Courts:0 "Volksgerichtshof"
 GER_Hitler_Politics_Peoples_Courts_desc:0 "The People's Court will be a special court in order to serve as a Political-Military court that specializes in show trials. In most cases, we will barely have to make a trial."
 GER_Hitler_Politics_Reichspost:0 "Support the Reichspost"
 GER_Hitler_Politics_Reichspost_desc:0 "The basis of any bureaucracy is the ability to move letters and parcels. The Reichspost must be supported towards this goal."
 GER_Hitler_Politics_Full_Press_Control:0 "Formalize Press Control"
 GER_Hitler_Politics_Full_Press_Control_desc:0 "With a new decree from the Reich Press Leader, the Nazi Regime now has full control over the press and near-full control of the publishing market."
 GER_Hitler_Politics_Personality_Cult:0 "Expand the Personality Cult"
 GER_Hitler_Politics_Personality_Cult_desc:0 "Although Hitler's Personality Cult is established in German society quite firmly, it could use some further entrenchment."
 GER_Hitler_Politics_Nuremburg_Rally:0 "The Nuremburg Rally"
 GER_Hitler_Politics_Nuremburg_Rally_desc:0 "A Large Rally in Nuremburg would demonstrate the National Socialist Regime's Ability to command its people!"
 GER_Hitler_Politics_Hitler_Day:0 "A New National Holiday"
 GER_Hitler_Politics_Hitler_Day_desc:0 "Hitler's Birthday, much like the Kaiser's, will be a day of celebration and awards!"
 GER_Hitler_Politics_Political_Education_Institutes:0 "Nationalpolitische Erziehungsanstalten"
 GER_Hitler_Politics_Political_Education_Institutes_desc:0 "Youths selected to be future political leaders will be educated at Adolf Hitler Schools, and then moved to National Political Institutes of Education."
 GER_Hitler_Politics_Traditionalism:0 "Traditionalism"
 GER_Hitler_Politics_Traditionalism_desc:0 "Despite our National Revolutionary doctrine, National Socialism is still a socially reactionary movement. In addition, Anti-Intellectualism in our country must become unofficial national policy."
 GER_Hitler_Politics_OrPo:0 "Ordnungpolizei"
 GER_Hitler_Politics_OrPo_desc:0 "The \"Order Police\" will serve as a national police, a step above the Criminal Police. They will also serve as emergency fire brigades and coast guard."
 GER_Hitler_Politics_Racial_Laws:0 "Racial Laws"
 GER_Hitler_Politics_Racial_Laws_desc:0 "Although our government overlooks instances of racial discrimination, we will now make discrimination into a national policy.\n\n§YDeveloper Note: There will be no further mention of Nazi racial policy - s_team337§!"
 GER_Hitler_Politics_Anti_Intellectualism:0 "Blut und Boden"
 GER_Hitler_Politics_Anti_Intellectualism_desc:0 "Blood (refering to the \"racially\" defined group of people) and Soil (the land in which they settle) has been one of our main slogans, and we must continue to idealize the rural life and to call for a grand colonization of the Eastern Steppes. Due to the opposition of the Junkers, this may be more a propaganda effort than an actual policy."
 GER_Hitler_Politics_Volksgemeinschaft:0 "Promote Volksgemeinschaft"
 GER_Hitler_Politics_Volksgemeinschaft_desc:0 "Pan-German Nationalism must be one of the main national focuses of our government!"
 GER_Hitler_Politics_Control_The_Arts:0 "Control the Arts"
 GER_Hitler_Politics_Control_The_Arts_desc:0 "In order to stifle public thinking, we must control Artistic Expression!"
 GER_Hitler_Politics_Architecture:0 "Speer's Architecture"
 GER_Hitler_Politics_Architecture_desc:0 "Albert Speer shall be the Architect of the Reich. Form shall follow function, and our buildings will be designed to look good and grand after a thousand years."
 GER_Hitler_Politics_Compulsory_Training:0 "Compulsory Training"
 GER_Hitler_Politics_Compulsory_Training_desc:0 "All males - especially university students - shall be made to go through mandatory SA training."
 GER_Hitler_Economics_Start:0 "Economic Gleichschaltung"
 GER_Hitler_Economics_Start_desc:0 "Our Economic efforts will be focused on regaining military strength. Some civilian investments will be made, but the Military is our primary concern."
 GER_Hitler_Economics_Begin_Autobahn:0 "Begin Autobahn Construction"
 GER_Hitler_Economics_Begin_Autobahn_desc:0 "The Construction of Highways will provide us with new strategic supply routes as well as benefit the civilian population."
 GER_unlocks_reinhardt_decisions:0 "§YUnlocks more decisions in the §!§G[Root.GER_Autobahn]§!§Y Category.§!\n"
 GER_Hitler_Economics_Reinhardt_Program:0 "The Reinhardt Program"
 GER_Hitler_Economics_Reinhardt_Program_desc:0 "In addition to our Highway programs, we should construct new railroads and waterways while reducing taxes on the people."
 GER_Hitler_Economics_Mass_Privatization:0 "Mass Privatization"
 GER_Hitler_Economics_Mass_Privatization_desc:0 "Most State Enterprise should be privatized, including the banks, the roadways, and welfare organizations. Doing so will give us more money for our massive military spending, and make these businesses more friendly to our Regime."
 GER_Hitler_Economics_Court_Businesses:0 "Court Businesses"
 GER_Hitler_Economics_Court_Businesses_desc:0 "Although we support private enterprise, all enterprise must be \"Synchronized\" with the political and ideolgical needs of National Socialism, much like the rest of society."
 GER_Hitler_Economics_NSV:0 "Nationalsozialistische Volkswohlfahrt"
 GER_Hitler_Economics_NSV_desc:0 "Instead of Liberal or Socialist welfare systems, the \"National Socialist People's Welfare\" will give welfare only to those fit to recieve it. It shall be funded by \"donations\", which are \"freely\" given by the German people."
 GER_Hitler_Economics_DAF:0 "Deutsche Arbeitsfront"
 GER_Hitler_Economics_DAF_desc:0 "We shall abolish all trade unions except for our German Labour Front. However, instead of trying to bring benefits to the workers and peace to the workplace, the DAF shall only exist to increase output."
 GER_Hitler_Economics_Army_Expansion:0 "Increase the Military Budget"
 GER_Hitler_Economics_Army_Expansion_desc:0 "Our Military Budget must be increased in order to restore the Wehrmacht to prepare for the coming war!"
 GER_Hitler_Economics_Naval_Expansion:0 "Increase the Naval Budget"
 GER_Hitler_Economics_Naval_Expansion_desc:0 "A strong fleet capable of rivaling the Royal Navy will be key to establishing ourselves as a world power!"
 GER_Hitler_Economics_Construction:0 "Increase Construction Spending"
 GER_Hitler_Economics_Construction_desc:0 "Constantly using unemployed people as construction workers will give them something to do and cut down on unemployment."
 GER_Hitler_Economics_Promote_Motor_Ventures:0 "Promote Automobile Production"
 GER_Hitler_Economics_Promote_Motor_Ventures_desc:0 "Motor vehicles are getting increasingly popular. We should promote them, as they can also serve a military purpose."
 GER_Hitler_Economics_Cut_Down_On_Trade:0 "Limit Foreign Trade"
 GER_Hitler_Economics_Cut_Down_On_Trade_desc:0 "Trading with foreign nations is the antithesis of National Socialist thought. We must discourage resources from leaving Germany."
 GER_Hitler_Economics_Move_Towards_Autarky:0 "Move Towards Autarky"
 GER_Hitler_Economics_Move_Towards_Autarky_desc:0 "If we are to be successful in conquest, we must be able to supply ourselves."
 GER_MEFO_Repay_tt:0 "§RMEFO Bills will become due in §!§Yfive years.§!"
 GER_Hitler_Economics_MEFO:0 "MEFO Bills"
 GER_Hitler_Economics_MEFO_desc:0 "Organized through Hjalmar Schacht's  Metallurgische Forschungsgesellschaft, a front for our re-armament operations, MEFO bills are promissory notes that armament manufacturers will be able to renew for money, which we can pay back after five years. Promising money cannot possibly go wrong."
 GER_Hitler_Economics_Reorganize_Corporations:0 "Re-Organize Corporations"
 GER_Hitler_Economics_Reorganize_Corporations_desc:0 "Our State-Controlled Cartels and Private Corporations must be re-organized a little, to better serve the needs of the regime."
 GER_Hitler_Economics_Technocrats:0 "Support the Technocrats"
 GER_Hitler_Economics_Technocrats_desc:0 "The Cabinet's Technocrats, namely Hjalmar Schacht, Walther Funk, and Carl Friederich Goerdeler are pushing for an economic program reducing state intervention, reducing military spending, and increasing free trade efforts. We should support this faction."
 GER_Hitler_Economics_Autarks:0 "Support the Autarks"
 GER_Hitler_Economics_Autarks_desc:0 "The Autarks, led by Party officials, namely Hermann Göring, are pushing for a series of \"Years' Plans\" (not unlike Soviet Five-Year-Plans), increased military spending, and a push for autarky. We should support this faction. Under Göring's system, the economy will - alledgedly - be ready for war within four years."
 GER_Hitler_Economics_Technocrats_Lower_Trade_Barriers:0 "Lower Trade Barriers"
 GER_Hitler_Economics_Technocrats_Lower_Trade_Barriers_desc:0 "We need more foreign trade to get resources to the military and the people."
 GER_Hitler_Economics_Technocrats_Support_Bosch:0 "Support Robert Bosch GmbH"
 GER_Hitler_Economics_Technocrats_Support_Bosch_desc:0 "Bosch supported our efforts to get a Technocratic economic plan, we should reward the electronic manufacturer in kind."
 GER_Hitler_Economics_Technocrats_Support_Stahlwerke:0 "Support Vereinigte Stahlwerke AG"
 GER_Hitler_Economics_Technocrats_Support_Stahlwerke_desc:0 "United Steelworks support our economic policy, so we should support them as well."
 GER_Hitler_Economics_Technocrats_Decrease_Military_Spending:0 "Decrease Military Spending"
 GER_Hitler_Economics_Technocrats_Decrease_Military_Spending_desc:0 "Our military spending is currently abysmaly high. We have to lower it to balance the budget."
 GER_Hitler_Economics_Technocrats_Lower_Welfare_Spending:0 "Lower Welfare Spending"
 GER_Hitler_Economics_Technocrats_Lower_Welfare_Spending_desc:0 "We need to lower welfare spendinging in order to balance the budget."
 GER_Hitler_Economics_Technocrats_Balance_Budget:0 "Balance the Budget"
 GER_Hitler_Economics_Technocrats_Balance_Budget_desc:0 "Now that we have decreased spending, we can come up with a budget that is balanced to make sure that we d not go further into debt."
 GER_SWE_trade:0 "German-Sweden Trade Partnership"
 GER_Hitler_Economics_Trade_With_Sweden:0 "Trade with Sweden"
 GER_Hitler_Economics_Trade_With_Sweden_desc:0 "We should use Swedish neutrality and improve our trade with them. This would provide us with very much needed iron and tungsten for our war production."
 GER_Hitler_Economics_HASAG:0 "Work With HASAG"
 GER_Hitler_Economics_HASAG_desc:0 "Hugo Schneider Aktiengesellschaft Metallwarenfabrik is close to the SS, so we can further give them armement contracts."
 GER_Hitler_Economics_Construction2:0 "Increase Construction Employment"
 GER_Hitler_Economics_Construction2_desc:0 "We need a large supply of Construction Workers for our large construction projects."
 GER_Volkswagen_Supported:0 "The Volkswagen Beetle has been commissioned."
 GER_Hitler_Economics_Technocrats_Volkswagen:0 "Start building Volkswagens"
 GER_Hitler_Economics_Technocrats_Volkswagen_desc:0 "Although we ordered the creation of the People's Car, we should invest more in bringing cars to the people."
 GER_increased_spending:0 "Germany Increased Military Spending"
 GER_Hitler_Economics_Autarks_Increase_Military_Spending:0 "Increase Military Spending"
 GER_Hitler_Economics_Autarks_Increase_Military_Spending_desc:0 "We need to spend more on the military in order to prepare for the coming war!"
 GER_Hitler_Economics_Autarks_Accept_Bankrupcy:0 "Bankrupcy is Irrelevant!"
 GER_Hitler_Economics_Autarks_Accept_Bankrupcy_desc:0 "This massive debt is fine. We will make our money back by looting conquered nations."
 GER_Hitler_Economics_Autarks_Hermann_Goring_Werke:0 "Reichswerke Hermann Göring"
 GER_Hitler_Economics_Autarks_Hermann_Goring_Werke_desc:0 "Also Called \"Hermann-Göring-Werke\", this conglomerate will allow Göring to nationalize resource refinaries for the war effort."
 GER_Hitler_Economics_Autarks_Four_Year_Plan:0 "Begin the Four Year Plan"
 GER_Hitler_Economics_Autarks_Four_Year_Plan_desc:0 "The first of Hermann Göring's \"Year's Plans\", this Soviet-Esque economic plan is claimed to be able to mobilize the economy for war in four years."
 GER_Hitler_Economics_Autarks_Increase_Agriculture:0 "Agricultural Focus"
 GER_Hitler_Economics_Autarks_Increase_Agriculture_desc:0 "The Four Year Plan will focus somewhat on Agriculture, and ensuring that our military has enough food to eat."
 GER_Hitler_Economics_Autarks_Oil_Refinaries:0 "IG Farben Refineries"
 GER_Hitler_Economics_Autarks_Oil_Refinaries_desc:0 "Built by IG Farben, these oil refinaries will give us a good supply of Oil and Rubber for now."
 GER_Hitler_Economics_Autarks_Plunder_Economy:0 "The Plunder Economy"
 GER_Hitler_Economics_Autarks_Plunder_Economy_desc:0 "We will begin paying off our debt by looting and plundering conquered nations!"
 GER_Hitler_Economics_War:0 "War Has Begun!"
 GER_Hitler_Economics_War_desc:0 "A state of war now exists in Europe! We shall now see if our preparations have paid off."
 GER_Hitler_Economics_War_Rationing:0 "Civilian Rations"
 GER_Hitler_Economics_War_Rationing_desc:0 "A set of Rations will be necessary to ensure that the military has enough resources."
 GER_plunder_tt:0 "This focus requires Germany to be occupying enemy territory"
 GER_Hitler_Economics_War_Plunder:0 "Bring in Plundered Factories"
 GER_Hitler_Economics_War_Plunder_desc:0 "We can move industrial equipment from our occupied territories to Germany. However, our enemies have not made it easy."
 GER_RUS_Exists:0 "Russia"
 GER_RUS_Not_Exsts:0 "the Soviet Union"
 GER_SOV_trade:0 "Berlin-Moscow Trade Agreements"
 GER_ROM_trade:0 "German-Romanian Oil Trade"
 GER_Hitler_Economics_War_Trade_With_Soviet:0 "Trade With [GER_Prefer_Russia_Over_Soviet]"
 GER_Hitler_Economics_War_Trade_With_Soviet_desc:0 "Trading with [GER_Prefer_Russia_Over_Soviet] can give us vital supplies while we prepare to attack them."
 GER_Hitler_Economics_War_Trade_With_Romania:0 "Trade for Romanian Oil"
 GER_Hitler_Economics_War_Trade_With_Romania_desc:0 "The Oil Fields at Ploiesti is nearby, and a friendly Romania would be sure to allow us to use their resources."
 GER_Hitler_Economics_War_Todt_Ist_Tot:0 "Todt Ist Tot"
 GER_Hitler_Economics_War_Todt_Ist_Tot_desc:0 "Armements Minister Fritz Todt is dead. Now Albert Speer has taken up the position."
 GER_Todt_Dead:0 "Fritz Todt is Dead"
 GER_Hitler_Economics_War_Todt_Increase_Military_Spending:0 "Further Increase Military Spending"
 GER_Hitler_Economics_War_Todt_Increase_Military_Spending_desc:0 "If we are to survive, we must produce even more materiel."
 GER_Hitler_Economics_War_Todt_Convert_Factories:0 "Convert Factories"
 GER_Hitler_Economics_War_Todt_Convert_Factories_desc:0 "Civilian Factories must be converted to Military Factories. This would increase military output!"
 GER_Hitler_Economics_War_Todt_Repair_Service:0 "Increase Repair Efforts"
 GER_Hitler_Economics_War_Todt_Repair_Service_desc:0 "If we want ammunition and armor, we must repair any damaged factories we may have!"
 GER_Hitler_Economics_War_Todt_War_Economy:0 "Transition to a War Economy"
 GER_Hitler_Economics_War_Todt_War_Economy_desc:0 "We still have not fully mobilized our economy! We must transition to a full War Economy immediately!"
 GER_Hitler_Economics_War_Todt_Underground_Factories:0 "Move Production Underground"
 GER_Hitler_Economics_War_Todt_Underground_Factories_desc:0 "With the risk of enemy bombing, moving some production underground would protect our factories."
 GER_Hitler_Economics_War_Todt_Total_Economic_Mobilization:0 "Total Economic Mobilization"
 GER_Hitler_Economics_War_Todt_Total_Economic_Mobilization_desc:0 "The Entire Economy will now be mobilized to try and save what little of Germany is left after we have destroyed it!"
 
 #Hitler/Strasser Military
 GER_HitStr_Military_Tree_Start:0 "The Second Armament Program"
 GER_HitStr_Military_Tree_Start_desc:0 "If we are to be ready for war, we obviously need more factories to produce weapons."
 GER_HitStr_Military_Tree_Award_More_Contracts:0 "Kickstart the Armaments Industry"
 GER_HitStr_Military_Tree_Award_More_Contracts_desc:0 "To avoid an open breach of the treaty of Versailles, we will use ample funds for indirect rearmament in the form of extensive military infrastructure measures and the establishment of armaments companies. The armaments industry will be built again and it will be carried out covertly inside \"Inner Germany\" to prevent our enemies from noticing."
 secret_armament_production: "Secret Armaments Production"
 secret_armament_production_tt: "Adds §CHidden§! Idea: §YSecret Armaments Production§!, which grants £civ_factory_output §YMilitary Factory Output§!: §G+25%§!."
 GER_HitStr_Military_Tree_Dockyards:0 "Increase Naval Production"
 GER_HitStr_Military_Tree_Dockyards_desc:0 "With the new naval budget, we can expand construction of drydocks to produce our new fleet!"
 GER_December_program_1933: "Dezemberprogramm"
 GER_December_program_1933_desc: "The decision to expand the army has been made. The December program, launched by Truppenamt Chief Ludwig Beck, provides for the stablishment of a standing 21 division army by march 1938, from which a mobilizable 63 Division wartime army will emerge. The old Reichwehr infantry divisions will disappear and in their place new Divisions will be raised, but all of the new divisions will take a cover name to prevent the world from noticing our breach of the treaty."
 GER_versailles_threat:0 "Germany Discarded the Treaty of Versailles"
 dezemberprogram_tt: "We will begin to recruit §R21§! §Ydivisions§!"
 GER_Dezemberprogramm_complete_tt: "All Reichwehr divisions will §Rcease to exist§!. In their place §R21§! new §Ydivisions§! will be created."
 GER_proclamation_of_military_sovereignty:0 "Verkündung der Wehrhoheit"
 GER_proclamation_of_military_sovereignty_desc:0 "The promulgation of the \"Law on the Establishment of the Wehrmacht and Restoration of Military Sovereignty\" will set the strength of the peacetime army at 36 divisions; and the \"Wehrgesetzes\" (Military law) will strip away the last restrictions of the Treaty of Versailles and re-introduce general conscription. The Reichswehr will be renamed the 'Wehrmacht' and the Heeresleitung will be turned into the Oberkommando des Heeres (OKH). It's time to expand the German army into what its destined to be!"
 GER_reintroduce_conscription_tt: "§RWe will re-introduce general conscription§!"
 GER_recreate_grosser_generalstab_tt: "The §YGreat General Staff§! will be §Rrecreated§!.\n\nThe §ROberkommando des Heeres (OKH)§! will replace the §YTruppenamt§!, becoming the highest command authority of the Army.\nThe §CLuftwaffe§! will be created, with §YHermann Göring§! as the Commander-in-Chief.\nThe Reichsmarine will be renamed as the §3Kriegsmarine§!, with §YErich Raeder§! as the Commander-in-Chief.\n\n"
 GER_army_amnesty_for_nazi_officers:0 "Side with Technocratic Officers"
 GER_army_amnesty_for_nazi_officers_desc:0 "These newer officers are less experienced, but are more supportive of our regime. We need to use them to cement our control of the army."
 GER_army_mobile_warfare:0 "New Bewegungskrieg"
 GER_army_mobile_warfare_desc:0 "It is clear that trench warfare failed us in the last war. Our new military strategy will be based around fast movements and Panzer combat."
 GER_army_grand_battleplan:0 "Reform Old Doctrines"
 GER_army_grand_battleplan_desc:0 "We should continue to use old military doctrines, but we need to reform and adapt them to modern technologies."
 GER_army_mobile_warfare_motorized:0 "Motorize Our Troops"
 GER_army_mobile_warfare_motorized_desc:0 "In order to get our soldiers around faster, we need to develop new motors and engines."
 GER_army_mobile_warfare_armor:0 "Lessons from the Panzerschule Kama"
 GER_army_mobile_warfare_armor_desc:0 "The Kama Tank School, constructed in the Soviet Union after the Treaty of Rapallo, was a military base in which our high command and our engineers could test new tank designs. We should apply some of that knowledge."
 GER_army_mobile_warfare_heavy_armor:0 "Focus on Heavy Armor Designs"
 GER_army_mobile_warfare_heavy_armor_desc:0 "We need heavy tanks to take hits and deal a lot of damage to the enemy."
 GER_army_mobile_warfare_light_armor:0 "Focus on Light Armor Designs"
 GER_army_mobile_warfare_light_armor_desc:0 "We need light tanks to go around the enemy and cut them off from their supplies."
 GER_army_mobile_warfare_medium_armor:0 "Develop Medium Tank Designs"
 GER_army_mobile_warfare_medium_armor_desc:0 "We should develop some tanks that would balance the power of the heavy tank with the speed of a light tank."
 GER_army_battleplan_infantry_weapons:0 "New Infantry Weapon Standards"
 GER_army_battleplan_infantry_weapons_desc:0 "We need new and modern infantry weapons to give to our army."
 GER_army_battleplan_planning_office:0 "Decentralize Command Offices"
 GER_army_battleplan_planning_office_desc:0 "The General Staff should be more decentralized to allow Generals to make more independent decisions, without the meddling of Central Command."
 GER_army_battleplan_motorized:0 "Motorized Plans"
 GER_army_battleplan_motorized_desc:0 "We should base our plans on motorized foot soldiers."
 GER_army_battleplan_spec_ops:0 "Special Operation Plans"
 GER_army_battleplan_spec_ops_desc:0 "We should base our plans on special operation soldiers, such as Marines and Paratroopers."
 GER_army_battleplan_defensive_posture:0 "Defensive Posture"
 GER_army_battleplan_defensive_posture_desc:0 "Our posture should be defensive, to protect against enemy invasion."
 GER_army_support_equipment:0 "Support Brigades"
 GER_army_support_equipment_desc:0 "We need some Brigades to support our frontline troops, such as engineers, radiomen, and field hospitals."
 GER_form_the_kriegsmarine:0 "The Kriegsmarine"
 GER_form_the_kriegsmarine_desc:0 "With the proclamation of military sovereignty the Reichsmarine has been renamed the \"Kriegsmarine\" (War Navy) and the Marineleitung has been turned into the Oberkommando der Marine (OKM). With the navy no longer bound to Versailles, we shall begin the construction of a fleet capable of rivaling the Royal Navy!"
 GER_HitStr_Military_Tree_Navy_Donitz_Subs:0 "Dönitz's Submarine Plans"
 GER_HitStr_Military_Tree_Navy_Donitz_Subs_desc:0 "Karl Dönitz's proposed naval strategy uses Submarines to starve enemy countries of their imports. As he says, preventing British ships from using oil is the same as sinking them."
 GER_HitStr_Military_Tree_Navy_Reader_Grand_Navy:0 "Raeder's Grand Battle Fleet"
 GER_HitStr_Military_Tree_Navy_Reader_Grand_Navy_desc:0 "Admiral Erich Raeder's proposed naval strategy uses a surface fleet to project German power on the world stage. His ideal fleet should be capable of fighting the Royal Navy."
 GER_HitStr_Military_Tree_Navy_Submarine_Designs:0 "New Submarine Designs"
 GER_HitStr_Military_Tree_Navy_Submarine_Designs_desc:0 "If we are to successfully sink British shipments, we need a decent submarine design to do it!"
 GER_HitStr_Military_Tree_Navy_Destroyers:0 "Screen Design Research"
 GER_HitStr_Military_Tree_Navy_Destroyers_desc:0 "If we are to have a good surface fleet, small and fast ships are essential."
 GER_HitStr_Military_Tree_Navy_Dockyards:0 "Construct New Dockyards"
 GER_HitStr_Military_Tree_Navy_Dockyards_desc:0 "With more dockyards, we will be able to build more ships."
 GER_HitStr_Military_Tree_Navy_Ports:0 "Construct Larger Ports"
 GER_HitStr_Military_Tree_Navy_Ports_desc:0 "With a larger navy there comes a larger need to supply them. We should immediately construct large ports capable of bringing supply to the fleet!"
 GER_HitStr_Military_Tree_Navy_Light_Cruisers:0 "Light Cruiser Effort"
 GER_HitStr_Military_Tree_Navy_Light_Cruisers_desc:0 "Light Cruisers are somewhat easy to make and are powerful enough to fight against enemy screens."
 GER_HitStr_Military_Tree_Navy_Heavy_Cruisers:0 "Heavy Cruisers"
 GER_HitStr_Military_Tree_Navy_Heavy_Cruisers_desc:0 "Heavy Cruisers are cheaper than battleships, but pack a large amount of weaponry and weight behind them."
 GER_HitStr_Military_Tree_Battleships:0 "Battleship Effort"
 GER_HitStr_Military_Tree_Battleships_desc:0 "Large Battleships will be the pride of the Kriegsmarine. They will be able to punch holes right through British Defenses, bringing Germany to Victory!"
 GER_HitStr_Military_Tree_Plan_Z:0 "Plan Z"
 GER_HitStr_Military_Tree_Plan_Z_desc:0 "Raeder's Plan Z will be our naval armament plan. It will focus on a large high-seas fleet complete with Battleships and Aircraft Carriers."
 GER_HitStr_Military_Tree_Plan_D:0 "Plan D"
 GER_HitStr_Military_Tree_Plan_D_desc:0 "Given the new name \"Plan D\", Dönitz's naval armament strategy will be our new plan. It demands that we construct 500 U-Boats as soon as possible. This, according to Dönitz, would propoerly starve out the British."
 GER_HitStr_Military_Tree_Plan_Z_Aircraft_Carriers:0 "Aircraft Carrier Research"
 GER_HitStr_Military_Tree_Plan_Z_Aircraft_Carriers_desc:0 "Since our strategy brings us up to par with the Royal Navy, we need aircraft carriers to be a proper match for the King!"
 GER_form_the_luftwaffe:0 "The Luftwaffe"
 GER_form_the_luftwaffe_desc:0 "Our new airforce, the Luftwaffe will bring a new dimension to the battlefield."
 GER_HitStr_Military_Tree_Airforce_Wever:0 "Wever's Strategic Bombing Strategy"
 GER_HitStr_Military_Tree_Airforce_Wever_desc:0 "Walther Wever's strategic bombing strategy shall be our operational policy. We will focus on destroying the enemy's capabilties to arm themselves, earning us an easier victory."
 GER_HitStr_Military_Tree_Airforce_Bombers:0 "Tactical Bomber Research"
 GER_HitStr_Military_Tree_Airforce_Bombers_desc:0 "Medium Sized Bombers can attack the enemies' tactical positions and sometimes hit their industry."
 GER_HitStr_Military_Tree_Airforce_Airports:0 "Build New Airfields"
 GER_HitStr_Military_Tree_Airforce_Airports_desc:0 "New Airfields will allow us to have more planes in the air at once, and thus achieve air superiority."
 GER_HitStr_Military_Tree_Airforce_Fighters:0 "Fighter Research"
 GER_HitStr_Military_Tree_Airforce_Fighters_desc:0 "Better Fighters are instrumental in securing the air for our bombers."
 GER_wever_is_dead:0 "Walther Wever has died."
 GER_wever_is_not_dead:0 "Walther Wever survived his accident."
 GER_HitStr_Military_Tree_Airforce_Go_With_Udet:0 "Go With Udet's Ideas"
 GER_HitStr_Military_Tree_Airforce_Go_With_Udet_desc:0 "Now that Weber is dead, Ernst Udet and Albert Kesselring have begun to focus our operational policy on light bombing of enemy soldiers."
 GER_HitStr_Military_Tree_Airforce_Keep_Wevers_Strategy:0 "Keep Wever's Strategy"
 GER_HitStr_Military_Tree_Airforce_Keep_Wevers_Strategy_desc:0 "Even though he is dead, Wever's strategy will still remain our operational policy."
 GER_HitStr_Military_Tree_Airforce_Udet_Naval_Plane:0 "Naval Bomber Effort"
 GER_HitStr_Military_Tree_Airforce_Udet_Naval_Plane_desc:0 "General Felmy has decided that the Kriegsmarine should have an air arm. We should help support this policy."
 GER_HitStr_Military_Tree_Airforce_CAS:0 "Light Bomber Effort"
 GER_HitStr_Military_Tree_Airforce_CAS_desc:0 "Even though we focus on heavy bombers, we need some light bombers to attack enemy lines."
 GER_HitStr_Military_Tree_Airforce_Wever_Strategic_Bombers:0 "The Ural Bomber"
 GER_HitStr_Military_Tree_Airforce_Wever_Strategic_Bombers_desc:0 "Wever's Dream is to have a fleet of planes capable of reaching the Urals. We should oblige him."
 GER_HitStr_Military_Tree_Airforce_Udet_Amerika_Bomber:0 "The Amerika Bomber"
 GER_HitStr_Military_Tree_Airforce_Udet_Amerika_Bomber_desc:0 "Der Führer wants a Bomber capable of hitting the United States. We will try our best to give it to him."
 GER_HitStr_Military_Tree_Airforce_Rocketry:0 "Rocketry Effort"
 GER_HitStr_Military_Tree_Airforce_Rocketry_desc:0 "Werner von Braun and his research team have been working on rockets for the military. We should allocate more funding to them."
 GER_HitStr_Military_Tree_Airforce_Wever_Bomber_Production:0 "Intensify Bomber Production"
 GER_HitStr_Military_Tree_Airforce_Wever_Bomber_Production_desc:0 "It is now time to make our dream of a large fleet of bombers a reality!"
 GER_HitStr_Military_Tree_Airforce_Doctrine:0 "Continued Doctrine Research"
 GER_HitStr_Military_Tree_Airforce_Doctrine_desc:0 "We should continue to refine and develop new doctrines."
 #Foreign Policy Spain Addition
 GER_didnt_join_faction:0 "Did not join our faction."
 GER_war_with_spain:0 "Operation Felix"
 GER_war_with_spain_desc:0 "It is imperative that we launch an invasion of Spain in order to reach Gibralter."
 GER_antonio:0 "Primo de Rivera"
 GER_franco:0 "Franco"
 GER_ally_spain:0 "Hold Talks with [Root.GER_franco_or_antonio]"
 GER_ally_spain_desc:0 "A meeting with the Spanish Government should take place to determine whether or not we can bring the Falangists into the war on our side."
 GER_fd18:0 "Führer Directive No. 18"
 GER_Rechila:0 "Operation Rechila"
 GER_invade_portugal:0 "[Root.GER_portugal_war]"
 GER_invade_portugal_desc:0 "In order to secure control of Iberia and close another possible front, Portugal must be invaded."
 #Hitler Victory
 german_focus_hitler_victory:0 "Endsieg Focus Tree"
 GER_Hitler_Victory_Politics_Start:0 "Der Endsieg"
 GER_Hitler_Victory_Politics_Start_desc:0 "We have achieved final victory! Now Germany stands as the World Power that the Fatherland deserves to be!"
 GER_Hitler_Victory_Politics_Kirchenkampf_Part_2:0 "Escalate the Kirchenkampf"
 GER_Hitler_Victory_Politics_Kirchenkampf_Part_2_desc:0 "Due to the Churchs' opposition to our policies, we have waited to fight the Christians until the war was over. Well, the war is now over, so we should continue to pursue this objective."
 GER_Hitler_Victory_Politics_Kirchenkampf_Rosenberg:0 "Rosenberg's Thirty-Point Plan"
 GER_Hitler_Victory_Politics_Kirchenkampf_Rosenberg_desc:0 "Alfred Rosenberg, the Party's Chief Ideologist, has outlined a Thirty-Point Plan to eliminate Christianity in favor of a mystic form of National Socialism. We shall go with his ideas to effectively turn Hitlerism from an ideological cult to a full Religion."
 GER_established_reich_church:0 "Established the Reich Church"
 yes_reich_church:0 "Expand the Reich Church"
 yes_reich_church_desc:0 "In order to move against Christianity, we should continue with Hitler and Goebbels' plan to eliminate Christianity by expanding the operations of the Reich Church."
 no_reich_church:0 "Create the National Reich Church"
 no_reich_church_desc:0 "A National Reich Church will be necessary to sort of infiltrate Christian traditions and implant our own propaganda inside it!"
 GER_Hitler_Victory_Politics_Kirchenkampf_Reich_Church:0 "[Root.did_reich_church]"
 GER_Hitler_Victory_Politics_Kirchenkampf_Reich_Church_desc:0 "[Root.did_reich_church_desc]"
 GER_Hitler_Victory_Politics_Kirchenkampf_Rosenberg_Claim_Churches:0 "Claim Hegemony Over The Churches"
 GER_Hitler_Victory_Politics_Kirchenkampf_Rosenberg_Claim_Churches_desc:0 "The State and its Organizations will claim hegemony over all Churches in Germany. This will allow us to make more radical changes."
 GER_Hitler_Victory_Politics_Kirchenkampf_Rosenberg_The_Mission:0 "Make the Objective Public"
 GER_Hitler_Victory_Politics_Kirchenkampf_Rosenberg_The_Mission_desc:0 "Although the Regime's hate for Christianity is very well known, our outright desire to eliminate Christianity in favor of a National Socialist religion is still technically a secret. It shall be secret no longer."
 GER_Hitler_Victory_Politics_Kirchenkampf_Rosenberg_Remove_Christian_Symbolism:0 "Eliminate Christian Symbolism"
 GER_Hitler_Victory_Politics_Kirchenkampf_Rosenberg_Remove_Christian_Symbolism_desc:0 "We will make an effort to remove Crosses, Saints, and other such symbolism from Churches."
 GER_Hitler_Victory_Politics_Kirchenkampf_Rosenberg_Add_Nazi_Symbolism:0 "Replace the Cross"
 GER_Hitler_Victory_Politics_Kirchenkampf_Rosenberg_Add_Nazi_Symbolism_desc:0 "Instead of Crosses, German Churches will feature Party and Ideological Symbols. This is essential in making National Socialism the dominant Religion in Germany."
 GER_Hitler_Victory_Politics_Kirchenkampf_Rosenberg_Reich_Orators:0 "Replace Preachers with Reich Orators"
 GER_Hitler_Victory_Politics_Kirchenkampf_Rosenberg_Reich_Orators_desc:0 "Instead of Preachers and Pastors reading the word of God, Orators from our Propaganda Ministry will read the word of the Party!"
 GER_Hitler_Victory_Politics_Kirchenkampf_Rosenberg_Find_Dissident_Pastors:0 "Find Dissident Clerics"
 GER_Hitler_Victory_Politics_Kirchenkampf_Rosenberg_Find_Dissident_Pastors_desc:0 "We must increase our efforts to find Clerics who resist our efforts."
 GER_Hitler_Victory_Politics_Kirchenkampf_Rosenberg_End_Bible:0 "End Publications of the Bible"
 GER_Hitler_Victory_Politics_Kirchenkampf_Rosenberg_End_Bible_desc:0 "While not yet an official ban on the Bible itself, we will make its distribution a crime on the level of treason."
 GER_Hitler_Victory_Politics_Kirchenkampf_Rosenberg_Read_Mein_Kampf:0 "The New Book"
 GER_Hitler_Victory_Politics_Kirchenkampf_Rosenberg_Read_Mein_Kampf_desc:0 "Hitler's Mein Kampf - the main source of Hitlerist Ideology - shall be the new book our Reich Orators read from, not the Bible."
 GER_Hitler_Victory_Politics_Kirchenkampf_Rosenberg_Let_It_Die:0 "Let Christianity Die Out"
 GER_Hitler_Victory_Politics_Kirchenkampf_Rosenberg_Let_It_Die_desc:0 "We have taken the necessary steps to ensure that belief in God and Jesus Christ will die out within the next couple of decades."
 GER_Hitler_Victory_Politics_Kirchenkampf_Reich_Church_Increase_Propaganda:0 "Increase Reich Church Propaganda"
 GER_Hitler_Victory_Politics_Kirchenkampf_Reich_Church_Increase_Propaganda_desc:0 "The Reich Church should start to serve as a more obvious propaganda mouthpiece than a puppet Church.
 GER_Hitler_Victory_Politics_Kirchenkampf_Reich_Church_Increase_Culture:0 "Increase Cultural Activities"
 GER_Hitler_Victory_Politics_Kirchenkampf_Reich_Church_Increase_Culture_desc:0 "We should start shifting the Reich Church's activities away from Religious Services to Cultural Activities"
 GER_SS_Destroyed:0 "The SS has been destroyed."
 GER_Hitler_Victory_Politics_Kirchenkampf_Reich_Church_Denounce_Occultism:0 "Denounce Occultism"
 GER_Hitler_Victory_Politics_Kirchenkampf_Reich_Church_Denounce_Occultism_desc:0 "We shall officially distance the Reich Church from the activities of the SS! However, this is bound to irk Himmler..."
 GER_Hitler_Victory_Politics_Kirchenkampf_Reich_Church_Fade_Out_Christianity_Sermons:0 "Cut Down on Sermons"
 GER_Hitler_Victory_Politics_Kirchenkampf_Reich_Church_Fade_Out_Christianity_Sermons_desc:0 "To complete the transition to a more Cultural form of Traditionalism, we should quietly order our Reich Church Pastors to start giving less sermons."
 GER_Hitler_Victory_Politics_Kirchenkampf_Reich_Church_Promote_Warriors:0 "A New Warrior Culture"
 GER_Hitler_Victory_Politics_Kirchenkampf_Reich_Church_Promote_Warriors_desc:0 "The New German Culture will glorify combat and war. We will teach that to fight our enemies is to serve God!"
 GER_Hitler_Victory_Politics_Kirchenkampf_Reich_Church_Stop_Reading_The_Bible:0 "Stop Promoting the Bible"
 GER_Hitler_Victory_Politics_Kirchenkampf_Reich_Church_Stop_Reading_The_Bible_desc:0 "We should stop promoting the Bible at all, as it goes against the interests of the Regime."
 GER_Hitler_Victory_Politics_Kirchenkampf_Reich_Church_God_Believers:0 "Encourage Gottgläubigkeit"
 GER_Hitler_Victory_Politics_Kirchenkampf_Reich_Church_God_Believers_desc:0 "We shall encourage people to reject Christian and other Religious institutions (except ours of course), while still being Gottgläubigen, or \"Believers in God\"."
 GER_Hitler_Victory_Politics_Kirchenkampf_Reich_Church_Sway_Atheists:0 "Discourage Atheism"
 GER_Hitler_Victory_Politics_Kirchenkampf_Reich_Church_Sway_Atheists_desc:0 "Despite our disdain for Religious Institutions, we must preserve stability by encouraging some beliefs, as Atheists could be more likely to reject our teachings. 
 GER_Hitler_Victory_Politics_Kirchenkampf_Reich_Church_Rival_For_Christ:0 "A New Rival for Christ"
 GER_Hitler_Victory_Politics_Kirchenkampf_Reich_Church_Rival_For_Christ_desc:0 "Through the Reich Church and our \"reforms\", we have successfuly created a new, relevant rival for Christ in Germany!" 
 GER_Hitler_Victory_Politics_New_Factions_Start:0 "The Future of Germany"
 GER_Hitler_Victory_Politics_New_Factions_Start_desc:0 "We need to decide the future of German politics. While the Führer will reign supreme, we should figure out whether Goebbels' Radicals or Bormann's Conservatives will take the forefront."
 GER_choose_endsieg_faction_tt:0 "§GThe Dominant Party Faction will be Chosen!§!"
 GER_Hitler_Victory_Politics_Radicals:0 "Party Radical Victory"
 GER_Hitler_Victory_Politics_Radicals_desc:0 "Goebbels' Party Radicals have managed to convinced the Führer that they should be in charge of managing the bureaucracy. The are expected to extend National Socialism to continue a National \"Revolution\"."
 GER_Hitler_Victory_Politics_Conservatives:0 "Party Conservative Victory"
 GER_Hitler_Victory_Politics_Conservatives_desc:0 "Bormann's Party Conservatives have managed to convinced the Führer that they should be in charge of managing the bureaucracy. They are expected to extend National Socialism in a manner to connect the New Order with the Old German Elite."
 GER_Hitler_Victory_Politics_Radicals_Seize_Estates:0 "Limit Estates for the Elite"
 GER_Hitler_Victory_Politics_Radicals_Seize_Estates_desc:0 "Some members of the Party have overindulged themselves with their luxuries. While we are not opposed to it, we need to make sure that this would not interfer with their service to the State."
 GER_Hitler_Victory_Politics_New_Propaganda:0 "Victory Propaganda"
 GER_Hitler_Victory_Politics_New_Propaganda_desc:0 "After years of war propaganda, the people now need to understand our new objectives during this new peace."
 GER_Hitler_Victory_Politics_Search_For_Dissidents:0 "Crackdown on Dissidents"
 GER_Hitler_Victory_Politics_Search_For_Dissidents_desc:0 "Even though we are at peace, we must remain vigilant against those who might want to ruin our State!"
 GER_Hitler_Victory_Politics_Radicals_Cinema:0 "Further Invest in the Cinema"
 GER_Hitler_Victory_Politics_Radicals_Cinema_desc:0 "Goebbels is very interested in the Cinema. He wants to increase movie production with films about the War, and about the Party."
 GER_Hitler_Victory_Politics_Radicals_Ideology_Of_Violence:0 "Ideology of Violence"
 GER_Hitler_Victory_Politics_Radicals_Ideology_Of_Violence_desc:0 "We will use our propaganda to promote Himmler's Ideology of Violence, and teach that violent acts during the war were in fact a good thing. This should be enough to pacify anybody uneasy about our actions."
 GER_Hitler_Victory_Politics_Radicals_Limit_Bormann_Power:0 "Limit Bormann's Power"
 GER_Hitler_Victory_Politics_Radicals_Limit_Bormann_Power_desc:0 "Martin Bormann, the Führer's Personal Secretary, has a monopoly on providing access to Hitler, as well as divulging information from Hitler. We need to take measures to make sure that our faction is heard."
 GER_Hitler_Victory_Politics_Conservatives_Add_To_Estates:0 "Add to our Estates"
 GER_Hitler_Victory_Politics_Conservatives_Add_To_Estates_desc:0 "We worked so hard during the War and the lead up to it. Surely we deserve some kind of reward?"
 GER_Hitler_Victory_Politics_Conservatives_Print_Media:0 "Increase Printed Propaganda"
 GER_Hitler_Victory_Politics_Conservatives_Print_Media_desc:0 "We would rather use Newspapers, Pamphlets, and Books to spread propaganda, rather than the \"Cinema\"."
 GER_Hitler_Victory_Politics_Conservatives_Estate_Economy:0 "The Estate Economy"
 GER_Hitler_Victory_Politics_Conservatives_Estate_Economy_desc:0 "Any unemployed Veteran can find work on our expanded Estates!"
 GER_Hitler_Victory_Politics_Conservatives_Student_Crackdown:0 "Crackdowns in Universities"
 GER_Hitler_Victory_Politics_Conservatives_Student_Crackdown_desc:0 "Universities are historically sites of more \"intellectual\" politics. In short, we have to find students who think against the Regime!"
 GER_Endsieg_RK_Opinion:0 "Increased Ties"
 GER_Hitler_Victory_Politics_RK_Leaders:0 "Closer Ties to Reichkommissars"
 GER_Hitler_Victory_Politics_RK_Leaders_desc:0 "We need to increase Berlin's influence on the Reichkommissars. Perhaps some bribery is in order..."
 GER_Hitler_Victory_Politics_Radical_End:0 "Appoint Goebbels as the Successor"
 GER_Hitler_Victory_Politics_Radical_End_desc:0 "Now that the Radicals have succeeded in entrenching their doctrine in the bureaucracy, we can name Josef Goebbels as the Next Führer!"
 GER_Hitler_Victory_Politics_Conservative_End:0 "Appoint Bormann as the Successor"
 GER_Hitler_Victory_Politics_Conservative_End_desc:0 "Now that the Conservatives have succeeded in entrenching their doctrine in the bureaucracy, we can name Martin Bormann as the Next Führer!"
 GER_Endsieg_Bormann_Fuhrer_tt:0 "§GWhen The Führer dies, Bormann will become the Führer!§!"
 GER_Endsieg_Goebbels_Fuhrer_tt:0 "§GWhen The Führer dies, Goebbels will become the Führer!§!"
 #Economic
 GER_Hitler_Victory_Economics_Start:0 "To the Victor..."
 GER_Hitler_Victory_Economics_Start_desc:0 "We have won the war and established Germany as a new world power! We should be using our newfound power to build grand projects!"
 GER_Hitler_Victory_Economics_Plunder:0 "...Go the Spoils!"
 GER_Hitler_Victory_Economics_Plunder_desc:0 "Bringing Capital to Germany will both decrease the relative power of our Reichskommissariats and increase our industrial capacity."
 GER_Hitler_Victory_Economics_Demobilize:0 "Demobilize"
 GER_Hitler_Victory_Economics_Demobilize_desc:0 "Decreasing military activity will be a minor dent in the economy, but we should be able to recover from it."
 GER_Hitler_Victory_Economics_Repay_Debt:0 "Begin Paying our Debts"
 GER_Hitler_Victory_Economics_Repay_Debt_desc:0 "We have accured a massive debt during the war, which we must start paying off."
 GER_Hitler_Victory_Economics_End_Rations:0 "End Rationing"
 GER_Hitler_Victory_Economics_End_Rations_desc:0 "Now that the war is over, there is no more need to ration our consumers' food and petrol."
 GER_victory_bankrupcy_imminent:0 "Incoming Bankrupcy"
 GER_Hitler_Victory_Economics_Debt_Start:0 "Bankrupcy Imminent!"
 GER_Hitler_Victory_Economics_Debt_Start_desc:0 "We don't have enough resources to pay our debts! We must act quickly to prevent bankrupcy!"
 GER_Hitler_Victory_Economics_Projects_Start:0 "Building a New Germany"
 GER_Hitler_Victory_Economics_Projects_Start_desc:0 "We can use our pilfered industrial power to embark on large construction projects, to mold the world into the image of Germania!"
 GER_bankrupt:0 "We Have Gone Bankrupt."
 GER_Hitler_Victory_Economics_Debt_Austerity:0 "Austerity Measures"
 GER_Hitler_Victory_Economics_Debt_Austerity_desc:0 "We will have to take some steps to limit our spending in order to stave off bankrupcy."
 GER_Hitler_Victory_Economics_Debt_Stimulus:0 "Stimulate the Economy"
 GER_Hitler_Victory_Economics_Debt_Stimulus_desc:0 "In order to bring in money to pay our debt, we have to make sure that money is actually being made."
 GER_Hitler_Victory_Economics_Debt_Privatize:0 "Further Privatize the Economy"
 GER_Hitler_Victory_Economics_Debt_Privatize_desc:0 "We shall continue our policy of privatization in order to bring in some funds."
 GER_Hitler_Victory_Economics_Debt_Reinstate_Rations:0 "Reinstate Rations"
 GER_Hitler_Victory_Economics_Debt_Reinstate_Rations_desc:0 "Setting up some rations will help us ensure that we have some stockpiles in case things go south."
 GER_Hitler_Victory_Economics_Debt_Austerity_Raise_Taxes:0 "Raise Taxes"
 GER_Hitler_Victory_Economics_Debt_Austerity_Raise_Taxes_desc:0 "We have to raise taxes a little bit to ensure that we are bringing in funds."
 GER_Hitler_Victory_Economics_Debt_Austerity_Bring_Down_Military_Spending:0 "Further Cutbacks on the Military"
 GER_Hitler_Victory_Economics_Debt_Austerity_Bring_Down_Military_Spending_desc:0 "Despite intensive lobbying from the General Staff, we have to slash the military budget to make room for our debt."
 GER_Hitler_Victory_Economics_Debt_Austerity_Church_Donations:0 "Donations from Religious Institutions"
 GER_Hitler_Victory_Economics_Debt_Austerity_Church_Donations_desc:0 "Whether we control them or not, the Religious can be compelled to...donate to our cause!"
 GER_Hitler_Victory_Economics_Debt_Stimulus_Subsidise_Factories:0 "Subsidize Consumer Goods Factories"
 GER_Hitler_Victory_Economics_Debt_Stimulus_Subsidise_Factories_desc:0 "Making sure that factories stay afloat will ensure that people are getting payed, and paying us taxes."
 GER_Hitler_Victory_Economics_Debt_Stimulus_Go_After_Himmler:0 "Go After Himmler's Enterprises"
 GER_Hitler_Victory_Economics_Debt_Stimulus_Go_After_Himmler_desc:0 "Himmler's SS ventures have never been very profitable. We should go and force him to close most of them down."
 GER_Hitler_Victory_Economics_Debt_Stimulus_Liquidate_Unprofitable:0 "Close Unprofitable Firms"
 GER_Hitler_Victory_Economics_Debt_Stimulus_Liquidate_Unprofitable_desc:0 "Businesses that take up valuable capital and haven't made a profit in the last year should be closed down."
 GER_Hitler_Victory_Economics_Projects_Architectural_Institute:0 "Reichsinstitut der Architektur"
 GER_Hitler_Victory_Economics_Projects_Architectural_Institute_desc:0 "The Reich Institute for Architecture will be the place to train high-performing architecture students in advance techniques of Albert Speer."
 GER_Hitler_Victory_Economics_Projects_Germania_Project:0 "Welthaupstadt Germania"
 GER_Hitler_Victory_Economics_Projects_Germania_Project_desc:0 "Berlin - or Germania as it will be known - will be the shining jewel of the Reich, with humoungous expansions to show off the power of the Reich."
 GER_Hitler_Victory_Economics_Projects_Linz_Project:0 "Jugendstadt des Führers"
 GER_Hitler_Victory_Economics_Projects_Linz_Project_desc:0 "The Home City of the Führer and the City of the Founding of the Greater German Reich, Linz will be a German Budapest, and will replace Vienna in terms of grandeur and prestige."
 GER_Hitler_Victory_Economics_Projects_Bavarian_Projects:0 "Bavarian Projects"
 GER_Hitler_Victory_Economics_Projects_Bavarian_Projects_desc:0 "München, Bayreuth, Würzburg, and Weimar will be constructed anew to represent the Power of the Reich in Bavaria and Thuringia."
 GER_Hitler_Victory_Economics_Projects_Nordstern_Projects:0 "The Nordstern Project"
 GER_Hitler_Victory_Economics_Projects_Nordstern_Projects_desc:0 "Nordstern - German for \"North Star\", will be a Fortress City in Norway colonized by Germans, and will replace Trondheim in terms of importance."
 GER_Hitler_Victory_Economics_Projects_Austrian_Projects:0 "Austrian Projects"
 GER_Hitler_Victory_Economics_Projects_Austrian_Projects_desc:0 "Other than Linz, Salzburg, Innsbruck, and Graz will be reconstructed."
 GER_Hitler_Victory_Economics_Projects_Rhine_Projects:0 "Rhine Projects"
 GER_Hitler_Victory_Economics_Projects_Rhine_Projects_desc:0 "Köln, Düsseldorf, Heidelberg, Münster, Saarbrücken, Waldbröl, and Wuppertal are also in need of reconstruction."
 GER_Hitler_Victory_Economics_Projects_Hanover_Projects:0 "Hannover Projects"
 GER_Hitler_Victory_Economics_Projects_Hanover_Projects_desc:0 "Bremen, Hannover and Oldenburg shall also be reconstructed to support German shipping and naval efforts."
 GER_Hitler_Victory_Economics_Projects_Prussian_Projects:0 "Prussian Projects"
 GER_Hitler_Victory_Economics_Projects_Prussian_Projects_desc:0 "Breslau, Danzig, Königsberg, Memel, and Posen - Prussian lands with much historical meaning to the German People -  will be recreated in the National Socialist Style."
 GER_Hitler_Victory_Economics_Projects_Saxon_Projects:0 "Saxon Projects"
 GER_Hitler_Victory_Economics_Projects_Saxon_Projects_desc:0 "Dresden will also be redone in the National Socialist style. Although near Berlin, the Germania project is vital enough to consider them to be seperate projects."
 GER_Hitler_Victory_Economics_Projects_Pabst_Plan_Projects:0 "The Pabst Plan"
 GER_Hitler_Victory_Economics_Projects_Pabst_Plan_Projects_desc:0 "Concieved by Friederich Pabst, the New German city of Warsaw will be a completely rebuilt city in what is now Warsaw with the sole purposes of being a transportation hub and a seat for the Generalgouvernement's ruling elite."
 GER_Hitler_Victory_Economics_Projects_Prag_Project:0 "The Prag Project"
 GER_Hitler_Victory_Economics_Projects_Prag_Project_desc:0 "Prague will be entirely remade into a truly National Socialist style of city, to show the power of the Reich over its territory!"
 #Hit/Str Coup
 german_focus_hitler_strasser_military_coup:0 "Military Coup Focus Tree"
 GER_Military_Coup:0 "The Military has couped the Government."
 GER_HitStr_Military_Coup_Start:0 "Military Coup Success"
 GER_HitStr_Military_Coup_Start_desc:0 "The National Socialist Government has successfully taken over the government and eliminated the former leadership. Now we must perform Denazification on the rest of society."
 GER_HitStr_Military_Coup_Denazify_Bureaucracy:0 "Purge the Bureaucracy"
 GER_HitStr_Military_Coup_Denazify_Bureaucracy_desc:0 "If we are to dismantle the influence of the former regime, we must begin with removing the more loyal National Socialists from the bureaucray."
 GER_HitStr_Military_Coup_Remove_Swastikas:0 "Remove Swastikas"
 GER_HitStr_Military_Coup_Remove_Swastikas_desc:0 "We should round up and dismantle swastikas in the country. We can even offer a monetary reward for them."
 GER_HitStr_Military_Coup_Restructure_Bureaucracy:0 "Restructure the Bureaucracy"
 GER_HitStr_Military_Coup_Restructure_Bureaucracy_desc:0 "We must end the failed bureaucratic policies of the former government. A normal, structured bureaucracy should replace the madness of our predecessors."
 GER_HitStr_Military_Coup_Dismantle_SS:0 "Dismantle the SS"
 GER_HitStr_Military_Coup_Dismantle_SS_desc:0 "The remnants of the SS are currently waging a political conflict against our government. They are like scared rats, scurrying to whatever holes and corners they can find. We must be cats, and end this rat problem once and for all!"
 GER_HitStr_Military_Coup_Punish_SS_Members:0 "The Nuremburg Trials"
 GER_HitStr_Military_Coup_Punish_SS_Members_desc:0 "Our bureaucracy have identified several members of the SS complicit in crimes against the state and the people. The military has arrested them, and they can now be court-martialed!"
 GER_HitStr_Military_Coup_Free_Political_Prisoners:0 "Free Political Prisoners"
 GER_HitStr_Military_Coup_Free_Political_Prisoners_desc:0 "Anybody imprisoned for political offensives will be immediately freed!"
 GER_HitStr_Military_Coup_Free_End_Racial_Laws:0 "End Racial Laws"
 GER_HitStr_Military_Coup_Free_End_Racial_Laws_desc:0 "The age of German Supremacy is over. Although many in our government are opposed to full equality, they can all agree that the Nazi-Era laws went much too far."
 GER_HitStr_Military_Coup_Churches_Ok:0 "End Persecution of the Church"
 GER_HitStr_Military_Coup_Churches_Ok_desc:0 "The Church will once again be free from Nazi harassment. All will be free to practice their religion."
 GER_HitStr_Military_Coup_Destroy_Hitler_Youth:0 "Dismantle Hitler Youth"
 GER_HitStr_Military_Coup_Destroy_Hitler_Youth_desc:0 "Hitler Youth leadership will be prosecuted and the youth themselves will be re-educated. They will learn of the evils of the Nazi Administration."
 GER_HitStr_Military_Coup_Loosen_Control:0 "Loosen the Chains"
 GER_HitStr_Military_Coup_Loosen_Control_desc:0 "The Nazi Boot weighed too heavily on the people. Although we will maintain authoritarianism, we will not demand the full allegience of every cultural organization and knitting club."
 GER_HitStr_Military_Coup_Rehabilitation:0 "Rehabilitate Dissidents"
 GER_HitStr_Military_Coup_Rehabilitation_desc:0 "Dissidents who resisted the Nazi tyranny will be rehabilitated, and - in some cases posthumously - pardoned."
 GER_HitStr_Military_Coup_Close_SS_Enterprises:0 "Close SS Enterprises"
 GER_HitStr_Military_Coup_Close_SS_Enterprises_desc:0 "Ownership of SS Corporations have been passed to the state. We should privatize or dismantle these."
 GER_HitStr_Military_Coup_End_Special_Courts:0 "End Special Courts"
 GER_HitStr_Military_Coup_End_Special_Courts_desc:0 "The Sondergericht were a vehicle of the Nazi regime that allowed them to jail or execute dissidents without respect to any kind of law or sense. We shall destroy these."
 GER_HitStr_Military_Coup_Rule_Of_Law:0 "A New Law Code"
 GER_HitStr_Military_Coup_Rule_Of_Law_desc:0 "The New Code of Law, based on the Imperial Code, will be the new law of the land. It is far less totalitarian than National Socialist Laws."
 GER_HitStr_Military_Coup_End_Nazi_Education:0 "Denazify Education"
 GER_HitStr_Military_Coup_End_Nazi_Education_desc:0 "National Socialism in Education will be removed, and students will be taught about the failure of the Nazi system. We want to make sure that our youth isn't brainwashed."
 GER_HitStr_Military_Coup_Ban_Nazi_Cinema:0 "Ban Nazi Movies"
 GER_HitStr_Military_Coup_Ban_Nazi_Cinema_desc:0 "Movies that serve as Nazi propaganda will be banned in all non-educational instances."
 GER_HitStr_Military_Coup_Legalize_Parties:0 "Legalize Political Parties"
 GER_HitStr_Military_Coup_Legalize_Parties_desc:0 "Although they would not be allowed to decide policy, allowing some political groups into our puppet Reichstag would increase our legitimacy."
 GER_HitStr_Military_Coup_Loosen_Press:0 "Loosen Control of the Press"
 GER_HitStr_Military_Coup_Loosen_Press_desc:0 "Although some publications will be censored, not all publications will be made by National Ministries."
 GER_HitStr_Military_Coup_Clean_Wehrmacht_Myth:0 "The Clean Wehrmacht Myth"
 GER_HitStr_Military_Coup_Clean_Wehrmacht_Myth_desc:0 "We will push the idea that it was the SS that committed most crimes in the war. This will increase public opinion of our regime."
 GER_HitStr_Military_Coup_Clean_Purge_Gestapo:0 "Purge the Gestapo"
 GER_HitStr_Military_Coup_Clean_Purge_Gestapo_desc:0 "The Gestapo must be purged of Nazi Sympathizers. We cannot have law enforcement working against our Government."
 GER_HitStr_Military_Coup_New_Government:0 "The Imperial Question"
 GER_HitStr_Military_Coup_New_Government_desc:0 "Many in our government are open to the restoration of the Hohenzollerns to the German Throne. We must debate and decide whether to restore the Monarchy or to continue with a Military Head of State."
 GER_HitStr_Military_Coup_Economics_Start:0 "A Sane Economic Plan"
 GER_HitStr_Military_Coup_Economics_Start_desc:0 "The National Socialist economic model is shear lunacy, based solely around Racial Theory and writings of madmen. We will instead pursue a more moderate economic policy."
 GER_HitStr_Military_Coup_Economics_Cut_Military_Spending:0 "Slash the Military Budget"
 GER_HitStr_Military_Coup_Economics_Cut_Military_Spending_desc:0 "This is definitely ironic, but the National Socialists grossly overspent on the military. If we are ever to pay off our debts, we have to make a lot of sacrifices."
 GER_HitStr_Military_Coup_Economics_Mass_Privatizations:0 "Mass Privatizations"
 GER_HitStr_Military_Coup_Economics_Mass_Privatizations_desc:0 "To cut down on our spending and earn some money for the new Regime, we should privatize many national industries."
 GER_HitStr_Military_Coup_Dismantle_DAF:0 "Dismantle the DAF"
 GER_HitStr_Military_Coup_Dismantle_DAF_desc:0 "The German Workers' Front will be dismantled as a relic of the old regime."
 GER_HitStr_Military_Coup_Union_Question:0 "The Union Question"
 GER_HitStr_Military_Coup_Union_Question_desc:0 "Now that the DAF has been destroyed, many workers and polititians are beginning to agitate for the ability to form their own unions. Our government must decide whether to grant them this right, or side with the Industrialists."
 #Return to this with Strasser
 GER_HitStr_Military_Coup_Dismantle_Reichswerke:0 "Dismantle Reichswerke Hermann Göring"
 GER_HitStr_Military_Coup_Dismantle_Reichswerke_desc:0 "Göring's Personal Resource Refineries will be privatized, and the factories will be resold to their former owners."
 GER_HitStr_Military_Coup_Dismantle_Corporate_Guilds:0 "Dismatle Corporate Guilds"
 GER_HitStr_Military_Coup_Dismantle_Corporate_Guilds_desc:0 "Corporate Guilds are really uncessasary in our new government. If we are to properly follow Austerity Plans, we should free the corporations from Government Control."
 GER_HitStr_Military_Coup_Close_Unprofitable_Industry:0 "Re-Sell Unprofitable Capital"
 GER_HitStr_Military_Coup_Close_Unprofitable_Industry_desc:0 "Businesses who have not produced a profit in the last year will be closed, and their assets seized and resold to larger corporations."
 GER_HitStr_Military_Coup_Open_Trade:0 "Lower Trade Restrictions"
 GER_HitStr_Military_Coup_Open_Trade_desc:0 "We should be more open to foreign trade. This would bolster the German Economy and bring in necessary resources."
 GER_HitStr_Military_Leave_War_Economy:0 "Transition Back to a Civilian Economy"
 GER_HitStr_Military_Leave_War_Economy_desc:0 "Now that our war is over, we can move back to a civilian economy. This will allow us to pay our debt and lick our wounds."
 GER_HitStr_Military_Civilian_Spending:0 "Approve a Civilian Budget"
 GER_HitStr_Military_Civilian_Spending_desc:0 "Despite our Austerity Measures, the people are still going to need some welfare."
 GER_HitStr_Military_Coup_Decrease_State_Oversight:0 "Decrease State Oversight"
 GER_HitStr_Military_Coup_Decrease_State_Oversight_desc:0 "Although we will maintain some regulations, the State will not interfere much with Economic Matters."
 GER_HitStr_Military_Coup_Increase_Taxes:0 "Increase Taxes"
 GER_HitStr_Military_Coup_Increase_Taxes_desc:0 "We really don't want to do this, but we have to pay our debts somehow."
 GER_HitStr_Military_Coup_Sell_Loot:0 "Sell Plundered Loot"
 GER_HitStr_Military_Coup_Sell_Loot_desc:0 "Artwork, Jewels, Precious Metals, and any kind of valuable that our soldiers looted during the war can be sold to help us pay our debt."
 GER_HitStr_Military_Coup_Sell_Plunder:0 "Sell Remaining Plundered Capital"
 GER_HitStr_Military_Coup_Sell_Plunder_desc:0 "Any remaining capital that we took from abroad can be returned to their original owners...at a price."
 GER_HitStr_Military_Coup_Limited_Bailouts:0 "Limited Bailouts"
 GER_HitStr_Military_Coup_Limited_Bailouts_desc:0 "We should prevent some firms from going out of business, but we must be very careful to make sure we do not go that much further into debt."
 GER_HitStr_Military_Coup_Small_Businesses:0 "Encourage Small Businesses"
 GER_HitStr_Military_Coup_Small_Businesses_desc:0 "If we can get more small businesses to make a profit, we can bring in more in taxes!"
 GER_HitStr_Military_Coup_Continue_Debt:0 "Continue Paying our Debts"
 GER_HitStr_Military_Coup_Continue_Debt_desc:0 "If we are to decrease the effects of the oncoming bankrupcy, we should continue to pay our debts as much as we can."
 GER_coup_repay_debts_tt:0 "§CWe Will Continue to Pay Off Our Debt.§!"
 #Military stuff
 GER_HitStr_Military_Coup_Military_Start:0 "Begin Military Purges"
 GER_HitStr_Military_Coup_Military_Start_desc:0 "If we are to maintain control of our new government, we have to make sure that the Military is aligned to our cause!"
 GER_HitStr_Military_Coup_Military_Army_Start:0 "Reform the Army"
 GER_HitStr_Military_Coup_Military_Army_Start_desc:0 "The Heer was the most mangled by National Socialist perversions. We should get to work undoing the damage."
 GER_HitStr_Military_Coup_Military_Army_End_Oath:0 "End Nazi Oaths"
 GER_HitStr_Military_Coup_Military_Army_End_Oath_desc:0 "The Previous Regime imposed a new oath on the Army. Instead of pledging to uphold the constitution, they pledged to uphold the Führer. This dangerous practice must stop."
 GER_HitStr_Military_Coup_Military_Army_End_Bribery:0 "End Bribery Programs"
 GER_HitStr_Military_Coup_Military_Army_End_Bribery_desc:0 "The Previous Regime used bribes to make sure senior officers fell in line. We should end this vote-buying."
 GER_HitStr_Military_Coup_Military_Army_Enlisted_Purge:0 "Re-Instate the Ban on Soldiers in Parties"
 GER_HitStr_Military_Coup_Military_Army_Enlisted_Purge_desc:0 "Before the National Socialist Era, it was illegal for a Reichswehr soldier to have political affiliations. We will re-instate this ban, both in hopes of curbing National Socialist influence, and to prevent a large influence of political parties in General."
 GER_HitStr_Military_Coup_Military_Army_Purge_Senior_Officers:0 "Purge Senior Officers"
 GER_HitStr_Military_Coup_Military_Army_Purge_Senior_Officers_desc:0 "Our fight against Nazi Influence must reach the very top of the Chain of Command, with inquiries into each senior officer's records and actions."
 GER_HitStr_Military_Coup_Military_Army_Re_Educate_Soldiers:0 "Re-Educate Soldiers"
 GER_HitStr_Military_Coup_Military_Army_Re_Educate_Soldiers_desc:0 "Our Soldiers will be taught about the evils of the National Socialist Regime, and will hopefully lose any support they once had for it."
 GER_HitStr_Military_Coup_Military_Army_Done:0 "Finish Reforms"
 GER_HitStr_Military_Coup_Military_Army_Done_desc:0 "Our programs will ensure that National Socialist thought will be removed from the army over the next several years."
 GER_HitStr_Military_Coup_Military_Navy_Start:0 "Reform the Navy"
 GER_HitStr_Military_Coup_Military_Navy_Start_desc:0 "The Kriegsmarine needs some review, as Karl Dönitz was a very ardent supporter of the National Socialist Regime."
 GER_HitStr_Military_Coup_Military_Navy_New_Songs:0 "Write New Songs"
 GER_HitStr_Military_Coup_Military_Navy_New_Songs_desc:0 "We wil get rid of the old National Socialist Naval Medleys and replace them with even older Imperial songs, and new post-Nazi tunes."
 GER_HitStr_Military_Coup_Military_Navy_Purge_Officers:0 "Purge Naval Officers"
 GER_HitStr_Military_Coup_Military_Navy_Purge_Officers_desc:0 "Dönitz and his clique must be investigated and eliminated."
 GER_HitStr_Military_Coup_Military_Navy_Increase_Naval_Output:0 "Increase Naval Production"
 GER_HitStr_Military_Coup_Military_Navy_Increase_Naval_Output_desc:0 "Even though we need to decrease the military budget, having more boats is a priority for us."
 GER_HitStr_Military_Coup_Military_Rename_Boats:0 "Rename Boats"
 GER_HitStr_Military_Coup_Military_Rename_Boats_desc:0 "Boats with National Socialist-inspired names will be renamed to something more appropriate."
 GER_HitStr_Military_Coup_Military_New_Uniforms:0 "New Uniforms"
 GER_HitStr_Military_Coup_Military_New_Uniforms_desc:0 "We should give each seaman new uniforms that do not reflect the values of the Nazi regime."
 GER_HitStr_Military_Coup_Military_Navy_Finish:0 "Finish Naval Reforms"
 GER_HitStr_Military_Coup_Military_Navy_Finish_desc:0 "We have successfully removed National Socialist imagery and values from our Navy!"
 GER_HitStr_Military_Coup_Military_Airforce_Start:0 "Reform the Air Force"
 GER_HitStr_Military_Coup_Military_Airforce_Start_desc:0 "The Luftwaffe was created at the behest of the National Socialists, meaning that it has their stink all over it. We have to purify the Air Force, making it clean from National Socialist Influence!"
 GER_HitStr_Military_Coup_Military_Airforce_Imperial_Roots:0 "Imperial Roots"
 GER_HitStr_Military_Coup_Military_Airforce_Imperial_Roots_desc:0 "Pilots will learn about the Second Reich's Air Fleet, rather than the National Socialist perversion of it."
 GER_HitStr_Military_Coup_Military_Airforce_Remove_Imagery:0 "Remove National Socialist Imagery"
 GER_HitStr_Military_Coup_Military_Airforce_Remove_Imagery_desc:0 "National Socialist Symbols on our planes will be removed, and will be replaced by more traditional German symbols."
 GER_HitStr_Military_Coup_Military_Airforce_Purge:0 "Purge Officers"
 GER_HitStr_Military_Coup_Military_Airforce_Purge_desc:0 "The Airforce must also be cleaned of National Socialist sympathizers, in order to preserve stability wihtin the armed forces."
 GER_HitStr_Military_Coup_Military_Airforce_Airports:0 "Build New Airports"
 GER_HitStr_Military_Coup_Military_Airforce_Airports_desc:0 "We still want a working and operational Air Force, so we need air bases to ensure this."
 GER_HitStr_Military_Coup_Military_Airforce_Move_Paratroopers:0 "Move Paratroopers to the Heer"
 GER_HitStr_Military_Coup_Military_Airforce_Move_Paratroopers_desc:0 "To decrease the power of the Luftwaffe (and increase the influence of the army), we will move Paratroopers from the purview of the Air Force to the supervision of the army."
 GER_HitStr_Military_Coup_Military_Airforce_Done:0 "Finish Luftwaffe Reforms"
 GER_HitStr_Military_Coup_Military_Airforce_Done_desc:0 "We have sucessfully managed to diminish National Socialist influence on our air force.""
 #Himmler's Spooky Horror House of Evil tm
 german_focus_hitler_himmler_coup:0 "Himmler's Coup Focus Tree"
 GER_Himmler_Coup:0 "The SS have taken over the Government."
 GER_Hitler_Himmler_Coup_Start:0 "Himmler in Command"
 GER_Hitler_Himmler_Coup_Start_desc:0 "The Leader of the SS, Heinrich Himmler, has managed to wrest control of the government away from the rest of the NSDAP and has installed himself as the new Führer. The Long Knives of the SS now loom over Germany even more than they have before!"
 GER_Hitler_Himmler_Coup_Denounce_Reactionaries:0 "Denounce Reactionaries"
 GER_Hitler_Himmler_Coup_Denounce_Reactionaries_desc:0 "The SS might look back into the past, but it is still a Radical Movement. The Old Germany will not come back, but a New Old Germany will rise in its place!"
 GER_Hitler_Himmler_Coup_Destroy_Junkers:0 "Destroy the Junkers"
 GER_Hitler_Himmler_Coup_Destroy_Junkers_desc:0 "The Aristocratic Reactionaries' existance stands against the Meritocracy of SS. The Junkers must be destroyed with extreme Predjudice!"
 GER_Hitler_Himmler_Coup_Increase_Police_Presence:0 "Increase Police Presence"
 GER_Hitler_Himmler_Coup_Increase_Police_Presence_desc:0 "The Gestapo, KrimPo, and SiPo must all be ready to catch dissidents at a moments' notice. Even as we make preparations, rebel groups might be preparing to launch campaigns against the new government."
 GER_Hitler_Himmler_Coup_Infiltrate_Rebels:0 "Infiltrate Rebel Groups"
 GER_Hitler_Himmler_Coup_Infiltrate_Rebels_desc:0 "With new resistance groups forming, we can send SD agents in droves to act as spies for our government."
 GER_Hitler_Himmler_Coup_More_Cult_Stuff:0 "Prepare Neo-Pagan Expansion"
 GER_Hitler_Himmler_Coup_More_Cult_Stuff_desc:0 "Now that we have nobody holding us back, we can begin preparations for a general expansion of the SS Religious Movement."
 GER_unlock_cult_stuff_tt:0 "§GThe Himmlerist Religious Branch will be unlocked.§!"
 GER_Hitler_Himmler_Coup_Mandatory_Membership:0 "Mandatory SS Membership"
 GER_Hitler_Himmler_Coup_Mandatory_Membership_desc:0 "Anybody of at least marginal importance; Factory Managers, Military Officers, Doctors, Professors, etc; must be a member of the SS. And to do so, they have to meet the standards we set. This is sure to produce a society of strong Germanics that cannot go wrong in any way."
 GER_Hitler_Himmler_Coup_Meritocracy:0 "A New Meritocracy"
 GER_Hitler_Himmler_Coup_Meritocracy_desc:0 "The people of Germany will not be judged in any way other than their merits, provided that they are men who meet SS racial standards."
 GER_Hitler_Himmler_Coup_German_Elite:0 "The Elite of Germany"
 GER_Hitler_Himmler_Coup_German_Elite_desc:0 "Members of the SS should consider themselves to be an elite branch of society, not just common rabble."
 GER_Hitler_Himmler_Coup_Purge_Dissenters:0 "Find Dissidents"
 GER_Hitler_Himmler_Coup_Purge_Dissenters_desc:0 "Now that we have our own agents inside rebellious groups, we can begin arresting and eliminating them en masse."
 GER_Hitler_Himmler_Coup_SS_Law_Code:0 "The SS Law Code"
 GER_Hitler_Himmler_Coup_SS_Law_Code_desc:0 "Now that the SS is in control, German Law can be even more restricted than before."
 GER_Hitler_Himmler_Coup_The_New_Order:0 "The New Order"
 GER_Hitler_Himmler_Coup_The_New_Order_desc:0 "Most of our Political Reforms are Complete, and we can declare a New Order in Germany! Well, a New New Order at least."
 GER_Hitler_Himmler_Religion_Start:0 "The Rise of Himmlerism"
 GER_Hitler_Himmler_Religion_Start_desc:0 "Himmlerism must not be considered a political ideology, but a Religious Movement with Political Characteristics. It will replace Christianity and become the central feature of German Political Life."
 GER_Hitler_Himmler_Religion_New_Castles:0 "Build More Castles"
 GER_Hitler_Himmler_Religion_New_Castles_desc:0 "Castles both New and Old must be appropriated and turned into SS Religious Centres."
 GER_Hitler_Himmler_Religion_New_Ceremonies:0 "Devise New Ceremonies"
 GER_Hitler_Himmler_Religion_New_Ceremonies_desc:0 "Although we already have Solstice, Anniversary, and Wedding Ceremonies, we must create new ones en masse in order to placate the population."
 GER_Hitler_Himmler_Religion_Move_Against_Protestants:0 "Move against the Lutherans"
 GER_Hitler_Himmler_Religion_Move_Against_Protestants_desc:0 "We can now begin to move against the Churches. Clerics known - by our secret police of course - to be Anti-National-Socialist will be arrested, and their Churches will be expropriated for State Use. If other pastors so far unknown to us - as far as you can be unknown to the SS - should be trouble, we can deal with them as well."
 GER_Hitler_Himmler_Religion_Move_Against_Catholics:0 "Skorzeny's Operation Wien"
 GER_Hitler_Himmler_Religion_Move_Against_Catholics_desc:0 "Named after Vienna, once defender of Catholicism, Operation Wien has been devised by Otto Skorzeny to destroy the Catholic Church and its influence in Germany in approximately three months. While we can expect no resistance, this move is bound to be unpopular with the Catholic Population."
 GER_Hitler_Himmler_Religion_Burn_Bibles:0 "Burn Bibles"
 GER_Hitler_Himmler_Religion_Burn_Bibles_desc:0 "The Bible must be banned and destroyed if we are to eliminate Christianity from Germany."
 GER_Hitler_Himmler_Religion_SS_Preachers:0 "SS Preachers"
 GER_Hitler_Himmler_Religion_SS_Preachers_desc:0 "Our Propagandists will begin preaching about a Creator God but will turn the populace away from Christianity."
 GER_Hitler_Himmler_Religion_In_Schools:0 "Himmlerism in Schools"
 GER_Hitler_Himmler_Religion_In_Schools_desc:0 "National Socialist Religion will be taught in schools along with the usual Political Education."
 GER_Hitler_Himmler_Religion_Ideology_Of_Violence:0 "Promote Detached Violence"
 GER_Hitler_Himmler_Religion_Ideology_Of_Violence_desc:0 "Violence against our enemies should not be seen as terribly awful or craven; we should teach our population that they should hunt down rebels and critics of the Regime."
 GER_Hitler_Himmler_Religion_Indoctrinate_Hitler_Youth:0 "Indoctrinate the Hitlerjugend"
 GER_Hitler_Himmler_Religion_Indoctrinate_Hitler_Youth_desc:0 "The youth can be further brainwashed by paramilitary instructors."
 GER_Hitler_Himmler_Religion_Four_Child_Policy:0 "The Four Child Policy"
 GER_Hitler_Himmler_Religion_Four_Child_Policy_desc:0 "Except in certain cases (which would require bureaucratic approval), all Married German Couples will be expected to have at least four children."
 GER_Hitler_Himmler_Religion_Esoteric_Hitlerism:0 "Develop Esoteric Hitlerism"
 GER_Hitler_Himmler_Religion_Esoteric_Hitlerism_desc:0 "Delving into the mysticism of Hitlerism and providing a more völkisch view of the nation will help give Himmlerism the sincerity it lacks."
 GER_Hitler_Himmler_Religion_Focus_On_Himmler:0 "Extend Himmlerist Thought"
 GER_Hitler_Himmler_Religion_Focus_On_Himmler_desc:0 "Continuing to develop the pseudoscience aspect of Himmlerism will help us connect our propaganda to the ancient German past."
 GER_Hitler_Himmler_Religion_Esoteric_Hitlerism_Hitlers_Death:0 "Explain Hitler's Death"
 GER_Hitler_Himmler_Religion_Esoteric_Hitlerism_Hitlers_Death_desc:0 "The Official Story is that Adolf Hitler was killed by Reactionary Generals. We shall have to work this into our mythology using a sort of Christ-esque story as a brainwashing tactic."
 GER_Hitler_Himmler_Religion_Esoteric_Hitlerism_Germanic_Origins:0 "Justify Aggression"
 GER_Hitler_Himmler_Religion_Esoteric_Hitlerism_Germanic_Origins_desc:0 "We can use the explanation that Germanics may have originated from a higher form of being than others as an excuse that allows the people to be ready for war at any moment."
 GER_Hitler_Himmler_Religion_Esoteric_Hitlerism_Collective_Unconsious_Trash:0 "Collective Unconscious Theory"
 GER_Hitler_Himmler_Religion_Esoteric_Hitlerism_Collective_Unconsious_Trash_desc:0 "Teaching the people that all Germanics are part of a collective Unconscious will allow us to more easily brainwash and indoctrinate the population."
 GER_Hitler_Himmler_Religion_Esoteric_Hitlerism_Avatar_Garbage:0 "The Führer as an Avatar"
 GER_Hitler_Himmler_Religion_Esoteric_Hitlerism_Avatar_Garbage_desc:0 "If the Germanics have a Collective Unconscious, then the Führer is an, uh, Avatar chosen by the Unconscious to, erm, guide it to survival and dominance? Sure, let's go with that."
 GER_Hitler_Himmler_Religion_Focus_On_Himmler_Creator_God:0 "Teaching of a Creator God"
 GER_Hitler_Himmler_Religion_Focus_On_Himmler_Creator_God_desc:0 "We don't exactly know what to call it, but we will teach the people of a Creator God who created the Germans."
 GER_Hitler_Himmler_Religion_Focus_On_Himmler_Teutons:0 "Teutonic Legacy"
 GER_Hitler_Himmler_Religion_Focus_On_Himmler_Teutons_desc:0 "We should remind the people that as the Teutons guarded Catholicism, we should guard our society as well."
 GER_Hitler_Himmler_Religion_Focus_On_Himmler_More_Expeditions:0 "Archeological Expeditions"
 GER_Hitler_Himmler_Religion_Focus_On_Himmler_More_Expeditions_desc:0 "Himmler wants pseudoscientific proof of Himmlerism. To this end, we should send archeological teams to find it."
 GER_Hitler_Himmler_Religion_Focus_On_Himmler_Mandatory_Membership:0 "Mandatory Church Membership"
 GER_Hitler_Himmler_Religion_Focus_On_Himmler_Mandatory_Membership_desc:0 "To be considered anybody of importance in our society, they and their family have to be active members of the National Socialist Religion."
 GER_Hitler_Himmler_Economy_Start:0 "The SS Economy"
 GER_Hitler_Himmler_Economy_Start_desc:0 "The German Economy is in Himmler's hands now. We will need to make sure that the SS controls every aspect of that as well."
 GER_Hitler_Himmler_Economy_Hitler_Policy:0 "Keep with Hitlerist Economic Policy"
 GER_Hitler_Himmler_Economy_Hitler_Policy_desc:0 "We should continue Hitler's Economic Plans to make sure that our Social Darwinian economy does not turn to a more socialist model."
 GER_Hitler_Himmler_Economy_Himmler_Policy:0 "Move to a Himmlerist Economic Policy"
 GER_Hitler_Himmler_Economy_Himmler_Policy_desc:0 "We should move to an Economic model based on Himmlerism to make sure that every detail of economic life is under SS control."
 GER_Hitler_Himmler_Economy_Hitler_Policy_Encourage_Competition:0 "Encourage Competition"
 GER_Hitler_Himmler_Economy_Hitler_Policy_Encourage_Competition_desc:0 "Competition seperates the strong from the weak. We must encourage economic competition to prevent decadence from setting in!"
 GER_Hitler_Himmler_Economy_Hitler_Policy_Enforce_Economic_Threats:0 "Enforce Economic Obligations"
 GER_Hitler_Himmler_Economy_Hitler_Policy_Enforce_Economic_Threats_desc:0 "The Old Regime would threaten businesses that rejected Government Contracts, but would never carry out those threats. We shall end these kinds of bluffs, and act on our words."
 GER_Hitler_Himmler_Economy_Hitler_Policy_Friends_Of_Himmler:0 "Freundeskreis der Wirtschaft"
 GER_Hitler_Himmler_Economy_Hitler_Policy_Friends_Of_Himmler_desc:0 "The Circle of Friends of the Economy is a group of industrialists who hope to tie the NSDAP together with different industries. We should expand this club to ensure that our hands are everywhere in the economy."
 GER_Hitler_Himmler_Economy_Hitler_Policy_More_Oversight:0 "Increase State Oversight"
 GER_Hitler_Himmler_Economy_Hitler_Policy_More_Oversight_desc:0 "Some more state oversight is necessary to ensure that all resources work for the state, and that no groups are committing sabotage."
 GER_Hitler_Himmler_Economy_More_Memorabilia:0 "More SS Memorabilia"
 GER_Hitler_Himmler_Economy_More_Memorabilia_desc:0 "SS Products must be on shelves all over Germany to ensure that our presence is never forgotten."
 GER_Hitler_Himmler_Economy_Symbols_On_Everything:0 "Symbols on Everything"
 GER_Hitler_Himmler_Economy_Symbols_On_Everything_desc:0 "Along with the Swastika, SS runes must be on all products made in Germany."
 GER_Hitler_Himmler_Economy_Mineral_Water:0 "Expand Sudetenquell GmbH"
 GER_Hitler_Himmler_Economy_Mineral_Water_desc:0 "Our mineral water enterprises are not expansive enough. We must have 100% of the German Mineral Water market share."
 GER_Hitler_Himmler_Economy_SS_Alcohol:0 "Create Wewelsburg GmbH"
 GER_Hitler_Himmler_Economy_SS_Alcohol_desc:0 "Wewelsburg Ltd. will be a new SS Brewing Company. If the SS is going to be a group of Alcoholic Thugs, we might as well make money off of it."
 GER_Hitler_Himmler_Economy_Hitler_Decrease_Rations:0 "Decrease Civilian Investment"
 GER_Hitler_Himmler_Economy_Hitler_Decrease_Rations_desc:0 "The state needs more resources, so we must cut down on civilian investment."
 GER_Hitler_Himmler_Economy_Himmler_Policy_Publishing:0 "Nationalize Publishing Houses"
 GER_Hitler_Himmler_Economy_Himmler_Policy_Publishing_desc:0 "Most publishing houses in Germany will be nationalized for full SS control of every piece of propaganda that leaves our presses."
 GER_Hitler_Himmler_Economy_Himmler_Policy_Raise_Taxes:0 "Raise Taxes"
 GER_Hitler_Himmler_Economy_Himmler_Policy_Raise_Taxes_desc:0 "To pay for our new Economic Efforts, we have to increase the amount of Government Income."
 GER_Hitler_Himmler_Economy_Himmler_Policy_Reorganize_Goringwerke:0 "Reorganize Reichswerke Hermann Göring"
 GER_Hitler_Himmler_Economy_Himmler_Policy_Reorganize_Goringwerke_desc:0 "Göring's resources smelteries were poorly managed failures. We should give it to SS-men who will manage it, um, less than poorly!"
 GER_Hitler_Himmler_Economy_Himmler_Policy_Expand_Himmlerwerke:0 "Expand Reichswerke Heinrich Himmler"
 GER_Hitler_Himmler_Economy_Himmler_Policy_Expand_Himmlerwerke_desc:0 "Now that we have \"fixed\" Göring's mess, we can expand its operation to include most of the German Resource Market."
 GER_Hitler_Himmler_Economy_Himmler_Decrease_Luxuries:0 "Extra Luxury Taxes"
 GER_Hitler_Himmler_Economy_Himmler_Decrease_Luxuries_desc:0 "Luxuries make a population decadent. To make sure the people are ready for war, decadence should cost them dearly."
 GER_Hitler_Himmler_Coup_Military_Start:0 "Status of the Military"
 GER_Hitler_Himmler_Coup_Military_Start_desc:0 "The army is very much unhappy with the new administration. They regard the SS as Himmler's personal abomination. We shall have to turn them back onto our side."
 GER_Hitler_Himmler_Coup_Military_Recruiting_Standards:0 "New Recruiting Standards"
 GER_Hitler_Himmler_Coup_Military_Recruiting_Standards_desc:0 "We will raise the standards of the rest of the Military to match those of the SS. There will be moral, religious, and ethnic requirements to join."
 GER_Hitler_Himmler_Coup_Military_Membership:0 "Mandatory Membership for Officers"
 GER_Hitler_Himmler_Coup_Military_Membership_desc:0 "Military officers with the rank of Army Captain or its equivalent will be required to join the SS, and any prospective Captains will have to join to be eligible for a promotion."
 GER_Hitler_Himmler_Coup_Military_Navy_Purges:0 "Kriegsmarine Purges"
 GER_Hitler_Himmler_Coup_Military_Navy_Purges_desc:0 "Reactionary or Anti-SS Naval Commanders will be removed from the service and sent to prison!"
 GER_Hitler_Himmler_Coup_Military_Army_Purges:0 "Heer Purges"
 GER_Hitler_Himmler_Coup_Military_Army_Purges_desc:0 "We must make sure that our land efforts are not hampered by officers with Anti-SS sympathies."
 GER_Hitler_Himmler_Coup_Military_Air_Purges:0 "Luftwaffe Purges"
 GER_Hitler_Himmler_Coup_Military_Air_Purges_desc:0 "The Luftwaffe, for a long time, was possessed by Göring's idiocy. We must make sure that it is commanded with competence and efficiency!"
 GER_Hitler_Himmler_Coup_Military_Ship_Christening:0 "SS Launching Ceremonies"
 GER_Hitler_Himmler_Coup_Military_Ship_Christening_desc:0 "As a Propaganda Measure, we should give the launchings of new vessels some Religious Symbolism."
 GER_Hitler_Himmler_Coup_Military_SS_Commanders:0 "SS Field Commanders"
 GER_Hitler_Himmler_Coup_Military_SS_Commanders_desc:0 "Giving SS Officers Field Command will ensure our control over the military."
 GER_Hitler_Himmler_Coup_Military_CAS_Effort:0 "Continue Air Support Research"
 GER_Hitler_Himmler_Coup_Military_CAS_Effort_desc:0 "Giving our troops air support using dive bombers is the right idea. We should continue this practice."
 GER_Hitler_Himmler_Coup_Military_Runes_On_Planes:0 "Himmlerist Symbols on Planes"
 GER_Hitler_Himmler_Coup_Military_Runes_On_Planes_desc:0 "To display the omnipresence of the SS, even our planes will have SS symbols on them."
 GER_Hitler_Himmler_Coup_Military_Promotion_Ceremonies:0 "SS Promotion Ceremonies"
 GER_Hitler_Himmler_Coup_Military_Promotion_Ceremonies_desc:0 "All Military Promotions will be given Himmlerist overtones, similar to knighthoods of old."
 GER_Hitler_Himmler_Coup_Military_SS_Kommissars:0 "Nationalsozialistische Führungsoffiziere"
 GER_Hitler_Himmler_Coup_Military_SS_Kommissars_desc:0 "SS National Socialist Leadership Officers Liasons will be present in every brigade to make sure that soldiers follow orders."
 GER_Hitler_Himmler_Coup_Military_Airforce_Propaganda:0 "Teutons of the Sky"
 GER_Hitler_Himmler_Coup_Military_Airforce_Propaganda_desc:0 "Just as the Heer protect our land and the Kriegsmarine protects our Seas, the Luftwaffe protects our airspace!"
 GER_Hitler_Himmler_Coup_Military_Move_Waffen_From_OKW:0 "Move the Waffen-SS from the OKW"
 GER_Hitler_Himmler_Coup_Military_Move_Waffen_From_OKW_desc:0 "The Oberkommando der Wehrmacht, even though it is staffed with SS-Men, will no longer have jurisdiction over the Waffen-SS. This makes the unit more flexible."
 GER_Hitler_Himmler_Coup_Military_Kamikaze:0 "Valhalla Pilots"
 GER_Hitler_Himmler_Coup_Military_Kamikaze_desc:0 "The Pilots of the Valhalla Program will give their lives so that our country can fight on!"
 GER_Hitler_Himmler_Coup_Military_Purged:0 "Military Reforms Complete"
 GER_Hitler_Himmler_Coup_Military_Purged_desc:0 "We have successfully Purged our military and turned it into the vision that Herr Himmler wanted for it!"
 #Temporary ww2 buff
 ger_internal.87.t:0 "The War Has Come"
 ger_internal.87.d:0 "For the last several years, we have been working towards a war for the fate of Europe. It is now time for the world to see what a nation can do with its back against the wall. Twenty years after the humiliation of Versailles, Europe will be reshaped once more. However this time, it shall be Berlin in command! Soon, our men will march across the continent and make their families proud!"
 ger_internal.87.a:0 "We have one goal..."
 ger_internal.88.t:0 "Loss of Momentum"
 ger_internal.88.d:0 "After over a year of war, it is safe to say that the army's initial enthusiasm is wearing off. Though there have been successes, Germany's level of morale is stabilizing at a moderate level. It seems as though we are in for the long haul. The men in the trenches sigh, as they long to see their loved ones - mothers, wives, and children - again, but they believe the war is worth fighting. Or do they?"
 ger_internal.88.a:0 "We had better win soon."
 ger_internal.89.t:0 "Loss of Morale"
 ger_internal.89.d:0 "The war has lasted for thirty months, and there are no more illusions about a swift victory. The engines of liberalism and bolshevism have gotten into gear, and nobody expects anything less than a protracted conflict. The people have also been slowly turned against the war. The mothers wish to see their children safe-and-sound, and the children wish to see their fathers once again. The people will soon understand that the war was not worth fighting."
 ger_internal.89.a:0 "Another day, another casualty report."
 #Institut für Sexualwissenschaft
 ger_internal.90.t:0 "The Institute for Sexual Research is Closed Down"
 ger_internal.90.d:0 "Founded in May 1919, the Institut für Sexualwissenschaft served as an archive, research facility, and medical clinic with the aim to study and promote sexual rights and wellbeing in Berlin. Notably, the Institute has made strides in the understanding of homosexuality and transsexuality, as well as the promotion of these groups' rights.\n\nOur government, on the other hand, considers such attitudes to be morally depraved and biologically unnatural. As such, we have organized for members of the Deutsche Studentenschaft (German Students' Union) to march on the institute and storm it while Dr. Hirschfeld, the founder, was out of the country. They seized several thousand books, images, and lists of clients. In a few days, these books, images, and magazines will be publically burned along with works by leftists, Jews, and pacifists."
 ger_internal.90.a:0 "Soon the day will come when science will triumph over error."
 ger_internal.91.t:0 "The Institute for Sexual Research Celebrates its Twentieth Anniversary"
 ger_internal.91.d:0 "Founded in May 1919 by Drs. Magnus Hirschfeld and Arthur Kronfeld, the Institut für Sexualwissenschaft served as an archive, research facility, and medical clinic with the aim to study and promote sexual rights and wellbeing in Berlin. Notably, the Institute has made strides in the understanding of homosexuality and transsexuality, as well as the promotion of these groups' rights.\n\nToday, the Institute is celebrating the 20th anniversary of its founding. The celebrations will include speeches by Dr. Hirschfeld, an overview of new scientific papers by Dr. Kronfeld, lectures by sexologists from Germany, Switzerland, and the United States, lunch and dinner services, and ending with a performance of Dr. Hirschfeld's play, \"Anders als die Andern\" (Different From the Others). The play depicts a gay man whose life is ruined by prejudices of those around him. All in all, the Institute plans to continue its research and campaigns for homosexual rights."
 ger_internal.91.a:0 "Congratulations!"

 ger_internal.93.t: "Gerd von Rundstedt retires"
 ger_internal.93.d: "Just short of his 63rd birthday, the old general is not in good health and misses his family – he is now a grandfather – so he has asked permission to retire. Despite his recent confrontations with [GER.GetLeader] he has remained on good terms with him, who in fact has made Rundstedt honorary colonel (Chef) of his old regiment as a retirement gift. Besides, Rundstedt has agreed that in the event of war he would return to active service, so there is a chance we might see him again..."
 ger_internal.93.a: "Goodbye"
