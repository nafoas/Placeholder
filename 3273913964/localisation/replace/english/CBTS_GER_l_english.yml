 GER_fuhrer_directive_n25: "Führer Directive 25"
 GER_fuhrer_directive_n25_desc: "Between other things the directive calls for Yugoslavia to be treated as an hostile nation, and states that \"efforts will be made to induce Hungary and Bulgaria to take part in operations by offering them the prospect of regaining Banat and Macedonia\" as well as \"internal tensions in Yugoslavia will be encouraged by giving political assurances to the Croats\". The orders are clear, we will invade Yugoslavia and then divide the spoils amongst the victors!"

