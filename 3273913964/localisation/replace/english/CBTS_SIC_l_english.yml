l_english:

  ### Ideas ###
 SIC_no_industry: "No Industry"
  
  
  ### Events ###
  
 sichuan.1.t:0 "Meet with Liu Wenhui?"
 sichuan.1.d:0 "Liu Wenhui, although Liu Xiang's rival, is also his uncle. Xiang has recently been afraid that Deng Xihou and other warlords will continue expanding their powers while Xiang chasese after Wenhui. Since then he has decided that he'll let his uncle maintain power in the Xikang region where he will still have some troops."
 sichuan.1.a:0 "Let's hear our uncle out"
 sichuan.2.t:0 "Liu Family Requests an End to the Rivalry"
 sichuan.2.d:0 "We have been defeated. Although they have won, Liu Xiang and other members of our family have come to broker a peace between us, in a show of mercy. They offer to let our clique survive in the western region of Chuanbian, including Ya'an, while they occupy the rest. What should we say?"
 sichuan.2.a:0 "Sign the peace"
 sichuan.2.b:0 "We haven't given up yet. We will march back to the Red Basin!"
 sichuan.3.t:0 "The New Provincial Capital"
 sichuan.3.d:0 "We have been able to sucessfully unify Sichuan province, now we must decide where to govern from. There are two obvious choices being Chengdu or Chongqing. Now, which should we choose?"
 sichuan.3.a:0 "Chongqing! The pearl of Sichuan!"
 sichuan.3.b:0 "Chengdu! The old capital of Shu!"
 sichuan.6.t:0 "Liu Xiang Dies!"
 sichuan.6.d:0 "After a few days in the hospital due to illness, Liu Xiang has tragically passed away due to stomach cancer, leaving the Sichuan Clique leaderless. It is likely that the central government will attempt to annex us now that we are vulnerable, with some saying that Chiang Kai-shek poisoned Liu for conspiring with Shandong Chief Han Fuju to turn against Chiang. One thing is certain however, the future ahead of us will be a difficult one."
 sichuan.6.a:0 "Oh no"
 sichuan.7.t: "The Death of Liu Xiang"
 sichuan.7.d.kmt: "After a few days in the hospital due to illness, Liu Xiang has died of stomach cancer, leaving the Sichuan Clique leaderless. We will attempt to seize the opportunity and stablish a civil government in the territory previously controlled by Xiang, effectively annexing it into the Republic. This will let us assert our control over Chongqing, the most important city of the region."
 sichuan.7.d.lwh: "After a few days in the hospital due to illness, Liu Xiang (Liu Wenhui's nephew) has died of stomach cancer leaving the Sichuan Clique leaderless. We will try and retake the lands we lost to them in the previous conflict now that they are vulnerable. The central government will probably attempt a similar strategy and try to annex Xiang's lands. In the case of having the central government right at the door we no longer would have the posibility of ignoring Chiang Kai-shek's orders without any repercussions; surely Chiang still hasn't forgotten our disobedience during the long march, so we must be perpared if he wants to seek vengeance!"
 sichuan.7.kmt: "Excellent news"
 sichuan.7.lwh: "Rest in Peace, nephew"
 sichuan.9.t: "Family Disputes"
 sichuan.9.d.lxi: "We have recieved word of Liu Wenhui's invasion of Deng Xihou's domain, in an attempt to secure thier borders for the upcoming resume of hostilities between our 2 cliques. Both Liu Xiang and Liu Wenhui have an intense ongoing rivalry, despite being family (which probably is what exacerbates their rivalry), so both of them are trying to outmatch the other with diplomatic maneuvers. As a response to this declaration of intentions, General Xiang has decided to break the truce with Wenhui and start to prepare for military operations."
 sichuan.9.a: "The War has resumed"
 sichuan.9.d.lwh: "My General! Liu Xiang has broke off the truce with us in response of our attack to Deng Xihou. It seems they saw our intentions from afar and decided to intervene. As we speak the troops near the border with Xiang are being mobilized into their positions to prepare for any possible offensive from the enemy."
 sichuan.9.b: "So be it"
 sichuan.10.t: "The Anchuanjun"
 sichuan.10.d.lxi: "After successful negotiations with Deng Xihou, we have agreed to create a temporal coalition called the Anchuanjun (Sichuan Protection Army) to unite Sichuan against the ambitions of Liu Wenhui. We expect other warlords such as Tian Songyao or Yang Sen to join us like they did in 1932 and crush the menace from Chengdu."
 sichuan.10.a: "Excellent"
 sichuan.10.d.dxh: "When Liu Wenhui attacked us, his nephew and warlord in Chongqing contacted us to join forces against his uncle. After careful negotiation we have agreed to form the Anchuanjun (the Sichuan Protection Army) and it is expected other warlords in the region join it as well. May our combined strenght be enough to kick Wenhui in the balls!"
 sichuan.10.b: "Hooray"
 sichuan.12.t: "Mass defections!"
 sichuan.12.d: "A report from several offcials on the frontline alerts that large numbers of men from our army have started defecting to the enemy. This would not be a noteworthy issue since defections are common occurece in warlord armies, but the sheer amount of men that have been seen defecting is worringly bigger than usual. The reasons for them to desert are the usual: no payment in months, excesive harsh treatment, cowardice... whatever those damned rats make up to justify themselves. We surely must stop this conduct before it snowballs and makes us loose the war, by applying harsher punishments and making them renew their oaths of alliegance."
 sichuan.12.a: "Cowardice"
 sichuan.14.t: "Chongqing incorporated"
 sichuan.14.d: "We have successfully annexed most of Liu Xiang's lands into the republic, stablishing a civilian government after kicking out the remaining warlords. A large part of Sichuanese troops have turned their allegiance over to Chiang Kai-shek, becoming Central Army units. The province will surely become a major recruiting center for our armies."
 sichuan.14.a: "The pearl of Sichuan is ours!"

 sichuan.18.a: "Peace, for now"
 
 ### Categories ###
 
 SIC_sichuanese_unification:0 "The Sichuanese Civil War"
 SIC_sichuanese_unification_desc:0 "Only one warlord can arise victorious in the Sichuan civil war. In order to unite the province under our rule, we must make haste in taking control of important regions from other warlords."
 SIC_sichuanese_war_actions:0 "War Actions"
 SIC_sichuanese_war_actions_desc:0 "We must expand our local army in order to be able to compete with the other warlords. There are plenty choices we have to expand our local army."
 SIC_buy_money:0 "Issue Emergency Bonds"
 SIC_buy_money_desc:0 "The government is running low on money right now. We better find someway to make up for our losses."
  
  ### Decisions###
  
 LWH_attack_Deng: "Attack Deng Xihou"
 LWH_attack_Deng_desc: "After 2 months of fighting a loosing war with all the other warlords in Sichuan, we signed a truce with Liu Xiang and Yang Sen, giving us precious time to organize our forces and prepare for the unavoidable struggle for Sichuanese unification. Deng Xihou caused a lot of trouble to us when him and Tian Songyao occipied the important city of Chengdu, while we were busy fighting Xiang. We later managed to retake Chengdu and forced them to retreat back to their original positions; but the problem remains. If we want to reunify all of Sichuan we first have to take out all possible inconveniences, so they dont bite us in the butt when we are vulnerable.\nFor this reason we have scheduled an attack on Deng Xihou to take him out of action."
 SIC_unify_sichuan:0 "Unify Sichuan"
 SIC_unify_sichuan_desc:0 "Our rivals have been defeated! Nobody can oppose us! Sichuan is unified province! Wansui!"
 SIC_occupy_chengdu:0 "Occupy Chengdu"
 SIC_occupy_chengdu_desc:0 "Chengdu is the center of Sichuan and an extremely vital location in Sichuan. If we are to unite the province we must have the city in our hands."
 SIC_occupy_chongqing:0 "Occupy Chongqing"
 SIC_occupy_chongqing_desc:0 "Chongqing is growing to become the largest city in Sichuan and maybe all of China. If we wish to unify the province it will be a necessary city to take."
 SIC_retake_north:0 "Retake the North"
 SIC_retake_north_desc:0 "Aba is the northenmost region of Sichuan and is an important piece to take if we want to unfiy Sichuan."
 SIC_expel_tian_songyao:0 "Expel Tian Songyao"
 SIC_expel_tian_songyao_desc:0 "Tian Songyao is an illegitimate warlord occupying the north of Sichuan. We must kick him out of the province forever!"
 SIC_expel_yang_sen:0 "Expel Yang Sen"
 SIC_expel_yang_sen_desc:0 "Yang Sen used to be one of the more powerful warlords in Sichuan. However he has fallen drastically and is barely clinging to his influence. Let us put out his hopes of reclaiming his power once and for all."
 SIC_expel_liu_cunhou:0 "Expel Liu Cunhou"
 SIC_expel_liu_cunhou_desc:0 "Liu Cunhou is an ancient man that only clutches on to his power due to the threat of communist invaders. It's time for him to go."
 
 SIC_buy_weapons_from_abroad:0 "Purchase Foreign Arms"
 SIC_buy_weapons_from_abroad_desc:0 "Europeans rifles are so much more advanced than what we have in China. If we could get our hands on them we could definitely get an upper hand on our opponents."
 SIC_seize_supplies_for_army:0 "Seize Supplies for the Army"
 SIC_seize_supplies_for_army_desc:0 "Our troops need more supplies to continue their fight. We may need to demand some from the local populace if we want to aid them."
 SIC_disband_exiled_warlord_armies:0 "Disband Exiled Warlord Armies"
 SIC_disband_exiled_warlord_armies_desc:0 "Multiple warlord armies from Yunnan and Guizhou roam our lands, we could easily force them to disband and seize their weapons for ourselves."

 SIC_buy_western_guns:0 "Purchase Western Guns."
 SIC_buy_western_guns_desc:0 "With our contacts in the French and British colonies we should be able to find some way to buy their weapons."
 
 SIC_issue_bonds:0 "Issue Bonds"
 SIC_issue_bonds_desc:0 "We can hopefully fill our coffers if we issue these bonds."
  
