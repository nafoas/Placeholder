l_english:
 #ideas
 BEL_great_depression:0 "Great Depression"
 BEL_great_depression_desc:0 "After the destruction left by the German Army in the Great War, Belgium had been recovering until the 1929 Stock Market Crash. However, as the Jasper Cabinet had devalued the Franc several years before, Belgium was not hit quite as hard as other nations."
 BEL_moderate_separatism:0 "Moderate Separatism"
 BEL_moderate_separatism_desc:0 "Belgium is a country of multiple ethnicities. Flanders, Wallonia, and Eupen-Malmedy live as a Federation, with Brussels as a separate Capital Region. Three languages are spoken in this country, and the people generally live side-by-side in peace. However, ever since the German Occupation, Flemish separatism has slowly taken root in our society, with Flemish separatist groups pushing for the \"Dutchification\" of Flemish institutions, and in some cases, total independence."
 BEL_radicalism:0 "Rising Radicalism"
 BEL_radicalism_desc:0 "The political order in Belgium is traditionally a three-party system. The Socialist, Catholic, and Liberal parties generally make up a very large majority of the Chamber of Representatives. In recent years, the Great Depression and the effects of the German Occupation have given rise to increasingly Radical Movements, such as the Communist Party of Belgium and the Frontpartij. We should expect to see Radical Nationalist and Socialist groups continue to appear and grow."
 BEL_outdated_military:0 "Outdated Military"
 BEL_outdated_military_desc:0 "The Belgian Military is outdated. After the Great War, anti-military sentiments largely prevailed, and thus there has been little in the way of military modernization. This has been recently exacerbated by Pro-German Flemish Politicians."
