 unitedstates.223.b:0 "William E. Borah (R)"
 unitedstates.223.c:0 "Joseph T. Robinson (NDP)"
 unitedstates.223.e:0 "Huey P. Long (SoWP)"
 unitedstates.223.f:0 "No candidate captured an Electoral College majority!"
