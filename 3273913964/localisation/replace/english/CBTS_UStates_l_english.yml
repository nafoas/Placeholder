 unitedstates.155.t:0 "1948 Presidential Election"
 unitedstates.155.d:0 "Four years have passed, and the people must pick their President once again. [USA_r_nominee_eight] or [USA_d_nominee_eight], only one man can win the election and lead us for the next four years. As the votes are counted, a clear winner emerges..."
