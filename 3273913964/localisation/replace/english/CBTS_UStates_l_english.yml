 USA_inaugurationday:0 "Inauguration Day"
 USA_inaugurationday_desc:0 "After 4 months, Franklin Delano Roosevelt has been finally sworn in as President of the USA. His Presidency won't be easy, but we can hope that he'll overcome the difficulties and fix the Great Depression."
 USA_dealwiththebanks:0 "Deal with the Banks"
 USA_dealwiththebanks_desc:0 "After forcefully closing the banks, now we have to do something for when they reopen. The Emergency Banking Act our team is drafting is the key to fix the banking sector."
 USA_employthepoor:0 "Employ the Poor"
 USA_employthepoor_desc:0 "If we want to fix this nation, we have to provide employment to our people. Many programs are being drafted to fix this, like the Civilian Conservation Corps that we have to take to the Congress."
 USA_supportthepoor:0 "Balance the Federal Budget"
 USA_supportthepoor_desc:0 "We need to have a balanced budget if we want to ensure sustainability. To do so, we sadly have to pass an austerity bill through Congress, that would cut federal worker and veteral wages sharply."
 USA_feedthepoor:0 "Feed the Poor"
 USA_feedthepoor_desc:0 "We have to do something about the masses of poor, unemployed, and even hungry Americans. We have to offer a relief program and we have to do it now!"
 USA_saveamericanfarms:0 "Save American Farms"
 USA_saveamericanfarms_desc:0 "The crop prices problem needs to be solved as soon as possible. To do so, we shall prepare a bill to go through Congress, creating the Agricultural Adjustment Administration."
 USA_saveamericasindustry:0 "National Industrial Recovery Act"
 USA_saveamericasindustry_desc:0 "In order to save our industrial sector, we have to intervene and prepare a new bill, the National Industrial Recovery Act, to ensure competition, union rights, and employment."
 usa_begin_lowering_unemployment:0 "Unemployment will begin to gradually decrease!"
 usa_begin_increasing_prices:0 "Crop Prices will begin to gradually increase!"
 usa_lose_mil:0 "You'll lose 1 military factory"
 USA_tva:0 "Create the Tennessee Valley Authority"
 USA_tva_desc:0 "Senator George W. Norris and his supporters are very vocal about the creation of a new federal corporation to improve the economy of the Tennessee Valley Area, one of the most punished by the Depression. It certainly is a good idea, so we shall prepare a bill for it."
 USA_deficitsok:0 "Spending is the Key"
 USA_deficitsok_desc:0 "While we have to maintain a balanced budget, our strategy to deal with the Depression will be based on spending and putting our money to good use."
 USA_allalphabet:0 "Alphabet Agencies"
 USA_allalphabet_desc:0 "To deal with the Depression, we shall create many government agencies to provide employment and relief. Due to their names ( PWA, HOLC, DRS... ) these agencies have been dubbed 'Alphabet Agencies'"
 USA_bankregulations:0 "Bank Regulations"
 USA_bankregulations_desc:0 "To deal with the Depression, we must continue to fix the damaged Banking Sector. Congressmen Glass and Steagall should be given support for their bill, even though the President is not very fond of it..."
 USA_endprohibition:0 "End Prohibition"
 USA_endprohibition_desc:0 "It is the time. Focusing on ratifying the 21st Amendment, that would repeal the 18th, would be a major political victory and would make us more popular in the eyes of the people."
 USA_regulatestocks:0 "Regulate Stock Markets"
 USA_regulatestocks_desc:0 "The nest step in our fight against the Great Depression should be the introduction of harsher regulations in the stock markets through a new bill, the Securities Exchange Act."
 USA_balancebudgetusa:0 "Strict Fiscal Conservatism"
 USA_balancebudgetusa_desc:0 "We have to maintain a strictly balanced budget. Our strategy to deal with the Depression will be based on harsh spending cuts and balanced social initiatives, inspired in the Economy Act passed earlier this year."
 USA_oneortheother:0 "One or the Other"
 USA_oneortheother_desc:0 "We can't keep our current level of spending, we must choose a sector to make cuts in."
 USA_militarysectorbalanced:0 "Focus on the Military Sector"
 USA_militarysectorbalanced_desc:0 "We can't cut the military budget, especially now with dictators rising in Asia and Europe. We'll have to make further cuts to the civilian side of the budget, but that shouldn't be an issue."
 USA_civiliansectorbalanced:0 "Focus on the Civilian Sector"
 USA_civiliansectorbalanced_desc:0 "The people's well being can't play second fiddle to the needs of the military! We shall make harsh cuts on the military budget."
 USA_civiliansectorusa:0 "The American Civilian Industry"
 USA_civiliansectorusa_desc:0 "We shall focus our efforts in helping our industrial companies to recover with the Depression, generating more employment and strengthening our economic position."
 USA_extensivecivil:0 "Extensive Civilian Industry Investments"
 USA_extensivecivil_desc:0 "Industrial investments will be continued and expanded to get out of the Great Depression!"
 USA_militarysectorusa:0 "The American Military Industry"
 USA_militarysectorusa_desc:0 "We have to help our military companies to recover from the Depression, creating jobs and increasing our weapons and ammunition output."
 USA_regulatelaborusa:0 "Labor Regulations"
 USA_regulatelaborusa_desc:0 "We can make the economy recover, but that has no use if the average worker doesn't feel the effects of the recovery. We have to expand the rights of the individual worker but also the rights of the unions, as our Labor Secretary Frances Perkins is suggesting. This will hopefully end the strikes as well."
 USA_extensivemilitary:0 "Extensive Military Industry Investments"
 USA_extensivemilitary_desc:0 "Investments in the military-industrial complex shall be continued and expanded for the greater good of America!"
 USA_extensivecivilbalanced:0 "Balance the Civilian Sector"
 USA_extensivecivilbalanced_desc:0 "We have to invest the money we saved in our military cuts in the civilian sector, to make the people feel the recovery."
 USA_extensivemilitarybalanced:0 "Balance the Military Sector"
 USA_extensivemilitarybalanced_desc:0 "We have to invest the money we saved in our civilian cuts in the military, to continue our buildup and to protect America."
 USA_socialsecurityusabalance:0 "A Balanced Social Security"
 USA_socialsecurityusabalance_desc:0 "We have to introduce welfare for the people, without upsetting our fiscal balance. While some people have proposed to introduce old age pensions and unemployment subsidies, we sadly have to remove the subsidies to avoid the spending to get out of hand."
 USA_socialsecurityusa:0 "Introduce Social Security"
 USA_socialsecurityusa_desc:0 "We have to help the people get through these rough times. Old age pensions and unemployment subsidies will protect those who need protection and help many American families out of extreme poverty. It is our duty for the people to get this bill passed."
 USA_redistributetaxes:0 "Tax Redistribution"
 USA_redistributetaxes_desc:0 "To finance our social programs, we have to tax the rich more heavily. They can protest all they want, but the needs of the people are more important!"
 USA_housingprojectsmarlib:0 "Tackle the Housing Problem"
 USA_housingprojectsmarlib_desc:0 "We have to do something about the slums that infest our major cities, however, we have to draft a bill that also respects the budgetary balance."
 USA_housingprojectsusa:0 "Extensive Housing Projects"
 USA_housingprojectsusa_desc:0 "We have to use all the means at our disposal to destroy slums and help every American family to afford their own house."
 USA_election36usa:0 "Presidential Election of 1936"
 USA_election36usa_desc:0 "4 years have passed since Roosevelt beat Hoover, and the American People has to choose a President again. Let the best win!"
 
 USA_president_landon:0 "President Landon"
 USA_president_landon_desc:0 "Against all odds, Alfred M. Landon, former Governor of Kansas and Republican nominee, has won the Presidential Election. With the GOP back in the White House, it is time to decide what to do with the Depression..."
 USA_reform_new_deal:0 "Reform the New Deal"
 USA_reform_new_deal_desc:0 "Roosevelt's New Deal was an example of government overreach, but some of the ideas of his program were not so bad, or at least the damage caused by abolishing them would be too big. Let us cut and reform the New Deal into a Newer Deal!"
 USA_discard_new_deal:0 "Discard the New Deal"
 USA_discard_new_deal_desc:0 "The New Deal is an innefective economic program, that causes an increase in taxes and a big expansion of government bureaucracy, something that is completely incompatible with the American Dream. We will discard the New Deal and let our economy breathe again."
 USA_cut_social_security:0 "Cut Social Security"
 USA_cut_social_security_desc:0 "Social Security is a noble idea that has been poorly implemented by the Democrats. We need to cut Social Security so it can help those who truly need it."
 USA_economic_relief_bill:0 "Economic Relief Bill"
 USA_economic_relief_bill_desc:0 "A new crisis has hit America, and we can't wait to take action. We need to reach across the aisle to pass a bi-partisan Economic Relief Bill that puts the economy back on track."
 USA_reduce_business_regulations:0 "Reduce Business Regulations"
 USA_reduce_business_regulations_desc:0 "Business prosper when they are not hindered by bureaucrats and useless regulations. If we reduce them, our private sector will accelerate its recovery."
 USA_amend_housing_act:0 "Amend the Housing Act"
 USA_amend_housing_act_desc:0 "The Housing Act needs to be amended, it is too interventionist. However, repealing it completely would be counter-productive for the slums situation."
 USA_balance_budget:0 "Balance the Budget"
 USA_balance_budget_desc:0 "Although Roosevelt pledged to maintain a balanced budget, and even passed the Economy Act for this purpose, he has disregarded this policy during his last years as President. We need to rebalance it once more, and ensure we don't overspend during the next 4 years."
 USA_liberalize_agricultural_market:0 "Liberalize the Agricultural Market"
 USA_liberalize_agricultural_market_desc:0 "Agricultural subsidies set in place by Roosevelt have no place now that crop prices have stabilized. We shall liberalize the Agricultural Market once more."
 USA_decrease_presidential_power:0 "Decrease Presidential Power"
 USA_decrease_presidential_power_desc:0 "President Roosevelt's worst mistake was not the New Deal, it was the concentration of power into the Office of the President that hindered our Constitutional values. A large part of the campaign was spent denouncing this, now we have to keep our promises aand reduce Presidential power."
 USA_liberal_voter_base:0 "A Liberal Voter Base"
 USA_liberal_voter_base_desc:0 "Although the so-called New Deal coalition has taken much of our electorate, like blacks, we need to make an effort to attract the liberal voters back into the Republican Party. We are the Party of Lincoln and Theodore Roosevelt, after all."
 USA_rely_conservative_coalition:0 "Rely on the Conservative Coalition"
 USA_rely_conservative_coalition_desc:0 "The Conservative Coalition controls both the House and the Senate. If we move the Party towards conservative positions, we can expect an easier time passing Acts there."
 USA_war_preparations_gop:0 "Begin Economic Mobilization"
 USA_war_preparations_gop_desc:0 "Communists and fascists around the world are preparing for war. We don't want to get involved, but perhaps we should start preparing our economy just in case..."
 USA_lower_taxes_landon:0 "Lower Taxes"
 USA_lower_taxes_landon_desc:0 "With reduced spending, we can lower taxes for everyone! The best place for money is our citizens' pockets, after all."
 USA_encourage_employment_creation:0 "Encourage Employment Creation"
 USA_encourage_employment_creation_desc:0 "With so much support given to the private sector, we expect them to create employment and fully reactivate the economy, instead of relying in public works."
 USA_abolish_nd_agencies:0 "Dissolve New Deal Agencies"
 USA_abolish_nd_agencies_desc:0 "If we are going to end the New Deal, the agencies created by Roosevelt, like the AAA or the WPA, are completely useless. We shall dissolve them and save some money."
 USA_cutting_red_tape:0 "Cut Red Tape"
 USA_cutting_red_tape_desc:0 "The New Deal was a bureaucratic mostrosity that had the Government overseeing the economy and controlling it. This is not the American Way: small Government makes us prosperous!"
 USA_freedom_prosperity:0 "With Freedom Comes Prosperity"
 USA_freedom_prosperity_desc:0 "With Freedom for business to grow and hire people, comes benefits for all. A free market, with little regulations, is the key for economic prosperity"
 USA_repeal_social_security:0 "Repeal Social Security"
 USA_repeal_social_security_desc:0 "Social Security is a terrible idea. Making people dependant of the Government is a direct attack to our American values. We need to repeal it as soon as we can."
 
 USA_fdr_reelected:0 "Roosevelt Re-Elected"
 USA_fdr_reelected_desc:0 "As expected, Franklin Delano Roosevelt has managed to win re-election. His New Deal has proved decisive to fix America's economy, and now that he won again we can expand it even further!"
 USA_reorganize_administration:0 "Reorganize the Administration"
 USA_reorganize_administration_desc:0 "Now that we have been re-elected, we can be more ambitious than simply focusing on economics. Our administration could use a reform, so let's start preparing it."
 USA_strengthen_president:0 "Strengthen the President"
 USA_strengthen_president_desc:0 "The planned administrative reform will considerably strenghten the Presidents, being able to reorganize the executive and hire additional staff. With a stronger Presidents, more things will get done."
 USA_brownlown_comittee:0 "The Brownlown Committee"
 USA_brownlown_comittee_desc:0 "The Brownlown committee, led by Louis Borwnlown ( the real name of the committee is President's Committee on Administrative Management ) will guide us through the administrative reform process, suggesting further changes and helping us passing them."
 USA_reorganization_act:0 "Reorganization Act"
 USA_reorganization_act_desc:0 "It is time to collect all proposed administrative changes into one Reorganization Act, that we have to pass through the Congress as soon as possible."
 USA_obey_court:0 "Obey the Supreme Court"
 USA_obey_court_desc:0 "We may not like it but the Supreme Court has to be obeyed. We shall wait until one of its members retires so they stop torpedoing our laws."
 USA_pack_court:0 "Pack the Court"
 USA_pack_court_desc:0 "The Supreme Court is a clear danger to the New Deal, threatening with rolling all of our legislation back! If we can't convince the current Justices, we'll sadly have to pack the Court, adding up to six members, if we want to ensure the Great Depression does not come back. To do that, we shall draft a Judicial Procedures Reform Bill and hope it gets passed."
 begin_pack_chain:0 "§YThe proposed Judicial Procedures Reform Bill will be sent to the House Judiciary Committee.§!"
 USA_continue_new_deal:0 "Continue the New Deal"
 USA_continue_new_deal_desc:0 "American economy is not fixed yet! We have been re-elected with a New Deal platform, let us continue it to fix the economy and deliver our campaign promises."
 USA_secure_funding:0 "Secure Funding for our Agencies"
 USA_secure_funding_desc:0 "We managed to set up a lot of agencies during our first term, and now we have to secure continued funding for them in Congress. It won't be easy, but it is neccesary."
 USA_fight_new_recession:0 "Fight the New Recession"
 USA_fight_new_recession_desc:0 "1937 has come with a new economic recessions that threatens all progress made in the first term. We have to fight it decisively before it becomes a bigger problem."
 USA_eradicate_slums:0 "Eradicate Slums"
 USA_eradicate_slums_desc:0 "It is time to pass a comprehensive Housing Act that ends the slums problem and gives every American a home for his family."
 USA_restore_aaa:0 "Protect the Farmers"
 USA_restore_aaa_desc:0 "The Supreme Court had the stupid idea of killing the Agricultural Adjustment Act, nullifying all progress made in that field. It doesn't matter, we'll just pass another AAA."
 USA_abandon_fiscal:0 "Abandon Fiscal Conservatism"
 USA_abandon_fiscal_desc:0 "New times require new policies. We cannot stick with the no-debt policy that we have been supporting, it is time to allow some deficit in the Federal Budget. Congress won't like that, though."
 USA_fair_labor:0 "Protect the Workers"
 USA_fair_labor_desc:0 "The last major step of the New Deal should be ensuring that economic recovery can be felt by the workers. We shall continue improving their rights, building from the National Labor-Relations Act to pass a new Fair Labor-Standards Act!"
 USA_loans_to_private:0 "Loans to Private Industries"
 USA_loans_to_private_desc:0 "Now that we can use more money, we can ensure the private sectors continues the economic recovery with some loans."
 USA_begin_economic_mob:0 "Begin to Mobilize the Economy"
 USA_begin_economic_mob_desc:0 "The world is preparing for a war, and we should begin to do so as well. We can't be unprepared."
 
 USA_fdr_third_term:0 "A Third Roosevelt Term"
 USA_fdr_third_term_desc:0 "Franklin Delano Roosevelt has managed to win a third term as President! The first man to accomplish such a thing in America's history, he will now continue his policies."
 USA_war_is_coming:0 "War Preparations"
 USA_war_is_coming_desc:0 "We can't focus in internal politics now that the world is fighting. We have to dedicate our efforts to prepare for the inevitable war."
 USA_office_prod:0 "Office of Production Management"
 USA_office_prod_desc:0 "The Office of Production Management will centralize direction of federal procurement programs and our quasi-war production."
 USA_four_freedoms:0 "Four Freedoms"
 USA_four_freedoms_desc:0 "Freedom is not something we should keep for ourselves. Every person in the world has the right to enjoy Four basic Freedoms, outlined in the President's most recent speech: worship, speech, freedom from want, and freedom from fear."
 USA_supply_prior:0 "Supply Priorities and Allocation Board"
 USA_supply_prior_desc:0 "Created with an Executive Order, the purpose of the Supply Priorities and Allocation Board is to coordinate the distribution of materials and commodities related to national defense and to assist the Office of Production Management in carrying out their overlapping duties."
 USA_second_bill_rights:0 "Second Bill of Rights"
 USA_second_bill_rights_desc:0 "Now that we have won a third term, we can continue the New Deal by guaranteeing some fundamental rights to the people, like employment, welfare and food on the table. This Second Bill of Rights will consume our political efforts, but the lives of the people will vastly improve."
 USA_opa:0 "Office of Price Administration"
 USA_opa_desc:0 "In order to control prices and fight against inflation, the Office of Price Administration shall be created with an executive order!"
 USA_towards_war_eco:0 "Towards a War Economy"
 USA_towards_war_eco_desc:0 "We need to increase our military production quickly. Although this will be costly, it will greatly help with unemployment."
 USA_initiate_war_bonds:0 "Initiate the War Bonds Program"
 USA_initiate_war_bonds_desc:0 "As we approach war, we need to start selling War Bonds to the people in order to finance our massive expenses."
 
