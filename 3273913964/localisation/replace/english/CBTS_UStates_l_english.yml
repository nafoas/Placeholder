 unitedstates.156.d:0 "The day has finally arrived. The winner of the last Presidential Election, [USA_d_nominee_eight], has been sworn in as President this morning in Washington DC. In a short speech, he has outlined the main points of his program in front of an energized crowd."
 unitedstates.156.a:0 "How exciting!"
