 usa_dust_bowl1:0 "The Dust Bowl"
 usa_dust_bowl1_desc:0 "Severe dust storms have caused great damage in the Great Plains. The drought and the erosion created by the storms have caused severe effects, not only on the enviroment but also on the people, with migrations and famine becoming widespread."
