 us_election_is_done:0 "The Election is over"
 unitedstates.221.t:0 "The Campaign Season begins!"
 unitedstates.221.d:0 "September is here, and with it, the traditional start of the Presidential Election camapaigns. With 4 main candidates, this campaign is likely going to be fierce, so we must stand ready. Republicans, New Dealers and Longists are going to come after us hard, but hopefully they get distracted fighting each other... In any case, it is time to hit the trail!"
 unitedstates.221.a:0 "Here we go!"
 unitedstates.222.t:0 "The Democratic Campaign"
 unitedstates.222.d:0 "As the campaign progresses, it is time to review our strategy and plan our message for the next days. What do we want to transmit to the electorate?"
 unitedstates.222.a:0 "Focus on defending our Administration's record"
 unitedstates.222.b:0 "Focus on attacking the Republicans"
 unitedstates.222.c:0 "Focus on attacking the New Dealers"
 unitedstates.222.e:0 "Focus on attacking the Longists"
 
 unitedstates.223.t:0 "1936 Presidential Election"
 unitedstates.223.d:0 "Today, voters head to the polls to finally chooose the next President of the United States. The incumbent, the Democrat John Nance Garner, faces a grim re-election prospect, with 3 challengers threatening his position. William E. Borah, the Republican candidate, Joseph T. Robinson, the NDP candidate, and finally Huey Long, the SoWP candidate, have all a decent shot at winning the election if they are lucky enough in some crucial states... Who will win?"
