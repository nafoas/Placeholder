 unitedstates.0.t:0 "The United States in 1933"
 unitedstates.0.d:0 "The Land of the Free is not going through good times in 1933. After joining the Great War with seemingly no gain, the Roaring Twenties came, signaling an era of prosperity that saw America become the largest economy, and leader in sectors such as the automobile one. It also saw the implementation of prohibition, something that has caused an explosion of organized crime through the country. This prosperous time abruptly ended on October 1929, when the New York Stock Market crashed and sent the USA ( and the world ) into a hard economic crisis.\n\n Current president Herbert Hoover, elected in 1928, has been completely unable to fix the Depression, allowing unemployment to rise to more than 25%, and failing at saving the banking sector. His rival in the last election, the Democratic Governor of New York, Franklin Delano Roosevelt, managed to convice both Democratic Conservatives and Progressives to support his New Deal, an economic program he has designed to fix the Depression. The result was Roosevelt crushing victory in the elections held two months ago, in november of 1932. Now Hoover and his VP Charles Curtis sit in the White House until Inauguration Day, March the 4th.\n\n The election of Roosevelt represents a new light of hope in a country battered by poverty and pesimism. Will Roosevelt succeed? Or maybe is other President the one that will fix the crisis? Or will America stand on her knees forever? That is yet to be seen...."
 unitedstates.0.a:0 "God Bless America!" 
 unitedstates.1000.t:0 "New England under 15 feet of Water!"
 unitedstates.1000.d:0 "The Washington Branch of the United States Weather Bureau has completely failed in detecting an utterly massive hurricane that has now obliterated the coast, costing the state $620 million. With winds of 120 mph recorded in the Empire State, a question has been raised about the work ethic of the US Weather Bureau."
 unitedstates.1000.a:0 "What? Investigate the Bureau and help those victimized."
 unitedstates.2.t:0 "Inauguration of Franklin Delano Roosevelt" 
 unitedstates.2.d:0 "Today is the Inauguration of Franklin Delano Roosevelt after a long winter. Former Governor of New York, he contracted polio in 1921, an illness that paralyzed his legs and prevents him to walk unaided. Despite this, he won last year's election in November in a landslide, with his New Deal program promising to fix the horrors of the Great Depression. The new Democratic administration will get hard to work as soon as possible." 
 unitedstates.2.a:0 "I, Franklin Delano Roosevelt..." 
 unitedstates.1.t:0 "Independence Day Celebrations" 
 unitedstates.1.d:0 "Today, this Great Experiment ages one more year, one more example on how Liberty will triumph over the evils of Autocracy. Today marks the anniversary in which our Founding Fathers proclaimed to the world, The First Nation to be birthed with the sole intention to provide Liberty to the people." 
 unitedstates.1.a:0 "Democracy now, Democracy Forever!" 
 unitedstates.3.t:0 "Unemployment goes down"
 unitedstates.3.d:0 "Good news! Our unemployment rate has fallen below the dreaded 25% as thousands of Americans find employment. It seems our economic reforms are doing a good job at fighting the crisis."
 unitedstates.3.a:0 "That's great!"
 unitedstates.4.d:0 "Our unemployment rate keeps going down, falling under 20% as millions of Americans become employed. This great news not only for our administration, but also for the American people, who deserve better lifes."
 unitedstates.4.a:0 "Great news!"
 unitedstates.5.d:0 "After many economic reforms, our unemployment rate has fallen from the catastrophic levels of 25% to the more manageable 15%. While this is still a big number, we have managed to turn around the trend and guarantee the American Dream for millions of families."
 unitedstates.5.a:0 "Perfect!"
 unitedstates.6.t:0 "Crop prices increase"
 unitedstates.6.d:0 "After negotiating production decreases with some farmers, and even burning some crops to lower prices, we have managed to turn around the negative trend, and crop prices are begining to slowly increase."
 unitedstates.6.a:0 "Good"
 unitedstates.7.d:0 "Our economic reforms seem to have increased demand, and that combined with the work of the AAA has managed to increase crop prices."
 unitedstates.7.a:0 "Great!"
 unitedstates.8.d:0 "After months of increasing trend, crop prices seem to have reached manageable levels, and production can begin increasing again. The crisis in the countryside is not over, but it has been mitigated successfully."
 unitedstates.8.a:0 "That's good!"
 unitedstates.9.t:0 "Construction of the Golden Gate begins"
 unitedstates.9.d:0 "Today begins the construction of the Golden Gate, a bridge connecting San Francisco to Marin County, in California. The design of the bridge has been done by Joseph Strauss, an American engineer of German descent. Although the cost of the construction is projected to be 27 million dollars, it will greatly help the city of San Francisco and its inhabitants, as the ferry service is quite outdated."
 unitedstates.9.a:0 "Good luck!"
 unitedstates.10.t:0 "The Twentieth Amendment Passes"
 unitedstates.10.d:0 "Traditionally, new presidents have been inaugurated on March 4, as stated in the Articles of Confederation of 1788. However, as elections are always held in November, the result is a 4 month lame duck period, which is rather odd. To solve this, Congress proposed last year to move the Inauguration Day a bit closer to the elections, to January 20. Today Missouri has finally ratified the Amendment, reaching the required states to approve the Amendment. Thus Roosevelt will be the last president to take office in March."
 unitedstates.10.a:0 "It was necessary"
 unitedstates.11.t:0 "Assassination attempt on Franklin Delano Roosevelt!"
 unitedstates.11.d:0 "Worrying news! President-Elect Franklin Delano Roosevelt has been attacked by Giuseppe Zangara, a naturalized American born in Italy, while he was delivering a speech in Miami, Florida. Many people have been injured by the attack, such as Anton Cermak, mayor of Chicago. However, everyone was concerned about the President-Elect, who, as it turned out..."
 unitedstates.11.a:0 "Roosevelt managed to evade Zangara's bullets"
 unitedstates.11.b:0 "Roosevelt lies dead, with a bullet on his chest!"
 unitedstates.12.t:0 "The Blaine Act"
 unitedstates.12.d:0 "After many filibuster attempts and threats of vetoing by President Hoover, the Blaine Act has finally passed, signaling the begining of the end of Prohibition. The act itself is a resolution that proposes a 21st Amendment that would repeal the 18th Amendment, the one that bans all alcoholic beverages. "
 unitedstates.12.a:0 "Prohibition has its days numbered"
 unitedstates.13.t:0 "The Emergency Banking Act"
 unitedstates.13.d:0 "After the bank holiday imposed by the president after Inauguration Day, and with a strong sense of urgency, both the House and the Senate have approved the Emergency Banking Act. This law allows the twelve Federal Reserve Banks to issue additional currency on good assets, so that reopening banks after the forced holiday can meet their needs. This measure will hopefully help stabilize the banks and end the bank runs that have plagued us since the Depression began."
 unitedstates.13.a:0 "We need a strong banking sector"
 unitedstates.14.t:0 "The Economy Act"
 unitedstates.14.d:0 "One of our campaign promises was to balance the Federal budget, and the Economy Act is an effort in that direction. 500 million dollars of the Federal Budget have been cut, including a 50% reduction of veteran pensions and wage cuts for most Federal workers ( including members of Congress ). The Act has faced stiff opposition in Congress, as many still remembered the Bonus March of last year. However, we have managed to pass it through, and the Federal budget is now more balanced."
 unitedstates.14.a:0 "Sacrifices are necessary"
 unitedstates.15.t:0 "The Civilian Conservation Corps Act"
 unitedstates.15.d:0 "The just approved Civilian Conservation Corps Reforestation Relief Act will establish a new government agency called the Civilian Conservation Corps. This new agency has three purposes: give employment, food and shelter to unemployed Americans, employ reserve officers ( who will run the work camps ) and conservation and development of natural resources and lands owned by the Federal government. Already tried by the president when he was governor of New York, and supported by figures like Huey Long, the CCC will surely tackle unemployment."
 unitedstates.15.a:0 "A good idea"
 unitedstates.16.t:0 "The Emergency Relief Administration"
 unitedstates.16.d:0 "After passing the Federal Emergency Relief Act we can estabilish a new agency: the Emergency Relief Administration. This agency will offer relief and employment to poor people, through three main work areas: adult education, employment for women, and food redistribution to prevent starvation. It will also offer unskilled jobs for desperate people, something that will psychologically help our society and bring back optimism."
 unitedstates.16.a:0 "We need to help the people"
 unitedstates.17.t:0 "The National Industrial Recovery Act"
 unitedstates.17.d:0 "Congress has just passed the National Industrial Recovery Act or NIRA. The act has two parts: the first one is devoted to industrial recovery, authorizing the promulgation of industrial codes of fair competition, guaranteeing trade union rights, permitting the regulation of working standards, and regulating the price of certain refined petroleum products and their transportation. The second part creates a new agency to create employment: the Public Works Administration ( PWA ). In parellel, the President has created the National Recovery Administration with an executive order after passing the NIRA, with the goal of regulating prices and competition."
 unitedstates.17.a:0 "We need a strong industry"
 unitedstates.18.t:0 "The Agricultural Adjustment Act"
 unitedstates.18.d:0 "In order to solve the situation of crop prices, Congress has just passed the Agricultural Adjustment Act or AAA. The act allows the government to, amongst other things, buy livestock or give subsidies to farmers to not plant on their land. To oversee the subsidies, the act also creates the Agricultural Adjustment Administration, replacing the Federal Farm Board. This is the first step in the fight against low crop prices."
 unitedstates.18.a:0 "For our farmers!"
 unitedstates.19.t:0 "The Tennessee Valley Authority Act"
 unitedstates.19.d:0 "Congress has just passed the Tennessee Valley Authority ( TVA ) Act, establishing a new Federally owned corporation to provide economic development to the Tennessee Valley area, one of the most affected by the Great Depression. This act was spearheaded by Senator George W. Norris, a Progressive Republican from Nebraska. The new TVA is expected to give a healthy boost to the economy of the area."
 unitedstates.19.a:0 "We'll set it up as soon as possible"
 unitedstates.20.t:0 "The First Hundred Days are over"
 unitedstates.20.d:0 "After more than 3 months in office, FDR has managed to pass very important legislation through Congress. However, now the sense of urgency has vaned and the New Deal is less popular in the eyes of some politicians. This has led to a loss of support in Congress, which means that we'll have to negotiate harder for the next laws we pass."
 unitedstates.20.a:0 "We'll win them back"
 lose_congress_majority:0 "§RThe majority in Congress will be lost!§!\n"
 unitedstates.21.t:0 "William Woodin Resigns"
 unitedstates.21.d:0 "After less than a year working for us, William Woodin, our Secretary of the Treasury, has resigned due to his poor health condition. President Roosevelt has decided to appoint a strict monetarist, Henry Morgenthau, as new Secretary of the Treasury."
 unitedstates.21.a:0 "We wish him well"
 unitedstates.22.t:0 "21st Amendment Ratified"
 unitedstates.22.d:0 "Today, the states of Utah, Ohio and Pennsylvania have ratified the 21st Amendment, reaching the number of states needed for the Amendment to become officially ratified ( 36 ). This is the only Amendment that completely repeals another, the 18th, the one that started prohibition and has brought many problems to the country. Now that Prohibition is fully over, we hope we can leave a lot of problems behind, especially crime-related ones."
 unitedstates.22.a:0 "Let's celebrate with wine!"
 lame_duck_period:0 "Congress is in lame duck period"
 unitedstates.23.t:0 "A Century of Progress"
 unitedstates.23.d:0 "Today marks the opening of the World Fair 'A Century of Progress' in Chicago. The fair focuses on technological innovation and adaptation of mankind to these new times. The fair also celebrates the centennial of Chicago's foundation in 1833. The fair, with its colorful buildings and technological optimism, will surely help alleviate some of the psychological effects of the Great Depression and boost the economy of Chicago."
 unitedstates.23.a:0 "To an even more prosperous century!"
 unitedstates.24.t:0 "Union Station Massacre"
 unitedstates.24.d:0 "Terrible news! After a long shootout at the Union Station railroad depot in Kansas City, four law enforcers and a criminal have been murdered. This terrible act was part of the attempt of a gang led by Vernon Miller to free Frank Nash, a Federal prisioner. The FBI, led by J. Edgar Hoover, has already begun to investigate the crime and catch those who are responsible."
 unitedstates.24.a:0 "Rest in peace..."
 unitedstates.25.t:0 "The Acquisition of Alcatraz"
 unitedstates.25.d:0 "With crime rate increasing all across the county, the Department of Justice has suggested to acquire the island of Alcatraz, near San Francisco, to build a high security prision there. Up to this point, the island has been owned by the US Army, but now it seems like the best place in America to imprision our criminals..."
 unitedstates.25.a:0 "Begin preparing the prision immediately"
 unitedstates.25.b:0 "There's no need for this."
 unitedstates.26.t:0 "Albert Einstein arrives!"
 unitedstates.26.d:0 "After Hitler came into power in Germany, the famed German scientist Albert Eistein, developer of the theory of relativity, knew that his condition of Jewish made returning to Germany impossible. After travelling to Belgium and Britain, he has decided to take a position at the Institute for Advanced Study, settling in our country for now."
 unitedstates.26.a:0 "Welcome!"
 unitedstates.27.t:0 "Tillamook Burn"
 unitedstates.27.d:0 "Terrible news! A wildfire in Oregon, caused by the fall of a steel cable against a dead tree, has burned 350,000 acres (1,400 km2) before it was extingished. The loss in processed luber is estimated to be of 442.4 million dollars, dealing a big blow to the industry and also to our economy. Now it is time for the Civilian Conservation Corps to show its value and restore the forest."
 unitedstates.27.a:0 "Terrible"
 unitedstates.28.t:0 "The Fireside Chats"
 unitedstates.28.d:0 "Today, President Roosevelt has adressed the American people in the first of his 'Fireside Chats'. One of the personal projects of Roosevelt, he already used broadcasts to explain coloquially his agenda to the electorate when he was Governor of New York, and now he has devoted the first 'Fireside Chat' to explain the recently passed Emergency Banking Act. With an audience of more than 60 million people, it has been a clear success."
 unitedstates.28.a:0 "...together, we cannot fail!"
 unitedstates.29.t:0 "The Crime Wave continues"
 unitedstates.29.d:0 "Yesterday the criminals known as 'Machine Gun' Kelly and Albert Bates kidnapped an oil tycoon from Okhlahoma, Charles F. Urshel, demanding a $200,000 ransom. It is clear that Prohibition and the Great Depression have caused our crime rate to skyrocket, and we cannot stay idle."
 unitedstates.29.a:0 "Who thought Prohibition was a good idea!?"
 unitedstates.30.t:0 "Battle in Dexter"
 unitedstates.30.d:0 "Another episode in the current crime wave, there has been a battle between the police and criminal group known as the Barrow Gang in Dexter, Iowa. While the majority of the gang has been killed or arrested by the police, its two more prominent members, Bonnie Parker and Clyde Barrow, have managed to escape."
 unitedstates.30.a:0 "When will this end?"
 unitedstates.31.t:0 "The Glass-Steagall Act"
 unitedstates.31.d:0 "The Banking Act, referred as Glass-Steagall Act as it has been sponsored by Senator Carter Glass (D) from Virginia and Representative Henry B. Steagall (D) of Alabama, has just been passed in Congress. The act creates the Federal Deposit Insurance Corporation, separates commercial from investment banking, creates the Federal Open Market Committee, and has other provisions such as one against banking speculation.It is hoped that the act provides stability to the banking system."
 unitedstates.31.a:0 "Approved"
 unitedstates.32.t:0 "The Securities Exchange Act"
 unitedstates.32.d:0 "Congress has just passed the Securities Exchange Act, regulating the secondary trading of securities ( stocks, bonds and debentures ), and estabilishing the Securities and Exchange Commission to enforce the Federal securities law. The act also containst extensive anti-fraud provisions and regulates the physical place were stocks can be exchanged."
 unitedstates.32.a:0 "Approved"
 unitedstates.33.t:0 "Huey Long breaks with the President"
 unitedstates.33.d:0 "Huey Long, senator from Louisiana and an influential demagogue, has declared the end of his support for Roosevelt, as he thinks his New Deal is turning out to be too moderate and doesn't offer the radical wealth redistribution he thought it would give. The President is not very happy with him either, as he stated that Long, along with General Douglas MacArthur, \"are one of the two most dangerous men for America\". His reasoning for this is easy to think off: Long ran Louisiana in a nearly-dictatorial way and had links with the mafia when he was the Governor of the state, and MacArthur led the very unpopular and controversial suppression of the \"Bonus Army\" demostrators in 1932. Anyways, with Long leaving we have lost a little support in the Senate."
 unitedstates.33.a:0 "Demagogues and Populists are not welcome here!"
 unitedstates.33.b:0 "Perhaps we should invite him to the White House to talk?"
 unitedstates.34.t:0 "The National Labor-Relations Act"
 unitedstates.34.d:0 "With the bitter opposition of the Republican Party and other Conservative groups, Congress has just passed the National Labor-Relations Act, also known as Wagner Act. The Act is a very important step forward in the field of workers' rights, as it grants them the right to unionize, use collective bargaining and call strikes. To prosecute possible violations of the law, the Act also creates the National Labor Relations Board and bans certain labor practices branded as 'unfair'. The Act has passed with overwhelming support within labor groups, and will hopefully help the average American."
 unitedstates.34.a:0 "For the American Worker!"

 unitedstates.35.t:0 "John Dilinger escapes from prision!"
 unitedstates.35.d:0 "The crime wave continues! After we captured bank robber John Dilinger in Tucson, Arizona, he was sent to a prision in Crown Point, Indiana. We have just received news that he has escaped using a wooden pistol. Now it is is expected that he and his group, the Dilinger Gang, will continue their crimes, unless we manage to stop him. The question is: how?"
 unitedstates.35.a:0 "Prepare an FBI operation"
 unitedstates.35.b:0 "Offer a reward for him"
 unitedstates.36.t:0 "John Dilinger evades FBI ambush!"
 unitedstates.36.d:0 "Bad news! The ambush the FBI prepared, in northern Wisconsin, to capture the criminal John Dilinger, has failed. We'll have to think a new strategy to get him..."
 unitedstates.36.a:0 "Offer a reward then!"
 unitedstates.37.t:0 "John Dilinger killed!"
 unitedstates.37.d:0 "Good news! After we offered a reward for John Dilinger, a Romanian inmigrant close to his circle, Ana Cumpanas, has betrayed Dilinger and offered information to the FBI about his whereabouts. He was subsequently intercepted and gunned down by the FBI in Chicago. This is a great victory against crime."
 unitedstates.37.a:0 "Law will defeat criminals!"
 unitedstates.38.t:0 "Bonnie and Clyde"
 unitedstates.38.d:0 "The criminals Bonnie Parker and Clyde Barrow have been a target for public attention for some time now, and with their latest crime ( they killed two 2 young highway patrolmen near Grapevine, Texas ) we are more determined to put an end to their robberies and killings. Now we have to decide how do we want to put them down."
 unitedstates.38.a:0 "Prepare an ambush!"
 unitedstates.38.b:0 "Offer a reward for them!"
 unitedstates.39.t:0 "Bonnie and Clyde still free"
 unitedstates.39.d:0 "Our strategy against Bonnie and Clyde has not worked, and they continue to rob banks, killing 2 policemen yesterday in Springhill, Louisiana. Our strategy has failed, so we must try another one."
 unitedstates.39.a:0 "Prepare an ambush then!"
 unitedstates.40.t:0 "Bonnie and Clyde killed"
 unitedstates.40.d:0 "Good news! In an ambush set up by Texas Ranger Frank Hammer, Bonnie Parker and Clyde Barrow have been shot around 50 times each, ending another crime gang and solving a persistent problem. Their tragic story of love, robberies and violence ends now."
 unitedstates.40.a:0 "Law has been enforced!"
 
 unitedstates.41.t:0 "The Dust Bowl"
 unitedstates.41.d:0 "While this is not a new problem, a particularily destructive 2-days storm has removed massive amounts of topsoil in the Great Plains in the worst storm to date. It seems that this wave of dust storm, the 'Dust Bowl' as it is called, will need a government response before it causes too much damage."
 unitedstates.41.a:0 "We did not need this!"
 unitedstates.42.t:0 "The American Liberty League"
 unitedstates.42.d:0 "Today, a group of Democrats hostile to President Roosevelt have formed the American Liberty League, with the goal of stopping the New Deal. Formed by Democratic politicians and wealthy industrialists, it won't be very effective... for now."
 unitedstates.42.a:0 "Nothing to worry about"
 unitedstates.43.t:0 "The Midterms are approaching"
 unitedstates.43.d:0 "The [GetYear] midterm elections are approaching, and it is a big opportunity to maintain our Congress support or even pick up a few seats. Many governorships are also up for grabs, and we shouldn't waste this opportunity to expand our institutional power. To accomplish all of this, we have to decide how do we want to manage our campaign."
 unitedstates.43.a:0 "The President shall fully involve himself in the campaign!"
 full_campaign_intervention:0 "§YFails and successes of our Administration will have a BIG impact on the Midterm Election results!§!"
 unitedstates.43.b:0 "Some limited endorsements and speeches should be enough."
 partial_campaign_intervention:0 "§YFails and successes of our Administration will have a MEDIUM impact on the Midterm Election results!§!"
 unitedstates.43.c:0 "We shall stay out of the campaign."
 no_campaign_intervention:0 "§YFails and successes of our Administration will have a SMALL impact on the Midterm Election results!§!"
 
 unitedstates.44.t:0 "1934 Midterm Election" 
 unitedstates.44.d:0 "Today the American people go to the polls to renovate the House of Representatives, a third of the Senate and most Governorships. While normally the party of the president takes a hit on the midterms, some party members believe the FDR's popularity will help us secure a lot of seats and governorships. The American people has to decide..."
 unitedstates.44.a:0 "And the results are..."
 unitedstates.45.t:0 "Landslide Victory in the Midterms!"
 unitedstates.45.d:0 "Great news! Our party has managed to retain all of their seats in the House and the Senate, and in turn we managed to pick up a lot of seats, especially in New England and the Steel Belt. This strengthens our hold in Congress and revalidates the mandate President Roosevelt got in 1932."
 unitedstates.45.a:0 "The people have spoken!"
 unitedstates.46.t:0 "Victory in the Midterms!"
 unitedstates.46.d:0 "Good news! Our party has managed to retain almost all of our seats, and those that we lost in Michigan and the Midwest have been compesated with big gains in New England. In the Senate, we managed to gain seats on the Steel Belt and New England without losing any senator, while we have compensated the loss of the Governorships of Michigan, Wisconsin and Maryland with our gains in Nevada, Oregon, North Dakota and Pennsylvania. This results clearly show the support of the people for the New Deal..."
 unitedstates.46.a:0 "Great!"
 unitedstates.47.t:0 "Defeat in the Midterms!"
 unitedstates.47.d:0 "Bad news! Our party has lost a lot of contested seats in both the House and the Senate, and the wins in New England have not compensated the losses in the Steel Belt. We also have lost Governorships, like Maryland, Michigan, Connecticut, Nebraska, Wisconsin, New Mexico and Ohio, only compensated by our victories in Nevada, North Dakota, Oregon and Pennsylvania. The American People clearly believe that we are going in the wrong direction."
 unitedstates.47.a:0 "We have to change our policies then!"
 unitedstates.1000.t:0 "Catastrophic Defeat in the Midterms!"
 unitedstates.1000.d:0 "Terrible news! Our party has not managed to pick up a single seat in both House and Senate election, losing every contested seat and destroying our hold in Congress. We haven't done much better in governor races: we have lost Maryland, Michigan, Wisconsin, Connecticut, Nebraska, New Mexico and Ohio without gaining a single Governorship. We have to radically change our policies or we will have no chances of re-election."
 unitedstates.1000.a:0 "Time to fire some people!"
 
 unitedstates.51.t:0 "It Happened One Night"
 unitedstates.51.d:0 "Frank Capra's It Happened One Night, starring Clark Gable and Claudette Colbert, has been released today. It has become a big hit despite low expectations, and it is set to win the Academy Awards. It is said that, due to Clark Gable showing that he is bare-chested, the sales of men undershirts has decreased considerably."
 unitedstates.51.a:0 "Together for the first time!"
 unitedstates.52.t:0 "West Coast Waterfront Strike"
 unitedstates.52.d:0 "Troubling news arrive from the West Coast as longshoremen and sailors declare a general strike in the port of San Francisco. Clashes between strikebreakers and strikers have caused two deaths, and the strikers refuse to accept the deal we proposed. This incident has increased unionization across the West Coast ports."
 unitedstates.52.a:0 "Those damned Socialists!"
 unitedstates.53.t:0 "North Dakota declares independence?"
 unitedstates.53.d:0 "Some weeks ago, controversial Governor William \"Wild Bill\" Langer was convicted of misappropriating federal resources for political reasons by promoting his political party, the Non-Partisan League, to federal workers in the state capital. Langer was found guilty, a felony; state law required a Governor be removed if convicted of a felony. But Langer continued to perform the duties of governor, until his appeal process was exausted.\nOn July 17th, the state Supreme Court issued a decision that Langer was to be removed from office. Langer stubbornly refused, barracading himself and his most trusted supporters in the governor's offices. On that same evening, he and 26 of his followers signed a \"Declaration of Independence for the State of North Dakota\", and an hour later issued Executive Order No. 10, calling out the National Guard and declaring martial law over the entire state of North Dakota; in an attempt to retain his governorship by force.\nBy the morning of the 18th, however, tempers had cooled. Langer and his staff left the governor's office. Ole Olson, the Deputy Governor, took his position as interim governor and withdrew the order of martial law."
 unitedstates.53.a:0 "Wait, what?"
 unitedstates.54.t:0 "The Air Mail Scandal"
 unitedstates.54.d:0 "Investigation about the air mail contracts has been going for some time now, but latest hearings in Congress are devastating. Allegedly, airlines used the Mail Act passed in 1930 to divide among themselves the air mail routes, with dubious contracts awarded by Postmaster General Walter Folger Brown and William P. MacCracken Jr., who has been convicted of contempt of congress. Due to this informations, the Secretary of War has proposed to transfer air mailing duties to the American Air Corps."
 unitedstates.54.a:0 "The Air Corps shall deliver the mail for now"
 air_mail_tooltip:0 "§YThis will have a big impact on the Air Corps expansion potential!§!"
 usa_air_mail_happened:0 "The American Air Corps took over mailing duties."
 unitedstates.55.t:0 "A new Chief of the Air Corps"
 unitedstates.55.d:0 "Benjamin Foulois has retired due to his inability to perform the mailing duties we assigned to the Corps, and now we must choose a new Chief of the Air Corps. Our staff has narrowed the choice down to two people: Henry Conger Pratt and Oscar Westover. Pratt seems to have the best credentials for the job, however he was a close associate of Foulois and appointing him would be a politically costly move. Alternatively we could appoint Oscar Westover, who is less adequate for the job but has a clean political history."
 unitedstates.55.a:0 "Henry Conger Pratt is the best man for the job!"
 unitedstates.55.b:0 "Oscar Westover is the best choice!"
 unitedstates.56.t:0 "From Hawaii to New York"
 unitedstates.56.d:0 "Today is a great day for aviation, as Amelia Earhart has become the first person to fly solo from Hawaii to New York. We should keep an eye on Earhart, she seems to have a great talent for flying."
 unitedstates.56.a:0 "Congratulations!"
 unitedstates.57.t:0 "The Black Sunday Storm"
 unitedstates.57.d:0 "Bad news! A terrible dust storm has hit eastern New Mexico, Colorado, and western Oklahoma. This is another episode of Dust Bowl, a problem that we must solve if we don't want to face an humanitarian crisis."
 unitedstates.57.a:0 "Send relief!"
 unitedstates.58.t:0 "NIRA found unconstitutional"
 unitedstates.58.d:0 "The Supreme Court finally made their decision on the Schechter Poultry Corp. v. United States case, and it's not good for us. Chief Justice Charles Evans Hughes wrote for a unanimous Court in invalidating the industrial "codes of fair competition" which the NIRA enabled the President to issue. The Court held that the codes violated the constitutional separation of powers as an impermissible delegation of legislative power to the executive branch. The Court also held that the NIRA provisions were in excess of congressional power under the Commerce Clause. Thus the NIRA has been declared unconstitutional and taken down."
 unitedstates.58.a:0 "Terrible!"
 unitedstates.59.t:0 "Huey Long's Grand Filibuster"
 unitedstates.59.d:0 "Senator Huey Long from Louisiana, known for launching hour-long filibusters, theatrical speeches and obstructing bills for weeks, has made today the second longest speech in the history of the Senate.\n\nLong, who is at odds with FDR's New Deal, has fervently opposed the National Recovery Act; so to prevent its passage he employed his usual antics by holding a lone filibuster. For 15 hours and 30 minutes he analyzed every section of the Constitution, a document he claims FDR’s programs had transformed into \"ancient and forgotten lore\". As day turned to night, Long noticed that a good chunk of the room was either asleep or totally zoned out. He then suggested to the Vice President that everyone should be forced to pay attention, but Garner was unmoved, replying, \"That would be unusual cruelty under the Bill of Rights\". The same night, Long started reading recipes for fried oysters and potlikkers. Finally, at 4 a.m., he succumbed to a call of nature and yielded the floor."
 unitedstates.59.a:0 "What a complete idiot"
 unitedstates.60.t:0 "Meeting with Huey Long"
 unitedstates.60.d:0 "Today President Roosevelt met with Long in the White House. He has made utopic demands, threatened the President with splitting the vote, and then offer Roosevelt to join the Share Our Wealth Society. We got nothing out of this meeting, yet some people suggest that we may gain his support if we talk further."
 unitedstates.60.a:0 "I've had enough of this nonsense!"
 unitedstates.60.b:0 "We'll can't give up at the first meeting."
 unitedstates.61.t:0 "Second meeting with Huey Long"
 unitedstates.61.d:0 "Today Roosevelt met with Long again, and it didn't go much better. He toned down his demands, but they are still impossible to deliver, while it is clear that his ambition won't be satisfied with anything we can give. At the end of the meeting, Roosevelt made clear that Long was to be considered an enemy from now on."
 unitedstates.61.a:0 "You can't talk sense into a populist!"
 unitedstates.62.t:0 "The assasination of Huey Long"
 unitedstates.62.d:0 "Two days ago Senator Huey Long went to the Louisiana State Capitol building with the goal of passing a bill that would remove a political oponent of his, Judge Benjamin Henry Pavy. At 9:20 p.m., after passing the bill, he was shot in the torso with a handgun fired by Pavy's son-in-law Carl Weiss, a physician from Baton Rouge. Today Long has finally died after the doctors were unable to save him. While preparations for his funeral are made, we can at least rejoice that the Long problem is no more."
 unitedstates.62.a:0 "The problem solved itself, it seems."
 unitedstates.63.t:0 "The Labor Day Hurricane"
 unitedstates.63.d:0 "Yesterday, a category 5 hurricane made landfall in the Upper Florida Keys killing 423 people. With winds that reached a speed of 185 mph, it is the strongest hurricane that we have ever recorded."
 unitedstates.63.a:0 "Terrible"
 unitedstates.66.t:0 "The Great St. Patrick's Day flood"
 unitedstates.66.d:0 "Yesterday the city of Pittsburgh, Pennsylvania witnessed the worst flood in its history when flood levels peaked at 46 feet (14 m). It has been devastating. About 100,000 buildings have been destroyed and the damage is estimated at about $250 million, with around 69 deaths and 500 injured."
 unitedstates.66.a:0 "We have to help the people"
 unitedstates.64.t:0 "The 1936 Heat Wave"
 unitedstates.64.d:0 "Recent weather reports are more and more worrying as temperatures continue to rise. With lots of places reporting temperatures of more than 100 ºF, the agriculture is beggining to get affected, not to mention all the deaths caused by the extreme heat across the Midwest."
 unitedstates.64.a:0 "Worrying"
 unitedstates.65.t:0 "Gone with the Wind"
 unitedstates.65.d:0 "Today, Margaret Mitchell's historical romance novel Gone with the Wind has been published. The novel, set in Georgia during the Civil War and the Reconstruction Era, tells the story of young Scarlett O'Hara,the spoiled daughter of a well-to-do plantation owner, who was to find a way out of poverty during the destruction caused by Sherman's March to the Sea. Altough the book has an unprecedented high price of 3 dollars, it is quickly becoming a bestseller."
 unitedstates.65.a:0 "Frankly, my dear, I don't give a damn."
 unitedstates.67.t:0 "1936 Republican National Convention"
 unitedstates.67.d:0 "The Republican National Convention was closed today at the Public Auditorium in Cleveland, Ohio. The two main candidates for the Presidential nomination were Alf Landon, a centrist businessman, and William Borah, a progressive senator from Idaho. Landon, with the support of the party, has managed to win the nomination. Newspaper publisher Frank Knox was chosen as his running mate."
 unitedstates.67.a:0 "The Landon-Knox ticket doesn't stand a chance!"
 unitedstates.68.t:0 "1936 Democratic National Convention"
 unitedstates.68.d:0 "The Democratic National Convention is being held these days in Philadelphia, Pennsylvania. As usual, President Roosevelt will seek re-election, and so far nobody has challenged him, so he will likely become the Democratic candidate. Vice-President Garner will also likely become his running mate again."
 unitedstates.68.a:0 "President Roosevelt is renominated by acclamation!"
 landon_rival:0 "§YAlf Landon becomes the Republican candidate for the 1936 Presidential Election!§!"
 fdr_seek_second:0 "§YPresident Roosevelt will seek a second term!§!"
 fdr_serve_second_term:0 "§YDemocratic candidate Franklin Delano Roosevelt will serve a second term as President!§!"
 landon_become_president:0 "§YRepublican candidate Alf Landon will become the 33rd President of the United States of America!§!"
 unitedstates.69.t:0 "Presidential Election of 1936"
 unitedstates.69.d:0 "Today the American people go to vote to renovate a third of the Senate and most importantly, to choose a new President. The incumbent, Roosevelt, is the clear favourite, but if he turns out to be less popular than expected, Landon could have a chance..."
 unitedstates.69.a:0 "Franklin Delano Roosevelt secures a second term by a landslide!"
 unitedstates.69.b:0 "Unexpectedly, Landon manages to win the election!"
 fdr_begin_second_term:0 "§YFranklin Delano Roosevelt will begin his second term, with a new focus tree!§!\n"
 unitedstates.70.t:0 "Inauguration Day"
 unitedstates.70.d:0 "Today, 2 months after the election, Chief Justice Charles Evans Hughes has sworn in Franklin Delano Roosevelt, the previous President and the winner of the Election, as President. This is the first Inauguration that happens on January 20th, as per the Twentieth Amendment passed 3 years ago. Roosevelt will likely try to continue the New Deal and tackle the growing problem that the Supreme Court poses for his legislation."
 unitedstates.70.a:0 "Let's get back to work!"
 unitedstates.71.t:0 "The House Judiciary Committee blocks the bill!"
 unitedstates.71.d:0 "Bad news! The chairman of the House Judiciary Committe, Hatton W. Sumners, a Democratic Texan, has decided to oppose the Judicial Procedures Reform Bill, thus blocking it. He wants us to drop the expansion of the Sumpreme Court, or Court-Packing, which is the main point of the bill. We can try to get the bill passed in the Senate, but maybe it is best to just leave it and drop the Court expansion."
 unitedstates.71.a:0 "We shall go to the Senate!"
 unitedstates.71.b:0 "Drop the Supreme Court Expansion"
 usa_disabled_court_chance:0 "§GNegative Supreme Court events will be disabled§!"
 usa_reduced_court_chance:0 "§GChance to get negative Supreme Court events will be significantly reduced§!"
 unitedstates.72.t:0 "Senate Judiciary committee hearings"
 unitedstates.72.d:0 "Today the administration begins to make its ( our ) case for the proposed bill. Attorney General Cummings' testimony has been grounded in four main points: the reckless use of injunctions by the courts to pre-empt the operation of New Deal legislation;aged and infirm judges who declined to retire; crowded dockets at all levels of the federal court system; and the need for a reform which would infuse 'new blood' in the federal court system. Further administration witnesses have testified before the committee, and now we must make an important strategic decision. Shall we stop sending witnesses, fastening the procedures, or shall we continue, to make our case stronger?"
 unitedstates.72.a:0 "Enough witnesses have been heard!"
 unitedstates.72.b:0 "Continue sending witnesses"
 unitedstates.73.t:0 "The Opposition makes its case"
 unitedstates.73.d:0 "It is time for the Judicial Procedures Reform Bill's opponents to make their case before the Senate Judiciary committee.  Of note for the opposition was the testimony of Harvard University law professor Erwin Griswold. Specifically attacked by Griswold's testimony was the claim made by the administration that Roosevelt's court expansion plan had precedent in U.S. history and law. While it was true the size of the Supreme Court had been expanded since the founding in 1789, it had never been done for reasons similar to Roosevelt's. With these claims, public opinion has shifted considerably against our proposal."
 unitedstates.73.a:0 "Damn"
 unitedstates.74.t:0 "Van Davanter retires"
 unitedstates.74.d:0 " Associate Justice Willis Van Devanter has announced his intent of retiring soon. This forces the President to make a decision. He had promised the job to Senate Majority Leader Joseph T. Robinson, but appointing him would kill the chances of the Judicial Procedures Reform Bill of passing in the Senate, as we need him to get the votes and also it would go against our complaints that the judges of the Supreme Court are too old ( Robinson is 65 ). We can appoint Robinson and have a slightly more friendly Court, or delay the decision and keep pushing our bill."
 unitedstates.74.a:0 "Appoint Robinson as promised"
 unitedstates.74.b:0 "Delay the decision for now"
 unitedstates.75.t:0 "Securing a majority"
 unitedstates.75.d:0 "The Judicial Procedures Reform Bill has been put up to debate in the Senate, and we need to convince enough Senators to pass it through. There's only one man that can deliver the votes: Senate Majority Leader Joseph T. Robinson. He may be able to secure a majority with hard negotiations with the Senators, however that would entail a lot of mental effort and his health is a concern. Alternatively, we can rely on other people, although that means less votes."
 unitedstates.75.a:0 "Joseph T. Robinson is our man!"
 unitedstates.75.b:0 "We can't entrust this bill in one man's health!"
 unitedstates.76.t:0 "The Hatch-Logan Amendment"
 unitedstates.76.d:0 "In order to convince Senators to pass our bill, Robinson has devised the Hatch-Logan Amendment. This would change a few small things: the age limit for appointing a new coadjutor is increased to 75, and these appointments would be limited in one per calendar year. Shall we propose the amendment?"
 unitedstates.76.a:0 "Anything to get it passed!"
 unitedstates.76.b:0 "Useless..."
 unitedstates.77.t:0 "Robinson found dead!"
 unitedstates.77.d:0 "Terrible news! Our Senate Majority Leader Joseph T. Robinson has been found dead by his housemaid, apparently due to a heart attack. His health was fragile, and the effort of trying to get the votes for the Judicial Procedures Reform Bill has been the final nail in the coffin. Without him, the bill's chances to get passed are almost zero."
 unitedstates.77.a:0 "The bill dies with him"
 unitedstates.78.t:0 "The Senate votes on the bill"
 unitedstates.78.d:0 "Today is the big day. The Senate is ready to vote wether the Judicial Procedures Reform Bill is passed or sent back to the Senate Judiciary committee, which would kill it. One by one, the Senators vote, and the result is..."
 unitedstates.78.a:0 "The bill is passed!"
 unitedstates.78.b:0 "The bill is rejected!"
 unitedstates.79.t:0 "A new recession?"
 unitedstates.79.d:0 "While economy remained in a continious upward trend during the last four years, the economy has entered in a recession cycle again. While we still don't know the causes, we must be prepared for it and mitigate it before it turns into something more serious."
 unitedstates.79.a:0 "But we were progressing so much..."
 unitedstates.81.t:0 "Unemployment increases in the manufactoring sector!"
 unitedstates.81.d:0 "Bad news! Unemployment had remained going down since we took office, but the recession has caused workers in the manufactoring sector to be laid off, increasing unemployment again. Although it remains smaller than in 1933, we must tackle this soon."
 unitedstates.81.a:0 "Again?"
 unitedstates.80.t:0 "Manufactoring output falls!"
 unitedstates.80.d:0 "The bad news continue to arrive, as manufactoring output has fallen a whooping 37%, as in 1934. This had a cascading effect throught the economy, with personal income lowering, leading to less consumption and further reductions in manufactoring output. We have to take action now!"
 unitedstates.80.a:0 "Time to fix this!"
 can_fix_late_recession:0 "§GYou can begin to fix the effects of the 1937 Recession!§!"
 usa_can_fix_recession:0 "The 1937 Recession has happened"
 unitedstates.82.t:0 "AAA found uncostitutional!"
 unitedstates.82.d:0 "The verdict of the United States v. Butler is here and it couldn't be worse. The issue was caused by the money given to the farmers so the downsized their production, rising crop prices. The special processing tax and the use of Congress' Taxing and Spending power in order to finance this has caused this 6-3 ruling of the Supreme Court, killing the AAA and setting us back in the field of agrarian economy."
 unitedstates.82.a:0 "Are you serious!?"
 unitedstates.83.t:0 "NLRA found constitutional!"
 unitedstates.83.d:0 "Finally some good news come from the Supreme Court, as the National Labor Relations Act has been found constitutional in the National Labor Relations Board v Jones & Laughlin Steel Corporation case. It all began when the Board ordered Jones & Laughlin Steel to rehire workers that were fired because of unionizing. Jones & Laughlin Steel appealed to the Supreme Court, deeming the NLRA as unconstitutional, but they have been defeated in a 5-4 vote. The changes in the interpretation of the Commerce Clause could also favor us in the future."
 unitedstates.83.a:0 "Phew!"
 unitedstates.84.t:0 "Opening of the Golden Gate"
 unitedstates.84.d:0 "Today the Golden Gate has been finally opened to pedestrian traffic, with vehicles expected to cross the bridge tomorrow. Construction of the bridge began in 1933, and it has costed by 35 million dollars. However, it is currently the largest suspended bridge in the world, and it will surely help to improve the lives of the inhabitants of San Francisco."
 unitedstates.84.a:0 "Cross the bridge!"
 unitedstates.85.t:0 "Amelia Earhart dissapears"
 unitedstates.85.d:0 "In a tragic day for aviation, the famous pilot Amelia Earhart has dissapeared while she was attempting to become the first woman to fly around the world. Amelia Earhart was a record-breaking woman, becoming, for example, in the first female to fly solo across the Atlantic Ocean."
 unitedstates.85.a:0 "A sad loss"
 unitedstates.86.t:0 "Snow White and the Seven Dwarfs"
 unitedstates.86.d:0 "A revolution arrived today at the cinemas with Snow White and the Seven Dwarfs. It is the first animated cartoon film in sound with color, an artistic revolution that might change entertainment forever, and propel its creator, Walt Disney, to glory."
 unitedstates.86.a:0 "I guess I'm too old to watch it."
 unitedstates.88.t:0 "1938 Midterm Election"
 unitedstates.88.d:0 "Today the American people go to the polls to renovate the House of Representatives, a third of the Senate and most Governorships. We need to hold both houses if we want to continue our legislative agenda, or we might find ourselves without a majority and deadlocked."
 unitedstates.89.d:0 "Great news! We have managed to win a clear victory in both the House and the Senate, securing a majority.  In gubernatorial elections, we have managed to keep all our governorships and gain some like California. It seems that we have the people's trust."
 unitedstates.90.d:0 "Good news! We have managed to solidify our position in the House and the Senate, preserving our majority. In gubernatorial elections, our losses in the Great Plains have been compensated with key wins like California. We can breathe now."
 unitedstates.91.d:0 "Bad news! We have lost seats in both the House and the Senate, with a terrible -72 seat change in the House. In gubernatorial elections, we had catastrophic losses in the Steel Belt and in the Midwest, but we managed to win California. We may have to revise some things..."
 unitedstates.92.d:0 "Terrible news! Our majority in Congress is ancient history after our catastrophic seat losses in both houses. In gubernatorial elections, we lost many governorships across the Steel Belt and the Midwest, without gaining in a single state. We should ensure this never happens again."
 unitedstates.93.t:0 "The National Health Act"
 unitedstates.93.d:0 "Today President [USA.GetLeader] has signed the National Health Act, also dubbed the Wagner Act, into law, after being passed in both the House and the Senate. The Act is revolutionary in many ways, creating federal funding for states to expand public health, maternal and child health services, medical care for the low-income, short-term disability insurance, hospital construction, and prepaid medical insurance. As Senator Wagner mentioned in his speech defending the bill, the National Health Act enables states to use this federal funds to create universal or even mandatory health insurance programs if they choose, with plenty of freedom given to them in the use of this funds to achieve the goals of the Act. The National Health Act faced stiff opposition from the American Medical Association, conservatives, and the business community, but thanks to the President's full support of the bill, support from the American Federation of Labor and some spontaneous mobilizations in favor of the bill, we managed to pass it. The Act serves to fulfill the Right to Health, outlined by President Roosevelt in his Second Bill of Rights."
 unitedstates.93.a:0 "It passed!?"
 unitedstates.94.t:0 "The Equal Opportunity in Education Act"
 unitedstates.94.d:0 "Today President Franklin Delano Roosevelt has signed the Equal Opportunity in Education Act into law, after being passed in both the House and the Senate. The Act is an attempt to solve underfunding of federal schools and to provide equal opportunity to children from low-income families. It grants additional federal funding to all public schools, with a focus on money to provide school books and other material. The Act also has provisions for special funding to schools attended by a high percentage of children from low-income families, various education programs, and special language instruction for children of inmigrants and limited English proficient. Regarding higher education, the Act includes massive increases in federal funding for scholarships, universities, and also granting loans to students with low interests rates. The goal of the Act is to ensure equal opportunity by shortening the achievement gap between the rich and the poor in the education field, and to fulfill the Right to Education, outlined by President Roosevelt in his Second Bill of Rights."
 unitedstates.94.a:0 "Equal opportunity is the basis of freedom!"
 unitedstates.95.t:0 "The Employment Act"
 unitedstates.95.d:0 "Today President Franklin Delano Roosevelt has signed the Employment Act into law, after being passed in both the House and the Senate. The bill is an ambitious declaration of intentions, as it declares the pursuit of full employment as one the Federal Government's full priorities, allowing it to intervene in the economy to reach this goal is necessary. This has caused a fierce opposition to the bill by the business community and the conservatives, asking us to amend the Act to make full employment a general goal and not a priority. Our refusal to amend the bill to please them has payed off, as we finally passed it, fulfilling the Right to Employment, outlined by President Roosevelt in his Second Bill of Rights."
 unitedstates.95.a:0 "Unemployment will soon be a thing from the past!"
 unitedstates.96.t:0 "The Adequate Income Act"
 unitedstates.96.d:0 "Today President Franklin Delano Roosevelt has signed the Adequate Income Act into law, after being passed in both the House and the Senate. The bill is an amendment of the Fair Labor Standards Act, which set the minimum wage for employees engaged in interstate commerce or in the production of goods for interstate commerce at 0.25 dollars per hour. The Adequate Income Act, seeking to follow the Second Bill of Rights proposal, extends this to employees in large retail and service enterprises, local transportation and construction and state and local government employees, while also raising the minimum wage value to 1 dollar per hour, a massive increase of 300%. The Act has faced stiff opposition from the business community, and there were also fears of possible federal overspending, but the President has finally managed, with the support of the unions and the more Progressive New Dealers, to pass the bill. This fulfills ( or at least that's the idea ), the right to earn enough to provide adequate food and clothing and recreation, outlined by President Roosevelt in his Second Bill of Rights."
 unitedstates.96.a:0 "Work to live, not live to work"
 unitedstates.97.t:0 "The National Housing and Urban Planning Act"
 unitedstates.97.d:0 "Today President Franklin Delano Roosevelt has signed the National Housing and Urban Planning Act into law, after being passed in both the House and the Senate. The bill is the final attempt, after the Housing Acts of 1935 and 1938, to solve the housing problem and provide a home for everyone. It grants extensive funding to federal housing programs, while including provisions such as the creation of a special fund to rehabilitate the houses of poor homeowners, the creation of rent subsidies for the elderly and the disabled, or a general urban beautification program. The Act faced complaints concersing the increase of federal spending, however we managed to pass it in both Houses without major incidents. This Act fulfills the Right to Housing, outlined by Presidnet Roosevelt in his Second Bill of Rights."
 unitedstates.97.a:0 "Hopefully the last Housing Act we pass!"
 unitedstates.98.t:0 "Seek a third term?"
 unitedstates.98.d:0 "As the election approaches, President Roosevelt had to make a decision. While the convention set by President Washington is to not serve for more than 2 terms, the world situation is rapidly deteriorating and Roosevelt might be the only man capable of leading the nation through these hard times. He is also popular, so we might win the re-election. However, it might set a dangerous precendent..."
 unitedstates.98.a:0 "Run again"
 unitedstates.98.b:0 "Respect tradition and don't run"
 unitedstates.99.t:0 "Democratic National Convention"
 unitedstates.99.d:0 "Today the DNC is being held in Chicago, and the delegates must choose a presidential candidate for the Election. Who shall take the nomination?"
 unitedstates.99.a:0 "Franklin Delano Roosevelt (NY)"
 unitedstates.99.b:0 "John N. Garner (TX)"
 unitedstates.99.c:0 "James A. Farley (NY)"
 unitedstates.99.e:0 "Cordell Hull (TN)"
 unitedstates.99.f:0 "Huey P. Long (LA)"
 unitedstates.100.t:0 "The Vice-Presidential Nomination"
 unitedstates.100.d:0 "We have a chosen our Presidential candidate for the Election, and now we must pick his running mate. We have some quite interesting options on the table.."
 unitedstates.100.a:0 "Henry A. Wallace (IA)"
 unitedstates.100.b:0 "James F. Byrnes (SC)"
 unitedstates.100.c:0 "Paul V. McNutt (IN)"
 unitedstates.100.w:0 "William B. Bankhead (AL)"
 unitedstates.101.t:0 "Republican National Convention"
 unitedstates.101.willkie.d:0 "Today the Republican Party held their National Convention in Philadelphia, where they chose their candidates for the upcoming Presidential Election. They nominated corporate executive Wendell Willkie for the Presidential race, with Senate Minority Leader Charles McNary as his running mate. They form a moderately progressive ticket, with Willkie pledging to keep many New Deal programs, expand Social Security and enact big-business policies. As the only interventionist republican candidate in the race, he supports aiding the europeans in their war.\n\nWillkie a former Democratic politician that switched sides because of the \"Anti-business\" policies of Roosevelt (as he characterizes it: \"I did not leave my party. My party left me\"), has become a charismatic \"champion of freedom\" that enjoys a lot of support from the electorate; despite criticism from his own party's big bosses who mock him as \"a simple, barefoot Wall Street lawyer\". He could be a serious competitor if he does a good campaign."
 unitedstates.101.dewey.d:0 "Today the Republican Party held their National Convention in Philadelphia, where they chose their candidates for the upcoming Presidential Election. They nominated Manhattan District Attorney Thomas E. Dewey for the presidential race, with Ohio Governor John W. Bricker as his running mate. He is one of the youngest candidates ever to run as president, being 38 years old. As the leader of the moderate Republicans and virulent insolationist, he campaigns for a smaller government, against the New Deal and mantaining the United States in its international insolation."
 unitedstates.101.a:0 "They don't stand a chance!"
 unitedstates.102.t:0 "1940 Presidential Election"
 unitedstates.102.d:0 "The big day is here, and Americans must choose who will lead the nation the next four years. As the polling stations close and the votes are counted, a clear winner emerges..."
 unitedstates.102.a:0 "[USA_d_nominee_forty] (D)"
 unitedstates.102.b:0 "[USA_rep_nominee_forty] (R)"
 unitedstates.103.t:0 "Inauguration of [USA_d_nominee_forty]"
 unitedstates.103.d:0 "Today is a big day, as the winner of the last Presidential Election, [USA_d_nominee_forty], has been sworn in as President by Chief Justice Charles Evans Hughes. He has used this opportunity to deliver a speech to his supporters congregated in Washington DC, where he outlined the main points of his agenda."
 unitedstates.103.a:0 "Let's begin!" 
 
 unitedstates.104.t:0 "Mobilization of the Economy"
 unitedstates.104.d:0 "Positive news arrive from the industrial sector, as the war has driven up output and employment numbers. The effects of the Great Depression are begining to fade away as we transition towards a fully mobilized economy."
 unitedstates.104.a:0 "Great!"
 unitedstates.106.t:0 "Economic Crash!"
 unitedstates.106.d:0 "Our economic analyists warned us that we were not ready for war, but we decided to ignore them and the result is here. Lack of investment towards the war industry has exacerbated the crisis on the arms sector, while the war and the increased caution of the consumers has greatly reduced demand in the manufactoring sector, lowering prices and increasing unemployment. As workers are laid off, our economy, who was barely recovering from the Great Depression, has crashed again, in a pretty bad time."
 unitedstates.106.a:0 "We'll fix it!"
 unitedstates.107.t:0 "The Pacifist Movement"
 unitedstates.107.d:0 "It seems that the war is not a very popular idea, and despite our propaganda efforts, a Pacifist Movement has begun to grow through the nation, denouncing the current administration and even getting some Congressmen and Senators on their side. They have also started doing things like draft dodging or organized boycotts, and they can cause great trouble if they are not put down quickly."
 unitedstates.107.a:0 "We'll find a way to stamp them out!"
 
 unitedstates.108.t:0 "1944 Democratic National Convention"
 unitedstates.108.d:0 "A new Presidential Election is nearing, and we must make some decisions about our political strategy. However, one thing is clear: President Franklin Delano Roosevelt will run again and seek a 4th term as President, an unprecedented thing that sadly had to happen because of the war, and the need of a continued leadership. However, Roosevelt's poor health make his VP choice very important, as he is unlikely to survive his full term..."
 unitedstates.108.a:0 "Let's begin the Vice-Presidential vote then!"
 unitedstates.109.d:0 "A new Presidential Election is nearing, and we must make some decisions about our political strategy. However, one thing is clear, as President [USA.GetLeader] will seek a Second Term as President. The mostly unimportant Vice-Presidential Vote will be the only real election the Democrats will have..."
 unitedstates.109.a:0 "As all Presidents do..."
 unitedstates.110.d:0 "A new Presidential Election is nearing, and President Roosevelt has decided to not seek a 4th term, as that would set a dangerous precendent and there are no immediate threats to the country. Thus the Presidential Nomination is being hotly contested, with James Farley, who ran in 1940, and Harry Truman, a senator from Missouri, seeking to continue Roosevelt's legacy. On the other hand, former Secretary of Agriculture Henry A. Wallace is running on a more leftist platform, seeking to go beyond the New Deal, while Virginia Senator Harry F. Byrd is running on a hardline conservative and pro-segregation platform. Who will win the nomination?"
 unitedstates.110.a:0 "Harry S. Truman (MO)"
 unitedstates.110.b:0 "Henry A. Wallace (IA)"
 unitedstates.110.c:0 "Harry F. Byrd (VA)"
 unitedstates.110.e:0 "James A. Farley (NY)"
 renomination_tooltip:0 "§Y[USA.GetLeader] will seek another term as President!§!"
 truman_nominated_tooltip:0 "§YHarry S. Truman becomes the Democratic candidate for the 1944 Presidential Election!§!"
 wallace_nominated_tooltip:0 "§YHenry A. Wallace becomes the Democratic candidate for the 1944 Presidential Election!§!"
 byrd_nominated_tooltip:0 "§YHarry F. Byrd becomes the Democratic candidate for the 1944 Presidential Election!§!"
 farley_again_nominated_tooltip:0 "§YJames A. Farley becomes the Democratic candidate for the 1944 Presidential Election!§!"
 unitedstates.111.t:0 "The Vice-Presidential nomination"
 unitedstates.111.d:0 "While we are re-nominating our current President, we need to choose his running mate for the coming election. It is an important choice, as if anything happens to the President he will be the one to succeed him in office. So we could keep our 1940 running mate, but there are other ambitious politicans seeking to secure the nomination..."
 unitedstates.111.a:0 "Keep our current Vice President"
 unitedstates.111.b:0 "Harry S. Truman (MO)"
 unitedstates.111.c:0 "Scott W. Lucas (IL)"
 unitedstates.111.e:0 "Alben W. Barkley (KY)"
 unitedstates.112.d:0 "After selecting our candidate for President, we now must select his running mate. There are some interesting options on the table..."
 unitedstates.112.a:0 "Joseph M. Broughton (NC)"
 unitedstates.112.b:0 "William Prentice Cooper (TN)"
 renomination_vp_tooltip:0 "§YOur current VP will be renominated!§!"
 truman_vp_tooltip:0 "§YHarry S. Truman becomes the Democratic Vice-Presidential candidate for the 1944 Presidential Election§!"
