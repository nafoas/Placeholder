 USA_tydings_act:0 "Tydings-McDuffie Act"
 USA_tydings_act_desc:0 "The Tydings–McDuffie Act, officially the Philippine Independence Act, is a United States federal law that specifies a procedural framework for the drafting of a constitution for the government of the Commonwealth of the Philippines within two years of its enactment. The act specifies a number of mandatory constitutional provisions, and requires approval of the constitution by the U.S. President and by Filipinos. The act mandated U.S. recognition of independence of the Philippine Islands as a separate and self-governing nation after a ten-year transition period.\n\nOther provisions in the act are as following: The act allows the U.S to maintain military forces in the Philippines and to call all military forces of the Philippine government into US military service. It empowers the US President, within two years following independence, to negotiate matters relating to US naval reservations and fueling stations of in the Philippine Islands. The act also reclassifies all Filipinos, including those who were living in the United States, as aliens for the purposes of immigration to America; and stablishes a quota of 50 immigrants per year."
