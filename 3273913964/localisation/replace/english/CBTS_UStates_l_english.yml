 unitedstates.158.t:0 "William V. Pratt retires"
 unitedstates.158.d:0 "Our Chief of Naval Operations, William V. Pratt, has reached the end of his career and has retired. The President has already picked a new CNO to replace him, Admiral William H. Standley."
 unitedstates.158.a:0 "We wish him well"
 unitedstates.159.t:0 "Standley retires"
 unitedstates.159.d:0 "Admiral William H. Standley has served as Chief of Naval Operations since he replaced William V. Pratt in 1933, but his time is up. President [USA.GetLeader] has decided to replace him with Admiral William D. Leahy."
 unitedstates.159.a:0 "I see"
 unitedstates.160.t:0 "Admiral Leahy retires"
 unitedstates.160.d:0 "Our Chief of Naval Operations, Fleet Admiral William D. Leahy, has been placed on the retirement list, so now it is time for us to pick a new CNO to replace him. President [USA.GetLeader] has decided that admiral Harold R. Stark is the best man for the job."
 unitedstates.160.a:0 "Let's see how it goes"
 unitedstates.161.t:0 "Replacing the CNO"
 unitedstates.161.d:0 "We have chosen to dismiss our current Chief of Naval Operations, and now we should pick a new one. Lots of options are on the table..."
 unitedstates.161.a:0 "Appoint Ernest J. King!"
 unitedstates.161.b:0 "Appoint Chester W. Nimitz!"
 unitedstates.161.c:0 "Appoint Thomas C. Hart!"
 unitedstates.161.e:0 "Appoint Henry K. Kewitt!"
 unitedstates.161.f:0 "Appoint Louis E. Enfield!"
 unitedstates.161.g:0 "Appoint William Hasley Jr!"
 
 unitedstates.162.t:0 "Charles L. McNary dies"
 unitedstates.162.vp.d:0 "Vice-President Charles McNary has been battling cancer for months, and despite the main brain tumor being extracted in a surgery, it was too late for him. He has died today in Fort Lauderdale, after being comatose for a week. President [USA.GetLeader] has already sent his condolences to his family, but he'll have to work without a VP for the remainder of the term."
 unitedstates.162.other.d:0 "Republican Senator and Senate Minority Leader Charles L. McNary has been battling cancer for months, and despite the main brain tumor being extracted in a surgery, it was too late for him. He has died today in Fort Lauderdale, after being comatose for a week. President [USA.GetLeader] has already sent his condolences to his family."
 unitedstates.162.a:0 "My condolences"
 
 ##########
 unitedstates.165.t:0 "Roosevelt's funeral"
 unitedstates.165.d:0 "After being assassinated in Florida, Franklin Delano Roosevelt was buried today in Hyde Park, New York, in a funeral attended by a massive crowd, along with his running mate and the next President John Nance Garner, and President Hoover. After the funeral, there were some attacks on the Italian-American community of New York, along with a protest against Hoover and the Republicans. Now that Roosevelt is buried, the country wonders what's going to happen next..."
 unitedstates.165.a:0 "A great loss for America"
 
 unitedstates.166.t:0 "A Meeting in Washington"
 unitedstates.166.d:0 "Today, House Speaker and presumptive President John Nance Garner has met with Roosevelt's Brain Trust, along with several Democratic Senators and Representatives. With Roosevelt being gone, disagreements between Garner and the more liberal Democrats are beggining to pose a problem, so they decided to agree on a \"First 100 Days Plan\" that would reactivate the economy as soon as possible. Garner has been forced to concede in most issues, as even he can see how bad the economic situation is, but he has managed to downscale the New Dealer plans somewhat. In any case, this will not be the first time that Garner and the New Dealers clash politically."
 unitedstates.166.a:0 "At least they agreed on something..."
 
 unitedstates.167.t:0 "Inauguration Day"
 unitedstates.167.d:0 "In the middle of a massive economic, social and political crisis, John Nance Garner has been sworn in as the 32nd President of the United States. Less than a month after the assassination of Franklin Delano Roosevelt, this Inauguration leaves many people wondering if Garner, a conservative Democrat, will fulfill FDR's liberal campaign promises, or if he will try to pursue his own economic agenda. One thing is clear: Garner's Presidency will be an uphill one, and only through compromise and determination will America recover."
 unitedstates.167.a:0 "...so help me God!"
 USA_garner_becomes_pres:0 "§GJohn Nance Garner becomes the 32nd President of the United States of America!§!"
 
 unitedstates.168.t:0 "President Garner Addresses the People"
 unitedstates.168.d:0 "\"My fellow Americans, I would like to take this opportunity to speak to you about the current economic and politic crisis we finds ourselves in, after the unfortunate assassination of my friend and colleage Franklin Delano Roosevelt.\" \n\nThose where the first words of President Garner's Radio Adress to the people, in which he talked about Roosevelt's death, the political situation, and his vision for America. He promised to improve the lives of the average American (\"As that's what Roosevelt fought for\") and urged all patriotic Americans to stand united behind his administration. Despite Garner's reservations about holding it in the first place, the speech as been generally well-received, although if it is not accompanied by actual policies it will have little effect..."
 unitedstates.168.a:0 "Together, we cannot fail!"
 
 unitedstates.169.t:0 "The National Economic Relief Act"
 unitedstates.169.d:0 "Today the National Economic Relief Act (NERA) has been signed by President Garner after being passed in both houses of Congress. The Act, supported reluctantly by the Garner administration, grants additional funds to impoverished areas, managed by the states. The goal is to use those funds to combat bad health conditions, lack of housing, and slums in general. Although New Dealers wanted something more ambitious, they have finally agreed to the final text and voted for it."
 unitedstates.169.a:0 "We need to deal with the slums!"
 
 unitedstates.170.t:0 "The Agricultural Subsidies Act"
 unitedstates.170.d:0 "Today the Agricultural Subsidies Act (ASA) has been signed by President John Nance Garner after being passed in both the House and the Senate. The Act intends to fix the crop price problem through a subsidy program that will compensate the farmers for the difference between the production cost and the prices; thus protecting the consumers from being affected. Although the Brain Trust would have liked to go farther, this Act is a good first step for the economical recovery in the rural areas."
 unitedstates.170.a:0 "A badly needed measure"
 
 unitedstates.171.t:0 "The Public Works Act"
 unitedstates.171.d:0 "Proposed by Garner during Hoover's Presidency, a public works program would greatly help with unemployment and social unrest along with the construction of badly needed infrastructure, the experts have advised. Thus the Public Works Act has been signed into law by President Garner after being passed in both houses of Congress. The Act itself creates the Public Works Administration (PWA) that will be the government agency tasked with the coordination and planning of the public works programs. The PWA has received a moderate amount of funding, less that the amount proposed by the New Dealers; we will need to negotiate further on this issue."
 unitedstates.171.a:0 "Let's fight unemployment!"
 
 unitedstates.172.t:0 "A Second National Address"
 unitedstates.172.d:0 "\"My fellow Americans, I would like to speak to you again to talk about the measures Congress is approving. I'm sure that, in these hard times...\" \n\nIn a Second Adress, President Garner has explained the people the new measures that he has been approving, before moving on to detail his vision for the future. Many expect Garner to leave his own views aside and work to fulfill Roosevelt's program, but there also some conservatives that would prefer a different agenda, that moves away from the New Deal. President Garner however, has already made his decision. In the final words of his speech, he promised to..."
 unitedstates.172.a:0 "Realize Roosevelt's vision for a better America!"
 garner_follow_fdr_tt:0 "§YWe follow Roosevelt's New Deal as close as we can, and enact the New Deal ourselves§!"
 garner_follow_fdr:0 "Garner has decided to enact Roosevelt's New Deal"
 unitedstates.172.b:0 "Adapt Roosevelt's program for the current situation!"
 garner_no_follow_fdr_tt:0 "§YWe will move away from Roosevelt and the New Deal, and try to pursue our own economic policy§!"
 garner_no_follow_fdr:0 "Garner has decided to pursue his own agenda"
 
 unitedstates.173.t:0 "Protests against Garner"
 unitedstates.173.d:0 "After hearing that our plans are less ambitious than those that Roosevelt promised, some of the most politically invested citizens have held small protests against our government all across the country, angry at an \"electoral scam\". Although the protests themselves are not worrying, the fact that some Democratic representatives, such as Emanuel Celler (NY-10) or Frank H. Buck (CA-3) have supported the protests threatens party unity and potentially, our Congress Majority if we let these protests continue."
 unitedstates.173.a:0 "Nothing to worry about, yet"
 
 unitedstates.174.t:0 "Increased Strikes"
 unitedstates.174.d:0 "With the Depression, and the Inauguration of a far more conservative president that they were promised, the Labor unions have begun organizing more and more protests, causing the number of strikes to be steadily on the rise. Despite this, the majority of the AFL leadership remains calm, waiting for President Garner to determine the direction of his economic policies. If we try to support a more conservative platform than the Roosevelt one, we might find ourselves in the middle of a Strike Wave..."
 unitedstates.174.a:0 "We don't need this!"
 
 unitedstates.175.t:0 "Huey Long denounces Garner!"
 unitedstates.175.d:0 "In a fiery speech delivered today in Baton Rouge, Senator Huey Long (D-LA) has denounced President Garner and his Administration, calling him an \"old, establishment and corrupt reactionary whose policies will only make the rich richer and the hard-working Americans poorer.\" Following his populist ideas, Long had endorsed FDR and had supported his New Deal, but with the ascension of Garner to the Presidency he has realized that the only way he'll see his economic ideals realized is by taking the White House for himself. Thus, he has started to distance himself from the president and the rest of the party, with ambitious plans in mind..."
 unitedstates.175.a:0 "That damned demagogue!"
 
 unitedstates.176.t:0 "Economic Collapse!"
 unitedstates.176.d:0 "Our failure to push our measures through Congress for such a prolonged period of time has caused a massive loss of confidence in the markets, and a second economic crash that has stopped our timid recovery on its tracks. Unemployment is increasing again, slums are expanding, businesses are closing and everyone blames President Garner, who has failed to shift the blame on the deadlocked Congress. This doesn't bode well for our nation's stability..."
 unitedstates.176.a:0 "Uh-oh"
 
 unitedstates.177.t:0 "The First 100 Days are over"
 unitedstates.177.d:0 "100 days after the Inauguration of President Garner, he seems to have completed most of the \"First 100 Days Plan\", so many liberal Democrats, and even some Republicans who had supported the President due to the current crisis, have begun to withdraw their support for the administration. It seems that we will have to fight tooth and nail for our next bills..."
 unitedstates.177.a:0 "The time for politicking has come!"
 
 unitedstates.178.t:0 "William Woodin Resigns"
 unitedstates.178.d:0 "After announcing our intentions of breaking with Roosevelt's platform, our Secretary of the Treasury, William H. Woodin, has resigned in protest. The appointment of Woodin and other liberal Democrats had been a concession made by Garner back in February, but he had hoped that, despite his personal opinions, President Garner would follow the New Deal plan, or at least something similar to it. Our new plans, together with his declining health, have been important factors in this decision. Garner had decided to appoint Raymond Moley to the position, and old member of Roosevelt's Brain Trust turned into a sharp critic of the New Deal, and a staunch conservative. Let's hope he does a good job!"
 unitedstates.178.a:0 "We are better without him"
 
 unitedstates.179.t:0 "The New Deal Group"
 unitedstates.179.d:0 "Following the announcement of our new policy, and the resignation of Woodin, several New Dealer Representatives have formed an informal group called the \"New Deal Group\". Chaired by Representative Joseph A. Gavagan (NY-21), the group has declared its intentions of supporting the New Deal legislation laid out by Roosevelt, and sometimes even going beyond, such as in the field or racial inequality. Although this not very concerning, for now, it is another move by liberal Democrats that threatens party unity..."
 unitedstates.179.a:0 "Do they want to split the party?"
 
 unitedstates.180.t:0 "Clashes in Minneapolis"
 unitedstates.180.d:0 "A Teamsters strike against trucking companies in Minneapolis has devolved into a violent clash between National Guard and the Police in one side, and the strikers, supported by communist paramilitaries, on the other. After the dust settled, 14 deaths were reported, a very high number that has angered local unions even more. The AFL has condemned the violence, but many of its members are not satisfied with their response and demand a more clear defense of the strikers. In any case, the clashes today can only be a bad sign for what's to come."
 unitedstates.180.a:0 "What a disgrace!"
 
 USA_longists_long:0 "Longists"
 USA_longists:0 "Longists"
 unitedstates.181.t:0 "Huey Long leaves the Democratic Party"
 unitedstates.181.d:0 "Today, Senator Huey P. Long has announced, in a speech to his supporters in Shreveport, LA, that he has officially left the Democratic Party. He denounced President Garner as a corrupt reactionary, and accused the New Dealers of \"promising everything and delivering nothing, just token reform that prevents real change from happening.\" With him have also left Senators John H. Overton (LA) and Hattie Wyatt Caraway (AR) and Representatives Joachim O. Fernández (LA-1) and Paul H. Maloney (LA-2). With Long likely forming a new party, we have to try to limit its effects to Louisiana before we find ourselves with a nationwide populist movement."
 unitedstates.181.a:0 "This man is a danger for America!"
 
 unitedstates.182.t:0 "The Share our Wealth Party"
 unitedstates.182.d:0 "In a rally held today in Houston, Texas, Huey Long has announced the creation of a new political party, the Share our Wealth Party, that is named after his new economic plan. After a short speech delivered by Gerald L. K. Smith, in which he briefly spoke about how the party would be organized, Senator Huey Long took the stage and spoke enthusiastically about his Share our Wealth Plan, that would bring equality and justice to the American workers. His denouncement of the \"corrupt Washington elites\" ignited the crowd, that enthusiastically cheered for the Senator, and loudly booed when President Garner was mentioned (\"a corrupt liar\", Long called him). After the act, a majority of the attendees showed their full support for the new party. One of them, the young legislative secretary Lyndon B. Johnson, told the Houston Chronicle: \"This is a new hope for America. Only Senator Long can fulfill Roosevelt's vision and bring change to this nation. I was entranced, simply entranced.\" It seems that we have a new competitor in the political arena."
 unitedstates.182.a:0 "Worrying"
 USA_sowp:0 "Share Our Wealth Party"
 USA_sowp_long:0 "Share Our Wealth Party"
 usa_sowp_formed:0 "The §YShare Our Wealth Party§! has been formed."
 
 unitedstates.183.t:0 "The New Deal Alliance"
 unitedstates.183.d:0 "The success of the New Deal Group has motivated several senators and representatives, who have chosen to join this informal group. After this expansion, they have decided to rename themselves as the \"New Deal Alliance\", electing Senator Burton K. Wheeler (MT) as their Chair, and Representative Joseph A. Gavagan (NY-21) as their Vice-Chair. This time they have decided to go a step ahead and announce themselves as an independent political group, that \"will support their ideals over their party\". Many conservative Democrats are very concerned about this development, with Senator Royal S. Copeland (NY) demanding a clear condemnation of the group to the Senate Majority Leader Joseph T Robinson (AR). Robinson has remained suspiciously silent about this whole affair, but he has reportedly met with some members of the new NDA to keep his status as Majority Leader..."
 unitedstates.183.a:0 "Their intentions are clear..."
 USA_nda:0 "Democratic Party"
 USA_nda_long:0 "Democratic Party-New Deal Alliance"
 
 unitedstates.184.t:0 "Progressive Republicans join the NDA"
 unitedstates.184.d:0 "Although in less numbers than their democratic counterparts, some Republicans, such as Senator Bronson M. Cutting (NM) or Representative George H. Tinkham (MA-10), have decided to join the New Deal Alliance with \"observer\" status. Their number is small and their commitment to the new organization is not as great as the democrats', but this has already sparked concerns in the Republican National Commitee, whose Chair, Everett Sanders, has sent letters to the House and the Senate Minority Whips, asking them to redouble their efforts to \"maintain the Republican Party united in the face of the Democratic disintegration.\" Only time will tell if this just an isolated movement, or part of a greater political realignment..."
 unitedstates.184.a:0 "It seems that the Republicans have their own issues..."
 
 unitedstates.185.t:0 "Meeting with Robinson"
 unitedstates.185.d:0 "Today, President Garner met with Senate Majority Leader Joseph T. Robinson, one of the few Democrats to maintain excellent relations with both wings of the party, at least for now. However, the meeting didn't go as Garner expected, as the Senator warned him about the potential implications of the New Deal Alliance. He suggested the President to abandon his agenda and pursue something closer to Roosevelt's platform, and promised support to get it passed in the Senate. When Garner refused, Robinson made a veiled threat: \"Don't drift away from your party's platform, Mr. President, or the party might drift away from you.\" With this, Robinson's sympathy towards the NDA is all but clear."
 unitedstates.185.a:0 "Do we have another enemy?"
 
 unitedstates.186.t:0 "Progressives join the NDA"
 unitedstates.186.d:0 "Today, Senator Henrik Shipstead (MN) and Representative Henry M. Arens (MN-AL), the only Congressmen of the Farmer-Labor Party, have decided to join the New Deal Alliance as observers. Although political observers note that they probably want to attract Democratic support for the upcoming Minnesota gubernatorial election, in which incumbent Floyd B. Olson (F-L) is trying to defeat a Republican challenger, the move can also be interpreted as a consolidation of liberal and progressive forces under a new political party. In this fashion, the renmants of LaFollete's Progressive Party, who don't have any Congressmen, have also announced their support for the group, and have begun negotiations for joint candidacies in Wisconsin for the midterm election. Although now they are nearing extinction, LaFollete managed to gather 16% of the popular vote in 1924, so the appeal of progressivism cannot be ignored."
 unitedstates.186.a:0 "This is bad for us"
 USA_ndap:0 "New Deal Alliance"
 USA_ndap_long:0 "New Deal Alliance-Progressives"
 
 unitedstates.187.t:0 "The Democratic Liberty Alliance"
 unitedstates.187.d:0 "Conservative Democrats, worried about the creation of the NDA and the likely split of the party, have today announced the creation of the Democratic Liberty Alliance, that will serve as a support for President Garner in Congress. To avoid accusations of being a \"Southern Pressure Group\", the have chosen New York Senator Royal S. Copeland as their Chair, who has denounced the New Dealers in the opening speech. NDA member and Senator Edward P. Costigan (CO), has responded to the formation of the group with an article published in the Washington Post, attacking the DLA as a group of \"radical conservatives that are out of touch with the American electorate\", while the House Majority Whip, Arthur H. Greenwood (IN-7), has denounced both groups and called for the infighting within the Democratic caucus to \"cease inmediately\". The way things are going, this is not very likely..."
 unitedstates.187.a:0 "At least this group supports us!"
 
 unitedstates.188.t:0 "The \"Every Man a King Tour\""
 unitedstates.188.d:0 "In order to promote his newly created party, and gain appeal outside of Louisiana, Huey Long has started a tour around the country, that he has called the \"Every Man a King Tour\", named after his song. Long has toured the South, the Midwest, the Great Plains and has finalized with a grand act in San Francisco, where Long drew a very large crowd of supporters. After the rally, a group of Longists clashed with a group of New Dealers who accused each other of \"fascism\", although it is unclear who attacked first. Thankfully, there were no major injuries, but Long has managed to claim a big political victory."
 unitedstates.188.a:0 "We must stop him, somehow"
 
 unitedstates.189.t:0 "The NDA prepares for the Midterms"
 unitedstates.189.d:0 "Although they are still Democrats, at least de jure, many members of the New Deal Alliance have decided to not run as Democrats for the next Midterm election but as \"New Dealers\", in an effort of distancing themselves from the unpopular Garner Administration. Other members of the NDA are running as \"Progressives\", \"New Deal Democrats\" or \"Rooseveltian Democrats\", but it is clear that the Democratic Party won't appear on the ballot in many constituencies. The DLA has proposed to run alternative candidates, but that would basically throw all of the NDA out of the party, so Garner and the rest of the Democratic National Committee have decided to wait and see how the election goes."
 unitedstates.189.a:0 "They aren't a party but they sure act like one!"
 
 unitedstates.190.t:0 "The Share Our Wealth Party Campaign"
 unitedstates.190.d:0 "With the SoWP being nothing more than a populist movement built around the charismatic figure of Huey Long, their first electoral test being focused around down-ballot candidates is not their ideal situation, but they are beggining to prepare a strategy for it. For starters, Long wants to sweep Louisiana and unsteat those anti-Long Democratic representatives that still remain in the state; he also has decided to run some candidates in a few select Senate races, and candidates for the House in Texas, Alabama, Mississippi, Arkansas, Missouri and Tennessee. The Share our Wealth Party Senate candidates are: \n\n-Thomas C. O'Brien in Massachussetts\n\n-Charles Coughlin in Michigan\n\n-Jacob S. Coxey in Ohio\n\n-Gerald L. K. Smith in Wisconsin\n\nWith Long's seat not being up for re-election, his aims are more related to the publicity of the campaign than to the races themselves, many of which are doomed (thankfully) from the start."
 unitedstates.190.a:0 "What candidates are those!?"
 
 unitedstates.191.t:0 "Upton Sinclair wins California Democratic Primary"
 unitedstates.191.d:0 "In a major upset, Socialist writer Upton Sinclair has become the Democratic nominee for the gubernatorial election in California, after defeating George Creel in the primary by a wide margin. The Socialist Party has distanced themselves from the new nominee, but some members of the New Deal Alliance have shown interest in the race, and Sinclair's campaign is already looking for some endorsements. His plan against poverty in California, the EPIC, goes beyond Roosevelt's plan, and in private some members of the NDA have expressed discomfort with him approaching their group. However, this will all lose importance unless Sinclair can beat the Republican incumbent, Frank Merriam, who assumed the office after the sudden death of Governor James Rolph a few weeks ago."
 unitedstates.191.a:0 "What a lunatic"
 
 unitedstates.192.t:0 "The DLA attacks the New Dealers"
 unitedstates.192.d:0 "Ignoring the decisions of Garner and the DNC, the Democratic Liberty Alliance has decided to run their own \"true\" Democratic candidates against NDA incumbents, with disputes erupting all over the country in the different primaries that had been won by New Dealers. One race that has caused particular interest is the Wisconsin Senate Race, where Progressive incumbent Robert M. LaFollete Jr. runs as a \"New Dealer\" with the full support from the NDA, against the conservative Democrat John M. Callahan, the Republican John B. Chapple, and the Longist candidate Gerald L. K. Smith. This 4-way race could be the first of many, experts warn, pointing at the coming 1936 Presidential Election as the first 4-way election since 1860 unless the growing division in the Democratic ranks stops inmediately. Based on the New Dealer reaction to the DLA announcement, this does not seem very likely."
 unitedstates.192.a:0 "They did what?"
 
 unitedstates.193.t:0 "Huey Long campaigns across the South"
 unitedstates.193.d:0 "The leader of the Share our Wealth Party, Huey Long, has started a grand tour of the Southern states, specially in Texas, Alabama, Mississippi, Arkansas, Missouri and Tennessee, the ones where he has fielded candidates to the House of Representatives. Long has gathered impressive crowds, and several riots have broken out after his speeches. The worst incident happened in Austin, Texas, where a group of thugs, possibly sent by the Democrats, attacked a Long rally and where repelled by the crowd. It seems that, despite our best efforts, Long's populist message is beggining to spread outside of Louisiana and across the South. In other areas of the country, Long's candidates are not doing so well. For example, yesterday the inhabitants of Grand Rapids, Michigan, forced Charles Coughin, the Longist candidate to the Senate, out of their city by throwing fruits, eggs and even bricks at him. This, together with pressure from the Pope, has caused Caughin to drop out of the race."
 unitedstates.193.a:0 "The populist message spreads..."
 
 unitedstates.194.t:0 "Endorsing the DLA?"
 unitedstates.194.d:0 "Senator Copeland (NY), the leader of the Democratic Liberty Alliance, has asked President Garner for an official endorsement of their organization, and similar endorsements for their Senate and House incumbents that are up for re-election in November. With the DLA being the strongest supporters of President Garner in Congress, perhaps supporting their election changes would be a wise move, but the New Dealers have warned Garner repeatedly, through Senate Majority Leader Joseph T. Robinson, against this endorsement. Some of our advisors still believe that the Democratic Party can be reunited and we should stay above faction disputes, while others have given up on the New Dealers, and want us to hit back against them in the ballot box. This is not an easy decision for the president..."
 unitedstates.194.a:0 "We should throw our support behind the DLA!"
 unitedstates.194.b:0 "President Garner will remain above this petty fight!"

 unitedstates.195.t:0 "Where should we focus our efforts?"
 unitedstates.195.d:0 "With the party shattered, our prospects for this election are not good. However, we still have lots of funds, resources and talented orators to support our campaigning efforts, in order to win some key races that could define our policies for the next 2 years. Some advisors propose to focus on some key Senate races, like the ones in Wisconsin, New Mexico (both regular and special), Maine or Delaware. Others think that sabotaging our own Senate majority could weaken Robinson, a leading New Dealer figure, while maintaining our legislative capabilities by relying on the conservative Republicans, so they propose to focus on key House races instead. A third group has proposed to focus instead on gubernatorial elections, excluding the one in California, of course. They argue that maintaining a strong presence at the state level might be helpful for the upcoming Presidential Elections..."
 unitedstates.195.a:0 "Focus on the Senate races"
 unitedstates.195.b:0 "Focus on the House races"
 unitedstates.195.c:0 "Focus on the Gubernatorial races"
 
 unitedstates.196.t:0 "1934 Midterm Elections"
 unitedstates.196.sen:0 "The results of the various House, Senate and Gubernatorial races are here, and they are not good at all. The House has seen a crushing defeat for many of our candidates, challenged by all sides by Long, the GOP and the New Dealers. Gubernatorial elections have not seen our candidates faring much better, with losses in Connecticut, Idaho, Iowa, Kansas, and many more. In contrast, we have held our ground in the Senate, with some victories in Pennsylvania (although the candidate is a known New Dealer) or Missouri compensating for our defeats in New Mexico and Utah. Overall, this result is not good for our ability to pass legislation, so we must work twice as hard to bring relief to the American people."
 unitedstates.196.hor:0 "The results of the various House, Senate and Gubernatorial races are here, and they are not good at all. In the Senate, our candidates have lost their races in New Mexico, Utah, Wisconsin, Massachusetts, Montana (Special) that combined with the defection of many of our Senators to the New Dealers, has destroyed our Senate majority. Gubernatorial elections have not seen our candidates faring much better, with losses in Connecticut, Idaho, Iowa, Kansas, and many more. In contrast, we have held our ground in the House, keeping the Longists confined to Louisiana and maintaining our advantage in the Midwest and the West Coast. Overall, this result is not good for our ability to pass legislation, so we must work twice as hard to bring relief to the American people."
 unitedstates.196.gub:0 "The results of the various House, Senate and Gubernatorial races are here, and they are not good at all. The House has seen a crushing defeat for many of our candidates, challenged by all sides by Long, the GOP and the New Dealers. In the Senate, our candidates have lost their races in New Mexico, Utah, Wisconsin, Massachusetts, Montana (Special) that combined with the defection of many of our Senators to the New Dealers, has destroyed our Senate majority. In contrast, we have managed to keep our governorships (except for Michigan and Maryland), and flip Nevada, Arizona, Pennsylvania and technically California, where Sinclair has won with a razor thin margin against Merriam. Overall, this result is not good for our ability to pass legislation, so we must work twice as hard to bring relief to the American people."
 unitedstates.196.a:0 "This is bad"
 
 unitedstates.197.t:0 "1934 Midterm Election"
 unitedstates.197.d:0 "Catastrophe! Our failure to provide relief in time has alienated the voters, that have sent a clear message to the Garner Administration. Our candidates in the House, the Senate and the Gubernatorial races have been crushed by their Longist or Republican opponents, and the only democrats that have won their races (like Joseph F. Guffey in Pennsylvania or Upton Sinclair in California) are mostly New Dealers and progressives that are also going to oppose us at every turn. We need to change the economic situation fast or we will get trounced in the upcoming presidential election."
 unitedstates.197.a:0 "What a disaster!"
 
 unitedstates.198.t:0 "The Battle of Hardin County"
 unitedstates.198.d:0 "The onion pickers strike of Hardin County, Ohio, had started in June with no pospects of an arrangement, but today's events will only make it worse. Anti-union vigilantes have begun to round up and execute union leaders, and they have responded with similar force in an unusual explosion of violence. After 20 deaths and 50 injured, local law enforcement managed to restore order, but unions nationwide are preparing for a wave of protests..."
 unitedstates.198.a:0 "Why did this happen!?"
 
 unitedstates.199.t:0 "Wave of Protests"
 unitedstates.199.d:0 "After the events of Hardin County, labor unions and other socialist and progressive organizations have organized prostests all across the nation, from San Francisco to New York. They demand more protection, collective bargaining, a minimum wage and, of course, the removal of President Garner from office. Although these marches have been mostly peaceful, for now, this situation cannot last for much longer."
 unitedstates.199.a:0 "Predictable"
 
 unitedstates.200.t:0 "The Republican Campaign"
 unitedstates.200.d:0 "After being completely demolished in 1930 and 1932, the Grand Old Party has a new opportunity to strike as Democratic unity collapses. However, inside the Republican Party there is a lot of debate between those who think that the GOP should suport Garner's moderate legislation, or those that believe that a grindlock and an alignment with the NDA, or a grindlock, will accelerate the Democratic collapse. Senator Borah (ID) has emerged as a leading figure in these debates, stating that striking a middle ground between Garner and the New Dealers will allow the Republicans to have a leading role in the drafting of legislation, emerging as the true responsible party for the inevitable recovery. Other Republicans, such as Governor Alfred Landon of Kansas, fear that moving too much to the right will alienate those Republicans that have joined the NDA as observers, while grindlocking Congress will not be appreciated by the voters. A third group, led by former President Hoover, opposes any concession to Garner or the NDA, and defends a \"true Republican platform.\" Although far more united that the Democrats, it seems that the GOP has also its own political game..."
 unitedstates.200.a:0 "Pressure the GOP to support us in Congress"
 unitedstates.200.b:0 "We have no need for the failed Republicans"
 sinclair_elected_governor:0 "§YUpton Sinclair§! has been elected Governor of California"
 
 unitedstates.201.t:0 "William B. Bankhead elected House Speaker"
 unitedstates.201.d:0 "After the disastrous results in the House of Representatives that we got in November, former Speaker Jo Byrns, a conservative Democrat, resigned, and the Majority Leader William B. Bankhead has managed to unite both conservative and liberal Democrats to get elected as the new Speaker of the House. Despite being a Democrat from Alabama, Bankhead has been a reliable supporter of the New Deal, so he maintains good relations with both Garner and the NDA. This is a small victory for us, but probably the rest of the new Congressional leadership is not so agreeable..."
 unitedstates.201.a:0 "We extend our congratulations"
 
 unitedstates.202.t:0 "Pennsylvania New Deal Party Convention"
 unitedstates.202.d:0 "Shortly after taking office, Senator Joseph F. Guffey (PA) has decided to hold the first State Convention for the \"New Deal Party\", the last step of the long process of Democratic division. Guffey and the Pennsylvania delegates have encouraged the rest of the NDA to hold state conventions as well, creating a new national party that could have very high chances of winning the next Presidential Election. In any case, the process of division that started more than one year ago seems to be reaching its end..."
 unitedstates.202.a:0 "Splinters!"
 
 unitedstates.203.t:0 "State NDP Conventions continue"
 unitedstates.203.d:0 "More states are holding their New Deal Party Conventions, culminating the split of the Democratic Party through all the nation. Governor Sinclair presided over the one in California, calling for \"a real, ambitious and progressive social policy\", while the Progressives in Wisconsin, and the Farmer-Labor Party in Minnesota both joined the new party. The governors of California and Michigan, Senators from Montana and West Virginia, and Representatives from various states have defected to this new party, with the notable exception of the Solid South, that remains firmly Democratic... for now."
 unitedstates.203.a:0 "What a disaster!"
 
 unitedstates.204.t:0 "The AFL supports the New Deal Party"
 unitedstates.204.d:0 "After the formation of the NDP, the AFL quickly began moving towards the new party, hoping to get a good deal once (if) they come to power. AFL representatives have encouraged the local unions to work to get NDP and Progressive candidates elected, as \"that's the only way real change can occur!\" This culminates the complete departure of labor unions from the coalition that Roosevelt had forged back in 1932, although in private President Garner is glad to finally have the unions as an enemy."
 unitedstates.204.a:0 "This was to be expected"
 
 unitedstates.205.t:0 "The NDP National Committee is formed"
 unitedstates.205.d:0 "After the various state conventions were held, a National Committee has been assembled for the New Deal Party in an event held in New York City. Representative Byron B. Harlan (OH-6) was elected as their chair, with Representatives Chester C. Thompson (IL-14) and William Patrick Connery Jr. (MA-7) as Vice-Chairs. They have also discussed their strategy against President Garner, and the possible nominees for the 1936 Presidential Election, with several Senators' names coming up. As things are turning up, a loss in 1936 would probably mean the NDP's dissolution, so they'll fight bitterly for a win."
 unitedstates.205.a:0 "Another rival to be fought!"
 USA_ndp:0 "New Deal Party"
 USA_ndp_long:0 "New Deal Party (Moderates)"
 USA_ndp_prog:0 "New Deal Party"
 USA_ndp_prog_long:0 "New Deal Party (Progressives)"
 
 unitedstates.206.t:0 "Our next moves"
 unitedstates.206.d:0 "With the liberal Democrats defecting en masse to the New Deal Party, we must redefine our strategy for the last 2 years of our term in the White House. The first option would be to consolidate what remains of our party, supporting the DLA and the conservatives, and try to push through our agenda alone. This might be popular in the South (and with Long making advances there, we can't neglect the region) but it will be a nightmare in Congress, so some have proposed to approach the conservative Republicans to build a Conservative Coalition in Congress that can reliably pass our proposals. This will alienate many people however, and we would be forced to water down some of our proposals. The third option is to continue appealing to moderates in the NDP and the Democratic Party, a long-term strategy to reunite the party. Although it might be a gamble in Congress, it would be probably appreciated by the voters of key states such as Ohio, New York and California, states that we'll need to win in 1936. What should we do now?"
 unitedstates.206.a:0 "Consolidate our base against liberal and longist attacks!"
 unitedstates.206.b:0 "We must approach the conservative Republicans"
 unitedstates.206.c:0 "We shall continue appealing to the moderates in our party and in the NDP"
 
 unitedstates.207.t:0 "Kentucky Gubernatorial Election"
 unitedstates.207.d:0 "Today, 3 out of the 4 states that have their gubernatorial elections in odd-numbered years are electing their next governor. Although Mississippi is in the bag for the Democrats, and Louisiana for the Share our Wealth Party, the 4-way gubernatorial race in Kentucky has attracted lots of national attention, as it may be a first indicator of how the Presidential Election will go. As the polls are closed and the votes are counted, the winner is..."
 unitedstates.207.a:0 "A.B. \"Happy\" Chandler (Democratic Party)"
 unitedstates.207.b:0 "King Swope (Republican Party)"
 unitedstates.207.c:0 "John Y. Brown Sr. (New Deal Party)"
 unitedstates.207.e:0 "Rodes K. Myers (Share our Wealth Party)"
 
 unitedstates.208.t:0 "Long hits back"
 unitedstates.208.d:0 "Noticing how our political machine has been producing negative propaganda against him lately, Huey Long as decided to hit back against our Administration, delivering a series of speeches through Louisiana, Texas, Arkansas and Mississippi. Now it is our turn to hit his populist movement again, but the question is: how, and where?"
 unitedstates.208.a:0 "We need a nationwide campaign against Long!"
 unitedstates.208.b:0 "We should focus on defending our Southern strongholds"
 unitedstates.208.c:0 "Go on the offense: support the Louisiana Democrats!"
 
 unitedstates.209.t:0 "Progressives hit back"
 unitedstates.209.d:0 "Noticing how our political machine has been producing negative propaganda against them lately, NDP progressives have decided to hit back, denouncing our Administration as \"corrupt, reactionary and elitist\" in some speeches that were not-so-well received by the moderate, liberal wing of the New Deal Party. Now it is our turn to hit back against them, what should our message be?"
 unitedstates.209.a:0 "Denounce the socialistic progressives directly!"
 unitedstates.209.b:0 "Use the speeches to label the entire NDP as socialist!"
 
 unitedstates.210.t:0 "Anniversary of the Battle of Hardin County"
 unitedstates.210.d:0 "One year after the bloody events of Hardin County, Ohio, labor unions through the nation have held small rallies and demostrations to commemorate the fallen unionists. In one of these marches, held in Minneapolis, some unionists have engaged with the police, who decided to shoot them on the spot. Another event of anti-union violence was the final straw, AFL representatives declared, calling for nationwide strikes during the next weeks. Its seems that the tension between the government and the unions, that has been building up for 2 years, is about to hit its breaking point..."
 unitedstates.210.a:0 "More violence, really?"

 unitedstates.211.t:0 "The Strike Wave"
 unitedstates.211.d:0 "With Garner's continued refusal of considering some union demands such as collective bargaining, and the memories of Hardin County and Minneapolis fresh in everyone's minds, a massive wave of strikes has nearly paralyzed the nation. The economic situation is quickly deteriorating and many Democratic governors are demanding a severe response from the federal government. President Garner, a known enemy of labor unions, is considering the use of force to end the wave of strikes, although this could break his already low popularity..."
 unitedstates.211.a:0 "Those damned unionists!"
 
 unitedstates.212.t:0 "The NDP protests against the Labor Management Relations Act"
 unitedstates.212.d:0 "Through various events and rallies, New Deal Party politicians have denounced the Labor Management Relations Act, dubbed the \"Anti-Union Act\", announcing their negative vote and their intentions of fighting it in court. With this move, the support of the unions for the NDP is all but secured. We didn't count on their votes, but Long did, so this is an important setback for him. Long himself has remained silent about the Act, to avoid alienating his conservative, southern base."
 unitedstates.212.a:0 "Let them protest!"
 usa_strike_wave_garner2:0 "Strike Wave"
 usa_strike_wave_garner:0 "Strike Wave"
 
 unitedstates.213.t:0 "The Gore Amendment"
 unitedstates.213.d:0 "As the Businesses and Economy Act gets drafted and announced, many labor unions have joined the progressives in their denouncement of the Act, saying that it takes away rights from the workers, favouring employers too much. With liberal Republicans remaining indecisive, Okhlahoma Senator Thomas Gore (D) has proposed an Amendment that would moderate the Act quite a bit, making it far more acceptable to the moderates of both major parties. Conservatives don't support the so-called \"Gore Amendment\", but they could be easily persuaded. The question is: should we do it?"
 unitedstates.213.a:0 "We must compromise. Support the Amendment."
 unitedstates.213.b:0 "The bill will get passed as it stands!"
 
 unitedstates.214.t:0 "Liberal Republicans hit back"
 unitedstates.214.d:0 "Worried by our continued cooperation with conservative Republicans, their liberal counterparts, led by Senators Hiram Johnson (CA) and Frederick Hale (ME), have all signed a declaration that has been published by several major newspapers. They call their conservative colleages to stop cooperating with our Administration, stating that they are \"betraying the ideals of Lincoln, Grant and Theodore Roosevelt.\" This was to be expected, and it has left conservative Republicans such as Senator Taft very worried..."
 unitedstates.214.a:0 "They are just a nuisance"
 
 unitedstates.215.t:0 "Anti-Fascist Enthusiasm"
 unitedstates.215.d:0 "Our camapaign to accuse Long of being the American fascist seems to be working a bit... too well. Leftist organizations have begun their own mass anti-fascist campaigns, targeting not only Long but also the KKK, the Silver Legion, the Bund, and radical conservatives as well. This has motivated the progressive base, that has managed to grow substantially. Socialists and communists have also seen some small advances, amidst this \"grey scare\"."
 unitedstates.215.a:0 "This was not what we intended..."
 
 unitedstates.216.t:0 "Huey Long launches another campaign"
 unitedstates.216.d:0 "Worried about the vaning popularity of his party, Huey Long has decided to tour the country once again, performing fierce speeches to beholden crowds. The tour is giving the Share our Wealth Party a considerable rebound in popularity, and they seem to be back on the national stage."
 unitedstates.216.a:0 "What!?"
 
 unitedstates.217.t:0 "1936 Republican National Convention"
 unitedstates.217.d:0 "Today, the Republicans have held their National Convention in Philadelphia, Pennsylvania. The nomination was hotly contested between Alfred M. Landon, the Governor of Kansas, Frederick Steiwer, a Senator from Oregon, and finally the frontrunner, Senator William Edgar Borah from Idaho. Seeking to differentiate themselves from our Administration, the Republicans have chosen Senator Borah as their nominee, with Steiwer being selected to serve as his running mate. In his acceptance speech, Borah has defended the \"true progressive cause\", and called the Republicans to distance themselves from Hoover and \"listen to the people\". Reactions in the Convention hall were mixed, but Borah's nomination has been generally well received. The first contender of the election is here!"
 unitedstates.217.a:0 "Let's get this thing started!"
 
 unitedstates.218.t:0 "Share our Wealth Party National Convention"
 unitedstates.218.d:0 "Today, Long and his party have held their National Convention in New Orleans, Louisiana. As expected, Huey Long has easily taken the presidential nomination, defeating a token challenge from Representative William Lemke (ND-AL). He has then picked Gerald L. K. Smith as his running mate, in order to appease the more conservative wing of his party. In his acceptance speech, Long has bowed to fight for the common man against the \"greedy Washington elite\" with all his energies, and he has also pledged to visit all 48 states of the Union before Election Day. After that, his strong defense of his Share our Wealth program energized the crowd and cause a massive outburst of enthusiasm in the Convention hall. Satisfied with his National Convention, Long has already begun campaigning, with rallies in Texas and Okhlahoma scheduled for this week."
 unitedstates.218.a:0 "The second contender comes in!"
 
 unitedstates.219.t:0 "New Deal Party National Convention"
 unitedstates.219.d:0 "Today, the New Dealers have held their National Convention in Chicago, Illinois. After a year of discussions and debates, the New Deal Party delegates awarded the nomination to none other than Joseph T. Robinson, the Senate Majority Leader and still, technically, a Democrat. Robinson is a big name in American politics, being the former running mate of Al Smith in 1928 and a very important politician in the Senate. He is also fairly moderate, pledging in his acceptance speech to completely fulfill Roosevelt's New Deal and appealing to national unity in these times of divisions. With Robinson being the nominee, the vice-presidential nomination was hotly contested between the progressives and the moderates, but after much debate, it was awarded to Senator Sherman Minton of Indiana. Minton's aggresive style in the Senate, where he regularly enters in heated discussions with Republicans and with Huey Long himself, along with his Midwestern appeal and his solid support of the New Deal, were the factors that led to this choice. Progressives are mildly upset at the Robinson-Minton ticket, deeming it as too moderate, but apparently both men have entered in private negotiations with the progressives, promising not to run again in 1940. The moderation of the ticket has been apprecianted by the voters however, and the NDP enters the race as the clear favorite."
 unitedstates.219.a:0 "The splinters are here!"

 unitedstates.220.t:0 "1936 Democratic National Convention"
 unitedstates.220.d:0 "Today, the Democratic Party has held its National Convention in Houston, Texas. President Garner has managed to be renominated on the first ballot after easily defeating a small challenge from Governor Paul V. McNutt from Indiana. In his acceptance speech, Garner has defended the accomplishments of his Administration, and then he has taken the attack on the liberals and the longists. However, one important choice remains: Garner's running mate. Due to Roosevelt's assasination, the United States has been 4 years without a Vice President, so there's nobody to re-nominate. So far, Garner's possible choices are: Roosevelt campaign manager, and loyal Democrat James A. Farley, former Massachusetts Governor Joseph B. Ely, Senator James F. Byrnes of South Carolina, or Senator Millard E. Tydings of Maryland. Farley and Byrnes have been moderate supporters of New Deal policies and that could help win the more liberal vote, while Ely may be an asset in the Northeast, a traditional Republican bastion. Tydings brings lots of foreign policy experience to the table, and can reinforce our campaign message based on experience, so he is also an acceptable choice. Now, who shall become Garner's running mate?"
 unitedstates.220.a:0 "James A. Farley (NY)"
 unitedstates.220.b:0 "Joseph B. Ely (MA)"
 unitedstates.220.c:0 "James F. Byrnes (SC)"
 unitedstates.220.e:0 "Millard E. Tydings (MD)"
