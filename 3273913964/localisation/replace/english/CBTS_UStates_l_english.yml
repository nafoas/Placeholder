 USA_office_prod_long:0 "Office of Production Management"
 USA_office_prod_long_desc:0 "The Office of Production Management will centralize direction of federal procurement programs and our quasi-war production."
 USA_four_freedoms_long:0 "The Flames of Patriotism"
 USA_four_freedoms_long_desc:0 "President Long must use his oratory abilities to ignite a wave of patriotism that can serve us to unite the country once the war begins."
