 unitedstates.150.t:0 "Republican National Convention"
 unitedstates.150.d:0 "Republicans are holding today their National Convention in Philadelphia, were they picked their nominees for the upcoming election. The party was increasingly divided between Dewey's liberals and Taft's conservatives, and finally it was Thomas Dewey, governor of New York, who got the nomination. Ignoring the conservative sector, Dewey then picked Earl Warren, Governor of California and a staunch progressive, as his running mate. The Dewey-Warren ticked is expected to pose a significant challenge."
 unitedstates.150.a:0 "We'll beat them again!"
