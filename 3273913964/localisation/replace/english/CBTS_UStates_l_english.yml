 unitedstates.148.t:0 "The Vice-Presidential Ballot"
 unitedstates.148.d:0 "We have our candidate, but now we have to pick his running mate. Both conservatives and New Dealers are pushing for their own candidates..."
 unitedstates.148.a:0 "Alben W. Barkley (KY)"
 unitedstates.148.b:0 "Fielding L. Wright (MS)"
 unitedstates.148.c:0 "James Roosevelt (CA)"
 unitedstates.148.e:0 "Hugh L. White (MS)"
 unitedstates.148.f:0 "Wilson W. Wyatt (KY)"
 USA_dixiecrats:0 "Dixiecrats"
 USA_dixiecrats_long:0 "States' Rights Democratic Party"
 unitedstates.149.t:0 "Southern Democrats leave the Convention!"
 unitedstates.149.d:0 "Our choice of a fully New Dealer ticket was not well received by the southern conservative Democrats. They have been feeling sidelined during these last years by the increasingly liberal direction our party is taking, and our recently adopted Civil Rights platform was the final straw. Democratic governors from all the Southern states have decided to split from the Democratic Party and create their own segregationist, conservative party. Led by South Carolina Governor Strom Thurmond, they seek to send the Election to the House of Representatives, so that they can support a candidate in exchange of concessions. Although lots of Southern politicians have joined this new party, other major Southern Democrats, like Richard Russell Jr, have remained loyal."
 unitedstates.149.a:0 "Segregationist bastards!"
