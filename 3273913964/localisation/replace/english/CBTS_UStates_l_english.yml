 unitedstates.113.t:0 "1944 Republican National Convention"
 unitedstates.113.d:0 "The Republican National Convention was held today in Chicago, Illinois, where GOP delegates decided their Presidential and Vice-Presidential candidates for the upcoming election. As the voting closed, the result was clear: Thomas Dewey, Governor of New York, has secured the nomination by a wide margin over his rivals. Governor John W. Bricker of Ohio will serve as his running mate, forming a progressive Republican ticket that, despite mostly supporting some degree of welfare, has already started to fiercely attack the Democratic administration."
 unitedstates.113.a:0 "We'll defeat them again!"
 dewey_nominated_four_tooltip:0 "§YThomas Dewey becomes the Republican candidate for the 1944 Presidential Election!§!"
 taft_nominated_tooltip:0 "§YRobert Taft becomes the Republican candidate for the 1944 Presidential Election!§!"
 mac_nominated_tooltip:0 "§YDouglas MacArthur becomes the Republican candidate for the 1944 Presidential Election!§!"
 willkie_nominated_four_tooltip:0 "§YPresident Willkie will seek a 2nd term as President!§!"
 unitedstates.114.t:0 "1944 Presidential Election"
 unitedstates.114.d:0 "Election day has finally arrived, and the country is waiting for the final result. The next President of the United States of America will be..."
 unitedstates.114.a:0 "[USA_d_nominee_ffour] (D)"
 unitedstates.114.b:0 "[USA_rep_nominee_ffour] (R)"
 reelection_dem_ffour:0 "§YDemocratic candidate [USA.GetLeader] will serve another term as President!§!"
 democrat_elected_ffour:0 "§YDemocratic candidate [USA_d_nominee_ffour] will become the President of the United States of America!§!"
 rep_elected_ffour:0 "§YRepublican candidate [USA_rep_nominee_ffour] will become the President of the United States of Americas!§!"
 dem_inaugurated_ffour_tooltip:0 "§YDemocratic candidate [USA_d_nominee_ffour] becomes the President of the United States of America!§!"
 dem_begin_term_tooltip:0 "§YDemocratic candidate [USA.GetLeader] will begin his next term as President!§!"
 unitedstates.115.t:0 "Inauguration of [USA_d_nominee_forty]"
 unitedstates.115.d:0 "Today is a big day, as the winner of the last Presidential Election, [USA_d_nominee_forty], has been sworn in as President by Chief Justice Harlan F. Stone. He has used this opportunity to deliver a speech to his supporters congregated in Washington DC, where he outlined the main points of his agenda."
 unitedstates.115.a:0 "Let's begin!"
 
 unitedstates.117.t:0 "1942 Midterm Election"
 unitedstates.117.d:0 "Today the American people renovate the House of Representatives, a third of the Senate and lots of Governorships. We can hope that our campaign was effective and wait for the results to arrive..."
 unitedstates.118.d:0 "Good news! In a landslide victory, our party has managed to sweep the House and the Senate, winning solid majorities there. This, along with our victory in most governorships, allows us to comfortably pass laws during the next 2 years, at least."
 unitedstates.119.d:0 "Good news! Despite having a few defeats here and there, even our rivals have conceded: we have a majority in both the House and the Senate, and the Governorship races also went quite well. Now it is time to use that majority to pass laws!"
 unitedstates.120.d:0 "Bad news! Despite having a few wins, the result of this election was an overall defeat, with our rivals gaining a majority in both House and Senate. We'll have to negotiate harder during the next years..."
 unitedstates.121.d:0 "Terrible news! The American people have clearly said no to our policy, with our party being utterly defeated in most races. We'll have to rethink our strategy or the next Presidential Election will be a sure loss..."
 
 unitedstates.122.t:0 "Inflation!"
 unitedstates.122.d:0 "The end of the war may break our economy unless we are careful, and a clear example of that is the threat of inflation. While strict controls were placed during the war to ensure our massive spending didn't translate into inflation, now that the war is over the people are tired of controls and expect us to remove them without causing inflation..."
 unitedstates.122.a:0 "We will never rest at this point!"
 unitedstates.123.t:0 "The silence after the storm"
 unitedstates.123.d:0 "The war is over, but the economy isn't ready to transition back to a civilian economy. The people are tired of controls, the unions are announcing strikes now that the war is over, the veterans expect repayment for their service to the nation and the threat of another Depression looms over our nation. We have to be careful now..."
 unitedstates.123.a:0 "The pen is mightier than the sword..."
 
 unitedstates.124.t:0 "Charles Evans Hughes Retires"
 unitedstates.124.d:0 "Charles Evans Hughes, 11th Chief Justice of the United States, has announced today his intentions to retire. He was appointed by President Hoover in 1930 to succeed Chief Justice Taft, after a long political career that made him Republican candidate for the 1916 Presidential Election ( which he lost to President Wilson ) and Secretary of State under the Harding and Coolidge Administrations. Now the declining health of his wife has made him announce his retirement to the President, while also proposing his successor's name: Harlan F. Stone. During his tenure he favoured economic regulations, now we have to see if his successor will think the same way..."
 unitedstates.124.a:0 "The Stone Court begins!"
 unitedstates.125.t:0 "The FEPC Question"
 unitedstates.125.d:0 "The Fair Employment Practice Committee, created during the War as a way to protect and integrate minorities into the economic war effort, is now demanding our attention. Many conservatives in Congress are pointing out that the war is over and thus the FEPC has to be disbanded, while civil rights activists demand to make the FEPC permanent, in order to allow minorities to grow economically and protect them from hate strikes and racism at work. What should we do?"
 unitedstates.125.a:0 "Maintain and expand the FEPC!"
 unitedstates.125.b:0 "Their time is up"
 unitedstates.126.t:0 "The Strike Wave"
 unitedstates.126.d:0 "The fall in wages that followed the war, together with the economic chaos and inflation also caused by the conflict, and the end of the unions' pledge to not strike that was in effect during the war, have led to a massive Strike Wave, the biggest in American history. We need to take action now, one way or another."
 unitedstates.126.a:0 "Just go to work!"
 unitedstates.127.t:0 "The Silver Purchase Act"
 unitedstates.127.d:0 "The Great Depression has caused a massive drop in the price of silver, and President [USA.GetLeader] is determined to solve this situation. In order to do so, Congress has just approved the Silver Purchase Act, that will allow the President to nationalize silver mines and move all their production to the US Mint. The president has also begun to purchase large amounts of silver from all around the world, hoping to increase its price. Most countries use the gold standard, so our advisors hope that this measure won't damage their economies. The big exception is China: they still use the silver standard and the projected increase of the price of silver may force them to abandon it..."
 unitedstates.127.a:0 "Get that silver!"
 unitedstates.128.t:0 "Inauguration Day"
 unitedstates.128.d:0 "Today, the winner of the Presidential Election, Alfred M. Landon, has been sworn in as President of the United States. In his speech, he has promised to devote his term to the ideals of freedom and prosperity, away from the New Deal. Interestingly, he's the first President to be sworn in on Juanuary 20th, after the relevant Amendment was approved four years ago."
 unitedstates.128.a:0 "Let us begin!"
 landon_becomes_president:0 ""§GAlf Landon becomes the 33rd President of the United States of America"
 unitedstates.129.t:0 "Democratic National Convention"
 unitedstates.129.d.cons:0 "Today the Democrats have held their National Convention, where they picked their nominees for the upcoming Election. The Presidential nomination was hotly contested, as conservative Dixiecrats and progressive New Dealers sought to enforce their ideology on the rest of the party. Surprisingly, John Nance Garner, former Vice-President under Roosevelt, has been nominated for President, with Paul V. McNutt as his running mate. Despite being Vice-President under the largely failed Roosevelt Administration, Garner has managed to convince the Convention about his disagreements with Roosevelt, while promising to keep part of his platform as a nod to New Dealers."
 unitedstates.129.d.libs:0 "Today the Democrats have held their National Convention, where they picked their nominees for the upcoming Election. The Presidential nomination was hotly contested, as conservative Dixiecrats and progressive New Dealers sought to enforce their ideology on the rest of the party. Surprisingly, former Postmaster James A. Farley, a close Roosevelt associate and staunch New Dealer, has been nominated for President. He insists in his defense of the New Deal, despite Roosevelt's defeat in 1936, and called the Democrats to repeat the landslide of 1932. His running mate is James F. Byrnes, a concession to Southerners that is still amiable to most of the New Deal programs."
 unitedstates.129.a:0 "We'll defeat them again!"
 unitedstates.130.t:0 "Republican National Convention"
 unitedstates.130.d:0 "Today the Republican National Convention was held in Philadelphia, to choose the nominees for the upcoming election. As expected, President Landon won the renomination with ease, while Vice-President Frank Knox was confirmed as his running mate. Now let's see if we can beat the Democrats this fall..."
 unitedstates.130.a:0 "Four more years!"
 unitedstates.131.t:0 "Inauguration of [USA_rep_nominee_forty]"
 unitedstates.131.d:0 "Today is a big day, as the winner of the last Presidential Election, [USA_rep_nominee_forty], has been sworn in as President by Chief Justice Charles Evans Hughes. He has used this opportunity to deliver a speech to his supporters congregated in Washington DC, where he outlined the main points of his agenda."
 unitedstates.131.a:0 "Let's begin!"
 landon_seek_second:0 "§YPresident Landon will seek a second term as President!§!"
 landon_begin_second_tooltip:0 "§YAlf Landon will begin his second term, with a new focus tree!§!"
 willkie_inaugurated_forty_tooltip:0 "§GWendell Willkie becomes the 33rd President of the United States of America!§!"
 unitedstates.132.t:0 "A New Chief of Staff"
 unitedstates.132.d:0 "Major General Douglas MacArthur has served as Chief of Staff for almost 5 years. But today, the President has decided not to extend MacArthur's term further and appoint Malin Craig, President of the Army War College, as the new Chief of Staff. Despite the recent rough confrontations between the President and McArthur, the General has been awarded a second Distinguished Service Medal for his service as chief of staff; as well as two Purple Hearts (a decoration that he himself authorized in 1932) for his World War I service, which he had engraved with \"#1\" as he is the first recipient of the newly created medal."
 unitedstates.132.a:0 "About time"
 unitedstates.133.t:0 "MacArthur leaves for the Philippines"
 unitedstates.133.d:0 "After the establishment of the Philippine Commonwealth, President Manuel Quezón has asked Douglas MacArthur to supervise the creation of a new Philippine Army. With the President's approval MacArthur accepted the assignment and prepared to leave for the Philippines soon. Today MacArthur, accompanied by his mother, his sister-in-law, and Majors James B. Ord and Eisenhower; sailed from San Francisco on the SS President Hoover heading for the Philippines."
 unitedstates.133.a:0 "Bon voyage"
 unitedstates.134.t:0 "Malin Craig Retires"
 unitedstates.134.d:0 "Chief of Staff Malin Craig has reached the retirement age of 64, so his time is up. The President however has already his replacement in mind: Brigadier General George C. Marshall, who currently serves as Deputy Chief of Staff. His bravery challenging the President in a recent meeting, arguing that the plan proposed by him lacked forethought and it was a bad idea, convinced the President [USA.GetLeader] to appoint him as Craig's successor. Let's hope he has the skills required for the job in this turbulent times..."
 unitedstates.134.a:0 "Marshall has our trust!"
 unitedstates.135.t:0 "Foundation of the UAW"
 unitedstates.135.d:0 "The United Auto Workers, a new labor union, has been created today in Detroit, Michigan, a major industrial hub. Born under the auspice of the American Federation of Labor, the largest union group of the United States. As with most of the unions, its goals are the improvement of worker's conditions (in automobile industries), and they are already preparing strikes and other actions."
 unitedstates.135.a:0 "More unions..."
 unitedstates.136.t:0 "The Congress of Industrial Organization"
 unitedstates.136.d:0 "The American Federation of Labor, the biggest union group in our country, is succumbing to internal divisions. The strong dominance of the craft unionists over the AFL, and its lack of militancy have caused tensions within the Federation, which led to the creation of the Committee of Industrial Organizations inside the AFL. The AFL however, decided to kick all members of this group out of the federation, leading to them forming their own, independent Congress of Industrial Organizations. This new CIO has very strong unions inside, such as the UAW and the UMWA, and its militancy will likely cause problems."
 unitedstates.136.a:0 "So more strikes?"
 unitedstates.137.t:0 "Marshall Resigns"
 unitedstates.137.d:0 "George C. Marshall has decided to resign, after serving as Chief of Staff for around 5 years. President [USA.GetLeader] now has to pick a new one, and with the many promising generals that have risen through the ranks these last years, it is going to be difficult."
 unitedstates.137.a:0 "Dwight D. Eisenhower!"
 unitedstates.137.b:0 "Courtney Hodges!"
 unitedstates.137.c:0 "Leslie J. McNair!"
 unitedstates.138.t:0 "A New Chief of Staff"
 unitedstates.138.d:0 "Barely 2 years after being appointed, our Chief of Staff has resigned and now we have to pick a new one. There are lots of potential options on the table..."
 unitedstates.138.a:0 "Omar Bradley!"
 unitedstates.138.b:0 "Mark Clark!"
 unitedstates.138.c:0 "George S. Patton!"
 unitedstates.138.e:0 "J. Lawton Collins!"
 unitedstates.139.t:0 "Republican National Convention"
 unitedstates.139.d:0 "President Landon has served for 2 terms, and now we must pick our nominee for the upcoming Presidential Election. The progressive Republicans, led by Governor Thomas Dewey of New York, and the conservative Republicans, led by Senator from Ohio Robert A. Taft, are battling each other to see who will secure the nomination. General MacArthur has also shown his interest in the race..."
 unitedstates.139.a:0 "Thomas E. Dewey (NY)"
 unitedstates.139.b:0 "Robert A. Taft (OH)"
 unitedstates.139.c:0 "Douglas MacArthur (AR)"
 unitedstates.140.t:0 "The Vice-Presidential Ballot"
 unitedstates.140.d:0 "We have chosen [USA_rep_nominee_ffour] as our Presidential candidate, and now we must pick his running mate. There are lots of options available..."
 unitedstates.140.a:0 "John W. Bricker (OH)"
 unitedstates.140.b:0 "Earl Warren (CA)"
 unitedstates.140.c:0 "Everett Dirksen (IL)"
 unitedstates.140.e:0 "Leverett Saltonstall (MA)"
 unitedstates.141.t:0 "Republican National Convention"
 unitedstates.141.d:0 "The Presidential Elections are nearing, but the name of our nominee is clear. President Willkie shall seek a 2nd term, hoping to finish his economic projects. However, we still have to pick a new Vice-President, as Charles McNary is veyr old..."
 unitedstates.141.a:0 "Four more years!"
 usa_load_final_tree:0 "§YThe Lategame tree will be loaded!§!"
 rep_inaugurated_ffour_tooltip:0 "§YRepublican candidate [USA_r_nominee_ffour] becomes the President of the United States of America!§!"
 ww_inaugurated_ffour_tooltip:0 "§YPresident Wendell Willkie begins his 2nd term as President!§!"
 unitedstates.142.t:0 "Inauguration of [USA_rep_nominee_ffour]"
 unitedstates.142.d:0 "After winning the Presidential Election in November, [USA_rep_nominee_ffour] has been sworn in by Chief Justice Harlan F. Stone. In a short speech, he has outlined the main points of his agenda, detailing what are his intentions for the coming years."
 unitedstates.142.a:0 "How exciting!"
 unitedstates.143.t:0 "Democratic National Convention"
 unitedstates.143.d.cons:0 "The Democrats have held today their National Convention in Chicago, where they have chosen their nominees for the upcoming Presidential Election. Seeking to counter [USA.GetLeader]'s progressive policies, they have chosen Harry F. Byrd, a conservative Senator from Virginia, as their Presidential candidate. However, in order to reconcile a bit with the New Dealers, the Illinois Senator Scott Lucas, a staunch progressive and supporter of the New Deal, has been chosen as Byrd's running mate."
 unitedstates.143.d.libs:0 "The Democrats have held today their National Convention in Chicago, where they have chosen their nominees for the upcoming Presidential Election. Seeking to counter [USA.GetLeader]'s conservative policies, they have chosen Senator Harry Truman from Missouri as their Presidential candidate. Truman is a strong supporter of the New Deal and Civil Rights, so the conservatives were considerably angry at this choice. In order to appease them, the Governor of North Carolina, Joseph M. Broughton, has been chosen as Truman's running mate."
 unitedstates.143.a:0 "We'll beat them again!"
 fdr_dead_vp:0 "§YThe current Vice-President will take over as 33rd President of the United States of America!§!"
 unitedstates.144.t:0 "President Roosevelt has died!"
 unitedstates.144.d:0 "Today, President Franklin Delano Roosevelt has died, at age 63, after suffering a massive intracerebral hemorrhage. His declining health was kept hidden to the public, but was no secret to the Vice-President, that has now taken over as 33rd President of the United States of America. Meanwhile, Roosevelt's body is being transferred back from Warm Springs, Georgia, to Washington DC in the Presidential train, with his funeral scheduled for tomorrow."
 unitedstates.144.a:0 "Rest in Peace"
 unitedstates.145.t:0 "Roosevelt's funeral"
 unitedstates.145.d:0 "Thousands of people flocked to the tracks of the Presidential train, that was transporting Roosevelt from Warm Springs to Washington, in order to pay their respects. After the arrival of Roosevelt's coffin at Washington DC, he was taken to the White House, in a massive military parade attended by 500.000 people, where a state funeral was held. However, his wish was not to be buried in Washington, but in Hyde Park, New York, so he was moved there afterwards, where he received military honors. President [USA.GetLeader] has declared a 30-Day mouring period for one of the most important Presidents of our nation's history."
 unitedstates.145.a:0 "Now we must move on!"
 unitedstates.146.t:0 "Democratic National Convention"
 unitedstates.146.d:0 "President [USA.GetLeader] has served 2 full terms, and according to tradition, it is time to retire. The Democratic Party, at its convention in Philadelphia, Pennsylvania, has now to choose our nominee for the upcoming Presidential Election. Both the conservative Democrats and the New Dealers are trying to push for their candidates: Richard Russell Jr. and James F. Byrnes as conservative candidates and Harry Truman and Scott Lucas as liberal ones. Who shall take the nomination?"
 unitedstates.146.a:0 "Harry S. Truman (MO)"
 unitedstates.146.b:0 "Richard Russell Jr. (GA)"
 unitedstates.146.c:0 "Scott W. Lucas (IL)"
 unitedstates.146.e:0 "James F. Byrnes (SC)"
