 us_unemploy1:0 "Extremely High Unemployment Rate"
 us_unemploy1_desc:0 "The Great Depression has caused unemployment rate to skyrocket, reaching 25%. We must give those men work if we want to save not only our economy, but our democracy as well."
 us_unemploy2:0 "Very High Unemployment Rate"
 us_unemploy3:0 "High Unemployment Rate"
 us_crop1:0 "Abysmal Crop Prices"
 us_crop1_desc:0 "The situation in the countryside is dramatic. Crop prices have fallen as the Great Depression reduced demand, and now farmers are falling into debt and bankruptcy all across the country."
 us_crop2:0 "Very Low Crop Prices"
 us_crop3:0 "Low Crop Prices"
 us_segregation:0 "Racial Segregation"
 us_segregation_desc:0 "We may have freed the slaves, but Jim Crow laws are still strong in the southern states. Black People and Native Americans have been disenfranchised in many states, and the US Military is still segregated."
 us_segregation2:0 "Racial Segregation"
 us_slums:0 "Slum Proliferation"
 us_slums_desc:0 "From California to New York, the Great Depression has caused slums to appear in cities as more and more people become homeless. We have to fix this if we don't want to encounter major crime and health-related issues."
