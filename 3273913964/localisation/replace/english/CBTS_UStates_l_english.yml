 USA_fabricate_border_incident:0 "Fabricate Border Incident"
 USA_fabricate_border_incident_desc:0 "Mexico can't simply refuse our demands. An incident in the border will give us the proper caus belli!"
 USA_stage_coup_mex:0 "Prepare a Coup in Mexico"
 USA_stage_coup_mex_desc:0 "Mexico can't simply refuse our demands. A coup will install a friendly regime in Mexico that will grant any concession we want!"
