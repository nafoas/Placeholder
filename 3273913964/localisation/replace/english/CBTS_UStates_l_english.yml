 faster_employment:0 "Unemployment will decrease faster.\n"
 usa_faster_crop:0 "Crop prices will decrease faster.\n"
 usa_reorg_effects_tooltip:0 "§GPassing this bill will give increased political power gain!§!"
 usa_unlock_follow_focuses:0 "Unlocks the Cash & Carry focus!\n"
