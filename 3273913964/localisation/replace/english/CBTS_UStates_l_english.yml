 USA_assasination_focus:0 "First Garner Term Focus Tree"
 USA_inauguration_garner:0 "Inauguration Day"
 USA_inauguration_garner_desc:0 "After the sudden assasination of Franklin Delano Roosevelt, his running mate John Nance Garner has been inaugurated as President of the United States. Now he has to deal with a country struck by economic depression and political uncertainty, that wonders if he is up for this herculean task. Let's hope he is..."
 USA_speak_people:0 "Address the People"
 USA_speak_people_desc:0 "After the chaos of the last month, President Garner has decided to do a radio address in the White House to speak to the American People about Roosevelt's assasination and his plans for the economy. Let's hope this can help calm the people down a bit..."
 USA_balance_fed_budget:0 "Balance the Federal Budget"
 USA_balance_fed_budget_desc:0 "One of Roosevelt's campaign promises was to balance the Federal Budget, and President Garner is determined to fulfill that promise. In order to do so, we sadly need to cut many salaries of congressmen, government officials, and even veterans. Despite this, the awful state of the economy will surely motivate Congress to vote for it."
 USA_banking_reform:0 "Banking Reform"
 USA_banking_reform_desc:0 "After closing down the banks, now we have to pass an Emergency Banking Act that allows then to reopen without any risks. In order to do that, we need the Federal Reserve Banks to issue additional currency on good assets, so that reopening banks meet their needs."
 USA_public_works_act_garner:0 "Public Works Act"
 USA_public_works_act_garner_desc:0 "Even though President Garner is not very fond of government intervention in the economy, the emergency situation of our country demands special measures. The public works bill that Garner presented in 1932, and Hoover vetoed, shall be now approved in order to reduce unemployment."
 USA_agricultural_subsidies_garner:0 "Agricultural Subsidies Act"
 USA_agricultural_subsidies_garner_desc:0 "In order to solve the crop prices problem, special subsidies shall be given to the farmers to compensate for their low income, without raising the prices for the consumer. This is another burden for the Federal Budget, but a necessary one."
 USA_relief_act_garner:0 "National Economic Relief Act"
 USA_relief_act_garner_desc:0 "Reluctantly, President Garner has decided to push for a Relief Bill that tackles the ever-growing slums issue. It shall give funds to impoverished areas, that will be used mainly for house construction but also to support those who have been left with nothing."
 USA_second_address:0 "A Second National Address"
 USA_second_address_desc:0 "The Garner Administration has taken several measures to fight the Depression, and perhaps it would be a good idea to address the American People again to detail what the Administration has done, and what are our plans for the future. Follow Roosevelt's vision, or perhaps seeking a different path...?"
 USA_realize_fdr_vision:0 "Realize Roosevelt's Vision"
 USA_realize_fdr_vision_desc:0 "Despite Garner's personal beliefs, we must stay true to the platform that we were elected on: the New Deal. Social Security, a more ambitious Housing Act, and an expansion of worker's rights, together with a minimum wage, must be on the table during the next 4 years."
 USA_our_own_path:0 "Our Own Path"
 USA_our_own_path_desc:0 "Now that Garner is the President of the United States, he has the opportunity of pursuing his own economic policy instead of Roosevelt's. This will probably alienate the New Dealers, so we must be careful with the implementation of Garner's Deal."
 USA_end_prohibition:0 "Ratify the 21st Amendment"
 USA_end_prohibition_desc:0 "One of the most urgent matters that we have to deal with right now is the issue of Prohibition. With the 21st Amendment being ratified by more and more states, we must pressure the rest so that the Amendment is put into effect and Prohibition becomes a thing from the past."
 USA_national_recovery_garner:0 "National Recovery Act"
 USA_national_recovery_garner_desc:0 "After a long negotiation, President Garner and the New Dealers have finally agreed on a National Recovery Act, aimed at lowering the extremely high unemployment that plagues the nation. Although Garner has prevented the inclusion of collective bargaining for unions into the Act, the creation of a National Recovery Administration and a Public Works Administration remain in the final draft of the Act."
 USA_tva_garner:0 "Tennessee Valley Authority"
 USA_tva_garner_desc:0 "During the 1932 Presidential campaign, Roosevelt had strongly argued for public ownership of public utilities, and the Tennessee Valley seems like a perfect place to put Roosevelt's promises into action. We only need to support Senator George Norris' (R-NE) plan and the TVA Act will get passed, hopefully revitalizing the Tennessee Valley economy."
 USA_glass_steagall:0 "Glass-Steagall Act"
 USA_glass_steagall_desc:0 "The Glass-Steagall Act, with the Vandenberg Amendment (that creates the Federal Deposit Insurance Corporation) was a point of contention between Roosevelt, who opposed it, and Garner, who supported it. Now we are completely free to pass it and try to reform the banking system further."
 USA_slash_tariffs:0 "Slash Tariffs"
 USA_slash_tariffs_desc:0 "The Democratic Party has always been the party of low tariffs, and they shall continue to be under the Garner Presidency. We can't isolate our markets from the rest of world."
 USA_discredit_long:0 "Discredit Long"
 USA_discredit_long_desc:0 "Huey Long and his Share our Wealth Party are nothing but a bunch of dangerous populist that will destroy America if the people believe their lies. We must attack Long whenever we have the chance."
 USA_denounce_sinclair:0 "Denounce Sinclair"
 USA_denounce_sinclair_desc:0 "Upton Sinclair is a dangerous socialist that has taken the California Democrats hostage. We must warn the American people that if people like Sinclair gain more power, freedom is in danger."
 USA_end_crime_wave:0 "End the Crime Wave"
 USA_end_crime_wave_desc:0 "The Crime Wave, one of the consequences of Prohibition, has its days numbered. We must reinforce the FBI in order to end this crime wave once and for all, and show the people that Garner protects Law and Order!"
 USA_break_strikes:0 "Break the Strikes"
 USA_break_strikes_desc:0 "Many unions are taking advantage of the economic situation to push for their radical, socialistic agenda. We must proceed firmly and strongly against the strikers before they are emboldened by their actions, and go further..."
 USA_decrease_regulations:0 "Decrease Regulations"
 USA_decrease_regulations_desc:0 "In order to protect our small and medium businesses, and secure their ability to create jobs, we shall pass an Act to lower regulations and give more freedom to the economy."
 USA_rural_relief_administration:0 "Rural Relief Administration"
 USA_rural_relief_administration_desc:0 "President Garner can't leave the farmers behind! In order to protect them from the Depression, and from the Dust Bowl, we shall create the Rural Relief Administration that will ensure that our farmers stay strong."
 USA_income_tax_reform:0 "Income Tax Reform"
 USA_income_tax_reform_desc:0 "The economic situation demands a balanced budget. We have made cuts, but now we need to increase our revenue, and that can be done by raising the income tax. This will be unpopular, but necessary."
 USA_unite_party_garner:0 "Unite the Party"
 USA_unite_party_garner_desc:0 "The New Dealers are defying us in Congress, and together with the Republicans they are trying to block every law we propose. We need to appeal to party unity to prevent a split and break the Congress deadlock."
 USA_limit_union_rights:0 "Limit Union Rights"
 USA_limit_union_rights_desc:0 "We need to act against the socialistic trade unions that are sabotaging our economic recovery. We can probably count on the Republicans for tha passage of an Act that severely limits union activity."
 USA_break_deadlock:0 "Break the Deadlock"
 USA_break_deadlock_desc:0 "Ever since we announced our new economic policy, New Dealers and Republicans have blocked the passage of almost every law in Congress. We need to appeal to patriotism and national unity to break this deadlock and activate our economy once and for all."
 USA_second_pwa:0 "Second Public Works Act"
 USA_second_pwa_desc:0 "The Public Works Act we passed at the start of our term had a pretty good effect on the economy, but time has passed and now we should prepare another Public Works Act, far more ambitious than the first one."
 USA_national_housing_garner:0 "National Housing Act"
 USA_national_housing_garner_desc:0 "We must continue the path laid out by the National Economic Relief Act and provide more funds for slum clearance and house construction. It is of utmost importance to give every hard-working American a roof for him and his family."
 USA_revenue_act:0 "Revenue Act"
 USA_revenue_act_desc:0 "Our new programs need funds, and the budget must remain balanced. In order to do so, we should consider raising taxes on the most wealthy citizens, as a patriotic effort in these times of crisis."
 USA_wpa_garner:0 "Works Progress Administration"
 USA_wpa_garner_desc:0 "Our work in the Public Works and the National Recovery Acts must not be left unfinished. We must pass another Act that creates the Works Progress Administration, an agency that will fight against the Depression through ambitious public works projects."
 USA_social_security_garner:0 "Social Security Act"
 USA_social_security_garner_desc:0 "Long negotiations between the Garner Administration and the New Dealers have finally come to an end after both sides reached an agreement on Social Security, one of Roosevelt's ambitions. Garner has accepted the old-age pensions, but has refused the unemployment subsidies; the New Dealers have demanded an increase in those pensions and additional aid to Dependent Children in return."
 USA_agricultural_compensation_act:0 "Agricultural Compensation Act"
 USA_agricultural_compensation_act_desc:0 "The situation in the countryside is still far from ideals, as farmers have not fully recovered from the crisis. We need to pass the Agricultural Compensation Act to increase subsidies, and enhace their management through a new government agency."
 USA_minimum_wage_act:0 "Minimum Wage Act"
 USA_minimum_wage_act_desc:0 "President Garner, after fighting bitterly against the minimum wage, has finally realized that it is in our best interest the passing of this measure, and has reluctantly agreed with the New Dealers on Minimum Wage Act draft. It will be set $0.25 per hour, for now, but it will not increase further as long as Garner is president, he has promised."
 USA_rural_electrification_act:0 "Rural Electrification Act"
 USA_rural_electrification_act_desc:0 "Despite our wealth and prosperity, there are still large parts of the country that have not been \"electrified\". A special funds will solve the issue, Garner and the New Dealers have agreed."
 USA_new_agenda_garner:0 "A New Agenda"
 USA_new_agenda_garner_desc:0 "With most of our proposals passed, we must plan new policies for the remainder of the term. We also need to plan our political strategy for the 1936 Presidential Election..."
 usa_conservative_coalition_garner:0 "We have chosen to form a §YConservative Coalition§!"
 usa_garner_alone:0 "We have chosen to §YSolidify our Conservative Base§!"
 usa_garner_moderates:0 "We have chosen to work with §Ymoderate Democrats and New Dealers§!"
 USA_garner_cons_coalition:0 "The Conservative Coalition"
 USA_garner_cons_coalition_desc:0 "Our cooperation with conservative Republicans in Congress seems to be going well, and there's no reason why it shouldn't continue. We also need to develop a strategy to hit back against the liberals and the longists."
 USA_cut_spending_garner:0 "Cut Spending"
 USA_cut_spending_garner_desc:0 "In order to keep the conservative Republicans pleased, we will cut our spending in the various relief and regulatory agencies, and properly balance the budget. This will be popular in some sectors of the South, the Northeast and the Great Plains, we hope."
 USA_red_scare_garner:0 "Reignite the Red Scare"
 USA_red_scare_garner_desc:0 "The New Deal Party leadership seems to be very vulnerable to the blunders and mistakes made by their progressive wing. It is time to restart the Red Scare in order to crush the surging progressives, and their liberal allies, and cement conservative rule."
 USA_destroy_longist_machine:0 "Destroy the Longist Machine"
 USA_destroy_longist_machine_desc:0 "Huey Long dares to challenge us in the Solid South?! Through violence, intimidation, lies and propaganda, we'll dismantle his party in every Southern state other than Louisiana, using the methods he used in his home state againts him. Painting him as an opponent of segregation will also be an effective attack that can break his party apart."
 USA_encourage_republican_dissidents:0 "Encourage Republican Dissidents"
 USA_encourage_republican_dissidents_desc:0 "Both progressive and conservative Republicans are dissatisfied with the mainstream, liberal leadership of their party, for different reasons. We need to promote this dissidents as much as we can, as 1912 can show us how ineffective is the GOP when disunited."
 USA_pro_business_policies:0 "Pro-Business Policies"
 USA_pro_business_policies_desc:0 "This agency-creating, spending-increasing policies will end now! Our path out of the crisis will be through the private sector, and through the private sector only. In order to do that, some lowered taxes and regulations are in order."
 USA_garner_democratic_ideal:0 "The Democratic Ideal"
 USA_garner_democratic_ideal_desc:0 "Despite the disputes, we can't stay away from the traditional Democratic agenda. Hearing to those that prefer helping the businesses rather than helping the people will be the death of our party."
 USA_fight_dust_bowl:0 "Fight the Dust Bowl"
 USA_fight_dust_bowl_desc:0 "Those areas affected by the Dust Bowl remain severely damaged, with economic, health and supply issues. We need to pass an Act to properly provide relief to this people."
 USA_it_wont_happen_here:0 "It Won't Happen Here"
 USA_it_wont_happen_here_desc:0 "The best way we can scare the people away from Long is by tying him with Mussolini and Hitler. If we make Long the American fascist, he will be relegated to the fringe of politics and stop being a threat to our power."
 USA_sideline_progressives:0 "Sideline Progressives"
 USA_sideline_progressives_desc:0 "Our continued work with moderates has left progressives sideline and useless. These \"Do-Nothing Reds\", as our propaganda will paint them, will hopefully see their support reduced."
 USA_party_hoover:0 "The Party of Hoover"
 USA_party_hoover_desc:0 "The Republicans think that the American people would forget about the disastrous Hoover Presidency in just 4 years? We need to call them \"The Party of Hoover\" constantly, associating the GOP with the Depression and hopefully preventing their return to power in a long time."
 USA_prohibit_price_discrimination:0 "Prohibit Price Discrimination"
 USA_prohibit_price_discrimination_desc:0 "Unfair prices is just a tool of the big businesses to prevent the growth of the smaller ones. We need to sign an Act that ensures that small businesses can prosper, as well."
 
 USA_president_robinson:0 "President Robinson"
 USA_president_robinson_desc:0 "Joseph T. Robinson and the New Deal Party have managed to win the 1936 Presidential Election, ousting President Garner and his lies. It is time to finally realize the legacy of Roosevelt and enact an economic policy that truly helps the people!"
 USA_decisive_action:0 "Decisive Action"
 USA_decisive_action_desc:0 "The state of the economy after 4 years of catastrophic conservative leadership is a disgrace. We need to take decisive action and force our economic programs through Congress, or recovery will never arrive."
 USA_the_ndp:0 "The New Deal Party"
 USA_the_ndp_desc:0 "Robinson is old and not very healthy. With him focused on the Presidency, we can use the NDP, political machine that has proven sucessful, to bring real progressive change to America... Or maybe we should ensure that we stay on the right track, as Liberalism is the only ideology that can bring real change."
 USA_the_moderate_compromise:0 "The Moderate Compromise"
 USA_the_moderate_compromise_desc:0 "Progressives within our party are making moves, seeking to take control of the NDP in the 1940 National Convention. These idealists are going to destroy the NDP and bring back a successor of Garner or Hoover, and we can't allow that. If we want to preserve the New Deal, we must strike a moderate tone on other issues."
 USA_talk_afl:0 "Support from the AFL"
 USA_talk_afl_desc:0 "The AFL supported Roosevelt in 1932, and our campaign in 1936. They staunchly opposed President Garner and are one of the key components of the New Deal Coalition, let us continue our prolific relationship."
 USA_appeal_centrist_dems:0 "Appeal to Centrist Democrats"
 USA_appeal_centrist_dems_desc:0 "Centrist Democrats, such as Senators Alben Barkley (KY) or Harry Truman (MO), have no place in a Democratic Party that has been consumed by conservatism. Let us expand our ranks with these moderates, that can also help countering the progressive surge."
 USA_contest_south:0 "Contest the South"
 USA_contest_south_desc:0 "The South isn't necessarily a lost cause. Several Southern politicians such as Truman or Bankhead are sympathetic to our policies, and President Robinson is a Southerner himself! If we manage to stop the progressive calls for Desegregation, we should be able to compete with Long and the Democrats in the South."
 USA_rebuild_roosevelt_coalition:0 "Rebuild Roosevelt's Coalition"
 USA_rebuild_roosevelt_coalition_desc:0 "Roosevelt's coalition of Union Workers, white Southerners, Catholics, Blacks and other demographics must be rebuilt. This will be an effective way at winning elections, and at destroying the Democratic conservatives."
 USA_congressional_primacy:0 "Dominate Congress"
 USA_congressional_primacy_desc:0 "With the centrist Democrats on our side, we should be able to gain complete control of Congress. We'll need a friendly Speaker and Majority Leader, and we'll be able to move forward!"
 USA_secure_midwest:0 "Secure the Midwest"
 USA_secure_midwest_desc:0 "The Midwestern states of Illinois, Wisconsin, Michigan, Indiana and Ohio are vital for our political strategy. We can't let the Republicans or the Democrats to win back these states, so we'll work with local unions and organizations to ensure that the Midwest becomes our strongest support base."
 USA_compromise_progressives:0 "Compromise with Progressives"
 USA_compromise_progressives_desc:0 "Progressives such as Henry Wallace or Senator LaFollete are a thorn on our side, constantly questioning our policies and exposing our party to conservative attacks. We need a comprehensive agreement with Progressives so that they stop complaining and join forces with our Administration once and for all."
 USA_ensure_party_discipline:0 "Ensure Party Discipline"
 USA_ensure_party_discipline_desc:0 "The New Deal Party began as a loose group of Congressmen, but we need to transform it into a cohesive unit. Progressives and centrists can't continue critizising our Administration, Congressmen can't continue breaking ranks with Republicans or Democrats, and ideological fights inside the Administration shall stop. We need discipline if we want to deliver our promises."
 USA_reunite_party:0 "Reunite the Party"
 USA_reunite_party_desc:0 "America's political system can't support 3 parties, and the Republicans will gain supremacy as soon as they get rid of the Hoover memories as long as the Democratic vote is divided. We shall approach the Democrats, and reunite the Party on our terms. That means that the Democratic Party will openly embrace the New Deal, and together we'll be able to deny the Republicans any chance for the next decade or so."
 USA_a_new_party:0 "A New Party"
 USA_a_new_party_desc:0 "Both Republicans and Democrats share the title of \"The Party of the Depression\", while under our Administration the nation has started to recover. We need to solidify the New Deal Party into the future, and if any of the 2 old parties can't keep up with the times, then they'll rightly fade away. We are here to stay!"
 USA_the_progressive_cause:0 "The Progressive Cause"
 USA_the_progressive_cause_desc:0 "Progressives were denied any place in the 1936 ticket, but while the moderates burn their political capital in the White House, we can start using the sucessful NDP to push for our agenda. And once the American people have learned that our cause is just, they'll make sure that it is a Progressive, and not a moderate, the winner of the 1940 Election."
 USA_talk_cio:0 "Support from the CIO"
 USA_talk_cio_desc:0 "While moderates seem to prefer going back to the AFL for support, we can try talking to the CIO instead. It's new, dynamic leadership seems much more determined to make real change in this country, and challenging the moderates at the union level might be the first step of the attraction of the worker vote to the progressives."
 USA_appeal_prog_reps:0 "Appeal to Progressive Republicans"
 USA_appeal_prog_reps_desc:0 "Remnants of Roosevelt's and LaFollete's Progressive parties still linger within the Republican ranks, specially in the Northeast. We should work to attract those politicians to the NDP, increasing our influence inside of the party and weakening the corrupt Republicans."
 USA_anti_lynching_act:0 "Anti-Lynching Act"
 USA_anti_lynching_act_desc:0 "In order to keep our camapaign promises and to win the Black vote, we shall push for a comprehensive Anti-Lynching Act that can finally end this horrendous practice. All our citizens, no matter their skin color, deserve a fair trial, and we can't call ourselves the true Land of Free until this is sorted out."
 USA_civil_rights_agenda:0 "The 5 Points Manifesto"
 USA_civil_rights_agenda_desc:0 "An Anti-Lynching Act is only a small part of the race problem. We shall write a 5 Point Manifesto, including: the end of lynching, the desegregation of the Armed Forces, the end of disenfranchisement, the desegregation of schools, and the destruction of the Klan and other racist organizations. Hopefully we can slowly introduce these measures in Congress."
 USA_forging_new_coalition:0 "Forging a New Coalition"
 USA_forging_new_coalition_desc:0 "The inclusion of white Southerners in our coalition can only make us hostages of racism. If we replace them with Northeastern liberals, while keeping Catholics, Union Workers and the other components of Roosevelt's coalition, we'll be able to push for a truly progressive agenda, free of any Southern pressure."
 USA_rural_appeal:0 "Rural Appeal"
 USA_rural_appeal_desc:0 "Henry A. Wallace, a newly elected Senator from Iowa and one of the main Progressive leaders, has written the \"Manifesto on a Fair Agriculture\", that defends subsidies and other government measures in order to keep the farmers afloat. We shall endorse these policies and campaign across the more rural states, winning support for the Progressive cause."
 USA_secure_northeast:0 "Secure the Northeast"
 USA_secure_northeast_desc:0 "New England and the rest of the Northeast have been Republican strongholds since Lincoln's victory in 1860, but with conservatives taking over the GOP, and Progressive Republicans joining our side, it looks like we'll be able to seriously challenge the Republicans in this region. Securing the Northeast while keeping the Midwest and the West Coast would make our victory in Presidential Elections easier."
 USA_merge_minor_parties:0 "Integrate the Minor Parties"
 USA_merge_minor_parties_desc:0 "The Farmer-Labor Party and the Wisconsin Progressive Party have been allied with the New Deal Party since it was founded, but now they must be directly integrated into it. With the entry of these like-minded progressives into the Party we'll reduce moderate influence even more!"
 USA_choosing_new_leadership:0 "New Party Leadership"
 USA_choosing_new_leadership_desc:0 "The time has come to finally make our move. We'll replace the NDP National Committee with loyal progressives, and try to secure as many state delegations as possible in order to dominate the 1940 National Convention. Moderates will have to accept this, or leave!"
 USA_the_progressive_party:0 "The Progressive Party"
 USA_the_progressive_party_desc:0 "The New Deal Party was an useful platform to win the 1936 Elections, but we need to be more ambitious. With our control over the NDP apparatus, we'll rename it to \"Progressive Party\" and adopt a far more ambitious platform than the 1936 one. This new party will defeat the corrupt Republicans and Democrats and secure a bright future for the American people!"
 USA_brain_trust:0 "Reassemble the Brain Trust"
 USA_brain_trust_desc:0 "The Brain Trust, as the group of experts that helped Roosevelt with his economic policies was known, must be reassembled and put to work under the new Administration. We could really use their advice."
 USA_gold_reserve_act:0 "Gold Reserve Act"
 USA_gold_reserve_act_desc:0 "If we gain control of gold prices, and we increase it, the dollar will be devaluated and gold production will be encouraged. Such as measure would be very positive for the economy, so it must be enacted as soon as we can."
 USA_recovery_pw_act:0 "National Recovery and Public Works Act"
 USA_recovery_pw_act_desc:0 "Garner's Public Works Acts were positive, but unambitious, and only tackled the unemployment problem partially. We'll need a far-reaching Act to create more ambitious public works programs, and to introduce some industrial regulations into our economy."
 USA_industry_act_rob:0 "Industry Act"
 USA_industry_act_rob_desc:0 "A comprehensive Industry Act, that updates and increases regulations, promotes economic growth and decreases unemployment is sorely needed, and both Republicans and Democrats in Congress seem willing to help us write and pass one."
 USA_securities_act:0 "Securities Act"
 USA_securities_act_desc:0 "In order to avoid any future crisis like the one of 1929, we shall increase the information available to those who want to buy securities, and make the whole process overall safer and more regulated."
 USA_revenue_act_robinson:0 "Revenue Act"
 USA_revenue_act_robinson_desc:0 "It might be a bit blunt, but if we want to afford the programs that America badly needs, our most wealthy citizens will have to pay more than they do right now in taxes. It won't be popular, but necessary for the lower classes."
 USA_fair_labor_standards:0 "Fair Labor Standards Act"
 USA_fair_labor_standards_desc:0 "Everything that we proposed during Garner's term and was refused by him regarding labor must be added into a single labor bill, and get passed through Congress. That includes collective bargaining, a minimum wage, the creation of the National Labor Relations Board, and more. If unions are strong, workers will be better off overall."
 USA_social_security_act_robinson:0 "Social Security Act"
 USA_social_security_act_robinson_desc:0 "One of Long's points during the campaign was the implementation of the Townsend plan, and the idea certainly has merit. However, it shall be expanded to become a full-fledged Social Security program like most other developed nations have."
 USA_provide_people:0 "A New Relief Plan"
 USA_provide_people_desc:0 "The unemploymed and impoversihed masses that elected us as their only hope must be given relief and opportunities in this new world. We won't allow slums, hunger and misery to continue plaging our great nation!"
 USA_hosuing_dev_act:0 "Housing and Development Act"
 USA_hosuing_dev_act_desc:0 "After many attempts, we are finally ready for a housing bill that ends the slum problem by giving subsidies to private house construction and creates additional public housing programs, in addition of funds for urban development and improvements that will improve everyone's living conditions."
 USA_food_stamp_act:0 "Food Stamp Act"
 USA_food_stamp_act_desc:0 "In order to prevent hunger and ensure that all Americans have something to eat, we shall create the Food Stamp program. With a big amount of funds, it could be the solution to many of our citizens' problems."
