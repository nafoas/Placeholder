 unitedstates.153.t:0 "Republican National Convention"
 unitedstates.153.d:0 "Today we are holding our National Convention in Philadelphia to pick our nominees for the upcoming Presidential election. However, there is little to discuss, as President [USA.GetLeader] and his Vice-President have both expressed their intentions of seeking a second term. Mostly unchallenged, the Convention renominated both without incidents."
 unitedstates.153.a:0 "Four more years!"
 unitedstates.154.t:0 "Democratic National Convention"
 unitedstates.154.d:0 "Today the Democrats have held their National Convention in Philadelphia, where they have chosen their candidates for the upcoming Presidential Election. Senator Harry Truman, a leading New Dealer, secured the nomination, and picked Alben Barkley, another liberal, as his running mate. They could pose a significant challenge in November."
 unitedstates.154.a:0 "They are going to lose!"
