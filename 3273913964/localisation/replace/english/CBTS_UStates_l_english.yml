 usfor.1.t:0 "The USA demands repayment of tsarist debts!"
 usfor.1.d:0 "After recognizing our country, the United States have demanded the full repayment of the loans the tsar took during the Empire's final years. Of course, we don't need to pay them, and the US is not in a position to force us to pay either."
 usfor.1.a:0 "You know what? We'll pay them."
 usfor.1.b:0 "Hmn... no"
 usfor.2.t:0 "The Soviets Accept"
 usfor.2.d:0 "Unexpectedly, the USSR has accepted to repay the Tsar's debts with us. A weird diplomatic victory for us, but still good."
 usfor.2.a:0 "So it really worked?"
 usfor.3.t:0 "The Soviets Refuse"
 usfor.3.d:0 "As we expected, the USSR has refused to pay back the tsarist debts. We had no high hopes with this either."
 usfor.3.a:0 "We had to try."
 usfor.4.t:0 "The USA proposes an anti-espionage treaty"
 usfor.4.d:0 "After recognizing our country, the USA wants to strenghten our cooperation, and the argue that to do so, american and soviet spies in each other's soil should be removed or limited in scope and number. Shall we accept this proposal?"
 usfor.4.a:0 "The less americans here, the better!"
 usfor.4.b:0 "We'd like to keep our people in Washington." 
 usfor.5.d:0 "Good news! The USSR has accepted our anti-espionage proposal, and now we can work to strenghten our relations with them and our internal security."
 usfor.5.a:0 "Great!"
 usfor.6.d:0 "Bad news! The USSR has rejected our anti-espionage treaty proposal, freezing our cooperation initiatives and forcing us to strenghten our internal intelligence measures."
 usfor.6.a:0 "Russians can't be trusted"
 usfor.7.t:0 "The USA offers help with air production"
 usfor.7.d:0 "Concerned about expansionism in Europe, the US President [USA.GetLeader] has offered support in the task of building a strong airforce. As per the agreement, american factories shall help our military production, while we receive technical help."
 usfor.7.a:0 "All help is welcome!"
 usfor.8.t:0 "Buy guns from the USA?"
 usfor.8.d:0 "With the recent revision of the Neutrality Acts, the United States can sale arms to war belligerents again, and they are especially interested in selling weapons to us, wishing to help us in our struggle. These sales would be done in a cash-and-carry basis, and could provide a needed boost to our weapon supply."
 usfor.8.a:0 "We'll take the offer!"
 usfor.8.b:0 "We don't need any help to win!"
 usfor.9.t:0 "Help Republican Spain?"
 usfor.9.d:0 "The legitimate government of Spain is fighting a military rebellion of fascist inspiration. While Neutrality Acts forbid our intervention, we can secretly sneak some planes to support the Republican Government. However, we risk loosing catholic voters and alienating Congress if we did this."
 usfor.9.a:0 "Democrats across the globe have our support!"
 usfor.9.b:0 "We must follow the Neutrality Acts"
 usfor.10.t:0 "American help arrives!"
 usfor.10.d:0 "Great news! A shipment of American planes has just arrived, helping us in our fight for the Spanish skies. This provides an important morale boost to the dissapeared liberals, and shows us that there are democratic governments that still care about their ideology."
 usfor.10.a:0 "We'll use it to crush the fascists!"
 usfor.11.t:0 "American Support"
 usfor.11.d:0 "After their decision to stand with anti-imperialism and thus with our cause, the USA has sent some infantry equipment, constrained as it is by their Neutrality Acts. The promise more help and more hostile actions against Japan in the future."
 usfor.11.a:0 "Imperialism shall be beaten!"
 usfor.12.t:0 "American Embargo"
 usfor.12.d:0 "After speaking against us due to our intervention in China, the US Government has decided to ban all exports to our Empire, cutting our resource lifeline. We need to quickly find a solution, such as find oil elsewhere, or we'll run out of fuel."
 usfor.12.a:0 "Filthy Americans!"
 usfor.13.a.tt:0 "§GWe will receive 50 destroyers in exchange for the bases!§!"
 usfor.13.t:0 "A proposal for the British"
 usfor.13.d:0 "PLACEHOLDER text. We will send a proposal to the UK where we ask for a lease of some military bases in Trinidad, Bermuda and Newfoundland."
 usfor.13.a:0 "Go ahead"
 usfor.14.t:0 "Americans propose lease"
 usfor.14.desc:0 "PLACEHOLDER. Wanting to help us in our fight against enemy submarines, the USA has proposed a lease in several territories and colonies in the western Indies; such as in Newfoundland, Jamaica, Bermuda and British Guiana. They would get military bases on those islands while we would not recieve much in return. What shall be our response?"
 usfor.14.a:0 "Reject the offer, demand something inmediate in return"
 usfor.15.t:0 "The UK refuses"
 usfor.15.d:0 "PLACEHOLDER text. The British have rejected our proposed lease of military bases. They demand something in return."
 usfor.15.a:0 "We wont give you anything (Historical)"
 usfor.15.b:0 "Accept the counteroffer (Earlier DfB deal)"
 usfor.16.t:0 "The Good Neighbor Fleet"
 usfor.16.d:0 "The United States have decided to create a new maritime passanger line between New York and Buenos Aires to promote their Good Neighbor Policy. Luckily for us, the line will stop in one of our cities, giving us potential to expand naval infraestructure there."
 usfor.16.a:0 "Expand the ports!"
 usfor.17.t:0 "Isolationists demand withdrawal from the Philippines"
 usfor.17.d:0 "After passing the Lundlow Amendment, isolationists in Congress have won absolute control over foreign political agenda. These past days they've been raising concerns over the status of the Philippines. They demand a full withdrawal from the archipielago, leaving the Philippine Republic completely free from US troops. Complying may grants us the support we need to pass other Acts, so we might want to think about it..."
 usfor.17.a:0 "Let's examine the issue..."
 usfor.18.t:0 "Isolationists demand withdrawal from the Caribbean"
 usfor.18.d:0 "After passing the Lundlow Amendment, isolationists in Congress have won absolute control over foreign political agenda. Now they are demanding us to reconsider our situation in the Caribbean, with the Guantanamo Bay, Panama Canal and Puerto Rico being questioned. They demand to act quickly, and it might best to comply."
 usfor.18.a:0 "Let's see..."
 usfor.19.t:0 "Withdrawing from the Caribbean?"
 usfor.19.d:0 "A heated debate has begun in the government when we announced our intentions of withdrawing from the Caribbean, concerning the status of the Panama Canal. Many consider that the strategic and economical advantages of holding the Canal outweight the political costs that defying the isolationists would entail. Now it is time for the President to decide..."
 usfor.19.a:0 "Withdrawal means withdrawal!"
 usfor.19.b:0 "Let's keep the Canal"
 usfor.20.t:0 "Isolationists demand to appease the Germans"
 usfor.20.d:0 "Concerned by the growing strength of Germany and the potential threat that represents for our security, isolationists in Congress are demanding to sign a treaty with Germany, consisting in a trade agreement and a non-agression pact, to remove that threat for now."
 usfor.20.a:0 "We'll think about it"
 usfor.21.t:0 "Isolationists demand a treaty with the USSR"
 usfor.21.d:0 "Concerned by the strength of the Soviet Union, many isolationists in Congress are demanding that we sign a non-agression pact with them in order to preserve our security. Should we do it?"
 usfor.22.t:0 "Isolationists demand to appease Japan"
 usfor.22.d:0 "Concerned by the agressive policy that Japan has been following, isolationists are dead-set on avoiding a war with the Japanese Empire. They think that if we sign a free trade deal and a non-agression pact, they'll have the resources they nedd and they won't attack us. Should we try to do it?"
 usfor.23.t:0 "Isolationists demand a treaty with the UK"
 usfor.23.d:0 "In order to boost our economy and secure our borders, isolationists in Congress are demanding a free trade deal and a non-agression pact with the United Kingdom. Should we follow their advice?"
 usfor.24.t:0 "Isolationists demand a treaty with France"
 usfor.24.d:0 "Wanting to improve our economy and secure bonds with the French Republic, isolationists are proposing that we sign a trade deal and a non-agression pact with France. Now we have to decide if we want to follow this policy..."
 usfor.25.t:0 "The United States proposes a trade deal"
 usfor.25.d:0 "Following their new extreme-isolationist policy, the United States of America has proposed a trade deal and a non-agression pact between our two nations. This may give us the resources we need, so it may be a good idea to accept."
 usfor.25.a:0 "We'll sign the treaty!"
 usfor.25.b:0 "Nonsense"
 usfor.26.t:0 "Our proposal has been accepted!"
 usfor.26.ger.d:0 "Good news! The Germans have accepted our trade + non agression proposal. The Secretary of State is already preparing his flight to Berlin to make it official."
 usfor.26.jap.d:0 "Good news! The Japanese have accepted our trade + non agression proposal. The Secretary of State is already preparing his flight to Tokyo to make it official."
 usfor.26.sov.d:0 "Good news! The Soviets have accepted our non agression proposal. The Secretary of State is already preparing his flight to Moscow to make it official."
 usfor.26.fra.d:0 "Good news! The French have accepted our trade + non agression proposal. The Secretary of State is already preparing his flight to Paris to make it official."
 usfor.26.eng.d:0 "Good news! The British have accepted our trade + non agression proposal. The Secretary of State is already preparing his flight to London to make it official."
 usfor.26.chi.d:0 "Good news! The Chinese have accepted our trade + non agression proposal. The Secretary of State is already preparing his flight to Nanjing to make it official."
 usfor.26.can.d:0 "Good news! The Canadians have accepted our trade + non agression proposal. The Secretary of State is already preparing his flight to Ottawa to make it official."
 usfor.26.a:0 "That's great"
 usfor.27.t:0 "Our proposal has been rejected"
 usfor.27.ger.d:0 "Bad news! The proposal for a trade deal and a non-agression pact we sent to Berlin has been rejected by the Germans. At least isolationists know we tried."
 usfor.27.jap.d:0 "Bad news! The proposal for a trade deal and a non-agression pact we sent to Tokyo has been rejected by the Japanese. At least isolationists know we tried."
 usfor.27.sov.d:0 "Bad news! The proposal for a non-agression pact we sent to Moscow has been rejected by the Soviets. At least isolationists know we tried."
 usfor.27.fra.d:0 "Bad news! The proposal for a trade deal and a non-agression pact we sent to Paris has been rejected by the French. At least isolationists know we tried."
 usfor.27.eng.d:0 "Bad news! The proposal for a trade deal and a non-agression pact we sent to London has been rejected by the British. At least isolationists know we tried."
 usfor.27.chi.d:0 "Bad news! The proposal for a trade deal and a non-agression pact we sent to Nanjing has been rejected by the Chinese. At least isolationists know we tried."
 usfor.27.can.d:0 "Bad news! The proposal for a trade deal and a non-agression pact we sent to Ottawa has been rejected by the Canadians. At least isolationists know we tried."
 usfor.27.a:0 "Damn"
 usfor.28.d:0 "The United States, following their new extreme isolationist policy, have proposed a trade deal and a non-agression pact between our two countries. This would greatly help with our resource shortage, so it may be a good idea to accept, even though we would renounce to the US Pacific possessions."
 usfor.29.t:0 "The United States proposes a non-agression pact"
 usfor.29.d:0 "After recognizing us in 1933, the Americans want to strenghten our relationship with a non-agression pact that would help to improve global security. Should we sign this pact with the capitalists? We have nothing to lose."
 usfor.30.d:0 "The USA, wanting to focus inward, are trying to secure as many non-agression pacts as possible. Now they have proposed this to us, combined with a trade deal that may boost our economy. Should we accept?"
 usfor.31.d:0 "Wanting to focus inward, the USA have proposed a trade deal and a non-agression pact with us. While we expected more american help against the totalitarian menace, maybe we should sign it and gain access to American resources."
 usfor.32.d:0 "The USA wants to focus inward, refusing to provide any help against Japan. However, they propose a trade deal and a non-agression pact that would improve relations between our two nations. While we would prefer a stronger committment, the deal would entail more extensive access to American resources, so maybe we should sign it."
 usfor.33.d:0 "Our southern neigbour wants to be left alone in the world, so one of their priorities is securing its only land borders. While they are trying to appease Mexico with the Good Neigbor Policy, they have proposed us ha non-agression pact and a trade deal, that would boost our economy and secure the border. Should we do it?"
 usfor.34.t:0 "Further American support"
 usfor.34.d:0 "The United States seem decisively committed to our victory against the Japanese agressor. They have send a big shipment containing lots of equipment: handguns, ammunition, grenades, artillery, medical equipment and trucks. Some american advisors are also here, ready to help us to improve our army."
 usfor.34.a:0 "Perfect"
 usfor.35.t:0 "The US supports China!"
 usfor.35.d:0 "Troubling news arrive from Washington DC, as the USA has decided to officially support China in their war against us, sending them equipment and advisors."
 usfor.35.a:0 "We'll still win!"
 usfor.36.t:0 "The Flying Tigers"
 usfor.36.d:0 "More help arrives from the USA, as they have sent a group of pilots, with their planes, to assist us in our war against Japan. They are called the American Volunteer Group, although everyone knows them as the Flying Tigers."
 usfor.36.a:0 "Welcome aboard!"
 usfor.37.t:0 "American Sanctions"
 usfor.37.d:0 "The USA have announced this morning the approval of harsh sanctions against our Empire, something that may cripple our economy unless we find more resources. We need to act, somehow."
 usfor.37.a:0 "Those bastards!"
 usfor.38.t:0 "American help arrives!"
 usfor.38.d:0 "The USA's new interventionist foreign policy has played in our favour, as they have decided to help us destroy the Soviet Regime. A shipment of guns, trucks and cannons has arrived to our ports, together with some military advisors."
 usfor.38.a:0 "Good news!"
 usfor.39.t:0 "The American Volunteer Group"
 usfor.39.d:0 "In order to secure our control of the skies, the United States have decided to send a group of volunteer pilots to help us in our rightful war. They will also provide the planes."
 usfor.39.a:0 "Great!"
 usfor.40.t:0 "American help arrives!"
 usfor.40.d:0 "Americans have finally seen the light and decided to help us in our Holy Crusade, sending guns and advisors to Vladivostok. We will make good use of them."
 usfor.40.a:0 "We can't lose!"
 usfor.41.t:0 "Help the fascists?"
 usfor.41.d:0 "Russian fascists have managed to gain control over the port of Vladivostok, and that has led to some advisors suggesting that, following our policy of sending help to White Russians, we help the fascists as well. However, our political advisors are concerned about the effect that could have in our popularity ratings. After all, fascism is very unpopular..."
 usfor.41.a:0 "Send them guns to smash the reds!"
 usfor.41.b:0 "On a second thought, that's not a very good idea"
 usfor.42.t:0 "Demands from the USA"
 usfor.42.d:0 "American good intentions have dissapeared since we won the war. They now claim that all the aid they provided was not free, and they demand a repayment, a sum of money that we, with the economy destroyed by the civil war, cannot pay. Americans have proposed then a series of concessions to them, from factories to resources, to consider our debts payed. If we refuse, they threaten with an economic war..."
 usfor.42.a:0 "We have no choice but to accept..."
 usfor.43.t:0 "American support arrives!"
 usfor.43.d:0 "With our hard resistance against the Italian imperialists going on for some time now, the international community has finally come to our help, the USA to be exact. A shipment of guns and planes, together with a group of advisors has arrived to our capital, ready to help us in our fight."
 usfor.43.a:0 "Now crush the imperialists!"
 usfor.44.t:0 "The Spanish Civil War"
 usfor.44.d:0 "Free of the shackles of the Neutrality Acts, we are free to intervene in the Spanish Civil War. We could support the legal government, that faces a military revolt with fascist inspiration, or the rebels themselves, that have already gained support from American companies like TEXACO. We have to decide."
 usfor.44.a:0 "We shall keep republicans away from communism!"
 usfor.44.b:0 "The nationalists need our help against the red hordes!"
 usfor.45.t:0 "American fuel shipments!"
 usfor.45.d:0 "We have already received fuel from the American company TEXACO, but now it is the US Government the one sending it. They cite our anti-communism and the anarchy in the red side as the reasons of their support."
 usfor.45.a:0 "Their support is welcome!"
 usa_scw_reps:0 "Supports the Republicans"
 usa_scw_nats:0 "Supports the Nationalists"
 usa_mexico_refuse_oil:0 "Mexico refused to give up the oil"
 usfor.46.t:0 "The USA demands our oil"
 usfor.46.d:0 "In line with their new interventionist policies, the USA has decided to secure our oil for themselves. They have sent us a list of demands, including the seizure of all our oil extraction sites by american companies, with full support from their government. Of course, the most sensible thing would be refusing this absurd request, but who knows what the US may have prepared..."
 usfor.46.a:0 "The Yanquis can have it!"
 usfor.46.b:0 "Tell the americans to stick their demands up to their..."
 usfor.47.t:0 "Mexico accepts!"
 usfor.47.d:0 "Great news! Mexico has wisely decided to accept our demands and grant our companies their oil extraction rights. With the mexican oil secured, we can now look to to the rest of the Americas"
 usfor.47.a:0 "They know what's best for them..."
 usfor.48.t:0 "Mexico refuses!"
 usfor.48.d:0 "As we expected, the Mexican Government has decided to refuse our list of demands. They say it is a burd attempt at imperialism and that they are ready for anything."
 usfor.48.a:0 "We'll have to do something about this..."
 usfor.49.t:0 "Incident in the Mexican border!"
 usfor.49.d:0 "Alarming reports arrive from our southern border! Apparently, groups of mexican nationalists and soldiers have tried to assault several border outposts, killing some of the guards and causing great material damage. Although this information is obviously not true, the press is already transforming it into reality. With a valid motive, and in the defensive side, Congress has reluctantly approved an official Declaration of War against Mexico. The people look less enthusiastic about it though..."
 usfor.49.a:0 "Convenient"
 usfor.50.t:0 "Defeat in Mexico!"
 usfor.50.d:0 "Our brave troops have been unable to force a Mexican surrender in 2 years. The people are tired, the death count grows, and the war industry is showing signs of recession and even bankrupcy! In order to avoid massive anti-war riots, we'll have to seek a white peace."
 usfor.50.a:0 "How!?"
 usfor.51.t:0 "Victory against the United States!"
 usfor.51.d:0 "Good news! Our brave soldiers have managed to fight the horde of Yanqui soldiers, led by their corrupt and imperialist plutocratic elite, that sacrificed many lives just for our oil. The Americans have just offered a white peace and began their withdrawal from our lands, while our victorious troops celebrate the news on the front before the great military parade that we are planning in a few days in Mexico D.F. We are victorious!"
 usfor.51.a:0 "Viva México Cabrones!"
 usfor.52.t:0 "Military Coup!"
 usfor.52.d:0 "Several generals are trying to coup the legitimate government! Apparently, they are funded by the USA, hoping that they grant them access to our oil reserves."
 usfor.52.a:0 "The coup succeeds!"
 usfor.52.b:0 "The coup fails!"
 usfor.53.t:0 "Mexican Coup Successful!"
 usfor.53.d:0 "Good news! The coup we planned in Mexico has triumphed over the old government, and in return they are now ready to let us increase our influence in Mexico."
 usfor.53.a:0 "Great!"
 usfor.54.t:0 "Mexican Coup fails!"
 usfor.54.d:0 "Bad news! The coup we planned in Mexico has failed, and their members have been executed. Our plans have also been revealed, destroying our international reputation."
 usfor.54.a:0 "Damn"
 usfor.55.t:0 "American Demands"
 usfor.55.d:0 "Seeking to assert their position in the Western Hemisphere, the United States have sent us a list of demands, from a forced guarantee to military access, docking rights and diplomatic submission. Shall we accept?"
 usfor.55.a:0 "We have to accept"
 usfor.55.b:0 "We won't surrender our sovereignty"
 usfor.56.t:0 "America proposes a trade deal"
 usfor.56.d:0 "Seeking to improve ties between our two countries, the United States have proposed to sign a trade deal between our Republics, something that could be potentially beneficial to both economies. Shall we accept?"
 usfor.56.a:0 "Let us trade with the gigant!"
 usfor.56.b:0 "We don't want economic interferences!"
 usfor.57.t:0 "France accepts the trade deal!"
 usfor.57.d:0 "It seems that the French have eagerly accepted our trade deal offer. This will bring benefits to both nations."
 usfor.57.a:0 "Excellent"
 usfor.58.t:0 "France refuses to sign a trade deal!"
 usfor.58.d:0 "Shocking news arrive from France, as they have rejected our trade proposal. Foolish protectionism will only harm them..."
 usfor.58.a:0 "We don't need them anyway"
 usfor.59.t:0 "Alliance with the US?"
 usfor.59.d:0 "Seeking to join our alliance, the United States have sent a formal petition to our Foreign Ministry. Apparently, they want to help us in our struggle against totalitarians."
 usfor.59.a:0 "We welcome them!"
 usfor.59.b:0 "We can't trust the Americans"
 usfor.60.t:0 "France refuses our proposal"
 usfor.60.d:0 "Surprisingly, France has refused to sign an alliance with us."
 usfor.60.a:0 "Screw them"
 usfor.61.t:0 "Alliance with the US?"
 usfor.61.d:0 "After their attempts at building closer ties between our nations, the US has gone further, proposing a military alliance between our countries. Shall we accept?"
 usfor.61.a:0 "Of course!"
 usfor.61.b:0 "We can't trust them"
 usfor.62.t:0 "Great Britain refuses!"
 usfor.62.d:0 "Apparently they can't trust our great Union, it was a mistake to ask in the first place..."
 usfor.62.a:0 "Ungrateful idiots!"
 usfor.63.t:0 "The US proposes naval cooperation"
 usfor.63.d:0 "The United States have proposed to coordinate our fleets with joint exercises and admiral talks, in order to improve them both and secure our rule over the seas. Shall we accept?"
 usfor.63.a:0 "Of course!"
 usfor.63.b:0 "Only Britannia rules the waves!"
 usfor.64.t:0 "The British accept our proposal"
 usfor.64.d:0 "Good news! The UK has accepted our proposed deal. Our relations have been greatly improved."
 usfor.64.a:0 "Good"
 usfor.65.t:0 "The British reject our proposal"
 usfor.65.d:0 "Shockingly, Britain has decided to reject our proposed deal. They prefer to go on without our support on that field."
 usfor.65.a:0 "Bad decision"
 usfor.67.t:0 "The US proposes an arms trade deal"
 usfor.67.d:0 "Concerned about the state of the world, the USA has proposed a trade deal focusing specifically on military equipment, that would serve to strenghten both countries' war industry. Should we accept?"
 usfor.67.a:0 "It's a good idea"
 usfor.67.b:0 "Never!"
 usfor.68.t:0 "Invitation to the Monroe Alliance"
 usfor.68.d:0 "Seeking to expand their influence in the region, the USA has invited us to their alliance. Shall we accept?"
 usfor.68.a:0 "We will accept!"
 usfor.68.b:0 "We won't bow to imperialism!"
 usfor.69.t:0 "Our proposal rejected"
 usfor.69.d:0 "Sadly, our latest proposal to invite a South American country to the Monroe Alliance has been rejected. We'll have to find other allies..."
 usfor.69.a:0 "Damn"
 usfor.70.t:0 "Pro-American Coup!"
 usfor.70.d:0 "Troubling news! A group of pro-american army officers have risen up against up against our government, and they are fighting loyal units in our capital! Who knows what will happen..."
 usfor.70.a:0 "The coup succeeds!"
 usfor.71.b:0 "The coup fails!"
 usfor.71.t:0 "Failed coup attempt!"
 usfor.71.d:0 "Our initiative to sponsor a military coup in South America has been rebuffed by loyalist forces, and to make things worse our involvement in the coup has been discovered."
 usfor.72.t:0 "Invitation to the United Nations"
 usfor.72.d:0 "The United States have decided to destroy totalitarian dictatorships in Europe, and they want our support! Should we violate our neutrality, or maybe agreeing is the best way to protect ourselves..."
 usfor.72.a:0 "They can count on us!"
 usfor.72.b:0 "An absurd adventure."
 
 usfor.73.t:0 "Japan attacks Pearl Harbor!"
 usfor.73.d:0 "The Japanese have attacked the Pearl Harbor naval base! The Imperial Japanese Navy Air Service launched a raid against our Pacific Fleet stationed in the base, located in Honolulu, Hawaii, in order to cripple our fleet for the coming conflict. Some of our ships have been sunk, 188 planes have been destroyed, 159 damaged, and 2335 people have died in the raid. This unlawful attack can't go unpunished."
 usfor.73.a:0 "If Japan wants a war, let's give them one."
 usfor.74.t:0 "President [USA.GetLeader] adresses Congress"
 usfor.74.d:0 "\"Yesterday, [?Global.date.GetDateStringNoHourLong] — a date which will live in infamy — the United States of America was suddenly and deliberately attacked by naval and air forces of the Empire of Japan.\" \n\nThose were the first words of President [USA.GetLeader] in the speech delivered to a Joint Session of the US Congress, the day after the attack on Pearl Harbor, answering the Japanese declaration of war. The speech itself was short, lasting only 7 minutes, and detailing the recent hostile actions undertaken by the Japanese government. 33 minutes after the speech, Congress decided, with only one vote against, to declare war on the Empire of Japan."
 usfor.74.a:0 "...with the unbounding determination of our people, we will gain the inevitable triumph!"
 
 usfor.75.t:0 "The Doolittle Raid"
 usfor.75.d:0 "In order to retaliate against Japanese attacks, Lieutenant Colonel James Doolittle was tasked with planning and leading a bombing raid on the Japanese mainland. Sixteen bombers have attacked Tokyo and landed in China and the USSR, with some of them being captured and executed. Despite the little material damage done, this has been a major propaganda victory for us, greatly boosting our morale."
 usfor.75.a:0 "A great success!"
 usfor.76.t:0 "The Doolittle Raid"
 usfor.76.d:0 "The Americans have decided to strike back after our decisive victories, and they have sent sixteen bombers to Tokyo in order to disrupt our industry and infraestructure. However, their pathetic attempt has failed, as little to no damage was caused. Despite this the attack seems to have boosted their morale greatly."
 usfor.76.a:0 "They must be desperate!"
 usfor.77.t:0 "American Support"
 usfor.77.d:0 "With the US entering the war against Japan, their support for us has increased, and shipments of equipment and advisors are arriving to boost our army. With their help we can hopefully drive the imperialists out of China!"
 usfor.77.a:0 "Their support is appreciated"
 usfor.78.t:0 "The China Air Task Force"
 usfor.78.d:0 "American volunteer pilots have been fighting with us since Japan invaded, but now that the US is officially in the war they have decided to replace the volunteers with official USAAF forces. This is a great boost for our airforce and will help winning the battñe for the skies."
 usfor.78.a:0 "Together for Victory!"
 usfor.79.t:0 "American Support"
 usfor.79.d:0 "The United States have decided to contact with us, seeking to help us defend the East Indies against the Japanese. They have proposed to send equipment and planes, and they also support coordinating our operations to be more effective against Japan. This will be of great help in our defensive struggle."
 usfor.79.a:0 "We welcome their support!"
 usa_temporary_taiwan:0 "§YWe shall administer Taiwan until the war is over!§!\n"
 usfor.80.t:0 "The Transfer of Taiwan"
 usfor.80.d:0 "US forces have kicked the Japanese out of the island of Taiwan, and now they have offered us to reintegrate the island into the Republic, as it is rightfully ours. However, we are not capable of handling the administration of the big island at the moment, so, while Taiwan will be officially Chinese territory and a small delegation shall be sent, the US Army will administer the island until the war is over."
 usfor.80.a:0 "We can wait"
 KOR_usa_occ_long:0 "Korean Occupation Authority"
 KOR_usa_occ:0 "Korean Occupation Authority"
 usfor.81.t:0 "The Transfer of Manchuria"
 usfor.81.d:0 "US Forces have managed to kick out the Japanese lapdogs from Manchuria, and now they have expressed their hopes to return the area to its rightful owner: us. Our administrators are already arriving to the main cities, beggining the process to estabilishing an administration in Manchuria."
 usfor.81.a:0 "Finally..."
 usfor.82.t:0 "The Taiwan Situation"
 usfor.82.d:0 "The War is over, and as we promised, we must transfer Taiwan to the Republic of China. The occupation was becoming too expensive anyway..."
 usfor.82.a:0 "We honour our word!"
 usfor.83.t:0 "American Support"
 usfor.83.d:0 "Seeking to reinforce our armies that fight against Japan for the control of South-East Asia, the USA has sent large amounts or equipment, planes and advisors. With their full support, our job will be easier!"
 usfor.83.a:0 "We thank them for their help!"
 usfor.84.t:0 "Combined Chiefs of Staff?"
 usfor.84.d:0 "Our allies in America have come up with a very strange proposal: they want to merge their Joint Chiefs of Staff with the Chiefs of Staff Committee in the Combined Chiefs of Staff, subject only to the Prime Minister and the US President. This would increase coordination between our units, but the Royal Army is not fully convinced. Shall we accept?"
 usfor.84.a:0 "Together we are stronger!"
 usfor.84.b:0 "Our militaries should be strictly separate!"
 usfor.85.t:0 "The British accept!"
 usfor.85.d:0 "Good news! The British have accepted to form the Combined Chiefs of Staff, and they will hold their first meeting shortly. This will be a great boost to our military coordination."
 usfor.85.a:0 "Perfect"
 usfor.86.t:0 "The British refuse!"
 usfor.86.d:0 "Bad news! Britain has refused to form the Combined Chiefs of Staff. We will have to fight on our own for now."
 usfor.86.a:0 "Fools!"
 usfor.87.t:0 "Technological Cooperation with the USA?"
 usfor.87.d:0 "The United States are seeking to defeat our enemies with superior technology, and to achieve that they need the best minds of the Free World. We could help in that, however, it may be more smart to use our talent for ourselves. Should we cooperate with the USA?"
 usfor.87.a:0 "Together we are stronger!"
 usfor.87.b:0 "No need"
 usfor.88.d:0 "Good news! Britain has accepted to cooperate on certain technological fields, and we will form the combined research teams shortly."
 usfor.89.d:0 "Bad news! Britain has refused to combine our talent. Apparently their pride is more important than winning the war..."
 usfor.90.t:0 "The United Nations proposal"
 usfor.90.d:0 "Our proposal for a worldwide declaration that states our intent to protect democracy and defeat our totalitarian enemies must have the support of other major powers before we can publish it. Once major powers have agreed to it, we shall release our declaration to the word, to show our enemies that the people across the world is ready to defend their liberty from them!"
 usfor.90.a:0 "Let us reach out to our Allies..."
 usfor.91.t:0 "The United Nations?"
 usfor.91.d:0 "The United States are seeking to release a worldwide declaration against tyranny, opression and imperialism, and they have decided to reach out to the major powers in order to show a united front. Should we join the Declaration, or perhaps it is better for us to stay aside?"
 usfor.91.a:0 "We'll take part in the new world!"
 usfor.91.b:0 "Not interested"
 usfor.92.t:0 "[From.GetName] joins the Declaration!"
 usfor.92.d:0 "Great news! [From.GetName] has decided to join us in our stand against tyranny across the world. Now we have to prepare to invite more countries, and then we'll release the Declaration for all the opressed peoples of the world!"
 usfor.92.a:0 "Their support is appreciated"
 usfor.93.t:0 "[From.GetName] refuses to join the Declaration!"
 usfor.93.d:0 "Citing sovereignty reasons and more nonsense, [From.GetName] has refused to take part in the construction of the new, free world."
 usfor.93.a:0 "Idiots"
 usfor.94.t:0 "The United Nations?"
 usfor.94.d:0 "The United States is trying to gather support for a Declaration by United Nations that stands in defense of democracy and freedom against their totalitarian enemies. As a democracy, perhaps we should consider joining?"
 usfor.94.a:0 "Of course!"
 usfor.94.b:0 "Useless talk!"
 usfor.95.t:0 "American Support!"
 usfor.95.d:0 "Good news! The USA has decided to send military and economic help to support our war effort. Their support has also helped to secure our political position."
 usfor.95.a:0 "Together we stand!"
 usfor.96.t:0 "Invitation to the USA's faction"
 usfor.96.d:0 "The US has decided to officially invite us to their alliance, joining the war. They claim that not joining the war will have consequences after (if) they win, and that we don't have to commit troops if we join. Should we do it?"
 usfor.96.a:0 "We shall fight together!"
 usfor.96.b:0 "We prefer to stay out of the war."
 take_over_allies_tooltip:0 "§YWe will assume leadership of the Allies!§!"
 usfor.97.t:0 "Cooperation with the USA?"
 usfor.97.d:0 "As our allies in the current war, the United States have recently made various proposals for cooperation between our two nations, especially in the fields of infrastructure and defense. Should we tell them that we are willing to cooperate?"
 usfor.97.a:0 "We are stronger if we work together!"
 usfor.97.b:0 "We prefer to be on our own"
 canada_rejected_cooperation:0 "Canada rejected to cooperate with us"
 usfor.98.t:0 "American Lend-Lease Intensifies"
 usfor.98.d:0 "The US has declared their support for our war effort, hoping that we are able to defeat our common enemy. To that end, they have intensified their lend-lease efforts greatly, with billions of dolars of material being sent to our shores. We must use this material wisely to destroy the invaders!"
 usfor.98.a:0 "Their support is appreciated - for now"
 usfor.99.t:0 "Meeting with the American Ambassador"
 usfor.99.d:0 "The American Ambassador in Moscow, W. Averell Harriman, looked very concerned when he delivered the letter that the President of the USA had sent to our General Secretary. The letter detailed the awful situation we are in, and calls for greater cooperation between us and the western powers, something that could erode our status as a great power that may save us from demise. As our General Secretary finished reading the letter, Harriman looked at him, waiting for a response. And that was..."
 usfor.99.a:0 "We are perfectly able to save ourselves without the capitalist intervention!"
 usfor.99.b:0 "The survival of the Union needs measures like this one!"
 usfor.100.t:0 "Formation of Patriotic Militias"
 usfor.100.d:0 "Armed and recruited by local Resistance organizations and by the US Army, militias have started to form in the liberated territory. While they have little experience, they can be of great use for policing duties, defense and support for the main allied forces."
 usfor.100.a:0 "Rise up for King and Country!"
 ALLIES_USA:0 "Allies"
 usfor.101.t:0 "The US demands our Atlantic possessions!"
 usfor.101.d:0 "In order to reach the British Isles, the USA are demanding that we allow their troops to occupy our North Atlantic possesions. Should we accept?"
 usfor.101.a:0 "They can have them"
 usfor.101.b:0 "Never!"
 usfor.102.t:0 "[From.GetName] gives in!"
 usfor.102.d:0 "Seeing that it is the best choice in this situation, [From.GetName] has decided to hand over their Atlantic possesions, at least until the war is over."
 usfor.102.a:0 "Great!"
 usfor.103.t:0 "[From.GetName] refuses!"
 usfor.103.d:0 "Foolishly, [From.GetName] has refused to allow our troops to occupy their Atlantic possesions. We have to rethink our stategy..."
 usfor.103.a:0 "Damn"
 usfor.104.t:0 "Algiers Coup completely successful!"
 usfor.104.d:0 "Success! Resistance units have successfully secured the city of Algiers and convinced the local generals to join the Allied forces, thus securing the entirety of North Africa under control of Allied France. This is a clear victory than finishes or almost finishes operations in Africa."
 usfor.104.a:0 "Great!"
 usfor.105.t:0 "Algiers Coup partially successful!"
 usfor.105.d:0 "Success! Although our plotters failed in their mission of convining French generals to join the Allies, they have managed to secure control of Algiers, reinforced with militias and shipped French troops. At least now we have a solid head start."
 usfor.105.a:0 "Time to fight!"
 usfor.106.t:0 "Algiers Coup fails!"
 usfor.106.d:0 "Bad news! Our plotters have been discovered and the planned coup has been cancelled, as itelligence operations are conducted across Algiers. We'll have to do it the traditional way..."
 usfor.106.a:0 "Well..."
 usfor.109.t:0 "Lease the Canary Islands?"
 usfor.109.d:0 "The USA, as de facto leader of the allies, are proposing that we give up control of the Canary Islands to them, in order to improve their operational flexibility. It would be returned after the war. Should we accept?"
 usfor.109.a:0 "They can have them..."
 usfor.109.b:0 "Never!"
 usfor.107.t:0 "[From.GetName] cedes the Canary Islands!"
 usfor.107.d:0 "Good news! [From.GetName] has decided to lease the Canary Islands to us until the war is over, and our troops are already moving into the area."
 usfor.107.a:0 "Useful"
 usfor.108.t:0 "[From.GetName] refuses!"
 usfor.108.d:0 "[From.GetName] has refused to lease the Canary Islands to our troops. We hope that they can give them a proper use then..."
 usfor.108.a:0 "Idiots"
 usfor.112.t:0 "Lease the Balearic Islands?"
 usfor.112.d:0 "The USA, as de facto leader of the allies, have set their eyes on the Balearic Islands and their excellent strategic position in the Western Mediterranean. They have asked us to lease the islands to them, at least until the war is over. Should we accept?"
 usfor.112.a:0 "Let them have the islands..."
 usfor.112.b:0 "Of course not!"
 usfor.110.t:0 "[From.GetName] cedes the Balearic Islands"
 usfor.110.d:0 "Good news! [From.GetName] has decided to lease the Balearic Islands to our troops. Now we can control the Mediterranean more efficently."
 usfor.110.a:0 "We thank our allies!"
 usfor.111.t:0 "[From.GetName] refuses to cede the Balearic Islands!"
 usfor.111.d:0 "In an arrogant move, [From.GetName] has refused to cede the Balearic Islands. They don't seem very invested in winning the war..."
 usfor.111.a:0 "If we lose, we all lose!"
 usa_restore_rep_government:0 "§YAll lands in Spain controlled by us will be transferred to the restored Spanish Republic!§!"
 usfor.113.t:0 "The Restoration of the Spanish Republic"
 usfor.113.d:0 "A jubilant crowd greeted the Spanish Government in exile as they set foot in Spain for the first time after the war. The President-in-exile, the liberal Diego Martínez Barrio, delivered a speech calling all spaniards that are still in occupied territory to resist the invader, and announcing a new era of liberalism and democracy, away from radicalisms. Thousands of spaniards have joined the newly created Spanish Liberation Army (EEL) that will fight side by side with our own troops to expel our enemies from Iberia."
 usfor.113.a:0 "Better them than the communists!"
 usfor.114.t:0 "The liberation of Yugoslavia"
 usfor.114.d:0 "With the occupiers defeated, our troops now controls the biggest cities of the Kingdom of Yugoslavia. Chetnik militias and the government in exile are demanding us to allow them to set up a new Yugoslavian government in Belgrade, something that we should do quickly if we want to properly control the area."
 usfor.114.a:0 "Transfer control to the Yugoslavs"
 usfor.115.t:0 "An offer from the USA"
 usfor.115.d:0 "US troops have reached our borders, and our nation is in danger. However, the US has decided to, instead of ordering an invasion of our territory, offer us a way out of the war if we fulfill 2 conditions. First, they demand that we rejoin the war on their side, and second, they want us to give up all our gained territory. Should we accept this, or fight?"
 usfor.115.a:0 "Let us abandon this sinking ship"
 usfor.115.b:0 "Death before Dishonour!"
 usfor.116.t:0 "[From.GetName] accepts our offer!"
 usfor.116.d:0 "[From.GetName] has decided to switch sides, greatly strenghtening our position in the Balkans and removing one nation from our enemy faction. Now we must prepare for retaliation..."
 usfor.116.a:0 "We have to defend our new ally!"
 usfor.117.t:0 "[From.GetName] refuses our offer!"
 usfor.117.d:0 "Foolishly, [From.GetName] as decided to refuse our offer and fight. They shall be destroyed in the name of Liberty!"
 usfor.177.a:0 "We'll do it the hard way then."
 usfor.118.t:0 "[From.GetName] betrays us!"
 usfor.118.d:0 "Bad news! After seeing US troops reaching their borders, and seeing a grim future for their nation, [From.GetName] has decided to accept the American offer and switch sides, giving up their gains in the process. It seems that we'll have to fight against our former allies..."
 usfor.118.a:0 "It's treason, then"
 
 usfor.119.t:0 "Peace at last!"
 usfor.119.d:0 "Finally, the war is over. As guns fall silent and our boys return home, we must think about our next moves, both domestically and internationally. It is time to become a super power."
 usfor.119.a:0 "Our time is here!"
 
 usfor.120.t:0 "The United States proposes an intervention in Italy"
 usfor.120.d:0 "Concerned about the recent aggresive actions taken by the Italian government, US President [USA.GetLeader] has officially proposed a coordinated intervention against Italy. Should we agree to this proposal and go to war?"
 usfor.120.a:0 "We need to act now!"
 usfor.120.b:0 "We won't start another meatgrinder!"
 usfor.121.t:0 "The United States proposes an intervention in Germany"
 usfor.121.d:0 "Concerned about the recent aggresive actions taken by the German government, US President [USA.GetLeader] has officially proposed a coordinated intervention against Germany. Should we agree to this proposal and go to war?"
 usfor.122.t:0 "[FROM.GetNameDef] refuses our proposal"
 usfor.122.d:0 "After carefully considering all the possible outcomes, the [FROM.GetAdjective] government has refused our proposal for an armed intervention in Europe. Our geographical situation prevents us from taking our own independent action..."
 usfor.122.a:0 "Shortsighted fools!"
 
 usfor.123.t:0 "We are at war!"
 usfor.123.d:0 "We have entered the war! Our priorities should radically shift towards military production and development, while our foreign policy needs to be drastrically reoriented towards our new allies and the disruption of our enemies. America enters a new time..."
 usfor.123.a:0 "To Victory!"
 
 usfor.125.t:0 "Withdraw from war leases"
 usfor.125.d:0 "During the war we took some territories the belonged to other nations in order to better manage our operations. Now the war is over, so we can return those lands to their rightful owners."
 usfor.125.a:0 "We keep our promises!"
 
