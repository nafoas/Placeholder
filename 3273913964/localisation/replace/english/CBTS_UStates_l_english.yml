 unitedstates.151.t:0 "Republican National Convention"
 unitedstates.151.d:0 "President Willkie has managed to reach the end of his second term, despite his poor health, and now we must choose a new nominee for the upcoming Presidential Election. Although President Willkie personally favours progressives, like Thomas Dewey and Earl Warren, conservative Republicans like Senator Robert Taft are determined to secure the nomination. Who will win?"
 unitedstates.151.a:0 "Thomas E. Dewey (NY)"
 unitedstates.151.b:0 "John W. Bricker (OH)"
 unitedstates.151.c:0 "Earl Warren (CA)"
 unitedstates.151.e:0 "Robert A. Taft (OH)"
 unitedstates.152.t:0 "The Vice-Presidential Ballot"
 unitedstates.152.d:0 "We have chosen our nominee, and now we must pick his running mate. Both liberals and conservatives have some interesting proposals..."
 unitedstates.152.a:0 "Earl Warren (CA)"
 unitedstates.152.b:0 "Charles A. Halleck (IN)"
 unitedstates.152.c:0 "Harold Stassen (MN)"
 unitedstates.152.e:0 "Dwight Green (IL)"
