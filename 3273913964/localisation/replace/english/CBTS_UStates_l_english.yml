 unitedstates.147.t:0 "Democratic National Convention"
 unitedstates.147.d:0 "Today we have held our National Convention in Philadelphia, were we are picking our nominees for the Presidential Election and decide some things about our political strategy. However, there is little to decide, as President [USA.GetLeader] is going to be nominated again for a second term. At least if nobody challenges him."
 unitedstates.147.a:0 "Four more years!"
