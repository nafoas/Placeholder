 usa_political_uncertainty1:0 "Political Uncertainty"
 usa_political_uncertainty1_desc:0 "The assassination of Franklin Delano Roosevelt has been a great blow to the American political system in one its weakest moments. With the economy and the society in crisis, strong leadership will be needed to restore the nation to greatness, and our biggest hope for that leadership is now dead. It is time for the bickering politicians to put their differences aside for the sake of patriotism, or the crisis and the uncertainty will continue."
