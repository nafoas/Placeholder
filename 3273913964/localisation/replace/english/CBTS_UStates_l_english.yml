 USA_landon_reelected:0 "Landon Re-Elected"
 USA_landon_reelected_desc:0 "President Alfred Landon has managed to win a second term! Now we have to decide if we want to continue reforming the economy, or if we want to start mobilizing the country for war."
 USA_amend_political_divisions_landon:0 "Overcome Political Divisions"
 USA_amend_political_divisions_landon_desc:0 "The world is in flames, and we can't continue squabbling with the Democrats about everything. We need to overcome political divisions to build a better America."
 USA_continue_eco_reforms:0 "Continue Economic Reforms"
 USA_continue_eco_reforms_desc:0 "Doing preparations for war is useless if our economy continues to lag behind. We need to continue our economic agenda, eliminating the Depression once and for all!"
 USA_guarantee_american_dream:0 "Guarantee the American Dream"
 USA_guarantee_american_dream_desc:0 "The American Dream: the ideal that says that anyone can achieve success if they work hard enough, that anyone can climb up the social ladder. This ideal is essential, and economic inequalities are threatening it. We must guarantee the American Dream!"
 USA_practical_progressivism:0 "Practical Progressivism"
 USA_practical_progressivism_desc:0 "Modern industrial societies are very dangerous for the well-being of the individual, Republicans must understand this if we want to be the party of the average American."
 USA_cut_waste:0 "Cut the Waste"
 USA_cut_waste_desc:0 "There is still too much bureaucracy in this country: we must cut the government further so that the economy can thrive."
 USA_economic_tax_act:0 "Economic Tax Act"
 USA_economic_tax_act_desc:0 "We need to convince Congress that continue lowering taxes is the right policy that will fix the Great Depression once and for all! It should be easy, the results speak for themselves..."
 USA_landon_safety_net:0 "A Safety Net"
 USA_landon_safety_net_desc:0 "Economic freedom is paramount, but no man can be truly free if they are one failure away from ruin. Perhaps Social Security was not a bad idea after all?"
 USA_economic_liberty_act:0 "Economic Liberty Act"
 USA_economic_liberty_act_desc:0 "We must continue decreasing and even removing regulations so that businesses are free to put the economy back on track."
 
 USA_president_willkie:0 "President Willkie"
 USA_president_willkie_desc:0 "Wendell Willkie, the Republican candidate, has managed to win the 1940 Presidential Election. Now he can begin to implement his progressive republican agenda, or perhaps the deteriorating international situation is a more pressing matter?"
 USA_amend_political_divisions_willkie:0 "Overcome Political Divisions"
 USA_amend_political_divisions_willkie_desc:0 "President Willkie is not a very divisive figure, appealing to both Democrats and Republicans. We need to overcome party politics if we want to stay united in these difficult times."
 USA_new_program:0 "A New Program"
 USA_new_program_desc:0 "Wendell Willkie has lots of plans for America. The New Deal will have to be reviewed, and something will have to be done about racial segregation as well."
 USA_civil_rights_committee:0 "Civil Rights Committee"
 USA_civil_rights_committee_desc:0 "The Republican Party must take again a leading role in the fight for Civil Rights. President Willkie is personally interested in the issue, so a Presidential Committee shall be created in order to discuss the possible measures that can be taken."
 USA_desegregate_armed_forces:0 "Desegregate the Armed Forces"
 USA_desegregate_armed_forces_desc:0 "The end of Racial Segregation in the Armed Forces will be a first step in the fight against racism!"
 USA_towards_full_employment:0 "Towards Full Employment"
 USA_towards_full_employment_desc:0 "Full Employment was one of our main electoral promises, and now we must honor it. Businesses need to be incentivized, while New Deal agencies can oversee some public works projects..."
 USA_new_america:0 "A New America"
 USA_new_america_desc:0 "Willkie promised a New World, and we are creating, at least, a New America. A New America that is more fair, more equal, and more united. We have truly embraced the legacy of Lincoln."
 USA_expand_social_security:0 "Expand Social Security"
 USA_expand_social_security_desc:0 "We need to show the people that we are willing to go further than the Democrats and expand Social Security so those who are in need can live with dignity."
 USA_willkie_regulations:0 "Lower Economic Regulations"
 USA_willkie_regulations_desc:0 "Economic Regulations are not promoting economic recovery, they are stopping it. We need to pass a bill that frees our businesses from most regulations, so that they can create wealth again!"
 
 USA_right_work:0 "Right to Work"
 USA_right_work_desc:0 "Every American has the right to a job that allows him to maintain his family with dignity."
 USA_fair_competition:0 "Ensure Fair Competition"
 USA_fair_competition_desc:0 "Monopolies are an obstacle in our way to a more fair economy. We need to enact laws that regulate monopolies and businesses to ensure a fair competition."
 USA_right_education:0 "Right to Education"
 USA_right_education_desc:0 "Every American has the right to send his children to a school, for free, and those children have the right to the best education the state can offer."
 USA_right_health:0 "Right to Health"
 USA_right_health_desc:0 "Every American has the right to be cured from any disease or health problem, no matter his financial status!"
 USA_right_housing:0 "Right to Housing"
 USA_right_housing_desc:0 "Every American has the right to a house where he can live with his family with dignity, even the poor."
 USA_better_union:0 "A Better Union"
 USA_better_union_desc:0 "The USA is not great when we defeat foreign foes or when we surpass other nations' economies if our own people starve and lack housing. Now that our people lives better, we can say that the USA is greater than ever!"
 USA_amend_political_divisions:0 "Overcome Political Divisions"
 USA_amend_political_divisions_desc:0 "The world is in flames, and we can't continue squabbling with the GOP about everything. We need to overcome political divisions to build a better America."
 USA_coalition_reps:0 "Coalition with Progressive Republicans"
 USA_coalition_reps_desc:0 "Some Republicans are willing to work with us, especially in foreign affairs related issues. Wendell Willkie, for example, has become quite supportive of the President's foreign policy."
 USA_go_to_war_ms:0 "Go to War"
 USA_go_to_war_ms_des:0 "We need to go to war in order to profit from our economic preparations, or we might weaken our economy."
 usa_army_desegregated:0 "The Armed Forces have already been desegregated"
 USA_rep_party_long:0 "Republican Party"
 USA_rep_party:0 "Republican Party"
 
 USA_president_farley:0 "President Farley"
 USA_president_farley_desc:0 "James A. Farley has managed to become the President of the United States of America. Will he continue the New Deal ( with a bit more moderation ) or perhaps it is time to prepare for the inevitable?"
 USA_amend_political_divisions_farley:0 "Amend Political Divisions"
 USA_amend_political_divisions_farley_desc:0 "President Farley can't be a polarizing figure now that America needs unity. We need to reach across the aisle to strenghten our position."
 USA_newer_deal:0 "A Newer Deal"
 USA_newer_deal_desc:0 "During his last years, Roosevelt had begun to radicalize his platform. We have to restore the spirit of the First Hundred Days by building a grand political coalition that improves the people's situation without strangling the economy. The Civil Rights issue is also on the table..."
 USA_farley_comm:0 "Civil Rights Committee"
 USA_farley_comm_desc:0 "President Farley is strongly committed to the Civil Rights cause. We need to begin setting up a Presidential Committee on Civil Rights, that will suggest and prepare the measures our administration will take to handle this issue.."
 USA_desegregate_farley:0 "Desegregate the Armed Forces"
 USA_desegregate_farley_desc:0 "The Armed Forces can't stay segregated for much longer. All Americans, regardless of their skin color, should be able to fight for their country on equal terms."
 USA_continue_pub_works:0 "Continue the Public Works"
 USA_continue_pub_works_desc:0 "We must continue the New Deal policies that have been successful, such as the public works that have managed to greatly lower unemployment."
 USA_housing_act_farley:0 "Another Housing Act"
 USA_housing_act_farley_desc:0 "The Housing problem is not solved and probably, it never will be. However, we can continue Roosevelt's measures on this issue to bring us closer to our ideal: a comfortable roof for every American!"
 USA_desegregate_dc:0 "Desegregate DC"
 USA_desegregate_dc_desc:0 "It is an insult that the very capital of the Land of the Free discriminates people of color. We need to desegregate DC now, and perhaps in our next term we can tackle segregation in the South..."
 USA_expand_soc_sec_farley:0 "Expand Social Security"
 USA_expand_soc_sec_farley_desc:0 "Social Security needs to be expanded, as it has proven useful in reducing inequality and poverty. President Farley cares for the average American!"
 
 USA_president_garner:0 "President Garner"
 USA_president_garner_desc:0 "Vice-President John Nance Garner has been elected President of the United States. With the international situation worsening, his Presidency can be a defining moment in our nation's history..."
 USA_amend_political_divisions_garner:0 "Amend Political Divisions"
 USA_amend_political_divisions_garner_desc:0 "President Garner has lots of experience in Congress, working with both New Dealers and conservatives and getting laws passed. Now we need that experience to rally our nation around the flag."
 USA_different_deal:0 "A Different Deal"
 USA_different_deal_desc:0 "The New Deal was not a bad concept: the Depression demanded strong solutions and federal intervention in the economy was needed. However, taking power away from businesses, the States and even Congress is not the way to do it."
 USA_leadership_not_rulership:0 "Leadership, not Rulership"
 USA_leadership_not_rulership_desc:0 "President Garner is strongly opposed to increased Presidential powers. We need to lead, not to rule, that's what makes us the Land of Freedom!"
 USA_support_public_works:0 "Continue the Public Works"
 USA_support_public_works_desc:0 "Public Works are the best policy we can follow to deal with unemployment. We have to continue and expand what Roosevelt started on this field."
 USA_work_congress:0 "Work with Congress"
 USA_work_congress_desc:0 "President Garner has lots of experience in Congress, and he can surely step in and convince the squabbling politicians at the Capitol Hill that we want America to prosper, the President and Congress should work hand-in-hand."
 USA_decentralize_new_deal:0 "Decentralize the New Deal"
 USA_decentralize_new_deal_desc:0 "One of the biggest problems of the New Deal was Federal centralization and overreach. We need to delegate the management of most agencies to the States so that their rights are preserved."
 USA_lower_taxes_garner:0 "Lower Taxes"
 USA_lower_taxes_garner_desc:0 "While we shouldn't take it as far as the Republicans are demading, we need to lower taxes now that the worst of the Depression is clearly over."
 USA_amend_nlra:0 "Amend the NLRA"
 USA_amend_nlra_desc:0 "The National Labor Relations Act has some dangerous provisions, regarding the rights to strike, that threaten our economy and our way of life. We need to take that away and control strikes more tightly."
 
 USA_president_hull:0 "President Hull"
 USA_president_hull_desc:0 "Cordell Hull, former Secretary of State under Roosevelt, has managed to become President, surprising both Republicans and Democrats. Now this unexpected President must lead the country through these difficult times."
 USA_amend_political_divisions_hull:0 "Overcome Political Divisions"
 USA_amend_political_divisions_hull_desc:0 "With the international situation demanding so much attention from the President, we can't afford to have endless disputes with Republicans in Congress. Let us promote bipartisanship, instead."
 USA_new_agenda:0 "A New Agenda"
 USA_new_agenda_desc:0 "President Hull is keen on delivering his promises to the electorate. We promised prosperity, we will deliver!"
 USA_lower_tariffs_hull:0 "Lower Tariffs"
 USA_lower_tariffs_hull_desc:0 "The Democratic Party is the Party of low tariffs. It has always been and it will always be. President Hull knows, from his years as Secretary of State, the need for a Free Trade."
 USA_rtaa:0 "Reciprocal Trading Agreement Act"
 USA_rtaa_desc:0 "The Reciprocal Tariffs Act passed by Roosevelt was an excellent policy. Let us continue this path by passing the Reciprocal Trading Agreements Act or RTAA."
 USA_revenue_hull:0 "Revenue Act"
 USA_revenue_hull_desc:0 "We might be at war soon, and the economy hasn't fully recovered. We need a new Revenue Act so that taxes go up. It is not popular, but necessary."
 USA_stronger_fed_gov:0 "Strengthen the Federal Government"
 USA_stronger_fed_gov_desc:0 "The states are a constant obstacle when managing tax revenue and the New Deal Agencies. We need to pass an Act that increases the economical power of the Federal Government."
 USA_rearmament_act:0 "Rearmament Act"
 USA_rearmament_act_desc:0 "President Hull has seen, from his years as Secretary of State, how dictatorships are preparing for another Great War. We need to prepare for the inevitable, and Congress will have to accept that!"
 USA_defenders_of_democracy:0 "Defense of Democracy"
 USA_defenders_of_democracy_desc:0 "Democracy is under threat globally. Totalitarian powers seek to enslave the free nations, but under the leadership of the United States of America, Democracy will defend itself and destroy totalitarianism!"
 
 USA_president_long:0 "President Long"
 USA_president_long_desc:0 "Huey P. Long has been elected President of the United States. Forced to run with estabilishment Democrats, he won't be able to completely fulfill his campaign promises, but he still has some plans..."
 USA_work_with_democrats:0 "Work with the Democrats"
 USA_work_with_democrats_desc:0 "Both Dixiecrats and New Dealers are very concerned about the President's rethoric. We shall compromise and moderate our policies so that we can actually get stuff passed in Congress."
 USA_solidify_longism:0 "Solidify Longism"
 USA_solidify_longism_desc:0 "Longism is a populist movement, relying on Huey Long to stay alive. We need to build a strong political movement within the Democratic Party that can last longer than the President and be a permanent force in national politics."
 USA_share_wealth:0 "The Share Our Wealth Program"
 USA_share_wealth_desc:0 "Claiming inspiration from the New Deal, we shall introduce parts of the Share our Wealth program so that we can fulfill our campaign promises. If Congress allows it, that is."
 USA_tax_the_rich:0 "Tax the Rich"
 USA_tax_the_rich_desc:0 "Neither Congress nor own Party wants to see wealth capped, so we should pass an Act that increases taxes to the rich instead. We are going to need the money."
 USA_guaranteed_family_income:0 "Guaranteed Family Income"
 USA_guaranteed_family_income_desc:0 "One of President Long's main promises, we shall begin preparing a special guaranteed, minimum income for American families. We can extinguish poverty!"
 USA_long_public_works:0 "Expand the Public Works"
 USA_long_public_works_desc:0 "The Public Works started by Roosevelt were a good policy, we should continue it."
 USA_veteran_pensions:0 "Pensions for Veterans"
 USA_veteran_pensions_desc:0 "Those men who fought and bled for our nation deserve a pension so they can live with dignity. They can also be given jobs and scholarships, if they want."
 USA_townsend_plan:0 "Implement the Townsend Plan"
 USA_townsend_plan_desc:0 "President Long wants to increase old-age pensions, but he lacks a coherent plan to do so. Instead of making our own, we can use the old Townsend Plan, that was shunned by Roosevelt and would substantially increase pensions!"
 USA_every_man_king:0 "Every Man a King!"
 USA_every_man_king_desc:0 "The slogan of the Share our Wealth program is 'Every Man a King, but no one wears a crown'. Even though we haven't achieved everything we wanted, we have substantially improved the life of the ordinary American."
 
 USA_main_foreign_start:0 "Reevaluate our Foreign Policy" 
 USA_main_foreign_start_desc:0 "A new term begins, and we should re-examine our foreign policy and think if we should change anything about our diplomatic strategy."
 USA_37_neutrality:0 "Neutrality Act of [GetYear]"
 USA_37_neutrality_desc:0 "To appease isolationists, we shall pass a new Neutrality Act, extending the weapon sales embargo to civil wars."
 USA_repeal_neutrality_acts:0 "Repeal the Neutrality Acts"
 USA_repeal_neutrality_acts_desc:0 "The world is heading to war and we are here crippled by the stupid Neutrality Acts. It won't be politically easy, and it will turn the people against us, but it is our duty to repeal the Neutrality Acts."
 USA_maintain_flexibility:0 "Maintain Diplomatic Flexibility"
 USA_maintain_flexibility_desc:0 "We can't continue isolationist policies. We shall support status quo and do what we can to strenghten our position abroad without upsetting isolationists."
 USA_lundlow_amendment:0 "Pass the Lundlow Amendment"
 USA_lundlow_amendment_desc:0 "The Lundlow Amendment is an isolationist proposal that would make referendums mandatory for each time the US wants to declare war. Let us pass it to confirm our isolationist strategy."
 USA_time_get_involved:0 "Time to Get Involved"
 USA_time_get_involved_desc:0 "Without the Neutrality Acts, it is time for us to get involved in world conflicts and support our interests."
 USA_the_scw:0 "The Spanish Civil War"
 USA_the_scw_desc:0 "A civil war has broken out in Spain! We should think about what side we want to support and then ensure it wins."
 USA_planes_reps:0 "Send Planes to the Republicans"
 USA_planes_reps_desc:0 "The legitimate Spanish government, known as Republican Spain, deserves our help. With some American planes, they can win the war and stay in our sphere of influence."
 USA_fuel_nats:0 "Send Fuel to the Nationalists"
 USA_fuel_nats_desc:0 "While the Republicans represent the legal government, the Nationalists are going to win. We shall help them now, and count on their support in an hypothetical confrontation against communism."
 USA_support_ethiopia:0 "Support Ethiopia"
 USA_support_ethiopia_desc:0 "Italian fascists have been unable to conquer Ethiopia, but now they are close. This will not stand, colonialism is something that belongs to the past! Ethiopia shall resist!"
 USA_ultimatum_italy:0 "Ultimatum to Italy"
 USA_ultimatum_italy_desc:0 "If Italy doesn't withdraw all its military forces from Ethiopia in 14 days, we shall take drastic action..."
 USA_support_russian_rebels:0 "Support the Russian Rebels"
 USA_support_russian_rebels_desc:0 "Vlasov and his rebellion has provided an opportunity to get rid of the USSR and replace it with a weaker, friendlier Russian Government. We have to make sure that these rebels win."
 USA_flying_bears:0 "American Volunteer Group"
 USA_flying_bears_desc:0 "A volunteer aerial corps shall be sent to Russia to keep Soviet planes on the ground."
 USA_economic_concessions_from_russia:0 "Economic Concessions from Russia"
 USA_economic_concessions_from_russia_desc:0 "We did it! The war is won and now we can use our position of strength to force the weak Russians to give juicy concessions for our companies. We shall also get some resource exploitation rights."
 USA_help_fascists:0 "Help the Fascists?"
 USA_help_fascists_desc:0 "The fascists have taken Vladivostok, making sending help to them very easy. The enemy of my enemy is my friend, but supporting anti-semite fascists may be too much. Shall we do it?"
 USA_support_china:0 "Support China"
 USA_support_china_desc:0 "The Chinese people are suffering an imperialist and unlawful invasion from the aggresive Empire of Japan. This makes the Japanese a threat to the whole region and that cannot stand; We must help the ROC with equipment and advisors."
 USA_advisors_guns:0 "Advisors & Guns"
 USA_advisors_guns_desc:0 "Advisors to modernize Chinese doctrine and guns to avoid equipment shortages will give China the edge, we hope."
 USA_flying_tigers:0 "The Flying Tigers"
 USA_flying_tigers_desc:0 "The Flying Tigers will help the Chinese Airforce in beating the Japanese, securing the skies for our eastern ally."
 USA_antagonize_japan:0 "Antagonize Japan"
 USA_antagonize_japan_desc:0 "Make an official Declaration accusing Japan of war atrocities and signaling them as a potential enemy."
 USA_sanction_japan:0 "Sanction Japan"
 USA_sanction_japan_desc:0 "Words are nothing if they don't come with actions. Our first action will be some economic sanctions on Japan, a prelude of what's coming."
 USA_embargo_japan:0 "Embargo Japan"
 USA_embargo_japan_desc:0 "Despite our demands the Japanese have refused to take out their troops stationed in Indochina and still continue their barbaric war in China. Japan has a known shortage on resources, the majority of the oil they import comes from here or from the Dutch colonies in South East Asia, to fuel its war machine. If we, together with the Dutch, freeze their assets and set an embargo on their imports they will eventually run out of oil and come to the negotiation table."
 USA_preserve_security:0 "Preserve our Security"
 USA_preserve_security_desc:0 "We have to keep America safe, and to do that interventionism is the best policy. The best defense is a good attack!"
 USA_mexican_oil:0 "Secure Mexican Oil"
 USA_mexican_oil_desc:0 "Mexico is threatening with oil nationalization. We have to deter them and, if they still refuse to comply, we shall send our boys down there!"
 USA_caribbean:0 "Caribbean Intervention"
 USA_caribbean_desc:0 "We have to ensure that all nations in our backyard are friendly. Those who aren't, soon will be."
 USA_central_america:0 "Central American Intervention"
 USA_central_america_desc:0 "Central America is key for a secure backyard, and some American companies have strong interests in the region. Countries who dare challenging us shall suffer."
 USA_south_america:0 "Secure South America"
 USA_south_america_desc:0 "With our strong Navy and a completely secure continent, we will be invincible in the coming wars!"
 USA_european_theatre:0 "The European Theatre"
 USA_european_theatre_desc:0 "Europe is key to America's security. Helping our friends and removing our enemies will keep us safe."
 USA_befriend_french:0 "Befriend the French"
 USA_befriend_french_desc:0 "France is a target of both Germany and Italy, and they should know that they can count on our support in case they get attacked."
 USA_french_air:0 "Support French Air Production"
 USA_french_air_desc:0 "The French are quite concerned about their airforce. They fear that the Germans field a larger one, so they have asked us for help in that regard. Help that we shall provide."
 USA_french_deal:0 "Trade Deal with France"
 USA_french_deal_desc:0 "A juicy trade deal between the United States of America and the French Republic will help both nations' economies."
 USA_approach_british:0 "Approach the British"
 USA_approach_british_desc:0 "Britain and the USA have had their ups and downs, but right now they are the most reliable partner we can have in Europe."
 USA_naval_cooperation_britain:0 "Naval Cooperation"
 USA_naval_cooperation_britain_desc:0 "The Royal Navy and the US Navy are the two world's strongest navies, and with cooperation in the technical and doctrinal fields they will continue to be."
 USA_arms_trade_britain:0 "British Arms Trade"
 USA_arms_trade_britain_desc:0 "Britain needs guns, and we are happy to provide them. We shall allow war industrialists to open more factories in Britain, along with an emergency Lend-Lease deal."
 USA_eliminate_european_threats:0 "Tackle European Threats"
 USA_eliminate_european_threats_desc:0 "Europe is a place with many potential friends, but also many potential threats. Germany and Italy in particular don't seem to like the current political order."
 USA_denounce_germany:0 "Denounce Germany"
 USA_denounce_germany_desc:0 "The President has to deliver a speech denouncing the German Dictatorship and its warmongering aims. That way they'll know who they are facing."
 USA_sanction_germany:0 "Sanction Germany"
 USA_sanction_germany_desc:0 "We shall begin our hostile actions against Germany by promoting some mild sanctions against them."
 USA_embargo_germany:0 "Embargo Germany"
 USA_embargo_germany_desc:0 "It is time to promote a complete embargo over German trade, hopefully slowing down their military and industrial machine."
 USA_denounce_italy:0 "Denounce Italy"
 USA_denounce_italy_desc:0 "The President has to deliver a speech denouncing the Italian Dictatorship and its warmongering aims. That way they'll know who they are facing."
 USA_sanction_italy:0 "Sanction Italy"
 USA_sanction_italy_desc:0 "We shall begin our hostile actions against Italy by promoting some mild sanctions against them."
 USA_embargo_italy:0 "Embargo Italy"
 USA_embargo_italy_desc:0 "It is time to promote a complete embargo over Italian trade, hopefully slowing down their military and industrial machine."
 USA_european_guarantees:0 "European Guarantees"
 USA_european_guarantees_desc:0 "The smaller nations in Europe, threatened by bigger powers, should know that they can count on us."
 USA_lead_charge:0 "Propose an Armed Intervention"
 USA_lead_charge_desc:0 "Our allies in Europe remain passive in the face of the growing threats. We need to propose them a joint armed intervention before our enemies grow too powerful!"
 USA_propose_intervention_ger:0 "Propose an Intervention in Germany"
 USA_propose_intervention_ita:0 "Propose an Intervention in Italy"
 USA_circunvent_acts:0 "Circunvent the Neutrality Acts"
 USA_circunvent_acts_desc:0 "We have to be more clever than the Neutrality Acts and the isolationists. With intelligence, we can support those nations we want to win their wars without violating the acts."
 USA_quarantine_speech:0 "The Quarantine Speech"
 USA_quarantine_speech_desc:0 "We have to call for an international quarantine on aggresive nations and the epidemic of world lawlessness so that everyone knows where we stand."
 USA_help_french:0 "Help the French"
 USA_help_french_desc:0 "France seems to be concerned with the state of their aerial forces. They could really use our help, and that way they'll hold better against Germans or Italians expansionists."
 USA_revise_neutrality_acts:0 "Revise the Neutrality Acts"
 USA_revise_neutrality_acts_desc:0 "The state of the world won't allow us to continue our Neutrality policy. We have to pass a new Neutrality Act that allow us to sell weapons to nations at war."
 USA_cash_carry:0 "Cash & Carry"
 USA_cash_carry_desc:0 "It is time to allow nations at war to buy weapons from us in a cash-and-carry basis. That way our economy will continue its recovery while we help righteous causes across the world."
 USA_lend_lease_act:0 "Lend-Lease Act"
 USA_lend_lease_act_desc:0 "The world is at war! Now that we have revised the Neutrality Act, we must pass another act that allows us to send equipment to other nations for free."
 USA_destroyers_bases:0 "Destroyers for Bases"
 USA_destroyers_bases_desc:0 "We should propose Britain an agreement: they need destroyers, we need naval bases. Let us exchange those, then."
 USA_arsenal_democracy:0 "Arsenal of Democracy"
 USA_arsenal_democracy_desc:0 "We shall become the Arsenal of Democracy, providing weapons to anyone that fights against tyranny."
 USA_support_republicans_sp:0 "Support Republican Spain?"
 USA_support_republicans_sp_desc:0 "While supporting Republican Spain is the correct thing to do morally, we can't afford to lose catholic support and antagonizing Congress. We have to decide."
 USA_sanction_italy_eth:0 "Sanction Italy"
 USA_sanction_italy_eth_desc:0 "Italy thought that their invasion of Ethiopia would go unpunished? We shall ban any kind of sales to them, so they learn their lesson."
 USA_war_plan_orange:0 "War Plan Orange"
 USA_war_plan_orange_desc:0 "The time for words is over. Japan can't conquer East Asia, brutally oppressing its peoples, without any kind of response. For their crimes against humanity and international law, they shall be punished."
 USA_maintain_gnp:0 "Maintain the Good Neighbor Policy"
 USA_maintain_gnp_desc:0 "We have to continue the Good Neighbor Policy that we started in the last term. Keeping a friendly Western Hemisphere is the best guarantee to our security."
 USA_amend_mexico:0 "Amend Relations with Mexico"
 USA_amend_mexico_desc:0 "Mexico has pushed recently for policies that antagonize many private interests of American citizens and companies. In order to befriend our southern neighbor, we have to amend relations with them."
 USA_gnf:0 "Good Neighbor Fleet"
 USA_gnf_desc:0 "In order to promote friendship between our people, we shall create a new passanger route between New York and Buenos Aires, with stops in Rio de Janeiro, Santos and Montevideo."
 USA_create_ociaa:0 "Create the OCIAA"
 USA_create_ociaa_desc:0 "We have to change the way our people perceives Latin Americans. To do that, we shall create the Office of the Coordinator of Inter-American Affairs, led by Nelson Rockefeller. This will help gaining support for the Good Neighbor Policy at home."
 USA_network_americas:0 "Network of the Americas"
 USA_network_americas_desc:0 "To continue with our promotion of Latin American culture in our society, the OCIAA has decided to create a radio broadcast called La Cadena de las Américas ( Network of the Americas ), to better propagate the new ideas."
 USA_defense_first:0 "Prioritise Defense"
 USA_defense_first_desc:0 "Defending the American Dream should be our utmost priority. We don't care if foreigners are opressed as long as we are free."
 USA_fortress_usa:0 "Fortress USA"
 USA_fortress_usa_desc:0 "The enemy could come from everywhere, from within and from without. That's why we have to turn every city into an unbreakable fortress, with special attention to the borders."
 USA_walls_water_steel:0 "Walls of Water and Steel"
 USA_walls_water_steel_desc:0 "Canada and Mexico are no match for us, so the invasion will come from the ocean. The US Navy shall be our Wall of Water and Steel, that will protect our country from tyranny."
 USA_our_position_abroad:0 "Our Position Abroad"
 USA_our_position_abroad_desc:0 "It is time to tackle our political position in international affairs and announce our isolationism to the world."
 USA_withdraw_philippines:0 "Withdraw from the Philippines"
 USA_withdraw_philippines_desc:0 "We took the Philippines from Spain in 1898 and they have been a constant source of problems ever since. Let us retreat from there and leave them to their own devices."
 USA_withdraw_caribbean:0 "Withdraw from the Caribbean"
 USA_withdraw_caribbean_desc:0 "We have many colonies in the Caribbean, from the Panama Canal to Puerto Rico and Guantanamo. We should rethink our role in the Caribbean Sea."
 USA_no_enemies_no_danger:0 "No Enemies, no Danger"
 USA_no_enemies_no_danger_desc:0 "It is an easy diplomatic doctrine from our position: if we are friends with everyone, nobody will want to attack and our people will be safe."
 USA_trade_britain_iso:0 "Trade With Britain"
 USA_trade_britain_iso_desc:0 "We have to promote trade between the USA and the British Empire, continuing our so-called 'special relationship'."
 USA_trade_germany_iso:0 "Trade With Germany"
 USA_trade_germany_iso_desc:0 "We have to be pragmatic, and in order to keep peace we have to trade with the Germans."
 USA_trade_canada_iso:0 "Trade With Canada"
 USA_trade_canada_iso_desc:0 "Canadians are friends, and they have plenty of resources that we can buy."
 USA_trade_china_iso:0 "Trade With China"
 USA_trade_china_iso_desc:0 "China is a very interesting potential market, one that we must exploit quickly."
 USA_trade_japan_iso:0 "Trade With Japan"
 USA_trade_japan_iso_desc:0 "The Japanese seem to be determined to invade other countries to get resources. No need, we'll just offer them some."
 USA_trade_france_iso:0 "Trade With France"
 USA_trade_france_iso_desc:0 "The French seem quite interested in trading with us and we are in no position to refuse."
 USA_bef_soviets_iso:0 "Befriend the USSR"
 USA_bef_soviets_iso_desc:0 "The USSR is not a country we can afford to antagonize. We have to sign a trade deal to improve our economies."
 USA_business_first:0 "Business First"
 USA_business_first_desc:0 "Our focus is not War, Territory or Alliances. Our focus is securing good trade deals that help our people, and maintain us in peace."
 
 USA_main_military_start:0 "The American Military"
 USA_main_military_start_desc:0 "The world is getting more unstable each day, and we can't be caught unprepared. Let us begin military preparations!"
 USA_expand_airforce:0 "Expand the Airforce"
 USA_expand_airforce_desc:0 "The Air Corps is getting more and more independence. We should fund a last Air Corps expansion before we decide how to to organize the airforce."
 USA_form_usaac:0 "Form the USAAF"
 USA_form_usaac_desc:0 "The Air Corps shall be tranformed into the United States Army Corps, giving it more autonomy and capacity. However, doctrinal direction of the new USAAF is not very clear."
 USA_under_the_army:0 "Under the Army"
 USA_under_the_army_desc:0 "Despite the end of the Air Corps, the USAAF shall remain closely integrated with the Army. They can't have their own voice if they are going to follow the Army."
 USA_towards_independent:0 "Towards an Independent Airforce"
 USA_towards_independent_desc:0 "The USAAF is a step forward, but not the end of the road. The progressive empowering of the airforce will continue until it is free from the US Army!"
 USA_cas_development:0 "Specialized CAS Development"
 USA_cas_development_desc:0 "CAS planes are needed to ensure enemy bunkers, tanks, camps or machine gun posts are destroyed and our path to victory is clear."
 USA_battlefield_support_focus:0 "Battlefield Support Doctrine"
 USA_battlefield_support_focus_desc:0 "The USAAF will follow the Battlefield Support Doctrine, focusing on making the Army's life easier and help scoring tactical victories."
 USA_tac_bomber_projects:0 "Medium Bomber Projects"
 USA_tac_bomber_projects_desc:0 "In order to perform our Battlefield Support plans, we need the best Medium Bombers available."
 USA_streamline_bomb_prod:0 "Streamline TAC Production"
 USA_streamline_bomb_prod_desc:0 "The USA has a strong industrial muscle, let us apply it to TAC construction to overwhelm the enemy with our superior numbers."
 USA_work_army:0 "Work with the Army"
 USA_work_army_desc:0 "We have to promote coordination efforts between the US Army and the USAAF. It will be this combination the one that will lead us to victory."
 USA_from_land_skies:0 "From the Land and from the Skies"
 USA_from_land_skies_desc:0 "We shall rain hell on the enemy, from the Land but also from the Skies. Our Battlefield Support missions will be optimized to rout the enemy."
 USA_full_co_ordination:0 "Full Coordination"
 USA_full_co_ordination_desc:0 "One last effort and we will achieve full coordination between the Army and the USAAF, giving us a clear edge in the battlefield."
 USA_combined_arms_air:0 "Combined Arms"
 USA_combined_arms_air_desc:0 "The strength of an army is the ability of using everything technology can offer: tanks, artillery, motorized infantry, foot soldiers, planes and more combined with intelligence. We have achieved that."
 USA_strategic_destruction_focus:0 "Stretegic Destruction"
 USA_strategic_destruction_focus_desc:0 "The goal of our airforce should be destroying the enemy's industrial capacity and will to fight, through massive bombing campaigns."
 USA_air_sup_focus:0 "Air Superiority"
 USA_air_sup_focus_desc:0 "We can't use our bombers if we haven't cleared enemy fighters from the skies. That will be our utmost priority."
 USA_air_rotation:0 "Pilot Rotation"
 USA_air_rotation_desc:0 "In order to avoid fatigue, we shall stabilish a pilot rotation system, that will keep our men always fresh and ready!"
 USA_long_range_scorts:0 "Long Range Escorts"
 USA_long_range_scorts_desc:0 "If our bombers are going to perform long-range missions, we can't let our fighters stay behind. Thus we have to extend the range of our escorts."
 USA_strealine_fight_prod:0 "Streamline Fighter Production"
 USA_strealine_fight_prod_desc:0 "We have a strong industry, let us use it to optimize fighter production and overwhelm the enemy airforce with endless swarms of fighters."
 USA_controlling_skies:0 "Controlling the Skies"
 USA_controlling_skies_desc:0 "The control of the skies is the cornerstone of our air doctrine. Without the skies are planes serve only to show them off, with the skies we can win any war."
 USA_strategic_bomb_mod:0 "Stretegic Bomber Modernization"
 USA_strategic_bomb_mod_desc:0 "If we want to properly bomb the enemy, we have to ensure that we have the best planes available."
 USA_flying_fortresses:0 "Flying Fortresses"
 USA_flying_fortresses_desc:0 "Strategic bombers often perform long-range missions, with many encounters with enemy fighters. If we give our bombers enough strength to sustain themselves in the air and even fight back we will increase our mission efficiency."
 USA_the_plane:0 "The Plane"
 USA_the_plane_desc:0 "The plane is more important than the pilot. We have many men ready to pilot planes, however, we only have a limited number of planes and we have to improve them as much as we can."
 USA_usaf:0 "Create the USAF"
 USA_usaf_desc:0 "The time has come to get rid of Army supervision and estabilish and independent United States Air Force!"
 USA_improve_bombing:0 "Improve Bombing Strategies"
 USA_improve_bombing_desc:0 "Better bombing strategies will allow us to cripple the enemy's war industry more efficiently and with less casualties."
 USA_doctrinal_advances_air:0 "Doctrinal Advances"
 USA_doctrinal_advances_air_desc:0 "We should continue to focus on doctrinal advances in the field of Strategic Destruction to master this tactic."
 USA_the_pilot:0 "The Pilot"
 USA_the_pilot_desc:0 "The pilot is more important than the plane. We can produce many similar planes, however, master pilots are scarce. We have to devote our resources to pilot training."
 USA_control_seas_above:0 "Control the Seas from Above"
 USA_control_seas_above_desc:0 "Who says that you need to own a fleet to control the seas!? Someone with an outdated vision of warfare, for sure."
 USA_naval_bomber_mod:0 "Naval Bomber Modernization"
 USA_naval_bomber_mod_desc:0 "We can help in naval bombing missions if our planes are obsolete, a problem that luckily we can easily fix."
 USA_skip_bombing_focus:0 "Develop Skip-Bombing Tactics"
 USA_skip_bombing_focus_desc:0 "In order to better hit enemy shipping, our naval bombers will fly low and throw the bomb so that it skips across the water like a stone. If done properly, and with a low enough height, we can hit the enemy ship easily and sink it."
 USA_air_help_navy:0 "Help the Navy"
 USA_air_help_navy_desc:0 "Our airforce has other uses apart from bombing enemy cities and troops. We can use naval bombers to help our Navy to control the seas!"
 USA_selective_train_act:0 "Selective Training Act"
 USA_selective_train_act_desc:0 "It is time to re-activate conscription to get the US Army in shape. We only have to convince Congress to let us do it."
 USA_louisiana_manoeuvers:0 "Louisiana Maneuvers"
 USA_louisiana_manoeuvers_desc:0 "Conducting large-scale maneuvers and wargames in Louisiana will pull our army out of the doctrinal decadance it was installed in and help in our soldiers' training."
 USA_use_power:0 "Use Power"
 USA_use_power_desc:0 "The way we'll achieve victory will be through our massive industrial capacity that will allow us to mass produce artillery to destroy the enemy with minimal human losses."
 USA_use_speed:0 "Use Speed"
 USA_use_speed_desc:0 "The way we'll achieve victory will be through our massive industrial capacity that will allow us to mass produce tanks and trucks to quickly breach the enemy lines and reach our objectives."
 USA_ninety_divisions:0 "90 Divisions Plan"
 USA_ninety_divisions_desc:0 "Industrialists are very concerned with our conscription plans, fearing to lose workers. Thus we'll keep the Army in 90 Divisions only, allowing us to have more workers and increase our industrial capacity."
 USA_increase_conscription:0 "Increase Conscription"
 USA_increase_conscription_desc:0 "Industrialists can say whatever they want, if we need men to defend America, we'll have them. A massive conscription program will pull workers away from their benches and into the trenches!"
 USA_training_infantryman:0 "Train the Infantry"
 USA_training_infantryman_desc:0 "Our infantry is considerably worse then other nations'. We have to solve that with massive wargames, maneuvers and trainings to make it able to fight in the field."
 USA_walkie_talkies:0 "Walkie-Talkies"
 USA_walkie_talkies_desc:0 "Walkie-Talkies will allow our units to quicky and efficiently communicate with each other and with commanders, giving us more flexibility on the battlefield."
 USA_finish_motorization:0 "Finish Army Motorization"
 USA_finish_motorization_desc:0 "Army motorization is almost complete, let us finish it to overwhelm the enemy with our superior speed and logistical flexibility."
 USA_special_forces:0 "The Special Forces"
 USA_special_forces_desc:0 "It is time to devote resources to the development of our special forces, that will help our army perform specific and specialized missions with maximun efficiency."
 USA_sup_firepower:0 "Superior Firepower"
 USA_sup_firepower_desc:0 "Our military doctrine will rely on firepower and artillery to win battles. Men are expensive, bullets are cheap!"
 USA_reduce_human_losses:0 "Reduce Casualties"
 USA_reduce_human_losses_desc:0 "The primary goal of our strategy should be the reduction of human casualties to the minimum. We have a strong industry that will allow us to rely on equipment rather than in men."
 USA_shock_awe:0 "Shock & Awe"
 USA_shock_awe_desc:0 "The doctrine of Shock & Awe consists in making a show of force so impressive that leaves the enemy demoralized and almost defeated before entering combat. This strategy shall be the our way to victory, without uneccesary losses!"
 USA_support_rock_island:0 "Support Rock Island"
 USA_support_rock_island_desc:0 "The Rock Island arsenal could use some extra funds to help us develop the best artillery in the world!"
 USA_equipment_modernization_focus:0 "Equipment Modernization"
 USA_equipment_modernization_focus_desc:0 "We should focus on a general modernization of our infantry equipment: guns, ammunition, uniforms and so on."
 USA_tank_destroyers:0 "Tank Destroyer Doctrine"
 USA_tank_destroyers_desc:0 "Enemy tanks are an obstacle in our way to victory, an obstacle that we will overcome. Destroying enemy armor will be our new priority!"
 USA_support_companies:0 "Field Hospitals"
 USA_support_companies_desc:0 "To continue with our human preservation strategy, we will promote and improve our Field Hospitals, giving the the most modern medical equipment so that injured men come back into the fight."
 USA_industrial_warfare:0 "Industrial Warfare"
 USA_industrial_warfare_desc:0 "With such a big industrial muscle we have to rely on quantity rather than quality. If we focus on expanding our military production we can easily overwhelm enemy production."
 USA_top_notch:0 "Top-Notch Artillery"
 USA_top_notch_desc:0 "We have to focus on quality rather than quantity. If we develop the most modern artillery models in the world our armies will be unbeatable!"
 USA_the_army_rangers:0 "The Army Rangers"
 USA_the_army_rangers_desc:0 "The Army Rangers is not precisely a new corps, however, we shall expand and improve them to allow them to properly execute their missions."
 USA_munitions_board:0 "Munitions Board"
 USA_munitions_board_desc:0 "In order to better manage the logistical nightmare, we shall create the Munitions Board to coordinate army equipment and supply."
 USA_airborne_divisions:0 "Airborne Divisions"
 USA_airborne_divisions_desc:0 "Divisions that fight behind enemy lines, transported by plane, are the final advance that will allow our army to reach any point at any time."
 USA_form_armored_divisions:0 "Form Armored Divisions"
 USA_form_armored_divisions_desc:0 "It is time to form specific, specialized Armored Divisions that allow us to break enemy lines with ease!"
 USA_modernized_tanks:0 "Tank Modernization"
 USA_modernized_tanks_desc:0 "If we want to rely on tanks, we can't use obselete models. Let us focus all our energy in developing new, improved tank models that outmatch their competitors in battlefield."
 USA_mechanized_infantry:0 "Mechanized Infantry"
 USA_mechanized_infantry_desc:0 "A step formward from the motorized infantry, mechanized infantry will give us the flexibily of motorized divisions and the defense and strength or armored ones."
 USA_new_speed_based:0 "New Speed-Based Doctrines"
 USA_new_speed_based_desc:0 "Our new doctrines will be based on speed, on quickly knocking out the enemy with our superior vehicle force."
 USA_reliance_armor:0 "Rely on Armoured Divisions"
 USA_reliance_armor_desc:0 "Armored divisions shall form the backbone of our army. They will be the pillar from which we will trace other divisions' orders and moves."
 USA_work_auto_industry:0 "Work with the Auto Industry"
 USA_work_auto_industry_desc:0 "We have a strong automobile industry, let us collaborate with it to streamline truck production and better motorize our infantry."
 USA_maintenance_comp:0 "Improve Maintenance Companies"
 USA_maintenance_comp_desc:0 "Maintenance companies are key to not lose any vehicle on the battlefield, giving our divisions greater autonomy and saving us time and money."
 USA_maintain_edge:0 "Maintain the Edge"
 USA_maintain_edge_desc:0 "We have to continue our development of better, modern armored models. By maintaining the technological edge we will triumph over our enemies!"
 USA_streamline_vehicle:0 "Streamline Vehicle Production"
 USA_streamline_vehicle_desc:0 "We can sacrifice some quality in exchange of a vastly improved production chain that will allow us to produce all our army needs and much more!"
 USA_two_ocean_act:0 "Two-Ocean Navy Act"
 USA_two_ocean_act_desc:0 "Carl Vinson and David I. Walsh, two Democrats leaders of the House and Senate Naval committees respectively, have introduced a new bill called the Two Ocean Navy Act. If is the largest naval expansion bill in US history, granting an increase of 70%... if we manage to pass it."
 USA_second_vinson:0 "Second Vinson Act"
 USA_second_vinson_desc:0 "The Second Vinson Act is a new bill introduced by Congressman Carl Vinston ( D ), chairman of the Naval Affairs committee. If we convince Congress to pass this bill, we will be able to increase the navy size in 20%."
 USA_fleet_being:0 "Fleet in Being"
 USA_fleet_being_desc:0 "The basis of the navy is the navy itself, not naval aircraft. Our strong cruisers and batteships will sink any pesky carrier and secure the seas for the United States!"
 USA_carrier_fleet:0 "Carriers are the Future"
 USA_carrier_fleet_desc:0 "Carriers are the future of naval warfare, and only fools dispute that statement. Gigant Battleships are of no use if our planes send them to the bottom on the ocean."
 USA_usmc_expansion_cbts:0 "USMC Expansion"
 USA_usmc_expansion_cbts_desc:0 "The United States Marine Corps is very old, however, it is time to expand the USMC further. We'll need naval invasions to attack any enemy, and they are our men for the job!"
 USA_amphibious_vehicles:0 "Amphibious Vehicles"
 USA_amphibious_vehicles_desc:0 "Naval landings can be accompained with strong amphibious tanks and other vehicles to save time and men."
 USA_improved_landing_tactics:0 "Improved Landing Tactics"
 USA_improved_landing_tactics_desc:0 "From transport ship improvements to tactical and doctrinal advances, we have to do anything we can to improve our naval landing operations."
 USA_semper_fidelis:0 "Semper Fidelis"
 USA_semper_fidelis_desc:0 "Semper Fidelis, the motto of the USMC, is now more true than ever. Always Loyal, and with then we shall conquer any coastline in the world!"
 USA_improved_submarines:0 "Improved Submarines"
 USA_improved_submarines_desc:0 "Our submarines are very outdated, something that we can't allow. Let us focus on developing better submarines."
 USA_match_germans:0 "Match the Germans"
 USA_match_germans_desc:0 "Our submarine developments should be aimed at matching and surpassing the Germans, masters of submarine warfare."
 USA_improved_destroyers:0 "Improved Destroyers"
 USA_improved_destroyers_desc:0 "The best submarine is a sunk submarine. We won't let anyone to raid our convoy routes, and those who try to do so will be sunk by our destroyers."
 USA_liberty_ships:0 "Liberty Ships"
 USA_liberty_ships_desc:0 "The key to achieve victory in the seas in producing so many convoys that we can replenish faster than they are sunk. This new type of easily-produced convoys, called Liberty Ships, are ugly but serve their purpose."
 USA_grand_naval_expansion:0 "Grand Naval Expansion"
 USA_grand_naval_expansion_desc:0 "We are at war! It is time to massively expand our navy, surpassing those of our enemies and granting us undisputed dominance over the seas!"
 USA_surpass_royal_navy:0 "Surpass the Royal Navy"
 USA_surpass_royal_navy_desc:0 "The Royal Navy has been the largest navy in the world for centuries, but their time is over. The US Navy will become the new hegemonic navy in the world, and the British will have to accept it."
 USA_naval_base_construction:0 "Naval Base Construction"
 USA_naval_base_construction_desc:0 "In order to increase our naval reach, we need extensive naval bases across our island possessions. It is time to dramatically expand all our bases to increase our naval strategical flexibility."
 USA_supress_revolt_admirals:0 "Supress the Revolt of the Admirals"
 USA_supress_revolt_admirals_desc:0 "Many members of our navy have turned against us due to our recent decisions. We must show them who commands and who obeys."
 USA_follow_mahanian_doctrine:0 "Follow Mahanian Doctrine"
 USA_follow_mahanian_doctrine_desc:0 "The Mahanian doctrine that the Japanese follow is the way to victory in the Pacific: big battleships that win decisive battles."
 USA_decisive_battles:0 "Decisive Battles"
 USA_decisive_battles_desc:0 "We must be prepared to win key naval engagements that could decide an entire war."
 USA_fleet_concentration:0 "Fleet Concentration Strategy"
 USA_fleet_concentration_desc:0 "In order to win all decisive battles, we must concentrate our fleet to achieve local superiority and sink their ships!"
 USA_battleship_modernization:0 "New Battleships"
 USA_battleship_modernization_desc:0 "New and modern Battleships will sail across the sea, proudly waving the United States flag, sending any enemy of liberty to the bottom of the seas!"
 USA_heavy_cruisers_focus:0 "Cruiser Modernization"
 USA_heavy_cruisers_focus_desc:0 "Battleships are important, but cruisers are also key. We must improve our heavy cruisers to fight better in decisive engagements."
 USA_super_heavy_battleships:0 "Super-Heavy Battleships"
 USA_super_heavy_battleships_desc:0 "It is time to move one step further and produce super-heavy Battleships, unsinkable fortresses that can tear any enemy ship apart."
 USA_floating_fortresses:0 "Floating Fortresses"
 USA_floating_fortresses_desc:0 "Our naval is not composed by ships, but by floating fortresses. Unbreakable steel mountains that will send our enemies to their oceanic graves."
 USA_carrier_modernization:0 "Carrier Modernization"
 USA_carrier_modernization_desc:0 "If we want to rely on carriers, we need modern models. We should focus all our attention to get them."
 USA_light_ships_focus:0 "Light Ship Focus"
 USA_light_ships_focus_desc:0 "Light ships are important to keep our carriers safe and to perform less-important mission. Thus we need to improve them."
 USA_naval_radar:0 "Naval RADAR"
 USA_naval_radar_desc:0 "To coordinate naval aircraft, we need to equip our ships with a proper RADAR."
 USA_floating_airfield:0 "Floating Airfields"
 USA_floating_airfield_desc:0 "Our navy is not composed by ships, but by floating airfields, from which our aircraft controls the sea the same way it controls the land."
 USA_base_strike_doc:0 "Base Strike Doctrine"
 USA_base_strike_doc_desc:0 "Our doctrine will be based on the extensive use of carriers and naval aircraft to sink enemy carriers and battleships."
 USA_bureau_aereonautics:0 "Bureau of Aereonautics"
 USA_bureau_aereonautics_desc:0 "We should expand the Bureau of Aereonautics so that it serves it role of coordinating naval aircraft better."
 USA_improved_carrier_aircraft:0 "Improved Carrier Aircraft"
 USA_improved_carrier_aircraft_desc:0 "The carrier is the ship but also the planes. Better naval aircraft means a better fleet."
 USA_build_pentagon:0 "Build the Pentagon"
 USA_build_pentagon_desc:0 "The War Department has its headquarters in the Munitions Building, however, it is very overcrowded and spread out in addition buildings. We should build a new building to host the entire War Department and centralize operations."
 USA_uranium_comittee:0 "Uranium Committee"
 USA_uranium_comittee_desc:0 "Recent advances in uranium refining suggest that we should create a committee to evaluate its possible uses."
 USA_manhattan_project:0 "Manhattan Project"
 USA_manhattan_project_desc:0 "The Manhattan Project will be a secret scientific project that will work in the development of a new weapon, called the Atomic Bomb. The team, led by  J. Robert Oppenheimer, will be a mix of American and allied scientists and can deliver us a weapon that could destroy entire cities."
 USA_aec:0 "Atomic Energy Comission"
 USA_aec_desc:0 "With advances in atomic energy becoming widespread, we must create a Comission to oversee its effects and development."
 USA_defense_depart:0 "Department of Defense"
 USA_defense_depart_desc:0 "The time has come to merge the Departments of War and Navy into a new Department of Defense."
 
 
 USA_reviewthemilitary:0 "Review the Military"
 USA_reviewthemilitary_desc:0 "America needs to be defended! We can't neglect our brave soldiers, pilots and sailors who are ready to die for our country."
 USA_aging_army:0 "The Aging Army"
 USA_aging_army_desc:0 "The Army is not in a very good shape, as it has been slowly decaying since the Great War ended. We can improve it, but it would be difficult."
 USA_increase_army_funding:0 "Increase Army Funding"
 USA_increase_army_funding_desc:0 "We can try to get Congress approval for a new Army Renewal program. It would cost a lot of political capital, but it may be worth it."
 USA_small_arms_modernization:0 "Small Arms Modernization"
 USA_small_arms_modernization_desc:0 "As a part of our modernization program, we must improve our handguns and ammunition."
 USA_artillery_modernization:0 "Artillery Modernization"
 USA_artillery_modernization_desc:0 "As a part of our modernization program, we must improve our artillery designs and tactics."
 USA_improve_soldier_training:0 "Improve Soldier Training"
 USA_improve_soldier_training_desc:0 "We should allow commanders to train with their units, improving the quality of the individual soldier."
 USA_new_doctrinal_developments:0 "New Doctrinal Developments"
 USA_new_doctrinal_developments_desc:0 "New tactics and strategies will give us the edge on the battlefield."
 USA_continue_modernizing_army:0 "Continue Modernizing the Army"
 USA_continue_modernizing_army_desc:0 "We can't stop now. We have to continue modernizing our land army, slowly but surely."
 USA_air_corps:0 "The Air Corps"
 USA_air_corps_desc:0 "We lack a proper airforce, as the American Air Corps is strictly subordinated to the army. We can still expand it to ensure our control of the skies."
 USA_new_aircraft_designs:0 "New Aircraft Designs"
 USA_new_aircraft_designs_desc:0 "New engines and aircraft models will need to be researched and adopted to improve our airforce."
 USA_modern_bombers:0 "Modern Bombers"
 USA_modern_bombers_desc:0 "Recent technical innovations will allow us to be more competitive on the construction and research of new bomber models."
 USA_air_mail_scandal:0 "The Air Mail Scandal"
 USA_air_mail_scandal_desc:0 "With airlines exploiting the air mail duties for their own benefit, the Air Corps shall take over the mailing duties. This will allow us to significantly expand the Corps."
 USA_expand_air_corps:0 "Expand the Air Corps"
 USA_expand_air_corps_desc:0 "First things first, we must dramatically increase the number of planes at our disposal, both fighters and bombers."
 USA_ghq_airforce:0 "General Headquarters Airforce"
 USA_ghq_airforce_desc:0 "We now must stabilish a centralized, air force-level command headed by an aviator answering directly to the Army Chief of Staff. It will be called General Headquarters Airforce and it will be a permanent, peacetime tactical organization."
 USA_renew_air_corps_leadership:0 "A New Chief of the Air Corps"
 USA_renew_air_corps_leadership_desc:0 "Benjamin Foulois is dead politically, so we now must choose a new Chief of the Air Corps."
 USA_modern_aerial_force:0 "A Modern Aerial Force"
 USA_modern_aerial_force_desc:0 "We can't stop now. We have to continue investing, expanding and reorganizaing the Air Corps until we have a truly modern aerial force."
 USA_tame_navy:0 "The Tame Navy"
 USA_tame_navy_desc:0 "The US Navy is crucial for our interests in the Pacific and the Caribbean. We can't let it fall and get out of shape."
 USA_submarine_challenge:0 "The Submarine Challenge"
 USA_submarine_challenge_desc:0 "We shall overcome the technical difficulties and problems and develop modern and cheap submarines that will be able to raid trade routes with ease."
 USA_vinston_trammel:0 "The Vinson-Trammel Act"
 USA_vinston_trammel_desc:0 "We have to convince Congress of three things: a naval base construction program, the expansion of our naval production capabilities, and a general improvement of our capital ships."
 usa_unlock_naval_tree:0 "§GUnlock the naval tree!§!"
 USA_expand_shipbuilding:0 "Expand our Shipbuilding Capabilities"
 USA_expand_shipbuilding_desc:0 "We must use money provided by the Vinson-Trammel Act to expand our shipyards, increasing our naval production capacity."
 USA_further_dockyard_expansion:0 "Further Dockyard Expansion"
 USA_further_dockyard_expansion_desc:0 "We must continue expanding our shipbuilding capabilities to ensure we can repair and produce our ships at a good speed."
 USA_bases_pacific:0 "Bases in the Pacific"
 USA_bases_pacific_desc:0 "The Vinson-Trammel provided funds to expand our naval bases in the Pacficic, however, not on Hawaii. Wake Island or the Dutch Harbor are some of the chosen installations to be expanded."
 USA_capital_ship_projects:0 "Capital Ship Projects"
 USA_capital_ship_projects_desc:0 "The Vinson-Trammel Act provides funding to improve our capital ships, so we must use it."
 USA_yorktown_ranger:0 "The Yorktown and Ranger Classes"
 USA_yorktown_ranger_desc:0 "We new more modern carriers to adapt to the new times. Carrier warfare may be the future, and we must be ready for it."
 USA_north_carolina_class:0 "The North Carolina Class"
 USA_north_carolina_class_desc:0 "We can't fall behind in the battleship race. The North Carolina Class will bring more firepower to our already strong navy."
 USA_continue_carrier_development:0 "Continue Carrier Development"
 USA_continue_carrier_development_desc:0 "We must continue carrier research. Aircraft Carriers are the future, and if we neglect them we lose the battle for the seas."
 USA_continue_battleship_development:0 "Continue Battleship Development"
 USA_continue_battleship_development_desc:0 "Without battleships we are nothing. We must continue developing even stronger battleships with more firepower and better defense!"
 USA_naval_act:0 "Naval Act of [GetYear]"
 USA_naval_act_desc:0 "The Vinson-Trammel Act served us well, but to continue our naval efforts we need a new Naval Act, that provides more funding for our future naval projects."
 
 USA_new_foreign:0 "New Foreign Policy"
 USA_new_foreign_desc:0 "With a new President comes a new Foreign Policy!"
 USA_good_neighbour:0 "The Good Neighbor Policy"
 USA_good_neighbour_desc:0 "Our interventionism in Central and South America has to end, or at least, it has to be reduced. We have to get along better with our neighbours."
 USA_withdraw_nicaragua:0 "Withdraw From Nicaragua"
 USA_withdraw_nicaragua_desc:0 "We shall finish what Hoover started and complete our military withdrawal from Nicaragua."
 USA_montevideo_convention:0 "Montevideo Convention"
 USA_montevideo_convention_desc:0 "To prove our friendly intentions, we shall sign a convention forbidding meddling in other american countries' internal politics."
 USA_withdraw_haiti:0 "Withdraw From Haiti"
 USA_withdraw_haiti_desc:0 "We are ready to withdraw from Haiti, thus finishing our military occupations in the Caribbean."
 USA_philippine_independence:0 "Philippine Independence"
 USA_philippine_independence_desc:0 "It is time to grant the Philippines the full right to self-governance, reducing our military and political presence there."
 USA_neutrality_act:0 "Neutrality Act of [GetYear]"
 USA_neutrality_act_desc:0 "To ensure Congress support for our other acts, we shall support a Neutrality Act that would reinforce our isolationist policies."
 USA_reciprocal_tariff:0 "Reciprocal Tariffs Act"
 USA_reciprocal_tariff_desc:0 "The Reciprocal Tariffs Act will allow the President to sign juicy trade deals with other countries, thus contributing with national, and international, economic recovery."
 USA_recognize_soviet:0 "Recognize the Soviet Union"
 USA_recognize_soviet_desc:0 "It is time to acknowledge the fact that the USSR represents Russia now. When we recognize them we can stabilish relations that bring profits to both parts."
 USA_tsarist_debts:0 "Demand Repayment of Tsarist Debts"
 USA_tsarist_debts_desc:0 "We have recognized the USSR, now we expect them to pay us back. The debts contracted by Tsarist Russia should be repayed, and that duty rests on the USSR's shoulders now."
 USA_anti_espionage:0 "Anti-Espionage Treaty"
 USA_anti_espionage_desc:0 "We have to foster cooperation between the USA and the USSR, and to do that we have to trust each other. To trust each other, we need to stop spying on each other."
 haiti_usa_occupation:0 "American Military Occupation"
 nic_usa_occupation:0 "American Military Presence"
 sov_tsarist_debts:0 "Tsarist Debts Repayed"
 usa_tsarist_debts:0 "Repayment of Tsarist Debts"
 
 USA_we_are_war:0 "We Are at War"
 USA_we_are_war_desc:0 "We couldn't achieve peace, and now we find ourselves fighting in the biggest conflict of human history. We shall fight hard, and with determination, victory will be achieved!"
 USA_the_homefront:0 "The Homefront"
 USA_the_homefront_desc:0 "We can't neglect our economic and political matters. We must keep a war economy ready, our people motivated, and our political sphere united, or we might be defeated from the inside."
 USA_the_war_abroad:0 "The War Abroad"
 USA_the_war_abroad_desc:0 "We are at war, although obviously it is not fought in our soil. With diplomacy and strength we will win!"
 USA_strategic_planning_focus:0 "Strategic Planning"
 USA_strategic_planning_focus_desc:0 "We can't go to war without thinking our strategy first. We must plan, then act."
 USA_create_oss:0 "Office of Strategic Services"
 USA_create_oss_desc:0 "If we want to wage war properly we need an intelligence agency like the MI5 or the SOE. To that end, the Office of Strategic Services, led by Major General William Joseph Donovan, shall be created."
 USA_navajo_code_talkers:0 "Navajo Code Talkers"
 USA_navajo_code_talkers_desc:0 "One way to ensure our enemies are unable to understand our communications is using Native Americans in both ends of the line, as it is clear that our enemies don't know a word of their languages."
 USA_foreign_infiltration:0 "Foreign Infiltration"
 USA_foreign_infiltration_desc:0 "Our intelligence must be used offensively, inflintrating enemy countries, gathering intel, and destroying them from the inside."
 USA_train_resistance_movements:0 "Train Resistance Movements"
 USA_train_resistance_movements_desc:0 "Resistance movements in nations occupied by the enemy must be trained and organized. This way, we can count on the support of their people and disrupt their communications and logistics at the same time."
 USA_op_dixie:0 "Operation Dixie"
 USA_op_dixie_desc:0 "We officially provide help to the Kuomintang government of China, but the Chinese communists are also important in our anti-japanese strategy. We must send some OSS agents to train their troops."
 USA_coordinate_anti_german:0 "Coordinate Anti-German Resistance"
 USA_coordinate_anti_german_desc:0 "All across Europe, many resistance movements stand disorganized and unmotivated against the german occupation. Our OSS agents will solve that."
 USA_agreement_with_sicilian_mob:0 "Agreement with the Sicilian Mob?"
 USA_agreement_with_sicilian_mob_desc:0 "If we are going to invade Italy, the support of the mafia could be of great help. We shall speak to Lucky Luciano, to see if they would be up for a deal."
 USA_create_jcs:0 "Joint Chiefs of Staff"
 USA_create_jcs_desc:0 "In order to better organize our Armed Forces, we shall create the Joint Chiefs of Staff, where the commanders of the US Army, the US Navy and the USAAF can meet and discuss war strategies."
 USA_appoint_cjcs:0 "Appoint a JCS Chairman"
 USA_appoint_cjcs_desc:0 "The JCS could use a leading figure in order to better organize it. The best candidate is undoubtly admiral William D. Leahy, who has the full support of the President."
 USA_jssc:0 "Joint Strategic Survey Committee"
 USA_jssc_desc:0 "Attached to the JCS, the JSSC will handle military planning and strategies. The creation of this committee will be a great boon towards our planning capabilities."
 USA_sideline_civilian_secretaries:0 "Sideline Civilian Secretaries"
 USA_sideline_civilian_secretaries_desc:0 "If we want to have an effective leadership, we need to hand over the management of the war to professionals. The Secretaries of War and Navy will have no say over military operations."
 USA_financing_war:0 "Financing the War"
 USA_financing_war_desc:0 "Our first priority should be finding enough money to finance the war effort. We must take any measure we can to keep our economy going."
 USA_war_prod_board:0 "War Production Board"
 USA_war_prod_board_desc:0 "The War Production Board will oversee and regulate military production and construction projects, giving us more control over our war industry."
 USA_create_owi:0 "Office of War Information"
 USA_create_owi_desc:0 "The Office of War Information will be the key to win the hearts and minds of our people, as it will control state propaganda. We need to keep our people moralized and supportive or we will lose the war quickly."
 USA_war_bonds:0 "War Bonds"
 USA_war_bonds_desc:0 "We need to convince our people to buy War Bonds, financing the war effort. This policy, will greatly benefit our economy and will give us lots of money to spend in other projects."
 USA_promote_war_bonds:0 "War Bonds Promotion Campaign"
 USA_promote_war_bonds_desc:0 "Famous actors, singers and other celebrities shall tour the country, asking the people to buy War Bonds. Our official government propaganda will also follow the same line, hoping to dramatically increase War Bonds sales."
 USA_ten_percent_club:0 "The Ten Percent Club"
 USA_ten_percent_club_desc:0 "Every factory where all employed workers use 10% of their wages to buy War Bonds shall become a member of the Ten Percent Club, giving them a special symbol to show with pride. We need ideas like this in order to get as many people as possible to use 10% of their wages to buy War Bonds."
 USA_every_american_counts:0 "Every American Counts"
 USA_every_american_counts_desc:0 "We need to include everyone in the war effort. If our people feel that they are important, they will be important."
 USA_raise_taxes:0 "Raise Taxes"
 USA_raise_taxes_desc:0 "The most straightforward solution to the money problem is just raising taxes. We have Congress on our side, we should do it in order to have available funds for other projects."
 USA_expand_tax_base:0 "Expand the Tax Base"
 USA_expand_tax_base_desc:0 "Raising taxes to those who already pay is not the only way to increase tax income. We can also make more people pay taxes, through lowering the requirements, in order to get more income."
 USA_end_unemployment:0 "End Unemployment"
 USA_end_unemployment_desc:0 "With the economy being mobilized, unemployment is no more. We need to get every available worker into the economic war effort."
 USA_secure_union_support:0 "Secure Union Support"
 USA_secure_union_support_desc:0 "The biggest trade unions, the AFL and the CIO, are willing to support us during the war. If we can get their support, our workers would be certainly more mobilized."
 USA_increase_agrarian_production:0 "Increase Agrarian Production"
 USA_increase_agrarian_production_desc:0 "We can't neglect agrarian production. With so many farmers moving to the urban factories, we need to ensure that we keep a steady food supply."
 USA_rationing:0 "Rationing"
 USA_rationing_desc:0 "Food needs to be rationed, but we should reach further than that. We need to take every scrap of an useful resource to fuel our war production. Let nothing go to waste!"
 USA_driving_limits:0 "Driving Limits"
 USA_driving_limits_desc:0 "We need to limit fuel usage, and the first step should be limiting sightseeing driving or car races. Although we have plenty of oil, we can't maintain these luxuries anymore."
 USA_bracero_program:0 "The Bracero Program"
 USA_bracero_program_desc:0 "Some advisors have proposed to reach a deal with Mexico, allowing Mexican agrarian workers to come to the USA and keep agrarian production high. We should begin talks with Mexico about that proposal."
 USA_women_workforce:0 "Women in the Workforce"
 USA_women_workforce_desc:0 "We need to include everyone, and everyone means everyone. While men fight in the seas and in the battlefields, our women will replace them in the factories, allowing us to increase our war production!"
 USA_promote_nurses:0 "Promote Nurses"
 USA_promote_nurses_desc:0 "Nursing in the best way we can use our patriotic women in the battlefield. With skilled nurses and doctors, no injured soldier will die!"
 USA_we_can_do_it:0 "We Can Do It!"
 USA_we_can_do_it_desc:0 "With the inclusion of women in the war effort, we need to create specific proganda delivered towards them, so their mobilization is fully complete!"
 USA_oversee_hollywood:0 "Oversee Hollywood"
 USA_oversee_hollywood_desc:0 "Hollywood is a very efficient way to deliver a message to millions of people. We should control it, or at least partially, in order to introduce propaganda and remove defeatism."
 USA_air_bombing_drills:0 "Air Bombing Drills"
 USA_air_bombing_drills_desc:0 "Although the risk of air bombings in our homeland is very low, regular air bombing drills will keep our people part of the war effort, motivating them, while also preparing them in the unlikely event of a real bombing."
 USA_fight_pacifism:0 "Fight Pacifism"
 USA_fight_pacifism_desc:0 "Pacifism is a threat to the war effort. We need to convince our people that we need to fight, by any means neccessary!"
 USA_intensified_propaganda:0 "Intensified Propaganda"
 USA_intensified_propaganda_desc:0 "With an efficient use of the Office of War Information and massive propaganda campaigns, we can convince pacifists to stop complaining and join the fight!"
 USA_your_country_needs_you:0 "Your Country Needs You!"
 USA_your_country_needs_you_desc:0 "Continued propaganda will show the pacifists that we need them, but they need us as well. Patriotic sentiment is very easy to manipulate."
 USA_repress_pacifists:0 "Repress Pacifists"
 USA_repress_pacifists_desc:0 "We don't have the time to convince each individual pacifist to support the war, we need more extreme measures. Crackdown and repression are sadly in order."
 USA_war_security_act:0 "War Security Act"
 USA_war_security_act_desc:0 "The War Security Act will greatly increase our capacities to repress pacifists and punish sabotage during times of war. Very controversial, Congress has to approve it."
 USA_pacifism_destroyed:0 "Pacifism Destroyed"
 USA_pacifism_destroyed_desc:0 "Pacifism has been finally put down, and our people are now supportive of the war effort. At least for now."
 USA_increase_military_production:0 "Increase Military Production"
 USA_increase_military_production_desc:0 "To put it bluntly, we need to tell the WPB to produce more, in general. We have an enormous industry, let us exploit its potential."
 USA_streamline_production_chain:0 "Streamline the Production Chain"
 USA_streamline_production_chain_desc:0 "We need to completely control all the stages in the production process, from the raw resource to the finished weapon. Streamlining this process will greatly increase our factory output."
 USA_board_economic_warfare:0 "Board of Economic Warfare"
 USA_board_economic_warfare_desc:0 "The Board of Economic Warfare will manage both trade matters and most importantly, raw resource extraction and refining."
 USA_rubber_survey_committee:0 "Rubber Survey Committee"
 USA_rubber_survey_committee_desc:0 "Rubber is one of the few things we lack, and we should dedicate all our efforts to produce our own synthetic rubber."
 USA_domestic_chromium_prod:0 "Domestic Chromium Production"
 USA_domestic_chromium_prod_desc:0 "We produce very little chromium, and although we would still need to import the majority of it, we can save some resources if we extract our own chromium in Alaska and Oregon."
 USA_petroleum_reserves:0 "Petroleum Reserves Corporation"
 USA_petroleum_reserves_desc:0 "You can never have enough oil, as it is the black blood that gives life to our armed forces. We should focus on increasing oil production."
 USA_usace_projects:0 "USACE Projects"
 USA_usace_projects_desc:0 "From military factories to bases, the USACE shall begin extensive construction projects across the USA. "
 USA_airbase_expansion:0 "Airbase Expansion"
 USA_airbase_expansion_desc:0 "The USACE has planned an airbase expansion across the country, in order to improve our aerial infraestructure. We need to authorize that."
 USA_tank_assembly_plants:0 "Tank Assembly Plants"
 USA_tank_assembly_plants_desc:0 "The USACE will construct specialized tank assembly plants, that will have a higher tank output than the rest of the factories, giving us the edge in vehicle production."
 USA_scientist_haven:0 "Scientist Haven"
 USA_scientist_haven_desc:0 "Scientists across the world, especially those in opressed countries, must know the the USA is the safest and the most free country where they can work."
 
 USA_the_war_asia:0 "The War in Asia"
 USA_the_war_asia_desc:0 "The Empire of Japan is clear threat to the security of the United States, and its destruction will be our top priority."
 USA_the_war_europe:0 "The War in Europe"
 USA_the_war_europe_desc:0 "We need to liberate Europe from tyranny, as the New World comes save the Old. We must decide our approach here."
 USA_our_allies:0 "Our Allies"
 USA_our_allies_desc:0 "Coordination with our allies is vital. If we stand together, victory is inevitable!"
 USA_unrestricted_sub:0 "Unrestricted Submarine Warfare"
 USA_unrestricted_sub_desc:0 "The Japanese rely completely on their resource shipments. If we cut their naval supply lines with submarines, we will gain a major strategic advantage over them."
 USA_fortify_hawaii:0 "Fortify Hawaii"
 USA_fortify_hawaii_desc:0 "Hawaii is very vulnerable to Japanese attacks. We need to fortify it so the Japanese advance stops there."
 USA_doolittle_raid:0 "Doolittle Raid"
 USA_doolittle_raid_desc:0 "A small bombing raid won't cause great damage to their economy, but it will greatly help with our morale, as we started the war on the defensive and the people want to see offensive successes."
 USA_island_hopping:0 "Island Hopping Strategy"
 USA_island_hopping_desc:0 "From island to island, we shall eventually reach Japan. We can even leave the less important islands behind, as their garrisons lack any offensive capacity."
 USA_reach_out_ast:0 "Reach out to Australia"
 USA_reach_out_ast_desc:0 "The Australians are fighting hard against Japan, with little luck. Hopefully with our help they can turn the situation around."
 USA_fortify_phil:0 "Fortify the Philippines"
 USA_fortify_phil_desc:0 "We managed to hold onto the Philippines, but we may not be able to keep it for long unless we prepare to defend it."
 USA_new_guinea:0 "Fortify New Guinea"
 USA_new_guinea_desc:0 "The Philippines have been lost. New Guinea is our last line of defense before Japan can prepare offensives into core Australian territory."
 USA_solomon:0 "The Solomon Islands"
 USA_solomon_desc:0 "The first step of our southern island hopping strategy has been successful, as the Solomon Islands are ours."
 USA_marshall:0 "The Marshall Islands"
 USA_marshall_desc:0 "The first step of our eastern island hopping strategy has been successful, as the Marshall Islands are ours. Now we can expand military infraestructure there in preparation for our next action."
 USA_improve_navy:0 "Improve the Navy"
 USA_improve_navy_desc:0 "The Army is secondary in the Pacific Theater. It will the airforce, but above all the Navy, the ones to defeat the Japanese Empire. We must act accordingly and focus on naval improvements."
 USA_usmc_expansion:0 "USMC Expansion"
 USA_usmc_expansion_desc:0 "The USMC is vital to secure smaller islands and perform effective amphibious campaigns. We need our marines to be more, and we need them to be even better."
 USA_collaborate_dutch:0 "Collaborate with the Dutch"
 USA_collaborate_dutch_desc:0 "The Dutch are having a hard time defending their East Indies from the Japanese monster, and they would surely use some of our help. We need Japan to stop now."
 USA_bismarck:0 "The Bismarck Islands"
 USA_bismarck_desc:0 "The second step of our southern island hopping strategy has been successful, as the Bismarck Islands are ours."
 USA_marianas:0 "The Mariana Islands"
 USA_marianas_desc:0 "The second step of our eastern island hopping strategy has been successful, as the Mariana Islands are ours. Now we can expand military infraestructure there in preparation for our next action."
 USA_indonesia_lib:0 "Indonesian Liberation"
 USA_indonesia_lib_desc:0 "With Indonesia in our hands, we can finally transfer its control to its rightful owner, ending our temporary military occupation. This should free more men for other campaigns."
 USA_phi_liberation:0 "Philippine Liberation"
 USA_phi_liberation_desc:0 "The Philippines are ours again! We must oversee the return of its legitimate government and transfer control to local soldiers, freeing up men for other campaigns."
 USA_iwo_jima:0 "Secure Iwo Jima"
 USA_iwo_jima_desc:0 "Iwo Jima is ours! Now we can properly launch strategic bombing campaigns on Japanese soil. This is a great step towards victory!"
 USA_okinawa:0 "Secure Okinawa"
 USA_okinawa_desc:0 "Okinawa is ours! Control over the North China Sea is now a possibility, and an invasion of the Japanese Home Islands or their mainland holdings is now a real possibility."
 USA_return_taiwan:0 "Return Taiwan"
 USA_return_taiwan_desc:0 "Taiwan rightfully belongs to the Republic of China, so we must transfer its ownership to them now. However, they can't assume real control of the island yet, so we will occupy it until the war is over."
 USA_koa:0 "Korean Occupation Authority"
 USA_koa_desc:0 "With Korea in our hands, and with the post-war in mind, we will set up a Korean Occupation Authority, with General John R. Hodge at its head. It will oversee civilian matters in Korea until proper elections can be held."
 USA_transfer_manchuria:0 "Transfer Manchuria"
 USA_transfer_manchuria_desc:0 "Manchuria is ours! We must transfer ownership of it to the rightful Chinese government, before the communists can set up bases there."
 USA_prepare_final_offensive:0 "Prepare the Final Offensive"
 USA_prepare_final_offensive_desc:0 "It is time to invade the Japanese Home Islands. It will cost many lives, but the war has to end, and this is the only way. Victory is near!"
 USA_victory_asia:0 "Victory in the Pacific"
 USA_victory_asia_desc:0 "Victory is ours! Japan has surrendered, and their aggresive actions across Asia and the Pacific have been avenged. How we must think about what to do with Japan, and finish the war in Europe."
 USA_support_kmt:0 "Befriend China"
 USA_support_kmt_desc:0 "The rightful Chinese government of the KMT is a very valuable ally against the Japanese. We must support Chiang Kai-Shek against bothe communists and japanese to ensure a friendly China after the war."
 USA_china_air_task_force:0 "China Air Task Force"
 USA_china_air_task_force_desc:0 "In order to help China dealing with Japan, we can dispatch some war planes to dispute the Chinese skies to the Japanese."
 USA_burma_campaign:0 "Burma Campaign"
 USA_burma_campaign_desc:0 "We have troops in Burma, containing the Japanese advance there. We must be ready and drive them out of the region as soon as we can."
 USA_friendly_thai_government:0 "A Friendly Thai Government"
 USA_friendly_thai_government_desc:0 "The pro-Japanese government of Thailand has fled as our forces occupy the country. It is time to set up a friendly Thai government that rejoins the war in our side."
 USA_ties_uk:0 "Ties With Britain"
 USA_ties_uk_desc:0 "Britain is our most valuable and reliable ally in this war. We have common interests in both Asia and Europe, and a special relantionship that will surely help us coordinate our war efforts."
 USA_reinforce_indian_forces:0 "Support British Indian Forces"
 USA_reinforce_indian_forces_desc:0 "Soldiers of the British Raj are a very valuable asset in our war in Asia against the Japanese Empire. They can help contain Japan in Southeast Asia, and they will do so more effectively with our help."
 USA_repeal_exclusion:0 "Repeal the Chinese Exclusion Acts"
 USA_repeal_exclusion_desc:0 "If we are now friends with China, we can't maintain the old Chinese Exclusion Acts that have been in place since the last century."
 USA_combined_chiefs:0 "Combined Chiefs of Staff"
 USA_combined_chiefs_desc:0 "In order to coordinate our war efforts, we shall unite American and British Chiefs of Staff in the Combined Chiefs of Staff, that will be the central authority of allied war effort."
 USA_technological_cooperation:0 "Technological Cooperation"
 USA_technological_cooperation_desc:0 "If we want to win the war we have to share everything we know with each other. Let no research go to waste."
 USA_declaration_un:0 "Declaration by United Nations"
 USA_declaration_un_desc:0 "The League of Nations was a failure, but now we can try the concept again, this time learning from our mistakes. We have to publish a joint manifesto calling for the creation of a global peacekeeping organization, inviting anyone who joins the war in our side to join."
 USA_support_france_free:0 "Support Free France"
 USA_support_france_free_desc:0 "Free France is undoubtly in our side, and they need help to beat their fascist rivals. We shall provide that help."
 USA_approach_dutch:0 "Approach the Dutch"
 USA_approach_dutch_desc:0 "The Netherlands have been defeated, but their possesions in Guiana and Curaçao will be useful for oil production and refining. We must talk to them about that."
 USA_southern_allies:0 "Southern Allies"
 USA_southern_allies_desc:0 "While our relations with Mexico have not been exactly friendly these last decade, the Good Neighbor Policy should have placated them a bit, just enough to discuss the possibility of them entering the war on our side."
 USA_central_am_faction:0 "Invite the Central Americans"
 USA_central_am_faction_desc:0 "If they want to join the United Nations, they must join our side! And we won't tolerate rogue nations in our backyard..."
 USA_south_am_faction:0 "Invite South America"
 USA_south_am_faction_desc:0 "South American countries face little risks if they declare war, and doing so would secure them a place in the United Nations. Perhaps they might be willing to do it."
 USA_leadership_allies:0 "Assume War Leadership"
 USA_leadership_allies_desc:0 "We are by far the most powerful member of our faction. They say that with great power comes great responsibility; we have the power, let us take the responsibility as well."
 USA_friends_in_canada:0 "Friends in Canada"
 USA_friends_in_canada_desc:0 "Canada is very important, geopolitically, to our position. Luckily, they are allies in this war, let us strenghten our bonds for mutual benefit."
 USA_pjbd:0 "Permanent Joint Board on Defense"
 USA_pjbd_desc:0 "The Permanent Joint Board of Defense shall oversee the defense of the North American continet, especially on the West Coast against the Japanese."
 USA_alaska_highway:0 "The Alaska Highway"
 USA_alaska_highway_desc:0 "We need to convince Canada to let us build a highway that connects our main territory with Alaska, so we can get more out that territory."
 USA_unlikely_ally:0 "An Unlikely Ally"
 USA_unlikely_ally_desc:0 "The USSR would not be our first choice for an alliance, but the fascists that threaten both of our countries will give us no quarter, so we must fight together."
 USA_intensify_lend_lease:0 "Intensify Lend-Lease Efforts"
 USA_intensify_lend_lease_desc:0 "Lend-Lease has proven vital in the Soviet war effort, and we will gladly continue that policy. Send food, trucks, weapons, tanks and everything they might need!"
 USA_arca:0 "American-Russian Cultural Association"
 USA_arca_desc:0 "The ARCA will be an useful tool in cultivating friendship between our peoples and make our alliance with the USSR more popular."
 USA_coordinate_military_operations:0 "Coordinate Military Operations"
 USA_coordinate_military_operations_desc:0 "The Soviets are fading. Their enemies have almost defeated the mighty Russians, so they must understand that this is no time for disputes and we must achieve total operational unity."
 USA_stronger_separate:0 "Stronger Separate"
 USA_stronger_separate_desc:0 "Although allies in name, there's little coordination with the soviets. And that's for the best: once fascism is defeated, this alliance won't last long."
 USA_through_britain:0 "Through Britain"
 USA_through_britain_desc:0 "Britain has fallen, and our first priority should be liberating the Isles. It will also serve as a gateway to Europe, once it is completely controlled."
 USA_through_africa:0 "Through Africa"
 USA_through_africa_desc:0 "Before assaulting Europe, we must ensure allied control of Africa. Kicking out the fascists from there will give us control over the Mediterranean."
 USA_through_iberia:0 "Through Iberia"
 USA_through_iberia_desc:0 "Spain is controlled by fascists, something that we can't allow. It also provides a good way to get into Europe and ensure control over Gibraltar."
 USA_victory_britain:0 "Victory in Britain"
 USA_victory_britain_desc:0 "We did it! Britain has been liberated, and we can now plan for further operations in Europe."
 USA_take_over_iceland:0 "Take Over Iceland and Greenland"
 USA_take_over_iceland_desc:0 "In order to get closer to the North Sea and Europe, we need to take over the Danish Atlantic Possessions: Iceland and Greenland."
 USA_north_atlantic_buildup:0 "North Atlantic Buildup"
 USA_north_atlantic_buildup_desc:0 "We control the North Atlantic, but we lack the infraestructure needed to launch a proper invasion of Britain. We must fix that."
 USA_activate_british_resistance:0 "Activate British Resistance"
 USA_activate_british_resistance_desc:0 "Britain will not stand foreign occupation! With proper arming and training, we can activate the British Resistance and make our enemies' occupation of the Isles a nightmare."
 USA_british_militia:0 "British Militia"
 USA_british_militia_desc:0 "We must continue our support for the British Resistance, and now that we control some land in Britain, we can recruit some of them as militia. That should keep our own death count low."
 USA_victory_africa:0 "Victory in Africa"
 USA_victory_africa_desc:0 "We have won! North Africa is completely on our hands, and we can begin to plan further operations in the Mediterranean."
 USA_improve_airborne:0 "Improve Airborne Infantry"
 USA_improve_airborne_desc:0 "If we want to quickly land in the African shores, a strong airborne infantry will be of great help."
 USA_keep_subs_away:0 "Keep Submarines Away"
 USA_keep_subs_away_desc:0 "Enemy submarines could disrupt this whole operation easily, cutting or precious supply line. We can't allow that to happen."
 USA_secret_contacts:0 "Secret Contacts"
 USA_secret_contacts_desc:0 "Many officials in French Africa would prefer to surrender the colony to the Free French rather than die protecting it. We can begin contacting them for... an easier campaign..."
 USA_prepare_algiers_coup:0 "Prepare the Algiers Coup"
 USA_prepare_algiers_coup_desc:0 "The time has come. We will launch a coup in Algiers that will remove the collaborationist officials and set a friendly administration that joins our side immediately."
 USA_victory_iberia:0 "Victory in Iberia"
 USA_victory_iberia_desc:0 "Iberia is ours! As our enemies cross the Pyrenees, we can begin preparing further operations in France and the Western Mediterranean."
 USA_canarian_lease:0 "Canarias Lease"
 USA_canarian_lease_desc:0 "The Spaniards will understand the importance of the Canary Islands and our need to administer it as long as the war is raging. They are in no position to refuse in any case."
 USA_baleric_lease:0 "Baleares Lease"
 USA_baleric_lease_desc:0 "The Balearic Islands are in an excellent position to control the Mediterranean. Perhaps we could, you know, borrow them, at least until the war is over?"
 USA_restore_republican:0 "Restore the Republican Government"
 USA_restore_republican_desc:0 "The Spanish Republic was defeated and its government exiled in the Spanish Civil War. While some people propose to set up a new Spanish government in our occupied land, we could simply restore the republican exiled government. That way, the new government won't be seen as foreign collaborators, as it was voted in by the spaniards themselves."
 USA_activate_spanish_resistance:0 "Activate Spanish Resistance"
 USA_activate_spanish_resistance_desc:0 "Spanish Resistance is very strong, as their guerrilla tradition is old and fierce. With our weapons and our training they'll be able to liberate Spain by themselves."
 USA_the_euro_fortress:0 "The European Fortress"
 USA_the_euro_fortress_desc:0 "We have secured a gateway, not it is time to enter the fortress. Europe is well protected, it will be a hard campaign, but in the end, victory awaits!"
 USA_liberate_balkans:0 "Liberate the Balkans"
 USA_liberate_balkans_desc:0 "The Balkans are a great position from which to enter both Central and Eastern Europe. We must prepare a campaign there."
 USA_victory_balkans:0 "Victory in the Balkans"
 USA_victory_balkans_desc:0 "We did it! The Balkans are ours now, and we can begin preparing plans for further offensives inside Europe."
 USA_support_greek_partisans:0 "Support Greek Partisans"
 USA_support_greek_partisans_desc:0 "Greek Partisans could be a great asset in the Greek Campaign if we properly arm them and train them."
 USA_yugoslavian_issue:0 "The Yugoslavian Issue"
 USA_yugoslavian_issue_desc:0 "Yugoslavia has been occupied by our forces, but right now it is a mess of communists and royalists partisans, occupier remnants, regional nationalists and more factions. We shall clear this mess now!"
 USA_bulgarian_negotiations:0 "Bulgarian Negotiations"
 USA_bulgarian_negotiations_desc:0 "If we make Bulgaria scared of us enough, they might be willing to switch sides in this war."
 USA_romanian_negotiations:0 "Romanian Negotiations"
 USA_romanian_negotiations_desc:0 "Romania has to fall in our sphere of influence. We shall convince them that their interests align with ours."
 USA_liberate_italy:0 "Liberate Italy"
 USA_liberate_italy_desc:0 "We need to attack the Axis' soft underbelly, Italy. It is quite likely that Mussolini will fall if we make enough gains there."
 USA_victory_italy:0 "Victory in Italy"
 USA_victory_italy_desc:0 "Italy is liberated! As the new government prepares to assume full control, we need to begin preparing further offensives to the heart of Europe."
 USA_clear_mediterranean:0 "Clear the Mediterranean"
 USA_clear_mediterranean_desc:0 "Control over the Mediterranean is vital for our interests. We already have the upper hand, let us finish the job completely!"
 USA_support_eci:0 "Support the ECI"
 USA_support_eci_desc:0 "If we want our italian allies to win the war against the occupiers we need to support them with guns and training."
 USA_liberate_france:0 "Liberate France"
 USA_liberate_france_desc:0 "France fell, but it is time for us to finally reverse this situation. We need to liberate our French allies from their occupation joke and bring democracy back to Europe!"
 USA_victory_france:0 "Victory in France"
 USA_victory_france_desc:0 "France has been liberated! However, we can't rest now, we have to keep going, keep going eastward, where the true enemy awaits."
 USA_clear_enemy_tanks:0 "Clear Enemy Tanks"
 USA_clear_enemy_tanks_desc:0 "Enemy tanks are a threat for our French troops, but luckily for us our new anti-tank cannons will reduce them to piles of rubble!"
 USA_amphibious_vehicles_dev:0 "Amphibious Vehicles Development"
 USA_amphibious_vehicles_dev_desc:0 "In order to perform more effective landings, we have to improve our amphibious vehicles. That way we will be a lot less vulnerable to coastal defense."
 USA_support_french_resistance:0 "Support the French Resistance"
 USA_support_french_resistance_desc:0 "France fights on! We need to activate and support the French Resistance in order to gather intel, disrupt enemy communications and supply, and help us kick out the enemy!"
 USA_paris_ours:0 "Parade in Paris"
 USA_paris_ours_desc:0 "Paris is ours! A good military parade showing our liberation of this great city will greatly help our morale at home."
 USA_the_fascist_menace:0 "The Fascist Menace"
 USA_the_fascist_menace_desc:0 "It is time to destroy our true enemy. Nazi Germany has tried to enslave Europe and destroy freedom and democracy, not to mention their brutal atrocities. They shall suffer."
 USA_support_benelux_resistance:0 "Support Benelux Resistance"
 USA_support_benelux_resistance_desc:0 "As we approach the Benelux, supporting the local resistance will make our advance easier and the occupation a nightmare."
 USA_mechanized_divisions:0 "Mechanized Divisions"
 USA_mechanized_divisions_desc:0 "Mechanized Divisions are the latest thing tech-wise, and they will help us crushing the fascists!"
 USA_smash_fascism:0 "Smash Fascism"
 USA_smash_fascism_desc:0 "Our efforts have led us to this point. Fascism has been beaten all across Europe, and now we shall crush the snake's head for good. For Democracy!"
 USA_the_red_threat:0 "The Red Threat"
 USA_the_red_threat_desc:0 "It is time to destroy our true enemy. The USSR has tried to destroy democracy in the name of a false workers revolution. They shall suffer."
 USA_contact_finns:0 "Contact the Finns"
 USA_contact_finns_desc:0 "Finland can't stay out of this anti-Soviet war. Both them and us have interests in the USSR, so they should be willing to enter."
 USA_contact_turks:0 "Contact the Turks"
 USA_contact_turks_desc:0 "By forcing Turkey into our alliance, we will encircle the USSR and have the Caucasus Oil Fields at reach."
 USA_smash_communism:0 "Smash Communism"
 USA_smash_communism_desc:0 "Our efforts have led us to this point. Communism has been beaten all across Europe, and now we shall crush the snake's head for good. For Liberty!"
 USA_victory_europe:0 "Victory in Europe"
 USA_victory_europe_desc:0 "Victory! We have defeated all our enemies in Europe; we can now feast and celebrate while we prepare to finish the War in Asia as well."
 USA_liberate_scandinavia:0 "Liberate Scandinavia"
 USA_liberate_scandinavia_desc:0 "Scandinavia is occupied by our enemies. Its strategic importance cannot be dismissed, so we must take control of it as soon as we can."
 USA_secure_swedish_resources:0 "Secure Swedish Resources"
 USA_secure_swedish_resources_desc:0 "The most effective way of ensuring that the Swedish mineral resources don't arrive to our enemies is buying them all. That's how the market works."
 USA_pressure_sweden:0 "Pressure Sweden"
 USA_pressure_sweden_desc:0 "Sweden is surrounded. They will join us, or else."
 USA_mountain_warfare:0 "Mountain Warfare"
 USA_mountain_warfare_desc:0 "The Norwegian landscapes are rough and cold. We must prepare our soldiers for this extreme conditions and we will win easily."
 USA_norwegian_resistance:0 "Support the Norwegians"
 USA_norwegian_resistance_desc:0 "If we guarantee Norway's freedom, we can count on their men to help us in the fight."
 USA_victory_scandinavia:0 "Victory in Scandinavia"
 USA_victory_scandinavia_desc:0 "Scandinavia is ours! Its enormous mineral wealth will be of great use to use, while we begin to plan further offensives into Europe."
 
 USA_peace_at_last:0 "Peace At Last"
 USA_peace_at_last_desc:0 "We have achieved peace! Now we have to refit our economy for peacetime again."
 USA_reconversion:0 "Reconversion"
 USA_reconversion_desc:0 "It is time to work on transforming our economic structure from a wartime, spending-focused economy to a more sustainable peace-time economy."
 USA_handle_our_debt:0 "Handle our National Debt"
 USA_handle_our_debt_desc:0 "Our policy of massive spending during the war has left a huge national debt, a huge debt that we must pay one way or another."
 USA_prevent_unemployment:0 "Prevent Unemployment"
 USA_prevent_unemployment_desc:0 "With the war industries in process of reconversion, many workers find themselves in danger of being laid off, something that may cause another Depression unless we act quickly."
 USA_full_commitment:0 "Full Commitment"
 USA_full_commitment_desc:0 "While conservatives in Congress believe that we should dedicate limited resources to prevent unemployment, we must answer with an ambitious interventionist program that puts the people as its main priority!"
 USA_employment_act_limited:0 "Limited Employment Act"
 USA_employment_act_limited_desc:0 "Congress won't accept Presidential intervention in the employment matter, so we should draft a bill that can get passed and that can also help the people."
 USA_fepc:0 "The FEPC Question"
 USA_fepc_desc:0 "The FEPC, or Fair Employment Practice Committee, was created during the war in order to prevent discrimination in the war industries, especially related to racial issues. Now we must decide if we should keep it and extend it to all industries, or disband it after the war as it was originally planned."
 USA_deal_strike_wave:0 "Deal with the Strike Wave"
 USA_deal_strike_wave_desc:0 "Labor Unions are no longer bound by their promise of avoid strikes during the war, and they are promoting a massive strike wave that threatens to paralyze the reconversion process. We must decide how we will answer to this strikes."
 USA_negotiate_unions:0 "Negotiate with the Unions"
 USA_negotiate_unions_desc:0 "The Labor Unions are a pillar of our society, and we must negotiate with them so that we can improve the conditions of American workers - and so that they finally shut up."
 USA_amend_gi_bill:0 "Amend the G.I. Bill"
 USA_amend_gi_bill_desc:0 "The G.I. Bill was sabotaged by conservatives that deprived it of most of its original content. We must amend the G.I. Bill so its benefits reach veterans and non-veterans alike in a broader welfare program."
 USA_taft_hartley:0 "Taft-Hartley Act"
 USA_taft_hartley_desc:0 "Enough is enough! If unions won't comply to our demands, then we will pass a law that will severely limit their activity."
 USA_implement_gi_bill:0 "Implement the G.I. Bill"
 USA_implement_gi_bill_desc:0 "It is time to finally implement the benefits for veterans agreed in the G.I. Bill, passed during the war. Those who fought for our country deserve all we can give them!"
 USA_war_brides_act:0 "War Brides Act"
 USA_war_brides_act_desc:0 "The War Brides Act will ensure that all soldiers that formed families abroad during the war can continue them here, and will open up the American Dream for thousands of people."
 
 USA_end_price_controls:0 "End Price Controls"
 USA_end_price_controls_desc:0 "Price and wage controls that were in effect during the war must end immediately, we can't keep the state of emergency forever."
 USA_extend_price_controls:0 "Extend Price Controls"
 USA_extend_price_controls_desc:0 "Although the people demand the lifting of the price controls that were in effect during the war, we can't allow inflation to rise, so controls shall be extended for now."
 USA_lift_economic_controls:0 "Lift Economic Controls"
 USA_lift_economic_controls_desc:0 "Our economy is now ready for the removal of the price and wage controls. Our people deserve it after all these efforts."
 USA_maintain_federal_spending:0 "Maintain Federal Spending"
 USA_maintain_federal_spending_desc:0 "The end of the war is no reason to cut federal spending. Now that we are at peace, we can use the money for other projects."
 USA_spending_cuts:0 "Federal Spending Cuts"
 USA_spending_cuts_desc:0 "We have a debt to pay, an inflation problem and the war is over. It would be very irresponsible to maintain the same level of spending that we had during the war."
 USA_maintain_war_taxes:0 "Maintain the War Taxation"
 USA_maintain_war_taxes_desc:0 "During the war we had to raise the taxes in order to pay for our military programs. Now we can use that money to pay for our massive debt!"
 USA_lower_taxes_postwar:0 "Lower Taxes"
 USA_lower_taxes_postwar_desc:0 "Taxes were high during the war, as we had to defend our nation. The emergency is now over, and we can't keep on demanding such a great sacrifice to our people. Taxes shall be immediately lowered for everyone."
 USA_fight_inflation:0 "Fight Inflation"
 USA_fight_inflation_desc:0 "Inflation is an important threat that looms over our post-war economy. We need to dedicate all our efforts to keep inflation under control."
 
 USA_state_of_union_adress:0 "The Future of the Union"
 USA_state_of_union_adress_desc:0 "The United States of America has faced lots of challenge during the last decade, but with unity and determination we shall lead the country forward!"
 USA_sbr_lategame:0 "Progressive Ideals"
 USA_sbr_lategame_desc:0 "Finally, true progressivism has taken power in America. Now we have enough strength to fight conservatives and corporate interests and ensure Americans are free, happy, and equal."
 USA_national_health_act:0 "National Health Insurance Program"
 USA_national_health_act_desc:0 "We can't tolerate our broken health system, relying on private insurance companies that view healthcare as a mere business, and not as a human right. We shall fix that and provide free and public health coverage for our people."
 USA_desegregate_schools:0 "Desegregate Schools"
 USA_desegregate_schools_desc:0 "We can't pretend that our people is equal when they are separated in schools by race. In order to preserve equal opportunity and fight racism, we shall desegregate schools as soon as possible."
 USA_support_gender_equality:0 "Women's Armed Services Integration Act"
 USA_support_gender_equality_desc:0 "Women must be allowed to serve their country if they want to! Men and women have the same rights and they also have the same duties, or at least that's our goal. For now, allowing women to join the Armed Forces in peacetime is a good first step."
 USA_civil_rights_act:0 "Civil Rights Act"
 USA_civil_rights_act_desc:0 "What was the point of the Civil War and Reconstruction if our fellow black citizens are still treated as inferior people in the Southern States? Our commitment to equality is not limited to classes, but also to races. In order to accomplish that, we shall pass a Civil Rights Act that ends Segregation, and if the South resists we will show them who's in charge!"
 USA_nationalize_railroads:0 "Nationalize the Railroads"
 USA_nationalize_railroads_desc:0 "We can't allow greedy companies to own the vital infrastructures of our nation. We have to nationalize the railroad and make it a service and not a business."
 USA_publicly_owned_banks:0 "Publicly-Owned Banks"
 USA_publicly_owned_banks_desc:0 "Big private banks have been a source of corporate greed and unchecked inequality that have broken our society. We need to secure public ownership for big banks, so they are a service for our people and not a way for rich people to get richer."
 USA_fair_deal:0 "The Fair Deal"
 USA_fair_deal_desc:0 "As we leave the New Deal behind, we can only be amazed by its success. We can't stop there however, and we need to continue Roosevelt's policies by enacting a Fair Deal, that continues the legacy of the New Deal and protects the economy and the working class."
 USA_anti_communist_liberalism:0 "Anti-Communist Liberalism"
 USA_anti_communist_liberalism_desc:0 "American values are under threat. As leftists become increasingly influenced by communism, and conservatives want to destroy the New Deal that has greatly helped the working class, we, anti-communist liberals, are alone in the task of securing a bright future for our people, free of communism."
 USA_tcel:0 "Temporary Commission on Employee Loyalty"
 USA_tcel_desc:0 "We must prevent communist infiltration and we must do it quickly. Purging suspicious federal workers will clean our Administration from the stain of communism."
 USA_fight_corruption:0 "Fight Corruption"
 USA_fight_corruption_desc:0 "Corrpution in the IRS and the rising crime numbers are a political weapon in the hands of our opponents. We must solve these problems in order to get re-elected."
 USA_desegregate_army:0 "Desegregate the Armed Forces"
 USA_desegregate_army_desc:0 "We've had enough of racial segregation inside our Armed Forces. Americans are equal and will fight as equals, no matter their origin or their skin color."
 USA_brannan_plan:0 "The Brannan Plan"
 USA_brannan_plan_desc:0 "Our Secretary of Agriculture has an ambitious plan of agricultural subsidies that would greatly help our farmers. Instead of fixing high prices, farmers would be allowed to sell their surplus at a lower price, and the Treasury would pay them the difference. That way, prices will be low for consumers, and farmers won't lose money!"
 USA_another_housing_act:0 "Housing Act"
 USA_another_housing_act_desc:0 "The New Deal had many Housing Acts, and we must continue tackling this issue. We need federal money for slum clearance, an expansion of federal mortgage insurances and an extension of the federal funds destined to buy public housing. If we pass it, then more Americans will have a place to live."
 USA_a_republican_agenda:0 "A Republican Agenda"
 USA_a_republican_agenda_desc:0 "The Republican Party is increasingly divided between conservatives and progressives. We need to remind conservatives that the Republican Party is the one who freed the slaves, attacked monopolies and created the National Parks. We shall continue the legacy of Lincoln and Theodore Roosevelt and move the country forward!"
 USA_a_conservative_program:0 "A Conservative Program"
 USA_a_conservative_program_desc:0 "The main problem in American politics this last decade is the interference of the Federal Government in both state and business affairs. We need an small government and a free market that can bring prosperity to our great nation!"
 USA_highway_expansion:0 "Highway Expansion"
 USA_highway_expansion_desc:0 "We need to secure funding for an ambitious Interestate Highway plan that helps to connect the country. It will be a service to the people and a strategic asset should anything unpleasant happens..."
 USA_denounce_racial_discrimination:0 "Denounce Racial Discrimination"
 USA_denounce_racial_discrimination_desc:0 "Racial segregation and discrimination is unacceptable. We must prepare a strategy against this cruel practice that hopefully ends racial inequality. It will also be useful in recovering our black voters."
 USA_equal_rights_amendment:0 "Equal Rights Amendment"
 USA_equal_rights_amendment_desc:0 "Recently adopted in our Party Platform, the Equal Rights Amendment is a very good step forward in the fight for equality between men at women in the workplace."
 USA_downsize_government:0 "Downsize the Government"
 USA_downsize_government_desc:0 "A big Government is inneficient, taking away the people's money and spending it in useless projects or corruption. There will be no corruption in our Administration, but we still need to reduce the interference of the Federal Government in the economy."
 USA_lower_taxes_lategame:0 "Lower Taxes"
 USA_lower_taxes_lategame_desc:0 "Small government means less spending, and less spending means we can safely lower taxes across the board, for rich and poor!"
 USA_red_scare:0 "Red Scare"
 USA_red_scare_desc:0 "Communists are a threat to America. We must fight hard against suspected communists, be it politicians, scientists, journalists or anyone. We can't allow any communists to sabotage the American Dream."
 USA_increase_defense_budget:0 "Increase the Defense Budget"
 USA_increase_defense_budget_desc:0 "We support our boys! We need to increase funding for all branches of the military, in order to properly modernize and expand the armed forces."
 USA_protect_states_rights:0 "Protect States' Rights"
 USA_protect_states_rights_desc:0 "States' Right to segregate people according to their race is just the application of the Separate but Equal concept. We must stop those liberals that are trying to destroy soverignty of states with the excuse of segregation."
 USA_ignore_segregation_debate:0 "Ignore the Segregation Debate"
 USA_ignore_segregation_debate_desc:0 "The Segregation Debate is not something we'd like to see discussed in the public sphere. We'd rather have the people talk about how we are going to cut taxes, decrease unemployment and stop communism here and abroad!"
 USA_appeal_national_unity:0 "Appeal to National Unity"
 USA_appeal_national_unity_desc:0 "Racial tensions are slowly rising due to our opposition to desegregation. This can't be allowed: we must remind our people that we are all Americans, and we must stay united for the sake of our Nation."
 USA_business_friendly_policy:0 "Business-Friendly Policy"
 USA_business_friendly_policy_desc:0 "American businesses are the reason why we are the most prosperous country in the world. We need to give corporations tax breaks and other privileges to ensure economic prosperity."
 USA_american_dream:0 "The American Way of Life"
 USA_american_dream_desc:0 "The American Way of Life: the embodiment of the ideals of freedom and prosperity. We must promote and defend our society against the threat of collectivism, and make it the shining ideal other nations will fight for!"
 
