 usa_news.1.t:0 "Franklin Delano Roosevelt inaugurated"
 usa_news.1.d:0 "Today Franklin Delano Roosevelt has been inaugurated as the new President of the United States of America. He was elected 5 months ago as a candidate from the Democratic Party, promising to fix the catastrophic economic situation the USA finds itself in. His economic program, called the New Deal, may bring the industrial giant into a new golden era or may completely ruin the battered nation. And the strength of the USA is a key component in international diplomatic and economical relations."
 usa_news.1.a:0 "We'll follow his presidency with interest"
 usa_news.2.t:0 "Franklin Delano Roosevelt re-elected in the USA"
 usa_news.2.d:0 "News arrive from the United States, as the definitive results for their Presidential Election have been published. Roosevelt, who was the clear favourite to win the election, has secured a clear majority on both the Electoral College and the Popular Vote, with his opponent Alf Landon of the Republican Party winning in only two states, Maine and Vermont. This gives Roosevelt a clear mandate to continue his economic program, the 'New Deal', that, according to American voters, has been a true success. The inauguration of Roosevelt is scheduled for January 20, as per the 20th Amendment."
 usa_news.2.a:0 "And nobody is surprised"
 usa_news.3.t:0 "Alf Landon wins American Election"
 usa_news.3.d:0 "Surprising news arrive from the United States, as the shocking final results of the hotly contested Presidential Election are published. Against all odds, Alf Landon, the Republican Presidential candidate, has managed to win a slim majority in the Electoral College, and will become the new President of the United States. It is clear that Roosevelt's New Deal has not been successful, and President-Elect Landon has other options in his table, from reforming it to abolishing it. For now on, Roosevelt is still the President until Landon is inaugurated on January 20, as per the 20th Amendment."
 usa_news.3.a:0 "Wait, what!?"
 usa_news.4.t:0 "The United States repeals the Neutrality Acts"
 usa_news.4.d:0 "Ever since the USA took part in the Great War, isolationist sentiment has been rising in the country, and led to the approval of several Neutrality Acts during these last years. Now shocking news arrive from America, because President [USA.GetLeader] has decided to repeal those Acts in order to better intervene in world affairs. After tremendous efforts in both Houses of Congress, and losing massive amounts of popularity, [USA.GetLeader] managed to get his way, and the Neutrality Acts are officially repealed. We can expect decisive American intervention in the coming conflicts."
 usa_news.4.a:0 "This changes everything"
 usa_news.5.t:0 "America continues its Neutrality policy"
 usa_news.5.d:0 "Doubts about a possible change in American foreign policy have been dissipated when President [USA.GetLeader] signed yet another Neutrality Act, banning arms sales to countries at war and civil war participants. This move is another win for the strong American isolationist faction, and allows the President to save political capital for his other projects."
 usa_news.5.a:0 "Everything goes as expected"
 usa_news.5.b:0 "Don't count on us for a war!"
 usa_news.6.t:0 "The USA passes the Lundlow Amendment"
 usa_news.6.d:0 "Isolationists in the USA have managed to achieve and enormous political victory with the passing of the Lundlow Amendment, that essentially bans Congress from declaring any war without the people's approval in a referendum. This severely limits America's foreign policy and sets them in a path of extreme isolationism, unlikely to get actively or passively involved in future world conflicts."
 usa_news.6.a:0 "They would prefer to be alone in the world..."
 usa_news.7.t:0 "The Declaration by United Nations"
 usa_news.7.d:0 "Allied powers have signed today the Declaration by United Nations, stating their aim of fighting until complete victory over their enemies is achieved in order to defend life, liberty, independence and religious freedom, and to preserve human rights and justice in their own lands as well as in other lands. This Declaration shows that there will be no conditional surrender under any circumstance, and states the intentions of the Allied powers after the war."
 usa_news.7.a:0 "We shall lead the fight for freedom!"
 usa_news.7.b:0 "Together for Victory!"
 usa_news.7.c:0 "Irrelevant!"
 usa_news.8.t:0 "Roosevelt wins Elections in the US"
 usa_news.8.d:0 "US President Franklin Delano Roosevelt has managed to win an unprecedented third term, after winning both the Electoral College and the popular vote by a comfortable margin. Even though both him and his oponent, Wendell Willkie, delivered isolationist messages towards the end of the campaign, Roosevelt's victory could pivot the US towards a more active stance in global politics."
 usa_news.8.a:0 "Again? Really?"
 usa_news.9.t:0 "Landon wins Elections in the US"
 usa_news.9.d:0 "US President Alfred Landon managed to win a second term in the Presidential Election held yesterday in the United States, securing a majority in both the Electoral College and the popular vote against his Democratic opponent [USA_d_nominee_forty]. Landon is favourable to interventionism, and his reelection could see the United States taking a more active role in global politics."
 usa_news.9.a:0 "Congratulations to him"
 usa_news.10.t:0 "Wendell Willkie wins US Presidential Election"
 usa_news.10.d:0 "Businessman Wendell Willkie, the Republican candidate for yesterday's Presidential Election in the US, has won a decisive victory over his Democratic opponent [USA_d_nominee_forty]. Willkie belongs to the more progressive wing of the Republican Party, and his Presidency could see policies resembling the New Deal or related to the Civil Rights issue. In regards of foreign policy, President-Elect Willkie is a strong interventionist, and this could change America's position on the world stage. For now though, Roosevelt is still in charge until Inauguration Day, in late January."
 usa_news.10.a:0 "Interesting"
 usa_news.11.t:0 "John Nance Garner wins US Presidential Election"
 usa_news.11.d:0 "John Nance Garner, a Democrat from Texas and Vice-President under Roosevelt, has managed to win yesterday's Presidential Election in the US against his Republican opponent [USA_rep_nominee_forty]. Garner is a Southern Democrat, so his election could see the US pivot towards more conservative positions in the issue of the economy ( although Garner is not personally opposed to economic interventionism ) or Civil Rights. Garner's positions on foreign policy have not been brought up during the campaign, but he will not hesitate America's interests abroad if threatened. The former President will remain in office until Inauguration Day, in late January."
 usa_news.11.a:0 "Let's see what he can do"
 usa_news.12.t:0 "Huey Long wins US Presidential Election"
 usa_news.12.d:0 "Huey P. Long, the Democratic candidate and a ruthless populist, has managed to win yesterday's Presidential Election in the US against his Republican opponent [USA_rep_nominee_forty]. Long's victory has been a concern for many, as his disregard for conventional politics and Checks and Balances to his power are widely known, from his period as Governor of Louisiana. President-Elect Long is now a difficult position, having to fulfill the populist campaign promises that won him the election against a completely hostile Congress. Perhaps the US will be less focused on external affairs after this major political upheaval?"
 usa_news.12.a:0 "So much for American Exceptionalism"
 usa_news.13.t:0 "James A. Farley wins US Presidential Election"
 usa_news.13.d:0 "Former Postmaster General James A. Farley has managed to win yesterday's Presidential Election in the US, after beating his Republican opponent [USA_rep_nominee_forty] in both the popular vote and the Electoral College with relative ease. President-Elect Farley is in many ways a successor of Roosevelt, seeking to maintain and expand the New Deal, while also having an ambitious program to combat institutional racism. Farley will likely continue Roosevelt's foreign policy as well, so we can expect more active American involvement in world affairs as they start deteriorating. For now though, the former President will remain in office until Inauguration Day, in late January."
 usa_news.13.a:0 "More of the same?"
 usa_news.14.t:0 "Cordell Hull wins US Presindential Election"
 usa_news.14.d:0 "Former Secretary of State under Roosevelt, Cordell Hull, has managed to win yesterday's Presidential Election in the US, after defeating his Republican opponent [USA_rep_nominee_forty] in a tight race. Hull is expected to continue the economic policies of the Administration he was part of, like the New Deal. President-Elect Hull is also committed to maintaining peace, being the person behind the Good Neighbor Policy, but will not hesitate to defend American interests if they are threatened. For now though, President Franklin Delano Roosevelt will continue in office until Inauguration Day, in late January."
 usa_news.14.a:0 "Another Liberal?"
 usa_news.15.t:0 "The Commonwealth of the Philippines"
 usa_news.15.d:0 "Today, the draft of the constitution of the Commonwealth of the Philippines was ratified by President [USA.GetLeader], effectively making the Philippines a semi-independent nation. The long process of Philippino independence started with the Tydings-McDuffie Act, a United States federal law that established the process for the Philippines to become an independent country after a ten-year transition period. The act specified a formal constitution as a necessary requirement for this goal, and today it has been finally achieved.\nThe Constitution provides for a unicameral legislature composed of a president and vice president elected for a six-year term without re-election. Presidential elections have already been scheduled to happen in some months."
 usa_news.15.a:0 "Congratulations to the Philippines!"
 usa_news.16.t:0 "The United States withdraws from Nicaragua"
 usa_news.16.d:0 "Today the last US soldiers that remained in Nicaragua have left the country, ending the American Occupation and leaving the country to its own devices. Starting from Estrada's Rebellion in 1909, the American Occupation of Nicaragua had been going on for more than 20 years, with the country assuming its status as an American protectorate in 1916 with the Bryan-Chamorro Treaty. Former President Hoover disliked this occupation and withdrew almost all soldiers from the country, with only 745 remaining when [USA.GetLeader] took office. Now he, as a part of the new Good Neighbor Policy, as recalled the last US soldiers that remained in Nicaragua, ending the quasi-protectorate."
 usa_news.16.a:0 "They gave up?"
 usa_news.16.b:0 "It was time"
 usa_news.16.c:0 "And never come back!"
 usa_news.17.t:0 "The United States withdraws from Haiti"
 usa_news.17.d:0 "After almost 20 years, US President [USA.GetLeader] has decided to end the American Occupation of Haiti and leave the country to its own devices. This occupation began in 1915 when a revolt broke out against the pro-American dictator Jean Vilbrun Guillaume Sam. President Wilson ordered the US Navy and Marines to occupy the capital and they took over the country. During these years, the US has been trying the pacify the country, promoting a new Constitution that better suits American interests and imposing friendly Presidents that tried to stabilize the weak Haitian economy. Now [USA.GetLeader] has decided to, as per the Disengagement Agreement of 1933, withdraw from Haiti, although the US will retain a lot of influence on the small country."
 usa_news.17.a:0 "Another withdrawal?"
 usa_news.17.b:0 "A necessary step"
 usa_news.18.t:0 "Calvin Coolidge Dies"
 usa_news.18.d:0 "Calvin Coolidge, former President of the Unites States, has died suddenly this morning due to a coronary trombosis. A Liberal Republican, Coolidge served as President from 1923 to 1929, after the death of President Harding. His administration supported Laissez-faire economics, and tried to restore public confidence in the White House after the Harding scandals. Remaining popular during his time in office, he was also a supporter of racial equality, avoiding the Klan and signing the Indian Citizenship Act of 1924, although he didn't have much of an active role in this area. After the Inauguration of President Hoover in 1929, Coolidge had retired to his house in Northampton, Massachussetts. During his last public appearances, he had supported Hoover's failed re-election bid."
 usa_news.18.a:0 "Our condolences..."
 usa_news.18.b:0 "Rest in Peace"
 usa_news.19.t:0 "Franklin Delano Roosevelt dies"
 usa_news.19.d:0 "Although his declining health was a concern for his Administration, the death of US President Franklin Delano Roosevelt has shocked the world. Roosevelt had served for 3 full terms as President, and had been recently elected to serve a 4th one. He led his country through the Great Depression, which he fought with the New Deal, and the war. His former Vice-President, [USA.GetLeader] has been sworn in as 33rd President of the United States, declaring a 30-day mourning period. Now we must wonder what will be the next steps of the industrial gigant."
 usa_news.19.a:0 "Rest in Peace"
 usa_news.19.b:0 "The bastard is dead!"
 usa_news.20.t:0 "Roosevelt wins US Presidential Election"
 usa_news.20.d:0 "News are coming from the United States, as President Franklin Delano Roosevelt has managed to win today's Presidential Election. Due to the war, he decided to run for an unprecedented 4th term, citing the need of a continued leadership to properly sustain the war effort as the reason. His rival, Republican candidate Thomas E. Dewey, has finally conceded after the last results came in, giving Roosevelt a comfortable Electoral College majority. Roosevelt's health is a concern however, and many doubt that he can survive the full term in office."
 usa_news.20.a:0 "Americans must love Roosevelt"
 usa_news.20.b:0 "He will lead us to victory!"
 
 usa_news.21.t:0 "Wendell Willkie wins US Presidential Election"
 usa_news.21.d:0 "US President Wendell Willkie has, as expected, won his re-election against Democratic candidate [USA_d_nominee_ffour] with a comfortable lead in both the Electoral College and the popular vote. President Willkie has, in a short speech, called for unity in these troubled times, and reaffirmed his commitment to a progressive agenda. His health condition has been a concern during the campaign, but President Willkie has said that he is \"better than ever\" and \"ready to lead America for other 4 years\". We'll have to wait and see what steps will the US take now."
 usa_news.21.a:0 "Americans seem fond of liberalism!"
 usa_news.21.b:0 "We continue towards prosperity!"
 
 usa_news.22.t:0 "John Nance Garner wins US Presidential Election"
 usa_news.22.d:0 "President John Nance Garner has won today the American Presidential Election, securing a second term and defeating the Republican candidate [USA_r_nominee_ffour]. Garner has reaffirmed his support for limited economic interventionism and presidential power, pledging to do everything he can to lead America into 4 more years of prosperity. It seems that conservative Democrats have really reaffirmed themselves as the dominant political force in he United States."
 usa_news.22.a:0 "He must be an excellent campaigner!"
 usa_news.22.b:0 "Four more years with Cactus Jack!"
 
 usa_news.23.t:0 "James A. Farley wins US Presidential Election"
 usa_news.23.d:0 "US President James A. Farley has decisively defeated Republican candidate [USA_r_nominee_ffour], securing a second term as President. His policies have been the preservation of the New Deal and the support for Civil Rights, and he has promised to continue pushing for further advancements in those areas in a short speech, that he gave after his opponent conceded. The United States has reaffirmed its support for liberalism."
 usa_news.23.a:0 "Segregationists must be pissed..."
 usa_news.23.b:0 "Honesty and equality have won today!"
 
 usa_news.24.t:0 "Cordell Hull wins US Presidential Election"
 usa_news.24.d:0 "US President Cordell Hull has narrowly won today's Presidential Election after defeating his rival, Republican candidate [USA_r_nominee_ffour]. A strong supporter of rearmament and militarization, he has promised to defend democracy \"at all costs\" while securing economic and social stability at home. Although a liberal Democrat, Hull is in many ways an independent thinker, and his re-election comes as a surprise for many."
 usa_news.24.a:0 "A stronger foreign policy is coming?"
 usa_news.24.b:0 "The enemies of America are trembling!"
 
 usa_news.25.t:0 "Huey Long wins US Presidential Election"
 usa_news.25.d:0 "US President Huey P. Long has managed, against all odds, an Electoral College victory against his Republican opponent [USA_r_nominee_ffour], who has just conceded. While promoting relatively popular policies, the fear of him becoming a dictator, a centerpiece of the Republican campaign, has costed him a popular vote defeat and neraly ousts him from the White House. Long has thanked his voters for their support and has promised to continue pushing for his Share the Wealth program, \"to improve the life of every American\".
 usa_news.25.a:0 "They really re-elected him!?"
 usa_news.25.b:0 "He must be already thinking about a third term..."
 
 usa_news.26.t:0 "Harry Truman wins US Presidential Election"
 usa_news.26.d:0 "Harry S. Truman, the Democratic nominee for the Presidency of the United States of America, has won today's election with a comfortable majority in both the Electoral College and the popular vote. Widely considered a successor to Roosevelt, he was nominated after he declined to run for a 4th term. His platform includes the continuing of the New Deal, a strong foreign policy and support to the Civil Rights movement. He will be inaugurated, as usual, on January 20th."
 usa_news.26.a:0 "A successor for Roosevelt?"
 usa_news.26.b:0 "Let's continue the New Deal!"
 
 usa_news.27.t:0 "Henry Wallace wins US Presidential Election"
 usa_news.27.d:0 "Henry A. Wallace has, against all odds, secured a narrow victory in the Presidential Election held today in the US. He is one of the main icons of political progressivism, having been member of both the Progressive, the Republican and now the Democratic parties. He wants to go beyond Roosevelt's New Deal, calling for expanded Social Security, Universal Healthcare, nationalization of railroads and other utilities, and even the creation of a public bank. He will be inaugurated on January 20th, and probably will start signing Executive Orders inmediately afterwards."
 usa_news.27.a:0 "Let's see what this leftist can do"
 usa_news.27.b:0 "Real Progressivism is here!"
 
 usa_news.28.t:0 "Thomas Dewey wins US Presidential Election"
 usa_news.28.d:0 "Thomas E. Dewey, former Governor of New York, has won today's Presidential Election in the United States against his Democratic opponent [USA_d_nominee_ffour]. Dewey is the leader of the moderate wing of the Republican Party and has advocated against the New Deal, for smaller government and anti-communist policies; along with some progressive measures such as greater equality for women and minorities. His victory empowers isolationistism in the White House, while at the same time it weakens America's foreign policy, as Dewey is very young and lacks any experience in the matter."
 usa_news.28.a:0 "I think I like his mustache"
 usa_news.28.b:0 "The future is ahead of us!"
 
 usa_news.29.t:0 "Robert Taft wins US Presidential Election"
 usa_news.29.d:0 "Robert A. Taft has managed to win today's Presidential Election in the United States, after beating his Democratic opponent [USA_d_nominee_ffour] in a close race. Taft is a staunch isolationist and a conservative Republican, and his victory may see the United States drift towards a more isolationist policy. For now though, President [USA.GetLeader] will remain in office until Inauguration Day, January 20th."
 usa_news.29.a:0 "So they are embracing isolationism?"
 usa_news.29.b:0 "Responsibility has won today"
 
 usa_news.30.t:0 "Douglas MacArthur wins US Presidential Election"
 usa_news.30.d:0 "General Douglas MacArthur, formed US Chief of Staff, has won today's Presidential Election in the USA, after beating his Democratic opponent [USA_d_nominee_ffour]. He secured the Republican nomination against Thomas Dewey and Robert Taft, and campaigned on a platform of interventionism and fiscal conservatism. His victory has been a major surprise for the international community, but MacArthur has already given a speech calling for national unity, responsibility and a sensible foreign policy."
 usa_news.30.a:0 "Let's hope he's not too aggresive"
 usa_news.30.b:0 "The leadership we need!"
 
 usa_news.31.t:0 "Harry F. Byrd wins US Presidential Election"
 usa_news.31.d:0 "Surprising news come from the USA, as Harry F. Byrd, a hardline conservative, has won the Presidential Election held today. After [USA_r_nominee_ffour] conceded, Byrd has given a short speech defending fiscal conservatism, States' Rights and pledging to unite the country and reinforce American values. Many liberal Democrats are however very displeased with his victory, and together with Republicans they might obstruct Byrd's initiatives in Congress. For now though, President [USA.GetLeader] will remain in office until Inauguration Day, January 20th."
 usa_news.31.a:0 "From liberalism to hard conservatism?"
 usa_news.31.b:0 "American values win today!"
 
 usa_news.32.t:0 "James A. Farley wins US Presidential Election"
 usa_news.32.d:0 "Fromer Postmaster General James A. Farley has managed to win today's Presidential Election in the USA, after beating his Republican opponent [USA_r_nominee_ffour]. Farley tried unsuccessfully to become the Democratic nominee in 1940, and after Roosevelt's anouncement that he wouldn't seen another term he announced his candidacy, becoming the Democratic nominee in the National Convention. Farley advocates for a continuation of the New Deal and greater rights for minorities, although his foreign policy positions have not been brought up very much on the campaign trail."
 usa_news.32.a:0 "Another liberal?"
 usa_news.32.b:0 "For an equal and prosperous future!"
 
 usa_news.33.t:0 "The Assassination of Franklin Delano Roosevelt"
 usa_news.33.d:0 "Franklin Delano Roosevelt, the President-Elect of the United States, has been assassinated today in Florida by Giuseppe Zangara, an Italian inmigrant with severe mental health issues. Roosevelt had won the 1932 Presidential Elections against incumbent Herbert Hoover with an ambitious economic platform, the New Deal, that hoped to recover the US from the Great Depression. With Roosevelt being dead, his running mate, John Nance Garner, will be inaugurated on March 4th; but with him being far more conservative than Roosevelt many doubt about the potential implementation of this \"New Deal\". A time of uncertainty has begun."
 usa_news.33.a:0 "It seems hope couldn't last"
 usa_news.33.b:0 "A tragedy for our nation"

 ### Flavour Events ###

 USA_flavour.1.t:0 "Crash of the USS Akron"
 USA_flavour.1.desc:0 "Tragedy struck the United States Navy today, as it has been confirmed that the Zeppelin airship, the USS Akron, has crashed in a storm off the coast of New Jersey, killing 73 of the 76 men aboard, including Rear Admiral William Moffett. The accident is the largest loss of life in an aerial disaster to date. The ship had departed from the Naval Air Station at Lakehurst, New Jersey, on the evening of April 3rd with the intention to provide support for coastal naval crews as they tested experimental radio range finding equipment. Shortly after midnight on the 4th, the ship was enveloped in a dense fog, as a previously unrecorded stormfront enveloped the ship. Extreme turbulence caused an uncontrolled descent, and the ship crashed into the sea. The crash was seen by a passing German merchant vessel, who rescued four sailors from the sea, one of whom died shortly thereafter. Despite an intensive search, the Coast Guard located no other survivors.\n\nThe Akron had been constructed by the Goodyear Zeppelin corporation with the cooperation of German lighter-than-air engineers from DELAG, and commissioned in 1931 as a scout ship and ‘flying aircraft carrier’ in an effort to explore the expanded use of rigid airships by the US Navy. It was, at the time of it’s first flight, the largest aircraft to ever fly, and carried five ‘Sparrowhawk’ fighter planes, which it could launch in-flight from trapezes on the ship’s underside. The Akron’s sister-ship, the USS Macon, is presently undergoing shakedown flight testing.\n\nThe Akron was carrying several observers, including industrialist Alfred Masury. The immense loss of life has all but shuttered the American airship program with many public figures questioning the safety of the vessels, and though the USS Macon is still expected to launch later this month, it will likely be the last US-built rigid airship."
 USA_flavour.1.a:0 "What a disaster!"

 USA_flavour.2.t:0 "USS Akron Survives Storm of the Decade"
 USA_flavour.2.desc:0 "The American naval airship, the USS Akron, had a narrow escape when it was almost lost in a previously unreported squall off the coast of New Jersey. The ship had departed from the Naval Air Station at Lakehurst on the evening of April 3rd to provide support for coastal naval crews as they tested experimental radio range finding equipment. Shortly after midnight on the 4th, a previously unrecorded stormfront enveloped the ship. Though the vessel was damaged in the high winds, the crew was able to put the massive vessel down and wait out the storm with no loss of life.\n\nThe Akron had been constructed by the Goodyear Zeppelin corporation with the cooperation of German lighter-than-air engineers from DELAG, and commissioned in 1931 as a scout ship and ‘flying aircraft carrier’ in an effort to explore the expanded use of rigid airships by the US Navy. It was, at the time of it’s first flight, the largest aircraft to ever fly, and carried five ‘Sparrowhawk’ fighter planes, which it could launch in-flight from trapezes on the ship’s underside. The Akron’s sister-ship, the USS Macon, is presently undergoing shakedown flight testing.\n\nThat the airship managed to perform so well under such dire, and unforeseen, conditions has already piqued the interest of the public, as well as key members of the government, including, reportedly, House Naval Affairs Committee Chair Carl Vinson, and President [USA.GetLeader]. Already, Admiral Moffett – a longtime proponent of rigid airships –has begun capitalizing on personal experience in the storm to seek an expansion for the American military rigid airship program. In addition, Alfred Masury, the Vice President of Mack Trucks, who was present during the operation as a guest, has increased his advocacy of the civilian uses of the craft and reportedly entered financing negotiations with the Goodyear Zeppelin company for an American commercial airline using airships."
 USA_flavour.2.a:0 "Perhaps there’s a Future for airships after all?"

 USA_flavour.3.t:0 "US Navy Expands Airship Fleet"
 USA_flavour.3.desc:0 "Emboldened by the continued early success of the rigid airship program, the US Navy has announced plans to construct two additional military Zeppelins, doubling the existing air fleet consisting of the USS Akron and USS Macon. Tentatively named the USS Los Angeles and the USS Miami respectively, both ships are expected to be completed and enter service by early 1936. Like their sister-ships, these new vessels will be among the largest objects to have ever flown and will serve in the capacity of fleet scouts and ‘flying aircraft carriers’, though with significant second-generation improvements. Each is designed to carry a squadron of 9 Sparrowhawk fighter aircraft, launched from the underside of the airship and meant to extend the scouting range of, and provide support for, the vessel. The revised airship program is meant to allow fro two ships to patrol each American coast, acting as early-warning scout vessels and to provide aerial spotting for fleet maneuvers at bases such as Norfolk, Virginia and Pearl Harbor, Hawaii.\n\nThe expansion is the brainchild of Rear Admiral William Moffett, a longtime proponent of naval aviation, most especially purpose-built aircraft carriers and the use of rigid airships for combined operations with surface vessels. Since his participation in the harrowing storm which nearly resulted in the loss of the Akron last year, he has overseen the installation of new safety measures on both existing vessels, including reinforced frames, and continually lobbied for them as multirole platforms. The Akron’s performance during the 1933 storm, and Moffett’s efforts, appears to have swayed House Naval Affairs Committee Chair Carl Vinson, who authorized the funds earlier today."
 USA_flavour.3.a:0 "Join the Navy, See the world from the air!"

 USA_flavour.4.t:0 "Goodyear Zeppelin Founds Airline"
 USA_flavour.4.desc:0 "At a press conference today in Akron, Ohio, Alfred Masury, Vice President of Mack Trucks, and representatives from the Goodyear Zeppelin company, which designed and built the Naval rigid airships USS Akron and USS Macon, have announced a joint venture – an airline company that uses US-built Zeppelins for transatlantic crossings and international travel. The venture, dubbed ‘American Airships’, capitalizes on the public interest in the vessels after the USS Akron survived a storm off the coast on New Jersey last year. Masury, who was on board the Zeppelin during the storm, has fronted the capital necessary to begin construction on two massive airships for civilian travel.\nIn the statement Masury said that the ships will be the fastest, and safest, way to cross the Atlantic and promote business and tourist links between the US and Europe. Both are designed to use helium, rather than the more typical -and dangerous- hydrogen, capitalizing on the American monopoly on the gas. The construction of the Zeppelins will provide much-needed jobs for industrial Ohio, which was particularly hard-hit by the Depression. Both ships are expected to enter service in early 1936.\n\nThis enterprise represents something of a salvo against the German company, DELAG, who’s airship, the Graf Zeppelin, holds the record for a crossing to South America. Already, American Airships has leased the spire of the Empire State Building to use as a Zeppelin mooring mast, so that passengers may disembark from transatlantic travel in the heart of New York City."
 USA_flavour.4.a:0 "What a modern way to travel!"

 USA_flavour.5.t:0 "King Kong Premiers"
 USA_flavour.5.desc:0 "Today marked the release of the ambitious horror and adventure film King Kong by RKO Pictures in the United States, starring Fay Wray, Bruce Cabot and Robert Armstrong. The film follows several adventurers as they travel to a mysterious island where prehistoric creatures still live, they bring back an ape the size of a skyscraper to New York, resulting in disaster. Already the film has become a national sensation and a blockbuster commercial success; theaters around the country have seen lines stretch around entire city blocks as people attempt to attend sold-out viewings. The movie contains innovative special effects by Willis H. O'Brien, including a mix of stop motion, matte paintings, and costuming to portray the titular creature. The widely anticipated international release of the film is due later this month."
 USA_flavour.5.a:0 "Fancy a trip to the picture show?"
 USA_flavour.5.b:0 "Beh, Capitalist propaganda"

 USA_flavour.6.t:0 "American Airships Begins Passenger Service"
 USA_flavour.6.desc:0 "Today the joint venture between the Goodyear Zeppelin Company and Mack Inc., American Airships, celebrated the successful maiden flights of its two Zeppelins, the Liberty and the Progress. At 800 feet in length, they rival the size of the Hindenburg, recently launched in Germany, and can carry 100 passengers each. Company spokespeople have called them symbols of the ongoing American economic recovery and of national prestige.\nThe Progress is expected to begin a regular transatlantic passenger service between New York and London, as well as make semi-regular flights to Paris, Geneva, and Berlin. The Liberty, based in Miami, Florida, will operate a cruise service within the Caribbean, making stops in the Florida Keys, Havana, the Bahamas, Puerto Rico, Panama City, and Bogota. Both ships are filled with safe non-flammable helium, taking advantage of the United States’ near-monopoly on the gas, and have state-of-the-art luxury facilities, including a promenade, an on-board fine-dining restaurant, a smoking parlor, and even a Jazz longue with live music.\n\nThe Liberty’s maiden voyage to Havana has become something of a global media sensation, with celebrities such as James Cagney and Katharine Hepburn on board. The Airship arrived at a specially built mooring mast near the Hotel Nacional on the afternoon of April 13th, at a ceremony attended by the several socialites and political figures from around the Caribbean. In no small part due to the glamourous arrival of the Liberty, both ships are at the moment fully booked for over a year in advance. The German airship company, DELAG, is reportedly expanding operations to keep up with the new American competition."
 USA_flavour.6.a:0 "Flying Luxury Liners? What Will They Think of Next!"

 USA_flavour.7.t:0 "USS Miami and USS Los Angeles Commissioned"
 USA_flavour.7.desc:0 "The United States Navy held a major public ceremony in Akron, Ohio, on February 12th, celebrating the commissioning of the branch’s two new zeppelins, the USS Miami and the USS Los Angeles. Naval Affairs Chair, Representative Carl Vinson, Admiral Moffett, and American Airships CEO Alfred Masury were in attendance, and the press swarmed to take photographs of the new vessels as the USS Akron and USS Macon flew overhead. The Miami and Los Angeles were completed a year ahead of schedule by the Goodyear Zeppelin corporation, and will be assigned to patrol along the American coasts, and around overseas naval stations.\n\nIn the last two years, the two existing ships have demonstrated the benefits of the zeppelin program. The USS Macon participated on several successful search and rescue operations at the behest of the Coast Guard, and at one point it even carried President [USA.GetLeader] on a transatlantic crossing to a political conference in Europe. The USS Akron has conducted several ‘show the flag’ missions around the country to promote Navy recruitment, and led several major Navy exercises.\n\nBuoyed by the continued success of the program, construction has already begun on a new class of military zeppelin to further supplement the existing air fleet. The ‘Pittsburgh-class’ airship will be even larger than the Akron-class vessels, carrying a squadron of 12 fighter aircraft, a crew of 130 men, and the latest in electronics and aerial defense weapons. It is designed to be used as a flying ‘coordination center’ for fleet actions at sea, communicating firing ranges and spotting submarines while remaining out of the fighting itself. The USS Pittsburgh shall take to the skies in 1937."
 USA_flavour.7.a:0 "Britannia may rule the waves, but America rules the skies!"

 USA_flavour.8.t:0 "Launch of the Republic"
 USA_flavour.8.desc:0 "American Airships is celebrating the maiden voyage of its third passenger Zeppelin, the Republic. The vessel is the largest aircraft to ever fly, surpassing even the [Hindenburg/Liebknecht] by 100 feet, making it roughly the same size as the RMS Titanic. It took off from New York on February 7th to much public fanfare at a ceremony on the Zeppelin mooring mast atop the Empire State Building, attended by President [USA.GetLeader] and Mayor Fiorello La Guardia. The President remarked that the ship shows how “modern technology can bring the country ever closer together”. The airship made a cross-country tour, where it was greeted with enthusiasm by large crowds, before landing in Los Angeles near the Hollywoodland Sign on February 15th.\nThe Republic is purpose-built for regular continental luxury flights, and its intended route is New York to Honolulu, with stops in Philadelphia, Chicago, Vancouver, Seattle, San Francisco, and Los Angeles. It contains several improvements over the Progress and the Liberty, in addition to the amenities found on its sister-ships it is able to carry 30 more passengers and is large enough to have a small onboard casino, with a baccarat table and a roulette wheel, and a landing hook for biplanes to deliver mail to the passengers and so people may embark or disembark while the ship is in flight.\n\nThe Republic is widely considered to be American Airships’ answer to the German [Graf Zeppelin II/Luxembourg], which undertakes flights to South America from Europe. The ongoing public enthusiasm for Zeppelins in the United States has ensured the success of the company, and AA has announced that it has plans for new ships that will cover routes to South America and Asia in the upcoming decade."
 USA_flavour.8.a:0 "Another exciting development in the airship race!"

 USA_flavour.11.t:0 "The Crime of the Century"
 USA_flavour.11.desc:0 "There has been a new development in what leading American journalists have dubbed ‘the crime of the century’ as the New York City Police Department has announced that it has arrested a man in connection with the infamous Lindbergh kidnapping case. While the individual in question, a German immigrant named Bruno Hauptmann, protests his innocence, the New York District Attorney’s office reported that the evidence was conclusive, and that Hauptmann had in his possession $15,000 of bills traced to the crime, and his handwriting closely matches that of the ransom note.\n\nThe case began on March 1st, 1932, when the son of famous aviator Charles Lindbergh, one-year-old Charles Jr., was reported missing from the family home in Hopewell, New Jersey. The Lindbergh family reported discovering a note demanding $50,000 in small bills for the return of their son. Cooperating on the advice of the police, the Lindberghs sent the money, however the kidnapped child was never returned. On May 12th, the body of Charles Jr. was discovered by a passing delivery driver in a roadside forest, near the Lindbergh estate. Despite the efforts of the state police, no immediate lines of inquiry bore results.\n\nThe crime quickly became a national media circus, and millions of Americans closely followed developments in the search for the perpetrator for months. One newspaper publisher even tastelessly referred to it as ‘the biggest story since the Resurrection’. Hauptmann was discovered in part because, by presidential order, all ‘Gold certificate’ bills, of the type used in the ransom, had to be exchanged for newly-designed currency in 1933. Hauptmann had, carelessly, spent some of the old money, raising the suspicions of his bank-teller."
 USA_flavour.11.a:0 "We want justice for Baby Lindbergh!"

 USA_flavour.12.t:0 "Lindbergh Kidnapper Executed"
 USA_flavour.12.desc:0 "On the evening of April 3rd, 1936, Richard Hauptmann, the man convicted for the murder of Charles Lindbergh Jr. in 1932, was executed at the New Jersey State Prison, bringing the tragic and sensationalized ‘crime of the century’ to an end. Throughout his trial, and his imprisonment, Hauptmann insisted he had not committed the crime, and that the money in his possession had been a bequest by an acquittance -Isidor Fitch - who had returned to Germany and later died. He was offered a commutation of his death sentence to life in prison by the Governor of New Jersey so long as he confessed his guilt, but Hauptmann refused. His last words were \"I am absolutely innocent of the crimes with which I am charged\".\n\nBecause of the intense media scrutiny surrounding the case, and concerns for the safety of his other children, Charles Lindbergh and his family have reportedly left the United States for England. The renowned pilot has, since 1935, acted as an aviation consultant for the United States Army, travelling extensively in Europe on behalf of USAAF the to observe the aerial capabilities of the United Kingdom, Germany, and France."
 USA_flavour.12.a:0 "Finally, an end to this sordid affair"

 USA_flavour.13.t:0 "Boulder Dam Opens"
 USA_flavour.13.desc:0 "Today, more than two years ahead of schedule, the Boulder Dam – situated on the border between Nevada and Arizona – opened for full operation, providing a cheap and reliable source of power for much of the American southwest. The dam creates a reservoir in Lake Mead and is expected to provide 25% of the power needs for Nevada, Southern California, and Arizona – allowing the administration to more easily pursue its industrial recovery policies and electrification plan in the west of the country. It will also help provide flood control for the region, which, until construction began, was a significant problem for ranchers and farmers along the southern part of the Colorado River. It is, to date, the largest concrete structure ever built and the largest dam in the world.\n\nConstruction on the dam began in 1931, though the site has been considered for hydroelectric dam use since the late 1890s. Over 20,000 laborers worked at the construction site, in temperatures that averaged 120 degrees Fahrenheit during the summer. They were supplemented by federal employees beginning in 1933. A whole town, Boulder City, was constructed near the dam site to house the workers with other new planned communities expected to follow, capitalizing on the electricity and water provided by the project.\n\nAt the dedication ceremony, President [USA.GetLeader] extolled the benefits of the massive piece of public infrastructure, suggesting that the dam would allow for the urbanization and modernization of the southwest and make Las Vegas and Tucson important centers of commerce and industry. The President additionally paid tribute to the 112 public employees who lost their lives during the – often hazardous – construction process, and unveiled a memorial in their honor."
 USA_flavour.13.a:0 "The electrification of the Southwest begins!"

 USA_flavour.14.t:0 "Executive Order 6102"
 USA_flavour.14.desc:0 "In the first few weeks since taking office, much of the new Administration’s energies have been consumed with combatting the fiscal crunch brought on by the banking crisis earlier this year, in addition to the ongoing problems caused by the Depression. Many of the President’s economic advisers have given evidence to Congress that the hoarding of precious metals – in particular gold bullion – has prolonged and exacerbated the banking crisis. The President, therefore, has issued an executive order which forbids the possession of gold coins, bullion, bars, or certificates by private individuals. Executive Order 6102 gives all American citizens until May 1st, 1933, to trade in their supply of gold for US Dollars to representatives of the Treasury, or they will face prosecution under the Trading with the Enemy Act of 1917.\n\nThe reason the privately-owned gold has become such a flashpoint is that, by late 1932 the Federal Reserve had reached its credit limit, and by law 40% of the Notes issued by the reserve had to be backed in gold. Therefore, gold hoarding by companies, banks, and private individuals in the financial sector have hampered the ability of the Federal Reserve to increase the money supply and prevent banking crises such as the one which struck Michigan this February. By reducing the amount of gold in circulation, the Executive Order would thereby free the Federal Reserve to produce more notes and circulate more currency.\n\nThe order makes exceptions for jewelry, small private collections, museums, and other professions that make use of, or display, gold – but expressly forbids it from being taken out of circulation by finance. This order has caused an uproar among the American business community, who call it an overreach of the Government’s authority. Nonetheless, the Cabinet is certain this will help rectify the financial situation."
 USA_flavour.14.a:0 "Preventing hoarding will help the economy"

 USA_flavour.15.t:0 "Federal Project Number One Founded"
 USA_flavour.15.desc:0 "While much of President [USA.GetLeader]’s social programs have centered on increasing union density, improving housing standards, and employing out-of-work laborers through public works projects, the recently-established Works Progress Administration has also funded a program for the public employment of artists, writers, performers, actors, and historians: Federal Project Number One. FPNO has four subdivisions; the Federal Writers Project, the Federal Theater Project, The Federal Music Project, and the Federal Art Project, each employ out-of-work artists to perform work for the federal government, or provide them with grants to pursue their own craft further.\n\nThe Project was developed by Harry Hopkins and Eleanor Roosevelt, who hoped to help save the American arts and humanities that had suffered dramatically from the Great Depression. The President enthusiastically backed the proposal, saying in his speech announcing its creation that the “American Dream was the promise not only of economic and social justice but also of cultural enrichment”. The Agency will fund free music lessons for adults and children, murals and public art in city centers, put on free plays in areas where people previously had not had access to them, teach English literature and creative writing at night classes for workers, preserve oral statements from the last living former slaves, create free guidebooks to generate tourism, and promote city beautification programs.\n\nFederal Projects Number One has already drawn a good deal of criticism from conservative civic groups, who call it the ‘worst example of wasteful spending’, but the project has already scored high-profile successes by employing celebrated novelist John Steinbeck, and artist Jackson Pollard."
 USA_flavour.15.a:0 "Art is for everyone, not just the elite"

 USA_flavour.16.t:0 "FPNO Under Fire "
 USA_flavour.16.desc:0 "One of the WPA’s flagship operation, Federal Project Number One, has come under significant and sustained criticism by conservative representatives and the House Un-American Activities Committee. The FPNO consists of writing, theater, visual art, and music subdivisions, and provides free public art, plays, city beautification programs, federally-supported music grants, and music lessons, utilizing thousands of artists left unemployed by the Great Depression.\n\nAmong the FPNO ventures that have drawn Congress’s ire are the ‘Living Newspaper’ project, which uses theater to convey national and world news and make it more easily understandable to audiences that lack a formal education. Conservative members of Congress argued that the LNP was overtly left-wing, satirizing major corporations, urging workers to unionize, and dwelling on issues such as negligent landlords and price-gouging local monopolies. HUAC committee-members have also raised concerns about the Federal Writers Project, many alumni of which have written works that condemn racism, antisemitism, and fascism – which they say indicates infiltration of the program by ‘communist sympathizers’. Additionally, the FPNOs willingness to employ black artists, playwrights, and musicians has been decried by HUAC chair Martin Dies, himself a staunch segregationist.\n\nDefenders of the FPNO point to the high popularity of its artistic programs, and overall low cost. President [USA.GetLeader], a strong backer of the program, insists that it could instead be made permanent to encourage cultural enrichment, popularize American art abroad, and create community events for disadvantaged people otherwise unable to access them. However, outmaneuvering HUAC’s efforts to defund and close the program would require precious political capital."
 USA_flavour.16.a:0 "Close Down the Project"
 USA_flavour.16.b:0 "Continue the Federal Arts Program"

 USA_flavour.17.t:0 "Tenth Anniversary of the FPNO"
 USA_flavour.17.desc:0 "Today marked the ten-year anniversary of Federal Project Number One, which operates federally-funded arts programs, free for all American citizens. President [USA.GetLeader] was present at the opening of a new headquarters for the agency, located on the mall in Washington DC. In a speech, the President said that the persistence of the FPNO “demonstrates that, in a free and civilized society, art belongs to all the people – rich and poor. It is not enough that the body be fed, the spirit requires sustenance as well. We shall never again return to the days when those at the top could hoard beauty and solace for themselves”.\n\nToday the agencies of the FPNO employ over 80,000 artists, musicians, historians, and writers, and many of the initiatives pioneered by it during the Depression still exist and remain popular. Almost all major cities have a Living Newspaper Project, where members of the community can interactively discuss world news and political issues. The plays have become a weekly event that many Americans participate in. The free music lessons offered by the Federal Music Project are a common afterschool program for children. Public theater – classical and modernist – remains a popular American pastime. Many new works of literature made possible by the FPNO have received critical acclaim, and smaller American towns and cities have replicated the visual arts projects on a municipal scale.\n\nDespite efforts by the House Un-American Activities Committee to defund the program in 1939, the administration rallied support for the initiative, capitalizing on its popularity. While there have been intermittent efforts to close the agency by conservative politicians in the intervening years, none have succeeded, and the Arts programs remain integrated into American life."
 USA_flavour.17.a:0 "In America, art is a public good"

 USA_flavour.18.t:0 "The WPA Library Services Program"
 USA_flavour.18.desc:0 "ince its recent creation, the WPA has proven to be an excellent coordinating agency with which to pursue projects that would not otherwise have been able to find funding from Congress. One such project, announced today by WPA chair Harry Hopkins, is the Library Services Program, which aims to increase access for everyday people to information services, records, literature, and the arts. The Library Service Program plans to construct 2500 new libraries in poor and rural communities, expand existing libraries across the United States by building additions and acquiring hundreds of thousands of new books, hire tens of thousands of new librarians, fund free adult literacy courses, run national book clubs, and even provide mobile libraries – using trucks, carts and horses – to reach remote locations.\n\nLibrary access, particularly for the rural poor and those in recently-industrialized cities, is spotty and haphazard. In 1934, for example, nearly two-thirds of people in the American South did not have a library in their community, and in many farming communities in the Midwest the nearest library would be in the closest metropolitan area and travelling to one would be prohibitively expensive. Hopkins asserts that improving library infrastructure will not only improve education outcomes and provide much-needed services, but improve the spirits of those suffering the worst of the Depression.\n\nThe newly announced program has been greeted with enthusiasm by rural populations, and reports indicate that tens of thousands of people have joined or formed community book clubs almost overnight. Proponents of the WPA assert that, if sustained, programs like this will have a lasting impact on American life."
 USA_flavour.18.a:0 "Education and cultural enrichment is the right of all Americans"

 USA_flavour.19.t:0 "Household Service Demonstration Project"
 USA_flavour.19.desc:0 "The job-training programs of President [USA.GetLeader]’s administration have, until recently, almost wholly focused on the ‘skilled trades’, construction, the crafts, industry, and logistical administration. A new WPA venture, the Household Service Demonstration Project, however, hopes to expand those training programs to other sectors of the economy, particularly domestic and service work, which employs a disproportionate number of young women and single mothers – two demographic groups particularly hard hit by the Depression.\n\nThe program plans to open training centers around the country where individuals can receive stipends of $46 a month to learn to waitress, perform housework, train in childcare, train in nearby culinary schools, and receive instruction in basic administration jobs such as typing, secretarial work, and budgeting. They are then connected with job placement centers with training certificates or given a course on going to business for themselves\n\nThe motivating ethos behind the program, the brainchild of Eleanor Roosevelt, is that service workers ought to be given fully specialized training, and learn the job as a skilled trade – complete with mentor-based apprenticeships and professional certificates – rather than as unskilled and piecemeal work. This will not only help women who are the sole family breadwinners find gainful employment, but also aims to help professionalize the service industry, for which there have been few standards since its emergence. Roosevelt herself compared the program to the wait staff academies in France, where the job is treated as a respectable well-paying career path, or governess schools in Britain. The HSDP, unlike them, however, aims to make this professionalization available to all who want it."
 USA_flavour.19.a:0 "Service workers are professionals too"

 USA_flavour.20.t:0 "Recreational Demonstration Area Program"
 USA_flavour.20.desc:0 "A new Works Progress Administration initiative, announced today by President [USA.GetLeader] at an American conservationist convention in Asheville, North Carolina, aims to use federal funds to offer relief to farmers and improve public amenities simultaneously. The project, dubbed the Recreational Demonstration Area Program, will pay farmers above market price for farms which are no longer financially solvent, or whose soil is exhausted, giving them a chance to reinvest or retire with dignity. These areas would then be cultivated, employing out-of-work ecological experts and local laborers to restore the natural environment, transforming them into federally-funded nature reserves. Harry Hopkins, head of the WPA, plans to create over fifty of these public parks, and purchase over 2000 square kilometers of land.\n\nMany of the planned parks will be in areas abutting mid-sized urban centers and former industrial towns devastated by the financial collapse. The aim is for these parks to help revitalize these economies by encouraging tourism, and providing employment through the restoration projects. They will also help beautify existing cities, and thereby the residents’ quality of life, acting as low-cost recreation. The first three of these Demonstration Areas, the Blueridge Parkway in North Carolina, the Shenandoah park in Virginia, and the White Sands park in New Mexico are expected to break ground later this month.\n\nAn – unstated – benefit of this project is that, by buying out insolvent farmers, the government will gently encourage urban density, marginally improve crop prices, and reduce the number of farm workers, who would then be encouraged to learn a new trade in the CCC or another WPA program, increasing the pool of skilled tradesmen in rural or underdeveloped communities. "
 USA_flavour.20.a:0 "Saving farmers and preserving the environment all at once!"

 USA_flavour.21.t:0 "Washington Alley Dwelling Authority"
 USA_flavour.21.desc:0 "For the last several decades in American cities, though in Washington DC in particular, squatters unable to afford rent have been building their own makeshift housing in side streets and alleys usually consisting of salvaged wood and corrugated iron. These alley dwellings were cramped and unsanitary, without toilets, electricity or running water. The Wall Street crash exacerbated the issue considerably, and tens of thousands of people were displaced, overcrowding the improvised communities. As part of President [USA.GetLeader]’s social programs, Charlotte Hopkins – a longtime advocate for the capital’s homeless – has been placed in charge of an experimental program to improve the situation: The Alley Dwelling Authority.\n\nnIstead of providing temporary relief for the houseless or moving them elsewhere, the ADA will instead build new, modern, small houses in the side streets of the capital for those who call it home – as often as possible in the same place they had been living before. The construction program would provide material and expertise but would employ the residents themselves for the construction, so that they could simultaneously learn a trade. Following completion of the homes, the previous squatters would then become home-owners and connect with job-placement programs, allowing them to escape the cycle of poverty. This would have the effect of slightly narrowing Washington’s side streets, but dramatically reducing homelessness.\n\nWhile Washington activists have applauded the program, some members of the Cabinet feel it doesn’t go far enough, and that the Authority could be expanded to other urban areas to combat slum proliferation and poverty. Convincing skeptical Mayors to adopt the plan, however, would require a serious investment of political capital."
 USA_flavour.21.a:0 "Stick with the initial program"
 USA_flavour.21.b:0 "Expand the ADA to other major cities"

 USA_flavour.22.t:0 "National Alley Dwelling Authority"
 USA_flavour.22.desc:0 "The Alley Dwelling Authority, now the National Alley Dwelling Authority, has begun to show promising results in several major American cities, most especially Los Angeles, Chicago, Mobile, and Washington DC. The program – inspired by the work of homeless advocate Charlotte Hopkins – seeks to employ those living in the shanty towns and homeless encampments that have accumulated in urban alleyways since the Depression to rebuild their own lean-tos into small, modern family homes with electricity and running water. This turns side alleys into small residential neighborhoods, provides the houseless with homes, and gives displaced people employment and trade skills. While many Mayors were initially skeptical about the use of eminent domain to turn camps into houses, President [USA.GetLeader]’s administration promised sufficient federal funding, and additional money for other municipal projects.\n\nWith a yearly budget of 25 million Dollars, the NADA has constructed 50,000 new residential alley houses, with many tens of thousands more expected to follow in the coming years. The program is changing the landscape of several American cities, emphasizing urban density, walkability, and small businesses to serve these communities. International city planners have compared the developments to dense neighborhoods in Brussels or Amsterdam. The homeownership and job-placement components of the program have begun to bear fruit as well, of those who participated in the initiative over 75% were able to find private work or a position in one of the federal relief agencies.\n\nIn a speech at a Democratic Party dinner in Mobile on [?Global.date.GetDateStringNoHourLong], President [USA.GetLeader] extolled the benefits of the NADA. He said, “with programs like this the days of Hoovervilles are numbered, and if we keep them, they shall never return”. This remark was greeted with thunderous applause."
 USA_flavour.22.a:0 "Together, we can eradicate homelessness!"

 USA_flavour.23.t:0 "Creation of the Virgin Islands Company"
 USA_flavour.23.desc:0 "The Depression did not only impact the continental United States, all its overseas possessions were also affected deeply. In some cases, such as the Virgin Islands, unemployment was higher there than in the states themselves. Their economy, which depended heavily on rum and sugar exports, was already devastated by the prohibition of alcohol, but the Wall Street crash caused many of the Islands' resident Danish owners to close their plantations in 1930. To combat the financial downturn, President [USA.GetLeader] has authorized the creation of a publicly-owned company to revitalize the Virgin Islands, provide employment, develop infrastructure, and increase international trade.\n\nThe Virgin Islands Company, proposed by ‘brain trust’ member Harold Ickes, has initiated a plan for government owned sugar cane production, housing, harbor and road-building projects. Most importantly, taking advantage of the end of prohibition, the company will also construct and operate several rum distilleries and train new experts in rum production – using a combination of modern and traditional techniques – employing thousands of islanders. With federal support, this rum will find a ready market in the fashionable clubs of New York, London, and Paris.\n\nThe effects of the Company’s work have been immediately felt: wages have increased on the islands by 50%, fields and factories bought by the company have reopened, new public housing has been built throughout the territory, and local sugar cane production is now mechanized. The VIC has offered other forms of employment as well: it operates a state-owned poultry farm, has built a barrel factory for rum-aging, given low-interest loans to farmers, and provided tractors and mechanized farming equipment for free to modernize agriculture."
 USA_flavour.23.a:0 "Save the economy and make world-class rum!"

 USA_flavour.24.t:0 "Great Smoky Mountains National Park Opens"
 USA_flavour.24.desc:0 "President [USA.GetLeader]’s Civilian Conservation Corps has scored one of its first high-profile successes today with the opening of the Great Smoky Mountains National Park, a Federal nature reserve on the border between Tennessee and North Carolina. The project is meant to act as a tourism draw and a way to provide local employment for former members of the local logging and agricultural sectors, left unemployed by the economic downturn. The CCC spent nearly a year buying out local farmers, planting new trees, constructing observation towers and other public amenities, and clearing the brush from the new trail lines, employing over 20,000 people in the process.\n\nThe project has been a long-held goal of the state government and private conservationists alike; since the late 1910s citizens have lobbied for the area to be protected and revitalized by the National Park Service, but persistent lack of funds and interest from the Federal government prevented the project from getting under way. The protection of area has had several notable proponents, including John D. Rockefeller, who contributed five million dollars to plant new trees and to dissuade clear-cutting of the forest during the 1920s.\n\nThe President hopes that this effort will serve as a model for other government ventures, both in the south and around the country, that combine economic stimulus with natural preservation. The move has won plaudits from the state legislature, and current Governor Hill McAlister, who has styled himself as a close ally of the President’s public works programs, has already begun lobbying for further federal investment in the state."
 USA_flavour.24.a:0 "The Appalachian Mountains, protected at last"

 USA_flavour.25.t:0 "The Great Plains Shelterbelt Project"
 USA_flavour.25.desc:0 "American farmers in the Great Plains have been hit by both economic calamity and environmental catastrophe. The ongoing drought and unprecedented dust storms in Oklahoma, Kansas, Colorado, Nebraska, the Dakotas and Texas have made small-scale farming next to impossible, and displaced millions of impoverished agriculture workers. The President and the Secretary of the Interior, feel that in order to mitigate the disaster, a large-scale environmental engineering project is necessary to restore agricultural sustainability. On August 19th President [USA.GetLeader] signed an executive order, creating the Great Plains Shelterbelt Project. The Project is an effort to plant 250 million trees covering 20,000 square miles across the Great Plains in long ‘belts’ to break up corridors of strong wind, prevent the removal of topsoil, capture and maintain soil moisture, and thereby allow for the long-term renewal of the region’s economy and environmental health.\n\nThe use of ‘shelterbelts’ on the Great Plains is nothing new, American farmers have planted their own small belts of trees in the region since the 1850s to support their own farms, but nothing on this scale has ever been attempted before. The plan – according to Forest Service Chief Robert Stuart – will be to use members of the CCC to plant native trees in stretches of government-owned land and pay remaining farmers to raise their own belts on privately-held land. The program will also provide much-needed employment for the region, necessitating thousands of forestry experts, and tens of thousands of unskilled laborers to operate the state-run tree nurseries, irrigation networks, and supply chains. "
 USA_flavour.25.a:0 "We cannot allow another Dust Bowl to occur!"
 
 USA_flavour.26.t:0 "She-She-She Camps"
 USA_flavour.26.desc:0 "The recently-created CCC has been used to great effect; improving federally-owned natural lands, building roads, public amenities, providing forestry services, irrigation, and employing hundreds of thousands of destitute young men. However, members of the President’s ‘brain trust’ including Frances Perkins and Eleanor Roosevelt, feel the program does not go far enough, and provides no opportunities for young women who are similarly hard-pressed by the Depression. To rectify this, today the President has announced the creation of a new branch of the CCC which employs women; the Temporary Emergency Relief Assistance Camps, popularly dubbed the ‘She-She-She’ program.\n\nThe program will provide jobs for unmarried women between the ages of 18 and 25, attending wilderness camps where they are housed and fed. By day, they will perform manual labor – working on improvements to federal and state-owned land, and by night they are to attend vocational classes led by out of work professional typists, secretaries, accountants and craftswomen to improve their employability skills. Within hours of its creation 30,000 women had applied for the 5000 initial positions available, and the new head of the program – Marian Tinker, is already contemplating an expansion of the camps.\n\nThe She-She-She project is scheduled to take over several existing CCC reforestation sites in Missouri and New York, freeing up the latter to begin road construction in other states. This program is not without its critics, and many conservatives in the federal bureaucracy are uneasy about employing women for manual labor, comparing such ‘experiments’ to Soviet Russia. However, economic straits are so dire that such critics have had no success in undercutting the initiative."
 USA_flavour.26.a:0 "Women, your country needs you!"

 USA_flavour.27.t:0 "Criticism of the She-She-She Program"
 USA_flavour.27.desc:0 "The Temporary Emergency Relief Assistance camps, also known as the ‘She-She-She’ program, has come under vociferous criticism by members of Congress. The initiative was created as a women’s counterpart to the CCC work-programs for men, performing much the same roles: reforestation, environmental restoration and the construction of public amenities. Since its creation, the project has employed tens of thousands of women. With the improvement of the economic situation since 1933, many elected officials, and those in the Federal bureaucracy feel the program is no longer needed. The program has also long been the target of conservative critics who have accused it of having a radical bent, pointing to reports of communists in the program, rumors of women singing the Internationale at work, or the high number of African American women participants – and political opposition to the camps is mounting.\n\nEleanor Roosevelt, on the other hand, has been a tireless advocate for the She-She-She program from the beginning, arguing that women, particularly young women and single mothers, have been even harder-hit by the Depression than men, and that many have been left their sole family breadwinner. She and ‘brain trust’ member Frances Perkins have advocated for a further expansion of the camps, transitioning from natural restoration to participation in other government works projects, such as highway and municipal construction, and taking over supply chain jobs – truck-driving, cooking, and administration - for CCC initiatives, freeing up men to perform work in the field. Perkins and Roosevelt insist this will create a new generation of trained professional women, able to enter the workforce on their own, or help in case of a national emergency."
 USA_flavour.27.a:0 "Everyone works in a crisis, expand the program"
 USA_flavour.27.b:0 "There is too much opposition, close the camps"

 USA_flavour.28.t:0 "National Women’s Corps"
 USA_flavour.28.desc:0 "The expansion of the ‘She-She-She’ camps – the CCC auxiliary designed to provide jobs for young women, has borne fruit despite intense political opposition among Congress. The enlarged program, renamed the National Women’s Corps (NWC), now acts as a national Women-only auxiliary to the Works Progress Administration and the Civilian Conservation Corps, numbering 180,000 strong. The women in the NWC participate in public works construction, truck driving, and manual labor. By day they engage in reforestation or any of the other myriad federal projects they are attached to, and in the evening takes classes to learn a skilled trade. Service in the corps is limited to one year, after which the participants are granted a certificate of trades education and put in a private work placement program.\n\nThe NWC is – perhaps radically – changing the nature of the American workforce, with tens of thousands of skilled women crafts workers, it has become more common for private industries to hire and retain women. A generation of American women with steady skilled employment and disposable income has been a boon for small businesses around the country. NWC head Marian Tinker believes that this state of affairs will improve the lives of countless people previously consigned to poverty. It has also provided a pool of new professionals able to be mobilized in supporting roles in case of war or national emergency.\n\nThe triumph of the NWC has been the completion of Route 26 in Oregon – a planned highway from the coast to the Idaho border – more than three years ahead of schedule. Construction began in 1933 and it was soon handed to CCC. The employment of NWC labor greatly sped up the process, and both Eleanor Roosevelt and Frances Perkins attended the ribbon cutting on September 3rd."
 USA_flavour.28.a:0 "\"If they don't give you a seat at the table, bring a folding chair\""

 USA_flavour.29.t:0 "Opening of the Triborough Bridge"
 USA_flavour.29.desc:0 "After seven years of work, and at the cost of more than forty-two million Dollars, the Triborough Bridge and viaduct system opened for traffic in New York City. The Triborough Bridge is a misnomer: it is a complex arrangement of several bridges, roadways, and tunnels which link Manhattan, the Bronx, Queens, and the rest of New York state. It is already regarded as something of a modern infrastructure marvel, drawing praise from city planners and architects, both domestic and international. With eight lanes of traffic, it allows motorists and public transportation much greater ease of access to the different parts of the city, and its successful completion opens the door to larger infrastructure and public works projects in the Northeastern United States.\n\nWhile construction began in 1929, the project languished with little progress made due to lack of funding in the early years of the Depression. The creation of the Public Works Administration by President [USA.GetLeader], and the election of the reformist Mayor, Fiorello La Guardia, greatly hastened the construction process. The Triborough network is only the first of several planned improvements to the City; the Lincoln Tunnel, connecting Manhattan to New Jersey, is scheduled to open by the end of next year."
 USA_flavour.29.a:0 "A public works triumph"

 USA_flavour.30.t:0 "Creation of the U.S. Travel"
 USA_flavour.30.desc:0 "One of the most lasting issues of the Depression has been the collapse of the American tourism industry, even now the vast number of employed has meant that regions which depended upon seasonal visitors have not seen the same recovery that other parts of the country have. President [USA.GetLeader] has attempted to rectify this, using the CCC and other work programs to improve or create dozens of new National Parks and nature reserves for public use. However, encouraging tourism has proven difficult for the National Park Service alone. One member of the President’s Cabinet – Harold Ickes – has proposed a new agency to help the beleaguered NPS and subsidize American travel, while providing employment of its own.\n\nThe U.S. Travel Bureau will act as the federal government’s state-owned travel agency. It has already hired thousands of photographers, advertisers, artists, and ecologists to help promote the new parks, amenities, and public works produced through the New Deal. The Travel Bureau is using several modern means to accomplish its goals; taking out ads on popular radio programs, raising awareness about the new National Parks and Recreational Demonstration Areas in newsreels before movies, running a ‘See America’ poster and flyer campaign nation-wide, and building a ‘Travel America Hall’ as its headquarters in New York, with photographs and exhibits from notable American natural landmarks. It also will begin an overseas campaign, targeting potential tourists in Europe. The program even subsidizes bus, train, and airplane tickets to make travel more affordable to the average American[Zep_US_travel_bureau]."
 USA_flavour.30.a:0 "See America, by car, train or plane!"

 USA_flavour.31.t:0 "New Orleans Public Works Project Completed"
 USA_flavour.31.desc:0 "One of the largest city revitalization programs in American history, the New Orleans Public Works Project, has achieved all of its construction goals over a year ahead of schedule, marking a major achievement for President [USA.GetLeader]’s Administration. The program was headed by Edward Bennet, the man behind the 1909 Chicago revitalization plan, with goals to double the size of existing city parks, provide new city-wide amenities such as public restrooms, commit new funds to the preservation of historic sites such as the French Quarter, build a new public sports stadium, and modernize the New Orleans’s harbor facilities. The project cost twelve-million Dollars, and during the two years it took to complete employed more than 20,000 Louisianans through the Works Progress Administration.\n\nThe Public Works Project was intended by Bennet’s firm to serve as a prototypical model for the future improvement of other cities in the American south: widening sidewalks for pedestrian use, providing public services to encourage commerce downtown, planting trees along major avenues to reduce temperatures in public areas, opening of a new city art museum, and emphasizing open spaces for socialization such as the City Park,\n\nNew Orleans Mayor Robert Maestri, a protégé of Louisiana political titan Huey Long, has also been successful at diverting more state funds to the city, pursuing municipal programs to supplement the efforts of the WPA. Maestri has broken ground on five new major public housing projects for low-income residents, opened a new charity hospital, and increased funding for the city’s police force."
 USA_flavour.31.a:0 "A model city for the modern south"

 USA_flavour.32.t:0 "Lincoln Tunnel Opens in New York"
 USA_flavour.32.desc:0 "New York City, the densest urban area in the United States, today bore witness to some of the first fruits of the President’s major infrastructure projects. In a ceremony led by Mayor Fiorello La Guardia and the Governors of New York and New Jersey, members of the Public Works Administration cut the ribbon opening the Lincoln Tunnel, a traffic route from New Jersey to Manhattan which passes under the Hudson River. The tunnel will relieve the traffic strain on the existing bridges, reduce the existing transit times, and allow for greater commercial traffic in and out of the city.\n\nConstruction on the route began in 1934 as part of a slew of federal programs to improve New York’s transit authority, employing 3000 workers and making use of local suppliers, construction firms, and engineering companies that had been significantly harmed by the Wall Street crash. The effort involved carefully boring a tunnel under the river, at a depth where the construction would not impact the commercial traffic of the Hudson – a significant achievement using present technology. On its first day of operation the tunnel was used by almost 8000 vehicles, and the tolls raised over $50,000. A second tunnel, presently under construction, is scheduled to open in 1940. \n\n"
 USA_flavour.32.a:0 "Marvelous!"

 USA_flavour.33.t:0 "Completion of Tygart River Dam"
 USA_flavour.33.desc:0 "West Virginia, one of the poorest States in the Union, has long been flood prone. Its mountainous terrain and many narrow valleys provide the worst possible conditions for flash floods during autumn heavy rains. Between 1920 and 1930 alone, millions of Dollars’ worth of crops have been lost to flooding, and thousands of homes destroyed. As part of the ongoing public works efforts, a dam on the Tygart River has been constructed to create a new drinking water reservoir, provide power for the Administration’s rural electrification efforts, and better control the floodwaters of the Tyrgart Valley River located in the northern part of the State.\n\nThe Army Corps of Engineers and the Public Works Administration approached Paul Phillippe Cret, a French-born industrialist to design the dam. Cret envisioned it as an artistic, as well as a practical, fixture, and built it in the Art Deco style, with plans for modern communities surrounding the new reservoir to replace the unincorporated settlements subsumed by the construction of the dam – providing employment for thousands of people. At a cost of 18 million Dollars, it is one of the largest and most expensive New Deal projects to date in Appalachia.\n\nWhen the dam neared completion, the President attended a dedication ceremony where he gave remarks on the benefits of projects like these; “I am told by the engineer in charge, that here in Grafton there are no people who want work who cannot get work. We are not here to defend the New Deal, we are here to proclaim it! This is a very different sight from what I saw in West Virginia in 1932 and I believe the country is well on its way to recovery and the kind of recovery that is going to stay!”"
 USA_flavour.33.a:0 "Rural electricity will improve countless lives"

 USA_flavour.34.t:0 "Creation of the Civil Liberties Unit"
 USA_flavour.34.desc:0 "The Department of Justice has today announced the creation of a new agency to investigate violations of the Constitutional Rights of private citizens, the Civil Liberties Unit. Its remit is to determine, and prosecute, violations of the 13th Amendment, such as tenant farmers forced into involuntary servitude, violations of new  labor laws, as well as curtailment of free speech and voting rights. At the press conference announcing its creation, Attorney General Frank Murphy was effusive about it importance: “In a democracy, an important function of the law enforcement branch of the government is the aggressive protection of the fundamental rights inherent in a free people”.\n\nPolitical observers have noted that there may be geopolitical motives for the creation of the CLU; the rise of far-right militancy worldwide has not left the United States untouched. Fascist organizations such as the Hitlerite Silver Shirts, the German-American Bund and their paramilitary wings are prime targets for the CLU. Furthermore, the Agency appears to be preparing a crackdown against other homegrown violations of civil liberties: Attorney General Murphy has suggested that the CLU will conduct investigation into accusations of police brutality, Ku Klux Klan harassment, and electoral intimidation.\n\nThese latter intended duties have raised the ire of southern and city-machine Democrats, most especially Mississippi Governor Hugh White – who complained publicly that this agency would prevent states from “looking after their own affairs”. Other southern governors quietly cautioned the Administration from going too far. This only serves to underline the regional and coalitional rifts in the Democratic Party, united by support for the New Deal programs but divided on matters of African American rights and progressive social policies."
 USA_flavour.34.a:0 "Violations of citizens’ rights cannot go unpunished"

 USA_flavour.35.t:0 "New York Municipal Airport Begins Operation"
 USA_flavour.35.desc:0 "A crowd of 50,000 people descended upon East Elmhurst, in Queens, today to watch as Mayor Fiorello La Guardia officially opened New York City’s first dedicated airport, the NYMA. The work began in 1937, with support from the Works Progress Administration, after Mayor La Guardia’s intensive lobbying efforts in Washington. The airport is located proximate to the East River, allowing for traffic from standard passenger flights and international traffic by seaplanes.\n\nPrior to the construction of the Municipal Airport, the most common way for air travelers to reach the city was via Newark airport in adjoining New Jersey, followed by a train or ferry ride into the city proper. [Zep_NY_municipal_airport]\nAs New York City continued to grow during the 1930s, the necessity of a landing site in the city itself became apparent. Mayor La Guardia began a highly colorful awareness campaign to rally support for the initiative, at one point even ordering a flight he was on to land in a stretch of open field in Brooklyn because his ticket read ‘New York’, and he “wanted his money’s worth”.\n\nPresident [USA.GetLeader] ultimately threw his support behind the project, recognizing the commercial – and military – benefits of such a proposal. Indeed, the USAAF has reserved space at the airfield to improve the defenses of New York harbor, and to quickly move men and material throughout the eastern seaboard."
 USA_flavour.35.a:0 "Excellent!"

 USA_flavour.36.t:0 "Mining Union Wins ‘Harlan County War’"
 USA_flavour.36.desc:0 "The longest-running, and perhaps the most violent, strike in American history has ended, at least for the moment, in a victory for the nascent United Mine Workers. The Harlan County War, which has consumed much of southeastern Kentucky for the last 2 years has concluded with the election loss of anti-union Sheriff Blair, the mandate from the federal government to allow open shops, and a federally-increased wage. The strikes were accompanied with outbreaks of violence, and the mobilization of the National Guard multiple time to break the strikers.\n\nThe ‘war’ began in 1931 when, facing loss of profits amidst the Depression, Kentucky mining companies cut wages by 10%. This move came on the heels of other humiliations, such as being forced to spend paychecks in company stores under threat of being fired, attacks on miners attending county meetings, and ‘slum’ company-owned housing. A strike was soon called, and the companies responded with brutal reprisals. County Sheriff, J.H. Blair, openly allied himself with the mine-owners and frequently deployed violence against strikers and those who he claimed were sympathetic to the ‘reds’. Union organizers reported the Sheriff hiring mercenaries, laying ambushes for strikers, and even assassinating outspoken workers in their homes. The miners for their part laid ambushes for strikebreakers, and frequently exchanged gunfire with law enforcement. One such exchange in 1931, the Battle of Evarts, resulted in four deaths before the Kentucky National Guard was mobilized.\n\nThe passing of the National Industrial Recovery Act gave the momentum back to labor leaders, and local elections in the county this year saw the removal of Blair in favor of a pro-union candidate – and new federal labor mandates, at least de jure, gave the mineworkers much of what they had asked for. However, despite this, many in the county expect the violence to continue as already mining companies are feverishly looking for ways to circumvent the new regulations."
 USA_flavour.36.a:0 "You’ll either be a union man or a thug for JH Blair!"
 
 USA_flavour.37.t:0 "Congress of Industrial Organizations Formed"
 USA_flavour.37.desc:0 "A major dispute within the American Federation of Labor (AFL), the largest trade union organization in the United States, has resulted in the departure of several member-unions who have left to form a new group: the Congress of Industrial Organizations (CIO). This includes militant unions such as the UAW, the Steel Workers Organizing Committee, and United Mine Workers fresh from their 1933 victory in Harlan County.\n\nThe core of the disagreement between the unions that left to form the CIO and those remaining in the AFL is a dispute over the purpose, and strategy, of American unions. The AFL supports ‘craft unionism’ – where a union defends a particular kind of skilled trade: such as carpenters and plasterer’s unions. The CIO supports industrial unionism, where all workers in an industry participate in the same union, such as an automakers union or a construction union. Political tensions have exacerbated the differences; the AFL eschews popular reformism and considers the CIO to be staffed with communists. The CIO supports the New Deal, allowing African Americans to join unions, linking unions to left-wing political causes, and believes the AFL is too deferential to business leaders.\n\nThe split was a highly acrimonious one; an AFL spokesman at this year’s committee meeting called the CIO “a bunch of wide-eyed utopians, socialists, and supporters of unskilled labor”, the CIO retaliated, calling the AFL “dinosaurs from a bygone era, who in twenty years of trying have never once improved worker’s lives”. The CIO has reportedly begun a recruiting campaign to build support in the auto, steel, and consumer goods industries. While activity has fallen off slightly in the aftermath of the split, labor observers believe that the CIO will pursue an aggressive organizing campaign now that they are not beholden to AFL leadership."
 USA_flavour.37.a:0 "What does this split mean for organized labor?"
 
 USA_flavour.38.t:0 "Kelsey-Hayes Strike"
 USA_flavour.38.desc:0 "The United Auto Workers, one of the smaller member-unions of the burgeoning Congress of Industrial Organizations, has successfully won the first major strike in the automotive industry since the calamitous Ford strike of 1933 – marking an important victory for American organized labor. The strike took place at the Kelsey-Hayes factory in Detroit and was led by the up-and-coming organizer Walter Reuther. The crux of the complaints by the workers was KH’s consistent assembly-line speed ups. Over the course of the day the pace of work continually increased without any similar increase in pay – workers frequently collapsed from exhaustion, and those that did were often fired. Consequently, accidents dramatically increased: dozens of workers have lost arms to the machinery and, even then, the company has refused a slowdown.\n\nUAW representatives spent weeks painstakingly organizing in secret. During a shift in the busy holiday season, all workers sat down at their stations when a signal was given – stopping all production, occupying the factory and refusing to leave until their demands were met. The plant owners attempted to move the machinery to another factory, but workers outside barred the gates. After ten days the company faced such heavy financial losses that they gave in to the workers’ demands: Reuther negotiated a work slowdown, equal pay for women, an across-the-board raise, paid vacation time, and freedom to join a union.\n\nKelsey Hayes is not a particularly large company within the industry, though, since it sells its parts to several major automakers, many commentators have suggested that this strike represented a trial run for larger campaigns at companies like Ford or Chrysler. Reportedly the larger automakers have begun hiring private security and donating more frequently to police pension funds to prepare for the coming onslaught."
 USA_flavour.38.a:0 "Something is stirring in the auto industry"
 
 USA_flavour.39.t:0 "National Automotive Labor Board"
 USA_flavour.39.desc:0 "As part of his efforts to improve workers’ living standards while containing labor militancy during the economic recovery, President [USA.GetLeader] has announced the creation of a new ‘Labor Board’ to help mediate disputes within the automotive industry. This board will be granted the power to arbitrate disputes between management and open shop factories, acting as a temporary neutral third party while the president’s proposed National Labor Relations Board gains the support it needs in Congress. While both trade unions and management have offered support for the agency, reports indicate that both – privately – expect the board to fail.\n\nThe creation of the board is considered an absolute necessity by members of the President’s cabinet: several industry-wide strikes in early 1933 precipitated retaliation from the Ford Motor Company, resulting in mass plant closures and, indirectly, the calamitous Michigan Banking Crisis. The failure of the 1933 Ford strike has only exacerbated, rather than settled, the growing tensions in the sector and work speed ups and wage decreases have continued since the crisis. The creation of the Board has only narrowly averted a threatened industry-wide industrial action that could have caused a new recession.\n\nThe Board has already extracted key concessions from both parties: automotive companies have promised to stop further wage cuts, and to allow the institution of 15-minute break times, the unions have agreed to avoid industry-wide strikes for the next two years unless the manufacturers break the agreement. Despite this success, the Board remains a stopgap measure to buy the President time while he enacts his economic recovery agenda, and unless economic conditions improve many labor observers expect a massive backlash within the sector by labor and capital alike."
 USA_flavour.39.a:0 "Labor and capital need to compromise while the economy recovers"
 
 USA_flavour.40.t:0 "The Flint General Motors Strike"
 USA_flavour.40.desc:0 "In the largest and most disruptive strike in the history of the automobile industry, the UAW and its star-organizer Walter Reuther have initiated a factory occupation at the most crucial General Motors plants in the country, bringing a significant portion of car manufacturing in the United States to a halt. Much as with the Kelsey-Hayes dispute, workers have become infuriated by work speed ups, low wages, gender pay disparities, and poor benefits. By striking at GM, the premier auto manufacturer, the UAW hopes to win changes industry-wide.\n\nThe UAW activists, instead of haphazardly picketing every GM factory, carefully selected three key plants that produced parts necessary to car manufacture and – as they did in the KH strike in December, organized for weeks in secret and occupied the factories by surprise – refusing to vacate the premises until their demands are met. Police were quickly called in to remove the strikers, but the workers repelled them with bottles, bats, and barricades. By evening a brutal siege had begun, the police set up machine gun roadblocks, production had halted in much of the Midwest, and law enforcement was unable to dislodge the Union.\n\nThe local court has issued the Governor of Michigan with an order to remove the strikers from company property, using the National Guard if necessary. The Governor, a noted liberal, has thus far resisted complying with the court's order – arguing that sending in the Guard would result in an unnecessary massacre. The Governor has proposed to the President, instead, that the Guard be used to separate the strikers and the police, creating a buffer until a union bargaining agreement can be reached. Shareholders of GM, on the other hand, have demanded action from the Administration, urging that the Guard remove the UAW by force."
 USA_flavour.40.a:0 "Call the National Guard to break the strike"
 USA_flavour.40.b:0 "Have the National Guard defend the strikers"
 
 USA_flavour.41.t:0 "Battle of Flint"
 USA_flavour.41.desc:0 "Smoke rises from the General Motors factory this morning as the last of the UAW strikers have been hauled out of the Flint factory district by the Michigan National Guard, many of them in body bags – the industrial district lies in ruins. The breaking of the strike through military force has left 67 dead, including 12 Guardsmen and Walter Reuther, the UAW organizer behind the strike. Millions of working people are outraged by the heavy-handed tactics of the Federal government, and opinion polls confirm that a significant number of voters have abandoned the President.\n\nUpon receiving the order to storm the General Motors plant, the National Guard were initially repelled by thrown bottles and makeshift barricades. After three days of similar failures, one guardsman was killed by a thrown brick and the exhausted commanding officer gave the order to fire. The attack killed dozens of strikers, the order was given to fix bayonets, and a pitched melee began. Within hours, the factory was cleared and the strike ended.\n\nThe death of Reuther is reverberating throughout the CIO: while a staunch union militant, Reuther was considered a key opponent of Communist Party members – and his hitherto success had been a major factor in the dominance of the reformist faction. With his death, communists have moved to make him a martyr, and a reminder that the Federal government is the enemy of working people: it is likely they will seize control of the Union leadership. The breaking of the strike has meant the company has won the battle but may yet lose the war – hundreds of retaliatory and sympathy strikes are planned, and membership rates in several unions are soaring. “Remember Flint” will likely be a union rallying cry for decades to come and Woody Guthrie’s “Ballad of the Battle of Flint” is topping national charts."
 USA_flavour.41.a:0 "The UAW is broken, for now"
 
 USA_flavour.42.t:0 "Total Victory for the Flint Strikers"
 USA_flavour.42.desc:0 "As of this morning, the disruptive and costly strike at the Flint General Motors plants has ended in a complete victory for the factory workers and the UAW. As the costs of the factory occupation continued to mount GM could no longer afford to hold out and, with the Governor acting as mediator, has agreed to recognize the UAW and concede to almost all of their demands. The bargaining agreement gives all GM workers the right to join a union, gives a pay raise of 5%, slows down the speed of the assembly lines, gives equal pay to women and black workers, and provides paid vacation time for all employees. The victory has granted immense legitimacy to the UAW, whose membership has doubled over the course of the strike.\n\nAfter the President tacitly approved the Governor’s plan to interpose the National Guard between the police and the factory, further outbreaks of violence had been prevented, though the siege continued during the negotiations between the union and GM. Workers in the factory set up their own governing body; workers not on watch took sleeping shifts, the factories had their own courts, cafeterias, and recreation, and union sympathizers delivered food, coffee and tobacco under the cover of darkness. The strike became a cause celebre, with other unions starting sympathy strikes and collecting to provide relief to UAW families.\n\nThe enormity of the victory can hardly be understated: the strike became international news, and the BBC has even called it “the strike heard ‘round the world” – the victory has changed the balance of power between unions and employers for decades to come. One striker likened the elation to a “country experiencing independence”. Fresh from the success, the CIO has begun an effort to unionize Ford and US Steel."
 USA_flavour.42.a:0 "Solidarity forever!"
 
 USA_flavour.43.t:0 "Battle of the Overpass"
 USA_flavour.43.desc:0 "Fresh from victory in the General Motors strike in Flint, the UAW has moved to organize a union in the most staunchly anti-organized labor company in the United States; the Ford Motor Company. Ford infamously fires all workers who attempt to agitate for collective bargaining agreements, and in 1933 even temporarily closed all its facilities in the United States to break a strike, indirectly causing the Michigan banking crisis that year. While Ford is considered nearly impossible to crack by labor experts, it also represents the crown jewel of the auto industry – a victory there means the UAW will likely win industry-wide bargaining rights. However, the events of today demonstrate precisely how difficult such a feat would be.\n\nWalter Reuther, the organizer behind the Kelsey-Hayes and Flint strike, was assaulted in broad daylight by company security on public property. Reuther and several workers, handing out union flyers on a public overpass leading to Ford’s Dearborn factory, were beaten from behind by forty plainclothes men confirmed to be Ford security. They bashed Reuther’s head against the concrete until he lost consciousness and then turned on the others – one picketer suffered a broken back. Afterwards the Ford men seized or broke the cameras of the journalists present – only one managed to escape with film from the assault.\n\nThe brutal and open violence by hired mercenaries against picketers on public property – some of whom were women – and attacks on members of the press, has generated a wave of outrage against Ford nationally, and public opinion has swung decisively in favor of Reuther and the UAW. Within hours a national boycott of Ford began. However, despite the outcry, without firm pressure from the federal government it is unlikely Ford will agree to come to the bargaining table."
 USA_flavour.43.a:0 "Demand Ford negotiate with the UAW"
 USA_flavour.43.b:0 "The Federal government should not interfere"
 
 USA_flavour.44.t:0 "UAW Campaign Successful"
 USA_flavour.44.desc:0 "While the Ford Motor Company has managed to quash the organizing campaign at their plants for the moment following their use of violence in the Battle of the Overpass, the UAW has been mostly successful in their efforts to unionize the American auto industry. The public outcry on behalf of the union, and the boycott against Ford, has strengthened the UAW’s bargaining position in several of the smaller plants and companies that had not yet signed a collective bargaining agreement, allowing voluntary recognition of unionization. In union halls around the country, CIO members celebrated the victories with barbeques and get-togethers.\n\nWithin six months of organizing, the UAW has gone from a few thousand activists to over 800,000 members, transforming the auto industry from one of the least-protected sectors in the country into a sector where unionization rates are among the densest in the country– a extraordinary achievement for organized labor in the United States. The success has spurred increased organizing in other sectors including such as steel production and construction, and union membership is on track to reach over 45% nationally by the end of the year.\n\nWhile the administration attempted to act as a neutral arbiter during the campaign itself, there can be little doubt that the UAW and CIO are now a force to be reckoned with in national politics- able to make or break a dozen congressional campaigns in districts with a high number of factory workers. Because of their growth and politically engaged membership, the President has called a meeting with Walter Reuther to discuss new regulations on the auto industry, and to open a channel to mediate future disputes between management and labor. The meeting has confirmed new standards – like paid vacation and higher wages – across much of the sector."
 USA_flavour.44.a:0 "A remarkable achievement"
 
 USA_flavour.45.t:0 "UAW Organizes Entire Auto Industry"
 USA_flavour.45.desc:0 "With the acquiescence of the Ford Motor Company to increasing pressure from President [USA.GetLeader] following the brutal attack on union activists by hired security in the ‘Battle of the Overpass’, the UAW removed the final obstacle to organizing the entirety of the auto sector in the United States. When the President threatened to cut Ford off from all government contracts unless they reached a collective bargaining agreement with the union, the company understood it had no alternative and accepted most of the UAW’s demands. Following the announcement of the agreement most of the remaining smaller companies in the sector reached similar contracts within weeks – giving the UAW the power to bargain for raised wages and better benefits across the entire sector in concert.\n\nWithin six months of organizing, the UAW has gone from a few thousand activists to over 1,000,000 members, transforming the auto industry from one of the least-protected sectors in the country into one where union membership is ubiquitous – a stunning and transformative victory for organized labor in the United States. The totality of the success has spurred increased organizing in hundreds of other sectors including forestry, welding, construction, clerking and union membership is on track to reach over 55% nationally by the end of the year.\n\nThe pressure by the President on behalf of the Union has not gone unnoticed by the UAW rank-and-file or the CIO leadership: UAW members held potluck dinners in union halls across the country to raise funds for the [USA.GetRulingParty] in the midterm campaign, and Walter Reuther gave a press conference following the victory over Ford where he called President [USA.GetLeader] “the best friend the workingman ever had in power”. The Cabinet sees this as an opportunity to build deeper and permanent links between the party and organized labor."
 USA_flavour.45.a:0 "There is power in a union!"
 
 USA_flavour.46.t:0 "32-40 Plan Approved Nationally"
 USA_flavour.46.desc:0 "In a ceremony at the White House, President [USA.GetLeader] signed the Working Week and Pay Readjustment Act into law, with UAW representative Walter Reuther and several members of the CIO leadership in attendance. The bill enacts a majority of the demands of the UAW 30-40 campaign into law; namely it reduces the number of hours worked before employees receive overtime pay from 40 to 32; essentially guaranteeing a four day work-week with flexible hours for most of the nation’s workers at the existing level of pay.\n\nWhile many variations of the bill were considered – the leading alternative being adding Friday to the weekend – the final version of the WWPRA gives each workplace flexibility as to which 32 hours employees work; depending upon the needs of their industry and production schedule. For some workers this will mean a six-hour working day, for others a four-day week. The bill was enacted over staunch opposition from business leaders, who claim it will impact the efficiency of industrial production significantly – union leaders, for their part, hold that this will increase demand for workers and lead to a hiring spree, as well as grant those presently employed with more disposable income to stimulate the economy.\n\nWhile both views likely hold some elements of truth to them, there can be little doubt that the law is set to transform the nature of work in the United States. Increased work flexibility and free time without loss of pay has meant that civil society groups, such as social clubs, women’s institutes and adult education classes, have seen their memberships double nationally overnight – union membership continues to grow - participation in municipal and local politics is skyrocketing – and tourism is set to dramatically increase."
 USA_flavour.46.a:0 "Four Day Week and Five Days Pay!"
 
 USA_flavour.47.t:0 "The Textile Workers Strike"
 USA_flavour.47.desc:0 "The United States today bore witness to the beginning of the largest labor strike in its history: 400,000 textile workers across the entire eastern seaboard have blockaded mill entrances and picketed company offices – refusing to return to work until their demands for better working conditions are met. The strike has been organized by the United Textile Workers, a new militant union and made up primarily of southern cotton mill workers. Entire rural towns have ceased commercial activity in support of the strike.\n\nThe workers have cited production speed-ups, consistently low pay, the blacklisting of union activists, and dangerous plant conditions as the reason behind the strike. Though the NIRA mandates a 40-hour work week, the strikers claim that mill owners demand 60 hours’ worth of production. When workers wrote letters asking the federal government to enforce the new law, mill-owners hired security guards to assault the whistle-blowers. The death of one activist, Reuben Sanders, at a mill in Georgia, proved the last straw, and a strike was called.\n\nThe President’s cabinet, not to mention the Democratic Party more generally, is deeply divided on how to respond to the strike. Liberals and progressives believe that supporting the strike offers a way to quickly make inroads for organized labor in the US South – thus building an institutionalized base of support for New Deal policies in the run up to the midterm elections and improving working conditions throughout the south. Conservatives and southern Democrats oppose such measures, as they would undercut their carefully-built political machines – they have also intimated to the president that he needs their support in Congress to pass his social programs. They propose a committee to study working conditions, rather than outright support."
 USA_flavour.47.a:0 "Offer vocal support for the strikers"
 USA_flavour.47.b:0 "Promise a committee to investigate working conditions"
 
 USA_flavour.48.t:0 "Textile Strike Succeeds"
 USA_flavour.48.desc:0 "The textile workers of the south are not asking for special treatment” the President’s radio address began. “They are simply asking for human dignity, for a fair wage for their work, and to not be killed for asking for any of these things”. President [USA.GetLeader]’s statement on behalf of the Textile strikers was a watershed moment, not just in the South, but in the American trades union movement – it was listened to by 30 million people on the night of September 4th, and public sentiment nationally turned sharply in favor of the strikers. While there were spasms of violence outside plants in Georgia and North Carolina, county Sheriffs were less willing to use force against the workers following the address. Many feared consequences at the ballot box, as the President’s popularity in the ‘Solid South’ remains very high.\n\nWithin days of the announcement, the leaders of the Textile factories – north and south – agreed to recognize the United Textile Workers union, and to accede to most of the striker’s demands. The Union won a minimum wage of $19 a week, a 40-hours work week, production slowdowns, and a reinstatement of all workers fired for union activities. The UTW also succeeded in applying these gains to black workers and women as well.\n\nThe stunning victory has potentially transformed southern politics and the future of organized labor. Veterans of the strike – emboldened by their success, are preparing to mount primary campaigns in many local elections and prepare future unionization campaigns in the south, where, it seems progressive politics has gained a foothold. These events have deeply troubled members of the party’s conservative wing, and several southern senators have begun to hold up the President’s agenda in committee in retaliation. However, it has also galvanized support for the President in the run-up to the midterms."
 USA_flavour.48.a:0 "The South is unionizing"
 
 USA_flavour.49.t:0 "Textile Strike Fails"
 USA_flavour.49.desc:0 "Following the President’s promise of a committee to investigate the abuses of textile mill owners the Textile strike began to lose steam almost immediately. Some union locals claimed that this promise itself represented a significant victory and called off their strike, others continued striking until their demands were met. The mixed responses soon caused the united front of the UTW to evaporate. While the committee was created swiftly in Washington many southern elected officials staffed the board, and defanged its ability to enforce NIRA compliance.\n\nWith many of the mills back at work, those who remained one strike were more easily targeted by law enforcement, and fresh violence broke out. Six workers were killed outside a mill in Honea Path, South Carolina for attempting to scale a fence to get into the factory; in Augusta, Georgia, two were killed under similar circumstances. County sheriffs across the south deputized anti-union community members and gave them free reign to break the strike. Within 10 days the combination of violence and the promise of a committee had cowed most of the strikers, and the industrial action gradually subsided. While some of the northern strikers won piecemeal concessions, those in the south achieved none of their goals.\n\nThe collapse of the strike has elated incumbent Southern democrats, who have promised to quickly move several important pieces of legislation through committee before the midterms. However, many UTW workers and sympathizers feel betrayed by President [USA.GetLeader] and had expected him to vocally support their unionization efforts, this apathy may hurt turnout in several critical elections. This failure has likely also set back labor organizing in the south for decades, which will keep business practices there less regulated and wages significantly below the national average."
 USA_flavour.49.a:0 "The strike is finally over"
 
 USA_flavour.50.t:0 "The Rise of Charles Coughlin"
 USA_flavour.50.desc:0 "The economic devastation wrought by the Depression has proven to be a boon for anti-democratic political organizations and media personalities, on both the left and right. One figure, however, stands above the rest in stature and influence: Father Charles Coughlin. Coughlin, a Catholic priest, has operated a popular nationally-syndicated radio program since 1930, and has gradually expanded his reach and popularity. Initially broadcasting his sermons, Coughlin soon began to comment on political matters. His views were syncretic – a mix of corporatism, anti-capitalism, anti-communism and political Catholicism.\n\nCoughlin was initially a staunch supporter of Franklin Roosevelt during his 1932 Presidential campaign – at one point declaring the election was a choice between “Roosevelt or ruin”. He vocally approved of the repeal of prohibition, and felt that Congress’s economic interventionism would prevent the rise of socialism in the United States. However, by late 1934 he had turned against the Democratic administration and began to refer to the President as a stooge of banking interests and “money changers” – he became more openly antisemitic and anti-democratic. He is a staunch backer of Senator Huey Long, claims that the Russian Revolution was the work of “Jewish bankers”, and has expressed sympathy for fascist governments.\n\nSince his political turn Coughlin’s popularity has only grown – his weekly listeners number up to 30 million. As his reach has expanded so has his overt political activity; on November 11th, in reaction to the outcome of the Midterm elections, Coughlin announced the creation of the National Union for Social Justice, a nationalist and anti-socialist ‘workers organization’ which supports his views. Much to the dismay of the Administration, it is rumored that he will form his own political party."
 USA_flavour.50.a:0 "This priest is a dangerous demagogue"
 
 USA_flavour.51.t:0 "Postal Service Expansion Program"
 USA_flavour.51.desc:0 "As part of the public works projects to help combat the Depression, President [getanme] has authorized a massive expansion of the US Postal Service. The program, backed by both the postal union and the Governors of several rural states, will construct over 2000 new post offices in previously underserved areas during the next two years – more growth than in the past fifty years combined. The new offices are primarily designed to serve rural communities and newly-industrialized towns. Supporters of the initiative argue it will provide good-paying jobs in those communities through the construction of the offices themselves, and by hiring thousands of new USPS employees to staff them.\n\nWhile the Postal Service is one of the oldest federal institutions it has, in recent years, been unable to keep up with the growth of the United States – leaving countless communities without regular access to mail or making delivery prohibitively difficult. This is most especially the case in the Great Plains states, Appalachia, and the Midwest. The Depression also seriously undercut the USPS; the crash dramatically undercut mail volume, making it difficult for the service to properly fund itself.\n\nThe program will cost 188 million Dollars and be operated through the Department of the Treasury. While its primary aim is the construction of new offices, members of the President’s brain trust hope to renovate, expand, and beautify existing structures as well. Postmaster James Farley says the program will turn Post Offices into public showcases of art and culture, displaying murals depicting local history, oil paintings from federal art projects, and sculptures. Farley also hopes that these buildings can serve as social hubs in sparsely populated regions and restore a sense of community pride."
 USA_flavour.51.a:0 "This will improve the reach of public services!"
 
 USA_flavour.52.t:0 "Bonneville Power Administration"
 USA_flavour.52.desc:0 "On August 20th, 1937, the President attended the grand opening of the Bonneville Power Administration in Oregon – begun in 1933, the project built several hydroelectricity plants along the Columbia River, most notably the Bonneville and Grand Coulee dams. Like the Tennessee Valley Authority in the south, the BPA is a state-owned corporation designed to provide affordable power to homes and industry throughout the Pacific northwest. In his remarks at the ceremony President [USA.GetLeader] described the BPA as “the most important industrial achievement in the history of this region” and promised that the federal government would use the plants to keep electricity prices in the region low and provide tens of thousands of well-paid jobs.\n\nInitially resistance to the program in Oregon was intense – opponents saw it as a government takeover of the electricity grid and warned that the BPA “would destroy State lines and take away local government”. However, resistance soon faded when Dam construction reduced local unemployment rates by over 50%. The WPA also built hundreds of new locks along the river, new roads, and dozens of fish hatcheries to improve the region’s vital salmon exports.\n\nOne side effect of the BPA project is the transformation of the commercial character of the Pacific Northwest; once a relatively rural region, the creation of the Bonneville and Grand Coulee dams has provided new cheap sources of energy for industrial production and small-scale enterprises in Portland, Seattle, and Spokane. As construction continued, urban density has increased across the Northwest as tens of thousands have moved there to seek the industrial jobs created by the construction efforts and made possible through public-private partnerships. Portland alone has seen its population grow by 25% since 1920."
 USA_flavour.52.a:0 "Affordable power for every American"
 
 USA_flavour.53.t:0 "Federal Dance Project"
 USA_flavour.53.desc:0 "The creation of Federal Project Number One – the federally-funded arts program administered by the Works Progress Administration – has given the new ‘Alphabet Agencies’ the leeway to experiment with other state-backed initiatives in the arts and humanities. The first of these new programs, the Federal Dance Project (FDP), was announced today at a press conference by WPA chief Harry Hopkins who described it as the “first national program dedicated to the financial support of dance and dancers”.\n\nThe FDP aims to employ out of work dancers, choreographers, theater professionals, prop-makers, comedians, teachers, and composers to provide free dance performances, dance lessons for adults and children, vaudeville comedy nights, and classical ballet demonstrations throughout the United States – providing steady work for thousands and making American culture more accessible to the masses.\n\nThe FDP has, almost immediately, drawn fire from conservatives who worry, not only about the public expenditure on the arts, but also the political leanings of the artists, choreographers, and dancers hired by the program. The first performance – the work of up-and-coming artist Helen Tamiris – was an original modern dance performance in contemporary clothes, highlighting unemployment, racial inequality, and the dangers of war. While it was well received by the audience and critics for “speaking on themes relevant to average Americans today”, the private Dancing Teachers Business Association said it represented an unnecessary “politicization of the arts”."
 USA_flavour.53.a:0 "Federal investment in the arts continues"
 
 USA_flavour.54.t:0 "Bureau of Public Roads"
 USA_flavour.54.desc:0 "The Bureau of Public Roads was first created in 1918 to help manage the burgeoning and haphazardly planned intercity road networks that had emerged following the mass adoption of the automobile. Though it was originally meant to act as an umbrella agency to provide maintenance for highways and rural roads, thus removing the burden from municipalities and local landowners, the agency was perpetually underfunded and poorly-managed. The Depression made matters even worse, with huge federal budget shortfalls hundreds of highways fell into disrepair, some were even condemned for being too dangerous to travel. In order to combat this growing infrastructure crisis, President [USA.GetLeader] has authorized enough discretionary expenditure to more than quintuple the Bureau’s funding.\n\nThe revitalized BPR, under the management of Thomas MacDonald – a longtime advocate for massive public infrastructure investment, has received a mandate to repave and enlarge existing roads, build thousands of new public utilities and rest stops, beautify scenic stretches of highway, and install new traffic safely methods, like traffic lights, in populated areas. Importantly for MacDonald, the expanded investment provides funds for over 7000 miles of new roads.\n\nThe program has been touted by the President's allies in Congress as a way to reduce unemployment and provide the infrastructure necessary to revitalize interstate commerce. The ‘Loan-and-grant’ structure of BPR allows for the hiring of private firms to provide manpower and materials, providing much-needed relief to hundreds of small construction firms. MacDonald has hopes that the new highways will provide the towns they pass through with a new source of income, tourists, commercial traffic, and employment."
 USA_flavour.54.a:0 "America needs better highways"
 
 USA_flavour.55.t:0 "The All-American Canal"
 USA_flavour.55.desc:0 "The prolonged drought which has struck the western United States has caused untold damage to farmers’ livelihoods over the last 2 years. Combined with the heavy financial losses from the Great Depression, hundreds of thousands of former agricultural workers have been uprooted from their homes and many have migrated to California to look for work. As a result, California suffers from one of the highest unemployment rates in the country. In order to improve agriculture yields, provide water for thousands of new farms, and offer work for the migrant population, the President has authorized the construction of a massive irrigation network stretching from the Colorado River to the Imperial Valley – dubbed the ‘All American Canal’.\n\nThe construction of the canal will employ tens of thousands of migrant laborers, and the completion of the irrigation system will allow for existing farms to increase their crop yields – thereby hiring more workers. The planned eight hydroelectricity plants along the canal will be able to provide power to the new farms, and additional energy for the growing urban centers of Los Angeles and San Diego driving down utilities prices across the state. At 82 miles in length, the All-American is anticipated to become the largest man-made canal in human history upon completion, providing irrigation and runoff networks for 630,000 acres of land in one of the driest parts of the country. While the initial canal will be completed quickly, the complex system of dams, locks, hydroelectricity plants, sub-canals, and the training necessary to staff the project is not slated to be completed until 1939."
 USA_flavour.55.a:0 "This will help farmers immensely!"
 
 USA_flavour.56.t:0 "The Madison Square Garden Speech"
 USA_flavour.56.desc:0 "In his last campaign appearance before Election Day, President Roosevelt gave a soaring speech at Madison Square Garden in New York City where he defended the progress made by his Administration since 1933, the New Deal, and his social programs. An enthusiastic crowd of over 100,000 people filed in to overflow seating to witness the event, and the speech was carried live over the radio to over 50 million listeners nation-wide.\n\nRoosevelt never mentioned his Republican opponent, Alf Landon, by name. Instead, he levelled his criticism at the previous three presidents, the Republican Party generally, financial speculators, big business, and the laissez faire approach to economics and government. He praised the federal programs that had returned millions to work, his slum clearing-efforts, social security, the National Labor Relations Board, the repeal of prohibition, and the rise in crop prices. He further promised more public works projects, wage raises, union protections, and jobs programs over the next four years; squarely positioning himself as a champion of American working-class interests.\n\nIn the most memorable moment of the event, the President declared, “We had to struggle with the old enemies of peace—business and financial monopoly, speculation, reckless banking, class antagonism, sectionalism, war profiteering. They had begun to consider the Government of the United States as a mere appendage to their own affairs. We know now that Government by organized money is just as dangerous as Government by organized mob. Never before in all our history have these forces been so united against one candidate as they stand today. They are unanimous in their hate for me—and I welcome their hatred!”"
 USA_flavour.56.a:0 "Four more years!"
 
 USA_flavour.58.t:0 "Establishment of New Jerusalem"
 USA_flavour.58.desc:0 "Since the implementation of the Slattery Report – which encourages the circumvention of US immigration limits by allowing refugees to settle en masse in Alaska – over [?german_alaska_jews] German and Austrian Jews have arrived in the territory, tripling its population in less than a year. Many of the refugees have gravitated to the territorial capital, formerly known as Juneau, where they have quickly undertaken a massive construction campaign, building hundreds of apartment complexes, schools, roads, and amenities to accommodate the growing population. Juneau, which in 1938 was home to only 5000 people, has quickly blossomed into a major metropolis of almost [?new_jerusalem_pop]. The new arrivals have christened this burgeoning urban center ‘New Jerusalem’ to reflect the new start it has offered Jews fleeing oppression in Europe.\n\nThe winter of 1938 was a difficult one for the refugee population, the mass of arrivals constructed ad hoc tent cities at the base of Mount Juneau and resources were scarce – but a national charity drive provided blankets, food, firewood, construction materials, and power generators. With the support of the federal government a program of city expansion was rapidly undertaken to accommodate the refugees based on the latest developments in urban planning.\n\nNew Jerusalem is unlike any other city on earth – its culture a mix of nearly every Jewish background from across Europe, Tlingit indigenous peoples, and pre-Slattery hunters and trappers. Though the economy of New Jerusalem is, as yet, still reliant on forestry, mining, industrial fishing, and canneries, the rapid increase in population has also caused a commercial boom for domestic industries and small businesses of every kind."
 USA_flavour.58.a:0 "Give me your huddled masses yearning to breathe free!"
 
 USA_flavour.59.t:0 "American Cultural Buildings Program"
 USA_flavour.59.desc:0 "One of the sectors hit hardest by the Depression has been America's arts, cultural institutions, archives, and museums: many of the largest museums had major banks as their primary sponsors – when the crash hit, it took most funding with it. The remaining institutions now stand on the brink of ruin: since 1929 most museums have been laying off staff, closing wings, shuttering exhibits, and selling art to private collectors to make ends meet. Two members of the President’s brain trust, Eleanor Roosevelt and Harold Ickes, have devised a program to counteract this: a spate of federal spending on municipal cultural institutions, museums, concert halls, and art galleries.\n\nThe program will use discretionary spending to fill the funding gaps in existing museums, keeping their doors open, and through the Public Works Administration construct hundreds of new ones, including over 200 galleries and municipal museums in smaller towns and cities to encourage access to cultural enrichment outside of major metropolitan areas. The federal government aims to spend 70 million Dollars in acquiring privately-held art and opening exhibits, as well as hiring thousands of curators, museum educators, archivists, and artifact restoration specialists. Hundreds of thousands will be given to universities for new archeological and anthropological expeditions.\n\nThe plan will also construct hundreds of new music venues and municipal concert halls – and increase city budgets to fund their own orchestras, ballets, and talent exhibitions, and theater troupes. This will, the administration hopes, not only raise the spirits of the American people and provide access to entertainment, but encourage spending and the cultivation of artistic talent outside of the usual major cultural centers of New York and Los Angeles."
 USA_flavour.59.a:0 "We need to save the American cultural sector!"
 
 USA_flavour.60.t:0 "The ‘Black Cabinet’"
 USA_flavour.60.desc:0 "The success of the President’s first 100 days in office has prompted a deeper evaluation about who is benefitting from the new social programs. The Great Depression hit African Americans particularly hard – the vast majority of whom are either employed in the agricultural sector, or industrial professions, and the crash all but wiped out the black middle class that had been emerging in the 1920s. To counteract the disproportionate effect on this group, President [getname] has brought together a council of leaders in the African American community to ensure existing programs benefit them and to reduce racial inequality – dubbed the Black Cabinet.\n\nMost of the members of the Black Cabinet are scholars, community leaders, religious figures and businesspeople, rather than politicians, including noted educator and activist Mary McLeod Bethune who will serve as the committee’s chairwoman. The aim of the council is to ensure that at least 10% of New Deal funds are made available to the African American community, to target jobs programs in the rural South, provide job training, expand funding to black colleges, and provide loans for black farmers. While the President is hamstrung by the southern Democrats in his coalition, many of whom have fought these programs tooth and nail, liberal members of the brain trust like Eleanor Roosevelt hope to expand these initiatives further.\n\nThere are also some electoral considerations behind the move: African Americans are a historically heavily Republican voting bloc and have been ever since the Civil War. Many members of the administration hope that, should the African American community benefit from the New Deal public works and agricultural programs, it could prompt an electoral realignment that would boost the Democratic Party nationally."
 USA_flavour.60.a:0 "African Americans need to benefit from the New Deal too!"
 
 USA_flavour.61.t:0 "Civilian Pilot Training Program"
 USA_flavour.61.desc:0 "USAAF General Henry “Hap” Arnold has brought the President a new proposal which has the potential to simultaneously greatly expand the US Aeronautics industry and increase military preparedness: the Civilian Pilot Training Program. The program will provide free flight training to 20,000 college students a year at dozens of universities from nearby airfields including – controversially, for Southern congressmen– the African American Tuskegee Institute. Though managed by civilians, each college program will have military support and funding.\n\n While, officially, the program will be proposed as a way to provide new career paths for skilled young men so they can more easily pursue careers in civilian commercial aviation after college as part of the President’s broader job training initiatives, the military benefits of this project are obvious. If tens of thousands of college-aged Americans received flight training and pilot’s licenses the USAAF would have no shortage of men already trained in basic flight in the event of an armed conflict.\n\nThe program is not without its critics: members of the opposition in Congress have charged that President [getname] would use the training program to saber rattle at other powers and “sleepwalk the United States into another ruinous Great War”. They are not alone, the United States has a strong current of international isolationism in the public at large, and anything that might be construed as rearming for a global conflict resonates poorly with the voters. Some members of the Cabinet have urged the President to reject the plan in order to buy Congressional goodwill, much to the dismay of the USAAF."
 USA_flavour.61.a:0 "America must be ready for any coming conflict"
 USA_flavour.61.b:0 "We have no need for this program"
 
 USA_flavour.62.t:0 "Bankhead Jones Farm Tenant Program"
 USA_flavour.62.desc:0 "While the New Deal programs have been broadly popular with laborers and farm owners, the benefits for tenant farmers have been mixed – in some cases worsened their financial situation. Some initiatives, such as the AAA, have raised crop prices by paying farm-owners not to grow food, however the tenants and sharecroppers of large landowners – forbidden from growing produce – have no way to secure their livelihoods and seek targeted relief from the government. Consequently, many have sunk deeper into poverty; this effect being most pronounced in the South.\n\nThe proposed Farm Tenant Program tries to rectify these issues: it provides long-term low-interest loans for tenant farmers, issues them tractors and new equipment for free, uses CCC labor to improve their land, and even grants federal funding so tenant farmers can purchase the plots they work from their landlords. Lastly, it creates a ‘Farmer’s Home Corporation’ to provide additional grants for land improvements, give education grants, buy unprofitable land from the new owners, and act and an insurance provider.\n\nThere is resistance of course – most tenant farmers in the rural south are African Americans. Southern Democrats fear that a fully-funded version of this program would allow most black sharecroppers to become landowners, allowing them to benefit from other New Deal programs, and forming the basis of a new, influential, black middle class. The Southern delegation has insisted on a limited program that merely provides loans and equipment. Progressives have argued that if funded completely, the program has the capacity to transform rural life for the better and reduce racial inequality."
 USA_flavour.62.a:0 "We need an African American middle class: expand the program!"
 USA_flavour.62.b:0 "We cannot afford to lose Southern support: limit the program"