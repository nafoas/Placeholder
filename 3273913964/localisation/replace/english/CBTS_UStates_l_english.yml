 us_depression1:0 "The Great Depression"
 us_depression1_desc:0 "The Great Depression that began with the Stock Market Crash of 1929 has spread throught all the world, but it has hit America, the place where it began, the hardest. Our economy has crashed, our GDP has dropped, the banking sector is in crisis, millions of Americans are in poverty, and the Hoover Administration has been unable to fix it."
