#spirits
CZE_petka:0 "Pětka"
CZE_petka_desc:0 "'We Have Agreed, That We Will Agree'\nThis statement functions as the guiding principle of the extraparliamentary council called Pětka (or 'The Council of Five'). The Pětka was formed in 1920 by President Masaryk, in order to guide the weak cabinet of Jan Černý, later said by some to have no political will or voice of its own. The organization was a loose council of the leadership of parties that worked to form the government (usually five, hence the name of Pětka). Soon, however, the Council began to actually rule the country, a fact the President quickly realized. However, he did not act as it was crucial for the transition from Authoritarianism to Democracy and for stability of the country. The Pětka was always lead by §GAgrarians§!, with its leader, Antonín Švehla becoming Prime Minister three times. So whoever controls Pětka, controls the country. §RIf it falls, it will have huge consequences for stability of the country.§!\n\nPětka is lead by [petka_leader_loc]\n\n[soc_dems_in_petka]\n[nat_socs_in_petka]\n[trads_in_petka]\n[christ_dems_in_petka]\n[agrs_in_petka]\n[nat_dems_in_petka]"
