 #events
 cri_civil_war.1.t:0 "Freedom for the Tatars"
 cri_civil_war.1.d:0 "We have thrown off Moscow's shackles, but that is not enough. We must defend our territory and seize the rest of Crimea! The Soviets are of course going to try to restore their authority in the region, but with any luck, we should be able to force them to the negotiating table."
 cri_civil_war.1.a:0 "For Liberty!"
 CRI_refugees:0 "Emigrating Refugees"
 CRI_refugees2:0 "Emigrating Refugees"
 cri_civil_war.2.t:0 "Russian Refugees"
 cri_civil_war.2.d:0 "Our state is ruled by and supported by Tatars, so the Russian population has understandably become nervous about their place in the new Crimea. Largely fleeing by boat, these Russians have become refugees, fleeing to the west to escape the horrors of war and the fear of oppression. Where will they go? What shall they do? Only time will tell. Their main priority is keeping themselves and their families alive."
 cri_civil_war.2.a:0 "Their fear is reasonable."
 cri_civil_war.3.t:0 "Russian Refugees?"
 cri_civil_war.3.d:0 "Russian refugees have begun to arrive in our country. Fleeing the Tatar state in Crimea, they have come to us to allow them to settle in our lands, much as they did in the first civil war. Although our government has been startled at their arrival (thus resources for their integration are not ready to be deployed), we have little choice but to let them in."
 cri_civil_war.3.a:0 "We welcome any law-abiding citizens."
 cri_civil_war.4.t:0 "Starvation!"
 cri_civil_war.4.d:0 "With our lack of preparation, a famine has begun in our country. Starvation is common as we cannot get enough foodstuffs to feed the population. Crimeans are taking to the streets to demand change and food. It seems that we will be in the grip of this famine for a while..."
 cri_civil_war.4.a:0 "We must do something!"
 #Internal
 cri_internal.1.t:0 "Choosing a Meeting Place"
 cri_internal.1.d:0 "For our legislators to legislate, they must have a place where they can meet to deliberate. Simferopol has several large buildings that we can use. We could use the Crimean State Drama Theater (established in 1821), Chirakhov's House, the resident of a Pre-Revolutionary Russian Merchant, the Crimean Mutual Credit Society Building, and the Crimean SES Building, used by the Soviet Government. It makes little difference where we meet; only that we must make a choice. Which building shall we choose?"
 cri_internal.1.a:0 "The Theater."
 cri_internal.1.b:0 "Chirakhov's House."
 cri_internal.1.c:0 "The Mutual Credit Society Building."
 cri_internal.1.e:0 "The Old Soviet Offices."
 cri_internal.2.t:0 "Creating a Qurultay?"
 cri_internal.2.d:0 "Several in our government have advocated for the creation of a second legislative chamber, called the Qurultay, to supplement the Majles. While this body would be smaller, it would also be democratically elected, and have an important Veto power on the Majles. They say that this would prevent abuses of power by the Majles. Shall we agree with this proposal?"
 cri_internal.2.a:0 "The Majles will need no supplmementary body."
 cri_internal.2.b:0 "The Qurultay will be a welcome addition!"
 cri_internal.3.t:0 "How Members of the Majles should there be?"
 cri_internal.3.d:0 "The Provisional Government simply cannot agree on how many politicians should man the Majles. We have narrowed it down to 36, 42, and 48. All this effort will determine the administrative divisions of the country. Some want it by ethnic borders, some by Soviet borders, and others wish to determine them entirely arbitraitly. Therefore, we must make the final choice. How many members of the Majles should there be?"
 cri_internal.3.a:0 "Thirty-Six"
 cri_internal.3.b:0 "Fourty-Two"
 cri_internal.3.c:0 "Fourty-Eight"
 cri_internal.4.t:0 "Election!"
 cri_internal.4.d:0 "[This.CRIGetElectionResults]"
 CRI_leftist_victory:0 "It seems that although we took Crimea away from Socialism, we could not take Socialism away from Crimea. Leftist candidates earned a hard-fought victory through promises of land reform and social welfare. Although Communist Candidates did not have a particularly good showing, as votes primarily went to more moderate candidates, it shows that Marxism has not yet left the minds of the Crimeans."
 CRI_centrist_victory:0 "Today's elections have shown a resounding victory for liberal candidates in our nation. Crimeans have voted for these moderates based on their platforms of personal freedom and economic opportunity, which the Crimeans - who have spent the lat twenty years under the Bolshevik Boot - have taken very well to. Perhaps these liberals can solve our countries problems after all..."
 CRI_rightist_victory:0 "It is self-evident that Crimean political life took a very hard rightward turn after our declaration of independence. Rightist Candidates have won today's elections on a common platform of national identity and conservative values. Although these candidates are incredibly various ideologically - ranging from more moderate liberals to a hardline monarchist or two. It is clear that Crimeans are more concerned about national independence than personal freedoms or economic welfare."
 CRI_deadlock_victory:0 "Today's elections have ended in deadlock, as no ideological grouping achieved a clear victory. Leftists here, rightists there, even centrists in some places. Nobody knows what will happen next, as nobody has a clear mandate to take the Prime Ministership. A feeling of uneasyness has spread in the country, but some Crimeans still have faith that their government can solve this issue."
 cri_internal.4.a:0 "Interesting..."
 cri_internal.5.t:0 "The New Constitution"
 cri_internal.5.d:0 "After over a month of debate, the Constitution of the Crimean People's Republic is nearly ready to be signed. The Constitution outlines the CPR as a Crimean state in the form of a federative democratic republic covering the Crimean Peninsula. It contains provisions for the personal, economic, and political freedoms of its citizens, as well as the powers of the government to intervene in the economy, raise an army, etc. The Constitution also states that elections to the legislature and the presidency are to be held every four years, with provisions for snap elections.\n\nHowever, there is one major issue remaining before the document can be complete: who are the Crimeans? Official Soviet Ethnography placed the Crimeans as a single people, with the different kinds of Tatars, Krymchaks, Urums, etc. declared to be sub-ethnicities. However, this ethnography has been disputed extensively since we declared independence. Many of our intellectuals maintain that the Steppe, Central, and Coastal Tatars, the Krymchaks, Urums, Karaites, and more, are each separate ethnicities, albeit somewhat related and somewhat mutually intelligible. It is left to the provisional ministry to decide whether Crimeans are One, or Many?"
 cri_internal.5.a:0 "Crimeans are One!"
 cri_internal.5.b:0 "Crimeans are Many!"
 cri_internal.6.t:0 "The Process has Stalled"
 cri_internal.6.d:0 "Months of enthusiastic lawmaking have stalled, as debates have become more and more contentious. What was once a sturdy coalition has become a flimsy shack, and today it has reached the breaking point. Not a single bill has passed in the last few weeks, and the people are getting restless. They think our system has failed!\n\nHowever, remedies exist. Several in our cabinet recommend bringing in a mediator to assist the process. Most recommend increasing the powers of the President, but some conservatives want us to crown Klich Girey - the current head of the Girey Dynasty, who ruled Crimea for three hundred years - as a constitutional monarch. However, some members of parliament recommend invstigating the problem, and making the current process work better. What shall we do?"
 cri_internal.6.a:0 "Crown a King"
 cri_internal.6.b:0 "Empower the President"
 cri_internal.6.c:0 "Fix the Parliament"
 CRI_king:0 "§YWe have decided to Crown a King.§!"
 CRI_president:0 "§YWe have decided to Empower the President.§!"
 CRI_parliament:0 "§YWe have decided to Fix the Majles.§!"
 cri_internal.7.t:0 "The Crimean Minority Report"
 cri_internal.7.d:0 "Our Interior Ministry reports that we have many different minorities in this country, including Russians, Armenians, Germans, and Ukrainians, each with their own languages. Although many Russians and some Ukrainians have fled Crimea, others have chosen to petition the government for laws that would give them cultural and lingual autonomy. If we enact them, we are liably to stem the flow of refugees from our country. Should we grant the minorities the right to use their own languages, or should they speak Crimean?"
 cri_internal.7.a:0 "They must have their rights."
 cri_internal.7.b:0 "Crimean is our official tongue!"
 cri_internal.8.t:0 "A Crimean Nobility?"
 cri_internal.8.d:0 "Now that we have established a Monarchy, our Conservatives have started to propose the idea of a Crimean nobility. The more hardline rightists have argued that a nobility would supplment and support the \"traditional order\". This nobility would not necessarily hold special property, but simply be an honorific applied to legislators who have served ten full years. Leftists and Centrists, on the other hand, have decried this proposal for \"threatening social equality\" and \"promoting undemocratic systems\". It is up to the Prime Minister - and then the King - to decide on what to do with this proposal. Therefore, should we accept or reject it?"
 cri_internal.8.a:0 "A Crimean Nobility upholds traditional values!"
 cri_internal.8.b:0 "A Crimean Nobility would destroy democratic systems!"
 cri_internal.9.t:0 "The Right of Succession"
 cri_internal.9.d:0 "One of the more important points of debate in the founding of the Kingdom is the issue of Succession. Should the throne always pass to the eldest son of the King, or should Parliament determine the true heir? Hardline Conservatives adamantly support the former option, as it fits more into their traditionalist worldview. Leftists are insisting that the Majles be allowed to determine the line of succession, to ensure that the King remains in line with democratic interests. The centrists are ambivalent on this issue, but generally lean towards the leftist position. The final vote is today, and the results show..."
 cri_internal.9.a:0 "...Succession will be purely Heriditary"
 cri_internal.9.b:0 "...The Majles will determine Succession!"
 cri_internal.10.t:0 "A Presidential System?"
 cri_internal.10.d:0 "Conservatives in the Majles have begun to advocate for a Presidential, rather than a Parliamentary system. Under this system, the offices of President of the Council and President of the Crimean People's Republic will become one and the same. Those elected to be the President of the Republic would thus automatically be the Head of Government as well. While Conservatives would like a decisive decision-maker to lord over a paralyzed parliament, leftists have decried this move as a dictatorship. What shall we choose?"
 cri_internal.10.a:0 "Merge the Offices!"
 cri_internal.10.b:0 "Keep them Separate!"
 cri_internal.11.t:0 "Presidential Term Limits"
 cri_internal.11.d:0 "In exchange for establishing a Powerful President, the Left and Liberals have demanded Term Limits on the office. Of course, the Conservatives have demanded that the President be allowed to serve indefinately, so as long as the people elect him. The Leftists and Centrists assert that limitless terms would create a dictatorship. It is now up to us to make a choice..."
 cri_internal.11.a:0 "One Term is Enough!"
 cri_internal.11.b:0 "Two Terms!"
 cri_internal.11.c:0 "Unlimited Terms!"
 #External
 cri_external.1.t:0 "Crimea Asks for Recongition"
 cri_external.1.d:0 "Crimean Envoys have sent us a message asking for [This.GetNameDef] to recognize their state as legitimate. Given the high level of Turkish influence on the region, many Turks' sympathies lie with the Tatars. Our government feels much the same way, and the only thing left to do is formally announce our position..."
 cri_external.1.a:0 "The Crimeans are our cousin nation; we cannot abandon them!"
 cri_external.1.b:0 "We musn't anger the Russians."
 cri_external.2.t:0 "Turkey Grants Recognition"
 cri_external.2.d:0 "[From.GetNameDef] has recognized [This.GetNameDef] as a legitimate state! This is a great boon for us for a variety of reasons. First, it provides our new state with Legitimacy in the eyes of the people. Second, it opens up a path for recognition from the rest of the world. And Thirdly, it creates new opportunities to get Turkish Economic and Material Support for our Fight."
 cri_external.2.a:0 "Not all is lost!"
 cri_external.3.t:0 "No reply from Turkey"
 cri_external.3.d:0 "Our envoys were sent home from Ankara without a conclusive answer as to our recognition. It seems that Turkey has decided not to dignify our questions with responses."
 cri_external.3.a:0 "We do not need them!"
 cri_external.4.t:0 "Crimea Asks for Advisors"
 cri_external.4.d:0 "Crimean Diplomats have sent a request from their High Command, asking us to send officers to act as consultants in their War of Independence. These advisors would help Crimean Officers plan their maneuvers, train soldiers, and establish a heirarchy. Should we send our officers?"
 cri_external.4.a:0 "Crimea cannot be abandoned"
 cri_external.4.b:0 "We do not have any officers to spare!"
 CRI_turkish_officers:0 "Turkish Advisors"
 cri_external.5.t:0 "Turkish Advisors Arrive"
 cri_external.5.d:0 "A group of thirty-five Turkish Officers have just arrived in Simferopol to act as consultants for our military. They will help our officers plan maneuvers, train infantry, and organize our ranks."
 cri_external.5.a:0 "Thank you, Turkey!"
 cri_external.6.t:0 "Turkey Refuses to send Advisors"
 cri_external.6.d:0 "The Turks have refused to send us military advisors as they cannot afford to lose officers at the moment. They say that they might revisit this decision should their situation improve, but they currently need all soldiers fighting under the Turkish flag."
 cri_external.6.a:0 "Shame."
 #tree
 ##Politics
 CRI_2RCW_Secure_Countryside:0 "Secure the Countryside"
 CRI_2RCW_Secure_Countryside_desc:0 "We must destroy the environment of lawlessness in the countryside villages. We will foster the development of police militias until a formal centralized police unit can be founded. Order must reign, not anarchy!"
 CRI_2RCW_Secure_Urban:0 "Secure the Cities"
 CRI_2RCW_Secure_Urban_desc:0 "With the exception of Simferopol, our cities are ruled by self-proclaimed \"militias\" - in reality little better than street gangs - rather than the Provisional Government. We must take measures to ensure that the people answer to Simferopol rather than these vigilantes."
 CRI_2RCW_Choose_Meeting_Place:0 "Choose a Meeting Place"
 CRI_2RCW_Choose_Meeting_Place_desc:0 "A Legislative Body needs a place to meet. This place needs to have enough space to fit all the politicians' meeting space and other administrative offices. Simferopol offers several large buildings, including theatres and merchant offices. We just need to make a choice..."
 CRI_2RCW_How_Many_Assemblies:0 "How Many Chambers?"
 CRI_2RCW_How_Many_Assemblies_desc:0 "While we will have at least one legislative body - the Majles - some in the Provisional Government have proposed to create a second chamber - the Qurultay - to serve as an advisory body with the power of Veto. We simply need to reach an agreement on this issue."
 CRI_2RCW_How_Many_Ministers:0 "How Many Members?"
 CRI_2RCW_How_Many_Ministers_desc:0 "Debate rages in the provisional government. Nobody can agree on how to divide the country. Some want to use ethnic or cultural borders, others want to use old Soviet borders, and still others want to create them entirely arbitrarily. Perhaps we should first decide the number of Members of the Majles..."
 CRI_2RCW_Integrate_Bolshevik_Bureaucrats:0 "Integrate Bolshevik Bureaucrats"
 CRI_2RCW_Integrate_Bolshevik_Bureaucrats_desc:0 "All but the Top Bolsheviks of Crimea shall be given a fair chance to peacefully integrate themselves into our bureaucracy."
 CRI_2RCW_Freedom_of_Speech:0 "Freedom of Expression"
 CRI_2RCW_Freedom_of_Speech_desc:0 "Crimeans will now be able to enjoy full political and personal freedoms! No longer shall the Soviet Dictatorship stifle our citizens!"
 CRI_2RCW_Elect_Majles:0 "Elect the First Majles"
 CRI_2RCW_Elect_Majles_desc:0 "The First Majles will be elected by the people, as all our MMs will! In one month, Crimeans will go to the voting stations to decide on their Raion's representatives. We hope they choose wisely..."
 CRI_2RCW_Appoint_Majles:0 "Appoint the First Majles"
 CRI_2RCW_Appoint_Majles_desc:0 "Although future sessions of the Majles will be elected, our first politicians should be appointed to \"get the ball rolling\", as it were."
 CRI_election:0 "§GWe will hold our first election!§!\n"
 CRI_appointment:0 "§GWe will appoint our first ministers!§!\n"
 CRI_parliament_open:0 "Crimean Democracy"
 CRI_2RCW_Open_Majles:0 "Open the Majles"
 CRI_2RCW_Open_Majles_desc:0 "Now that all the Members of the Majles are decided, it is time to convene the parliament for the first time! Our main task shall be writing the new Crimean Constitution!"
 CRI_one_people:0 "Crimean Tatar is one ethnicity, with several sub-ethnicities."
 CRI_many_peoples:0 "\"Crimean Tatar\" is in reality multiple somewhat related ethnicities."
 CRI_2RCW_Ethnic_Issue:0 "The Ethnic Issue"
 CRI_2RCW_Ethnic_Issue_desc:0 "Is \"Crimean Tatar\" an actual group, or a Soviet Invention? That debate has raged on through the constitutional process, but the Government has made its decision, and now has to enact the relevant policies."
 CRI_Ethnicities2:0 "One People"
 CRI_Ethnicities3:0 "Several Peoples"
 CRI_2RCW_One_People:0 "One People!"
 CRI_2RCW_One_People_desc:0 "\"Crimean Tatar\" is the proper term to apply to our citizens. We will continue to teach the people that our many sub-ethnicities deserve to live as one state!"
 CRI_2RCW_Several_Peoples:0 "Several Peoples!"
 CRI_2RCW_Several_Peoples_desc:0 "The term \"Crimean Tatar\" is a Bolshevik Fabrication. The various Crimean Ethnicities are separate, but somewhat related. We will teach our people that each ethnicity can live in peace under the Crimean Banner!"
 CRI_2RCW_One_Language:0 "Standardize the Tatar Language"
 CRI_2RCW_One_Language_desc:0 "Although most Tatar dielects are mutually intelligible to various degrees, we must formulate a standard language and orthography to facilitate communication for military, bureaucratic, and private functions."
 CRI_2RCW_Multilingual_Society:0 "Multilingual Education"
 CRI_2RCW_Multilingual_Society_desc:0 "All Crimean Students must be made fluent in at least two secondary languages (at least one of which must be a Crimean Language) in order to maximize our citizens' ability to communicate. As the Crimean Languages are generally mutually intelligible, we should have little problem."
 CRI_2RCW_Other_Minorities:0 "Minority Languages"
 CRI_2RCW_Other_Minorities_desc:0 "We should establish Minority Rights in our country, as doing otherwise would be oppressive. However, we must decide on our policies toward their languages. Are they meant to be included in our schools, military, and government, or should they be meant to learn Crimean?"
 CRI_2RCW_Redraw_Borders:0 "Redraw Administrative Divisions"
 CRI_2RCW_Redraw_Borders_desc:0 "Our Administrative Divisions must be redone to be drawn on ethnic lines, rather than sheer politics."
 CRI_2RCW_Common_Identity:0 "Find a Common Identity"
 CRI_2RCW_Common_Identity_desc:0 "We should be focusing on the commonalities between the Crimean sub-ethnicities instead on their differences. We must all find common ground."
 CRI_2RCW_Stalled_Process:0 "The Process has Stalled"
 CRI_2RCW_Stalled_Process_desc:0 "The Majles have become the laughingstock of Crimea. Unable to agree on anything, very few laws have been passed in the last few months. Either we should fix the parliament, or find another way..."
 CRI_2RCW_President:0 "Empower the President"
 CRI_2RCW_President_desc:0 "In order to solve the parliamentary issue, we have decided to empower the President to act as a mediator. Creating a semi-presidential system, the new constitution would allow the President to have more influence over the lawmaking process."
 CRI_2RCW_King:0 "Crown a King"
 CRI_2RCW_King_desc:0 "Klich Sultan Girey, current head of the Girey Dynasty, is the natural heir to the Crimean Throne. The new constitution will have to formally change the country from being a \"People's Republic\" to being a Kingdom. It will allow the King to give assent to laws, but also let them act as a mediator in the Majles."
 CRI_2RCW_Parliament:0 "Fix the Parliament"
 CRI_2RCW_Parliament_desc:0 "We will take large measures in ensuring that the Majles has no barriers to open debate. We will introduce term limits, investigate corruptions, and more. By the end, we should hold new elections."
 CRI_2RCW_Investigate_Corruption:0 "Investigate Majles Corruption"
 CRI_2RCW_Investigate_Corruption_desc:0 "In order to ascertain why the parliamentary process has stalled, we must investigate the Majles to find any corruptive practices that may be hindering the process."
 CRI_2RCW_Term_Limits:0 "Establish Term Limits"
 CRI_2RCW_Term_Limits_desc:0 "Establishing Term Limits on Parliamentary Members will prevent Majles members from stalling the parliament by forcing them to not focus on re-election."
 CRI_2RCW_Streamline_Bill_Writing:0 "Streamline Bill Introduction"
 CRI_2RCW_Streamline_Bill_Writing_desc:0 "It should be easier to introduce bills into the Majles. We will be more lax on what measures are proposed."
 CRI_2RCW_Improve_Election_Monitoring:0 "Improve Election Monitoring"
 CRI_2RCW_Improve_Election_Monitoring_desc:0 "Although we hold entirely free elections, we should take better care to ensure that individual polling stations are not tampered with."
 CRI_2RCW_Electoral_Thresholds:0 "Establish Electoral Thresholds"
 CRI_2RCW_Electoral_Thresholds_desc:0 "In order to encourage more established political blocs, we will enforce an electoral threshold on political groups to make our parliamentary sessions less violent."
 CRI_2RCW_New_Elections:0 "Hold New Elections"
 CRI_2RCW_New_Elections_desc:0 "Now that our reforms are complete, it would be appropriate to hold new elections, lest our reforms be in vain."
 CRI_2RCW_Nobles:0 "Establish a Nobility?"
 CRI_2RCW_Nobles_desc:0 "We must decide whether or not to establish a nobility to supplement our new Monarchy. Some say that a nobility would help to support the traditional order, others say that it would be a detriment to social equality."
 CRI_2RCW_Succession:0 "Right of Succession"
 CRI_2RCW_Succession_desc:0 "It is imperative that we decide on the right of succession to the Crimean Throne. Namely, should the throne always go to the eldest son, or should the Majles decide on the next monarch?"
 CRI_2RCW_Decide_on_Power:0 "A Presidential System?"
 CRI_2RCW_Decide_on_Power_desc:0 "We should look into expanding the powers of the President further, so that a decisive decision-maker would be at the center of our politics, rather than a troubled Parliament."
 CRI_2RCW_Pres_Term_Limits:0 "Presidential Term Limits"
 CRI_2RCW_Pres_Term_Limits_desc:0 "We should probably set term limits on the President to prevent him from being too influential in politics. At the very least, not for too long."
 CRI_2RCW_Tie_Breaker:0 "The Tie-Breaker"
 CRI_2RCW_Tie_Breaker_desc:0 "Our new system allows the executive to act as a tie-breaker if the Majles cannot agree on a law. This will prevent further deadlock."
 CRI_2RCW_New_Constitution:0 "The New Constitution"
 CRI_2RCW_New_Constitution_desc:0 "We must revise our constitution to fit our new systems. In order for them to be legal, it must be ratified by two-thirds of the Majles."
 ##economics
 CRI_2RCW_Economics_Start:0 "A War Economy"
 CRI_2RCW_Economics_Start_desc:0 "We will have to fight for our freedoms, yet we are hopelessly unprepared. Crimea has little resources to speak of; so we must develop our armed forces immediately."
 CRI_2RCW_Decollectivization:0 "Decollectivization"
 CRI_2RCW_Decollectivization_desc:0 "The Soviet Collectivization Programs wrecked havoc on our people. Ethnic and Economic Discrimination, as well as brutal methods of Repression, have damaged the land and our agricultural output. We must decollectivize in order to rectify this situation."
 CRI_2RCW_Stave_Off_Emergency:0 "Stave Off Famines"
 CRI_2RCW_Stave_Off_Emergency_desc:0 "Our Agriculture is still in poor condition. We must heavily invest in staving off starvation and famine."
 CRI_starvation:0 "Rampant Starvation"
 CRI_no_food_emergency:0 "§GWe will avoid rampant starvation.§!\n"
 CRI_2RCW_Redistribute_Surplus:0 "Redistribute Surplus Crops"
 CRI_2RCW_Redistribute_Surplus_desc:0 "Any foodstuffs that the State owns in Surplus must be redistributed to the population to improve their standard of living."
 CRI_2RCW_Establish_Industry:0 "Establish an Industrial Base"
 CRI_2RCW_Establish_Industry_desc:0 "Crimea has very little industry to speak of. We must begin to build State-Owned Heavy Industry in order to jump-start the Crimean Economy."
 CRI_2RCW_Military_Industry:0 "Makeshift Military Production"
 CRI_2RCW_Military_Industry_desc:0 "We neither have the resources nor the money to build a large defense industry. We must make do with what military infrastructure we have."
 CRI_2RCW_Call_On_Turks:0 "Turkish Loans"
 CRI_2RCW_Call_On_Turks_desc:0 "We should take loans from the Turks in order to finance our operations. However, this would be incredibly costly on our part."
 CRI_2RCW_Turkish_Food:0 "Import Turkish Food"
 CRI_2RCW_Turkish_Food_desc:0 "The Turks have a solid agricultural economy. We can import food from them to support our population's needs."
 CRI_2RCW_Turkish_Guns:0 "Import Turkish Guns"
 CRI_2RCW_Turkish_Guns_desc:0 "We must purchase guns from Turkish defense firms in order to supplement our barely-existent defense industry."
 CRI_2RCW_Turkish_Industry:0 "Invite Turkish Investment"
 CRI_2RCW_Turkish_Industry_desc:0 "We need the Turks to help build up our industry, as we have very little of our own capital to build with."
 CRI_2RCW_Turkish_Arms_Industry:0 "Invite Turkish Defense Companies"
 CRI_2RCW_Turkish_Arms_Industry_desc:0 "We should invite Turkish Defensive Manufacturers to build factories in Crimea. It would improve our defense industry and help us supply our troops!"
 CRI_2RCW_Turkish_Trade:0 "Turkish Trade"
 CRI_2RCW_Turkish_Trade_desc:0 "In order to facilitate positive relations with the Turks, we must lower trade barriers."
 CRI_turk_civ:0 "Modify §YTurkish Influence§! by\nDaily Political Power Gain: §R-0.05§!\n"
 CRI_turk_loans:0 "Modify §YTurkish Influence§! by\nDaily Political Power Gain: §R-0.10§!\n"
 CRI_turk_food:0 "Modify §YTurkish Influence§! by\nConsumer Goods Factor: §Y+2%§!\nMonthly Popu
 CRI_trade:0 "Positive Trade Relations"
 #Military
 CRI_2RCW_Mil_Start:0 "Consult Veteran Officers"
 CRI_2RCW_Mil_Start_desc:0 "[This.GetNameDef] needs to have an up-to-date trained army if it is to survive the Civil War intact. We should start by asking veterans about their experiences, as we can build off of them."
 CRI_2RCW_Mil_Popular_Army:0 "A Popular Army"
 CRI_2RCW_Mil_Popular_Army_desc:0 "A professional army is good, but we do not have the resources to raise one. Instead, we must rely on a popular army to hold back the enemy beasts!"
 CRI_2RCW_Mil_Prof_Army:0 "A Professional Army"
 CRI_2RCW_Mil_Prof_Army_desc:0 "We need an army of high quality if we hope to stand up to the enemy. A popular army is good, but it would be more efficient to have a well-trained army."
 CRI_2RCW_guerilla_warfare:0 "Guerilla Warfare"
 CRI_2RCW_guerilla_warfare_night:0 "Guerilla Warfare"
 CRI_2RCW_guerilla_warfare_partisan:0 "Guerilla Warfare"
 CRI_2RCW_Mil_Guerilla_Warfare:0 "Guerilla Warfare"
 CRI_2RCW_Mil_Guerilla_Warfare_desc:0 "Our army must fight using hit-and-run attacks if we are to overpower armies that outnumber several times over."
 CRI_2RCW_Mil_Night_Attack:0 "Nighttime Attacks"
 CRI_2RCW_Mil_Night_Attack_desc:0 "Our soldiers must be trained to work in the night. We know the night is not as it would seem: the night is a friend to the [This.GetAdjective] Army. We must learn to fight in it, and outmaneuver the Reds in the dark!"
 CRI_2RCW_Mil_Resistance_Cells:0 "Resistance Cells"
 CRI_2RCW_Mil_Resistance_Cells_desc:0 "Our soldiers must train to go underground in the case that the territory they are protecting is taken. They will become the core of a partisan cell that attacks the occupiers."
 CRI_2RCW_Support_Equipment:0 "Support Equipment"
 CRI_2RCW_Support_Equipment_desc:0 "Our army needs to be supplmented by engineers corps, reconaissance brigades, and other such support personnel."
 CRI_2RCW_Militia:0 "National Militia"
 CRI_2RCW_Militia_focus:0 "[This.GetAdjective] National Militia"
 CRI_2RCW_Militia_focus_desc:0 "Forming a National Militia as the core of our actual army would do well to fill the ranks with strong fighters."
 CRI_2RCW_Small_Arms:0 "New Firearms"
 CRI_2RCW_Small_Arms_desc:0 "We must put our engineers to work on designing new weapons so that our soldires' arms will remain up to date."
 CRI_2RCW_Artillery:0 "Artillery Effort"
 CRI_2RCW_Artillery_desc:0 "Our infantry should be supported by artillery brigades to soften up the enemy soldiers before our frontline engages them."
 CRI_2RCW_High_Command:0 "High Command"
 CRI_2RCW_Chain_of_Command:0 "Chain of Command"
 CRI_2RCW_Chain_of_Command_desc:0 "Although we do have a command heirarchy, it is largely disorganized. We should spend time structuring our High Command into a unified institution."
 CRI_2RCW_Discipline:0 "Demand Discipline"
 CRI_2RCW_Discipline_desc:0 "Our soldiers will act with honor and control! They will not loot, massacre, or steal from the populace."
 CRI_2RCW_New_Awards:0 "New Awards"
 CRI_2RCW_New_Awards_desc:0 "The promise of medals and fame will make our army truly a professional one!"
 CRI_2RCW_Doctrine:0 "Continued Doctrine Effort"
 CRI_2RCW_Doctrine_desc:0 "Our military thinkers must work faster in creating new strategies to outmaneuver the Soviet Tyranny."
 ##Foreign
 CRI_turks_help:0 "§GThe Turks have agreed to help us.§!"
 CRI_turkish_influence:0 "Turkish Influence"
 CRI_Call_on_TUR:0 "Recognition from Turkey"
 CRI_Call_on_TUR_desc:0 "If there are any foreign powers who would be receptive to a Free Crimea, Turkey would be the first. We must send them a message pleading for recognition."
 CRI_TUR_military_advisors:0 "Turkish Military Advisors"
 CRI_TUR_military_advisors_desc:0 "The Turks fought their own war of independence in the early 1920's. Perhaps their experiences could be of use to us."
 #decisions
 CRI_2RCW_decs:0 "War of Independence"
 CRI_seize_sevastopol:0 "Establish Administration in Sevastopol"
 CRI_seize_sevastopol_desc:0 "Now that we control Sevastopol, we can establish bureaucratic control in the city. The Russian residents may not like it, but we must keep order."