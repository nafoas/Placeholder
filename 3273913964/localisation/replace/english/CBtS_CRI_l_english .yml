 #ideas
 CRI_Anarchy:0 "State of Anarchy"
 CRI_Anarchy_desc:0 "Despite a general recognition of Simferopol's authority, the actual state of law enforcement in our territory is very poor. Anarchy reigns in Crimea, and if we do not focus our efforts on correcting this error, then our very independence will be at risk!"
 CRI_Anarchy2:0 "State of Anarchy"
 CRI_Anarchy2_desc:0 "Despite a general recognition of Simferopol's authority, the actual state of law enforcement in our territory is very poor. Anarchy reigns in Crimea, and if we do not focus our efforts on correcting this error, then our very independence will be at risk!"
 CRI_Ethnicities:0 "Ethnic Issues"
 CRI_Ethnicities_desc:0 "The term \"Crimean Tatar\" is in reality a Soviet term for a group of somewhat related ethnicities. Coastal, Steppe and Central Tatars, Karaites, Krymchaks and Urums - many of whom speak entirly separate languages - all count as \"Crimean Tatar\" and thus have to learn to live under one banner again."
 CRI_Sparse_Population:0 "Low Population Density"
 CRI_Sparse_Population_desc:0 "With the exception of Sevastopol, Crimea has a very low population density due to the agricultural economy. Our lack of population means that industrializing the nation will be difficult."
