HUN_reduce_the_effects_of_the_great_depression:0 "German-Hungarian Trade Deal"
HUN_reduce_the_effects_of_the_great_depression_desc:0 "To bring us out of this economical depression and the collapse of wheat prices, we must reach out to the major nations of Europe. Luckily, we have struck a long-term win-win situation with Germany where we can get us out of this depression and transform into a more stable economy."
HUN_sell_wheat_to_germany:0 "Sell Wheat to Germany"
HUN_sell_wheat_to_germany_desc:0 "As a part of our agreement, we are able to sell wheat to Germany at prices which are far more beneficial than selling it at the international market. "
HUN_purchase_german_industrial_goods:0 "Purchase German Industrial Goods"
HUN_purchase_german_industrial_goods_desc:0 "The trade agreement with Germany states that we are to prioritize importing goods from Germany, albeit with the money that we have earned from their wheat purchases."
HUN_german_hungarian_industrial_planning:0 "German-Hungarian Industrial Planning"
HUN_german_hungarian_industrial_planning_desc:0 "Conjuring an industrial expansion and management plan will aid in securing the vitality of our industry."
