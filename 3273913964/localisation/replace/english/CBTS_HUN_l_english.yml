HUN_promote_istvan_horthy:0 "Promote István Horthy"
HUN_promote_istvan_horthy_desc:0 "István Horthy, son to regent Miklos Horthy has proven himself as a talented pilot and a boost to the national morale."
HUN_indoctrinate_the_levente_youth:0 "Indoctrinate the Levente Youth"
HUN_indoctrinate_the_levente_youth_desc:0 "Nem, Nem, Soha! and Mindent Vissza! has become the unofficial slogans of the Trianon Treaty. Continued emphasis on these teachings should be benificial in the future."
HUN_promote_the_levente:0 "Promote the Levente Association"
HUN_promote_the_levente_desc:0 "Recruitment into the Levente is going fairly slow, hence we should begin recruitment campaigns."
HUN_covert_flying_clubs:0 "Covert Flying Clubs"
HUN_covert_flying_clubs_desc:0 "Since having an air force is forbidden by the Treaty of Trianon, disguising it as civilian flying clubs is necessary to retain a force of pilots."
HUN_secret_rearmament_decision:0 "Secret Rearmament"
HUN_secret_rearmament_decision_desc:0 "With the Trianon Treaty forbidding the expansion of our army, we have begun looking for ways to circumvent this piece of paper. This has led to the formation of the Leventeszervezetek, or simply Levente Association, a paramilitary organization with the method of circumventing conscription."
