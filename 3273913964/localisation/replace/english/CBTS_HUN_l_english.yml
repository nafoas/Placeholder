HUN_italy_reduce_the_effects_of_the_great_depression:0 "Italian-Hungarian Trade Deal"
HUN_italy_reduce_the_effects_of_the_great_depression_desc:0 "The collapse of the Wheat prices have taken a heavy toll on us. Luckily, we have the aid of our near and recent ally Italy secured, helping us out of this depression in mutual deals, further strengthening our bonds."
