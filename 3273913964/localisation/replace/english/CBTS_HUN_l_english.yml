HUN_cheat_the_treaties_1:0 "Cheat the Treaty"
HUN_cheat_the_treaties_1_desc:0 "The Trianon Treaty is a hindrance to our ambitions! If safeguarding the sovereignity over Hungary means having a strong and modern army, we have no choice but to circumvent some restrictions."
HUN_cheat_the_treaties_2_desc:0 "The Trianon Treaty is a hindrance to our ambitions! If safeguarding the sovereignity over Hungary means having a strong and modern army, we have no choice but to circumvent some restrictions."
HUN_diplomatic_visit_romania:0 "Sway Ministry Support in Bukarest"
HUN_diplomatic_visit_romania_desc:0 "Perhaps swaying some ministers into our favor could make them more inclined to agree with our demands..."
HUN_diplomatic_visit_czechoslovakia:0 "Sway Ministry Support in Prága"
HUN_diplomatic_visit_czechoslovakia_desc:0 "Perhaps swaying some ministers into our favor could make them more inclined to agree with our demands..."
HUN_diplomatic_visit_yugoslavia:0 "Sway Ministry Support in Belgrád"
HUN_diplomatic_visit_yugoslavia_desc:0 "Perhaps swaying some ministers into our favor could make them more inclined to agree with our demands..."
HUN_demand_rearmament_renegotiation:0 "Demand Rearmament Renegotiation"
HUN_demand_rearmament_renegotiation_desc:0 "The Entente has declined our request to end our restrictions! Laying some pressure on them will surely help them realize the errors of their decision."
HUN_arms_deals_decision_desc:0 "The treaty of Trianon imposed on us has been a constant reminder of the humiliation over our defeat in the Great War and the territories stolen from us. Our army has been severely limited in almost every way, and with our growing ambitions of reclaiming these territories we have to put an end to this unjust treaty!"
HUN_core_occupied_territory_decision:0 "Reintegrate Occupied Territory"
HUN_core_occupied_territory_decision_desc:0 "We now own a part of the hungarian-held 'majority' territories once held by us. \nIt now only remains to make it official so we can finally proclaim Greater Hungary."
