HUN_take_transcarpathia:0 "Take Transcarpathia"
take_transcarpathia:0 "Demand Transcarpathia"
HUN_gyor_program_decision_desc:0 "The Györ Program, proposed by Béla Imrédy requires a million pengős, and is estimated to seriously strengthen our economical and military base. To reach these goals we must divert all resources and heavily invest in an industrial and military rearmament over the course of five years. "
HUN_internal_politics:0 "Domestic Affairs"
HUN_internal_politics_desc:0 "Neighboring nations around us are vying to gain influence over us, and the fascist parties in our nation are growing stronger and seeking for power. We must walk a fine line between these factions to ensure our prosperity and sovereignity."
HUN_promote_anti_fascist_elements:0 "Promote Anti-Fascist Elements"
HUN_promote_anti_fascist_elements_desc:0 "The Far Right is an evil in our country and should not exist. Promoting anti-fascist ideas in the countryside and cities would help in gaining a more stable political climate."
HUN_cooperate_with_far_right_decision:0 "Cooperate with the the Far Right"
HUN_cooperate_with_far_right_decision_desc:0 "The Far Right have a strong base in Hungary. Perhaps cooperating with them could decrease the risk of civil unrest and lead to increased support from them."
HUN_strengthen_volksbund_decision:0 "Strengthen the Volksbund"
HUN_strengthen_volksbund_decision_desc:0 "The Volksbund, an organization for ethnic Germans in Hungary have potential for expansion. Hopefully in doing so would mean an increased support from both [GER.GetNameDef] and our German population."
HUN_join_axis_decision:0 "Join the Axis"
HUN_join_axis_decision_desc:0 "We have now signed the Tripartite Pact, and it is good time we decide whether or not we should formally join the Axis before we are coerced into it."
