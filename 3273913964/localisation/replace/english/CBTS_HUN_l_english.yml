#National Focuses
HUN_horthy_regency:0 "Continue the Horthy Regency"
HUN_self_sustaining_state:0 "The Self Sustaining State"
commission_of_industrial_experts:0 "Commission of Industrial Experts"
HUN_trade_deal_with_italy:0 "Trade Deal With Italy"
HUN_concessions_for_slovakia:0 "Concessions for Slovakia"
HUN_demand_slovakia:0 "Demand Slovakia"
HUN_urban_development:0 "Urban Development"
HUN_urban_development_desc:0 "The countryside is still much in the '19th century' in several regards. It is best that we invest in some infrastructure and highways to make cross-country travel more viable."
HUN_support_the_ustase:0 "Support the Ustaše"
HUN_support_the_ustase_desc:0 "The Ustaše, while an extremist group, is although searching for independence from Yugoslavia. Supporting the Ustaše could help weaken Yugoslavia and allowing us to press our demands easier."
HUN_improved_diesel_engines:0 "Improved Diesel Engines"
HUN_improved_diesel_engines_desc:0 "We are significantly behind in terms of motorized technology. By investing in improving diesel engines we could in return draw blueprints for more technologically advanced and heavier tanks."
HUN_reinvigoration:0 "Reinvigoration"
HUN_reinvigoration_desc:0 "Our industry is in a horrible state. We must best make due with the resources we have for now and invest in a long-term economic plan of consolidation."
HUN_secret_rearmament:0 "Secret Rearmament"
HUN_secret_rearmament_desc:0 "The restrictions imposed by us from the Trianon Treaty has prohibited from expanding the army in almost every way. However, the worlds political climate is getting more turbulant and our plans for Greater Hungary is becoming more serious. "
HUN_reindustrialization:0 "Reindustrialization"
HUN_reindustrialization_desc:0 "Our industrial base has dangerously decayed in recent years. We must make an effort to adopt new technologies to make up for lost ground."
HUN_appeal_to_industrial_experts:0 "Deflationary Politics"
HUN_appeal_to_industrial_experts_desc:0 "Our industry isn't improving at the rate it is. Perhaps reaching out to the major powers of Europe could help us reach an agreement in order to get us out of the Depression and into a more stable although weak economy"
HUN_employment_program:0 "Employment Program"
HUN_employment_program_desc:0 "A large percentage of Hungarians are unemployed. By creating government funded programs we can get people to move to the capital while giving them a job in factories."
HUN_increase_output:0 "Increase Output"
HUN_increase_output_desc:0 "The army requires more equipment and therefore the output from factories can perhaps be temporarily increased to keep up with the army."
HUN_industrial_planning:0 "Establish the National Council for Industry"
HUN_industrial_planning_desc:0 "Despite the need for more military industry, we must not neglect our civilian needs. An expansion of civilian industry is therefore in order."
HUN_expand_the_civilian_industry:0 "Expand the Civilian Industry"
HUN_expand_the_civilian_industry_desc:0 "Civilian industrial capacity must not be underestimated even when war looms over the world."
HUN_manfred_weiss_steel_production:0 "Manfred Weiss Steel Production"
HUN_manfred_weiss_steel_production_desc:0 "Manfred Weiss Steel Works has been an integral part of supplying the nation with steel since the last industrial expansion during the Great War. If we are to increase our army to a considerate size, a small investment in steel wouldn't be so bad."
HUN_expand_the_aluminum_works:0 "Expand the Aluminum Works"
HUN_expand_the_aluminum_works_desc:0 "The Aluminum works has played a major role in ensuring Hungary exports goods since the Trianon Treaty. Although it is already a massive industry, expanding it to meet our industrial and military demands could play an integral role in coming conflicts."
HUN_establish_the_nagyengel_oil_fields:0 "Establish the Nagylengyel Oil Fields"
HUN_establish_the_nagyengel_oil_fields_desc:0 "Oil is perhaps one of the most major factors of getting a richer country. By establishing the Nagyengel oil fields we could export much more oil than previously. Expanding it would also mean meeting our Military demands."
HUN_infrastructure_modernization:0 "Infrastructure Modernization"
HUN_infrastructure_modernization_desc:0 "Our infrastructure is in a horrible and unstrategical place since the Treaty of Trianon was signed. Without proper infrastructure we cannot pursue advanced construction or projects."
HUN_institute_for_industrial_techniques:0 "Institute for Industrial Techniques"
HUN_institute_for_industrial_techniques_desc:0 "Our industrial expansion and other recent advances might allow us to conduct more R&D in parallel."
HUN_war_games:0 "War Games"
HUN_war_games_desc:0 "By creating small 'war' scenarios for our army we could help significantly improve the quality of each individual soldier. We would also more easier find flaws in our doctrine and military structure."
HUN_secret_pilot_trainings:0 "Secret Pilot Trainings"
HUN_secret_pilot_trainings_desc:0 "Although the Treaty of Trianon forbade us from creating an airforce, we have managed to circumvent the Entente and disguised our pilot trainings in so called 'civilian flying clubs.' by having rigorous trainings we will have an expert air force in no time. "
HUN_manufacture_guns:0 "Manufacture Guns"
HUN_manufacture_guns_desc:0 "The limits for what equipment can be carried by infantry are constantly being pushed. We will focus on giving our troops the best tools available."
HUN_small_arms_research:0 "Small Arms Research"
HUN_small_arms_research_desc:0 "We will continue our efforts to ensure our infantry and support troops are armed with the best possible equipment of our time."
HUN_firepower_focus:0 "Firepower Focus"
HUN_firepower_focus_desc:0 "Artillery is key for improved effectiveness of our forces. We will develop modern artillery models so that they will have the best artillery support we can provide."
HUN_doctrine_renewal:0 "Doctrine Renewal"
HUN_doctrine_renewal_desc:0 "The military doctrines that defined ground combat in the Great War are outdated. We must put our greatest minds to the task of shaping the military thought of tomorrow."
HUN_westward_defenses:0 "Corvin Line"
HUN_westward_defenses_desc:0 "Defending against the central and western powers of europe in case of a military intervention will be an impossible battle on its own. Therefore a string of fortifications are deemed neccessary to defend our sovereignity."
HUN_balaton_line:0 "Balaton Redoubts"
HUN_balaton_line_desc:0 "Placing fortifications along the already strategic Balaton lake will leave the invading forces no choice but to launch a head-on attack."
HUN_dunantul_forward_defenses:0 "Dunántúl Fortifications"
HUN_dunantul_forward_defenses_desc:0 "Recent actions in europe have stressed the importance of building a stronger defense directly behind the Corvin Line."
HUN_eastward_defenses:0 "Hunyadi Forward Defenses"
HUN_eastward_defenses_desc:0 "The creation of a fortfication line in the east have long been a disscusion point. With recent developments, fortifying the already hard to penetrate mountains will prove very efficient."
HUN_expand_the_arpad_line:0 "Construct the Àrpád Line"
HUN_expand_the_arpad_line_desc:0 "Recent actions in europe have stressed the importance of building a stronger defense directly behind the Hunyadi Line."
HUN_the_arpad_line:0 "Székely Fortifications"
HUN_the_arpad_line_desc:0 "With the recent reincorporation of North Transylvania a plan to build forts across the Transylvanian mountains could provide us with a clear strategic and defensive advantage should we be attacked there."
HUN_cooperate_with_italy:0 "Cooperate With Italy"
HUN_cooperate_with_italy_desc:0 "To improve our secret air force, we must cooperate with Italy in hopes of secretly purchasing their airplanes. With the recent Rome Protocols seeking to improve relations between us and Italy and also Austria we could get a favorable deal from them."
HUN_purchase_the_cr32:0 "Purchase the CR.32"
HUN_purchase_the_cr32_desc:0 "Italy has approved of our plan. It now only remains to purchase and transfer the planes into our air force."
HUN_purchase_the_ca_101:0 "Purchase the Ca. 101"
HUN_purchase_the_ca_101_desc:0 "Italy has approved of our plan. It now only remains to purchase and transfer the planes into our air force."
HUN_improved_engines:0 "Improved Engines"
HUN_improved_engines_desc:0 "With the transfer of the planes we have managed to gain considerate information of modern engines. By investing more into engine research we could push our planes to go higher and faster."
HUN_italian_air_doctrines:0 "Italian Air Doctrines"
HUN_italian_air_doctrines_desc:0 "Further advances in aviation will be necessary to integrate our air force well with other branches of the military."
HUN_the_bled_agreement:0 "The Bled Agreement"
HUN_the_bled_agreement_desc:0 "Small-scale secret re-armament will not suffice. We must reach out to our neighbors and request redress of the treaty imposed on us after the Great War. Hungary has an equal right to armament."
HUN_open_the_military_budget:0 "Open the Military Budget"
HUN_open_the_military_budget_desc:0 "With the agreement between us and the Entente, we can finally openly expand our army however as we wish. A large investment now will surely help our military industry to expand faster later on."
HUN_announce_the_gyor_program:0 "Announce the Györ Program"
HUN_announce_the_gyor_program_desc:0 "Our army and industry is horrendously old, outdated and weak. We must significantly improve our industry. For this, a 5-year plan has been presented, the 'Györ Program'. It requires an investment of a billion pengos and will improve our industry and army in every way."
HUN_heavy_arms_factory:0 "Heavy Arms Factory"
HUN_heavy_arms_factory_desc:0 "If you can build tractors, you can build tanks! We must not allow our military production capacity to lag behind."
HUN_civilian_industrial_expansion:0 "Civilian Industrial Expansion"
HUN_civilian_industrial_expansion_desc:0 "Trying to adapt civilian factories to produce military equipment is inefficient. We should focus on preparing military production now."
HUN_expand_military_capabilities:0 "Expand Military Capabilities"
HUN_expand_military_capabilities_desc:0 "Continued efforts to expand our military factories are necessary to meet the demands for new equipment."
HUN_special_forces:0 "Special Forces"
HUN_special_forces_desc:0 "We have need of elite forces; mountain troops and paratroopers should be our priority."
HUN_huba_army_expansion:0 "Huba Army Plan"
HUN_huba_army_expansion_desc:0 "Our plan to improve our military capabilities also forces us to improve our doctrines. By expanding the Huba plan we can gain more ground and time to further develop our philosophy."
HUN_indigenous_tank_designs:0 "Indigenous Tank Designs"
HUN_indigenous_tank_designs_desc:0 "Applying what we have learned from mechanizing our infantry, we can improve our armored vehicles as well."
HUN_the_turan:0 "The Turán"
HUN_the_turan_desc:0 "Rethinking the possibilities of motorized infantry, we can push the limits of what vehicles can be constructed today."
HUN_rapid_corps:0 "Rapid Corps"
HUN_rapid_corps_desc:0 "Mobility and protection are crucial to get infantry into and out of the field safely. Focusing on these developments will allow us to take action quickly."
HUN_expand_the_levente_organization:0 "Expand the Levente Association"
HUN_expand_the_levente_organization_desc:0 "By expanding the paramilitary Levente Association we can help indoctrine and train people at a young age, therefore gaining reliable people for when they join the army."
HUN_ludovica_military_academy:0 "Ludovica Military Academy"
HUN_ludovica_military_academy_desc:0 "Despite the increasing possibilities of aerial and naval warfare, ground combat is still key in tomorrow's wars. With preparation, we can avoid reliving the hell of the trenches."
HUN_reveal_the_hungarian_air_force:0 "Reveal the Hungarian Air Force"
HUN_reveal_the_hungarian_air_force_desc:0 "With the Bled Agreement, we can finally reveal our previously secret air force, allowing us to freely expand without consequence. "
HUN_expand_the_fighter_fleet:0 "Expand the Fighter Fleet"
HUN_expand_the_fighter_fleet_desc:0 "We have not seen that last of dogfights in the Great War. Keeping ahead in the development of fighter planes will give us an edge in the future."
HUN_close_air_support:0 "Close Air Support"
HUN_close_air_support_desc:0 "A modern army needs support from vehicles not only on the ground, but also in the air."
HUN_bomber_renewal:0 "Bomber Renewal"
HUN_bomber_renewal_desc:0 "When people of the future speak of the horror to today's wars, fire raining from the skies will prominently feature. We will do our best to ensure those stories are told by our enemies."
HUN_defend_our_homeland:0 "Defend Our Homeland"
HUN_defend_our_homeland_desc:0 "To have a strong army also means having strong infrastructure and defensive capabilities. By improving our home defenses we could become a formidable foe in the region."
HUN_expand_oil_reserves:0 "Expand Oil Reserves"
HUN_expand_oil_reserves_desc:0 "We must expand our oil reserves incase of war. We should be looking at building several oil reserves within a short time, thereby also improving our fuel gain effectiveness."
HUN_strategic_bomber_defense:0 "Strategic Bomber Defense"
HUN_strategic_bomber_defense_desc:0 "Our defense against bombers are almost non existent. Therefore it is absolutely imperative that we seek on improving our anti-aircraft capabilities."
HUN_expand_the_airbases:0 "Expand the Airbases"
HUN_expand_the_airbases_desc:0 "In any war with an enemy, the Hungrian Air Force will prove the key to victory. First, we must ensure that our airbases can support our rearmament plans!"
HUN_naval_rearmament:0 "Naval Rearmament"
HUN_naval_rearmament_desc:0 "The expansion of our newfound navy should be our first priority. Assign all available resources to new Dockyards and research into light surface ships."
HUN_trade_interdiction:0 "Trade Interdiction"
HUN_trade_interdiction_desc:0 "Reinventing naval warfare to account for the advances in submarine technology will allow us to strike efficiently against enemy convoys."
HUN_undersea_fleet:0 "Undersea Fleet"
HUN_undersea_fleet_desc:0 "Submarine warfare is the most exciting naval development since the invention of the torpedo boat. We would do well to not just protect against submarines, but also use them against enemy shipping."
HUN_surface_raiding_fleet:0 "Surface Raiding Fleet"
HUN_surface_raiding_fleet_desc:0 "The nation with the most battleships will rule the oceans. Battleships and carriers represent the old and the new in naval superiority."
HUN_screening_ship_designs:0 "Screening Ship Designs"
HUN_screening_ship_designs_desc:0 "Before making forays into advanced battleship research, the smaller cruisers are in need of replacement."
HUN_base_strike:0 "Base Strike"
HUN_base_strike_desc:0 "Adapting our naval doctrines to accommodate large ships and ensuring the safety of our trade convoys will teach us much about what sort of ships we need."
HUN_destroyer_program:0 "Destroyer Program"
HUN_destroyer_program_desc:0 "Studying the design and strategic use of submarines, we have also learned how to counter those strategies. Destroyers will be crucial for this."
HUN_coastal_patrol_cruisers:0 "Coastal Patrol Cruisers"
HUN_coastal_patrol_cruisers_desc:0 "Modifying our ships to better perform in shallow water will surely help us defend our coasts from any enemy trying to reach our mainland."
HUN_revise_the_national_work_plan:0 "Revise the National Work Plan"
HUN_revise_the_national_work_plan_desc:0 "The National work plan is trying too hard to appease and cooperate with Germany. It is better to focus on our already current allies and looking to improve our situation from there."
HUN_ban_far_right_organizations:0 "Ban Far Right Organizations"
HUN_ban_far_right_organizations_desc:0 "The extremist far-right Arrow Cross Party is a dangerous force in our country. To prevent further spread of their rhetoric we must ensure they aren't allowed to remain."
HUN_seek_for_a_singleparty_system:0 "Seek for a Single-Party System"
HUN_seek_for_a_singleparty_system_desc:0 "We must seek for a single-party system to further consolidate our position."
HUN_continue_the_national_work_plan:0 "Continue the National Work Plan"
HUN_continue_the_national_work_plan_desc:0 "The National Work Plan that Gyula Gömbös presented is showing interesting results. It is best if we continue a steady pace of development both political and economical to get us out of this depression and drift into a more assertive government."
HUN_heroism_faith_unity:0 "Heroism, Faith, Unity"
HUN_heroism_faith_unity_desc:0 "Since the Treaty of Trianon, our nation has been in a constant state of depression. By focusing on old heroes from the past we could motivate them to strive for a stronger and better future."
HUN_mission_to_germany:0 "Mission to Germany"
HUN_mission_to_germany_desc:0 "We must cooperate with Germany in order to improve our economy, as a part of the National Work Plan. It is imperative to gain good relations with them before it is possibly too late."
HUN_limit_freedom_of_press:0 "Limit Freedom of Press"
HUN_limit_freedom_of_press_desc:0 "While the press being allowed to comment on what they want is a good thing, forbidding them to criticise the state would help further consolidate our power."
HUN_reintroduce_limited_conscription:0 "Reintroduce Limited Conscription"
HUN_reintroduce_limited_conscription_desc:0 "With the Treaty of Trianon being a thing of the past, it would be a good time now to reintroduce conscription as a plan of our military expansions."
HUN_form_the_volksbund:0 "Form the Volksbund"
HUN_form_the_volksbund_desc:0 "Pressure from Germany is forcing us to unite the German minority in Hungary. Given the economical aid they have given us it is only fair."
HUN_trade_deal_with_germany:0 "Trade Deal With Germany"
HUN_trade_deal_with_germany_desc:0 "With Adolf Hitler having gained power, a plan devised by Gyula Gömbös to improve trade relations should be implemented. This will surely help us gain the strong industrial base that we need."
HUN_strengthen_government:0 "Strengthen Government"
HUN_strengthen_government_desc:0 "As a part of our National Work Plan, we must strengthen our governmental position to help push our policies further."
HUN_heavy_industry_investments:0 "Heavy Industry Investments"
HUN_heavy_industry_investments_desc:0 "We have struck several deals with Germany. By having them invest in our industry we can quickly become strong again. This investment however means that Germany will be able to press further demands over us, which we will be forced to obliged with."
HUN_industrial_integration:0 "Industrial Integration"
HUN_industrial_integration_desc:0 "Continued efforts to expand our military factories are necessary to meet the demands for new equipment."
HUN_the_strive_for_autarky:0 "The Strive for Autarky"
HUN_the_strive_for_autarky_desc:0 "We are far too dependent on German industry and trade. We should look to improve our own economical situation by ourselves."
HUN_support_austria:0 "Support Austria"
HUN_support_austria_desc:0 ""
HUN_mission_to_italy:0 "Mission to Italy"
HUN_mission_to_italy_desc:0 ""
HUN_closer_economic_relations:0 "Closer Economic Relations"
HUN_closer_economic_relations_desc:0 ""
HUN_support_the_spanish_cause:0 "Support the Spanish Cause"
HUN_support_the_spanish_cause_desc:0 ""
HUN_work_program:0 "Work Program"
HUN_work_program_desc:0 ""
HUN_dreams_of_a_greater_hungary:0 "Dreams of a Greater Hungary"
HUN_dreams_of_a_greater_hungary_desc:0 ""
HUN_railroad_renewal_program:0 "Railroad Renewal Program"
HUN_railroad_renewal_program_desc:0 ""
HUN_prospect_for_oil:0 "Prospect for Oil"
HUN_prospect_for_oil_desc:0 ""
HUN_secure_italian_support:0 "Secure Italian Support"
HUN_secure_italian_support_desc:0 ""
HUN_burgenland_referendum:0 "Burgenland Referendum"
HUN_burgenland_referendum_desc:0 ""
HUN_renounce_the_treaty_of_trianon:0 "Renounce the Treaty of Trianon"
HUN_renounce_the_treaty_of_trianon_desc:0 "This injustice enforced upon us, ripping away two thirds of the nation and sixty percent of the population has reduced our once great nation into a puddle of what it once was! This cannot stand, we must renounce trianon and seek to regain our lost territories."
HUN_assert_our_claims:0 "Assert our Claims"
HUN_assert_our_claims_desc:0 "With the trianon renounced, it is important to remind our neighboring nations of what land they actually own."
HUN_revive_the_ragged_guards:0 "Revive the Ragged Guards"
HUN_revive_the_ragged_guards_desc:0 "With the Sudetenland incorporated into Germany, it is high time for us to start to seriously expand our territory. By reestablishing the Ragged Guards we may launch incursions into Czechoslovakia."
HUN_incursions_into_slovakia:0 "Incursions into Slovakia"
HUN_incursions_into_slovakia_desc:0 "With the newly created state of Slovakia, it is time for us to reclaim what was once ours. Slovakia is weak and unstable, by merely presenting our land changes proposal, we could hopefully bring them into sense to just hand the territories over to us."
HUN_join_the_tripartite_pact:0 "Join the Tripartite Pact"
HUN_join_the_tripartite_pact_desc:0 "Despite our efforts to reincorporate as much territory as possible while remaining neutral, recent demands by Germany has outweighed the benefits of staying neutral. It is instead better to just join the Tripartite Pact."
HUN_expand_arms_factories:0 "Expand Arms Factories"
HUN_expand_arms_factories_desc:0 "Trying to adapt civilian factories to produce military equipment is inefficient. We should focus on preparing military production now."
HUN_increased_arms_production:0 "Increased Arms Production"
HUN_increased_arms_production_desc:0 "Continued efforts to expand our military factories are necessary to meet the demands for new equipment."
HUN_license_german_panzers:0 "License German Panzers"
HUN_license_german_panzers_desc:0 "By licensing German tanks, we could gain a much stronger tank army at a much smaller cost. It is therefore important to ensure we gain tanks from our strong ally."
HUN_demand_szekler_referendum:0 "Demand Székler Referendum"
HUN_demand_szekler_referendum_desc:0 "The Hungarian minority in Transylvania will surely want to be a part of hungary again. By demanding a referendum we could hopefully put the Romanians to their senses and ensure that we gain Erdély."
HUN_szent_lszl_airborne_battalion:0 "Szent László Airborne Battalion"
HUN_szent_lszl_airborne_battalion_desc:0 "Infantry landed by air assault will give us the capability to react quickly to any unexpected threat or tactical opportunity."
HUN_jointresearch_company:0 "Joint-Research Company"
HUN_jointresearch_company_desc:0 "The best means of developing new technology is through cooperation with our allies. By bringing together the brightest minds of all our nations, we will attain the best results."
HUN_the_war_in_the_east:0 "The War in the East"
HUN_the_war_in_the_east_desc:0 "The Germans have begun Operation Barbarossa. It is now important to effectively mobilize our nation and army to ensure the survival of our nation."
HUN_defensive_fortifications:0 "Defensive Fortifications"
HUN_defensive_fortifications_desc:0 "Small mobile forces will not be able to defend our nation in the case of attack. We must form an impenetrable front-line, and develop new doctrines to increase the effectiveness of such an approach."
HUN_theresian_military_academy:0 "Theresian Military Academy"
HUN_theresian_military_academy_desc:0 ""
HUN_light_industry:0 "Light Industry"
HUN_light_industry_desc:0 ""
HUN_austrian_military_cooperation:0 "Austrian Military Cooperation"
HUN_austrian_military_cooperation_desc:0 ""
HUN_erdely_mountaineer_regiment:0 "Erdély Mountaineer Regiment"
HUN_erdely_mountaineer_regiment_desc:0 "With Transylvania once again in our possession, it is wise to have a specialised mountain-trained division in the area."
HUN_expand_the_huba_plan:0 "Expand the Huba Plan"
HUN_expand_the_huba_plan_desc:0 ""
HUN_expand_the_steel_industry:0 "Expand the Steel Industry"
HUN_expand_the_steel_industry_desc:0 "As our army grows, our need for steel grows. It is therefore important that we seek to further expand our Steel Works."
HUN_closer_italian_cooperation:0 "Closer Italian Cooperation"
HUN_closer_italian_cooperation_desc:0 ""
HUN_operation_25:0 "Operation 25"
HUN_operation_25_desc:0 "With Germany at war with Yugoslavia, it is wise to remind them of our territorial claims in the region."
HUN_the_me109:0 "The Me-109"
HUN_the_me109_desc:0 "Nowhere is technological advances more rapid than in aerial warfare. Aviation is a field any modern nation must master."
HUN_research_grants:0 "Research Grants"
HUN_research_grants_desc:0 ""
HUN_tungsten_mining:0 "Tungsten Mining"
HUN_tungsten_mining_desc:0 ""
HUN_weiss_wm21:0 "Weiss WM-21"
HUN_weiss_wm21_desc:0 ""
HUN_purchase_tankettes:0 "Purchase Tankettes"
HUN_purchase_tankettes_desc:0 "Italy has agreed on a license of their tankettes. It now only remains to put it in motion."

# National Spirits / Ideas
HUN_treaty_of_trianon:0 "Treaty of Trianon"
rising_fascist_elements:0 "Rising Fascist Elements"
rising_fascist_elements_desc:0 "Thirteen years have passed since the Treaty of Trianon was signed. Since then Hungary has been in an unstable and relatively tumultuous state. Such affairs have led people to join the radical right, espousing similar rhetoric of the Nazis in Germany."
HUN_treaty_of_trianon_desc:0 "[trianon_desc]"
HUN_effects_of_the_great_depression:0 "The Great Depression"
HUN_effects_of_the_great_depression_desc:0 "The Great Depression have struck all parts of our society. We can no longer sell our goods, afford to keep our factories running and nor do we have any foreign loans left to use. The prices on the wheat exports we relied on have plummeted, bankrupting our economy and the large agrarian population."
HUN_hungarian_irredentism:0 "Revisionist Ideas"
HUN_hungarian_irredentism_desc:0 "From the Germans, Bulgarians and the Turks, they took merely but one or two of their fingers, but from the Hungarians, his hands, and his feet."
