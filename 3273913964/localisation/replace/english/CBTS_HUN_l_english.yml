HUN_pay_back_debt_to_the_lon_category:0 "Debt Repayments to the League of Nations"
HUN_pay_back_debt_to_the_lon_category_desc:1 "After the Great War, [HUN.GetNameDef] had found itself in hyperinflation and with a meager industry. During István Bethlen's years of consolidation, these issues were somewhat alleviated by reaching out and taking loans from the League of Nations, and other creditors. \n\nSo much loans were taken, infact, where there was even uncertainty to how much money was owed. \n\nTotal §YDebt§! Paid: [ROOT.GetDebtPercentagePaidTotal]\n"
HUN_repay_debt_decision:0 "Repay debt to the League of Nations"
HUN_reestablish_soviet_diplomacy:0 "Establish Diplomatic Relations with [SOV.GetNameDef]"
HUN_huba_plan_decision:0 "The Huba Plan"
HUN_huba_plan_decision_desc:0 "With the restrictions of the Trianon Treaty out of the way we can at last begin the expansion and modernization of The Royal Hungarian Army. This program has been named the Huba Plan, and envisions 26 Infantry Divisions, along with a motorized Rapid Corps, the Gyorshadtest. \n\nIn order to realize this goal we'll also have to set up separate goals for the Gyorshadtest named Botond I & Turán I Plan respectively."
HUN_elod_plan_decision:0 "The Elöd Army Plan"
HUN_elod_plan_decision_desc:0 "The slightly ambitious Elöd Plan calls for 21 modern Infantry Divisions to be raised, as well as modernization of our equipment. The majority of our equipment comprising of obsolete World War One weapons is an immediate priority, and the establishment of a mobile corps is vital aswell."
HUN_botond_plan:0 "Botond I Plan"
HUN_botond_plan_desc:0 "Our woefully underequipped Rapid Corps must see immediate reinforcement of equipment if we are to play a role in the modern way of warfare."
HUN_turan_plan:0 "Turán I Plan"
HUN_turan_plan_desc:0 "Our woefully underequipped Rapid Corps must see immediate reinforcement of equipment if we are to play a role in the modern way of warfare."
