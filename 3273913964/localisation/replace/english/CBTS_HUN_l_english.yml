#Country Events
hungarian_border_conflict.1.t:0 "Hungarian Provocation at our border"
hungarian_border_conflict.1.desc:0 "After the creation of our state, the Hungarian government have grown more agitated over us, stating that they have the rightful claim over Carpathian Ruthenia. Not only that, several border guards have been beaten or been in small fights between Hungarian soldiers. \n\nWe have lodged a formal diplomatic protest, but the Hungarian ambassador maintains that they did nothing wrong, and that we were at fault. \n\nWe fear that Hungary may well soon annex the Carpathian Ruthenia under approval of the German Reich."
hungarian_border_conflict.1.a:0 "Unacceptable."
hungarian_border_conflict.2.t:0 "Kárpátalja Reclaimed"
hungarian_border_conflict.2.desc:0 "Following the border skirmishes in Kárpátalja, Slovakian forces have reportedly retreated from the area. Hungarian units have already begun occupying strategic locations and cities, and have begun clamping down resistance from Ukrainan nationalists. \n\nWe now share a common border with Poland yet again."
hungarian_border_conflict.2.a:0 "This is cause for celebration!"
hungarian_border_conflict.2.b:0 "There's nothing we can do now."
hungarian_border_conflict.3.t:0 "Hungarian Defeat in Kárpátalja"
hungarian_border_conflict.3.desc:0 "Following the border skirmishes in Kárpátalja, the Slovakian government have requested a cease-fire. \n\nSeveral Hungarian skirmishes resulted in an overwhelming number of casualties, raising concern in the Royal Hungarian Army about the capabilities of their forces. \n\nHowever, since our planned invasion of Kárpátalja was already supported by the German Reich, the Slovakian State have been pressured into surrendering Kárpátalja."
hungarian_border_conflict.3.a:0 "Mission successful?"
hungarian_border_conflict.3.b:0 "This is outrageous, it's unfair!"
hungarian_border_conflict.5.t:0 "Escalation in Kárpátalja"
hungarian_border_conflict.5.desc:0 "Fighting continuse between Hungarian and Slovakian forces in Kárpátalja. In an effort to break the deadlock, Hungarian forces in other sectors have also begun engaging Slovakian forces. Now, talks exists over wether or not war should be declared."
hungarian_border_conflict.5.a:0 "We must hold the line."
CBTS_hungary.1.t:0 "Hungary Demands the Right to Rearm"
CBTS_hungary.1.desc:0 "The Government of Horthy has used the Salonika Agreement, which allowed Bulgaria to rearm, and our recent liberal policies regarding the Székely as an opportunity to discuss a possibility for the revision of the Treaty of Trianon. Seeing as our relations with Hungary are growing friendlier, and the otherwise worsening political situation in Europe, a stronger ally in Europe would be benificial towards us. \n\nHungary has already sent diplomats to discuss their right for rearmament."
CBTS_hungary.1.a:0 "It is their right."
CBTS_hungary.1.b:0 "They´ll be destabilizing Europe!"
CBTS_hungary.2.t:0 "Hungary Revisioned Treaty of Trianon"
CBTS_hungary.2.desc:0 "After disscusions with the government of Romania on the revision of the Treaty of Trianon, a treaty has been signed between Romania and Hungary formally allowing Hungary to rearm, which also includes the construction of tanks and airplanes. \n\nDespite the general knowledge of Hungary's secret rearmament which we turned a blind eye to, this means that Hungary could once again become a poseable threat in the region."
CBTS_hungary.2.a:0 "The gauntlet has been thrown."
CBTS_hungary.3.t:0 "Bled Conference - Success"
CBTS_hungary.3.desc:0 "After disscusions with the Romanian Government over the revision of the Treaty of Trianon, we have managed to convince them to loosen the restrictions. We are now free to rearm with only limited."
CBTS_hungary.3.a:0 "The Little Entente is crumbling..."
CBTS_hungary.4.t:0 "Bled Conference - Failure"
CBTS_hungary.4.desc:0 "After several days of disscusions with the countries of the Little Entente, not much progress has been made. They have decided to stand firm on denying our right to rearm, stating that they don't need another war in Europe. \n\nSo far there is little we can do to protest this unjustice, other than ignoring the treaty - at the risk of intervention, which is what internal disscusion has been leaning towards."
CBTS_hungary.4.a:0 "Fools."
CBTS_hungary.4.b:0 "We cannot stand this unjustice!"
CBTS_hungary.5.t:0 "Hungary Seeks to Purchase Fighters"
CBTS_hungary.5.desc:0 "A Hungarian delegation has arrived in secrecy to Rome to disscus a possible purchase of some of our planes. Should we accept, we would receive a sizable sum and a potentially stronger ally in Europe, however the risk of the Entente discovering this could lead to being further alienated from France."
CBTS_hungary.5.a:0 "This could be benificial to us both"
CBTS_hungary.5.b:0 "Not this time!"
CBTS_hungary.6.t:0 "The Györ Program"
CBTS_hungary.6.desc:0 "With the revision of the Treaty of Trianon, we are now free to rebuild our army as we wish. With this we however arrive to several problems; our Royal Hungarian Army is horrendously outdated and in grave need for modernization and reinforcements, and our economical situation is also severely hampering our ability to expand, meaning a serious effort is needed to achieve our plans."
CBTS_hungary.6.a:0 "This will be worth it."
CBTS_hungary.6.b:0 "We cannot afford this!"
CBTS_hungary.7.t:0 "Romania keeps quiet"
CBTS_hungary.7.desc:0 "No opposition has been made towards our decision to renounce the Treaty of Trianon. Romanian officials have refused to comment on the situation which means we are seemingly free to remove the restrictions without any foreign opposition. "
CBTS_hungary.7.a:0 "Just as we thought."
CBTS_hungary.8.t:0 "Hungary renounces Trianon"
CBTS_hungary.8.desc:0 "An offical from Hungary has informed us over their decision to renounce the trianon treaty. Stating that the treaty was signed at gun point, it was never legally binding. They have even gone as far as to mention military intervention if we stand fast on keeping the treaty. \n\nWhile many favour a strong reply back, public support for war is low and would be met with internal conflicts. "
CBTS_hungary.8.a:0 "'Held at gunpoint', how ironic."
CBTS_hungary.9.t:0 "Revival of the Ragged Guards"
CBTS_hungary.9.desc:0 "The Ragged Guards, a semi-independent unit are to be reformed. \n\nCurrent Prime Minister Pál Teleki has met with German officials to agree on the plan for the final dismemberment of Czechoslovakia and have seen fit to reform and redeploy the Ragged Guards seeing as we now have a chance to reclaim Transcarpathia from the newly formed puppet state Slovakia. \n\nPreparations to annex the state are already underway."
CBTS_hungary.9.a:0 "We will unite the Magyars."
CBTS_hungary.10.t:0 "Regaining Lost Territories I: Slovakia"
CBTS_hungary.10.desc:0 "Disscusion have been intensifying between us and Slovakia following the First Vienna Award and Munich Conference. While Slovakia remains steadfast on keeping Transcarpathia, stating that the Hungarian population there is only a meager 12.7%, the Teleki government insist on establishing a common border with Poland, by force if necessary. \n\nWhile a war against Slovakia would undoubtly lead to a Hungarian victory, Hitler has also approved of our plans, meaning Transcarpathia could be ours without bloodshed."
CBTS_hungary.10.a:0 "We must establish a common border."
CBTS_hungary.11.t:0 "Kárpátalja Reclaimed"
CBTS_hungary.11.desc:0 "Following some border skirmishes in Kárpátalja, Slovakian forces have reportedly retreated from the area. Hungarian units have already begun occupying strategic locations and cities, and have begun clamping down resistance from Ukrainan nationalists. \n\nWe now share a common border with Poland yet again."
CBTS_hungary.11.a:0 "This is cause for celebration!"
CBTS_hungary.12.t:0 "Hungary Demands Transcarpathia"
CBTS_hungary.12.desc:0 "A Hungarian delegation has arrived in Bratislava to discuss the ongoing situation regarding Transcarpathia. Miklós Horthy states that if we do not agree with their demands, they will have to use military means to achieve their goal. \n\nHitler is backing Hungary in this, meaning we will have no chance if war is to break out."
CBTS_hungary.12.a:0 "We have no choice"
CBTS_hungary.13.t:0 "Hungary demands Transylvania"
CBTS_hungary.13.desc:0 "The Government of Horthy has sent us an ultimatum disguised as a referendum, where they demanded we ceede Transylvania, citing military intervention if we refuse."
CBTS_hungary.13.a:0 "It's not worth more bloodshed."
CBTS_hungary.13.b:0 "Let´s call their bluff."
CBTS_hungary.14.t:0 "Regaining Lost Territories II: Romania"
CBTS_hungary.14.desc:0 "The Romanians have decided to give up their territory rather than to put up a fight. We have now administration over North Transylvania"
CBTS_hungary.14.a:0 "It is Hungarian land."
CBTS_hungary.15.t:0 "Transylvania - Romania stands firm."
CBTS_hungary.15.desc:0 "The Romanians have foolishly decided to not hand over Transylvania. They have instead decided to call our 'bluff' and reportedly proclaimed 'Bring it on'. \n\nWe should begin preparing our defenses"
CBTS_hungary.15.a:0 "Bring it on, then."
CBTS_hungary.16.t:0 "Hungary Asks for Yugoslavian Territory"
CBTS_hungary.16.desc:0 "Seeing as we have now taken control of Yugoslavia, Hungary has asked for some territories they have claimed - mainly territories with a large Hungarian minority. \n\nWe have already managed to largely sway the Hungarians into our influence, meaning handing over the territories to them could mean we can pressure them later on to give to our demands."
CBTS_hungary.16.a:0 "Jawohl."
CBTS_hungary.16.b:0 "Preposterous!"
CBTS_hungary.17.t:0 "Regaining Lost Territories III: Yugoslavia"
CBTS_hungary.17.desc:0 "The Germans have luckily decided to agree with our proposal. We have now been given administration of several states in Yugoslavia, notably the Vojvodina."
CBTS_hungary.17.a:0 "It is our land."
CBTS_hungary.18.t:0 "Germany denies proposal"
CBTS_hungary.18.desc:0 "The German administration has irritably enough decided to deny our request to gain control of several Yugoslavia-held territories."
CBTS_hungary.18.a:0 "Preposterous!"
CBTS_hungary.19.t:0 "Germany Approves."
CBTS_hungary.19.desc:0 "Germany has approved of our plans to incorporate the Transcarpathia. We are now free to launch a skirmish into the newly created state of Slovakia."
CBTS_hungary.19.a:0 "Restoring the lands of the Crown of Saint Stephen one by one..."
CBTS_hungary.20.t:0 "Purchase Planes - Success!"
CBTS_hungary.20.desc:0 "Our delegation in Italy has reached an agreement with Italian officials. They have agreed to our proposed purchase of 64 CR-32 fighters and also 64 CA-101 tactical bombers, under top secrecy. \n\nPreparations to send the planes are underway."
CBTS_hungary.20.a:0 "Good."
CBTS_hungary.21.t:0 "Purchase Fighters - Failed"
CBTS_hungary.21.desc:0 "Our delegation in Italy failed to reach an agreement with Italian officials. They denied it, citing that the purchase would go against the Treaty of Trianon."
CBTS_hungary.21.a:0 "What about the Rome Protocols?"
CBTS_hungary.22.t:0 "The End of the Treaty"
CBTS_hungary.22.desc:0 "With all the supporters of the Trianon Treaty gone, it is no longer valid. We can now renounce the Treaty without anyone to stop us!"
CBTS_hungary.22.a:0 "Excellent!"
CBTS_hungary.23.t:0 "Gyula Gömbös Dies in Office"
CBTS_hungary.23.desc:0 "Our Prime Minister Gyula Gömbös sadly passed away silently this night after having a long fight against cancer. He passed away in Munich and will soon be transported back to Hungary where he will have a funeral attended by hundred and thousands of Hungarians, to then be buried in Kerepesi Cemetery. \n\nWith his untimely death however, Hungary has no prime minister. Which means that..."
CBTS_hungary.23.a:0 "...Kálmán Darányi will take his place."
CBTS_hungary.23.b:0 "...Bela Imredy will take his place."
CBTS_hungary.24.t:0 "Interwar Hungary"
CBTS_hungary.24.desc:0 "The Kingdom of Hungary (1920-1946), was led by the Vice-Admiral Miklós Horthy.\n\nDuring the span of a year, Hungary was led by the communist Bela Kun. Not soon after, Hungary invaded Czechoslovakia and Romania, only for Hungary to eventually lose and be occupied by Romania.\n\nFollowing the small-scaled war, Hungary had to sign the Treaty of Trianon, forcing it to surrender over two thirds of its territories, sixty percent of her population and left over 3 million ethnic Hungarians outside of Hungary. \n\nHungary was then to be 'liberated' by Horthy who rode in to Budapest in his white horse and then established his headquarter at Gellért Hotel. He was then chosen as a regent of the country, beginning a new era of Hungary most commonly referred to as 'the Horthy Era'.\n\nThe main objectives of Horthy's government was to strengthen christian-nationalist foundations in Hungary, stop the spread of Bolshevism and regain the territories lost in the Treaty of Trianon. The Trianon treaty heavily affected Hungary, and to some extent, still does. Not only did the treaty cause irredentism, practically the whole of their foreign policy was centered around regaining the territories that were taken from them."
CBTS_hungary.24.a:0 "Interesting"
CBTS_hungary.25.t:0 "Treaty of Eternal Friendship with Yugoslavia"
CBTS_hungary.25.desc:0 "Our current Prime Minister Pal Teleki have come to an agreement with the current government in Yugoslavia over a non-aggression pact between the two countries. Hoping for a continued cooperation between the two countries, this could mean a lot for the two of us in the near future."
CBTS_hungary.25.a:0 "A Wonderful Idea!"
CBTS_hungary.25.b:0 "Are they mad?"
CBTS_hungary.26.t:0 "Treaty of Eternal Friendship Broken"
CBTS_hungary.26.desc:0 "Following our attack on Yugoslavia, and our non-aggression pact with them, our Prime Minister Pal Teleki have decided to commit suicide due to us breaking the pact. He was found the next morning with a suicide note in his hand saying; 'We broke our word, – out of cowardice, the nation feels it, and we have thrown away its honor. We have allied ourselves to scoundrels, we will become body-snatchers! A nation of trash. I did not hold you back. I am guilty'"
CBTS_hungary.26.a:0 "A sacrifice, neccessary."
CBTS_hungary.27.t:0 "Fascists Demonstrate"
CBTS_hungary.27.desc:0 "An organized protest, chanting fascist slogans, was conducted today in our capital Budapest. Crowds were chanting for the whole return of the pre-trianon border, and for the resignation of several politicians.\n\nSo far, no actions have been made, and the protests seem to be relatively calm. "
CBTS_hungary.27.a:0 "People have the right to their own opinion."
CBTS_hungary.27.b:0 "Nazism is the road to destruction."
CBTS_hungary.32.t:0 "Germany Demands Military Access"
CBTS_hungary.32.desc:0 "Following the German declaration of war on Poland over the Danzig area, the Wehrmacht demands to attack southern poland via our newly-reoccupied territory of Subcarpathia.\n\nWill we accept this demand, we fear we might end up in a war against Britain and France."
CBTS_hungary.32.a:0 "We cannot ally ourselves with the devil!"
CBTS_hungary.32.b:0 "What choice do we have?"
CBTS_hungary.33.t:0 "Germany Demands Participation"
CBTS_hungary.33.desc:0 "Our ambassador in Germany has informed us that Hitler wishes to deploy Wehrmacht units in Hungary for the invasion of Yugoslavia. Not only that, they wish for us to participate in the invasion.\n\nStating the support they have given us in terms of territorial and economical help, they say that we owe them this, and promises additional territories as a reward. We fear that refusing this demand might lead to the end of the Kingdom of Hungary."
CBTS_hungary.33.a:0 "We cannot ally ourselves with Scoundrels!"
CBTS_hungary.33.b:0 "What choice do we have?"
CBTS_hungary.34.t:0 "Growing Fascist Influence"
CBTS_hungary.34.desc:0 "More and more are crowds gathering on the street chanting several slogans known to be associated with the Arrow Cross Party. Why and what for they are protesting remain relatively unclear, however they are gaining more and more seats within the parliament and could soon become a strong contender to the NEP."
CBTS_hungary.34.a:0 "We'll watch the situation closely."
CBTS_hungary.34.b:0 "Arrest them."
CBTS_hungary.35.t:0 "Kálmán Darányi Resigns"
CBTS_hungary.35.desc:0 "Prime Minister Kálmán Darányi has resigned after receiving criticism from several politicans and statespeople, notably Miklós Horthy. \n\nThe cause for the criticism has been numerous; appointing pro-German politicans to his cabinet, actively seeking to cooperate with the Nazi-Regime, attempting to unite right-wing extremist forces and allowing the extremist Arrow Cross Party to run for parliament, among others. \n\nRightfully these actions have worried worried members of the parliament and also caused Horthy to express his discontent, prompting Darányi to resign. Béla Imrédy will instead take his position."
CBTS_hungary.35.a:0 "He would've led us to death."
CBTS_hungary.36.t:0 "Béla Imrédy Resigns"
CBTS_hungary.36.desc:0 "Béla Imrédy, the successor to former prime minister Kálmán Darányi, has resigned over accusations of jewish heritage. \n\nHaving made further attempts to appease the German Reich, and limiting the freedom of minorities in the country, several opponents to him presented evidence of Imrédy having jewish heritage to Horthy. When confronted by this, Imrédy was incapable of disproving these accusations, thus forced to resign. \n\nFormer prime minister Pal Teleki will instead once again step up as the Head of Government in his place."
CBTS_hungary.36.a:0 "How ironic."
CBTS_hungary.37.t:0 "Growing Discontent amongst Kálmán Darányi"
CBTS_hungary.37.desc:0 "Recently there has been growing concern over the current prime minister Kálmán Darányi. \n\nConcerns such as a growing cooperation with Adolf Hitler and the extremely controversial Hungarian far-right Arrow Cross Party has caused several conservative politicans within the government to watch these steps closely in distrust. The question however is: should we force him to step down as prime minister, avoiding us to grow even further from the Western Powers, or continue our growing cooperation with the German Reich, hopefully leading to a revision of Trianon?"
CBTS_hungary.37.a:0 "We'll watch the situation closely."
CBTS_hungary.37.b:0 "We shouldn't upset the already fragile situation."
CBTS_hungary.38.t:0 "Hungary seeks to join the Tripartite Pact"
CBTS_hungary.38.desc:0 "Despite Hungary's effort to remain neutral throughout this conflict, the amount of territory we have given Hungary now makes it possible to 'request' Hungary to join the Tripartite Pact. \n\nWhile they probably won't officially join any ongoing ongoing wars, we can pressure them to eventually join, further strengthening our alliance."
CBTS_hungary.38.a:0 "An excellent idea!"
CBTS_hungary.38.b:0 "We are better off without them."
CBTS_hungary.39.t:0 "Tripartite Pact - Failed"
CBTS_hungary.39.desc:0 "Disscussions towards joining the Tripartite Pact have broken down. \n\nThis can only mean they are planning an attack on us..."
CBTS_hungary.39.a:0 "We'll show them!"
CBTS_hungary.40.t:0 "Tripartite Pact Signed"
CBTS_hungary.40.desc:0 "Despite our efforts to unilaterally incorporate as much territory lost to the Trianon Treaty as possible while remaining neutral, our territorial procurements and economical help that we gained from the German government has alas forced us to comply with several of Germany's requests, mainly us entering the Tripartite Pact. \n\nWhile we may not immediately have to enter in to a state of war, time is running out, and we might eventually have to."
CBTS_hungary.40.a:0 "This is going too far!"
CBTS_hungary.41.t:0 "Regaining Lost Territories II: Romania"
CBTS_hungary.41.desc:0 "After a breakdown in disscusions between us and Romania, Germany has stepped in as a mediator to prevent a possible war, out of fear it could obstruct their access to the Romanian oil fields. \n\nThey have therefore demanded Romania to give us Northern Transylvania"
CBTS_hungary.41.a:0 "It is Hungarian Land."
CBTS_hungary.42.t:0 "Regaining Lost Territories II: Demand Transylvania?"
CBTS_hungary.42.desc:0 "Seeing as Romania has showed it's weakness by allowing the Soviet Union to occupy Bessarabia, several politicans within the government has raised their voice about demanding Transylvania. Although we are weaker in size, their army has been severely demoralized due to the recent territorial losses, meaning we could put up quite a fight."
CBTS_hungary.42.a:0 "Send a military delegation immediately."
CBTS_hungary.42.b:0 "We must not risk antagonizing the Allies."
CBTS_hungary.43.t:0 "Hungary Demands Transylvania"
CBTS_hungary.43.desc:0 "A military delegation from Hungary has been sent to disscuss a possible territorial revision of Transylvania. Hungary has no doubt seen the Soviet Union's annexation of Bessarabia as a possibility to demand Transylvania, considering our very weakened position. \n\nHowever, support for ceeding to their demands are very low."
CBTS_hungary.43.a:0 "Are they mental?"
CBTS_hungary.44.t:0 "Gyula Gömbös visits Adolf Hitler"
CBTS_hungary.44.desc:0 "After paying an official visit to Hitler, several key points were brought up between the two of them, though received with mixed reception. \n\nWhile Hitler rejected the idea of an alliance between us, due to the base of it being a revisionist alliance only existing to agitate the Entente, He voiced support for our territorial claims on Czechoslovakia. However, a revision of only Czechoslovakia and not Yugoslavia nor Romania. \n\nWe can only hope that Germany will employ a further emphasis on foreign policy."
CBTS_hungary.44.a:0 "We shall see how this plays out."
CBTS_hungary.45.t:0 "Fascists Demonstrate"
CBTS_hungary.45.desc:0 "A demonstration organized by fascist sympathizers was conducted today in several large cities around the country. What they are exactly demonstrating about is unclear, however it remains clear that this is no small organization, and if remained unchecked, can grow to be an alarming contender. \n\nSo far no arrests have been made, and the protest remains relatively peaceful."
CBTS_hungary.45.a:0 "We'll watch the situation closely."
CBTS_hungary.46.t:0 "Germany demands release of Ferenc Szalasi"
CBTS_hungary.46.desc:0 "After the Second Vienna Award, Germany has gained the political leverage necessary to compel us to comply with several of their request. Among these requests, one of them is incidentally the release of the imprisoned extremist Ferenc Szalasi. \n\nWhile we could just deny their 'request', they'll most likely end up politically alienate us, or end our neutrality. "
CBTS_hungary.46.a:0 "Very well."
CBTS_hungary.46.b:0 "We will not give in to their demands"
CBTS_hungary.47.t:0 "Germany Demands Military Access through Romania"
CBTS_hungary.47.desc:0 "A German telegram has been sent to us demanding us to permit Wehrmacht troops to cross Hungary in order to reach bases in Romania. "
CBTS_hungary.48.t:0 "Rearmament Begins"
CBTS_hungary.48.desc:0 "The Bled Agreement has now given us the legal grounds to freely build up our army as we wish, and already drafts on army expansion plans and formations of new divisions are being proposed, mainly with the idea of 'Mobile Warfare', no matter how poorly underequipped and in ill of state our industry is. \n\n[GER.GetNameDef] has however agreed to assist us in reforming our army, by giving some economical aid."
CBTS_hungary.48.a:0 "Deal."
CBTS_hungary.48.b:0 "We will not take Adolf Hitler's aid!"
CBTS_hungary.49.t:0 "German Pressure"
CBTS_hungary.49.desc:0 "[GER.GetName] has communicated to us that the help they have given us now means that they are to receive imported goods from us at a much reduced cost, stating that it was a part of the proposed deal between the two of us."
CBTS_hungary.49.a:0 "Very Well."
CBTS_hungary.50.desc:0 "[GER.GetName] has communicated to us that the help they have given us now means that they are to receive imported goods and a percentage of our industrial base from us at a much reduced cost, stating that it was a part of the proposed deal between the two of us."
CBTS_hungary.51.desc:0 "[GER.GetName] has communicated to us that the help they have given us now means that they are to receive imported goods and a higher percentage of our industrial base from us at an even more reduced cost, stating that it was a part of the proposed deal between the two of us."
CBTS_hungary.52.t:0 "Coup d'Etat Succesful"
CBTS_hungary.52.desc:0 "The Arrow Cross Party, with the help of armed militias, managed to dispose [HUN.GetLeader] and take over the government."
CBTS_hungary.52.a:0 "Very well."
CBTS_hungary.53.t:0 "Coup in Hungary"
CBTS_hungary.53.desc:0 "After a meeting in Budapest, Ferenc Szalasi and a group of Arrow-Cross members and Hungarian army officers have launched a coup! Believed to have been orchestrated by several Arrow-Cross members and various scattered groups, they are aiming to replace [HUN.GetLeader] with the like-minded Arrow-Cross leader Ferenc Szalasi. \n\nAlready, lightly armed fanatic members of the Arrow Cross Party, have begun occupying several key buildings and are now marching on to Buda Castle, where [HUN.GetLeader] is currently residing."
CBTS_hungary.53.a:0 "Mobilize the Gendarmerie and prepare to arrest the traitors."
CBTS_hungary.53.b:0 "Surrender to the rebels, avoid unnecessary blood spill"  
CBTS_hungary.54.t:0 "Coup d'Etat Avoided"
CBTS_hungary.54.desc:0 "A succesful deescalation of the ongoing coup has resulted in mass-arrests of Arrow-Cross members and politicians, and a reinforcement on security have been put in place."
CBTS_hungary.54.a:0 "Cowards."            
CBTS_hungary.55.t:0 "Revising Trianon I: Secret Rearmament"
CBTS_hungary.55.desc:0 "The Trianon Treaty have hampered our army in every way. Our 35 000 man army is nowhere capable of performing the tasks expected of them in case a peaceful revision of Trianon fails. \n\nSince conscription is banned, several ways to recruit soldiers have been tried, resulting in most notably the Levente Association, a paramilitary force with the intent of raising future soldiers."    
CBTS_hungary.55.a:0 "We will restore our glory."
CBTS_hungary.56.t:0 "Loans to the League of Nations"
CBTS_hungary.56.desc:0 "As we are now out of the worst part of the Depression, and having stabilized the economy, the Financial Committee of the League of Nations have seen fit to resume the repayments of the loans we so liberally took just a few years ago." 
CBTS_hungary.56.a:0 "Very well."
CBTS_hungary.57.t:0 "Hungary seeks for a Trade Agreement"
CBTS_hungary.57.desc:0 "The Great Depression and the wheat collapse have struck [HUN.GetName] hard. With this, they have reached out, looking to strike a trade deal in order to stabilize their economy. \n\nThis could be an opportunity to strengthen our relations with them, and vice versa."
CBTS_hungary.57.a:0 "We'll accept their proposal."
CBTS_hungary.57.b:0 "We have no interest in helping them."
CBTS_hungary.59.t:0 "Trade-deal Accepted"
CBTS_hungary.59.desc:0 "The disscusions regarding the trade-deal has reached its end, ending in a win-win situation for the both of our nations. \nWith this, we can begin our slow journey out of this depression."
CBTS_hungary.59.a:0 "Deal."
CBTS_hungary.60.t:0 "Darányi Allows Arrow Cross Members in Parliament"
CBTS_hungary.60.desc:0 "Despite the earlier ban on extremist parties, Darányi have now allowed for members of the Arrow Cross Party to run for parliament, now potentially creating an untenable position for the near future. \n\nThe opposition, rightfully so, have issued their protests against this action."
CBTS_hungary.60.a:0 "We'll see how this plays out."

#News Events
HUN_news.298.t:0 "Hungary Renounces Treaty of Trianon"
HUN_news.298.desc:1 "In a public declaration, [HUN.GetLeader] has renounced the treaty imposed by the Allied powers after the Great War. Signed by the Hungarians under protest, in 1920, it greatly reduced the country's size and limited the strength of its military.\n\nIn his speech, [HUN.GetLeader] already hinted that Hungary may soon look towards reaffirming their claims on the territories taken from them two decades ago."
HUN_news.298.a:0 "Gone, but not forgotten!"
HUN_news.298.b:0 "They are meddling with the world order..."
HUN_news.298.c:0 "They have escaped the yoke of Versailles."
HUN_news.299.t:0 "Hungary Proclaims Greater Hungary"
HUN_news.299.desc:0 "With Hungary having regained the lands that were taken from them in the Treaty of Trianon, [From.GetLeader] issued a proclamation that the nation shall be now known as Greater Hungary, signaling the assumed position that they have reclaimed all the territories with a large Hungarian presence."
HUN_news.299.a:0 "The Holy Crown of St. Stephen may rest now."
HUN_news.299.b:0 "Not even half as great!"
HUN_news.300.t:0 "Hungary Annexes Transylvania"
HUN_news.300.desc:0 "In an effort to further reverse the Treaty of Trianon, Hungary has now managed to find itself in control of Transylvania once again. Romania has gone to call it 'completely unacceptable' however it is yet unclear if Romania is to seek revision for this."
HUN_news.300.a:0 "We will no longer be cowed!"
HUN_news.300.b:0 "We must think fast..."
HUN_news.300.c:0 "Let us hope they work it out peacefully."
HUN_news.301.t:0 "Romania Returns Transylvania"
HUN_news.301.desc:0 "Romania has announced that it will accept the Hungarian demands for a return of Transylvania. Accordingly, the territory has now been reunited with the country, greatly increasing its size and strength. It is unlikely that a success of this magnitude will deter the Hungarians from issuing further demands for their remaining lost territories."
HUN_news.301.a:0 "We are on the path to greatness!"
HUN_news.301.b:0 "We had no choice."
HUN_news.301.c:0 "At least peace was preserved."
HUN_news.302.t:0 "Romania Rejects Hungarian Demands"
HUN_news.302.desc:0 "The ultimatum's deadline has come and gone without a Romanian reply. Outraged Hungarian officials have already denounced Romania's government, claiming they are 'destabalizing the region' with their insistence to adhere to 'unlawful treaties'. Both nations seem to be preparing for a war that may well erupt at any day."
HUN_news.302.a:0 "If strength is all they will listen to..."
HUN_news.302.b:0 "Let them come!"
HUN_news.302.c:0 "Stone-headed fools..."
HUN_news.303.t:0 "Hungary Annexes Transcarpathia"
HUN_news.303.desc:0 "Following up on their promises to correct the Treaty of Trianon, Hungary has reincorporated the Transcarpathia from [From.GetName]. The major powers of Europe have not yet given an official response to this, but the threat of war breaking out over this occupied territory seems little to none, with most newspapers describing it as 'Hungary merely retaking what should be theirs.'"
HUN_news.303.a:0 "They should be lucky this is all we took."
HUN_news.303.b:0 "Let us hope we can find a compromise..."
HUN_news.304.t:0 "[From.GetName] Returns Southern Slovakia"
HUN_news.304.desc:0 "[From.GetName] has officially accepted the Hungarian demands for a return of Southern Slovakia, and has already taken hurried steps to ensure the territory will be returned to Hungary immediately. It is unlikely that this success will deter the Hungarians from issuing further demands for their remaining lost territories."
HUN_news.304.a:0 "We welcome them back into the fold."
HUN_news.305.t:0 "[From.From.GetName] Rejects Hungarian Demands"
HUN_news.305.desc:0 "Diplomatic negotiations have broken down, and today [From.From.GetName] publicly rejected the Hungarian demands for the return of Southern Slovakia. Outraged Hungarian officials have already denounced [From.From.GetName]'s government, claiming they are 'destabilizing the region' with their insistence to adhere to 'unlawful treaties'. Both nations seem to be preparing for a war that may well erupt at any day."
HUN_news.306.t:0 "Hungary Annexes the Vojvodina"
HUN_news.306.desc:0 "Hungary has just recently annexed the Vojvodina and Prekmurje. Facing Yugoslav resistance, they have nontheless managed to secure the concerning areas and are now in their way of yet again growing into a regional power."
HUN_news.306.a:0 "A day of glory."
HUN_news.306.b:0 "We must think fast..."
HUN_news.307.t:0 "Yugoslavia Returns the Vojvodina"
HUN_news.307.desc:0 "Yugoslavia has decided to cave to Hungarian demands, and has arranged for the rapid transfer of the Vojvodina to its neighbor. Though it required ample use of gunboat diplomacy, it is undeniable that Hungary has grown into a new regional powerhouse."
HUN_news.307.a:0 "Another diplomatic victory!"
HUN_news.308.t:0 "Yugoslavia Rejects Hungarian Demands"
HUN_news.308.desc:0 "In a clear act of defiance the Yugoslavs have rejected Hungarian demands for the Vojvodina. Hungary, on its part, has made no efforts to step down its threats of using force to secure its 'lawful territory'. Both nations seem to be preparing for a war that may well erupt at any day."
HUN_news.309.t:0 "Hungary Claims Overlordship over Slovakia"
HUN_news.309.desc.a:1 "The Hungarians have raised claims that Slovakia should once more be a part of their nation, either as an integral part or as an autonomous region. An ultimatum to this effect has been issued, backed with the threat of force, and diplomats from several European nations are in a frenzy trying to find a peaceful solution to this latest crisis."
HUN_news.309.desc.b:0 "The Hungarians have raised claims that Slovakia should once more be a part of their nation, either as an integral part or as an autonomous region. An ultimatum to this effect has been issued, backed with the threat of force, and the Slovak government is in a frenzy trying to find a diplomatic solution to this latest Hungarian crisis."
HUN_news.309.a:0 "Let's hope force won't be needed."
HUN_news.309.b:0 "This is not a minor demand..."
HUN_news.309.c:0 "Are we willing to part with our independence?"
HUN_news.310.t:0 "[From.GetName] Caves to Hungary"
HUN_news.310.desc.a:1 "After ample deliberations, the [From.GetAdjective] Government under [From.GetLeader] has decided to give in to Hungarian demands. They have accepted Hungarian control over Slovakia, preferring to appease [HUN.GetLeader] to preserve the peace. Undoubtedly this will strengthen Hungarian resolve in future dealings with their weakened neighbors."
HUN_news.310.desc.b:0 "After ample deliberations the Slovaks have decided to give in to Hungarian demands. Seeing no alternative, they have parted with their independence in a bid to preserve the lives of their people. Undoubtedly this will strengthen Hungarian resolve in future dealings with their weakened neighbors."
HUN_news.310.a:0 "The Slovaks are better off this way."
HUN_news.310.b:0 "It was a necessary sacrifice."
HUN_news.311.t:1 "[From.From.GetName] Rejects Hungarian Demands"
HUN_news.311.desc.a:1 "A diplomatic crisis has erupted between Germany and Hungary, concerning the fate of Slovakia. [HUN.GetLeader] had previously declared that Slovakia was a core interest of [HUN.GetNameDef], owing to its historical ties with Hungary. His government expected to be consulted on any measure concerning Slovakia. \n\nGerman leader [GER.GetLeader] has refused to accept any such demands, calling them "foolish and dangerous interference in the internal affairs of a sovereign nation."\n\nWith tensions running high, more and more observers are wondering if Hungary might resort to violence to deliver a fait accompli."
HUN_news.311.desc.b:0 "Clinging tenaciously to their independence, the Slovaks have rejected Hungarian demands, and are fortifying their border. Hungary has made no effort to de-escalate the situation, and both nations seem set on a course to war."
HUN_news.311.b:0 "We stand as one. Let them come!"
HUN_news.312.t:0 "Gyula Gömbös visits Adolf Hitler"
HUN_news.312.desc:0 "\nToday, the Hungarian Prime Minister Gyula Gömbös visited [GER.GetLeader], hoping to bring Hungary out of her unemployment crisis. Despite the unstable state of the German economy, and various other issues, they even signed a trade agreement, bringing the two nations closer to eachother.\n\nIf there are to be further actions between the countries in the future are unknown as of now but it is to be expected."
HUN_news.312.a:0 "We have to deal with the devil, for now..."
HUN_news.312.b:0 "What will this entail?"
HUN_news.312.c:0 "What about the Rome Protocols?"