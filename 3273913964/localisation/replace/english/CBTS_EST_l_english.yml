l_english:
 #ideas
 EST_Great_Depression:0 "Great Depression"
 EST_Great_Depression_desc:0 "The Great Depression has severely affected our economy, with industry declining 20%, and Agriculture declining 45%. Although the worst seems to be over, it has given the Radical Right-Wing Vaps movement some traction..."
 EST_Vaps_Movement:0 "Vaps Movement"
 EST_Vaps_Movement_desc:0 "The Vaps Movement, or the Eesti Vabadussõjalaste Liit (Union of Participants in the Estonian War of Independence), is a Nationalist and Anti-Communist movement that has been growing in popularity since the Great Depression. Although they have taken Aesthetical inspiration from Fascist Ideology (such as the use of the Roman Salute), they have no clear ideology and reject Nazi Racial Theory. Their political aim is to create a more Authoritarian Estonia, based on a Presidential System."
 #traits
 authdem_minister:0 "Auth. Democrat"
 est_auth_democrat_desc:0 "Estonian Authoritarian Democracy is the prefered form of Government of Konstantin Päts, the dictator of Estonia after 1934. It features a cult of personality around Päts and the suppression of rights, although the dictatorship is not incredibly harsh. It was primarily a reaction to the growth of Right-Wing Nationalism in the country."
