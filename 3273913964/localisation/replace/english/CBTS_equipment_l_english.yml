 ###    Armour Equipment  ###
 
 #Light tanks
 light_tank_equipment_4:0 "Light Tank IV"
 light_tank_equipment_4_short:0 "L. Tank IV"
 light_tank_equipment_4_desc:0 "Light tanks are small, agile tanks which are able to both scout and fight lightly armored opponents."
 light_tank_equipment_4:0 "Light Tank IV"
 light_tank_artillery_equipment_4:0 "Light Tank SP Artillery IV"
 light_tank_artillery_equipment_4_short:0 "L. SPG IV"
 light_tank_artillery_equipment_4_desc:0 "A small artillery cannon mounted on a light chassis, a light SPG does not pack the firepower of its larger brethren, but they are more mobile."
 light_tank_destroyer_equipment_4:0 "Light Tank Destroyer IV"
 light_tank_destroyer_equipment_4_short:0 "L. TD IV"
 light_tank_destroyer_equipment_4_desc:0 "Tank Destroyers are tanks with a larger than normal gun in a fixed mounting in place of a turret. Light Tank Destroyers are based on the chassis of Light Tanks, which means they are fairly mobile but do not carry particularly powerful guns compared to heavier TDs."
 light_tank_aa_equipment_4:0 "Light SP Anti-Air IV"
 light_tank_aa_equipment_4_short:0 "L. AA IV"
 light_tank_aa_equipment_4_desc:0 "Anti-air artillery is primarily designed to shoot down hostile planes, although the rapid fire cannons can also be effective against ground targets. This model is mounted on the chassis of a light tank."
