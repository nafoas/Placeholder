l_english:
 #generic rightist european tree
 #Politics
 GEN_RIGHT_POL_start:0 "For the Fatherland!"
 GEN_RIGHT_POL_start_desc:0 "Our Government is oriented around the economic prosperity and sovereignty of the Fatherland. We prefer a strong state centralized around individuals or groups of individuals. We intend to have an autocracy, where our population is guarded from the chaos of Liberalism and the Atheism of Communism by the military and the secret police."
 GEN_Recent_Purges:0 "Recent Purges"
 GEN_RIGHT_POL_Purge_Government:0 "Purge the Civil Service"
 GEN_RIGHT_POL_Purge_Government_desc:0 "The bureaucracy is likely filled with plotters and traitors. We should arrest those we find suspicious, just to be safe."
 GEN_RIGHT_POL_Eliminate_Socialism:0 "Crush the Marxists!"
 GEN_RIGHT_POL_Eliminate_Socialism_desc:0 "Our society is rife with Godless Marxists who would like nothing more than to see our order torn asunder. We should task our ministries with finding and rooting out those with socialist opinions."
 GEN_RIGHT_POL_Eliminate_Liberalism:0 "Destroy the Liberals!"
 GEN_RIGHT_POL_Eliminate_Liberalism_desc:0 "Foolish Liberals think that they can build a functional society based on personal and economic freedoms! We should eliminate these dangerous influences so their chaotic system does not infect our order."
 GEN_secret_police:0 "Secret Police"
 GEN_RIGHT_POL_Improve_Secret_Police:0 "Improve the Secret Police"
 GEN_RIGHT_POL_Improve_Secret_Police_desc:0 "We should invest more resources into our secret police. They should be able to root out foreign influence and internal dissidence as soon as they spring up!"
 GEN_RIGHT_POL_Tighten_Courts:0 "Control the Courts"
 GEN_RIGHT_POL_Tighten_Courts_desc:0 "We should tighten our grip on the court system, to ensure that political crimes are punished. Those speaking out against our government should be sent to prison to pay for their subversion!"
 GEN_RIGHT_POL_Special_Courts:0 "Special Courts"
 GEN_RIGHT_POL_Special_Courts_desc:0 "We should establish special political courts specifically for high-profile political subversives. We should make an example out of traitors to keep everybody else in line."
 GEN_RIGHT_POL_Secure_Loyalty:0 "Secure Loyalty"
 GEN_RIGHT_POL_Secure_Loyalty_desc:0 "We must use a propaganda campaign, as well as some tactical arrests, to secure the loyalty of the people. If they stand behind us, we can do anything!"
 GEN_RIGHT_POL_King:0 "For God, Leader, and Country"
 GEN_RIGHT_POL_King_desc:0 "All Hail [This.GetLeader]! Our glorious leader shall lead our country into a new age, where authority is respected and traditions are celebrated! With a strong State, Clergy, and Military, our nation will be able to survive the tumultous times ahead."
 GEN_RIGHT_POL_Mod_Nat:0 "Moderate Statism"
 GEN_RIGHT_POL_Mod_Nat_desc:0 "It is not necessary for the state to overreach. Though our government will control key aspects of life, such as education and culture, the citizens will retain some control over their futures."
 GEN_RIGHT_POL_Ultra_Nat:0 "Everything Under the State"
 GEN_RIGHT_POL_Ultra_Nat_desc:0 "A Totalitarian State is necessary to ensure that each individual is able to contribute fully to society. We will coordinate the actions and activities of all groups from trade associations to knitting circles and ensure that none of them take actions against us."
 GEN_traditionalism:0 "Traditionalist Society"
 GEN_reactionary_modernism:0 "Reactionary Modernism"
 GEN_RIGHT_POL_Traditionalism:0 "Traditionalism"
 GEN_RIGHT_POL_Traditionalism_desc:0 "Our society looks to the early 19th Century for inspiriation. A time where the central authority was unquestioned by pedants, strong farming men worked the fields, and women worked at home. We should look to go back to these good old times."
 GEN_RIGHT_POL_Reactionary_Monarchism:0 "Reactionary Modernism"
 GEN_RIGHT_POL_Reactionary_Monarchism_desc:0 "What is old is new again! We shall look to the 17th Century for inspiration. The ancient structures of the old monarchies - estatism and absolutism - will be reborn as corporatism and totalitarianism!"
 GEN_RIGHT_POL_Nationalist_Education:0 "Ideological Education"
 GEN_RIGHT_POL_Nationalist_Education_desc:0 "We should review our curriculum and change it so our students will understand that our regime is righteous and that our ideology is the only correct one."
 GEN_RIGHT_POL_Cultural_Orgs:0 "Sponsor Cultural Organizations"
 GEN_RIGHT_POL_Cultural_Orgs_desc:0 "We should promote the formation and membership of cultural organizations, as spreading the understanding a nation's culture is a key component of promoting Nationalism."
 GEN_paramilitary:0 "Paramilitary Youth"
 GEN_RIGHT_POL_Paramilitary:0 "Paramilitary Youth"
 GEN_RIGHT_POL_Paramilitary_desc:0 "We should give our youth military training, so it will be easier to induct them into the army when they become adults. This is necessary to ensure we can defend our territory from foreign invaders!"
 GEN_RIGHT_POL_Centralize_Power:0 "Centralize Power"
 GEN_RIGHT_POL_Centralize_Power_desc:0 "We need to concentrate more powers around the central government, so we can better control the goings-on in the country. Decentralized power leads to chaos and disorder, while centralization leads to stability and decisiveness."
 GEN_RIGHT_POL_Expand_Bureaucracy:0 "Expand the Bureaucracy"
 GEN_RIGHT_POL_Expand_Bureaucracy_desc:0 "We need more civil servants to carry out our growing amount of directives. This should ensure that our system will not be bogged down with red tape, but we must make sure not to let any dissidents infiltrate our government..."
 GEN_expanded_bureaucracy:0 "Expanded Bureaucracy"
 GEN_RIGHT_POL_Protectionism:0 "Protectionism"
 GEN_RIGHT_POL_Protectionism_desc:0 "We cannot rely on foreign powers to supply us with goods. We must encourage home-grown industries in order to become an economic power and make importing foreign influences unnecessary."
 GEN_rightist_pro_corporations:0 "Pro-Market Policies"
 GEN_rightist_pro_corporations2:0 "Laissez-Faire Policies"
 GEN_RIGHT_POL_Capitalism:0 "Empower the Corporations"
 GEN_RIGHT_POL_Capitalism_desc:0 "The state should allow all businesses an equal platform to work with. It is not our problem if some have greater resources than others. The existance of large conglomerates drives competition and improves efficiency."
 GEN_rightist_corporatism:0 "Regulatory Policies"
 GEN_rightist_corporatism2:0 "State-Capital Coordination"
 GEN_RIGHT_POL_Corporatism:0 "Control the Corporations"
 GEN_RIGHT_POL_Corporatism_desc:0 "We should ensure that the Corporations are serving the state's interest. We will allow them to operate for private profit, but only if it does not come at the expense of the nation. Large conglomerates - without oversight - will sell out the nation and the people!"
 GEN_RIGHT_POL_Deregulation:0 "Deregulation"
 GEN_RIGHT_POL_Deregulation_desc:0 "We shall decrease regulations on labor and safety conditions, as well as on consumer safety standards, as those only serve to stifle economic competition and prosperity."
 GEN_RIGHT_POL_Coordinate:0 "Coordinate with Corporations"
 GEN_RIGHT_POL_Coordinate_desc:0 "We should guide the corporations so they would better serve the national interest. We need resources, industry, and weaponry, not banking, speculation, and capitalism!"
 GEN_public_works:0 "Public Projects"
 GEN_RIGHT_POL_Public_Works:0 "Public Works"
 GEN_RIGHT_POL_Public_Works_desc:0 "To provide employment, we should begin public infrastructure projects. People who have lost their jobs due to the economic restructuring can now have hopefully temporary employment by the state."
 GEN_privatizations:0 "Ongoing Privatization"
 GEN_RIGHT_POL_Privatizations:0 "Privatize Services"
 GEN_RIGHT_POL_Privatizations_desc:0 "State-Owned Services, such as transportation or medical care, should be sold to private owners. First, it helps decrease statism in the economic sphere, and second, it will guarantee more funding for our government."
 GEN_nationalizations:0 "Ongoing Nationalization"
 GEN_RIGHT_POL_Nationalizations:0 "Nationalize Key Industries"
 GEN_RIGHT_POL_Nationalizations_desc:0 "Important industries should be nationalized so that the profiteering supercapitalists cannot get a chance to sell out the country for an extra pound."
 GEN_RIGHT_POL_National_Unions:0 "A National Trade Union"
 GEN_RIGHT_POL_National_Unions_desc:0 "Trade Unions and their work will be nationalized and reorganized. A trade union working in the National Interest is far more trustworthy than competing groups of potentially dangerous Marxists and Liberals."
 GEN_RIGHT_POL_Destroy_Unions:0 "Abolish Trade Unionism"
 GEN_RIGHT_POL_Destroy_Unions_desc:0 "Trade Unions universally harm the national interest. Therefore, we should abolish all Trade Unions and their work, as they are staffed by dangerous Marxists. We shall fight Moscow at home!"