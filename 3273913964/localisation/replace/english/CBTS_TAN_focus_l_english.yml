l_english:
#new new stalinist historical
TAN_new_years_address:0 "The New Year's Address"
TAN_new_years_address_desc:0 "Since the founding of our nation, the leaders of our government have issued addresses to the nation at the Tuvan New Year. We should continue this to better legitimize our regime."
TAN_establish_the_SPC:0 "Establish the SPC"
TAN_establish_the_SPC_desc:0 "As we look to the future of our nation, the previous governments have not established many plans. Establishing a State Planning Commision would allow our nation to better prepare for the future." 
TAN_state_control_of_tuvinbank:0 "Reorganize the State Bank"
TAN_state_control_of_tuvinbank_desc:0 "Despite the changing of governments, the leadership of the state bank is unpreferable. We should reorganize it under comrades Oyun Tanchai and Sat Lopsan."
TAN_salchak_tokas_pardons:0 "Rework the Criminal Law"
TAN_salchak_tokas_pardons_desc:0 "Lamas, Nobles, and Khemchik rebels have all undoubtedly damaged our state, but in the end, they are all valuable memebers of our soociety. A new criminal law would pardon them and allow them to be put to good use in the state."
TAN_replace_oyun_tanchai:0 "Replace Oyun Tanchai"
TAN_replace_oyun_tanchai_desc:0 "Oyun Tanchai, Chairman of the council of ministers, Minister of the economy, and director of the state bank, has his work cut out. His position should be divided for easier management."
TAN_complete_the_administrative_reforms_of_1932:0 "Divide Kaa-Khem"
TAN_complete_the_administrative_reforms_of_1932_desc:0 "In 1932, reforms were planned to divide the Kha-Khem Khoshun, however, we have yet to fully implement these plans. If we undertake them, the local rebellion should surely be finished..."
TAN_incorporation_of_terekholsky:0 "Incorporate Tere-Kholsky"
TAN_incorporation_of_terekholsky_desc:0 "Kungurtug lies in the Southeast of our country, and as of now is the last major area of rebel activity. We should incorporate the region as Tere-Kholsky khoshun to better administer it."
TAN_strike_at_kungurtug:0 "Attack Rebels in Kungurtug"
TAN_strike_at_kungurtug_desc:0 "Our forces are ready and the continuing existence of the rebel forces is a disgrace to our nation! We should set out at once to defeat them!"
TAN_reissue_roubles:0 "Reissue Rubles"
TAN_reissue_roubles_desc:0 "Our current currency is outdated, and even uses some ex-Russian bills. This reactionary influence in our nation cannot stay any longer. We should approach the Soviets for new Rubles to overprint."
TAN_postage_reforms:0 "Postage Reform"
TAN_postage_reforms_desc:0 "As part of Toka's plan, stronger communications are to be brought to Tuva. A Postage reform is overdue. We can start with reissuing stamps to serve our citizens."
TAN_vperyod:0 "Establish Tuvinian Truth"
TAN_vperyod_desc:0 "Our Government has lacked a strong method of influencing the people of Tuva. However, the citizens of the ex-Russian Self-governing colony have used newspapers in the past. We should expand their use to the entire nation."
TAN_cement_the_party:0 "Cement the Party"
TAN_cement_the_party_desc:0 "With our initial reforms complete, and the opposition crushed, our faction of the Communist Party has solidified its rule. \nForward!"

TAN_reform_the_ministry_of_culture:0 "Recreate the Culture Ministry"
TAN_state_theater:0 "Establish the State Theater"
TAN_state_theater_desc:0 "Viktor Kok-ool's works have shown the Government that there is, indeed, demand for Theater in Tuva. We should establish a state theater to better develop future talents in the arts."
TAN_flag_reform_law:0 "Convene on State Symbols"
TAN_flag_reform_law_desc:0 "Currently, some symbols relevant to the state display outdated state ideals, including the national flag. We should convene the Khural on the usage of them to bolster national unity."
TAN_soviet_printing:0 "Reaffirm the Printing Deal"
TAN_print_stamps_in_kyzyl:0 "Move Stamp Production to Kyzyl"

TAN_create_the_ministry_of_local_industries:0 "The Ministry of Local Industries"
TAN_create_the_ministry_of_local_industries_desc:0 "The Ministry of the national economy has served Tuva well, but it has shown its inefficiency in recent years. It is time to replace it."
TAN_krasnoyarsk_road:0 "Soviet-Aided Roadbuilding"
TAN_the_ministry_of_mining:0 "Reform the Ministry of Mining"
TAN_working_towards_electrification:0 "Working towards Electrification"
TAN_expand_kyzyl_telephone:0 "Expand Kyzyl Telephone Coverage"
TAN_solve_dusdags_dispute:0 "Revive the Ovyursky Dispute"
TAN_road_to_ovyursky:0 "Khandagayty Road"
TAN_improve_salt_mine_production:0 "Improve Salt Production"
TAN_improve_gold_mine_production:0 "Bolster the Gold Industry"
TAN_appeal_to_moscow:0 "Appeal for Mediation"

TAN_cooperate_with_KUTV:0 "Approach KUTV"
TAN_second_class_in_moscow:0 "Third Class to Moscow"
TAN_second_class_in_moscow_desc:0 "The Successes of the First and Second Moscow education programs have shown their effectiveness. We should aim to send more of our best to study in the USSR, starting with a third, larger class at KUTV."
TAN_reform_the_department_of_education:0 "Four Year Curriculum"
TAN_force_reeducate_religious:0 "Force Re-education of Lamas"
TAN_standardize_rural_curriculums:0 "Revive the Khoshun System"
TAN_appeal_to_the_younger_generation:0 "Appeal to the Younger Generation"
TAN_kyzyl_pedagogy_school:0 "Kyzyl Pedagogy School"
TAN_form_the_youth_union:0 "Form the Youth Union"
TAN_increase_soviet_scientist_influx:0 "Increase the Scientist Influx"
TAN_formalize_the_latin_script:0 "Formalize the Latin Script"

TAN_expand_the_SPC:0 "Expand the SPC"
TAN_tuvan_aksha_focus:0 "Introduce the Aksa"
TAN_the_revolution_marches_onwards:0 "The Revolution Marches Onwards"

#PURGE
TAN_purge_start_focus:0 "Crisis in the Khural"
TAN_purge_start_focus_desc:0 "Churmit-Dazhy and his allies have officially declared to be in opposition to the party. We must take action to ensure our rule does not collapse."
TAN_appoint_oyun_polat:0 "Appoint Oyun Polat"
TAN_appoint_oyun_polat_desc:0 "Oyun Tanchai, minister of internal affairs, has made his alignment clear. He must be replaced. Minister of Economy Oyun Polat will serve the position much more loyally."
TAN_empower_the_moia:0 "Empower the Ministry of Internal Affairs"
TAN_empower_the_moia_desc:0 "With Oyun Polat's loyalty secured, we should empower his position further, granting us more control over the country's divided government."
TAN_monitor_khural_loyalties:0 "Monitor the Khural"
TAN_monitor_khural_loyalties_desc:0 "Members of the Khural have openly declared support for the opposition, but many lie in the shadows. We must ensure that the Khural does not turn on our regime."
TAN_collaborate_with_mikhail_frinovsky:0 "Collaborate with Soviet Intellegence"
TAN_collaborate_with_mikhail_frinovsky_desc:0 "In order to deal with the increasing threat from the opposition, we should collaborate with Soviet Intellegence to highlight members of the opposition." 
TAN_a_show_of_force:0 "A Show of Force"
TAN_a_show_of_force_desc:0 "The opposition continues to grow in power within the Khural, perhaps it is time we make a show of force. Khural member Kara-Sal Pirinlei would be an obvious target. He has been accused of Trotskyist collaboration in the past. His elimination would intimidate the opposition, but not drive them to open rebellion."
TAN_the_counterrevolutionary_plot:0 "The Plot Revealed"
TAN_the_counterrevolutionary_plot_desc:0 "Our intellegence in the Khural have determined a plot by the opposition! They have been collaborating with Japanese agents to annex Tuva into the Japanese Empire! We must act quickly, or they may make their move."
TAN_replace_sat_lopsan:0 "Apprehend Sat Lopsan"
TAN_replace_sat_lopsan_desc:0 "Bank Minister Sat Lopsan has clearly shown his allegence to Oyun Tanchai. As he is not a member of the Khural, he makes an obvious early target for our elimination of the traitors. His elimination would allow for better control of the state bank, and allow us to put pressure on Oyun Tanchai."
TAN_arrest_kuzhuget:0 "Imprison Seren Kuzhuget"
TAN_arrest_kuzhuget_desc:0 "[Root.TAN_kuzhuget_retired_or_not]"
TAN_seren_retired_focus:0 "Our Soviet Intellegence has shown that Seren Kuzhuget has been collaborating with the anti-government faction. With his ties to the army and mayorship of Kyzyl itself, we must act quickly to prevent his potential significant influence in a coming struggle."
TAN_seren_military_focus:0 "Our Soviet Intellegence has shown that Seren Kuzhuget has been collaborating with the anti-government faction. With his command of the TNRA, we must act quickly to prevent his potential significant influence in a coming struggle."
TAN_arrest_pirinleis_allies:0 "Eliminate Kara-Sal Pirinlei's Allies"
TAN_arrest_pirinleis_allies_desc:0 "Beside Kara-Sal Pirinlei, Soviet intellegence has also determined other Trotskyists in the Khural. While they do not direcly align with the opposition, we have already shown our hostility to them, and in the event of a conflict in the Khural, would likely side with them. They must be eliminated as well." 
TAN_plot_of_the_nine:0 "The Plot of the Nine"
TAN_plot_of_the_nine_desc:0 "With confessions extracted, the true scale of the plot against the government has been unleashed. The opposition do not just wish to topple the Toka government. Instead, they have been collaborating with Japanese agents to annex Tuva into the Japanese Empire! With information of their treason obtained, we can make our move on the opposition, and end this cherade once and for all."
TAN_purge_end_focus:0 "The Traitors Eliminated"
TAN_purge_end_focus_desc:0 "It has been done. With one fell swoop, the traitors have been eliminated from Tuva. We must now work to ensure our government's rule does not experience a similar situation again."
TAN_seize_nomadic_lands:0 "Seize Nomadic Lands"
TAN_seize_nomadic_lands_desc:0 "Many Nomads indirectly sided with the opposition during the recent governmental crisis, due to Churmit-Dazhy's general outreach towards them. We must put the nomads in their place."
TAN_curtail_the_SPC:0 "Curtail the SPC"
TAN_curtail_the_SPC_desc:0 "The State Planning Commission has become an important backbone of the Tuvan state in recent years, but due to its ties with the late Oyun Tanchai, and significant power in the development of the state, its power must be decreased." 
TAN_put_down_oyun_polat:0 "Weaken Oyun Polat"
TAN_put_down_oyun_polat_desc:0 "Oyun Polat has served his job well. However, with his increased power, he has also become a potential threat to our rule. While we don't need to eliminate him from his position entirely, we should gradually lower his powers in the government."
TAN_purge_end:0 "The Party Victorious"
TAN_purge_end_desc:0 "We have won! \nThe enemies of the revolution have been completely and utterly crushed! Although their remnants continued to act following the plot, with their allies eliminated, we can finish them off once and for all! \nFor the TPRP! To 1000 years more!"


