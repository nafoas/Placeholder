TAN_end_collectivization_aftershocks:0 "Finish Collectivization's Aftershocks"
TAN_mobilize_the_youth_union:0 "Mobilize the Youth Union"
TAN_mobilize_the_youth_union_desc:0 "The Youth Union is the key to the future development of the Tuvan state. We should aim to use them to better influence the general populace."
TAN_cultural_production:0 "Cultural Production"
TAN_ban_shagaa:0 "Regulate Shagaa"
TAN_ban_shagaa_desc:0 "Shagaa in an important staple of the Tuvan culture, however, some parts of it display characteristics too different from our party vision. A set of laws on the allowed Shagaa celebrations should remedy this."
TAN_integrate_russians:0 "Integrate Russians"
TAN_attack_old_believers:0 "Attack Old Believers"
TAN_tuva_state_radio:0 "Tuva State Radio"
TAN_revise_state_symbols:0 "Revise State Symbols"
TAN_nkvd:0 "Invite the NKVD"
TAN_nkvd_desc:0 "The work of Frinkovsky has shown us the importance of intellegence. While creating our own agency would be too resource-consuming, we can collaborate with the Soviet NKVD to better monitor our populace."
TAN_toka_cult:0 "The Toka Cult"