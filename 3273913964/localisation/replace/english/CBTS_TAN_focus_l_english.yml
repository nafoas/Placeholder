TAN_appoint_anchimaa:0 "Appoint Anchimaa"
TAN_appoint_anchimaa_desc:0 "With Oyun Polat gone to study in Moscow, someone will have to fill the post of Chairman of the presidium of the Little Khural. While there are other options, Khertek Anchimaa, a woman, has been proposed by many as the successor to Comrade Polat. With her distinguishments as part of the second KUTV class, and current position as director of the Tuvan Zhenotdel, many feel she would be an ideal head of state."
TAN_absorb_khurals:0 "Expel the Kutvans"
TAN_1941_administrative_reforms:0 "Reorganise the Khoshuns"
TAN_invite_russian:0 "Russians in the Khural"
TAN_invite_russian_desc:0 "Although the Russian Self-Governing Labour Colony was abolished, the Russian people still have an important part to play in Tuva's destiny. With their expertise in the ways of industrialization and modernization, we should aim to get as many of them as possible into high positions."
