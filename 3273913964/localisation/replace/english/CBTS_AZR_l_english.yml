 #events
 azr_civil_war.1.t:0 "Revenge for 1920!"
 azr_civil_war.1.d: "The First Republic was a Grand Experiment in Jadidist Theory. We were going to build a Parliamentary State based on Freedom and Equality. Unfortunately, the Baku Soviets and the other Socialists did agree, and allowed Moscow to make us their thralls once again.\n\nNo more!\n\nAzerbaijan will be free again, and we shall impress the Western Nations with our progressiveness!"
 azr_civil_war.1.a:0 "To Arms!"
 azr_civil_war.2.t:0 "The Baku Central Committee"
 azr_civil_war.2.d:0 "Citing our Political Liberalization, a group of Azeri Bolsheviks have formed a Central Committee in Baku, effectively restarting Communist Political Activity in Baku. The CC calls for the effective surrender of Azerbaijan to the USSR, though also opposes Armenian and Georgian border claims. Interestingly, in spite of the Democratic Centralist principles in play, some of these Bolsheviks have deviated from the Stalinist Party Line, with proposals such as the formation of republics separate from Moscow (such as an independent Azerbaijan or a Transcaucasian FSR), expansion into Iran, and even the legalization of small private enterprise. Though these proposals have made observers scurry with theories and predictions, it is clear that we cannot tolerate this treason."
 azr_civil_war.2.a:0 "They should be arrested!"
 
 #internal
 azr_internal.1.t:0 "The People's Islamic Party"
 azr_internal.1.d:0 "With the recent Liberalization of the Political Landscape, said landscape is beginning to take form. Although minor socialist and social democratic parties have begun to take form, it is becoming increasingly clear that progressivists have rallied behind Musavat with the expectation of continued reforms. Conservative Reaction to our efforts has become centered on the People's Islamic Party. The PIP is more moderate than the old Ittihad (Union) party, in that while it opposes our reformist Islam, it supports the creation of a Parliamentary system. Unlike the Jadidists, these Islamists seek to establish policy based on Islamic Teachings, though without enacting Sharia Law. Though Musavat remains the party of choice for most Azerbaijanis, The PIP's support is growing in the rural regions..."
 azr_internal.1.a:0 "We shall watch them carefully."
 azr_internal.2.t:0 "Controversial Play"
 azr_internal.2.d:0 "A new play premiering in Baku, \"Steamship on the Mtkvari\", has caused a great deal of controversy among critics and theatre-goers. The play's protagonist is the titular steamship's captain, and the story follows his trip to deliver a message from the town of Ganja to Baku and back again. Taking place right before the Second Independence War, it shows life in Soviet Azerbaijan, and the corresponding suffering brought on by the Bolsheviks. The controversy, however, comes during scenes with workers, showing hints of prefernce towards workers' democracy and collective ownership, in direct contrast to the liberality we are trying to encourage. Though the authors have denied such an ideological connection, critics have jumped at the chance to sell editorials on the subject."
 azr_internal.2.a:0 "How Scandalous!"
 azr_internal.3.t:0 "Religious Debate!"
 azr_internal.3.d:0 "Though our government is officially secular, Musavat's attempts at presenting a modernized and progressive version of Islam has proven to be a controversial topic among the clergy. To prevent outright hostility, two Mosques - one progressive, the other conservative - have agreed to hold a public debate on the subject. The City of Baku has allowed them to use a public square as \"neutral territory\", to present a more balanced outlook.\n\nThe debate itself was lively, though it got hostile at times. Luckily, there was a neutral moderator capable of ensuring order. The conservative cleric tried to use scripture to advocate for a traditional, familiy-oriented, agrarian point of view, and the progressive cleric also tried to use scripture, but to promote a forward-thinking and liberal point of view. In the end, neither could convince the other of their position."
 azr_internal.3.a:0 "Good to see honest debate!"
 azr_internal.4.t:0 "The \"Sumqayit Daily Report\""
 azr_internal.4.d:0 "A new newspaper has been gaining national attention for its progressive centre-left stances. The \"Sumqayit Daily Report\", printed in Sumqayıt, runs publications every day on the conduct of the Independence War and the national economy. Though not a Marxist paper by any means, the Daily Report advocates for improved workers' rights and social equality, while at the same time encouraging people to find employment or develop enterprises. With a crossword and a joke section, it seems like the printing industry in Azerbaijan is recovering."
 azr_internal.4.a:0 "More power to them!"
 azr_internal.5.t:0 "Armenian Petition for Redress"
 azr_internal.5.d:0 "Despite our proclamation of ethnic equality, Armenians still do not feel entirely safe in our country. Thus, a group of Armenians have submitted a petition for redress in order to improve law enforcement responses in these matters. Our government has felt obligated to discuss it, and the most agreed-upon solution is simply to increase funds, training, and oversight. Shall we go through with this proposal?"
 azr_internal.5.a:0 "We must protect the people!"
 azr_internal.5.b:0 "We cannot at this time."
 #elections
 
 #External
 azr_external.1.t:0 "Envoy from Azerbaijan"
 azr_external.1.d:0 "The Second Russian Civil War has caused many different responses in Turkey. Fear that we will become directly involved, anticipation of the removal of the Bolshevik government, and hope that Turkey can become a regional power are all definately present, but many in the government are excited about Azerbaijan's campaign for independance. Today, a diplomatic envoy has come from Baku on behalf of the Jadidist government to ask our government to accept the establishing of diplomatic ties. Many politicians are happy to jump at this chance, but the final choice is up to us. Should we accept this offer?"
 azr_external.1.a:0 "We shall recognize Azerbaijan immediately without question!"
 azr_external.1.b:0 "Now is not the time."
 azr_external.2.t:0 "Diplomatic Ties with Turkey"
 azr_external.2.d:0 "The Turkish Government, per our request, has recognized [This.GetNameDef]. This is a great day for our government and people, as we now can get more open assistance from Turkey, economic deals with them, and provide another source of legitimacy for our government."
 azr_external.2.a:0 "A great day for the country!"
 azr_external.3.t:0 "Turkey Refuses Diplomatic Ties"
 azr_external.3.d:0 "The Traitorous Turks have refused to establish diplomatic ties between Ankara and Baku on the grounds that they do not want to \"offend potential economic partners\". While this is a thinly-veiled excuse to say that they do not want us to succeed, we cannot do anything about it for now."
 azr_external.3.a:0 "A black day for Azerbaijan."
 AZR_turkish_officers:0 "Turkish Officers"
 azr_external.4.t:0 "Baku asks for Officers"
 azr_external.4.d:0 "Azerbaijan has asked us to send an attache of experienced officers to help them with their military planning and soldier organization. Our advisors would be responsible for reviewing their situation and giving recommendations to Azeri High Command. Should we accept, we could potentially open up opportunities for more cooperation in the future. Should we do it?"
 azr_external.4.a:0 "Baku needs all the help it can get."
 azr_external.4.b:0 "We cannot spare our officers."
 azr_external.5.t:0 "Turkish Officers Arrive!"
 azr_external.5.d:0 "As we asked, Turkey has sent a contingent of officers to assist our high command and some smaller commands. Able to give recommendations based on their own experiences fighting for independence, these officers are sure to be a great boon for our army."
 azr_external.5.a:0 "Excellent!"
 azr_external.6.t:0 "Turkey Refuses Request for Officers"
 azr_external.6.d:0 "The Turkish Military has refused to send officers to aid us, as they claim to need the officers urgently at the moment. Though they would have been a great boon for the army, we will not recieve this luxury."
 azr_external.6.a:0 "Shame."
 #7-12 are hidden from the player
 azr_external.13.t:0 "The Zangezur Failure"
 azr_external.13.d:0 "We have failed to put the regions of Nagorno-Karabakh, the Zangezur Mountains, and Nakhchievan under [This.GetAdjective] Control. As a result, faith in our government has taken a hard turn for the worse. It will take a great effort to re-affirm our people of our competence."
 azr_external.13.a:0 "We have been outmatched."
 #tree
 ##Politics
 AZR_2RCW_Politics_Start:0 "Azerbaijan Marches"
 AZR_2RCW_Politics_Start_desc:0 "No longer will the Oil Fields be exploited by foreign imperialists. Azerbaijan will be a free nation where Progressiveness and Democracy can rule!"
 AZR_2RCW_Freedom_Assembly:0 "Freedom of Political Assembly"
 AZR_2RCW_Freedom_Assembly_desc:0 "Azerbajanis will have full rights to organize political groupings so as long as they do not perform illegal acts! We hope that this wills timulate political debate and strengthen our democracy."
 AZR_2RCW_Create_Parliament:0 "Create the Milli Şura"
 AZR_2RCW_Create_Parliament_desc:0 "The Azerbaijani National Council will be our legislative body. It will be responsible for the bulk of our reforms. To start, it will consist of 52 members made up of representatives from each region."
 AZR_2RCW_Judiciary:0 "An Independent Judiciary"
 AZR_2RCW_Judiciary_desc:0 "We will strive to create an independent judiciary to provide fair trials for our people. Musavat's experiences in the West should aid this effort."
 AZR_Baku_CC:0 "§YBolsheviks have formed a Central Commitee in Baku.§!"
 AZR_2RCW_Disband_Baku_CC:0 "Disband the Baku CC"
 AZR_2RCW_Disband_Baku_CC_desc:0 "Some traitorous Bolsheviks have tried to re-establish a Communist presence in Baku via a new Central Commitee. Although we have established the right of expression, this new Central Commitee unforunately breaks the criminal code, especially Article IV Section 15(b, ii), Article III Section 49, and Article V Section 45(a)."
 AZR_2RCW_Watch_Bolsheviks:0 "Watch the Bolsheviks"
 AZR_2RCW_Watch_Bolsheviks_desc:0 "Although they have the right to express themselves, we should send spies to watch over prominent Communists, just in case."
 AZR_2RCW_Reform_Curriculum:0 "Reform the Curriculum"
 AZR_2RCW_Reform_Curriculum_desc:0 "A major focus of Jadidist ideology is Education Reform. We will give the students a Secular - not Aethist - education, free of any kind of propaganda."
 AZR_2RCW_Freedom_Speech:0 "Freedom of Speech"
 AZR_2RCW_Freedom_Speech_desc:0 "Azerbaijanis deserve the freedom to epxress themselves in any way they wish, as long as it does not interfere with others' rights to do so."
 AZR_2RCW_Freedom_Religion:0 "Freedom of Religion"
 AZR_2RCW_Freedom_Religion_desc:0 "All Azerbaijanis, whether they are ethnically Azeri or not, will have full freedom to worship whatever and however they want, so as long as they do not harm others."
 AZR_2RCW_Progressive_Clerics:0 "Encourage Progressive Clerics"
 AZR_2RCW_Progressive_Clerics_desc:0 "While we have no direct authority over clerical affairs, we can somewhat encourage the clergy to align to our government's beliefs."
 AZR_2RCW_No_Clergy_Interference:0 "Total Clerical Autonomy"
 AZR_2RCW_No_Clergy_Interference_desc:0 "If we are to establish a Liberal Secular State, then we have no right to interfere with the Clergy's affairs."
 AZR_2RCW_Ethnic_Equality:0 "Establish Ethnic Equality"
 AZR_2RCW_Ethnic_Equality_desc:0 "All Ethnicities are treated equally in a Modern State. We should strive to improve ethnic relations in such a way that Azeris, Armenians, Russians, and everyone else can learn to live side-by-side."
 AZR_first_election_tt:0 "§GThe First Elections will be held!§!"
 AZR_2RCW_First_Elections:0 "The First Elections"
 AZR_2RCW_First_Elections_desc:0 "Now that political and social reforms are picking up steam, it is time to hold the first elections to the National Council."
 #Economics
 AZR_2RCW_Economics_Start:0 "Baku means Business"
 AZR_2RCW_Economics_Start_desc:0 "One of our main priorities is to develop both a civilian and a military industry in Azerbaijan so we can better fight the Bolshevik and Armenian meanaces!"
 AZR_2RCW_Infrastructure:0 "All Rails lead to Baku"
 AZR_2RCW_Infrastructure_desc:0 "It is no illusion that most economic activity in the country will be in Baku. Therefore, we should concentrate our efforts on developing railways in and around the Capital."
 AZR_Capitalism0:0 "Fledging Capitalism"
 AZR_2RCW_Private_Initiative:0 "Encourage Private Initiative"
 AZR_2RCW_Private_Initiative_desc:0 "Though Key Industries will remain in the hands of the government for the time being, it is imperative that we both encourage people to develop their own enterprises and privatize minor industries."
 AZR_2RCW_Decollectivization:0 "Decollectivize Agriculture"
 AZR_2RCW_Decollectivization_desc:0 "The Horrors of Collectivization reached all corners of the USSR, including Azerbaijan. We should set up a process that allows the farmers to decide what happens to the former Collective Farms."
 AZR_2RCW_Civilian_Industry:0 "Develop Civilian Industries"
 AZR_2RCW_Civilian_Industry_desc:0 "We must develop multi-purpose civilian industries such as construction, radio manufacturing, and consumer goods."
 AZR_2RCW_Military_Industry:0 "Develop a Defense Industry"
 AZR_2RCW_Military_Industry_desc:0 "In order to survive against the Bolsheviks, we desperately need a defense industry. We shall get to work building a factory right away."
 AZR_2RCW_Expand_Oil:0 "Expand the Oil Industry"
 AZR_2RCW_Expand_Oil_desc:0 "Our main strength is our large oil deposits. We should be working to maximize oil mining and export."
 AZR_2RCW_Export_Oil:0 "Oil Exports"
 AZR_2RCW_Export_Oil_desc:0 "We shall focus on preparing oil for export in order to raise money for other projects."
 AZR_export_oil:0 "Exporting Oil"
 AZR_import_things:0 "Importing Goods"
 AZR_expanded_imports:0 "Importing Goods"
 AZR_2RCW_Import_Goods:0 "Import Goods"
 AZR_2RCW_Import_Goods_desc:0 "By fostering positive trade relations with other countries, we can easily import goods and resources that we need for our manufacturing."
 AZR_subsidization:0 "Subsidization Efforts"
 AZR_2RCW_Internal_Subsidies:0 "The Ganja Program"
 AZR_2RCW_Internal_Subsidies_desc:0 "Named after the town of Ganja, the Ganja Program would be a government-run system where profits from oil exports would go into the subsidization of private industries around the country, especially outside of Baku."
 AZR_2RCW_Diversify:0 "Diversify our Industries"
 AZR_2RCW_Diversify_desc:0 "An economy based solely on one industry is incredibly dangerous. We should begin encouraging other industries to take root."
 AZR_2RCW_Encourage_Consumer_Industries:0 "Encourage Consumer Industries"
 AZR_2RCW_Encourage_Consumer_Industries_desc:0 "We should be encouraging consumer industries to expand into larger firms to properly provide employment and produce goods."
 AZR_2RCW_Agricultural_Subsidies:0 "Agricultural Subsidies"
 AZR_2RCW_Agricultural_Subsidies_desc:0 "We should be encouraging the development of a strong and modern agricultural sector, especially since we have the largest agricultural basin in the Region."
 AZR_Agro_Subs:0 "Agricultural Subsidies"
 AZR_2RCW_Bank_of_Azerbaijan:0 "Establish the AMB"
 AZR_2RCW_Bank_of_Azerbaijan_desc:0 "The Azehrbaycan Mehrkehzi Bankı, or Central Bank of Azerbaijan, will be our national bank. We hope that it can provide stability for our economic investors, and financial security for our people."
 #military
 AZR_2RCW_Military_Start:0 "Organize the Military"
 AZR_2RCW_Military_Start_desc:0 "Our military is still in a state of mild disorganization. We should reorganize it to correct this problem."
 AZR_2RCW_Firearms:0 "Open the Workshops"
 AZR_2RCW_Firearms_desc:0 "We should take advantage of our education programs and put the engineers to work designing new weapons for our army."
 AZR_2RCW_Doctrines:0 "Explore New Tactics"
 AZR_2RCW_Doctrines_desc:0 "To properly overpower our enemies, we must be able to outwit them. To that end, we should have High Command explore new tactics for our soldiers."
 AZR_2RCW_Guerilla_Warfare:0 "Adopt Guerilla Strategies"
 AZR_2RCW_Guerilla_Warfare_desc:0 "Hit-and-run shall be our new motto! Our soldiers will be able to deal damage to an enemy by being unpredictable, decreasing their ability to adapt."
 AZR_2RCW_Mountain:0 "Mountaineering Forces"
 AZR_2RCW_Mountain_desc:0 "As The Caucasus is a mountain range, it is only natural that much of our territory is mountainous. Ergo, we should train some soldiers specifically to handle this difficult terrain."
 AZR_2RCW_Motorization:0 "Invest in Motor Vehicles"
 AZR_2RCW_Motorization_desc:0 "As we have a large oil drilling industry, we could afford to invest in some motorized vehicles, as we would have the fuel to supply them."
 AZR_2RCW_Support:0 "Auxillary Brigades"
 AZR_2RCW_Support_desc:0 "The Land Army of Azerbaijan would be stronger if it had auxillary brigades such as a corps of engineers or field hospitals."
 AZR_2RCW_Artillery:0 "Baku Artillery Workshop"
 AZR_2RCW_Artillery_desc:0 "Modern Artillery is absolutely necessary in order to better batter the enemy batallions and set up an unbelievable victory."
 AZR_2RCW_Expand_Operations:0 "Expand Military Production"
 AZR_2RCW_Expand_Operations_desc:0 "It is imperative that we expand our production capabilities to keep up with new technologies. To that end, a new factory must be constructed."
 AZR_increase_production:0 "Increased Production"
 AZR_2RCW_Do_With_What_We_Have:0 "Make Do With What We Have"
 AZR_2RCW_Do_With_What_We_Have_desc:0 "We cannot afford to build more factories at the moment. We must thus spend resources improving our current production lines."
 #foreign
 AZR_2RCW_Foreign_Start:0 "Reach out to Turkey"
 AZR_2RCW_Foreign_Start_desc:0 "Being a fellow Turkic nation, Turkey is our natural friend and ally. We should reach out to them to gain recognition."
 AZR_tur_recognized:0 "§GTurkey has recognized us§!"
 AZR_tur_unrecognized:0 "§RTurkey has refused to recognize us§!"
 AZR_2RCW_Turkish_Attache:0 "Invite Turkish Officers"
 AZR_2RCW_Turkish_Attache_desc:0 "We should ask Turkey to send us some of their officers. This way, we can use their experiences to help empower our military."
 AZR_2RCW_Turkish_Trade:0 "Invite Turkish Investment"
 AZR_2RCW_Turkish_Trade_desc:0 "We should encourage Turkish firms to invest in Azerbaijan. This will help improve both countries' economies and relations."
 AZR_2RCW_Befriend_Persia:0 "Reach out to Iran"
 AZR_2RCW_Befriend_Persia_desc:0 "Despite the large amount of Azeris living in Iran, we should reach out to Tehran to ensure that our relations are not hostile."
 AZR_improve_relations:0 "Mutual Cordiality"
 AZR_2RCW_Befriend_Georgia:0 "Approach Georgia"
 AZR_2RCW_Befriend_Georgia_desc:0 "In order to avoid a repeat of the chaos in the Southern Caucasus after 1918, we must approach others in the regions. Armenia is not receptive, so we must approach Georgia."
 AZR_2RCW_Befriend_Dagestan:0 "Cordiality with Makhachkala"
 AZR_2RCW_Befriend_Dagestan_desc:0 "To our North, [DAG.GetNameDef] is fighting for its independence just like we are. We should make sure that there are no diplomatic or military incidents on either side."
 AZR_2RCW_Western_Recognition:0 "Western Recognition"
 AZR_2RCW_Western_Recognition_desc:0 "We should approach western governments to gain some legitimacy for ours. If they see the progress we are making, perhaps they will accept us as one of them."
 #decisions
 ##Escalation with Armenia
 ARM_AZR_Escalation:0 "The Zangezur Conflict"
 ARM_AZR_Escalation_desc:0 "Both Armenia and Azerbaijan claim the regions of the Zangezur Mountains, Nagorno-Karabakh, and Nakhchievan for themselves. If we are to secure control over these areas, we must act! However, as our efforts increase in intensity, our enemy will redouble theirs...\n\n§YCurrent Tension: [?Global.SC_Tension?0]§!\n§RIf Tension reaches 100, a full-scale war will break out!§!"
 ARM_AZR_planning_attack:0 "§YAn Attack is Already Being Prepared!§!"
