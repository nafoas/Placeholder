 #ideas
 AZR_ethnic_tensions:0 "Ethnic Tensions"
 AZR_ethnic_tensions_desc:0 "Although the territory first seized by Azeri militias are generally Azerbaijani in composition, Azerbaijan is only about 60% Azeri in total. The rest are genrally Russians and Armenians, although many Lezgins and other ethnicities also live in our territory. Though the smaller groups prose little problems, the Armenians, Russians and Lezgins are sure to agitate for equality and even separatism."
 AZR_ethnic_tensions2:0 "Ethnic Tensions"
 AZR_ethnic_tensions_2desc:0 "Although the territory first seized by Azeri militias are generally Azerbaijani in composition, Azerbaijan is only about 60% Azeri in total. The rest are genrally Russians and Armenians, although many Lezgins and other ethnicities also live in our territory. Though the smaller groups prose little problems, the Armenians, Russians and Lezgins are sure to agitate for equality and even separatism."
 AZR_oil_focus:0 "Oil-Focused Economy"
 AZR_oil_focus_desc:0 "At this point in time, Azerbaijan is the primary supplier of Soviet Oil. This is due to a number of Soviet Economic Investment in the area. Though our oil production is first-rate, our other industries are severely lacking."
 AZR_oil_focus_less:0 "Oil-Focused Economy"
 AZR_oil_focus_less_desc:0 "At this point in time, Azerbaijan is the primary supplier of Soviet Oil. This is due to a number of Soviet Economic Investment in the area. Though our oil production is first-rate, our other industries are severely lacking. However, the government has recently begun programs meant to diversify the economy into other sectors."
 AZR_oil_focus1:0 "Oil-Focused Economy"
 AZR_oil_focus1_desc:0 "At this point in time, Azerbaijan is the primary supplier of Soviet Oil. This is due to a number of Soviet Economic Investment in the area. Though our oil production is first-rate, our other industries are severely lacking. Recently the government has begun to expand our oil industries."
