 #Navy Factionalism
 JAP_navy_factionalism:0 "Navy Factions"
 JAP_navy_factionalism_desc:0 "There are two factions differing in opinion whether Japan should accept the Washington, and London Naval Treaty or not. The Fleet Faction represents bettermost admirals who support the abolition of the treaty and want to oppose the United States and the United Kingdom. The Treaty Faction represents innovative and minority admirals who support to maintain the naval treaties and some of them hope to build more aircraft carriers. \n\nThe Fleet Faction's Influence is §Y[?JAP.JAP_Fleet_Points]§!%. \nThe Treaty Faction's Influence is §Y[?JAP.JAP_Treaty_Points]§!%. \n\n§YIf one faction's influence goes 100%, you will be able to abort the Washington Naval Treaty or remain as faithful guardian of the treaties.§!"
 JAP_navy_explanation:0 "Navy Factionalism Explanation"
 
 #Japanese Korea
 JAP_japanese_korea:0 "General-Government of Chōsen"
 JAP_japanese_korea_desc:0 "Joseon, in Japanese, Chōsen, which was annexed by the Empire of Japan in 1910 by the Japanese-Korean annexation treaty, has been Japan's most important colony for the past 20 years. Chōsen is the main producer of foods that is deficient in the Japanese mainland, and cheaper grain compared to the mainland has given Japan enough value to cover its deficit. In addition, after the Manchurian Incident in 1931, Chōsen has played a vital role in advancing to the Chinese continent. However, Koreans are not completely obedient to Japan. The huge independence demonstrations in 1919 and 1926 forced the Japanese to change their colonial policy, and the growing number of literacy classes encouraged Koreans to aspire to independence. This is very negative for the Japanese Empire, and Chōsen should remain a loyal colony of the Japanese Empire forever.\n\nThe current §OGovernor-General§! of Korea is §Y[ROOT.ChosenSoutoku]§!.\n\nThe §CTotal Literacy Rate§! of Korea is §Y[?JAP.JAP_KOR_Literacy]§!%. \nThe §CConsciousness Level§! of Korea is §Y[?JAP.JAP_KOR_Consciousness]§!. \nThe §CMilitancy Level§! of Korea is §Y[?JAP.JAP_KOR_Militancy]§!. \n\nYou can pass some §Yinitial reforms§! if the §CConsciousness Level§! of Korea is §Ghigh enough§!. \n\n§RIf Korea's Militancy Level reaches 10, the Koreans will revolt!§!"

