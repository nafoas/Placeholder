 #Army Factionalism
 JAP_army_factionalism:0 "Army Factions"
 JAP_army_factionalism_desc:0 "There are two factions competing each other in order to seize the power of the army. The Tōseiha, constitued with the technocrat and reformist officers, supports southern expansion and technological developments to stand against the Western Powers. However, the Kōdōha believes the superiority of the power of will, which can overcome the inferiority of technical skills. Kōdōha thinks that their biggest enemy is the Soviet Union, and wants to prepare their army to march into north. \n\nThe Tōseiha's Influence is §Y[?JAP.JAP_Toseiha_Points]§!%. \nThe Kōdōha's Influence is §Y[?JAP.JAP_kodoha_Points]§!%. \n\n§RIf one faction's influence goes 100% before Feburary 26th of 1936, the coup will be triggered!§!"
 JAP_army_explanation:0 "Army Factionalism Explanation"
