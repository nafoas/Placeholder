 #Debt Management
 JAP_debt_management:0 "National Debt Management"
 JAP_debt_management_desc:0 "The national debt began to become a national problem for Japan from the Russo-Japanese War of 1905. From the war, Japan's ever-increasing debt seriously worsened its financial situation, which was the root cause of the country's nearly 30-year-long slump. Moreover, the growing influence of the military has led to the expansion of the military budget and the government's budget deficit has become even worse. Taking office in 1930 as acting Treasury Minister, Takahashi Korekiyo has stepped up as a lifesaver to deal with the situation, but the military seems to be looking at him with frustration. \n\nCurrently, Japan's ratio of National Debt to GDP is §Y[?JAP.JAP_Debt]§!%. \n\n§RIf the National Debt exceeds 150% when not in wartime, there will be irreversible pressure on the Japanese government...§!"
 JAP_debt_monetization:0 "General Debt Monetization"
 JAP_Debt_Gain_0.5:0 "Our National Debt will increase by §Y0.5§!%."
 
 #Japan 2rcw
 JAP_2rcw_back_RFP_FER:0 "Our interests in Siberia"
 JAP_2rcw_back_RFP_FER_desc:0 "With the collapse of the USSR, it is clear that we must look after our interests in Siberia. We should spend our resources arming nations in the region in order to take down the Bolshevik Menace once and for all, and force the world to recognize Japan's superiority!"
 JAP_2rcw_Send_Guns:0 "Send Guns to [From.GetNameDef]"
 JAP_2rcw_Send_Support:0 "Send Support Equipment to [From.GetNameDef]"
 JAP_2rcw_artillery:0 "Send Artillery to [From.GetNameDef]"
 
 #North China Buffer State Strategy
 JAP_north_china:0 "North China Buffer State Strategy"
 JAP_north_china_desc:0 "Manchuria and Mongolia have been considered Japan's "Lifeline" since 1890s. Mantetsu, which was built in 1905 when Japan won the Russo-Japanese War, and Manchukuo, which was established as a result of the Manchurian Incident in 1931, have brought Japan a step closer to peace and independence in East Asia. But to wipe out the threat of the Soviet Union and Western forces, we must drive their puppet government out of North China, and for eventual national self-reliance, we must establish an independent government with the cooperation of the locals and warlords. Permission has been granted, and it's time to act."
 JAP_assassination:0 "The Assassination of Hu Enpu and Bai Yuhuan"
 JAP_tada:0 "The Tada Speech"
 