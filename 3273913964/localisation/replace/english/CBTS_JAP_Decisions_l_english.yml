#Political Factionalism
 JAP_political_factionalism:0 "Political Factions"
 JAP_political_factionalism_desc:0 "There are three factions vying for next prime minister of Japan. The Yokusan Faction represents the vassals, army officers, and innovative bureaucrats who support the prince Konoe Fumimaro. The Kyōwa Faction represents the moderate bureaucrats and diplomats who support the well-known minister Hirota Kōki. The Kannen Faction represents the conservative and pro-Fascists who support the ex-minister Hiranuma Kiichirō. \n\nThe Yokusan Faction has §Y[?JAP.JAP_Konoe_Points]§! Points of Influence.\nThe Kyōwa Faction has §Y[?JAP.JAP_Hirota_Points]§! Points of Influence.\nThe Kannen Faction has §Y[?JAP.JAP_Hiranuma_Points]§! Points of Influence."
