   ### Events ###
   
 mongolia_internal.1.t:0 "Anandyn Amar becomes Prime Minister"
 mongolia_internal.1.d:0 "With the revealing of his Japanese ties, Prime minister Peljidiin Genden has been removed from office. Head of state Anandyn Amar will take over his position as head of government. His place will be taken by Dansranbilegiin Dogsom."
 mongolia_internal.1.a:0 "Good Luck to him!"
 
 mongolia_internal.2.t:0 "Dansranbilegiin Dogsom Arrested"
 mongolia_internal.2.d:0 "It appears the Japanese conspiracy has grown larger than we ever believed. Head of state Dansranbilegiin Dogsom has even been revealed to be part of the reactionary plot. He has been expelled from his position as head of state, and has been replaced with immediate effect."
 mongolia_internal.2.a:0 "That should show them..."
 
 mongolia_internal.3.t:0 "Mongolian-Soviet Treaty"
 mongolia_internal.3.d:0 "In an conference in our capital today, representatives of our nation and the Soviet Union have jointly signed a treaty of mutual defence. As part of the terms of the treaty, the Soviets will increase their presence in the country, providing a deterrant against potential threats from China or Japan."
 mongolia_internal.3.a:0 "We March Forward Together!"

 mongolia_internal.4.t:0 "Mongolian-Soviet Treaty"
 mongolia_internal.4.d:0 "In an conference in the Mongolian capital Ulaanbaatar, representatives of both nations have signed a treaty of mutual defence. As part of the terms of the treaty, we will also be able to ramp up our military presence in Mongolia, strengthening our position in Asia as a whole."
 mongolia_internal.4.a:0 "We March Forward Together!"
 
 mongolia_internal.5.t:0 "Purges in Mongolia"
 mongolia_internal.5.d:0 "With the increasing threat of a reactionary revolt, our forces across Mongolia have begun a campaign of re-education and purges, to ensure the continuing prosperity of our state. We will find those disloyal to the state, and they will all be destroyed!"
 mongolia_internal.5.a:0 "It is neccessary"
 
 mongolia_internal.6.t:0 "Khorloogiin Choibalsan Declares Martial Law"
 mongolia_internal.6.d:0 "With the fall of the USSR, Marshal Khorloogiin Choibalsan today called an emergency convention of the party, in which he declared martial law over the entirety of the Mongolian Peoples Republic. Following his statement, he also declared himself to be the interim Chairman of the state Little Khural. With his power already uncontested within Mongolia, and the military eagerly supporting him, for the rest of the nation, there is no choice but to follow his path."
 mongolia_internal.6.a:0 "The Mongolian Revolution will not die!"
 
 mongolia_internal.7.t:0 "Purges End"
 mongolia_internal.7.d:0 "Following three years of purges, the nation is finally secure. Reactionaries, Chinese collaborationists, and Japanese conspirators have all been eliminated from our country, and we can finally work to creating a better state for the future."
 mongolia_internal.7.a:0 "It paid off in the end."
 
 mongolia_internal.8.t:0 "The Lkhümbe Affair"
 mongolia_internal.8.d:0 "Following the Khovsgol Rebellion, we have undertaken a swift crackdown of the loyalty of the political class. It has since been determined that Buryat First Secretary Jambyn Lkhümbe has been leading a counterrevolutionary, Japanese-collaborating group! He must be eliminated at once. Of course, his ties within the military must also be dealt with..."
 mongolia_internal.8.a:0 "This must be for the best..."
 
 mongolia_internal.9.t:0 "The Military Recovers from Purges"
 mongolia_internal.9.d:0 "Following our recent purges as part of the Lkhümbe Affair, many higher-ranking officers in the military have been put down. However, our recruitment and training efforts have paid off, and the legacy of the incident has now all but disappeared."
 mongolia_internal.9.a:0 "Good for us."
 
 mongolia_internal.10.t:0 "Soviet Pressure to purge Lamas"
 mongolia_internal.10.d:0 "With our relationship with the USSR secured, in a telegram from Moscow, Soviet General Secretary Joseph Stalin has asked us to begin a purge of the Lama population across the country. He claims that in order to ensure the continiing prosperity of the Mongolian state, the 'enemies within' must fully be eradicated"
 mongolia_internal.10.a:0 "Perhaps another time"
 
 mongolia_internal.11.t:0 "The Moscow Affair"
 mongolia_internal.11.d:0 "A few days ago, Prime Minister Peljidiin Genden was called to Moscow for a meeting with top Soviet party officials, including Comrade Stalin himself. The meeting between the two men was far from a success, originally meant to reconcile the two men. It ended with Comrade Peljidiin Genden personally attacking Comrade Stalin before storming out of the Kremlin. Comrade Peljidiin Genden has since returned to Mongolia, but relations between him and the Soviet leadership may now be beyond reconciliation."
 mongolia_internal.11.a:0 "Stalin will not be happy..."
 
 mongolia_internal.12.t:0 "Khorloogiin Choibalsan removes Peljidiin Genden from office"
 mongolia_internal.12.d:0 "Following the final breakup between Prime Minister Peljidiin Genden and Soviet General Secretary Joseph Stalin, the Mongolian People's Army, under orders from Marshall Khorloogiin Choibalsan, have removed Comrade Peljidiin Genden from office, on accouns of sabotaging Soviet-Mongolian relations. His successor will be Anandyn Amar, who will serve is second term as prime minister of the nation. As part of this maneuver, Khorloogiin Choibalsan will also become the new Minister of Internal Affairs."
 mongolia_internal.12.a:0 "Maybe we can finally start going somewhere!" 
 
 mongolia_internal.13.t:0 "Anandyn Amar arrested"
 mongolia_internal.13.d:0 "After a brief trial in Ulaanbaatar, Prime Minister Anandyn Amar has today been arrested on the charges of assisting anti-government forces and neglecting the defence of the country. He has been declared a traitor to the revolution and removed from his position as prime minister. Following this, the military, acting under Comrade Khorloogiin Choibalsan, was quick to arrest him. Khorloogiin Choibalsan has since declared himself the new Prime Minister of Mongolia, adding it to his additional roles as Minister of Internal Affairs, Minister of War, and Marshal of the Army."
 mongolia_internal.13.a:0 "Well, there goes another Japanese Spy" 
 
 mongolia_internal.14.t:0 "Gelegdorjiin Demid dies"
 mongolia_internal.14.d:0 "Sad news has reached Ulaanbaatar today. While en route to Moscow aboard the Trans-Siberian railway, Marshal Gelegdorjiin Demid has today died of Food Poisioning. The nation is in tears over this incident, even including his fellow marshal and longtime rival Khorloogiin Choibalsan. Khorloogiin Choibalsan has since become the Commander-in-Chief of the entire Mongolian People's Army, and has been given Gelegdorjiin Demid's role of Minister of War"
 mongolia_internal.14.a:0 "A Sad Day for All" 
 
 mongolia_internal.15.t:0 "Soviet Exile Divisions Arrive"
 mongolia_internal.15.d:0 "With the collapse of the Soviet Union, ex-Soviet forces in Siberia have found themselves marooned with the threat of destruction by the White armies. Some of them have entered Mongolia and pledged service to Khorloogiin Choibalsan, with the sole aim of defending the remnants of the worldwide revolution."
 mongolia_internal.15.a:0 "We will need all we can get..." 
 
 mongolia_external.1.t:0 "An Invasion of Mongolia?"
 mongolia_external.1.d:0 "With the collapse of the Soviet Union, the Mongolian government under Marshal Khorloogiin Choibalsan has found itself weak and isolated. A conquest of Mongolia would surely be swift, and would assist the creation of our Co-Prosperity sphere, however, some critics claim that an invasion of the sparsely populated steppe country is not worth our effort."
 mongolia_external.1.a:0 "Mongolia will be ours!" 
 mongolia_external.1.b:0 "Lets finish one war before we start another" 
 mongolia_external.1.c:0 "Mongolia is not worth the resources." 

 mongolia_external.2.t:0 "An Invasion of Mongolia?"
 mongolia_external.2.d:0 "With our wars over, Mongolia has once again been put at the front of our army plans. We have since only grown stronger, and the Mongolian state is still barely existing. A conquest of it would once again be quick and easy, however, some critics are still wondering if it would even be worth the effort to govern such a land."
 mongolia_external.2.a:0 "Mongolia will be ours!" 
 mongolia_external.2.b:0 "Mongolia is not worth the resources." 

 mongolia_external.3.t:0 "An Invasion of Mongolia?"
 mongolia_external.3.d:0 "Our collaborators in the occupied Northeast report that the Japanese have begun a full-scale invasion of Outer Mongolia. Many in our military high command fear that they will use Mongolia to outflank our forces in the north. Some have suggested a pre-emptive attack into Mongolia ourselves to stop this threat, however, many doubt our army's ability to extend the frontlines even further."
 mongolia_external.3.a:0 "We must stop the Japanese!" 
 mongolia_external.3.b:0 "We cannot do this right now." 
 
 mongolia_external.4.t:0 "Japanese Invasion!"
 mongolia_external.4.d:0 "Following the collapse of the Soviet Union, our lands have always looked ripe for the picking. The Japanese empire has begun a full-scale invasion of our lands from Manchuria, and their Mongol puppet state has already begun claiming our entire territory. If anything is certain in this coming storm, it is that we will fight to the end! For the Revolution! For Mongolia!"
 mongolia_external.4.a:0 "For Mongolia!" 
 
  ### ideas ###
 MON_legacy_of_1932:0 "Legacy of the Khovsgol Rebellion"
 MON_legacy_of_1932_desc:0 "Despite its swift crushing, the legacy of the Khovsgol Rebellion of 1932 lives on in Mongolia. Across the steppe, small bands of rebels still resist our rule, and with many rebel leaders still unaccounted for, the position of our government is not secure."
 MON_military_dictatorship:0 "Military Rule"
 MON_military_dictatorship_desc:0 "With the fall of the Soviet Union, Khorloogiin Choibalsan has assumed direct control over the Mongolian State. Although now isolated from much of the world, he is determined to ensure the Mongolian revolution continues, by any means neccessary."
 MON_purged:0 "Political Purges"
 MON_military_purge:0 "Military Purges"
 
