lit_internal.3.t:0 "Iron Wolf Coup Prevented"
lit_internal.3.d:0 "Today, few groups of Iron Wolf and rebelled officers tried to seize the most important buildings in Kaunas. They were quickly broken up by the army and police and their leaders were arrested."
lit_internal.3.a:0 "An authoritarian regime can accept only one authority, MINE!"