lit_internal.2.t:0 "Lithuanian Coup of 1934"
lit_internal.2.d:0 "Today, numerous groups of Iron Wolf (with the support of rebel soldiers and officers) have seized the most important buildings in Kaunas. The parliament building and the Presidential Palace were seized quickly, and the fate of the president and other major people in the country remains unknown. Currently, power is in the hands of Augustinas Voldemaras and his supporters."
