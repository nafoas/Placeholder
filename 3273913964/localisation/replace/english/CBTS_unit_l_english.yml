 motorcycle_recon:0 "Motorcycle Recon Company"
 motorcycle_recon_desc:0 "A reconnaissance battalion consisting of motorcycles, useful for locating and spotting enemy troops."
 bicycle_recon:0 "Bicycle Recon Company"
 bicycle_recon_desc:0 "Bikes are perhaps not seen as the most ideal transportation method for the soldiers, however it is both cheap to manufacture and efficent."
 light_infantry:0 "Light Infantry"
 light_infantry_desc:0 "A professional Infantry Battalion that is not equiped with heavy guns like Machine Guns or Infantry Mortars. Usually more mobile in terrains like Jungle, Forest or Mountains than the heavier equipped infantry, but at a cost of being less effective in siege warfare and in open combat."
 garrison_desc:0 "A troop stationed in in a strategically important location."
 militia:0 "Militia"
 militia_desc:0 "A unit of non-professionals, usually called up in the face of a war."
 motorcycle_battalion:0 "Motorcycle Battalion"