 #ideas
 SA_chaco_war:0 "The Chaco War"
 SA_chaco_war_desc:0 "The northern part of the Gran Chaco lowlands are a dry, arid, rural area contested by both Bolivia and Paraguay. Bolvia has been moving through the Chaco region since the mid of 1932, after prospectors claimed the area was likely to contain much oil, which both countries want to claim for their own. Additionally Bolivia wishes to take control of the Paraguay River running through Chaco, and thus access to the sea. The war has soon come to be known as the 'War of Thirst' as the area is so dry and desolate, and because of the difficulty of getting supplies to soldier."
 SA_american_occupation:0 "United States Occupation"
 SA_american_occupation_desc:0 "Our country is still under the military occupation of the United States of America. We can only hope that they withdraw soon..."
 PAR_paraguayan_army:0 "The Paraguayan Army"
 PAR_paraguayan_army_desc:0 "Paraguay possesses a small population and industrial base, and so must use their army accordingly. They make up for this with a strong pubic enthusiasm for their war in the Chaco, native Guarani knowledge of the forests, and tactics emphasising infiltration and encirclement rather than direct conflict."

