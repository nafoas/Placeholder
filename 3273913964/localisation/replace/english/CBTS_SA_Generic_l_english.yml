 #event
 south_america_news.1.t:0 "The Chaco War"
 south_america_news.1.d:0 "After many attempts to find a diplomatic solution by part of the United States and neighboring South American nations, Paraguay has decided to formally declare war on Bolivia after many skirmishes through the Great Chaco region by Bolivian soldiers and counter attacks by a part of the Paraguayan army.\nThe Gran Chaco region has been a source of great conflict over the past decades, which intensified after the discovery of oil in the Andean foothills that sparked speculation that the Chaco might prove a rich source of petroleum."
 south_america_news.1.a:0 "Interesting."
 south_america_news.1.b:0 "Our borders are unsafe"
 south_america_news.2.t:0 "The Chaco War is Over"
 south_america_news.2.a:0 "In a series of surprising events, the South American nation of Paraguay has bested its larger neighbour Bolivia in a series of battles among the arid, and supposedly oil-rich, Chaco frontier. Although the Bolivian army began the war with numerical and technological advantages, Paraguayan armies, aided by native scouts, were able to encircle Bolivian forces and starve them of valuable and sparse water sources. With almost complete Paraguayan control of the Chaco region, and Paraguayan troops beginning to advance into the Bolivian highlands, the Bolivian and Paraguayan governments have signed a cease-fire agreement with immediate effect. For now, at least, Paraguay has won a priceless victory.\nBolivia has been humiliated once more!"
 south_america_news.2.b:0 "The war in the Gran Chaco has ended today with a complete Paraguayan capitulation to its stronger neighbour Bolivia. Bolivian forces, in a series of costly assaults, were able to gradually push back the determined Paraguayan forces from their defences in the Chaco, and now sit directly at the Paraguayan capital, Asunción. After a brief artillery bombardment of the capital, The Paraguayan government has approached Bolivia and offered to concede the entirety of the supposedly oil-rich Chaco region, and has offered to surrender access to the Paraguay river, providing Bolivia with a long-lost sea access. For the time being, Bolivia sits as the undisputed controller of the region.\nParaguay has been humiliated once more!"
 south_america_news.2.o:0 "Congratulations to the victors."
 south_america_news.2.ac:0 "A victory that will be told for generations to come!"
 south_america_news.2.ad:0 "A catastrophic disaster!"
 south_america_news.2.bc:0 "Antofagasta has been avenged."
 south_america_news.2.bd:0 "A Second Cerro Corá."
 south_america_external.1.t:0 "Victory in the Chaco War."
 south_america_external.1.d:0 "We have done it! Our armies have secured the entirety of the Chaco region, all the way to the feet of the Andes, and with the signing of a ceasefire with Bolivia, the Chaco is now firmly in our hands. We can now work towards integrating the Chaco region into our country, and exploiting the region for its resources."
 south_america_external.1.a:0 "We are Victorious!"
 south_america_external.2.t:0 "Victory in the Chaco War"
 south_america_external.2.d:0 "Our armies have advanced through the Chaco region, and today have reached the Paraguay river, just across from Asuncion itself. With the signing of a ceasefire with Paraguay, the Chaco is now firmly in our hands. We can now work towards integrating the Chaco region into our country, and exploiting our new riverine access to the seas..."
 south_america_external.2.a:0 "We are Victorious!"
 south_america_external.3.t:0 "Defeat in the Chaco War"
 south_america_external.3.d:0 "Despite our best efforts, the Chaco war has been lost, and our government has been forced to sign a ceasefire agreement. The Chaco region has, for now, permanantly been lost to us, and our nation has been humiliated once more."
 south_america_external.3.a:0 "A Disaster!"
 south_america_external.4.t:0 "Chaco War Border Treaty"
 south_america_external.4.d:0 "Following our victories in the Chaco war, we have today formalized our border with Bolivia, as part of the agreement, our armed forces have been ordered to pull out of the occupied Charagua region, but in exchange, the Bolivian government will abandon all claims to the Southern parts of the Chaco. Our victory can finally be confirmed."
 south_america_external.4.a:0 "It is for the best."
 south_america_external.5.t:0 "Bolivia proposes Ceasefire"
 south_america_external.5.d:0 "Despite our victories, we have been unable to secure a descicive victory in the Chaco War, and Bolivia still stands strong. The Bolivians have offered us a cease fire, we will retain all territories in the Chaco currently under our control, and they will retain all of theirs. News has already broken out of this agreement to our soldiers, and to them, the war is already over. It would devastate the country if we were to reject this and continue this long, bloody war..."
 south_america_external.5.a:0 "We Agree!" 
 south_america_external.6.t:0 "Ceasefire with Paraguay"
 south_america_external.6.d:0 "Despite our victories, we have been unable to secure a descicive victory in the Chaco War, and Paraguay still stands strong. Our soldiers have already taken it to themselves to end the war, and as if by a coordinated agreement, the entire front lies quiet for the first time in years. Soldiers are exchanging greetings and gifts. To them, the war is already over. It would devastate the country if we were to continue this long, bloody war, and the Paraguayans can probably say the same..."
 south_america_external.6.a:0 "Propose the Agreement" 
