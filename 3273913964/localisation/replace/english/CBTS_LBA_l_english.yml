 ita_lba.1.t:0 "Shots fired across the border"
 ita_lba.1.d:0 "Yesterday morning at the Italo-Egyptian border a number of shots were fired across at an Italian border patrol by unknown assailants. There were approximately 3 gunmen, although the rising sun behind them made exact details impossible to make out, and by the time reinforcements arrived they had already fled back into the sand dunes. The British and Egyptian governments have failed to provide any suspects despite claims that they have investigated extensively, but this is to be expected given that they allow the exiled Emir Idris to reside in their country."
 ita_lba.1.a:0 "It is unacceptable that the British turn a blind-eye to this"
 ita_lba.2.t:0 "Explosions in Benghazi"
 ita_lba.2.d:0 "An explosion rocked the streets of Benghazi recently as a number of improvised bombs went off in key military and administrative points, killing 10 and wounding 89. Reinforcements to the sites were then fired at by Libyan partisans from adjacent buildings, leading to a brief but bloody gunfight as police responders were taken by surprise. While the damage was overall minimal and the conflict brief, troops from the /"Regio Corpo Truppe Coloniali della Libia/" have journeyed to the capital by rail to assist in suppression of further dissent."
 ita_lba.2.a:0 "How can they still manage to pull this off?"
 ita_lba.3.t:0 "Italian settlers murdered"
 ita_lba.3.d:0 "Troubling news has arrived from the rebellious Libya; over the past few days Italian settlers have been murdered in increasingly gruesome ways on the outskirts of Tripoli - prompting government warnings to remain indoors while gendarmarie forces secure the area. This wave of anti-Italian resentment has likely been triggered by our repressive policies against the starving and destitute natives, and from a new generation growing up without the military campaigns of suppression in the early 30s."
 ita_lba.3.a:0 "The situation is growing dire"
 ita_lba.4.t:0 "The Senussi Revolt!"
 ita_lba.4.d:0 "The Senussi order has once again risen against our rule (TODO THIS LOC)."
 ita_lba.4.a:0 "Stop this Insurgency!"
 ita_lba.4.b:0 "For Libya!"
 ita_lba.5.t:0 "Revolt in Libya!"
 ita_lba.5.d:0 "The Senussi order has revolted against Italy (REDO THIS LOC)"
 ita_lba.5.a:0 "They will be crushed once again!"
 ita_lba.5.b:0 "We will be Victorious!"
 ita_lba.5.c:0 "The Italian Empire wanes further" 
 ita_lba.6.t:0 "The Senussi Revolt"
 ita_lba.6.d:0 "The Senussi have revolted, it would be a good idea to offer them an alliance to defeat the Italian oppressors."
 ita_lba.6.a:0 "Offer Libya an Alliance"
 ita_lba.6.b:0 "They are useless to us."
 ita_lba.7.t:0 "Britain offers an Alliance"
 ita_lba.7.d:0 "The British commander in Libya has offered us an alliance against the Italian oppressors!"
 ita_lba.7.a:0 "Accept their offer"
 ita_lba.7.b:0 "From one oppressor to another, no!"
 ita_lba.8.t:0 "Libya Accepts"
 ita_lba.8.d:0 "After talks with the Senussi leader, Sayyid Idris, he has confirmed that they will fight side by side with us against the Italians. Let us combined forces kick out the Italians from Libya!"
 ita_lba.8.a:0 "Great"
 ita_lba.9.t:0 "Libya Declines"
 ita_lba.9.d:0 "After talks with the Senussi leader, Sayyid Idris, he has surprisingly rejected our offer of an alliance. Despite this setback, he has assured us that their forces will not fight british soldiers & allies, and will not obstruct our advances in Libya."
 ita_lba.9.a:0 "Good Luck to them, then."
 ita_lba.10.t:0 "The Occupation of Libya"
 ita_lba.10.d:0 "The Italians have been kicked out of Libya, and the territory is now firmly in our allies' hands. The French have already expressed interest at seizing the Fezzan, it would be wise to occupy the colony."
 ita_lba.10.a:0 "Propose the Partition"
 ita_lba.10.b:0 "We will decide Libya's fate at the peace table"
 ita_lba.11.t:0 "Britain Wants to Parition Libya"
 ita_lba.11.d:0 "The British have expressed interest in Partitioning Libya with us. Should we agree to their terms?"
 ita_lba.11.a:0 "The Proposal is Acceptable"
 ita_lba.11.b:0 "We will not hand over any territory to the British!"
 ita_lba.12.t:0 "The French Agree"
 ita_lba.12.d:0 "The French have agreed to the terms of the partition of Libya."
 ita_lba.12.a:0 "Send in the Troops"
 ita_lba.13.t:0 "The French Decline"
 ita_lba.13.d:0 "The French have declined to the terms of the partition of Libya."
 ita_lba.13.a:0 "Then we'll resolve it at the peace table"
 ita_lba.13.b:0 "We don't need a partition!"
 ita_lba.14.t:0 "The United Kingdom recognizes our government"
 ita_lba.14.d:0 "The United Kingdom has today recognized our government in Libya as a fully independent state, ending fears among our elites that the British would restore colonial control over our country with the Italians booted out."
 ita_lba.14.a:0 "Great!"
 ita_lba.15.t:0 "Defeat in Libya"
 ita_lba.15.d:0 "With our forces evicted from Libya, our enemies have partitioned the region between themselves. The loss of a territory so close to Italy itself would not do much help to our war effort..." 
 ita_lba.15.a:0 "Bah! We will be back!"
 
 italy_eritrea.1.t:0 "The Occupation of Italian East Africa"
 italy_eritrea.1.d:0 "With the defeat of Italian forces across East Africa, the entire colony now lies in our hands. It is up to us to decide the fate of the territory. Most have proposed, at least temporarily, setting up military administrations in the Italian colonies including Ethiopia, however, othes have reminded us about the promise we made to the Ethiopians and that we should free their country."
 italy_eritrea.1.a:0 "Liberate Abyssinia, occupy the rest."
 italy_eritrea.1.b:0 "Liberate Abyssinia but keep Ogaden and Haud under our control."
 italy_eritrea.1.c:0 "The whole of Abyssinia is better under our military control."
 italy_eritrea.1.e:0 "Don't do anything, yet."
 italy_eritrea.2.t:0 "Defeat in East Africa"
 italy_eritrea.2.d:0 "With the valiant stands of our last garrisons, our glorious colony in East Africa has been fallen to our enemies. While the war in East Africa was never going to be easy, the general populace is horrified at the sudden loss of such a large territory."
 italy_eritrea.2.a:0 "This will not be the end of us there..."
 