 YUG_arrest_macek:0 "Imprison Maček" 
 YUG_arrest_macek_desc:0 "Vladko Maček is the leader of the Croatian Peasant Party, the dominant party in Croatia. His imprisonment will be just another argument in the Croatian dispute; that's how it works in the Balkans."
 YUG_exile_korosec:0 "Exile Korošec"
 YUG_exile_korosec_desc:0 "Anton Korošec is the leader of the Slovenian People's Party. He used to support the Royal Dictatorship, but later joined the opposition. If we exile him to an island in the Adriatic Sea, we might persuade him to return to the government."
 YUG_imprison_spaho:0 "Imprison Spaho"
 YUG_imprison_spaho_desc:0 "Mehmed Spaho is the leader of the Yugoslav Muslim Organization. If we imprison him, we will have upper ground in negotiations with Bosnian Muslims. Securing Bosnia is vital for the Croatian dispute."
 YUG_national_policy:0 "Yugoslavian National Policy"
 YUG_national_policy_desc:0 "We can consider ethnic groups within Yugoslavia as tribes, peoples or nations. Regardless of our views, Yugoslavs tend to organize themselves in politics along the ethnic lines rather than ideological. If we don't want to see our nation falling apart, we absolutely must take sentiments of those ethnic groups into consideration.\n\nSlovenes are [slovene_opinion_loc] our regime.\nCroats are [croat_opinion_loc] our regime.\nBosnian Muslims are [bosniak_opinion_loc] our regime.\nSerbs are [serb_opinion_loc] our regime.\nMontenegrins are [montenegrin_opinion_loc] our regime.\nMacedonians are [macedonian_opinion_loc] our regime."
