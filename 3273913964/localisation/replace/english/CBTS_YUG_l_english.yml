 YUG_klubasi_vs_zborasi_desc:0 "Two political groups struggle for power in Yugoslavia. The first group is the conservative §YSerbian Culture Club§!, led by §YSlobodan Jovanović§! and §YDragiša Vasić§!. §YKlubaši§! (as the members of the Club are called) issue a newspaper called §YSrpski Glas§!. The second group is the §YYugoslav National Union ZBOR§!, or simply §YZBOR§!. This is a fascist organization, led by §YDimitrije Ljotić§! and related to general §YNedić§!. Its biggest newspaper is §YOtadžbina§!.\n\n§YKlubaši§! power is §Y[?klubasi_power]§!\n§YZboraši§! power is §Y[?zborasi_power]§!"
