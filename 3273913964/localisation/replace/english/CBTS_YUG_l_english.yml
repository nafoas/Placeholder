  ## Other countries
 yugoslavia.1000.t:0 "Negotiations with Yugoslavia"
 yugoslavia.1000.d:0 "Today our foreign minister has spoken with his Yugoslavian colleague. This Balkan nation offers Romania to reinforce our previous mutual political agreements and expand our economic ties. Yugoslavia have been our loyal ally for a long time, however, we might want to pursue some other foreign policy strategy."
 yugoslavia.1000.a:0 "Agree."
 yugoslavia.1000.b:0 "Refuse."
 yugoslavia.1001.t:0 "Little Entente Talks"
 yugoslavia.1001.d:0 "Today our foreign minister has spoken with his Yugoslavian colleague. This Balkan nation offers Czechoslovakia to reinforce our previous mutual political agreements and expand our economic ties. Yugoslavia have been our economic partner for a long time, however, we might want to pursue some other foreign policy strategy."
 yugoslavia.1001.a:0 "Agree."
 yugoslavia.1001.b:0 "Refuse."
 yugoslavia.1002.t:0 "Balkan Entente Talks"
 yugoslavia.1002.d:0 "Today our foreign minister has spoken with his Yugoslavian colleague. This Balkan nation offers Greece to reinforce our previous mutual political agreements and expand our economic ties. Yugoslavia have been our loyal ally for a long time, however, we might want to pursue some other foreign policy strategy."
 yugoslavia.1002.a:0 "Agree."
 yugoslavia.1002.b:0 "Refuse."
 yugoslavia.1003.t:0 "Balkan Entente Talks"
 yugoslavia.1003.d:0 "Today our foreign minister has spoken with his Yugoslavian colleague. This Balkan nation offers Turkey to expand our economic ties and sign certain political agreements. Such a treaty would create a pact of Balkan nations, binding its members to protect each other in case of attack from a foreign country."
 yugoslavia.1003.a:0 "Agree."
 yugoslavia.1003.b:0 "Refuse."
 yugoslavia.1004.t:0 "Bloodbath in Dubovo"
 yugoslavia.1004.d:0 "Unpleasant news just arrived from the Macedonian village of Dubovo not far from the border with Serbia. In an effort to take action against VMRO in the region, the supposedly Serbian \"counter-terrorists\" murdered a number of civilians whilst disguised as VMRO splitters.\n\nThis horrible atrocity has been met with outrage of the Bulgarian populace and government alike seeing this as the ultimate brutality of Serbianisation in Bulgarian Macedonia. Revenge campaigns are already being planned by the actual VMRO. This could lead to growing tensions in the already hostile Macedonian region."
 yugoslavia.1004.a:0 "Outrageous!"
 yugoslavia.1005.t:0 "Migration Treaty with Yugoslavia"
 yugoslavia.1005.d:0 "Today our foreign minister has spoken with his Yugoslavian colleague. Our neighbor offers Albania to sign a migration treaty. Such an agreement will make it possible for a significant part of ethnic Albanian population in Kosovo to immigrate to Albania peacefully, encountering a minimum of bureaucratic difficulties.\n\nIf we agree, our relations with Yugoslavia will improve, but perhaps it is in our interest for Kosovo to stay Albanian?"
 yugoslavia.1005.a:0 "Agree."
 yugoslavia.1005.b:0 "Refuse."
 yugoslavia.1006.t:0 "Migration Treaty with Yugoslavia"
 yugoslavia.1006.d:0 "Today our foreign minister has spoken with his Yugoslavian colleague. Our neighbor offers Bulgaria to sign a migration treaty. Such an agreement will make it possible for a significant part of ethnic Bulgarian population in Vardar Macedonia to immigrate to Bulgaria peacefully, encountering a minimum of bureaucratic difficulties.\n\nIf we agree, our relations with Yugoslavia will improve, but perhaps it is in our interest for Vardar Macedonia to stay Bulgarian?"
 yugoslavia.1006.a:0 "Agree."
 yugoslavia.1006.b:0 "Refuse."
 yugoslavia.1007.t:0 "The Little Entente Is Established!"
 yugoslavia.1007.d:0 "A series of treaties between Czechoslovakia, Romania and Yugoslavia has created a quasi-alliance, known as the Little Entente.\n\nThree countries have agreed to defend each other in case of attack from a foreign power, however, this is not a proper political bloc in Eastern Europe yet."
 yugoslavia.1007.a:0 "Hopefully, our enemies won't risk to attack us now."
 yugoslavia.1008.t:0 "Participation in the Little Entente?"
 yugoslavia.1008.d:0 "The government of Yugoslavia has offered Austria to join the Little Entente, a quasi-alliance between Czechoslovakia, Romania and Yugoslavia. Those countries can provide us support in case of attack from Germany or Italy, however, it would be hard to trust very nations which have cut our Empire to pieces."
 yugoslavia.1008.a:0 "We should join the alliance."
 yugoslavia.1008.b:0 "What a silly offer!" 
 yugoslavia.1009.t:0 "Austria in the Little Entente?"
 yugoslavia.1009.d:0 "The government of Yugoslavia has successfully negotiated with Austria about her participation in the Little Entente. If we approve such a move, Romania will follow. However, our distrust for Austrians is still great. Some hotheads in our government even demand us to leave the alliance alltogether, as Yugoslavia finds it appropriate to deal with Austrians."
 yugoslavia.1009.a:0 "Let them in."
 yugoslavia.1009.b:0 "There will be no Austria in our alliance!" 
 yugoslavia.1009.c:0 "Czechoslovakia must leave the Little Entente."
 yugoslavia.1010.t:0 "Balkan Pact Is Established!" 
 yugoslavia.1010.d:0 "A series of treaties between Greece, Romania. Turkey and Yugoslavia has created a quasi-alliance, known as the Balkan Pact.\n\nFour countries have agreed to defend each other in case of attack from a foreign power, however, this is not a proper political bloc in Southeast Europe yet."
 yugoslavia.1010.a:0 "We are a part of the Balkan Pact now."
 yugoslavia.1011.t:0 "Albania in the Balkan Pact?" 
 yugoslavia.1011.d:0 "The government of Yugoslavia shows increased interest in Albanian affairs. Its latest move was to offer us to participate in the Balkan Pact, a quasi-alliance between Yugoslavia, Romania, Greece and Turkey. Perhaps, if we agree, Albania will be able not to rely on Italy anymore."
 yugoslavia.1011.a:0 "This is an opportunity to break with Italy!"
 yugoslavia.1011.b:0 "This will never work."
 yugoslavia.1012.t:0 "Alliance with Yugoslavia?" 
 yugoslavia.1012.d:0 "The government of Yugoslavia has adressed us with an unexpected offer. Apparently, Yugoslavia wills to renounce her existing treaties with her Balkan Pact partners to create an alliance with Bulgaria. If we agree, we will get an ally against Greece, Turkey or Romania."
 yugoslavia.1012.a:0 "Slavic peoples will stand together!"
 yugoslavia.1012.b:0 "We have other future to pursue."
 yugoslavia.1013.t:0 "Yugoslavian-Bulgarian Alliance" 
 yugoslavia.1013.d:0 "Interesting news are coming. According to our intelligence service, Yugoslavia and Bulgaria have signed a secret alliance, directed against Romania, Greece and Turkey."
 yugoslavia.1013.a:0 "A significant development."
 yugoslavia.1014.t:0 "Yugoslavia Leaves the Balkan Pact!" 
 yugoslavia.1014.d:0 "Yugoslavian government has decided to revise its geopolitical interests, denouncing the Balkan Pact treaties and formally leaving the alliance. Without Yugoslavia, its work may and will be damaged."
 yugoslavia.1014.a:0 "Are the Balkans going to explode again?"
 yugoslavia.1015.t:0 "Bulgaria in the Balkan Pact?" 
 yugoslavia.1015.d:0 "Our government has received an offer from Yugoslavia to join the Balkan Pact, a quasi-alliance between Yugoslavia, Romania, Greece and Turkey. Even though every our territorial claim is directed against those nations, our participation in the alliance might bring peace to the Balkans."
 yugoslavia.1015.a:0 "We can't afford another catastrophe."
 yugoslavia.1015.b:0 "Is this a joke?"
 yugoslavia.1016.t:0 "VMRO Is Defeated!"
 yugoslavia.1016.d:0 "Latest combined efforts of Yugoslavian and Bulgarian governments have led to elimination of VMRO, a Macedonian terrorist organization, which brought trouble to both nations."
 yugoslavia.1016.a:0 "One less problem to solve."
 yugoslavia.1017.t:0 "Yugoslavia Demands Ustaše Extradition"
 yugoslavia.1017.d:0 "Yugoslavia has demanded that we extradite the Ustaše! Our Croatian friends didn't cause us trouble, and their demands are plainly insolent. If we agree, we can lose our strongest trumpcard in the Balkans."
 yugoslavia.1017.a:0 "We will act like good little noodles."
 yugoslavia.1017.b:0 "Of course not!"
 yugoslavia.1018.t:0 "Yugoslavia Asks for Guarantees"
 yugoslavia.1018.d:0 "Yugoslavia recently had a heated debate with Italy over the status of the Ustaše. Italy has refused their extradition, and now Yugoslavian authorities want to see France as their defender. If we guarantee Yugoslavian independence, we will keep Italian ambitions in check, but we will also risk being dragged into a major war. We can also ask Italy to extradite the Ustaše once more. "
 yugoslavia.1018.a:0 "We will guarantee Yugoslavian independence."
 yugoslavia.1018.b:0 "We won't waste another generation of men."
 yugoslavia.1018.c:0 "We will guarantee Yugoslavian independence if Italy refuses Ustaše extradition."
 yugoslavia.1019.t:0 "France Demands Ustaše Extradition"
 yugoslavia.1019.d:0 "After their failure to demand the Ustaše extradition, Yugoslavians have decided to ask France for support. Now it is France who makes the same demands, and they threaten us with giving independence guarantees to Yugoslavia if we refuse."
 yugoslavia.1019.a:0 "We will have to concede."
 yugoslavia.1019.b:0 "Our answer stays the same: No!"
 yugoslavia.1020.t:0 "Yugoslavia Provokes Italy!"
 yugoslavia.1020.d:0 "In an unprecedented turn of events, Yugoslavia has staged an ill-prepared provocation of Italy into war. They clearly want France to join the war on their side, but we can easily disregard our previous treaties, as it is Yugoslavia who acts as an aggressor. Another solution would be to call for international arbitration, so full-scale European war would be prevented."
 yugoslavia.1020.a:0 "This is an act of aggression from Yugoslavia."
 yugoslavia.1020.b:0 "We will protect Yugoslavia anyway."
 yugoslavia.1020.c:0 "We must organize an international arbitration."
 yugoslavia.1021.t:0 "Provocation From Yugoslavia!"
 yugoslavia.1021.d:0 "In an unprecedented turn of events, Yugoslavia has staged an ill-prepared provocation of Italy into war. They clearly want France to join the war on their side, however, we don't yet know French reaction to this event. Anyhow, we now possess an opportunity to attack Yugoslavia and return what is rightly ours."
 yugoslavia.1021.a:0 "This is an act of war!"
 yugoslavia.1022.t:0 "Yugoslavia Leaves the Little Entente!"
 yugoslavia.1022.d:0 "Yugoslavian government has decided to revise its geopolitical interests, denouncing the Little Entente treaties and formally leaving the alliance. Without Yugoslavia, its work may and will be damaged."
 yugoslavia.1022.a:0 "Eastern Europe has just become less secure."
 yugoslavia.1023.t:0 "Yugoslavia Asks for a Friendship Treaty"
 yugoslavia.1023.d:0 "The Yugoslavian foreign minister has contacted our government today. He admits that our country had some trouble with Yugoslavia in the last few decades. He offers to end our quarrels at least for the time of the global conflict and sign a friendship treaty."
 yugoslavia.1023.a:0 "One less enemy to care about? Of course!"
 yugoslavia.1023.b:0 "That's not going to happen."
 yugoslavia.1024.t:0 "Yugoslavia Asks for a Friendship Treaty"
 yugoslavia.1024.d:0 "The Yugoslavian foreign minister has contacted our government today. He admits that our country had some trouble with Yugoslavia in the last few decades. He offers to end our quarrels at least for the time of the global conflict and sign a friendship treaty."
 yugoslavia.1024.a:0 "One less enemy to care about? Of course!"
 yugoslavia.1024.b:0 "That's not going to happen."
 yugoslavia.1025.t:0 "Yugoslavia Asks for a Friendship Treaty"
 yugoslavia.1025.d:0 "The Yugoslavian foreign minister has contacted our government today. He admits that our country had some trouble with Yugoslavia in the last few decades. He offers to end our quarrels at least for the time of the global conflict and sign a friendship treaty."
 yugoslavia.1025.a:0 "One less enemy to care about? Of course!"
 yugoslavia.1025.b:0 "That's not going to happen."
 yugoslavia.1026.t:0 "Yugoslavia Declares Her Neutral Intentions"
 yugoslavia.1026.d:0 "TheYugoslavian foreign minister has contacted our government today. He mentioned that Yugoslavia is not going to interfere with plans of Italian expansion in the Balkans and is going to adjust her foreign policy accordingly."
 yugoslavia.1026.a:0 "As if we cared."
 yugoslavia.1027.t:0 "Yugoslavia Won't Interfere in Albania"
 yugoslavia.1027.d:0 "The Yugoslavian foreign minister has contacted our government today. He mentioned that Yugoslavia is not going to interfere with Italian annexation of Albania in any way. In fact, they would welcome this step by Italy."
 yugoslavia.1027.a:0 "We wouldn't ask them anyway."
 
 yugoslavia.1028.t:0 "Yugoslavia Applies to Join the Pact"
 yugoslavia.1028.d:0 "Yugoslavia has applied today to join our faction. It appears that the Yugoslavian leadership is scared of our alliance, and has decided to join our cause; it's up to us to decide, however: we can let Yugoslavia in, or we can deny the offer."
 yugoslavia.1028.a:0 "Let them in."
 yugoslavia.1028.b:0 "Yugoslavia is our prey, we won't accept them in."
 yugoslavia.1029.t:0 "Yugoslavia Applies to Join Our Alliance"
 yugoslavia.1029.d:0 "Yugoslavia has applied today to join our faction. It appears that the Yugoslavian leadership has decided to revive our old Great War alliance; it's up to us to decide, however: we can let Yugoslavia in, or we can deny the offer."
 yugoslavia.1029.a:0 "Let them in."
 yugoslavia.1029.b:0 "We are better without Yugoslavia."
 yugoslavia.1030.t:0 "Yugoslavia Applies to Join Our Alliance"
 yugoslavia.1030.d:0 "Yugoslavia has applied today to join our faction. It appears that the Yugoslavian leadership has decided to revive our old Great War alliance; it's up to us to decide, however: we can let Yugoslavia in, or we can deny the offer."
 yugoslavia.1030.a:0 "Let them in."
 yugoslavia.1030.b:0 "We are better without Yugoslavia."
 
 yugoslavia.1031.t:0 "Dalmatia for Salonica?"
 yugoslavia.1031.d:0 "Yugoslavia has turned to us with an interesting proposal. They have acknowledged our claims on Dalmatia and agreed to let Italy annex this province. However, Yugoslavia asks us to provide her with compensation, and demads Salonica in exchange for Dalmatia."
 yugoslavia.1031.a:0 "What a great idea! We accept."
 yugoslavia.1031.b:0 "We would prefer keeping Salonica to ourselves."
 yugoslavia.1032.t:0 "Partition of Albania?"
 yugoslavia.1032.d:0 "We have received an offer from our Yugoslavian allies. They see how we struggle with getting full control over Albania, and have offered us support in annexing this country. However, they want to receive their part of the country, about a third of its territory in the north including Shkodër."
 yugoslavia.1032.a:0 "Good, we agree. Send an ultimatum to Albania."
 yugoslavia.1032.b:0 "No, it's against our interests in Albania."
 yugoslavia.1033.t:0 "Italy issues an ultimatum"
 yugoslavia.1033.d:0 "The governments of Italy and Yugoslavia today issued a joint ultimatum to our government, demanding that we transfer our lands into their occupation. Considering how weak our army is in comparison to combined forces of Italy and Yugoslavia, defying this ultimatum would hardly produce any positive results."
 yugoslavia.1033.a:0 "We have no choice."
 yugoslavia.1033.b:0 "Come and get it."
 yugoslavia.1034.t:0 "Albania yields"
 yugoslavia.1034.d:0 "Albanian government has taken the obvious path and surrendered the control of the country to forces of Italy and Yugoslavia. Reorganizations are currently underway to set up a collaborationist government to better accomodate our grip."
 yugoslavia.1034.a:0 "An easy victory for Italy."
 yugoslavia.1035.t:0 "Albania stands her ground"
 yugoslavia.1035.d:0 "Despite overwhelming superiority of the land forces of our alliance, Albania have decided to defy our ultimatum. A swift military operation should be able to take care of their rebellious behavior."
 yugoslavia.1035.a:0 "They have brought this upon themselves"
 yugoslavia.1036.t:0 "Yugoslavia plans to partition Albania!"
 yugoslavia.1036.d:0 "Increased bellicosity of Yugoslavian propaganda, her army maneuvers next to our borders, as well as data obtained by our intelligence all say one thing: Yugoslavia is set to invade Albania. Belgrade will likely be supported by Athens, and our forces stand no chance against combined Yugoslavian-Greek forces. Our elites are in panic and are desperately looking for foreign protection. This is a significant victory for Italy, as her government now has a perfect pretext for increasing her grip on Albania."
 yugoslavia.1036.a:0 "This might be the end for Albania... One way or another."
 yugoslavia.1037.t:0 "Albania negotiates with Yugoslavia!"
 yugoslavia.1037.d:0 "According to the data, provided by our intelligence service, top Albanian officials hold secret meetings with their Yugoslavian colleagues. Apparently, Belgrade is trying to convince Tirana to join the Balkan Pact - a defensive alliance, which would put Albania under protection of Yugoslavia, Greece and Romania."
 yugoslavia.1037.a:0 "Contact the Albanian government and make sure Albania doesn't join the Pact."
 yugoslavia.1037.b:0 "Let it slide."
 yugoslavia.1038.t:0 "Italian views on Albanian regional cooperation"
 yugoslavia.1038.d:0 "It has become known to the Italian leadership, that Yugoslavia is about to propose Albania a treaty, in which Yugoslavia would guarantee Albanian independence, as Albania would become a part of the Balkan Pact. The Italian ambassador has declared that such a move would be hostile to Italian interests in the region, and that Albania must decline this offer, or else..."
 yugoslavia.1038.a:0 "Promise Italy the treaty won't be signed."
 yugoslavia.1038.b:0 "Albania will act as a sovereign nation."
 yugoslavia.1039.t:0 "Promises from Albania"
 yugoslavia.1039.d:0 "Looks like Tirana has accepted our arguments and has promised that Albania wouldn't join the Balkan Pact. The time will tell, how sincere Albanians are."
 yugoslavia.1039.a:0 "Let's hope Albania keeps her promises."
 yugoslavia.1040.t:0 "Albania stands her ground"
 yugoslavia.1040.d:0 "Tirana has declared, that Albania, as a sovereign nation, is free to sign treaties with any other sovereign nation. This obviously means that our arguments have fallen on deaf ears. However, we are capable to pressure Albania into changing her mind by performing extensive navy maneuvres and bellicose rhetoric... Perhaps, a threat of invasion will make Tirana more obedient."
 yugoslavia.1040.a:0 "Put more pressure on Albania."
 yugoslavia.1040.b:0 "Let Albanians act as they want."
 yugoslavia.1041.t:0 "Italy threatens Albania with an invasion!"
 yugoslavia.1041.d:0 "Italy continues to exert pressure. Her navy is particularly active, her propaganda has become even more bellicose, and by all the looks it seems like Italy is preparing an invasion. Perhaps it's just a bluff, but are we really in position to gamble? We still have an opportunity to give the Italians promises they need..."
 yugoslavia.1041.a:0 "Italians have a point."
 yugoslavia.1041.b:0 "We won't surrender!"
 yugoslavia.1042.t:0 "Albania defies our power!"
 yugoslavia.1042.d:0 "Despite our best efforts, Albania still stands her ground. All our naval preparations were nothing but bluff, while an actual invasion would bring us into war with the entirety of the Balkans. We have lost this fight, but we will strike back soon - when the circumstances are in our favor."
 yugoslavia.1042.a:0 "We will get our revenge some other day." 
 
  ## Global news events
 yugoslavia.2000.t:0 "King Alexander Is Murdered!" 
 yugoslavia.2000.d:0 "Today, King Alexander I of Yugoslavia and the Foreign Minister of France were assassinated in the city of Marseilles. The monarch arrived in France to strengthen the two countries' alliance in the Little Entente.\n\nWhile Alexander was being slowly driven in a car through the streets, a gunman stepped from the street and shot the King twice with a Mauser C96 semi-automatic pistol. Alexander died in the car, slumped backwards in the seat, with his eyes open. One of the bullets struck the Foreign Minister in the arm, passing through and fatally severing an artery. He died of blood loss less than an hour later. The assassin was a member of the pro-Bulgarian VMRO, which worked in alliance with the Croatian Ustaše group."
 yugoslavia.2000.a:0 "How barbaric!" 
 yugoslavia.2001.t:0 "King Alexander Is Murdered!"
 yugoslavia.2001.d:0 "Today, King Alexander I of Yugoslavia was assassinated in the city of Zagreb. The king arrived in Zagreb to ensure loyalty of his Croatian subjects.\n\nWhile Alexander was being slowly driven in a car through the Ilica street to Ban Jelačić Square, a gunman stepped from one of the buildings and shot the King twice with a Mauser C96 semi-automatic pistol. One of the bullets hit the right side of the chest, in the liver area, and then entered the thorax. Alexander died in the car, slumped backwards in the seat, with his eyes open. The assassin was a member of the pro-Bulgarian VMRO, which worked in alliance with the Croatian Ustaše group."
 yugoslavia.2001.a:0 "How barbaric!"
 yugoslavia.2002.t:0 "King Alexander Is Murdered!" 
 yugoslavia.2002.d:0 "Today, King Alexander I of Yugoslavia was assassinated in the city of Belgrade.\n\nThe king was casually driven through the streets of the White City, welcomed by his loyal subjects. While the car slowly moved through the Prince Michael Street, a gunman stepped from the "Grčka Kraljica" restaurant and shot the King twice with a Mauser C96 semi-automatic pistol. One of the bullets hit the right side of the chest, in the liver area, and then entered the thorax. Alexander died in the car, slumped backwards in the seat, with his eyes open. The assassin was a member of the pro-Bulgarian VMRO, which worked in alliance with the Croatian Ustaše group."
 yugoslavia.2002.a:0 "How barbaric!"
 yugoslavia.2003.t:0 "King Alexander Is Murdered!"
 yugoslavia.2003.d:0 "Today, King Alexander I of Yugoslavia and Prince Danilo of Montenegro were assassinated in the city of Cetinje. The king and the prince arrived in Montenegro to hold a joined public rally in support of the Yugoslavian monarchy.\nWhile Alexander was being slowly driven in a car through the streets, a gunman stepped from the street and shot the King twice with a Mauser C96 semi-automatic pistol. Alexander died in the car, slumped backwards in the seat, with his eyes open. One of the bullets struck Prince Danilo in the arm, passing through and fatally severing an artery. He died of blood loss less than an hour later. The assassin was a member of the pro-Bulgarian VMRO, which worked in alliance with the Croatian Ustaše group."
 yugoslavia.2003.a:0 "How barbaric!" 
 yugoslavia.2004.t:0 "Stojadinović-Maček Agreement"
 yugoslavia.2004.d:0 "Prime Minister Milan Stojadinović of Yugoslavia and Croatian politician Vladko Maček, as well as other leading Yugoslavian politicians, have agreed to sign a federalization treaty which will transform Kingdom of Yugoslavia into a federal state.\n\nHopefully, this achievement will make the Balkans more stable and peaceful."
 yugoslavia.2004.a:0 "The Balkan powder keg is disappointing."
 yugoslavia.2005.t:0 "King Alexander Is Murdered!"
 yugoslavia.2005.d:0 "Today, King Alexander I of Yugoslavia was assassinated at Lake Bled.\n\nThe king was inspecting a booming Slovenian resort, welcomed by his loyal subjects. While the car slowly moved through the main street of the town of Bled, a gunman stepped out and shot the King twice with a Mauser C96 semi-automatic pistol. One of the bullets hit the right side of the chest, in the liver area, and then entered the thorax. Alexander died in the car, slumped backwards in the seat, with his eyes open. The assassin was a member of the pro-Bulgarian VMRO, which worked in alliance with the Croatian Ustaše group."
 yugoslavia.2005.a:0 "How barbaric!"
 yugoslavia.2006.t:0 "The Little Entente Is Established!"
 yugoslavia.2006.d:0 "Foreign ministers of Czechoslovakia, Romania and Yugoslavia have assembled in Timisoara to sign a treaty which will transform the Little Entente into a proper alliance.\n\nNow, we can expect them to act together in European affairs."
 yugoslavia.2006.a:0 "How long will it last?"
 yugoslavia.2007.t:0 "The Balkan Pact Is Established!"
 yugoslavia.2007.d:0 "Foreign ministers of Greece, Romania, Turkey and Yugoslavia have assembled in Kavala to sign a treaty which will transform the Balkan Pact into a proper alliance.\n\nNow, we can expect them to act together in European affairs."
 yugoslavia.2007.a:0 "How is it even possible?"
 yugoslavia.2008.t:0 "Federal Constitution in Yugoslavia"
 yugoslavia.2008.d:0 "Leading Yugoslavian politicians, elected to the Constituent Assembly, have agreed to sign a federalization treaty which will transform the Kingdom of Yugoslavia into a federal state.\n\nHopefully, this achievement will make the Balkans more stable and peaceful."
 yugoslavia.2008.a:0 "The Balkan powder keg is disappointing."
 yugoslavia.2009.t:0 "Federal Constitution in Yugoslavia"
 yugoslavia.2009.d:0 "Leading Yugoslavian politicians, elected to the Constituent Assembly, have agreed to sign a federalization treaty which will transform the Kingdom of Yugoslavia into a federal state.\n\nHopefully, this achievement will make the Balkans more stable and peaceful."
 yugoslavia.2009.a:0 "The Balkan powder keg is disappointing."

 yug_tripartite_pact.2.t: "Coup d'état"
 yug_tripartite_pact.2.d: "Following our decision to sign a pact with Germany, a group of Air Force officers has launched a coup. The military has seized key points in Belgrade. King Peter has been declared of age, ending the regency of [YUG.GetLeader].\n\nThe general population has been supportive of the coup, with crowds chanting "Better the war than the pact, better the grave than a slave!\n\nInmediately, the new government of National Unity has declared [Root.GetLeader]'s signature in the Tripartite Pact null and void; meaning Yugoslavia is no longer part of the Pact nor an ally of Germany. Of course, all of this may infuriate the Germans and bring war so we must be prepared for the worst."
 yug_tripartite_pact.2.a: "Better the grave than a slave!"
 yug_tripartite_pact.3.t: "Coup d'état in Yugoslavia"
 yug_tripartite_pact.3.d: "Immediately after the government of Prince Paul signed the Tripartite Pact, a group of Air Force officers executed a well-planned coup that replaced the legitimate government and put the underage Peter II on the throne.\n\nThe Yugoslavian government has folded entirely, with the new leaders declaring Prince Paul's signature null and void. The Führer is both shocked and furious about this outcome, which has gave him no choice other than to issue Führer Directive number 25, the Invasion of Yugoslavia."
 yug_tripartite_pact.3.a: "So be it."

