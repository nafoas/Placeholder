# NATIONAL FOCUSES
 YUG_strenghten_january_regime:0 "Strengthen the 6 January Regime"
 YUG_strenghten_january_regime_desc:0 "Democratic demands intensified in recent years, and the economic crisis added to political dissatisfaction. We must strengthen our regime in order to cope with the political crisis."
 YUG_reinforce_centralism:0 "Reinforce Centralist Policies"
 YUG_reinforce_centralism_desc:0 "There is only one nation in Yugoslavia – Yugoslavians. Serbs, Croats and Slovenes are simply tribes, and must become history."
 YUG_imprison_macek:0 "Imprison Maček"
 YUG_imprison_macek_desc:0 "Vladko Maček is the leader of the Croatian Peasant Party, the dominant party in Croatia. His imprisonment is just another argument in the Croatian dispute. That's how it works in the Balkans."
 YUG_exile_korosec:0 "Exile Korošec"
 YUG_exile_korosec_desc:0 "Anton Korošec is the leader of the Slovenian People's Party. He used to support the Royal Dictatorship, but later joined the opposition. If we exile him to some island in the Adriatic Sea, we might persuade him to return to the government."
 YUG_imprison_spaho:0 "Imprison Spaho"
 YUG_imprison_spaho_desc:0 "Mehmed Spaho is the leader of the Yugoslav Muslim Organization. If we imprison him, we will have upper ground in negotiations with Bosnian Muslims. Securing Bosnia is vital for the Croatian dispute."
 YUG_pressure_hss:0 "Keep Pressure on HSS"
 YUG_pressure_hss_desc:0 "Maček is imprisoned, but still refuses to cooperate. We must continue our policies by putting more pressure on the Croatian Peasant Party. Thus, our positions in Croatia will be strengthened regardless of their will to communicate."
 YUG_pressure_sls_jmo:0 "Put Pressure on SLS and JMO"
 YUG_pressure_sls_jmo_desc:0 "Slovenian and Muslim support is necessary to deal with Croatia. We will be happy to see their leaders in the government, but the stick must precede the carrot."
 YUG_order_croatia:0 "Enforce Order in Croatia"
 YUG_order_croatia_desc:0 "Croatians refuse to pay taxes, reject our national symbols and oppose national unity on every level of the society. If we can't negotiate with their leaders, we must bring order to Croatia by force."
 YUG_surround_croatia:0 "Surround Croatia"
 YUG_surround_croatia_desc:0 "With Slovenes and Muslims on our side, Croatia will follow. As the carrot follows the stick, Slovenian and Muslim leaders can get their ministerial chairs immediately after their release from the prison."
 YUG_pacify_croatia:0 "Pacify Croatia" 
 YUG_pacify_croatia_desc:0 "Croatia is suffering under a harsh police regime, its leaders are imprisoned, while Slovenes and Muslims enjoy the benefits of cooperation with the monarchy. In such conditions, Croatia will have to submit."
 YUG_new_electoral_law:0 "New Electoral Law" 
 YUG_new_electoral_law_desc:0 "Our current electoral law makes it impossible for non-ruling parties to participate in the elections. A more liberal one will let the opposition form a united list of candidates for ministerial posts. This important step towards democracy can win us much-needed support."
 YUG_replace_prime_minister:0 "Replace the Prime Minister"
 YUG_replace_prime_minister_desc:0 "As Milan Srškić resigns, a replacement for the position of Prime Minister must be found as soon as possible among the regime's loyalists."
 YUG_cajole_croatian_capital:0 "Cajole Croatian Capitalists"
 YUG_cajole_croatian_capital_desc:0 "HSS propaganda is directed towards Croatian peasants, not the upper class. Financial support from Croatia will undoubtedly be useful, if we put some effort in getting it."
 YUG_2nd_uzunovic:0 "2nd Uzunović Government"
 YUG_2nd_uzunovic_desc:0 "Nikola Uzunović, the minister of agriculture and a former radical, becomes Prime Minister."
 YUG_2nd_zivkovic:0 "2nd Živković Government"
 YUG_2nd_zivkovic_desc:0 "Petar Živković, the founder of the White Hand, becomes Prime Minister."
 YUG_reduce_croat_serb_tensions:0 "Reduce Serbo-Croatian Tensions"
 YUG_reduce_croat_serb_tensions_desc:0 "Ethnic situation in Yugoslavia threatens to get out of control. We must put effort to reduce tensions between Croats and Serbs if we don't want to find ourselves in the middle of the civil war."
 YUG_show_trials:0 "Show Trials"
 YUG_show_trials_desc:0 "Ethnic situation in Yugoslavia threatens to get out of control. We must put show the power of our justice system if we don't want to find ourselves in the middle of the civil war."
 YUG_international_support:0 "Address our Allies"
 YUG_international_support_desc:0 "Stability of our regime is a concern for the entire region, if not the entire Europe. We must reassure our allies, that keeping Yugoslavia united serves our common goals."
 YUG_talk_romania:0 "Talks with Romania"
 YUG_talk_romania_desc:0 "Romania is our primary ally in the region, acting as a counterweight to both Hungary and Bulgaria. Together we guarantee the peace in the Balkans, and must act accordingly."
 YUG_talk_czechoslovakia:0 "Talks with Czechoslovakia"
 YUG_talk_czechoslovakia_desc:0 "Our ties with Czechoslovakia are primarily economic. Without a strong industrial base of our own, we need such an ally to guarantee our financial well-being."
 YUG_talk_greece:0 "Talks with Greece"
 YUG_talk_greece_desc:0 "Greece has been our ally in World War, hosting Serbian government at Corfu and providing a supply route through Thessaloniki. If Italy decides to block the Strait of Otranto, the access to the Aegean Sea will be vital to our economy."
 YUG_mission_france:0 "State Visit to France"
 YUG_mission_france_desc:0 "With Russia turning into a communist dictatorship, France became the great power we rely on. If we want to counter Italian ambitions, we must keep this alliance. A state visit will become a symbol of our friendship, giving a strong message to our enemies within and without."
 YUG_treaty_turkey:0 "Treaty with Turkey"
 YUG_treaty_turkey_desc:0 "Our relations with Turkey are important not only for geopolitical reasons, but also for negotiations with our own Muslim minorities. A treaty with Turkey can become an advantage in pursuing any policy we would decide to apply towards the Turks, Muslims of Bosnia and Sanjak, or Albanians."
 YUG_little_entente:0 "The Little Entente"
 YUG_little_entente_desc:0 "The Little Entente is an alliance between Czechoslovakia, Romania and Yugoslavia, formed back in 1921. A new pact would not only reinforce our political bonds, but also expand our economic ties."
 little_entente_signed:0 "The Little Entente pact is signed"
 YUG_balkan_pact:0 "Balkan Pact"
 YUG_balkan_pact_desc:0 "The Balkan Pact, also known as the Balkan Entente, is a political union between Greece, Turkey, Romania and Yugoslavia. Acting as one, our nations will be able to keep stability in the Balkans, preventing stronger nations from interfering in our affairs."
 balkan_pact_signed:0 "The Balkan Pact is signed"

 YUG_uzunovic_regency:0 "Uzunovic Regency"
 YUG_uzunovic_regency_desc:0 "As our nation mourns the loss of the King, Nikola Uzunović, a former radical and the current Prime Minister, becomes regent for the young Peter II."
 YUG_zivkovic_regency:0 "Zivkovic Regency"
 YUG_zivkovic_regency_desc:0 "As our nation mourns the loss of the King, Petar Živković, the founder of the White Hand and the current Prime Minister, becomes regent for the young Peter II."
 YUG_prince_paul_regency:0 "Prince Paul Regency"
 YUG_prince_paul_regency_desc:0 "The late King has left a will which proclaims his first cousin, Prince Paul, a regent to the young Peter II until he becomes of age to rule.\n\nThe regent has accepted this job and has already begun assembling the governorship."
 YUG_yugoslavian_thaw:0 "Yugoslavian Thaw"
 YUG_yugoslavian_thaw_desc:0 "A regent cannot rule as a king. To stabilize our regime, we have to turn to at least some form of democracy."
 YUG_continue_dictatorship:0 "Continue the Dictatorship"
 YUG_continue_dictatorship_desc:0 "We can only honor the memory of the king, if we continue his efforts to unite the nation by force."
 YUG_reg_new_electoral_law:0 "New Electoral Law"
 YUG_reg_new_electoral_law_desc:0 "Our current electoral law makes it impossible for non-ruling parties to participate in the elections. A more liberal one will let the opposition form a united list of candidates for ministerial posts. This important step towards democracy can win us much-needed support."
 YUG_reg_replace_prime_minister:0 "Replace the Prime Minister"
 YUG_reg_replace_prime_minister_desc:0 "By replacing the Prime Minister we can at least partially cope with a wave of criticism which obstructs our government."
 YUG_strike_vmro_regency:0 "Strike at VMRO"
 YUG_strike_vmro_regency_desc:0 "VMRO, aka Inner Macedonian Revolutionary Organization, is a Bulgarian terrorist organization, operating in Macedonia. We cannot eliminate its activity altogether, but we can crush whatever support they have in our part of Macedonia."
 YUG_release_leaders_regency:0 "Release National Leaders"
 YUG_release_leaders_regency_desc:0 "National leaders within our country seem not so eager to negotiate from prison. They will be far more useful free."
 YUG_seek_vengeance:0 "Seek Vengeance"
 YUG_seek_vengeance_desc:0 "People who barely hide their joy from the death of the king walk our streets openly. True patriots of Yugoslavia are willing to punish those traitors, but our laws restrict them. Maybe the police can turn a blind eye to one or two incidents."
 YUG_preterm_elections:0 "Organize Preterm Elections"
 YUG_preterm_elections_desc:0 "It's absurd to deny that political climate in Yugoslavia has changed dramatically. A new parliamentary election will bring new people to the parliament, more able to cope with the crisis."
 preterm_elections_tt:0 "\nThe winner of the preterm parliamentary elections will dictate §Ythe future of our country§!.\n\nThe elections must be held §Ybefore June 1935§!."
 YUG_claim_legacy:0 "Claim Royal Legacy"
 YUG_claim_legacy_desc:0 "We've done a good job. If King Alexander was alive, he would certainly approve our actions."
 
 YUG_jns_victory:0 "JNS: Quest for National Unity"
 YUG_jns_victory_desc:0 "Far on the horizon, gather the clouds of the storm. The war will come, and Yugoslavia must be prepared. The government, formed by the Yugoslavian National Party, will devote itself to achieving unity of our nation. We still have time to negotiate a balanced and well-thought deal, however, we won't have another chance."
 YUG_release_leaders_jns:0 "Release National Leaders"
 YUG_release_leaders_jns_desc:0 "Any talk about national unity is pointless if we keep leaders of our national parties in jail. There is no use in opressing them. On the contrary, they can prove to be valuable allies, if we are able to negotiate a deal, that would benefit everyone."
 YUG_jns_replace_prime_minister:0 "Replace the Prime Minister"
 YUG_jns_replace_prime_minister_desc:0 "The last elections have proven that popularity of our party is questioned, to say the least. Appointing a new prime minister would symbolize a turn to other kind of national policy. Milan Stojadinović looks like a promising figure."
 YUG_jns_new_electoral_law:0 "New Electoral Law"
 YUG_jns_new_electoral_law_desc:0 "Our current electoral law makes it impossible for non-ruling parties to participate in the elections. A more liberal one will let the opposition form a united list of candidates for ministerial posts. This important step towards democracy can win us much-needed support."
 YUG_new_ruling_party:0 "New Ruling Party"
 YUG_new_ruling_party_desc:0 "Eminent figures from the Radical Party, as well as Slovenian and Bosnian leaders, are willing to support us in organizing the new party: JRZ, the Yugoslav Radical Union. Together we will finally break with centralist policies of the past, and will lead the Yugoslavian nation to success by ensuring prosperity and liberty of all the nations within it."
 YUG_negotiate_sls:0 "Negotiate with SLS"
 YUG_negotiate_sls_desc:0 "SLS, the Slovene People's Party, is by far the most prominent political party in Slovenia. Anton Korošec has led this party since the Austro-Hungarian times. Korošec already supports our government, however, this cannot be said about many of SLS members. If we want to proceed, SLS must firmly support our government."
 YUG_support_sls:0 "Support SLS in Slovenia"
 YUG_support_sls_desc:0 "Some smaller political parties in Slovenia, such as the Christian Socialists or Communists, act in opposition to SLS, threatening to challenge the unspoken right to represent Slovenes in the parliament. We rely on SLS, and should support them in their home region."
 YUG_secure_slovenia:0 "Secure Slovenia"
 YUG_secure_slovenia_desc:0 "As magnificent Triglav continues to watch over the Sava, the SLS has a firm control over Slovenia. Until we get a proper federalization deal, we can trust this Slovenian party to establish a virtual autonomy there."
 YUG_negotiate_jmo:0 "Negotiate with JMO"
 YUG_negotiate_jmo_desc:0 "Despite the name, JMO (aka Yugoslav Muslim Organization) only has a considerable influence over Bosnian Muslims, while the Muslims of Kosovo, Macedonia and Sandžak are represented by the Džemijet Party. Mehmed Spaho, the leader of JMO, supports our regime, however, he faces a significant opposition within his own party. Before we can rely on Spaho, we must support him."
 YUG_support_jmo:0 "Support JMO in Bosnia"
 YUG_support_jmo_desc:0 "Not only Muslims live in Bosnia. However, Muslims form a powerful landlord social strata there, that can serve as a firm foot for our regime. Once the JMO gets our support, they can effectively run Bosnia on their own."
 YUG_secure_bosnia:0 "Secure Bosnia"
 YUG_secure_bosnia_desc:0 "Muslim landlords are now fully in charge in Bosnia. They, however, still need some power to keep the social order intact, as any disturbance among the poor can and will lead towards an armed struggle between different religions. For this reason, JMO will fully support our government, as long as we keep Bosnia stable and quiet."
 YUG_petrovic_negos_support:0 "Support from the Petrovic-Njegos"
 YUG_petrovic_negos_support_desc:0 "Some Montenegrins still denounce the Podgorica Assembly, which formalized annexation of Montenegro by Serbia in 1918. Apparently, they value loyalty towards the Montenegrin Petrović-Njegoš dynasty higher than Yugoslav unity. The best way to prove them wrong is to negotiate with Prince Danilo, who doesn't seem eager to challenge the throne of Montenegro."
 YUG_orthodox_support:0 "Orthodox Church Support"
 YUG_orthodox_support_desc:0 "Serbian Orthodox Church has enormous influence on more than a half of the royal subjects. If Serbian Patriarch Varnava would publicly support the ruling regime, it would bring us much-needed popularity and stability."
 YUG_secure_montenegro:0 "Secure Montenegro"
 YUG_secure_montenegro_desc:0 "As the sun rises over the Lovćen, Montenegro, bright dawn of heroism, will support us in the coming storm. With the Church and Prince Danilo on our side, Montenegrin separatists will have to fight against their own ideals."
 YUG_negotiate_radicals:0 "Negotiate with the Radicals"
 YUG_negotiate_radicals_desc:0 "NRS, aka the People's Radical Party, used to be the dominant party in pre-war Serbia, and continued to hold a prominent position in Yugoslavian politics until 1929. The Radicals participated in the foundation of JRZ, but multiple disagreements have divided NRS and JRZ almost immediately."
 YUG_negotiate_democrats:0 "Negotiate with the Democrats"
 YUG_negotiate_democrats_desc:0 "The Democratic Party was the first party in Yugoslavia, which tried to appeal to all Yugoslavian peoples, rather than to some particular ethnic group. They were eventually split into two Democratic parties (one appealing to Prečani Serbs and another - to Serbian Serbs). Prečani part of the party soon joined HSS in a coalition."
 YUG_negotiate_agriculturalists:0 "Negotiate with the Agrarians"
 YUG_negotiate_agriculturalists_desc:0 "The Agrarian Party is the least prominent among the three Serbian parties. However, their ties with HSS (an Agrarian party as well) makes ZS an important factor in Serbian-Croatian relations. Their support will be quite useful in negotiatons with HSS."
 YUG_need_federalization:0 "Promise Federalization"
 YUG_need_federalization_desc:0 "Unitarism has failed. Despite our best efforts, Serbdom, Croatdom and other forms of sub national nationalism are as strong as ever. It's pointless to oppose it. On the contrary, it can become a useful ally, if we federalize the state. \n§RWARNING: There will be no way back.§!"
 YUG_need_welfare:0 "Pledge Welfare"
 YUG_need_welfare_desc:0 "While our government is busy arguing over centuries-long ethnic disputes, our economy is weak, poverty torments our people, and industry is one of the least developed in Europe. We should turn at least some attention to the needs of the common people and their well-being."
 YUG_need_democracy:0 "Admit the Need for Democracy"
 YUG_need_democracy_desc:0 "The United Opposition claims that the latest elections were rigged and unfair. The fact, that bitter enemies unite against our regime, is alone dangerous and threatening. Our democratic system must adjust, so our opponents won't be able to explain their failures with election fraud."
 YUG_secure_serbia:0 "Secure Serbia"
 YUG_secure_serbia_desc:0 "Three Serbian parties now have their guarantees, and will send representatives to the federalization talks. Serbians can be sure that their interests will be taken into account. Serbia is the core of our state, and securing it is absolutely vital for any policy we may choose."
 YUG_secure_vojvodina:0 "Secure Vojvodina"
 YUG_secure_vojvodina_desc:0 "Once Serbia is secured, Vojvodina will follow. Local Hungarian and German minorities are too irrelevant to demand anything, while the Serbs generally follow their brothers across the Danube. Vojvodina, however, plays important role in our economy, and we should pay attention to it."
 YUG_talk_dzemijet:0 "Negotiate with Džemijet"
 YUG_talk_dzemijet_desc:0 "Džemijet (aka Islamic Association for the Defense of Justice) is a political party, representing Albanians, Turks and Slavic Muslims in Sandžak, Kosovo and Macedonia. Negotiating with them is the best way to gain support among the Muslim population in Old Serbia"
 YUG_intensify_serb:0 "Intensify Serbianization"
 YUG_intensify_serb_desc:0 "We already follow the policy of colonization of Kosovo and Macedonia, as Serbian families are brought there every month. A notion that we can rely on Albanians or Bulgarians is naive: only Serbs have interest in keeping Yugoslavia stable. To secure our hold in Kosovo and Macedonia, we must intensify our Serbianization policies."
 YUG_deal_VMRO_split:0 "Deal with VMRO Splitters"
 YUG_deal_VMRO_split_desc:0 "Ethnic Macedonians are not our enemy, VMRO is. By coordinating our efforts with splitter groups within VMRO, we can act against our common enemy more efficiently."
 YUG_partner_albanians:0 "Partnership with Albanians"
 YUG_partner_albanians_desc:0 "If we want to gain the trust of the Albanian population, we must treat them as equals, and not as some undesirables living within our borders. Wounds of the past must be healed, and we must treat each other with respect."
 YUG_treaty_albania:0 "Treaty with Albania"
 YUG_treaty_albania_desc:0 "Migration treaty with Albania will make it possible for a significant part of Albanian population to migrate peacefully to Albania. This should benefit stability of the region regardless of our decisions to support Albanians or Serbs."
 YUG_treaty_bulgaria:0 "Treaty with Bulgaria"
 YUG_treaty_bulgaria_desc:0 "Migration treaty with Bulgaria will make it possible for a significant part of Bulgarian population to migrate peacefully to Bulgaria. This should benefit stability of the region regardless of our decisions to support Bulgarians or Serbs."
 YUG_strike_VMRO_jrz:0 "Strike at VMRO"
 YUG_strike_VMRO_jrz_desc:0 "VMRO, aka Inner Macedonian Revolutionary Organization, is a Bulgarian terrorist organization, operating in Macedonia. We cannot eliminate its activity altogether, but we can crush whatever support they have in our part of Macedonia."
 YUG_secure_old_serbia:0 "Secure Old Serbia"
 YUG_secure_old_serbia_desc:0 "Old Serbia is a Serbian term, used for the regions of Sandžak, Kosovo and Macedonia. Its name comes from the late medieval Stefan Dušan's Serbian Empire, core of which was Old Serbia. This is an economically backward and unstable region, however, highly important symbolically. Securing it will demand a lot of effort, but will pay off."
 YUG_uneasy_talk_hss:0 "Uneasy Talks with HSS"
 YUG_uneasy_talk_hss_desc:0 "We will have better chances to solve the Croatian question if we talk directly to Maček. The situation requires us to cooperate with HSS, if we want to bring situation in Croatia under control."
 YUG_admit_croats_cool:0 "Admit Croatian Self-sufficiency"
 YUG_admit_croats_cool_desc:0 "HSS leadership doesn't allow us to raise the flag of Yugoslavia in Zagreb... Oops, did I say it out loud?"
 YUG_enemies_my_enemy:0 "The Enemies of My Enemy"
 YUG_enemies_my_enemy_desc:0 "HSS will be much more eager to compromise if we threaten their monopoly on representing the Croats. Supporting other political groups in Croatia looks like a good strategy."
 YUG_negotiate_communists:0 "Negotiations with Communists"
 YUG_negotiate_communists_desc:0 "There is no way communists will rule over Yugoslavia one day. However, they present some threat to the HSS, and would be happy to spend some effort on agitating among the rural population - the traditional HSS electoral base."
 YUG_repeal_1921:0 "Repeal the 1921 State Security Law"
 YUG_repeal_1921_desc:0 "Law of protection of public security and state order was one of the first legislations passed by the Constitutional Assembly in 1921. Its main purpose was to ban any communist activity, effectively making the communist party an underground organization. Communists will be more likely to support us in Croatia, if we repeal this law and make KPJ legal once again."
 YUG_negotiate_left_democrats:0 "Negotiations with Left Democrats"
 YUG_negotiate_left_democrats_desc:0 "HSS is united with the Independent Democratic Party, forming the Peasant-Democratic Opposition. While HSS represents the Croats, the Independent Democrats represent the Serbs living in Croatia. The left wing of the Democrats seems to be displeased with the current policies of the Independent Democrat leadership. They can become a useful ally."
 YUG_repeal_1929:0 "Repeal the 1929 State Protection Law"
 YUG_repeal_1929_desc:0 "The Law on the Protection of Public Safety, Law and Order banned all associations and political parties \"engaged in propaganda and convincing people that the existing order should be changed\" back in 1929. It's time to correct the errors of the past."
 YUG_press_hss_left:0 "Press HSS from the Left"
 YUG_press_hss_left_desc:0 "HSS tends to gain popularity among the peasants by claiming that the party fights for the working class. They are not alone in this fight anymore."
 YUG_negotiate_rightists:0 "Negotiations with Rightists"
 YUG_negotiate_rightists_desc:0 "The Party of Rights is one of the oldest in Yugoslavia, established back in 1861. They used to be influential before the war, but lost most of their influence to HSS and the Ustaše. They are currently a part of the Croatian Bloc, however, Maček is far too liberal for them. By negotiating with the Rightists we can threaten the unity of the Croatian Bloc."
 YUG_concordat_vatican:0 "Concordat with the Vatican"
 YUG_concordat_vatican_desc:0 "The Party of Rights is careful about religious feelings of the Croatian population. In their eyes, the Catholic Church is treated as secondary to the Orthodox Church, which is one of the causes of dissent among the Croats. A Concordat with Vatican will prove them wrong, however, it may displease our Orthodox population."
 YUG_negotiate_ustasa:0 "Negotiations with the Ustaše"
 YUG_negotiate_ustasa_desc:0 "The Ustaše are a nationalist group of dissenters, which grew out of the Party of Rights in 1930. Their doctrines are inspired by Italian fascism, and they are eager to implement them in independent Croatia. However, maybe even they can be convinced into a temporary alliance? \n§RWARNING: This is a bad idea.§!"
 YUG_amnesty_prisoners:0 "Amnesty for Political Prisoners"
 YUG_amnesty_prisoners_desc:0 "The amount of crime produced by the Ustaše terrorist activities, together with King Alexander's repressive policies have produced a large amount of prisoners, who sympathize the Ustaše, or straightforwardly support them. Our new unexpected ally Ante Pavelić kindly asks us to release them."
 YUG_press_hss_right:0 "Press HSS from the Right"
 YUG_press_hss_right_desc:0 "HSS is able to represent the entire Croat population of Yugoslavia only by appealing to Croatian national feelings. Perhaps, the Croats would rather support a party, which is actually nationalist."
 YUG_secure_croatia:0 "Secure Croatia"
 YUG_secure_croatia_desc:0 "The Croatian question was the dominant issue of Yugoslavian politics since the World War. Our entire policy so far had only one goal: to make Croatia a proper part of our nation, eager to support and develop Yugoslavia. Once Croatia is secured, we may finally focus on something else."
 YUG_deal_our_terms:0 "Deal on Our Terms"
 YUG_deal_our_terms_desc:0 "Now, as leading political parties have their guarantees and are willing to cooperate, federalization negotiations can finally begin. This is in our interest to ensure that the final deal is fair to all the nations of Yugoslavia, otherwise all the progress will be lost."
 YUG_federal_constitution:0 "Constitution for Federal Yugoslavia" 
 YUG_federal_constitution_desc:0 "Success! The agreement is signed, and Yugoslavian nations seem to have finally achieved consensus. All previous guarantees and arrangements now must form the basis for the new constitution of a federal, democratic and parliamentary Yugoslavia."
 
 YUG_uo_victory:0 "UO: In Search of a Compromise"
 YUG_uo_victory_desc:0 "The United Opposition has emerged victorious. Democracy and parliamentarism return to Yugoslavia once again, and various political parties will try to find a better future for this country through talks and negotiations."
 YUG_sdk_victory:0 "The Peasant Democrats"
 YUG_sdk_victory_desc:0 "The Peasant-Democratic Coalition has finally prevailed in Yugoslavia! Long gone are the days where the King is not held accountable for his actions, for our actions shall reform this country of ours once and for all."
 YUG_sixth_january_legacy:0 "Legacy of January 6"
 YUG_sixth_january_legacy_desc:0 "The 6th January Dictatorship has left Yugoslavia with a repressive apparatus, a number of political prisoners and unfair laws. This must change."
 YUG_the_moderate_plan:0 "The Moderate Plan"
 YUG_the_moderate_plan_desc:0 "The dictatorship must end, but a social revolution is something we cannot afford. We need a plan, that would preserve continuity between the regimes."
 YUG_pribicevic_plan:0 "Pribićević's Plan"
 YUG_pribicevic_plan_desc:0 "Svetozar Pribićević was planning the end of the monarchy for a long time. Now we get an ultimate chance to bring this plan to life."
 YUG_condemn_the_kings_dictatorship:0 "Condemn the Royal Dictatorship"
 YUG_condemn_the_kings_dictatorship_desc:0 "We cannot ignore the flaws of the dictatorship. Architects of the repressions must be held accountable, and the public must be made aware of its atrocities."
 YUG_denounce_the_king:0 "Denounce the King"
 YUG_denounce_the_king_desc:0 "Down with Alexander! His ideas are absurd, his methods are brutal and the only thing he deserves is oblivion. It is our moral duty to denounce him."
 YUG_the_good_side_of_the_king:0 "The Good Side of the King"
 YUG_the_good_side_of_the_king_desc:0 "King Alexander has made a lot of bad things, but his intentions were good, and the only thing monarch cared about is the well-being of his subjects. Our stance against the dictatorship must not create a wrong picture: we still love our king."
 YUG_support_constitutionalism:0 "Support Constitutionalism"
 YUG_support_constitutionalism_desc:0 "Yugoslavia is already a constitutional monarchy, however, the king has a wide authority over the government. Further limiting the power of the monarch must become our primary goal."
 YUG_radicalize_the_party:0 "Radicalize the Party"
 YUG_radicalize_the_party_desc:0 "We have bright future ahead of us, but not all of the Independent Democrats are ready to pursue it. It is necessary to enforce paty discipline if we want to move forward."
 YUG_regain_popular_sentiment:0 "Regain Popular Sentiment"
 YUG_regain_popular_sentiment_desc:0 "Our recent statements against the king cost our popularity dearly. Bringing popular sentiments on our side is something that should be done quickly."
 YUG_the_party_of_compromise:0 "The Party of Compromise"
 YUG_the_party_of_compromise_desc:0 "The Peasant Democratic Coalition never betrayed its principles, but always respected views of its opponents. If we claim to be a part of the ruling establishment, we must reinvent ourselves as the party of compromise."
 YUG_the_french_model:0 "Our Prise de la Bastille"
 YUG_the_french_model_desc:0 "This is it. It is time for our supporters to go on the streets and destroy the hated monarchy. It is time for revolution!"
 YUG_guarantee_freedoms:0 "Guarantee Freedoms"
 YUG_guarantee_freedoms_desc:0 "Whether we are successful in our other policies or not, we must assure everyone, that fundamental rights and freedoms of men are respected as long as we are in power. Decisions we have made during the term seem to be enough to create this picture."
 YUG_prison_the_monarchists:0 "Imprison the Monarchists"
 YUG_prison_the_monarchists_desc:0 "Once the revolution is complete, monarchists must be put in jail. There will be no compromise - those men are too dangerous to keep them in politics."
 YUG_back_to_basics:0 "Back to Basics"
 YUG_back_to_basics_desc:0 "It is important for us to understand, what kind of country we are struggling to build. We cannot strive to create something we can't even fully imagine."
 YUG_the_kings_status:0 "The King's Status"
 YUG_the_kings_status_desc:0 "The king didn't act particularly friendly towards democracy when he was in charge. Now we should determine how democracy should act towards the king."
 YUG_the_electoral_laws:0 "The Electoral Laws"
 YUG_the_electoral_laws_desc:0 "Current electoral law barely gives chance to parliamentarism. In a democratic country as diverse as Yugoslavia, parliamentarism is absolutely necessary - otherwise, there will be no compromise."
 YUG_cooperate_with_liberal_parties:0 "Cooperate with Liberal Parties"
 YUG_cooperate_with_liberal_parties_desc:0 "We are not alone in our struggle for democracy. Serbian political parties, such as the Democrats or the Agrarians, will support our aspirations, if we cooperate with them."
 YUG_meet_with_the_hos:0 "Meet with the Prince"
 YUG_meet_with_the_hos_desc:0 "We won't be able to adopt a new, democratic constitution without permission from the regent. King Alexander would never agree on this, but talking to Prince Paul might be more fruitful."
 YUG_influence_his_advisors:0 "Influence Royalists"
 YUG_influence_his_advisors_desc:0 "Prince Paul is inexperienced in politics and he knows that. He tends to rely on his fellow monarchists when it's time to make some important decision. It's up to us to influence the monarchists."
 YUG_find_common_ground:0 "Find Common Ground"
 YUG_find_common_ground_desc:0 "Our party is popular, and our people follow us. Those people want the same thing as the Prince: order, stability and freedom. Our views on society don't really contradict each other. Such a notion would certainly make talks with the Prince easier."
 YUG_work_towards_a_compromise:0 "Towards a Compromise"
 YUG_work_towards_a_compromise_desc:0 "Once Prince Paul agrees to change the constitution in principle, we can start preparing for the Constituent Assembly. It is in our interest to promote our views on the new constitution before the official talks start."
 YUG_spaho_muslims:0 "Spaho's Muslims"
 YUG_spaho_muslims_desc:0 "No national group in Yugoslavia is as passionate about federalization as Bosnian Muslims, as a poorly designed project would directy harm their interests. Consulting their leader Spaho would be vital for our efforts."
 YUG_guarantee_muslim_rights:0 "Guarantee Muslim Rights"
 YUG_guarantee_muslim_rights_desc:0 "Bosnian Muslims do not strive to create their own country - they are aware of the fact, that such a state wouldn't be viable. However, they would support a state, which would guarantee their religious rights. Yugoslavia must be such a state."
 YUG_issues_with_macedonia:0 "Issues in Macedonia"
 YUG_issues_with_macedonia_desc:0 "Macedonia has been a troublesome region for Yugoslavia since Yugoslavia was created. This region must be given special attention to, regardless of our interests there."
 YUG_preserve_dusan_legacy:0 "Preserve Dušan's Legacy"
 YUG_preserve_dusan_legacy_desc:0 "We do support Macedonia as an autonomous part of the federation, however, we can't give it to former terrorists. Serbs would agree, if autonomous Macedonia would still be ruled by Serbs. Kosovo, on the other hand, should be a direct part of autonomous Serbia."
 YUG_legalize_vmro_protogerovists:0 "Legalize VMRO's Protogerovists"
 YUG_legalize_vmro_protogerovists_desc:0 "If we want Macedonia to become an autonomous part of the federation, we will have to rely on some local power. Protogerovist wing of VMRO looks moderate, and can be brought into open politics."
 YUG_fate_of_kosovo:0 "Fate of Kosovo"
 YUG_fate_of_kosovo_desc:0 "Serbs treat every decision concerning Kosovo especially close to heart, and any uncareful move can bring our downfall. Whatever we do in Kosovo must be done without publicity to be presented to the Serbs later as a fait accompli."
 YUG_davidovic_democrats:0 "Davidović's Democrats"
 YUG_davidovic_democrats_desc:0 "The Democrats are one of the leading forces in Belgrade, and the leading liberal one. They are precisely the people we should rely on in Serbia."
 YUG_strengthen_the_liberals:0 "Support Belgrade Liberals"
 YUG_strengthen_the_liberals_desc:0 "Serbian liberals might agree on our federalization project, but their positions in Serbia are not as strong as we want them to be. We should support the Democrats and the Agrarians there."
 YUG_help_unite_the_ds:0 "Help Unite the DS"
 YUG_help_unite_the_ds_desc:0 "The Democratic Party has experienced a painful split in 1924. Now, when Pribićević is out of the picture, this split can be overcome - especially with support from the HSS."
 YUG_drljevic_support:0 "Drljević's Support"
 YUG_drljevic_support_desc:0 "Sekula Drljević is the leader of Montenegrin Federalists - small, but very vocal group of adherents of Montenegrin autonomy. It would be great to get their support as well."
 YUG_korosec_slovenes:0 "Korošec's Slovenes"
 YUG_korosec_slovenes_desc:0 "We have many disagreements with the Slovenian conservative leader, Anton Korošec. Though he might support our federal program, as it would guarantee Slovenia's right to follow any ideology it would find correct."
 YUG_support_the_straza:0 "Support the Straža"
 YUG_support_the_straza_desc:0 "Straža originally was an academic club in the University of Ljubljana, which soon found itself a prominent Catholic anti-Communist organization, ready to defend Slovenian laws and traditions. New Slovenian authorities would find it useful."
 YUG_open_up_the_talks:0 "Back to 1920"
 YUG_open_up_the_talks_desc:0 "In late 1920 Yugoslavian politicians have gathered together to create a constitution for a young state. The outcome was nothing but a disaster. It's up to us to correct this mistake - and to create a new constitution."
 YUG_six_nations_solution:0 "Six-Nation Solution"
 YUG_six_nations_solution_desc:0 "The Prečani Front has accomplished its mission: Yugoslavia is now a federation, consisting of six equal parts: Serbia, Croatia, Slovenia, Bosnia, Montenegro and Macedonia. Hopefully, this is a compromise we were looking for."
 YUG_three_nations_solution:0 "Three-Nation Solution"
 YUG_three_nations_solution_desc:0 "The Prečani Front has failed. Our decisions has resulted in Croatia's worst nightmare: Serb majority rule. We've got a federation deal, sure, but one with a dominant Serbia. Perhaps, some would call this a compromise too."
 
 YUG_belgrade_opposition:0 "Belgrade Opposition"
 YUG_belgrade_opposition_desc:0 "There is a group of politicians who share the ideals of liberty and freedom, but are also keen on keeping the constitutional order in Yugoslavia. Those are the Belgrade liberals: the Agrarians, the Democrats and the Radicals."
 YUG_agrarian_initiatives:0 "Agrarian Initiatives"
 YUG_agrarian_initiatives_desc:0 "The Agrarian Party is the leftmost of the three parties. They strive for welfare of a common peasant, however, their unity is in danger. Without balance, they will split into two wings."
 YUG_nations_within_and_without:0 "Nations Within and Without"
 YUG_nations_within_and_without_desc:0 "Although we have no plans for making Yugoslavia federal, it would be naive to ignore national aspirations. Some of the issues spread beyond Yugoslavian borders."
 YUG_issues_south:0 "Issues in the South"
 YUG_issues_south_desc:0 "Vardar Macedonia, Kosovo and Metohija, collectively known as Old Serbia, have been a source of trouble for Belgrade for a few decades. It is necessary to keep an eye on them."
 YUG_favor_serb_settlets:0 "Favor Serb Settlers"
 YUG_favor_serb_settlets_desc:0 "It would be logical to assume that the Serbs have more interest in preserving Yugoslavia than Albanians or Macedonians. Hence, there must be more Serbs in the region."
 YUG_look_macedonian:0 "Look for Macedonian Votes"
 YUG_look_macedonian_desc:0 "With VMRO out of the legal field, Macedonians have no political force to support in the elections. Perhaps, the Agrarians can become such force? We can at least try to protect their interests."
 YUG_ZS_treaty_albania:0 "Treaty with Albania"
 YUG_ZS_treaty_albania_desc:0 "Migration treaty with Albania will make it possible for a significant part of Albanian population to migrate peacefully to Albania. This should benefit stability of the region regardless of our decisions to support Albanians or Serbs."
 YUG_ZS_treaty_bulgaria:0 "Treaty with Bulgaria"
 YUG_ZS_treaty_bulgaria_desc:0 "Migration treaty with Bulgaria will make it possible for a significant part of Bulgarian population to migrate peacefully to Bulgaria. This should benefit stability of the region regardless of our decisions to support Bulgarians or Serbs."
 YUG_support_serb_militias:0 "Support Serb Militias"
 YUG_support_serb_militias_desc:0 "As stability falls, tensions in Old Serbia rise. Ethnic groups form militias, preparing for a conflict. We must make sure that Serb population is protected."
 YUG_croatian_or_peasant:0 "Croatian or Peasant?"
 YUG_croatian_or_peasant_desc:0 "The Croatian Peasant Party emerged as an Agrarian party, but soon found herself protecting Croatian interests. It creates a discord within the party, which might be the key to the Croatian Question."
 YUG_consensus_peasants:0 "Consensus with Peasants"
 YUG_consensus_peasants_desc:0 "As an Agrarian party, we can and should find common ground with Croatian peasants. Thus, we can decrease HSS support there."
 YUG_welfare_nationhood:0 "Welfare Before Nationhood"
 YUG_welfare_nationhood_desc:0 "Our ability to get support in Croatia is fairly limited by Croatian national aspirations. Naturally, they don't want to vote for a Serbian party. We should prove them wrong: we bring them welfare, and nations can wait."
 YUG_keep_promises:0 "Keep Promises"
 YUG_keep_promises_desc:0 "Once our economy is in order and life quality is on the rise, Croats will see, that the Agrarians have done more for their life than the HSS."
 YUG_crackdown_nationalists:0 "Crackdown on Nationalists"
 YUG_crackdown_nationalists_desc:0 "Croatian nationalism is one of the greatest threats to our nation, and fighting it must be our most urgent necessity."
 YUG_demand_ustase:0 "Demand Ustaše Extradition"
 YUG_demand_ustase_desc:0 "The Ustaše threaten Yugoslavia daily. They have committed many crimes against our nation and must be punished. For that, however, they must be extradited from Italy first."
 YUG_purge_army:0 "Purge the Army"
 YUG_purge_army_desc:0 "Our army is full of separatist sympathizers, who will damage our war effort immediately after the start of the conflict. Our army must be cleansed from those elements."
 YUG_denounce_fascism:0 "Denounce Fascism"
 YUG_denounce_fascism_desc:0 "Some find fascism attractive, but we shouldn't. It's flaws and immoralities must be a constant reminder of danger it poses to our country."
 YUG_ask_france:0 "Ask France for Support"
 YUG_ask_france_desc:0 "France will support our independence, if it would be under threat... If only we have proper negotiations made in advance."
 YUG_provoke_italy:0 "Provoke Italy"
 YUG_provoke_italy_desc:0 "If war against Italy and the Ustaše is inevitable, we should meet it fully prepared. Let's not give Italy pleasure to attack us in the moment of our weakness and face their aggression now!"
 YUG_subordination_plowman:0 "Subordination to the Plowman"
 YUG_subordination_plowman_desc:0 "The left wing of the Agrarians demands the state to care about welfare of peasants, and pursues policies which introduce social programs for masses of rural population. However, if unchecked, they might go a little too far."
 YUG_open_new_schools:0 "Open New Schools"
 YUG_open_new_schools_desc:0 "Literacy rates in Yugoslavia are low, and those specifically to the south of Sava are miserable. There is no way for our nation to go forward without expanding the public education."
 YUG_promote_cooperatives:0 "Promote Cooperatives"
 YUG_promote_cooperatives_desc:0 "Cooperatives are a nice and brand new way of organizing agricultural activity, not involving useless intermediaries such as landlords. Introducing them to our economy will undoubtedly work well."
 YUG_reduce_working_day:0 "Reduce Working Hours"
 YUG_reduce_working_day_desc:0 "Reducing working day might not benefit our economy directly, but this would be an extremely popular measure, ensuring public contentment and stability."
 YUG_introduce_progressive_tax:0 "Introduce Progressive Taxation"
 YUG_introduce_progressive_tax_desc:0 "Progressive tax is the most obvious way to secure welfare of the peasants. Just take money from the rich!"
 YUG_third_position:0 "The Third Position"
 YUG_third_position_desc:0 "Agrarianism is not capitalism, and not Marxism either. We will follow our own path and take the best from the two."
 YUG_denounce_marxism:0 "Denounce Marxism"
 YUG_denounce_marxism_desc:0 "Marxism may sound well to unprepared minds, but its political practice is horrible. However socialist Agrarian policies might seem, they must have nothing to do with Marxism."
 YUG_peasant_militias:0 "Peasant Militias"
 YUG_peasant_militias_desc:0 "Peasant do have conquests to protect, and are going to have even more of those. Such protection won't limit itself to parliamentary debates - peasants need their own militia."
 YUG_deal_housing:0 "Deal with the Housing Crisis"
 YUG_deal_housing_desc:0 "Peasants are living in terrible conditions, having to deal with centuries of oppression. The government must do everything possible to distribute housing in a more fair fashion..."
 YUG_limit_land_ownership:0 "Limit Land Ownership"
 YUG_limit_land_ownership_desc:0 "Unfair possession of land is one of the greatest troubles, tormenting the peasants. Land ownership must be limited, and the richest landlords will concede some of their land to those less fortunate."
 YUG_universal_civil_conscription:0 "Universal Civil Conscription"
 YUG_universal_civil_conscription_desc:0 "Peasant labor is the noblest of all human activities. Sharing it would be an honor for the rest of the population, just as protecting our glorious land on the battlefield is."
 YUG_soil_primacy:0 "Soil Primacy"
 YUG_soil_primacy_desc:0 "The right wing of the Agrarians prioritizes agricultural economy. They will demand the state to pay attention to rural programs, claiming their primacy over whatever is going on in the cities."
 YUG_support_landowners:0 "Support Landowners"
 YUG_support_landowners_desc:0 "Our landowners, though often not fortunate, hold great potential. If they get a little help, they will make our agriculture more productive and successful."
 YUG_increase_state_economy:0 "Increase State Economy"
 YUG_increase_state_economy_desc:0 "Small landowners are ineffective, as they are not able to purchase modern agricultural equipment. It would be beneficial for everyone if the state uses their land instead."
 YUG_provide_cheap_credits:0 "Provide Cheap Credits"
 YUG_provide_cheap_credits_desc:0 "Cheap credits is the most obvious way to support the landowners. Having capital without falling into debt would lead them to investment into agricultural activities."
 YUG_purchase_small_companies:0 "Purchase Small Companies"
 YUG_purchase_small_companies_desc:0 "Increasing state economy can be achieved through purchasing small companies, too weak to compete on the market. They are often deep in debts, which the state can assume for a small price."
 YUG_reduce_production_cost:0 "Reduce Production Costs"
 YUG_reduce_production_cost_desc:0 "Reducing production costs will make our products more competitive on the market, benefitting both the workers and economy in general."
 YUG_suspend_social_programs:0 "Suspend Social Programs"
 YUG_suspend_social_programs_desc:0 "The state struggles to keep social programs. Too make our economy healthy once more, we should suspend social programs for a while."
 YUG_devaluate_dinar:0 "Devaluate the Dinar"
 YUG_devaluate_dinar_desc:0 "Devaluating the dinar might be a somewhat unpopular move, but this move will make our products more competitive abroad, consequently benefitting our economy."
 YUG_expand_planning:0 "Expand Planning Effort"
 YUG_expand_planning_desc:0 "State planning is necessary for modern economy, and we have been putting far too little attention there so far. We must concentrate on increasing state planning."
 YUG_micromanagement_agriculture:0 "Micromanagement in Agriculture"
 YUG_micromanagement_agriculture_desc:0 "Our agrarians often lack expertise, which leads them to poor decision making. Sometimes the state must interfere in agricultural activity directly to protect rural economy from poor decisions."
 YUG_agricultural_dirigisme:0 "Agricultural Dirigisme"
 YUG_agricultural_dirigisme_desc:0 "Instead of controlling every step of the farmer the state should limit itself to creating favorable conditions for the economy."
 YUG_democratic_aspirations:0 "Democratic Aspirations"
 YUG_democratic_aspirations_desc:0 "The Democrats appear as our primary ally in the government. Their goals are establishment of a long-lastic democratic regime, as well as healing of their split with the Independent Democrats. Without our support they will flip to Maček, which will ruin the government."
 YUG_admit_past_mistakes:0 "Admit Past Mistakes"
 YUG_admit_past_mistakes_desc:0 "Parliamentarism used to be quite a costly affair for Yugoslavia, leaving it underdeveloped and almost collapsing. Mistakes were made, and we must analyze them before attempting parliamentarism again."
 YUG_transcend_rivers:0 "Transcend the Rivers"
 YUG_transcend_rivers_desc:0 "The split between DS and SDS has divided the Democrats into Serbian and Prečani ones. In order to heal the split, the two parties must extend their contacts."
 YUG_excuse_parliamentarism:0 "Excuse Parliamentarism"
 YUG_excuse_parliamentarism_desc:0 "Parliamentarism is a good thing itself, and a few local fails should not discourage us from pursuing it. Yugoslavia must overcome those difficulties."
 YUG_liberty_before_ethnicity:0 "Liberty Before Ethnicity"
 YUG_liberty_before_ethnicity_desc:0 "Serbs and Croats sometimes have different views, and may understand the concept of liberty differently, but we both are freedom-loving nations, and this should bind us stronger than any national feelings."
 YUG_promote_compromise:0 "Promote Compromise"
 YUG_promote_compromise_desc:0 "In a political system like ours, one party should not and cannot dictate the state policies. The only way to rule the country is using compromises - and our political parties must understand it at last."
 YUG_denounce_obstructionism:0 "Denounce Obstructionism"
 YUG_denounce_obstructionism_desc:0 "The Croatian Peasant Party does have a reason to dislike the current political situation, but obstructionism is a terrible strategy, which brings nothing but trouble to the country. Parties following this strategy deserve nothing but disapproval."
 YUG_lead_by_example:0 "Lead by Example"
 YUG_lead_by_example_desc:0 "If we don't follow our own ideals, we are simple hypocrites. The Democrats must lead the rebirth of our democracy, ignoring the endless petty squabble."
 YUG_self_guiding_democracy:0 "Self-guiding Democracy"
 YUG_self_guiding_democracy_desc:0 "King Alexander had a vision of a "guided democracy" - a democratic regime, protected by a strong paternalistic leader from petty parliamentary squabble. Once our parliamentarism is well-established, we won't need a guide."
 YUG_unite_democrats:0 "Unite the Democrats"
 YUG_unite_democrats_desc:0 "We've did a good job in healing the split. The Independent Democrats are ready to rejoin our party, and together we will become a significant force in the upcoming elections."
 YUG_regional_concerns:0 "Regional Concerns"
 YUG_regional_concerns_desc:0 "Bosnian Muslims, Slovenes and Montenegrins have political parties in the parliament, playing an important part in our coalition. They demand our government to make concessions to their respective national groups, and will leave our coalition if we don't do it."
 YUG_compensate_muslims:0 "Compensate Muslim Landowners"
 YUG_compensate_muslims_desc:0 "Muslim landowners in Bosnia did face significant land readjustment since 1918, and its result wasn't positive for them. Compensation was, in many cases, inadequate, and Yugoslavian Muslim Organization demands to restore justice."
 YUG_allow_muslim_militias:0 "Allow Muslim Militias"
 YUG_allow_muslim_militias_desc:0 "Bosnia sometimes can be a dangerous place, and land readjustment didn't make this region safer. Muslims want to protect themselves collectively - by forming their own militias."
 YUG_adjust_to_sharia:0 "Adjust to the Sharia Law"
 YUG_adjust_to_sharia_desc:0 "Yugoslavian laws, worked out predominantly by Christians, are not always well-suited for Muslims. Yugoslavian Muslim Organization continuously fights for readjustment of Yugoslavian laws, and does so now as well."
 YUG_promote_bosnia:0 "Promote Bosnian Identity"
 YUG_promote_bosnia_desc:0 "Bosnia is Yugoslavia in miniature: a small, mountainous land, where many peoples with different religions live together. Bosnian identity is an alternative to ethnic one, and keeping it strong will make region a somewhat safer place."
 YUG_bring_korosec_to_government:0 "Bring Korošec to Government"
 YUG_bring_korosec_to_government_desc:0 "Anton Korošec, the leader of the Slovene People's Party, is an experienced politician and a successful administrator. In order to get support of the Slovenes he insists we include him in the government."
 YUG_oppress_socialists:0 "Oppress Socialists"
 YUG_oppress_socialists_desc:0 "The Slovene People's Party is a fairly conservative one, and has to compete with the socialists in Slovenia itself. They have a strong stance against socialism and would be eager to enforce it in Yugoslavia as a whole."
 YUG_slovene_vatican:0 "Concordat with Vatican"
 YUG_slovene_vatican_desc:0 "The Slovene People's Party is careful about religious feelings of the Slovenian population. In their eyes, the Catholic Church is treated as secondary to the Orthodox Church, which is one of the causes of dissent among the Slovenes. A Concordat with Vatican will prove them wrong, however, it may displease our Orthodox population."
 YUG_honor_montenegrin_greens:0 "Honor the Montenegrin Greens"
 YUG_honor_montenegrin_greens_desc:0 "Montenegro has a dubious honour of being the only Entente nation to disappear from the map entirely after the Great War. The civil war, which emerged in Montenegro soon after, has resulted with a loss of the Greens, who supported Montenegrin independence. They fought for their country, and must be at least honored."
 YUG_recreate_montenegrin_reg:0 "Recreate Montenegrin Regiments"
 YUG_recreate_montenegrin_reg_desc:0 "Montenegro has rich military traditions, even being referred to as "Serbian Sparta". The regiments of her army were disbanded after the Great War, however. Recreating them would bring those traditions back to life."
 YUG_strike_against_reds:0 "Strike Against the Reds"
 YUG_strike_against_reds_desc:0 "When the elections in the Constitutional Assembly were held, the Communist party recieved quite significant support from Montenegro. The Reds were never properly defeated there, and might become a problem once more."
 YUG_montenegrin_statehood_rights:0 "Montenegrin Statehood Rights"
 YUG_montenegrin_statehood_rights_desc:0 "Montenegro never gave up her rights for independence. In fact, she joined Serbia (and later Yugoslavia) voluntarily, after a popular vote. It means, that Montenegro can always leave Yugoslavia as well - if people wish so."
 YUG_radical_solutions:0 "Radical Solutions"
 YUG_radical_solutions_desc:0 "The People's Radical Party is, despite the name, rather conservative. It was the dominant political party in pre-war Serbia, and in Yugoslavia it emphasized its Serbian character. If the Radicals have joined the opposition, it means that the situation is desperate."
 YUG_rely_on_serbs:0 "Rely on the Serbs"
 YUG_rely_on_serbs_desc:0 "Yugoslavia was formed by attaching Croatian and Slovenian outbuildings to the Serbian house. Serbia lies at the core of the state, and we must rely on it."
 YUG_protect_serbdom:0 "Protect Serbdom"
 YUG_protect_serbdom_desc:0 "Serbdom is a national idea, forged in centuries of seemingly never-ending conflict. Serbs are always ready to protect themselves, though they dream that one day they won't have to. We should at least help them."
 YUG_imperial_mission:0 "Imperial Mission"
 YUG_imperial_mission_desc:0 "As an Orthodox nation, Serbs are not strangers to the concept of an Empire. They had one in late Medieval and have some sort of an empire right now. Non-Orthodox believers struggle to comprehend how any Balkan nation can claim to be an "imperial" one. We should put effort to clarify this."
 YUG_support_of_church:0 "Support of the Orthodox Church"
 YUG_support_of_church_desc:0 "We have a long and hard work ahead of us, which will demand some authority. If the Church is on our side, we will find this work easier."
 YUG_control_chetniks:0 "Control the Chetniks"
 YUG_control_chetniks_desc:0 "The Chetniks are always ready to protect Serbdom, but their actions are sometimes rather... ill-conceived. Once they see us as a power they can trust, we will have better control over them."
 YUG_decentralization:0 "Decentralization"
 YUG_decentralization_desc:0 "Decentralization should act as a part of our conservative agenda. Lesser control of the state over communal affairs would only benefit the commoners, keeping them from any government oppression."
 YUG_bring_peace_old_serbia:0 "Bring Peace to Old Serbia"
 YUG_bring_peace_old_serbia_desc:0 "Despite our best efforts, Old Serbia is still under constant threat of brigand attacks. We should definitely pay more attention to Kosovo and Macedonia."
 YUG_guarantee_minority_rights:0 "Guarantee Minorities' Rights"
 YUG_guarantee_minority_rights_desc:0 "Despite our emphasis on Serbian interests, protection of minorities' rights is a part of our agenda as well. Live and let live, as long as peace prevails."
 YUG_croatian_question:0 "Croatian Question"
 YUG_croatian_question_desc:0 "The Croatian Question has been tearing our nation apart since its very foundation. We should deal with it once and for all. Croatian leaders will no longer shame their nation."
 YUG_arrest_nationalists:0 "Arrest Nationalists"
 YUG_arrest_nationalists_desc:0 "Nationalism is a plague, starving Croatian people of their political potential. Once we arrest the nationalists, true Croatian leadership can emerge."
 YUG_arrest_socialists:0 "Arrest Socialists"
 YUG_arrest_socialists_desc:0 "Socialists are a vital threat to Yugoslavian people. They are enemies of all freedom, which they replace with an oppressive regime, only active in enriching itself."
 YUG_macek_to_prison:0 "Imprison Maček"
 YUG_macek_to_prison_desc:0 "Vladko Maček has been destabilizing Yugoslavia for many years, and is not only alive, but also active in politics! This is unacceptable. Maček bust be put to prison once again."
 YUG_purge_infiltrators:0 "Purge Infiltrators"
 YUG_purge_infiltrators_desc:0 "Even though the Communist Party has been outlawed long ago, its adherents never stopped political activity. Their primary political strategy was to infiltrate other parties, turning them left. Those infiltrators must be purged, just as the communists."
 YUG_enforce_order:0 "Enforce Order"
 YUG_enforce_order_desc:0 "Our party has joined the United Opposition only because the situation in the country was terribly dire. Therefore, order must be our ultimate goal: otherwise we wouldn't have to interfere."
 YUG_destroy_precani:0 "Destroy the Prečani Front"
 YUG_destroy_precani_desc:0 "The Prečani Front is now severely weakened, and can be destroyed! Those enemies of freedom will never have a chance to return to politics again."
 YUG_unite_radicals:0 "Unite the Radicals"
 YUG_unite_radicals_desc:0 "Since the death of Pašić, the Radical party has been divided into at least three camps. The main group should put effort to unite the party once again and stand together once more."
 YUG_honor_pasic:0 "Honor Nikola Pašić"
 YUG_honor_pasic_desc:0 "Nikola Pašić led Serbia through the Great War, and was one of the most infuential politicians in early Yugoslavia. His personality should act as a unifying factor for all Radicals - and for all Yugoslavs."
 YUG_loyalty_karadjordjevics:0 "Loyalty to Karađorđevićs"
 YUG_loyalty_karadjordjevics_desc:0 "Yugoslavia cannot be imagined without the Karađorđević House. We might have disagreements sometimes, but in the end we hold the same values."
 YUG_denounce_dictatorship:0 "Denounce the Dictatorship"
 YUG_denounce_dictatorship_desc:0 "Some authoritarian leadership might be useful sometimes, but a dictatorship is a terrible example. Dictator is an enemy of freedom, and must be treated accordingly."
 YUG_denounce_federalism:0 "Denounce Federalism"
 YUG_denounce_federalism_desc:0 "Even though we support decentralization, it has nothing to do with a federalization. Any federal division of Yugoslavia will only bring disputes and violence, rather then peace and prosperity."
 YUG_party_of_order:0 "The Party of Order"
 YUG_party_of_order_desc:0 "Some people may don't like the Radical methods or share their views, but even they would agree that what the Radicals struggle for is an orderly society. Nothing can operate in chaos properly."
 
 YUG_tackle_depression:0 "Tackle the Great Depression"
 YUG_tackle_depression_desc:0 "Yugoslavian economy has been underdeveloped in the first place, and the Great Depression has crippled what little that we had. If we want to recover, we must find the way to deal with the crisis."
 tackle_depression_tt:0 "\nThe national focuses within this branch unlock decisions which lead to the eventual §Gimprovement of the economy§!."
 YUG_abandon_gold_standard:0 "Abandon the Gold Standard"
 YUG_abandon_gold_standard_desc:0 "The Gold Standard kept the value of dinar since the XIX century, saving our currency from hyperinflation even during the Great War. Now it is a liability, as our trading partners struggle to keep value of their currencies' value and abandon the Gold Standard."
 YUG_precani_farmers:0 "Assist Prečani Farmers"
 YUG_precani_farmers_desc:0 "Prečani regions still maintain a viable agricultural economy, however, they need support to overcome the crisis and set the stage for industrial development."
 YUG_serbian_farmers:0 "Save Serbian Farmers"
 YUG_serbian_farmers_desc:0 "Serbian regions were hit hard by the Great Depression, struggling to repay their debts and living on substinence agriculture. There will be no talk of progress unless those farmers are given state support."
 YUG_urban_development:0 "Urban Development"
 YUG_urban_development_desc:0 "Belgrade, Zagreb and, to lesser extent, Ljubljana are our main cities and chief potential industrial centers. Further industrial development will require developing our cities."
 YUG_attract_investors:0 "Attract Foreign Investors"
 YUG_attract_investors_desc:0 "Yugoslavia has great economic potential, but lacks capital to realize it. One of our primary goals is to convince foreign capitalists to invest in our economy."
 YUG_tourism_promotion:0 "Promote Tourism"
 YUG_tourism_promotion_desc:0 "Our country has wonderful nature, and we would be happy to show it! Foreign tourists will bring money to our economy and encourage development of less prominent regions of Yugoslavia."
 YUG_lake_bled:0 "Lake Bled"
 YUG_lake_bled_desc:0 "Lake Bled is a lake in the Julian Alps in northwestern Slovenia. The lake lies in a picturesque environment, surrounded by mountains and forests. Medieval Bled Castle stands above the lake on the north shore. This would be a wonderful tourist destination."
 YUG_adriatic_coast:0 "Adriatic Coast"
 YUG_adriatic_coast_desc:0 "Dalmatian coast of the Adriatic Sea has wonderful beaches, however, lacks tourist infrastructure. If properly developed, Dalmatia can reinvent itself as a prosperous, rich and beautiful region."
 YUG_expand_mining:0 "Expand Mining Industry"
 YUG_expand_mining_desc:0 "As European industry recovers from the Great Depression, it requires more raw materials. Yugoslavia is rich with natural resourses, and expansion of mines will provide both capital and jobs to less developed Yugoslavian regions."
 YUG_bauxite_mining:0 "Develop Bauxite Mining"
 YUG_bauxite_mining_desc:0 "Nikšić, Vlasenica, Obrovac, Drniš and Mostar are all sites of bauxite deposits. Bauxite is a raw material for aluminum. With proper development, Yugoslavia will become a major aluminum-exporting country with strategic importance to the entire Europe."
 YUG_infrastructure_effort:0 "Infrastructure Effort"
 YUG_infrastructure_effort_desc:0 "Even though Yugoslavian infrastructure was given attention back in 1920s, as railway systems of Austria-Hungary and Serbia had to be unified, it's still far from ideal. More effort is required to make Yugoslavian infrastructure up-to-date."
 YUG_precani_railways:0 "Prečani Railways"
 YUG_precani_railways_desc:0 "Prečani regions generally have a significantly better railway system than Serbia. However, our booming mining centres in Bosnia and Dalmatia are less developed, require more attention, and would certainly enjoy a more elaborate railway system."
 YUG_serbian_railways:0 "Serbian Railways"
 YUG_serbian_railways_desc:0 "During the Great War, the only thing connecting Serbia to her allies was a single railway, running from Belgrade to Thessaloniki. Serbian regions outside Šumadija lack developed (or any) railway system, and it is strategically important to create one."
 YUG_tara_bridge:0 "Tara Bridge"
 YUG_tara_bridge_desc:0 "Bridge over the Tara River is not simply a project, designed to improve infrastructure in northern Montenegro. It would span the Tara Canyon, second longest in the world after Grand Canyon, and would become a wonder of Yugoslavian engineering for the entire world to see."
 YUG_industrial_effort:0 "Industrialization Effort"
 YUG_industrial_effort_desc:0 "With the Great Depression dealt with, Yugoslavian economy can resume its development and proceed to proper, much-needed industrialization."
 YUG_rogozarski_factory:0 "Rogožarski Aircraft Company"
 YUG_rogozarski_factory_desc:0 "Rogožarski Aircraft Company was established back in 1924 under the name of First Serbian Aircraft Factory of Živojin Rogožarski. However, it became bankrupt during the crisis, and now is in bad shape. It's time to vitalize one of our leading aircraft manufacturers."
 YUG_ikarus_factory:0 "Ikarus Aircraft Company"
 YUG_ikarus_factory_desc:0 "Ikarus – the First Serbian Airplane, Car and Engine Industry Kovačević and Co was established in Novi Sad in 1923. This factory was doing quite well in 1920s, but was hit by the crisis and even had to relocate itself to Zemun. Hopefully, one of our leading manufacturers now can recover."
 YUG_zar_engine_factory:0 "ZAR Engine Factory"
 YUG_zar_engine_factory_desc:0 "Zavodi Aleksandar Ranković is, unlike Rogožarski and Ikarus, a new company. It mostly specializes on tractor and engine production, but might find itself creating a wide range of products."
 YUG_foreign_licenses:0 "Buy Foreign Licenses"
 YUG_foreign_licenses_desc:0 "With relatively few designs of our own, our factories will find it useful to produce foreign machines and equipment, which, of course, require foreign licenses."
 YUG_truck_production:0 "Truck Production"
 YUG_truck_production_desc:0 "Yugoslavian roads are of poor quality, and require a suitable truck design, ready for our conditions. ZAR seems ready to create a design of their own, and provide us with high-quality trucks, suitable for our roads."
 YUG_litostroj:0 "Litostroj"
 YUG_litostroj_desc:0 "Litostroj would become a Slovenian heavy machinery manufacturer based in Ljubljana. Its name is derived from Livarna in tovarna strojev, meaning \"Foundry and Machine Factory\" in Slovene. One of its products would be water turbines, however, the production can be expanded to meet the military needs. "
 
 YUG_science_effort:0 "Scientific Effort"
 YUG_science_effort_desc:0 "Perhaps it's time to have rest from endless national quarrels? Let's pay attention to science. Research can be much more useful than another dispute in the Parliament."
 YUG_belgrade_uni:0 "University of Belgrade"
 YUG_belgrade_uni_desc:0 "Belgrade Higher School was established as early as in 1808, though it became university only in 1905. After the Great War it has seen a massive growth. Cooperation between the university and the state might bring mutual benefits."
 YUG_zagreb_uni:0 "University of Zagreb"
 YUG_zagreb_uni_desc:0 "University of Zagreb is the oldest in Yugoslavia, established back in 1669 as a Jesuit academy and in 1869 as a university. Its scientific activity allows Zagreb to compete or even surpass Belgrade as a research center. It would be foolish to ignore it."
 YUG_ljubljana_uni:0 "University of Ljubljana"
 YUG_ljubljana_uni_desc:0 "Slovenians have only succeeded in acquiring their own university after the Great War, in 1919. Today, King Alexander University in Ljubljana grows further, however, facing financial troubles."
 YUG_high_economy_school:0 "Economics High School"
 YUG_high_economy_school_desc:0 "Economics-Commercial High School would become the first center of higher education dedicated to the study of economics in Yugoslavia. With national economy becoming more complex each day, more effective ways of handling it must be researched."
 YUG_science_faculty:0 "Faculty of Science"
 YUG_science_faculty_desc:0 "Various scientific research is already conducted in the Faculty of Philosophy, tracing its origins back to the Jesuits. As demand for research increases, scientific departments demand their own faculty to be established."
 YUG_national_library:0 "National Library"
 YUG_national_library_desc:0 "National and University Library, designed by famous Slovenian architect Jože Plečnik, will become not only an important scientific, educational and cultiral institution, but also Ljubljana's new landmark."
 YUG_skoplje_uni:0 "Open University of Skoplje"
 YUG_skoplje_uni_desc:0 "Southern regions of Yugoslavia have long been underdeveloped, with literacy rates being far lower than in the north. Perhaps, a new university in Skoplje can give stimulus to local cultural and educational life?"
 
 YUG_army_effort:0 "Army Effort"
 YUG_army_effort_desc:0 "The Great War is not going to end all wars, after all. Italians dream of Dalmatia, Hungarians are eager to restore their pre-war borders, and Bulgarians can become a problem once more. The war is inevitable, and we must be prepared."
 YUG_equip_army:0 "Equip the Army"
 YUG_equip_army_desc:0 "The Serbian army has been underequipped in the Great War, and now the need for proper ammunition is even higher. We must put serious effort to equip our forces."
 YUG_foreign_equipment:0 "Foreign Equipment"
 YUG_foreign_equipment_desc:0 "Some of the equipment would take us years to develop on our own, and time is precious. Perhaps it's better to use foreign licenses."
 YUG_foreign_tankettes:0 "Foreign Tankettes"
 YUG_foreign_tankettes_desc:0 "The armoured warfare is upon us. We have already seen the tankettes used in the Great War, albeit not in the Salonica front, and they proved to be very effective."
 YUG_foreign_antiaircraft:0 "Foreign Anti-Aircraft Guns"
 YUG_foreign_antiaircraft_desc:0 "Our aircraft is advanced and can compete with the best foreign designs. However, succeeding in the air requires ground support."
 YUG_foreign_tanks:0 "Foreign Tanks"
 YUG_foreign_tanks_desc:0 "Tanks! Once an obscure innovation, now a vital part of the war. If we don't want our country to fall in two weeks, we absolutely must have some of our own."
 YUG_local_equipment:0 "Local Equipment"
 YUG_local_equipment_desc:0 "Some equipment can be designed and produced in Yugoslavia with little complications. However, we must put some effort nonetheless."
 YUG_local_artillery:0 "Local Artillery Designs"
 YUG_local_artillery_desc:0 "With the combat likely to be held on the rivers, artillery should be designed to strengthen our defences."
 YUG_local_rifles:0 "Local Rifle Designs"
 YUG_local_rifles_desc:0 "We have been using foreign rifles for a while (mostly Belgian and Czech ones). However, our country is capable of producing small arms of our own."
 YUG_local_antitank:0 "Local Anti-Tank Designs"
 YUG_local_antitank_desc:0 "Tanks are a serious threat to our defences, capable of overrunning our lines and encircling our entire armies. Anti-tank guns are vital neccesity to our defence."
 YUG_revise_logistics:0 "Revise Logistics"
 YUG_revise_logistics_desc:0 "Perhaps we are still using horses and rely on mountain trails, logistics can be improved without overwhelming contribution from our industry, at least on organisation level."
 YUG_radio_equipment:0 "Radio Equipment"
 YUG_radio_equipment_desc:0 "The war will require our troops to have the best communication possible. Radio provides just that."
 YUG_mountaineers:0 "Mountaineer Equipment"
 YUG_mountaineers_desc:0 "Large portion of our country is mountainous, and some of our frontiers lie on mountain ridges. Mountaineers would certainly help our army effort."
 YUG_airborne:0 "Airborne Equipment"
 YUG_airborne_desc:0 "Advantage in the air is something we hope to have, unless we fight an absolutely overwhelming force. Using airborne troops is one of the ways to exploit this advantage."
 YUG_infantry_effort:0 "Infantry Effort"
 YUG_infantry_effort_desc:0 "Infantry is the core and the heart of our army. Any effort to improve the army must involve improvement of our infantry."
 YUG_pride_of_kolubara:0 "Pride of Kolubara"
 YUG_pride_of_kolubara_desc:0 "The Battle of Kolubara raged in late 1914, as the Austro-Hungarians invaded Serbia for the third time that year. Belgrade has fallen, but a surprise Serbian counter-attack pushed the enemy back into Austria-Hungary. Win of the Serbian underdog has increased prestige of our army and set an example for future generations."
 YUG_lessons_of_morava:0 "Lessons of Morava"
 YUG_lessons_of_morava_desc:0 "The Morava Offensive Operation was undertaken by the Bulgarian Army in autumn 1915. As the Bulgarians captured the valley of Morava, the Serbian forces had to retreat to Kosovo and Metohija, and then all the way to Corfu."
 YUG_promote_gw_heroism:0 "Promote the Great War Heroism"
 YUG_promote_gw_heroism_desc:0 "Heroism is almost a regular thing for the Serbs. As Miloš Obilić died to kill the sultan Murad, the Serbs were ready to sacrifise themselves to save Serbia during the Great War. Heroes like Dragutin Gavrilović or Milunka Savić are known worldwide, and must not live in obscurity today."
 YUG_nis_our_verdun:0 "Niš is Our Verdun"
 YUG_nis_our_verdun_desc:0 "We can lose Slovenia or Croatia. Italians may enjoy whatever part of the Adriatic Coast they capture, and Hungarians don't mind returning to Vojvodina. Even Belgrade can fall. Niš, however, is unnegotiable. This is the key to our whole defensive system, and must be treated accordingly."
 YUG_army_maneuvers:0 "Army Maneuvers"
 YUG_army_maneuvers_desc:0 "While entering the Great War, we had no problem with army experience, as the Balkan Wars were over less than a year ago. Now, the situation is different. Our army needs experience."
 YUG_exercice_slovenia:0 "Exercise in Slovenia"
 YUG_exercice_slovenia_desc:0 "Military exersizes in Slovenia should not only give much-needed experience to our army, but also test the loyalty of our Croatian and Slovenian soldiers. If they prove themselves well, we will be able to trust them."
 YUG_exercice_macedonia:0 "Exercise in Macedonia"
 YUG_exercice_macedonia_desc:0 "Military exercises in Macedonia will involve warfare in the region, where the Serbs found themselves fighting in the three latest wars. Correct use of paramilitaries can be vital there."
 YUG_review_generals:0 "Review the Generals"
 YUG_review_generals_desc:0 "Not all of our generals are capable of fighting in the new war. As the maneuvers have shown, some are hopelessly stuck in the past. Those officers must give way to a new generation."
 YUG_accept_slovenes_croats:0 "Accept Croats and Slovenes"
 YUG_accept_slovenes_croats_desc:0 "Croats and Slovenes have proved themselves worthy. For sure, they are capable of defending our common nation, and must be treated as equals."
 YUG_ties_with_chetniks:0 "Ties with the Chetniks"
 YUG_ties_with_chetniks_desc:0 "You don't need to call the Chetniks to the fight twice. Control over them is, however, problematic. Proper coordination between the regular army and the paramilitary forces should be prioritized."
 YUG_yugoslavian_army:0 "Yugoslavian Army"
 YUG_yugoslavian_army_desc:0 "Serbian military traditions may be useful in the battlefield, but the all-Yugoslavian character of our armies strenghtens the unity of our young nation."
 YUG_serbian_army:0 "Serbian Army"
 YUG_serbian_army_desc:0 "As time goes on, the Serbs have only strenghtened their positions in the army. Old traditions are preserved, and Chetnik paramilitary activity is coordinated with the general staff."
 YUG_modern_army:0 "Modern Army"
 YUG_modern_army_desc:0 "Whatever which way, we are ready for war. They shall not pass."
 
 YUG_navy_effort:0 "The Royal Yugoslav Navy"
 YUG_navy_effort_desc:0 "Dealing with the Navy is perhaps something new for Serbians, but necessary to defend our shores. With the current situation in Europe, war on the Adriatic seems very probable."
 YUG_pragmatic_approach:0 "Pragmatic Approach"
 YUG_pragmatic_approach_desc:0 "There is no way for us to defeat Italy on the high seas. Striking against them at our shore and dealing with their convoys is, however, possible."
 YUG_cruiser_for_yugoslavia:0 "Cruiser for Yugoslavia"
 YUG_cruiser_for_yugoslavia_desc:0 "Dubrovnik may be one of the largest destroyers in the world, but it will stand no chance against the Italians. We can't afford a battleship, but obtaining a couple of cruisers is possible."
 YUG_naval_aviation:0 "Focus on Naval Aviation"
 YUG_naval_aviation_desc:0 "Our fleet is maybe not so strong itself, but will fight in home waters and can always rely on support from the air."
 YUG_yugoslavian_submarines:0 "Yugoslavian Submarines"
 YUG_yugoslavian_submarines_desc:0 "We don't want the enemy to rule over our waves, but can't do anything about it on the high seas. Submarines look like a logical choice."
 YUG_odvazni_class:0 "Odvažni-class"
 YUG_odvazni_class_desc:0 "Odvažni will become our new submarine type, ready to disrupt trade of any potential enemy of ours."
 YUG_vucji_copori:0 "Vučji Čopori"
 YUG_vucji_copori_desc:0 "Vučji Čopori, or Wolfpacks, is an innovative tactic of submarine warfare. It would certainly become handy in the future war."
 YUG_coastal_defence:0 "Focus on Coastal Defence"
 YUG_coastal_defence_desc:0 "We don't have to fight on the high seas. We can deal much more damage fighting at the shoreline, supported by the coastal defences."
 YUG_destroyer_fleet:0 "Naval Manouvers in the Adriatic"
 YUG_destroyer_fleet_desc:0 "If we want to pretect our coasts from Italy, we must first have a trained and ready-for-action fleet."
 YUG_split_dockyard:0 "Expand Split Dockyard"
 YUG_split_dockyard_desc:0 "Split already has a shipbuilding industry, waiting to be expanded. Geography of Dalmatia itself assumes naval warfare, and a facility like this must become our stronghold."
 YUG_tivat_arsenal:0 "Expand Tivat Arsenal"
 YUG_tivat_arsenal_desc:0 "Maritime arsenal in the Bay of Kotor was of strategic value for Austria-Hungary, as her fleet fought against Regia Marina in the Great War. We can use and expand this facility."
 YUG_beograd_class:0 "Beograd-class"
 YUG_beograd_class_desc:0 "We have decided to invest in enlarging our navy and we will need 3 destroyers to operate in a division led by Dubrovnik. For this purpose we will contact the French Navy to adquire a variant of their Bourrasque Class, the Beograd Class, and order the construction of the lead ship in France. The remainder two destroyers will be built locally at Jadranska brodogradilišta Yard in Split but under French supervision."
 YUG_croat_naval_traditions:0 "Croatian Naval Traditions"
 YUG_croat_naval_traditions_desc:0 "Croats, unlike Serbs, are accustomed to the sea and the navy. The Austro-Hungarian Navy relied heavily on the Croats, and Yugoslavia can too."
 YUG_the_orjen_class:0 "The Orjen-class"
 YUG_the_orjen_class_desc:0 "TODO"
 YUG_order_italian_gunboat: "Order the Beli Orao"
 YUG_order_italian_gunboat_desc: "We will order a Gunboat from the Italian Adriatico yard to be used as a Guard Ship for the Yugoslav Financial Guard. This will also improve our relations with the Italians."
 YUG_order_german_coastal_submarines: "Order German Submarines"
 YUG_order_german_coastal_submarines_desc: "Order German Submarines"
 YUG_fleet_to_be_proud:0 "A Fleet to be Proud Of"
 YUG_fleet_to_be_proud_desc:0 "We've done a good job developing our navy. Perhaps we will still lose at the sea, but at least we did everything we could."
 
 YUG_purchase_ships: "Foreign-built Ships"
 YUG_french_construction_beograd_class: "Building the Beograd"
 YUG_french_construction_beograd_class_desc: "The Beograd, name ship of its class, is being built by Ateliers et Chantiers de la Loire at Nantes by the French and will be sent to us after its finished."
 YUG_order_beli_orao: "Building the Beli Orao"
 YUG_order_beli_orao_desc: "The Beli Orao is being built by Cantieri Riuniti dell'Adriatico (CRDA) at the Adriatico yard in Trieste. It was originally designed to serve as a guard ship for the Yugoslav Financial Guard, however plans have changed and it will be completed as a Royal Yatch for use by [YUG.GetLeader] during peace time. In wartime she will be quickly converted to a gunboat with the intention to use it as an escort vessel."
 YUG_order_type_IIB_subs: "Building Type IIB German Submarines"
 YUG_order_type_IIB_subs_desc: "We have ordered 2 type IIB coastal submarines from the [GER.GetNameWithFlag]. These new and powerful submarines will be of great use in any possible war with Italy; being able to sneak past the strait of Otranto without being detected, we could join French and British submarines in the Mediterranean and send the Italian fleet to the bottom of the sea!"

 YUG_fortification_lines: "Fortification Lines"
 YUG_rupnik_line: "Build the Rupnik Line"
 YUG_rupnik_line_desc: "Amidst gradual worsening of relations between our country and Italy, a decree has passed officially to begin building a new fortification system along the border with Italy. The Rupnik line, named after General Leon Rupnik, is a safety measure that must be taken in order to counter the construction of the Italian Alpine Wall, as well as against the imposing danger of a German invasion. The Line has been inspired by various other fortification systems built along borders, mainly by France, Czechoslovakia and neighboring Italy."
 
 YUG_air_force_effort:0 "The Royal Yugoslav Air Force"
 YUG_air_force_effort_desc:0 "Air warfare is vital for modern war - and we may even have some advantage over our enemies in the air. However, our potential must be realized first."
 YUG_new_officers:0 "New Officers"
 YUG_new_officers_desc:0 "Aircraft is useless without men. New officers are vital for our fighting efficiency in the air."
 YUG_open_airforce_academy:0 "Open Air Force Academy"
 YUG_open_airforce_academy_desc:0 "Air Force Academy will become a new, bigger facility, where pilots will be trained."
 YUG_new_doctrines:0 "New Doctrines"
 YUG_new_doctrines_desc:0 "To use new aircraft in its full potential, we must create new doctrines, more suitable for modern war."
 YUG_two_experiences:0 "Two Air Forces Experience"
 YUG_two_experiences_desc:0 "Yugoslavian Air Force has officers who fought in both Serbian and Austro-Hungarian Air Forces. If we apply experience of both sides, we can obtain a relatively full picture."
 YUG_new_aircraft:0 "New Aircraft"
 YUG_new_aircraft_desc:0 "War is coming, and is going to be fought in the air. To have the upper hand, we must have better aircraft."
 YUG_archangel_michael_commands:0 "Archangel Michael Commands"
 YUG_archangel_michael_commands_desc:0 "And there was war in heaven: Michael and his angels fought against the dragon; and the dragon fought and his angels, And prevailed not; neither was their place found any more in heaven."
 YUG_foreign_designs:0 "Foreign Designs"
 YUG_foreign_designs_desc:0 "Foreign aircraft designs are usually superior to ours. If we obtain licenses to produce foreign planes, we can use advanced aircraft, maybe even against their original designers."
 YUG_yugoslavian_designs:0 "Yugoslavian Designs"
 YUG_yugoslavian_designs_desc:0 "Yugoslavian aircraft industry is relatively advanced, and our engineers like Rudolf Fizir or Sima Milutinović are able to produce domestic designs. Let us show the world some planes of our own!"
 YUG_hold_tender:0 "Hold Tender"
 YUG_hold_tender_desc:0 "To obtain the best designs available, we should tender for new aircraft. Various countries of Europe may have something to offer."
 YUG_assist_aircraft_industry:0 "Assist Aircraft Industry"
 YUG_assist_aircraft_industry_desc:0 "To produce aircraft, we need industry. A few government orders should vitalize our industry and contribute its growth."
 
 YUG_regional_cooperation:0 "Regional Cooperation"
 YUG_regional_cooperation_desc:0 "Smaller nations of Eastern Europe won't be able to stand alone against the Great Powers. If we want to survive the future war, we must act together."
 YUG_little_entente_dip:0 "Little Entente"
 YUG_little_entente_dip_desc:0 "The Little Entente can guarantee involvement of Czechoslovakia and Romania in case of attack from a foreign power. However, there's still much work to do before it can be transformed into a proper union."
 YUG_hej_sloveni:0 "Hej, Sloveni!"
 YUG_hej_sloveni_desc:0 "Czechs and Slovaks are our Slavic brothers, and their country very much resembles ours. A union of Slavic peoples, born in the fire of the Great War and looking forward to strenghten itself. Cooperation between our nations will certainly be mutually beneficial."
 YUG_decrease_tariffs:0 "Decrease Tariffs"
 YUG_decrease_tariffs_desc:0 "Trade between Yugoslavia and Czechoslovakia are not very prominent now, leaving great potential unrealized. Decreasing tariffs would be our first step to broader economic cooperation."
 YUG_mining_cooperation_cze:0 "Mining Assistance"
 YUG_mining_cooperation_cze_desc:0 "Czechoslovakian industry seems eager to invest in Yugoslavian mining activities. Such investment would give a boost to our economy, providing it with much needed vitality."
 YUG_cultural_cooperation:0 "Cultural Cooperation"
 YUG_cultural_cooperation_desc:0 "Bohemia was a cradle of Pan-Slavism, and now both Czechoslovakia and Yugoslavia follow its ideas. Our countries are united by something more than economy or politics. We share a common Slavic soul, and must remind ourselves about it more often."
 YUG_czech_machine_tools:0 "Czech Industrial Expertise"
 YUG_czech_machine_tools_desc:0 "If we ever want to develop our own industry, we should find an appropriate expertise abroad. Czechoslovakia has a great industry of her own, and we can certainly rely on her assistance."
 YUG_enemies_around:0 "Enemies Around"
 YUG_enemies_around_desc:0 "As Italy breaks one international law after another, and Hungary almost openly wills to bring back her former glory, our territorial integrity is in danger. We must be assured, that we won't stand alone against the enemy."
 YUG_raise_concerns_italy:0 "Raise Concerns over Italy"
 YUG_raise_concerns_italy_desc:0 "Italy may be adored by some, however, her seeming desire to recreate the Roman Empire results in blatant aggression against independent nations. Italy must be stopped by joint effort of peace-loving nations of Europe."
 YUG_protect_trianon:0 "Protect Trianon"
 YUG_protect_trianon_desc:0 "Current borders of Hungary are defined by the treaty of Trianon. Hungarians, undestandably, consider this treaty to be absolutely unfair toward their nation, and look forward to denounce it. It is in our common interest to keep this treaty in force."
 YUG_invite_austria:0 "Invite Austria"
 YUG_invite_austria_desc:0 "Austria, once a great multinational empire, is now a mere rump state. All three nations of the Little Entente are somewhat responsible for it, just as Italy. Perhaps, hope of regaining South Tyrol can bring Austria into our camp?"
 YUG_anti_italian_front:0 "Anti-Italian Front"
 YUG_anti_italian_front_desc:0 "Italians, perhaps, consider our agreements with Czechoslovakia and Romania non-essential, as those countries have no direct cause for fighting Italy. We must prove them wrong."
 YUG_stance_against_hungary:0 "Joint Stance Against Hungary"
 YUG_stance_against_hungary_desc:0 "Potential rise of Hungary will harm all the three nations. If we want to keep Hungary contained, we must do it together."
 YUG_treaty_of_novi_sad:0 "Treaty of Novi Sad"
 YUG_treaty_of_novi_sad_desc:0 "As our nations now understand the importance of a joint effort, we should transform the Little Entente into something new. Now, we will have a joint foreign policy, and our union will become a full-fledged player in European affair"
 
 YUG_balkan_pact_dip:0 "Balkan Pact"
 YUG_balkan_pact_dip_desc:0 "Balkan Pact was hard to create, and it will be even harder to make it work. It doesn't mean we shouldn't try, however."
 YUG_no_foothold_italy:0 "No Foothold for Italy"
 YUG_no_foothold_italy_desc:0 "Potential Italian agression is one of the reasons the Balkan Pact was established. To effectively counter it, we must make sure Italy doesn't get a foothold in Albania."
 YUG_cajole_albania:0 "Cajole Albania"
 YUG_cajole_albania_desc:0 "We believe, negotiating with Albanian government should be the first step. If Albania decides to join the Balkan Pact, it would be easier for everyone. Or, we can do things the hard way."
 YUG_the_hard_way:0 "The Hard Way"
 YUG_the_hard_way_desc:0 "We have no choice. Albania seems to prefer her Italian masters over freedom-loving Balkan nations. We will have to take control over Albania the hard way."
 YUG_guarantee_zog:0 "Guarantees for Zog"
 YUG_guarantee_zog_desc:0 "King Zog agrees that the future of Albania lies with the Balkan Pact. However, apparently, he can't trust neither Italy nor his own country, and would like to get certain guarantees from us. We provide him our support."
 YUG_partition_albania_bp:0 "Partition Albania"
 YUG_partition_albania_bp_desc:0 "Independent Albania has proven to be a failed state, and a viability to other Balkan nations. It's time to end this. Yugoslavia and Greece will have to occupy Albania once again, leaving no room for Italian troops."
 YUG_albania_joins:0 "Albania Joins"
 YUG_albania_joins_desc:0 "Now, as Albania has herself prepared, we can count on her as a small, but valuable ally. We are one step closer to a proper Balkan union."
 YUG_troublesome_brothers:0 "Troublesome Brothers"
 YUG_troublesome_brothers_desc:0 "Despite being brothers, Serbs and Bulgarians had fought three times during the last 60 years. In order to bring order to the Balkans, we must have at least some sort of reconciliation."
 YUG_bulgaria_over_greece:0 "Bulgaria over Greece"
 YUG_bulgaria_over_greece_desc:0 "Why would Yugoslavia ally herself to Romania and Greece? Do we have to fight against our Slavic brethren? Bulgaria is our true ally. The rest of the Balkan Pact won't like it, but who cares?"
 YUG_limited_cooperation:0 "Limited Cooperation"
 YUG_limited_cooperation_desc:0 "We are loyal to our Balkan allies, but Bulgarian involvement in the pact is necessary for our common security. Perhaps Bulgaria would agree with us."
 YUG_cultural_rights_macedonia:0 "Cultural Rights in Macedonia"
 YUG_cultural_rights_macedonia_desc:0 "As our relations with Bulgaria has become better, we should solve certain issues between us. Providing cultural rights to the population of Macedonia will become a friendly step in our mutual relations."
 YUG_vmro_no_more:0 "VMRO No More"
 YUG_vmro_no_more_desc:0 "VMRO, based in Bulgaria, has been terrorising our part of Macedonia for many years. Yugoslavia and Bulgaria should make a joint effort in destroying this organization."
 YUG_bulgaria_joins:0 "Bulgaria Joins"
 YUG_bulgaria_joins_desc:0 "It was unlikely to see Bulgaria joining the Balkan Pact, but it somehow happened. The Balkans have become much safer."
 YUG_treaty_of_kavala:0 "Treaty of Kavala"
 YUG_treaty_of_kavala_desc:0 "Balkans were never as united as they are now. Nations of the peninsula has finally thrown away their petty bickering and are ready to act as one. We are one treaty away from forming a proper bloc."
 
 YUG_defend_yugoslavia:0 "Defend Yugoslavia"
 YUG_defend_yugoslavia_desc:0 "Whatever some may say, the Great War is not going to end all wars. New global conflict is coming, and Yugoslavian soil must be properly defended."
 YUG_fortifying_efforts: "Fortifying Efforts"
 YUG_drava_line:0 "Drava Line"
 YUG_drava_line_desc:0 "Any invader from the north will meet an easily penetrable plain and encounter few natural obstacles. Drava river is one of those. This is where the defensive line will be drawn."
 YUG_building_drava_line: "Building the Drava Line"
 YUG_protect_vardar_valley:0 "Protect Vardar Valley"
 YUG_protect_vardar_valley_desc:0 "Vardar valley is a strategically important route, which connects core Yugoslavian territory with the Aegean Sea. Protecting this valley from a foreign invasion can become a vital point of our war effort."
 YUG_protecting_vardar_valley: "Fortifying the Vardar Valley"
 YUG_guard_dalmatia:0 "Guard Dalmatia"
 YUG_guard_dalmatia_desc:0 "Coastal fortifications are just as important as inland ones. With a strong shield at the Adriatic, we will have better chances if a naval invasion takes place."
 YUG_sava_line:0 "Sava Line"
 YUG_sava_line_desc:0 "Sava is the next natural barrier the enemy may encounter after passing Drava. The area between two rivers is populated by the Croats, who may destroy our war effort in the most crucial moment. Bulding another line in the south is a logical solution."
 YUG_building_sava_line: "Building the Sava Line"
 YUG_fortify_belgrade:0 "Fortify Belgrade"
 YUG_fortify_belgrade_desc:0 "Once other lines fall, Belgrade will become a direct target of the foreign attack. Urban warfare in such a city as Belgrade can be hell, and this is our duty to make it so."
 
 YUG_preserve_neutrality:0 "Preserve Neutrality!"
 YUG_preserve_neutrality_desc:0 "War is something we cannot afford under any circumstances. Any war will tear our country apart, leaving us no chance to win. Therefore, war must be avoided."
 YUG_appease_great_powers:0 "Appease the Great Powers"
 YUG_appease_great_powers_desc:0 "The Great Powers around are looking for a just cause to attack and destroy us. We'll give them none."
 YUG_agree_italy:0 "Agree with Italy"
 YUG_agree_italy_desc:0 "Our relations with Italy have long been problematic. Fortunately, Italy has other issues to care about. We should draw Italian attention elsewhere. "
 YUG_leave_albania:0 "Leave Albania to Her Fate"
 YUG_leave_albania_desc:0 "Why would we even care about Albania? Annexing part of its territory would only bring us more problems. Destruction of Albania will bring us only benefits."
 YUG_betray_greece:0 "Betray Greece"
 YUG_betray_greece_desc:0 "Keeping the old Serbian-Greek alliance becomes more and more dangerous to us. If Italy wants to invade Greece, we don't care. Better them than us."
 YUG_trade_germany:0 "More Trade with Germany"
 YUG_trade_germany_desc:0 "Germany has lately put significant interest in our economy. We should meet their demands. Or else..."
 YUG_recognize_german_rights:0 "Recognize German Ethnic Rights"
 YUG_recognize_german_rights_desc:0 "Yugoslavia is a home to more than 500.000 Germans, struggling to protect their ethnic rights. Our government should intervene, before some foreign government does."
 YUG_recognize_soviet_union:0 "Recognize the Soviet Union"
 YUG_recognize_soviet_union_desc:0 "Yugoslavia haven't recognize the Soviet Union for a long time. The political reality is, old Russia is not coming back. We must finally establish diplomatic relations with the USSR."
 YUG_allow_communists:0 "Allow the Communist Party"
 YUG_allow_communists_desc:0 "Even with diplomatic relations with USSR established, our relations remain cold. Allowing the communist party will improve them."
 YUG_better_pact_than_war:0 "Better Pact than War"
 YUG_better_pact_than_war_desc:0 "World War has no place for ideologic crusades! Yugoslavia is not a mistress of her fate, as extremist states put our country in great danger. If we have an opportunity to join them, we have to use it."
 YUG_neutralize_neighbors:0 "Neutralize Neighbors"
 YUG_neutralize_neighbors_desc:0 "The war may come to us from some of our neighbors, striving to annex part of our territory. We shouldn't let that happen."
 YUG_leave_the_pacts:0 "Leave the Pacts"
 YUG_leave_the_pacts_desc:0 "Yugoslavs are not going to die for Romanian interests. Same can be said about interests of the Czechs, Greeks or Turks. If we have any pacts with them, we must leave."
 YUG_friendship_hungary:0 "Friendship with Hungary"
 YUG_friendship_hungary_desc:0 "Hungary is surrounded by enemies. Perhaps, they can forget about their claims in Vojvodina in exchange for turning one of her enemies into an observer?"
 YUG_reconsile_bulgaria:0 "Reconciliation with Bulgaria"
 YUG_reconsile_bulgaria_desc:0 "Our South Slavic brothers have suffered two national catastrophes already, and don't want to face a third one. We can assure the Bulgarians, that we don't want it either."
 YUG_accord_austria:0 "Accord with Austria"
 YUG_accord_austria_desc:0 "The rump state of Austria has repeatedly shown signs of revanchism, which has brought her many enemies. Yugoslavia wouldn't mind Austrian expansion, as long as Austria doesn't threaten Slovenia."
 
 YUG_war_close:0 "The War is Close!"
 YUG_war_close_desc:0 "War is coming, whether we want it or not. Truth is, we must pe prepared for it in any case."
 YUG_suspend_elections:0 "Suspend the Elections"
 YUG_suspend_elections_desc:0 "Having elections during wartime is a luxury we are not able to afford. Assuming that elections tend to harm our stability, it would be better to temporarily suspend them."
 YUG_pause_parliament:0 "Pause the Parliament"
 YUG_pause_parliament_desc:0 "Parliament is a horrible place, where politicians interfere with the government for personal gains. During wartime, the government must assume extensive powers and act without parliament."
 YUG_secret_mobilization:0 "Secret Mobilization"
 YUG_secret_mobilization_desc:0 "Openly calling for a mobilization is dangerous, as it might bring instability to our current situation. What if we make a secret mobilization instead?"
 YUG_enforce_conscription:0 "Enforce Conscription"
 YUG_enforce_conscription_desc:0 "Those Croatian traitors don't want to mobilize?! What do you mean?! Stop draft evasion immediately!"
 YUG_dont_stir_hornets:0 "Don't Stir the Hornet's Nest"
 YUG_dont_stir_hornets_desc:0 "Croats don't want to mobilize? Well, we certainly don't want potential traitors in our ranks, so we should let them be."
 
 YUG_we_are_at_war:0 "We Are at War!"
 YUG_we_are_at_war_desc:0 "The war has come, whether we wanted it or not. Every decision we have made by this moment matters now."
 YUG_destroy_fifth_column:0 "Destroy the Fifth Column"
 YUG_destroy_fifth_column_desc:0 "Once the war started, we have faced numerous acts of treason. We must deal with this disorder immediately."
 YUG_purge_army_war:0 "Purge the Army"
 YUG_purge_army_war_desc:0 "Given our situation, treason in the army is the most dangerous aspect of the treasonous activity of our enemies. It must be stopped immediately."
 YUG_fight_bandits:0 "Fight the Bandits"
 YUG_fight_bandits_desc:0 "Once the army is back under full control, we must deal with the armed groups in our countryside. We won't tolerate an attack from the rear!"
 YUG_check_industry:0 "Check the Industry"
 YUG_check_industry_desc:0 "Sabotage in industry is rampant, as anti-government activity negatively affects our economy. We musr put an end to this."
 YUG_inspect_politicians:0 "Inspect Politicians"
 YUG_inspect_politicians_desc:0 "Turns out that Yugoslavian politicians have affiliations to countries other than Yugoslavia. In this case, democracy should wait."
 YUG_united_we_stand:0 "United We Stand"
 YUG_united_we_stand_desc:0 "We have destroyed the fifth column, ravaging our country from within. Now it's time to fight - united, and with our full force."
 YUG_save_what_we_can:0 "Save What We Can"
 YUG_save_what_we_can_desc:0 "The war might demand us to leave certain lands we are not able to defend. We must be ready to save what we can from those lands."
 YUG_evacuate_croatia:0 "Evacuate Croatia"
 YUG_evacuate_croatia_desc:0 "It's very likely that we will have to leave Croatia and establish a frontier on the Sava River. Valuable Croatian industry must be evacuated."
 YUG_evacuate_belgrade:0 "Evacuate Belgrade"
 YUG_evacuate_belgrade_desc:0 "Belgrade is our capital, but it's ultimately expendable. People and industries of Belgrade aren't. however. Our efforts must concentrate on evacuating the city."
 YUG_prepare_for_guerilla:0 "Prepare for Guerilla"
 YUG_prepare_for_guerilla_desc:0 "Losing a classical frontline war is not the end for Yugoslavia, as we can shift to a guerilla war eventually. We will fight as our ancestors did - where we like to fight."
 YUG_get_ready_chetniks:0 "Get Ready, Get Ready Chetniks!"
 YUG_get_ready_chetniks_desc:0 "Although Chetniks may become a double-edged sword, their support would be invaluable in the guerilla war. We should assist them in every way we can."
 YUG_mountains_will_protect:0 "Mountains Will Protect Us"
 YUG_mountains_will_protect_desc:0 "We may lose the plains of Serbia or Croatia, but the mountainous terrain of the Dinaric Alps can be held much longer. We can establish our base there."
 
 YUG_old_friends_previous_war:0 "Old Friends From the Previous War"
 YUG_old_friends_previous_war_desc:0 "We have fought alongside Britain, France and Russia in the Great War. Russia has sadly succumbed to the evil red plague, but Britain and France are still around. If the new war is coming, we must restore old alliances."
 YUG_focus_on_britain:0 "Focus on Britain"
 YUG_focus_on_britain_desc:0 "Britain looks promising as an ally. Whatever happens, the United Kingdom will be there, providing us support with the might of her fleet and industry."
 YUG_focus_on_france:0 "Focus on France"
 YUG_focus_on_france_desc:0 "France looks like the greatest military force in Europe, able to destroy both Germany and the Soviets. It would be wise to focus on them."
 YUG_support_british_agents:0 "Support British Agents"
 YUG_support_british_agents_desc:0 "We are aware of the existence of British agents within our elites, and we don't mind it. We even might find it useful to support them against neutrality advocates."
 YUG_join_uk:0 "Join the UK"
 YUG_join_uk_desc:0 "We are now prepared to join the British alliance. Together for victory!"
 YUG_anti_german_stance:0 "Anti-German Stance"
 YUG_anti_german_stance_desc:0 "Our fathers died fighting the Germans, and we are ready to do the same. We will beat the Fritz once again!"
 YUG_great_war_remember:0 "Great War Remembrance"
 YUG_great_war_remember_desc:0 "The Great War was over not long ago, and many participants of those events are still alive. We should once again remember sacrifices we made, and ready to make again."
 YUG_french_advisors:0 "Bring French Advisors"
 YUG_french_advisors_desc:0 "France is willing and able to send her military advisors to Yugoslavia. Our army will benefit, and more importantly, this step will bring us closer to France."
 YUG_join_france:0 "Join France"
 YUG_join_france_desc:0 "We are ready to fight alongside France once again. They shall not pass!"
 
 YUG_protect_fragile_unity:0 "Protect Fragile Unity"
 YUG_protect_fragile_unity_desc:0 "We have managed to achieve unity and establish a federation. It's our duty to protect it."
 YUG_local_elections_3pf:0 "Local Elections"
 YUG_local_elections_3pf_desc:0 "Under our new constitution, local elections are as important as national ones (if not more important). We should keep an eye on them."
 YUG_examine_croatia:0 "Examine Croatia"
 YUG_examine_croatia_desc:0 "Even though the Croatian Peasant Party became a loyal part of JRZ, the same can't be said about all of the members of this party."
 YUG_intervene_bosnia:0 "Intervene in Bosnia"
 YUG_intervene_bosnia_desc:0 "Bosnia appears to have certain issues to deal with. Those might result from the new borders within federal Yugoslavia."
 YUG_align_ban:0 "Align the Ban"
 YUG_align_ban_desc:0 "We have entrusted Ivan Šubašić with the task of being Ban of Croatia. We shouldn't doubt his loyalty, however, it's important to make sure he has the same view on the situation as we do."
 YUG_get_rid_of_spaho_3pf:0 "Get Rid of Spaho"
 YUG_get_rid_of_spaho_3pf_desc:0 "Mehmed Spaho has been a voice of Bosnian Muslims for the last decade. This voice has become increasingly critical in the new federal Yugoslavia. This voice should go silent."
 YUG_fight_catholic_church:0 "Fight the Catholic Church"
 YUG_fight_catholic_church_desc:0 "Our coalition partners from the Croatian Peasant Party are convinced that the Catholic Church provides support to the Ustaše. We have no reason not to trust them."
 YUG_bring_struggle_to_slovenia:0 "Bring the Struggle to Slovenia"
 YUG_bring_struggle_to_slovenia_desc:0 "The Catholic Church is under strict surveillance in Croatia, but enjoys full freedom in Slovenia. If we want our moves to be effective, we shouldn't limit ourselves with Croatian borders."
 YUG_reduce_tensions:0 "Reduce Tensions"
 YUG_reduce_tensions_desc:0 "It turns out that federalization of Yugoslavia has provoked ethnic tensions, as many Croats, Serbs and Muslims found themselves in a "wrong" banovina. If uncontrolled, it may lead to disaster."
 YUG_replace_local_administration:0 "Replace Local Administrations"
 YUG_replace_local_administration_desc:0 "Instead of supporting our efforts to reduce tensions in Bosnia, many locally elected administrations sparked them instead, promoting their ethnic group at the expense of other ones. There must be no place for this!"
 YUG_align_serbian_guerillas:0 "Align With Serbian Guerillas"
 YUG_align_serbian_guerillas_desc:0 "Serbian guerillas may become a useful instrument for our government, if we use them correctly. We can defeat violence with violence! What can possibly go wrong?"
 YUG_advance_loyal_chetniks:0 "Advance Loyal Chetniks"
 YUG_advance_loyal_chetniks_desc:0 "Chetnik organizations have power struggle of their own, as various leaders have conflicts with each other. We must make sure that those Chetniks who support us win this struggle."
 YUG_vodja_vodja:0 "Vodja! Vodja! Vodja!"
 YUG_vodja_vodja_desc:0 "Some regimes enjoy popularity, some count on public order and brute force. Our regime should follow both. Prime Minister Milan Stojadinović, head of the JRZ, is our true leader! Let us all call him!! Vodja! Vodja! Vodja!"
 YUG_strenghten_greenshirts:0 "Strenghten the Greenshirts"
 YUG_strenghten_greenshirts_desc:0 "Any animal has its teeth. JRZ, our political animal, has some. Those are young men, who wear green and who are ready to protect interests of Yugoslavia from any dangers from within."
 YUG_personality_cult:0 "Introduce Personality Cult"
 YUG_personality_cult_desc:0 "Our country is alive and well due to one man only: Milan Stojadinović. He is the leader of Yugoslavia, and every Yugoslavian must know him, love him and be ready to die for him. Vodja! Vodja! Vodja!"
 YUG_a_la_duce:0 "A La Duce"
 YUG_a_la_duce_desc:0 "We want to organize our state following the example of Italy. Mussolini wil be remembered as one of the most successful leaders of the XXth century! Yugoslavia can't possibly learn anything bad from him."
 
 YUG_deal_on_their_terms:0 "Deal on Their Terms"
 YUG_deal_on_their_terms_desc:0 "We cannot afford postponing the Croatian Question any longer, as powers around will be easily able to use this vulnerability of ours. We need a deal, and we need it now."
 YUG_long_live_federal_yugoslavia:0 "Long Live Federal Yugoslavia"
 YUG_long_live_federal_yugoslavia_desc:0 "Prime Minister Maček is an obvious candidate to represent Croatia, and the Head of State will represent Serbia. It is now duty of those two gentlemen to come to a conclusion, which would benefit both peoples."
 YUG_long_live_unconquered_croatia:0 "Long Live Unconquered Croatia"
 YUG_long_live_unconquered_croatia_desc:0 "As any political people, Croats must possess their own territory. Long live federal Yugoslavia! Long live never conquered Croatia!"
 YUG_regent_vs_prime:0 "Regent vs Prime Minister"
 YUG_regent_vs_prime_desc:0 "As the head of the HSS Maček is an obvious choice to represent the Croats, but it's not yet clear who is going to represent the Serbs. Struggle between the regent and Prime Minister Stojadinović seems inevitable."
 YUG_intrigue_elite:0 "Intrigue Among the Elite"
 YUG_intrigue_elite_desc:0 "It's better not to spread the struggle too far. Ideally, it should be kept away from the masses and stay an enclosed elite affair."
 YUG_bring_dispute_people:0 "Bring the Dispute to the People"
 YUG_bring_dispute_people_desc:0 "Unfortunately, we are not able to establish the leadership in Serbia by easy means. The next step would be mobilizing the public."
 YUG_armed_solutions:0 "Armed Solutions"
 YUG_armed_solutions_desc:0 "We have to proceed with extreme measures. At this point, the only way to end this struggle is to use brute force. Sad to see us going this far."
 YUG_replace_stojadinovic:0 "Replace Stojadinović"
 YUG_replace_stojadinovic_desc:0 "Finally, we are ready to replace Stojadinović from his cabinet. This narcissistic buffoon has gone too ambitious, and may become too powerful if not stopped immediately. Dragiša Cvetković will replace him."
 YUG_long_live_king_peter:0 "Long Live King Peter"
 YUG_long_live_king_peter_desc:0 "Finally, we are ready to replace the regent. Young Peter will be crowned as the king, and we will turn him into our obedient puppet."
 YUG_banovina_croatia:0 "Banovina of Croatia"
 YUG_banovina_croatia_desc:0 "Banovina of Croatia will become an autonomous province within Yugoslavia. Its parliament and Ban will control all local affairs outside defense, internal security, foreign policy, trade, and transport."
 YUG_croatian_local_elections:0 "Croatian Local Elections"
 YUG_croatian_local_elections_desc:0 "Local elections in Croatia are the first step to effective government. There will be no progress without those."
 YUG_hss_party_discipline:0 "HSS Party Discipline"
 YUG_hss_party_discipline_desc:0 "Croatian Peasant Party attracts many people who don't share her liberal values. It's our duty to preserve her principles."
 YUG_keep_serbs_under_sds:0 "Keep Serbs under Democrats"
 YUG_keep_serbs_under_sds_desc:0 "Banovina of Croatia is a home for hundreds of thousands of Serbs. We welcome them as a part of the democrats - and as a part of the Prečani Front. Otherwise they might join extremist forces."
 YUG_elect_croatian_sabor:0 "Elect Croatian Sabor"
 YUG_elect_croatian_sabor_desc:0 "Sabor, the Parliament of Croatia, will be elected once more. It's in our interests to prepare for those elections as good as we can."
 YUG_ostracize_croat_nationalists:0 "Ostrasize Croat Nationalists"
 YUG_ostracize_croat_nationalists_desc:0 "Croat nationalists are numerous, and many of them have even joined the Croatian Peasant Party. Those people are dangerous and should be kept away from power."
 YUG_strike_church:0 "Strike Against the Church"
 YUG_strike_church_desc:0 "Church has influence in Croatia, and uses this influence to support the Ustaše! The HSS is eager to stop this, and waits for approval from Belgrade to start a full-scale anti-clerical activity."
 YUG_cripple_ustase:0 "Cripple the Ustaše"
 YUG_cripple_ustase_desc:0 "Without the Church support the Ustaše are vulnerable. They lose their positions every day. We need one final blow to finally destroy this menace."
 YUG_identify_communists:0 "Identify Communist Infiltrators"
 YUG_identify_communists_desc:0 "There are communist infiltrators in the Prečani Front, both in the HSS and among the democrats. They are always eager to spark conflict, and this is exactly what we want to prevent."
 YUG_destroy_reds:0 "Destroy the Reds"
 YUG_destroy_reds_desc:0 "The far-left has significantly strenghtened itself after the establishment of the Croatian Banovina. Ban Šubašić would welcome our involvement in the matter of destroying the influence of the Reds."
 YUG_fighting_backlash:0 "Fighting the Backlash"
 YUG_fighting_backlash_desc:0 "Establishment of the Croatian Banovina has caused a significant backlash from other peoples, who find it unfair that only the Croats get their own substate. If not managed, it will remain a source of threat."
 YUG_get_rid_of_spaho_midhist:0 "Get Rid of Spaho"
 YUG_get_rid_of_spaho_midhist_desc:0 "Mehmed Spaho, the leader of the Yugoslav Muslim Organization, is one of the most ardent opponents of the Croatian Banovina. He claims that division of Bosnia threatens the Muslims. It would be better to silent him."
 YUG_emphasize_temporality:0 "Emphasize Temporality"
 YUG_emphasize_temporality_desc:0 "Banovina of Croatia is a temporary solution, and must be treated accordingly. Future of Yugoslavia is still a matter of discussion, but it should only take place after the war."
 YUG_give_voice_to_kulenovic:0 "Give Voice to Kulenović"
 YUG_give_voice_to_kulenovic_desc:0 "Džafer Kulenović became the leader of the Yugoslav Muslim Organization after the death of Spaho, and his views are openly pro-Croatian. Perhaps this is a way to include Muslims into the new order?"
 YUG_align_skk:0 "Align the Serbian Culture Club"
 YUG_align_skk_desc:0 "The Serbian Culture Club was formed as a reaction to the establishment of the Croatian Banovina. It struggles to promote Serbian rights and interests. We should align this powerful organization."
 YUG_presence_in_bosnia:0 "Increase Presence in Bosnia"
 YUG_presence_in_bosnia_desc:0 "Bosnia is a potential powder keg, and any rise of ethnic tensions will turn into tragedy. The government absolutely must bring attention there."
 YUG_disarm_guerillas:0 "Disarm Guerlillas"
 YUG_disarm_guerillas_desc:0 "Guerillas are a constant source of threat, as they may easily turn their weapons against civilians. Even though they increase our combat ability, we cannot tolerate such risks. "
 YUG_independent_courts_midhis:0 "Independent Courts"
 YUG_independent_courts_midhis_desc:0 "Conflicts in Bosnia are ethnic in nature, and go beyond usual crime. Courts are particularly vulnerable to ethnic confrontation. It's vitally important to keep courts in Bosnia independent."
 YUG_control_local_municipal:0 "Control Local Municipalities"
 YUG_control_local_municipal_desc:0 "Local municipalities may act as supporters of peace, or as warmongers. We should support the first and destroy the latter."
 YUG_keep_fragile_order:0 "Keep the Fragile Order"
 YUG_keep_fragile_order_desc:0 "Public order in Yugoslavia is fragile, and bringing perpetual peace there is, perhaps, impossible. At least we did everything we could."
 
 YUG_freedom_through_unity:0 "Freedom Through Unity"
 YUG_freedom_through_unity_desc:0 "The only way for Yugoslavian peoples to remain free is to remain united. Otherwise, our peoples would be too small and weak to protect their freedom."
 YUG_reinvent_unitarism:0 "Reinvent Yugoslavian Unitarism"
 YUG_reinvent_unitarism_desc:0 "Yugoslavian unitarism was popular in 1920s and promoted by King Alexander. Today it's largely considered a failure. Now we understand, that unity is not a question of better government. It's a question of survival of our peoples."
 YUG_one_nation_under_three_names:0 "One Nation Under Three Names"
 YUG_one_nation_under_three_names_desc:0 "Yugoslavia was called the Kingdom of Serbs, Croats and Slovenes ones. Those are, in fact, not peoples, but mere names to describe our common nation. This would be the core of our agenda."
 YUG_reject_subnational_cause:0 "Reject Subnational Cause"
 YUG_reject_subnational_cause_desc:0 "Our ruling parties have long been following national cause, albeit Serbian, Croatian or Slovenian. It's time to shift our attention only to one nation - Yugoslavia."
 YUG_break_subnational:0 "Break with Subnational Parties"
 YUG_break_subnational_desc:0 "Some parties in our coalition still support regional interests while gaining benefits from being in power. This has to stop."
 YUG_end_nationality_politics:0 "The End of Nationality Politics"
 YUG_end_nationality_politics_desc:0 "There will be no nationality politics anymore, just as King Alexander wanted. The only remaining parties in politics will bear all-Yugoslavian character."
 YUG_intervene_slovenia:0 "Intervene in Slovenia"
 YUG_intervene_slovenia_desc:0 "Slovenia didn't spark much conflict in Yugoslavia, but it's a home to one of the strongest national movements in our nation - Slovenian People's Party. This stronghold has to be conquered eventually."
 YUG_death_of_korosec:0 "Death of Korošec"
 YUG_death_of_korosec_desc:0 "Anton Korošec has always been among the leading politicians in Yugoslavia, and his death is a great loss for our nation. With his death however, Slovenian national politics became much weaker."
 YUG_split_sls:0 "Split the SLS"
 YUG_split_sls_desc:0 "Slovenian People's Party is not exactly divided, but there is potential for it. Since the death of Korošec the party has been experiencing a power struggle, and it's in our interests to deepen those conflicts. "
 YUG_disarm_straza:0 "Disarm the Straža"
 YUG_disarm_straza_desc:0 "Straža is a clerical anti-communist militia, which might be used for the purpose of Slovenian separatism. Although we cannot tolerate communists, we cannot tolerate potential separatists either."
 YUG_croatian_question_srblib:0 "Croatian Question"
 YUG_croatian_question_srblib_desc:0 "Croatia has always been an issue, and probably always will be. Now it's our turn to draw our attention there."
 YUG_destroy_hss:0 "Destroy the HSS"
 YUG_destroy_hss_desc:0 "The Croatian People's Party was one of the leading parties in Yugoslavia for the entirety of her existence, but now it experiences a crisis. If it's not dead yet, we must make sure it is."
 YUG_investigate_catholic_church:0 "Investigate the Catholic Church"
 YUG_investigate_catholic_church_desc:0 "The Catholic Church has never been particularly loyal to Yugoslavia. It's a major supporter of Slovenian and Croatian nationalism, and must be dealt with accordingly."
 YUG_pressure_clergy:0 "Put Pressure on Clergy"
 YUG_pressure_clergy_desc:0 "The clergy is connected to anti-Yugoslavian elements in a way our state would find treasonous. We can, however, use the Church to investigate anti-Yugoslavian activity."
 YUG_no_more_montenegrin_fed:0 "No More Montenegrin Federalism"
 YUG_no_more_montenegrin_fed_desc:0 "Montenegro is in certain aspects an unfortunate country, which won the Great War but was annexed afterwards. At least, that's what Montenegrin Federalists say. We say the opposite: Montenegro is an essential part of Yugoslavia."
 YUG_outlaw_cgfs:0 "Outlaw the CGFS"
 YUG_outlaw_cgfs_desc:0 "Montenegrin Federalist Party calls itself federalist, but in fact separatist. There is no place for separatism in Yugoslavian political field."
 YUG_review_local_adm:0 "Review Local Administrations"
 YUG_review_local_adm_desc:0 "Montenegrin Federalists was able to elect some of its members to local offices in Montenegro. Once this party is outlawed, its political influence must be eliminated."
 YUG_disarm_green_guerillas:0 "Disarm Green Guerillas"
 YUG_disarm_green_guerillas_desc:0 "The Greens are Montenegrin irregulars, ready to fight for independence of Montenegro once their leaders call for it. Rather than fighting an open battle, we must deal with them during peacetime."
 YUG_counter_serb_chauvinism:0 "Counter Serb Chauvinism"
 YUG_counter_serb_chauvinism_desc:0 "Some Serbs dislike an idea of Yugoslavia, calling for a Greater Serbia instead. Those impulses are understandable but harmful for the welfare of the state."
 YUG_unite_serbdom_with_yugoslavism:0 "Unite Serbdom with Yugoslavism"
 YUG_unite_serbdom_with_yugoslavism_desc:0 "Serbdom was a concept which was established long before Yugoslavism, and which was fought for multiple times. It would be suicidal for us to fight against Serbdom, but maybe we can unite this idea with that of Yugoslavia?"
 YUG_lovcen_adorned_petrovic:0 "Lovćen is Adorned by Petrovićs..."
 YUG_lovcen_adorned_petrovic_desc:0 "Why would Montenegro be independent if her Petrović kings oppose it? Quite the opposite, her traditional monarchs support Yugoslavia."
 YUG_kosovo_by_obilics:0 "...and Kosovo by Obilićs"
 YUG_kosovo_by_obilics_desc:0 "Montenegro was the Serbian Sparta once. Her many victories were won under Serbian banner. Let us unite under the banner of the heroes of Kosovo, rather than oppose each other."
 YUG_bosnian_issues:0 "Bosnian Issues"
 YUG_bosnian_issues_desc:0 "Bosnia is a home to many religions, and any conflict within Yugoslavia finds its way there. We should expect trouble there."
 YUG_get_rid_of_spaho_srblib:0 "Get Rid of Spaho"
 YUG_get_rid_of_spaho_srblib_desc:0 "Spaho has been a voice of Bosnian Muslims for too long. His rhetoric is harmful and dangerous, therefore it must be stopped by us. Otherwise, someone else would try to do that in a worse manner."
 YUG_increase_presence_in_croatia:0 "Increase Presence in Croatia"
 YUG_increase_presence_in_croatia_desc:0 "Croatia is a home to the most consistent protest against Yugoslavism, which might spark a rebellion. Military measures would be adequate there."
 YUG_strike_against_ustase:0 "Strike Against the Ustaše"
 YUG_strike_against_ustase_desc:0 "The Ustaše may be strong, but now they are vulnerable. Strike at once!"
 YUG_resign_nationalist_commanders:0 "Resign Nationalist Commanders"
 YUG_resign_nationalist_commanders_desc:0 "Many Chetnik commanders oppose the idea of Yugoslavia, preferring a Greater Serbia instead. We should make sure those Chetniks are far from power."
 YUG_support_moderate_chetniks:0 "Support Moderate Chetniks"
 YUG_support_moderate_chetniks_desc:0 "There are responsible Chetniks, who value the king and country more than nationalist ideals. Those are the people we can trust."
 YUG_depoliticize_mosques:0 "Depoliticize Mosques"
 YUG_depoliticize_mosques_desc:0 "We tolerate Islam, of course. It's an ancient religion which bears valuable traditional values. We will not, however, tolerate political Islam."
 YUG_peace_in_bosnia:0 "Peace in Bosnia"
 YUG_peace_in_bosnia_desc:0 "Bosnia is safe! At least, for now. And if danger comes to Bosnia once more, we will be there to destroy it."
 
 YUG_preserve_federal_yugoslavia:0 "Preserve Federal Yugoslavia"
 YUG_preserve_federal_yugoslavia_desc:0 "New Federal Yugoslavia is still weak and vulnerable to attacks from within. It is our duty to preserve and save her."
 YUG_hold_regional_elections:0 "Hold Regional Elections"
 YUG_hold_regional_elections_desc:0 "Regional elections are vital for our political system, perhaps even more than general elections. Those elections will determine our political reality for the upcoming years."
 YUG_intervene_in_montenegro:0 "Intervene in Montenegro"
 YUG_intervene_in_montenegro_desc:0 "Montenegro used to be relatively quiet in the old Yugoslavia, but now the conflict between federalist Greens and unionist Whites is relevant once again."
 YUG_support_the_whites:0 "Support the Whites"
 YUG_support_the_whites_desc:0 "The Whites support the idea of Montenegro being a part of Yugoslavia. Maybe it's natural for us to support them, however, this may anger the regional powers in Montenegro."
 YUG_replace_ban_popovic:0 "Replace Ban Popović"
 YUG_replace_ban_popovic_desc:0 "Krsto Popović is the ban of Montenegro and a former Green. His role is crucial and loyalty is questionable. Therefore, a new ban must be appointed."
 YUG_support_the_greens:0 "Support the Greens"
 YUG_support_the_greens_desc:0 "The Greens have been our ally in the Constitutional Assembly, and now are naturally in control of Montenegro. Supporting them against the Whites would bring peace to Montenegro and reduce tensions there."
 YUG_close_border_with_serbia:0 "Close the Border with Serbia"
 YUG_close_border_with_serbia_desc:0 "The Whites support the idea of Montenegro being a part of Serbia. Of course, they have support from Serbia. Those ties must be cut, even if that means closing internal borders."
 YUG_intervene_in_macedonia:0 "Intervene in Macedonia"
 YUG_intervene_in_macedonia_desc:0 "Macedonia has suddenly become a state of her own within federal Yugoslavia, without her problems being fully solved. We absolutely must pay our attention there."
 YUG_support_macedonians:0 "Support the Macedonians"
 YUG_support_macedonians_desc:0 "Macedonians are the majority of the local population, and supporting them will bring popular support to our regime there."
 YUG_weaken_bulgarian_control:0 "Weaken Bulgarian Border Control"
 YUG_weaken_bulgarian_control_desc:0 "In their struggle with the Serbs Macedonians have to rely on Bulgarians, who have their own interests there. If we want to defeat Serbian insurgents, we will have to weaken control over the Bulgarian border."
 YUG_support_the_serbs:0 "Support the Serbs"
 YUG_support_the_serbs_desc:0 "The Serbs are a minority in Macedonia, but their loyalty to Yugoslavia is much stronger. Supporting them would strenghthen our control over this state."
 YUG_strike_vmro_united:0 "Stike at VMRO (United)"
 YUG_strike_vmro_united_desc:0 "VMRO (United) is a leftist splitter from the main body of VMRO. They are communist insurgents in anything but name, and their ultimate goal is destruction of Yugoslavia. We must destroy them first."
 YUG_intervene_in_bosnia:0 "Intervene in Bosnia"
 YUG_intervene_in_bosnia_desc:0 "Bosnia is a home to the most competitive political system among all of the Yugoslavian states. We must make sure that political activity there remains peaceful."
 YUG_death_of_spaho:0 "Death of Spaho"
 YUG_death_of_spaho_desc:0 "Mehmed Spaho, the head of the Yugoslavian Muslim Organisation, is dead. His death threatens to change Bosnian politics unpredictably."
 YUG_preserve_serb_croat_coalition:0 "Preserve Croat-Serb Coalition"
 YUG_preserve_serb_croat_coalition_desc:0 "Croat-Serb coalition in Bosnian politics has been preserving peace in Bosnia for a while. It should remain so."
 YUG_support_croat_muslim_coalition:0 "Support Croat-Muslim Coalition"
 YUG_support_croat_muslim_coalition_desc:0 "New Muslim leadership looks Croat-friendly and actively seeks an alliance with the Croats. Perhaps, this new coalition would make Bosnia more safe and independent from Greater Serbian ideas."
 YUG_promote_leftist_rhetoric:0 "Promote Leftist Rhetoric"
 YUG_promote_leftist_rhetoric_desc:0 "Croat-Serbian alliance looks unnatural at first sight, but can be explained by common leftist agenda. Leftist rhetoric is a glue which must strenghten this coalition."
 YUG_cooperation_communists:0 "Cooperation with the Communists"
 YUG_cooperation_communists_desc:0 "Muslims and the Ustaše are organized and sometimes armed. Their paramilitaries threaten peace in Bosnia. Perhaps, locals should ally themselves with another extremist group?"
 YUG_enforce_hss_party_discipline:0 "Enforce HSS Party Discipline"
 YUG_enforce_hss_party_discipline_desc:0 "Croatian Peasant Party has become much more Croatian than Peasant in the old Yugoslavia. Some party members tend to support full Croatian independence rather than our common Yugoslavian cause. This is unacceptable."
 YUG_replace_ban_budisavljevic:0 "Replace Ban Budisavljević"
 YUG_replace_ban_budisavljevic_desc:0 "Ban Budisavljević is a Serb, and his actions deliberately antagonize the Croat-Muslim coalition. Until new ban is appointed, the split within Bosnian government will remain."
 YUG_full_powers_to_bosnians:0 "Full Powers to Bosnian Government"
 YUG_full_powers_to_bosnians_desc:0 "Some initiatives of the Bosnian government demand approval from the federal government, and are often disrupted by Belgrade. Bosnians demand more local autonomy and freedom for themselves in order to deal with the Serbian threat."
 
 YUG_second_rd:0 "Second Royal Dictatorship"
 YUG_second_rd_desc:0 "The First Royal Dictatorship was installed in Yugoslavia on January 6, 1929. The Constitution was abolished, Parliament prorogued and personal monarch's rule imposed. The Second one would be similar... but perhaps even worse."
 YUG_mobilizing_state:0 "Mobilizing the State"
 YUG_mobilizing_state_desc:0 "Our state machine is not in the best condition for our current situation. Right now, the only thing it must do is to follow orders and not ask questions. Several meetings with the bureaucrats would make it clear what the state requires them to do."
 YUG_introduce_personality_cult:0 "Introduce Personality Cult"
 YUG_introduce_personality_cult_desc:0 "King Alexander, the founder of Yugoslavia. The father of every Yugoslav child, and a son of every Yugoslav mother. How can anyone not love His Majesty? Not loving His Majesty is illegal."
 YUG_tame_democratic_politicians:0 "Tame Democratic Politicians"
 YUG_tame_democratic_politicians_desc:0 "There are certain politicians in Yugoslavia, who consider the political rights of the population to be more important than state security. They can stick to their beliefs as long as they don't spread them."
 YUG_expand_odz:0 "Expand the ODZ"
 YUG_expand_odz_desc:0 "Odeljenje za državnu zaštitu (State Security Department) was created in 1921 as the Yugoslavian secret police. Even though it was reformed in 1929, it still requires significant expansion."
 YUG_intensify_propaganda:0 "Intensify Propaganda"
 YUG_intensify_propaganda_desc:0 "We are proud defenders of Yugoslavia and the true defenders of victory in the Great War. They are communist Ustaše traitors probably hired by Austro-Hungarian intelligence. If we say this often enough, people will believe us."
 YUG_revive_orjuna:0 "Revive the ORJUNA"
 YUG_revive_orjuna_desc:0 "Organizacija Jugoslavenskih Nacionalista (Organization of Yugoslav Nationalists) was a political organization, which attacked communists, democrats, Jews, separatists, Croatian nationalists, and Serbian nationalists. It was dissolved in 1929. Let's bring them back!"
 YUG_grassroot_control:0 "Grassroot Control"
 YUG_grassroot_control_desc:0 "The will of our regime goes from top to bottom. Some of its vigors get lost in the middle, and we don't get the expected results. More control is needed to strengthen our state machine."
 YUG_break_strikes:0 "Break the Stikes"
 YUG_break_strikes_desc:0 "Without the support of the politicians, replaced with strikebreakers, under attacks from our irregulars, general strikes stand no chance. Civil resistance must be broken once and for all."
 YUG_cautious_stabilization:0 "Cautious Stabilization"
 YUG_cautious_stabilization_desc:0 "Some time has passed since the coup. The challenges we are facing have become less sharp. Those which remain, however, can't be solved with violence alone. We must go further and produce something besides endless repressions."
 YUG_preparations_against_rebels:0 "Preparations Against the Rebels"
 YUG_preparations_against_rebels_desc:0 "There are reasons to believe that anti-Yugoslavian forces are preparing a rebellion against the Royal rule. It is necessary for us to come up with a strategy to weaken this rebellion as much as possible."
 YUG_strenghten_grip_over_south:0 "Strengthen the Grip over the South"
 YUG_strenghten_grip_over_south_desc:0 "Southern parts of our country, Kosovo and Vardar Macedonia, have always been a source of trouble for Belgrade. If we don't increase our presence there, the rebels would find many allies amongst Macedonians and Albanians."
 YUG_strike_at_croats:0 "Strike at Croats"
 YUG_strike_at_croats_desc:0 "HSS is the main force behind the rebellion, and Croatia will certainly be its stronghold. We must strike there when we still can to defeat the revolt before it even starts."
 YUG_negotiate_bosnians:0 "Negotiate with Bosnians"
 YUG_negotiate_bosnians_desc:0 "We have good reasons to believe that Mehmed Spaho and his Yugoslav Muslim Organization will agree to become our allies in the upcoming war. It would require some talks, of course."
 YUG_no_mercy_slovenes:0 "No Mercy for Slovenes"
 YUG_no_mercy_slovenes_desc:0 "Instead of trying to negotiate with Slovenes, we should treat them the same way as Croats - as potential rebels. This won't bring us their loyalty but might weaken the rebellion."
 YUG_deal_with_slovenes:0 "Deal with Slovenes"
 YUG_deal_with_slovenes_desc:0 "Once the agreement with the Muslims has been reached, we would be in a better position to negotiate with Anton Korošec and his Slovenes. Given the geographical position of Drava Banovina, the stance of Slovenes might become crucial."
 YUG_yugoslavian_terror:0 "Yugoslavian Terror"
 YUG_yugoslavian_terror_desc:0 "Let them hate me, so they but fear me. Yugoslavs may not like Petar Živković, but they certainly fear him. Rather than complaining about this, we should find benefits."
 
 YUG_reintegrate_lost_provinces:0 "Reintegrate Lost Provinces"
 YUG_reintegrate_lost_provinces_desc:0 "Even if the main armies of our opponents are defeated, it doesn't mean we are in full control of their territory. Some effort should be made to bring the lost provinces back to normality."
 YUG_destroy_macedonian_terrorism:0 "Destroy Macedonian Terrorism"
 YUG_destroy_macedonian_terrorism_desc:0 "The best days of the VMRO are over, but some terrorist activity is still present in Macedonia. Let's finish it off."
 YUG_our_slovenian_allies:0 "Our Slovenian Allies"
 YUG_our_slovenian_allies_desc:0 "During the war, the Slovene People's Party has shown itself an unreliable partner. Belgrade should align itself with several local politicians who are not part of SLS, like Pucelj, Kramer, or Marušič."
 YUG_negotiate_kosutic:0 "Negotiate with Košutić"
 YUG_negotiate_kosutic_desc:0 "The Croats have lost, and some HSS members like August Košutić are ready to admit it. We should convince Košutić that he can still protect Croat interests... In alliance with Belgrade."
 YUG_attract_former_hss:0 "Attract Former HSS"
 YUG_attract_former_hss_desc:0 "With Košutić on our side, we can attract a large portion of HSS to our cause. It would be a blow Maček and other traitors won't withstand."
