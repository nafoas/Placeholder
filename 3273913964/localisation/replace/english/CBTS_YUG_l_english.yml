 YUG_treason_politics_worst_desc:0 "Many Yugoslavian politicians use their offices to harm decision-making abilities of our country. This is especially true for local politicians, who use their power to support bandits and interfere with the government efforts within their municipalities. The scale of this treachery corresponds our worst forecasts. It's up to as to deal with this problem once it becomes possible."
 YUG_active_guerilla:0 "Active Guerilla"
 YUG_active_guerilla_desc:0 "South Slavic peoples practiced guerilla warfare for centuries. Chetniks, hajduks and uskoks conducted guerilla activities long before the word "guerilla" became popular outside Spain. In many ways, this type of war is more natural for the Balkans than modern war. Eventually, irregulars have defeated the Turks, fought fearlessly against the Hungarians, and, some would say, were victorious over the Habsburg Empire. South Slavic peoples are ready to fight as irregulars once again, whoever dares to attack us."
 YUG_croatian_banovina:0 "Banovina of Croatia"
 YUG_croatian_banovina_desc:0 "The Banovina of Croatia or Banate of Croatia is an autonomous province (banovina) of the Kingdom of Yugoslavia. The borders of the Banovina of Croatia are partly the historical borders of Croatia, and partly based on the application of the principle of ethnicity. Under the Agreement, central government continues to control defense, internal security, foreign policy, trade, and transport; but an elected Sabor and a crown-appointed ban decide internal matters in Croatia."
 YUG_strikes_bad:0 "Strikes!"
 YUG_strikes_bad_desc:0 ""
 YUG_strikes_worse:0 "Widespread Strikes!"
 YUG_strikes_worse_desc:0 ""
 YUG_yugoslav_terror:0 "Yugoslavian Terror"
 YUG_yugoslav_terror_desc:0 ""
 YUG_struggle_klubasi_won:0 "Yugoslavian Power Struggle: Klubaši Won"
 YUG_struggle_klubasi_won_desc:0 ""
 YUG_struggle_klubasi_winning:0 "Yugoslavian Power Struggle: Klubaši Are Winning"
 YUG_struggle_klubasi_winning_desc:0 ""
 YUG_struggle_balanced:0 "Yugoslavian Power Struggle: Balance"
 YUG_struggle_balanced_desc:0 ""
 YUG_struggle_zborasi_winning:0 "Yugoslavian Power Struggle: Zboraši Are Winning"
 YUG_struggle_zborasi_winning_desc:0 ""
 YUG_struggle_zborasi_won:0 "Yugoslavian Power Struggle: Zboraši Won"
 YUG_struggle_zborasi_won_desc:0 ""
 

 YUG_ethnic_clashes:0 "Ethnic Clashes"
 YUG_ethnic_clashes_desc:0 "War is hell. In Yugoslavia, hell is everywhere. There are no frontlines and armies. There are irregulars, who fight innocent civilians in their neighborhood. Peoples and religions see each other as mortal enemies, murdering each other for deeds done long ago. Perhaps, this is the end for Yugoslavia as we know her."
 
# LEADER DESCRIPTIONS
 POLITICS_ALEXANDER_KARADJORDJEVIC_DESC:0 "King Alexander I of Yugoslavia served as a prince regent of the Kingdom of Serbia from 1914. As prince regent, he proclaimed the creation of the Kingdom of Serbs, Croats, and Slovenes on December 1, 1918. He later became King of Serbs, Croats and Slovenes in 1921. Continuing his efforts to unify his subjects, Alexander changed the name of the country to Yugoslavia, outlawed all political parties based on ethnic, religious, or regional distinctions, reorganized the state administratively, and standardized legal systems, school curricula, and national holidays. In the process Alexander created a police state that required military support for survival. Although Alexander’s acts were at first well-received, demands for a return to democratic forms intensified by 1932, when a major economic crisis resulting from the worldwide depression added to political dissatisfaction."
 POLITICS_PRINCE_PAUL_DESC_DESC:0 "Prince Paul of Yugoslavia, also known as Pavle Karađorđević, is Prince Regent of Yugoslavia while King Peter II is a minor. Paul was educated at the University of Oxford, where he was a member of the exclusive Burlington Club - a dining club notorious for its wealthy members, grand banquets and boisterous rituals. Cultivated like his closest friends Prince George, Duke of Kent, and Sir Henry Channon, his outlook on life is said to be British."
 POLITICS_PETAR_ZIVKOVIC_DESC:0 "Petar Živković is Regent of Yugoslavia while King Peter II is a minor. A soldier at the Serbian court, he helped to overthrow the Obrenović dynasty with the assassination of King Aleksandar Obrenović. Živković later founded the secret organization White Hand in 1912, which served to counter the power of the Black Hand. Alexander I appointed Živković commander of the Palace Guards, but he was briefly demoted due to accusations by a young guardsman that he tried to seduce the youth. In 1929, he was set up as strongman by royal decree as part of the 6 January Dictatorship."
 POLITICS_NIKOLA_UZUNOVIC_DESC:0 "Nikola Uzunović is Regent of Yugoslavia while King Peter II is a minor. In 1904, aged 31 he was elected to the Niš municipality, and after eight months, a deputy in front of the Radical Party. Uzunović became the eighth Prime Minister of Yugoslavia on 8 April 1926, however faced with internal conflict within the party, a succession of short term governments, came and went under his watch. In May 1932, Uzunović helped found the JRSD to support Alexander's government."

# EVENTS
  ## Internal affairs
 yugoslavia.100.t:0 "Vidovdan"
 yugoslavia.100.d:0 "Vidovdan is a Serbian national and religious holiday, and an important part of its national identity. The Serbian Orthodox Church uses it to venerate St. Vitus and designates it as the memorial day to Saint Prince Lazar and the Serbian holy martyrs who fell during the epic Battle of Kosovo against the Ottoman Empire.\n\nOn Vidovdan, June 28, 1389, at Kosovo Polje, the Serbs and their allies suffered a defeat that has become hallowed in several great heroic ballads. The vision of Lazar on the eve of the battle, the alleged betrayal by the Bosnian Vuk Branković, the killing of Murad by Miloš Obilić, the succor brought to the wounded on the battlefield by the Maid of Kosovo — these and other stories have been immortalized in Serbian folk literature."
 yugoslavia.100.a:0 ""Ko da mi otme iz moje duše Kosovo...""
 yugoslavia.102.t:0 "Anton Korošec Submits!"
 yugoslavia.102.d:0 "During the morning negotiations on the island of Hvar, Anton Korošec, the leader of the Slovenian People's Party, has finally agreed to support our regime and join the government.\n\nAs a result, Slovenia is now on our side."
 yugoslavia.102.a:0 "A pleasant change."
 yugoslavia.103.t:0 "Mehmed Spaho Submits!" 
 yugoslavia.103.d:0 "Mehmed Spaho, the leader of the Yugoslav Muslim Organization, has finally agreed to support our regime and join the government after long months of imprisonment.\n\nAs a result, Bosnia is now on our side."
 yugoslavia.103.a:0 "A pleasant change."
 yugoslavia.104.t:0 "Murder of Josip Predavec"
 yugoslavia.104.d:0 "Under our orders the vice president of the Croatian Peasant Party, Josip Predavec, was assassinated today in front of his house. We can portray the murder as a revenge-motivated act of the killer, Tomo Koščec, or do nothing and admit that our regime is responsible."
 yugoslavia.104.a:0 "Koščec is responsible."
 yugoslavia.104.b:0 "We are responsible."
 yugoslavia.105.t:0 "New Prime Minister"
 yugoslavia.105.d:0 "Prime Minister Milan Srškić has officially resigned today at the behest of the King, and thus a replacement must be chosen immediately.\n\nThere are two clear choices: Nikola Uzunović, a former mayor of Niš and the current minister of agriculture, and Petar Živković, a former commander of the Palace Guards and the founder of the White Hand. Both are loyal supporters of the King and have been Prime Ministers in the past."
 yugoslavia.105.a:0 "Uzunović - the former radical."
 yugoslavia.105.b:0 "Živković - the White Hand strongman."
 yugoslavia.106.t:0 "Romania Agrees!"
 yugoslavia.106.d:0 "The Romanian foreign minister has issued a statement through our diplomatic channel which proclaims that Romania has agreed to cooperate with Yugoslavia in the Balkan matters. They are eager to develop the relationship between our two nations in the future."
 yugoslavia.106.a:0 "Wonderful!"
 yugoslavia.107.t:0 "Romania Refuses!"
 yugoslavia.107.d:0 "The Romanian foreign minister has issued a statement through our diplomatic channel which proclaims that Romania has refused to cooperate with Yugoslavia in the Balkan matters. They seek no further cooperation on this matter and have also given strong objections to our ideas."
 yugoslavia.107.a:0 "Worrisome..."
 yugoslavia.108.t:0 "Czechoslovakia Agrees!"
 yugoslavia.108.d:0 "Our foreign minister has got the message from his Czechoslovakian colleague which reads that their nation has agreed to cooperate with Yugoslavia in the Balkan matters; they also look forward to further cooperation in the near future."
 yugoslavia.108.a:0 "Wonderful!"
 yugoslavia.109.t:0 "Czechoslovakia Refuses!"
 yugoslavia.109.d:0 "Our foreign minister has got the message from his Czechoslovakian colleague which reads that their nation has refused to cooperate with Yugoslavia in the Balkan matters; they have also issued strong objections and seek no further cooperation."
 yugoslavia.109.a:0 "Worrisome..."
 yugoslavia.110.t:0 "Greece Agrees!"
 yugoslavia.110.d:0 "The Greek foreign ministry has delivered a message to our consulate, which states that Greece has agreed to cooperate with Yugoslavia in the Balkan matters. They send their regards and look forward to further partnership."
 yugoslavia.110.a:0 "Wonderful!" 
 yugoslavia.111.t:0 "Greece Refuses!"
 yugoslavia.111.d:0 "The Greek foreign ministry has delivered a message to our consulate, which states that Greece has refused to cooperate with Yugoslavia in the Balkan matters. Our ideas for mutual assistance have come under heavy scrutiny by the Greeks, who cease to develop this partnership further."
 yugoslavia.111.a:0 "Worrisome..."
 yugoslavia.112.t:0 "Turkey Agrees!"
 yugoslavia.112.d:0 "The officials in Ankara have agreed to cooperate with Yugoslavia in the Balkan matters; they look forward to our further partnership and are eager to express their own ideas for the regional project."
 yugoslavia.112.a:0 "Wonderful!" 
 yugoslavia.113.t:0 "Turkey Refuses!"
 yugoslavia.113.d:0 "The officials in Ankara have refused to cooperate with Yugoslavia in the Balkan matters; they express great concern for our regional project, distancing themselves further from Balkan diplomatic entanglements."
 yugoslavia.113.a:0 "Worrisome..."
 yugoslavia.114.t:0 "King Alexander Is Murdered!"
 yugoslavia.114.d:0 "Our nation mourns as the news of the assassination of our beloved King arrive. Dozens of the King's loyal subjects march to Belgrade, where the funeral for the deceased monarch will be held.\n\nHis successor and son, King Peter II, is too young to rule the nation alone, and thus a regency comprised of talented statesmen and intellectuals must be set up to take control of the country until the King is of age. The deceased monarch has left a will in which he expresses a desire for Prince Paul, his first cousin, to lead the regency. This has come under scrutiny from the leading politicians of the National Party, who doubt the testament's authenticity; they instead offer the parliament to appoint the current Prime Minister as the regent.\n\nThe Yugoslavian people, overwhelmed by sorrow, grief and anger, await for the announcement of the new regent..."
 yugoslavia.114.a:0 "Prince Paul accepts leading the regency."
 yugoslavia.114.b:0 "The parliament appoints the regent."
 yugoslavia.115.t:0 "King Alexander's Funeral" 
 yugoslavia.115.d:0 "The state funeral of King Alexander I was held in Belgrade today to honor the Unifier of the Yugoslavian nation. It was attended by about 500,000 people and many leading European statesmen. The King was interred in the Oplenac Church, which had been built by his father, Peter I.\n\nThe assassination has marked a turning point in our country, which has been engulfed in political turmoil since its very founding, as Alexander's successor and son, King Peter II, is too young to rule the nation. As the deceased monarch becomes the martyr for Yugoslavian unity, the leading politicians now strive to defend his legacy; the fate of the South Slavic nation, however, remains unknown."
 yugoslavia.115.a:0 "Počivaj u miru."
 yugoslavia.116.t:0 "Incident in Dubovo"
 yugoslavia.116.d:0 "We're getting news about unpleasant events happening in the village of Dubovo in our part of Macedonia, not far from the Bulgarian border.\n\nWhat started as a counter-terrorist action turned into mass murder of civilians, who supposedly supported VMRO. Our agents acted in disguise as VMRO splitters, so there is no risk of international outrage. However, the Bulgarian public will be extremely displeased by our actions."
 yugoslavia.116.a:0 "This is going too far."
 yugoslavia.117.t:0 "The Parliamentary Elections"
 yugoslavia.117.d:0 "Parliamentary elections were held today in Yugoslavia. Current electoral law makes it impossible for opposition parties to participate in the elections, and opposition leaders have naturally declined to accept any outcome. Riots broke out two days before the election day, resulting in few dozens of men being injured. Voters were presented with a single list of candidates supporting the royal dictatorship. The list was headed by Bogoljub Jevtić. The government party has won 100% of the votes, consequently winning all the 305 seats in the parliament."
 yugoslavia.117.a:0 "Democracy is a foreign concept anyway."
 yugoslavia.118.t:0 "The Parliamentary Elections"
 yugoslavia.118.d:0 "Parliamentary elections are held today in Yugoslavia. Current electoral law only makes it possible for opposition parties to participate in the elections as a united front. Riots broke out two days before the election day, resulting in few dozens of men being injured. Voters are presented with two lists of candidates. Supporters of the royal dictatorship are led by Bogoljub Jevtić, and the United Opposition list is headed by the Croatian leader Vladko Maček. The winner will get at least 60% of the seats in the parliament, while the rest will be redistributed proportionally."
 yugoslavia.118.a:0 "The ruling party wins the elections!"
 yugoslavia.118.b:0 "The United Opposition seizes victory!"
 yugoslavia.119.t:0 "The National Party Wins the Elections!"
 yugoslavia.119.d:0 "The Yugoslavian National Party, the party of the current political establishment, has predictably won the parliamentary elections, gaining 82% of the seats in the parliament. The new government appears to be strong enough to ignore parliamentary opposition whatsoever.\n\nThe United Opposition, led by Maček, was quick to condemn election results, calling them rigged and unfair, largely believed to be true. Around two thousand anti-government protesters in Belgrade were dispersed by police, and hundreds of youth were arrested."`
 yugoslavia.119.a:0 "A predictable development."
 yugoslavia.120.t:0 "King Alexander Is Murdered!"
 yugoslavia.120.d:0 "Our nation mourns as the news of the assassination of our beloved King at the hands of a Bulgarian terrorist arrive. Dozens of the King's loyal subjects march to Belgrade, where the funeral for the deceased monarch will be held.\n\nHis successor and son, King Peter II, is too young to rule the nation alone, and thus a regency comprised of talented statesmen and intellectuals must be set up until the King is of age. The deceased monarch has left a will in which he expresses the desire for Prince Paul, his first cousin, to lead the regency. The National Party does not intend to oppose the Prince, as he seems eager to support current policies."
 yugoslavia.120.a:0 "Prince Paul accepts leading the regency."
 yugoslavia.121.t:0 "Serbs Are Furious With Our Policies in Kosovo"
 yugoslavia.121.d:0 "Our decision to seek cooperation with Džemijet has caused a significant deal of discontent among the Serbs. We're being accused of \"betraying Serbdom and the legacy of Miloš Obilić and Prince Lazar to the Muslims, who have already destroyed the Serbian nation once and are prone to do it once more.\" Henceforth, we should be more careful towards Serbian popular sentiment."
 yugoslavia.121.a:0 "They put way too much attention to the past."

 ## Migration deals
 yugoslavia.122.t:0 "Albania Agrees!"
 yugoslavia.122.d:0 "The foreign ministry in Tirana has delivered a message to its Yugoslavian counterpart. It appears that Albania has agreed to sign the migration treaty, making peaceful population transfer from Kosovo possible."
 yugoslavia.122.a:0 "Wonderful!"
 yugoslavia.123.t:0 "Albania Refuses!"
 yugoslavia.123.d:0 "The foreign ministry in Tirana has delivered a message to its Yugoslavian counterpart. It appears that Albania has refused to sign the migration treaty, expressing approval of the idea that Kosovo should stay predominantly Albanian."
 yugoslavia.123.a:0 "Worrisome..."
 yugoslavia.124.t:0 "Bulgaria Agrees!"
 yugoslavia.124.d:0 "The Bulgarian foreign minister has stated that his nation has agreed to sign the migration treaty, making peaceful population transfer from Vardar Macedonia possible."
 yugoslavia.124.a:0 "Wonderful!"
 yugoslavia.125.t:0 "Bulgaria Refuses!"
 yugoslavia.125.d:0 "Our foreign minister has recieved a message from his Bulgarian colleague, in which it states that Bulgaria has refused to sign the migration treaty. They've issued strong objections and wished for the Bulgarian population to remain in Vardar Macedonia, effectively making the area stay predominantly Bulgarian."
 yugoslavia.125.a:0 "Worrisome..."

  ## Internal affairs
 yugoslavia.126.t:0 "Maček Makes His Demands"
 yugoslavia.126.d:0 "Fortunately, Vladko Maček seems to acknowledge the Croatian question as a threat for Yugoslavian unity. However, he seeks to solve it with as much profit for the Croats as possible.\n\nAlong with his long-established demands to liberalize the state, Maček wants current Parliament to be dissolved, free elections to be held and new constitution to be designed by the free-elected government. Under the new constitution, Croatia would only share ministries of finance, defense and foreign affairs with the rest of federal Yugoslavia."
 yugoslavia.126.a:0 "Perhaps we will find a middle ground."
 yugoslavia.127.t:0 "The Concordat Crisis"
 yugoslavia.127.d:0 "His Holiness Varnava I, the Patriarch of the Serbian Orthodox Church resists the Concordat. He claims that the privileges it provides to the Roman Catholic Church will undermine positions of the Serbian Orthodox Church not only in traditionally Catholic regions of Yugoslavia, but also in Serbia proper. The Holy Synod opposes the Concordat as well. If we continue our pro-Concordat policy, we risk to spawn a public uproar among our Orthodox population."
 yugoslavia.127.a:0 "Withdraw the Concordat legislation."
 yugoslavia.127.b:0 "Sign the Concordat anyway."
 yugoslavia.127.c:0 "Get rid of the Patriarch."
 yugoslavia.128.t:0 "Serbs Are Furious With Our Negotiations With the Ustaše"
 yugoslavia.128.d:0 "Our decision to seek cooperation with the Ustaše has caused a significant deal of discontent among the Serbs. We're being accused of \"betraying Serbdom and cooperating with the murderers of our beloved King Alexander.\" A large mass of the Serbian population views our government as either stupid or traitorous, and we are unlikely to change their views."
 yugoslavia.128.a:0 "It was truly a bad idea."
 yugoslavia.129.t:0 "Changes in KPJ Leadership"
 yugoslavia.129.d:0 "The news of the Great Purge, which goes on in Russia, has reached Yugoslavia. Milan Gorkić, the leader of the Yugoslav communists, was accused of being a British spy and executed in Moscow. He fell victim to Stalin's hunt for supporters of Bukharin, a rival communist politician in the USSR.\n\nThe new leader of the KPJ, a man called Josip Broz, is supposedly an agent of the NKVD; Moscow's control over the communists in our country has thus strengthened significantly."
 yugoslavia.129.a:0 "Why should I even care?"
 
  ## Federalization
 yugoslavia.130.t:0 "Federalization: Three Nations Solution"
 yugoslavia.130.d:0 "Most of our politicians agree that the best way to federalize Yugoslavia is to divide it into three federal parts, according to the original name of our country: Kingdom of Serbs, Croats and Slovenes.\n\nBosnian politicians reluctantly support this project as well, as semi-independent Bosnia can become too unstable to be governed effectively. Montenegrin representatives mostly side with Serbians, while Macedonians aren't represented whatsoever."
 yugoslavia.130.a:0 "Now there are Serbia, Croatia and Slovenia."
 yugoslavia.131.t:0 "Banovina of Slovenia"
 yugoslavia.131.d:0 "The territory of the Drava Banovina corresponds with the Slovene-populated lands of Yugoslavia. Accordingly, this banovina is administered by Slovenians, and de-facto autonomy is already established there. Both Slovene and Croat politicians agree that the borders of Slovenia within Yugoslavia should coincide with the borders of the banate."
 yugoslavia.131.a:0 "At least some region doesn't cause trouble."
 yugoslavia.132.t:0 "Question of Vojvodina"
 yugoslavia.132.d:0 "After the fall of Austria-Hungary, Syrmia, which continues to be mostly populated by Serbs, joined the newborn State of Slovenes, Croats and Serbs, while the rest of Vojvodina was unified with the Kingdom of Serbia. The two states merged on 1 December 1918, making this split irrelevant until now.\n\nThe Serbs want to gain the entirety of Vojvodina, while Croats insist that Syrmia is a long-established part of Croatia-Slavonia. Extremists among Croats go as far as to claim entire Vojvodina for Croatia."
 yugoslavia.132.a:0 "The entire Vojvodina shall be Serbian."
 yugoslavia.132.b:0 "Let the Croats have Syrmia."
 yugoslavia.132.c:0 "Give Vojvodina to the Croats."
 yugoslavia.133.t:0 "Question of Bosnia"
 yugoslavia.133.d:0 "Bosnia is an extremely diverse region when it comes to ethnic and religious composition. Both Serbs and Croatians view this region as rightfully theirs, as large amount of Bosnian population consider itself belonging to one of those nations. The split would be a logical solution, however, Bosnian politicians would be unhappy to see their region divided."
 yugoslavia.133.a:0 "Bosnia will be Serbian."
 yugoslavia.133.b:0 "Bosnia shall become Croatian."
 yugoslavia.133.c:0 "Split Bosnia."
 yugoslavia.134.t:0 "Division of Bosnia"
 yugoslavia.134.d:0 "As we've decided to split Bosnia, the exact borders became an issue. The Serbs have agreed to let the Croats have Herzegovina, while also claiming Eastern Bosnia (including Sarajevo) for themselves. Bosnian Krajina remains an issue: it's mostly populated by Serbs, however, including Krajina within Croatian borders will make connection between Slavonia and Dalmatia much easier."
 yugoslavia.134.a:0 "The Krajina goes to Serbia."
 yugoslavia.134.b:0 "Give the Krajina to Croatia."
 yugoslavia.135.t:0 "Question of Dalmatia"
 yugoslavia.135.d:0 "Serbian politicians have gained much confidence as the entirety of Bosnia is secured for Serbia. Now they claim historically Croatian regions for themselves. Lika and Kninska Krajina indeed have significant Serb populations, while southern Dalmatia would provide Serbia with comfortable sea access. However, Croats will never agree to cede both voluntarily."
 yugoslavia.135.a:0 "Let Dalmatia and Croatia stay Croatian entirely."
 yugoslavia.135.b:0 "Give Southern Dalmatia to Serbia."
 yugoslavia.135.c:0 "Give Lika and Kninska Krajina to Serbia."
 yugoslavia.136.t:0 "Question of Montenegro"
 yugoslavia.136.d:0 "As Croatian politicians managed to claim Bosnia, they see the way to destroy Serb dominance entirely. Montenegro has been considered Serbian for a long time, but now extremists among the Croats claim Montenegro for themselves in order to reduce Serbia as much as possible."
 yugoslavia.136.a:0 "Montenegro rightfully belongs to Serbia."
 yugoslavia.136.b:0 "Croatia should own Montenegro."
 yugoslavia.137.t:0 "The Results Are In!"
 yugoslavia.137.d:0 "The negotiations are over. National leaders present the results to their party members, waiting for their approval. If the lands were divided fairly, we have nothing to fear. However, otherwise, the agreement won't be approved, and negotiations will fail."
 yugoslavia.137.a:0 "So be it!"
 yugoslavia.138.t:0 "Negotiations Have Failed"
 yugoslavia.138.d:0 "The ministers gather only to hear the news of the failed negotiations, understanding the reasons as to why. One of the nations was clearly treated unfairly, and her national leaders refused to sign such an agreement. All the hard work was in vain.\n\nNow, as trust between national parties and the government is broken, the opportunity is lost."
 yugoslavia.138.a:0 "Terrible..."
 yugoslavia.139.t:0 "Negotiations Have Succeeded"
 yugoslavia.139.d:0 "Success! National parties, albeit reluctantly, have agreed to sign the agreement. This treaty will become the basis for the new constitution for a federal Yugoslavian state.\n\nIt's naive to think that federalization will solve all our problems, but it's a huge step forward towards peace and prosperity among all the Yugoslavian peoples."
 yugoslavia.139.a:0 "Wonderful!"
 
  ## Public events
 yugoslavia.140.t:0 "Belgrade Grand Prix"
 yugoslavia.140.d:0 "The Belgrade Grand Prix was held today in the Yugoslavian capital. The circuit was set as a round course surrounding the Belgrade Fortress, popularly called Kalemegdan after the park inside the bastion.\n\nThe entire event was comprised of 8 separate races; the initial ones were shorter, while the final and most important, the Grand Prix, was saved for last. After fifty laps, Tazio Nuvolari won the race with the result of 1:04:03. Manfred von Brauchitsch was 7.6 seconds behind him - the press described him as the \"eternally second.\""
 yugoslavia.140.a:0 "Congratulations to the winners!"
 yugoslavia.141.t:0 "The Great Depression Is Over!"
 yugoslavia.141.d:0 "Our economy was showing noticeable signs of recovery lately. Farmers are now capable of improving their households, small business is on the rise, and city life becomes more promising every day.\n\nIt seems like our country has finally recovered from the Great Depression."
 yugoslavia.141.a:0 "Wonderful!"
 yugoslavia.142.t:0 "Milutin Milanković Publishes Canon"
 yugoslavia.142.d:0 "Milutin Milanković, a mathematician, astronomer, climatologist, geophysicist, civil engineer and popularizer of science, has published his life's work: \"Canon of Insolation of the Earth and Its Application to the Problem of the Ice Ages\".\n\nIt summarizes universal laws through which it is possible to explain cyclical climate change and the attendant 11 ice ages – his namesake Milankovitch cycles."
 yugoslavia.142.a:0 "Who even cares about climate change?" 
 yugoslavia.143.t:0 "Aircraft Tender"
 yugoslavia.143.desc:0 "Our government has recently tendered for twenty single-seat fighter aircraft. Six aircraft are recommended for consideration: a Polish PZL, British Hawker Fury, two Dutch Fokkers and a Czechoslovak Avia. Which one should we choose?"
 yugoslavia.143.a:0 "The PZL proved itself to be excellent."
 yugoslavia.143.b:0 "Can't go wrong with the British Hawker."
 yugoslavia.143.c:0 "The Dutch Fokkers are worth a shot."
 yugoslavia.143.d:0 "Go for the Czechoslovak Avia."
 
  ## Little Entente - Austria chain
 yugoslavia.144.t:0 "Austria Agrees!"
 yugoslavia.144.d:0 "In a surprising turn of events, Austria has decided to support our initiative and join the Little Entente. Our other alliance partners might, however, not like it."
 yugoslavia.144.a:0 "Wonderful!"
 yugoslavia.145.t:0 "Austria Refuses!"
 yugoslavia.145.d:0 "Unsurprisingly, Austria has refused to join the Little Entente. Apparently, this miserable rump state still aims to bring back its Empire with Hungarian or Italian support."
 yugoslavia.145.a:0 "We should've expect this."
 yugoslavia.146.t:0 "Czechoslovakian Reaction"
 yugoslavia.146.d:0 "Our recent negotiations with Austria has caused a certain deal of disconent in Czechoslovakia. Apparently, our allies refuse to let Austria be part of the Little Entente. Thus, our agreements with Austria will remain outside the alliance business."
 yugoslavia.146.a:0 "At least our alliance is still intact..."
 yugoslavia.147.t:0 "Czechoslovakia Leaves the Little Entente!"
 yugoslavia.147.d:0 "Recent negotiations of Yugoslavian government with Austria has caused a great deal of disconent in Czechoslovakia. They consider those negotiations as a break with existing policies of the alliance and find it necessary to leave the Little Entente."
 yugoslavia.147.a:0 "The alliance is gone now."
 
  ## Balkan Pact
 yugoslavia.148.t:0 "Albania Agrees!"
 yugoslavia.148.d:0 "Albania has wisely agreed to join the Balkan Pact. The country, however, will need some time to prepare for this move, as Italy still holds control over vast sectors of Albanian society."
 yugoslavia.148.a:0 "Hopefully, Italy won't mind this."
 yugoslavia.149.t:0 "Albania Refuses!"
 yugoslavia.149.d:0 "Albania has refused to join the Balkan Pact. Italy still has the upper hand there, and will only strenghten her position from now on."
 yugoslavia.149.a:0 "We'll have to go the hard way."
 yugoslavia.150.t:0 "Bulgaria Agrees!"
 yugoslavia.150.d:0 "In an interesting turn of events, Bulgaria has agreed to join the alliance with Yugoslavia. Such alliance will compromise our agreements with Greece, Romania and Turkey, however."
 yugoslavia.150.a:0 "Bulgaria is our ally now."
 yugoslavia.151.t:0 "Bulgaria Refuses!"
 yugoslavia.151.d:0 "Bulgaria has refused our alliance offer. At least, we're still a part of the Balkan Pact."
 yugoslavia.151.a:0 "Let's pretend it never happened."
 yugoslavia.152.t:0 "Bulgaria Agrees!"
 yugoslavia.152.d:0 "Bulgaria has agreed to join the Balkan Pact. Thus, one of its greatest vulnerabilities is no longer a threat."
 yugoslavia.152.a:0 "Wonderful!"
 yugoslavia.153.t:0 "Bulgaria Refuses!"
 yugoslavia.153.d:0 "Unsurprisingly, Bulgaria has refused to join the Balkan Pact. Apparently, they still hope to revise political borders in the region."
 yugoslavia.153.a:0 "We should've expect this."
 
  ## Public events
 yugoslavia.154.t:0 "The Bridge on the Drina"
 yugoslavia.154.d:0 "The Bridge on the Drina, a historical novel by Ivo Andrić, has been published. It revolves around the Mehmed Paša Sokolović Bridge in Višegrad, which spans the Drina River and stands as a silent witness to history from its construction by the Ottomans in the mid-16th century until its partial destruction during World War I.\n\nThe story spans about four centuries and covers the Ottoman and Austro-Hungarian occupations of the region, with a particular emphasis on the lives, destinies and relations of the local inhabitants, especially Serbs and Bosnian Muslims."
 yugoslavia.154.a:0 "A wonderful piece of Yugoslavian art."
 yugoslavia.155.t:0 "1935-36 Football Championship Finals"
 yugoslavia.155.d:0 "Unlike the regular Yugoslavian premier football competitions, the 1935–36 Football Championship was played in a cup format.\n\nIn the finals, BSK Beograd has defeated Slavija Sarajevo 0-0, 1-0, and became the champion for the fourth time in its history. Moša Marjanović with 5 goals in 6 matches became the top scorer."
 yugoslavia.155.a:0 "Perhaps we will be known as the Brazilians of Europe one day."
 yugoslavia.156.t:0 "Unification Day" # could be expanded
 yugoslavia.156.d:0 "Unification Day is celebrated today in Yugoslavia. On this day, in 1918, the Kingdom of Serbs, Croats and Slovenes was declared in Belgrade, as the State of Slovenes, Croats and Serbs joined the Kingdom of Serbia (which, at this point, also included Vojvodina and Montenegro)."
 yugoslavia.156.a:0 "Long live united Yugoslavia!"

  ## Elections
 yugoslavia.158.t:0 "Elections Are Coming!"
 yugoslavia.158.d:0 "Current government has been in power for a significant amount of time already, and it is now time to call for new parliamentary elections. We have half a year to prepare for them; however, we may organize the elections earlier if we want."
 yugoslavia.158.a:0 "Understood."
 yugoslavia.160.t:0 "The United Opposition Wins!"
 yugoslavia.160.d:0 "In a miraculous turn of events and despite all odds, the United Opposition has won the parliamentary elections. The electoral law, created to limit the opposition vote to a minimum, now acts as a double-edged sword: the royalists are themselves opposition, having less then 20% of parliament seats despite winning almost half of the popular vote.\n\nThe Independent Democratic Party now controls the majority, and its leader Svetozar Pribićević triumphally returns from exile to take the post of Prime Minister. Our monarchy is now governed by the staunchest anti-monarchist alive."
 yugoslavia.160.a:0 "Was it even possible?!"
 yugoslavia.161.t:0 "The United Opposition Wins!"
 yugoslavia.161.d:0 "In an unexpected turn of events, the United Opposition has won the parliamentary elections. The electoral law, created to limit the opposition vote to a minimum, now acts as a double-edged sword: the royalists are themselves opposition, having less then 20% of parliament seats despite winning almost half of the popular vote.\n\nVladko Maček, the head of the Croatian Peasant Party and a long-time opponent of the royalist regime, is now the head of the government."
 yugoslavia.161.a:0 "Times are changing..."
 yugoslavia.162.t:0 "The United Opposition Wins!"
 yugoslavia.162.d:0 "In an unexpected turn of events, the United Opposition has won the parliamentary elections. The electoral law, created to limit the opposition vote to a minimum, now acts as a double-edged sword: the royalists are themselves opposition, having less then 20% of parliament seats despite winning almost half of the popular vote.\n\nVladko Maček, the head of the Croatian Peasant Party and a long-time opponent of the royalist regime, is now the head of the government."
 yugoslavia.162.a:0 "Times are changing..."
 yugoslavia.163.t:0 "The United Opposition Wins!"
 yugoslavia.163.d:0 "In an unexpected turn of events, the United Opposition has won the parliamentary elections. The electoral law, created to limit the opposition vote to a minimum, now acts as a double-edged sword: the royalists are themselves opposition, having less then 20% of parliament seats despite winning almost half of the popular vote.\n\nHowever, rather than let Vladko Maček form the government, the Head of State turned to Jovan Jovanović Pižon instead. He is one of the leaders of the Belgrade Opposition, and has agreed to form a coalition government with every power in the parliament except the Prečani Front."
 yugoslavia.163.a:0 "Yugoslavia chooses the middle ground."
 yugoslavia.164.t:0 "The United Opposition Wins!"
 yugoslavia.164.d:0 "In an unexpected turn of events, the United Opposition has won the parliamentary elections. The electoral law, created to limit the opposition vote to a minimum, now acts as a double-edged sword: the royalists are themselves opposition, having less then 20% of parliament seats despite winning almost half of the popular vote.\n\nHowever, rather than let Vladko Maček form the government, the Head of State turned to Aca Stanojević instead. He is one of the leaders of the Belgrade Opposition, and has agreed to form a coalition government with every power in the parliament except the Prečani Front."
 yugoslavia.164.a:0 "Yugoslavia chooses the middle ground."
 yugoslavia.165.t:0 "The United Opposition Wins!"
 yugoslavia.165.d:0 "The success of the United Opposition has put us in a delicate position. The elected parliament would be dominated by the Prečani Front, and we are required to choose the Prime Minister.\n\nSvetozar Pribićević, leader of the dominant Independent Democrats, is the only real candidate. He would return from exile to claim his post, and his anti-monarchist sentiments would have to be tolerated. Perhaps, the king should establish personal rule once again instead?"
 yugoslavia.165.a:0 "We will have to let Pribićević rule. For now."
 yugoslavia.165.b:0 "Enough of democracy! It's time for personal rule."
 yugoslavia.166.t:0 "The United Opposition Wins!"
 yugoslavia.166.d:0 "The success of the United Opposition has put us in a delicate position. The elected parliament would be dominated by the Prečani Front and the Belgrade Opposition, and we are required to choose the Prime Minister.\n\nVladko Maček, leader of the Croatian Peasant Party, is the logical candidate. His federalist sentiments, however, would have to be tolerated.\n\nAnother solution is to give the post to Jovan Jovanović Pižon, the leader of the Agrarians. His government would be much weaker, but provide us with at least some stability. Or perhaps, the king should establish personal rule once again instead?"
 yugoslavia.166.a:0 "Let Maček assemble the government. For now."
 yugoslavia.166.b:0 "We will turn to Jovanović instead."
 yugoslavia.166.c:0 "Enough of democracy! It's time for personal rule."
 yugoslavia.167.t:0 "The United Opposition Wins!"
 yugoslavia.167.d:0 "The success of the United Opposition has put us in a delicate position. The elected parliament would be dominated by the Prečani Front and the Belgrade Opposition, and we are required to choose the Prime Minister.\n\nVladko Maček, leader of the Croatian Peasant Party, is the logical candidate. His federalist sentiments, however, would have to be tolerated.\n\nAnother solution is to give the post to Aca Stanojević, the leader of the Radicals. His government would be much weaker, but provide us with at least some stability. Or perhaps, the king should establish personal rule once again instead?"
 yugoslavia.167.a:0 "Let Maček assemble the government. For now."
 yugoslavia.167.b:0 "We will turn to Stanojević instead."
 yugoslavia.167.c:0 "Enough of democracy! It's time for personal rule."
 
  ## Deaths
 yugoslavia.168.t:0 "Death of Pribićević"
 yugoslavia.168.d:0 "Svetozar Pribićević, one of the most prominent opponents of the monarchy, has passed away today in Prague, where he was exiled since 1931.\n\nBefore becoming a fierce adversary of centralist policies, he supported the King and his Yugoslavist ideology up until 1928, when he took a stance against the regime, openly arguing for a federal and republican structure for Yugoslavia.\n\nA leader of the Prečani democrats, his legacy within that party and in regional politics will not be forgotten in the near future."
 yugoslavia.168.pm.d:0 "Prime Minister Svetozar Pribićević has passed away today at the age of 60.\n\nBefore becoming a fierce adversary of centralist policies, he supported the King and his Yugoslavist ideology up until 1928, when he took a stance against the regime, openly arguing for a federal and republican structure for Yugoslavia.\n\nPribićević returned from exile, in which he was from 1931 up until recently, when the United Opposition surprisingly won the parliamentary elections; he consequently became the Prime Minister and introduced many progressive and federalist policies as part of his Prečani democrats' manifestos.\n\nAfter the Prime Minister's death, his party mate Srđan Budisavljević has been chosen as the successor, and has accepted the post."
 yugoslavia.168.a:0 "One less problem to care about."
 yugoslavia.168.b:0 "Good luck to Budisavljević."
 yugoslavia.170.t:0 "Death of Jovanović"
 yugoslavia.170.d:0 "Jovan M. Jovanović - Pižon, one of Serbia's most influential diplomats, politicians, ministers and literary writers, has passed away today at the age of 70 in the Macedonian town of Ohrid.\n\nA statesman in the Kingdom of Serbia, he served a short stint as the foreign minister in 1912. After the Great War he participated in the founding of the Agrarian Party and became its leader; they never became a significant power in Yugoslavian politics though, and after the death of Jovanović their future as a political party looks bleak."
 yugoslavia.170.pm.d:0 "Prime Minister Jovan M. Jovanović - Pižon, one of Serbia's most influential diplomats, politicians, ministers and literary writers, has passed away today at the age of 60.\n\nA statesman in the Kingdom of Serbia, he served a short stint as the foreign minister in 1912 and participated in the founding of the Agrarian Party, becoming its leader in the immediate post-war period. He became the Prime Minister after a surprise United Opposition victory, in which his coalition managed to secure the majority in the Assembly.\n\nMilan Gavrilović, Jovanović's party mate, has been chosen as the late Prime Minister's successor and has already accepted the post."
 yugoslavia.170.a:0 "This is a serious blow for the Agrarians."
 yugoslavia.170.b:0 "Good luck to Gavrilović."

  ## Political rehabilitation
 yugoslavia.172.t:0 "Royalists or Croat Nationalists?"
 yugoslavia.172.d:0 "Our policy of rehabilitation of political prisoners has met a troubling question. The dictatorship was harsh towards the Ustaše (and so we are today), however, many regular Croat patriots were repressed as well. Royalists, as well as liberals, agree that Croat nationalism is harmful for the nation in any form, but it would be morally wrong for us to keep sincere freedom fighters in prison."
 yugoslavia.172.a:0 "Nationalism of any sort will only bring trouble."
 yugoslavia.172.b:0 "If we arrest every Croat patriot, we should go to jail too."

  ## Prince Paul Meetings
 yugoslavia.173.t:0 "First Meeting With Prince Paul"
 yugoslavia.173.d:0 "Negotiations with Prince Paul over constitution change didn't bring any results. The regent is very reluctant to change the constitution, as he considers saving the existing one for young King Peter II to be his moral duty. The only thing we had agreed on is to have another round of negotiations in 5 months."
 yugoslavia.173.a:0 "We will have another chance."
 yugoslavia.174.t:0 "Second Meeting With Prince Paul"
 yugoslavia.174.d:0 "Success! Our effort to find common ground with the royalists has paid off, as the regent was in a much more conciliatory mood today. Even though we would still need his permission to adopt a new constitution, at least we can actually start working on it."
 yugoslavia.174.a:0 "We can proceed with the constitution change."
 yugoslavia.175.t:0 "Second Meeting With Prince Paul"
 yugoslavia.175.d:0 "Failure! Prince Paul didn't change his mind and still considers changing the constitution right now to be morally wrong towards young King Peter II. We will have to postpone our plans until the end of the regency, which will cause Croat support of the HSS to fall dramatically.\n\nThe second option is to destabilize the country further in hope to get our permission to change the constitution."
 yugoslavia.175.a:0 "We will have to postpone our plans."
 yugoslavia.175.b:0 "No! We will push to the end."

  ## Elections and the Constitution
 yugoslavia.176.t:0 "Elections Are Coming!"
 yugoslavia.176.d:0 "The elections to the Constituent Assembly will be held very soon. Those elections will determine which political forces will create the new Yugoslavian constitution."
 yugoslavia.176.a:0 "We will correct the mistakes of the past - or repeat them."
 yugoslavia.177.t:0 "The Rise of SRZ"
 yugoslavia.177.d:0 "A new political force is emerging. Milan Stojadinović, a politician from the Radical Party, gives fiery speeches in which he accuses our government of a "blatant assault on Serbdom," urging all the political forces in Serbia to stand together in the upcoming elections.\n\nHis political group is now known as the Serb Radical Union, and its numbers are growing rapidly."
 yugoslavia.177.a:0 "This is very concerning."
 yugoslavia.178.t:0 "Elections Are Over!" # could be expanded
 yugoslavia.178.d:0 "The elections are over, and the liberal forces are victorious. Compromises and agreements made by the Prečani Front and the Serbian liberals remain valid, and we can expect further process to be unproblematic."
 yugoslavia.178.a:0 "The Assembly will proceed with creating the Constitution."
 yugoslavia.179.t:0 "Elections Are Over!" # could be expanded
 yugoslavia.179.d:0 "The elections are over, and, for good or not, the Serb Radical Union is victorious. Compromises and agreements made by the Prečani Front and the Serbian liberals become null and void, as the predominantly Serb Assembly will dictate a new constitution for Yugoslavia - the one favoring the Serbs."
 yugoslavia.179.a:0 "The Assembly will proceed with creating the Constitution."
 yugoslavia.180.t:0 "The Constitution Is Adopted!"
 yugoslavia.180.d:0 "The Constituent Assembly has adopted a new constitution for Yugoslavia. The state is divided into six federal parts: Serbia, Croatia, Slovenia, Bosnia, Montenegro and Macedonia.\n\nEvery federal unit elects its own parliament and is governed by a ban, appointed by the king. The central government deals with questions of defense, internal security, foreign policy, trade and transport. The electoral law allows proportional representation."
 yugoslavia.180.a:0 "A new dawn for Yugoslavia."
 yugoslavia.181.t:0 "The Constitution Is Adopted!"
 yugoslavia.181.d:0 "The Constituent Assembly under SRZ guidance has adopted a new constitution for Yugoslavia. The state is divided into three federal parts: Serbia, Croatia and Slovenia.\n\nEvery federal unit elects its own parliament and is governed by a ban, appointed by the king. The central government deals with questions of defense, internal security, foreign policy, trade and transport. The electoral law allows proportional representation."
 yugoslavia.181.a:0 "A new dawn for Yugoslavia."
 
  ## Ustase chain
 yugoslavia.182.t:0 "Italy Extradites the Ustaše"
 yugoslavia.182.d:0 "Italy has agreed to extradite the Ustaše, but, unfortunately, their leadership managed to leave Italy in advance. It certainly weakened them and disrupted their relations with Italy however."
 yugoslavia.182.a:0 "A surprise, to be sure, but a welcome one."
 yugoslavia.183.t:0 "Italy Refuses to Extradite the Ustaše"
 yugoslavia.183.d:0 "Italy has refused to extradite the Ustaše. Now we must find another way to fight the Ustaše abroad somehow; our foreign minister advises using French support."
 yugoslavia.183.a:0 "It was expected."
 yugoslavia.184.t:0 "France Agreed!"
 yugoslavia.184.d:0 "France has agreed to guarantee our independence! Now the Italian threat is no longer relevant for us; there is certainly no way they would pick a fight with France."
 yugoslavia.184.a:0 "We will proceed with our plans."
 yugoslavia.185.t:0 "France Refused!"
 yugoslavia.185.d:0 "France has refused to guarantee our independence! Apparently, they don't want to loose another generation of men to a war in the Balkans."
 yugoslavia.185.a:0 "Cancel the plans, we won't be proceeding."
 yugoslavia.186.t:0 "Italy Extradites the Ustaše"
 yugoslavia.186.d:0 "Italy has agreed to extradite the Ustaše, but, unfortunately, their leadership managed to leave Italy in advance. It certainly weakened them and disrupted their relations with Italy however."
 yugoslavia.186.a:0 "It took France to make them do it."
 yugoslavia.187.t:0 "Italy Refuses to Extradite the Ustaše Again"
 yugoslavia.187.d:0 "Italy has refused to extradite the Ustaše once again, even though France has demanded so. In retaliation, France has decided to guarantee our independence."
 yugoslavia.187.a:0 "At least France is on our side."
 yugoslavia.188.t:0 "Social Programs Are Back!"
 yugoslavia.188.d:0 "It seems like our suspension of social programs has succeeded! Our budget is now much more healthy, our debt decreases and our economy is booming again."
 yugoslavia.188.a:0 "Wonderful!"
 
  ## Coalition
 yugoslavia.190.t:0 "Rising Discontent With Left Agrarians"
 yugoslavia.190.d:0 "The latest legislative initiatives of the Agrarian Party's left wing has caused great discontent in the Parliament. In a heated debate, our party members were blamed "communists" and calls for arrest were made. There is no way Left Agrarians and our coalition partners will be able to work together from now on."
 yugoslavia.190.a:0 "There will be no more leftist extremism."
 yugoslavia.190.b:0 "We will maintain party solidarity."
 yugoslavia.191.t:0 "Left Agrarians Split the Party"
 yugoslavia.191.d:0 "Our lack of interest towards the Left Agrarian initiatives has caused discontent, leading the left wing of the Agrarians to split from its main body.\n\nDragoljub Jovanović now leads his independent NSS - the People's Agrarian Party. His supporters have also left the coalition and joined the Prečani Front."
 yugoslavia.191.a:0 "We should've paid them more attention."
 yugoslavia.192.t:0 "Discontent Within the Agrarians"
 yugoslavia.192.d:0 "Our lack of interest towards the Right Agrarian initiatives has caused discontent, leading our party members repeatedly ignoring party discipline. Our government suffers continuous critic, and our defence is insufficient."
 yugoslavia.192.a:0 "Our party discipline is far from ideal."
 yugoslavia.193.t:0 "Agrarians Leave the Coalition!"
 yugoslavia.193.d:0 "Our lack of interest towards the Agrarian initiatives has caused discontent. Agrarian leaders have decided to leave the coalition and joined the Prečani Front."
 yugoslavia.193.a:0 "We should've paid them more attention."
 yugoslavia.194.t:0 "Democrats Leave the Coalition!"
 yugoslavia.194.d:0 "Our lack of interest towards the Democrat initiatives has caused discontent. Democrat leaders have decided to leave the coalition and join the Prečani Front."
 yugoslavia.194.a:0 "We should've paid them more attention."
 yugoslavia.195.t:0 "Muslims Leave the Coalition!"
 yugoslavia.195.d:0 "Our lack of interest towards the Muslim initiatives has caused discontent. Muslim leaders have decided to leave the coalition and join the Prečani Front."
 yugoslavia.195.a:0 "We should've paid them more attention."
 yugoslavia.196.t:0 "Slovenes Leave the Coalition!"
 yugoslavia.196.d:0 "Our lack of interest towards the Slovenian initiatives has caused discontent. Slovene leaders have decided to leave the coalition and join the Prečani Front."
 yugoslavia.196.a:0 "We should've paid them more attention."
 yugoslavia.197.t:0 "Montenegrins Leave the Coalition!"
 yugoslavia.197.d:0 "Our lack of interest towards the Montenegrin initiatives has caused discontent. Montenegrin leaders have decided to leave the coalition and join the Prečani Front."
 yugoslavia.197.a:0 "We should've paid them more attention."
 yugoslavia.198.t:0 "Discontent Within the Radical Party"
 yugoslavia.198.d:0 "Our lack of interest towards the Radical initiatives has caused discontent, leading our party members repeatedly ignoring party discipline. Our government suffers continuous critic, and our defence is insufficient.\n\nPrime Minister Stanojević has resigned, leaving the government to Milan Stojadinović."
 yugoslavia.198.a:0 "This is concerning."
 yugoslavia.199.t:0 "Fall of the Government!"
 yugoslavia.199.d:0 "Latest political development makes it impossible for the government to keep parliamentary support. Rather than to face the vote of no confidence, the entire cabinet has resigned today.\n\nWithout any alternative left, the head of state asked Vladko Maček to form a new government in a coalition with all leftist, centrist and regional factions. The Prečani Front is now in charge."
 yugoslavia.199.a:0 "It could be worse."
 yugoslavia.200.t:0 "Vodja! Vodja! Vodja!"
 yugoslavia.200.d:0 "Inspired by the fascist regime in Italy, many far-right supporters in Yugoslavia now see Milan Stojadinović as their own Duce. They are present at Stojadinović's public rallies, and chant \"Vodja! Vodja! Vodja!\" (Serbian for \"Leader\").\n\nHowever, people soon noticed that this continuous chant easily turns into \"Djavo! Djavo! Djavo!\" (Serbian for \"Devil\"). Now, one can hardly hear this chant anywhere, unless ironically."
 yugoslavia.200.a:0 "Comic."
 yugoslavia.201.t:0 "Croats Evade Mobilization!"
 yugoslavia.201.d:0 "Our secret mobilization efforts have met difficulties in Croatia. Despite the efforts of the leading Croatian politicians, many Croats are prone to communist and Ustaše propaganda. They don't want to fight and die for Yugoslavia, as they simply don't see it as their home."
 yugoslavia.201.a:0 "We have a decision to make."
 
  ## Friendship treaties
 yugoslavia.202.t:0 "Hungary Signs a Friendship Treaty"
 yugoslavia.202.d:0 "Hungary has agreed to sign a friendship treaty! Although we can't be sure that peace is not guaranteed, it's nevertheless a good sign."
 yugoslavia.202.a:0 "At least that's something."
 yugoslavia.203.t:0 "Hungary Refuses to Sign a Friendship Treaty"
 yugoslavia.203.d:0 "Hungary has refused to sign a friendship treaty! It doesn't mean that they are certainly going to fight us; perhaps they are just trying to make their rule more popular. However, this is a worrisome sign anyway."
 yugoslavia.203.a:0 "We should've expected this."
 yugoslavia.204.t:0 "Bulgaria Signs a Friendship Treaty"
 yugoslavia.204.d:0 "Bulgaria has agreed to sign a friendship treaty! Although we can't be sure that peace is not guaranteed, it's nevertheless a good sign."
 yugoslavia.204.a:0 "At least that's something."
 yugoslavia.205.t:0 "Bulgaria Refuses to Sign a Friendship Treaty"
 yugoslavia.205.d:0 "Bulgaria has refused to sign a friendship treaty! It doesn't mean that they are certainly going to fight us; perhaps they are just trying to make their rule more popular. However, this is a worrisome sign anyway."
 yugoslavia.205.a:0 "We should've expected this."
 yugoslavia.206.t:0 "Austria Signs a Friendship Treaty"
 yugoslavia.206.d:0 "Austria has agreed to sign a friendship treaty! Although we can't be sure that peace is not guaranteed, it's nevertheless a good sign."
 yugoslavia.206.a:0 "At least that's something."
 yugoslavia.207.t:0 "Austria Refuses to Sign a Friendship Treaty"
 yugoslavia.207.d:0 "Austria has refused to sign a friendship treaty! It doesn't mean that they are certainly going to fight us; perhaps they are just trying to make their rule more popular. However, this is a worrisome sign anyway."
 yugoslavia.207.a:0 "We should've expected this."
 
  ## Factions
 yugoslavia.208.t:0 "Deal With the Devil"
 yugoslavia.208.d:0 "The time has come. We are surrounded by countries far stronger than ours, united to establish a new world order. Their invasion of Yugoslavia is a matter of time. We still have a chance to apply for joining this Pact, however, such move can and will be unpopular. It's time for us to choose between death and dishonor."
 yugoslavia.208.a:0 "We will join the new world order."
 yugoslavia.208.b:0 "No! We must keep neutrality."
 yugoslavia.209.t:0 "Yugoslavia Is Accepted to the Pact"
 yugoslavia.209.d:0 "We have received a message that Yugoslavia has been officially accepted to the Pact. We are now officially part of this alliance, and we will have to review our foreign policy accordingly."
 yugoslavia.209.a:0 "Let's hope for the best."
 yugoslavia.210.t:0 "Yugoslavia Is Not Accepted to the Pact"
 yugoslavia.210.d:0 "We have received a message that Yugoslavia has been refused to join the Pact. We are still not at war with the Pact, but the situation may change very soon."
 yugoslavia.210.a:0 "Very worrisome."
 
  ## Industry relocation
 yugoslavia.211.t:0 "Croatian Industry Is Relocated to Bosnia"
 yugoslavia.211.d:0 "Although our efforts to save the civilian population were largely ineffective, we have managed to relocate important industries from Croatia to Bosnia, where defences look more promising."
 yugoslavia.211.a:0 "Excellent!"
 yugoslavia.212.t:0 "Belgrade Industry Is Relocated to Bosnia"
 yugoslavia.212.d:0 "Although our efforts to save the civilian population were largely ineffective, we have managed to relocate important industries from Belgrade to Bosnia, where defences look more promising."
 yugoslavia.212.a:0 "Excellent!"
 
  ## Factions
 yugoslavia.213.t:0 "Yugoslavia Is Accepted to the Faction"
 yugoslavia.213.d:0 "We have received a message that Yugoslavia has been officially accepted to the faction. We are now officially part of this alliance, and we will have to review our foreign policy accordingly."
 yugoslavia.213.a:0 "Excellent!"
 yugoslavia.214.t:0 "Yugoslavia Is Not Accepted to the Faction"
 yugoslavia.214.d:0 "We have received a message that Yugoslavia has been refused to join the faction. We don't know the exact reason for this refusal, but it's a very sad and unexpected turn of events."
 yugoslavia.214.a:0 "Worrisome."
 yugoslavia.215.t:0 "Yugoslavia Is Accepted to the Faction"
 yugoslavia.215.d:0 "We have received a message that Yugoslavia has been officially accepted to the faction. We are now officially part of this alliance, and we will have to review our foreign policy accordingly."
 yugoslavia.215.a:0 "Excellent!"
