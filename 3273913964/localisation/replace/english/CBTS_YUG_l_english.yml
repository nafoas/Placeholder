 YUG_3_parts_federation_desc:0 "Yugoslavia is a federal state, divided into three federal parts: Serbia, Croatia and Slovenia. Every federal unit elects its own parliament and is governed by a ban, appointed by the king. The central government deals with questions of defense, internal security, foreign policy, trade and transport.\nMarko Natlačen is the Ban of §CSlovenia§!\nIvan Šubašić is the Ban of §gCroatia§!\nMilan Aćimović is the Ban of §RSerbia§!\n\nEthnic tensions in Yugoslavia are at §Y[?YUG_tensions]§! value. Make sure not to let this value reach §Y100§!!"
