# IDEAS
 YUG_disunited_nation:0 "Divided Nation" 
 YUG_disunited_nation_desc:0 "Yugoslavia was created in 1918 under the name Kingdom of Serbs, Croats and Slovenes, primarily for the purpose of countering Italian ambitions in the Adriatic. This union was never easy to uphold. Yugoslavia is divided by multiple ethnic, religious, linguistic, and maybe even civilizational boundaries. The largest visible split follows rivers Drina, Sava and Danube, along the former Austro-Hungarian border. Mutual distrust, prejudice and disrespect negatively affect our nation on every level."
 YUG_croatian_nationalism:0 "Croatian Nationalism"
 YUG_croatian_nationalism_desc:0 "Soon after the creation of Yugoslavia, the Croatian Peasant Party (also known as the HSS) emerged as the dominant political party in Croatia. Its views transcend ideological boundaries and its primary goal is to protect Croatian interests within the union. Such a party wasn't one of a kind, but the importance of the Croats in Yugoslavia made it possible for the HSS to make more lasting demands to the government than similar Slovenian or Muslim parties. The murder of Stjepan Radić, the former leader of the HSS, lead the Croats to a path of non-collaboration. HSS deputies deliberately ignore parliamentary meetings and refuse any negotiations unless they meet their demands. As Radić said, a Croat must be the owner of his own home. Unless we find some kind of agreement, this situation will continue and Croatia will remain the fifth column in our nation."
 YUG_the_great_depression:0 "The Great Depression" 
 YUG_the_great_depression_desc:0 "The Great Depression didn't hit Yugoslavia as hard as it hit Germany, the United States or the United Kingdom only because Yugoslavia was in a poor economic state to begin with. Nevertheless, foreign trade declined drastically, and our government has already declared a partial moratorium on debt repayment."
 YUG_serbian_general_staff:0 "Serbian General Staff"
 YUG_serbian_general_staff_desc:0 "The Royal Yugoslav Army was created after the reorganisation of the Serbian Army. Consequently, its general ranks, as well as the General Staff, are almost completely dominated by Serbs, while young educated Croats and Slovenes are reluctant to enter the army. Serbian military traditions may be useful in the battlefield, while Serb domination in the ranks provides us with political stability. However, we might miss certain opportunities in our domestic policies."
 YUG_vmro_activity:0 "VMRO Activity"
 YUG_vmro_activity_desc:0 "VMRO, aka Internal Macedonian Revolutionary Organization, is a revolutionary national liberation movement. It has earned a reputation as an ultimate terror network, seeking to change state frontiers in the Macedonian regions of Greece and Yugoslavia. They contest the partitioning of Macedonia and launch raids from their Petrich stronghold into Greek and Yugoslav territory. We are unable to destroy those terrorists on our own, as long as Bulgarian government continues to tolerate their activity within their borders."
 YUG_alexander_memory:0 "Memory of the King Alexander"
 YUG_alexander_memory_desc:0 "Despite being an authoritarian ruler, sometimes displaying brutality to his political opponents, King Alexander was a popular leader. Now, after the terrible regicide, he became a martyr for the Yugoslavian cause. Politicians are now eager to claim to continue his policies, while peoples of Yugoslavia work together to fight against a bigger evil. Ironically, the King has achieved his ultimate goal, Yugoslavian unity, by being murdered."
 YUG_federalization_talks:0 "Talks of Federalization"
 YUG_federalization_talks_desc:0 "The public is aware of the coming federalization. National parties actively mobilize their home regions in order to have a strong position during the talks. Quarrels in the regions with mixed ethnic composition turn to fights, as people argue over future borders of the federal units. Some extremists go as far as to propose to \"adjust the ethnic map\" of disputed regions to secure them for their own federal unit. The society becomes polarized, and the nation seems to be ready to tear itself apart. Was federalization such a good idea after all?"
 YUG_federal_yug_jrz:0 "Federal Yugoslavia: Jereza Constitution"
 YUG_federal_yug_jrz_desc:0 "Constitution, adopted by JRZ after Stojadinović-Maček agreement, is now active in Yugoslavia. The state is divided into three federal parts: Serbia, Croatia and Slovenia. Every federal unit elects its own parliament and is governed by a ban, appointed by the king. The central government deals with questions of defense, internal security, foreign policy, trade and transport. The electoral law allows proportional representation."
 YUG_high_ec_school:0 "Economics-Commercial High School of Belgrade"
 YUG_foreign_licenses:0 "Foreign Equipment"
 YUG_tankettes_licenses:0 "Foreign Tankettes"
 YUG_aircraft_licenses:0 "Foreign Aircrafts"
 YUG_antiaircraft_licenses:0 "Foreign Anti-Aircraft Guns"
 YUG_tank_licenses:0 "Foreign Tanks"
 YUG_cool_serbian_general_staff:0 "Serbian General Staff"
 YUG_cool_serbian_general_staff_desc:0 "The Royal Yugoslav Army was created after the reorganisation of the Serbian Army. Consequently, its general ranks, as well as the General Staff, are almost completely dominated by Serbs, while young educated Croats and Slovenes are reluctant to enter the army. Serbian military traditions may be useful in the battlefield, while Serb domination in the ranks provides us with political stability. As time goes on, the Serbs have only strenghtened their positions in the army. Old traditions are preserved, and Chetnik paramilitary activity is coordinated with the general staff."
 YUG_yugoslav_general_staff:0 "Yugoslavian General Staff"
 YUG_yugoslav_general_staff_desc:0 "The Royal Yugoslav Army was created after the reorganisation of the Serbian Army. Its general ranks, as well as the General Staff, until recently were completely dominated by Serbs, while young educated Croats and Slovenes were reluctant to enter the army. Serbian military traditions may be useful in the battlefield, and the all-Yugoslavian character of our armies strenghtens the unity of our young nation."
 YUG_federal_yug_srz:0 "Federal Yugoslavia: Sereza Constitution"
 YUG_federal_yug_srz_desc:0 "Constitution, adopted by the Constituent Assembly under SRZ guidance, is now active in Yugoslavia. The state is divided into three federal parts: Serbia, Croatia and Slovenia. Every federal unit elects its own parliament and is governed by a ban, appointed by the king. The central government deals with questions of defense, internal security, foreign policy, trade and transport. The electoral law allows proportional representation."
 YUG_federal_yug_hss:0 "Federal Yugoslavia: Six Nations Constitution"
 YUG_federal_yug_hss_desc:0 "Constitution, adopted by the Constituent Assembly, is now active in Yugoslavia. The state is divided into six federal parts: Serbia, Croatia, Slovenia, Bosnia, Montenegro and Macedonia. Every federal unit elects its own parliament and is governed by a ban, appointed by the king. The central government deals with questions of defense, internal security, foreign policy, trade and transport. The electoral law allows proportional representation."
 YUG_fail_parliament:0 "Failed Parliamentarism"
 YUG_fail_parliament_desc:0 "We have returned to parliamentarism, and we have to face the concequences. Yugoslavian peoples love freedom and democracy, but the concept of parliamentarism is rather unusual for them. Politicians spend more time in endless senseless arguments, rather than working together to build better future."
 YUG_croats_resist_conscription:0 "Croats Resist Conscription"
 YUG_croats_resist_conscription_desc:0 "Different politicians may attribute large-scale military evasion among the Croat population to many sources. Some blame communist and Ustaše propaganda, some accuse Croats in rampant Serbophobia, and some lay the blame on the Yugoslavian state itself. The truth is, Yugoslavian government finds it increadingly difficult to draft Croats into the army."
 YUG_treason_army_bad:0 "Dangerous Treason in the Army"
 YUG_treason_army_bad_desc:0 "Our army is experiencing mass-scale events, which may be classified as treason. They are caused by deliberate desire by many of our soldiers and officers to damage our combat efficiency and bring Yugoslavian defeat on the battlefield closer. The scale of this treason is relatively moderate, and it could've been much worse. It must be stopped immediately."
 YUG_treason_army_worse:0 "Terrible Treason in the Army"
 YUG_treason_army_worse_desc:0 "Our army is experiencing mass-scale events, which may be classified as treason. They are caused by deliberate desire by many of our soldiers and officers to damage our combat efficiency and bring Yugoslavian defeat on the battlefield closer. The scale of this treason is extensive, and certain mistakes of our government attributed to this situation. It must be stopped immediately."
 YUG_treason_army_worst:0 "Catastrophic Treason in the Army"
 YUG_treason_army_worst_desc:0 "Our army is experiencing mass-scale events, which may be classified as treason. They are caused by deliberate desire by many of our soldiers and officers to damage our combat efficiency and bring Yugoslavian defeat on the battlefield closer. The scale of this treason corresponds our worst forecasts. It must be stopped immediately."
 YUG_treason_countryside_bad:0 "Outrageous Banditry in the Countryside"
 YUG_treason_countryside_bad_desc:0 "Our government finds it increasingly difficult to control the countryside. Self-proclaimed "freedom fighters" arm and organize themselves in order to bring end to the Yugoslavian states. The scale of this banditry is relatively moderate, and it could've been much worse. It is in our best interest to stop it as soon as possible."
 YUG_treason_countryside_worse:0 "Dire Banditry in the Countryside"
 YUG_treason_countryside_worse_desc:0 "Our government finds it increasingly difficult to control the countryside. Self-proclaimed "freedom fighters" arm and organize themselves in order to bring end to the Yugoslavian states.  The scale of this banditry is extensive, and certain mistakes of our government attributed to this situation. It is in our best interest to stop it as soon as possible."
 YUG_treason_countryside_worst:0 "Devastating Banditry in the Countryside"
 YUG_treason_countryside_worst_desc:0 "Our government finds it increasingly difficult to control the countryside. Self-proclaimed "freedom fighters" arm and organize themselves in order to bring end to the Yugoslavian states. The scale of this banditry corresponds our worst forecasts. It is in our best interest to stop it as soon as possible."
 YUG_treason_industry_bad:0 "Brazen Sabotage of Industry"
 YUG_treason_industry_bad_desc:0 "Our industry is being deliberately sabotaged by anti-government elements. Work of our factories and mining facilities is damaged by ardent enemies of the Yugoslavian state. Their goal is to destroy the country from within, and established their own national states on our ruins. The scale of this sabotage is relatively moderate, and it could've been much worse. We must intervene before those actions devastate our economy."
 YUG_treason_industry_worse:0 "Critical Sabotage of Industry"
 YUG_treason_industry_worse_desc:0 "Our industry is being deliberately sabotaged by anti-government elements. Work of our factories and mining facilities is damaged by ardent enemies of the Yugoslavian state. Their goal is to destroy the country from within, and established their own national states on our ruins. The scale of this sabotage is extensive, and certain mistakes of our government attributed to this situation. We must intervene before those actions devastate our economy."
 YUG_treason_industry_worst:0 "Desolate Sabotage of Industry"
 YUG_treason_industry_worst_desc:0 "Our industry is being deliberately sabotaged by anti-government elements. Work of our factories and mining facilities is damaged by ardent enemies of the Yugoslavian state. Their goal is to destroy the country from within, and established their own national states on our ruins. The scale of this sabotage corresponds our worst forecasts. We must intervene before those actions devastate our economy."
 YUG_treason_politics_bad:0 "Disgraceful Treachery in Politics"
 YUG_treason_politics_bad_desc:0 "Many Yugoslavian politicians use their offices to harm decision-making abilities of our country. This is especially true for local politicians, who use their power to support bandits and interfere with the government efforts within their municipalities. The scale of this treachery is relatively moderate, and it could've been much worse. It's up to as to deal with this problem once it becomes possible."
 YUG_treason_politics_worse:0 "Scandalous Treachery in Politics"
 YUG_treason_politics_worse_desc:0 "Many Yugoslavian politicians use their offices to harm decision-making abilities of our country. This is especially true for local politicians, who use their power to support bandits and interfere with the government efforts within their municipalities. The scale of this treachery is extensive, and certain mistakes of our government attributed to this situation. It's up to as to deal with this problem once it becomes possible."
