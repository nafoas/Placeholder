 yugoslavia.216.d:0 "We have received a message that Yugoslavia has been refused to join the faction. We don't know the exact reason for this refusal, but it's a very sad and unexpected turn of events."
 yugoslavia.216.a:0 "Worrisome."
 
  ## Banovinas
 yugoslavia.217.t:0 "Local Elections" # could be expanded
 yugoslavia.217.d:0 "Local elections have produced rather expected results. Slovenia, Croatia and Serbia have effectively become one-party states, as political life in the country is dominated by JRZ and its closest partners: Slovene People's Party and Croatian Peasant Party."
 yugoslavia.217.a:0 "A lot of work ahead."
 yugoslavia.218.t:0 "Serbs Are Against Ban Šubašić"
 yugoslavia.218.d:0 "Contacts between Prime Minister Stojadinović and Ban Šubašić are criticized by Serbian public. The Serbs are concerned with Ustaše activity, and are convinced that Šubašić must be put in jail instead of being praised by the government."
 yugoslavia.218.a:0 "Who do they want instead?! Tito?!"
 yugoslavia.219.t:0 "Death of Spaho"
 yugoslavia.219.d:0 "Mehmed Spaho, the leader of the Yugoslav Muslim Organization, has passed away this morning in Belgrade.\n\nSpaho had travelled the day before by train from Sarajevo to Belgrade upon receiving an invitation from the Prince Regent to meet him. He arrived by car to the "Srpski kralj" hotel and sat down at a desk to inspect some letters which had built up in his absence. He stopped to write something and, at that moment, suddenly grabbed his chest and fell off the chair. His personal secretary Hadžihasanović rushed over to his side, but it was too late.\n\nHis funeral was attended by an estimated crowd of 30,000 mourners. Several newspapers have published claims that Spaho was poisoned, and many believe this to be so, but there is no evidence to prove or disprove this theory."
 yugoslavia.219.a:0 "We shall celebrate with... rakija!"
 yugoslavia.220.t:0 "Ustaše Propaganda"
 yugoslavia.220.d:0 "The Ustaše were always a nuisance for the state, but now their propaganda is much more effective. The HSS is in charge of Croatia, meaning that the party of Maček and Šubašić is responsible for Croatian affairs. Protest against the government is now protest against the HSS. People turn to extremism, and often choose the Ustaše."
 yugoslavia.220.a:0 "Damn traitors!"
 yugoslavia.221.t:0 "Spaho Speaks Out"
 yugoslavia.221.d:0 "Mehmed Spaho, the leader of the Yugoslav Muslim Organization, speaks publicly against the current constitutional order. He claims that absence of the Bosnian unit within Yugoslavia threatens the Muslim population of Bosnia. Those speeches produce backlash, as Serbs and Croats want to protect established orders against the Muslims."
 yugoslavia.221.a:0 "He should put his nose back into the Quran."
 yugoslavia.222.t:0 "Serbian Politicians Criticize Government" 
 yugoslavia.222.d:0 "Our actions are continuously criticized by Serbian politicians. They claim that we don't control the situation and jeopardize functioning of Yugoslavian state, putting Serbian people in great danger."
 yugoslavia.222.a:0 "You think you could do a better job?"
 yugoslavia.223.t:0 "Violence in Bosnia"
 yugoslavia.223.d:0 "Bosnia has seen a violence outbreak today. This land is home to many religious and ethnic groups, now struggling against each other to get local superiority and guarantee election of the preferred politician. Fueled by propaganda, this struggle turns violent."
 yugoslavia.223.a:0 "Why can't you just live in peace?"
 yugoslavia.224.t:0 "Slovenian Politicians Criticize Government"
 yugoslavia.224.d:0 "Our activity against the Catholic Church has caused discontent within the Slovenian People's Party. They claim that this situation has gone too far, and that this is a blatant violation of rights of the Slovenian people. Croats and Serbs disagree, raising ethnic tensions."
 yugoslavia.224.a:0 "And you too? Pathetic."
 yugoslavia.225.t:0 "Ustaše Propaganda Among Muslims"
 yugoslavia.225.d:0 "The death of Spaho has produced a power struggle within the Yugoslav Muslim Organization. The victors, led by Džafer Kulenović, have chosen a pro-Croatian approach, promoting the idea that Bosnian Muslims are a part of the Croatian people. The Ustaše like this idea, and now spread their propaganda among Muslims as well."
 yugoslavia.225.a:0 "Perhaps Spaho was not so bad."
 yugoslavia.226.t:0 "Croatia Legalizes the Ustaše"
 yugoslavia.226.d:0 "Terrible news come from Zagreb. Rising ethnic tensions have given voice to the most extremist voices within the HSS, effectively turning Croatian public opinion in favor of the Ustaše. The Croatian Sabor has cancelled the illegality of the Ustaše movement despite the best efforts of Belgrade and Ban Šubašić. Hell has been officially let loose."
 yugoslavia.226.a:0 "No! This will throw the country into chaos!"
 yugoslavia.227.t:0 "Parliamentary Elections" # could be expanded
 yugoslavia.227.d:0 "Parliamentary elections were held today, granting an easy victory to the JRZ. This party has won the majority of the Serbian vote, and now the Parliament is under JRZ control with Milan Stojadinović becoming the Prime Minister. Slovenian and Croatian parties count on local elections in order to have control over parliaments and governments of their respective banovinas."
 yugoslavia.227.a:0 "Understood."

  ## JRZ
 yugoslavia.228.t:0 "Formation of JRZ"
 yugoslavia.228.d:0 "After gaining the national character, the SRZ has reformed herself into the JRZ - Yugoslavian Radical Union. They are now supported by the Slovenian People's Party and Croatian Peasant Party, which hope to gain control over their respective Banovinas."
 yugoslavia.228.a:0 "All hail the Radical Union!"

  ## Elections
 yugoslavia.229.t:0 "Elections!"
 yugoslavia.229.d:0 "Two major blocs are competing in these elections. Liberal forces are united under the list led by Milan Grol. Their Democratic Agrarian Coalition consists of Democrats, Agrarians and Radicals. They are opposed by the Radical Peasant Bloc, led by Milan Stojadinović. This bloc is a union of dissidents from the Radical Party with subnational parties, including the HSS."
 yugoslavia.229.a:0 "Radical Peasant Bloc seizes victory!"
 yugoslavia.229.b:0 "Democratic Agrarian Coalition wins!"
 yugoslavia.230.t:0 "Elections!"
 yugoslavia.230.d:0 "Two major blocs compete in those elections. The Radicals intend to form a strong government, and their only allies in the National Radical Coalition are Slovenian and Muslim parties. The Radicals are opposed by the Democratic Agrarian Coalition, led by Milan Grol. Both blocs are pro-Serbian in nature, however, the Radicals are more extreme in their views."
 yugoslavia.230.a:0 "Democratic Agrarian Coalition wins!"
 yugoslavia.230.b:0 "National Radical Coalition seizes victory!"
 yugoslavia.231.t:0 "Elections!"
 yugoslavia.231.d:0 "Two major blocs compete in those elections. JRZ coalition is led by Prime Minister Stojadinović. Besides JRZ this coalition includes Slovenes, Muslims and Radicals. They are opposed by Vladko Maček and his Popular Agreement Bloc. The latter includes the HSS, as well as Democrats and Agrarians."
 yugoslavia.231.a:0 "Yugoslav Radical Union wins!" # could be expanded, 231 - 237
 yugoslavia.231.b:0 "Popular Agreement Bloc seizes victory!"
 yugoslavia.232.t:0 "Radical Peasant Victory"
 yugoslavia.232.d:0 "The results are in.\n\nMilan Stojadinović has declared his list victorious and has already congratulated his ally Vladko Maček. They have made a joint statement, promising bright future for all the Yugoslavian peoples."
 yugoslavia.232.a:0 "For the future of Yugoslavian peoples!"
 yugoslavia.233.t:0 "Democratic Agrarian Victory"
 yugoslavia.233.d:0 "The results are in.\n\nDespite being continuously criticized for corruption, the democratic forces celebrate victory today. Milan Grol has assumed the post of Prime Minister with parliamentary support from the Democrats, Agrarians and Radicals."
 yugoslavia.233.a:0 "A victory for democracy."
 yugoslavia.234.t:0 "Democratic Agrarian Victory"
 yugoslavia.234.d:0 "The results are in.\n\nModerate forces celebrate victory today, as Milan Grol assumes the post of Prime Minister. In his speech he calls this day "a victory for freedom" and promises a bright future for Yugoslavia."
 yugoslavia.234.a:0 "A victory for the moderates."
 yugoslavia.235.t:0 "National Radical Victory"
 yugoslavia.235.d:0 "The results are in.\n\nThe Radicals celebrate victory today, and Aca Stanojević is greeted in Belgrade as a true successor to Nikola Pašić. He promises that both order and freedom will prevail in Yugoslavia, just as they prevailed in Serbia many years before."
 yugoslavia.235.a:0 "Order prevails!"
 yugoslavia.236.t:0 "Radical Union Victory"
 yugoslavia.236.d:0 "The results are in.\n\nMilan Stojadinović has declared his list victorious and was greeted by his loyal supporters. He claims that he managed to achieve peace in Yugoslavia, and that it's now his duty to preserve it."
 yugoslavia.236.a:0 "Status quo preserved."
 yugoslavia.237.t:0 "Popular Agreement Victory"
 yugoslavia.237.d:0 "The results are in.\n\nIn a surprising turn of events, Vladko Maček and his Popular Agreement Bloc have won. He has told to the cheering public in Zagreb, that those elections are a sign, that all the Yugoslavian peoples demand change, and that he will bring them."
 yugoslavia.237.a:0 "Finally, the changes will come."
 yugoslavia.238.t:0 "Ethnic Clashes Start"
 yugoslavia.238.d:0 "Our worst nightmares became true. Ethnic clashes in Yugoslavia now run rampant, as paramilitaries of all peoples and religions attack civilians and massacre them for the purpose of "cleansing their land." Whatever we were trying to do, we have failed."
 yugoslavia.238.a:0 "Terrible."
 
  ## Banovinas
 yugoslavia.239.t:0 "Spaho Speaks Out"
 yugoslavia.239.d:0 "Mehmed Spaho, the leader of the Yugoslav Muslim Organization, speaks publicly against the current situation. He claims that ban on subnational parties should not affect Muslim groups, as Islam is a religion rather than a people. Those speeches produce backlash, as Serbs and Croats see Spaho's party as a dangerous organized group and unite into groups of their own."
 yugoslavia.239.a:0 "He should put his nose back into the Quran."
 yugoslavia.240.t:0 "Montenegrins Call for Independence"
 yugoslavia.240.d:0 "Montenegrin Federalist Party members call for Montenegrin independence. They claim that Montenegro was annexed into Yugoslavia illegally, and despite popular support for the independent Kingdom of Montenegro. They also claim that current Yugoslavian regime endangers the very existence of the Montenegrin nation."
 yugoslavia.240.a:0 "They can't speak for all Montenegrins."
 yugoslavia.241.t:0 "Land Disputes in Bosnia"
 yugoslavia.241.d:0 "Bosnian land disputes are once again an issue. Muslims demand back lands, which they have lost after the Great War due to land reforms and ad hoc land requisitions. Serbs, on the other hand, feel support from the government and act boldly, sometimes breaking the law."
 yugoslavia.241.a:0 "We've already resolved this issue, haven't we?"
 yugoslavia.242.t:0 "Radicalism in Croatia"
 yugoslavia.242.d:0 "After the drastic fall of the HSS popularity, Croats look for other parties to support. They ofter turn to extremist groups, such as the Ustaše or the Communists. Both of those groups want Yugoslavia dead and act accordingly."
 yugoslavia.242.a:0 "You are even worse than the HSS."
 
 yugoslavia.243.t:0 "Parliamentary Elections" # could be expanded
 yugoslavia.243.d:0 "Parliamentary elections were held today, granting an easy victory to the Prečani Front. This alliance has won the majority of the popular vote, and now Parliament is under control of the liberals with Vladko Maček becoming the Prime Minister. Regional parties count on local elections in order to have control over parliaments and governments of their respective banovinas."
 yugoslavia.243.a:0 "Understood."
 
 yugoslavia.244.t:0 "King Alexander Is Murdered!"
 yugoslavia.244.d:0 "Our nation mourns as the news of the assassination of our beloved King at the hands of a Bulgarian terrorist arrive. Dozens of the King's loyal subjects march to Belgrade, where the funeral for the deceased monarch will be held.\n\nKing Peter II, being of age, prepares for coronation with eagerness to lead Yugoslavia through these troubled times. The Yugoslavian people, overwhelmed by sorrow, grief and anger, await for their young head of state to address the nation."
 yugoslavia.244.a:0 "Long Live King Peter!"
 yugoslavia.245.t:0 "King Peter Comes of Age"
 yugoslavia.245.d:0 "King Peter is now old enough to ascend the Yugoslavian throne; this means the end to the regency as Peter II is now fully in charge."
 yugoslavia.245.a:0 "Long Live King Peter!"
 
 yugoslavia.246.t:0 "Local Elections"
 yugoslavia.246.d:0 "Local elections have produced interesting results. Slovenia and Croatia have effectively become one-party states, as political life there is dominated by Slovene People's Party and Croatian Peasant Party respectively. Democracy prevails in Serbia, where the Democrats and the Agrarians form a local coalition government. In Bosnia, politics is aligned around national parties. The Serbs are represented by the Democrats, the Muslims are led by JMO and the Bosnian Ban Mehmed Spaho, while the Croat vote is divided between the HSS and reinvigorated HNZ. Montenegro is under control of the CGFS, facing opposition from the Serbs. In Macedonia, elections were criticized for voter fraud and voter supression, resulting in a Serb victory. Around two thousand anti-government protesters in Skoplje were dispersed by police."
 yugoslavia.246.a:0 "A lot of work ahead."
 yugoslavia.247.t:0 "Local Elections"
 yugoslavia.247.d:0 "Local elections have produced interesting results. Slovenia and Croatia have effectively become one-party states, as political life there is dominated by Slovene People's Party and Croatian Peasant Party respectively. Democracy prevails in Serbia, where the Democrats and the Agrarians form a local coalition government. In Bosnia, politics is aligned around national parties. The Serbs are represented by the Democrats, the Muslims are led by JMO and the Bosnian Ban Mehmed Spaho, while the Croat vote is divided between the HSS and reinvigorated HNZ. Montenegro is under control of the CGFS, facing opposition from the Serbs. In Macedonia, local MANAPO has decisively defeated the Serbian parties, becoming a political force to be reckoned with for the first time."
 yugoslavia.247.a:0 "A lot of work ahead."
 
 yugoslavia.248.t:0 "Victory in the Civil War!"
 yugoslavia.248.d:0 "Formal hostilities have now come to an end as we have restored order to the rebellious areas of Macedonia, Montenegro, and Bosnia. These regions are still war-torn and unstable as scattered partisans and remnants of the Communists and Ustaše harass villages and troops, but for the most part they are now under our control. The suffering of the people in these regions is immense, inflicted both by the rebellious factions upon each other and through our repacification of the area. Much work remains to be done in reconstruction. Hopefully our new democratic system is up to the task."
 yugoslavia.248.a:0 "A brighter future for all Yugoslavs awaits."
 
 yugoslavia.249.t:0 "Italy agrees to cede Thessaloniki!"
 yugoslavia.249.d:0 "Success! Italian government has agreed to exchange Dalmatia for Thessaloniki. Yugoslavian public is in shock, and Croatian leaders openly speak of treason by our government. Friendship with Italy, however, has been secured."
 yugoslavia.249.a:0 "Let's just hope it will work out in the end."
 yugoslavia.250.t:0 "Italy disagrees to cede Thessaloniki!"
 yugoslavia.250.d:0 "We have received an answer from Italy. Italian government has rejected our proposal to exchange Dalmatia for Thessaloniki. At least, the public is not aware of this thwarted deal."
 yugoslavia.250.a:0 "Perhaps, this is for the better."
 yugoslavia.251.t:0 "Italy refuses to partition Albania"
 yugoslavia.251.d:0 "We have received an answer from Italy. Italian government has rejected our proposal to partition Albania. Apparently, they want the entirety of Albania for themselves."
 yugoslavia.251.a:0 "Sad, but expected."
 yugoslavia.252.t:0 "Albania yields"
 yugoslavia.252.d:0 "Albanian government has taken the obvious path and surrendered the control of the country to forces of Italy and Yugoslavia. Banovina of Skadar has been established in the new territories, however, it will take time to fully integrate it into Yugoslavia."
 yugoslavia.252.a:0 "One less front to worry about."
 yugoslavia.253.t:0 "Albania stands her ground"
 yugoslavia.253.d:0 "Despite overwhelming superiority of the land forces of our alliance, Albania have decided to defy the ultimatum. A swift military operation should be able to take control of the country."
 yugoslavia.253.a:0 "Let's do it the hard way then."
 
 yugoslavia.254.t:0 "The Founding of ZBOR"
 yugoslavia.254.d:0 "Fascism has become a rising political force in Europe, and Yugoslavia is no exception – the Depression, trade union activism, and the spate of political crises in the country has generated a bloc of fascist sympathizers, particularly in the Serbian and Croat upper-middle classes. The first major fascist political force was ‘The Association of Yugoslav Fighters’, a Slovene group which supported King Alexander’s royal dictatorship. It was quickly followed by the predominantly Croat ‘Yugoslav Action’ in 1930, which drew inspiration from the German national socialist movement – adopting the Hitler salute and paramilitarism. These groups, and others, have now been corralled into a single organization, the ‘Yugoslav National Movement’, also called Zbor, by the former Minister of Justice, Dimitrije Ljotić.\n\nZbor promotes the adoption of a corporatist economy, the merger of church and state power, and the extension of the Monarchy’s authority, as well as a full-throated rejection of parliamentary democracy, capitalism, and liberal individualism. It sees itself as the guardian of traditional family life and the ‘Slav race’. Like many Hitlerist-inspired parties, it is deeply antisemitic. The extremist movement is not particularly popular among average Yugoslavians, despite Ljotić's connection with political leadership, and the government has already taken steps to censor the Party's newspapers to prevent political unrest."
 yugoslavia.254.a:0 "Yugoslav fascists are getting organized."
 
  ## 2nd Royal Dictatorship
 yugoslavia.255.t:0 "Živković coups the government!"
 yugoslavia.255.d:0 "A series of events have taken place in Belgrade, which can be described as a coup d'état. At night, army officers assumed control of the Zemun airbase, Danube bridges between Zemun and Belgrade, the City administration, police, Belgrade radio station, ministries, General Staff HQ, the Royal Court, main post office, and the Royal Guards barracks. Communications between Belgrade and the rest of the country were cut, as tanks and artillery were deployed on the main streets of the capital. In the morning, the royal palace was surrounded. A radio message is issued, in which Petar Živković calls the people to support the monarchy. Mass demonstrations follow, in which dozens of people are murdered and hundreds are injured. A new government is formed by Živković and Jevtić, as Yugoslavia now faces prospects of undisguised dictatorial rule."
 yugoslavia.255.a:0 "Yugoslavian democracy is over."
 yugoslavia.256.t:0 "Second Royal Dictatorship"
 yugoslavia.256.d:0 "A series of events have taken place in Belgrade, which some describe as a coup d'état. King Alexander has declared, that current events happening in Yugoslavia endanger public order and state security, that extraordinary measures are to be taken, and that he, after thorough considerations, has decided to dissolve the Chamber of Deputies, postpone the elections and appoint a new government headed by Petar Živković. What it means in practice is a return to the infamous Royal Dictatorship in her worst abuses. People of Belgrade and Zagreb reacted to that news by mass protests, which were dispersed by police, leaving several people dead and a few dozens wounded. Yugoslavia now faces prospects of undisguised dictatorial rule."
 yugoslavia.256.a:0 "Yugoslavian democracy is over."
 yugoslavia.257.t:0 "Attempt on Peter's life"
 yugoslavia.257.d:0 "Terrible news comes from the Royal Palace. This night, an attempt on the life of young Peter, son of King Alexander, was made. The assassin managed to get into the Thatched House of the Royal Compound and sneaked into Peter's room. The assassin seemingly lost his nerve and shot into a wall twice before trying to escape unsuccessfully. Royalists openly blame the Democrats and Pribićević personally for the attempt on Peter's life, while liberals accuse the Royal Guard and general Živković of staging the assassination attempt. Whatever the case, the country is in shock, and the crisis is expected to grow further."
 yugoslavia.257.a:0 "Horrible!"
 yugoslavia.258.t:0 "Strikes against the King"
 yugoslavia.258.d:0 ""
 yugoslavia.258.a:0 ""
 yugoslavia.259.t:0 "Strikes against the Regent"
