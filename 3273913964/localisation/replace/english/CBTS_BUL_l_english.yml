# LEADERS
 POLITICS_BORIS_III_DESC:0 "Boris Klemens Robert Maria Pius Ludwig Stanislaus Xaver was born on 30 January 1894 in Sofia to Ferdinand I, Prince of Bulgaria, and his wife Princess Marie Louise of Bourbon-Parma. He received his initial education at the Palace Secondary School, which Ferdinand had created in 1908 solely for his sons (Boris and Kiril). Boris then went on to graduate from the Military School in Sofia and took part in the Balkan Wars. He also served it in the Great War on the Macedonian Front as Liaison officer. His troops had much respect for him and Erich Ludendorff described the prince as ‘excellently trained, a thoroughly soldierly person and mature beyond his years’. In 1918 he was promoted to major general.\n\nWhen Ferdinand I abdicated at the end of the Great War, Boris became Tsar on October 3, 1918. What followed was years of chaos in the Tsardom as effect of the war. Boris survived many assassination attempts by Agrarians and Communists who would play a major role in the uprisings in the early 20’s. Boris married Giovanna of Italy, daughter of Victor Emmanuel III of Italy, at the Basilica of Saint Francis of Assisi in Assisi, on October 25, 1930. The marriage so far has produced one child: Maria Louisa, on January 13, 1933."

# IDEAS
 BUL_Treaty_Neuilly:0 "Treaty of Neuilly-sur-Seine"
 BUL_Treaty_Neuilly_desc:0 "After our disastrous defeat in the Great War, we were forced to sign the Treaty of Neuilly-sur-Seine by the Entente. On 27 November 1919 Bulgarian delegates and other Entente diplomats met each other in the town hall of Neuilly to the west of Paris. The great powers of France, Britain and the USA demanded that Bulgaria would cede Western Thrace to Greece, blocking our access to the Aegean Sea. Furthermore, they demanded that Bulgaria ceded the Western Outskirts to the Kingdom of Serbs, Slovenes and Croats, which later formed Yugoslavia, and recognise this newly independent state. Bulgaria also needed to pay large sums of war reparations and reduce its army to just 20,000 men. This treaty was met with outrage from the Bulgarian population popularly being known as ‘the Second National Catastrophe’."
 BUL_depression:0 "The Great Depression"
 BUL_depression_desc:0 "The Bulgarian crisis is developing much different than its global counterpart; the initial shock did not come from the the bubble on Wall Street. It was the bursting of the agricultural buble in South-Eastern Europe that hit Bulgaria much more severely and directly. Since most of the Bulgarian population works in the agrarian sector, with some estimates suggesting around 80% working there, this crisis hit our economy sharply with a huge deflation of agricultural prices. Our inefficient agricultural economy is now slowly recovering from the initial shock. Numerous banks have paid the price during this slow recovery and others were forced to merge."
 BUL_war_rep:0 "War Reparations"
 BUL_war_rep_desc:0 "The Treaty of Neuilly-sur-Seine forced us to pay war reparations to the victorious Entente members. In particular the nations of Yugoslavia, Greece and Romania. Despite this, a couple of politicians have managed to secure a loan from the League of Nations after the Great Depression to rebuild the economy so it could manage to pay the war reparations. Although these loans have been very useful, there are still huge sums of money to be payed."
 BUL_imro_idea:0 "VMRO Activity"
 BUL_imro_idea_desc:0 "The VMRO (IMRO), also known as the Internal Macedonian Revolutionary Organization, is a revolutionary organisation aiming to liberate the Macedonian region from Yugoslavia and incorporate it into the Bulgarian Tsardom. They carry out raids against Serbian and Greek patrols along the border. There bases being mostly situated in Petrich (Pirin Macedonia), they launch their raids from within our territory. The organisation has caused trouble with relations between our nation and that of Yugoslavia and Greece and have been a real thorn to our government."

# DECISIONS
BUL_political_actions:0 "Political Actions"
BUL_zveno_plot:0 "Zveno Plot"
BUL_zveno_plot_desc:0 "Zveno is a Bulgarian military and political organization, founded in 1927 by Bulgarian Army officers and associated with a newspaper of that name. As a palingenetic nationalist movement, Zveno advocates for rationalization of Bulgaria's economic and political institutions under a dictatorship that would be independent from both the Soviet Union and the Axis powers. They strongly oppose the Bulgarian party system, which they see as dysfunctional, and the terror of the Internal Macedonian Revolutionary Organization (IMRO). Zveno is also closely linked to the so-called Military League, the organization behind the 1923 coup in which Prime Minister Aleksandar Stamboliyski was brutally murdered. Something must clearly be done in order to prevent another fatal massacre."
BUL_boris_plot:0 "Monarchist Plot"
BUL_boris_plot_desc:0 "The Zveno movement and its republican sentiment are not welcome in the Tsardom. Boris III and his supporters are plotting to change the current goverment, and we must do something about it!"

# EVENTS
bul_internal.2.t:0 "Zveno Coup"
bul_internal.2.d:0 "The Zveno movement and the Military Union, assisted by the Army, has overthrown the Popular Bloc government in a swift coup d'état. General Kimon Georgiev, a veteran of the Great War and one of the leaders of the movement, has been sworn in as Prime Minister. He has already assembled a new goverment, which is making moves to temporarily abolish the Tarnovo Constitution, ban other political parties and even dissolve the National Assembly. The country is in turmoil as the newly formed central authority begins to curtail workers' rights while embracing corporatist policies."
bul_internal.2.a:0 "There goes another European democracy."

bul_internal.3.t:0 "Zveno Coup Prevented"
bul_internal.3.d:0 "Thanks to our recent reforms which significantly decreased nationalist influence in the military, the Zveno movement finds itself without the Army's support, and is thus unable to take hostile action against our democratic government."
bul_internal.3.a:0 "Many democracies fall in the face of chaos, but not this one! Not today!"
bul_internal.3.b:0 "Democracy has failed us, Tsar Boris must rule Bulgaria more directly!"

bul_internal.4.t:0 "Tsar Boris Counter-Coup"
bul_internal.4.d:0 "The growing republican sentiment expressed by some members of the Zveno regime has caused public outrage from the monarchist and militarist elites of Bulgaria. As a result, the Tsar orchestrated a counter-coup against the new regime and placed general Pencho Zlatev as Prime Minister.\n\nA limited form of parliamentary rule has been reintroduced, but the political process remains mostly controlled by the Tsar, who continues to tighten his grip over the country."
bul_internal.4.a:0 "Might makes right!"

bul_internal.5.t:0 "Zveno Counter-Coup"
bul_internal.5.d:0 "The conspiracy of the Tsar and his supporters, who could not accept the new government policy, led to a situation in which the government could not afford to be idle, having to take extreme measures. Today, troops supported by the Zveno movement occupied key buildings in the state; Tsar Boris fled abroad, which can not be said about his supporters, most of which are going to face trial."
bul_internal.5.a:0 "Long live the Republic of Bulgaria!"

