 #Debt Management
 JAP_debt_management:0 "National Debt Management"
 JAP_debt_management_desc:0 "The national debt began to become a national problem for Japan from the Russo-Japanese War of 1905. From the war, Japan's ever-increasing debt seriously worsened its financial situation, which was the root cause of the country's nearly 30-year-long slump. Moreover, the growing influence of the military has led to the expansion of the military budget and the government's budget deficit has become even worse. Taking office in 1930 as acting Treasury Minister, Takahashi Korekiyo has stepped up as a lifesaver to deal with the situation, but the military seems to be looking at him with frustration. \n\nCurrently, Japan's ratio of National Debt to GDP is §Y[?JAP.JAP_Debt]§!%. \n\n§RIf the National Debt exceeds 150% when not in wartime, there will be irreversible pressure on the Japanese government...§!"
 JAP_debt_monetization:0 "General Debt Monetization"
