 jap_factionalism.2.t:0 "A Small Event in Osaka"
 jap_factionalism.2.d:0 "At around 11:40 a.m. on June 17, 1933, Private First Class Masakazu Nakamura, who was going to a movie for the holiday at an intersection in Osaka, crossed the intersection in defiance of a red light. Toda Tadao, a 25-year-old policeman who was directing traffic at the time, warned Nakamura with a megaphone and took him to the police station. At that time, Nakamura fought back at the police station, saying, "The soldiers can obey the military police, but they don't have to obey the orders of the police officers." Nakamura suffered an eardrum injury with a three-week preposition, and Toda suffered a week of preposition, including a tear in his lower lip.\n\nThe incident turned into quite a big deal when it was known to the military police and to the higher authorities. Relations between the military and government ministries, which have not been good enough, may erupt in the wake of the small incident, but the situation still appears to be under control."
 jap_factionalism.2.a:0 "Don't make it bigger and hush-up this as quickly as possible."
 
 jap_factionalism.3.t:0 "The Incident Escalates"
 jap_factionalism.3.d:0 "Contrary to our expectations, it turned out to be a bad one. The police wanted to settle the situation peacefully, but on June 21, the incident became known to the military commander and the ministry of Army, and eventually the Emperor became aware of it. "We demand an apology from the Osaka police on the honor of the army," said Sadao Araki, the army minister, but interior minister Yamamoto Tatsuo insists that police should never be pushed back by pressure from the military, never yield a step, never apologize, and the soldier should be arrested and prosecuted in accordance with principle.\n\nThe incident seems to be the military's fault, but it should be carefully avoided to jump to conclusions as the investigation is still under way. But in order not to drag this case out for a long time, it may be better to order the military to step down and side with the police..."
 jap_factionalism.3.a:0 "Do nothing and wait for the investigation results."
 jap_factionalism.3.b:0 "Are you kidding?! End this ridiculous incident right now!"
 
 jap_factionalism.4.t:0 "End of the Go-Stop Incident"
 jap_factionalism.4.d:0 "On July 1, 1933, the Emperor's special edict was issued. The Emperor said that Araki Sadao, the Army minister, should apologize immediately to interior minister Yamamoto Tatsuo and ordered to make sure that soldier was punished. Araki protested and offered to resign, but the emperor refused to accept it. While all soldiers across the country express anger at the decision, officials across the country are rejoicing over its victory over the military. Soldiers who disturb the stability of the nation can never be forgiven!"
 jap_factionalism.4.a:0 "Don't ever call me for this again."
 
 jap_factionalism.5.t:0 "The Incident Escalates Further"
 jap_factionalism.5.d:0 "We waited for the results of the investigation, but there was no progress in the investigation, which turned into a mudslinging between the military and the police. The investigation is becoming more coercive, with the military and police monitoring both sides. Questions are looming over whether the fight should continue to be a power game between the military and the Interior Ministry, which has already become known nationwide. Now there has been an atmosphere of criticism of police overaction and over-investigation, and some police officers overworked or killed themselves because they could not bear the strain.\n\nWe must now make a choice; the confrontation between the military and the police has become too intense and the conflict must end soon. We can end this senseless war of attrition just by siding with the military, but we may need to wait and see. Of course, the choice is up to his majesty..."
 jap_factionalism.5.a:0 "Take things easy. The time will come soon."
 jap_factionalism.5.b:0 "As expected, bureaucrats cannot be trusted... Leave it to the generals."
 
 jap_factionalism.6.t:0 "End of the Go-Stop Incident"
 jap_factionalism.6.d:0 "On August 7, 1933, police acquitted Private First Class Nakamura after a two-month investigation, and a policeman named Toda, who arrested him and made the case, was sentenced to a reduction. Outwardly, the police have called the incident a result of a 'reasonable' investigation, but the whole nation knows that the police have bowed to the military. His Majesty, who wanted to put an end to the incident quickly and unite the nation, soon led to the military's external victory and many officials tendered their resignations. But this set a bad precedent, and radical soldiers seem to be taking advantage of it..."
 jap_factionalism.6.a:0 "It was the best for the nation."
 
 jap_factionalism.7.t:0 "End of the Go-Stop Incident"
 jap_factionalism.7.d:0 "The Emperor has ordered both the military and the police, knowing that the small incident in Osaka has not been resolved yet, despite the fact that it has been going on for about five months. The mood of reconciliation was created under the order of His Majesty, and soon the incident ended with the two parties, First Class Nakamura and policeman Tota, meeting and shaking hands. Officers and officials in Tokyo, who were torn apart by a small dispute in Osaka, also agreed to end the case. Of course, this balance is still unstable, but the government has succeeded in ending the fight between the two, demonstrating its authority."
 jap_factionalism.7.a:0 "Still, we managed to keep our balance."
 
 jap_army.3.t:0 "General Araki Resigns"
 jap_army.3.d:0 "Kodoha’s leader and our Army Minster, Araki Sadao, resigned as Army Minister when he took office as a college adviser. The resignation of General Araki, who is suspected to have instigated continued clashes between factions within the Japanese Army, will also have a good effect on stabilizing the Cabinet."
 jap_army.3.a:0 "Appoint General Hayashi as his successor."
 
 jap_navy.3.t:0 "Tomozuru Incident"
 jap_navy.3.d:0 "During the Destroyer Squadron exercise on March 12, 1934, Tomozuru, the third ship of the Chidori-class Torpedo boat, was overturned. The incident has left 100 of Tomozuru's 113 crew members dead, and criticism has been directed at the captain, who pushed ahead with the drill despite bad weather conditions. However, the fundamental cause of this incident is the 1930 London Naval Treaty, which has proved to be a major constraint on the ship's design, and prompting calls from the whole nation to withdraw from the London Naval Treaty. Fleet Faction in the Navy seems to be taking this case as a good opportunity."
 jap_navy.3.a:0 "This is all about the fucking treaty!"
 
 jap_internal.7.t:0 "Teijin Incident"
 jap_internal.7.d:0 "In April 1934, a massive round of arrests was made for cabinet members. The investigation, conducted on the basis of rumors that Cabinet members were involved in the hoarding incident in June 1933, arrested key members of the cabinet, including Vice Treasure Minister, president of the Bank of Taiwan. The senior prosecutor who led the investigation, Hiranuma Kiichiro, has decided to carry out the investigation with strict determination. Saito Makoto's cabinet is in big trouble and Prime Minister Saito seems to be even considering disbanding his cabinet."
 jap_internal.7.a:0 "As expected, bureaucrats cannot be trusted..."
 
 jap_internal.8.t:0 "The Death of Togo Heihachiro"
 jap_internal.8.d:0 "Togo Heihachiro, a hero in the Battle of Tsushima and called 'The Nelson of the East,' died at the age of 86. Togo, who studied in England and later made a brilliant contribution to the Sino-Japanese War, soon won the most brilliant victory in the Russo-Japanese War by destroying the Russian Baltic fleet in the 1905 Battle of Tsushima. Togo's funeral will be held at a state funeral, with all Navy personnel from Great Britain, the United States, France and Italy attending, and a naval parade will be held at Tokyo Bay."
 jap_internal.8.a:0 "The Hero of our Nation, Rest in Peace, Adimiral!"
 
 jap_internal.9.t:0 "Resignation of Saito Cabinet"
 jap_internal.9.d:0 "On July 3, 1934, Prime Minister Saito Makoto and his cabinet resigned after being hit hard by the investigation that followed. The successive arrests of key members of the Cabinet and officials have led to the collapse of the cabinet, and key officials, including Genro Saionji Kinmochi, are quickly trying to determine the next prime minister and cabinet. The candidates were soon narrowed down and only the emperor's appointment remains."
 jap_internal.9.a:0 "Appoint Okada Keisuke as the Next Prime Minister."
 
 jap_army.100.t:0 "The Gekokujō"
 jap_army.100.d:0 "In the afternoon of February 25, 1936, the sky in Tokyo was dark and the city was covered in snow. Okada Keisuke was hosting a celebration of his party’s (Rikken Minseito) victory in the election five days prior. At the same time, at a party hosted by the U.S. Embassy, you could find Saito Makoto, Okada’s predecessor, and Suzuki Kantoro, a trusted servant to the emperor. The old Admiral Makoto, touched by the American film \"Naughty Marietta\", went home satisfied without knowing what will happen to him in a few hours.\n\nEarly the next day, Lieutenant Kurihara Yasuhide realized that it was finally time to act. He and the six other officers who decided to commit the dreaded \"Gekokujo\" had already planned a coup for months to destroy the power of the corrupt politicians and the Zaibatsu who exploit the nation and the Emperor. Kirihara mobilized his platoon to attack and kill Okada Keisuke. At the same time, other troops were advancing to kill Saito Makoto and Suzuki Kantaro.\n\nAt 5 A.M, soldiers knocked on the door of Okada’s residence. Okada’s secretary and son-in-law, Sakomizu Histsune; and his brother-in-law, Matsuo Tenzo; entered the Prime Minister’s Residence to save Okada However, the soldiers were already scouring the house to find the prime minister, so Okada and Matsuo fled to the bathroom. \"What shall we do now?\" asked Okada. \"Stay here\" answered the impatient Matsuo. Matsuo left the bathroom himself to reconiteur. A moment later, a gunshot was heard, and Matsuo fell to the ground as a corpse.\n\nThe soldiers thought Matsuo was Okada, but they continued to search the house. Sakomizu was still looking for Okada, and the other soldiers continued to search for their targets. Okada’s fate is the fate of the Empire itself. There was no time to lose."
 jap_army.100.a:0 "Okada met Sakomizu, and survived!"
 jap_army.100.b:0 "He was shot and killed when the soldiers found him!"

 jap_army.101.t:0 "Ishiwara and Araki Intervene"
 jap_army.101.d:0 "At 8 AM, the \"Righteous Army\" summoned military representatives from the Kohoda Faction to the official residence of the Minister of War, which was occupied several hours ago. Military leaders, including General Masaki Jinzaburo and Major general Yamashita Tomoyuki, generally supported the uprising. Masaki also praised the Righteous Army and told them that success and the Shōwa Restoration was just around the corner.\n\nAt 9:30 AM, military advisors met at Tokyo’s Imperial Palace, and General Kawashima Yoshiyuki, the Army Minister, decided to accept Masaki’s demands. Kawashima was an indecisive character. He was neither a Kōhōda or a Tōseiha. He only wanted to survive. Ironically, because of his lack of factional allegiance, his indecisiveness is what allowed him to be appointed to this position. With a satisfied smile, Masaki shook hands with Kawashima. There was only one obstacle between the Righteous Army and the Shōwa Restoration.\n\nAt the same time, Captain Andō Teruzō, who attacked Prime Minister Okada Keisuke, was meeting with Captain Ishiwara Kanji, the commander during the Manchurian Incident and the most controversial figure in the military. Ishiwara, who looked through the Righteous Army’s manifesto, looked at Andō with his lifeless eyes. \"Do you really think that this coup will succeed?\" he asked. \"Yes,\" replied Andō in a voice full of confidence. Ishiwara laughed quietly.\n\nAt that very moment, somewhere else, General Araki Sadao was following the coup through his radio. \"They’ve finally done it,\" thought Araki. However, he was not so surprised. It seemed as though a ray of light, either regret or resignation, shone through his eyes. Araki closed his eyes tightly, and pulled out a brush as if he had made up his mind. His hands danced on the white paper.\n\n\"Will you answer me, General?\" Andō repeated. Ishiwara pulled himself together and opened his mouth with a snort. Similarly, Araki’s finished his letter with an unshakable expression on his face."
 jap_army.101.a:0 "We all agree to support the Shōwa Restoration!"
 jap_army.101.b:0 "What? Restoration? Stop that nonsense right now!"

 jap_army.102.t:0 "Facing the Prime Minister"
 jap_army.102.d:0 "\"Prime Minister Okada, you survived?\" Araki Sadao could not contain his surprise at seeing Okada Keisuke - allegedly killed in the raid two days ago - alive and well. Okada nodded with marked displeasure. The meeting was awkward, as the Righteous Army had Araki’s support, even though they tried to kill Okada.\n\nAraki ran to Ishiwara Kanji, who had decided to support the coup as well. Ishiwara, who usually thought Araki was a waste of space, answered with a cynical smile. \"The dice has already been thrown. If you give up now, I have no choice but to kill you.\" Araki said nothing and left.\n\nIn the end, Araki had to make a choice: cooperate with the coup, or to give up and surrender to the government. Araki, who carefully weighed his values and the cause, made his decision shortly after."
 jap_army.102.a:0 "The Shōwa Restoration must succeed!"
 jap_army.102.b:0 "A Samurai should know when to back down."

 jap_army.103.t:0 "The Emperor's decision"
 jap_army.103.d:0 "\"The time has come for you to decide, Your Majesty,\" rang the voice of Kawashima Yoshiyuki. Faced with this difficult choice, the Emperor felt alone in his massive palace. His politicians had become cold bodies thanks to the Righteous Army’s bayonets, and his allegedly loyal generals had betrayed him. Hirohito’s head was throbbing.\n\nThe Emperor supported the tradition of democracy in this country. For him, the most ideal political system has been the British form of constitutional monarchy, and he has tried to intervene in politics as little as possible. Now, he was in the most important dilemma of his life. It would be anti-constitutional if he defended the current government, and it would be absolutist if he accepted the results of the coup. Hirohito asked for time to think, and nearly fell into a stupor.\n\nTime is running out, and he has to make a choice. The fate of the nation, the Greater Japanese Empire, depends on his three-inch tongue. At last, Hirohito made his choice. He approached his generals and said..."
 jap_army.103.a:0 "...do as you please. Do not disturb me from now on."
 jap_army.103.b:0 "...order the Righteous Army to surrender before I declare you all traitors!"

 jap_army.104.t:0 "The Shōwa Restoration"
 jap_army.104.d:0 "Today, for the first - and perhaps the last - time, the Emperor Hirohito’s \"Jade Voice\" rang out on the radio. The Emperor’s voice, reading the Righteous Army’s demands one by one, was calm, but the Emperor himself was trembling. After reading the declaration, he ended with \"be sure to keep my purpose in mind\", and collapsed on the spot. Japan’s future has been changed forever. The Emperor trampled on the democratic values he had tried to protect.\n\nAt the same time, a group of officers, wearing headbands with \"Sonnō Tōkan\" (Revere the Emperor, Destroy the Traitors) printed on them shouted \"Tennō Heika Banzai!\" in the centre of Tokyo. Tears of emotion began to flow from their eyes. Five years after the 5.15 incident, the Emperor finally recognized Japan’s true destiny. The Empire, protected by God and ruled by a God, would no longer be swayed by weak and corrupt politicians. Looking at the flying Hinomaru and the Rising Sun flag, the officers shouted Banzai once again.\n\nHearing the Emperor’s declaration of the \"Shōwa Restoration\", citizens of Tokyo took to the streets with the Hinomaru and the Rising Sun Flag. More than anyone, it was the Japanese people who were most enthusiastic about the Emperor’s declaration to exclude both the corrupt politicians and reactionary military from politics. Celebrations covered Tokyo all day long. Standing on top of the empty Chrysanthemum Throne, the Emperor was gripped by mixed emotions.\n\nThe Emperor went back into the palace, and never came out again."
 jap_army.104.a:0 "Long live the Emperor!"

 jap_army.105.t:0 "The Coup Fails"
 jap_army.105.d:0 "Today, a message balloon with a piece of paper attached flew high into downtown Tokyo. The paper says \"The Imperial Command has been issued, do not resist the Army colors!\" At the same time, numerous notes fell in droves from a bomber that took flight over Tokyo. The notes said:\n\nTell the Sergeants and Soldiers:\n\n1. It is not too late; return to your position.\n2. Anyone who resists is a traitor and will be shot.\n3. Your parents and brothers have become traitors. They are all crying for you.\n\nMartial Law Command, February 29th, 1936.\n\n\"It’s over,\" muttered Captain Nonaka Shiro. The Teikoku Hotel, which the Righteous Army had used for a command centre, was as quiet as a mouse. Everyone was aware the coup had ended, but some didn’t want to admit it. Nonaka glanced out the window. Tanks were moving in front of soldiers, who were setting up barricacades.\n\nAfter negotiating for his soldiers’ safety, Nonaka remained alone at the Teikoku Hotel. He closed his eyes. The cause had been trampled over. Reciting the unspeakable words to his wife, he put his pistol in his mouth.\n\nIn the darkness of the hotel, a shot rang out."
 jap_army.105.a:0 "It is Over."

