 #North China Buffer State Strategy
 JAP_north_china:0 "North China Buffer State Strategy"
 JAP_north_china_desc:0 "Manchuria and Mongolia have been considered Japan's "Lifeline" since 1890s. Mantetsu, which was built in 1905 when Japan won the Russo-Japanese War, and Manchukuo, which was established as a result of the Manchurian Incident in 1931, have brought Japan a step closer to peace and independence in East Asia. But to wipe out the threat of the Soviet Union and Western forces, we must drive their puppet government out of North China, and for eventual national self-reliance, we must establish an independent government with the cooperation of the locals and warlords. Permission has been granted, and it's time to act."
