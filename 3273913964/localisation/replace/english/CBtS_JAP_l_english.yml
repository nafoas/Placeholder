 JAP_north_china.14.t:0 "Events in Chahar Province"
 JAP_north_china.14.desc:0 "Kwantung army soldiers were kicked out of Chahar province today after being severely beaten!"
 JAP_north_china.14.a:0 "Make a protest!"
 JAP_north_china.14.b:0 "Great!"
 
 JAP_north_china.15.t:0 "Japanese protest"
 JAP_north_china.15.desc:0 "Japan has protested the expulsion of its troops in Chahar Province"
 JAP_north_china.15.a:0 "What's the trick this time?"
 
 JAP_north_china.16.t:0 "A protest against China"
 JAP_north_china.16.desc:0 "These are the requirements that we will send to China in the agreement we are currently negotiating:\n\n1.) The commander of the 132nd regiment, who detained our soldiers, and the judge advocate of the division concerned have to be dismissed and punished.\n\n2.) All units of the Chinese 29th Army shall be withdrawn from the districts of Chahar province north of Changpei.\n\n3.) Maintenance of peace and order there shall be entrusted to the Peace Preservation Corps of Chahar Province.\n\n4. No Chinese shall be permitted to migrate to and settle in the northern part of Chahar province in the future.\n\n4.) No activities of the Kuomintang shall be permitted in Chahar province."
 JAP_north_china.16.a:0 "A fair request if you ask me"
 
 JAP_north_china.17.t:0 "The Chin–Doihara Agreement"
 JAP_north_china.17.desc:0 "The Japanese Kwantung Army negotiator, Kenji Doihara, who represents Japan, has sent his country's demands to Deputy Commander of the Kuomintang 29th Army, General Qin Dechun. It reads as follows:\n1.) The commander of the 132nd regiment, who detained the Japanese soldiers, and the judge advocate of the division concerned have to be dismissed and punished.\n2.) All units of the Chinese 29th Army shall be withdrawn from the districts of Chahar province north of Changpei.\n3.) Maintenance of peace and order there shall be entrusted to the Peace Preservation Corps of Chahar Province.\n\n4. No Chinese shall be permitted to migrate to and settle in the northern part of Chahar province in the future.\n5.) No activities of the Kuomintang shall be permitted in Chahar province.\n6.)All anti-Japanese institutions and acts shall be banned in Chahar province.\n\n It seems that the demands were even worse than the stated above, but after negotiations Dechun managed to tone them down. Now, it is up to us to decide if we want to acept the agreement or not. Accepting would result in the demilitarisation of Chahar and the acceptance of unfair terms from the Imperialists, which is an embarassment. But on the other hand we should not cause major confrontations with the Japanese, lest we start a war... Either way, this will surely fuel considerably the anti-Japanese sentiment across China."
 JAP_north_china.17.a:0 "Accept, there is no other way."
 JAP_north_china.17.b:0 "Reject it."
 
 JAP_north_china.18.t:0 "China accepts"
 JAP_north_china.18.desc:0 "China has said it will fully accept all the demands we gave them. A great victory for Japan!"
 JAP_north_china.18.a:0 "Excellent"
 
 JAP_north_china.21.t:0 "China Rejects!"
 JAP_north_china.21.desc:0 "China has rejected our demands! We shall commence an incurison in Chahar once again. This will apply pressure on the Chiense government to re-consider our generous request."
 JAP_north_china.21.a:0 "For the Emperor!"
 
 JAP_north_china.22.t:0 "Victory of Japan!"
 JAP_north_china.22.desc:0 ""
 JAP_north_china.22.a:0 "BANZAI!"
 
 JAP_north_china.23.t:0 "Victory of China!"
 JAP_north_china.23.desc:0 ""
 JAP_north_china.23.a:0 "wànsuì"
 
 JAP_north_china.24.t:0 "The Three Principles of the Hirota Speech"
 JAP_north_china.24.desc:0 "1. China will not do anything to make a diversion to Japan with the power of European and American powers by eliminating the policy of controlling the babarians as babarians after all, and it is impossible to realize Sino-Japanese friendship by calling out pro-Japanese with only mouth, and contacting European and American accounts at the back.\n\n2. Make sure that Japan, China and Manchuria maintain their relations smoothly at all times as a basic premise for Japanese-Chinese friendship. If China formally recognizes Manchukuo, Japan can only admit that China has sincerity. There may be reasons why Nanjing cannot formally recognize it, but Nanjing must respect the existence of the Manchurian nation anyway. It may be necessary to first find a way to prevent conflicts between Manchuria and the Hebei region, and secondly, to maintain close economic ties between Manchuria and the Hebei region.\n3. China should consult with Japan on valid methods to prevent communization. The source of the movement to communize China is for "some" country, coming down from the north to the south, and it needs to be consulted with Japan on preventing the communization of the border areas of China."
 JAP_north_china.24.a:0 "That's right."
 
 JAP_north_china.26.t:0 "The Tada Speech"
 JAP_north_china.26.desc:0 "1. Our military's fair and impartial policy is fundamentally about rescuing the Chinese people in Hebei and promoting its welfare. This policy will be carried through all the time. To destroy corruption and injustice, you must exercise legitimate power. Relying on the capabilities of the people in Hebei, gradually brightening Hebei is what forms the basis for monotonous coexistence. However, it is inevitable that using the force to exclude Kuomintang and the Chiang Administration from Hebei because Kuomintang and Chiang Administration are trying to block this.\n\n2-1. Based on these basic positions, the our military expresses three attitudes toward Hebei.\n\n2-2. Thoroughly expel the anti-Japanese elements from Hebei.\n\n2-3. Independence of the Hebei Economic Zone (to rescue the people of Hebei, the finances of Hebei must be removed from the jurisdiction of the Nanjing Government).\n\n2-4. Prevent communization through military collaboration of five provinces of Hebei.\n\n3. To this end, the political body of Hebei must be renovated and established. To sum up, the government must provide guidance on maneuvering to organize a government of five provinces of Hebei."
 JAP_north_china.26.a:0 "Perfect!"
 
 JAP_north_china.27.t:0 "The Tada Speech"
 JAP_north_china.27.desc:0 "1. Our military's fair and impartial policy is fundamentally about rescuing the Chinese people in Hebei and promoting its welfare. This policy will be carried through all the time. To destroy corruption and injustice, you must exercise legitimate power. Relying on the capabilities of the people in Hebei, gradually brightening Hebei is what forms the basis for monotonous coexistence. However, it is inevitable that using the force to exclude Kuomintang and the Chiang Administration from Hebei because Kuomintang and Chiang Administration are trying to block this.\n\n2-1. Based on these basic positions, the our military expresses three attitudes toward Hebei.\n\n2-2. Thoroughly expel the anti-Japanese elements from Hebei.\n\n2-3. Independence of the Hebei Economic Zone (to rescue the people of Hebei, the finances of Hebei must be removed from the jurisdiction of the Nanjing Government).\n\n2-4. Prevent communization through military collaboration of five provinces of Hebei.\n\n3. To this end, the political body of Hebei must be renovated and established. To sum up, the government must provide guidance on maneuvering to organize a government of five provinces of Hebei."
 JAP_north_china.27.a:0 "Cursed!"
 
