 #events
 jap_internal.1.t:0 "Japan in 1933"
 jap_internal.1.d:0 "The Empire of Japan, or Empire of Great Japan, is currently in a very unstable situation. In World War I, Japan took former German colonies of the Pacific, known as the South Sea Islands, but that was it. During World War I, Japan forced Twenty-one Demands to China, and China actually accepted those demands, those were ultimately rejected by the post-war Washington Naval Treaty.\n\nJapan, which has had "betrayed victories," developed democratic way of thinking after the war. During the 10-year period called Taisho Democracy, two-party political system was established, which was constituted with Rikken Seiyūkai and the Rikken Minseitō. Also, it included restraining the power of the military and appeasing the colonies. However, the military, which had traditionally been a huge power in Japan, was disgusted by this situation, and Japan's crisis began with a series of events which threatened democracy in the late 20s.\n\nThe 1927 Showa financial crisis shook up Japan's economic roots, ollowed by the Great Depression, which began with the collapse of the New York stock market. Japan's economy began to collapse, and as the civilian government failed to resolve it, the public's support for liberal democracy began to plummet. In this moment, radical army officers and innovative officials united to resolve the situation in Japan, which leads to extreme military expansion against China.\n\nThe Manchurian Incident in 1931, followed by the Shanghai Incident and the establishment of the Manchukuo, changed Japan's fate forever. The civilian government couldn't control the runaway of the military, and to make matters worse, Prime Minister Tsuyoshi Inukai, who was the biggest opponent of Manchurian affairs, was assassinated by army officers in 1932. Immediately after, in order to fill Inukkai's place, the Emperor appointed Saitō Makoto, a renowned navy admiral, as a Prime Minister, and united the two parties to form a national unity government.\n\nThe year 1933 began with Japan's military expansion at Northern China. The border clashes at the Great Wall are expanding the borders of Manchuria and the eyes of the world are paying attention to Japan. What will be the future of Japan? Will democracy survive from this crisis, or will the military eventually seize the power of Japan? Only Emperor will know..."
 jap_internal.1.a:0 "This, too, shall pass away."
 
 jap_factionalism.1.t:0 "Factionalism in Japan"
 jap_factionalism.1.d:0 "Since the Meiji Restoration, various factions have always led the country's politics. The military, too, was divided, but continued to intervene in politics as a faction, and officials and promising politicians who contributed greatly to the Meiji Restoration were also at odds over the direction of the nation's development. However, during the 'democratic' period of the 1920s, called 'Taishō Democracy,' party politics was highlighted and these factional confrontations did not appear very well. The resurgence of this factionalism was due to the 5.15 incident in 1932.\n\nWhen Prime Minister Inukai, who was balancing between the military, bureaucrats and Zaibatsu, was assassinated, the political situation became chaotic and those who supported unstable democracy lost their power clearly. In order to maintain democracy, backed by strong support from the emperor, former naval commander Saitō Makoto was appointed prime minister, but he too was not able to curb the resurgence of factions. As of 1933, there are four major factions in Japan, each with different directions and goals.\n\nA promising politician and aristocrat, Konoe Fumimaro created a power through his own charisma, and that became the Yokusan Action. With the support of aristocratic elders, innovation officials, and moderate military figures, he pursues liberal reforms to complement party politics. This relatively young man is the most popular in Japanese politics and many expect him as the person who shall reform the country.\n\nMeanwhile, a popular diplomat backed by many officials and diplomats, Hirota Kōki, supports relatively conciliatory foreign and domestic policies. He wants to end what he sees as a hostile relationship through negotiations with China, and sees the overpowering military in a negative light. But many question whether he can maintain his power, who is always being swayed by others, and also, continued opposition from the military is threatening his faction.\n\nHiranuma Kiichirō, an old judge who is called the "Right Socialist" and supported by conservative bureaucrats and nationalist rightists, leads Kannenha, who maintains Japan's spirit and pursues fascist policies. A similar claim to the Japanese army's Kōdōha, he sees the Soviet Union as the greatest threat and insists on joining hands with Germany to counter it. But the emperor and other officials see him in a very negative light, and it is unlikely that he will actually take power.\n\nFinally, Tōseiha, the Control Faction of the military, is also political faction itself. They are lead by two famous generals, Nagata Tetsujan and Tōjō Hideki. They want to ultimately transform Japan into a military state through the collaboration of innovative officials and Zaibatsu, and they support the Southern invasion doctrine, which is militarily called Nanshinron. But they are hated by most officials, and the emperor is also reluctant to let the military take power."
 jap_factionalism.1.a:0 "A house divided, against itself cannot stand..."
 
 jap_army.1.t:0 "Factionalism in Japanese Imperial Army"
 jap_army.1.d:0 "Japan has historically been a strong military nation, and the military has played an essential role in the country's growth into a modern power. With the Sino-Japanese War in 1894 and the victory in the Russo-Japanese War in 1905, Japan became a recognized power all over the world, while increasing its military influence. However, since the end of World War I, the military's power has steadily decreased, and the discontent of the officers has accumulated.\n\nThe military began to intervene in politics in earnest in the wake of the 1927 Showa Economic Crisis and the Great Depression that hit Japan. The majority of the youth officers decided that they could not entrust Japan to incompetent politicians who could not solve economic problems, but instead insisted that the emperor be given power again under the leadership of the military. The officers, who criticized officials and Zaibatsu for their corruption and greed, but were constantly at loggerheads with top military officers, eventually breaking up into two factions in the early 30s.\n\nKōdōha, a fledgling faction created with the support of youth officers and sympathetic generals, rejects the traditional system. They fundamentally abhor bureaucracy and the Zaibatsu system, and they believe in a totalitarian regime in which the military controls the state in every way. Idealistic figures of Kōdōha also caused the Manchurian Incident in 1931, and are also blamed for the 5.15 incident in 1932. Ironically, however, those who insist on giving power to the emperor are not supported by the emperor, nor are other officials or generals. These aggressive and radical doctrine believers are also being blamed for destroying Japan's stability.\n\nThe conservative force against them is Tōseiha. But unlike Kōdōha, which emphasizes mental power, they follow military progress and industrial development. Therefore, they believe that connections between bureaucrats and entrepreneurs are very important to develop the country, and that politics is best left to politicians. In contrast to Kōdōha, which regards the Soviet Union as its biggest enemy and calls for northern expansion, Tōseiha considers the United States and Britain a potential adversary and supports Southern Expansion to supply and demand resources. They are supported by a relatively large majority of politicians, but they have fewer impact than Kōdōha, which is supported by the people."
 jap_army.1.a:0 "Stability, that's just what we need."
 
 jap_navy.1.t:0 "Factionalism in Japanese Imperial Navy"
 jap_navy.1.d:0 "Japan was originally a country with a strong army, but it later began to reorganize its military around the Navy due to geographical reasons as an island country. After the naval victory in the Battle of Tsushima, which turned the tide of the Russo-Japanese War, the Japanese admirals became the worshippers of the 'Decisive Battle Doctrine,' which determines the victory or defeat of the war with a single victory. A lesson in the war forced the Japanese navy to create a larger and heavier ships, and the ambitious 'Eight-eight Fleet Plan' was its tipping point.\n\nHowever, times were changing. The weapon named aircraft, which had its meteoric rise, changed the aspect of naval warfare. In line with the technological innovation that took place in Europe, a progressive admirals began to pay attention to a new type of ship called the aircraft carrier to replace the old-fashioned warships. The Washington Naval Treaty provided an opportunity for these advanced admirals to realize their ideals. Japan disposed of the warships which was on building or changed their use to aircraft carriers, and they became Japan's first aircraft carriers to serve.\n\nHowever, most Japanese admiral consider the Washington Naval Treaty a 'betrayal'. They believe that the ratio of warships forced on Japan was unfair, and their interests in China were also violated. The majority of veteran admiral also does not trust aircraft carriers. They think airplanes are just 'plaything', which will go away in a moment of fashion, and they still think the characteristic of the naval battle lies in warships. Combined with the anger toward United Kingdom and the United States that forced the treaty, they hope to broke the chains of naval treaty and became a "Fleet Faction", calling for continued construction of huge warships.\n\nHowever, young, technocrat and realist admirals who values relationships with Western powers, argue that there is no need to break the shackles of the Washington Naval Treaty, or want to break it, but can't. They believe it is important to establish Japan's position in Asia while maintaining friendly relations with the United Kingdom and the United States, and oppose building more warships, arguing that it would only weaken Japan's national power. Some aircraft-friendly admirals are calling for building more carriers which have relatively loose restrictions, and are calling for the expansion of the naval air force. Both of these forces insist on maintaining the naval treaty, so they are called as the "Treaty Faction"."
 jap_navy.1.a:0 "What's next? Factionalism in navy air force?"
 
 jap_external.1.t:0 "Operation Nekka"
 jap_external.1.d:0 "Since the Manchurian Incident of 1931, tension in Manchuria and Rehe has been increasing. Zhang Xueliang, the former ruler of Manchuria, stayed in Rehe and tried to recover the Manchuria that Japan had invaded with the help of Kuomintang, but this was rather a provocation to Japan. The Ishimoto Incident in July 1932 further aggravated the Sino-Japanese conflict, and Japan's invasion of North China became a fait accompli.\n\nSince October 1932, sporadic clashes have continued between Chinese and Japanese troops in Shanhaiguan, a fortress located at the eastern end of the Great Wall. There was one more conflict in December, but no decisive battle was occured. However, on January 1, 1933, finally a full-scale invasion by Kwantung Army finally happened. The invasion, an unauthorised by the top and arbitrary, took Shanhaiguan in just two days and began to escalate into a serious diplomatic issue.\n\nKwantung County's arbitrary behavior confused Daihonei, and soon after, even within the Japanese military, the dispatch of additional troops to Rehe became a serious concern. But regardless of the concerns within Japanese Home Islands, Kwantung Army, which has already broken the Great Wall, is moving deeper and deeper inside China, and Beijing and Tianjin are within their range. The dice have already been thrown, and North China has once again been engulfed in the flames of war..."
 jap_external.1.a:0 "Then, we have no choice but to destroy them!"
 
 jap_navy.2.t:0 "Okada Keisuke asks for Resignation"
 jap_navy.2.d:0 "Our Secretary of the Navy, Okada Keisuke, has requested retirement. Okada, who has served his country since 1889, became 65 years old, and we should give this old and respected admiral his proper treatment."
 jap_navy.2.a:0 "Thank you for the hard work, admiral Okada!"
 
 jap_external.2.t:0 "The Tanggu Truce"
 jap_external.2.d:0 "Chinese and Japanese representatives have met today to negotiate the end of the conflict in Dongbei. Our delegation has demanded the annexation of Rehe, the recognition of Manchukuo by the Chinese Government and a demilitarized zone extending 100 km south of the Great Wall from Beijing to Tianjin. No regular Kuomintang military units will be allowed in the demilitarized zone and public order within the zone will be maintained by a lightly-armed force called the \"Demilitarized Zone Peace Preservation Corps\". Moreover, a truce between the 2 nations will be signed to prevent further hostilities in the future.\nThe Chinese representatives have agreed to all of our demands as our negotiation position is quite strong, as they are unable to win international support for their cause due to the ongoing Chinese Civil War."
 jap_external.2.a:0 "More Steps close to the supreme victory."
 
 jap_external.3.t:0 "Our delegation withdraws from the League of Nations"
 jap_external.3.d:0 "One year after the Mukden incident, the Lytton Commission report recommended the League of Nations that the Kwangtung Army return to its position and function as of September 17, 1931, and that all actions taken subsequent to that date not be recognized or sanctioned by the League. After this our chief delegate to the League, Matsuoka, scrambled to try to have the report tabled pending a trilateral agreement between Japan, China, and Manchukuo, which failed to materialize.\nThe League, after some deliberation, decided to vote on whether to accept the Lytton Commission’s report. At this point, Matsuoka made an impassioned speech to the General Assembly in which he asked it not to accept the report stating that \"It is a matter of common knowledge that Japan's policy is fundamentally inspired by the genuine desire to guarantee peace in the Far East and to contribute to the maintenance of peace throughout the world. To deny us this appeal will be a mistake. I ask you not to adopt this report\". Unconvinced, the General Assembly voted to accept the report by an overwhelming majority (46 to 1, with only Japan voting no). Matsuoka and the Japanese delegation then made a dramatic and symbolic exit from the halls of the building."
 jap_external.3.a:0 "Manchuria belongs to us by right."
 
 jap_internal.3.t:0 "The Showa Sanriku Earthquake"
 jap_internal.3.d:0 "Today, an 8.1 magnitude earthquake hit the Pacific Ocean. Tsunami from the epicenter hit the Tohoku region with a powerful earthquake, and Iwate Prefecture and Miyagi Prefecture, which are close to the sea, were severely damaged. The tsunami is said to have hit a maximum of 28.7 meters and was severely damaged by the destruction of numerous buildings. A total of 1,522 people were killed and 1,542 were missing, resulting in a catastrophic 12,053 casualties. The government is committed to handling the incident and rebuilding the infrastructure."
 jap_internal.3.a:0 "Not Again!"
 
 jap_external.4.t: "We officially leave the LoN"
 jap_external.4.desc: "One month later after the departure of our delegation from the General Assembly of the League of Nations, our government has now officially notified the League of its intention to withdraw from the international body. This signifies the final break between the league and the leading power in East Asia and one of the world's major powers, our Empire.\n\nPrime Minister Saito Makoto announced Japan's withdrawal from the League of Nations at the Ise Shrine today and prayed that the gods who have protected Japan for thousands of years will continue to defend the Empire of God. The Empire will endure."
 jap_external.4.a:0 "We will never come back to that circus."
 
 
 jap_internal.4.t:0 "The Shinpeitai Incident"
 jap_internal.4.d:0 "On July 11, 1933, police said they uncovered a plot to stage a coup by a group named Shinpeitai. It turns out that the terrorist organization, which was frequently linked to the Ketsumeidan terrorist attacks in the early 1930s, and the radical army officers in the army, threw bombs at parliament and government agencies for national renovation and military revolution and plotted for the establishment of a government by the royal family. Fortunately, today, when the attack was launched, the police arrested everyone involved in the coup after finding out what they were up to.\n\nThey also appear to be linked to the Toshiha faction in the army and have confessed that they tried to assassinate Araki Sadao, the army minister. Police are planning to bring them to justice, but the public is feeling uneasy under another threat of coup. Some have voiced their support for the suspects."
 jap_internal.4.a:0 "They are not patriots, they are traitors!"
 
 jap_internal.5.t:0 "Uchida Kosai Resigns"
 jap_internal.5.d:0 "Our foreign minister, Uchida Kosai, has asked for his resignation. In August, he said in a congressional statement, "We cannot give up our rights and interests in Manchuria, even if our ground is scorched," and was later attacked by lawmakers and eventually offered us to resign. Uchida, known as the respected leader of Rikken Seiyukai and a competent foreign minister, has pursued aggressive diplomacy since the Manchurian Incident of 1932, and his foreign policy has been derided as 'Scorched Earth Diplomy', named after his earlier speech. Anyway, we must respect his intention and accept his resignation."
 jap_internal.5.a:0 "Replace him to Hirota Koki."
 
 jap_internal.6.t:0 "An Heir is Born"
 jap_internal.6.d:0 "Congratulations! Today, on December 23, 1933, Empress Kōjun gave birth to a son who will be crowned the next emperor of this country. The fact that only Four daughters were born in the royal family was a source of concern for this country, but the nation is pleased to hear that Her Majesty has finally given birth to a son to succeed the royal family. The news of the birth of the prince was soon made known throughout the country through sirens, and the Emperor named him in person."
 jap_internal.6.a:0 "Your name is... Tsukunomiya, Akihito."
 
