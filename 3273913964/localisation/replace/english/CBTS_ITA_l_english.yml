 ITA_raise_2_CCNN_division: "Raise the 2ª Divisione CC.NN. '28 Ottobre'"
 ITA_raise_2_CCNN_division_desc: "We will raise a Blackshirt division in preparation for the war with Abyssinia. The name \"28 Ottobre\" (28 October) has been chosen to commemorate the Fascist March on Rome on 28 October 1922."
 ITA_raise_4_CCNN_division: "Raise the 4ª Divisione CC.NN. '3 Gennaio'"
 ITA_raise_4_CCNN_division_desc: "We will raise a Blackshirt division in preparation for the war with Abyssinia. The name \"3 Gennaio\" (3 January) has been chosen to commemorate the date of assumption of dictatorial powers by Benito Mussolini on 3 January 1925."
 ITA_raise_5_CCNN_division: "Raise the 5ª Divisione CC.NN. '1 Febbraio'"
 ITA_raise_5_CCNN_division_desc: "We will raise a Blackshirt division in preparation for the war with Abyssinia. The name \"1 Febbraio\" (1 February) has been chosen to commemorate the founding of the Milizia Volontaria per la Sicurezza Nazionale (MVSN) on 1 February 1923."
 ITA_raise_6_CCNN_division: "Raise the 6ª Divisione CC.NN. 'Tevere'"
 ITA_raise_6_CCNN_division_desc: "We will raise a Blackshirt division in preparation for the war with Abyssinia. It will be composed of Great War veterans, amputated veterans, Italians living abroad and University students. The name \"Tevere\" chosen after the Tiber river."
 ITA_raise_7_CCNN_division: "Raise the 7ª Divisione CC.NN. 'Cirene'"
 ITA_raise_7_CCNN_division_desc: "The division is to be deployed in Libya to threaten the Suez Canal should the British close it to Italian traffic due to the war with Abyssinia. The name \"Cirene\" has been chosen to commemorate the Roman city of Cirene in Cyrenaica."
