 ITA_grand_council_fascism:0 "Grand Council of Fascism"
 ITA_grand_council_fascism_desc:0 "The Grand Council of Fascism has been the main legislative body of the Italian State since 1929. Originally created to control the Fascist Party, it later acquired the power to control constitutional changes and it now in fact substitutes the role of Parliament entirely. As such, any important decision must first go through the Council.\n\n§CBlue§! laws are §CParty Directories§!.\n§RRed§! laws are §RConstitutional Laws§!.\n\nThe §gMilitari§! hold [?ITA_consiglio_militari_seats] seats.\nThe §RMonarchici§! hold [?ITA_consiglio_monarchici_seats] seats.\nThe §YNazionalisti Indipendenti§! hold [?ITA_consiglio_nazionalisti_seats] seats.\nThe §GMussoliniani§! hold [?ITA_consiglio_mussoliniani_seats] seats.\n\nMussolini's current popularity is about [?ITA_Mussolini_Popularity]%.\n\n§RIf the Mussolinani lose the absolute majority in the Grand Council and the Duce's popularity is low enough, Mussolini will be ousted.§!"
 ITA_abolish_the_chamber_of_deputies:0 "§RAbolish the Chamber of Deputies§!"
 ITA_parliament:0 "[Get.ItalianParliamentName]"
 ITA_parliament_desc:0 "[Get.ItalianParliamentDesc]\n\n§YSeats Per Ideology:§!\n\n§Y Communist Seats: [?ITA_communist_seats]\n Revolutionary Socialist Seats: [?ITA_autsoc_seats]\n Democratic Socialist Seats: [?ITA_demsoc_seats]\n Social Democratic Seats: [?ITA_socdem_seats]\n Social Liberal Seats: [?ITA_soclib_seats]\n Market Liberal Seats: [?ITA_marlib_seats]\n Centrist Seats: [?ITA_centre_seats]\n Conservative Seats: [?ITA_cons_seats]\n Monarchist Seats: [?ITA_mon_seats]\n Authoritarian Seats: [?ITA_aut_seats]\n Nationalist Seats: [?ITA_nat_seats]\n Fascist Seats: [?ITA_fas_seats]\n\n Total Seats: [?ITA_total_seats]\n\n Seats needed to pass the current law: [?ITA_supseat]/[?ITA_seats_needed]§!\n\nRed laws are §RMilitarist§!\nWhite Laws are Pacifist\nYellow Laws are §YIndustrial§!\nLight Blue Laws are for §CWelfare§!\nBlue Laws are for §BAusterity§!\nGreen Laws are §GProgressive§!\nGrey Laws are §gReactionary§!"
 ITA_help_banks:0 "Help Banks"
 ITA_help_banks_desc:0 "Ever since the Economic Crash of '29, Italian banks have struggled and failed and are no longer able to guarantee their economic role. We need to save our banks, to save our nation..."
