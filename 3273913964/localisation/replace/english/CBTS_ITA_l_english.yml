 ### Events ###
 
 italy.3.t:0 "Sicily occupied"
 italy.3.d:0 "Sicily has been occupied, and a military government has been created in Palermo to oversee the difficult occupation hurdles."
 italy.3.a:0 "Good riddance"
 italy.4.t:0 "Sicily occupied"
 italy.4.d:0 "The enemy has managed to gain full control of Sicily! If we allow them to establish a hard-to-defeat foothold in southern Italy, it could lead to our defeat."
 italy.4.a:0 "This is a disaster!"
 italy.5.t:0 "Armistice of Cassibile"
 italy.5.d:0 "With defeat becoming apparent, the government has brokered an armistice with the Allies in order to militarily take Italy out of the war. Considering our inopportune position in the war, this was a must to attempt to end mindless destruction."
 italy.5.a:0 "We need to mantain this secret for as long as we can"
 italy.6.t:0 "Armistice of Cassibile"
 italy.6.d:0 "Having attained military superiority in Italy, we have also managed to sign a secret armistice with the new Italian government, thus taking them out of the war. This will sow discontent within the enemy lines and free up an important front."
 italy.6.a:0 "We need to announce this as soon as we can"
 italy.7.t:0 "Italy signs an armistice with the Allies"
 italy.7.d:0 "As Italian fascists are thrown into disarray, the King's military government has brokered an armistice with the invading enemy forces to end Italy's participation in their previous alliance. A shocking turn of events, the consequences of which are not clear as of yet."
 italy.7.a:0 "Is the war over?"
 italy.7.b:0 "Good job"
 italy.7.c:0 "We needed to mantain this secret"
 italy.7.e:0 "Those traitors!"
 italy.8.t:0 "Mussolini escapes"
 italy.8.d:0 "The fascist fugitive Mussolini has escaped from captivity with the help of the German forces and is thought to have relocated to land currently unoccupied by the Allies. Preparations for a rival government are seemingly underway."
 italy.8.a:0 "How did this happen? We are smarter than this"
 italy.9.t:0 "Mussolini escapes"
 italy.9.d:0 "Mussolini has escaped from captivity with the help of Germany and has relocated to land currently unoccupied by the Allies. Since he owes his escape to Germany, there are some inevitable concessions to be made."
 italy.9.a:0 "A meeting is in order"
 italy.10.t:0 "Operation Achse"
 italy.10.d:0 "Our spies seemed to have intercepted encrypted messages from the Italians, they are planning to negotiate peace with our enemies! We must intervene before this becomes reality, the Italians are no longer loyal to us. We shall invade Italy, free Mussolini and install a satellite regime with him as head, to secure our southern flanks."
 italy.10.a:0 "Let's begin the operation."
 italy.11.t:0 "The King escapes Rome"
 italy.11.d:0 "Fearing a fascist return to Rome, the King of Italy has fled his palace located there. En route to the city of Brindisi, we shall hope that the King arrives there safely."
 italy.11.a:0 "We wish him safe travels"
 italy.12.t:0 "German units invade Italy!"
 italy.12.d:0 "Following the recent political upheaval in Italy, German troops have today started moving in and occupying land seemingly with the aim of securing their threatened flank. We need to do what needs to be done."
 italy.12.a_cbts:0 "Viva il Duce!"
 italy.12.b_cbts:0 "Viva il Re!"
 italy.18.t:0 "Italo-Greek Security Summit"
 italy.18.d:0 "Today we welcomed Mussolini and his delegation, with whom we discussed matters of security and cooperation in the Balkans. Most of the agenda was dominated by the Italians, who, underlining our amicable relations, proposed that we enter into a military alliance with them. They argue that the formation of such entanglement could help establish our state as a major power in the Balkans. While their actions seem to be in goodwill, we must be wary of Italian gunboat diplomacy and not forget the risk of warm conflict when making a decision."
 italy.18.a:0 "We could stand to gain a lot with an alliance"
 italy.18.b:0 "Negotiate in return for Albanian clay"
 italy.18.c:0 "Such a proposal can undermine peace in the Balkans"
 italy.20.t:0 "Greek entry into our faction"
 italy.20.d:0 "Our summit has gone exceedingly well, with the Greek premier today announcing that Greece and Italy were \"whole\" together, and thus would be \"honored\" to join our faction." 
 italy.20.a:0 "Diplomacy at work"
 italy.21.t:0 "Greek entry into our faction - for a price"
 italy.21.d:0 "After the time for our summit had elapsed, the Greek premier called upon a seperate session to be inaugurated, discussing conditions for Greece's entry into our faction. The premier gave a speech about the long-standing Greek ambitions on Gjirokastër, a region in southern Albania, and that the summit could only be considered a success if we were to hand over the occupation of that region. Mussolini called upon a seperate caucus and decided upon the following:"
 italy.21.a:0 "Hand over Gjirokastër, their alliance is more useful"
 italy.21.b:0 "No compromises on our territorial integrity"
 italy.22.t:0 "Negotiations for Gjirokastër successful"
 italy.22.d:0 "After an extended session, we were able to convince the Italians to hand us Gjirokastër in exchance for a military alliance. This is a historic day for Greece."
 italy.22.a:0 "A new era for the Balkans dawns"
 italy.24.t:0 "Agenda failure in Greek summit"
 italy.24.d:0 "Long hours of lobbying and debate have proven to be in vain as the Greek delegation promptly refused our proposals for increased military and economic collaboration. Now might be a good time to re-evaluate the future of the Balkans, and the role that Greece might play as a regional power in the future."
 italy.24.a:0 "They are irrelevant"
 italy.24.b:0 "They must be subjugated"
 italy.25.t:0 "Ultimatum from Italy"
 italy.25.d:0 "Today the ambassador of Italy arranged a visit to the premier's office with a note in his hand, notifying the government of an ultimatum from the Italian state. The ultimatum demands that we completely surrender control to Italy or we face the consequence: declaration of war. The premier contemplates silently before deciding:" 
 italy.25.a:0 "Alors, c'est la guerre"
 italy.25.b:0 "We must accept the ultimatum"
 italy.27.t:0 "Ultimatum from Italy"
 italy.27.d:0 "Just a few minutes ago, the Italian ambassador visited the Cankaya Mansion, delivering a lightly-worded ultimatum from Mussolini. He demands that we hand over the control of the Bosphorus Straits to Italy, or face the possibility of war. After long contemplation with his cabinet, the president develops the alternative idea of offering an alliance to keep the straits off of Italy's direct occupation. Neither policy seems to garner much support however, with this in mind, the president decides to:"
 italy.27.a:0 "Abolish full neutrality"
 italy.27.b:0 "We cannot risk another independence war"
 italy.27.c:0 "Liberty or death!"
 italy.28.t:0 "Turkish entry into our faction"
 italy.28.d:0 "Emphasizing a history of cultural connectivity between our two Mediterranean civilizations in a historic press statement, the Turkish president has asked on behalf of his nation to be admitted as a member to our faction, thus allowing us access to the Straits with no questions asked. While full control would have been more desirable, Il Duce is willing to consider this a diplomatic victory."
 italy.28.a:0 "Hold a reception for our new ally"
 italy.29.t:0 "Turkey surrenders control of the Straits"
 italy.29.d:0 "In a surprising turn of events, the Turkish president has announced that he is not willing to allow his constituency to experience another independence war and thus would approve a 99-year lease of the Bosphorus Straits to Italy. After an unceremonious press conference between Il Duce and the Turkish president, the occupation of the Straits was formally transferred to our nation."
 italy.29.a:0 "Schedule parade in our newly-acquired territory"
 italy.30.t:0 "Turkey stands defiant"
 italy.30.d:0 "In a disastrous press conference, the Turkish president announced that Turks would not stand for another period of \"foreign enslavement\" and publicly exposed the ultimatum that we issued. Needless to say, they made their decision." 
 italy.30.a:0 "A proud folk, to say the least"
 italy.31.t:0 "Italy requests to formalize the Rome Protocols"
 italy.31.d:0 "The Italian government, with which we have signed the Rome Protocols, proposes that we formalize this mutual defense treaty into a total military alliance with extensive planning and unconditional support in engagements. How shall we respond?"
 italy.31.a:0 "A fantastic idea"
 italy.31.b:0 "We are not interested"
 italy.32.t:0 "Hungary accepts"
 italy.32.d:0 "Our proposal to formalize the Rome Protocols was met with positive reception by the Hungarian foreign policy office, paving the way for a crucial step towards containing German aggression."
 italy.32.a:0 "This is a great occasion"
 italy.33.t:0 "Hungary rejects"
 italy.33.d:0 "Our proposal to formalize the Rome Protocols was met with a lukewarm reaction from the Hungarian government, who rather preferred to not be part of such endeavor."
 italy.33.a:0 "A wasted opportunity to say the least"
 italy.34.t:0 "Negotiations for Gjirokastër fail"
 italy.34.d:0 "In a bizarre show-off of arrogance, Mussolini has rejected our proposal of acquiring Gjirokastër in exchange for alliance, citing concerns of \"territorial integrity\" and \"national security\"."
 italy.34.a:0 "What a wasted opportunity"
 italy.36.t:0 "Proposal from the Italians"
 italy.36.d:0 "Today a delegation from Italy arrived in Sofia to talk to the government about the possibility of our inclusion into the Axis military alliance. The head of the Italian delegation claimed that they would be willing to vouch to Germany for our entry, thus strengthening our chances. Also noting that our state would be a natural ally in establishing a \"new Balkans\", the Italians were quite persuasive in their mission. How shall we respond?"
 italy.36.a:0 "Accept the Italian Request- approach Germany"
 italy.36.b:0 "We cannot accept"
 italy.37.t:0 "Italy sponsors Bulgarian entry into the Axis"
 italy.37.d:0 "Mussolini issued a telegram today, asking us about the possibility of Bulgaria's entry into the Axis. Bearing in mind the Bulgarian government susceptibility to foreign pressure and far-rightist political movements, their loyalty would be easy to maintain, thereby making them a logical ally in the Balkans region. How shall we respond?" 
 italy.37.a:0 "Welcome to the Axis!"
 italy.37.b:0 "We have different designs for the Balkans"
 italy.38.t:0 "Bulgaria Declines our Offer"
 italy.38.d:0 "A return telegram has reached Rome from Sofia, the Bulgarians have declined our request for us to assist them in joining the Axis."
 italy.38.a:0 "A Shame..."
 italy.39.t:0 "Germany declines our entry into the Axis"
 italy.39.d:0 "Despite Italian vouching, the Germans have today sent us a telegram informing us that our request to join the Axis has been rejected."
 italy.39.a:0 "They must have other plans..."
 italy.40.t:0 "Germany rejects possibility of Bulgarian entry"
 italy.40.d:0 "Without much explanation, Germany has denied Bulgarian entry into the Axis. This is surprising and reasons behind such an unexpected action can be speculative at best."
 italy.40.a:0 "Not very logical of them"
 italy.41.t:0 "This shouldn't exist"
 italy.41.d:0 "If you get this event while naturally playing the game, please fill out a bug report. This event should never naturally occur!"
 italy.41.a:0 "Bug Reports in the Top Right!"
 italy.42.t:0 "The Pact of Steel"
 italy.42.d:0 "With a long-shared emnity towards the British and the French topping the list, the Italians and us have many similarities. To this end, the Italian foreign minister has proposed to us the \"Pact of Steel\", which declares a state of trust between the two states alongside a secret provision, which deals with increased economic and diplomatic ties, effectively creating a binding alliance. How do we respond to this proposal?"
 italy.42.a:0 "Establish the Rome-Berlin Axis"
 italy.42.b:0 "We have other designs for Italy"
 italy.43.t:0 "Germany agrees to the Pact of Steel"
 italy.43.d:0 "Our proposal to establish the Rome-Berlin Axis has been a resounding success in German political circles and we have therefore entered into a fully-binding alliance with them."
 italy.43.a:0 "Three hurrahs for the Axis"
 italy.44.t:0 "Germany rejects the Pact of Steel"
 italy.44.d:0 "Shocking news as the German state refuses to cooperate with us on all matters outlined in the Pact of Steel. Further cooperation thus seems rather unfeasible for the foreseeable future."
 italy.44.a:0 "We should have expected this"
 italy.45.t:0 "A Deal with the devil"
 italy.45.d:0 "Establishing communications secret from the eyes of the press, Italian premier Mussolini has proposed an intriguing idea, one that would pave the way for Italy to rekindle our alliance which has laid dormant since 1918. Mussolini emphasizes the common enemy we have in the revisionist Germany and believes that setting aside our differences could pave the way for a peaceful, stable Europe. While a tempting offer, we must not forget that this is a matter of trust, and any betrayal by Italy might spell disaster for our future diplomatic endeavors. We must tread carefully, the fate of Europe depends on it."
 italy.45.a:0 "Draft the secret protocols for when it's time"
 italy.45.b:0 "We know better to not deal with fascists"
 italy.46.t:0 "England drafts alliance treaty"
 italy.46.d:0 "Relevant British authorities have drafted a friendship treaty which includes secret provisions to formally admit our nation into the Allied faction. It only takes a pen stroke to lead Italy to victory, and Europe to peace."
 italy.46.a:0 "Our hands are no longer tied"
 italy.47.t:0 "England turns down military cooperation"
 italy.47.d:0 "As a demonstration of what is unmistakably British arrogance, the UK has completely denied to establish a formal alliance. Citing incompatibility of ideologies and our previously \"aggressive\" diplomatic behavior, the British premier declared that they would not compromise on their so-called ideals."
 italy.47.a:0 "How foolish of them to assume that they were our only option"
 italy.48.t:0 "Mussolini proposes naval exercises"
 italy.48.d:0 "Italian premier Mussolini has recently reached to us, talking about the possibility of an Italian naval detachment training with the Royal Navy to improve coordination in the high seas and embolden technological and doctrinal knowledge-sharing operations. How shall we respond to his proposal?"
 italy.48.a:0 "An excellent idea"
 italy.48.b:0 "We are being too hasty with our trust"
 italy.49.t:0 "Exercises with the Royal Navy"
 italy.49.d:0 "The British have accepted our proposal, and a naval detachment of ours partook in a historic event, one that underlines the Italo-British alliance all the while providing us with some valuable experience."
 italy.49.a:0 "A historic occasion"
 italy.50.t:0 "Britain refuses joint exercises"
 italy.50.d:0 "Citing inavailability due to heightened state of crisis, the British have refused to participate in joint naval exercises."
 italy.50.a:0 "Nothing we can do about it"
 italy.54.t:0 "Italy offers protection"
 italy.54.d:0 "With the creation of the Pact of Rome, the Italian foreign ministry has reached out to us to expand the faction's constituency by inviting our presence. As a signatory of the Rome Protocols, this might be an important step to deter German designs over our sovereignty."
 italy.54.a:0 "We accept their invitation"
 italy.54.b:0 "We cannot allow ourselves to be diplomatically entangled"
 italy.55.t:0 "Austria joins the Pact"
 italy.55.d:0 "After little deliberation, the Austrian government has responded positively to our delegation's overtures and has opted to join the Pact of Rome, thus solidifying our alliance against German irredentism."
 italy.55.a:0 "A grand day for the Pact"
 italy.57.t:0 "Italy in 1933"
 italy.57.d:0 "Winners of the Great War, Italy has succeeded in establishing itself as a European power... But the war has put the state into debt, and a real economic and social crisis began in Italy in 1919. Taking advantage of the popularity Italian revanchism and the fear of a communist revolution, Benito Mussolini, the founder of Fascism, took power in 1922 with the March on Rome.\n\nOnce Prime Minister, Mussolini passed a series of decrees granting him full power, allowing him to ban opposition parties and to hunt down Socialists and Communists, with the end goal of creating a far-right totalitarian state in Italy. His government began a series of corporatistic reforms to reduce the state debt. These reforms were more or less successful, but did not allow Italy to avoid the economic crisis of 1929.\n\nIn 1933, Italy is barely recovering from this crisis... but many problems persist. Banditry, lack of raw materials, debt... The Italian government sees only one solution to all this: war! But the war against Austria-Hungary had demonstrated the weaknesses of the Italian army... Especially with the defeat in Ethiopia, Italian colonial ambitions and thus diplomatic prestige were duly hindered...\n\nA storm is coming to Europe, and Italy will have to choose its side between its former allies, who have not respected the London Pact of 1915... or choose another, more extremist path. It can even follow its own path..."
 italy.57.a:0 "Viva Il Duce!" 
 italy.58.t:0 "Influence of Victor Emanuele III"
 italy.58.d:0 "When he was only 30 years old, Vittorio Emanuele Ferdinando Maria Gennaro di Savoia became king of Italy, after his father was murdered by an anarchist. Interested very little in politics, the king left the Prime Ministers to deal with Italian politics. When the Great War happened, the king encouraged Italian irredentism against Austria-Hungary, but the post-war economic crisis left Victor Emanuele III powerless to deal with the people's anger. In 1922, during the March on Rome, he decided to appoint Mussolini as Prime Minister.\n\nDespite the totalitarian regime installed by the Duce, the king kept some control over the government and the army. So, if Italy finds itself in a negative situation because of Mussolini, he will not hesitate to regain power with his most loyal generals..."
 italy.58.a:0 "Viva Il Re!"
 italy.59.t:0 "Italy wants to join the Axis"
 italy.59.d:0 "Italy has made an offer to be admitted into the Axis, likely due to our military successes early on in the war."
 italy.59.a:0 "Let them in"
 italy.60.t:0 "Germany accepts us into the Axis"
 italy.60.d:0 "The Germans have warmly received our offer and have welcomed us to the Axis military pact."
 italy.60.a:0 "Onwards to a new Europe"
 italy.61.t:0 "Germany rejects our proposal"
 italy.61.d:0 "Not offering any proper explanation, the Germans have refused our request to join their alliance."
 italy.61.a:0 "Arrogance will only cost them the war"
 italy.62.t:0 "Bombing campaigns on Ethiopia"
 italy.62.d:0 "Though it may not be a very humane method, the high command has seen it fit to use mustard gas in a bombing campaign against the Ethiopian army. With our planes on duty, we hope to see a swift end to Italo-Ethiopian war, thus solidifying the Italian colonial empire."
 italy.62.a:0 "Excellent"
 italy.63.t:0 "Mustard gas attack!"
 italy.63.d:0 "The dastardly Italian troops have employed an illegal method of warfare by launching mustard gas attacks on our troop locations. Though the effects may seem initally non-existent, our troops are being increasingly covered with burns and becoming bed-ridden as hours go by."
 italy.63.a:0 "What inhumanity!"
 
 ita_gov_mussolini.1.t:0 "Replacing the Finance Minister"
 ita_gov_mussolini.1.d:0 "We have chosen to replace the current Finance Minister. Who shall have the position now?"
 ita_gov_mussolini.1.a:0 "The current minister is fine"
 ita_gov_mussolini.2.t:0 "Replacing the Foreign Minister"
 ita_gov_mussolini.2.d:0 "We have chosen to replace the current Foreign Minister. Who shall have the position now?"
 ita_gov_mussolini.2.a:0 "The current minister is fine"
 ita_gov_mussolini.3.t:0 "Replacing the Minister of the Interior"
 ita_gov_mussolini.3.d:0 "We have chosen to replace the current Minister of the Interior. Who shall have the position now?"
 ita_gov_mussolini.3.a:0 "The current minister is fine"
 ita_gov_mussolini.4.t:0 "Replacing the Head of Police"
 ita_gov_mussolini.4.d:0 "We have chosen to replace the current Head of Police. Who shall have the position now?"
 ita_gov_mussolini.4.a:0 "The current minister is fine"
 ita_gov_mussolini.5.t:0 "The Longest Night"
 ita_gov_mussolini.5.d:0 "This night was one of epocal changes.\nIn the meeting of the Grand Council, various topics were to be discussed; the situation of Italy and the status of the Fascist Party, for example. \nHowever, only one proposal was voted: the Grandi agenda, which called to restore the powers of the King and the consitution.\nThe vote passed at 2,40 AM, after which Mussolini called off the meeting.\nWhat this means is not clear, as the Council does not have the power to depose Mussolini; regardless, the Duce will not stay in power for long without the support of his own party.\n\nAfter the longest night of the Fascist Era, one question awaits a response: what will happen now?"
 ita_gov_mussolini.5.a:0 "We arrived to the epilogue, the greatest watershed in history"
 ita_gov_mussolini.6.t:0 "A meeting with the King"
 ita_gov_mussolini.6.d:0 "After yesternight's Council meeting, the King himself called Mussolini for a meeting in Villa Savoia.\nThe Duce fears His Majesty will try to depose him following the approval of the Grandi agenda, so he brought with himself a copy of the documents which state clearly that the Grand Council has no effective power on these matters."
 ita_gov_mussolini.6.a:0 "This does not bode well"
 ita_gov_mussolini.7.t:0 "Mussolini is arrested"
 ita_gov_mussolini.7.d:0 "Betrayal! The meeting was little more than a trap, as the King informed Mussolini of his deposition and of the creation of a new military governement, and the now former Duce was then arrested just outside Villa Savoia and trasported to an unknown location."
 ita_gov_mussolini.7.a:0 "It is all over now"
 ita_gov_mussolini.8.t:0 "A new Prime Minister"
 ita_gov_mussolini.8.d:0 "Now that the King has ordered Mussolini's removal from power and his arrest, he has decided to form a new government by hand-picking a candidate from the military. He chooses to..."
 ita_gov_mussolini.8.a:0 "Invite Marshal Badoglio"
 ita_gov_mussolini.8.b:0 "Invite Marshal Caviglia"
 ita_gov_mussolini.9.t:0 "Mussolini deposed"
 ita_gov_mussolini.9.d:0 "Unexpected news come from Italy, where long time dictator Benito Mussolini lost a vote of no confidence inside the National Fascist Party itself and was then deposed and arrested in the day of yesterday.\nThe new military government promised to keep Italy stable during the troubled times ahead, and called for the restoration of the democratic institutions."
 ita_gov_mussolini.9.a:0 "A new Italy dawns"
 ita_gov_mussolini.9.b:0 "What will be the consequences of this?"
 ita_gov_mussolini.10.t:0 "The Fascist Party falls apart"
 ita_gov_mussolini.10.d:0 "With Mussolini gone and the fascists thrown into disarray by the establishment of a new military regime, the Marshal has moved quickly to ban the National Fascist Party with little to no political resistance."
 ita_gov_mussolini.10.a:0 "The end of an era"
 
 ita_diplomacy.1.t:0 "Signing of the Four Powers Pact"
 ita_diplomacy.1.d:0 "Mussolini's effort to push forward a treaty aiming to maintain peace in Europe by emphasizing the role of the four major states has succeeded as it was met with warm reception across the board. Albeit symbolic, the treaty has positive indications for future cooperations in Europe." 
 ita_diplomacy.1.a:0 "Well done"
 ita_diplomacy.2.t:0 "Transferring the Sarra Triangle"
 ita_diplomacy.2.d:0 "With the final agreement between the British and the Italian negotiators, the Sarra Triangle will finally be annexed into Italian Libya, ending a long-standing territorial dispute. This is not only a diplomatic victory but a sign for greater collaboration between the English and the Italian states."
 ita_diplomacy.2.a:0 "A good deal for us both"
 ita_diplomacy.3.t:0 "The Franco-Italian Agreement"
 ita_diplomacy.3.d:0 "Our delegation has reached an agreement with the French government who is willing to pursue warmer relations by enabling our state's colonialist agenda. Bearing in mind Germany's recent rise, such an agreement is also advantageous towards France, the government of which currently is at odds with the militaristic policy of the new German state."
 ita_diplomacy.3.a:0 "A new era for the two nations"
 ita_diplomacy.4.t:0 "Italy issues an ultimatum"
 ita_diplomacy.4.d:0 "The government of Mussolini today issued an ultimatum to our government, demanding that we transfer our lands into their occupation. Considering the absurd amount of control Italy exercises over our banking sector as well as our local security, defying this ultimatum would hardly produce any positive results."
 ita_diplomacy.4.a:0 "We have no choice"
 ita_diplomacy.4.b:0 "Come and get it"
 ita_diplomacy.5.t:0 "Albania yields"
 ita_diplomacy.5.d:0 "King Zog's government has taken the obvious path and surrendered the control of Albania to our forces. Reorganizations are currently underway to set up a collaborationist government to better accomodate our grip."
 ita_diplomacy.5.a:0 "An easy victory for Fascism"
 ita_diplomacy.6.t:0 "Albania stands it's ground"
 ita_diplomacy.6.d:0 "Despite the immense control we exercise over Albanian economic and political affairs, they have decided to defy our ultimatum. A swift military operation should be able to take care of their rebellious behavior."
 ita_diplomacy.6.a:0 "They have brought this upon themselves"
 ita_diplomacy.7.t:0 "Italy proposes a mutual defense treaty"
 ita_diplomacy.7.d:0 "With Germany's recently aggressive diplomatic behavior dominating European headlines, the government of Italy has proposed a treaty to formalize the Rome Protocols into a defensive alliance designed to counter any and all aggressions against our sovereignties. How shall we respond to this endeavor?"
 ita_diplomacy.7.a:0 "A great idea"
 ita_diplomacy.7.b:0 "That's not in our interests"
 ita_diplomacy.8.t:0 "The [FROM.GetAdjectiveCap] Government Accepts"
 ita_diplomacy.8.d:0 "An addressee of our mutual defense treaty has accepted our advances and joined our military alliance."
 ita_diplomacy.8.a:0 "Stronger together"
 ita_diplomacy.9.t:0 "The [FROM.GetAdjectiveCap] Government Refuses"
 ita_diplomacy.9.d:0 "An addressee of our mutual defense treaty has rejected our advances to form a military alliance."
 ita_diplomacy.9.a:0 "What a shame"
 ita_diplomacy.10.t:0 "Brenner Crisis: Italy appeals for help"
 ita_diplomacy.10.d:0 "Dark clouds gather today as German aggression for control over Austria reached it's boiling point. Dubbed the Brenner Crisis, the German government's insistence over annexing Austria is not only against the Stresa Front provisions, it is also a tightrope that needs to be treaded carefully. We must immediately notify the British."
 ita_diplomacy.10.a:0 "We must make haste"
 ita_diplomacy.11.t:0 "Italy calls for help"
 ita_diplomacy.11.d:0 "Acting within the provisions of the Stresa Front, the Italians have called upon our military intervention into the Brenner Crisis, which has escalated into a fully-fledged armed conflict between the German and the Italian states. How do we respond to this turn of events?"
 ita_diplomacy.11.a:0 "Pledge to fully support Italy"
 ita_diplomacy.11.b:0 "Tell the Italians we stand with them"
 ita_diplomacy.12.t:0 "England agrees"
 ita_diplomacy.12.d:0 "Communications with the UK have yielded positive results and we expect their full cooperation in the Brenner Crisis."
 ita_diplomacy.12.a:0 "Notify the Italians"
 ita_diplomacy.13.t:0 "England proposes a more diplomatic approach"
 ita_diplomacy.13.d:0 "In spite their initial support, the British have seemingly caved to appeasement and have denied to fully support the Italians in the Brenner Crisis."
 ita_diplomacy.13.a:0 "There is not much we could have done anyway"
 ita_diplomacy.14.t:0 "The Western Powers pledge full support"
 ita_diplomacy.14.d:0 "Acting in accordance to the provisions of the Stresa Front, both the British and the French governments have chosen to completely support our stance against the aggressive German state."
 ita_diplomacy.14.a:0 "Three cheers to our alliance"
 ita_diplomacy.15.t:0 "The Western Powers propose a less aggressive approach"
 ita_diplomacy.15.d:0 "We should have expected this. Our former allies have once again demonstrated cowardice and backed down from countering the Germans in the Austrian issue. We are left to our own devices."
 ita_diplomacy.15.a:0 "Not surprising unfortunately"
 ita_diplomacy.16.t:0 "Mussolini visits Turkey"
 ita_diplomacy.16.d:0 "Our nation today welcomes Benito Mussolini, the leader of Italy, who is apparently on a \"mission of goodwill\" to improve bilateral relations. Considering the long-standing admiration Mussolini has for Ataturk, the reception of their arrival has gone well. Mussolini believes that this indicates further cooperation."
 ita_diplomacy.16.a:0 "We Turks have a friend in Mussolini"
 ita_diplomacy.16.b:0 "We must remain apprehensive to European affairs"
 ita_diplomacy.17.t:0 "Turkey accepts warmer ties"
 ita_diplomacy.17.d:0 "After a fruitful conference, the Turkish president and his cabinet vocally stated that they were grateful to our diplomatic mission and gifted Mussolini a mural of their Independence War, thus ending the conference on a high note. We can only hope that this diplomatic momentum carries over to when we need it the most."
 ita_diplomacy.17.a:0 "Hang that mural in the Duce's office"
 ita_diplomacy.18.t:0 "Turkey rejects diplomatic proximity"
 ita_diplomacy.18.d:0 "Though the Turkish president noted that the Turkish people and the Italian people are friends, he also declared that diplomatic entanglements were not in the interest of the Turkish Republic, thus leaving us empty-handed from our trip to Ankara."
 ita_diplomacy.18.a:0 "Not exactly surprising"
 ita_diplomacy.19.t:0 "Italian diplomatic mission"
 ita_diplomacy.19.d:0 "A delegation from Italy has arrived to meet the president on a \"mission of goodwill\" to improve our ties to their government while also emphasizing cultural ties and the Italo-American population. How shall we respond to this?"
 ita_diplomacy.19.a:0 "Welcome them, the president's a fan of Mussolini's anyway"
 ita_diplomacy.19.b:0 "We have no business being friends with them"
 ita_diplomacy.20.t:0 "Successful meeting with the American president"
 ita_diplomacy.20.d:0 "Our delegation has been very positively received in the warm reception prepared by the president of the US, and we discussed the cultural history of the Italo-American population. The meeting has gone so well in fact, the vice-president of the US has announced publicly that he will man a similar cultural mission to Italy in the coming days." 
 ita_diplomacy.20.a:0 "Terrific news"
 ita_diplomacy.21.t:0 "Failed meeting with the US"
 ita_diplomacy.21.d:0 "Even though our delegation was positively received, the American president has continuously stated that the US would refrain from taking any sort of political allegiance in Europe, which has dismayed many in our delegation."
 ita_diplomacy.21.a:0 "Who said we were trying to ally them?"
 ita_diplomacy.22.t:0 "American vice-president arrives"
 ita_diplomacy.22.d:0 "Following an atmosphere of diplomatic warmth, the American vice-president has embarked on a tour of our country, topping his visit off by visiting the interior minister, Benito Mussolini."
 ita_diplomacy.22.a:0 "Raise a toast to the Americans"
 ita_diplomacy.23.t:0 "Tour of Italy"
 ita_diplomacy.23.d:0 "The vice-president, alongside his security detail, embarked on a modest but a widely-publicized tour of Italy, as a way of signalling warmer relations between our two countries. On his return, the vice-president simply remarked that Mussolini was an \"outstanding fellow\" and that Italy was a \"lovely country\"."
 ita_diplomacy.23.a:0 "Raise a toast to the Italians"
 ita_diplomacy.24.t:0 "Italian \"Tour of the West\" drops by England"
 ita_diplomacy.24.d:0 "Embarking on a series of diplomatic meetings dubbed the \"Tour of the West\", Mussolini has recently sat down with the prime minister to discuss diplomatic proximity and peace and security in Europe. Though his efforts are widely considered by the cabinet to be mere posturing, we might stand to gain Italy's favor in the future if we are more approachable to his endeavors."
 ita_diplomacy.24.a:0 "Let's see what he has to say"
 ita_diplomacy.24.b:0 "Pay no heed to his rhetoric"
 ita_diplomacy.25.t:0 "Italian \"Tour of the West\" drops by France"
 ita_diplomacy.25.d:0 "Embarking on a series of diplomatic meetings dubbed the \"Tour of the West\", Mussolini has recently sat down with the prime minister to discuss diplomatic proximity and peace and security in Europe. Though his efforts are widely considered to be mere posturing by the media, we might stand to gain Italy's favor in the future if we are more approachable to his endeavors."
 ita_diplomacy.25.a:0 "Let's see what he has to say"
 ita_diplomacy.25.b:0 "We have no interest in his drivel"
 ita_diplomacy.26.t:0 "Successful meeting with Mussolini"
 ita_diplomacy.26.d:0 "In a more amicable setting than one might expect, the impromptu conference we held with Mussolini was a success in which colonial hostilities were glossed over and further cooperation in Europe was discussed thoroughly."
 ita_diplomacy.26.a:0 "Let's hope this sets a precedent"
 ita_diplomacy.27.t:0 "Successful meeting with France"
 ita_diplomacy.27.d:0 "Diplomatic approachability proved triumphant as Il Duce and the French premier discussed matters of security and cooperation in Europe without delving too much into colonial competition. This is a positive step towards friendship between our two nations."
 ita_diplomacy.27.a:0 "Second leg of the tour successful"
 ita_diplomacy.28.t:0 "Britain disregards our overtures"
 ita_diplomacy.28.d:0 "While it would not be fair to label the conference a disaster, Il Duce's meeting with the British has not produced the intended results. The conversation quickly devolved into vocal conflict over disputed colonial territories, culminating in Il Duce and his delegation leaving without proper reception."
 ita_diplomacy.28.a:0 "That was their train to catch, not ours"
 ita_diplomacy.29.t:0 "France condemns our overtures"
 ita_diplomacy.29.d:0 "While it was clearly posturing to prop up support for a weak, unpopular government, the French government has completely turned down our good-natured overtures, and accused us of \"mistreating\" our colonial subjects. Il Duce promptly stormed out in rage, prematurely ending a public relations disaster."
 ita_diplomacy.29.a:0 "How could they pretend they are better than us?"
 ita_diplomacy.30.t:0 "Successful meeting with Britain"
 ita_diplomacy.30.d:0 "Diplomatic approachability proved triumphant as Il Duce and the British premier discussed matters of security and cooperation in Europe without delving too much into colonial competition. This is a positive step towards friendship between our two nations."
 ita_diplomacy.30.a:0 "First leg of the tour successful"
 
 ITA_news.3.t:0 "Formation of the Stresa Front"
 ITA_news.3.d:0 "Today, delegations from Italy, France and the UK held a historic summit aimed at countering the increasingly-radicalized rhetoric of the newly-established German state regarding the Austrian question. Dubbed the Stresa Front, the three signatories hope to maintain Austria's sovereignty in light of the re-emergence of German irredentism. Whether this entails an armed alliance, or a merely diplomatic one is up to interpretation considering the appeasement policy previously-followed by the UK in particular. Nevertheless, international observers hope that the Front is an agent for peace."
 ITA_news.3.a:0 "Will this limit German expansionism?"
 ITA_news.3.b:0 "Three powers together"
 ITA_news.3.c:0 "A toast to our Italian allies"
 ITA_news.3.e:0 "This infringes on our sovereignty!"
 ITA_news.3.f:0 "A great victory for Mussolini"
 
 
 ita_economic.1.t:0 "Confindustria pledges allegiance to the Fascist Party"
 ita_economic.1.d:0 "The already warm relations between the Confindustria and the Fascist regime has made it significantly easier for us to exert pressure over them. With Mussolini-aligned members filling up the federation's ranks, we can easily obtain an endorsement from them thus paving the way to their re-organization into the Fascist Confederation of Industrialists."
 ita_economic.1.a:0 "Forward, together!"
 ita_economic.2.t:0 "Giovanni Agnelli enters the Fascist Party"
 ita_economic.2.d:0 "Fiat's founder and cunning businessman Giovanni Agnelli has today formalized his relations to the Fascist Party by joining our ranks as a member. The recipient of the Knight Grand Cross of the Order of the Crown of Italy in 1932, Agnelli has never relinquished his support for our industrial ambitions and we shall hope to see that this is the case in the future."
 ita_economic.2.a:0 "How could we forget him?"
 ita_economic.3.t:0 "A 8 Hours Workday"
 ita_economic.3.d:0 "To further demonstrate the labor-friendly policies of Italian Fascism, King Victor Emanuele III will sign a decree to shorten workday hours to 8, with a workweek that is 40 hours and 42 hours in cases of continuous industrial operations. With daily overtime also decreased to 2 hours max, no one can deny friendliness to labor in our state. \nPost-scriptum; wages will definitely be decreased proportionally."
 ita_economic.3.a:0 "Approved"
 
 italy_internal.1.t:0 "Leandro Arpinati removed as Undersecretary Minister of Interior"
 italy_internal.1.d:0 "A long-standing thorn on our sides, Leandro Arpinati has finally been forced to resign from his position in government. An early party member and a bitter rival of party secretary Achille Starace, Arpinati has been in our crosshairs for a while. It was because this tainted relationship worsened that we were forced to dismiss him from office and to promptly replace him with Guido Buffarini Guidi."
 italy_internal.1.a:0 "He got what he deserved"
 italy_internal.2.t:0 "Arpinati expelled from the PNF"
 italy_internal.2.d:0 "Former PNF minister Arpinati who was recently removed from his position, has finally been expelled from the Partito Nazionale Fascista. Adding to his long list of offenses, Arpinati has been accused by Starace who prepared a dossier chronicling the former's involvement in the 1926 assassination attempt against Il Duce. Apparently, Arpinati sought to install himself as successor after successfully plotting the murder of Mussolini. These outrageous claims were enough to expel him from the PNF and to reserve him a cell in Lipari."
 italy_internal.2.a:0 "So long, troublemaker"
 italy_internal.3.t:0 "Increasing youth disaffection"
 italy_internal.3.d:0 "Recent research and studies on youth trends demonstrate what is interpreted by the Partito Nazionale Fascista as vaning adolescent interest into serving the party. The younger generations, who are exposed to a thoroughly ideological education, end up being the most fascistic members of our society and this inclination is manifested in high numbers of participation in our youth wing. However, this state of affairs may soon change since, with the increasing bureucratization of the PNF, many adolescents fear that the party only serves as a propaganda vehicle and not as the inheritor of the fascist revolution."
 italy_internal.3.a:0 "Not much we can do about that"
 italy_internal.4.t:0 "General elections of 1934"
 italy_internal.4.d:0 "In the second rendition of a new electoral tradition previously introduced in 1929, Benito Mussolini has put forth a list of candidates nominated by the Gran Consiglio del Fascismo to participate in the chamber of deputies. In a simple plebiscite, more than 99 percent of Italians voted to approve the list of candidates. Even socialist politician Emilio Caldara and his cadre have pledged their support to the fascist cause, marking another propaganda victory for the PNF."
 italy_internal.4.a:0 "Viva Il Duce!"
 italy_internal.5.t:0 "Sudden increase in membership to Azione Cattolica"
 italy_internal.5.d:0 "Recently, we noticed an uptick in membership to Azione Cattolica (AC), an association which was established in 1867 and fosters strong ties not just to the Papacy, but the outlawed Parti Popolare Italiano as well. The association, despite being sidelined in 1931 after it attempted to expand it's area of operations and political influence, has continued it's existence. While the Azione Cattolica (Catholic Action) has since been acting as a non-political organization which merely seeks to educate young people based on Catholic principles, it's increasing influence must be kept under a close watch."
 italy_internal.5.a:0 "A non-issue"
 italy_internal.6.t:0 "Victory in Ethiopia"
 italy_internal.6.d:0 "Through various means, we were able to expand our colonial empire by establishing a new domain over Ethiopia. This is a grand victory for Italy, a signal of great things to come."
 italy_internal.6.a:0 "Avanti Italia!"
 italy_internal.7.t:0 "Azione Cattolica expands it's influence"
 italy_internal.7.d:0 "Capitalizing on our non-action and policy of acceptance towards the Azione Cattolica, many new members have emerged and are filling up the association's ranks with rapidity."
 italy_internal.7.a:0 "A test of patience is what this is"
 italy_internal.8.t:0 "Carlo Rosselli and his brother murdered in France"
 italy_internal.8.d:0 "Anti-fascist political theorist and founder of the Giustizia e Libertà (Justice and Freedom) underground partisan group, Carlo Rosselli has been murdered in Bagnoles-de-l'Orne, France alongside his brother Nello. Reports assembled by the British and the French police indicate that the assassination was carried out by a French far-right group called La Cagoule with authorization from Galeazzo Ciano, Mussolini's son-in-law. The reports believe that Ciano's involvement was particularly motivated by Rosselli's pro-republican endeavors in Spain but that is as far credible evidence goes."
 italy_internal.8.a:0 "We had nothing to do with it, of course"
 italy_internal.9.t:0 "Azione Cattolica restores it's central committee"
 italy_internal.9.d:0 "In a brazen disregard of the mutual understanding we had, the Azione Cattolica has gone forth and restored their central committee, which they had dissolved many years ago. This alarming development has turned the recent friction between the PNF and the AC into a political crisis and threatens to sour our relations to the Papacy."
 italy_internal.9.a:0 "Their aggravation will not be left unanswered"
 italy_internal.10.t:0 "Crackdown on the Azione Cattolica"
 italy_internal.10.d:0 "Hastily organizing a response to the recent crisis, Blackshirts have disrupted several Azione Cattolica meetings by intimidating the participants and the government imposed several restrictions on the association's activities in an effort to bring it's rebellious behavior to a conclusion."
 italy_internal.10.a:0 "Excellent"
 italy_internal.11.t:0 "Pope Pius XI issues note of protest"
 italy_internal.11.d:0 "The current pope, Pius XI, has issued a note protesting the treatment of the Azione Cattolica by the fascist regime. Speaking on behalf of the church, the pope noted that the Italian government was stepping on their privileges and that such anti-Papal behavior should immediately cease."
 italy_internal.11.a:0 "Let him ramble as he pleases"
 italy_internal.12.t:0 "Farinacci condemns the Azione Cattolica"
 italy_internal.12.d:0 "Influential fascist and chamber deputy Roberto Farinacci has given a sharp speech condemning the recent actions of the Azione Cattolica, expressly blaming them for their role in the current crisis. This is not surprising, considering Farinacci's anticlerical viewpoints."
 italy_internal.12.a:0 "Perhaps a little too radical"
 italy_internal.13.t:0 "Anticlerical rhetoric against Azione Cattolica intensifies"
 italy_internal.13.d:0 "As tensions between the government and the Azione Cattolica continue mounting, Farinacci's rhetoric continues to further radicalize against the previously mentioned association. This time, Farinacci called upon a purge to be initiated within the AC to out former Partito Popolare Italiano members, a proposal which was rebuked by the pope who criticized the new course of Italian politics, all the while underlining Farinacci's well-documented racism. The pope also reiterated his talking point that the government had no right to intervene in Papal afairs and should therefore abandon any active attempts to subvert the AC."
 italy_internal.13.a:0 "This is becoming a nuisance now"
 italy_internal.14.t:0 "The PNF reaches an agreement with the Azione Cattolica"
 italy_internal.14.d:0 "Directly taking the matters to our own hands, the PNF has clandestinely struck a deal with the Azione Cattolica to end the current crisis. As part of the bargain, both parties will return to the 1931 statute and the AC will promise to reform itself and dismiss remaining PPI politicians. This is a clear victory for Pope Pius XI as he managed to contain fascist pressure inside Catholic institutions while forcing them to accept the changes of the 1931 status-quo."
 italy_internal.14.a:0 "This is not over"
 italy_internal.15.t:0 "Youth radicalization increasing"
 italy_internal.15.d:0 "As OVRA reports had previously shown, political trends among the Italian youth are not very heartening. Newer research has further underlined this, as some disillusioned adolescents seemingly abandon fascism in favor of supporting far-left ideologies, thereby contributing to the popularity of the Partito Comunista Italiano."
 italy_internal.15.a:0 "The blasted Bolsheviks are hard at work, it seems"
 italy_internal.16.t:0 "The death of Gabriele D'Annunzio"
 italy_internal.16.d:0 "Famed poet, war hero and far-right politician Gabriele D'Annunzio has passed away aged 74 due to a stroke. Referred to as \"Il Profeta\" by his followers, D'Annunzio was a champion of Italian corporatism and an expansionist much like Mussolini. Despite the ideas the two men shared, they had always been involved in a tug of war, but that has given way to a somber goodbye as Mussolini organized a state funeral for his former rival." 
 italy_internal.16.a:0 "Memento mori"
 italy_internal.17.t:0 "Rampant corruption and nepotism"
 italy_internal.17.d:0 "Reports from the party and anecdotal evidence point towards an increasing tendency of our party bureaucrats to open their pockets to bribes and use their authority to promote nonmeritocratic appointments. This is likely indicative of the entrenchment of the PNF's rule as the sole political entity in Italy."
 italy_internal.17.a:0 "The price we pay to live in a civilized Italy"
 italy_internal.18.t:0 "Starace dismissed from PNF secretariat"
 italy_internal.18.d:0 "Loyal stooge to Mussolini and secretary of the Partito Nazionale Fascista Achille Starace has been dismissed from his position to make way for Ettore Muti, a famous aviator. Although thoroughly loyal to the PNF and Mussolini, Starace was also thoroughly incompetent and it is hoped that he will better accomodate himself as the Chief of Staff of the Blackshirts."
 italy_internal.18.a:0 "Hello, goodbye"
 italy_internal.19.t: "Bonzani replaced with Baistrocchi"
