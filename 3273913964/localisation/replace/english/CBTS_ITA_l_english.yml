 ITA_Istituto_di_Ricostruzione_Industriale_desc:0 "The brainchild of §YAlberto Beneduce§!, the §GIRI§! is the new Institute charged with the §Ceconomic revitalisation and reconstruction§! of the §GItalian Nation§!.\nEnjoying the support of most of the upper echelons of the Italian society and practically all major industrial firms, as well as that of the Government and of the Duce, the Institute will have extensive powers in order to achieve its goal and finally put Italy on par with the other industrial great powers of the World.\n\nThe §CShare Capital§! of the §GInstitute§! is of §Y[?ITA_IRI_share_capital_var] Billion Lire§!."
