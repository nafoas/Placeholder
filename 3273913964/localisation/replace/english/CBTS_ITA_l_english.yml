 ####### ####### ####### NEW ####### ####### ####### ####### ####### ####### ####### ####### ####### ####### ####### NEW ####### ####### #######

  
  
  
  
  
 ITA_propaganda_flights:0 "Aircraft Propaganda Flights"
 ITA_propaganda_flights_desc:0 "Regia Aereonautica, first established by the fascist party in 1923, is not merely of style. With impressive technical specifications, Italian planes can fly high and long, and we shall use their technical strength to stage propaganda flights. Piloted by such aviators as the famed Italo Balbo, these flights are sure to boost public morale and patriotic fervour."
 ITA_learn_from_72:0 "Learn From the M.C.72"
 ITA_learn_from_72_desc:0 "The legendary M.C.72 is our nation's world recordist plane as the recipient of the speed record. This mechanical beast is a difficult one to tame and in attempting to do so, two of our pilots have unfortunately passed away. Commencing further work on the model will help us determine what these defects are and thus enable our engineers to produce more stable plane models."
 ITA_make_cr32:0 "Roll Out the CR.32"
 ITA_make_cr32_desc:0 "One of the strongest allies of our regime, Fiat has in their blueprints a highly-mobile biplane that is expected to be a force to be reckoned with. The CR.32 is expected to make it's debut very soon and mass production is surely to follow."
 ITA_sky_city:0 "Open the 'Città dell'Aira'"
 ITA_sky_city_desc:0 "Recent records that the Italian Airforce has attained have revealed that the aviation sector is a sector worth further interest. To this end, the Directorate for Studies and Experiments (DSSE), our primary aviation R&D group, will regroup in Montecelio, Lazio to inaugurate the Città dell'Aira (\"City of the Air\"). This patch of land will serve as the centre of operations for the DSSE."
 ITA_convert_s55:0 "Convert Old S.55s to Bombers"
 ITA_convert_s55_desc:0 "Another one of our record-breakers, the nine year-old S.55 flying boat is also a rapidly aging model that faces decreasing usage as time passes. They are still used for exhibitions though and their conversion into bombers can also be sponsored, thus minimizing waste."
 ITA_air_command_restructure:0 "Reorganise the Command Structure"
 ITA_air_command_restructure_desc:0 "To ensure greater decision-making capabilities and to strengthen the hold of the fascist party, we will reorganise the aerial command structure by modifying it's hierarchical formation." 
 ITA_dsse_tests:0 "DSSE Testing"
 ITA_dsse_tests_desc:0 "The DSSE research centre in Montecelio, which is equipped with state-of-the-art aviation technologies has produced some impressive research and testing projects, all of which will be pivotal in our efforts to modernise our aerial forces." 
 ITA_program_r:0 "Program R"
 ITA_program_r_desc:0 "Even though the Italian airforce is renowned worldwide for it's record-setting flights and planes, what it also must be renowned for is it's fighting power. We will commence Program R, which will research, develop and modernise the Italian air fleet into a force to be reckoned with in the skies."
 ITA_overrule_air_ministry:0 "Overrule the Air Ministry's Plan"
 ITA_overrule_air_ministry_desc:0 "Although we have achieved some merit with our biplanes, to make them the dominant fighter model runs contrary to the idea of modernisation. The air ministry should drop their plan to mass produce biplanes and instead focus on further R&D to keep up the modernisation process of the aerial forces."
 ITA_force_modernisation:0 "Forceful Production Modernisation"
 ITA_force_modernisation_desc:0 "In the face of growing technology, warfare, especially of the aerial kind, is not a matter of tradition. Though it may be politically unpopular, we have to phase out older models and make way for newer, more advanced models that are more suited to fight Italy's battles in the air." 
 ITA_trust_biplanes:0 "Trust in Biplanes"
 ITA_trust_biplanes_desc:0 "The incredible performance of previous biplane models has made it clear to us that the air ministry should continue with their plan of prioritizing biplanes for fighter production."
 ITA_fund_cr42:0 "Fund the CR.42"
 ITA_fund_cr42_desc:0 "Another one of Fiat's models, the CR.42 is envisioned as a stronger, more agile CR.32 that can be easily mass-produced. With it's Fiat A.74 RC38 14 cylinder radial engine, the CR.42 can reach 441 kilometres per hour, being able to compete with but not technically overpower it's contemporaries in other nations."
 ITA_war_is_coming:0 "On the Eve of War"
 ITA_war_is_coming_desc:0 "Due to our highly-exposed geographical location, our nation must be prepared from air attacks from all sides. Enemy planes with long reach will not be able to establish dominance over our homeland if we are prepared."
 ITA_navy_needs:0 "Meet the Navy's Need"
 ITA_navy_needs_desc:0 "Aerial and naval combat go hand in hand and they can either support or obstruct each other in a multitude of ways. Our aerial forces must perform R&D on naval-aerial technologies to ensure a stronger cooperation between those two arms of warfare."
 ITA_fighter_scramble:0 "Scramble for Modern Fighters"
 ITA_fighter_scramble_desc:0 "Inspiration always hits in the moment of need. Technique is not the only component of warfare, newer technologies will also help us edge out rivals and with the mobility that warm conflict brings, these technologies will be easier to obtain."

 ITA_modernize_the_regia:0 "Modernize the Regia Marina"
 ITA_modernize_the_regia_desc:0 "Under the shadow of the Washington Naval Treaty, we must begin to modernize our naval forces for any possible conflict that might arise in the Mediterranean by being up-to-date with new technologies and developing suitable doctrines of warfare."
 ITA_modernize_old_ships:0 "Modernize Old Battleships"
 ITA_modernize_old_ships_desc:0 "Instead of mothballing our older battleships, we should refit them with better technologies to prepare for upcoming conflicts in the waters."
 ITA_littorio_class:0 "Littorio Class Battleship"
 ITA_littorio_class_desc:0 "Pushing the absolute boundaries of what was allowed us in the Washington Naval Treaty, we will put in production the Littorio-class of battleships which we intend to be able to defeat the French in an hypothetical encounter. Inspired by Germany's Deutschland-class crusiers, the Littorio Class has a comparably better speed and different mounted turrets."
 ITA_invest_in_new_guns:0 "Invest in New Guns"
 ITA_invest_in_new_guns_desc:0 "Advancements in technology will enable us to develop stronger naval guns with more optimal capabilities in varying calibers for varying operations."
 ITA_invest_in_radar:0 "Radar Research Effort"
 ITA_invest_in_radar_desc:0 "With the Americans' recent breakthroughs with the discovery of the pulse technique in this exact field, we must be up to speed and upgrade our technologies accordingly to such developments."
 ITA_centralize_navy_command:0 "Centralize Naval Command"
 ITA_centralize_navy_command_desc:0 "A military structure is only as efficient as how centralized it is. By restructuring the naval command, we will make sure that the necessary decisions are taken by our officers at top speed and without any hurdles."
 ITA_underwater_revolution:0 "Foca-Class Submarines"
 ITA_underwater_revolution_desc:0 "The Foca-class submarines, are a class of minelaying submarines that the naval R&D operations are currently working on. Intended as improvements to submarines Pietro Micca and Archimede, the Foca-class submarines employ both vertical and horizontal systems of minelaying, which is an uncommon advantage over rival minelaying technologies."
 ITA_continue_sub_development:0 "Invest in New Submarines"
 ITA_continue_sub_development_desc:0 "We will continue our recent expansion of submarine R&D and strive to develop stronger models more suited to perform enemy convoy disruption, minelaying among multitude of other operations."
 ITA_maliale_subs:0 "SLC Torpedoes Effort"
 ITA_maliale_subs_desc:0 "Initially patented by the British but the potential of which has never been truly realized, we will work to develop SLC torpedoes, or human torpedoes, to inaugurate them to naval warfare. We estimate that we will become the first nation to truly begin using such a technology in warfare."
 ITA_carriers_policy:0 "Adopt the Carriers Policy"
 ITA_carriers_policy_desc:0 "The coming storm necessitates a revision of approach and planning, one that is abetted by the fascist state and it's military. We will seek to abandon our fleet in being policies in favor of the budding carrier doctrine."
 ITA_aquillia_class:0 "Aquila Class Carrier"
 ITA_aquillia_class_desc:0 "We will begin the conversion of the seven-year-old ocean liner SS Roma into a full-blown carrier ship, a first for the Regia Marina. This will be a costly and difficult operation, however our experiences with the construction of the Giuseppe Miraglia seaplane tender will help us tremendously in this process."
 ITA_coop_with_regia_aero:0 "Cooperate with the Regia Aereonautica"
 ITA_coop_with_regia_aero_desc:0 "The future of naval warfare is crossed with the future of aerial warfare and those who cannot see this are not looking hard enough. Though the effort will be massive, with the support of many skilled naval officers like Gino Ducci and Giuseppe Fioravanzo, the pay-offs of base strike technologies will be quite handsome."
 ITA_battleships_policy:0 "Continue the Battleship Policy"
 ITA_battleships_policy_desc:0 "Why abandon what has worked wonders for us? We will continue with the fleet in being doctrine to support Regia Marina against the larger navies of the world, ones which may threaten the security of our seas."
 ITA_keep_defensive_navy:0 "Maintain a Defensive Approach"
 ITA_keep_defensive_navy_desc:0 "To take the fight to the numerically and technically superior rival navies would be foolish. The Regia Marina is not a reckless force and will only engage the enemy when the situation deems it necessary."
 ITA_implement_fire_control:0 "Implement Fire Control Systems"
 ITA_implement_fire_control_desc:0 "We will implement modern fire control systems which will drastically improve the navy's aiming accuracy, making sure that navy fire hits where it is supposed hit."
 ITA_push_for_mare_nostrum:0 "Push for Mare Nostrum"
 ITA_push_for_mare_nostrum_desc:0 "An old Roman name for the Mediterranean Sea, \"Mare Nostrum\" has laid in dormancy since then, as no force sign1ificant enough to truly utter it has appeared since the Roman Empire collapsed. However, with Italy's powerful rise in recent years, backed by one of the strongest navies in the world, Mare Nostrum can be reinstated once again."
 
 ITA_reorganize_the_command:0 "Reorganize the Command Chain"
 ITA_reorganize_the_command_desc:0 "The Regio Esercito is the Italian nation's pride, and can stay as such as long as a modernizing force is what drives it. With some new appointments, we can ensure that the reformists have a strong influence over the army."
 ITA_pressure_gazzera:0 "Pressure General Gazzera"
 ITA_pressure_gazzera_desc:0 "General Gazzera, who also serves as the minister of war, has been acting rather rebellious lately, occasionally clashing with Mussolini on a multitude of topics. We cannot allow such a nuisance to occupy the positions that he does and thus we will pressure him out of his assignments." 
 ITA_three_year_plan:0 "First 3 Year Army Plan"
 ITA_three_year_plan_desc:0 "We will commence the 3 Year Army Plan to ably-address the long-standing woes of the Italian army, the general staff of which is currently battling against a string of problems including incompetence and a lack of theoretical cohesion when it comes to warfare." 
 ITA_increase_army_spending:0 "Increase Military Spending"
 ITA_increase_army_spending_desc:0 "The fascist state espouses a militarist rhetoric, a necessary prerequisite of which is increased military spending."
 ITA_entrench_the_party:0 "Entrench the Party"
 ITA_entrench_the_party_desc:0 "Our army is not one of mercenaries who act with no sense of belonging. As the Soviets utilize the commissars with the same mission, we will employ a variety of methods to ensure that fascist ideals are firmly placed in the minds of every Italian soldier."
 ITA_modernize_infantry_eq:0 "Modernize our Infantry"
 ITA_modernize_infantry_eq_desc:0 "Technological improvements must be applied at every turn to our armed forces. The infantry weapon, which is the mechanical backbone to all armies, should always be the first in such applications."
 ITA_modernize_arty_eq:0 "Modernize the Artillery"
 ITA_modernize_arty_eq_desc:0 "Undoubtedly one of the strongest elements of land combat, the artillery must be upgraded as much as possible to ameliorate it's specifications." 
 ITA_celere_division:0 "Create the Divisione Celere"
 ITA_celere_division_desc:0 "Transforming older cavalry units, we will form the Celere Division which is a combined arms division built of motorized, cavalry and tank batallions. These divisions will have rapid-movement capabilities and can hypothetically disorganize and encircle enemy divisions." 
 ITA_reform_officer_corps:0 "Reform The Officer Corps"
 ITA_reform_officer_corps_desc:0 "We will seek to initiate a plan to re-assign officers who were not promoted this year into auxillary forces and promote eager young officers to fill their places. This will help reduce incompetence and award officers based on merit."
 ITA_guardia_di_frontiera:0 "Create the Guardia di Frontiera"
 ITA_guardia_di_frontiera_desc:0 "The Guardia di Frontiera is envisioned as a frontier force, which will help us quell dissent at our fronts and muster a strong garrison force for when the situation deems it necessary."
 ITA_army_manuevers:0 "Organize Army Manouvres"
 ITA_army_manuevers_desc:0 "Though they cannot realistically account for battleground experience, army drills will help the Regio Esercito deduce and work on errors and instill a certain morale and confidence into commanders and soldiers by ensuring that they are not to be baptized by fire."
 ITA_reform_army_doctrine:0 "Reform Army Doctrine"
 ITA_reform_army_doctrine_desc:0 "Success of armies does not merely depend on technological superiority. History has demonstrated time and time again that doctrine and theory, especially after undergoing an irreversible change with the Napoleonic era, are areas to be focused and developed upon."
 ITA_integrate_fascist_militias:0 "Integrate Fascist Militias"
 ITA_integrate_fascist_militias_desc:0 "Militias constituted under the Blackshirts have served their purpose well, maintaining public order while ensuring the state's stability, but it might be in our interest to slowly start their integration into professional forces to curb the influence of amateurish and power-hungry officers."
 ITA_reform_logistics:0 "Reform Army Logistics"
 ITA_reform_logistics_desc:0 "New breakthroughs in army technologies necessitate the complication of logistical matters. In order to be prepared for this eventuality, we need to better the army's logistical capacity."
 ITA_keep_baistrocchi:0 "Baistrocchi Remains"
 ITA_keep_baistrocchi_desc:0 "As the ministry of war's undersecretary, Baistrocchi is both highly-experienced while simulatenously being a talented officer. Losing him because of a couple of disagreements he has with the Il Duce would be foolish move that could potentially discredit the Regio Esercito."
 ITA_cave_to_badoglio:0 "Remove Baistrocchi"
 ITA_cave_to_badoglio_desc:0 "The time has come to finally sack the provocative Baistrocchi, the ministry of war's undersecretary. His quarrels with Mussolini remain unresolved and his presence in the army commands the attention of vultures seeking to exploit our vulnerabilities. Following his rival Field Marshal Badoglio's lead, we will terminate Baistrocchi's assignments and let him go."
 ITA_second_plan:0 "Second 3 Year Army Plan"
 ITA_second_plan_desc:0 "Following up the first 3 Year Army Plan, we will initiate the second batch of reforms which will be aimed towards the further re-organization of the highly-incompetent and highly-divided general staff."
 ITA_neutrality_in_spain:0 "Mantain Neutrality In Spain"
 ITA_neutrality_in_spain_desc:0 "The primary reson why Baistrocchi and Mussolini were embroiled in conflict was the former's belief that Italy should keep out of the current conflict in Iberia. If we have made the choice to keep Baistrocchi, Mussolini should be expected to cave to him on this particular issue."
 ITA_infantry_equipment_focus:0 "Beretta Modello 1938"
 ITA_infantry_equipment_focus_desc:0 "Pooling new technologies together can help us improve our infantry weapons ahead of time."
 ITA_increase_industrial_production:0 "Increase Industrial Production"
 ITA_increase_industrial_production_desc:0 "An army cannot march on a logistically-empty stomach. The Italian industry should work to keep the Regio Esercito equipped and ready for battle."
 ITA_remove_badoglio:0 "Remove Marshal Badoglio"
 ITA_remove_badoglio_desc:0 "Badoglio's unwanted influence nearly cost us Baistrocchi and their rivalry continues to damage the reputation and the organization of the Regio Esercito. Badoglio's foreign policy adventurism, as well as his reliance on older doctrines of war are obstacles in the path towards a bright future for the Regio Esercito. He has to go."
 ITA_unified_general_staff:0 "Unified General Staff"
 ITA_unified_general_staff_desc:0 "With Badoglio out of the picture, the Italian general staff can be rid of the petty factionalism that drove it apart. Under the Kingdom's banner, onwards to victory!"
 ITA_intervene_in_spain:0 "Support Nationalist Spain"
 ITA_intervene_in_spain_desc:0 "The conflict in Iberia presents a unique opportunity for the demonstration of Italian power. By supporting the side that is the most ideologically closer to our nation, we can project power to the European powers while also strengthening the possibility of an ideological ally securing an important state."
 ITA_reform_training_system:0 "Reform Training System"
 ITA_reform_training_system_desc:0 "With Baistrocchi let go, we can begin some new reforms to army training procedures. Field Marshal Badoglio supports new approaches which will help save time at the boot camp while keeping the troops ready for combat."
 ITA_div_org_reform:0 "Restructure Divisions"
 ITA_div_org_reform_desc:0 "Divisional formations and templates are some of the most important factors to success in combat. By reforming our current templates, the general staff can devise the most optimal ones to utilize in land warfare."
 ITA_more_divisions:0 "Increase Division Sizes"
 ITA_more_divisions_desc:0 "Our nation is one of patriots. With many citizens signing up to the army as foot soldiers, it is only natural that we consider to include their participation in the army's divisions."
 ITA_officers_reform_badoglio:0 "Amend the Officers Reform"
 ITA_officers_reform_badoglio_desc:0 "Baistrocchi's replacement General Pariani's vision for a new officer's corps entails an amendment to the previously implemented reform, one which aims to keep senior officers in the force while making it harder for young officers to replace them."
 ITA_extend_the_alpine_wall:0 "Extend the Alpine Wall"
 ITA_extend_the_alpine_wall_desc:0 "The Alpine Wall is an ambitious project which spans our borders with Yugoslavia, Austria, Switzerland and France that aims to secure our borders in events of invasion. Having started it's construction in 1931, the Wall is still far from being finished and further labor needs to be performed in order to fully realize it's potential." 
 ITA_tank_research:0 "Further Tank Research Effort"
 ITA_tank_research_desc:0 "With the emergence of the mobile warfare doctrine, mobility has gained a lot of prominence on the battlefields. We need to be able to keep up to trend and push for further advances in armored R&D."
 ITA_corazzate_brigade:0 "Create the Brigate Corazzate"
 ITA_corazzate_brigade_desc:0 "The Brigate Corazzate, an armored brigade, will be assembled in a bid to further motorize our mostly infantry-based army."
 ITA_switch_to_medium_tanks:0 "Investigate Medium Tank Designs"
 ITA_switch_to_medium_tanks_desc:0 "Developments in tank technology have enabled the proliferation of medium tank models, models which are intended as a compromise of mobility and armament. Considering the capability of the Italian industry, we can easily afford to begin producing these models to be later introduced to the army."
 ITA_SIM:0 "Reorganize the SIM"
 ITA_SIM_desc:0 "The Italian Military Information Service, or the SIM, is our military's intelligence organization but it does suffer in comparison to the fabled intelligence services of the other great powers. By expanding the SIM's operations, we can hope to increase it's efficiency and have it compete with foreign agencies."
 
