 ITA_vallo_alpino_del_littoro: "Vallo Alpino del Littoro"
 ITA_vallo_alpino_occ: "Vallo Alpino Occidentale"
 ITA_vallo_alpino_occ_desc: "The Vallo alpino occidentale (Occidental Alpine Wall) is a large and varied system of fortifications to defend the sector of Italian territory bordering France. It is part of the Vallo Alpino del Littorio (Alpine Wall of the Littorio), a system of fortification lines encompassing the entire Alpine arc; starting from Ventimiglia (Liguria) and reaching to Fiume. The building of such a defensive system began in 1931, to defend the Italian land borders from a possible French attack of the national territory, to create a formidable network of barrages in all valleys that could be attacked by infantry and armored vehicles."
 vallo_alpino_occ_tt: "Builds a line of fortifications along the Western Alpine border with §YFrance§!. Each phase of construction adds §Y1§! §Glevel§! to the forts in the line. Current phase: §C[?val_occ_c]§!."
 ITA_vallo_alpino_alto_adige: "Vallo Alpino Settentrionale-Alto Adige"
 ITA_extend_vallo_alpino_alto_adige: "Extend the Vallo Alpino in Alto Adige"
 ITA_extend_vallo_alpino_alto_adige_desc: "After the German annexation of Austria and the German interest in South Tirol, Mussolini is distrustful of Germany and [GER.GetLeader]. Fearing the possibility of a German invasion Mussolini has given the order to massively fortify Italy's border with Germany, with the expansion of the Littorio Alpine Wall in South Tyrol. The section has already been nicknamed as the 'Linea non mi fido' (Line I don't trust) by the people of the areas affected by the works, an ironic reference to the Linea Sigfrido (Siegfried Line)."
 vallo_alpino_adige_tt: "Builds a line of fortifications along the Northern Alpine border with §YTyrol§!."
 vallo_alpino_adige_expand_tt: "We will fortify the Alpine Wall in §YAlto Adige§! with §G2§! more levels of fortifications!"
 ITA_vallo_alpino_ori: "Vallo Alpino Orientale"
 ITA_vallo_alpino_ori_desc: "The Vallo Alpino Orientale (Oriental Alpine Wall) is the eastern part of the Vallo Alpino del Littoro. Its purpose is to defend the sector of Italian territory bordering Yugoslavia and part of Austria."
 vallo_alpino_ori_tt: "Builds a line of fortifications along the Eastern Alpine border with §Y[838.owner.GetNonIdeologyName]§!. Each phase of construction adds §Y1§! §Glevel§! to the forts in the line. Current phase: §C[?val_ori_c]§!."
