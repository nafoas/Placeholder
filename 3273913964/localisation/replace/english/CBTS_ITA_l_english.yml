 ITA_colonial_policy_libya:0 "Italian North Africa"
 ITA_colonial_policy_libya_desc:0 "Italy gained its' North African colony in 1911 following an invasion in the Italo-Turkish War. Since its' creation the colony has faced near-constant insurgency from the native population, primarily led by tribesmen associated with the Islamic 'Senussi Order', culminating in a death toll in the hundreds of thousands and mass internment of many more.\n Since the defeat of the rebels in 1932 stability has begun to return and many Italians are migrating to colonise the lands of it's "Fourth Shore", however care must be taken to reconcile the alienated Muslim population, or else run the risk of igniting war in this fractured land yet again...\n Currently the colony is [Root.ITA_Libya_Stability] ([?ITA_lba_stability]% Stability).\n\n§RIf the colony's stability falls too low a revolt might break out against our rule.§!"
