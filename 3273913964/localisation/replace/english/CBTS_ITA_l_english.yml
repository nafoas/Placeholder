 ### Foci ###
 
 ITA_control_confindustria:0 "Control Confindustria"
 ITA_control_confindustria_desc:0 "He who controls Confindustria, controls labor in Italy. This large organization encompassing wide bodies of Italian companies can be brought under our heel if we were pressure them into allying with the fascist party." 
 ITA_found_the_IRI:0 "Found the IRI"
 ITA_found_the_IRI_desc:0 "We will move to form the Istituto per la Ricostruzione Industriale or IRI for short, which will help us exert a large amount of control over the economy via restructuring, financing and indirect nationalisation."
 ITA_new_labour_legislation:0 "New Labour Legislation"
 ITA_new_labour_legislation_desc:0 "Mussolini's vision for labour in Italy owes it's existence to Italian syndicalism and the resulting ideology of corporatism. His vision must be supported by making it mandatory for all workers to enroll in government controlled unions and syndicates."
 ITA_found_the_INAIL:0 "Found the INFAIL"
 ITA_found_the_INAIL_desc:0 "We will establish the National Fascist Institute for Insurance against Workplace Accidents (INFAIL) by a decree that combines the National Fund for Accidents and the Private Funds of Insurance into one. This merger will expand insurance opportunities to a wide variety of labor categories while also making insurance mandatory, thereby improving worker conditions." 
 ITA_found_the_INPS:0 "Found the INFPS"
 ITA_found_the_INPS_desc:0 "In tandem with our state's labour-policies, we will reform the National Fund of Social Security for Disability and Old Age of the Workers into the National Fascist Institute of Social Security while keeping the aim the same: guaranteeing old-age pensions for Italians."
 ITA_expand_the_EIAR:0 "Expand the EIAR"
 ITA_expand_the_EIAR_desc:0 "The EIAR, our nation's sole public broadcaster, will be further developed and it's content enlargened to expand it's influence and reach."
 ITA_fund_the_INA:0 "Fund the INA"
 ITA_fund_the_INA_desc:0 "The National Insurance Institute, or the INA, traces it's history to pre-WW1 Italy. Founded as a public outlet for insurance, it later merged with another company of the same vein called Assitalia and thus became one of the most important insurance companies in Italy. We must increase it's funding to expand it's operational capacity."
 ITA_expand_the_OMNI:0 "Expand the OMNI"
 ITA_expand_the_OMNI_desc:0 "Created in 1925, the National Organization of Maternity and Infancy, or the OMNI, is the primary governmental body that deals with child welfare. The OMNI's aim is to expand healthcare to children and to also support mothers and mothership candidates. In conjunction with the Battle for Births, the OMNI's operations must be emboldened."
 ITA_save_the_banks:0 "Save the Banks"
 ITA_save_the_banks_desc:0 "Hit hard by the Great Depression, some of our important banks have gone under. Our previous attempts to support them financially, while successful, have not been nearly enough to ensure their efficiency. Via the IRI, we will seek to restructure banks to place them firmly under state control."
 ITA_emit_industrial_obligations:0 "Issue Industrial Bonds"
 ITA_emit_industrial_obligations_desc:0 "Italy's industry must be self-sufficient. To this end, we will issue industrial bonds for innovative and ambitious investors to help them help their nation."
 ITA_intervene_in_the_military_sector:0 "Intervene in the Military Sector"
 ITA_intervene_in_the_military_sector_desc:0 "In an era where disarmament is being increasingly questioned, the Italian state must take matters into it's own hand and ensure that military production continues as it should, like a clock."
 ITA_intervene_in_the_civilian_sector:0 "Intervene in the Civilian Sector"
 ITA_intervene_in_the_civilian_sector_desc:0 "The fascist doctrine is one that takes Keynesian economics into heart and thus favours an increase in the funds diverted towards the public sector. This increase will help us better combat the stagnating effects of the Great Depression and lessen economic inequality between our citizens."
 ITA_refund_the_bank_of_italy:0 "Refund the Bank of Italy"
 ITA_refund_the_bank_of_italy_desc:0 "As a consequence of the state's bank bail-out policy, the Bank of Italy has inherited highly-illiquid assets thus crippling it's ability to conduct financial business. By using the IRI, we will provide financing to the Bank of Italy to ensure that the latter continues it's bail-outs."
 ITA_cement_the_institute:0 "Cement the IRI"
 ITA_cement_the_institute_desc:0 "The re-organisation of the economy on the fascistic-corporatist line would not have been possible without the IRI. By further exercising control over remaining industries and independent banks, we will entrench the IRI's, thus the state's, hold over the Italian economy."
 ITA_create_the_STET:0 "Create the STET"
 ITA_create_the_STET_desc:0 "STET or the Telephonic Financial Company is to be commissioned as a company under the IRI, and will be assigned the duty of maintaining, checking and improving the state's communications as well as all public communications in our nation." 
 ITA_create_the_finmare:0 "Create the Finmare"
 ITA_create_the_finmare_desc:0 "Another project of the IRI, the Finmare will be tasked with inspecting incoming shipment and all aspects of naval trade. As our nation's shipping lines grow, so will the operations of the Finmare."
 ITA_create_the_finsider:0 "Create the Finsider"
 ITA_create_the_finsider_desc:0 "The Finsider Steel Corporation is to be created as the primary hand of the Italian state over the steel industry. Constituted under the IRI, the Finsider will oversee steel production and seek to discover methods of maximizing gain and profit."
 ITA_finish_the_direttissima:0 "Finish the Direttissima"
 ITA_finish_the_direttissima_desc:0 "A miracle of Italian ingenuity, the Bologna-Florence railyway, or the \"direttissima\", will be inaugurated. This ambitious project which connects the two cities is one of the most advanced in Italy with significant improvements like decreased slope, reduced ascent and descent and modern features like large-radius curves with good transitions."
 ITA_monumental_projects:0 "Monumental Projects"
 ITA_monumental_projects_desc:0 "An Italian renewal worthy of the Romans, which we have been accomplishing with our economic feats, needs to be topped with the cherries of new, grandoise constructions. The ever-romantic Mussolini has some certain projects that he would like to see realized like the Torrione INA which was built last year: constructions that the likes of Europe and the world have not yet ever witnessed."
 ITA_drain_the_pontine_marshes:0 "Drain the Pontine Marshes"
 ITA_drain_the_pontine_marshes_desc:0 "Within the scope of the Battle for Land, we will continue the well-documented policy tradition of draining the Pontine Marshes with the stated aim of land reclamation."
 ITA_promote_architectural_rationalism:0 "Promote Architectural Rationalism"
 ITA_promote_architectural_rationalism_desc:0 "Support for Gruppo 7, the seven young architects of rationalism, should be provided pronto. This new movement emphasises a marriage of the past and the future, of classicism and futurism, when it comes to architecture. Italy's architecture should be one that is observably beautiful and scientific at the same time, with perfect shapes and calculations as it's backbone." 
 
 
 
 
 
 
 
 ####### ####### ####### OLD ####### ####### ####### ####### ####### ####### ####### ####### ####### ####### ####### OLD  ####### ####### #######
 ITA_foreign_ventures:0 "Continue Foreign Policy Ventures"
 ITA_foreign_ventures_desc:0 "Our geopolitical location and flexible foreign policy grant us a plethora of directions we could take when it comes to our position in the world stage."
 ITA_four_power:0 "Four-Power Pact"
 ITA_four_power_desc:0 "Mussolini's new proposal of a treaty of peace and security in Europe emphasises the role of the four European powers (Italy, Germany, the UK, France) in maintaining diplomatic balance and lasting peace while also sidelining smaller nations. The proposed treaty has seen support, and will serve as a step in diplomatic proximity if signed."
 ITA_sarra:0 "Request the Sarra Triangle"
 ITA_sarra_desc:0 "Dating back to the Ottoman occupation, the dispute between Libya and Sudan on the Sarra Triangle continues between ourselves and the United Kingdom. We have expanded that demand to also include an adjacent strip of land in the Sudan and this puts us at odds with the British. By softening our demands, we are likely to achieve a diplomatic victory and slightly more amicable ties with the UK."
 ITA_form_stresa:0 "Form the Stresa Front"
 ITA_form_stresa_desc:0 "The new German government's expansionist agenda is at odds with what we have settled in the Four-Power Pact and the older Locarno treaties. We must sponsor a meeting of delegations of the three powers to form a front that will deter the Germans from further re-arming and threatening peace in Europe."
 ITA_franco_italian:0 "Franco-Italian Agreement"
 ITA_franco_italian_desc:0 "The French foreign ministry's plan of weaving a web of alliances to contain the new Germany presents unique opportunities in expanding our colonial holdings while also securing warmer relations and support against Germany's potential aggression."
 ITA_tour_de_france:0 "Tour of the West"
 ITA_tour_de_france_desc:0 "For the strengthening of Italian presence in world affairs, we must ensure that we have cordial relations with the British and the French. Mussolini has proposed that friendship treaties be pitched to the both powers to strengthen cooperation."
 ITA_american_friends:0 "American Friendship"
 ITA_american_friends_desc:0 "The USA's isolationist foreign policy and non-participance in the League of Nations makes them a non-power in European affairs, but closer Italo-American relations could give us a stronger hand in diplomacy and internationalise our ideology."
 ITA_strength_at_home:0 "Strength at Home"
 ITA_strength_at_home_desc:0 "Those who are not respected at home will not be respected abroad. Demonstration of domestic strength and stability is something that the British and the French cannot afford." 
 ITA_tour_de_turk:0 "Approach Turkey"
 ITA_tour_de_turk_desc:0 "Mussolini has a great deal of respect for the founder of the Turkish Republic, Mustafa Kemal Ataturk, labeling him an ideological \"teacher\". Considering the similarity of our two regimes and the Turks' privileged geopolitical location, striving for stronger relations is profitable as well as feasible."
 ITA_rome_protocol:0 "Initiate the Rome Protocols"
 ITA_rome_protocol_desc:0 "We will call upon the delegations of Hungary and Austria with the purpose of deepening cooperation via a string of protocols called the Rome Protocols. These protocols will help us better counter-act the new revisionist Germany and the Yugoslavian state, and will also enhance mutual economic cooperation."
 ITA_war_with_ethiopia:0 "The Wal Wal Incident"
 ITA_war_with_ethiopia_desc:0 "Today, our fort in the Wal Wal oasis in Ethiopia was threatened by a large gathering of Ethiopian troops who demanded that our soldiers surrender the construction. The historically-tense Italo-Ethiopian relations now hang by a thread..."
 ITA_hoare_laval:0 "Accept Hoare-Laval Borders"
 ITA_hoare_laval_desc:0 "The highly-controversial Hoare-Laval pact presents an opportunity for us to do away with an important part of Ethiopia with minimal casualties. Taking the West up in their offer for peace might be the best long-term strategy."
 ITA_peace_in_our_time:0 "Peace in Our Time"
 ITA_peace_in_our_time_desc:0 "Bearing in mind the fact that what caused the incident in the first place was an illegaly-built Italian fort, issuing an apology and ending the tensions before they boil into war is the best course of action. The fascist ideology is not aggressively exploitative as the one of the British and the French."
 ITA_ethiopia_guaranteed_conflict:0 "Invasion of Ethiopia"
 ITA_ethiopia_guaranteed_conflict_desc:0 "Italy's interests are not to be threatened by roadblocks in our way. Ethiopia humiliated us in 1896 and the Entente followed suit in 1918. We cannot allow history to repeat itself."
 ITA_reconsider_foreign_policy:0 "Reconsider Foreign Alignment"
 ITA_reconsider_foreign_policy_desc:0 "With the Ethiopian situation taken care of, we must move to define a clear foreign policy for a new era for Italy."
 ITA_allied_flirtation:0 "Flirtation With the Allies"
 ITA_allied_flirtation_desc:0 "Our previous affairs with the Allies have made it clear that as long as there is another potential diplomatic danger, we will be able to get away with most of what we have in our agenda. A little bit of leading on never hurt anyone."
 ITA_statesman_reputation:0 "Foster Statesmanly Reputation"
 ITA_statesman_reputation_desc:0 "A natural orator and a diplomat, Mussolini's charisma and talent for politics can help to rebrand Italy as a country that the Allies could rely on."
 ITA_attract_western_industry:0 "Attract Western Business"
 ITA_attract_western_industry_desc:0 "It would not be a sign of weakness to admit that the Western Allies have a prowess for innovation and business. It would also not be a sign of weakness if we were to create incentives for Western businesses to establish economic ties with Italy." 
 ITA_joint_naval_exercises:0 "Joint Naval Exercises"
 ITA_joint_naval_exercises_desc:0 "Though none would like to admit it, the Royal Navy is a navy that hardly any power in the world can contend with. We can learn a lot from hosting joint exercises with the British and thus empowering the Regia Marina."
 ITA_formalise_rome_protocol:0 "Formalise Rome Protocols"
 ITA_formalise_rome_protocol_desc:0 "Initially conceived as mere treaties to strengthen cooperation between the Italian, Hungarian and Austrian states, the Rome Protocols should be formalised into a proper defense faction, intended to aggressively wage action for what we are owed."
 ITA_form_axis:0 "Form the Rome-Berlin Axis"
 ITA_form_axis_desc:0 "While many might find the idea reprehensive, cooperation with the new Germany is the only real chance we have at redefining the balance of powers not just in Europe, but in the worldwide stage."
 ITA_protect_austria:0 "Protect Austria"
 ITA_protect_austria_desc:0 "The new German regime's overt interest in Austria cannot be allowed into fruition. We must cooperate with the Austrian regime to guard their independence, thereby ensuring closer ties and a stronger execution of the Rome Protocols." 
 ITA_racial_discrimination:0 "Institute Racial Discrimination"
 ITA_racial_discrimination_desc:0 "We are as influenced by Germany as Germany is influenced by us. Paying heed to German racial theories can help bolster our ties to the Axis." 
 ITA_annex_albania:0 "Annex Albania"
 ITA_annex_albania_desc:0 "Due to their intense economic ties to our nation and the sheer amount of control we have over their banking sector and their army, Albania is as independent as our word allows. We should formalise this by launching an operation to make them into our protectorate, one without a sliver of independence. This is a necessary step in dominating the Mediterranean and countering Yugoslavia."
 ITA_dismantle_yugoslavia:0 "Dismantle Yugoslavia"
 ITA_dismantle_yugoslavia_desc:0 "The state of Yugoslavia was created out of thin air by the Entente in the Paris Peace Negotiations. This union of southern Slavs brazenly infringes on our land claims which were unfairly gifted to them. We must take action to dismantle this union and take back what is ours."
 ITA_align_bulgaria:0 "Align Bulgaria"
 ITA_align_bulgaria_desc:0 "Being sharers of the same fate in being robbed of our land and humiliated before the world, an Italo-Bulgarian alliance could create an effective force in dealing with Yugoslavia."
 ITA_reconcile_greece:0 "Reconcile Greece"
 ITA_reconcile_greece_desc:0 "The Greek government, which harbors a long-felt emnity to the British, appears as a natural ally in the fight against Western imperialism. Instead of weakening ties, we must reconcile them and bring them into our sphere."
 ITA_greek_ultimatum:0 "Greek Ultimatum"
 ITA_greek_ultimatum_desc:0 "Mussolini's vision of a new Roman imperium sees the Greek state as a threat. Italy, the destiny of which is to dominate the Mediterranean Sea, must swiftly take care of the Greek government and bring them into the fold."
 ITA_coerce_turkey:0 "Coerce Turkey"
 ITA_coerce_turkey_desc:0 "Recent developments in Turkey cast a certain shadow of a doubt over the future of the Turkish Republic. Still not able to fully shake off the economic fallout caused by the world situation at large and still under the shellshock of the independence war, an attempt to coax the Turks might not be so outlandish of an idea."
