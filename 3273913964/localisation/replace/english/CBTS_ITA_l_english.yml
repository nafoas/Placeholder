 italy_internal.19.a: "Ok"

 ita_flavour.1.t: "SS Rex Captures the Blue Riband!"
 ita_flavour.1.desc.ita: "Triumphant news from New York! Our greatest ocean liner - the Italian Line's SS Rex - just broke the record! Its transatlantic crossing took only a stunning 4 days, 13 hours and 58 minutes, taking the Blue Riband from the German ship SS Bremen!\n\nLast year in an act of Italian unity the Navigazione Generale Italiana from Genoa, the Lloyd Sabaudo from Turin and Cosulich STN from Trieste merged with Il Duce's support into the Italian Line to be able to compete with other shipping lines in the world. To achieve its goal of projecting the might of our regime to the world the Italian Line commissioned SS Rex and its running mate Conte di Savoia.\n\nRex was christened in the presence of His Majesty King Emmanuel III and Her Majesty Queen Elena on August 1, 1931. Two years later in the 14th year of Era Fascista it is the fastest ocean liner in existence by almost full 3 hours!"
 ita_flavour.1.desc.ger: "The Italian ocean liner - the Italian Line's SS Rex - just broke the record. Its transatlantic crossing took 4 days, 13 hours and 58 minutes, taking the Blue Riband from our SS Bremen!\n\nLast year the Navigazione Generale Italiana from Genoa, the Lloyd Sabaudo from Turin and Cosulich STN from Trieste merged with Premier Mussolini’s support into the Italian Line. The merger allowed for the completion of sister ships SS Rex and Conte di Savoia.\nThe Italian achievement will mean nothing in the face of adversity! Let us not forget Germany has held the Blue Ribbon for 4 years since 1929 ever since SS Bremen broke the record, which was then broken by its own sistership SS Europa in 1930! Not to mention SS Bremen broke the record for the second time earlier this year on July 2.\n\nIt is clear with such a history Germany will soon again be the holder of the Blue Riband!"
 ita_flavour.1.ita: "Eja, eja, alalà! I mari sono nostri!"
 ita_flavour.1.ger: "Congratulations to the Italians"

 ita_flavour.2.t: "SS Normandie Captures the Blue Riband!"
 ita_flavour.2.desc.ita: "The French have ripped the Blue Riband out of our hands with their latest ship SS Normandie. It is the first time France ever captured the Blue Riband. Our fatherland managed to hold onto it for 2 years! SS Normandie of the Compagnie Générale Transatlantique made the transatlantic voyage in 4 days, 3 hours and 2 minutes.\nWith the continued successes of the Italian Line Il Duce will soon take the rightful record back from the French and hand it to the Italian people!"
 ita_flavour.2.desc.fra: "For the first time ever France captures the Blue Riband! The previous holder was SS Rex. She captured it in 1933 from the Germans and it is finally time for us to hold on to it for a little while! SS Normandie of the Compagnie Générale Transatlantique made the transatlantic voyage in just 4 days, 3 hours and 2 minutes, breaking the Italian record by 10 hours!\nIt looks like the victory of the fascists was short-lived."
 ita_flavour.2.ita: "Me ne frego!"
 ita_flavour.2.fra: "Ce n'est pas la mer à boire"
 
 NAME_LITTORIO_CLASS: "Littorio Class Names"
 
 
 ### Ideas ###
 
 king_soldier:0 "Soldier King"
 king_soldier_desc:0 "Victor Emmanuel the Third is seen as a fierce leader who has bravely led his country to victory in the First World War. In spite of the \"multilated victory\", the King ominously resides over the country and reminds his subjects of Italian bravery in military engagements."
 inexperienced_king:0 "Inexperienced Monarch" #TODO: add description of trait Inexperienced Monarch from vanilla
 eager_commander_cbts: "Eager Commander"

 ITA_grande_depressione:0 "Leftovers of the Great Depression"
 ITA_grande_depressione_desc:0 "Responsible for worldwide destitution and social hardship, the Great Depression still has profound effects on our economy. We must work extensively to remove these ripples and the damage they are causing."
 ITA_grande_depressione_2:0 "Leftovers of the Great Depression"
 ITA_grande_depressione_2_desc:0 "Our initial efforts have paid off and we are on the track to recovery."
 ITA_grande_depressione_3:0 "Leftovers of the Great Depression"
 ITA_grande_depressione_3_desc:0 "The IRI and the buyouts it has undertaken have helped us narrowly avoid total financial collapse and recovery is coming along surely."
 ITA_grande_depressione_4:0 "Leftovers of the Great Depression"
 ITA_grande_depressione_4_desc:0 "Involving the state's hand in defusing the chaos created by the Great Depression has greatly relaxed our woes and we have managed to eradicate major marks off of our economy."
 ITA_sluggish_economy:0 "Sluggish Economy"
 ITA_sluggish_economy_desc:0 "This spirit and the relevant focus tree are not implemented as of the initial beta release."
 ITA_finmare_idea:0 "Established the Finmare"
 ITA_finmare_idea_desc:0 "The establishment of the Finmare has emboldened the shipyard industry by increasing the demand for convoy-escorting and coastal defense ships."
 ITA_finsider_idea:0 "Established the Finsider"
 ITA_finsider_idea_desc:0 "With the Finsider working in full capacity, we can expect to better manage the steel industry via the IRI and divert production to where it is most needed."
 ITA_trusting_biplanes:0 "Airforce Complacency"
 ITA_trusting_biplanes_desc:0 "To go against biplanes is foolish, considering their decent track record. Instead, production is currently being encouraged to increase biplane prevalence in the aerial forces."
 ITA_forceful_production:0 "Air Modernisation at All Costs"
 ITA_forceful_production_desc:0 "Biplane hegemony in our aerial forces must be combatted to make way for meaningful reforms that are sure to produce better results in the battlefields."
 ITA_program_r_idea:0 "Program R"
 ITA_program_r_idea_desc:0 "The plan to conduct R&D with the aim of modernizing the Italian air fleet has begun to be implemented thoroughly."
 ITA_expanded_INA:0 "Expanded the National Insurance Institute"
 ITA_expanded_INA_desc:0 "Improvements to labor-friendly laws have strengthened our popularity while conversely damaging construction productivity."
 ITA_OMNI_expansion:0 "OMNI Expansion"
 ITA_regia_aeronautica: "Regia Aeronautica"
 ITA_regia_marina: "Regia Marina"
 ITA_regia_marina_desc: "TODO"
 ITA_OMNI_expansion_desc:0 "Increased funding for OMNI has incentivized new births and thus a foreseeable increase in monthly population."
 ITA_modernize_old_ships_idea:0 "Modernizing Older Battleships"
 ITA_modernize_old_ships_idea_desc:0 "Technological modernization is underway for older models of the battleship."
 ITA_keep_defensive_navy_idea:0 "A Defensive Naval Approach"
 ITA_keep_defensive_navy_idea_desc:0 "While our navy is a force to be reckoned with, we must still be wary of our operations lest we want to risk high casualties and damage."
 ITA_push_for_mare_nostrum_idea:0 "Re-instating Mare Nostrum"
 ITA_push_for_mare_nostrum_idea_desc:0 "Our reformed navy is one to challenge the French and the British at the high seas. \"Mare Nostrum\" belongs to Italy and Italy only."
 ITA_racist_discrimination:0 "Instituted Racial Policies"
 ITA_racist_discrimination_desc:0 "German pressure has made racialism popular and the government has started adopting it as state policy."
 ITA_statesman_mussolini:0 "Statesman Mussolini"
 ITA_statesman_mussolini_desc:0 "A natural orator, Mussolini can look like the leader that the Allies want him to be without actually becoming that leader."
 ITA_increase_army_spending_idea:0 "Increased Army Spending"
 ITA_increase_army_spending_idea_desc:0 "Newly instituted funds for the army will help boost along doctrinal R&D."
 ITA_increase_industrial_production_idea:0 "Strengthening the Military-Industrial Complex"
 ITA_increase_industrial_production_idea_desc:0 "Gathering support for military investments from businessmen and their corporations will provide a much-needed industrial boost to army production lines."
 ITA_reform_logistics_idea:0 "Improved Army Logistics"
 ITA_reform_logistics_idea_desc:0 "New technologies have made it possible to support the army's complex logistical needs more efficiently, ensuring readiness and organizational preparedness in combat."
 ITA_reform_logistics_idea_2:0 "Reformed Army Logistics"
 ITA_reform_logistics_idea_2_desc:0 "Badoglio's reforms to military curriculums and boot camp practices have greatly improved army education, thus guaranteeing fresher graduates in a shorter amount of time than before."
 ITA_div_org_reform_idea:0 "Divisional Template Reform"
 ITA_div_org_reform_idea_desc:0 "Changes overseen by Bodaglio should help better organize the divisions and procure templates more suitable for the vast possibilities of land warfare."
 ITA_disorganized_staff:0 "Disorganized Staff"
 ITA_disorganized_staff_desc:0 "The Italian army staff has certainly seen better days. To start off, there is next to no liaison formations. All branches seemingly act as their own heart commands in an unnecessary bid to stay independent. Moreover, clique rivalry has cost the chief of staff Pietro Badoglio most of his powers, and he is currently only able to exercise a sliver of what he used to in the previous years. The final nail in the coffin comes with lack of doctrinal innovation across the board. If Italy is to stand a proper fighting chance in the future, we must treat these ailments as efficiently as possible."
 ITA_disorganized_staff_2:0 "Disorganized Staff"
 ITA_disorganized_staff_2_desc:0 "With the 3 Year Army Plan in effect, the chief of staff is gaining a bit of momentum in regards to doctrinal reformations and older, stone-headed methods are being replaced with more contemporary ones."
 ITA_disorganized_staff_3:0 "Disorganized Staff"
 ITA_disorganized_staff_3_desc:0 "New reforms by Baistrocchi's high command have greatly eliminated incompetence and reduced career officers who were only awarded for their loyalty and not their talent."
 ITA_disorganized_staff_4:0 "Politicised Staff"
 ITA_disorganized_staff_4_desc:0 "As we wave goodbye and utter good riddance after Badoglio, clique competition has started dissipating as it is only a matter of time before Badoglio's goons are assimiliated into the general staff."
 ITA_disorganized_staff_badoglio:0 "Badoglio's Reform"
 ITA_disorganized_staff_badoglio_desc:0 "Baistrocchi's main mistake was refusing to compensate for the loyalty of the senior officers in the army. Badoglio's has amended this state of affairs, decreasing the rate of replacement of older officers. This should help improve our planning capabilities as rank mobility has gone down significantly."
 ITA_bombing_campaign_idea:0 "Bombing Campaign in Ethiopia"
 ITA_bombing_campaign_idea_ETH:0 "Italian Bombing"
 ITA_mass_reform_bado:0 "Badoglio's Reform"
 ITA_mass_reform_bado_desc:0 "Chief of Staff Badoglio's reforms to the high command have started taking hold and we are currently suffering from purges to the officer corps. When the reforms are fully implemented, we shall hope to normalize army affairs with more confidence than before, underlining Italian army prowess with more ability in the world scene."
 ITA_mass_reform_bais:0 "Baistrocchi's Purge"
 ITA_mass_reform_bais_desc:0 "Promoting a series of purges against the older, nonchalant career officers; Chief of Staff Baistrocchi hopes to revitalize the officer corps with fresh, younger blood, thus strengthening Italy's standing as a military power worldwide."
