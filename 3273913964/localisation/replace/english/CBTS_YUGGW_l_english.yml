  YUG_ygw_mnt_desc:0 "A guerilla war is going on in Montenegro. There are three groups involved in the conflict. The §GGreens§!, led by §YKrsto Popović§!, are Montenegrin nationalists, fighting \"for the Right, Honour and Freedom of Montenegro\". They are opposed by the §LWhites§!, led by §YPavle Đurišić§!. They are aligned with the §LChetniks§!, and their goal is to establish Montenegro as a part of Serbia. Another armed group are the §RReds§!. They represent the International and the §RPartisans§! and are led by §YMilovan Đilas§!. The §RReds§! see the conflict as a class war, claiming to protect the working class and striving to defeat the oppressors.\n\nInfluence of each group is determined by their §Ypower§! and §Ypopularity§!. If one of those variables reaches §Y80§!, while the other one is at least §Y50§!, this group will be dominant.\n\n§GGreens§! §Ypopularity§! equals §Y[?ygw_mnt_g_pop]%§!\n§GGreens§! §Ypower§! equals §Y[?ygw_mnt_g_pow]%§!\n§LWhites§! §Ypopularity§! equals §Y[?ygw_mnt_w_pop]%§!\n§LWhites§! §Ypower§! equals §Y[?ygw_mnt_w_pow]%§!\n§RReds§! §Ypopularity§! equals §Y[?ygw_mnt_r_pop]%§!\n§RReds§! §Ypower§! equals §Y[?ygw_mnt_r_pow]%§!\n\nIn this conflict we support [ygw_mnt_support]."
