  # Macedonia
  YUG_ygw_mac:0 "Guerilla War in Macedonia"
  YUG_ygw_mac_desc:0 "A guerilla war is going on in Macedonia. There are three groups involved in the conflict. §OMacedonians§!, led by [ygw_mac_nat_leader], are Macedonian nationalists, fighting for liberation of Macedonia from Serb rule. They are opposed by §LChetniks§!, led by §YStojan Krstić§!. Their goal is to protect Serb rule over North Macedonia. Another armed group are §RPartisans§!. They represent the International and are led by §YMetodi Shatorov§!. §RPartisans§! see the conflict as a class war, claiming to protect the working class and striving to defeat the oppressors.\n\nInfluence of each group is determined by their §Ypower§! and §Ypopularity§!. If one of those variables reaches §Y80§!, while the other one is at least §Y50§!, this group will be dominant.\n\n§OMacedonian§! §Ypopularity§! equals §Y[?ygw_mac_m_pop]%§!\n§OMacedonian§! §Ypower§! equals §Y[?ygw_mac_m_pow]%§!\n§LChetnik§! §Ypopularity§! equals §Y[?ygw_mac_s_pop]%§!\n§LChetnik§! §Ypower§! equals §Y[?ygw_mac_s_pow]%§!\n§RPartisan§! §Ypopularity§! equals §Y[?ygw_mac_p_pop]%§!\n§RPartisan§! §Ypower§! equals §Y[?ygw_mac_p_pow]%§!\n\nIn this conflict we support [ygw_mac_support]."
