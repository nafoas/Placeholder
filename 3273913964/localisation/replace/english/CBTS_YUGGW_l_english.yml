  # Bosnia
  YUG_ygw_bos:0 "Guerilla War in Bosnia"
  YUG_ygw_bos_desc:0 "A guerilla war is going on in Bosnia. There are four groups involved in the conflict. §GMuslims§!, led by [ygw_bos_nat_leader], are one of the major ethno-confessional groups of Bosnia, fighting for their religion and traditions. They are opposed by §LSerbs§!, led by §YDobroslav Jevđević§!. There is a long standing mutual animosity between §GMuslims§! and §LSerbs§!, which results in horrible atrocities they commit against each other. §CCroats§! are the third largest group in Bosnia, however, many Muslims fight for the Croat cause too. They are led by §YSlavko Kvaternik§!. Another armed group are §RPartisans§!. They are led by §YVojislav Kecmanović§!, and their goal is to turn the ethnic war into a class war, and to establish peace between workers of all nations.\n\nInfluence of each group is determined by their §Ypower§! and §Ypopularity§!. If one of those variables reaches §Y80§!, while the other one is at least §Y50§!, this group will be dominant.\n\n§GMuslim§! §Ypopularity§! equals §Y[?ygw_bos_m_pop]%§!\n§GMuslim§! §Ypower§! equals §Y[?ygw_bos_m_pow]%§!\n§LSerb§! §Ypopularity§! equals §Y[?ygw_bos_s_pop]%§!\n§LSerb§! §Ypower§! equals §Y[?ygw_bos_s_pow]%§!\n§CCroat§! §Ypopularity§! equals §Y[?ygw_bos_c_pop]%§!\n§CCroat§! §Ypower§! equals §Y[?ygw_bos_c_pow]%§!\n§RPartisan§! §Ypopularity§! equals §Y[?ygw_bos_p_pop]%§!\n§RPartisan§! §Ypower§! equals §Y[?ygw_bos_p_pow]%§!\n\nIn this conflict we support [ygw_bos_support]."
