l_english:

# EVENTS
  ## Montenegro
  ygw_montenegro.1.t:0 "Dissent in Montenegro"
  ygw_montenegro.1.d:0 "The Montenegrin Federalist party has been in power in Montenegro for a while already. They are successors of the Greens - a group of paramilitaries, who organised a rebellion in 1919 to restore Montenegrin independence. The rebellion lasted until 1929 and resulted in hundreds of casualties. The wounds in Montenegro haven't healed yet, and the situation is worsened by tribal nature of Montenegrin society. A number of Montenegrin tribes is discontent with the Green rule, and ready to take up arms once more."
  ygw_montenegro.1.a:0 "We should watch the situation carefully."
  ygw_montenegro.2.t:0 "Insurgence in Montenegro!"
  ygw_montenegro.2.d:0 "Montenegro has witnessed an armed rebellion against the Greens. A few dozens of insurgents have captured the town of Mojkovac in the north. The next day a border guard batallion was ambushed near Rijeka Crnojevića, and Cetinje was besieged by the rebels. It took them 8 hours to capture the town. The war is going on, and victims count is in hundreds. At this moment, we don't know who leads the insurgency, and what its ultimate goals are."
  ygw_montenegro.2.a:0 "The order must be restored!"
  ygw_montenegro.3.t:0 "Montenegrin Rebellion Continues"
  ygw_montenegro.3.d:0 "The rebellion grows. Although we have managed to recapture Cetinje, the countryside is out of control. In fact, Cetinje is one of our last strongholds (others being Pljevlja, Nikšić and Podgorica). However, now we get to know who we fight against. The rebellion was started and organized by the Communist Party of Yugoslavia, represented by Milovan Đilas. They are calling themselves \"Partisans\" and rely on aid from the International."
  ygw_montenegro.3.a:0 "Now we know who's behind them."
  ygw_montenegro.4.t:0 "Leftist Errors"
  ygw_montenegro.4.d:0 "Lands of Montenegro under Partisan rule suffer in pain. Đilas and his thugs burn villages, confiscate property and execute locals in pursue of their crazy ideals. Communists in Belgrade describe this terror campaign as \"Leftist Errors\". Those actions divide the rebels. A splitter group under Pavle Đurišić now fights against both Greens and Reds, promoting the idea of Great Serbia, which would include Montenegro."
  ygw_montenegro.4.a:0 "We are the lesser evil!"
  ygw_montenegro.5.t:0 "Red Rule is Opposed in Montenegro"
  ygw_montenegro.5.d:0 "Our efforts to liberate the Montenegrin working class have proven to cause trouble. Fair and just actions centered on seizing surplus grain, destroying class enemies and occasional village burning have put capitalists on the defensive. Now those enemies of the people unite with local banditry, organized into tribes and prone to bring back the old regime."
  ygw_montenegro.5.a:0 "We should watch the situation carefully."
  ygw_montenegro.6.t:0 "Counterrevolution in Montenegro!"
  ygw_montenegro.6.d:0 "Although we describe armed attacks in Montenegro as banditry, each day it becomes harder to hide that we are dealing with an armed insurrection. Entire tribes fight against the Red rule. The situation is the worst in the Cetinje region, where local clans still support the Greens - an old faction, struggling to revive an independent Montenegro."
  ygw_montenegro.6.a:0 "We must destroy the fifth column!"
  ygw_montenegro.7.t:0 "Chetniks in Montenegro"
  ygw_montenegro.7.d:0 "As enemies of the people continue to terrorize Montenegro, their actions draw attention from other South Slavic lands. The Chetniks, an old and primarily Serbian movement, show their interest in ongoing events. In fact, they want to lead the rebellion and use it to bring down the communist regime. However, why would the Greens submit to their former enemy?"
  ygw_montenegro.7.a:0 "Whatever, we will defeat all of them."
  ygw_montenegro.8.t:0 "Montenegrin Rebels Split!"
  ygw_montenegro.8.d:0 "The rebellion continues in Montenegro, however, it has suffered a split. The Greens have no intention to follow the Chetnik leadership - they want Montenegro to be an independent kingdom, not a Serbian province. The Chetniks, however, have managed to gain support of at least some Montenegrin tribes and establish themselves in the region."
  ygw_montenegro.8.a:0 "Wonderful!"
  ygw_montenegro.9.t:0 "War in Montenegro"
  ygw_montenegro.9.d:0 "War in Montenegro has took its final form. Three groups are involved. The Greens, led by Krsto Popović, are Montenegrin nationalists, fighting \"for the Right, Honour and Freedom of Montenegro\". They are opposed by the Whites, led by Pavle Đurišić. They are aligned with the Chetniks, and their goal is to establish Montenegro as a part of Serbia. Another armed group are the Reds. They represent the International and the communist party and are led by Milovan Đilas. The Reds see the conflict as a class war, claiming to protect the working class and striving to defeat the oppressors. The stage is set."
  ygw_montenegro.9.a:0 "Blood spills on the slopes of Lovćen."
  
  ## Montenegro
  ygw_macedonia.1.t:0 "Violence Spills Over into Macedonia"
  ygw_macedonia.1.d:0 "The unrest situation is becoming more dire by the day. With other areas of the country already seeing unrest, our people are losing faith in the government while our police and military forces are overstretched. These factors have led to growing unrest and violence in the southern territory of Macedonia, as communists, nationalists, and others participate in violent opposition to the government. So far, the situation is under control and resistance is sporadic, but it could easily spiral out of control if improperly handled."
  ygw_macedonia.1.a:0 "We are stretched too thin to react."
  ygw_macedonia.2.t:0 "Terrorist Attack in Macedonia!"
  ygw_macedonia.2.d:0 "Several of our government buildings in Macedonia were attacked by terrorists in a coordinated strike this morning! Several bombs were detonated in front of post offices, bureaucratic centers, and police stations around the region, and armed gunmen fired on fleeing workers and civilians. No group has claimed responsibility for the attacks, but they were almost certainly VMRO or communist resistance fighters. Several were killed and many wounded. Faith in our government has been shaken severely."
  ygw_macedonia.2.a:0 "Damn."
  ygw_macedonia.3.t:0 "Terrorist Attack in Macedonia!"
  ygw_macedonia.3.d:0 "Several of our government buildings in Macedonia were attacked by terrorists in a coordinated strike this morning! Several bombs were detonated in front of post offices, bureaucratic centers, and police stations around the region, and armed gunmen fired on fleeing workers and civilians. No group has claimed responsibility for the attacks, but they were almost certainly Chetnik or communist resistance fighters. Several were killed and many wounded. Faith in our government has been shaken severely."
  ygw_macedonia.3.a:0 "Damn."
  ygw_macedonia.4.t:0 "VMRO (United) and Communists Form Alliance"
  ygw_macedonia.4.d:0 "Bad news emerged from Macedonia today. The VMRO (United), the leftist side of the split VMRO resistance organization, has formed a temporary alliance with the communist resistance. Previously, they had been kept in check by infighting, but now march in tactical lock-step. This coalition of devils is firmly united in their opposition to our government. Together, they may have the power to make the region near ungovernable. This new "partisan united front" is a threat that must be dealt with immediately."
  ygw_macedonia.4.a:0 "Put anti-terror squads on alert!"
  ygw_macedonia.5.t:0 "Local Government Hires VMRO Protection"
  ygw_macedonia.5.d:0 "It has come to our attention that one of our local officials has hired VMRO partisans as security. Macedonian villages embracing the VMRO as protectors is nothing new, but for a government official to do so is a public relations disaster, as our government has repeatedly condemned the VMRO as shadowy terrorists! The administrator told a local reporter that he did not feel the government was doing enough to protect him from Chetniks and communists. To say that this affair has made us look bad would be putting it lightly. Faith in the government is at an all-time low, as VMRO partisans begin to replace local police."
  ygw_macedonia.5.a:0 "Reprimand him immediately! We don't negotiate with terrorists!"
  ygw_macedonia.6.t:0 "Inter-Partisan Violence Escalates"
  ygw_macedonia.6.d:0 "Tensions and violence across Macedonia are escalating rapidly. Our government is losing control of the situation, as more and more of the fighting occurs between partisan groups, rather than between partisans and government forces. More and more, our orders fall on deaf ears and we are condemned to simply watch helplessly as the countryside burns. The vicious partisan fighting threatens to escalate into full civil war in the near future. We are rapidly losing control of the situation, and there is very little we can do about it."
  ygw_macedonia.6.a:0 "Brace for impact!"
  ygw_macedonia.7.t:0 "Counterrevolutionary Dissent in Macedonia"
  ygw_macedonia.7.d:0 "Despite us having liberated Macedonian workers from their chains of servitude, many still oppose our government. Many Macedonian peasants and workers still ignorantly cling to reactionary ideas like nationalism and religion, and have organized resistance groups around them! Counterrevolutionary partisans have especially targeted our collectivized farms and the labor camps we have set up to punish enemies of the people. These methods have been very unpopular, and have radicalized many against us."
  ygw_macedonia.7.a:0 "Can't they see it's for their own good?"
  ygw_macedonia.8.t:0 "Macedonian Resistance Solidifies"
  ygw_macedonia.8.d:0 "The resistance to our revolutionary government has begun solidifying into specific organizations, as villages trying to escape our grasp turn to larger partisan organizations for protection and support. The main two that have spread this way are the Chetniks, reactionary Serbian nationalists, and the VMRO, a Macedonian resistance organization. These two groups now form the backbone of the counterrevolutionary resistance, and we must be prepared to deal with the threat they pose to our control over the countryside."
  ygw_macedonia.8.a:0 "The revolution must prevail."
  ygw_macedonia.9.t:0 "Countryside Out of Control!"
  ygw_macedonia.9.d:0 "We had hoped that over time the people of Macedonia would, after seeing the fruits of socialism, come to support our government and that the resistance would fade away. This has not happened. Many, especially in the countryside, are still firmly against us, and the Chetniks and VMRO have only grown in strength and number. We are rapidly losing control of the countryside, and our control is largely limited to population centers now. The liberation of Macedonia is in severe jeopardy, and our political situation is untenable.."
  ygw_macedonia.9.a:0 "Where will we get food?"
  ygw_macedonia.10.t:0 "The Civil War Begins in Earnest."
  ygw_macedonia.10.d:0 "A few days ago, a column of government troops were ambushed on the road by a large group of partisans. The result was as close to a pitched battle as Macedonia has seen since the Great War. Large numbers of government troops and enemy partisans were mobilized from around the countryside to join. The battle ended in a narrow and costly victory, but the general mobilization of all sides has not gone away. Guerilla fighting has now escalated massively and the country is in all-out war, with large numbers of soldiers and partisans participating. The true struggle for Macedonia has begun."
  ygw_macedonia.10.a:0 "God help us."
  
  ## Bosnia
  ygw_bosnia.1.t:0 "Bosnian Serb Communities Defenseless"
  ygw_bosnia.1.d:0 "The conditions of Serbs in Bosnia has deteriorated as of late. Increased power and policies by the Ustaše have done massive damage to their communities. Bosnian law enforcement no longer protects Serbs from attacks, and sometimes even join in on it themselves. The Serbian community in Bosnia has been rendered totally defenseless. Some flee, some pray, and some turn to arming themselves and their families in desperation, but regardless, the situation slips ever more slightly out of control as tensions rise and one group are like wolves to another."
  ygw_bosnia.1.a:0 "Where's the problem?"
  ygw_bosnia.2.t:0 "Massacres in Bosnia"
  ygw_bosnia.2.d:0 "The Serb situation in Bosnia deteriorates further as reports of massacres and atrocities in Serbian villages there become more frequent. Many of these attacks were instigated or actively carried out by Ustaše militants. The details are horrific. Impromptu executions, mass graves, arson, and other tactics of terror and destruction are becoming regular occurrences. It seems that the ethno-nationalist promises of the Ustaše are finally being made good on, as they initiate what can only be called a sporadic ethnic cleansing of the region."
  ygw_bosnia.2.a:0 "Thoughts and prayers."
  ygw_bosnia.3.t:0 "Anti-Muslim Actions in Bosnia"
  ygw_bosnia.3.d:0 "As Serbs solidify control in Bosnia, their reign has been a disaster for Bosnian Muslims. Policies of discrimination and condemnation both official and unwritten have come into effect as law enforcment and civil administration become increasingly hostile to Muslims. The Muslim community in Bosnia has been rendered totally defenseless. As the violence continues to escalate, Bosnian Muslims are faced with a choice: stay and hope things improve, or attempt to flee the ever-worsening conditions. At least, the privileged few who can flee are."
  ygw_bosnia.3.a:0 "Tough luck."
  ygw_bosnia.4.t:0 "Atrocities in the Bosnian Countryside"
  ygw_bosnia.4.d:0 "Reports of gruesome crimes are coming from Bosnia. Massacres and atrocities, primarily targeting Bosnian Muslims, are becoming more and more frequent. Many of these attacks were instigated or carried out by Bosnian Serb militants. The awful details of the crimes include impromptu executions, mass graves, tactics of terror, and the razing of entire villages to the ground. However loosely organized, it seems that an ethnic cleansing is beginning to take shape in the Bosnian countryside as Serb rifle is put to Muslim head."
  ygw_bosnia.4.a:0 "Thoughts and prayers."
  ygw_bosnia.5.t:0 "Communists Mobilize in Bosnia"
  ygw_bosnia.5.d:0 "The situation is Bosnia has been deteriorating for some time now. Violence weakens infrastructure and creates uncertainty. Uncertainty creates poverty. As people of all ethnic groups become poor and scared, the Communists are, as always, in position to exploit it. Feeding on discontent and promising the world, their recruitment efforts become more successful by the day. The Bosnian people are vulnerable to such promises in their desperation, and the Communists become more powerful and threatening by the day."
  ygw_bosnia.5.a:0 "A spectre looms."
  ygw_bosnia.6.t:0 "Violence Spills Over into Bosnia"
  ygw_bosnia.6.d:0 "Wars by their very nature have a tendency not to respect borders. Civil wars even less so. It is little surprise, then, that our own civil conflict is spreading like wildfire across the country. What began as a localized uprising has now engulfed every region of our supranational state. Bosnia is the most recent domino to fall. While troubles and violence are not new to Bosnia, the Yugoslav civil war will bring even more than the country was expecting. Men load their rifles and women bury their valuables as the red tide of war washes over them all."
  ygw_bosnia.6.a:0 "Horrible!"
  ygw_bosnia.7.t:0 "Communist Agitation in Bosnia"
  ygw_bosnia.7.d:0 "Communist recruitment in Bosnia has been up for some time recently due to instability and discontentment among the poor and rural areas. It's hard to know for sure how extensive the Communist networks are, but it is safest to assume that they are quite large. These fears have been confirmed by recent agitation by communist- and worker-aligned forces in the area. Strikes, street violence, attacks against landlords and local officials all carry the stink of Bolshevism on them. This doesn't pose an immediate threat on its own, but contributes to the general instability that threatens the whole nation."
  ygw_bosnia.7.a:0 "Something to keep an eye on."
  ygw_bosnia.8.t:0 "Communist Land Reforms in Bosnia"
  ygw_bosnia.8.d:0 "As the Communists gain more and more control over the Bosnian countryside, the tinder of class tension has burst into the flame of class warfare. Communist-aligned villages (or those occupied by Communist militias) have seen attempts at "land reform." While theoretically meant to redistribute land more equitably among farmers, the result has been the lynching of landlords, the settling of personal scores between peasants, and the redirection of revolutionary fervor into old family feuds and land disputes. What the Communists thought might be a clean affair has rapidly become a bloody mess."
  ygw_bosnia.8.a:0 "Won't anyone think of the landlords?"
  ygw_bosnia.9.t:0 "Muslim and Serb Paramilitaries in Bosnia"
  ygw_bosnia.9.d:0 "As the communists have solidified their control over many areas of Bosnia, other political factions have become increasingly desperate. The anti-communist forces have begun coalescing into armed forces that can compete with the Communist militias. Many of these paramilitary forces, unsurprisingly, have organized along ethnic and religious lines, with the largest factions being Bosnian Serbs and Muslims respectively. These new militia forces gain support by "protecting" towns from Communists, but they fight just as much amongst each other. The situation hangs by a thread."
  ygw_bosnia.9.a:0 "Bosnia now chooses: Communists or bandits?"
  ygw_bosnia.10.t:0 "Ustaše Influence on the Rise in Bosnia"
  ygw_bosnia.10.d:0 "In times of terror and instability, those without means of defending themselves turn to others for their defense. Men who can march in lock-step and strike fear into others are often best equipped for this purpose. It is unsurprising, then, that in these times of turmoil some turn to the Ustaše, who perhaps meet that description better than any other men in Yugoslavia, for defense. A rabidly violent terrorist organization attempting to forge a Croation ethnostate one bullet at a time, the Ustaše are instigators of much of the violence in Bosnia. Still, many villages align with them simply for the promise of having Ustaše guns pointed away from them."
  ygw_bosnia.10.a:0 "Don't they see they're just making things worse?!"
  ygw_bosnia.11.t:0 "Bosnia Descends into Civil Conflict"
  ygw_bosnia.11.d:0 "If the situation in Bosnia hung by a thread several months ago, that thread has now been severed and the country is in freefall. Ethnic, religious, and class tensions have been on the rise for some time now, and as all factions become more scared of the others, they arm themselves more and posture more aggressively. In this spiral of violence and fear, it was inevitable that the situation would hit rock bottom eventually. All illusions of public order have now been dissolved, and like caged wolves the people lash out at each other. Now, only blood can make a victor."
  ygw_bosnia.11.a:0 "May the children be spared."
  
# DECISIONS
  # Montenegro
