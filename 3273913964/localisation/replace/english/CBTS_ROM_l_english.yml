#Leader Descriptions and Descriptions
POLITICS_CAROL_II_DESC:0 "Ascending to the throne in 1930, Carol II is still rather new as the King of Romania. Having returned to the country after Michael I took the throne being only 10 years old, Carol II has already made a name for himself within the country, and a rather bad name at that. He is known to be an extreme hedonist, partying and living his life without a care for the problems that the country faces. Known for taking expensive trips with his wife, Elena Lupescu, he is quite popular on the international stage, however at home he is hated by the poor peasant class as well as many of the political parties in Romania. The National Liberal Party openly opposes him and states that he is unfit to be King. His tendency toward authoritarianism, as well as his xenophobia, have in turn made him rather popular amongst the right wing parties in Romania. Carol closely supports the conservative National Peasants’ Party (Alexandru Vaida-Voevod being a personal friend of the king) favouring them over the National Liberal Party after they expressed hatred towards Carol. His wife, Elena Lupescu, is even more hated then the King is. Having been dubbed the ‘Red Queen’ Her tastes are far more expensive than Carol's and as such she is regularly given hefty sums to keep her happy. She is in constant conflict with the National Liberal Party, who oppose her as well. While Carol had sworn in the constitution in 1923, he has no intentions of keeping his oath. Being an opportunist, he has used any chance that he can take to meddle in the politics within the country. While Carol takes interest in the politics of the nation, his wife has no interest, wanting nothing more than to exploit the nation and make her own life as enjoyable as can be. Carol does not deny the fact that his wife is pulling many strings in his life, however he does nothing to stop it from happening. He is mistrusted amongst many people in Romania, especially within the impoverished regions of the country. If left unchecked, Carol, and his wife Elena could spell the end of the nation."
ROM_GATHERING_STORM_DESC:0 "Romania had come out on the winning side of World War One despite occupation by the Central Powers. Romania had joined the Entente on the promise that they would be granted Transilvania, a region in Austria-Hungary that was ethnically Romanian. That promise was "forgotten" by the Entente, and in 1919 Romania went to war with Hungary. Winning the war, Romania reached its greatest territorial extent, and has been deemed by many as "Greater Romania." Romania now has many domestic and external issues to address, including land claims from three of its neighbors, and a rearming Hungary."

