#Ideas
ROM_Aftermath_of_The_Depression:0 "Aftermath of the Great Depression"
ROM_Aftermath_of_The_Depression_desc:0 "Even though the main stages of the Great Depression have long since passed, the effects are still felt within Romania. As a nation relatively unaffected by industrialization until just after World War I, Romania's economy was not yet ready to burden such a big stock market crash. The oilfields in Wallachia was the main source of income, and with the crash of the stock market, oil prices plummeted. For a while Romania was able to keep up with the depression as the country exported more than the national average of any other nation for two years in a row thanks to the oil genius Ion Basgan and his revolutionary designs in the field. However, disaster loomed in the way of the left wing. As Communism became more popular among the working class, strikes and sabotage in the name of the proletariat became much more common in Romanian society. With the workers striking and no one to work the wells, Romania was suddenly plunged headfirst into the depression without any form of protection. The Romanian Stock Market collapsed within days and many were left without jobs Protests and riots against the monarchy followed. While this was a disaster made by the people, the monarchy was not completely innocent in the matter. Carol II, current King of Romania, had developed quite an expensive taste while being King of the nation. Throwing lavish parties and being quite the hedonist, rather than worrying about the affairs of the state. Already being a rather unpopular monarch, his popularity has only worsened with the disaster of the economic collapse. He was forced to take action when the money he used to live his luxurious lifestyle suddenly stopped coming in. With a direct hand in state affairs, Carol has managed to somewhat stabilize the economic situation, however there is still much rioting and striking throughout the country especially within the capital of Bucharest itself. Many political parties within the country have urged the King to allow the deployment of the police in many key industrial centers to avoid rebellion, however with the King once more able to live his lifestyle in luxury, the pleas of the government have fallen on deaf ears and no one within the inner circle has paid any mind to the begging of those who are looking out for the safety of the country. A dangerous concoction… if anything."

ROM_Orthodox_Power_Over_the_People:0 "The Church and the State"
ROM_Orthodox_Power_Over_the_People_desc:0 "In Romania especially, it is no surprise that the Church holds more power over the people than the government who runs the country. Nearly all of the population in Romania follows the Eastern Orthodox fate, save the Hungarian and Turkic minorities in Transylvania and Dobrogea respectively. Whichever political party wishes to become head of the national parliament must first secure the Church if they wish to have any chance at winning. The most recent election yielded a result that was quite shocking to most of the outside world. For the first time since the 1907 Peasants Revolt, which ended in disaster for the nation, a party besides the National Liberal Party won the elections. The National Peasants' Party won the most recent election under native Transylvanian Alexandru Vaida-Voevod. By managing to secure a pact with the Church, Voevod and his party managed to win the elections by a landslide. However, Voevod, upon coming to power in the nation, backed out of his promise to not meddle in the affairs of the Church. His popularity instantly dropped by an extreme amount, and the party was shamed by the populace. The PNL has all but regained those who they lost in the previous election and if they can once more gain the support of the Church, there will be almost no way that they can be stopped from coming to power once more."

ROM_Transylvanian_Hungarian_Minority:0 "An Unsettled Dispute"
ROM_Transylvanian_Hungarian_Minority_desc:0 "In the region of Transylvania, namely the Szekelyland and the valleys East of the Apuseni Mountain Range, resides the reason that Transylvania has yet to fully come to a peaceful state. The Hungarian minority, and sometimes the majority in the region, number around 1.2 million. Mainly concentrated in the Szekelyland Region in Eastern Transylvania, the region is dominated by nearly 600,000 people of Hungarian ancestry. Many of whom still do not recognise the new Romanian government and refuse to cooperate with local officials. Many ethnic disputes and crimes against race are still common in these regions. Where both Romanians and Hungarians are poking and prodding at one another in an attempt to break each other. This has caused quite an annoyance for the government in the South, who have tried on multiple occasions to remedy the situation, all of which have failed. Extremists on both sides have carried out attacks on local centers of gathering for one another, and some people have died in this dispute. To make matters worse, Hungary, under the governance of Miklós Horthy, has made no attempt and on some occasions encouraged the actions of her people, only further sparking mistrust and hatred between the two nations. As it stands the current situation cannot last, as it is a danger to the public and to the country itself, who is unstable as is. The Regions, mainly in Szekelyland, are also resource rich in nature and harbor many untapped deposits of iron and other minerals. The region is a rather rural and underdeveloped part of Romania, especially compared to the region just to the South where the major city of Braşov resides. The region could come of great economic benefit… once the situation with the Hungarian populace is dealt with."

ROM_Greater_Romania_Achieved:0 "A Dream Achieved"
ROM_Greater_Romania_Achieved_desc:0 "A dream that has been there as long as the Romanian people themselves has finally been achieved with the ending of the First World War. Since the times of the Dacian people who once roamed the land, there has been a dream set in the minds of many Romanian people. The unification of the regions of Moldavia, Wallachia, and Transylvania, under one united Romanian nation. With the outcome of World War I, Romania almost lost her only chance for unification when her diplomats to Paris were at first not allowed to attend the treaty, however many young Romanian boys lost their lives to make this dream a reality, the country had been scarred for life and many of the cities had yet to recover from the looting and pillaging committed by Austria-Hungary. The diplomats to Paris forced their way in, and stated Romania’s demands. The unification of Bessarabia, Muntenia, Moldova, Dobrogea, Bucovina, Banat, and Transylvania, all under the Romanian tricolour. While the demands were accepted, in 1919, Romania had yet to gain control of Transylvania, as the Hungarian government refused to turn over control. As such, in 1919, a combined Romanian, Yugoslav, and French invasion of Hungary began. Hungary had been dealing with revolutionary socialists for some time, and in this time of war, the nation was at its weakest. Romanian troops would enter Budapest in the following months, and from there the Hungarian government, while saved from the threat of Communism, was forced to cede much of her land in a treaty thought by the public and many abroad to be unfair to Hungary, who had suffered under Austrian rule during the First World War. With the treaty signed however, Romania left, triumphant and united at last. In the city of Alba Iulia in Transylvania, one of the largest parades in Romanian history was held, and the people cheered on those who fought for the Region. Romania finally united, at long last, a dream finally fulfilled."

#Events
romania.10.t:0 "Duca the new Prime Minister!"
romania.10.d:0 "Ion Gheorghe Duca has been chosen as the new President of the Council of Ministers. As Alexandru Vaida-Voevod's term is up. Duca and the PNL have taken power back, as expected in the country. The Fourth Vaida-Voevod Cabinent has made many mistakes in their time in power. The PNŢ has lost nearly all of the power it had and the Church is now in favour of the PNL. Duca advocates for non-discriminatory policies when it comes to race and religion in the country and is fairly popular among the people."
romania.10.a:0 "Let's see if he can fix the mess."
romania.11.t:0 "Prime Minister Duca Assassinated in Sinaia!"
romania.11.d:0 "Prime Minister Ion Gheorghe Duca has been assassinated at Sinaia Railway Station just outside of the small town! Local officials have described the scene as brutal, and unhuman. The nature of the killing shocking. The body was littered with thirty one bullet wounds, mostly centered around the chest cavity with multiple others in the head. Bystanders were unable to stop the attackers, three men in their late twenties. Nicolae Constantinescu, Ion Caranica and Doru Belimace, all three members of the Iron Guard's Nicadori Death Squad. Police have arrested all three individuals, and all three are currently awaiting transfer to Bucharest where they will be tried. When questioned, the assassins said that it was for the greater good of the country and that Duca was a degenerate who deserved nothing more than death. It is believed that due to Duca's anti-authoritarianism and non-religious descrimination policies that the Iron Guard decided to come after him. He had for long attempted to stomp out actions by the terrorist organisation."
romania.11.a:0 "Duca was a good man, and deserved better..."

romania.80.t:0 "Carolist Generals Dismissed"
romania.80.d:0 "With the abdication of Carol, many prominent officers in the Romanian military who were loyal to Carol have openly opposed the new Antonescu-Sima government. In response to this Conducător Antonescu has ordered an army wide purge in order to root out any opposition to the regime. Many officers, including Gheorghe Mihail, and Paul Teodorescu have been sacked. This has caused much protest from the armed forces."
romania.80.a:0 "It is for the better of the country."

romania.110.t:0 "A Bombing in Odesa"
romania.110.d:0 "This morning a shock wave ripped throughout the ruined city of Odesa on the Black Sea. During a night time operation by Soviet soldiers holding out in the cities sewer systems, a bomb was planted in the Romanian military headquarters. The following explosion killed over 60 in the Romanian military, as well as a number of civilians. Among the dead was Ion Glogojanu, the commander of the 10th Infantry Division. Glogojanu was a veteran officer who had served in the First World War as a soldier, and slowly climbed through the ranks to become Colonel of the 10th Infantry Division in 1933. He had been appointed military commander of the city of Odesa just days before. With his death, many generals within the high command have come forward to openly protest Conducător Antonescu's decision to continue fighting the Soviet Union past the River Dniester."
romania.110.a:0 "May his soul Rest in peace."

