l_english:
 GCW_DDR_postwar_economic_destruction2:0 "Postwar Economic Destruction"
 GCW_DDR_postwar_economic_destruction2_desc:0 "Although the civil war has been won, our economy has been severely affected by all the fighting. Factories and destroyed, railways need to be urgently repaired, there are major food shortages everywhere, and millions of Germans have been left wounded, dead or without the ability to feed themselves. We need to rebuild Germany as soon as we can!"
 GCW_DDR_postwar_economic_destruction3:0 "Postwar Economic Destruction"
 GCW_DDR_postwar_economic_destruction3_desc:0 "Although the civil war has been won, our economy has been severely affected by all the fighting. Factories and destroyed, railways need to be urgently repaired, there are major food shortages everywhere, and millions of Germans have been left wounded, dead or without the ability to feed themselves. We need to rebuild Germany as soon as we can!"
 DDR_PostWarDestruction_Modifier:0 "Postwar Economic Destruction"
 DDR_PostWarDestruction_Modifier_desc:0 "Although the civil war has been won, our economy has been severely affected by all the fighting. Factories and destroyed, railways need to be urgently repaired, there are major food shortages everywhere, and millions of Germans have been left wounded, dead or without the ability to feed themselves. We need to rebuild Germany as soon as we can!"
 DDR_veteran_volksarmee:0 "Veteran Volksarmee"
 DDR_veteran_volksarmee_desc:0 "Although many of our men left the Volksarmee after our victory in the Revolution, those who remain and battle-hardened veterans, and will form the core of the new Volskarmee!"
 DDR_nazi_resistance:0 "Nationalist Resistance"
 DDR_nazi_resistance_desc:0 "Despite the defeat of the Nationalists, several SA and Reichswehr remnants still resist our rule. Although a minor nuisance, they tie up valuable Volksarmee men and resources that could be spent elsewhere, so they must be stamped out as soon as possible."
 DDR_nazi_resistance2:0 "Nationalist Resistance"
 DDR_nazi_resistance2_desc:0 "Despite the defeat of the Nationalists, several SA and Reichswehr remnants still resist our rule. Although a minor nuisance, they tie up valuable Volksarmee men and resources that could be spent elsewhere, so they must be stamped out as soon as possible."
 DDR_nazi_resistance3:0 "Nationalist Resistance"
 DDR_nazi_resistance3_desc:0 "Despite the defeat of the Nationalists, several SA and Reichswehr remnants still resist our rule. Although a minor nuisance, they tie up valuable Volksarmee men and resources that could be spent elsewhere, so they must be stamped out as soon as possible."
 DDR_empowered_politburo:0 "Empowered Politbüro"
 DDR_empowered_politburo_desc:0 "The Volksrat and the Constitutional organs of power are just for show: true power resides in the Politburo of the KPD, making ruling the nation smoother but also concentrating all meaningful political debate inside our party."
 DDR_politicized_army:0 "Politicized Army"
 DDR_politicized_army2:0 "Politicized Army"
 
 DDR_revolution_triumphant:0 "The Revolution Triumphant!"
 DDR_revolution_triumphant_desc:0 "The struggle that begun in 1918 has finally ended, as the workers of Germany have broken the chains that oppresed them, and they are now free to build socialism in Germany, and maybe even beyond... For now though, we have to reorganize our war-torn country."
 DDR_establishing_control:0 "Establishing Control"
 DDR_establishing_control_desc:0 "The bourgeois and fascist governments have fled to exile, but there are still some areas of the German countryside that have not seen a single Volksarmee soldier yet. Let us fully assert our control over Germany."
 DDR_disarm_reactionary_armies:0 "Disarm the Reactionary Armies"
 DDR_disarm_reactionary_armies_desc:0 "The Republican and Nationalist armies, after their defeat, need to be dissarmed and dissolved. We could also welcome some of their men into the Volksarmee, provided they pass an ideological exam."
 DDR_eliminate_fascist_remnants:0 "Eliminate the Fascist Remnants"
 DDR_eliminate_fascist_remnants_desc:0 "Remnants of the SA and the Reichswehr still roam Pomerania, Prussia and Silesia, occupying some villages and terrorizing the local population. We need to destroy these rogue groups and finally cleanse fascism out of Germany!"
 DDR_replace_local_councils:0 "Replace Local Councils"
 DDR_replace_local_councils_desc:0 "Despite the collapse of the bourgeois government, several towns remain under liberal or social democratic mayors and city councils. To properly build a new Germany, we'll need to dissolve all remaining bourgeois city councils and replace them with temporal Volksarmee juntas, as proper worker councils can be organized."
 DDR_begin_reconstruction:0 "Begin Economic Reconstruction"
 DDR_begin_reconstruction_desc:0 "As the Provisional Government prepares the upcoming Volksrat election, the economic catastrophe bought by the war can't wait. We shall begin enacting decrees to regulate the ownership of land, and we should also organize groups of Volksarmee soldiers and volunteers to clear all the rubble and repair the factories."
 DDR_veteran_compensation:0 "Compensation for Veterans"
 DDR_veteran_compensation_desc:0 "Thousands of Volksarmee soldiers have expressed their desire to return to civilian life, after the end of the civil war. We shall enact a decree to provide them with some economic compensation, at least until a more permanent solution can be enacted."
 DDR_nationalize_fascist_property:0 "Nationalize Fascist Assets"
 DDR_nationalize_fascist_property_desc:0 "Factories, estates and other assets owned by fascist sympathizers shall be nationalized immediately through a decree of the Provisional Government."
 DDR_strict_rationing_2:0 "Strict Rationing"
 DDR_strict_rationing_2_desc:0 "After the war, Germany is experiencing a severe famine. In order to prevent speculation and guarantee food supply for everyone, the Provisional Government has decided to enact rationing through a decree. It also will extend to fuel and other first-necessity goods."
 DDR_volksrat_elections:0 "The Volksrat Election"
 DDR_volksrat_elections_desc:0 "The time has come for the first Volksrat election in a united, red Germany. Will the KPD assert its control, or will something unexpected happen...?"
