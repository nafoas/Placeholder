 DDR_central_bank_created:0 "A new §YCentral Bank§! has been created"
 
 DDR_kpd_prov_gov:0 "Thälmann's Provisional Government"
 DDR_kpd_prov_gov_desc:0 "The Volksrat election has confirmed Thälmann's mandate to lead the Provisional Government until a new Constitution is written. Now we can begin to properly implement the KPD's platform without being hindered by the annoying Opposition."
 DDR_control_volksarmee:0 "Control the Volksarmee"
 DDR_control_volksarmee_desc:0 "The People's Army is mostly loyal to us, but the situation could be improved by examining the ideological credentials of lower-ranking officers. Any anarchist, councilist or otherwise subersive element we find shall be dealt with discretely..."
 DDR_political_comissariat:0 "Assign Political Comissars"
 DDR_political_comissariat_desc:0 "In order to ensure our ideology is properly followed amongst our ranks, we shall assign Political Comissars to our units, that will supervise and encourage ideological discussion and indoctrination inside the army."
 DDR_create_military_districts:0 "Recreate Military Districts"
 DDR_create_military_districts_desc:0 "In order to better organize the Volksarmee, we shall recreate the old Military Districts and reorganize the army following those lines. This will help us move from a civil war army to a proper standing army."
 DDR_promote_otto_braun:0 "Promote Otto Braun"
 DDR_promote_otto_braun_desc:0 "Otto Braun has shown his worth before and during the Revolution, leading our brave troops in the fight against the fascist opressor. With Thälmann focusing on leading the civilian affairs of the government, we should transfer military responsibilities to Braun."
 DDR_peoples_police:0 "Create the Volkspolizei"
 DDR_peoples_police_desc:0 "Fascist and reactionary subersive activity is still running rampant, even after the situation stabilized! Transfering counter-insurgent operation from the Volksarmee to a new People's Police or Volkspolizei will help us secure our rule, and begin developing our internal security services."
 DDR_form_united_front:0 "A United Front"
 DDR_form_united_front_desc:0 "Despite our recent misgivings and disputes, we need to remain in a United Front with the SAPD and other minor revolutionary parties. Socialist Unity is the only way to preserve the Revolution and move forward to Germany's new communist dawn!"
 DDR_ban_sapd:0 "Ban the SAPD"
 DDR_ban_sapd_desc:0 "Ever since the Revolution began, we have been under constant scrutiny from the so-called Opposition. But what are they opposing? Worker's rule? Socialism? Anti-fascist activities? They are clearly counter-revolutionary agents, so we should end this Unity farce and give them the same treatment given to the NSDAP, the SPD and other traitors."
 DDR_empower_politburo:0 "Empower the Politbüro"
 DDR_empower_politburo_desc:0 "Having a Volksrat is all well and good, but since the KPD is the Worker's Vanguard and the leading party in the new Germany, power should be de facto transfered to the party's Politburo. That shall help us run the nation more efficiently."
 DDR_reconstruction_committee:0 "Ausschuss für Wiederaufbau"
 DDR_reconstruction_committee_desc:0 "In order to better organize the Reconstruction efforts, we shall create a Committee for Reconstruction that will begin to launch regional projects in industrialized areas, in order to rebuild local factories and infraestructure, provide employment, housing and food."
 DDR_reconstruction_committee_tt:0 "Unlock £decision_icon_small  §YDecisions§! to §GRebuild Germany§!"
 DDR_currency_reform_tt:0 "Unlock £decision_icon_small  §YDecisions§! to §GReform our Currency§!"
 DDR_agricultural_quotas:0 "Set Agricultural Quotas"
 DDR_agricultural_quotas_desc:0 "Before we can begin to collectivize agriculture, we need to increase production right now to prevent a famine. Increasing quotas will be needed to keep the nation afloat and fed."
 DDR_agricultural_quotas_tt:0 "Modify §YPostwar Economic Destruction§! by\n£consumer_goods_texticon  Consumer Goods Factories: §Y+3.0%§!\n£construction_speed_texticon  Construction Speed: §G+5.0%§!\n£prod_eff_cap  Production Efficiency Cap: §G+5.0%§!\n£civ_factory_output  Factory Output: §G+2.0%§!\n£dockyard_output  Dockyard Output: §G+2.0%§!\n"
 DDR_currency_reform:0 "Begin the Currency Reform"
 DDR_currency_reform_desc:0 "The old Reichsmark must be thrown out in favor of a new Deutsche Mark, controlled and issued by a new Central Bank. Let us begin our plans to make it happen."
 DDR_one_year_plan:0 "Launch the One-Year Plan"
 DDR_one_year_plan_desc:0 "As the economy recovers, we should launch a small focused economic plan to repair, renew and even expand our industrial capabilities. While our current economy can't sustain a bigger effort, this plan will be a stepping stone from which we shall launch more ambitious plans!"
 DDR_a_new_system:0 "Ein Neues System!"
 DDR_a_new_system_desc:0 "As the Constitution is finalized and voted, and our reforms begin to take effect, a new Germany is rising. A Germany for the workers, by the workers. A free an equal Germany. Under the KPD, under the new system, we shall archieve communism!"
 
 DDR_reconstruction_germany:0 "The Reconstruction of Germany"
 DDR_reconstruction_germany_desc:0 "With the KPD firmly established in power, Chairman Thälmann has created the Ausschuss für Wiederaufbau, or Reconstruction Committee, that will manage localized repair efforts to rebuild our most industrialized areas and restore our economic strength. The goal is to restore some semblance of industrial activity before larger scale economic plans can be enacted. \n\n§RLet us begin the People's Recovery!§!"
 DDR_already_rebuilding:0 "Another Reconstruction project is ongoing elsewhere"
 DDR_rebuild_rhineland:0 "Rebuild the Rhineland"
 DDR_rebuild_munich:0 "Rebuild Munich"
 DDR_rebuild_saxony:0 "Rebuild Saxony"
 DDR_rebuild_hamburg:0 "Rebuild Hamburg"
 DDR_rebuild_berlin:0 "Rebuild Berlin"
 DDR_rebuild_frankfurt:0 "Rebuild Frankfurt"
 DDR_rebuild_hannover:0 "Rebuild Hannover"
 DDR_create_staatsbank:0 "Create the Deutsche Staatsbank"
 DDR_issue_new_mark:0 "Issue the new Mark"
 DDR_one_year_plan_mission_tt:0 "We will gain £civ_factory  §YCivilian Factories§! and £infrastructure_texticon  §YInfrastructure§! in those states that we have reconstructed. \nAditionally, completing the §YCurrency Reform§! will grant an §Gadditional§! offmap £civ_factory  §YCivilian Factory§!."
 DDR_one_year_plan_mission:0 "The One-Year Plan"
 
 GER_ndpd:0 "NDPD"
 GER_ndpd_long:0 "Nationaldemokratische Partei Deutschlands"
 GER_ldp:0 "LDP"
 GER_ldp_long:0 "Liberaldemokratische Partei Deutschlands"
 GER_db:0 "DB"
 GER_db_long:0 "Deutscher Bauernbund"
 GER_dap:0 "DAPD"
 GER_dap_long:0 "Demokratische Arbeiterpartei Deutschlands"
 GER_dsap:0 "DSAP"
 GER_dsap_long:0 "Deutsche Sozialistische Arbeiterpartei"
 
 ddr.1.t:0 "Formation of the Provisional Government"
 ddr.1.d:0 "With the war over, [DDR.GetLeader] and the rest of our leadership have formed a Provisional Government, that will rule Germany until a new Constitution is enacted. Several decrees concerning the nationalisation of land and industries, the supression of fascists and the reorganization of local power structures have already been drafted and stand ready to be enacted by this Provisional Government."
 ddr.1.a:0 "A new time for Germany begins!"
 ddr.2.t:0 "Volksrat Elections Called"
 ddr.2.d:0 "One of the first acts of the Provisional Government has been calling new nation-wide elections to the Volksrat, that will be tasked with writing the new Constitution of Germany. The KPD is hoping to legitimize their rule with this election, while the SAPD, the KPDO and the KAPD see the election as their only chance to oust the KPD and take power for themselves."
 ddr.2.a:0 "How exciting!"
 ddr.3.t:0 "Volksrat Elections: the Voting Method"
 ddr.3.d:0 "Today the Provisional Government has debated the way the next Volksrat elections will work. Some cabinet members of the KPD have proposed an indirect way of voting, where the people would elect their representiatives through local workers' councils, an idea that has found support event among SAPD and KAPD members. Others argue that the Volksrat representatives should be directly elected by the people with a nationwide, proportional system. In private, the SAPD leadership fears that the KPD might have too much control over the workers' councils, so they have come out in favour of this last proposal, along with several KPDO and even KPD members. In the end, the Provisional Government agreed to..."
 ddr.3.a:0 "Indirect voting through Workers' Councils!"
 ddr.3.b:0 "Direct voting is preferable"
 ddr.4.t:0 "Volksrat Elections: Non-Socialist Parties?"
 ddr.4.d:0 "A new debate has arisen inside the Provisional Government, as the issue of non-socialist parties is debated. Zentrumspartei candidates were allowed to participate in our wartime politics in a limited fashion, provided they stood loyal to our government, and some cabinet members want to continue this policy, allowing pre-war Republican parties to be recreated under our tight oversight. Others think that the Zentrum, the SPD and the other pre-war bourgeois parties are traitors, but their ideologies themselves should be allowed, so they could be permitted to stand in the elections under new names. Finally, some KPD politicians argue that this debate is stupìd, and that non-socialist parties should be banned to avoid a repeat of the treason of 1918. What should we do?"
 ddr.4.a:0 "Allow bourgeois parties to reform"
 ddr.4.b:0 "Allow bourgeois parties to exist, under new names!"
 ddr.4.c:0 "Ban non-socialist parties"
 ddr.5.t:0 "Volksrat Elections: Unity List?"
 ddr.5.d:0 "As the Volksrat elections come closer, an incident in Dortmund between KPD and SAPD representatives has worried the Provisional Government, fearing that partisan divisions will provide an opportunity for bourgeois forces to destroy the German Revolution. Thus the KPD has proposed that all legal parties should form a \"Unity List\" or Einheitsliste, that the voters may approve or reject. They argue that this measure would bring unity and strengthen the Revolution, but the horrified SAPD delegates have denounced this proposal as an attempt by the KPD to absorbe all parties, while the KAPD representatives say that there's no point in the election if the voters can only vote for a KPD-majority list. However, some lower-ranking members of the SAPD, the KPDO and the KAPD agree that a Unity List is the best way to preserve the Revolution, while in a similar fashion, some KPD members deem it as unecessary. What should we do?"
 ddr.5.a:0 "Form the \"Unity List\""
 ddr.5.b:0 "Parties will remain separate!"
 ddr.6.t:0 "The Volksrat Election"
 ddr.6.d:0 "Today the elections to the new Volksrat have been held as scheduled. As the Provisional Government decreed a month ago, the vote has been held in an indirect fashion, with the voters electing their representatives through local Workers' Councils. This has caused protests of SAPD candidates in KPD-dominated areas, and likewise some KPD candidates have protested in SAPD or KAPD-dominated councils. Leaving that aside, the vote went through without incidents, and, as the reports arrived in Berlin, a winner has emerged, that will hold a majority in the new Volksrat. That winner is..."
 ddr.6.a:0 "The KPD wins a majority!"
 ddr.6.b:0 "The Opposition (SAPD, KPDO, KAPD) wins a majority!"
 ddr.7.t:0 "The Volksrat Election"
 ddr.7.d:0 "Today the elections to the new Volksrat have been held as scheduled. Due to a Provisional Government decree, all parties allied together in a KPD-dominated \"Unity List\", that the voters could accept or reject. The day went on without major incident, despite some SAPD candidates holding small protests in front of several voting places to denounce the \"KPD Dictatorship\", that were quickly dispersed by Volksarmee units. As the results come in, roughly 85% of the voters have approved the Unity List, with 91% reported turnout. This is a great victory for the Provisional Government and the KPD, who have legitimized their rule in the eyes of the international community and the people. We'll just have to ignore the fraud allegations that are popping up..."
 ddr.7.a:0 "A victory for the German people!"
 ddr.8.t:0 "The Volksrat Election"
 ddr.8.d:0 "Today the elections to the new Volksrat have been held as scheduled. As the Provisional Government agreed, this has been a multiparty election, with direct, proportional and secret voting. The journey went on without incidents, and international observers had to bergrundgingly admit the fact that this has been a clean election, mostly. Now the results are coming in, and clear winner has emerged..."
 ddr.8.a:0 "The KPD wins a majority!"
 ddr.8.b:0 "The Opposition (SAPD, KPDO, KAPD) wins a majority!"
 ddr.9.t:0 "The Volksrat demands the resignation of the Provisional Government!"
 ddr.9.d:0 "Emboldened by their election victory, the Opposition parties (SAPD, KPDO, KAPD) have demanded the resignation of the Provisional Government, as the current Thälmann cabinet \"does not faithfully represent the will of the German people\". Upon learning of this, SAPD and KAPD ministers have resigned and encouraged their KPD counterparts to do the same, however, rumours indicate that Thälmann does not intend to give up the power he worked so hard to have, so the petition will likely be refused."
 ddr.9.a:0 "The Provisional Government resigns as requested"
 ddr.9.b:0 "The Volksrat can go to hell!"
 ddr.10.t:0 "Shootout in Berlin"
 ddr.10.d:0 "When Thälmann refused to resign as the Head of the Provisional Government, both him and the Volksrat planned to get rid of the other by force. Yesterday, at roughly 9:00 PM, a Volsarmee unit of roughly 160 men gathered in the seat of the Provisional Government, the Altes Stadthaus in Berlin. Under direct orders of Ernst Thälmann, they marched to the Landtag building, where the Volksrat was in session, intending to dissolve it by force and arrest the main Opposition leaders. However, they were stopped by a checkpoint near the Mühlendamm bridge, which gave time for informants to warn the Volksrat. The President of the Volksrat, Hans Ziegler, quickly assembled a group of loyal policemen, Volksarmee soldiers and Volksrat security, under the command of war veteran Franz Bobzien, with the intention of repulsing Thälmann's group. With important generals, such as Hans Beimler, out of Berlin, and Berlin commander Hermann Remmele declaring neutrality of all Volksarmee units inside Berlin, the shootout didn't scalate, but it raged on between those loyal to the Volksrat and those loyal to the Provisional Government for all night. Finally, upon dawn, the shootout seemingly stopped as one of the sides raised the white flag. And it was..."
 ddr.10.a:0 "The Volksrat loyalists secure Berlin and dissolve the Provisional Government!"
 ddr.10.b:0 "Thälmann's unit succesfully dissolves the Volksrat and arrests the rebels!"
 ddr.11.t:0 "The New Provisional Government"
 ddr.11.d:0 "After defeating Thälmann's coup attempt, a new Provisional Government has been quickly assembled, that will assume control of Germany until the new Constitution is ready. A coalition of the SAPD, the KPDO and the KAPD, the ideological differences within its ranks will surely pose a problem to the young cabinet, who only cristallized thanks to all 3 parties' opposition to the KPD. As SAPD leader Max Seydewitz takes office as Head of the Provisional Government, the Volksrat begins to prepare the People's Constitutional Congress that will write the new Constitution of Germany, something that will probably exacerbate the rift between the different factions within our government..."
 ddr.11.a:0 "To prosperity and socialism!"
 ddr.12.t:0 "Thälmann's takeover"
 ddr.12.d:0 "With the Volksrat dissolved and many of its members imprisioned, Thälmann's Provisional Government is now secure. He has announced that the Volksrat was planning a capitalist coup with the support of SA and SPD remnants, and that only the bravery of the Volksarmee units deployed in Berlin has prevented a return to 1919, securing the German Revolution once and for all. He also has announced the dissolution of all \"treacherous\" parties (all of them except the KPD) and that new Volksrat elections will be held, this time only with KPD candidates. It seems that the KPD's control over the Revolution is now complete."
 ddr.12.a:0 "The Revolution has been saved!"
 ddr.13.t:0 "The new Provisional Government"
 ddr.13.d:0 "With the Opposition victory in the Volksrat election, the new Provisional Government has been finally assembled today in Berlin. A coalition of the SAPD, the KPDO and the KAPD, the ideological differences within its ranks will surely pose a problem to the young cabinet, who only cristallized thanks to all 3 parties' opposition to the KPD. As SAPD leader Max Seydewitz takes office as Head of the Provisional Government, the Volksrat begins to prepare the People's Constitutional Congress that will write the new Constitution of Germany, something that will probably exacerbate the rift between the different factions within our government..."
 ddr.13.a:0 "To prosperity and socialism!"
 
 ddr.14.t:0 "Preparations for the Volksverfassungskongress"
 ddr.14.d:0 "The revolution has prevailed in Germany! The fascist worker-killers and their bourgeois masters have been forced from power by the People’s Army! Now that we are in control of the nation, and the Provisional Government and the Volksrat are properly established, it is time to prepare for the People’s Constitutional Congress in order to write a socialist constitution for our nation. \n\nFirst, we must go through the delegate selection process. Delegates will come from all revolutionary backgrounds: loyal party members, bureaucrats and local functionaries, soldiers, union representatives, Volksrat deputies, and so forth. After their qualifications have been checked and verified, they will all meet in the old Prussian Landtag in Berlin, the birthplace of the KPD in December 1918. Based on membership statistics produced by the Communist Party, approximately 80% of the delegates will be affiliated with the KPD, with the remaining 20% allocated to other minor parties. Once assembled, they will engage in lengthy debate over the structure and future of Red Germany!"
 ddr.14.a:0 "Three Cheers for the Congress!"
 
 ddr.15.t:0 "The Inaugural Meeting of the Volksverfassungskongress"
 ddr.15.d:0 "As is often the case, there was much excitement in Berlin today as the People’s Constitutional Congress met for the first time. Members of the press, counting legendary KPD columnists, local newsmen from all corners of the nation, Izvestia correspondents, and even members of foreign communist and bourgeois press agencies among them, descended on the delegations as they arrived, seeking to scrape any interview they could. Tomorrow, Berlin papers will print Comrade Kling’s interview with Comrade Carl Ganz, a long-time KPD member representing Hamburg, and L'Humanité will laud the exploits of Berlin representatives Fritz Siedentopf and Robert Uhrig, former soldiers who had fought in the same battalion during the Revolution.\n\n The energy inside the former Landtag - now christened the Rosa-Luxemburg-Haus - matched the commotion outside. As the Guardian reporter will rush to send to his editor, the first day of the Congress was a day of celebration and ceremony. Readers will read of the triumphant singing of \"Die Internationale\", Ernst Thälmann’s address to the Congress, and official greetings from representatives of the Communist Parties of France, Great Britain, Mexico, and the Soviet Union. In the end, newsreaders across the world will know of the unbreakable feeling of optimism shared by the delegates for the future that is to come!"
 ddr.15.a:0 "Welcome to Red Berlin, comrades!"
 
 ddr.16.t:0 "A Revolutionary Political Structure"
 ddr.16.d:0 "After about a month of writing and debate, the Volksverfassungskongress has produced a preamble and the first section of the new constitution, titled the Deutsche Volksverfassung. Though Daily Worker readers might be interested in the full text, we can only provide a summary for you here:\n\n - The name of the country shall be \"die Deutsch Volksrepublik\" (German People’s Republic)\n - The DVR is a revolutionary socialist nation organized on the basis of Marxism-Leninism. The motto \"From each according to his ability, to each according to his needs\" shall form the basis of DVR policy. The objective of the DVR is to achieve the state of Communism as described by Karl Marx. \n - The DVR shall represent the German people in their entirety. There is only one German nationality.\n - Legislative authority shall be vested in the Volksrat, elected on the basis of proportional representation.\n - Governmental authority shall be vested in the Volksratsitzender (People’s Council Chairman) and his Kabinett. The Chairman is to be selected by the People’s Council, who then submits the cabinet to the VR for approval.\n - The executive of the DVR shall be the Republikspräsident, who shall similarly be elected by the People’s Council.\n - The DVR shall be constituted by the Länder, Kreise, and Gemeinde. Each level of government will have the right, responsibility, and power to manage their own affairs.\n - All political bodies shall follow the principles of democratic centralism, whereby all decisions are made by majority vote and are binding on all members of the relevant assembly and those subordinate to it. Dissenters in the decision shall have to abide and act by the majority decision.\n - As the vanguard of the socialist revolution, the Communist Party of Germany, or any other organization determined to be the Communist Party’s legal successor, shall have the first right to form a government and determine the electoral list.\n\n It is the last point that has caused the most controversy in the Congress. Opposition delegates were horrified as the Communist delegates assigned themselves a constitutional monopoly on the state. Yet they could not block the changes, as they are far outnumbered by the Communist delegates."
 ddr.16.a:0 "We stand for the positions of the Communist International!"
 
 ddr.17.t:0 "KAPD Delegates Walk Out"
 ddr.17.d:0 "\"...and therefore, the KAPD delegations have found this process to be counterrevolutionary and bourgeois, and so will withdraw\".\n\nWith these parting words, the Communist Workers’ Party has stormed out of the People’s Constitutional Congress out of protest against Communist Party dominance and the \"Bolshevization\" of the new constitution. According to the KAPD delegates, the institutionalization of democratic centralism and the KPD monopoly of power has led to the degeneration of revolutionary goals to banal opportunism, and thus, the KAPD cannot consider the new constitution legitimate."
 ddr.17.a:0 "This won’t appear in the papers…"
 
 ddr.18.t:0 "From Each According to His Ability…"
 ddr.18.d:0 "After another period of writing, rewriting, and review, the Volksverfassungskongress has produced the next sections of the constitution, relating to the economic structure of the state. To the excitement of Rizospastis and La Verdad readers, we can summarize the sections here:\n\n - The Deutsche Volksrepublik is a socialist country where the economy is designed to serve social justice and national liberation.\n - The state retains the legislative privilege to restructure the economy and take any economic matters into its own hands.\n - The state retains the right to nationalize any enterprise, property, or land without compensation. The state may also transfer any enterprise, property, or land to collective ownership as it sees fit.\n - The state shall have the responsibility of routinely developing and implementing a public plan for the development of the nation. Exact details on this process shall be determined by legislation.\n - Private and non-state collective enterprise shall be tolerated insofar as these enterprises do not hinder the overall goals of the political economy. The state retains the right to further limit these enterprises through legislation.\n - The state has the responsibility to ensure a full welfare state. Unemployment insurance, health insurance, disability insurance, housing, education, electricity, water, childcare, postal services, and public transportation are public goods and therefore their supply shall be only through state enterprises.\n - The state shall be the sole legal agency for foreign trade.\n - Thestate shall be the sole legal agency for the development of defensive equipment."
 ddr.18.a:0 " ...to each according to his need!"
 
 ddr.19.t:0 "Rights and Responsibilities"
 ddr.19.d:0 "All across Germany, Die Rote Fahne has published an article detailing the next report by the Volksverfassungskongress. This time, they have finalized the section of the new constitution regarding the rights and freedoms of German Citizens. These points are plentiful, but they include:\n\n - All citizens have equal rights, freedoms, and responsibilities. A citizen’s rights and freedoms may only be limited by law in case of treason or other relevant felonies.\n - All citizens above the age of 18 may vote, and all citizens above the age of 23 may stand for political office.\n - All citizens have the right to free speech, assembly, privacy, a fair trial, cultural and religious tradition, and movement.\n - All citizens will have the right to receive welfare, housing, education, and employment, though citizens under the age of 17 are prohibited from exploitative labour.\n - All citizens have the right to join and participate in trade union activities. All trade unions and their activities - provided they do not conflict with the criminal code or the constitution - shall be legal.\n - Men and women shall have equal rights and equal pay\n - All citizens are responsible for obeying the criminal code and the constitution, advancing the social good, and defending the nation from imperialist attack.\n - It shall be considered felonious to incite insurrection, treason, national conflict, or social hatred.\n\n These words have been well received across Germany and the foreign socialist press. Communist parties from South America to East Asia are already using our draft constitution as proof of the freedoms guaranteed by Marxism-Leninism, and look to us as model revolutionaries!"
 ddr.19.a:0 "Capitalism is the exploitation of Man by Man. Under Communism, it shall be the other way around!"
 
 ddr.20.t:0 "The Constitution is Complete!"
 ddr.20.d:0 "Today saw the closing ceremony of the Volksverfassungskongress. The Rosa-Luxemburg-Haus was full of joy and song as the new People’s Constitution was declared to be complete. After several months of hard work, writing, rewriting, revisions, and review, the assembly has certified and published the completed constitution, which will face approval by referendum in one month. For now, the delegations gave speeches, interviews, and the conference hall was awash with champagne.\n\nForeign Communist Parties have already begun praising our constitution, calling it a model for future society. Mundo Obrero and New Age readers will read interviews with delegates from Stettin, Baden-Baden, Munich, and even far-off Köningsberg, while the capitalist and fascist press will spin wild stories of church-burning and state abuses, which all Germans will know to be false!"
 ddr.20.a:0 "Forwards, to the Future!"

 ddr.21.t:0 "The Constitutional Referendum Succeeds!"
 ddr.21.d:0 "It has been one month since the end of the Volksverfassungskongress, and the People’s Constitution has been sent for popular consideration by referendum. As expected, the Volksverfassung was overwhelmingly approved by the electorate. With 94% turnout, the constitution passed with 82% votes For, 14% votes Against, and 4% votes discarded due to incorrect markage. Congratulations immediately poured in from the Communist International, most of whom waxed poetic about our accomplishment. On the other hand, Moscow’s reaction was quite concise, but still deeply appreciated.\n\nThough initial council debates have gone well through political reconstruction, clear divisions have appeared in both the Volksrat as they have in the VVK. Though nearly all areas of the constitution and policy were contested in some way or another, the main points of contention have been the economy and foreign policy. Though the constitution makes room for private and non-state collective enterprises, a sizable group within the KPD has come to promote policies which ignore these measures in favor of the mass nationalization of the economy and transition to near-total bureaucratic management on the Soviet model. This group charges that our promotion of economic nationalism - now called the Nationalpolitischeökonomie (National-Political Economy) by commentators  - runs counter to the theories of Marxism-Leninism and should be substituted for a command economy. The majority faction, with Comrade Thälmann’s backing, maintains that our currently planned policies are an acceptable interpretation of Marx and Lenin.\n\nThe second area of controversy concerns our foreign policy. While the overwhelming majority of KPD members support our membership in and alignment with the goals of the Third International, several members question Comrade Thälmann’s close alignment (some would even say subordination) to the interests of the USSR. This faction, which overlaps with the various other factions, believe that the German People’s Republic should assert its position of equality with the USSR given the effort made by German revolutionaries and our demands for the unification of the German Nationality. It is very clear that despite the efforts of our democratic centralist structure, the Party still has a long way to go until we have unity of action…"
 ddr.21.a:0 "Long Live the People’s Constitution!"
 
 ddr.22.t:0 "First Inter-Party Meeting of the United Opposition"
 ddr.22.d:0 "At a joint Party Congress held between the members of the Provisional Government (the SAPD, KPDO and the KAPD), and other opposition groups in the old Glienicke Palace, the KPDO delegation voted to merge into the SAPD. Though such an entry had already occurred in 1932, only now has the merger been formally achieved. Despite the entry of opposition Leninists into the SAPD, the Socialist Workers’ Party decided against rewriting the party platform, already recently rewritten due to the large influx of former members of the SPD’s left factions, citing the meeting’s joint nature to give the opposition’s constitutional platform.\n\n By the end of the three-day event, the Socialist Opposition had agreed to a general framework for the constitution: Germany was to become a multiparty republic on socialist principles, with the social good and a collectivist economic order at the forefront. Other questions are to be resolved in debate with the KPD at the constitutional congress. Now, it falls onto the opposition to oppose the Marxist-Leninists in their attempted takeover, and secure a just constitution for all!"
 ddr.22.a:0 "Hurrah for the United Opposition!"
 
 ddr.23.t:0 "The Inaugural Meeting of the Volksverfassungskongress"
 ddr.23.d:0 "As is often the case, there was much excitement in Berlin today as the People’s Constitutional Congress met for the first time. Members of the press, counting legendary Socialist columnists, local newsmen from all corners of the nation, Izvestia correspondents, and even members of foreign socialist and bourgeois press agencies among them, descended on the delegations as they arrived, seeking to scrape any interview they could. Tomorrow, Berlin papers will print Franz Pfemfert’s interview with Comrade Carl Ganz, a long-time KPD member representing Hamburg, and L'Humanité will laud the exploits of Lübeck representative Herbert Frahm, a soldier who fought against both the Republicans and the Nationalists. Cläre Jung of Berlin will be celebrated in Die Aktion as one of the few women representatives.\n\nThe energy inside the former Landtag - now christened the Rosa-Luxemburg-Haus - matched the commotion outside. As the Guardian reporter will rush to send to his editor, the first day of the Congress was a day of celebration and ceremony. Readers will read of the triumphant singing of \"Die Internationale\", Max Seydewitz’s address to the Congress, and official greetings from representatives of the Communist Parties of France and the Soviet Union, the POUM in Spain, and the Socialist Party of America. In the end, newsreaders across the world will know of the unbreakable feeling of optimism shared by the delegates for the future that is to come!"
 ddr.23.a:0 "Welcome to Red Berlin, comrades!"
 
 ddr.24.t:0 "The First Crossroad"
 ddr.24.d:0 "Over the last twenty days, debate has been lively in the Rosa-Luxemburg-Haus. The delegates have begun with the political structure of the new Germany. So far, the points they have agreed to are:\n\n - The name of the country shall be \" die 'Sozialistische Republik Deutschlands'" (Socialist Republic of Germany)\n - The SRD is a revolutionary socialist nation that works in favor of the social good. The motto "From each according to his ability, to each according to his needs" shall guide SRD policy.\n - Legislative authority shall be vested in the Volksrat, elected on the basis of proportional representation\n - Governmental authority shall be vested in the Volksratsitzender (People’s Council Chairman) and his Kabinett. The Chairman is to be selected by the People’s Council, who then submits the cabinet to the VR for approval.\n - The executive of the SRD shall be the Republikspräsident, who shall similarly be elected by the People’s Council.\n - The SRD shall be constituted by the Länder, Kreise, and Gemeinde. Each level of government will have the right, responsibility, and power to manage their own affairs.\n\n Despite the progress, the exact nature of parliamentarism in the SRD is still being debated. The Leninist factions (KPD and SAPD Left) believe in the establishment of democratic centralism, which would bind all political bodies and their subordinates to the will of the majority. Dissenters would have to abide by the majority’s decision. The other opposition factions oppose this policy as they consider it to be anti-democratic. The KAPD instead propose replacing Gemeinderäte with Arbeiterräte, which would be elected from workplace councils and the general public. In addition, they propose strengthening powers of recall and citizen participation in politics. SAPD delegates are not exactly against these ideas, but there are still a few holdouts. Regardless, the period of debate is over, and it is time to vote."
 ddr.24.a:0 "Long Live the Democratic Vanguard!"
 ddr.24.b:0 "Long Live the Socialist Republic!"
 ddr.24.c:0 "Long Live the Workers’ Councils!"
 
 ddr.25.t:0 "The National Question"
 ddr.25.d:0 "Readers of The Clarion were surprised to learn that a contingent of KPD delegates have introduced a set of resolutions without the consent of the party as a whole. These delegates have come together to propose adding clauses to the people’s constitution that define the Socialist Republic of Germany as a state representing the German nationality. According to these points, there is one indivisible German nationality, represented solely by the SRD. Though many of the delegates are cautiously in favor of Pan-German unification, they regard the KPD proposal as overly nationalist in tone and incompatible with the socialist project. If this proposal goes through, then readers of Kronen Zeitung are sure to get a shock in tomorrow’s paper."
 ddr.25.a:0 "The proposal passes! Long Live Greater Germany!"
 ddr.25.b:0 "Socialists must oppose nationalism at every turn!"
 
 ddr.26.t:0 "The Workers’ Economy"
 ddr.26.d:0 "The Volksverfassungskongress has been abuzz with talk of economics. As Marxists, the delegates generally agree on the purpose of the economy - to advance the social good by overcoming capitalism - but disagree on some minute details. So far, the congress has agreed to the following:\n\n - The Sozialistische Republik Deutschlands is a socialist country where the economy is designed to serve social justice.\n - The state retains the legislative privilege to restructure the economy and take any economic matters into its own hands.\n - The state retains the right to nationalize any enterprise, property, or land without compensation. The state may also transfer any enterprise, property, or land to cooperative ownership or devolve responsibility for them onto regional or local authorities as it sees fit.\n - The state shall have the responsibility of routinely developing and implementing a public plan for the development and well being of the people. Exact details on planning shall be determined by legislation.\n - The state has the responsibility to ensure a full welfare state. Unemployment insurance, health insurance, disability insurance, housing, education, electricity, water, childcare, postal services, and public transportation are public goods and therefore it is the obligation of the state to provide for a high-quality supply.\n - The state shall support cooperative enterprises.\n - Private enterprise shall be tolerated insofar as these enterprises do not hinder the goals of the political economy. The state retains the right to further regulate private enterprise as the material conditions change.\n - The state shall be the sole legal agency for the manufacture of military equipment.\n\nThe delegates have not yet been able to agree on details regarding state-owned enterprises. Leninist delegates argue for state bureaucratic control, arguing that technocrats appointed by a democratic government would be best able to manage state-owned enterprises. Marxist, meaning non-communist, delegates argue for democratic management of state-owned industries, arguing that democratic management protects the workers’ power against bourgeois takeover by preventing the rise of a bureaucratic-managerial class. The Council Communists of the KAPD, though they do support democratic management, instead wish to emphasize the role of local councils in planning, and would like a clause in the constitution to reflect this."
 ddr.26.a:0 "Those who know best should run state enterprises."
 ddr.26.b:0 "The workers can manage state-owned workplaces better than any manager!"
 ddr.26.c:0 "Local councils and democratic management can best oversee the economy."
 
 ddr.27.t:0 "Our Place in the World"
 ddr.27.d:0 "During today's session of the Volksverfassungskongress, a cross-party group of delegates introduced a resolution to establish a neutrality clause in the People’s Constitution. These delegates argue that the Socialist Republic of Germany should declare itself to be entirely neutral to avoid military co-option by imperialist interests. This is opposed by most of the KPD and some of the SAPD, who advocate for a military alliance with the USSR. Other SAPD - and a few KAPD - delegates reject this resolution on the grounds of anti-fascism, arguing that cooperation with other powers is necessary to prevent the expansion of fascist empires."
 ddr.27.a:0 "We will agree to the proposal"
 ddr.27.a:0 "We must leave ourselves diplomatically flexible"
 
 ddr.28.t:0 "Freedom Enjoyed by One and All"
 ddr.28.d:0 "Over the last few weeks, the Volksverfassungskongress has been working on the section on rights and freedoms. Työmies and underground Avante! readers have been excitedly discussing their results, deeming the Volksverfassung to be the most progressive constitution in the world. A summary of the reports published in La Lutte reads as follows:\n\n - All citizens have equal rights, freedoms, and responsibilities. A citizen’s rights and freedoms may only be limited by law in case of treason or other relevant felonies.\n - All citizens above the age of 18 may participate in political life, and all citizens above the age of 23 may stand for political office.\n - All citizens have the right to free speech, assembly, privacy, a fair trial, cultural and religious tradition, and movement.\n - All citizens will have the right to receive welfare, housing, education, and employment, though citizens under the age of 17 are prohibited from exploitative labour.\n - All citizens have the right to join and participate in trade union activities. All trade unions and their activities - provided they do not conflict with the criminal code or the constitution - shall be legal.\n - Men and women shall have equal rights and equal pay\n - All citizens shall receive protection from discrimination based on nationality, sex, age, and creed.\n - All citizens are responsible for obeying the criminal code and the constitution, advancing the social good, and defending the nation from imperialist attack.\n - It shall be considered felonious to incite insurrection, treason, national conflict, or social hatred.\n\nOur efforts have obviously not gone unnoticed. Already, foreign newspapers such as Xinmin Po and even Pravda have praised our work as a model for the entire world!"
 ddr.28.a:0 "Onwards, to the workers’ sunrise!"
 
 ddr.29.t:0 "A Fair Rest for a Long Day’s Work"
 ddr.29.d:0 "The Volksverfassungskongress has ended with much fanfare. As reported in l’Unità and the Socialist Standard, the Rosa-Luxemburg-Haus was alight in song and celebration as the work of writing, reviewing, debating, rewriting, and editing was declared to be complete. Speeches from the KPD Essen delegate Arthur Hammer and pacifist author Heinrich Ströbel closed the session. As it has been previously resolved, the Volksverfassung will go to the public for approval by referendum in one month.\n\nCongratulations nearly immediately poured in from foreign socialist and communist parties. A plethora of positive telegrams came in from workers’ organizations, including the Industrial Workers of the World, the Chinese Communist Party, the Argentine Regional Workers’ Federation, the British Labour Party, the Socialist Workers’ Party of Spain, and even the North African Star. They expressed their congratulations for our achievements, gratitude for our efforts in the wider workers’ movement, and their hopes to replicate our constitution in their own countries."
 ddr.29.a:0 "But first, the referendum!"
 
 ddr.30.t:0 "The Constitutional Referendum"
 ddr.30.d:0 "Today saw a major victory for International Socialism as the People’s Constitution was overwhelmingly approved by the German electorate. With a turnout of 70%, 73% of voters chose to approve the constitution, proving to the world that the workers’ movement is strong and able to appeal to very broad sections of society. As printed in the Sozialistische Arbeiter-Zeitung, today has been declared Constitution Day by the final act of the provisional Volksrat. All people will have the day off to relax and celebrate!"
 ddr.30.a:0 "Hurrah for the Workers of the World! Hurrah for the Socialist Republic of Germany!"
 
