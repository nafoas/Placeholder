 add_5_cteff:0 "Counter-Terrorist Efficiency: §G+5%§!"
 DDR_assasinate_viktor_lutze:0 "Assassinate Viktor Lutze"
 DDR_assasinate_viktor_lutze_desc:0 "Reports indicate that SA leader Viktor Lutze has taken leadership of the terrorist cells of Mecklenburg and Vorpommern. Our agents infiltrated in his circle indicate that he will spend the next 2 weeks in a small house in Rostock, so we will send a specialized Volksarmee detachment to eliminate him and arrest his collaborators."
 DDR_assasinate_erich_koch:0 "Assassinate Erich Koch"
 DDR_assasinate_erich_koch_desc:0 "NSDAP official Erich Koch has reportedly refused to go in exile, and plays an important role in the Nationalist Resistance in East Prussia. Aided by some SA dissidents, our intelligence has tracked him down to a small flat in Königsberg. We shall send a Volksarmee detachment to eliminate him and gather any terrorist plans or intelligence left over in that flat."
 DDR_seize_sa_plans:0 "Seize SA Plans"
 DDR_seize_sa_plans_desc:0 "SA and SS plans for future attacks, weapon stockpile reports and other useful data need to be in our hands. Aided by our infiltrated agents, we shall perform raids all across East Germany to get this intelligence."
 DDR_cut_danzig_route:0 "Cut the Danzig Route"
 DDR_cut_danzig_route_desc:0 "The Nationalist rebels of East Prussia seem to be smuggling weapons and explosives through the Free City of Danzig, where they wield a majority in the Senate. We can't move against Danzig, but we certainly can patrol the Danzig border to ensure it stays closed."
 DDR_reach_out_lithuania:0 "Reach out to Lithuania"
 DDR_reach_out_lithuania_desc:0 "It will be impossible to fully root our the fascists from East Prussia if they can regroup in Memel and smuggle weapons from there. Although the Lithuanian regime is completely unsympathetic to ours, [LIT.GetLeader] should be willing to crack down in the growing NSDAP agitation in Memel, helping us in the process."
 DDR_infiltrate_monarchist_remnants:0 "Infiltrate Monarchist Remnants"
 DDR_infiltrate_monarchist_remnants_desc:0 "Stahlhelm paramilitaries and other monarchist organizations have organized their own terrorist cells to fight against the Revolution. Despite being less powerful than the nazis, they may find more international support, so they must be crushed quickly. In order to do that, we shall infiltrate some loyal agents inside their leadership."
 DDR_assasinate_franz_seldte:0 "Assassinate Franz Seldte"
 DDR_assasinate_franz_seldte_desc:0 "The former leader of the Stahlhelm, Franz Seldte, has reportedly gone into hiding in Saxony. His Stahlhelm cell has caused us a fair amount of troubles, so an operation to eliminate him has been proposed. Our latest intelligence locates him in Chemnitz, so we'll send the Volksarmee and hopefully get rid of this threat."
 DDR_assasinate_theodor_duesterberg:0 "Assassinate Theodor Duesterberg"
 DDR_assasinate_theodor_duesterberg_desc:0 "One of the most important leaders of the Stahlhelm and a Presidential candidate in 1932, Theodor Duesterberg has now reorganized the Stahlhelm in Pomerania, and performed damaging terrorist attacks against our garrisons in the area. An infiltrated agent has given us his present location: a small farm east of Köslin. We need to send the Volksarmee to the farm to eliminate him and gather any intelligence left behind."
 unlock_anti_mon:0 "§YUnlock new Decisions to fight the monarchists remnants§! \n"
 ddr_conservatives_allowed:0 "Decided to allow conservative parties"
 DDR_disrupt_monarchist_recruitment:0 "Disrupt Monarchist Recruitment"
 DDR_disrupt_monarchist_recruitment_desc:0 "The monarchists are seeing great success in their recruitment efforts in Pomerania, Ostmark and Silesia. We need to use the data gathered by our infiltrated agents to disrupt their recruitment networks so that they can't grow their ranks."
 DDR_use_moderate_conservatives:0 "Use Moderate Conservatives"
 DDR_use_moderate_conservatives_desc:0 "The fact that we allowed conservative parties to nominally exist can help us win the propaganda war against the monarchists. However, we must be wary of potential unintended consequences of promoting these parties..."
 DDR_arrest_hans_von_meibom:0 "Arrest Hans von Meibom"
 DDR_arrest_hans_von_meibom_desc:0 "The leader of the DNVP-Stahlhelm resistance cells in Ostmark, Hans von Meibom, is, strangely, a bureaucrat rather than a man of action. We should be able to arrest him in his hideout near Landsberg and interrogate him without needing to eliminate him... for now."
