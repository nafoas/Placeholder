 DDR_nat_resistance_decs:0 "Nationalist Resistance"
 DDR_nat_resistance_decs_desc:0 "Even though the Nationalists have been defeated by our forces during the civil war, many diehard SA and monarchist fanatics have formed terrorist cells across Eastern Germany, seeking to desestabilise the Revolution and reignite the civil war. We need to deploy the Volksarmee and the police to fight these fascist rebels before it's too late! \n\n§GOur Counter-Terrorist Efficiency is: [?DDR_counterterrorist_eff]%§! \n§YOur level of §GCounter-Terrorist Efficiency§! determines the successs chance of our Volksarmee and AFSE Operations against the rebels. Destroying all Nationalist cells will remove the §RNationalist Resistance§! spirit and prevent an §Ruprising§! in the future!§!"
 DDR_infiltrate_SA_remnants:0 "Infiltrate SA Remnants"
 DDR_infiltrate_SA_remnants_desc:0 "SA and SS remnants still fight against our forces, using terrorist to archieve what they couldn't in the battlefields. If we want to effectively crack down on this threat, we need to infiltrate their leadership." 
 unlock_anti_sa:0 "§YUnlock new Decisions to fight the fascist remnants§! \n"
