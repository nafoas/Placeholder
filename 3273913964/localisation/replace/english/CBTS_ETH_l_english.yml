 #events
 ETH_event.1.t:0 "Ethiopia seeks to join the Allies"
 ETH_event.1.d:0 "Ethiopia has approached us asking to join our alliance, now that we are at war with Italy. They offer us their asistance, and only ask Eritrea from the Italians. Should we accept them?"
 ETH_event.1.a:0 "Accept Ethiopia into the Allies"
 ETH_event.1.b:0 "We don't really need them"

 ETH_event.2.t:0 "Britain accepts!"
 ETH_event.2.d:0 "Britain has accepted our request to join their alliance!"
 ETH_event.2.a:0 "We shall take the Italian menace down together!"

 ETH_event.3.t:0 "Britain refuses!"
 ETH_event.3.d:0 "Britain has refused our request to join the Allies for reasons they haven't disclosed to us. What shall we do now?"
 ETH_event.3.a:0 "We can't risk anything without direct support from Britain"
 ETH_event.3.b:0 "We don't need the British!"

 ETH_event.4.t:0 "State Visit to the United States"
 ETH_event.4.d:0 "The United States of America is one of the strongest nations of the World, with hegemony over almost all of the Americas and economic influence over much of Europe. If our plan of modernization and opening of the country is to put in motion, we definitely need good relations with America. Having received the visit of an American representative to His Coronation, our Emperor is willing to return it by sending his son-in-law, Ras Desta Damtew, to meet with representatives of the American government."
 ETH_event.4.a:0 "Onwards to New York!"

 ETH_event.5.t:0 "An Ethiopian Visit!"
 ETH_event.5.d:0 "In 1930, Ras Tafari Makonnen was crowned Negusa Nagast - Emperor - Haile Selassie I of Ethiopia, following the death of his cousin, Empress Zewditu, who himself had been regent of. As it was expected, the United States sent a representative to the Coronation. Haile Selassie wants to return the visit by sending his son-in-law, Ras Desta Damtew in a diplomatic visit to the USA. He's expected to arrive in New York in a few days and meet with our representatives there."
 ETH_event.5.a:0 "The President himself will receive the Prince!"

 ETH_event.6.t:0 "Relations with Ethiopia?"
 ETH_event.6.d:0 "Despite the distance, Switzerland and Ethiopia have had cordial relations ever since Ethiopia consolidated as a nation, with a Swiss being one of the main players behind the construction of the Djibouti-Addis Abeba Railway. Now, the chance to sign a Friendship and Trade Agreement has been presented to us, this will improve our relations with Ethiopia!"
 ETH_event.6.a:0 "Long live our friends in Ethiopia!"

 ETH_event.7.t:0 "Agreement Signed!"
 ETH_event.7.d:0 "We have signed a Friendship and Trade treaty with Switzerland!"
 ETH_event.7.a:0 "Great!"

 ETH_event.8.t:0 "Relations with Ethiopia"
 ETH_event.8.d:0 "Despite the geographical situation of both nations, Ethiopia and Czechoslovakia have a history of good relations, starting in the late 1700s and continuing with the establishment of the Czechoslovak nation after the Great War. Now we have the opportunity to sign a formal Agreement with them, and this could benefit both of our nations, especially our investors in Ethiopia."
 ETH_event.8.a:0 "Of course!"

 ETH_event.9.t:0 "Agreement Signed!"
 ETH_event.9.d:0 "We have signed a Friendship and Trade treaty with Czechoslovakia!"
 ETH_event.9.a:0 "Great!"

 ETH_event.10.t:0 "Sell guns to Ethiopia?"
 ETH_event.10.d:0 "The Ethiopians have expressed their admiration for our armament industry, and have now approached one of our firearm producers with the intention of buying some guns for their Empire in Africa. Currently we don't need the guns, and the Ethiopians only intend to buy a small amount of them, but we might need those guns later. What should we do with this?"
 ETH_event.10.a:0 "We will go forward with the deal"
 ETH_event.10.b:0 "We might need those guns later, stop the shipment!"

 ETH_event.11.t:0 "Czechoslovakia sold us the guns!"
 ETH_event.11.d:0 "The Czechoslovak company has  agreed to the deal and we will receive their guns for our army."
 ETH_event.11.a:0 "Great!"

 ETH_event.12.t:0 "Czechoslovakia has stopped the deal!"
 ETH_event.12.d:0 "Despite the deal seemingly going well, with our representatives contacting the Czechoslovak company, the government of Czechoslovakia has stopped the deal from taking place for reasons unknown, although the most likely explanation is that they want to use the guns for their own army. Whatever is the case, this will be an obstacle to our modernization of the army."
 ETH_event.12.a:0 "This is a black day for the Czechoslovak-Ethiopian relations"

 ETH_event.13.t:0 "A Consulate in Japan"
 ETH_event.13.d:0 "For about three decades we have had good relations with our friends in Japan, giving and receiving official visits and exchanging our cultures, and we consider them a possible ally for the future. As a sign of friendship, we will open a honorary consulate in Osaka, to establish a more permanent relation between our countries."
 ETH_event.13.a:0 "Long live our Japanese Friends!"

 ETH_event.14.t:0 "An Ethiopian Consulate in Osaka"
 ETH_event.14.d:0 "For about three decades we have had good relations with our friends in Ethiopia, giving and receiving official visits and exchanging our cultures, and we consider them a possible ally for the future. As a sign of friendship, the Ethiopians will open a honorary consulate in Osaka, to establish a more permanent relation between our countries."
 ETH_event.14.a:0 "Long live our Ethiopian Friends!"

 ETH_event.15.t:0 "Japanese Government Visit"
 ETH_event.15.d:0 "The Japanese Government has sent Tsuchida Yukata for a tour around Ethiopia, as a sign of good relations between our two countries. Yukata arrived earlier this year at Djibouti and has now arrived to Addis Abeba through the railway that connects both places."
 ETH_event.15.a:0 "We welcome our Japanese friends!"

 ETH_event.16.t:0 "An Embassy in Turkey"
 ETH_event.16.d:0 "Our relations with Turkey have been good since the Ottoman times, despite some historical conflict between our country and their vassals in the region. This is however now history, and relations have improved considerably with the new Republic in Ankara. As Turkey has set an embassy a few years ago, we want to return the favor by opening our own embassy in Turkey."
 ETH_event.16.a:0 "Long live our Turkish Friends!"

 ETH_event.17.t:0 "An Ethiopian Embassy"
 ETH_event.17.d:0 "Our relations with Ethiopia have been good since the times of the Sultanate, despite some historical conflict between their country and our vassals in the region. This is however now history, and relations have improved considerably with the African empire. As we have already set an embassy in Ethiopia a few years ago, the Ethiopians want to return the favor by opening their own embassy in Ankara."
 ETH_event.17.a:0 "Long live our Ethiopian Friends!"

 ETH_event.18.t:0 "An Embassy in Greece"
 ETH_event.18.d:0 "We have enjoyed good relations with the Mediterranean country since 1917 with the opening of a Greek consulate in our country, however, a lot of Greeks have assisted our country as part of the Imperial court. As a natural progression of our relations, we want to upgrade our consulate in Athens to a proper Embassy."
 ETH_event.18.a:0 "Long live our Greek Friends!"

 ETH_event.19.t:0 "An Ethiopian Embassy"
 ETH_event.19.d:0 "We have enjoyed good relations with the African country since 1917 with the opening of our consulate in Ethiopia, however, a lot of Greeks have assisted Ethiopia as part of the Imperial court. As a natural progression of our relations, they want to upgrade their consulate in Athens to a proper Embassy."
 ETH_event.19.a:0 "Long live our Ethiopian Friends!"

 ETH_event.20.t:0 "An offer from John Robinson"
 ETH_event.20.d:0 "John Charles Robinson is an African-American aviator and a supporter of freedom for the African Colonies. Given the current situation in his home country, where African-Americans don't have the same opportunities in the armed forces due to racial discrimination, Robinson has expressed his willingness to support our country against Italy in the current crisis, and has offered us to join our air forces. Dr. Melaku Bayen, a cousin of the Emperor, met with him, and Robinson is now waiting for an official invitation to Ethiopia. He would certainly prove to be a valuable asset and in these times of conflict we can use whatever help we want."
 ETH_event.20.a:0 "Offer him the position of Chief of Army!"
 ETH_event.20.b:0 "Let him fly a plane, we will take care of the rest"


 ETH_ace_Robinson_tooltip:0 "§CJohn Robinson will also be available as an ace§!"

 lost_eritrea:0 "Has lost control of Eritrea for a substantial amount of time."

 #Abyssinia Crisis Event Chain

 Wal_Wal_Incident:0 "Walwal Incident"
 Wal_Wal_War:0 "Italian Invasion of Ethiopia"

 abyssinia_crisis.1.t:0 "The Walwal Incident"
 abyssinia_crisis.1.d:0 "Last November, our forces were scouting out borders in the Ogaden, when we found an Italian fort built at the oasis of Walwal, which is rightful Ethiopian territory. We politely asked them to leave, but when we returned the next day in a joint Anglo-Ethiopian commission, the Italians had already brought more troops to reinforce the zone. While the British chose to withdraw from the zone to avoid an international incident, our forces stayed in the place guargin the region. Yesterday however, a skirmish occured between our forces and the Italian garrison, without a clear winner. It is clear that this action was staged by Italy and it wouldn't be the first time Italy tried to attack our nation. He will stand against any Italian aggression."
 abyssinia_crisis.1.a:0 "We condemn the Italian aggression on Ethiopia!"

 abyssinia_crisis.2.t:0 "The Walwal Incident"
 abyssinia_crisis.2.d:0 "In 1930, our troops built a fort in the Walwal Oasis, situated in the frontier region between Somaliland and Ethiopia. The borders in that region are not clear, but it's very likely that Walwal is actually in our territory. Nevertheless, a few days ago an Ethiopian armed force arrived at the fort and demanded us to leave. Our troops stayed, and after some days, a skirmish occured, with no clear winner. This is a perfect chance to blame the Ethiopians for this aggression, and this a very good opportunity to obtain concessions from Ethiopia or even justify a war against their \"Empire\" and integrate them into our Colonial Empire in East Africa." 
 abyssinia_crisis.2.a:0 "Of course we will not attack Ethiopia... but prepare the troops just in case..."
 abyssinia_crisis.2.b:0 "Retreat from the Region, this is not the time to invade."

 abyssinia_crisis.3.t:0 "Peace has been achieved!"
 abyssinia_crisis.3.d:0 "After our request of Italian retreat, the Italians have complied and they completely tetreated from our border, guaranteeing our independence at the League of Nations."
 abyssinia_crisis.3.a:0 "Great!"

 abyssinia_crisis.4.t:0 "Italy builds up its forces"
 abyssinia_crisis.4.d:0 "Italy has denied any aggression towards our nation, however, in the last month we have seen a considerable build up of their armed forces in our frontier, a possible indication of a future Italian invasion to our country. These are very likely the intentions of the Italian dictator Benito Mussolini, and we need to make sure the international community knows of their intents."
 abyssinia_crisis.4.a:0 "The Italians need to stop this aggression."

 abyssinia_crisis.5.t:0 "The Abyssinia Crisis"
 abyssinia_crisis.5.d:0 "It is now of public knowledge that Ethiopia and Italy are at each other throats after the Walwal Incident. What is not clear though, is whether war will break out or not. The public opinion in our nation seems to be steering towards Ethiopia, however, we have to think of the whole picture. Germany is proving to be a potential threat, showing intentions to rearm itself and take control of their former territories, which includes the Alsace-Lorraine region that we regained with the Treaty of Versailles. Italy has shown their discontent with a possible German annexation of Austria, since they consider Austria to be part of their sphere of influence. We might be able to ally Italy against Germany, and that would require a no-involvement policy regarding Ethiopia. What shall we do?"
 abyssinia_crisis.5.a:0 "Germany is the bigger threat, we must be friendly to Italy"
 abyssinia_crisis.5.b:0 "We need to help Ethiopia against the Fascist invasion!" 

 abyssinia_crisis.6.t:0 "The Abyssinia Crisis"
 abyssinia_crisis.6.d:0 "It is now of public knowledge that Ethiopia and Italy are at each other throats after the Walwal Incident. What is not clear though, is whether war will break out or not. The public opinion in our nation seems to be steering towards Ethiopia, and we'll have to make a choice. While at war with Italy over Ethiopia is unthinkable, aiding Ethiopia against the Fascist menace is something we must consider. We can send supplies and weapons to the Ethiopians in order to help them against Italy. "
 abyssinia_crisis.6.a:0 "Ethiopia is not our concern - It's just Colonialism"
 abyssinia_crisis.6.b:0 "We need to help Ethiopia against the Fascist invasion"

 abyssinia_crisis.7.t:0 "France won't interfere"
 abyssinia_crisis.7.d:0 "The French diplomats have approached us and, despite their dislike of our plans in Ethiopia, assured us that the French Republic won't interfere in our matters in Ethiopia. It seems they hope to collaborate with us against Germany."
 abyssinia_crisis.7.a:0 "This is great"

 abyssinia_crisis.8.t:0 "France helps Ethiopia"
 abyssinia_crisis.8.d:0 "France has issued a formal declaration condemning our actions in Ethiopia, and is now sending aid to the country in case of a war between Ethiopia and Italy."
 abyssinia_crisis.8.a:0 "Damn the French"

 abyssinia_crisis.9.t:0 "[From.GetNameDef] sends aid!"
 abyssinia_crisis.9.d:0 "In response to the recent events that have involved our country and the Italians, [From.GetNameDef] has decided to aid us with material support for us to use in case of a war with Italy."
 abyssinia_crisis.9.a:0 "Thanks!"

 abyssinia_crisis.10.t:0 "Send aid to Ethiopia?"
 abyssinia_crisis.10.d:0 "Ethiopia and Italy are currently in a diplomatic confrontation over a border conflict in Somalia. Italy has previously tried to undermine our influence in Austria, rightful German land. We could help Ethiopia in order to delay the Italian actions in Central Europe and gain some precious time to bring the Central European nations closer into our sphere."
 abyssinia_crisis.10.a:0 "Italy should be stopped"
 abyssinia_crisis.10.b:0 "It's not worth it"

 abyssinia_crisis.11.t:0 "The Wal-Wal Crisis"
 abyssinia_crisis.11.d:0 "It's of public knowledge the current standoff in East Africa between the Empire of Ethiopia and the Kingdom of Italy over a skirmish in the town of Wal-Wal. Given how Ethiopia is taking this issue to the League of Nations, we have the duty to intervene... somehow."
 abyssinia_crisis.11.a:0 "We will send Anthony Eden to mediate a solution"
 abyssinia_crisis.11.b:0 "This is our chance to stand against fascist imperialism!"

 abyssinia_crisis.12.t:0 "The United Kingdom sends a mediator"
 abyssinia_crisis.12.d:0 "Anthony Eden, a British politician, has arrived as part of a mediating commission sent by the British Government to stop the current crisis over Ethiopia. While it's a noble attempt by Britain to end this conflict, it's obvious that we will not accept any mediation over it. The fact that the British wanted to mediate and did not take action against us proves that they do not want to antagonize us, and we can capitalize on that in order to secure our control over East Africa."
 abyssinia_crisis.12.a:0 "This is nonsense"

 abyssinia_crisis.14.t:0 "Italy rejects our mediation"
 abyssinia_crisis.14.d:0 "Italy has rejected our offers of mediation, which is not really unexpected coming from a fascist dictatorship. Given how this has failed, we can resort to other types of intervention, like restricting the arms trade into Italy and Ethiopia, hoping that will discourage them from engaging in an armed conflict. Some question the fairness of this measure, citing how Ethiopia has an almost non existant capaity to produce any weapons while Italy is fairly developed, but we don't want to alienate the Italians to much and therefore the arms embargo shall be put on both nations."
 abyssinia_crisis.14.a:0 "The embargo is the right thing to do"

 abyssinia_crisis.15.t:0 "Britain puts an arms embargo on us"
 abyssinia_crisis.15.d:0 "It's clear that Britain has been very ambiguous on whether they will help us against Italy or not, with resorting to just send a (failed) mediation. Now they are imposing an arms embargo on us, something that will clearly harm our capacity of mobilization should we have to in order to defend from Italy. Hoping they will reason, we will now send a formal request to Britain asking them to lift the embargo, hoping they will reason and favor us."
 abyssinia_crisis.15.a:0 "Let's hope they accept"

 abyssinia_crisis.17.t:0 "Ethiopia request the embargo to be lifted"
 abyssinia_crisis.17.d:0 "Ethiopia has approached us and requested our government to lift the arms embargo that we currently impose on them and on Italy. While many argue that we shouldn't alienate Ethiopia against a clearly superior opponent, and a totalitarian one, the truth is that Italy might prove useful as an ally in the future, so it would be sensible to keep them as happy as possible."
 abyssinia_crisis.17.a:0 "We can't risk our relations with the Italians"
 abyssinia_crisis.17.b:0 "Lift the Embargo!"

 abyssinia_crisis.16.t:0 "Britain embargoes us"
 abyssinia_crisis.16.d:0 "Britain has announced an arms embargo on our nation after the ongoing crisis in Ethiopia. While this will barely affect our capacity of production, it does mark a sore spot in our relations with the United Kingdom."
 abyssinia_crisis.16.a:0 "At least they are not intervening against us"

 abyssinia_crisis.18.t:0 "Britain rejects our petition"
 abyssinia_crisis.18.d:0 "The United Kingdom has expressed their will to keep the current embargo going, despite the clear disadvantage it gives us against Italy."
 abyssinia_crisis.18.a:0 "We can't trust the British"

 abyssinia_crisis.19.t:0 "Brtiain lifts the Embargo!"
 abyssinia_crisis.19.d:0 "Britain has accepted our request and will lift the embargo on us later this week. This means we will have a better chance at preparing for a possible war against Italy, should that happen."
 abyssinia_crisis.19.a:0 "Good news!"

 abyssinia_crisis.20.t:0 "Send aid to Ethiopia?"
 abyssinia_crisis.20.d:0 "After having lifted the Embargo on Ethiopia, some people are advocating for us to send aid in the form of weapons and supplies to Ethiopia."
 abyssinia_crisis.20.a:0 "We will send aid!"
 abyssinia_crisis.20.b:0 "It's not a good idea"

 abyssinia_crisis.21.t:0 "Britain sides with us!"
 abyssinia_crisis.21.d:0 "Britain has announced they stand against Italy in the ongoing crisis between our countries, and that they will help us should Italy decide to invade our country at any time."
 abyssinia_crisis.21.a:0 "Good news!"

 abyssinia_crisis.22.t:0 "Britain sides with Ethiopia!"
 abyssinia_crisis.22.d:0 "Britain has announced they stand against us in the ongoing crisis between us and Ethiopia, and that they will help them should us decide to invade their country at any time. This is certainly not good news, although most predict Britain wouldn't actuallt declare war. Still, it's a risk."
 abyssinia_crisis.22.a:0 "Damn the British!"

 abyssinia_crisis.23.t:0 "Put an arms embargo on Italy?"
 abyssinia_crisis.23.d:0 "There have been suggestions to put an arms embargo on Italy in order to stop them from arming too much."
 abyssinia_crisis.23.a:0 "Embargo them!"

 abyssinia_crisis.24.t:0 "The invasion of Ethiopia!"
 abyssinia_crisis.24.d:0 "The day has come. Today, Italy will start to gain the greatness promised to us 20 years ago, when we joined the Great War by request of the treacherous Entente, who promised us a great empire while selling our lands to the enemy. Ethiopia will be the first step towards the rebirth of the Roman Empire under Il Duce."
 abyssinia_crisis.24.a:0 "Avanti!"

 abyssinia_crisis.25.t:0 "Propose a pact?"
 abyssinia_crisis.25.d:0 "With the ongoing invasion of Abyssinia by Italian forces, our government together with the British have designed a peace treaty for Italy that would stop the war while still giving Italy control of Ethiopia, albeit not directly. While this might not be very popular, it would be a good compromise, should Italy accept. The treaty will give Italy direct control of the Ogaden and Tigray, while awarding Ethiopia with an outlet to the Red Sea through the port of Assab in Eritrea."
 abyssinia_crisis.25.a:0 "Sounds like a good plan. Send it to the British!"
 abyssinia_crisis.25.b:0 "We can't betray Ethiopia"

 abyssinia_crisis.26.t:0 "Propose a pact?"
 abyssinia_crisis.26.d:0 "With the ongoing invasion of Abyssinia by Italian forces, our government together with the French have designed a peace treaty for Italy that would stop the war while still giving Italy control of Ethiopia, albeit not directly. While this might not be very popular, it would be a good compromise, should Italy accept. The treaty will give Italy direct control of the Ogaden and Tigray, while awarding Ethiopia with an outlet to the Red Sea through the port of Assab in Eritrea. The French have already approved the treaty, should we do so too, they will send it to Mussolini for reviewing."
 abyssinia_crisis.26.a:0 "Sounds like a good plan. Send it to Mussolini!"
 abyssinia_crisis.26.b:0 "We can't betray Ethiopia"

 abyssinia_crisis.27.t:0 "The Hoare-Laval Pact"
 abyssinia_crisis.27.d:0 "The French and British governments have approached us with a peace proposal to stop the current war in Ethiopia. While it's certain that we'll win anyway, this pact would increase our relations with them, and it would award us with economic control over all of Ethiopia without much bloodloss form either side."
 abyssinia_crisis.27.a:0 "We accept, sign the treaty!"
 abyssinia_crisis.27.b:0 "We'll think about it..."
 
 abyssinia_crisis.28.t:0 "The Hoare-Laval Pact"
 abyssinia_crisis.28.d:0 "The British, French and Italians have agreed to a peace treaty regarding the war. This treaty would make us a protectorate of the Italians, while giving them land in the Ogaden and the Tigray, in exchange for a port in Assab. While it's an outrageous treaty, it might be the only way to keep at least some independence."
 abyssinia_crisis.28.a:0 "It's the only way..."
 abyssinia_crisis.28.b:0 "We won't give up our sovereignty!"

 abyssinia_crisis.29.t:0 "The Hoare-Laval Pact"
 abyssinia_crisis.29.d:0 "Today the French press has made public an agreement between France and the United Kingdom and to be signed by Italy where they clearly give away our sovereingty in order to stop the ongoing war. This was highly unpopular in France and Britain and it had a huge backlash against their governments. Italy on the other hand, has chosen to remain silent about the issue, and Italian operations continue as normal on our front."
 abyssinia_crisis.29.a:0 "Outrageous!"

 abyssinia_crisis.38.t:0 "Ethiopia Rejects Peace!"
 abyssinia_crisis.38.d:0 "The Ethiopian Government has rejected our humble peace proposal, declaring they wouldn't submit to any sort of European control, total or partial. This only legitimizes our campaign and helps us paint the Ethiopians as warmongers and rejecters of civilization."
 abyssinia_crisis.38.a:0 "Fools"

 HOARE_LAVAL_PACT_SIGNED:0 "Hoare-Laval Pact Signed"

 #news events

 abyssinia_crisis.30.t:0 "The Walwal Crisis"
 abyssinia_crisis.30.d:0 "Ethiopia is the only nation to have survived the Scramble for Africa 30 years ago, managing to maintain its independence after the battle of Adwa, having defeated the Italians.\n\n However, earlier this week, Italian and Ethiopians have clashed in the oasis town of Walwal, in the frontier between Ethiopia and Italian Somalia. The Ethiopians were acompanied by a British reconnaisance company surveying the borders when they encountered the Italians camping at the town, considered by the Ethiopians to be within their borders. The Ethiopians stood their place, and the following day, fire rained between both sides, uncertain of who started it. Both sides are denouncing the aggression upon each other, and it's uncertain what the outcome of this will be."
 abyssinia_crisis.30.a:0 "Worrying"

 abyssinia_crisis.31.t:0 "Peace at Walwal"
 abyssinia_crisis.31.d:0 "After the Walwal incident between Ethiopia and Italy, there has been a lot of uncertainty around Ethiopia. Yesterday, however, Italy has announced their retreat from the area, and officially apologized for the incident, although they did not recognize having started the bullet exchange. It seems that Ethiopia will remain independent."
 abyssinia_crisis.31.a:0 "Peace has been achieved"

 abyssinia_crisis.32.t:0 "Hoare-Laval Pact Signed"
 abyssinia_crisis.32.d:0 "As the Second Italo-Ethiopian War raged on, British politician Samuel Hoare and French politician Pierre Laval have presented Italian leader Benito Mussolini with a plan to end the conflict. The peace treaty, recently approved by Mussolini, and reluctantly approved by Ethiopia, makes Ethiopia an Italian protectorate. It also provides Ethiopia with an outlet to the Red Sea, in exchange for ceding parts of the Southeast and North to Italian hands. This treaty effectively ends the war in the Horn of Africa, but if the peace will last remains to be seen."
 abyssinia_crisis.32.a:0 "Peace at last"

 abyssinia_crisis.33.t:0 "The Second Italo-Ethiopian War"
 abyssinia_crisis.33.d:0 "Despite some efforts from the League of Nations to de-escalate the crisis, the Italians have launched a full invasion of Ethiopia. This time, the tech difference between both countries is far greater than the first war, and most predict a sounding defeat of the Ethiopian forces."
 abyssinia_crisis.33.a:0 "Farewell, Ethiopia"
 abyssinia_crisis.33.b:0 "Fascism will prevail"

 abyssinia_crisis.34.t:0 "Hoare-Laval Pact Made Public"
 abyssinia_crisis.34.d:0 "Earlier today, the press has made public a secret plan by French and British politicians Pierre Laval and Samuel Hoare where they appeased the Fascist regime in Italy. The plan has received harsh critics and both Hoare and Laval have taken a strong hit on their public images, especially since Italy has remained silent so far."
 abyssinia_crisis.34.a:0 "Outrageous"

 abyssinia_crisis.35.t:0 "The end of the Second Italo-Ethiopian War"
 abyssinia_crisis.35.d:0 "Unlike the first war, the Italians have proved successfull in their invasion of Ethiopia, the last independent African nation, and a former member of the League of Nations. The Ethiopian Emperor, Haile Selassie I, has gone into exile, while parts of the Imperial army continue operating as guerrilla fighters despite the claims of pacification by the Italian authorities. The country has been incorporated into Italian East Africa, and the King of Italy has been named Emperor of Abyssinia."
 abyssinia_crisis.35.a:0 "Concerning"
 abyssinia_crisis.35.b:0 "Fascism stands tall!"

 abyssinia_crisis.36.t:0 "Peace with Ethiopia"
 abyssinia_crisis.36.d:0 "With our failure to conquer Ethiopia, the Abyssinian government has signed a white peace with our commanders in East Africa, putting an end to our planned conquest of the Colony. This is a national disgrace, as we have failed twice now to conquer the African country."
 abyssinia_crisis.36.a:0 "Unbelievable!"

 abyssinia_crisis.37.t:0 "Defeat in East Africa!"
 abyssinia_crisis.37.d:0 "With the fall of Asmara and Mogadiscio, the our commanders in East Africa have surrendered to Ethiopian forces. The Ethiopians have taken land from us in Eritrea and retreated from Somaliland, leaving us in international shame for loosing land to an African country. What will happen in Italy as the news of this embarassing defeat are made public, is yet to be known."
 abyssinia_crisis.37.a:0 "This is a tragedy!"

