 ETH_asserting_control:0 "Asserting Control"
 ETH_asserting_control_desc:0 "Since Haile Selassie's Coronation in 1930, he has done everything he could to assert his power all over our Nation. We must keep doing this, for our work it's not done yet."
 ETH_national_army_project:0 "National Army Project"
 ETH_national_army_project_desc:0 "DESCRIPTION"
 ETH_Holeta_military_school:0 "Start a Military School in Holeta"
 ETH_Holeta_military_school_desc:0 "The independence of our country is at stake, we need to be prepared to defend it."
 wal_wal:0 "§YThe Wal Wal Incident has happened§!"
 ETH_integrate_jimma:0 "Integrate the Former Kingdom of Jimma"
 ETH_integrate_jimma_desc:0 "In 1932, we sent a military campaign to secure the Kingdom of Jimma under our Nation. We must extend our control and effectively integrate them to the Empire."
 ETH_centralization_efforts_in_the_south:0 "Southern Centralization Efforts"
 ETH_centralization_efforts_in_the_south_desc:0 "The South of our Country is the most diverse part of it, and so we must start centralization efforts in the zone to link them more tightly to Addis Ababa"
 ETH_developing_the_country:0 "Developing the Country"
 ETH_developing_the_country_desc:0 "Since its Coronation and even with Emperor Menelik II before him, Haile Selassie has put special emphasis in the modernization of our Country. Those efforts need to be maintained in order to keep advancing."
 ETH_enforce_new_judicial_system:0 "Enforce the New Judicial System"
 ETH_enforce_new_judicial_system_desc:0 "With inspiration from Western Powers, we recently reformed our Judicial System, but we still need to make sure it is respected throughout the entire Country."
 ETH_maintain_modern_prisons:0 "Maintain Modern Prisons"
 ETH_maintain_modern_prisons_desc:0 "Along with the Judicial renovation, we opened a new prison in Addis Abeba, and we seek to maintain it from now on, and even build more in the future."
 ETH_issue_ceremonial_currency:0 "Issue Ceremonial Currency"
 ETH_issue_ceremonial_currency_desc:0 "Let's issue a 2-talari Ceremonial note in honor of the Imperial Couple!"
 ETH_encourage_talari_note:0 "Encourage Usage of the Talari Note"
 ETH_encourage_talari_note_desc:0 "Now that Ethiopia has its own National Currency, it must be used in the whole Country."
 ETH_scout:0 "Open a Scout School"
 ETH_scout_desc:0 "The Ethiopia Scout Association has been in the country since 1919, and now we can open a school for new scouts to be formed."
 ETH_church:0 "Build a Church in the Capital"
 ETH_church_desc:0 "DESCRIPTION"
 ETH_foreign_relations:0 "Foreign Relations"
 ETH_foreign_relations_desc:0 "Establishing good Relations with foreign powers is a good way of asserting our position in the international stage. Thankfully, we already have some precedents for them, but it's good to renew them from time to time and reach new deals."
 ETH_foreign_relations_tooltip:0 "§CWe will be able to start relations with countries from around the world.§!"
 ETH_western_relations:0 "Relations with the West"
 ETH_western_relations_desc:0 "It's very important to have stable relations with the Superpowers of the World, which, at least for now, are in the West. There we go!"
 ETH_western_relations_tooltip:0 "§CWe'll approach various nations of Europe and the Americas for new relations and agreements§!"
 ETH_eastern_focus:0 "Eastern Focus"
 ETH_eastern_focus_desc:0 "We already estsablished relations with the Japanese in the East, and it's on our plans to continue this incursion to the East!"
 ETH_eastern_focus_tooltip:0 "§CWe'll establish cordial relations with countries of the Eastern Hemisphere§!"
 ETH_agreement_with_czechoslovakia:0 "Trade Agreement with Czechoslovakia"
 ETH_agreement_with_czechoslovakia_desc:0 "The Czechoslovaks have shown interest in relations with our Country ever since the times of Habsburg Bohemia, and now they approach us with trade agreements. We can formally get to an accord with them."
 ETH_buy_czech_guns:0 "Buy Czech Guns"
 ETH_buy_czech_guns_desc:0 "In our trips to Czechoslovakia, we have contacted with armament companies and they have shown interest in supplying us with guns for our army, and this is a chance we must not let pass."
 ETH_buy_czech_guns_tooltip:0 "If the Czechoslovaks accept, we will get the following:"
 

 ETH_state_visit_to_USA:0 "State Visit to the USA"
 ETH_state_visit_to_USA_desc:0 "Our Prince has expressed his wishes of visiting the United States, and this could be a good opportunity to strengthen our relations with America."
 ETH_agreement_with_the_swiss:0 "Agreement with Switzerland"
 ETH_agreement_with_the_swiss_desc:0 "Despite the distance, Switzerland and Ethiopia have had cordial relations ever since Ethiopia consolidated as a nation, with a Swiss being one of the main players behind the construction of the Djibouti-Addis Abeba Railway. Now, the chance to sign a Friendship and Trade Agreement has been presented to us, this will improve our relations with Switzerland!"
 ETH_purchase_planes:0 "Purchase Planes"
 ETH_purchase_planes_desc:0 "Part of Haile Selassie's plans include taking Ethiopia to the airs, by developing the Ethiopian Air Forces. However, we don't have the resources to produce aircraft, and so we should consider adquiring planes from the exterior."
 ETH_anglo_american_dam_proposal:0 "Anglo-American Dam Proposal"
 ETH_anglo_american_dam_proposal_desc:0 "The British, Egyptians and Americans are interested in investing in our section of the Nile River. They propose"
 ETH_upgrade_to_embassy:0 "Set Up an Embassy in Greece"
 ETH_upgrade_to_embassy_desc:0 "Continuing with our diplomatic adventures in Europe, we want to updgrade the current consulate in Athens to a proper Embassy, solidifying our relations with the Mediterranean Country."
 ETH_japanese_consulate:0 "Consulate in Japan"
 ETH_japanese_consulate_desc:0 "Our relations with the Empire in the East have been getting better and better. It's time to open a Consulate in the Empire of Japan."
 ETH_japanese_visit:0 "Japanese State Visit"
 ETH_japanese_visit_desc:0 "A Japanese Diplomatic Team will travel to our country, in a sign of the strength of our Friendship."
 ETH_embassy_in_turkey:0 "Open an Embassy in Turkey"
 ETH_embassy_in_turkey_desc:0 "We have decided to open a new Embassy in the Republic of Turkey, in order to help our compatriots in the Asian Nation."
 ETH_visit_Jerusalem:0 "Visit Jerusalem"
 ETH_visit_Jerusalem_desc:0 "The Queen will visit the land of our Emperor's ancestor, the King Solomon!"



