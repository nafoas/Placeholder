l_english:
 ETH_feudal_society:0 "Feudal Society"
 ETH_feudal_society_desc:0 "Although our Emperor has started reform efforts, Ethiopia still keeps old signs of feudalism to this day, with many local chiefs still holding some power. The prime example of this is the Sultanate of Aussa to our East, which has proven to be a pain to us during the Italo-Ethiopian War. "
 ETH_looming_colonialism:0 "Looming Colonialism"
 ETH_looming_colonialism_desc:0 "Ethiopia is the last country to remain free from European hands, but this isn't a guarantee that this will continue forever. We need to assert our independence and be prepared to defend it."
 ETH_constitution:0 "1931 Constitution"
 ETH_constitution_desc:0 "Current Emperor Haile Selassie sanctioned our Constitution, becoming one of the first monarchs in History to do so voluntarily. Now Ethiopia has a Chamber of Senators and a Chamber of Deputies, who represent the people."
 ETH_illiterate:0 "Illiterate Population"
 ETH_illiterate_desc:0 "The vast majority of our population is illiterate, not knowing how to read or write, and living from their crops and animals. This badly affects our capacity to make technological and administrative advancements."

