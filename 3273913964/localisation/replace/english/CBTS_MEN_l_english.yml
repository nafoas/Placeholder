 mengjiang.4.t:0 "The 2nd Mongol Conference"
 mengjiang.4.d:0 "With the conquest of Guisui and Baotou the Kwantung Army has proposed to hold a second Mongol Conference to formalize the establishment of our Inner Mongolian Puppet. The Mongol Military Government will be replaced by The Mongol United Autonomous Government, Prince Yondonwangchug will be the new Chairman and Prince Demchugdongrub will be vicechairman.\nGuisi (now renamed to Houhehaote) will become the new capital of the State."
 mengjiang.4.a:0 "Okay"