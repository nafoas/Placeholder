 mengjiang.1.t:0 "Demchugdongrub made Chairman"
 mengjiang.1.d:0 "Following the surprising death of Chairman Yondonwangchug, the prince Demchugdongrub has been declared the new Chairman of our government."
 mengjiang.1.a:0 "Rest in Peace"

 mengjiang.2.t:0 "The Chanan Autonomous Government"
 mengjiang.2.d:0 "With the conquest of the ethnic-Mongolian lands in Northern China, many have proposed officially conceding the land to our allies in Chahaer. Many feel the land would be better administered under the Mongol government."
 mengjiang.2.a:0 "Ok"

