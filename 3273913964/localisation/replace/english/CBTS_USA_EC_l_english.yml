 ##Events
 us_camp.2.t:0 "Election Campaign: The New Deal"
 us_camp.2.d:0 "As the campaign progresses, one of the biggest issues that is being discussed is the New Deal programs and their future. What can you say to those concerned with New Deal programs such as the WPA or the CCC?"
 us_camp.2.a:0 "I will do everything I can to expand these programs further!"
 us_camp.2.b:0 "I believe in the programs currently in place, but I don't support their expansion."
 us_camp.2.c:0 "The New Deal is a threat to freedom, and it must be dismantled!"
 
 us_camp.3.t:0 "Election Campaign: Social Security"
 us_camp.3.d:0 "As the campaign progresses, one of the biggest issues that is being discussed is Social Security and its future. What can you say about the current status of Social Security, and if it has reached its objectives?"
 us_camp.3.a:0 "Social Security is a too limited program right now. We have to be more ambitious!"
 us_camp.3.b:0 "I support Social Security, as it has been a clear success."
 us_camp.3.c:0 "How can we support these program!? It undermines prosperity with abusive taxes!"
 
 us_camp.4.t:0 "Election Campaign: High Income Tax Rates"
 us_camp.4.d:0 "As the campaign progresses, one of the biggest issues that is being discussed is taxes, specially the recently increased high-income tax rates. What can you say to those that raise concerns about these increases?"
 us_camp.4.a:0 "These taxes are necessary for the prosperity of the average American."
 us_camp.4.b:0 "In the middle of a crisis, it had to be done, as a one-time thing."
 us_camp.4.c:0 "We agree. We support economic freedom and low taxes across the board."
 
 us_camp.5.t:0 "Election Campaign: Housing"
 us_camp.5.d:0 "As the campaign progresses, one of the biggest issues that is being discussed is housing, specially with the big slums that are so common in today's America. What can you say to those who demand a stronger action in this area?"
 us_camp.5.a:0 "We need to build federal housing to get rid of the slums."
 us_camp.5.b:0 "I think encouraging private house building is an acceptable compromise."
 us_camp.5.c:0 "I'm confident that the market will eventually solve this issue on its own."
 
 us_camp.6.t:0 "Election Campaign: Collective Bargaining"
 us_camp.6.d:0 "As the campaign progresses, one of the biggest issues that is being discussed is the right of collective bargaining, a long-time demand of labor unions. What can you say to those who want to end this right, or, as they call it, \"privilege\"?"
 us_camp.6.a:0 "I strongly support labor unions and collective bargaining."
 us_camp.6.b:0 "We have to ensure that this right doesn't damage the economy, but I'm not opposed to it."
 us_camp.6.c:0 "Collective bargaining is a socialist policy that must be repealed!"
 
 us_camp.7.t:0 "Election Campaign: Minimum Wage"
 us_camp.7.d:0 "As the campaign progresses, one of the biggest issues that is being discussed is the idea of a minimum wage, a long-time demand of labor unions. What can you say to those that are campaigning in favor of this policy? Is the economy ready to sustain it?"
 us_camp.7.a:0 "A minimum wage will ensure that hardworking Americans get their fair share."
 us_camp.7.b:0 "Once the economy rebounds a bit more, I would be open to this idea."
 us_camp.7.c:0 "This would just destroy American businesses. I'm opposed to the minimum wage."
 
 us_camp.8.t:0 "Election Campaign: the AAA"
 us_camp.8.d:0 "As the campaign progresses, one of the biggest issues that is being discussed is the Agricultural Adjustment Administration and its policy to increase crop prices. What can you say to those that are concerned about the legality of the AAA's policies?"
 us_camp.8.a:0 "The AAA has doubled the average income of farmers. It is a clear success."
 us_camp.8.b:0 "If the Supreme Court deems it constitutional, we shall respect the AAA."
 us_camp.8.c:0 "The AAA is unconstitutional and it must be disbanded inmediately!"
 
 us_camp.9.t:0 "Election Campaign: the RA"
 us_camp.9.d:0 "As the campaign progresses, one of the biggest issues that is being discussed is the Resettlement Administration and its policies. What can you say to those who oppose the settlement of poor rural and urban families in their states?"
 us_camp.9.a:0 "The RA has been managed soundly, and it is fulfilling its goal nicely."
 us_camp.9.b:0 "I'm a bit concerned with the management of the RA, not with its concept per se."
 us_camp.9.c:0 "We can't support an agency that relocates people in poorly-managed camps."
 
 us_camp.10.t:0 "Election Campaign: Segregation in New Deal programs"
 us_camp.10.d:0 "As the campaign progresses, one of the biggest issues that is being discussed is the segregation that currently exists in the implementation of many New Deal programs. What can you say to those who are voicing their support for fully integrated relief efforts?"
 us_camp.10.a:0 "We have to be committed to the prosperity of all our citizens, no matter their race."
 us_camp.10.b:0 "I will reach out to unions and states to find a solution that pleases everyone."
 us_camp.10.c:0 "Like society in general, these programs need to be segregated to function properly."
 
 us_camp.11.t:0 "Election Campaign: Anti-Lynching legislation"
 us_camp.11.d:0 "As the campaign progresses, one of the biggest issues that is being discussed is anti-lynching legislation, and the many proposals that have been made to tackle this issue. What can you say to those who are demanding concrete and decisive action on the issue of lynching, and its implications on race relations?"
 us_camp.11.a:0 "I promise to write and pass a comprehensive anti-lynching bill as soon as I can."
 us_camp.11.b:0 "If we want this to get passed, we'll need to compromise with the Southerners."
 us_camp.11.c:0 "I'm completely opposed to federal interference on local law enforcement."