 france_parliament_desc:0 "In France, from 1875 to 1940 under the Third Republic , the Chamber of Deputies was the name carried by the legislative assembly elected by universal suffrage . When the latter, accompanied by the Senate , was assembled in Versailles (forming the National Assembly ) it proceeded to the election of the President of the Republic . \n\n§YRuling Coalition Seats:§! [?colseat]/§C[?total_seats]§! \n\n[FRA_yes_no_vote]\n\n[FRA_communist_seats_1][FRA_demsoc_seats_1][FRA_socdem_seats_1][FRA_soclib_seats_1][FRA_marlib_seats_1][FRA_centre_seats_1][FRA_cons_seats_1][FRA_aut_seats_1][FRA_mon_seats_1][FRA_nat_seats_1][FRA_fas_seats_1][FRA_senate_mayority_1][FRA_senate_vote]"
