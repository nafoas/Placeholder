 france.31.t:0 "Invitation to Bloc d'Or"
 france.31.d:0 "France has send us an invitation to join an economic group called Bloc d'Or, the objective of the Block is to be able to recover from the Great Depression while also being able to keep the Gold Standard, which is has being abandoned by many countries like the United States or the British. We don't really know the implications of joining this bloc, some members of parliament have called the government to refuse the invitation to what they call \"a clear attempt by the french to put our country under their sphere of influence\" and \"french economic imperialism\"."
 france.31.c:0 "Sure"
 france.31.b:0 "We are not interested"
 france.32.t:0 "[From.GetNameDef] has joined Bloc d'Or"
 france.32.d:0 "[From.GetName] has informed us that they have decided to join the Bloc d'Or, this will bring further benefits for them and us!"
 france.32.a:0 "Excellent."
 france.33.t:0 "[From.GetNameDef] Rejects our Invitation"
 france.33.d:0 "[From.GetName] has inform us that they have rejected our offer of joining the Bloc d'Or, citing that 'the Gold Standard is an antiquated in the modern economy' and that ''"
 france.33.a:0 "What a shame."
 france.34.t:0 "[From.GetNameDef] has left Bloc d'Or"
 france.34.d:0 "Recently the [From.GetAdjective] government has inform us that they have decided to take the steps for abandoning the Gold Standard, and by consequence the Bloc d'Or. They expressed their desire to continue to doing business with us and hope that this decision doesn't affect our relations in a negative way."
 france.34.a:0 "Farewell then."
 france.35.t:0 "Bloc d'Or has been disbanded"
 france.35.w:0 "In consequence of recent diplomatic developments, those ones being a war between members of the Block, many members have left after following this incident and it's remaining members have decided to disolve the Bloc d'Or in it's entirely."
 france.35.f:0 "France has announced the dissolvement of the Bloc d'Or, this after the French government decided to abandon the Gold Standard and devaluate the Franc (the French currency) after much economic pressure to do. It has been considered as 'the best thing the French nation can do for it's people'."
 france.35.n:0 "The Bloc has been disolve by France after the lack of participation of other countries, and by lack of participation we mean that nobody is in the Block but us, so we might as well dismantle this farce already."
 france.35.a:0 "It wasn't meant to last..."
 france.36.t:0 "France wants to join the Allies"
 france.36.d:0 "The world is growing increasingly unsafe. Britain and France remain bastions of democracy and liberty in Europe and France now propose that they join the Allies.\nHow should we reply?"
 france.36.a:0 "Yes"
 france.36.b:0 "No"
 france.37.t:0 "Britain accepts ally request"
 france.37.d:0 "'History has shown how much can be accomplished when our great nations stand side by side. In the spirit of the Entente Cordiale, we are proud to welcome you not only as friends, but as Allies. Together we will be a shining beacon of liberty in a world encroached by the darkness of oppression!'\n\nOur request to join Britain as Allies has been accepted. We can count on their full support in the turbulent times ahead."
 france.37.a:0 "Together we will hold the line!"
 france.38.t:0 "Britain denies ally request"
 france.38.d:0 "'While we have enjoyed good relations in the past, we cannot risk an escalation of the conflicts across the channel. Germany has earned our trust in the honoring of our Naval Pact, and while we will defend ourselves should the fires spread we will not risk fanning the flames. Peace must always be the goal of any democratic nation.'\n\nOur request to join Britain as Allies has been denied. The British government is unwilling to antagonize Germany further, and will not jeopardize the current peace."
 france.38.a:0 "Their 'peace' is just another word for 'surrender'"
 france.39.t:0 "France Proposes a Treaty of Mutual Assistance"
 france.39.d:0 "The [FRA.GetAdjective] foreign ministry has proposed a treaty of mutual guarantees to us. Under this treaty, both [From.GetNameDef] and [This.GetNameDef] would be required to come to the other's aid if either of us is attacked. Of course, this treaty is directed mostly towards Germany, but applies to all foreign aggressors. Should we sign this treaty?"
 france.39.a:0 "We can trust the French."
 france.39.b:0 "No, it will only benifit them."
 france.40.t:0 "The Soviets have accepted the Treaty"
 france.40.d:0 "Our bilateral defensive pact with [From.GetNameDef] has been approved by both parties. From now on, if any power should attack either of our nations unprovoked, they will be met by the combined forces of the USSR and [From.GetNameDef]!"
 france.40.a:0 "Excellent!"
 france.41.t:0 "The Soviets rejected the Treaty"
 france.41.d:0 "Representatives from the [From.GetNameDef] have refused cooperation with our military on the grounds that they \"do not wish to exacerbate any tensions in Europe\". Should either of our nations be attacked, they will have to deal with the aggressors on their own."
 france.41.a:0 "Fine, we don't need them."
 france.42.t:0 "Protest French diplomatic action?"
 france.42.da:0 "The French have recently been trying to antagonize the Germans, underminding our efforts to appease them, should we issue a formal protest?"
 france.42.db:0 "The French have recently been trying to use their political weight to support the Republican side in the Spanish Conflict, underminding our efforts of neutrality, should we issue a formal protest?"
 france.42.a:0 "Warn them."
 france.42.b:0 "We can't risk breaking our friendship"
 france.43.t:0 "The British issue a protest"
 france.43.d:0 "In consequence of our recent Anti-Fascist diplomatic efforts, the British have send us a diplomatic request to stop what we are doing as that is underminding their efforts of keeping peace in the continent, should we stop and comply with the request?"
 france.43.a:0 "It might be for the best"
 france.43.b:0 "We refuse to stand and watch how fascism grows!"
 france.44.t:0 "France refuses to backdown!"
 france.44.d:0 "The French have send us a reply, telling us that they wont let fascism grow any longer and that they will proceed as they were. Do we proceed to break relations?"
 france.44.a:0 "Screw those frenchmen!"
 france.44.b:0 "We can't afford to lose our closet ally."
 france.45.t:0 "[From.GetNameDef] has broken relations with us!"
 france.45.d:0 "After much debate within their government, it appears that Britain has decided to break relations with us!"
 france.45.a:0 "Damn, i didn't see that coming."
 france.46.t:0 "[From.GetNameDef] has backdown"
 france.46.d:0 "After some deliberacy, the [From.GetAdjective] has decided to backdown from their demands to stop what we are doing, this will certainly rise stability in our coalition."
 france.46.a:0 "That's good to hear"
 france.47.d:0 "After some discussion within their ranks, it seems the [From.GetAdjective] government has retracted their declarations and accepted our request to stop disturbing the peace in Europe."
 france.48.t:0 "[From.GetNameDef] has approach us with an offer."
 france.48.d:0 "France ask us to stop intervening in spanish affairs to perserve the 'peace' in Europe and added that if we do, they would do the same. Should we accept?"
 france.48.a:0 "Sure thing."
 france.48.b:0 "We are definitely not interested."
 france.50.t:0 "[From.GetNameDef] has declined our offer"
 france.50.d:0 "[From.GetAdjective] diplomats have inform us that they won't accept our request and refused our fair deal, we wont expect they will accept any other deal."
 france.50.a:0 "A shame."
 france.49.t:0 "[From.GetNameDef] has accepted our offer"
 france.49.d:0 "Our diplomats have inform us that we were able to reach a deal with [From.GetNameDef], after much effort we were abled to covince them that this was for the greater good and the best for both of our nations."
 france.49.a:0 "Excellent work."
 france.51.d:0 "France has offered a deal of disarmament, they ask of us to stop rearmament of our armies and they would do the same in exchange, they said this was 'the best for our great nations' and 'to keep the peace in the continent'. How should we reply?"
 france.54.t:0 "Failure at the London Coference"
 france.54.d:0 "The London Economic Conference took place a few days ago and the result... Well they were not satisfactory to say the least. We were hoping that the United State would come to their senses and try to help Europe and stabilize the exchange rates on the Franc, but shortly after the conferences began, [USA.GetLeader] rejected the deal, destroying our hopes of stabilizing our currency."
 france.54.a:0 "A pitty."
 france.55.t:0 "[FRA.GetNameDef] has proposed a deal"
 france.55.d:0 "France has approach us with an interesting proposition, they would be willing to let us rearm ourselves and prepare for war, in exchange for us signing an Non-aggression pact with them. This could mean further cooperation down the line, should we accept this deal?"
 france.55.a:0 "It's an offer..."
 france.55.b:0 "...we can refuse actually."
 france.56.t:0 "Germany said yes!"
 france.56.d:0 "We have received word from our diplomats that Germany has accepted the deal and they are looking forward to keep working with us."
 france.56.a:0 "Fantastic news!"
 france.57.t:0 "Germany has refused our deal"
 france.57.d:0 "[From.GetAdjective] diplomats have informed us that the terms of the deal are 'unsatisfactory' and they were unwilling to reach a compromise between the two nations."
 france.57.a:0 "Fine, so that's how it is then."
 france.58.t:0 "France ask us to give military access to [GRM.GetNameDef]"
 france.58.d:0 "The [From.GetAdjective] have approach us in behalf of Germany and said that they wanted us to agreed to allowed the movement of [GRM.GetAdjective] troops in our soil, with the pretext of 'Protecting Europe from the menace of Bolshevism'. What should we said about this proposition?"
 france.58.a:0 "It might be beneficial for our security."
 france.58.b:0 "Reject those [GRM.GetNameDef] puppets!"
 france.59.t:0 "[From.GetNameDef] has allowed the passing of troops"
 france.59.d:0 "After some negotiations from part of France, we have managed to convince the poles to allow troop movement within their borders, making us able to protect Europe from the Bolshevik menace."
 france.59.a:0 "Excellent News"
 france.60.t:0 "Poland has said no to a the French offer."
 france.60.d:0 "France approached the Poles a few days ago and delivered what we belived was a sweet deal, we asked them to allow German troops to enter Polish land to defend Europe from the Red menace, they rejected saying that the french were a 'German puppet' and they didn't want to worry about foreign troops being in their borders."
 france.60.a:0 "They are losing an opportunity here."
 france.61.t:0 "France offer us an Non-aggression pact"
 france.61.d:0 "As they did with our friends in Berlin, French diplomats have approach us to offer us an Non-aggression pact, and to prepare ourselves to fight against the Red Bear in Russia. What do we say to this?"
 france.61.a:0 "Sure, that sounds good!"
 france.61.b:0 "Tell them that we are not interested."
 france.64.t:0 "[From.GetNameDef] offer us mutual guarantees"
 france.64.a:0 "Sounds pretty good"
 france.64.b:0 "We are not interested"
 france.65.t:0 "[From.GetNameDef] has accepted!"
 france.65.a:0 "Let's hear it for our [From.GetAdjective] friends!"
 france.66.t:0 "[From.GetNameDef] has said no to guarantees"
 france.66.a:0 "That's too bad."

 france.200.t:0 "Zéro de Conduite"
 france.200.d:0 "Director Jean Vigo has premiered his latest film at the Cinema Artistic, an anti-authoritarian piece titled 'Zéro de Conduite'. Taking place at a fictional boarding school in France, the film focuses on a group of boys who plot against the teachers and eventually break out into open rebellion. Shocking scenes involved children yelling 'Liberty or death', 'War is declared! Down with monitors and punishment!' and have already drawn strong criticism from audiences across the nation. Many are calling for the film to be censored or outright banned from being shown."
 france.200.a:0 "A dangerous time to release this film."
 france.201.t:0 "Neosocialists excluded from the SFIO"
 france.201.d:0 "Following heated debates at the XXXth Congress of the SFIO after an attack by the “Participationist” right wing of the party against the party’s orthodoxy. For three days, Déat and his clique attacked Leon Blum and the rest of the party over what he sees as political immobilism, claiming that the party has failed to adapt to modern times. Instead, Déat has called for a Socialism of Action, a Néo-Socialism. His plan would be to take inspiration from Roosevelt and Mussolini so as to attract the middle class, with Adrien Marquet loudly proclaiming “Order, Authority, Nation” to be the new order of the day. Blum and other leaders within the SFIO have explicitly expressed their disgust at the Neosocialists’ ideas, leading to a scission during the Congress which was confirmed later by an internal vote inside the party which excluded the Reformist wing."
 france.201.a:0 "Intriguing."
 france.203.t:0 "The formation of the USR"
 france.203.d:0 "Finding themselves weak and divided as they’re being squeezed by the SFIO from the left and the Radicals from the right, various independent socialists as well as minor Social Democratic parties have fused together in the Socialist-Republican Union. Among those parties you find the traditional Republican Socialist parties such as the PSF and the PRS. But it also includes a newcomer in the form of the Neosocialist PSdF. While the new party is unlikely to get in power, this union will definitely allow the Social Democrats to have a bigger say in a potential popular front."
 france.203.a:0 "The political stage has shifted."
 france.204.t:0 "The formation of the PPF"
 france.204.d:0 "In June 1936 Jacque Doriot, former member of the Communist Party’s central committee excluded for arguing in favor of an alliance with the SFIO, announced the creation of the French Popular Party. Using a mix of leftist revolutionary and nationalist anti-parliamentary rethorics, Doriot and his party have amassed a following from both disgruntled members of the Communist Party and former members of the now dissolved far right leagues. Ironically enough, the party has taken a hard anti-communist and anti-socialist stance, calling for an alliance against the Leftist parties and Liberal Parlimentarism. While Doriot plays the card of confusionism, it is fairly clear from all observers that it is closer to fascism than anything else."
 france.204.a:0 "A new player in the political ring."
 france.205.t:0 "Dissention in the Radical Party"
 france.205.d:0 "Since the fall of Chautemps’ government, dissension within the Radical Party and its allied groups have grown. The new de facto leader of the Party, Edouard Daladier, finds himself struggling more and more to keep his party afloat as it hemorrhage from both its left and right, strengthening the AD and the Republican-Socialists"
 france.205.a:0 "Oh no."
 
 france.300.t:0 "AD - Deciding our coalition partner"
 france.300.d:0 "Debates are heating up within the Democratic Alliance as the 1936 elections approach. More of an electoral alliance than an actual party, as the name would imply, the AD is suffering from the polarisation of politics as the left wing of the party, led by Flandin,consider the alliance to be 'Left Republican' and thus Centrist while the right wing, led by Paul Reynaud, argues for deeper ties with the conservative Republican Federation, possibly up to a fusion and the creation of a 'French Tory Party'. The Alliance now finds itself at a crossroad which could very well change the face of French politics for years to come."
 france.300.a:0 "Go for a 'Left Republican' alliance with the radicals."
 france.300.b:0 "Let's work torwards a 'Tory Party'."
 france.301.t:0 "SFIO - Should we work with the Radicals?"
 france.301.d:0 "The SFIO has since the Great War held to the party line of not entering 'Bourgeois Governments', forcing them to stay on the sidelines of parliamentary politics despite electoral victories. However, recent international examples and the 1934 crisis have shown that the risk of a Fascist takeover might be very real. Thus, the following question has been debated at the latest party congress, should we put aside our revolutionary principles and ally the Radicals in an attempt to take power away from the fascist brutes?"
 france.301.a:0 "Working together will improve the life of the proletarian."
 france.301.b:0 "We have no need of those Bourgeoisie."
 france.302.t:0 "The Popular Front takes the elections"
 france.302.d:0 "The results of the election have come in, and they are decisive! The left’s desire to unite into a “Front Populaire” has yielded spectacular results. This leftist alliance between the SFIC, SFIO, Radicals, and other minor leftist parties has won a majority of 63% in the Chambre des Députés. The reduction of leftist infighting and increased public concern over the rise of the far right undoubtedly fueled this Popular Front victory.\n\nIn a surprising upset, however, it is the socialist SFIO, rather than the more moderate Radicals, that won the most seats and will thus be leading the governing coalition. They have elected Léon Blum, a longtime leader in the French left, to the Prime Ministership. He is the first Jew to hold the office, which has incensed some on the far right. Popular Front voters celebrate and eagerly await the promised pro-worker change, while the disempowered right warns of a communist takeover…"
 france.302.a:0 "Tout est possible!"
 france.303.t:0 "The Democratic Alliance wins the elections"
 france.303.d:0 ""
 france.303.a:0 "Time to get to work."

