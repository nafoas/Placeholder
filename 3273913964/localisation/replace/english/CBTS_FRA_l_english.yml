 FRA_maginot_line_construction:0 "Construction of the Maginot Line"
 FRA_maginot_line_construction_desc:0 "The Maginot Line, still under construction, is the height of French Military thinking and a reflection of the scars of the Great War. The French Army has always assumed that any conflict with Germany will result in La Guerre De Longue Durée (The War of the Long Duration) or in another words, a war of attrition. The Maginot Line was constructed along this line of thought and, aside from a few radicals, this thought remains prevalent amongst the high command. As a result, the French military isn't particularly flexible..."
 FRA_The_Great_War:0 "Scars of the Great War"
 FRA_The_Great_War_desc:0 "4 years of brutal and unrelenting warfare racked the north French countryside and the minds of the French people from 1914 to 1918. 1,377,000 French soldiers died in the protection of the country. It drove a deep scar into the nation, making the people vow, never again would they fight. The toll of horror began to impact France even before the end of the war when, in 1917, many soldiers began to mutiny. As 1933 begins, many French citizens still keep their promise to never again take up arms."
 FRA_maginot_line:0 "The Maginot Line"
 FRA_maginot_line_desc:0 "The Maginot Line, now finished, is the height of French Military thinking and a reflection of the scars of the Great War. The French Army has always assumed that any conflict with Germany will result in La Guerre De Longue Durée (The War of the Long Duration) or in another words, a war of attrition. The Maginot Line was constructed along this line of thought and, aside from a few radicals, this thought remains prevalent amongst the high command. As a result, the French military isn't particularly flexible…"
 FRA_maginot_line_expand:0 "Reinforcing the Northern Maginot Line"
 FRA_alpine_line_build: "Expanding the Alpine part of the Maginot Line"
 FRA_colonial_imports:0 "Colonial Trade Deficit"
 FRA_colonial_imports_desc:0 "Since this crisis began, our exports to the colonies have drastically grown. and imports from them have only shrunk. This is a strain on our economy and must be recitified."
