 FRA_marine_nationale:0 "La Marine Nationale"
 FRA_marine_nationale_desc:0 "The French Navy is in a good state. We have been able to surpass the Regia Marina, and despite the restrictions imposed on us by the Treaty of Washington, our naval designers have been to create faster and stronger ships that are the envy of the world. Let us continue strengthening our navy!"
 FRA_richelieu_fast_battleships:0 "Richelieu Fast Battleships"
 FRA_richelieu_fast_battleships_desc:0 "With Germany posturing menacingly, we must improve the Dunkerke-class fast battleships, but adding more powerful guns and armor to protect them. Fast Battleships are our future!"
 FRA_mogador_class_destroyers:0 "Mogador Class Destroyers"
 FRA_mogador_class_destroyers_desc:0 "The La Fantasque-Class destroyers have been a great success, with an unmatched speed that will give them an edge on the seas. We should improve their design to create new, modern destroyers that can properly scort our fast battleships."
 FRA_cemm_darlan:0 "CEMM: François Darlan"
 FRA_cemm_darlan_desc:0 "With Durand-Viel stepping down as Chef d'État-Major de la Marine (Chief of the Navy's General Staff, CEMM), Admiral François Darlan shall serve as his replacement. Despite being critisized because of the political nature of his promotions, his undeniable talent and ambition will take the Marine to new heights!"
 FRA_rivaling_british_navy:0 "Rival the British Navy"
 FRA_rivaling_british_navy_desc:0 "Britain has been pressuring us to downsize the navy since the Great War, arguing that the Royal Navy suffices in the case of another conflict in Europe. We need to show them that France is a strong independent power with a strong independent navy!"
 FRA_alsace_fast_battleships:0 "Alsace-Class Fast Battleships"
 FRA_alsace_fast_battleships_desc:0 "After the Dunkerke and the Richelieu classes, it's time for a new generation of fast battleships. The new Alsace Class will have stronger guns, a more powerful engine and a more solid armor to defeat the Germans, the Italians and anyone who dare oppose us!"
 FRA_les_amis_de_darlan:0 "\"Les Amis de Darlan\""
 FRA_les_amis_de_darlan_desc:0 ""
 FRA_expand_ecole_naval:0 "Expand the École Navale"
 FRA_expand_ecole_naval_desc:0 "By expanding the École Navale we can ensure the French Navy has a steady supply of well trained officers, ready to put their life on the line for France."
 FRA_order_more_ships:0 "Order More Ships"
 FRA_order_more_ships_desc:0 "A world power needs a world class navy, and a world class navy needs a lot of ships. Thus, even a monkey can figure out that for France to rule the seas, we need to put our dockyards to work, and  order more ships."
 FRA_navy_worthy_great_power:0 "A Navy Worthy of a Great Power"
 FRA_navy_worthy_great_power_desc:0 "Thanks to the efforts of Admiral Darlan, the French navy finally possesses a size and power that is worthy of our republic. No longer will France play second fiddle to the British, to the Americans, or to anyone for that matter. France will rule the seas, and it will rule it alone."
 FRA_cemm_esteva:0 "CEMM: Jean-Pierre Esteva"
 FRA_cemm_esteva_desc:0 "With Durand-Viel stepping down as Chef d'État-Major de la Marine (Chief of the Navy's General Staff, CEMM), it has been decided that Admiral Jean-Pierre Esteva will replace him. A loyal and excellent officer, Esteva has a distinguished record and will serve France well as the new Chief of the Navy."
 FRA_keep_up_times:0 "Keeping Up With the Times"
 FRA_keep_up_times_desc:0 "We cannot compete with the other naval powers of the world simply by building more ships, or making bigger guns. We must study and adapt modern naval doctrines if we are to ever hope of fielding a powerful navy. "
 FRA_aereonavale:0 "L'Aéreonavale"
 FRA_aereonavale_desc:0 "Use of aircraft in naval settings is becoming more and more prominent as of late. In order to maintain our competitiveness, we must invest resources into naval aviation."
 FRA_develop_skip_bombing:0 "Develop Skip-Bombing Tactics"
 FRA_develop_skip_bombing_desc:0 "Skip bombing involves flying a bomber aircraft at low altitude, dropping a bomb, and skipping it across the water like a stone until it reaches its unfortunate target. It is an excellent way to accurately attack ships with unguided bombs without having to rely on more expensive and slower torpedoes."
 FRA_joffre_class_carriers:0 "Joffre-Class Carriers"
 FRA_joffre_class_carriers_desc:0 "Our single current aircraft carrier, Béarn is a converted battleship and is woefully outclassed by modern aircraft carriers. The Joffre-class carrier is a new domestic design created to replace the venerable Béarn and give us a leg up in naval aviation."
 FRA_promote_jean_de_laborde:0 "Promote Jean de Laborde"
 FRA_promote_jean_de_laborde_desc:0 ""
 FRA_a_new_navy:0 "Une Nouvelle Marine"
 FRA_a_new_navy_desc:0 "The current French Navy is a relic from a past age, when massive dreadnoughts with equally massive cannons ruled the seas. Well, no longer. Submarines and aircraft carriers have proliferated, and naval aviation has advanced. If we hope to keep up, then we must do away with the old, and revolutionize the French Navy."
 FRA_expand_naval_budget:0 "Increase the Naval Budget"
 FRA_expand_naval_budget_desc:0 "Our current naval budget is completely inadequate if we are to maintain a modern and powerful navy. Let us increase it so we can proceed with our process of naval reform in a speedy and competent fashion."
 FRA_expand_toulon:0 "Expand the Toulon Naval Base"
 FRA_expand_toulon_desc:0 "Established as a military port in the 16th century AD, the Toulon Naval Base has long served has long served France. Expanding it will ensure it continues to do so."
 FRA_expand_brest:0 "Expand the Brest Naval Base"
 FRA_expand_brest_desc:0 "Located on the tip of Brittany, the Brest Arsenal is the keystone to maintaining naval superiority in the Atlantic. Letting it fall into decay would be a grievous error."
 FRA_invest_fcm:0 "Invest in FCM"
 FRA_invest_fcm_desc:0 ""
 FRA_year_naval_expansion:0 "[GetYear] Naval Expansion Plan"
 FRA_year_naval_expansion_desc:0 "The [GetYear] Naval Expansion Plan will hopefully lead to the exponential growth of our naval forces, and will make prospective enemies think twice before the challenge us on the high seas."
 FRA_rescue_acf:0 "Rescue ACF"
 FRA_rescue_acf_desc:0 ""
 FRA_invest_nantes_shipyards:0 "Fund the Nantes Shipyards"
 FRA_invest_nantes_shipyards_desc:0 "The traditional capital of Brittany, Nantes possesses one of the largest sets of shipyards in France. Thus, as a part of our naval expansion program, we will provide funds to the shipyards to ensure they can continue to function nominally, and also to possible expand them."
 FRA_bypass_washington_treaty:0 "Bypassing the Washington Restrictions"
 FRA_bypass_washington_treaty_desc:0 "The Washington restrictions are nothing but a hindrance to our defense efforts. Clearly no other country pays much attention to them, so why should we?"
 FRA_minerve_class_subs:0 "Aurore-Class Submarines"
 FRA_minerve_class_subs_desc:0 "Aurore-class submarines are a class of costal submarine. It is small and maneuverable with a surface speed of 15 knots and a submerged speed of 9 knots and is armed with a grand total of 9 torpedo tubes."
 FRA_continue_super_destroyers:0 "Continue Building Super-Destroyers"
 FRA_continue_super_destroyers_desc:0 "The Le Fantasque-class “super destroyer” has been a resounding success! However, our current force of super destroyers is rather small. Laying down more ships will help bolster our forces and ensure that the super destroyer can make a difference."
 FRA_la_fier_torpedo_boats:0 "La Fier-Class Torpedo Boats"
 FRA_la_fier_torpedo_boats_desc:0 "La Fier-Class Torpedo Boats are a series of sea going torpedo boats created as a part of the French Republic's efforts to maintain military parity with Germany. Its standard displacement is 1,010 long tons, has a max speed if 33 knots, and can carry 7 officers and 129 crewmembers. "
 
 FRA_dreams_hegemonic_navy1:0 "Dreams of a Hegemomic Navy"
 FRA_dreams_hegemonic_navy2:0 "Dreams of a Hegemomic Navy"
 FRA_dreams_hegemonic_navy3:0 "A Navy Worthy of a Great Power"
 FRA_forward_thinking_navy1:0 "A Forward-Thinking Navy"
 FRA_forward_thinking_navy2:0 "La Nouvelle Marine"
 FRA_bypass_washington:0 "Bypassing the Washington Restrictions"
 FRA_bypass_washington2:0 "The Super-Destroyer Policy"
 jeanpierreesteva:0 "Jean-Pierre Esteva"
 
 france.501.t:0 "Georges Durand-Viel Retires"
 france.501.d:0 "Our Chief of Navy, Georges Durand-Viel, has decided to retire, and now we must pick his replacement. On one hand, the majority of our cabinet supports Admiral François Darlan for the position. He is undeniably skilled, and his ambitious naval expansion plans could help us against the Regia Marina and the Kriegsmarine. On the other hand, Admiral Jean-Pierre Esteva is also an option. He supports the inclusion of air power into the navy, with a focus on carriers and naval bombers. Who should we choose?"
 france.501.a:0 "Appoint Darlan"
 france.501.b:0 "Appoint Esteva"
 
 FRA_create_armee_air:0 "Create the Armée de l'Air"
 FRA_create_armee_air_desc:0 "Until now, all our air power was controlled by the Army. Frankly this has stifled our efforts to expand our air power. As such it has been decided that a new independent service arm will be created, the Armée de l'Air, which will served as our primary aircraft force."
 FRA_les_bases_aeriennes:0 "Les Bases Aériennes"
 FRA_les_bases_aeriennes_desc:0 "To facilitate expansion of our airforce, we first need to construct proper air bases where aircraft can be stored, repaired, take off, and land."
 FRA_contacting_americans:0 "Contact the Americans"
 FRA_contacting_americans_desc:0 "The Americans have made leaps and bounds in the development of their airforce. Let's contact them and see if they will assist us in our own endeavors."
 FRA_american_advisors:0 "Request American Advisors"
 FRA_american_advisors_desc:0 "Although many hate to admit it, if we are going to expand our airforce with any speed, we are going to need outside help. The Americans have proven helpful alreaydy, so perhaps they will be willing to send us advisors to boost our efforts."
 FRA_financial_concessions:0 "Offer Financial Concessions"
 FRA_financial_concessions_desc:0 "To encourage aircraft production, we can offer financial concessions to aircraft companies in exchange for them actually doing something useful."
 FRA_unlimited_aircraft_buying_rights:0 "Unlimited Aircraft Buying Rights"
 FRA_unlimited_aircraft_buying_rights_desc:0 ""
 FRA_our_own_aereonautic_industry:0 "Our Own Aircraft Industry"
 FRA_our_own_aereonautic_industry_desc:0 "We cannot rely on foreigners to build and supply us with military aircraft. If we are to build up our airforce, we need a domestic aircraft industry capable of suppporting it."
 FRA_nationalize_aircraft_companies:0 "Nationalize Aircraft Companies"
 FRA_nationalize_aircraft_companies_desc:0 "The current state of the French aircraft industry is a mess. Various disparate private companies constantly compete with each other with little purpose. We shoould nationalize and take control of these companies so that we can at the very least have a functional aircraft manufacturer."
 FRA_standarize_aircraft_production:0 "Standarize Aircraft Production"
 FRA_standarize_aircraft_production_desc:0 "To increase production efficiency, aircraft designs, parts, and manufacturing must be standardized."
 FRA_sign_larger_contracts:0 "Award Larger Contracts"
 FRA_sign_larger_contracts_desc:0 "We need more aircraft! How do we get more aircraft? Award larger contracts! Afterall, weveryone knows the best way to get solve a problem is to throw money at it until it goes away."
 FRA_steady_supply:0 "A Steady Supply of Aircraft"
 FRA_steady_supply_desc:0 "After all the time and money invested into our efforts, we finally have a steady stream of modern French aircraft being produced. Now we can look forward to having a large and powerful air force for France."
 FRA_infanterie_air:0 "Infanterie de l'Air"
 FRA_infanterie_air_desc:0 "Paratroopers will add a whole new dimension to warfare. Flying in and dropping off infantry from the air will revolutionize the way battles are conducted!"
 FRA_sadir:0 "SADIR"
 FRA_sadir_desc:0 ""
 FRA_plan_5:0 "Stick to Plan 5"
 FRA_plan_5_desc:0 ""
 FRA_new_fighter_contracts:0 "New Fighter Contracts"
 FRA_new_fighter_contracts_desc:0 "While it is great to have large amount of aircraft at our disposal, that won't mean much if all the aircraft are fifteen years out of date. Awarding contracts for newer aircraft designs will help modernize our air force."
 FRA_groups_de_chasse:0 "Groups de Chasse"
 FRA_groups_de_chasse_desc:0 ""
 FRA_defense_france:0 "The Defense of France"
 FRA_defense_france_desc:0 ""
 FRA_change_strategy:0 "A New Strategy"
 FRA_change_strategy_desc:0 ""
 FRA_cooperate_bloch:0 "Cooperate With Bloch"
 FRA_cooperate_bloch_desc:0 ""
 FRA_cooperate_army:0 "Cooperate With the Army"
 FRA_cooperate_army_desc:0 "While we have established the air force as a military branch seperate from the army, the coordination between ground and air forces remains a crucial aspect of moder warfare."
