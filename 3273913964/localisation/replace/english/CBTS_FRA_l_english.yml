 ### Events ###
 
 france.1.t:0 "The Third Republic in France"
 france.1.d:0 "France emerged victorious from the Great War but at great cost. Vast swathes of the country were ruined by the constant warfare, 3.5 million men were wounded and 1.5 million were lost. Economically, the country had been devastated, with the value of the franc falling by almost 50 percent in 1919. This was worsened by continuing laissez-faire economics adopted by the Government, meaning that the economic situation was almost entirely propped up by German war reparations. \n\n When Germany defaulted on their payments in 1924, 40,000 troops to occupy the Ruhr. However, it's outcome was the opposite of expected, as the Germans still did not pay and annual reparations were decreased under the Dawes Plan. This failure lead to the fall of the conservative government under Raymond Poincare and the rise of the Cartel Des Gauches. A moderate socialistic coalition, it's promises of stability and a solution to the Germany problem proved to be empty and disunity alongside disorganisation consistently plagued it. Only the return of Poincare brought some semblance of normality back to mainland France. \n\n However, in 1929, Poincare resigned from politics and the Great Depression finally hit France. Chaos had returned. The 1932 Elections brought the return of a Second Cartel Des Gauches, although it has been just as unstable as ever, and extremist groups have been on the rise."
 france.1.a:0 "Vive La France!"
 france.2.t:0 "Preserving the Republic"
 france.2.d:0 "The unfortunate truth of the situation is that the public is beginning to lose faith in the Republic. They see our parliament as a broken system, where corrupt individuals stall any and all progress. Even now our prime minister struggles to pass a budget that will pass through the chamber of deputies. Communist and Right-wing organisations are seeing an uptake in membership whilst disputes are solved increasingly with violence rather than political discussion. We can attempt to remedy this apathy but it will take great cost and, once faith is lost, it is very difficult to regain. Alternatively, we could exploit the situation for our own gain..."
 france.2.a:0 "Interesting..."
 france.3.t:0 "Cheron Introduces Austerity Budget"
 france.3.d:0 "With the economic crisis continuing to worsen, Minister of Finance Henry Cheron has finally introduced the plans for his new austerity budget. The budget, which is already becoming increasingly controversial, calls for reduced benefits to the civil service and increased taxes. Both of these ideas are necessary but unpopular. The unfortunate reality of the situation is that the new budget is most likely to annoy the very same demographics that got us into Office. Should this budget fail, the results could be disastrous for our party.\n\nIn response to this new budget, the Socialists have already announced a counter proposal that would eliminate the new taxes. Hopefully this comes to nothing."
 france.3.a:0 "Hopefully the start of the recovery process..."
 france.4.t:0 "Budget defeated in Parliament!"
 france.4.d:0 "The latest attempt to pass a new budget through Parliament has once again met defeat, as the issue of pay cuts for civil servants has united many members against the budget. Once again, it appears that the fear of losing reelections has trumped our desire to save France from this economic turmoil. \n\nFollowing this announcement, Joseph Paul-Boncour has resigned as Prime Minister and a new cabinet has to be formed."
 france.4.a:0 "We must pass a budget eventually!"
 france.5.t:0 "Anti-Parliamentary Riots"
 france.5.d:0 "Following the Stavinsky affair, the right and far right leagues felt emboldened in their anti-parliamentary rhetoric: after all, much of the political class had found themselves untangled in a massive politico-financial scandal, particularly the Radical party and President of the Council Camille Cautemps. Stavinsky himself did not survive his arrest, preventing him from revealing the full list of his accomplices. Suicide, according to the police, a blatant example of a political assasisnation according to much of the radical press, both left and right wing, allegedly orchestrated to protect high ranking politicians. Already in January, the royalist Action Française was calling for protests, which quickly grew in size as they were joined by veterans associations and other right and far right groups, as well as communists: thousands were wounded, hundreds arrested. The government resigned, but this wasn’t enough: public opinion was outraged, a fact that the far right eagerly capitalised on.\nOn the 6th of February, a massive march was planned with the support of the Action Française, the Jeunesses patriotes, veterans organisations like the Croix-de-Feu and Union nationale des combattants as well as the PCF-linked Association républicaine des anciens combattants, all with different slogans but one objective, the Palais Bourbon, meeting place of the Chamber of Deputies. Tens of thousands were briefly united under this purpose, but the vast range of political ideals and objectives of the protesters led to the slow disintegration of the march: while some agitated for a coup, others dispersed, particularly the Colonel de La Rocque’s Croix-de-Feu. Then, as night fell, the protest turned first into a riot, then into full blown street fighting between law enforcement and protesters, with cavalry charges and occasional gunshots.\nAs the sun dawned, thousands were wounded and thirty-seven laid dead, with much of central Paris being totally devastated by the fighting. In response, the barely week-old government has resigned, the first time a government buckles under pressure from the streets. The “Coup de Force” hoped by the far right did not occur, but this tragic event will certainly have a long term impact on French politics, already so chronically unstable."
 france.5.a:0 "Doumergue's Government will fix this mess."
 france.6.t:0 "What will be our next move?"
 france.6.d:0 "Now that the budget has failed, we need to decide a new cabinet, we have refused to work with the Socialists of the SFIO for a while now, but we could try working with them, now that decision would be very controversial, so we probably should keep working with our coalition and form a new government with Daladier as the President of the Council."
 france.6.a:0 "Let's try working with the Socialists"
 france.6.b:0 "Form a new government with Daladier"
 france.10.t:0 "Government to form a new cabinet"
 france.10.d:0 "After failing to pass a vital piece of legislation into law, as is parliamentary tradition, the government must form a new cabinet that will hopefully more capable of surpassing the challenges the previus one could not."
 france.10.a:0 "Another day in parliament."
 france.13.t:0 "The Price Crisis"
 france.13.d:0 "The sweeping social reforms of the Front Populaire, particularly the Matignon Accords, have already made life better for many lower class Frenchmen, with important pay rises, paid leave, a shorter work week. However France has been in a deep economic crisis since 1931 and this economic policy, though initially welcomed by many, has led to a price hike of even basic necessities that have largely offset the pay rise. Unemployment remains high, and both production and consumption remain stagnant: the Popular Front government is facing ever increasing criticism from the press and particularly the middle class, who feel as if their living conditions have already worsened under the young government of Left unity.\nFurthermore this government, dominated by the socialist SFIO and supported by the PCF, has created a Red Scare frenzy in the right and now increasingly in the center: initially soothed by the promises of Léon Blum of leading a government of social reform and not proletarian revolution, these concerns have been revived by this perceived mismanagement of the economy."
 france.13.a:0 "Well... This isn't great."
 france.14.t:0 "Radicals take control of the Coalition"
 france.14.d:0 "Following the recent wave of concern over the government’s gestion of the economy, infighting has broken out in the Front Populaire. The center-left Radicals, who have long been supporters of economic and social liberalism, find themselves aggravated by the socialist dominance over their coalition, while the left wing of the SFIO and the PCF have found themselves disappointed by the somewhat cautious pace of the reforms. The coalition has furthermore been deeply shaken by relentless attacks from the right wing press, steadily chipping away support from the public.\nTo prevent a breakup of the Popular Front, the government led by Léon Blum has resigned. A new government, headed by the Radical Camille Chautemps, will take its place."
 france.14.a:0 "We must win the people back!"
 france.15.t:0 "SFIO take control of the Coalition"
 france.15.d:0 "Following a regain of popularity and momentum by the SFIO and the popular front, Leon Blum has been able to take the lead of the Front and form a new government. The Popular Front can once again resume in its more radical reforms, assuming Blum can keep the people’s confidence."
 france.15.a:0 "Let's resume working for the workers."
 france.16.t:0 "The Front collapses"
 france.16.d:0 "The Popular Front was seemingly doomed to failure, an electoral alliance encompassing parties of far too dissimilar sensibilities to be durable, let alone fonctionnal. The Radicals were not able to handle the backlash created by the perceived economic mismanagement of the left front, and so have withdrawn their support for the coalition. As they were the major partner in the Front Populaire, they have seized the opportunity to instead rejoin their traditional allies of the center and center-right. A new government under Édouard Daladier has been formed, who has vowed to “put France back to work”: the dream of left unity is dead."
 france.16.a:0 "There goes the worker's front."
 france.18.t:0 "Camille's government Falls"
 france.18.d:0 "Camille Chautemps’s Left's Cartel government failed to gain the support of the right wing of the Radical Party as well as other parties, putting an end to the experience. This whole affair has shown the progressively enlarging divide within the party, whenever the party will survive such events remains to be seen."
 france.19.t:0 "Domergue's goverment Fall"
 france.19.d:0 "Domergue’s constitutional reforms have recently attracted the ire of Radical politicians as well as a large part of the public. Indeed, it seems that the enthusiasm for reforms has waned and both Tardieu and Doumergue are finding themselves being called Caesars, Bonapartists or even outright Fascists by those who found their reforms to be centralizing too much power in the President’s hands."
 france.19.a:0 "And so, another government goes..."
 france.20.t:0 "Maginot Line Construction Finished"
 france.20.d:0 "The line has been finally deemed finished. The bunkers and fortifications spans across the German-Franco border, all of it with the purpose of deterring the Germans of attacking head on and buy enough time for France to mobilize it's population for war. Of course the Line also brings a sense of security to High Command and indeed to the people in large, hopefully it will defend us against the Germans in the upcoming war"
 france.20.a:0 "It will make France invincible!"
 france.21.d:0 "We have finished construction on a new extension to the line going throught the Franco-Belgian border, hopefully stoping any attempt of the Germans of doing another 'Schlieffen Plan'."
 france.21.a:0 "We will be waiting for them to come."
 france.22.t:0 "Alpine Line Extension Finished"
 france.22.d:0 "Today the last parts of the Alpine Line or 'The little Maginot Line', an extension of the Maginot line, have been finished. Protecting the south eastern part of France against the possibility of a strike from the Italians, the fortifications are much more minute and smaller than those of the main line. This of course is a double edged sword as the mountainous terrain makes it also much more difficult for enemies to attack, tanks being almost completely incapable to operate in the area covered by the line."
 france.22.a:0 "Let’s just hope we won't have to mount the defenses on two fronts at once."
 france.23.t:0 "Our presidential choice"
 france.23.d:0 "Thanks to their involvement in the succesful reforms, Doumergue, Tardieu and Reynaud have emerged as natural leaders of the center and the right of french politics. Doumergue, however, is way too old to run for President again. Thus, the AD will have to chose whenever they should favor Reynaud, the heterodox economist of the party, or Tardieu, who is more controversial for his ideas and quips but was also the main architect of the reforms."
 france.23.a:0 "Reynaud, the economist!"
 france.23.b:0 "Tardieu, the architect!"
 france.24.t:0 "AD victory in the elections"
 france.24.d:0 "Despite the PCF and SFIO’s attempt to run Leon Blum for president and the Various other minor candidates from the far right, the momentum from the successful reforms and the wide support from the Radicals to the Republican Federation has led to a landslide victory for the AD’s candidate. With such a strong mandate, the new president should find it easy to win the following legislative elections after dissolving the chamber of deputies, giving him free reign to complete any reforms."
 france.24.a:0 "We couldn't ask for more."
 france.25.t:0 "Strikes!"
 france.25.d:0 "Despite the Popular Front’s failure to win in parliament, it seems that the workers still believe in its promise. The CGT, along with other unions and with the support of the SFIO and the PCF, has declared a general strike. The French economy finds itself paralyzed as rumors of the potential for a full blown revolution start to spread. It seems that the newly formed AD government will have a baptism of fire."
 france.25.a:0 "Dammit!"
 france.26.t:0 "Gamelin replaced by Weygand"
 france.26.d:0 "The Germans have break through our lines, making Paris vulnerable. This military disaster hasn't gone without consequence as a decree has been pronounced abolishing the position of chief of staff of the land forces, position that was occupied by Gamelin, who is being replaced by Maxime Weygand, as the chief of staff of the national defense. This will affect our ability to respond the Germans effectively for a while."
 france.26.a:0 "Hopefully we can turn the situation around."
 france.27.t:0 "Gamelin Retires"
 france.27.d:0 "After having served as chief of staff of the land forces for six years, Gamelin is retiring at 65 years of age, we will need to appoint a new chief of the army to replace him."
 france.27.a:0 "Have a nice retirement!"

 france.30.t: "Tragedy in Marseilles"
 france.30.desc: "Nations around the world tremble today at the tragedy of King Alexander I of Yugoslavia and our Foreign Minister, who were shot this morning in Marseilles. Masses gathered with a forest of flags moments before the tragedy to witness the warmth and affection of the meeting of these two great men. The car in which the Minister and His Majesty were travelling from the port had hardly traveled a hundred yards, when suddenly a murderer from the crowd interrupted the car and poured a hail of lead into its occupants. The King sank into the cushions of the car, never again to open his eyes. Barely five minutes after landing on French soil Alexander of Yugoslavia was dead. The Foreign Minister was taken to a hospital, where an hour later he too was declared dead. Assassinated by a conspirator in a scene of gripping human drama and pandemonium. The regicide was cut down and beaten to death on the spot.\n\nThe Yugoslav king will be succeeded by his 11 year old son, Peter II, snatched by fate from his childhood to inherit the uneasy throne of Yugoslavia. We have decided to appoint Pierre Laval as the new Foreign Minister, hopefully it can work as good as his successor."
 france.30.a: "Qu'il repose en paix"

