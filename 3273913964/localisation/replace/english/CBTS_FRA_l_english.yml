 FRA_social_crisis_desc1:0 "The effects of the Great Depression on France have proven to be politically disastrous, its effects vastly eroding the popularity of our government and giving radicals plenty of room to exploit our mistakes for political capital. The future of our government, and France, has become all but certain, with many question just who will sit at the ships when we steer clear off this storm."
