 FRA_negotiate_fair_prices:0 "Negotiate Fair Prices"
 FRA_lessons_great_war:0 "Lessons of The Great War"
 FRA_lessons_great_war_desc:0 "The last war left deep scars in France, both her land and her people, but we should try to learn from our experience with it so we can prepare for any future war on the horizon. The Great War was a harsh teacher, but she had many lessons to teach. As tensions in the world rise, we should revisit our studies."
 FRA_invest_new_equipment:0 "Phase out Old Rifles"
 FRA_invest_new_equipment_desc:0 "Quantity is very important in war, but we cannot afford to ignore quality, either. One of our biggest mistakes before the Great War was not modernizing our rifles. If we can have a superior, modern rifle in the hands of each soldier, it would strengthen our army immensely."
 FRA_support_companies:0 "Invest in New Support Companies"
 FRA_support_companies_desc:0 "One of the most important lessons of the last war is that modern armies are expensive and complicated machines that cannot be made up only of fighting men. Support companies make up an integral part of a fighting force, and will be a weak link in the army if we do not devote proper attention and funding to them."
 FRA_montanier_units:0 "Improve our Mountaineers"
 FRA_montanier_units_desc:0 "It is likely that future fighting in France will center around the border with Germany, which is fairly flat. However, we absolutely must not neglect our southern flanks, where the great Alpine mountains stretch for hundreds of miles. The Chasseurs Alpins, our mountain troops, are key to protecting this area, and must be expanded to counter Italian aggression."
 FRA_invest_artillery:0 "Invest in Artillery"
 FRA_invest_artillery_desc:0 "The dying in the Great War was done primarily by brave young men, but much of the killing was done by great steel dragons. Artillery is a key component of modern warfare, and if we do not invest in, modernize, and expand our artillery forces, we are doomed to defeat. Let the dragons roar!"
 FRA_invest_tank_motors:0 "Research New Tank Motors"
 FRA_invest_tank_motors_desc:0 "Tanks are impressive, imposing sights even when idle. However, they are much more so when they move. These metal leviathans take powerful engines that must be specially designed to propel their massive weight. If we want to design modern tanks, we must have modern engines first."
 FRA_expand_fuel_silos: "Expand our fuel reserves"
 FRA_light_tanks_focus:0 "Develop Light Tanks"
 FRA_light_tanks_focus_desc:0 "We should focus our efforts on light armored vehicles! Armor should serve first and foremost in a flanking and scouting role. Let the infantry and artillery handle the main pushes. Tanks should play to their advantage in speed and stay light and mobile, exploiting breakthroughs and encircling troops."
 FRA_medium_tanks_focus:0 "Develop Medium Tanks"
 FRA_medium_tanks_focus_desc:0 "We should focus our efforts on medium tanks. They must be armored enough to withstand enemy fire and fast enough to exploit breakthroughs. The strength of a tank lies in its versatility, and by having one vehicle serve as many functions as possible, we can also streamline our production and design process."
 FRA_heavy_tanks_focus:0 "Develop Heavy Tanks"
 FRA_heavy_tanks_focus_desc:0 "We should focus our efforts on heavy assault vehicles! Let motorized infantry handle the rapid maneuvers; tanks should focus on being untouchable behemoths that destroy all opposition! A tank with enough armor and firepower is conceptually unstoppable. Let our enemies quake in fear!"
 FRA_new_type_of_war:0 "Reform French High Command"
 FRA_new_type_of_war_desc:0 "Our high command, while experienced and distinguished, is from a different era, and it shows. Its structure was designed for a different era: one before the radio, the tank, and modern cryptology. To call its methods antiquated would be an understatement. The situation must be amended with reforms and modernization."
 FRA_reform_high_command:0 "Push Gamelin into Retirement"
 FRA_reform_high_command_desc:0 "Our high command, while experienced and distinguished, is from a different era, and it shows. Its structure was designed for a different era: one before the radio, the tank, and modern cryptology. To call its methods antiquated would be an understatement. The situation must be amended with reforms and modernization."
 FRA_promote_new_blood:0 "Push Gamelin into Retirement"
 FRA_promote_new_blood_desc:0 "Maurice Gamelin is a distinguished military figure who nobly served France in the Great War. However, his tenure as Chief of the Army Staff has been marked by questionable decisions and a fixation with antiquated defensive tactics. If we want to seriously reform the army, it might be time for the old man to retire."
 FRA_invest_armored_units:0 "Put Funds into Armored Units"
 FRA_invest_armored_units_desc:0 "Modern military thinkers from around the world have been expanding on and innovating the theories of armored warfare. It is more apparent by the day that an armored force is a key component of a modern army. We must invest in tank production, lest we find ourselves outmatched on the battlefield."
 FRA_introduce_army_reforms:0 "Introduce New Army Reforms"
 FRA_introduce_army_reforms_desc:0 "We must at all costs prevent ourselves from developing a victor’s complex. Our victory in the Great War was hard fought, and its losers have not been idle. We cannot afford to simply take it as a given that our strategies from two decades ago will win the wars of today. Innovation and reform must continue, even in peacetime."
 FRA_flexible_chain_of_command:0 "A Flexible Chain of Command"
 FRA_flexible_chain_of_command_desc:0 "The Germans lost the Great War, of course, but they did have a few good ideas we should learn from. First among these is high command flexibility. German officer initiative was one of their strongest traits, and one we would do well to adopt. A rigid chain of command will break under pressure; a flexible one may bend and snap back!"
 FRA_reform_intelligence_service:0 "Reform the Deuxième Bureau"
 FRA_reform_intelligence_service_desc:0 "“If you know the enemy and know yourself, you need not fear the result of a hundred battles.” Sun Tzu wrote that. The Second Bureau of the General Staff has the very important job of making sure we know the enemy. To keep ourselves competitive in espionage and counter-espionage, we must ensure their methods are up to date."
 FRA_invest_mechanized:0 "New Mechanized Vehicles"
 FRA_invest_mechanized_desc:0 "Recent conflicts around the world have proven the effectiveness of mobile infantry. They are powerful weapons on the attack, and can only be meaningfully countered by equal mobility. Even in a defensive war, we must be able to match the mobility of the enemy. Therefore, we must make new mechanized vehicles for our infantry to drive into the future."
 FRA_towards_professional_army:0 "Army of the Future"
 FRA_towards_professional_army_desc:0 "Recently published by Charles de Gaulle, “Vers l’Armée de Métier” has made waves in our military theory. The book calls for a massed force of armoured infantry supported by thousands of tanks, with a preference for lightning fast tactics. We should look at implementing some of his ideas, for if we do not, others will."
 FRA_guerre_de_longue_duree:0 "Prepare for \"La Guerre De Longue Durée\""
 FRA_guerre_de_longue_duree_desc:0 "The last war was a long, grueling war of attrition, and the next one might be too. The plan is to starve the Germans of resources and remain on the defensive until a decisive and carefully planned offense can be launched. The infantry will form the centerpiece of the army and armor will largely remain in a supporting position."
 FRA_increase_gun_production:0 "Increase Gun Production"
 FRA_increase_gun_production_desc:0 "Perhaps the most important tool of war in the modern era is not the tank nor the plane, but the simple infantry rifle, inglorious and mundane as it is, Expanding production and ensuring we have sufficient stockpiles of rifles, sidearms, and ammunition is absolutely key to the victory of any war, especially an attritional one."
 FRA_move_gqg_to_paris:0 "Move the GQG to Paris"
 FRA_move_gqg_to_paris_desc:0 "There has been much internal debate as to where the Grand Quartier Général should physically reside. After the last war, it was moved to Metz to prepare for future offensives. It was later moved to Marne for defensive purposes. However, Marne is still far from the other institutions in Paris, so we should move it to the capital to centralize and streamline our command."
 FRA_promote_conscription:0 "Revamp Conscription Efforts"
 FRA_promote_conscription_desc:0 "The Great War ate through many valuable things. Ammunition, homes, and food can all be restored with some time and effort. Brave young men, however, are not so easily replaced. If we are to have enough for the army, we must revisit our conscription laws and ensure they are sufficient and effective."
 FRA_reform_the_gqg:0 "Introduce New Reforms to the GQG"
 FRA_reform_the_gqg_desc:0 "We have changed the Grand Quartier Général’s location, but we must now change its nature. Modern strategies, technologies, and ideas must be worked into its administrative processes and made to become integral parts of our high command. The GCQ must be whipped into shape after years of idleness."
 FRA_legacy_trench_warfare:0 "Reform Old Strategies"
 FRA_legacy_trench_warfare_desc:0 "We won the Great War, did we not? We have a system that works, as well as a strong and proud military foundation to build on. However, the last war was unbearably expensive and mistakes were made. The answer is not to throw out the old but to reform it, improve upon it, and ensure that our next victory outshines the last!"
 FRA_invest_in_maginot:0 "Invest More in the Maginot Line"
 FRA_invest_in_maginot_desc:0 "The Maginot Line, the pride of the nation, is the centrepiece of the national defense plan. These fortifications are state of the art and absolutely impenetrable. To ensure that France is never again violated like she was in 1914, we must expand and maintain these grand fortifications!"
 FRA_alpine_line:0 "Reinforce the Alpine Line"
 FRA_alpine_line_desc:0 "While the Maginot protects us from the Germans, we must also be aware of our southern front. Italy has been increasingly aggressive on the world stage, and may have hostile ambitions toward us. While most of the fortifications there are complete, a number of smaller, higher-altitude positions have not been completed. We must continue to fortify and entrench our border in the Alps, so that we may defend against any potential Italian incursions."
 FRA_extend_maginot:0 "Extend the Maginot"
 FRA_extend_maginot_desc:0 "If the Maginot Line protected only our border with Germany, the Great War could repeat almost exactly. In 1914, the Germans went through Belgium to invade France, and they could very well do so again. To protect against this scenario, we must extend our glorious fortification line along the Belgian border."
 FRA_form_dlm:0 "Reorganize Cavalry Divisions into DLMs"
 FRA_form_dlm_desc:0 "The last war showed beyond a shadow of a doubt that the cavalry charge is dead and cavalry divisions are a liability. However, liquidating these divisions would be a waste. Instead, we will reorganize them into the Divisions Légères Mécaniques, light motorized divisions that will usher in an era of mechanization in the French army!"
