 FRA_economic_downturn1:0 "Economic Downturn"
 FRA_economic_downturn2:0 "Economic Downturn"
 FRA_economic_downturn3:0 "Economic Downturn"
 FRA_economic_downturn1_desc:0 "The Great Depression has finally reached France proper, our economic growth is starting to stagnate and firms and most importantly the people are starting to lose faith in our economy, while we nowhere face the risk of panicked bank runs and mass bankruptcy, we are steering right into a storm and it’ll take careful tact to remain the helmsman of this ship."
 FRA_economic_downturn2_desc:0 "The Great Depression has finally reached France proper, our economic growth is starting to stagnate and firms and most importantly the people are starting to lose faith in our economy, while we nowhere face the risk of panicked bank runs and mass bankruptcy, we are steering right into a storm and it’ll take careful tact to remain the helmsman of this ship."
