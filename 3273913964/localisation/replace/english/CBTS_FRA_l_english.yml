 fra_scw.1.t: "France sends us tanks"
 fra_scw.1.d: "This morning the French government has autorized the transfer of 32 Renault FT tanks to us in a small effort to help us with the ongoing civil war. 9 of these tanks had issues and have been sent to the basque town of Bedia to be repaired; the 23 remaining tanks have been distributed to the different ongoing fronts. This contribution, although well-intentioned, is not what we hoped for. The French could have sent us more modern tanks rather than old and broken 1918 Great War tanks."
 fra_scw.2.t: "Polish Tanks"
 fra_scw.2.d: "Poland has decided to lend us some of their old tanks to help us in our struggle!. The Polish Government has used the SEPEWE (Syndicat Exporti Przemyski Wejennego) to sell us 16 Renault FT tanks for the great price of 35.000 $ c/u (the Soviet union sold us new T-26 tanks at 21.500 $). It is known that the Polish intend to finance their own rearmament with the increasing tensions with the Germans and Russians, and we are desperate to get any equipment to help us win the war no matter the cost."

