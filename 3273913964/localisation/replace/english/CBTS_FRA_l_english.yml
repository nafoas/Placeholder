 # Events
 france_parliament.2.d:0 "In a fiery speech, a well known opposition leader has denounced our latest initiative, calling it a \"stupid idea\" and denouncing the \"government incompetence to solve the real problems of the french people\". The strength of the speech has indeed weakened our position."
 france_parliament.2.a:0 "This is outrageous!"

 france_parliament.101.t:0 "Gamelin issues a Prostest to the Chamber"
 france_parliament.101.d:0 "Earlier today appealed to parliament, stating that these reforms would 'interfered'"

 france_parliament.102.t:0 "Broad support for our Reforms"
 france_parliament.102.d:0 "Almost all parties have presented support for the new state reforms, this is looking to be a easy reform to pass."
 france_parliament.102.a:0 "Well this is going to be easy"
 france_parliament.103.t:0 "Parties drop their support"
 france_parliament.103.d:0 "Early this morning, almost all parties have announced that they would be dropping their support, in part due to Doumergue's comments on the nature of the Head of State saying that in the modern world, the final decision should be taken by the him, and Tardieu didn't help with his previous statements and criticism of the parliamentary system.\nNow we need to ask ourselves if we want to continue with such low support and try to convince parties to vote our way..."
 france_parliament.103.a:0 "Lets finish this nonsense"
 france_parliament.103.b:0 "No, Keep pushing for the reforms"
 france_parliament.104.t:0 "Accusations against our ministers"
 france_parliament.104.d:0 "Recent accusations against the main pushers of these reforms, Doumergue and Tardieu to be more precise, have made the radicals retire their support, this could lead to the other parties dropping theirs as well..."
 france_parliament.104.a:0 "This may not be easy as initially thought..."

 france_parliament.210.t:0 "Negotiating with the PC-SFIC"

