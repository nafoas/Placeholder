 fra_armistice.17.t: "2nd Armistice of Compiègne"
 fra_armistice.17.desc: "PLACEHOLDER text. Today, in the same railway carriage in which the 1918 Armistice had been signed [GER.GetLeader] sat in the same chair in which Marshal Ferdinand Foch had sat when he faced the representatives of the defeated German Empire. After listening to the reading of the preamble, [GER.GetLeader] – in a calculated gesture of disdain for the French delegates – exited the carriage, as Foch had done in 1918, leaving the negotiations to the chief of the OKW, General Wilhelm Keitel. After these two days of discussion, the armistice was signed on June 22 at 6:36 p.m. by Generals Keitel and Huntziger.\n\nThe treaty is a short text of twenty-four articles, which contains the following clauses, among others:\n⭘ Prisoners of war (more than 1.5 million men) remain in captivity until a peace treaty is signed;\n⭘ The northern half of the country, as well as the Atlantic coast, come under German occupation: this is the occupied zone, which covers about three fifths of the territory. The rest is the \"free zone\", that is to say, unoccupied, located mainly south of the Loire River. The two zones are separated by the demarcation line;\n⭘ All occupation costs have to be borne by France, approximately 400 million French francs a day;\n⭘ In the free zone, the French army is to be limited to 100,000 men and the troops are banned from having heavy equipment;\n⭘ The French colonial empire remains under the authority of the French government;\n⭘ The French Navy is to be disarmed but not surrendered;\n◉ France must hand over German or Austrian political refugees present on its soil.\nThis is envisaged to last until a final peace treaty is negotiated, which means the occupation is a provisional state of affairs until Britain comes to terms, which is believed to be imminent."
 fra_armistice.17.a: "1918 Avenged."

 fra_army.2.t: "Huntziger returns from the Levant"
 fra_army.2.d: "Charles Huntziger, commander-in-chief of the troops in the French Mandate of Syria, has joined the Superior Council of War and as a result he has been dismissed from his post in Syria and returned to the Metropoli. His post as commander of the Army of the Levant will be filled by General Henri Léon Caillaut."
 fra_army.2.a: "Welcome back"

 france.400.t:0 "Defeat"
 france.400.d:0 "The battle is lost. Paris has fallen into German hands, and it is only a matter of time before the rest of the country is occupied. We must now think to the future. Elements within the government want an armistice with Germany, but many officers wish to continue the struggle from Britain..."
 france.400.dn:0 "The battle is lost. Paris has fallen into German hands, and it is only a matter of time before the rest of the country is occupied. We must now think to the future. Elements within the government want an armistice with Germany, hopefully offering good terms for peace..."
 france.400.a:0 "We must collaborate with the Germans."
 france.400.a_tt:0 "§YPlay as Vichy France if Germany grants armistice§!\n"
 france.400.b:0 "The fight goes on!"
 france.400.b_tt:0 "§YPlay as France if Germany grants armistice§!\n"
 france.400.c:0 "Ask for peace terms."
 france.401.t:0 "Triumph in France"
 france.401.d:0 "Our victory in France is nearly complete. The French government has asked for an armistice, and our diplomats have prepared terms which they have agreed to. They will retain control of southern France, while we are free to occupy the rest."
 france.401.dn:0 "Our victory in France is nearly complete. The French government has asked for an armistice, and our diplomats have prepared terms which they have agreed to. We will occupy our former territories of Alsace-Lorraine, while we make a separate peace without the British and a truce of two years."
 france.401.a:0 "Excellent"
 france.401.b:0 "Go on with the peace treaty."
 france.401.c:0 "No, Germany will conquer all!"

 france.404.t: "ORDRE DE MOBILISATION GÉNÉRALE"
 france.404.d: "By decree of the President of the Republic, the mobilisation of the armies of land, sea and air is ordered, as well as the requisition of animals, carriages, means of harnessing, aircraft, motor vehicles, ships, craft, handling equipment and all the means necessary to make up for the insufficiency of the ordinary means of supply of these armies.\n\nTHE FIRST DAY OF GENERAL MOBILIZATION IS [?Global.date.GetDateStringNoHourLong].\n\nEvery Frenchman subject to military obligations must, on pain of being punished with all the rigour of the laws, obey the prescriptions of his MOBILIZATION FASCICULE.\nThe present order applies to ALL MEN who are not in the Armed Forces and who belong to the ARMY, SEA AND AIR ARMY, including MARITIME REGISTRANTS, men belonging to the COLONIAL TROOPS and men of the AUXILIARY SERVICE.\n\nThe civil and military Authorities are responsible for the execution of the present decree."
 france.404.a: "Oh mon Dieu, pas encore!"

 ### France Flavour Events ###
 fra_flavour.1.t:0 "The Dry Guillotine"
 fra_flavour.1.desc:0 "The publication of the memoirs of a French prisoner, René Belbenoît, has caused a stir in metropolitan France and prompted calls for a major reform of the penal system. The book, “The Dry Guillotine: 15 Years Among the Living Dead” details his time as a prisoner at the Devil’s Island penal colony, situated off the coast of French Guiana. It describes abhorrent conditions where prisoners are deliberately worked to death, deprived of necessities such as food and water, or locked in solitary confinement for years at a time with no contact with others. Punishments are dolled out disproportionately to the crimes committed by the inmates, with corrupt guards shaking down the prisoners on a regular basis.\n\nDevil’s Island has had a long and infamous history. It was opened in 1852 as a way for the Second French Empire to conveniently dispose of undesirables and political prisoners, and remained open following the transition to the Third Republic. Many of the prisoners there were notoriously innocent, most notably Captain Alfred Dreyfus, the artillery officer unjustly accused of treason who was imprisoned there between 1895 and 1899. Belbenoit details how he escaped from the prison on a makeshift life raft in 1935, eventually making his way to the United States, and publishing his account - which he had kept safe in oilskins on his journey.\nThe memoirs have made the closure of the Devil’s Island penal colony a cause celebre in France, with human rights activists and left wing organizations calling the prison ‘inhumane’ and ‘a national embarrassment’. Already, the government has formed a commission to study the conditions on the Island, and the Prime Minister has asked the Justice Ministry to begin the process of closing down the prison, and transferring the inmates there to more traditional penitentiaries."
 fra_flavour.1.a:0 "Appalling!"
 
 fra_flavour.2.t:0 "Air France Founded"
 fra_flavour.2.desc:0 "Today, many of the leading air companies in France, including Air Orient, Air Union, and STGA announced a joint merger and the formation of a new company; Air France. The aim is to pool existing capital and resources, scarcer amidst the ongoing economic depression, and allow for ease of transport around metropolitan France and to the colonies via a new network of airports and flying boats. The new company also hopes to effectively corner the market on air travel in France. Though some economic observers have suggested that the merger will harm healthy competition in the national market, spokesmen for the company have insisted it will help make air travel more accessible and affordable to the average French man and woman.\n\nAir travel in the early 1930s is still comparatively rare and expensive, and in France it is no different: most people travel by train or boat and commercial aviation is still in its relative adolescence. The first civilian airport in Paris only opened in 1919, and the aviation sector has, until the merger, been haphazard, with different routes and flying times and often cutthroat competition. It is hoped that the merger will, at the least, streamline the opening of new air routes."
 fra_flavour.2.a:0 "Marseilles to Algiers in only 10 hours!"

