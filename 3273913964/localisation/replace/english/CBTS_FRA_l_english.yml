 ### Armistice Event Chain ###
 fra_armistice.1.t:0 "Trahison dans l'armée?"
 fra_armistice.1.allies.desc:0 "Today Paris, our capital, has fallen to advancing enemy forces. Days prior to this, we decided to abandon the city and move the Government to Bordeaux, so the fight against the invasor can continue. But this feeling is not shared by everyone in our government nor our armed forces. The same day as the Government fled the city, General Weygand strode into [Get_FRA_HOG_Full_Name]'s office and demanded an armistice, but was rejected. The following day at the Anglo-French conference at Briare, the British Prime Minister urged France to carry on fighting, either in Brittany, in North Africa or by guerrilla warfare, meeting strong resistance from Deputy Prime Minister Pétain and Commander-in-Chief Weygand.\n\nApparently there is a growing movement for an armistice, with Weygand at its helm, that is polarizing our cabinet and hindering the coordination with the British. For this reason Brigadier-General and cabinet minister Charles De Gaulle has proposed us to sack Weygand. Of course doing so would greatly damage our ongoing war effort and maybe even achieve the opposite result of what is wanted. What should we do?"

 fra_armistice.1.alone.desc:0 "Today Paris, our capital, has fallen to advancing enemy forces. Days prior to this, we decided to abandon the city and move the Government to Bordeaux, so the fight against the invasor can continue. But this feeling is not shared by everyone in our government nor our armed forces. The same day as the Government fled the city, Commander-in-Chief Maxime Weygand strode into [Get_FRA_HOG_Surname]'s office and demanded an armistice, but was proptly rejected.\n\nApparently there is a growing movement for an armistice, with Weygand at its helm, that is polarizing our cabinet and causing great amounts of instability. For this reason Brigadier-General and cabinet minister Charles De Gaulle has proposed us to sack Weygand. Of course doing so would greatly damage our ongoing war effort and military coordination. What should we do?"
 fra_armistice.1.a:0 "Do nothing"
 fra_armistice.1.b:0 "Sack Weygand"

 fra_armistice.3.t:0 "The Chautemps Proposal"
 fra_armistice.3.desc:0 "Today the war cabinet has met to discuss the question of an armistice with Germany. Prime Minister [Get_FRA_HOG_Surname] opened the session by expressing his desire to continue the war despite the current desfavorable situation in the battlefield. For this purpose he urged the cabinet to adopt the Dutch example: that the Army should lay down its arms so the fight can be continued from the colonies in North Africa. Unfortunately the speech had little effect on the dicussion, which continued to be evenly split between the pro-armistice and pro-exile goups. To break the deadlock, Minister Camille Chautemps  proposed that France should get a neutral authority to enquire what the German terms would be, which if honourable, the Cabinet could agree to study; if not, the Cabinet would agree to fight on.\nThis proposal would have to be sent to the British War Cabinet for their approval, as it was agreed some months ago that neither country would seek a separate peace with Germany.\n\nThe proposal was later voted by the cabinet, passing with 13 votes in favour and 6 against. In vew of this outcome, Prime Minister [Get_FRA_HOG_Surname] tried to resign on the spot but was proptly interrupted by the shouts of President Lebrun, who refused to accept his resignation. Now all that remains is to wait for the British response."
 fra_armistice.3.a:0 "Espérons qu'ils ne soient pas d'accord"

 fra_armistice.4.t: "The French Proposal"
 fra_armistice.4.desc: "To put it lightly, the war on the continent hasn’t developed in our favor. Paris has fallen, and after a vote by their cabinet, the French government has decided to shift their attention towards an armistice with Germany. As our joint declaration from the Anglo-French Supreme War Council in March of 1940 outlines that neither of our governments would sign a separate peace, Prime Minister [Get_FRA_HOG_Surname] has sent us a proposal to request our permission before going forward with the talks, reporting that if we deny this he will be forced to resign.\nOur own government is of course against the idea of the French dropping out of the war, as well as [Get_FRA_HOG_Surname] leaving office. As the discussion over the proposal continues, a growing concern is also the Marine Nationale coming under German control, allowing them to pose a greater challenge to the Royal Navy.\n\nMeanwhile, a group of French and British diplomats have come forward with a proposal for a \"Franco-British Union\", an emergency merging of the French and British nations into a single state, combining all facets of the two governments into one. While not an entirely new concept, it had remained on the periphery of the fantastical, until a situation as dire as this brought it forward. They hope, if enacted, this union could persuade the majority of the French cabinet to agree to [Get_FRA_HOG_Surname]'s proposal: to continue the war from their colonies in Northern Africa.\n\nHowever, when presented with the proposal the Prime Minister was skeptical of such a union, ruling it out and instead concerning himself with the request of an armistice. If we are to accept, it must only be on the condition that the French Navy is transported safely into British ports."
 fra_armistice.4.a: "Agree to the Armistice request (Historical)"
 fra_armistice.4.b: "Reject their proposal, we cannot allow it."

 fra_armistice.5.t: "De Gaulle’s endorsement"
 fra_armistice.5.desc: "Today, a boat bearing French Brigadier General and Undersecretary of War Charles de Gaulle docked in Portsmouth, for the purpose of discussing the potential evacuation of French forces to North Africa. However, after a discussion with Jean Monnet, one of the writers of the Franco-British Union proposal, he became a strong supporter of the merging of our two countries. Meeting with the Prime Minister inside one of the many Gentlemen’s Clubs in London for lunch, he urged him to present it to the War Cabinet, claiming that \"some dramatic move was essential to give [Get_FRA_HOG_Surname] the support which he needed to keep his Government in the war\"."
 fra_armistice.5.a: "The PM is convinced, and will present the plan to the War Cabinet."
 fra_armistice.5.b: "The PM refuses, such a union is out of the question."

 fra_armistice.6.t: "The Franco-British Union"
 fra_armistice.6.desc: "PLACEHOLDER text due to lack of time, will be reworked in the future. After the british PM agreeing to the Franco-British Union, De Gaulle calls [Get_FRA_HOG_Surname] and tells him that the British prime minister proposed a union between their countries, an idea which [Get_FRA_HOG_Surname] immediately supports. Monnet, Vansittart, De Gaulle and Pleven quickly agree to a document proclaiming a joint citizenship, foreign trade, currency, war cabinet, and military command. Churchill withdraws the armistice approval TODO:(change loc depending on if you agreed or disagreed), and at 3 p.m. the War Cabinet met again to consider the union document.\nDespite the radical nature of the proposal, Churchill and the ministers recognized the need for a dramatic act to encourage the French and reinforce [Get_FRA_HOG_Surname]'s support within his cabinet before it met again at 5pm.\n\nThe final \"Declaration of union\" approved by the British War Cabinet states that:\n\"France and Great Britain shall no longer be two nations, but one Franco-British Union. The constitution of the Union will provide for joint organs of defence, foreign, financial and economic policies. Every citizen of France will enjoy immediately citizenship of Great Britain, every British subject will become a citizen of France\"."
 fra_armistice.6.a: "Unprecedented"

 fra_armistice.7.t: "De Gaulle's Call"
 fra_armistice.7.desc: "PLACEHOLDER text due to lack of time, will be reworked in the future. De Gaulle calls the French PM informing him that \"the British PM has proposed a union between our 2 countries\". Such a union was proposed by British diplomats Robert Vansittart and Morton, and French diplomats Monnet and his deputy René Pleven; with the objective that if enacted, this union could persuade the majority of the French cabinet to agree to continue the fight from North Africa. At first, the British PM was skeptical of this \"Franco-British Union\", but after De Gaulle arrived to London and managed to convince the PM of \"some dramatic move was essential to give [Get_FRA_HOG_Surname] the support which he needed to keep his Government in the war\", he agreed to the Union."
 fra_armistice.7.a: "C'est bon à entendre"

 fra_armistice.8.t: "The Franco-British Union"
 fra_armistice.8.desc: "PLACEHOLDER text. Churchill and De Gaulle call [Get_FRA_HOG_Surname] to inform him about the Franco-British Union document. They arrange for a joint meeting of the two governments in Concarneau the next day. Inmediately after the British PM agreed to the Union, Monnet, Vansittart, De Gaulle and Pleven quickly agree to a document proclaiming a joint citizenship, foreign trade, currency, war cabinet, and military command. Despite the radical nature of the proposal, Churchill and the ministers recognized the need for a dramatic act to encourage the French and reinforce [Get_FRA_HOG_Surname]'s support within his cabinet, and thus the british war cabinet withdraws the armistice approval. The declaration immediately succeeded in its goal of encouraging [Get_FRA_HOG_Surname], who sees the union as the only alternative to surrender and who could now cite the British rejection of the armistice.\n\nThe final \"Declaration of union\" approved by the British War Cabinet states that:\n\"France and Great Britain shall no longer be two nations, but one Franco-British Union. The constitution of the Union will provide for joint organs of defence, foreign, financial and economic policies. Every citizen of France will enjoy immediately citizenship of Great Britain, every British subject will become a citizen of France\"."
 fra_armistice.8.a: "Hard times require radical actions"

 fra_armistice.9.t: "[Get_FRA_HOG_Surname] Resigns!"
 fra_armistice.9.desc: "PLACEHOLDER text. French Cabinet meets at 5 pm to vote on the Franco-British Union Proposal. Many ministers call it a British \"last minute plan\" to steal France's colonies, and that \"being a Nazi province\" was preferable to becoming a British dominion. Philippe Pétain, one of the leaders of the pro-armistice group, called the union a \"fusion with a corpse\". While President [FRA.GetLeader] and some others were supportive, the cabinet's opposition stunned [Get_FRA_HOG_Surname], who believed that his ministers no longer supported him. He resigns without even taking a formal vote on the union or an armistice. Pétain, the deputy Prime Minister, forms a government that evening and then delivers a Radio adress to the French people announcing his intention to ask for an armistice with Germany."
 fra_armistice.9.a: "I guess this is the end, huh"

 fra_armistice.10.t: "The French PM resigns!"
 fra_armistice.10.desc: "PLACEHOLDER text. French Cabinet meets at 5 pm to vote on the Franco-British Union Proposal. Many ministers call it a British \"last minute plan\" to steal France's colonies, and that \"being a Nazi province\" was preferable to becoming a British dominion. Philippe Pétain, one of the leaders of the pro-armistice group, called the union a \"fusion with a corpse\". While President [FRA.GetLeader] and some others were supportive, the cabinet's opposition stunned [Get_FRA_HOG_Surname], who believed that his ministers no longer supported him. He resigns without even taking a formal vote on the union or an armistice. Pétain, the deputy Prime Minister, forms a government that evening and then delivers a Radio adress to the French people announcing his intention to ask for an armistice with Germany."
 fra_armistice.10.a: "Coward!"

 FRA_pm_will_resign_tt: "[Get_FRA_HOG_Full_Name] §Rwill resign§!"

 fra_armistice.15.t: "The French ask for an Armistice!"
 fra_armistice.15.desc: "PLACEHOLDER text. After the previous French Prime minister resigned due to his cabinet refusal of forming a \"Franco-British Union\", the deputy Prime Minister General Philippe Pétain formed a new government with the intention to ask for an armistice with Germany. The new French foreign minister asked the Spanish Ambassador to submit to Germany a request to cease hostilities at once and for Germany to make known its peace terms. When [GER.GetLeader] received word from the French government that it wished to negotiate an armistice, he selected the Compiègne Forest as the place for the negotiations. Given that Compiègne had been the site of the 1918 Armistice, which ended World War I with Germany's surrender, [GER.GetLeader] used the location as a supreme moment of revenge for Germany over France. He decided that the signing should take place in the same rail carriage, the Compiègne Wagon, where the Germans had signed the 1918 Armistice."
 fra_armistice.15.a: "Thats it! we won the war!"

 fra_armistice.16.t: "2nd Armistice of Compiègne"
 fra_armistice.16.desc: "PLACEHOLDER text. Today, in the same railway carriage in which the 1918 Armistice had been signed [GER.GetLeader] sat in the same chair in which Marshal Ferdinand Foch had sat when he faced the representatives of the defeated German Empire. After listening to the reading of the preamble, [GER.GetLeader] – in a calculated gesture of disdain for the French delegates – exited the carriage, as Foch had done in 1918, leaving the negotiations to the chief of the OKW, General Wilhelm Keitel. After these two days of discussion, the armistice was signed on June 22 at 6:36 p.m. by Generals Keitel and Huntziger.\n\nThe treaty is a short text of twenty-four articles, which contains the following clauses, among others:\n⭘ Prisoners of war (more than 1.5 million men) remain in captivity until a peace treaty is signed;\n⭘ The northern half of the country, as well as the Atlantic coast, come under German occupation: this is the occupied zone, which covers about three fifths of the territory. The rest is the \"free zone\", that is to say, unoccupied, located mainly south of the Loire River. The two zones are separated by the demarcation line;\n⭘ All occupation costs have to be borne by France, approximately 400 million French francs a day;\n⭘ In the free zone, the French army is to be limited to 100,000 men and the troops are banned from having heavy equipment;\n⭘ The French colonial empire remains under the authority of the French government;\n⭘ The French Navy is to be disarmed but not surrendered;\n⭘ France must hand over German or Austrian political refugees present on its soil.\nThis is envisaged to last until a final peace treaty is negotiated, which means the occupation is a provisional state of affairs until Britain comes to terms, which is believed to be imminent."
 fra_armistice.16.a: "This armistice is dishonorable!"
 fra_armistice.16.b: "\"Honor is safe\""
