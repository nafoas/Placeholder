 FRA_liquidity_crisis1_desc:0 "Starting in 1929 the Great Depression has affected France, comparatively, mild only starting to affect in 1931, it has effectively cut the economic growth of the 1920s of 4,5% down to a measly 0,5%. The effects will continue to linger in France for many years to come and the Depression has some pronounced effects on our local economy, which may send some nasty ripples politically in the future"
