 #events
 phi_autonomy_dominion_tt:0 "§GThe Commonwealth of the Philippines will be born!§!"
 phi_internal.1.t:0 "Governor-General Frank Murphy"
 phi_internal.1.d:0 "The US authorty has relevated Theodore Roosevelt from his position of Governor-General. Senator Frank Murphy will take his place as Governor."
 phi_internal.1.a:0 "Welcome Mr.Governor"
 phi_internal.2.t:0 "The Formation of the Commonwealth of the Philippines"
 phi_internal.2.d:0 "TODO"
 phi_internal.2.a:0 "Finally"
 phi_internal.3.t:0 "Manuel L. Quezón gets elected"
 phi_internal.3.d:0 "Today, [?Global.date.GetDateStringNoHourLong], three months before the scheduled elections for the Commonwealth, many political factions held their own national conventions, the Nationalist Party got the Manuel L. Quezón-Sergio Osmeña formula won the elections, in some months they will inagurate the first Philippino government"
 phi_internal.3.a:0 "Our President!"
 phi_internal.4.t:0 "Government Inaguration"
 phi_internal.4.d:0 "The Commonwealth government was inaugurated this morning in ceremonies held on the steps of the Legislative Building in Manila. The event was attended by a crowd of around 300,000 people."
 phi_internal.4.a:0 "Long Live our Commonwealth!"
 phi_internal.5.t:0 "Philippine Independence Mission"
 phi_internal.5.d:0 "Some days ago Manuel L. Quezon, the President of the Senate of the Philippines, arrived at Washington D.C. along with some other Filipino representatives in a \"Philippine Independence mission\". The purpose of this mission was to lobby Congress to pass the Tydings–McDuffie Act, which aims to give independence to the Philippines. Apparently the efforts of Mr. Quezon have been successful as Congress is preparing to vote on the aforementioned act."
 phi_internal.5.a:0 "Lets see..."
 phi_internal.6.t: "The National Defense Act of 1935"
 phi_internal.6.d: "Today the National Defense Act of 1935 (Commonwealth Act No. 1) was passed by the Philippine National Assembly. The act provides for the creation, by 1946, of an independent Philippine military via an annual appropriation of 16.000.000 pesos. The objectives are to create a regular army force of 10,000 troops (formed largely from the Philippine Scouts and the Philippine Constabulary), a reserve army of 400.000 men, an Offshore Patrol which will possess 36 torpedo boats and a Philippine Army Air Corps of 100 tactical bombers. It also divides the Commonwealth of the Philippines into ten military districts, similar to the US corps areas. Each district has a roughly equal population and each will initially provide 1 reserve division, and ultimately three. In regards to creating an independent army, the act stablishes the drafting of Filipino men, between the ages of 21 and 50, into the 30 reserve divisions; and will stablish a military academy with a Cadet Corps strength for the training of junior officers.\n\nWe are a step closer to real independence!"
 phi_internal.6.a: "\"Serving the People, Securing the Land\""
 phi_internal.7.t: "MacArthur Arrives"
 phi_internal.7.d: "After the establishment of the Philippine Commonwealth, President Manuel Quezón asked Douglas MacArthur to supervise the creation of a new Philippine Army. With the US President's approval MacArthur accepted the assignment and prepared to leave for the Philippines. Today MacArthur, accompanied by his mother, his sister-in-law, and Majors James B. Ord and Eisenhower; arrived at Manilla on the SS President Hoover."
 phi_internal.7.a: "Welcome back"
 phi_internal.8.t: "MacArthur promoted to Field Marshal"
 phi_internal.8.d: "When MacArthur accepted becoming the Military Advisor to the Commonwealth Government of the Philippines, it was agreed that he would receive the rank of field marshal, with its salary and allowances, in addition to his major general's salary (making him the best-paid soldier in the world). Today, that promise has been fulfilled, as President of the Philippines Manuel Quezon officially conferred the title of field marshal to MacArthur in a ceremony held at Malacañan Palace."
 phi_internal.8.a: "But we don't have an army yet, why?"
 phi_internal.8.b: "Rather pompous, but ok."


