 #events
 ukr_civil_war.1.t:0 "A New Ukraine!"
 ukr_civil_war.1.d:0 "The chains have been broken as we have taken the first step in freeing the Ukrainian Nation from the Bolshevik Yoke! Central Ukraine has managed to free itself, but the Reds still hold the East, and are coming to try and oppress us again. We must take arms to defend ourselves!"
 ukr_civil_war.1.a:0 "Slava!"
 ukr_civil_war.2.t:0 "Revolt in Ukraine"
 ukr_civil_war.2.d:0 "The Second Russian Civil War has galvanized speculation and gossip in our nation. As a neighbor and enemy of the Bolsheviks, our government is naturally keeping a close eye on goings on. The nation has been rocked by the Declaration of Ukrainian Independence. We knew that the UNDO and USRP had left the country, but we kept that secret until now. It seems like Polish Interests are being served."
 ukr_civil_war.2.a:0 "Perhaps we should help..."
 ukr_civil_war.3.t:0 "Clashes with the OUN"
 ukr_civil_war.3.d:0 "Despite our cooperation with the moderate Ukrainian Nationalists, the Organization of Ukrainian Nationalists has proven to be a thorn in our side. These Fascist Terrorists have begun trying to cross the border illegaly to join the revolt in Central Ukraine. While KOP have been able to stop some of them, others, including the leadership, have somehow made it across. This is bad for us, as a radical nationalist government in Ukraine is directly opposite Polish Interests."
 ukr_civil_war.3.a:0 "Hopefully Levytsky can keep them in check."
 ukr_civil_war.4.t:0 "OUN Crosses the Border"
 ukr_civil_war.4.d:0 "Members of the Organization of Ukrainian Nationalists, or OUN, have managed to cross the Polish-Ukrainian Border. While our organizations maintain relatively cordial relations with the Polish Government, both sides cannot tolerate the OUN's terrorist activities. Still, despite the Poles' best efforts, high ranking members and some militants have managed to cross into Ukraine, declare their loyalty to the new state, and placeing their militias under our command. However, it appears that these militias are not entirely made up of veterans and militants from Western Ukraine, but that some have been recruited by the OUN. We must be very careful to ensure that OUN influence does not become too high."
 ukr_civil_war.4.a:0 "Let us see how this develops."
 ukr_civil_war.5.t:0 "Alliance with Tsaritsyn?"
 ukr_civil_war.5.d:0 "The Tsaritsyn has offered us a treaty of cooperation and mutual recognition. Under the terms of the treaty, our soldiers will cooperate and both sides will recognize the other's territory. However, while we do not want a second enemy to fight, many in our government are worried about the future status of Donetsk. While the treaty guarantees us other land in the so-called Ukrainian SSR, Tsaritsyn's revolt started with Donetsk under its control, and we are not assured that we will be given Donetsk. Therefore, some in our government would like us to cautiously demand that we be guaranteed Donetsk."
 ukr_civil_war.5.a:0 "We will join the Front."
 ukr_civil_war.5.b:0 "We must have Donetsk!"
 ukr_civil_war.5.c:0 "We are better without the Moskali."
 ukr_civil_war.6.t:0 "Ukraine Demands Donetsk"
 ukr_civil_war.6.d:0 "The Ukrainians are somewhat receptive to our offer of alliance, but say that they will need a guarantee on the Dontesk Oblast as well. They claim that the terms of the treaty are unclear on whether or not Donetsk would be returned to Ukraine after the war, and they will not consider our alliance without such a guarantee. Donetsk is part of the Ukrainian SSR, but has a large Russian Minority, leading Russian Nationalists to disregard this move as \"flippant nonsesnse\". What shall we say?"
 ukr_civil_war.6.a:0 "Donetsk shall be Ukrainian"
 ukr_civil_war.6.b:0 "Donetsk is Russian!"
 ukr_civil_war.7.t:0 "Russia Accepts our Terms"
 ukr_civil_war.7.d:0 "Tsaritsyn are not fools; they understood that it would be better to secure our cooperation by guaranteeing us our rightful territory. We have therefore signed the necessary papers, making us a member of the Anti-Bolshevik Front."
 ukr_civil_war.7.a:0 "Perhaps Russians and Ukrainians can be friends after all."
 ukr_civil_war.8.t:0 "Russia Refuses our Terms"
 ukr_civil_war.8.d:0 "Tsaritsyn have turned out to be fools; they clearly do not understand that our friendship - and the good will of the Ukrainian People - is worth giving us our rightful land. Therefore, the Ukrainians and the Russians will not fight as brothers, but under a cloud of suspicion."
 ukr_civil_war.8.a:0 "Ukrainians can never trust Russians."
 ukr_civil_war.9.t:0 "The Party Politics Program"
 ukr_civil_war.9.d:0 "It is clear that in order to secure the Democratic Nature of the New Ukraine, it is our duty to encourage political activity. However, the exact details are still wildly debated in various Government Ministries. Of course, the morally right thing to do would be to encourage political activities and groupings of all kinds, as a westernized liberal democracy should tolerate all opinions. However, some UNDO and USRP politicians have grown alarmed at the possibility that the OUN could seriously gain strength from radical Ukrainian Anti-Communists. They propose an unofficial but concerted effort to prevent the spread of Radical Nationalist ideals to a large degree. Other UNDO politicians have quietly dicussed the possibility of ensuring an UNDO dominance. It is up to [This.GetLeader] to make a final decision."
 ukr_civil_war.9.a:0 "We must be entirely fair."
 ukr_civil_war.9.b:0 "We cannot allow the OUN to spread."
 ukr_civil_war.9.c:0 "We must secure UNDO dominance."
 ukr_civil_war.10.t:0 "Solving the Jewish Question"
 ukr_civil_war.10.d:0 "Ukraine is known for a large Jewish Minority and thus a high amount of Anti-Semitism. The New Ukraine must decide on its policy towards the Jews, which will likely become the model of policy towards other ethnicities, such as the Tatars and Russians. The USRP and many members of the UNDO wish to see Total Equality for the Jews and other minorities, comparing the oppression of the Jews to the Oppression of the Ukrainians. Other members of the UNDO wish to see us continue the UNDO \"dual policy\", which supported Equality for all Ethnicities in a political and social sense, but indirect economic inequality, as Ukrainians will be encouraged to \"Buy Ukrainian\". OUN delegates to the government advocated for establishing the Jews as a \"foreign ethnicity\", which has been universally panned by the rest of the government. What option shall we choose?"
 ukr_civil_war.10.a:0 "Total Equality!"
 ukr_civil_war.10.b:0 "Continue the Dual Policy."
 ukr_civil_war.11.t:0 "The Language Issue"
 ukr_civil_war.11.d:0 "Although Ukrainian is the working language of the Administration, the Russian language is still common in the New Ukraine. Some, especially the Russian Minority, are becoming restless and discontented at having to use Ukrainian in official capacities. The call to recognize Russian as an official language grows stronger by the day. Of course, many in our government wish to prevent such a thing, as they say such a thing is inconducive to Ukrainian Independence. Furthermore, if we recognize a second language, then there will be calls for us to recognize languages such as Yiddish or Moldovan. How shall we respond?"
 ukr_civil_war.11.a:0 "Russian shall be allowed."
 ukr_civil_war.11.b:0 "Speak Ukrainian!"
 UKR_persecute_russian_language:0 "Persecuting the Russian Language"
 UKR_recognized_russian_language:0 "Recognized the Russian Language"
 ukr_civil_war.12.t:0 "The Ukrainian Economic Issue"
 ukr_civil_war.12.d:0 "At present, three competing economic policies exist in Ukraine: Agrarian Socialism, as advocated by the USRP, Cooperatism, the preferred system of the UNDO, and National Corporatism, the system proposed by the OUN. As divided as our people are politically, they are equally divided economically. A conference has thus been called to review the issue.\n\nThe Socialist and Conservative Representatives really represent similar positions. The Socialists advocate for the transfer of all land to either peasant smallholders or voluntary cooperatives, and the eventual transfer of other means of production to the workers. UNDO has strong ties to the Cooperative movement, which aim to strengthen Ukrainian ethnic interests through collective management. Although they are not opposed to traditional capitalist structures, they still advocate for cooperatives to be strongly encouraged. Both groups have agreed that Minister Osip Kogut's policies are satisfactory for the time being. On the other hand, the OUN has argued in favor of a Corporatism, similar to the policies of Benito Mussolini. Under their policies, the economy would remain mixed, with the Rada eventually replaced by a system of Vocational Representation. They advocate for the replacement of Minister Kogut with Dimitry Yatsiv, an OUN figure."
 ukr_civil_war.12.a:0 "Agrarian Socialism is the way forwards."
 ukr_civil_war.12.b:0 "Cooperatism has worked wonders so far."
 ukr_civil_war.12.c:0 "Corporatism is necessary for the nation."
 UKR_agr_policy:0 "§YSocialist§! Economic Policy"
 UKR_coop_policy:0 "§YCooperative§! Economic Policy"
 UKR_corp_policy:0 "§YCorporatist§! Economic Policy"
 ukr_civil_war.13.t:0 "The First Cooperative Congress"
 ukr_civil_war.13.d:0 "Representatives from several large cooperatives have met in the capital for the last few days to prepare a report on the situation of the economy and recommendations for its future. The event is treated as a momentus gathering on a near-Soviet scale, with representatives from Tsentrobank, Narodnia Torhivlia, and more met and discussed for hours at a time. Eventually, their report was ready. They write that \"Considering the circumstances, the Ukrainian Consumers are optimistic\", referencing the war effort and nationalist ferver. \"Agricultural production has increased, as have banking activities and, to a smaller degree, consumer industries\". It then goes on to list figures on sales and such things, with information provided by the Economic Ministry. \"However" it continues, \"in order to secure future production, the following is a list of recommended monetary and fiscal policy\". It lists policies such as freedom of trade, increased government spending, and other expansionary policies to combat the expected shrinkage introduced due to the war. These recommendations will be discussed during the next cabinet meeting, when it will be acted upon."
 ukr_civil_war.13.a:0 "Many thanks to our cooperators!"
 ukr_civil_war.14.t:0 "Ukraine asks for Industrial Investments"
 ukr_civil_war.14.d:0 "The Ukrainian government has come to us asking for industrial investments. They are willing to pay for the ability of our companies to build in Ukraine. They claim to need this to build up Ukrainian Industry. Shall we agree to this deal?"
 ukr_civil_war.14.a:0 "Anything for our allies!"
 ukr_civil_war.14.b:0 "We do not have the necessary resources to do so"
 ukr_civil_war.15.t:0 "[From.GetAdjective] Investments"
 ukr_civil_war.15.d:0 "[From.GetNameDef] has agreed to invest in our industry. With their help, we will soon be able to turn Ukraine into an industrial nation with all the capabilities necessary to defeat the Reds."
 ukr_civil_war.15.a:0 "Splendid."
 ukr_civil_war.16.t:0 "The [From.GetAdjective] Refusal"
 ukr_civil_war.16.d:0 "Our ally has decided that although they'd like to help, they do not have the resources to spare on our industrialization program. Ergo, we will not be paying them to build up our nation."
 ukr_civil_war.16.a:0 "Shame."
 ukr_civil_war.17.t:0 "Ukraine offers to Buy Weapons"
 ukr_civil_war.17.d:0 "The Ukrainian Government has asked us to sell them weapons in order to better arm their soldiers. As the army cannot fight without firearms, the Ukrainians see our industry as capable of sustaining their military. Should we sell them our guns?"
 ukr_civil_war.17.a:0 "Supporting Ukraine is imperative"
 ukr_civil_war.17.b:0 "We cannot spare a single bullet."
 ukr_civil_war.18.t:0 "[From.GetAdjective] Weapons Shipment"
 ukr_civil_war.18.d:0 "As soon as the [From.GetAdjective] missive confirming the transaction had arrived, we had already sent the money, and the guns were on their way. The weapons have now arrived, and we can immediately arm our soldiers with them."
 ukr_civil_war.18.a:0 "Excellent."
 ukr_civil_war.19.t:0 "[From.GetNameDef] Refuses to Sell"
 ukr_civil_war.19.d:0 "The [From.GetAdjective] Government has refused to sell us weapons as they claim that they \"cannot spare a single bullet\". While this seems a little far-fetched, we will give them the benefit of the doubt."
 ukr_civil_war.19.a:0 "Shame."
 UKR_attache:0 "Foreign Military Attache"
 ukr_civil_war.20.t:0 "Ukraine Requests Military Attache"
 ukr_civil_war.20.d:0 "The Ukrainian Foreign Ministry has put in a request for a military attache to come to Ukrainian High Command to advise, train, and coordinate the Ukrainian Army. Although the Ex-Red Army Officers are well trained, many of the junior officers are not, as they come from the militia. Shall we send some of our officers to the Ukrainians?"
 ukr_civil_war.20.a:0 "There is no reason why not to."
 ukr_civil_war.20.b:0 "We need them here!"
 ukr_civil_war.21.t:0 "[From.GetAdjective] Officers Arrive"
 ukr_civil_war.21.d:0 "[From.GetNameDef] has sent officers per our request for a military attache. They will work to coordinate between our two armies, train junior officers, and advise our high command. This is sure to mark a new Era in Ukrainian-[From.GetAdjective] cooperation!"
 ukr_civil_war.21.a:0 "Hooray!"
 ukr_civil_war.22.t:0 "[From.GetNameDef] Refuses to Send Officers"
 ukr_civil_war.22.d:0 "The [From.GetAdjective] Government has refused to send us a military attache. This attache would have worked to coordinate with Ukrainian High Command and help train junior officers. Although this is a shame, [From.GetNameDef] cites a need for those officers to be in the country rather than in Ukraine."
 ukr_civil_war.22.a:0 "We can make do without."
 UKR_ethnic_tensions:0 "Ethnic Tensions"
 ukr_civil_war.23.t:0 "Ethnic Tensions on the Rise"
 ukr_civil_war.23.d:0 "It is rare to see Ukrainians of different ethnicities getting along. Anti-Jewish and Anti-Russian Sentiments are no stranger to Ukraine, but these feelings have been getting notably stronger. Despite our best efforts, violence against Moldovans, Jews, Russians, and other ethnicities by ethnic Ukrainians has become more common, as some Ukrainians blame them for the Red Tyranny. Although we have insisted that our minorities are victims as we were, this only seems to drive people into the OUN's Camp."
 ukr_civil_war.23.a:0 "Worrying..."
 ukr_civil_war.24.t:0 "Incident in the Cabinet"
 ukr_civil_war.24.d:0 "An incident occured today during a cabinet meeting when an OUN Junior Minister tried to attack a USRP Minister. The minister was outlining his proposal for cooperation with Poland in a way that benefits the Ukrainians in the West, when the Junior Minister rushed towards him. Luckily, other Ministers and their Deputies were able to restrain him. The Junior Minister has been dismissed from his post and replaced with a member of UNDO."
 ukr_civil_war.24.a:0 "At least everyone's alright."
 ukr_civil_war.25.t:0 "Libertarians in the USRP?"
 ukr_civil_war.25.d:0 "The first Civil War saw a curiosity rise among the chaos. Nestor Makhno's Revolutionary Insurrectionary Army established an Anarcho-Communist Free Territory. This \"state\" attempted to form a stateless society ruled on democratic principles, based on a federation of communes. Property was held in common, and managed democratically. Free expression was allowed, with theatre being common. Despite being allied with the Bolsheviks, the Soviets betrayed the Black Army and destroyed it, annexing the Free Territory into the Ukrainian SSR.\n\nFinding an authentic Makhnoist in Ukraine is a nigh - if not totally - impossible task. However, decentralization is still a dream for a few Ukrainians, who have started to put their ideas in the open. USRP organizers with a keen eye have noticed that a small Libertarian current now exists in the party. What this means for the party and the nation as a whole is still to be answered."
 ukr_civil_war.25.a:0 "Very Interesting"
 ukr_civil_war.26.t:0 "Commmunist Protest in [Root.Capital.GetName]"
 ukr_civil_war.26.d:0 "Supporters of the USSR began a protest in [Root.Capital.GetName] today to demand the surrender of the Ukrainian Government and the reannexation of Ukraine by the USSR. Speaking to a reporter, one protester had the gall to claim that our government is a \"nest of exploitators and imperialists\", when nothing could be further from the truth. To make matters worse, an OUN grouping arrived to \"disperse\" the protest by physically attacking the communists. By the time the police arrived, four Communists had been beaten severely, while others managed to get away with moderate or minor injury."
 ukr_civil_war.26.a:0 "Barbarity!"
 ukr_civil_war.27.t:0 "The Attack"
 ukr_civil_war.27.d:0 "\"The Attack\" is a new play that just premired in [Root.Capital.GetName]. It tells the story of the Bolshevik campaigns in Ukraine in the First Civil War. The protagonist is an unnamed Ukrainian soldier in Petlyura's Army. He fights the Anarchists, Reds, and Whites but to no avail, as the Bolsheviks push the Ukrainians westward. The story continues during his life in Western Ukraine, fighting against Polish discrimination and his homesickness. The play ends with the Revolution of the New Ukraine, as he travels east to join his countrymen as an officer. The play has proven to be a smash hit with nationalists, and less so with Bolshevik elements."
 ukr_civil_war.27.a:0 "How Romantic."
 #28-30 are hidden
 ukr_civil_war.30.t:0 "Loss in Transnistria"
 ukr_civil_war.30.d:0 "The conflict in Transnistria has been an utter failure for our military. The border strip has failed to remain under our control, and we have had to walk away. This is sure to provide a blow for our government's popularity and outrage radical nationalist groups."
 ukr_civil_war.30.a:0 "It's only a small piece of land, right?'
 #tree
 UKR_2RCW:0 "Ukrainian Revolt Focus Tree"
 UKR_disorganized:0 "State of Anarchy"
 UKR_disorganized_desc:0 "Although the UNDO-USRP Government is recognized by most Ukrainians, they still do not have much authority in the country. Some municipalities are organizing themselves in preparation for the establishment of the Republican Bureaucracy, others are simply lawless."
 UKR_2RCW_Politics_Start:0 "Consolidate Authority"
 UKR_2RCW_Politics_Start_desc:0 "Although many Ukrainians have already recognized the new Government, our administrative bureaucracy has not yet been established in the entire state. We must rectify this matter."
 UKR_2RCW_Political_Parties:0 "Promulgate Party Politics"
 UKR_2RCW_Political_Parties_desc:0 "Our government is generally democratic in nature; it is thus our duty to promote political debate and discussion in the country."
 UKR_OUN_returned:0 "§YThe OUN has crossed the border.§!"
 UKR_freedom_of_speech:0 "Freedom of Speech"
 UKR_2RCW_Freedom_of_Speech:0 "Freedom of Speech"
 UKR_2RCW_Freedom_of_Speech_desc:0 "For far too long, the Ukrainian People have been denied the freedom to express themselves. This repression will be lifted, with the sole temporary exception being speech that threatens national security."
 UKR_2RCW_Jewish_Question:0 "The Jewish Question"
 UKR_2RCW_Jewish_Question_desc:0 "Ukraine is a nation with a large Jewish population, and there is thus an unfortunately relevant degree of Anti-Semitism in our country. It is therefore imperative that we decide on our policy towards the Jews, which will likely be our policy towards other minorities."
 UKR_religious_freedom:0 "Freedom of Religion"
 UKR_personal_freedoms:0 "Personal Freedoms"
 UKR_political_freedoms:0 "Political Freedoms"
 UKR_2RCW_Freedom_of_Religion:0 "Freedom of Religion"
 UKR_2RCW_Freedom_of_Religion_desc:0 "The People of Ukraine have been restricted from openly practicing religion for far too long. The people of Ukraine will finally be allowed to praise their God(s) once again!"
 UKR_2RCW_Freedom_of_Assembly:0 "Freedom of Assembly"
 UKR_2RCW_Freedom_of_Assembly_desc:0 "While our laws towards parties technically allow the Ukrainian People Freedom of Assembly, we should spend some time to codify this freedom into law."
 UKR_2RCW_Municipal_Elections:0 "Organize Municipal Elections"
 UKR_2RCW_Municipal_Elections_desc:0 "Elections at the municipal and raion (county) level will do well to assure the people that we really do care about democracy. Once the war is over, we can arrange elections at all levels."
 UKR_2RCW_Bring_Down_Communists:0 "Bring Down the Communists"
 UKR_2RCW_Bring_Down_Communists_desc:0 "The riots preceding the Revolution resulted in the injury or even death of many Communist Functionaries. However, it is time to bring them before the courts, not the mob."
 UKR_2RCW_Fair_Trials:0 "Fair Trials"
 UKR_2RCW_Fair_Trials_desc:0 "We must give all Communists a fair chance to defend themselves, while we must have a fair chance to prove them guilty of complicity in Bolshevik Crimes. Anything else would be undemocratic."
 UKR_2RCW_Unfair_Trials:0 "Presume Leninist Guilt"
 UKR_2RCW_Unfair_Trials_desc:0 "The Communist Bureaucrats are guilty of being members of the Communist Party, whether by choice or by necessity. Collaborators are Collaborators, and should be punished accordingly."
 UKR_2RCW_Rehabilitating_Lower_Functionaries:0 "Rehabilitate Bolshevik Bureaucrats"
 UKR_2RCW_Rehabilitating_Lower_Functionaries_desc:0 "Lower and Mid-Level Bureaucrats who have been found guilty of smaller crimes can likely be re-educated and rehabilitated. This way, we can avoid alienating much of our society."
 UKR_2RCW_Attack_Internationalism:0 "Discredit Internationalists"
 UKR_2RCW_Attack_Internationalism_desc:0 "One would think that the years of Bolshevik Tyranny would be enough to discredit internationalism in the Ukrainians' eyes, but some must have it spelled out for them."
 UKR_2RCW_National_Idea:0 "The National Idea"
 UKR_2RCW_National_Idea_desc:0 "History shows that the only way Ukraine can establish itself as a nation of freedom is if Ukraine is itself a free nation. The people must know that they do not merely fight for the freedom of the people, but total national soverignty."
 UKR_2RCW_Fight_Spies:0 "Counter-Espionage"
 UKR_2RCW_Fight_Spies_desc:0 "It is a natural assumption that the USSR would attempt to send spies to disrupt our War Effort. Therefore, we must found the Security Directorate as a preliminary counter-espionage unit."
 UKR_anti_espionage:0 "Security Directorate"
 UKR_2RCW_Language_Question:0 "The Language Question"
 UKR_2RCW_Language_Question_desc:0 "So far, we have not designated any official languages. Although we are trying to get people to use Ukrainian, especially in administrative capacities, many continue to use Russian or their ethnic group's languages, such as Yiddish or Moldovan. We should formally settle this issue so that policy would be better informed."
 ##economics
 UKR_2RCW_Economics_Start:0 "Choosing an Economic Policy"
 UKR_2RCW_Economics_Start_desc:0 "Ukrainian Political Life is now dominated by three economic movements: Agrarian Socialism, Cooperatism, and National Corporatism. These three movements are competing for dominance, and the government must formally decide on an answer to this question."
 UKR_reform_coops:0 "Kolgosp Reform"
 UKR_2RCW_Reform_Collective_System:0 "Reform the Kolgosp System"
 UKR_2RCW_Reform_Collective_System_desc:0 "The Collective Farm System was forcibly imposed by Stalin during the Collectivization period, a time where many Ukrainians died of targeted famine. In theory, these \"Collective\" Farms were meant to be owned by those who lived on them, but in reality were state-owned and run. We shall spend time reforming the system so that it is a true collective, where the land is owned cooperatively."
 UKR_2RCW_Decollectivization:0 "Decollectivization"
 UKR_2RCW_Decollectivization_desc:0 "Rather than trying to reform the failed Collective Farm system, we shall instead disband it entirely, giving us a blank canvas with which to work with."
 UKR_2RCW_Voluntary_Cooperatives:0 "Voluntary Cooperatives"
 UKR_2RCW_Voluntary_Cooperatives_desc:0 "It must be made abundantly clear that the cooperatives are entirely voluntary organizaitons, and that any who wish to leave may do so, and take some land with them."
 UKR_2RCW_Disband_Sovkhoz:0 "Disband the Radgosp System"
 UKR_2RCW_Disband_Sovkhoz_desc:0 "State Farms are not incredibly prevalent in Ukraine, but they do exist, and should be dealt with. We shall disband them, allowing the workers to do with the land as they see fit."
 UKR_2RCW_Mixed_Economy:0 "Legalize Private Initiative"
 UKR_2RCW_Mixed_Economy_desc:0 "Private Enterprise will now be legal in Ukraine. Although our already-existing assets will so far remain in state hands, we invite the people to begin producing on their own."
 UKR_2RCW_Inf:0 "Ukrzaliznitsya"
 UKR_2RCW_Inf_desc:0 "What was previously Soviet Railways will henceforth Ukrainian Railways. Although Ukrainian is well-railed, there is always room for improvement."
 UKR_2RCW_Civ:0 "Improve Heavy Industry"
 UKR_2RCW_Civ_desc:0 "We must construct heavy industry plants to ensure that we have something to build with. We will also sell these services to the public if State Needs do not interfere."
 UKR_2RCW_Civ2:0 "Build an Industrial Base"
 UKR_2RCW_Civ2_desc:0 "We have to focus our resources on building up an industrial base lest we lack the ability to develop our nation."
 UKR_2RCW_Mil:0 "Expand Military Production"
 UKR_2RCW_Mil_desc:0 "Our Military Production is worryingly small. We must spend time and resources increasing our production capabilities."
 UKR_2RCW_Mil2:0 "Put the Military First"
 UKR_2RCW_Mil2_desc:0 "We must not waste time building civilian factories during wartime. We must construct military production facilities instead."
 UKR_2RCW_Inf2:0 "Ukrainian Highways"
 UKR_2RCW_Inf2_desc:0 "Although our primary mode of transportation is by rail, we should also have a highway network set up accross the country."
 UKR_trade_unions:0 "Supported Trade Unions"
 UKR_2RCW_No_Union_Restrictions:0 "Lift Restrictions on Trade Unions"
 UKR_2RCW_No_Union_Restrictions_desc:0 "Soviet-Era Laws on Trade Unions are technically still in effect, yet no longer enforced. Although they are not technically allowed to, Ukrainian workers are forming trade unions to represent their interests. We should formally lift all Union Restrictions."
 UKR_cooperatism:0 "Pro-Union and Co-op Policy"
 UKR_2RCW_Encourage_Coops:0 "Encourage Cooperatives"
 UKR_2RCW_Encourage_Coops_desc:0 "Although we are not opposed to traditional private ownership, encouraging cooperative ownership will allow Ukrainian Citizens to be economically competative, both in the country and in foreign markets."
 UKR_2RCW_Encourage_Banking:0 "Expand Credit Unions"
 UKR_2RCW_Encourage_Banking_desc:0 "Ukrainian Credit Unions are the shining example of Cooperative power. We should encourage them to be the main banking sources in the entire country."
 UKR_national_trade_union:0 "Ukraiyinskiy Robitnichiy Front"
 UKR_corporatism:0 "Ukraiyinskiy Robitnichiy Front"
 UKR_2RCW_National_Trade_Union:0 "Ukraiyinsky Robotnichy Front"
 UKR_2RCW_National_Trade_Union_desc:0 "Enough with Red or Yellow trade unions. The Ukranian Workers' Front shall be the only trade union in the country, managed by the Economic Ministry. Although the OUN wants to make it into something like Mussolini had, we will limit their influence for now."
 UKR_2RCW_Vocational_Assemblies:0 "Union Assemblies"
 UKR_2RCW_Vocational_Assemblies_desc:0 "The Economic Ministry will appoint representatives to Economic Assemblies from members of the URF. These representatives will decide on Union Policy, therefore affecting our national Labour Policies. However, for the time being, these will only be advisory boards."
 UKR_2RCW_National_Mobilization:0 "National Mobilization"
 UKR_2RCW_National_Mobilization_desc:0 "The OUN has decided that a period of high spending is necessary to secure our military needs. They have just ordered a very expensive military production complex to be built which helps their reputation among the nationalists, but hurts our wallet."
 UKR_2RCW_Producerism:0 "Nationalize the Banks"
 UKR_2RCW_Producerism_desc:0 "Banks and Credit Unions are speculatory institutions that the OUN feels harms Ukraine. They blame several of Ukraine's problems on \"Anti-Ukrainian\" elements that operate through banks and credit unions. Thus, they seek to nationalize these institutions."
 UKR_2RCW_Coop_Congress:0 "The First Cooperative Congress"
 UKR_2RCW_Coop_Congress_desc:0 "We should hold a congress of all the large cooperative organizations in the country to provide a report of the current economic situation from the consumers' and coop members' point of view, as well as a list of recommendations for the government. Of course, these recommendations are not legally binding, but they will be discussed in the next available session of the Cabinet."
 #Semi Generic Military Tree 1
 SG2RCW_Mil_Start:0 "Consult Veteran Officers"
 SG2RCW_Mil_Start_desc:0 "[This.GetNameDef] needs to have an up-to-date trained army if it is to survive the Civil War intact. We should start by asking veterans about their experiences, as we can build off of them."
 SG2RCW_Mil_Popular_Army:0 "A Popular Army"
 SG2RCW_Mil_Popular_Army_desc:0 "A professional army is good, but we do not have the resources to raise one. Instead, we must rely on a popular army to hold back the enemy beasts!"
 SG2RCW_Mil_Prof_Army:0 "A Professional Army"
 SG2RCW_Mil_Prof_Army_desc:0 "We need an army of high quality if we hope to stand up to the enemy. A popular army is good, but it would be more efficient to have a well-trained army."
 SG2RCW_guerilla_warfare:0 "Guerilla Warfare"
 SG2RCW_guerilla_warfare_night:0 "Guerilla Warfare"
 SG2RCW_guerilla_warfare_partisan:0 "Guerilla Warfare"
 SG2RCW_Mil_Guerilla_Warfare:0 "Guerilla Warfare"
 SG2RCW_Mil_Guerilla_Warfare_desc:0 "Our army must fight using hit-and-run attacks if we are to overpower armies that outnumber several times over."
 SG2RCW_Mil_Night_Attack:0 "Nighttime Attacks"
 SG2RCW_Mil_Night_Attack_desc:0 "Our soldiers must be trained to work in the night. We know the night is not as it would seem: the night is a friend to the [This.GetAdjective] Army. We must learn to fight in it, and outmaneuver the Reds in the dark!"
 SG2RCW_Mil_Resistance_Cells:0 "Resistance Cells"
 SG2RCW_Mil_Resistance_Cells_desc:0 "Our soldiers must train to go underground in the case that the territory they are protecting is taken. They will become the core of a partisan cell that attacks the occupiers."
 SG2RCW_Support_Equipment:0 "Support Equipment"
 SG2RCW_Support_Equipment_desc:0 "Our army needs to be supplmented by engineers corps, reconaissance brigades, and other such support personnel."
 SG2RCW_Bike_Divisions:0 "[This.GetBikeFocus]"
 SG2RCW_Bike_Divisions_desc:0 "[This.GetBikeFocusDesc]"
 Bike_Focus_UKR:0 "Bicycle Divisions"
 Bike_Focus_UKR_Desc:0 "We cannot afford to motorize our army. However, we can try to give them Bicycles and Motorbikes. That should be good enough."
 SG2RCW_Militia:0 "National Militia"
 SG2RCW_Militia_focus:0 "[This.GetAdjective] National Militia"
 SG2RCW_Militia_focus_desc:0 "Forming a National Militia as the core of our actual army would do well to fill the ranks with strong fighters."
 SG2RCW_Small_Arms:0 "New Firearms"
 SG2RCW_Small_Arms_desc:0 "We must put our engineers to work on designing new weapons so that our soldires' arms will remain up to date."
 SG2RCW_Artillery:0 "Artillery Effort"
 SG2RCW_Artillery_desc:0 "Our infantry should be supported by artillery brigades to soften up the enemy soldiers before our frontline engages them."
 SG2RCW_Motorization:0 "Motorized Effort"
 SG2RCW_Motorization_desc:0 "We should invest in mechanizing our army. It will be expensive and difficult, but it will bring great advantages in the field."
 SG2RCW_Navy:0 "Naval Equipment"
 SG2RCW_Navy_desc:0 "Despite its high cost, we should be prepared to launch a modern navy as soon as possible so that we can stand up to other naval powers."
 SG2RCW_Armor:0 "Armour Brigades"
 SG2RCW_Armor_desc:0 "Although this would be even more expensive than mechanization or motorization, including tanks in our ranks would be a great boon, even at the expense of the banks."
 SG2RCW_High_Command:0 "High Command"
 SG2RCW_Chain_of_Command:0 "Chain of Command"
 SG2RCW_Chain_of_Command_desc:0 "Although we do have a command heirarchy, it is largely disorganized. We should spend time structuring our High Command into a unified institution."
 SG2RCW_Discipline:0 "Demand Discipline"
 SG2RCW_Discipline_desc:0 "Our soldiers will act with honor and control! They will not loot, massacre, or steal from the populace."
 SG2RCW_New_Awards:0 "New Awards"
 SG2RCW_New_Awards_desc:0 "The promise of medals and fame will make our army truly a professional one!"
 SG2RCW_Doctrine:0 "Continued Doctrine Effort"
 SG2RCW_Doctrine_desc:0 "Our military thinkers must work faster in creating new strategies to outmaneuver the Soviet Tyranny."
 ##UKR Foreign
 UKR_2RCW_Foreign_Start:0 "Establish the Foreign Ministry"
 UKR_2RCW_Foreign_Start_desc:0 "Although we have a minister of foreign affairs, he and his staff do not really have a formal office. We shall establish the Foreign Ministry so that we can become active globally."
 UKR_2RCW_Foreign_Loans:0 "Foreign Loans"
 UKR_2RCW_Foreign_Loans_desc:0 "In order to finance the war effort, we need to take loans from foreign governments. Such a loan will be paid back within 10 years at 8% interest, as this loan is high risk due to our situation."
 UKR_2RCW_German_Allies:0 "Friends in Berlin"
 UKR_2RCW_German_Allies_desc:0 "We have decided to align with Germany, which brings a great boon to the OUN, who wanted a German alliance against both Poland and the USSR."
 UKR_2RCW_Polish_Allies:0 "Polish Protectors"
 UKR_2RCW_Polish_Allies_desc:0 "For years, Poland has intended to bring a Ukrainian Nation back to the world map. Now that we are trying to be free, the Poles have come to our aid."
 UKR_2RCW_Russian_Allies:0 "Russian Allies"
 UKR_2RCW_Russian_Allies_desc:0 "Our alliance with Tsaritsyn is not exactly known for its trust. We do not entirely believe that Russia will respect our independence any longer than it is convenient for them to do so. However, needs must, so we have joined the Anti-Bolshevik Front."
 UKR_gib_industry:0 "§YWe will ask our ally for Industrial Investments.§!\n"
 UKR_gib_guns:0 "§YWe will ask our ally for Infantry Weapons.§!\n"
 UKR_gib_trade:0 "§YWe will open trading contacts with our ally.§!\n"
 UKR_gib_officers:0 "§YWe will ask our ally to send a Military Attache.§!\n"
 UKR_2RCW_Industry:0 "Industrial Investments"
 UKR_2RCW_Industry_desc:0 "We shall ask our ally to invest in our industry so that we are a more capable alliance partner. With their industry, we will have an easier time beating out the Russians."
 UKR_2RCW_Foreign_Guns:0 "Buy [This.GetUKRAlly] Guns"
 UKR_2RCW_Foreign_Guns_desc:0 "We shall ask our ally to sell us weapons so that we can better arm our soldiers. Such a thing is in their interest, so they will likely accept."
 UKR_pol_guns:0 "Polish"
 UKR_ger_guns:0 "German"
 UKR_rus_guns:0 "Russian"
 UKR_foreign_guns:0 "Foreign"
 UKR_2RCW_Ukrainians_Abroad:0 "Connect with Ukrainians Abroad"
 UKR_2RCW_Ukrainians_Abroad_desc:0 "We must let Ukrainians in Polish and Russian territory remember that the New Ukraine is looking out for their interests. This move will help to stifle OUN growth in the nation."
 UKR_2RCW_Trade:0 "Establish Trading Channels"
 UKR_2RCW_Trade_desc:0 "We must establish [This.GetUKRAlly] trading channels to ensure that we get all the resources we need."
 UKR_2RCW_Foreign_Officers:0 "Invite [This.GetUKRAlly] Officers"
 UKR_2RCW_Foreign_Officers_desc:0 "We shall invite [This.GetUKRAlly] Officers so that they can better educate our officer corps and coordinate with our High Command."
 #decisions
 UKR_2RCW_decs:0 "Ukrainian War of Independence"
 UKR_oun_40:0 "§YThe OUN has over 40 points of influence and the entire Ukrainian SSR is under our control.§!"
 UKR_Claim_Greater_Ukraine:0 "Claim Greater Ukraine"
 UKR_Claim_Greater_Ukraine_desc:0 "From the Mighty San to the Faithful Don, the Glory of Ukraine will hold forever on!"
 UKR_greater_ukraine_tt:0 "§RWe will declare war on any nation that holds the Eastern Frontier of Greater Ukraine.§!\n"
 Transnistria_Escalation:0 "Skirmishes in Transnistria"
 Transnistria_Escalation_desc:0 "Though officially part of Ukraine (Or the Ukrainian SSR, depending on who you ask), the region of Transnistria is claimed by us as integral territory. With the collapse of the USSR, it is clear that we should try and seize it.\n\nCurrent §Ytension§! in the region: §R[?TS_tension?0]§!.\nIf the tension reaches §Y100§! it could lead to a war..."
 TS_attack_Transnistria:0 "Attack Transnistria"
 TS_start_war: "Conflict Escalation"
 TS_start_war_desc:0 "The Transnistrian conflict has escalated too far! If it does not end immediately, we will be facing a large-scale war!"