l_english:
 RULE_ALLOW_FACTION_ACTIONS: "Faction Diplomatic Actions"
 RULE_ALLOW_FACTION_ACTIONS_BLOCKED_DESC: "Countries may not join, offer to join, kick from, leave, or assume control of a Faction."
 RULE_ALLOW_FACTION_ACTIONS_ALLOWED_DESC: "Countries may join, offer to join, kick from, leave, or assume control of a Faction.\nThe AI can't leave or join a faction in any case."
 
 #Game rules
 GER_PATH_SELECTION:0 "£GFX_CBTS_game_rule_flag_WGR  German Paths"
 GER_NO_PREFERENCE_ID:0 "No Preference"
 GER_NO_PREFERENCE_DESC:0 "The AI will not be forced into any given paths."
 GER_WGR_PREFERENCE_ID:0 "£GFX_CBTS_game_rule_flag_WGR  Continue Democracy"
 GER_WGR_PREFERENCE_DESC:0 "The AI will pick a democratic path."
 GER_FAR_RIGHT_PREFERENCE_ID:0 "£GFX_CBTS_game_rule_flag_NAZI  £GFX_CBTS_game_rule_flag_GER  Establish a Dictatorship"
 GER_FAR_RIGHT_PREFERENCE_DESC:0 "The AI will pick a far-right path, though this will still be left up to the event's AI weights."
 GER_NAZI_PREFERENCE_ID:0 "£GFX_CBTS_game_rule_flag_NAZI  Choose Hitler as Chancellor"
 GER_NAZI_PREFERENCE_DESC:0 "The AI will choose Hitler as Reich Chancellor. This is the historical path."
 GER_DNVP_PREFERENCE_ID:0 "£GFX_CBTS_game_rule_flag_GER  Choose Hugenberg as Chancellor"
 GER_DNVP_PREFERENCE_DESC:0 "The AI will choose Hugenberg as Reich Chancellor. This does not affect paths from there."
 SOV_2RCW_ENABLED:0 "Second Russian Civil War Beheviour"
 SOV_2RCW_ENABLED_DESC:0 "Second Russian Civil War Beheviour"
 SOV_2RCW_DEFAULT_ID:0 "Partially Enabled (Recommended)"
 SOV_2RCW_DEFAULT_DESC:0 "The Second Russian Civil War is enabled, but should the AI fail, then the conflict will have a 15% chance to fire. The AI will be given a timed idea instead. Does not apply to players."
 SOV_2RCW_DISABLED_ID:0 "Disabled"
 SOV_2RCW_DISABLED_DESC:0 "The Second Russian Civil War will not fire either way. Instead, the AI will be given a timed idea. Does not apply to players."
 SOV_2RCW_NO_RESTRICTIONS_ID:0 "Enabled without Restrictions"
 SOV_2RCW_NO_RESTRICTIONS_DESC:0 "The Second Russian Civil War will fire if the AI fails the Great Purge. This is the same as a player-led USSR."
 SPR_CW_SELECTION:0 "£GFX_CBTS_game_rule_flag_SPR  Spanish Civil War"
 SPR_RANDOM_CW_ID:0 "Default - No Preference"
 SPR_RANDOM_CW_DESC:0 "The AI will pick different options according to their weight, without any pre-determined outcome."
 SPR_SPA_CW_ID:0 "£GFX_CBTS_game_rule_flag_SPR  vs £GFX_CBTS_game_rule_flag_SPA  Historical - Military Coup Attempt"
 SPR_SPA_CW_DESC:0 "The Spanish Civil War will always start as a military coup attempt against the Popular Front government."
 SPR_SPC_CW_ID:0 "£GFX_CBTS_game_rule_flag_SPR  vs £GFX_CBTS_game_rule_flag_SPC  Ahistorical - Socialist Revolution"
 SPR_SPC_CW_DESC:0 "The Spanish Civil War will always start as a leftist revolution against a CEDA-led Republic."
 SPR_NO_CW_ID:0 "£GFX_CBTS_game_rule_flag_SPR  Ahistorical - No Civil War"
 SPR_NO_CW_DESC:0 "The AI will avoid the Spanish Civil War and Spain will remain a democratic Republic."
 CAT_ind_SELECTION:0 "£GFX_CBTS_game_rule_flag_CAT  Catalan Independence"
 CAT_RANDOM_INDEP_ID:0 "Default"
 CAT_RANDOM_INDEP_DESC:0 "The default AI weights will be used to determine if Catalonia declares independence. §RWARNING: Catalonia can only declare independence if the Spanish left revolts!§!"
 CAT_ALWAYS_ID:0 "Always"
 CAT_ALWAYS_DESC:0 "Catalonia will declare independence as soon as it has the chance. §RWARNING: Catalonia can only declare independence if the Spanish left revolts!§!"
 CAT_NEVER_ID:0 "Disabled"
 CAT_NEVER_DESC:0 "Catalonia will never declare independence."
 USA_PATH_SELECTION:0 "£GFX_CBTS_game_rule_flag_USA  US Foreign Policy"
 USA_DEFAULT_PATH_ID:0 "Default"
 USA_DEFAULT_PATH_DESC:0 "The USA AI will go either towards the historical foreign policy path or the isolationist path, weighted towards the former."
 USA_HISTORICAL_PATH_ID:0 "Historical"
 USA_HISTORICAL_PATH_DESC:0 "The USA AI will always pass the Neutrality Act, but it won't pass the Lundlow Amendment."
 USA_ISOLATIONIST_PATH_ID:0 "Isolationist"
 USA_ISOLATIONIST_PATH_DESC:0 "The USA AI will always pass the Neutrality Act and then pass the Lundlow Amendment, staying out of world affairs."
 USA_INTERVENTIONIST_PATH_ID:0 "Interventionist"
 USA_INTERVENTIONIST_PATH_DESC:0 "The USA AI will repeal the Neutrality Acts and enforce its supremacy in the Americas and in Europe. §RThis path is costly for a player, even moreso for the AI. Use at your own discretion.§!"
 USA_ELECTION_SELECTION:0 "£GFX_CBTS_game_rule_flag_USA  US Presidential Elections"
 USA_DEFAULT_ELECTIONS_ID:0 "Default - Lean Democrat"
 USA_DEFAULT_ELECTIONS_DESC:0 "The US AI will tend towards electing Democrats in Presidential Elections, although they can elect Republicans as well."
 USA_ALWAYS_DEM_ID:0 "Historical - Always Democrat"
 USA_ALWAYS_DEM_DESC:0 "The AI will always elect Democrats in US Presidential Elections, and FDR will be re-elected until his death."
 USA_BALANCED_ELECTIONS_ID:0 "Balanced"
 USA_BALANCED_ELECTIONS_DESC:0 "Regardless of circumstances, Republicans and Democrats have a 50-50 chance of winning Presidential Elections."
 USA_LEAN_REP_ID:0 "Lean Republican"
 USA_LEAN_REP_DESC:0 "The US AI will tend towards electing Republicans in Presidential Elections, although they can elect Democrats as well."
 USA_ALWAYS_REP_ID:0 "Always Republican"
 USA_ALWAYS_REP_DESC:0 "The AI will always elect Republicans in US Presidential Elections."
 ENG_ELECTION_RULE:0 "£GFX_CBTS_game_rule_flag_ENG  British Election of 1935"
 ENG_NO_PREFERENCE_ID:0 "Default - No Preference"
 ENG_NO_PREFERENCE_DESC:0 "The 1935 General Election won't have a guaranteed outcome, making the Conservatives the slight favourites."
 ENG_CON_VICTORY_ID:0 "£GFX_CBTS_game_rule_icon_tory  Conservative Victory (Historical)"
 ENG_CON_VICTORY_DESC:0 "The Conservatives will win a majority in the 1935 General Election, with Stanley Baldwin and later Neville Chamberlain serving as Prime Ministers. Depending on the international situation, a conservative Britain might choose a policy of §Cappeasement§!, §Gcollective security§! or §Ranti-communism§!."
 ENG_LAB_VICTORY_ID:0 "£GFX_CBTS_game_rule_icon_labour  Labour Victory"
 ENG_LAB_VICTORY_DESC:0 "The Labour Party will win a majority in the 1935 General Election, with their leader becoming the new Prime Minister. Depending on the international and domestic situation, a labour Britain might choose a policy of §Cappeasement§!, §Gcollective security§! or, most likely, §Ranti-fascism§!."
 FRA_ELECTION_RULE:0 "£GFX_CBTS_game_rule_flag_FRA  French Political Paths"
 FRA_NO_PREFERENCE_ID:0 "Default - No Preference"
 FRA_NO_PREFERENCE_DESC:0 "The French AI will not be forced into any given paths."
 FRA_PF_VICTORY_ID:0 "£GFX_CBTS_game_rule_icon_sfio  The Popular Front (Historical)"
 FRA_PF_VICTORY_DESC:0 "The left-wing coalition of Radicals, Socialists and Communists will win the 1936 Parliamentary Election, making the socialist Léon Blum the new Prime Minister and adopting more welfare and anti-fascist policies."
 FRA_AD_VICTORY_ID:0 "£GFX_CBTS_game_rule_icon_marlib  The Democratic Alliance"
 FRA_AD_VICTORY_DESC:0 "Either by completing the Reform of the State or by winning the 1936 Election, the centre-right Democratic Alliance will come to power and implement more conservative and business-friendly policies. They will either approach Germany or Italy, or formalize the Little Entente."
 SOV_FORPOL_RULE:0 "£GFX_CBTS_game_rule_flag_SOV Soviet Foreign Policy"
 SOV_FORPOL_DEFAULT_ID:0 "Default - No Preference"
 SOV_FORPOL_DEFAULT_DESC:0 "The Soviet AI will not be forced into any given paths.""
 SOV_FORPOL_MOLOTOV_ID:0 "£GFX_CBTS_game_rule_flag_SOV  £GFX_CBTS_game_rule_flag_NAZI  £GFX_CBTS_game_rule_flag_ITA  Dealing With the Devil (Historical)"
 SOV_FORPOL_MOLOTOV_DESC:0 "Stalin will replace Litvinov with Molotov as Comissar for Foreign Affairs, who will seek a reapproachment with the fascist powers of Europe: Germany, and, if unavailable, Italy."
 SOV_FORPOL_LITVINOV_ID:0 "£GFX_CBTS_game_rule_flag_SOV  £GFX_CBTS_game_rule_flag_FRA  £GFX_CBTS_game_rule_flag_ENG  A Hand to the Capitalists"
 SOV_FORPOL_LITVINOV_DESC:0 "Litvinov will continue as Soviet Comissar for Foreign Affairs, maintaining his Collective Security doctrine by seeking alliances with France and Great Britain"
 SOV_FORPOL_NONE_ID:0 "£GFX_CBTS_game_rule_flag_SOV  End Foreign Policy Adventures"
 SOV_FORPOL_NONE_DESC:0 "The USSR will not seek an alliance or pact with any other great power, focusing on expansion and preparation for the upcoming war."
 YUG_PATHS_RULE:0 "£GFX_CBTS_game_rule_flag_YUG  Yugoslavian Political Paths"
 YUG_PATHS_DEFAULT_ID:0 "Default - No Preference"
 YUG_PATHS_DEFAULT_DESC:0 ""
 YUG_PATHS_JRZ_ID:0 "£GFX_CBTS_game_rule_icon_jrz  The Yugoslav Radical Union (Historical)"
 YUG_PATHS_JRZ_DESC:0 "Some time after King Alexander's assasination, Milan Stojadinović's far-right JRZ (Yugoslavian Radical Union) will become Yugoslavia's ruling party with the support of Slovenes, Muslims and Radicals, but lacking support in Croatia. A JRZ-ruled Yugoslavia will try to avoid war at all costs."
 YUG_PATHS_OPPOSITION_ID:0 "£GFX_CBTS_game_rule_icon_soclib  The Opposition"
 YUG_PATHS_OPPOSITION_DESC:0 "After King Alexander's assasination, the liberal-minded Opposition will form a government, focusing on federalising Yugoslavia and restoring democracy after Alexander's dictatorship."
 YUG_PATHS_ROYAL_ID:0 "£GFX_CBTS_game_rule_icon_monarchy  The Royal Dictatorship"
 YUG_PATHS_ROYAL_DESC:0 "After King Alexander's assasination, Petar Živković will take over and create an opressive Royal Dictatorship."