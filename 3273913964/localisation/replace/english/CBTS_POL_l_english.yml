POL_nationalist_universities:0 "Nationalist Universities"
POL_nationalist_universities_desc:0 "Polish universities in the interwar period were almost completely controlled by the groups associated with the far right. There were numerous attacks on students of Jewish descent, and demands to limit (or remove) Jews from universities were often made.\n\n Anti-Semitism at universities was an extremely broad concept - it included both physical and verbal violence against Jewish students. The most noted cases of the former were: beating Jews, forcibly removing them from lecture halls and university buildings, assaulting them on streets. Both forms often occurred simultaneously - demonstrators attacked passers-by with a Semitic appearance or they segregated them in classes, raising cries about anti-semitism. University anti-semitism also constituted of specific demands from the Polish students in relation to their colleagues of the Mosaic religion, supported partially by the university staff. Not at all universities did conflicts occur with the same intensity. The percentage share of Jewish students was an important variable. Most Jews studied in Vilnius and Lviv, and the least - in Poznań, where the vast majority of students were Poles. However, Jews were never a majority at any university.\n\n Anti-Semitic incidents at the universities of the Second Polish Republic and growing nationalism led to a significant decrease in the number of Jewish students in the 1930s."
POL_communist_threat:0 "Communist Threat"
POL_communist_threat_desc:0 "The Republic of Poland was in a constant state of danger from its Eastern neighbour. This was manifested, inter alia, by the Soviets supporting communist organizations in Poland. The Communist Party of Poland cooperated with numerous minorities living in the territory of the Second Polish Republic, which led to an unstable situation in the eastern borderlands. This "crawling revolution" may have critical consequences in the future, and should be stopped by any means necessary."
