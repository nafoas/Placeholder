###events###
pol_introduction.1.t:0 "The Second Polish Republic"
pol_introduction.1.d:0 "After 123 years of oppression Poland finally regained its independence in 1918. However it turned out the upcoming times wouldn't be easy. First the Polish-Soviet war, which Poland almost lost and only tactical skills of its High Command and luck let it avoid disaster. After the war it turned out that the Polish parliamentary democracy was flawed to the point of hurting the country itself, causing the May Coup of 1926 and the rule of the Sanation regime under the guide of Marshall Józef Piłsudski. After the Great Crisis of 1929, Poland faces monumental challenges, with the economy still nowhere near fixed and the Marshall’s health worsening, spelling incoming political turmoil. Will Poland prevail? Or will it disappear off the maps of Europe once again?"
pol_introduction.1.a:0 "Za honor i ojczyznę!"

pol_prystor.1.t:0 "The Meeting of Two Marshals"
pol_prystor.1.d:0 "During a casual meeting, The Marshall said to Świtalski (Marshall/Speaker of Sejm) that the government made a mistake when setting the yearly height of the military budget, which in his opinion is 60 million PLN too big.\n\nHe considered this fact to be ''shameful'', since he ''started the game of disarmament and an increase in the budget could become an asset in other people's hands''.\n\nThis statement was of course related to Piłsudski's actions on the international stage at the time, but the above accusations were a big surprise for Świtalski.\n\nLater, when the Marshall of the Sejm tried to explain the point of the meeting in his notes, he rightly found some hidden meaning in those words, the meaning which he was unable to guess however.\n\nIt appears as if Piłsudski is dissatisfied with the work of the Prime Minister Prystor, but for what reason?"
pol_prystor.1.a:0 "This is worrying for sure."

pol_prystor.2.t:0 "Ongoing Conflict between Mrs. Piłsudska and Mrs. Prystor"
pol_prystor.2.d:0 "Aleksandra Piłsudska, despite an earlier invitation, ostentatiously did not appear on the "tea" party in Vilnius that she has been invited to by the Prime Minister and his wife as part of the celebrations commemorating the liberation of the city, going instead to meet a military family in one of the many garrison casinos. This comes as a surprise and a hurtful action for the Prime Minister, indicating some unknown quarrels and disputes, possibly between the two ladies."
pol_prystor.2.a:0 "What does this all mean?"

pol_prystor.3.t:0 "Falling Support of Aleksander Prystor"
pol_prystor.3.d:0 "Following recent developments, happening on the highest tiers of the government hierarchy, our Prime Minister's prestige and support is at risk. Aleksander Prystor is an important member of the Colonels faction within our camp, and his position provides it, and Walery Sławek, with much needed power and influence. It would be unwise to lose such a position."
pol_prystor.3.a:0 "We should see to it immediatelly"

pol_prystor.4.t:0 "Mrs. Piłsudska Openly Criticises Prime Minister in 'Kuryer Codzienny'"
pol_prystor.4.d:0 "A shocking news reached the leadership of our camp today. The wife of Marshall Piłsudski, Mrs. Piłsudska, has written a short opinion on our current Prime Minister in a widely-read Polish newspaper called "Kuryer Codzienny".\n\n To say the least, it does not present Mr. Prystor in the best light. Considering Mrs. Piłsudska's public importance, the text is bound to harm the public opinion of our Prime Minister. What should we do? Considering she is a wife of our de-facto leader, we should be extremely careful."
pol_prystor.4.a:0 "It's better not to anger the Marshall"
pol_prystor.4.b:0 "Censor her opinion."

pol_prystor.5.t:0 "Fury of the Marshall"
pol_prystor.5.d:0 "A meeting was called at the Marshall's residence today. When all important members of our camp were present, he scolded our actions against his wife, wondering what were we even thinking when making the decision to censor her opinion piece in the newspaper. He was furious, to say the least."
pol_prystor.5.a:0 "What can we do then?"

pol_prystor.6.t:0 "BBWR Members Are Undermining Prystor's Authority"
pol_prystor.6.d:0 "Following the opinion of questionable quality written by Mrs. Piłsudska, members of our own camp have felt emboldened to voice their dissatifaction about the work done by Mr. Prystor, claiming his work style as "erronous" and "unsatisfactory", even suggesting such outrageous things as replacing him! This undermines the prime minister's authority within the camp and is bound to enbolden other questionable elements within our organisation to dare to criticize him.\n Should we do something about it?"
pol_prystor.6.a:0 "Treacherous bastards! Shut them up!"
pol_prystor.6.b:0 "Just ignore them..."

pol_prystor.7.t:0 "Speech in Warsaw"
pol_prystor.7.d:0 "Both Mr. Prystor and Mr. Piłsudski are scheduled to speak at an important speech in a few days. The question is, however, should their wives be allowed to speak too?? Or is that simply too dangerous considering recent developments in our internal affaris?"
pol_prystor.7.a:0 "It's better to say nothing, than to say too much"
pol_prystor.7.b:0 "They should be allowed to express their opinions"

pol_prystor.8.t:0 "Two fierce speeches, by Two furious women"
pol_prystor.8.d:0 "Unsurprisingly, this didn't go well. The speech of Mr. Piłsudska was visibly, albeit not outright, implying the incompetence of our Prime Minister, discretely pointing out mistakes he has done over the years. Mrs. Prystor tried to counter it in her speech, gloryfing the rule of her husband. The situation is - to say the least, quite enflamed."
pol_prystor.8.a:0 "Should have seen that coming."

pol_prystor.9.t:0 "Charity Event"
pol_prystor.9.d:0 "A Charity event is being organised at one of Grohman's mansions. However with the recent ongoing "conflict" between Mrs. Prystor and Mrs. Piłsudska, one could ask a question - is it really wise to invite them? This could bring terrible consequences to the already strained authority of our Prime Minister, Aleksander Prystor."
pol_prystor.9.a:0 "Why not? What's the worse that could happen?"
pol_prystor.9.b:0 "It's wiser not to invite them..."

pol_prystor.10.t:0 "Charity Event Ruined"
pol_prystor.10.d:0 "The charity event was going well, however at one point a discussion has "broken out" between the wife of the Prime Minister and the wife of the Marshall. Soon enough, it evolved into a strife, an event that was bound to gather attention of the attendees. I think it's safe to say that the meeting was ruined, with the two ladies surprising everybody with their crossness."
pol_prystor.10.a:0 "This is getting annoying!"

pol_prystor.11.t:0 "Pre-Electoral Meeting with the Marshall"
pol_prystor.11.d:0 "The marshal's Belvedere room was bathing in shadows. A knock at the door broke the silence.\n\n'Enter' said the Marshall dryly\n\nTwo characters entered the room, Walery Sławek and Kazimierz Świtalski, two of his close associates.\n\n'You wanted to see us, Commandant' said Świtalski\n\n'Yes, I have an important matter to discuss with you two' said the Marshall and looked at them from under his bushy eyebrows.\n\n'It's about the upcoming Presidential election,' he continued\n\n'As well as about our dear friend Prystor' the last two words sounded as cold as if someone had opened a window in the middle of winter.\n\n'I don't like his system of work.' said Marshall\n\n'He wants to know everything and to interfer with everything. Such a system is first-class and can be kept only with very hard work. When fatigue occurs, all the bad sides of such a system appear and it ends with a lack of control. Prystor's work system is similar to Bartel's, but Bartel...' Marshall raised his index finger\n\n'He had a higher style of work.'\n\nBoth guests looked at each others while Marshall continued his rant\n\n'He uses 'his' people he treats as trusted and whom he pays with money or government positions. These little dogs can compromise our morals at any moment. Conspiracies are forming that can turn into a scandal that will compromise Prystor and prevent him from being used by us later.'\n\nŚwitalski and Sławek knew what Marshall will say next..."
pol_prystor.11.a:0 "We should defend Prystor at all costs!"
pol_prystor.11.b:0 "He's on his own"

pol_prystor.12.t:0 "Prystor Prevailed"
pol_prystor.12.d:0 "Following our discussion with the Marshall, Aleksander Prystor was allowed to stay as the Prime Minister. He has been informed of the problems seen by Piłsudski, and he promised to seek to fix his work issues. This will greatly boost the power of the Colonels faction within our camp. We wish Prystor to continue his work efficiently and without problems."
pol_prystor.12.a:0 "As per our agreement with the Marshall"

pol_government.1.t:0 "Prystor Resigns"
pol_government.1.d:0 "Following our discussion with the Marshall, Aleksander Prystor was pressured to resign after the Presidential elections, to the discontent of Walery Sławek who deemed the Prime Minister as useful and powerful ally. Today he filed the note of resignation to the President, who accepted it without hesitation as per our plans. The new Prime Minister was already chosen from within our camp - Janusz Jędrzejewicz is to take the position. We wish him the best of luck."
pol_government.1.a:0 "It's over for him."




pol_election.1.t:0 "1933 Polish Presidential Elections"
pol_election.1.d:0 "After the May coup in 1926, Józef Piłsudski was looking for a person who would like to take the office of the President of Poland. \n\nThe Marshall himself did not want to become one because, in his opinion , the March Constitution gave the head of the state too little power.\n\nOn May 31, 1926, the National Assembly elected Piłsudski as President.\n\nHe received 292 votes, and his opponent from National Democracy, Adolf Bniński - 193. The Marshall, however, did not accept his election.\n\nIn the end, Ignacy Mościcki, a scientist and former member of Polish Socialist Party has been chosen as new President of the Republic. Mościcki was supposed to be a seemingly independent and apolitical candidate. He was, however, a devoted follower of Piłsudski, whom he knew from his activities in the socialist movement."
pol_election.1.a:0 "Mościcki served us well, he shall stay for another term"


pol_internal.13.t:0 "Prystor remains as the Prime Minister"
pol_internal.13.d:0 "Following our discussion with the Marshall, Aleksander Prystor was allowed to stay as the Prime Minister. He has been informed of the problems seen by Piłsudski, and he promised to seek to fix his work issues. This will greatly boost the power of the Colonels faction within our camp. We wish Prystor to continue his work efficiently and without problems."
pol_internal.13.a:0 "As per our agreement with the Marshall"


pol_internal.18.t:0 "All-Polish Youth protests!"
pol_internal.18.d:0 "Following our education reform, we have successfully decreased the nationalist influence on institutions of learning, as well as successfully unified the curriculum all across the country, among other things. However this has visibly made some groups upset – the All-Polish Youth, an organisation uniting nationalist students on many universities across Poland, has organised several protests all over Poland today. Their demand is obviously unacceptable – the reform is here to stay."
pol_internal.18.a:0 "They can protest, we don't care"
pol_internal.18.b:0 "Delegalize them"

pol_internal.19.t:0 "Camp of Great Poland protests the delegalization of All-Polish Youth"
pol_internal.19.d:0 "It appears that the right-wing opposition has decided to confront us once again, this time protesting our ban of the All-Polish Youth, claiming that we are undemocratic despots, trying to censor their views and not allowing them to freely voice their opinion. Obviously the topic of the education reform was tackled too, once again criticizing the removal of rampant nationalism and antisemitism from the universities."
pol_internal.19.a:0 "Seems like we have to delegalize them too!"

pol_internal.20.t:0 "Camp of Great Poland and All-Polish Youth members join SN"
pol_internal.20.d:0 "Following our delegalization of the two nationalist groups, their members, while still surely operating underground, still with their party structures intact, have officially joined the National Movement."
pol_internal.20.a:0 "We got to keep an eye on them..."

pol_internal.21.t:0 "National-Socialist Worker's Party is created"
pol_internal.21.d:0 "The former regional organisator of the National Movement, thrown out of the party for radical views, Wacław Kozielski has announced today the formation of a new party - The National-Socialist Worker's Party. The group appears largely inactive both ideologically and culturally."
pol_internal.21.a:0 "They are a fringe group anyway"

pol_internal.22.t:0 "Union of Young Nationalists emerges"
pol_internal.22.d:0 "Out of the splits and quarrels following our delegalisation of two nationalist groups, a good thing emerged! It's the Union of Young Nationalists, which has announced their willingness to join the ranks of the many pro-government youth organisations. Their plan is to create a new, modern plan for Polish nationalism, merging many ideas of sanationism with the ideas of Polish nationalism."
pol_internal.22.a:0 "Welcome them, this will only strengthen us"

pol_internal.23.t:0 "National Radical Camp is created"
pol_internal.23.d:0 "The continuing conflicts between the "young" and the "old" nationalist activists within the ranks of the National Movement have caused some of the "young" members to split away, forming the National-Radical Camp. It calls for implementation of the ideas of national radicalism, as well as fascism in some cases."
pol_internal.23.a:0 "Keep an eye on them, just in case."

pol_internal.10.t:0 "ONR March"
pol_internal.10.d:0 "The falangist National Radical Camp has decided to organise a march in Warsaw to commemorate the anniversary of the 3rd May Constitution."
pol_internal.10.a:0 "This does not bother us."

pol_internal.11.t:0 "OWP March"
pol_internal.11.d:0 "The national-democrat Camp of Great Poland has decided to organise a march in Warsaw to commemorate the anniversary of the 3rd May Constitution."
pol_internal.11.a:0 "It does not bother us!"

pol_internal.26.t:0 "The National Radical Camp is causing problems"
pol_internal.26.d:0 "Following repeated law infringements and questionable actions by the National Radical Camp, there is an opportunity. The public opinion is slowly drifting towards believing that, after all, it was the National Radical Camp which was behind the assasination of minister Pieracki, and this presents a great chance for us to finally - once and for all, delegalize this band of fascists, who have been nothing but a catalyst for unrest and creating divisions within our population that exist only in the nationalist mind."
pol_internal.26.a:0 "The time has come to outlaw them and their little group."
pol_internal.26.b:0 "They may actually come handy in the future."






pol_government.2.t:0 "Janusz Jędrzejewicz Resigns"
pol_government.2.d:0 "Janusz Jędrzejewicz has decided to step down as Prime Minister today, to the dissatisfaction of Marshall Piłsudski and President Mościcki. However he insisted, underlining that since the beginning, he was supposed to be on the position for only a year.\n\nHis departure was greeted without regret even in the circles of the ruling camp.\n\nThe supporters of stiffening the political course accused him of being too liberal in his actions, they even suspected him of being connected with the "Repair" faction.\n\nConservatives criticized him for not having the best, despite his efforts, relations with the clergy.\n\nThe Sanation liberals accused him of purges in higher education and solidifying Pieracki's policies.\n\nEven the organizations of academic and school youth he had created and cherished began to refuse to obey his orders.\n\nLeon Kozłowski, a relatively unknown professor of archeology on the University of Lwów, has been chosen as his successor by the Marshall."
pol_government.2.a:0 "We wish him a smooth term"

pol_internal.24.t:0 "Pieracki assasinated!"
pol_internal.24.d:0 "Minister Pieracki arrived to the social club on Foksal street in a limousine at 3:30 PM. When he got out of the car and headed for the entrance to the building, a suspicious person followed him. The bomber approached Pieracki and tried to detonate the bomb prepared earlier. The fuse however, which was a glass tube, failed. In the face of such a development, the assailant pulled out his revolver and shot Pieracki three times, hitting him in the back of the head. The assassin went out into the street and, despite being pursued by a policeman (assisted by the minister’s chauffeur), managed to escape the area. Minister Pieracki was immediately rushed to the hospital, where, despite treatment, he died on the same day.\n\nAmong the suspect groups responsible for this treacherous act of aggression are the recently delegalized National Radical Camp, and the Organization of Ukrainian Nationalists, known to be angered by the internal affairs minister’s attempts of reconciliation with less radical Ukrainian groups."
pol_internal.24.a:0 "Those bastards!!!"

pol_internal.80.t:0 "The Creation of Bereza Kartuska Prison"
pol_internal.80.d:0 "Following the acts of political terror, Prime Minister Kozłowski, with the permission of Marshall Piłsudski, has decided to create the Bereza Kartuska prison. It is to house jail cells for the most dangerous political individuals that could destabilize the Polish Republic. First radical Ukrainian nationalists, Polish communists, anarchists and nationalists, are being arrested to face jail in this prison, often without official arrest warrants or sentences."
pol_internal.80.a:0 "The enemies of the state shall tremble!"

pol_internal.81.t:0 "Question of the Bereza Kartuska Prison"
pol_internal.81.d:0 "Around a year ago we have created the Bereza Kartuska prison. According to the Marshall, it was supposed to operate exactly for this long – just enough to keep the situation stable and under control. Today comes the question, do we still need it to upkeep peace in the country? If we are to close it, it may be easier for us to negotiate with the opposition later on, maybe gaining their support along the way."
pol_internal.81.a:0 "It's of no use anymore, close it."
pol_internal.81.b:0 "Our Enemies will have no rest!"

pol_internal.83.t:0 "New Interior Minister Appointed"
pol_internal.83.d:0 "After Bronisław Pieracki was murdered by Ukrainian nationalists, the Ministry of the Interior was headed by the Prime Minister himself, Leon Kozłowski, for some time, who used this time to implement the provisions of the Presidential decree establishing the camp in Bereza Kartuska. After successfully carrying out this task, the Prime Minister appointed Marian Zyndram-Kościałkowski as a new minister of the interior. Despite the circumstances of Kościałkowski's nomination (as he is associated with the moderate wing of the Sanation), it is perceived by the public as the beginning of the liberalisation of the system. The new minister has decided to streamline local administration, already planning trips around the country, as well as to reach an agreement with moderate groups of Ukrainian politicians. Informal talks with representatives of the Ukrainian National Democratic Alliance are to begin shortly."
pol_internal.83.a:0 "We wish him better luck than Pieracki's"


#Constitutional Reform
pol_constitution.1.t:0 "Sanation and March Constitution"
pol_constitution.1.d:0 "The basic premise of the political thought of the Sanation camp was the idea of the supremacy of the state as the highest form of organization of society.\n\nThe interest of the state was the supreme value, and therefore all social groups, nationalities and other forms of social organisation forming the state should submit to it. However, immediately after the May Coup, the question of political system revision was not the dominant issue in political life at the time.\n\nWhen Piłsudski's followers took power, they did not have a coherent concept of the state, let alone a programme of systemic reforms, but his questioning of the principles of parliamentary democracy, the March Constitution and the multi-party system was based on a vision of a different system of power and a belief in a different state ideology.\n\nNot all of Piłsudski-ites wished to see a complete abolition of parliamentary rule, but all shared a conviction that the executive would be strengthened at the expense of the legislative, and were aware of the shortcomings of the March Constitution."
pol_constitution.1.a:0 "Interesting"

pol_constitution.2.t:0 "Meeting of the Constitutional Committee"
pol_constitution.2.d:0 "Constitutional Committee meets"
pol_constitution.2.a:0 "Interesting"

pol_constitution.3.t:0 "Conference with the Prime Minister"
pol_constitution.3.d:0 "We meet with Prime Minister"
pol_constitution.3.a:0 "We should create Constitutional Editorial Team"

pol_constitution.4.t:0 "Work of BBWR Constitutional Editorial Team"
pol_constitution.4.d:0 "In the spring, an Editorial Team of several people was formed.\n\nThese were mainly ''Colonels'' or, to a lesser extent, people cooperating with the group.\n\nThe Constitutional Team undertook the creation of the first ten articles of the new constitution (''Decalogue'') and the principles of the statute of the so-called ''Legion of Merit''\n\nIn early summer, Stanisław Car and Bohdan Podoski were invited by President Mościcki to his summer residence in Spała to work on the final draft of the Constitution."
pol_constitution.4.a:0 "Interesting"

pol_constitution.5.t:0 "Car and Podoski in Spala"
pol_constitution.5.d:0 "From the memoirs of Bohdan Podoski:\n\n''In the summer of 1933, Stanisław Car traveled with me to Spała, at the invitation of President Mościcki.\n\nWe spent an entire month there, devoted to drafting a new constitutional law. Car edited the draft, discussing with me one by one each proposed provision.\n\nWe worked all day until dinner, with a break for lunch, which we usually ate together with the President. Car was very concerned about my every critical remark. He could stay up all night thinking about how to better formulate a proposed legal article. This clearly shows how much importance he attached to the best possible fulfillment of the task he had undertaken.\n\nWe returned to Warsaw with an almost finished draft of the new constitutional law.''"
pol_constitution.5.a:0 "Interesting"

pol_constitution.6.t:0 "Meeting of Tenants' Assembly"
pol_constitution.6.d:0 "Tenants' Assembly Meet"
pol_constitution.6.a:0 "We should prepare for the meeting of Presidium of BBWR"

pol_constitution.7.t:0 "Meeting of the Presidium of BBWR Parliamentary Club"
pol_constitution.7.d:0 "Presidium of BBWR Parliamentary Club Meet"
pol_constitution.7.a:0 "We should prepare for the Legionnaires' Rally"

pol_constitution.8.t:0 "1933 Legionnaires' Rally"
pol_constitution.8.d:0 "Sławek Presents BBWR's Aims for the New Constitution at the Legionnaires' Rally\n\nAn influencial leader of the Colonels faction and a close friend of Józef Piłsudski, Walery Sławek, presented his aims for the new constitution at the Legionairres meeting.\n\n The constitution is supposed to form a new, solidarist Polish state, led by the elites of the society. The Polish will work for the common good of the nation and themselves in a new, classless society with Marshall Piłsudski as its leader."
pol_constitution.8.a:0 "Three Hurrays for Sławek!"

pol_internal.66.t:0 "Work of the Constitutional Committee is finished"
pol_internal.66.d:0 "The Constitutional Committee, formed in order to create and polish a new Polish constitution, that will ensure stability and prosperity, has announced that its work is done - the constitutional theses are complete! With much of the work and supervision done by Mr. Stanisław Car, of course, our camp's main law interpreter."
pol_internal.66.a:0 "Finally! To the Sejm!"

pol_internal.68.t:0 "Opposition quits the Sejm Hall"
pol_internal.68.d:0 "At the session of the Sejm, the Commission's report on the course of work on the BBWR's proposal to amend the Basic Law was presented. No one knew that this report was actually a draft of the new constitution. When Stanisław Car read a paper on the new Basic Law, the opposition left the Sejm hall in protest. However, Mr. Car has an idea how we could bend law to our advantage and vote this constitution through anyway…"
pol_internal.68.a:0 "Let's use this to our advantage..."

pol_internal.70.t:0 "Changes to the Parliament Code"
pol_internal.70.d:0 "Mr. Car, after discussing the matter with the Speaker of the Sejm, decided that the absence of the opposition should be taken advantage of and the draft of the Constitution should be voted through an emergency vote, just like a simple law. However, such conduct is not allowed by law."
pol_internal.70.a:0 "We can bend the law to our liking."

pol_internal.71.t:0 "Invitation of Deputy Niedziałskowski and Protest of Deputy Storoński"
pol_internal.71.d:0 "Marshall Świtalski decided to keep up the illusion of legality and invited the opposition MP Mieczysław Niedziałkowski, informing him about the upcoming vote on an important law. In the meantime, Mr. Car has submitted a motion to recognise the "constitutional theses" as a draft of a new constitution and to change the title of it to "Constitutional Act". This was met with the resistance of Stanislaw Stroński, who pointed out that, according to the article 125 of the March Constitution, such a motion should be made at least 15 days before the planned vote."
pol_internal.71.a:0 "As if we care. Vote it through!"

pol_internal.72.t:0 "BBWR votes on the Theses"
pol_internal.72.d:0 "The faces of our Sejm club members are radiant. Everybody's happy, Deputy Marshall Car wipes sweat off his face with a scarf. "What a piece of work." The First Brigade anthem can be heard. There is joy everywhere. At first the Marshall of the Sejm rings the bell slightly and the singing stops just for a moment, but then the Chairman of our club, Walery Slawek, gives a sign to the Marshall of the Sejm. Kazimierz Świtalski puts the bell down. The song continues to ring. The still-sitting government ministers get up and starting singing too, the joy is indescribable.\n\nThe secretary of the Sejm reads some further conclusions. No one listens to it, however. Chairman Sławek kisses Deputy Marshall Car. Deputy Marshall Makowski embraces and kisses Car, and a scene of mutual cheek kissing takes place. The most kissed is the creator of the new constitution, Deputy Marshall Car. Then he goes towards the government chamber. Along the way the Secretary of the Sejm, grabs him and kisses him too."
pol_internal.72.a:0 "Now into the Senate!"

pol_internal.73.t:0 "Senate's Amendments"
pol_internal.73.d:0 "A debate on the draft constitution took place in the Senate - the draft was presented by a conservative supporter of the Sanation, Wojciech Rostworowski. The Senate's amendments were grouped into 60 points, the main changes being:\n\n- Editorial changes in the chapter on Presidential powers,\n-Ending proportionality in elections to the Sejm,\n-The term of both chambers of parliament is equal,\n-Changes to the election system of the Senate, whose composition will be chosen by the "Legion of Merit", as well as changes to the number of senators and the manner of their appointment,\n-Some changes concerning the judiciary."
pol_internal.73.a:0 "Good addition to almost a perfect constitution!"

pol_internal.74.t:0 "Opposition Senators' Complaints"
pol_internal.74.d:0 ""Further deliberations in Senate were of a turbulent nature - among others, the Speaker of the Senate did not allow for a discussion on how the draft was to be voted through in the Sejm, the Senator of Endecja pointed out that there was no definition of the term 'nation' in the text, and according to the PPS, the Constitution expanded 'the interests of the possessing classes'. Representatives of national minorities - German and Ukrainian - were also against the project."
pol_internal.74.a:0 "We couldn't care less."

pol_internal.75.t:0 "Senate votes yes on Constitution"
pol_internal.75.d:0 "98 senators took part in the vote on the project in the Senate (the required quorum is 2/3 of the composition, or 66 senators). There were 74 Senate members for and 24 against, with one abstention. According to the above, the Constitutional Act was adopted!"
pol_internal.75.a:0 "The last step is complete... Finally we can change the future!"

pol_internal.78.t:0 "Marshall Piłsudski Angry over recent events in Sejm"
pol_internal.78.d:0 "Following our vote in the Parliament, which has granted us a new, accepted constitution, Marshall Piłsudski has called a meeting. He was quite cross, one could say. Angered over the fact that we have voted on the constitution despite the absence of the opposition - clearly violating democratic values of the parliament. We are to wait a bit before voting on the constitution in the Senate - to calm down the opposition at least a bit, not to spark any unrest."
pol_internal.78.a:0 "We messed up...but hey, we voted it through!"

pol_internal.77.t:0 "The April Constitution"
pol_internal.77.d:0 "The April Constitution put the state in the foreground, but treated it as a structure organizing social life and guaranteeing individual rights. The citizen was guaranteed equality before the law, the possibility to develop personal values and freedom of conscience, speech and association, but limited by the common good, because no action can contradict the objectives of the state as expressed in its rights. In case of resistance, the State applies coercive measures. The military, belonging to the mobilized part of the army or navy, could not participate in general elections."
pol_internal.77.a:0 "I have never seen a better constitution!"

pol_government.3.t:0 "Third Sławek's Government Appointed"
pol_government.3.d:0 "As per tradition, after adopting a new constitution, our government has issued a request to step down to the President.\n\nPrime Minister Kozłowski hoped for Mościcki to not accept it, however, the President, being in conflict with Leon Kozłowski for some weeks now, accepted his request.\n\nLeon Kozłowski will be remembered as the one of the people responsible for the new election system and the Bereza Kartuska political prison.\n\nHis successor has been nominated by the President. Walery Sławek, a powerful member of our camp and a close friend of the Marshall, will undertake the duty to lead the government."
pol_government.3.a:0 "An important event for the Colonels faction"

pol_internal.2.t:0 "Piłsudski is dead!"
pol_internal.2.d:0 "Today the Marshall of Poland was found dead. While it was already expected by his closest associates, after a medical examination conducted by doctor Karel Wenckebach a month ago uncovered a liver cancer in late stages of development, it still comes as a shock to the nation and the ruling camp, undermining the stability and morale of the country. Józef Piłsudski died on the 9th anniversary of the 1926 May Coup, the event that brought his camp to rule the Republic of Poland. A national mourning will be announced, with the burial of the great Marshall expecting to become one of the biggest public events in our country’s history."
pol_internal.2.a:0 "Rest in peace..."

pol_internal.79.t:0 "The Next Army Inspector"
pol_internal.79.d:0 "General Inspector of the Armed Forces is an office created in 1926, after the May Coup. The General Inspector reports directly to the President, and is not responsible to the parliament or the government. In the event of war, the General Inspector is to become the Commander-in-chief of the Polish Armed Forces.\n\nFollowing the death of Marshall Józef Piłsudski, the position is empty, and needs a successor to undertake the duty to protect Poland and its citizens from foreign and internal threats. This person, considering the position’s high status and power, should be known for not meddling in political matters, that are the President’s and the Prime Minister’s job."
pol_internal.79.a:0 "Śmigły is the most appriopiate candidate."
pol_internal.79.b:0 "Sosnkowski may be political, but he will ensure stability."

pol_internal.3.t:0 "BBWR power vacuum"
pol_internal.3.d:0 "With the death of Marshall Piłsudski, comes a loss of a great leader that gave directions to our ruling camp. Without him the various factions battle for power, arguing over each other’s ideas of how to run the Republic of Poland. Harsh times lie ahead, and with our internal squabbles, the future does not look bright if we do not find a common ground or win over the other."
pol_internal.3.a:0 "The fight starts now"

pol_internal.84.t:0 "New Electoral System"
pol_internal.84.d:0 "It was decided that only the elite is to be elected to the senate, consisting of:\n(1). those who have been distinguished,\n(2). people with higher education, \n(3). people elected to collective bodies by citizens,\n(4). officers(including the reserve officers), \n(5). teachers(including folk teachers)\n\nThe election system to the Sejm will become more complicated by the introduction of electoral assemblies. Citizens will now elect only 208 deputies(instead of 444), divided into 104 constituencies, each of which elects 2 deputies. \n\nVoting remains equal, secret, universal and direct, but the right to advance candidates is being greatly constrained. In the past, anyone with fifty signatures could apply as a candidate, and the list of candidates with at least fifty signatures had to be accepted by an election commission. Now, the selection of candidates will be controlled by the electoral assembly."
pol_internal.84.a:0 "This will benefit us greatly."

pol_internal.85.t:0 "The 1935 Parliamentary Elections"
pol_internal.85.d:0 "After the new electoral law was drawn up, the time has come to implement it. The Polish parliamentary elections of 1935 are to be a test of the citizens' support for the reforms carried out by the Sanacja regime."
pol_internal.85.a:0 "This will be a show of strength for our camp!"

pol_internal.86.t:0 "Oppposition Boycott"
pol_internal.86.d:0 "Due to the elitist and anti-democratic nature of the new electoral law, all opposition parties (not including some minority parties) decided to boycott the ongoing parliamentary elections. This may significantly affect the voter turnout."
pol_internal.86.a:0 "Their loss."

pol_internal.87.t:0 "Sour Win"
pol_internal.87.d:0 "The election ended with the victory of the Sanation camp, which won 180 seats in the Sejm, thus gaining a constitutional majority. On the other hand, it is worth noting that the representatives of the BBWR are mostly those for whom no mandate was originally foreseen (about 130 MPs). 74 candidates considered to be "certain" did not get into the Sejm. \nApart from BBWR politicians, national minorities (except for their left-wing factions, which boycotted the vote together with the Polish opposition) and individual MPs not affiliated with any party entered the parliament. From the nationality view, 181 Poles, 19 Ukrainians, 3 Jews and one Russian and one Byelorussian each gained seats. The Germans will not be not represented in the Sejm of the 4th term at all.\n\nThe vote was boycotted by parties opposed to the rule of Sanacja (the Centrolew, communists, the National Party and Christian Democrats), as a result of which the turnout was the lowest in the history of the Second Polish Republic - 46.6%. In the territory of central Poland, many of the votes that were supposedly cast for the opposition were invalidated.\n\nThe official data on the turnout has already been questioned by the "Warsaw National Daily" newspaper, which after calculating the number of people taking part in the elections stated that the turnout was in fact only 35%."
pol_internal.87.a:0 "Hard to call that a success..."

pol_government.4.t:0 "Prime Minister Sławek Resigns"
pol_government.4.d:0 "The parliamentary elections turned out to be unsuccessful for the ruling camp - the electorate largely listened to the calls of the opposition, boycotting the elections. The turnout was only at 45.9% of those allowed to vote. And the Prime Minister Sławek was blamed for this.\n\nFor this reason, he gradually lost direct influence on the current policy. His government failed to cope with the economic crisis, which resulted in Sławek's resignation from the post of the head of the cabinet. The latter, when it turned out that Mościcki had no intention to resign, opposed the proposals of some of the most famous Piłsudski’s supporters who wanted to openly call on the President to resign. He considered this as unacceptable pressure on the head of state. And in this situation, decided to insist on respecting the provisions of the Constitution.\n\n At the farewell meeting of the ruling camp MPs, he said:\n"Let's not try to translate certain decisions into authorities that we would follow outside of the framework defined by the constitution, into authorities that could conflict with the organisation of the state or with the law contained in the constitution. (...) The law, as the supreme regulator, is to govern us.”"
pol_government.4.a:0 "Is this the end of Sanation as we know it?"

pol_government.5.t:0 "New Kościałkowski's Government"
pol_government.5.d:0 "The opposition did not take part in the elections as they boycotted them.\n\nOnly Piłsudski-ites and some national minorities won seats in the Parliament.\n\nThe President demanded that Sławek appoints Kwiatkowski as Deputy Prime Minister, additionally stating that he was keeping the presidency for himself.\n\nSławek had previously stated that after Piłsudski's death, Polish law would be governed by, i.e. the April Constitution, which put significant power in the hands of the President.\n\nSo Sławek was the first to respect this law when it turned against him and resigned.\n\nMarian Zyndram-Kościałkowski became the new Prime Minister. He was a decent, liberal man, a bit of a snob, left-wing by conviction."
pol_government.5.a:0 "Godspeed through these uncertain times..."

pol_internal.89.t:0 "BBWR Disbanded"
pol_internal.89.d:0 "Sławek is, or rather now, was, at the head of the organisation he called 'The Camp' and which was not a party, because as everyone knows, parties strive for power. The BBWR only supported Marshall Piłsudski’s power without demanding it for itself. But Sławek understood that the BBWR was slowly becoming a party – the one thing he hated and wanted to avoid. Thus he has dissolved the organisation.\n He had two reasons:\n1. He felt that a lot of small scandalous career seekers were being pushed into the organisation, and he felt disgusted by them, just like Piłsudski did when he said 'that lice have slandered me';\n2. Sławek was against any parties and absolutely did not want, did not allow, and never did agree to have his own party."
pol_internal.89.a:0 "He did what?!"



pol_internal.91.t:0 "1940 Presidential Elections"
pol_internal.91.d:0 "Seven years have passed since the last President election. The time has come for the National Assembly to elect the head of state. The new President of Poland will be..."
pol_internal.91.a:0 "Our current President wins a reelection!"


#Piłsudski's Funeral

pol_funeral.1.t:0 "Death of the Marshal"
pol_funeral.1.d:0 "The Marshal died at 8:45 in the evening of May 12, 1935.\n\nThe President was sought to announce the news over the radio, and as the President was on his way by car from Spala to Warsaw, an announcement of great national importance was made over the radio, and it was not until 1:05 at night that the Marshal's death was announced.\n\nBut within two hours the news spread all over Poland. Already before 10 a.m. everybody in the Polish cities and towns knew about it; in the cafés the orchestras stopped playing, the musicians abandoned their instruments, anxious groups of people gathered on the sidewalks..."
pol_funeral.1.a:0 "What will happen now?"

pol_funeral.2.t:0 "Coffin in the Belvedere"
pol_funeral.2.d:0 "I remember a few fragments from the funeral day best. The open coffin at the Belvedere and a lot of people crying, convulsive sobs of ladies who were passing by the coffin. A huge crowd at the gates of the Belvedere, few and rather decent mounted police and again lots of people crying.\n\nLater, as the coffin was being carried out of the Belvedere. It was evening, the sun was setting. Chestnut trees, which had been planted by King Stanislaw August, protected Belweder from the street. From the candles inside and from the sunset, Belweder turned yellow, like a wax candle, like a thimble.\n\nOn the left side of the stairs stood General Smigly-Rydz, standing upright, sliding his hand past the buttons of his uniform, separately from the generals who stood in a line on the other side of the palace, with General Sosnkowski first on the right. If it had been not Śmigły-Rydz, but the heir to the throne burying his father's king, this gesture would have been sympathetic to me, it would mean: ''Now the responsibility falls on me.''\n\nBut then it made an unpleasant impression on me.\n\nThen we saw through the windows of the Belvedere how the candles flickered and how the coffin was carried out, covered with a silk sheet with the White Eagle. I remembered then that moving the coffin from the catafalque was always the hardest moment for me in family funerals."
pol_funeral.2.a:0 "Silence was all around."

pol_funeral.3.t:0 "St. John's Cathedral"
pol_funeral.3.d:0 "The body of Marshal Pilsudski was brought to St. John's Cathedral in Warsaw and left under the vault for the night.\n\nAnd from the morning the Warsaw crowd began to flow like a river. There were thousands, tens, hundreds of thousands of people, and the people stood for eleven hours waiting for their turn to pass quickly by the coffin, to have a quick look at its closed lid."
pol_funeral.3.a:0 "A feeling of nervousness swept over the whole country."

pol_funeral.4.t:0 "Mokotów Fields"
pol_funeral.4.d:0 "In the Mokotów Field in Warsaw there was a military parade in front of the Marshal's coffin...The last parade! His coffin on a carriage stood high above the audience stands, on the same place where he usually received parades during his lifetime.\n\nRegiments with banners were marching, magnificent infantry, cavalry, artillery. The drums were growling deafeningly.\n\nIt was a threatening, magnificent, impressive spectacle, especially at the moment when blacker and blacker clouds began to gather and lightning began to flash above the Marshal's coffin.\n\nAnd everyone was in a mood of horror and fear..."
pol_funeral.4.a:0 "...what will happen to Poland?"

pol_funeral.5.t:0 "Funeral at Wawel"
pol_funeral.5.d:0 "The morning of the day of the funeral at Wawel Cathedral, the eternal resting place of most Polish kings and their families, national heroes and bishops.\n\nNow a final resting place of the First Marshal of Poland.\n\nA procession was developing in front of the inconspicuous little square in the Cracow Railway Station.\n\nThe march in Cracow exceeded all calculations. The crowd marched to Wawel from 8 in the morning until 6 in the evening. It was a river, an avalanche, a sea of people.\n\nRepresentatives of all countries marched, there were special envoys of His British Majesty in red uniforms, there was the French Prime Minister Laval, there was Goring, decorated with medals.\n\nLots of uniforms, orders and formal attires, then the clergy in liturgical robes, then a long procession of almost all the archbishops and bishops of Poland, there were also bishops of Orthodox Church.\n\nLatin and Orthodox Crosiers next to each others, Latin liturgical vestments and Byzantine robes.\n\nThen there were also traditional coats from Cracow and Lublin, highlander outfits, and noblemen's tunics.\n\nFor the last time we saw the great Poland in its Sienkiewiczian glory."
pol_funeral.5.a:0 "The Sigismund Bell was tolling..."


pol_internal.12.t:0 "The Gold Standard Question"
pol_internal.12.d:0 "With the global crisis the Gold Standard has become unstable and unreliable, causing many governments to abandon it completely. We should choose our way, which will determine our further actions to alleviate damage that our economy sustained because of the global downturn."
pol_internal.12.a:0 "Abolish the Gold Standard"
pol_internal.12.b:0 "Stay with the Gold Standard"


pol_internal.14.t:0 "Grave event at the Day of Independence Celebrations"
pol_internal.14.d:0 "On the Independence Day celebrations the Marshall of Poland and our leader, Józef Piłsudski, has collapsed, sparking questions among the population over his state of health. It is of utmost importance to conduct a medical examination to make sure he is alright."
pol_internal.14.a:0 "Lets hope everything is alright..."


POL_ship_purchase_orders: "Ship orders"
POL_ship_purchase_orders_desc: "Our country lacks the naval facilities and the tools to produce new ships our navy requires. To solve this issue, we have arranged deals with foreign naval powers to provide us modern ships in exchange of money.\n\nHere will appear all the ships that we have ordered to other nations."

pol_navy.1.t: "ORP Orzeł is laid down!"
pol_navy.1.d: "Today, submarine ORP Orzeł (meaning 'eagle') was laid down at the Dutch shipyard De Schelde, per the order we placed on the dutch to buld the Polish navy 2 new submarines. The sub has a modern design, which was made in cooperation with a team from the Dutch Navy, and incorporates some features of the earlier Dutch submarine HNLMS O 16 including the external trainable mount. The design is made to fulfill the Polish requirements for a multi-purpose vessel, to be used both in the shallow waters of the Baltic Sea and in the high seas. Soon its sister ship, the OPR Sęp (vulture) will be laid down too."
pol_navy.1.a: "A modern submarine for a modern navy!"

POL_order_orzel: "Building ORP Orzeł - The Netherlands"
POL_order_sep: "Building ORP Sęp - The Netherlands"







pol_internal.29.t:0 "Death of Daniel Konarzewski"
pol_internal.29.d:0 "General Daniel Konarzewski was found dead today, having suffered a heart attack in his home at around 8AM."
pol_internal.29.a:0 "A great loss for the Polish Army..."

pol_internal.30.t:0 "Gustaw Orlicz-Dreszer dies in a plane crash!"
pol_internal.30.d:0 "The catastrophe happened at 14:14. According to the witnesses of the accident, the plane coming from Sopot at a height of approximately 1000 meters made a few laps over the German school ship "Deutschland", then unexpectedly headed for land. They could hear the engine running unevenly. The pilot probably tried to launch on the shallow waters or on the beach, which was prevented by a gust of wind. Eventually, the plane fell into the water, around 5 meters in depth. Despite the immediate rescue operation, which was undertaken after 10 minutes by the Polish Red Cross rescuers Ignacy Walczyk and Alojzy Karolewski, who dived trying to get to the people trapped in the plane, help from ships in the vicinity and resuscitation procedures carried out by the local doctor Dr. Pokutyński, all military personnel on board the plane were killed: Division General Gustaw Orlicz-Dreszer, Lieutenant Colonel Stefan Loth and Captain Pilot Alexander Łagiewski."
pol_internal.30.a:0 "The Polish Army loses an important figure."

pol_internal.31.t:0 "Gustaw Orlicz Dreszer barely avoids death!"
pol_internal.31.d:0 "At 14:14,  according to the witnesses, a plane coming from Sopot at a height of approximately 1000 meters made a few laps over the German school ship "Deutschland", then unexpectedly headed for land. They could hear the engine running unevenly. The pilot tried to launch on the shallow waters or on the beach, and succeeded, stopping a couple meters before the pier. All military personnel on board survived, with minor injuries: Division General Gustaw Orlicz-Dreszer, Lieutenant Colonel Stefan Loth and Captain Pilot Alexander Łagiewski."
pol_internal.31.a:0 "That was close, too close!"





pol_internal.63.t:0 "PPS and Leftist Agrarians Present Their Vision on New Constitution"
pol_internal.63.d:0 "The Sejm left (PPS, PSL "Wyzwolenie" and the Peasant Party) in its project wanted above all to liquidate the Senate and introduce general elections for the President. It was also in favour of the right of legislative initiative for citizens, granting territorial autonomy to national minorities living in Poland, a provision on separating the state from the Church, as well as an amendment to Article 99 of the March Constitution on property relations (agricultural reform)."
pol_internal.63.a:0 "We both aim for the same thing."
pol_internal.63.b:0 "An interesting vision! Make some empty promises."
pol_internal.63.c:0 "Never."

pol_internal.64.t:0 "PSChD, NPR and Rigth-wing Agrarians debate on their vision"
pol_internal.64.d:0 "The Polish Christian-Democratic Party and the National Workers' Party have issued their vision of the new constitution. They see future Poland as a solidarist state, with increased rights for the Polish catholic church."
pol_internal.64.a:0 "We can't increase church's influence!"
pol_internal.64.b:0 "Surely church's support might be useful"
pol_internal.64.c:0 "It's just are a light version of what the ND wants..."

pol_internal.65.t:0 "The National Party Fiercely Pushes their Vision"
pol_internal.65.d:0 "The National Club was a team of the National Party's national democrat parliamentarians. Its basic bill assumed the election of the President by the National Assembly. According to the draft, the Parliament was to change its name to Sejm - which was to consist of the Chamber of Deputies and the Senate. Both chambers would be equal in powers and duties. Changes in electoral law: in addition to the increase in age censuses, the introduction of curial voting for 1/2 of the members elected by universal suffrage, 1/4 - elections conducted among people with at least secondary education, 1/4 - elections among economic associations: chambers of agriculture, trade, etc. It was also proposed to increase the term of the Senate to 9 years and "reduce the influence of national minorities in the country"."
pol_internal.65.a:0 "Make some promises and then forget about it"
pol_internal.65.b:0 "As long as Dmowski is alive we will never compromise!"
pol_internal.65.c:0 "General Śmigły suggested cooperationg with them..."




pol_internal.82.t:0 "Śmigły's Proposal"
pol_internal.82.d:0 "Following the death of the Marshall, our camp could not see even a bit of peace. The internal fights still continue over the power once held by Piłsudski. Today, following the swearing in of the new prime minister, and President Mośckicki’s political actions, the General Inspector of the Armed Forces, Edward Rydz-Śmigły, has issued an answer – a proposal. He suggests the President should work with him to form the new political landscape of Poland or else... . Or else what?"
pol_internal.82.a:0 "Over my dead body!"
pol_internal.82.b:0 "It's the only way..."







#Vilnius Conflict

pol_internal.92.t:0 "Polish Ultimatum"
pol_internal.92.d:0 "The Polish government has issued an ultimatum. We are to drop all our claims regarding the Vilnius region, and open our borders to Poland. They have been closed since the Polish incursion into the Vilnius region during the Polish-Soviet war. What should we do?"
pol_internal.92.a:0 "We will accept their demands."
pol_internal.92.b:0 "Never!"

pol_internal.93.t:0 "Ultimatum Rejected"
pol_internal.93.d:0 "The Lithuanian government has rejected our ultimatum"
pol_internal.93.a:0 "Goddamn Lithuanians! To hell with them!"

#Zaolzie Conflict

pol_internal.94.t:0 "Polish Ultimatum"
pol_internal.94.d:0 "The Polish government has issued an ultimatum. We are to cede the Zaolzie region we once rightfully took from them during the times of the Polish-Soviet war."
pol_internal.94.a:0 "We will accept their demands."
pol_internal.94.b:0 "Never!"

pol_internal.95.t:0 "Ulltimatum Rejected"
pol_internal.95.d:0 "The Czechoslovak government has rejected our ultimatum"
pol_internal.95.a:0 "Goddamn Czechs!"

#National Holydays

pol_internal.1000.t:0 "Workers' Day"
pol_internal.1000.d:0 "In Poland, the first celebrations took place in 1890 and were often held against the will of the partitioners, co-organized, among others by activists of the Second Proletariat. Mass demonstrations, marches and clashes with the tsarist army, police and Cossacks, as well as nationalist militants supporting them took place during the 1905 revolution in the Polish territories of the Russian partition, they were organized mainly by the Polish Socialist Party, Social Democracy of the Kingdom of Poland and Lithuania and the Bund. Similarly, numerous parades and demonstrations of class workers' organizations and leftist parties, including the Polish Socialist Party, the Jewish Bund, the illegal Communist Party of Poland, the Polish People's Party "Liberation", the Communist Party of Western Ukraine, the Communist Party of Western Belarus also took place on this day during the Second Polish Republic, they were often attacked by the police and nationalist militants, murders of trade union class activists and left-wing parties took place. \nThe application to establish May 1 as a universal labor day throughout Poland, with the right to a day off, was discussed in the Legislative Sejm in 1919."
pol_internal.1000.a:0 "Wyklęty powstań, ludu ziemi!"

pol_internal.1002.t:0 "3rd May Constitution Day"
pol_internal.1002.d:0 "On May 3, 1791, the second, after the Corsican, constitution in modern Europe was adopted, and in the world, the third, after the American one. Overtaking, among others French constitution. This constitution was adopted by the Four-Year Sejm, which was convened in October 1788. \nDuring the partitions of Poland, the celebration of the anniversary of the Constitution of May 3 was forbidden by all partitioners. Poles who dared to celebrate this holiday in public were severely punished by the police. In 1892, Stanisław Mieczyński, a teacher in Warsaw, was arrested by the secret Russian police in Warsaw for placing a bouquet of violets on the anniversary of the Constitution on May 3, after which he was sent for a three-year sentence to Odessa. The ceremonial celebration of the anniversary of the Constitution of May 3 was organized in 1916-1918 in many cities (most numerous in Warsaw in 1916) after the withdrawal of Russian troops and authorities from the area of the so-called Congress Poland Kingdom. \nAfter regaining independence in 1918, the anniversary of the Constitution of May 3 was recognized as a national holiday by a resolution of the Legislative Sejm of April 29, 1919."
pol_internal.1002.a:0 "Witaj majowa jutrzenko!"


#Flavor 

pol_internal.15.t:0 "The Death of the Polish Habsburg"
pol_internal.15.d:0 "The former candidate for the throne of Poland in 1918, Karol Stefan Habsburg, is dead. The monarchist circles all over Poland are now mourning the death of one of their best candidates. He was a patriotic Polish visionary."
pol_internal.15.a:0 "Rest in peace"



