POL_constitution_decisions:0 "Polish Constitutional Reform"
#POL_constitution_decisions_desc:0 "The basic premise of the political thought of the Sanation camp was the idea of the supremacy of the state as the highest form of organization of society. The interest of the state was the supreme value, and therefore all social groups, nationalities and other forms of social organisation forming the state should submit to it. However, immediately after the May Coup, the question of political system revision was not the dominant issue in political life at the time. When Piłsudski's followers took power, they did not have a coherent concept of the state, let alone a programme of systemic reforms, but his questioning of the principles of parliamentary democracy, the March Constitution and the multi-party system was based on a vision of a different system of power and a belief in a different state ideology. This article familiarises the reader with the considerations and arguments of a legal, political and doctrinal nature raised by the Sanacja activists in favour of amending the Constitution, as well as with the critical comments on parliamentary democracy made by some of those who in 1928 were involved in the debate on the need for a thorough reconstruction of the state system. Not all of them were Piłsudski-ites wishing to see a complete abolition of parliamentary rule, but all shared a conviction that the executive would be strengthened at the expense of the legislative, and were aware of the shortcomings of the March Constitution."

