l_english:
POL_GATHERING_STORM_DESC2:0 "After 123 years of oppression Poland finally regained its independence in 1918. However it turned out the upcoming times wouldn't be easy. First the Polish-Soviet war, which Poland almost lost and only tactical skills of its High Command and luck let it avoid disaster. After the war it turned out that the Polish parliamentary democracy was flawed to the point of hurting the country itself, causing the May Coup of 1926 and the rule of the Sanation regime. After the Great Crisis of 1929, Poland faces monumental challenges, trying to find its place on the international stage and fix its own internal problems before any of its former enemies awaken once again."
#POLideas
POL_poland_aib:0 "Poland A & B"
POL_poland_aib_desc:0 "Poland A & B" refers to a political, cultural and developmental distinction between the western and the eastern part of the country, with Poland "A" being much more developed and having faster economic growth than Poland "B". Poland "A" produces 85% of the country's electricity and 100% of its steel. Poland "B" is more rural and agricultural, with a GDP almost two times smaller than that of western Poland. This has led to an unbalanced economy in our country, which forces the industrial west to support the struggling east."
POL_poland_aib2:0 "Poland A & B"
POL_poland_aib2_desc:0 "Poland A & B" refers to a political, cultural and developmental distinction between the western and the eastern part of the country, with Poland "A" being much more developed and having faster economic growth than Poland "B". Poland "A" produces 85% of the country's electricity and 100% of its steel. Poland "B" is more rural and agricultural, with a GDP almost two times smaller than that of western Poland. This has led to an unbalanced economy in our country, which forces the industrial west to support the struggling east."

POL_total_opposition:0 "Suppressed Opposition"
POL_total_opposition_desc:0 "After the May Coup Jozef Pilsudski began to fight the right-wing opposition (Endecja).\n\nAfter the 1928 elections, Piłsudski's party (BBWR) became the largest party in the Sejm. However, it did not have the constitutional majority to amend the Constitution without the support of the opposition.\n\nAfter two years of fighting in the Sejm, the Left and Center parties (Socialists, Agrarians, Christian Democrats) united to form a coalition called Centrolew.\n\nPilsudski decided to declare "total war" on the opposition, the Sejm was dissolved, elections were called, and opposition leaders were arrested. As a result, BBWR won 46.7% of the seats in the Sejm, and 69.3% of the seats in the Senate.\n\nThe opposition was broken up, some of its leaders remained arrested, and others had to go into exile."
#POL_ignacy_desc:0 "Ignacy Mościcki, the current President of the Republic of Poland, was not always a politician.  Long before honoring Piłsudski's request that he undertake the presidency, Mościcki was actually a renowned chemist. During his career, his research focused on the distillation of crude oil - one of his methods was even widely adopted in the United States (ironically not in Poland due to lack of funds). He also achieved huge success in the field of industrial chemistry, reanimating the once-forgotten Polish ammonia and carbide factories. Thanks to his efforts, by 1923 Poland was free from a dependency on imports for such and many other materials. As President, his legacy as a chemist continues with revitalizing of Polish industry, this time on a much grander scale."
POL_great_crisis:0 "Effects of the Great Depression"  
POL_great_crisis_desc:0 "Like much of interwar Europe, Poland faces monumental economical challenges. The so called "Great Crisis" came to a head after the Great Depression hit the United States, succesfully bringing down not only the American economy, but also many other all around the world. It has already been 4 years since it was Poland's turn to fall, and it's clear that the situation is indeed stabilising, but it's far too soon to talk about a full recovery."
