POL_ukrainian_nationalism:0 "Minority Problems"
POL_ukrainian_nationalism_desc:0 "The Polish-Ukrainian War has left scars on the minds and bad tastes in mouths of Poland and Ukraine alike. A brief moment of unity came with the signing of a later alliance, one that might allow the two nations to fend off the "Red Menace" side by side.  However, due to Polish internal disagreements, Ukrainians were ignored in the terms of the Peace of Riga in 1921, a decision that demolished the wartime friendship they so carefully built together. For many Ukrainians, it had seemed that the inward-looking Polish government held its own domestic squabbles in more importance than their lives. Ever since the botched peace, Ukrainian Nationalists have posed a serious threat in Poland."
POL_bbwr_crumbling:0 "BBWR Crisis"
POL_bbwr_crumbling_desc:0 "With Marshall Piłsudski dead, the unifying force in our camp has dissapeared, sparking internal struggles for power."

