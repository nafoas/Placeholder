 #ideas
 IRE_anglo_irish_trade_war:0 "Anglo-Irish Trade War"
 IRE_anglo_irish_trade_war_desc:0 "Since 1932 the Irish Government has refused to continue reimbursing Britain with land annuities from financial loans granted to Irish tenant farmers to enable them to purchase lands under the Irish Land Acts in the late 19th Century, a provision which had been part of the 1921 Anglo-Irish Treaty. This has resulted in the imposition of unilateral trade restictions by both countries, causing severe damage to the Irish economy." 
 IRE_rural_country:0 "Rural Economy"
 IRE_rural_country_desc:0 "Under Britain most of Ireland's industry was developed in the North, leading to a Southern economy more heavily reliant on farming, especially pastoral farming, as its main economic engine. The comparitive prosperity of foreign nations like the USA has also led to huge waves of immigration from Ireland, which compounded with a low birth rate has left Ireland with a very small population for her size."
 IRE_troubled_past:0 "Troubled Past"
 IRE_troubled_past_desc:0 "Between harsh centuries of British rule, the 1919 War of Independence and 1922 Civil War, Ireland has much to be bitter about in its' history. The country still feels the deep divisions over recent events, especially the Civil War its' outcome, that will likely be felt for decades to come."
 IRE_irish_neutrality:0 "Irish Neutrality"