 # Leaders
 hombre_simbolo:0 "El \"Hombre Símbolo\""
 procrastinator:0 "Procrastinator"
 POLITICS_DANIEL_SALAMANCA_DESC:0 "Born into a wealthy Spanish-speaking haciendado family from Cochabamba, Daniel Salamanca Urey followed the footsteps of much of the Bolivian elite in pursuing a Bachelor's degree in Law at University of San Simón, never exercising his profession, however, due to \"lack of material necessity\". In some aspects, though, the young Daniel Salamanca clearly differentiated himself from the rest of the upper-class. Suffering from chronic gastrointestinal problems since his childhood, he wasn't able to eat much and did develop a skinny and austere appearence as a result. His personality developed accordingly to his exterior self, too, as Salamanca became an introverted man of only a few friends - something highly unusual in the Bolivian society of the time, which put great value in relationships and family - prone to very rigid thinking and an unbending moral conduct. \n\nEntering the political scene as a deputy for Cochabamba around the Civil War of 1899, he was somewhat sympathetic to the previous Conservative regime, even though he joined the Liberal Party due to lack of choice. Being a maverick inside his own party, and having showed himself a very fine orator - not necessarily a good dealer, however - he was essential to the demoralization of the Liberal governments, being the main figure behind the creation of the Republican Party. Framed in the mindset of XIX-century classical liberalism, and as rigid and dogmatic as he was, Salamanca became famous for criticizing the Liberal regime for its lack of freedom of speech, political centralization and abuse of Executive Power, which he continued to criticize in the Republican government of Bautista Saavedra, breaking once again with the government. \n\nIn opposition the the ruling Republican Party, Salamanca and his followers founded a new political organization, this time dubbed the \"Genuine\" Republican Party. It then became clear the type of politician that he was: finding it difficult to maintain close interpersonal relationships, he usually left the day-to-day political negotiations to his fellow partisan companion, Juan Maria Escalier, while Salamanca himself, with his fiery speeches denouncing the abuses of governmental power, served as the face of the party. He was precisely this: a symbol. \n\n\"El hombre símbolo\", as he became known, ran for the Presidency against the Republican Hernando Siles in 1925, but was unable to win. With the downfall of the Siles presidency, however, the unbending defender of legality seemed the most natural choice to head a coalition presidential ticket, together with the support of the Liberal Party and, at least initially, Saavedra's Republican Socialists. What seemed to be a promising hope to a new, more democratic future, turned out to be as rotten and authoritarian as ever, however. A bad negotiator and an uncompromising politician, Daniel Salamanca quickly turned to authoritarianism and emergency measures to control the opposition and the \"communists\", which suddenly appeared as an integral part of the Bolivian political life due to the claustrophobic and hyperbolic discourses of the cornered Salamanca. Not only the opposition, but soon even his former allies, the Liberals, turned against him due to his temparament and matters of economic policy. Obviously the Crash of 1929 didn't make things easier, as it struck the South American country very badly, with the orthodox and dogmatic Salamanca having difficulty adapting to the unparalleled situation. Perhaps, as a result of his political difficulties, Daniel Salamanca Urey turns more nationalistic every day, having escalated the Chaco Boreal border dispute to the point of no return..."
 
 # Ideas
 BOL_bankrupt_country_0:0 "Bankrupted Country"
 BOL_bankrupt_country_0_desc:0 "Since the turn of the century, Bolivia has grown increasingly dependent on tin mining as its only source of hard currency, as the rest of the Bolivian economy barely reaches subsistence levels. When the Depression hit Bolivia, the country felt more than most of its neighbors, as the tin mining industry was already struggling with overproduction since the 1920s. What followed the initial crash wasn't pretty: a sharp fall in government revenues, massive unemploymeny and a decrease in Bolivia's ability to import, affecting internal purchasing power. While the international Tin Control Scheme has alleviated some pressure on tin prices, small and medium miners have been struggling due to the harsh - and state sponsored - enforcement of production quotas, which seem to be primarily helping the big producers such as Patiño and Hochschild due to the high fixed costs in Bolivia."
 BOL_declining_tin_extraction_0:0 "Declining Tin Extraction"
 BOL_declining_tin_extraction_0_desc:0 ""
 BOL_bolivian_army:0 "The Bolivian Army"
 BOL_bolivian_army_desc:0 "Possessing relatively modern foreign weapons and having inherited the legacy of a German military mission, Bolivia's army is certainly capable and packs and punch. However, they are restricted by a lack of enthusiasm from their soldiers as they are primarily drawn from the Quechua natives of the Andes, and perform very poorly in hot areas. In addition to the morale problem, the Bolivian Army is plagued by bad leadership, from the constant intromissions by President Salamanca to the lack of preparedness of the Estado Mayor General itself."
 BOL_fragmented_society:0 "Fragmented Society"
 BOL_fragmented_society_desc:0 "Bolivia has few of the characteristics that define a modern nation-state, and as such has only managed to develop a limited concept of citizenship. First and most shocking, is the lack of a widely accepted national language, as the Spanish, the official language of the elites, is only spoken by less than 20% of the population, not to mention the widespread illiteracy. The overwhelmingly rural population, living either as peasants or in indigenous communities, barely manages to overcome starvation levels, having almost no contact with the Spanish-speaking citizens of the towns. The geography of the country only helps to widen the existing disparities, as the existence of hot and cold, jungle and mountain, in the same nation only serves as another barrier between the peoples of \"Altiplano\" and of those of the eastern regions."
 BOL_landlocked_country:0 "A country without Ports"
 BOL_landlocked_country_desc:0 "Since the humiliating defeat at the hands of the Chileans in 1883, Bolivia has lost its access to the sea. There are however, a few ways that Bolivia can connect to the outside world, such as the Antofagasta & Bolivia Railway and the Peruvian Corp. Ltd., which connect Bolivia to Chile, Peru and Argentina. While these routes serve us well in connecting us to the Pacific Ocean, we still lack easy access to the Plata basin and thus to the Atlantic Ocean. However, one huge opportunity appears in front of us: the Paraguayans are weaker than us and currently occupy almost all the right margin of the Paraguay River. If we manage to take our rightful lands of the Chaco Boreal, our control over the Paraguay River and  the ability to trade with the outside world might be increased to unprecedented levels..."
 
