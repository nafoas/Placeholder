SAF_election33:0 "The Election of 1933"
SAF_election33_desc:0 "Many issues are present in the aftermath of the 1933 election- our economy is in shambles, our political sphere maintains only a tenuous sense of unity, and we are unsure of what the future holds. We must tackle all of these issues if we are to be confident in moving forward with policies."
SAF_coalition_solidification:0 "Coalition Unified"
SAF_coalition_solidification_desc:0 "The Coalition must unify, lest we lose the large majority- and our ability to effectively legislate. Not unifying the coalition could have dire consequences..."
SAF_depression:0 "Dealing with the Depression"
SAF_depression_desc:0 "The Depression must be dealt with soon, or else we will sink even lower- and economic recovery will become a distant dream."
SAF_east_africa_war:0 "The East African War"
SAF_east_africa_war_desc:0 "East Africa is a land of many peoples, many cultures- and many colonizers. Between the waning Ethiopians, the territory-hungry Italians, and the occasionally feuding British and French, it is no wonder that conflict would find its way here. However, with these constantly changing fields of combat, who is in control of which territory is always in question- and with South African involvement, the balance of power can tip rapidly."
SAF_Spawn_Defense_Divisions:0 "Supply Divisions for the Defense of Kenya"
SAF_Invest_Nyasaland_Infrastructure:0 "Invest in Nyasaland Infrastructure"
SAF_Invest_Tanzania_Infrastructure:0 "Invest in Tanzanian Infrastructure"
SAF_Invest_Uganda_Infrastructure:0 "Invest in Ugandan Infrastructure"
SAF_Invest_Kenya_Infrastructure:0 "Invest in Kenyan Infrastructure"
SAF_Somalian_Triumph:0 "Triumph in Somalia"
SAF_Ethiopian_Triumph:0 "Triumph in Ethiopia"
SAF_Eritrean_Triumph:0 "Triumph in Eritrea"
SAF_west_africa_war:0 "The West African War"
SAF_west_africa_war_desc:0 "The Western African Theater is not the most industrial, nor is it the most strategically important- but it still matters nonetheless in any potential conflict. As a potential staging area for attacks into our south, it holds the opportunity for our would-be enemies to hit us where it hurts- and a hostile French or Spanish government would be perfectly poised to take advantage of this. As such, we must not ignore this theater, even as we concentrate on other areas. If we lose Western Africa, Eastern or Central Africa may fall next, and then... South Africa herself may be put in jeopardy."
SAF_Secured_French_West_Africa:0 "Secure French West Africa"
SAF_Secured_Spanish_West_Africa:0 "Secure Spanish West Africa"
SAF_Secure_Nigerian_Administration:0 "Secure the Nigerian Administration"
SAF_Secure_Gold_Coast:0 "Secure the Gold Coast"
SAF_Secure_Sierra_Leone:0 "Secure Sierra Leone"
SAF_south_africa_war:0 "The Southern African War"
SAF_south_africa_war_desc:0 "The Southern African region is both the most secure and most imperiled- if we can ensure its safety, the region provides a breadbasket and hearth for all of our potential campaigns in Africa. If it is lost, we will have lost one of our most important trade links and will have a much more difficult time engaging any threat, as well as being under foreign jackboots. As such, ensuring our situation down here is not in jeopardy is paramount, and we will make any decisions on this region with the gravest seriousness."
SAF_Secure_Bechuanaland:0 "Secure Bechuanaland"
SAF_Secure_Southern_Rhodesia:0 "Secure Southern Rhodesia"
SAF_Secure_Northern_Rhodesia:0 "Secure Northern Rhodesia"
SAF_Secure_Angola:0 "Secure Angola"
SAF_Secure_Mozambique:0 "Secure Mozambique"
SAF_Negotiate_Madagascar:0 "Negotiate with the Madagascar Administration"
SAF_Seize_Madagascar:0 "Seize Madagascar from the Vichy Government"
SAF_mediterannean_war:0 "The War in the Mediterranean"
SAF_mediterannean_war_desc:0 "The War in the Mediterranean can be considered one of the most influential that will be fought in Africa- with every major European colonizing power having territories of some strategic importance here. It is no surprise, then, that we are called up to support the British in their great crusade- to both defend the sands of Egypt and attack into enemy territory, refusing their efforts to seize the Mediterranean for their own. However, we must also be cautious- the loss of the Suez Canal and the dominance of a foreign power could spell doom for our war effort."
SAF_Fortify_Suez:0 "Fortify the Suez Canal"
SAF_Hold_British_Egypt:0 "Hold British Egypt"
SAF_Secured_Italian_Libya:0 "Secure Italian Libya"
SAF_Secured_French_Tunisia:0 "Secure French Tunisia"
SAF_Secured_French_North_Africa:0 "Secure French North Africa"
SAF_Secured_Spanish_North_Africa:0 "Secure Spanish North Africa"

