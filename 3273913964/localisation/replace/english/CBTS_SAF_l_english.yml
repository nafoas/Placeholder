 #Automatic Agreeing
 SAF_Volksraad.1.t:0 "The SACP supports our Motion"
 SAF_Volksraad.1.d:0 "Communist Party MPs have declared their support for our motion in the Volksraad. When it comes time to vote, they will vote in support of the motion. In a recent interview, an MP described the measure as \"imperative to developing class consiousness in South Africa, bringing us one step closer to revolution.\""
 SAF_Volksraad.1.a:0 "An interesting development."
 SAF_Volksraad.2.t:0 "The ICWU supports our Motion"
 SAF_Volksraad.2.d:0 "ICWU MPs have declared their support for our motion in the Volksraad. When it comes time to vote, they will vote in support of the motion. An article in one of the Union's papers describes the motion as \"an important reform in improving the lot of the Coloured and White worker alike.\""
 SAF_Volksraad.2.a:0 "An interesting development."
 SAF_Volksraad.3.t:0 "The Madeley Faction supports our Motion"
 SAF_Volksraad.3.d:0 "Madeley Labour MPs have declared their support for our motion in the Volksraad. When it comes time to vote, they will vote in support of the motion. In an a series of interviews published in papers in Durban, union members described the motion as \"a great benefit for the nation and the people.\""
 SAF_Volksraad.3.a:0 "A useful development."
 SAF_Volksraad.4.t:0 "The Creswell Faction supports our Motion"
 SAF_Volksraad.4.d:0 "Creswell Labour MPs have declared their support for our motion in the Volksraad. When it comes time to vote, they will vote in support of the motion. Newspapers across the country have declared that this motion \" will do much to improve the lot of the white worker and forward his concerns in this nation.\""
 SAF_Volksraad.4.a:0 "A curious development."
 SAF_Volksraad.5.t:0 "The Liberals support our Motion"
 SAF_Volksraad.5.d:0 "Liberal MPs have declared their support for our motion in the Volksraad. When it comes time to vote, they will vote in support of the motion. In an interview with the Cape Times, a liberal MP described the motion as \"Another way that we can move South Africa forward.\""
 SAF_Volksraad.5.a:0 "A curious development."
 SAF_Volksraad.6.t:0 "The Dominonists support our Motion"
 SAF_Volksraad.6.d:0 "Dominionist MPs have declared their support for our motion in the Volksraad. When it comes time to vote, they will vote in support of the motion. In an interview with a Natal-based newspaper, a Dominionist MP described the motion as \"Another way that we can move South Africa forward.\""
 SAF_Volksraad.6.a:0 "A curious development."
 SAF_Volksraad.7.t:0 "The Smuts Faction supports our Motion"
 SAF_Volksraad.7.d:0 "Smuts Faction MPs have declared their support for our motion in the Volksraad. When it comes time to vote, they will vote in support of the motion. In a statement given to reporters outside of Pretoria, one of the group's MPs described the motion as being \"Agreeable with the intentions of the people as a whole.\""
 SAF_Volksraad.7.a:0 "A curious development."
 SAF_Volksraad.8.t:0 "The Hertzog Faction Faction supports our Motion"
 SAF_Volksraad.8.d:0 "Hertzog Faction MPs have declared their support for our motion in the Volksraad. When it comes time to vote, they will vote in support of the motion. An article by Transvaal papers describes the motion as a \"Sensible Measure needed in South Africa today\", along with agreeing statements from some Smelter MPs."
 SAF_Volksraad.8.a:0 "A curious development."
 SAF_Volksraad.9.t:0 "The Gesuiwerde Faction supports our Motion"
 SAF_Volksraad.9.d:0 "Gesuiwerde Faction MPs have declared their support for our motion in the Volksraad. When it comes time to vote, they will vote in support of the motion. Their newspaper in the Orange Free State declared the motion to be \"A key factor in transforming South Africa into a truly free Afrikaner Republic.\""
 SAF_Volksraad.9.a:0 "An interesting development."
 SAF_Volksraad.10.t:0 "The Fascists support our Motion"
 SAF_Volksraad.10.d:0 "Fascist MPs have declared their support for our motion in the Volksraad. When it comes time to vote, they will vote in support of the motion. An MP from the National Party's fascist subfaction described the motion as \"A sign of things to come\", and \"Proof that the South African Government understands, yet is too cowardly to admit, the need for a Corporate arrangement in South Africa.\""
 SAF_Volksraad.10.a:0 "An interesting development."
 SAF_Volksraad.11.t:0 "The SACP no longer supports our Motion"
 SAF_Volksraad.11.d:0 "Communist Party MPs have declared their ending of support for our motion in the Volksraad. When it comes time to vote, they will not vote in support of the motion. In a recent interview, an MP described the defeat of the measure as \"imperative to developing class consiousness in South Africa, bringing us one step closer to revolution.\""
 SAF_Volksraad.11.a:0 "An interesting development."
 SAF_Volksraad.12.t:0 "The ICWU no longer supports our Motion"
 SAF_Volksraad.12.d:0 "ICWU MPs have declared theirending of support for our motion in the Volksraad. When it comes time to vote, they will not vote in support of the motion. An article in one of the Union's papers describes defeat of the motion as \"an important victory in improving the lot of the Coloured and White worker alike.\""
 SAF_Volksraad.12.a:0 "An interesting development."
 SAF_Volksraad.13.t:0 "The Madeley Faction no longer supports our Motion"
 SAF_Volksraad.13.d:0 "Madeley Labour MPs have declared their ending of support for our motion in the Volksraad. When it comes time to vote, they will not vote in support of the motion. In an a series of interviews published in papers in Durban, union members described the defeat of the motion as \"a great benefit for the nation and the people.\""
 SAF_Volksraad.13.a:0 "A useful development."
 SAF_Volksraad.14.t:0 "The Creswell Faction no longer supports our Motion"
 SAF_Volksraad.14.d:0 "Creswell Labour MPs have declared their ending of support for our motion in the Volksraad. When it comes time to vote, they will not vote in support of the motion. Newspapers across the country have declared that this motion failing in the Volksraad \" will do much to improve the lot of the white worker and forward his concerns in this nation.\""
 SAF_Volksraad.14.a:0 "A curious development."
 SAF_Volksraad.15.t:0 "The Liberals no longer support our Motion"
 SAF_Volksraad.15.d:0 "Liberal MPs have declared their ending of support for our motion in the Volksraad. When it comes time to vote, they will not vote in support of the motion. In an interview with the Cape Times, a liberal MP described defeating the motion as \"Another way that we can move South Africa forward.\""
 SAF_Volksraad.15.a:0 "A curious development."
 SAF_Volksraad.16.t:0 "The Dominonists no longer support our Motion"
 SAF_Volksraad.16.d:0 "Dominionist MPs have declared their ending of support for our motion in the Volksraad. When it comes time to vote, they will not vote in support of the motion. In an interview with a Natal-based newspaper, a Dominionist MP described defeating the motion as \"Another way that we can move South Africa forward.\""
 SAF_Volksraad.16.a:0 "A curious development."
 SAF_Volksraad.17.t:0 "The Smuts Faction no longer supports our Motion"
 SAF_Volksraad.17.d:0 "Smuts Faction MPs have declared their ending of support for our motion in the Volksraad. When it comes time to vote, they will not vote in support of the motion. In a statement given to reporters outside of Pretoria, one of the group's MPs described the defeat of the motion as being \"Agreeable with the intentions of the people as a whole.\""
 SAF_Volksraad.17.a:0 "A curious development."
 SAF_Volksraad.18.t:0 "The Hertzog Faction no longer supports our Motion"
 SAF_Volksraad.18.d:0 "Hertzog Faction MPs have declared their ending of support for our motion in the Volksraad. When it comes time to vote, they will not vote in support of the motion. An article by Transvaal papers describes the failure of the motion as a \"Sensible Measure needed in South Africa today\", along with agreeing statements from some Smelter MPs."
 SAF_Volksraad.18.a:0 "A curious development."
 SAF_Volksraad.19.t:0 "The Gesuiwerde Faction no longer supports our Motion"
 SAF_Volksraad.19.d:0 "Gesuiwerde Faction MPs have declared their ending of support for our motion in the Volksraad. When it comes time to vote, they will not vote in support of the motion. Their newspaper in the Orange Free State declared defeating the motion to be \"A key factor in transforming South Africa into a truly free Afrikaner Republic.\""
 SAF_Volksraad.19.a:0 "An interesting development."
 SAF_Volksraad.20.t:0 "The Fascists no longer support our Motion"
 SAF_Volksraad.20.d:0 "Fascist MPs have declared their ending of support for our motion in the Volksraad. When it comes time to vote, they will not vote in support of the motion. An MP from the National Party's fascist subfaction described the failure of the motion as \"A sign of things to come\", and \"Proof that the South African Government understands, yet is too cowardly to admit, the need for a Corporate arrangement in South Africa.\""
 SAF_Volksraad.20.a:0 "An interesting development."
 
