POLITICS_GEORGE_VILLIERS_DESC:0 "Born on 7 June, 1877, George Villiers serves as the Governor-General of South Africa- the King's representative in the nation. While nominally he holds the post of Chief Executive of the Union of South Africa, laws both in place and set to be tie him to the whims of Parliament- making him the \"Figurehead Monarch of South Africa\". Truth be told, he holds no ambitions in the country, and only serves there as his imperial duty- though various factions seek to either empower or disempower him, depending on their views on the British Empire. No matter what, though, he is a symbol of British power in South Africa- and will remain so unless something truly horrifying occurs to the nation."

 #--[EVENTS]--
 
 #flavor
 saf_flavor.1.t:0 "The Union of South Africa before the Union"
 saf_flavor.1.d:0 "The history of White Settlement in South Africa goes back to 1652, when the first permanent settlement in what would become Cape Town was formed for the Dutch East India Company. Over the next century and a half, Dutch settlement would continue and intensify, with French and Belgian (then Dutch) Huguenots fleeing religious oppression in Europe to seek a new life. This settlement was marred with early conflicts with locals, known as the Xhosa Wars, as both sides competed over farmland. In 1806, the United Kingdom permanently seized Cape Town, beginning the long and methodical seizure of South African by the British Empire. After this seizure and the beginning of permanent British settlement in 1818, many groups of Boers (Dutch farmers in Africa) proceeded to head inland in search of land and to form what would become a series of loose republics known as the Boer Republics. The largest of these would be the Orange Free State and the South African (colloquially Transvaal) Republic, in the Free State and Transvaal provinces respectively. The discovery of diamonds in 1867 and gold in 1884 would hasten British expansion, culminating in the First and Second Boer Wars, which saw the Boer Republics integrated into the British Empire." 
 saf_flavor.1.a:0 "I wonder what will happen next?"
 saf_flavor.2.t:0 "The Union of South Africa, 1909-1933"
 saf_flavor.2.d:0 "Eight years after the end of the Second Boer War, the South Africa Act of 1909 granted her independence as the Union of South Africa, a merger of the former British and Dutch colonies in the region. The newly independent South Africa took her first steps on the eve of the Great War, a crisis that would shape her politics forever. A rebellion of former Boer Generals seeking independence from Britain fully instead of the protected state status they were presently in was crushed by Generals Jan Smuts and Louis Botha, and the nation would enter on the side of the United Kingdom in 1914 along with the rest of the Empire. She would see fighting all over the former German colonies of Africa, and would eventually be granted Southwest Africa as a protectorate during the peace. The interwar years would see governments come and go with Jan Smuts and his South African Party dominating until the 1924 election, where a newly formed and surging National Party under James Hertzog would take over. This would be due to the Rand Rebellion of 1921, which saw a bloody crackdown on white labor strikers in Witwatersrand, a move that made Smuts' government increasingly unpopular with the people and would allow a National-Labour coalition to take over. This coalition would continue through the Depression, a Depression that has hit South Africa hard. Their economy, entirely reliant on Great Britain for most trade, has gone quite under, and the ruling National Party coalition seems unable to fix the situation. Labor unions continuously increase in power, party politics is deeply divided, and the value of the South African pound is a shadow of what it once was. With all of this on South Africa's shoulder, an election looms in May- an election that will decide the fate and future of the nation. Will she form a coalition as many on both sides hope between the South African Party and the National Party, or will one side take their policies alone to the forefront of South African politics? Only time will tell."
 saf_flavor.2.a:0 "God Save Africa!"
 #election
 saf_election.1.t:0 "The South African National Election"
 saf_election.1.d:0 "In the May 1933 election, various parties and groups vie for control of South African politics. The ruling National Party has seen the repeat of what occurred to the South African Party in 1929 with their regime becoming increasingly unpopular due to a bungled handling of the Great Depression, and it is likely that the opposition may come to rule. Leading figures in both the SAP and NP have come together, though, and determined a course of action that will lead to greater stability and welfare in the future- a proposed grand coalition between the two. Whether or not this will succeed is up to much debate, but ultimately the polls will decide if it will happen. The results have just come in, and the new government will be formed by..."
 saf_election.1.a:0 "The Coalition!"
 saf_election.1.b:0 "The South African Party (NOT IMPLEMENTED)!"
 saf_election.1.c:0 "The National Party (NOT IMPLEMENTED)!"
 saf_election.2.t:0 "The Coalition Victorious"
 saf_election.2.d:0 "With a result that surprised nobody, the coalition of the National Party and the South African Party has come out on top in the May Election. With Malan's faction wreaking havoc internally in the National Party being an issue, we must come to the issues of forming a government before anything else."
 saf_election.2.a:0 "Let us work towards this new government!"
 saf_election.3.t:0 "The Malan Question"
 saf_election.3.d:0 "D.F. Malan and his so-called Gesuiwerde faction of the National Party strongly oppose any sort of merger. Despite this, the two factions continue to get closer and closer- making him and his faction more and more likely to break with our government. General Smuts has asked Mr. Hertzog and his Party to deal with the issue, and a group will approach him to attempt to work out an issue."
 saf_election.3.a:0 "Let us hope this works..."
 saf_election.4.t:0 "Malan's Response"
 saf_election.4.d:0 "Mr. Hertzog and several NP leaders approached Mr. Malan early yesterday, attempting to dissuade him from leaving the coalition. What followed was a string of insults and name-calling from the aforementioned Mr. Malan, who called Mr. Hertzog and his fellow party members \"Traitors to the Boer Cause\". In a speech in front of National Party members, he made it clear his group would take a policy of breaking with the Party when they feel it is appropriate- creating a clique within the National Party that threatens its existance as one party."
 saf_election.4.a:0 "That little-"
 saf_election.5.t:0 "The Ministers of 1933"
 saf_election.5.d:0 "Various Ministries have been debated on, with various parties eyeing their posts. Most especially sought after is the Ministry of Justice and Ministry of External Affairs, both of whom the SAP has put General Smuts' name forward for. Whether he gets these posts remains to be seen, but with them and a potential path to Prime Minister he looks to be consolidating power..."
 saf_election.5.a:0 "We will select MPs from both parties to equally take posts in Parliament."
 saf_election.5.b:0 "We will favor the South African Party in our decisions."
 saf_election.5.c:0 "We will favor the National Party in our decisions."
 saf_election.6.t:0 "The Prime Minister Question"
 saf_election.6.d:0 "Both Smuts and Hertzog are vying for the spot of Prime Minister- who shall get it?"
 saf_election.6.a:0 "Smuts!"
 saf_election.6.b:0 "Hertzog!"
 saf_election.7.t:0 "The Army Question"
 saf_election.7.d:0 "The South African Union Defense Force, slashed in the Great Depression, is currently in dire straits. 2 Reform Plans have been proposed- one, by General Smuts, of consolidating our forces and focusing on creating a professional core in the vein of Britain. The other, by Minister Pirow, calls for the increase in manpower and equipment, to effectively guard and police the entire nation. With the politics surrounding minister appointments, who shall win?"
 saf_election.7.a:0 "Smuts is correct, a professional core is best."
 saf_election.7.b:0 "Pirow is correct, we need more men to guard and protect us."
 saf_election.8.t:0 "National Party Decision"
 saf_election.8.d:0 "When it comes to the Gesuiwerde Faction, the National Party is split. Some say that we should attempt to moderate our policy, likening it more to the NP policy than to that of the South African Party. Others say that we should emphasize our ties to the South African Party, losing some Gesuiwerde members but tightening our relationship in the coalition. Either way, we are likely to lose members to Malan's faction."
 saf_election.8.a:0 "Compromise!"
 saf_election.8.b:0 "Emphasize Ties!"
 saf_election.9.t:0 "The United Party"
 saf_election.9.d:0 "With negotiations on economic and political policy complete, we can now begin the official merger of the NP and SAP. Hertzog, Smuts, and party leadership from both groups have signed off on it- marking a new age for South African Politics. Malan has already threatened to leave, but he could not harm the coalition- right?"
 saf_election.9.a:0 "Hip Hip Hooray!"
 saf_election.10.t:0 "Malan Leaves"
 saf_election.10.d:0 "Making good on his promise to abandon the National Party under Hertzog should closer ties be made, Malan has left the NP and has founded his own party- the so-called \"Purified\" National Party. Already many members of the NP have joined this group, making it the foremost opposition party in Parliament."
 saf_election.10.a:0 "That little worm!"
 saf_election.11.t:0 "The Coalition Has Collapsed"
 saf_election.11.d:0 "Despite our best efforts, the coalition meant to bring together the two largest factions in South African politics is now a distant memory. The National Party and South African Party are not designed for a merger, it seems, and we will not be running a majority government for long... it is best, then, to now decide who will lead us from here on out."
 saf_election.11.a:0 "The South African Party takes the mantle."
 saf_election.11.b:0 "The National Party takes the matnle."
 saf_election.12.t:0 "The 1938 Election"
 saf_election.12.d:0 "As in 1933, we are now faced with a choice of national politics. Now, instead of choosing between the South African Party and National Party, we have an entirely different political landscape, with new parties and new individuals rising to the forefront of national politics- but still, the familiar faces of Smuts and Hertzog are all over the ballots and campaign posters. Despite the extensive politicking, we all know there can only be one winner, and that one would be..."
 saf_election.12.a:0 "The United Party Seizes Victory!"
 saf_election.12.b:0 "The United Party Seizes Victory (No Other Paths Are Coded Yet)!"
 saf_election.13.t:0 "The 1943 Election"
 saf_election.13.d:0 "The 1943 Election is one of much unique character in South African history. Now, instead of a question of domestic politics, the issues are largely related to foreign policy issues. Even still, the landscape of our national politics is both eerily familiar and quite different from the last election- the ultimate victor will decide much of our politics for years to come. The victor has been announced by broadcasts after the votes have been counted, and the results are..."
 saf_election.13.a:0 "The United Party Seizes Victory!"
 saf_election.13.b:0 "The United Party Seizes Victory (No Other Paths Are Coded Yet)!"
 saf_election.14.t:0 "The Dominion Party Forms"
 saf_election.14.d:0 "Dissatisfied with the merger of the South African Party and National Party, a number of members of the former South African Party have created their own organization, henceforth termed the "Dominion Party". They claim that the Hertzog faction in the new United Party maintains too much power, and the ideas of Afrikaner nationalism hold far too much sway over this coalition government. The opposite of Malan's Purified National Party, they are a solidly anglophile party, who seek strengthened ties with the United Kingdom and the dominance of British as opposed to Afrikaner culture in greater South African society. While they are unlikely to win any serious support, one still must worry..."
saf_election.14.a:0 "Another breakaway?!"
 #westminster
 saf_westminster.1.t:0 "The Westminster Question"
 saf_westminster.1.d:0 "The 1931 Statute of Westminster, passed by the National Government to appease the more independent-minded members of the various colonies of the United Kingdom and to ensure their loyalty through the Great Depression, has been an issue of some time for the Union of South Africa. While not a colony of the United Kingdom per se, and thereby not required to ratify it, the proposed Status of the Union Act would effectively remove British power from South Africa except for judicial power- a major step forward towards independence, despite being largely de facto understood. A majority of the government presently supports the piece of legislation, though there has been some talk of meeting with Parliament to see if more concessions could be earned- should our government go forward with this?"
 saf_westminster.1.a:0 "No, we are satisfied with the present legislation."
 saf_westminster.1.b:0 "Let us see what we can get!"
 saf_westminster.22.t:0 "The South Africans Approach Us"
 saf_westminster.22.d:0 "As the times change, so must our imperial policy. This is the message that the members of the South African parliament brought before us today, requesting further amendment to their Status of the Union- not content to simply govern most things internally, they wish for more concessions- some even demanding as much as practical independence from the Crown, with only nominal ties. While many in Parliament see this as the farce that it is, there are significant calls to let them have greater autonomy- forces in our politics claiming that if we enact a moderate policy of independence towards them, they could help to stabilize the potentially tumultuous Africa in the event of war. Some even go further, stating that if we allow them full autonomy, they will be rather gracious towards us and aid us further than they can now. However, only one of these factions can win out..."
 saf_westminster.22.a:0 "They will receive no more than agreed."
 saf_westminster.22.b:0 "We will grant them limited increases in autonomy."
 saf_westminster.22.c:0 "We will grant them practically full autonomy in foreign affairs."
 saf_westminster.23.t:0 "The British Response"
 saf_westminster.23.d:0 "The British, seeking to prevent us from making alliances with their enemies or moving further away from their sphere of influence, have elected to prevent any further amendments to the Status of the Union Act. We will remain tied to their country, whether we like it or not."
 saf_westminster.23.a:0 "Blast it!"
 saf_westminster.24.t:0 "The British Response"
 saf_westminster.24.d:0 "The British have elected to give us partial autonomy in foreign affairs in a recent statement from the Governor-General- while we cannot enter agreements with those they deem to be geopolitical enemies, we can instead strengthen our ties to foreign democracies, if we so choose."
 saf_westminster.24.a:0 "At least it's something..."
 saf_westminster.25.t:0 "The British Response"
 saf_westminster.25.d:0 "The British, in a surprising turn of events, have chosen to give us almost full autonomy in foreign affairs- allowing us to speak and work with any party we wish. Many Afrikaner hardliners are already clamoring to enter in talks with the Germans, though that is far from the only course of action we can take."
 saf_westminster.25.a:0 "They did what?!"
 saf_westminster.2.t:0 "Ties With Rhodesia"
 saf_westminster.2.d:0 "Ever since its founding, the Union of South Africa and the colony of Southern Rhodesia have had a special... and close relationship. As late as 1924, the proposition for the colony to join the Union was seriously on the table- though it would eventually fall through after an internal crisis in the Union allowed the colony to maintain independence. Even still, ties are close, and we have proposed a series of clauses in a new piece of legislation that would make these ties even closer. It simply remains to be seen if they accept."
 saf_westminster.2.a:0 "Let us hope they do!"
 saf_westminster.3.t:0 "South Africa Seeks Closer Ties"
 saf_westminster.3.d:0 "The South Africans have announced their intent to pursue closer trade with us. Despite our close ties, we do not wish to fall too hard into their sphere- for fear we may lose our status and become merely another part of the Union. What should we say?"
 saf_westminster.3.a:0 "We would be happy to have closer ties!"
 saf_westminster.3.b:0 "Never!"
 saf_westminster.4.t:0 "The Rhodesians Have Agreed!"
 saf_westminster.4.d:0 "The Rhodesians have agreed to closer ties- already increasingly small barriers between our parts of the Empire have begun to go away. Soon, hopefully, we will become as close as brothers- which some say we may be already."
 saf_westminster.4.a:0 "Thanks, friends."
 saf_westminster.5.t:0 "The Rhodesians Have Declined!"
 saf_westminster.5.d:0 "Despite our attempt to bring our two nations closer, the Rhodesians have announced that they will not agree to our current proposal. They see it as allowing too much influence from us to affect them. Sadly, it seems our idea is now dead in the water."
 saf_westminster.5.a:0 "We will not forget this."
 
 #usa
 saf_westminster.6.t:0 "Outreach to the Americans"
 saf_westminster.6.d:0 "Outreach to the United States of America is a natural extension of our foreign policy. The diplomats have all been prepared, our embassy in contact with their government, and now we must wait to see the result of our endeavors..."
 saf_westminster.6.a:0 "To our friends across the Atlantic!"
 saf_westminster.7.t:0 "The South Africans Desire Closer Ties"
 saf_westminster.7.d:0 "In a mission before our head of state, the South Africans have made their intention for closer ties known through a variety of means including cultural exchange and fine dining. This could bring us great opportunity, though potentially the ire of the British as well if we pull their subject too far away from them..."
 saf_westminster.7.a:0 "A splendid initiative!"
 saf_westminster.7.b:0 "We have enough to worry about right now."
 saf_westminster.8.t:0 "The Americans Accept!"
 saf_westminster.8.d:0 "Glorious success! Our ambassador, slightly inebriated after a long series of talks and dinner parties, has announced that the Americans have accepted our proposal of closer ties. Already their businesses and citizens have begun to trickle in, a sign of better relations between our two nations."
 saf_westminster.8.a:0 "Perfection! Now, about the embassy complex..."
 saf_westminster.9.t:0 "The Americans Decline!"
 saf_westminster.9.d:0 "Horrific failure! Despite the best efforts of our ambassadors, we have failed to win over the Americans to our cause. We will have to rethink our strategy, now, as we cannot rely on them for support in the future."
 saf_westminster.9.a:0 "Why, those little-"
 
