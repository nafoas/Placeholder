l_english:
 #--[IDEAS]--
 SAF_depression_1:0 "The Great Depression"
 SAF_depression_1_desc:0 "The Great Depression of 1929 left few nations alone- and South Africa was no exception. With our economy being largely tied to crop exports, the suffering was heavy on rural farmers, who also happen form the backbone of our constituency. This created a difficult situation for the ruling National Party, as they were unable to weather the crisis properly. Although the Gold Market has kept us somewhat afloat, we have yet to see the worst of this crash."
  SAF_depression_2:0 "The Great Depression"
 SAF_depression_2_desc:0 "Reform Efforts have begun to aid us in the Depression, but there is still much work to be done."
  SAF_depression_3:0 "The Great Depression"
 SAF_depression_3_desc:0 "We are recovering more from the Depression, but still more work needs to be done to see true results."
  SAF_depression_4:0 "The Great Depression"
 SAF_depression_4_desc:0 "With several reforms now done, and the country's currency back up to date, noticeable changes have begun to take place. Some are hopeful that we will finally be fixed."
  SAF_depression_5:0 "The Great Depression"
 SAF_depression_5_desc:0 "The nation is almost back to normalcy. The worst seems to be over, and soon our economy will return to a normal state."
 SAF_Racial_Segregation:0 "Racial Segregation"
 SAF_Racial_Segregation_desc:0 "Racial Segregation has long been a part of South Africa's history. With laws such as the Asiatic Registration Act, Native Land Act, and Color Bar Act enshrining such segregation into law, support for the government among non-white communities is minimal at best. As such, it is more difficult to truly move forward on many long-term projects, with debates about what to do about the \"Silent Majority\" of Native Africans being one of the principle issues in government."
SAF_Afrikaner_Dominance:0 "Afrikaner Dominance in Parliament"
SAF_Afrikaner_Dominance_desc:0 "As of now, pro-Afrikaner parties hold the power in the South African Parliament. This makes many things easier when moving forward on issues related to Afrikaner interests, but without the support of the British population certain actions are difficult to push forward."
SAF_Growing_Unionism:0 "Growing Unionism"
SAF_Growing_Unionism_desc:0 "With growing industrialization in South Africa, labor unions have begun cropping up. The largest ones are primarily organizations for the unheard native and Indian laborers, who form the backbone of the unskilled worker class. They remain largely irrelevant, though, as the White-only labour organizations dominate the political sphere. While they remain small in influence, and crushing them is doable with the South African Union Defence Force, should the situation destabilize further they may become a larger threat."
SAF_Kommando_Legacy:0 "Kommando Legacy"
SAF_Kommando_Legacy_desc:0 "Many officers, especially those occupying senior positions, are former members of Kommandos (small defence groups) in the now-defunct Orange Free State or Transvaal Republic. These Kommandos fought in the First and Second Boer Wars, earning a reputation for being renowned marksmen and guerilla warriors. This legacy, passed down to younger soldiers, has made South African units adept at fighting in their own terrain, as well as undergoing reconnaissance and skirmish operations."
SAF_Industrializing_Nation:0 "Industrializing Nation"
SAF_Industrializing_Nation_desc:0 "South Africa as a nation has yet to see true industrial growth. While some factories exist, especially in Pretoria and Johannesburg, they are a shadow of the massive complexes of Europe and North America. Most workers are agricultural workers or laborers in the mine, and any sort of true industrial middle or working class has yet to take hold."
SAF_Anglo_Afrikaner_Coalition:0 "Anglo-Afrikaner Coalition"
SAF_Anglo_Afrikaner_Coalition_desc:0 "With the current government, both South Africans of Anglo-Saxon Descent and Afrikaner Descent serve equally in the administration. This makes moves in industry and shoring up stability easier, but makes rallying the people around a common cause more difficult."
SAF_import_taxes_temp:0 "Import Taxes"
SAF_import_taxes_temp_desc:0 "We have enacted a policy of import taxation- while it may harm our economy in the short-term, it is vital for long-term success."
SAF_agricultural_tech:0 "Agricultural Investments"
SAF_agricultural_tech_desc:0 "We have invested into our agricultural sector, giving us increased yields for a time."
SAF_industrial_tech:0 "Industrial Investments"
SAF_industrial_tech_desc:0 "We have invested further into our industry, paving the way for a great future of an industrialized South Africa."
SAF_coalition_5:0 "Heavy SAP Dominance"
SAF_coalition_5_desc:0 "The South African Party has heavy dominance in the coalition, alienating many in the National Party. If it gets any worse, the coalition may break..."
SAF_coalition_4:0 "Mild SAP Dominance"
SAF_coalition_4_desc:0 "The South African Party has mild dominance in the coalition, making some in the National Party nervous."
SAF_coalition_3:0 "Coalition Balance"
SAF_coalition_3_desc:0 "Both the National Party and South African Party are equal in the coalition."
SAF_coalition_2:0 "Mild NP Dominance"
SAF_coalition_2_desc:0 "The National Party has mild dominance in the coalition, making some in the South African Party nervous."
SAF_coalition_1:0 "Heavy NP Dominance"
SAF_coalition_1_desc:0 "The National Party has heavy dominance in the coalition, alienating many in the South African Party. If it gets any worse, the coalition may break..."
SAF_Coalition_Success:0 "Coalition Success"
SAF_Coalition_Success_desc:0 "The Coalition is successful, despite Malan's protests, and it is now easier to do just about everything in Parliament."
SAF_Coalition_Failed:0 "Coalition Collapse"
SAF_Coalition_Failed_desc:0 "The Coalition has collapsed, taking with it any hope of easy governance. Strikes, protests, and more wrack the nation, with bitter opposition to one another forming in Parliament."
SAF_Economy_Collapsed:0 "Economic Collapse"
SAF_Economy_Collapsed_desc:0 "The economy has collapsed, taking with it any hope of recovery. Strikes, protests, and more wrack the nation, with many foreign businesses choosing to avoid buying in South Africa."
SAF_Depression_Fixed:0 "End to the Depression"
SAF_Depression_Fixed_desc:0 "The Great Depression in South Africa is over, and now a boom in business has begun. New factories are opening, new opportunities for investment are returning, and construction is occurring all over the nation."
SAF_1934_Status_Of_The_Union_Act:0 "1934 Status of the Union Act"
