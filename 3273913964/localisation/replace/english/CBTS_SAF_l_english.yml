#--[FOCUSES]--

SAF_1933_Election:0 "The 1933 Election"
SAF_1933_Election_desc:0 "The South African 19333 Election is one that has the potential to alter the course of our country for many years to come- the various political paths to both creating a stable government in light of the recent breakdown between the Labour Party and National Party and a recovery from the Great Depression which has swept our nation. Only one outcome can be triumphant- but which it will be is not yet decided."
SAF_The_Question_Of_Coalition: "The Question of Coalition"
SAF_The_Question_Of_Coalition_desc:0 "Electoral predictions place, as of now, neither the South African Party under Jan Smuts or the National Party under J.B.M. Hertzog as clear frontrunners in this election. In order to form a stable government, policy-makers from both factions are looking towards the idea of a coalition, something that holds great promise... but a failure could prove costly indeed."
SAF_The_Minor_Parties:0 "The Minor Parties"
SAF_The_Minor_Parties_desc:0 "The various minor parties in South African politics- the factions of Labour, the various special-interest groups, and even the occasional independent- are nowhere near powerful enough to take government on their own. However, with the right gifts and prodding, their lawmakers could be urged to support various factions in government."
SAF_The_Final_Debates:0 "The Final Debates"
SAF_The_Final_Debates_desc:0 "The issues of the day when it comes to the electoral process have been solved, no matter the outcome of the various debates. Now, we can only wait and see, while our next government is decided in the polls..."

#Coalition Politics
SAF_Coalition_Forms:0 "1933 South African-National Victory"
SAF_Coalition_Forms_desc:0 "With several meetings between Prime Minister Hertzog and Leader of the Opposition Smuts, the SAP and National Party have agreed to form a coalition party. Already Malan and his Gesuiwerde faction have voiced opposition to this, but it seems like it can hold..."
SAF_National_Wins_Alone:0 "National Wins Alone"
SAF_National_Wins_Alone_desc:0 "The National Party, against most odds, has retained its spot as the ruling party despite the Depression heavily harming numbers. It seems Boer farmers have renewed faith in the party, how that faith will be rewarded remains a point of debate for now..."
SAF_South_African_Victory:0 "A South African Victory"
SAF_South_African_Victory_desc:0 "The South African Party has finally retaken its spot at the head of the South African Parliament- a spot not held since the 1920s. With the backers being a mixed group of Afrikaners, Anglo-Saxons, and "Coloureds", it remains to be seen how the new leading party will take advantage of its victory..."
SAF_Two_Pillars:0 "Uphold the Twin Pillars"
SAF_Two_Pillars_desc:0 "The "Twin Pillars" refer to the structure of South African government established in the 1910 Constitution- one part Anglo-Saxon, one part Afrikaner. We must uphold this founding principle, with one part National Party and one part South African Party keeping the balance."
SAF_Malan_Question:0 "The Malan Question"
SAF_Malan_Question_desc:0 "D.F. Malan has been an outspoken critic of our merger for quite some time. With him threatening to leave the National Party and form his own version, perhaps we should have a dialogue about what to do should that happen..."
SAF_Gesuiwerde_Left:0 "Dealing with the Farewell"
SAF_Gesuiwerde_Left_desc:0 "It seems that Malan's intent to leave was true, and he has taken several National MPs with him. Now we must decide what to do- is it best to emphasize unity with the SAP, or to gear our policy more towards their desires to win them back?"
SAF_Emphasize_Smelters:0 "Emphasize the Smelters"
SAF_Emphasize_Smelters_desc:0 "It is clearly better to emphasize working with the SAP. Attempting to win back the support of Malan's MPs would only alienate our coalition ally further, making the relationship even more strained."
SAF_Compromise_Policies:0 "Compromise on Policy"
SAF_Compromise_Policies_desc:0 "It's clearly better to moderate our policy to win supporters back. While this may alienate the SAP, better to take support from Malan than risk his force becoming larger."
SAF_Ministry_Question:0 "The Cabinet Question"
SAF_Ministry_Question_desc:0 "It has come time to review Minister appointments to this administration. While a temporary cabinet has been formed, we will need to solidify our decision in terms of ministers, the Prime Minister above all. Who we select must be balanced, lest one part feel that they are being cheated and back out..."
SAF_An_Uneasy_Coalition:0 "An Uneasy Coalition"
SAF_An_Uneasy_Coalition_desc:0 "Despite several heated debates and the leaving of the Gesuiwerde faction, a working coalition has been formed between the two largest parties. Now, we may put our attention to larger issues- issues of long-term importance, knowing our place in government is solidified for the most part."
SAF_Gold_Standard:0 "Abandon the Gold Standard"
SAF_Gold_Standard_desc:0 "With the utter failure of the National Party policy of keeping the Pound on the Gold Standard, it is obvious that in order to fix the crisis we must lift the Gold Standard. While this may anger some legislators, Gen. Smuts has made it clear in his reform plan that this is absolutely necessary for the future of the nation."
SAF_Float_Pound:0 "Float the Pound"
SAF_Float_Pound_desc:0 "In order to fix the situation, we must float the Pound- removing it from the Gold Standard was not enough."
SAF_Sterling_Area:0 "Join the Sterling Area"
SAF_Sterling_Area_desc:0 "We must act to make the South African Pound have parity with the British Pound- doing so will not only strengthen our economy, but give us greater ties to the United Kingdom. The informal organization of the Sterling Area is a must if we are to properly fix ourselves."
SAF_Our_Own_Currency:0 "Reinforce Our Currency"
SAF_Our_Own_Currency_desc:0 "While it has been proposed that we tie ourselves to the British Pound, we cannot take such a course of action. We must remain independent, even if it hurts our economy in the short term- worming out from under the British boot is more important."
SAF_Import_Taxes:0 "Increase Import Taxes"
SAF_Import_Taxes_desc:0 "We must temporarily increase the import tax on various goods- while the move is unpopular, it is necessary to improve our current situation."
SAF_Invest_Agriculture:0 "Invest in Agriculture"
SAF_Invest_Agriculture_desc:0 "Agriculture is our heart, and as such it must recieve government aid in restoring itself from the crisis."
SAF_Invest_Industry:0 "Invest in Industry"
SAF_Invest_Industry_desc:0 "Investing in industry is absolutely necessary- it is the future. With a stronger industry, we can finally truly assert ourselves within and without the Empire."
SAF_Increase_Mining:0 "Increase Mining Efforts"
SAF_Increase_Mining_desc:0 "South Africa is on one of the largest natural taps of rare and precious metals in the world- it only needs be extracted. As such we must dig deep, and dig greedily- this is how we shall fix ourselves properly."
SAF_Out_Of_The_Fire:0 "Out of the Fire"
SAF_Out_Of_The_Fire_desc:0 "We are out of the worst of the crisis- while unemployment is still high, prices are returning to normal levels, and previously shuttered factories are returning to life."
SAF_Form_United_Party:0 "Form the United Party"
SAF_Form_United_Party_desc:0 "The time has come to formalize our coalition in more than name- the SAP and NP will unite to form one party, the United Party, which will lead South Africa into the future."
SAF_Grant_Provincial_Taxation_Powers:0 "Grant Provincial Taxation Powers"
SAF_Grant_Provincial_Taxation_Powers_desc:0 "In order to better streamline our governmental system, it has been proposed that we will grant the power of taxation to the provinces. This proposal is to be commended, as encouraging the provinces to handle their own finance will make it far easier for our national government to handle non-regional affairs."
SAF_Protect_National_Monuments:0 "Protect National Monuments"
SAF_Protect_National_Monuments_desc:0 "Our nation has a long and storied history, and it is important that we show as much. In order to display our past to the people, we will enact legislation to protect these monuments and relics of an older time, so that future generations may know of it."
SAF_Reform_Justice_System:0 "Reform Justice System"
SAF_Reform_Justice_System_desc:0 "The South African judiciary is known to be subject to regional bias and is the topic of ridicule for its ineffeciency- something that must be corrected as fast as possible. Legislation to begin reforms to improve this situation is thusly imperative, and is of the highest manner of importnace."
SAF_Expand_Prison_System:0 "Expand Prison System"
SAF_Expand_Prison_System_desc:0 "Contrary to what some may think, the problem with our judicial system is not issues in the judiciary itself- it is an issue with the lack of effective police. By expanding our police force, we can force stabilization on our nation- and prevent any future issues from boiling over by force if need be."
SAF_Regulate_Animal_Slaughtering:0 "Regulate Animal Slaughtering"
SAF_Regulate_Animal_Slaughtering_desc:0 "In many rural parts of our nation, the slaughtering of animals by butchers and those attempting to get meat is done so in a way that promotes undue suffering and cruelty towards the animal. Not so, anymore- by passing legislation regulating the slaughter of animals, we will ensure that everyone can enjoy a nice braai without worrying about how the meat was gained."
SAF_Manage_Waterways:0 "Manage the Waterways"
SAF_Manage_Waterways_desc:0 "The waterways of South Africa are our lifeblood- and ensuring that they are clean and properly used will greatly help us in ensuring that food supplies and trade flows. If we do not have clean and bountiful water for a plethora of purposes, what good are we?"
SAF_Reform_Public_Service:0 "Reform the Public Service"
SAF_Reform_Public_Service_desc:0 "The South African Public Service has long been neglected due to attempts by the National Party government at autarkic measures- a fool's errand. Now, with currency in our pot, we can reform it to better aid those who make sure that the government functions and does not break down."
SAF_Increase_Workmens_Compensation:0 "Increase Workmens' Compensation"
SAF_Increase_Workmens_Compensation_desc:0 "Endemic in our population are the issues of the working man- black lung, injuries, and the mental strain of working in a high-risk environment for long periods. It is only right that we expand support for these people, so that those who suffer injuries from their work will not go unhelped by their larger society."
SAF_Regulate_Mining_Sector:0 "Regulate the Mining Sector"
SAF_Regulate_Mining_Sector_desc:0 "The South African mining sector is large and growing- soon, it is likely it will be the most important sector of our economy. Regulating the practices of the industry now, even if those regulations are limited, will go a long way towards supporting its growth in the future and ensuring that we do not have issues with mining protests down the line."
SAF_Regulate_Agricultural_Sector:0 "Regulate the Agricultural Sector"
SAF_Regulate_Agricultural_Sector_desc:0 "Our agriculture is our oldest industry- the first settlers in South Africa were not miners, but farmers. Helping their industry to remain afloat will not only bring us some goodwill, but will ensure that the traditional way of life of a distinct group of our people can survive."
SAF_Protect_The_Disabled:0 "Protect the Disabled"
SAF_Protect_The_Disabled_desc:0 "Is it not right, that a greater society at large would assist its most vulnerable members? While it is regrettable that some are born without the expected mental or physical faculties, or through some horrible act end up losing those they are given, that does not mean they must be abandoned- society as a whole has a duty to aid them and provide for them as much as possible."
SAF_Regulate_Transportation_Sector:0 "Regulate the Transportation Sector"
SAF_Regulate_Transportation_Sector_desc:0 "Rail is not a common aspect of our region- but it is the most vital. Without the railways that snake our country, we would not be able to do nearly as much as we can now when it comes to industry and trade- and as such, regulating this sector to ensure that it functions as often and reliably as possible is vital. The trains must run on time!"

#1938 United Party Politics
SAF_United_1938_Start:0 "1938 United Party Victory"
SAF_United_1938_Start_desc:0 "The Coalition that once seemed so fragile, and is now one party, has won another election- with a sizable majority, we are set to be able to change South Africa in a number of ways, provided nothing serious derails this effort..."
SAF_Amend_South_Africa_Act:0 "Amend the South Africa Act"
SAF_Amend_South_Africa_Act_desc:0 "The South Africa Act that was passed so long ago is now right for some changes- nothing major, of course, but renegotiating some of the aspects of our governance is vital to ensuring that it represents both the will of the people and what is best for our country and constituents."
SAF_Amend_Native_Representation:0 "Amend the Native Representation Act"
SAF_Amend_Native_Representation_desc:0 "Native Representation has always been a fickle thing- something heatedly debated in the Volksraad and in the larger political sphere as a whole. It has come time to pass an amendment to this act, and with our coalition dominance this should prove possible- though it is unlikely that the issue of native politics will go away."
SAF_Restructure_Land_Ownership:0 "Restructure Native Land Ownership"
SAF_Restructure_Land_Ownership_desc:0 "The lands that the natives of our nation live on are governed by a myriad of national, provincial, and regional laws- and these laws are each the subject of much debate. Restructuring this legislation to streamline it and having it be more easily applicible will go a long way to placating most sides, as their change will be easier to implement- for good or ill."
SAF_Create_New_Administrations:0 "Create New Native Administrations"
SAF_Create_New_Administrations_desc:0 "The way our native individuals are governed is not unique in its complexity and inefficiency- too many are governed by too few organizations, who are forced to subdivide on sometimes arbitrary levels. By creating new administrations for managing the native population, we can alleviate that burden, and allow us to more effectively govern."
SAF_Establish_Southwest_African_Police:0 "Establish South-West African Police"
SAF_Establish_Southwest_African_Police_desc:0 "Ever since coming into the ownership of South-West Africa due to a United Nations mandate, it has been largely governed by the Union Defense Force. No longer will this be necessary, as a new police administration solely for this region will take up the mantle- allowing the national government to be more hands-off in its management and preventing it from costing us more than is necessary to manage."
SAF_Adjust_Native_Taxation:0 "Adjust Native Taxation Policies"
SAF_Adjust_Native_Taxation_desc:0 "Simply because there are divisions in our society does not mean anyone is free from the two things which govern us all- death and taxes. The native population pays taxation like any other, though their laws governing it are slightly different- and subject to change as necessary, to simplify the situation and ensure that the rates make sense for our current situation."
SAF_Aliens_Registration_Act:0 "Register Foreign Aliens"
SAF_Aliens_Registration_Act_desc:0 "With war on the continent looming, it is increasingly important that we ensure national defense- and in order to do so, it has become increasingly necessary that we register foreign aliens. While this may be unpopular, it is necessary for the defense of the country- not knowing who is here from foreign nations could open us up to subversive elements taking hold."
SAF_Native_Policing_Act:0 "Encourage Native Policing"
SAF_Native_Policing_Act_desc:0 "Instead of governing the native population from up high, several proposals have come forth to form and expand native policing units- working hand in hand with these communities to ensure their safety and self-monitoring while not costing any of our white officers beyond training and supervision. While many protest such an action, with the support of our government the measure could go through..."
SAF_Establish_Colored_Reserves:0 "Establish Colored Reservists"
SAF_Establish_Colored_Reserves_desc:0 "An even more radical proposal than native policing is one from the more liberal factions of the former SAP- the formation of native reservist units akin to white ones, whose job it will be in wartime to fill out the ranks of our armed forces in support and rearguard roles. While some have called this tantamount to arming a hostile power inside our country, these people are fools- popular ones, but still fools."
SAF_Expand_Railway_Networks:0 "Expand Railway Networks"
SAF_Expand_Railway_Networks_desc:0 "In order to ensure our nation's ability to fight on in future, and to allow us to connect more of the rural corners of South Africa to its cities, expanding our rail system is very much in order- an act that will give boons to all, bringing us together in more ways than one."
SAF_Restructure_Tax_Code:0 "Restructure the Tax Code"
SAF_Restructure_Tax_Code_desc:0 "Our taxation code is due for more corrections and alterations- while some might deride how often this is changed, it is necessary to ensuring finances are in proper shape and that money is being taken from each of our citizens at a proper rate."
SAF_Grant_Greater_Pensions:0 "Grant Greater Pensions"
SAF_Grant_Greater_Pensions_desc:0 "With our country now firmly out of the Depression, we can look to servicing those who serve us more- by increasing pension rates. Making sure that those of us who are no longer able to work are taken care of is not only right, but it is necessary for a better society."
SAF_Establish_Tourism_Administration:0 "Establish a Tourism Administration"
SAF_Establish_Tourism_Administration_desc:0 "From the beautiful shore of the Cape and Strand to the wonderful plains of the Free State and Transvaal, South Africa is a nation of wonders. Getting those overseas to come and see this natural beauty is a goal that should be pursued, as anyone can benefit from witnessing the natural majesty of our African jewel."
SAF_Financial_Restructuring_Act:0 "Restructure National Finance"
SAF_Financial_Restructuring_Act_desc:0 "Our national finance is a fickle thing- budgetary debates are common, as are debates on the smallest of financial minutiae. However, now, it is possible for us to reform this system in order to better serve the government- and serve the people by extension."
SAF_Implement_Income_Tax:0 "Implement Income Tax"
SAF_Implement_Income_Tax_desc:0 "Unlike most other nations, we do not have a regular income tax. This must be rectified, as there is a massive untapped source of government revenue in play if we do enact an income tax- and by taxing income directly, we can be far more effective than tariffs or land taxes ever could."
SAF_Establish_Agricultural_Schools:0 "Establish Agricultural Schools"
SAF_Establish_Agricultural_Schools_desc:0 "Despite several academic institutes in our nation, our trade and work-based schools are lacking- but no longer. An initiative to promote agricultural schools to aid our people is in order, with these schools teaching farmers of all types to mechanize their farms, to increase yields, and get the most out of their land."
SAF_Loosen_Export_Regulations:0 "Loosen Export Regulations"
SAF_Loosen_Export_Regulations_desc:0 "Many resources come out of our country- but most never see the shelves of foreign markets. Instead, they are blocked by the cheaper goods from America or Britain, forcing us to become an import-heavy country- something that will stand no longer. By loosening restrictions on these exports, we will see our goods traverse the globe- and have our produce from New York to Bombay."
SAF_Support_Produce_Exportation:0 "Support Produce Exportation"
SAF_Support_Produce_Exportation_desc:0 "One of the downsides of being an agriculture-heavy nation is our overabundance of produce- produce which often does not serve any good purpose. By changing that, we can see South African produce hitting shelves across the region and perhaps even across oceans- bringing us closer to our neighbors and friends."
SAF_Reform_Tariff_System:0 "Reform the Tariff System"
SAF_Reform_Tariff_System_desc:0 "Unlike what some may believe when it comes to trade, tariffs are a massive boost for our economy. Preventing British goods from overflowing our markets keep South Africans employed and prevent further crises with unemployment. Strengthening tariffs instead of destroying them, then, will help us more in the long term than short term lifting of restrictions could ever do."

#Westminster/Foreign Policy
SAF_Westminster_Question:0 "The Westminster Question"
SAF_Westminster_Question_desc:0 "The United Kingdom is both our greatest ally and our bitterest enemy- having conquered the Boer Republics during the Second Boer War and causing the formation of the Union of South Africa in 1910, they are the reason we exist as we do now. Recently, though, the United Kingdom has made it clear that self-government is possible- and talks for this are now ending. However, there are some details remaining..."
SAF_Enact_Ratification:0 "Ratify the Statute"
SAF_Enact_Ratification_desc:0 "The negotiated settlement has done us fine. There is no reason to rock the boat now, when we have gained practical independence. It is a far sight better than it could be, and having the British friendly towards us is more preferable that not..."
SAF_A_New_Policy:0 "A New Policy"
SAF_A_New_Policy_desc:0 "South Africa will not merely remain content to be domestically independent- we must be independent in foreign policy as well. If we cannot determine our friends and foes, what good is having our own domestic legislature, or our own courts?"
SAF_Ties_Other_Democracies:0 "Strengthen Ties to the West"
SAF_Ties_Other_Democracies_desc:0 "While we may be moving more away from the United Kingdom, we are not moving away from her sphere in a radical direction. We simply wish to make new friends among our sister republics around the world, who may be able to insure our safety alongside Britain- with the might of the world with us, who can defeat us?"
SAF_America_Ties:0 "Meet With the United States"
SAF_America_Ties_desc:0 "Though the United States may not be the most influential power in Africa, their global mercantile influence cannot be denied. It does not hurt that their lack of strategic interest in the region can be used to our gain as well- no reason for them to oppose us means more reasons for us to gain standing, with no cost."
SAF_French_Ties:0 "Meet With the French Republic"
SAF_French_Ties_desc:0 "When one thinks of the powers that be in Africa, there are two that come to mind- the first being Britain, and the second France. Shoring up our relations with the French Republic means that we have the backing now of both major powers, a move that will certainly put us in a spot safer than nearly anywhere, if both heed their calls."
SAF_Ties_Rising_Powers:0 "Strengthen Ties to the Rising Powers"
SAF_Ties_Rising_Powers_desc:0 "It is not enough that we break from the Anglo-Saxon grip- we must find a way to end their dominance once and for all. While some might find it detestable, communicating with their rivals and would-be enemies in both Africa and Europe may give us support for future action- and if the worst occurs and war happens on the continent, we may have just the reason we need to finally break their grip once and for all."
SAF_Germany_Ties:0 "Meet With Germany"
SAF_Germany_Ties_desc:0 "No matter the situation in the chaotic Germany, one thing is clear- they have no love for the British. At the very least, they have an interest in whittling down British influence, and as such their support could be highly helpful. With the friendliness between members of the German and South African right, in addition to the realpolitik of it all, we might have a true friend in the Germans..."
SAF_Italy_Ties:0 "Meet With Italy"
SAF_Italy_Ties_desc:0 "The Italians act as the third power of Africa- while they may not have the terrain or industry of the British or French, they do have the ambition. With that ambition in direct opposition to the British, they are a natural choice for friendship- ending the Anglo-Saxon hegemony with Italian aid will be much easier than without."
SAF_1934_Status_Act:0 "Pass the 1934 Status of the Union Act"
SAF_1934_Status_Act_desc:0 "The 1934 Status of the Union Act is a formalization of our new relationship. It gives us domestic autonomy in just about everything, with the Governor-General practically only acting as a rubber stamp for whatever the Volksraad desires. All that remains is to pass this legislation- a trivial task."
SAF_Create_Seal:0 "Create a Seal"
SAF_Create_Seal_desc:0 "One of the things we must now do as an independent nation is create a seal for our government. Having such a seal will allow us to make it clear that any documents that pass through our halls are supported not by London, but by Pretoria and her own government."
SAF_Increase_Rhodesian_Trade:0 "Increase Rhodesian Trade"
SAF_Increase_Rhodesian_Trade_desc:0 "Our closest semi-independent neighbor, Southern Rhodesia has long been one of our best trading partners. Expanding and deepening these trade ties, should they so agree, will benefit us both greatly." 
SAF_Expand_Sterling_Ties:0 "Expand Ties With the Sterling Area"
SAF_Expand_Sterling_Ties_desc:0 "No matter our opinion on the Sterling Area itself, it is beyond party politics that we are connected to it- it is a simple fact. In order to allow our economy to be stronger, strengthening these ties is imperative- being able to trade further with the various nations connected to us by the Commonwealth will give us more wealth than is already arriving at our shores."
SAF_Support_British_Railways:0 "Support British Railway Construction"
SAF_Support_British_Railways_desc:0 "While a single rail from Cape to Cairo may be a far-off dream, one cannot state that railroads do not play a key part in the way this country- and her mother empire in Africa- operates. Supporting British rail companies will allow us to go further across these lands than before, and their hub being our nation will give us further influence in the region."
SAF_Improve_Harbor_Facilities:0 "Improve Harbor Facilities"
SAF_Improve_Harbor_Facilities_desc:0 "The port of the Cape is one of the greatest in the world- perhaps not in size or scale, but in beauty and importance on the key sea lanes between the Indian and Atlantic Oceans. Expanding our harbor facilities along the coast, even if not on the cape itself, will boost this trade- and allow us to control the region even more as need be if the seas turn to violence."
SAF_Our_Place_In_Britain_Shadow:0 "Our Place in Britain's Shadow"
SAF_Our_Place_In_Britain_Shadow_desc:0 "While some may want to separate from the United Kingdom, that path is not simply politically incorrect- it is folly of the highest degree. Instead, we should take advantage of our British ties, and grow alongside them in prestige and wealth. Britannia may rule the waves- and a large amount of the world- so who could blame us for lying comfortable under their flag?"
SAF_Invite_American_Business:0 "Invite American Business"
SAF_Invite_American_Business_desc:0 "One of the major things a deal with American can bring is business- lots and lots of it. One of the largest markets on Earth, gaining the support of the United States by having their manufacturers will create far more jobs than we ever had in the past, and bring us wealth- of course, it costs us a bit in our sovereignty as American business interests always do, but that's a small price."
SAF_Invite_American_Auto_Corporations:0 "Sign Deals With American Auto Makers"
SAF_Invite_American_Auto_Corporations_desc:0 "The open road, the automobile- signs of luxury abroad, but in short supply here. Luckily, with deals struck with American Automobile Manufacturers, these don't have to be a far-off dream- we can import vehicles by the thousands to pave the way for a future where South African roads are teeming with life and people are able to travel all over by their own volition."
SAF_Open_New_Markets:0 "Open New Markets"
SAF_Open_New_Markets_desc:0 "Being tied to the British does give us preferential treatment when it comes to the market system- but what it doesn't give us is diversity. By striking up deals with countries all over the globe, we will be able to have a plethora of choices- and those nations will get the advantage of our resources no longer being primarily for British benefit."
SAF_Diversify_Our_Industry:0 "Diversify Our Industry"
SAF_Diversify_Our_Industry_desc:0 "One of the things we have noticed in our nation is a severe lack of diversity. Our manufacturers produce the same few items, which might give short term gains- but stunts long-term growth. No longer, we say! We will invest in diversifying these industries to give us more financial security- and more things to sell abroad."
SAF_Invite_Foreign_Merchants:0 "Invite Foreign Merchants"
SAF_Invite_Foreign_Merchants_desc:0 "It is not only America and France who may give us financial prospects- the nations of the world, great and small, could benefit from ties to us. As a result, it's only natural that we invite them all to come to us- and see the bounty of wealth we have to offer them. Perhaps we can even strike up some deals in the process."
SAF_An_Independent_Dem_SAF:0 "A Free, Democratic Policy"
SAF_An_Independent_Dem_SAF_desc:0 "Our efforts have paid off, and now South Africa is not merely a pawn of the British Empire, but increasingly seen as a player on the world stage in her own right. Of course, that's within the Free World- we would never stoop to be outside of it. Truly, God has blessed Africa- and we're taking the reigns of his bounty."
SAF_Work_With_Madagascar:0 "Work With French Madagascar"
SAF_Work_With_Madagascar_desc:0 "French Madagascar is a peculiar location- one of both unimportance and severe importance. The French link to Southern Africa, it could provide a boon to us- or our enemies- looking to fight in the region should war come to pass. Thusly, it is a good thing if we end up working with their administration more closely- for our and their benefit."
SAF_Invite_French_Officers:0 "Invite Retired French Officers"
SAF_Invite_French_Officers_desc:0 "The recent crises in France have left a number of military men unemployed or underemployed- and we have a need for their services. By providing generous accommodations and housing, we could glean from their expertise in the Great War and their own conflicts- using the French army as a model to build upon our own."
SAF_Promote_German_Immigration:0 "Promote German Immigration"
SAF_Promote_German_Immigration_desc:0 "When we took over South-West Africa, we expelled a number of Germans and made it more difficult for the settlers to remain. We now see this as a mistake, and with war looming on the horizon in Europe no matter how it shakes out- it might be a good idea to invite them back with open arms, taking them in and making them our own. More men never hurt, right?"
SAF_Invite_German_Officers:0 "Invite German Officers"
SAF_Invite_German_Officers_desc:0 "The German Army is one beaten down, suppressed- with plenty of angry veterans and frustrated soldiers. Where better for them to find a home than here, helping us to improve our own small army? Of course, financial incentive will be necessary... but that's merely a trifle for the wealth of knowledge our old enemies could bring."
SAF_Increase_European_Exports:0 "Increase Exports to Europe"
SAF_Increase_European_Exports_desc:0 "Europe is a bounty of opportunity for us- her economies beginning to roar again, hungry for resources. This could provide a great opportunity for us if we wish to seize it, and we most certainly do- the factories and industries will be packed with South African mineral resources. Some will claim that this is only encouraging violence, but it's not our resposibility what they use them for."
SAF_De-Emphasize_British_Trade:0 "De-Emphasize Trade With Britain"
SAF_De-Emphasize_British_Trade_desc:0 "The policy of imperial preference is an old and outdated model- certainly not one to work for the present day. We will instead focus on trading with those outside of the Empire, to curb their influence- London will complain, but who cares about them? Certainly not us."
SAF_Promote_Corporatist_Industries:0 "Promote Corporatist Industries"
SAF_Promote_Corporatist_Industries_desc:0 "Out of those empires we wish to court has come a novel idea- the beginnings of Corporatism to improve production and decrease issues when it comes to labor. We will harness this for our own gain, as when we follow their model, we will not have to listen to the petty complaints of unions or workers- we will simply produce."
SAF_Invite_Italian_Merchants:0 "Invite Italian Merchants"
SAF_Invite_Italian_Merchants_desc:0 "Oh, Italia- the third major power, hungry for resources. Their merchants will find a welcome home here, with our industries happy to provide them with what they wish at a fair price. The British will no doubt protest, but it is not their business what we do, now is it?"
SAF_Invite_Aircraft_Industries:0 "Invite Italian Aircraft Industries"
SAF_Invite_Aircraft_Industries_desc:0 "The Italian air manufacturers are renowned for their skill- perhaps not their production quantities, but it is the difference between a hundred Fords and a single Ferrari. We will invite them to set up shop here, and who knows- perhaps we will get some of those aircraft for ourselves."
SAF_A_Rising_Policy:0 "A Rising, Powerful Policy"
SAF_A_Rising_Policy_desc:0 "South Africa, triumphant- that's what all the papers say. We have, in essence, thrown off the British shackles- and now have great friendships with their enemies in Europe. Who gives a damn if those enemies are seen as horrific, or monstrous- we're sure those are all lies anyways. And even then, are we so different? It matters little, because now South Africa has truly grasped her own destiny."


#Military
SAF_Army_Reform_1933:0 "Review the Union Defense Force"
SAF_Army_Reform_1933_desc:0 "The Union Defense Force as it was in the Great War- a large force combatting the Germans in Southwest and East Africa- is no more. The current one is barely able to handle itself, and serious reform is necessary- though it has been blocked and delayed for some time. Now, with the Depression behind us, we can put serious effort into preparing it for the next conflict."
SAF_Pirow_Plan:0 "Enact the Pirow Plan"
SAF_Pirow_Plan_desc:0 "The Pirow Plan, proposed by MP Oswald Pirow, will have the SAUDF spend its time focusing solely on the defensive- he argues that this will not only decrease costs, but will allow them to be more effective in policing the potentially rebellious territories of our country. While this would put us at a disadvantage in a conventional war, there is merit in it..."
SAF_Smuts_Plan:0 "Enact the Smuts Plan"
SAF_Smuts_Plan_desc:0 "The Smuts Plan, proposed by former Prime Minister Jan Smuts, will have the SAUDF reorganized into a central, conducive conventional fighting force- one that can take the fight abroad. While this move is unpopular as budget cuts become the norm, Minister Smuts says that it will be extremely helpful should another war- one he predicts- come to pass."
SAF_Policing_Actions:0 "Increase Policing Actions"
SAF_Policing_Actions_desc:0 "Our territories are prone to occasional rebellion- and should we be at war, these rebellions might intensify. Having the UDF reorganize to work with policing groups and take joint action will prevent such rebellion and allow us greater control of our territory."
SAF_Defensive_Forces:0 "Focus on the Defense"
SAF_Defensive_Forces_desc:0 "Fighting out of Africa? An absurd thought! Our forces are needed for defending South Africa, fighting abroad is ridiculous. Restructuring doctrine and our armed forces to focus on the defense wholly will give us far better protection than the fool's errand of trying to fight hundreds of miles away from our homes."
SAF_Rifle_Testing:0 "Test Our Rifles"
SAF_Rifle_Testing_desc:0 "The vast majority of rifles in our current ownership are old British models- some even dating back to the Boer War. This will not do, obviously. Testing our rifles and figuring out their issues will go a long way to improving the potency of our armed forces."
SAF_Reform_Commandos:0 "Reform The Commandos"
SAF_Reform_Commandos_desc:0 "The Commandos are a legacy of a bygone age- the age where Briton and Boer fought one another in this country- but they are by no means a relic. Instead of ridding ourselves of it, reforming these Commandos into elite units will give us an edge many other countries cannot boast- small groups of men fiercly loyal to both one another and the country, designed to fight unconventionally."
SAF_Expand_Military_Industry:0 "Expand the Military Industry"
SAF_Expand_Military_Industry_desc:0 "The state of our present military industry is a pitiful one. We are barely able to produce ammunition for our rifles, and are almost wholly reliant on the United Kingdom for equipment. This is obviously untenable in a state of war, and thus it is imperative we change this- one of the crucial acts in this process being creating our own facilities for manufacturing."
SAF_Civilian_Focus:0 "Focus on the Civilian Sector"
SAF_Civilian_Focus_desc:0 "Why must we have a large army if we do not plan on fighting a large army? The most our military will be asked to do is fight in the bush and savanna against small formations. We should focus more on our civilian sector instead, investing and subsidizing it to support us instead of a folly of a new army."
SAF_Artillery_Testing:0 "Test New Artillery"
SAF_Artillery_Testing_desc:0 "Artillery- a weapon that brings dignity to what would otherwise be an ugly brawl. We have had no reason to maintain large stocks of it, but as the times change we must as well- so testing British models to see what would suit our army best is in order. We may not use it much, but when we need it, it had better be there."
SAF_Motorized_Testing:0 "Test Motorized Equipment"
SAF_Motorized_Testing_desc:0 "Is it not a noble dream, to wish to drive across these vast savannas on your way to fight for your home? Our stockpiles of these trucks is almost non-existent, though, so testing the equipment and getting more of it will allow us to finally go on safaris of war instead of ones in nature reserves."
SAF_Expand_War_College:0 "Expand the War College"
SAF_Expand_War_College_desc:0 "The South African Military College is our primary school for training new recruits- but it is woefully understaffed and underfunded. Expanding it will give us a solid core of expert NCOs and officers who can easily adapt to a larger, more expansive force and give us greater potential on the battlefield."
SAF_Revise_Defensive_Plans:0 "Revise Defensive Plans"
SAF_Revise_Defensive_Plans_desc:0 "Many plans for the defense of South Africa date back to the Great War- ones that are out of date with the developments occurring sense. We will then update these battle plans to take modern capabilities, such as air and armored power, into account- and prepare accordingly. We will not be caught unawares."
SAF_Support_Training:0 "Train Support Units"
SAF_Support_Training_desc:0 "Support units are the backbone of any army- if the logistics and the equipment for those aiding those in combat is not there, an army will collapse. Training new units in the use of this equipment, while not necessary, will be incredibly helpful for future actions and operations."
SAF_Armored_Testing:0 "Test Armored Vehicles"
SAF_Armored_Testing_desc:0 "While it is unlikely armor will be able to play a significant role in the African theater- it is an eventuality we will have to prepare for. Using our own armor and learning how to defeat it by trials and testing will give us insights into the future- should it ever be necessary for South African armor to fight enemy armor."
SAF_Lessons_of_the_Great_War:0 "Lessons Of The Great War"
SAF_Lessons_of_the_Great_War_desc:0 "Simply because we did not fight in Europe does not mean we did not fight in the Great War. Campaigns in Southwest Africa and East Africa have taught us much, but it is time we really push to adapt these lessons- the other powers of the world most certainly are, and we do not want to be caught with our pants down."
SAF_A_Necessary_Force:0 "A Necessary Force"
SAF_A_Necessary_Force_desc:0 "The South African Union Defense Force is not a force that would go on triumph or conquer another nation- but it does not need to be. The most it needs to be is a stopgap force until others can join, or a defense force for nothing but deterrence altogether- getting into an offensive war is a fool's errand. Our force is necessary, but that is all it is."
SAF_A_Proud_Force:0 "A Proud Force"
SAF_A_Proud_Force_desc:0 "Simply because we are not a large or particularly wealthy nation does not mean we cannot be one of prestige on the field of battle. Through his action, Minister Smuts has ensured that our forces will be able to fight anywhere they need to- as a crack, disciplined fighting group instead of disorganized regional Commands which can be swayed by local politics. We should most certainly be proud- South Africa roars alongside all."

#Navy
SAF_Review_Navy_1933: "Review Our Naval Forces"
SAF_Review_Navy_1933_desc:0 "The South African Navy is not one of prestige or honor- in fact, one could easily say it does not exist. Despite the actions of South African sailors in the Great War, we have been entirely dependent thus far on the Royal Navy for our own coastal defense. Whether or not this policy will continue is the subject of much debate, a subject that must now be properly decided upon..."
SAF_Dismantle_The_Navy:0 "Dismantle The Navy"
SAF_Dismantle_The_Navy_desc:0 "The Navy is no longer needed- and the state needs the funds. We will dissolve our small navy such as it is as a form of austerity measure- it does us no good to spend finances on a useless fleet when we are protected by the finest one in the world of no cost to ourselves."
SAF_Sell_Vessels:0 "Sell Our Vessels"
SAF_Sell_Vessels_desc:0 "While we have no vessels of war, we do have other vessels in our naval service- ones lent to us by Britain. It is only right, then, that we should sell these back- both as a way to gain finances and as a way to rid ourselves of the requiremenet to maintain these."
SAF_Downsize_Defenses:0 "Downsize Our Defenses"
SAF_Downsize_Defenses_desc:0 "Who would dare to attack us by sea? As another measure to cut costs, we will be downscaling our coastal defense program- the British can do all of that for us, if it really becomes necessary in the future. No sense in worrying about it now."
SAF_Towards_Civilian_Use:0 "Restructure Towards Civilian Use"
SAF_Towards_Civilian_Use_desc:0 "While we may not require a large fleet or coastal defense forces, our waters are still criss-crossed by merchant vessels daily. We will then take the resources allocated to the navy and send it to regulatory agencies for these shipping lanes, to improve our own trade network."
SAF_Coastal_Patrol_Navy:0 "A Coastal Patrol Navy"
SAF_Coastal_Patrol_Navy_desc:0 "The navy has finally been fully dismantled- all that remains is merely a small coastal patrol force to rescue downed sailors. Soon, the finances that once went into our navy will go into supporting other endeavors, helping us at minimal cost to our own safety."
SAF_Maintain_The_Navy:0 "Maintain The Navy"
SAF_Maintain_The_Navy_desc:0 "While it may cost us, maintaining our naval force in the long run will be a beneficial idea. If war ever does come to our shores, the potential harm of cutting the trade link around the Cape is too much to risk- even if it is small, we must have something with which to ensure our own defense."
SAF_Buy_British_Vessels:0 "Buy British Vessels"
SAF_Buy_British_Vessels_desc:0 "The Royal Navy has expressed interests in selling off some of its own vessels as a measure similar to the one proposed by the opposition to this plan- and we will take advantage. We will come forward with a few proposals for our own fleet, so that we can independently ensure our own defense- a measure that may be costly, but will certainly do wonders down the road."
SAF_Improve_Simons_Town:0 "Improve the Simon's Town Base"
SAF_Improve_Simons_Town_desc:0 "The naval base at Simon's Town is one of our oldest- and is in need of serious reform. Instead of downsizing it and getting rid of the things that need our aid, we will instead spend the finances to improve and maintain it- so that if it is ever needed to back our own operations, it will be ready and waiting."
SAF_Sailors_British_Schools:0 "Send Sailors To British Schools"
SAF_Sailors_British_Schools_desc:0 "Our sailors know the seas of the Cape and Natal, yes, but they do not know much of the seas of the world. In order to gain this experience, we will send prospective officers to British Naval colleges, like the one at Dartmouth- bringing both greater ties to the Royal Navy and improvement for our own personnel."
SAF_Naval_Service_Expand:0 "Expand The Naval Service"
SAF_Naval_Service_Expand_desc:0 "They called us mad to have a fleet of our own, instead of scrapping the project altogether- but we knew it would be worth it. For if any foreign vessel with intention to cause harm ever crests the seas near our shores, we will be waiting and ready to ensure the defense of our homes."

#Economy
SAF_Economy_Start_1933:0 "The South African Economy"
SAF_Economy_Start_1933_desc:0 "The South African economy is one that needs a fair bit of work- due to the various situations of our provinces, it is clear we are not using the land and her people as much as we could be. However, the path forward is murky, and there are two competing options- expanding agriculture or industry. Only one can win out..."
SAF_agriculturalfocus:0 "Agricultural Focus"
SAF_agriculturalfocus_desc:0 "It is obvious what our focus should be- agricultural. Our home is the fields and the land, it would be a betrayal of our heritage to switch our economy to one of factory and machinery. While this may not rake in the same revenue, it is sure to be popular- especially among our ruling class."
SAF_industrialfocus:0 "Industrial Focus"
SAF_industrialfocus_desc:0 "It is obvious what our focus should be- industrial. While it may not be as popular as the continuation of our agricultural policies, it is more beneficial in the long run- having an expansion of industry will bring us into a new age, one of wealth far beyond what the fields can generate."
SAF_subsidizewhitefarming:0 "Subsidize White Farming"
SAF_subsidizewhitefarming_desc:0 "Our farming is our livelihood- more specifically, the white farms which dot across the landscape. The support of these farmers is crucial to our cohesion and to our long-term stability, so subsidizing them to prevent their way of life from becoming unprofitable is a necessary step."
SAF_beginlongtermplanning:0 "Begin Long-Term Planning"
SAF_beginlongtermplanning_desc:0 "If we are to have a future, we must plan for it. As such, we will set aside funds and resources so that if rapid industrialization is ever needed- say, in a time of war- we will not only be able to begin it, but see it through to a proper level of completion."
SAF_anindustrializingsouthafrica:0 "An Industrializing South Africa"
SAF_anindustrializingsouthafrica_desc:0 "The factories hum with noise and machinery clangs- the sound of progress. While it will be some time until we truly join the ranks of the various nations who are on a level of full industrialization, we have made significant steps forward in that regard- forward, and into the future."
SAF_expandthewesterncapevineyards:0 "Expand the Western Cape Vineyards"
SAF_expandthewesterncapevineyards_desc:0 "The Cape Vineyards are not just a top choice for wineries- they are a large source of tourism income from those who are interested in such things. Subsidizing and expanding them could bring a great boon to our economy, while helping the people who have been running them for centuries."
SAF_expandnatalplantations:0 "Expand Natal Plantations"
SAF_expandnatalplantations_desc:0 "The Natal region holds some very fertile farmland for growing the crops which generate financial gain- not merely grain or seed crops. Supporting the Natal farmers is a natural step in ensuring that production is healthy and stable for years to come, and the money will continue to flow."
SAF_expandeasterncaperanching:0 "Expand Eastern Cape Ranching"
SAF_expandeasterncaperanching_desc:0 "While agriculture on a large scale is not common in the Eastern Cape, ranching for livestock is- and supporting this industry will help both keep our farmers employed and the locals, who are very involved in the process, quiet and happy at least for a time."
SAF_ignoreminerunions:0 "Ignore Miner Unions"
SAF_ignoreminerunions_desc:0 "The unions are rabble-rousers- and what's more, they could hurt industrial prospects. We will ignore their demands and concerns, choosing instead to focus on our own action- they will be upset, of course, but their views are of little concern to us."
SAF_nationalizeindustries:0 "Nationalize Industries"
SAF_nationalizeindustries_desc:0 "Industrial growth, uncontrolled, could have unforseen consequences- better to place those industries under the loving care of our government, who can ensure that they are put to better use. Sure, this will stifle the growth of some sectors, but those sectors weren't too important if funds weren't to be allocated to them anyways."
SAF_stopindustrialization:0 "Stop Industrialization"
SAF_stopindustrialization_desc:0 "Industrialization and its consequences have been a disaster for our economy. We will limit these issues here and now, ensuring that the way of life of our people- an agricultural way of life- cannot and will not be harmed by and for the interests of London industrialists."
SAF_endindustrialsubsidies:0 "End Industrial Subsidies"
SAF_endindustrialsubsidies_desc:0 "Industry in our nation has received subsidy for some time from the government to promote growth- a policy that must now end. If an industry cannot survive on its own, it does not deserve to exist within our economy merely as a leech on the more prosperous and righteous of us."
SAF_developtherailways:0 "Develop the Railways"
SAF_developtherailways_desc:0 "The railways of South Africa are our lifeblood- transporting things to and fro. Subsidizing and developing these to connect our people is a natural and righteous cause, and will certainly give benefits in the long run."
SAF_investinmajorsectors:0 "Invest in Major Sectors"
SAF_investinmajorsectors_desc:0 "Contrary to the beliefs of some, it is best if we subsidize key parts of the economy- to ensure that growth functions properly and that we are able to truly reap the rewards of our efforts. It doesn't hurt that this gives us a bit of a return, having partial shares in many influential corporations..."
SAF_developthecapeport:0 "Develop the Cape Port"
SAF_developthecapeport_desc:0 "The Cape port is one of our most vital and important links to the outside world- subsidizing it to promote growth and financial solvency in the region is an obvious next step as part of our economic growth programme."
SAF_expandchromiumextraction:0 "Expand Chromium Extraction"
SAF_expandchromiumextraction_desc:0 "Chromium- a resource scarce in large parts of the world, and one required to do many things that are needed of modern militaries. We just so happen to sit on large piles of it, so it won't hurt anyone if we dig deeper and greedier for it- we can sell it off to even more people and make more money to help our nation."
SAF_expandinfrastructureprojects:0 "Expand Infrastructure Projects"
SAF_expandinfrastructureprojects_desc:0 "South African infrastructure is horribly underwhelming- especially when it comes to electricity. Large parts of the country have difficulty with gaining simple power, not to mention the areas that still struggle with heating or running water. Subsidizing large-scale improvements in order to support these people will help us all, even if it may be a bit costly in the short-term."
SAF_expandnorthwestagriculture:0 "Expand Northwest Agriculture"
SAF_expandnorthwestagriculture_desc:0 "The Northwest area of our country is one of the poorest and worst places to live- and will not do for large-scale future colonization. Encouraging development for the region and ensuring that it will be habitable for farmers in future beyond sustenance farming will go a long way towards creating a greater sense of self-control and self-reliance in our nation."
SAF_expandfreestatefarming:0 "Expand Free State Farming"
SAF_expandfreestatefarming_desc:0 "The Free State- both the center of our country geographically and one of its hubs, farming is part of the traditional way of life in this region. Supporting that way of life will help us greatly in winning over the Afrikaner farmers here, who hold much sway over regional politics."
SAF_slowindustrialization:0 "Slow Industrialization"
SAF_slowindustrialization_desc:0 "Industrialization need not stop- it should merely go at a pace that allows the more traditional ways of life to maintain themselves in these troubling times. We still have need of industry, even if we do not like it- and so we must compromise with the industrialists."
SAF_restartblackmajoritymining:0 "Restart Black-Majority Mining"
SAF_restartblackmajoritymining_desc:0 "It is a point of much contention in our country, the mining sector- debates over the racial aspect especially. It will kill two birds with one stone if we begin to institute quotas and enforce the fact that the natives of our land should be the ones in the mines- both sabotaging the growth of the industry, and ensuring that our white settlers are the ones doing the farm work instead of the native population."
SAF_expandtransvaalagriculture:0 "Expand Transvaal Agriculture"
SAF_expandtransvaalagriculture_desc:0 "The Transvaal, much like the Free State, has much agriculture and agrarian land to speak of- and is also one of the hubs of our Afrikaner farmer ruling class. Supporting them further will endear them to us, and ensure that they will support our actions in future."
SAF_limitminingoutput:0 "Limit Mining Output"
SAF_limitminingoutput_desc:0 "While the mines of our country do provide a great service to us, they also serve to harm the dominance of our agricultural sector. Limiting the amount of resources that can come out of these mines, then, will ensure the place of agriculture as the top industry in our nation- and, of course, as the public relations side of this it will presumably ensure these resources last longer."
SAF_subsidizecivilianindustry:0 "Subsidize Civilian Industry"
SAF_subsidizecivilianindustry_desc:0 "Encouraging the growth of our civilian industrial sector provides us with a greater base from which to work off- and more workers to use in what may come down the road when these projects hit the ground running. It will do us much good, then, to financially support these endeavors and ensure our success."
SAF_negotiatewithminerunions:0 "Negotiate with Miner Unions"
SAF_negotiatewithminerunions_desc:0 "Despite some disdain for them, cooperation- not conflict- with the labor unions of our country is the way forward. By ensuring that they are represented and their voices are heard, we ensure far greater outputs and reduce by a wide margin the chance of strikes and violent action in our country."
SAF_subsidizemilitarydevelopment:0 "Subsidize Military Development"
SAF_subsidizemilitarydevelopment_desc:0 "The South African military industry is one that is severely lacking- something we cannot risk in turbulent times such as these. By promoting local manufacturers and convincing British business to open offices in our country, we can ensure that if we need them, we will be able to produce our own arms and equipment- at least to fill the gaps between British supplies."
SAF_anagriculturalsouthafrica:0 "An Agricultural South Africa"
SAF_anagriculturalsouthafrica_desc:0 "The Agriculturalists have won- and all over the country, the effect of their policies can be seen. Industry is halted or slowed, and farmers are wealthier than ever- while some may claim we have irrevocably stunted our nation, we say that we have saved it from the very things that may have destroyed it."
SAF_expandtheminingindustry:0 "Expand the Mining Industry"
SAF_expandtheminingindustry_desc:0 "The mining industry in our nation is our lifeblood- the sheer amount of resources and minerals that can be found here is astounding. Subsidizing and encouraging that industry will only bring us further growth and further wealth, a springboard into a better age of finance."
SAF_expandgoldmining:0 "Expand Gold Mining"
SAF_expandgoldmining_desc:0 "Gold mining is one of our most lucrative endeavors- and one that some say was the true cause of the many conflicts in the region. Expanding this industry will give us a surefire gain- while the Gold Standard is getting rarer and rarer, more people still want to purchase it as an investment or to keep their economy afloat than ever."
SAF_expanddiamondmining:0 "Expand Diamond Mining"
SAF_expanddiamondmining_desc:0 "Ah, the diamond mines- the playthings of De Beers and the various subsidiaries, they serve as our other great export. Sending cash and approving permits to these corporations will employ many South Africans and ensure a steady source of revenue for the government... if you ignore the hardships of the miners involved, it's practically perfect for our plans."

#South Africa at War
SAF_War_In_Africa:0 "War in Africa"
SAF_War_In_Africa_desc:0 "The unthinkable- or at least, most feared thing- has occurred. War once more engulfs the African continent, and not merely a localized one. We, of course, will follow Britain into this long war- as both loyal subjects of Empire and as opposition to the goals of the enemy. Now we must steel ourselves, for the long road of war ahead."
SAF_Eastern_African_Campaign:0 "The East African Campaign"
SAF_Eastern_African_Campaign_desc:0 "East Africa has long been a center of conflict, it is no surprise the war would find itself here. We must prepare ourselves to both go on the offensive and defensive, protecting the holdings of our allies while simultaneously beating back the enemy and liberating the territories which belong to them."
SAF_Secure_Southern_Africa:0 "Secure Southern Africa"
SAF_Secure_Southern_Africa_desc:0 "Southern Africa is our home- and home must be defended. It is vital that we secure the region in order to ensure that we can operate abroad- and it is even more vital that we secure the trade links so that others can continue the fight abroad. For if the South falls, who will be able to defend Africa?"
SAF_Secure_Western_Africa:0 "Secure Western Africa"
SAF_Secure_Western_Africa_desc:0 "Western Africa may not be the most crucial or strategically important of regions, but it does house many colonies of our erstwhile allies- and ensuring its safety is another thing that we must do. If the enemy has even a single foothold on the continent, our continued freedom is at risk."
SAF_Mediterranean_Campaign:0 "The Mediterranean Campaign"
SAF_Mediterranean_Campaign_desc:0 "The Mediterranean is the most volatile- and important to the European theater- of all the regions of Africa. While it is the furthest from us, it would make perfect sense that we must defend it and move forward to clear out our enemies- for if the strategic lands of the Mediterranean fall, it will be nigh-impossible to ensure that the enemy is driven back from the ability to harm us."
SAF_Defend_British_Kenya:0 "Defend British Kenya"
SAF_Defend_British_Kenya_desc:0 "British Kenya is the most vital defensive position of the region- both for its wealth and the importance of Mombasa as a key travel link between the Suez and our nation. Shoring up forces there and preparing units to engage should the Italians begin to push into it is a crucial part of our defensive plan going forward."
SAF_Supply_British_Forces:0 "Supply British Forces"
SAF_Supply_British_Forces_desc:0 "Being so far from home, it is probable that the British soldiers fighting alongside us will be low on equipment and supply. We will thus aid them in supplying, running routes through the Cape and granting them our own supplies in the short term to ensure that when we do need to fight, we will not have our allies be under-equipped."
SAF_Expand_Bombing_Operations:0 "Expand Bombing Operations"
SAF_Expand_Bombing_Operations_desc:0 "Since the opening shots of the war, bombers granted to us by the British have been striking enemy positions in the region. However, it is imperative that we continue these actions and improve upon them- requisitioning more bombers will allow us to strike at increased levels, harming our enemies further."
SAF_Support_British_Offensives:0 "Support British Offensives"
SAF_Support_British_Offensives_desc:0 "Despite our prominent role in this fighting, it is the British calling the shots- and these British actions will need our support in the future. Any time a British army advances, we will advance with them, two equal parts of the thrust against the enemy."
SAF_Supply_Ethiopian_Partisans:0 "Supply Ethiopian Partisans"
SAF_Supply_Ethiopian_Partisans_desc:0 "Ethiopia is a conquered nation- recently conquered as well. Partisans from the nation harass the Italians day and night, though they are increasingly lower in supply and equipment. Sending some of these through our MI6 contacts will allow them to continue the fight, and harass the enemy from the backlines while we advance to their liberation."
SAF_Secure_Abyssinia:0 "Secure Abyssinia"
SAF_Secure_Abyssinia_desc:0 "It is not only important that we fight to defend British East Africa- we must secure the whole of Abyssinia. At some point, the entire region will be free of the menace that controls it, and as part of the Allies- one more area liberated from their masters in Europe with which we are presently at war."
SAF_Ensure_Afrikaner_Loyalty:0 "Ensure Afrikaner Loyalty"
SAF_Ensure_Afrikaner_Loyalty_desc:0 "The Afrikaner population in our nation is a potentially politically unreliable one- with revolts occurring in the first war, it is not entirely outside the realm of possibility that more will occur in this war. Ensuring their compliance by some well-placed arrests and monitoring known pro-enemy factions within our territory is crucial to ensure the safety of the region."
SAF_Secure_Madagascar:0 "Secure French Madagascar"
SAF_Secure_Madagascar_desc:0 "Madagascar is one of the first links that must be secured in future fighting- regardless of if they are held by friend or foe. If there does not exist a friendly administration on the island, we risk the enemy using it to strike at our trade links- a horrific thought if there ever was one."
SAF_Patrol_British_Africa:0 "Patrol British Southern Africa"
SAF_Patrol_British_Africa_desc:0 "British Southern Africa may be a land largely under our control, but in the event of a cutoff from the Home Islands... it may potentially be a future battleground. Preempting this by ensuring that the local administrations are not just loyal to the crown but will continue the fight from Africa if need be is an action that is required so that we will not have to fight our own in these colonies."
SAF_Station_Forces_Portuguese_Africa:0 "Station Forces in Portuguese Africa"
SAF_Station_Forces_Portuguese_Africa_desc:0 "With the entry of Portugal into the war, their colonies are now on our side- though with their situation largely reliant on the actions of Spain, it is crucial these friendly colonies do not become hostile. Speaking with their local administrations and ensuring their friendliness will be a large step to prevent a bush war in Angola and Mozambique against the fascist enemy."
SAF_Fortify_Cape:0 "Fortify the Cape"
SAF_Fortify_Cape_desc:0 "The Cape is our most vital trade hub- and the possibility that it might be attacked is never far from our mind. We will then approve the construction and expansion of fortifications in the region so that if enemy ships do ever grace our shores, they will be met with stiff resistance to protect the key port and shipping infrastructure of the Cape."
SAF_Patrol_British_West_Africa:0 "Patrol British West Africa"
SAF_Patrol_British_West_Africa_desc:0 "Patrolling the colonies of West Africa is not a fun or entertaining job- but ensuring their commitment to the fight is something we cannot leave to chance. We will give advisors to each of these administrations so that if the unthinkable occurs, we will be united in our struggle against the fascist menace instead of divided amongst ourselves."
SAF_Secure_French_Colonies:0 "Secure French West Africa"
SAF_Secure_French_Colonies_desc:0 "French West Africa is both a potential threat and ally- the local administrations being far more likely to support us than a hostile regime in France would it ever be taken over by foreign powers. Still, it does not hurt to make this a certainty instead of a mere probability- speaking with each of them will harm nobody except our enemy."
SAF_Secure_Spanish_Colonies:0 "Secure Spanish West Africa"
SAF_Secure_Spanish_Colonies_desc:0 "Spanish West Africa- now a battleground in this struggle. We must ensure that this remote and sparsely populated area does not become a staging point for enemy attacks, as unlikely as that is- it never hurts to verify and be certain of something as important as this."
SAF_Defend_British_Holdings:0 "Defend the British Mediterranean"
SAF_Defend_British_Holdings_desc:0 "Egypt, Palestine, and more- all presently firing the Union Jack. Despite our feelings on the British, it is fairly universally agreed that any other flag would not only hurt our trade but threaten our present existence- and so we will send forces north to support the British in their war, defending both these locales and by extension our own homes."
SAF_Attack_Italian_Libya:0 "Attack Italian Libya"
SAF_Attack_Italian_Libya_desc:0 "Italian Libya is now an enemy colony- and thus it must fall. We will strike deep and hard into this stronghold of the enemy, marching side-by-side with the Commonwealth- fighting as hard and long as is necessary. First Benghazi, then Tripoli- the entire country will fall to the free world."
SAF_Fortify_El_Alamein:0 "Fortify El Alamein"
SAF_Fortify_El_Alamein_desc:0 "As much as we would like to go on an offensive, we must also consider the reverse- an enemy thrust through Egypt to attempt to cut the Suez. This is unacceptable, so we will send engineers north to fortify the strategic chokepoint of the region- a town known as 'El Alamein'. If the enemy ever finds its way to fighting there, it will find naught but a death trap waiting for them."
SAF_Reinforce_African_Forces:0 "Reinforce African Forces"
SAF_Reinforce_African_Forces_desc:0 "The Commonwealth has made use of a number of African colonial regiments and even division-size forces- but these divisions are sorely limited in equipment and manpower. We will aid them with disciplined soldiers and equipment of our own, sending units and gear to them- so that we may all achieve victory together."
SAF_Perfect_Armored_Thrusts:0 "Perfect Armored Thrusts"
SAF_Perfect_Armored_Thrusts_desc:0 "Armor found its fame on the fields of Europe, but we can use it in the savannahs and sands of Africa as well- fighting using our own chariots of steel. Developing armored doctrine and improving the vehicles for our own use will show that it is not only the Europeans who can conduct armored warfare- Africa will be known for its tank duels as well, and we will be a crucial part of it."
SAF_Break_Italian_Resolve:0 "Break Italian Resolve"
SAF_Break_Italian_Resolve_desc:0 "The Italians fight not for their homes, like us, or for the defeat of fascism like the British- they fight for a colonial empire. We must then break their spirit and show them that this empire is not worth their lives, is not worth death in some worthless colony- and that fighting for the British worthless colonies is a fool's errand."
SAF_Push_For_Tunisia:0 "Push For Tunisia"
SAF_Push_For_Tunisia_desc:0 "It is not only Libya that we must seize, but Tunisia as well- we cannot risk it being used to launch a counterattack on our thrust into the conquered enemy's land. Thusly we will push on, into the land of Tunisia, so that we may not face a threat towards our own lands in the future." 
SAF_Hold_The_Suez:0 "Hold the Suez"
SAF_Hold_The_Suez_desc:0 "The enemy advance pushes forward, but we know that we will be victories- with the defenses we have planned, nothing can break through with sufficient strength to take all of the lands. Our most crucial line of defense will be those on the Suez herself, protecting the shipping lane that is so vital to the global war effort."
SAF_Secure_French_North_Africa: "Secure French North Africa"
SAF_Secure_French_North_Africa_desc:0 "French Algeria and Morocco- while it may not be our own armies liberating them, they must be freed from the grasp of the enemy regardless. These crucial colonies, occasionally considered as much Europe as Africa, will be the source of great prestige and power to whoever controls them- we must make sure that the group which controls them is us."
SAF_An_Allied_Africa:0 "An Allied Africa"
SAF_An_Allied_Africa_desc:0 "God Saved Africa! We have beaten back the jackbooted armies of the enemy, fought off the foreign powers which wished to claw their hands towards us on our own continent, and now the entire continent flies either the flag of us, a friend, or a nation wholly out of the war. The crisis is now over, and we may look abroad- so the rest of the world can be freed from this tyranny."

#Wartime Military

SAF_Wartime_Military_Start:0 "A Wartime Military"
SAF_Wartime_Military_Start_desc:0 "With our nation at war, we must take a look at our armed forces with a critical lens. We need to ensure that when we fight the enemy, we are not using equipment or doctrine from the last war, but are prepared to fight on a cutting-edge level."
SAF_Expand_The_SAAF:0 "Expand the SAAF"
SAF_Expand_The_SAAF_desc:0 "The South African Air Force is a branch of our armed services which requires a heavy level of improvement- it barely exists beyond on paper at the moment. If we improve along the plans presently in place, though, it could be quite the force to be reckoned with- at the very least supporting our every action abroad."
SAF_Purchase_British_Fighters:0 "Purchase British Fighters"
SAF_Purchase_British_Fighters_desc:0 "We do not have a very large domestic arms industry in general- and production of fighters is not something we can exactly focus on. Thankfully, though, the British have offered to sell us aircraft to fill the gaps in our ranks- it will cost some funds, yes, but it will help significantly in building up our forces further."
SAF_Purchase_Naval_Bombers:0 "Purchase Naval Bombers"
SAF_Purchase_Naval_Bombers_desc:0 "It is not merely fighters that are required- to successfully defend our shores, we must have the ability to sink enemy vessels attacking us. While the aircraft we purchase are not likely to be the latest, they can still do the necessary job of fighting off those who attack us- and besides, who knows? An outdated bomber can still sink an advanced warship with the right luck."
SAF_Supporting_Our_Troops:0 "Supporting Our Troops"
SAF_Supporting_Our_Troops_desc:0 "We must adopt the new doctrine of close air support attacks in order to be effective- fighting in both the land and skies in coordination, striking the enemy from all possible angles in order to force them back and seize an ultimate victory."
SAF_Striking_Enemy_Heartlands:0 "Striking Enemy Heartlands"
SAF_Striking_Enemy_Heartlands_desc:0 "It is not enough to merely bombard the frontline troops- we must strike their rearguard as well, so that when their forces retreat they will have no defenses to fall back to and that when their forces cry for supplies, all of it will be but ash and rubble."
SAF_Developing_Air_Doctrines:0 "Developing Air Doctrines"
SAF_Developing_Air_Doctrines_desc:0 "Our air force could use a refresher of doctrine- the old techniques and training will not be good enough for this new era of warfare. We will invite British theorists to aid us in this endeavor, using their experiences to create a truly elite force of pilots."
SAF_Reform_The_UDF:0 "Reform the UDF"
SAF_Reform_The_UDF_desc:0 "The Union Defense Force, our largest fighting force, is a veteran of one war- and now it shall be the veteran of two. Already many young men are signing up to fight the enemy at home and abroad, and they will need our full support in conducting this warfare for the predicted years to come."
SAF_Promote_Maneuver_Warfare:0 "Promote Maneuver Warfare"
SAF_Promote_Maneuver_Warfare_desc:0 "The ideas of trenches and static defenses simply do not apply to our African warfare- we must be constantly on the move, on the prowl like a lion on the hunt. Our forces should be be able to cover more ground than their counterparts in the enemy armies, able to move faster and further- for that will dictate the true victors in this war."
SAF_Increase_Conscription:0 "Increase Conscription Activities"
SAF_Increase_Conscription_desc:0 "It is not enough to simply rely on volunteers- we need more men in uniform. Sadly, we will have to institute a draft for these men, which, while regrettable, will get us the manpower that we need to fight onward instead of constantly having empty places in our ranks. Men of South Africa, your country needs you!"
SAF_Improve_Armored_Equipment:0 "Improve Armored Equipment"
SAF_Improve_Armored_Equipment_desc:0 "Our armored units are small in number and weak in training- something that has to change if we are to be effective on the future battlefield. We will heavily expand both these units and improve on their equipment by leagues above where they are now- so that when our armor engages, it will trounce anything in its path."
SAF_Expand_Motorized_Units:0 "Expand Motorized Units"
SAF_Expand_Motorized_Units_desc:0 "Armor is well and good, but it will be the trucks and jeeps which carry us forward- allowing our troops to move far faster across the savannas than they ever could on foot. These motorized units must then be expanded to aid our efforts, beating back the enemy and running circles around them."
SAF_Develop_Rieder_Rifle:0 "Develop the Rieder Rifle"
SAF_Develop_Rieder_Rifle_desc:0 "The Rieder rifle is a program that some in our Army have envisioned to convert a large number of our Lee-Enfield rifles into automatic firearms for use on the modern battlefield. We will subsidize and encourage this program, improving upon it for the future so that our forces may carry modern weapons into battle for a far cheaper cost."
SAF_Expand_Arms_Production:0 "Expand Arms Production"
SAF_Expand_Arms_Production_desc:0 "Our domestic arms factories are lacking severely in funds and resources- perhaps it is time we change that, and provide them with as much as they need? While British equipment is well and good, it will do us far more good to have production bases here as well as the imports coming in from the United Kingdom."
SAF_The_Native_Question:0 "The Coloured Question"
SAF_The_Native_Question_desc:0 "The coloured population of South Africa is a large, untapped pool of manpower- and untapped for good reason. Many in our government fear that if they are trained and sent onto the battlefield, they may use these skills in resistance against us. However, with the large manpower requirements demanded of the battlefield, might it be time to grant them greater ability to serve in our military as simply a wartime measure?"
SAF_Improve_Special_Forces:0 "Improve Special Forces"
SAF_Improve_Special_Forces_desc:0 "Our special forces have a storied past- but lately, they have been incredibly under-served and underfunded. We will begin to refund and resupply these units, creating small groups which can operate behind enemy lines and strike where they least expect it- like the Commandos of old, using the terrain to their advantage in raids and small attacks."
SAF_Improve_Support_Equipment:0 "Improve Support Equipment"
SAF_Improve_Special_Equipment_desc:0 "Our forces fight on all over Africa, and they require much- bullets, bandages, and bayonets, as the saying goes. To manage this we require a number of specialized support organizations, which we will create to ensure that when our men do fight, they fight under the best conditions possible."
SAF_Improve_Artillery_Designs:0 "Improve Artillery Designs"
SAF_Improve_Artillery_Designs_desc:0 "Our artillery designs are nearly entirely from the last war- and require a vast amount of improvements so that they may serve properly from the frontline. We will allocate funding towards improvements and purchasing new designs, so that we may begin to take full advantage of the potential uses of such pieces of equipment."
SAF_Expand_Garrison_Forces:0 "Expand Garrison Forces"
SAF_Expand_Garrison_Forces_desc:0 "We are not only going on the offensive- we require a large amount of forces to remain behind, both the prevent insurrection at home and to defend our shores if the enemy ever arrives by sea. We will then, of course, need to give more men and equipment to these garrisons- so that we will not have to worry about the home front."
SAF_Motorize_Support_Units:0 "Form Mechanized Units"
SAF_Motorize_Support_Units_desc:0 "It is not only necessary to have motorized and armor- a middle ground will give us great advantages in the engagements in our unique terrain, being not slowed by the weight of armored warfare but protected from the vulnerabilities of mere trucks and jeeps. We will invest into armored personnel carriers and half-tracks, so that we can find a solid compromise between the two that will serve our needs greatly."
SAF_Develop_Anti_Tank:0 "Develop Anti-Tank Equipment"
SAF_Develop_Anti_Tank_desc:0 "If we are to operate armor, then the enemy will certainly as well- and we must be ready. While anti-tank guns are not nearly as flashy as armored tanks fighting one another, they are far cheaper- and more cost-effective for eliminating them. Integrating these guns into our infantry will help significantly if we ever have to engage these armored units on a serious level."
SAF_Improve_Planning_Schools:0 "Improve Planning Schools"
SAF_Improve_Planning_Schools_desc:0 "It is not only needed to improve our equipment, but our doctrine and officers as well- and such, creating new wartime schools for South African officers to learn about the requirements and strategies of warfare will help us significantly in engaging the enemy and finding advantages where others might not in this conflict."
SAF_Doctrinal_Developments:0 "Promote Doctrinal Developments"
SAF_Doctrinal_Developments_desc:0 "Merely keeping up with doctrine is not good enough- we must constantly innovate, and improve, so that we may stay on the cutting edge. Our enemies surely will as well, and we cannot simply be reliant on the British for all of these advancements."
SAF_Defend_Our_Seas:0 "Defend Our Seas"
SAF_Defend_Our_Seas_desc:0 "With war comes the threat of attacks on the trade channels that run through South Africa- and as such, it becomes necessary to defend our shores with our own vessels and equipment. We will fight the enemy at sea as hard as the enemy on land- no submarines or light vessels will damage the vital shipping lines crossing our waters."
SAF_Expand_Dockyard_Facilities:0 "Expand Dockyard Facilities"
SAF_Expand_Dockyard_Facilities_desc:0 "In order to maintain the vessels now coming through our ports constantly, we will create new docks and drydocks- so that if need be, we will be able to repair and supply any vessels that may require it. All for the war effort!"
SAF_Protect_Shipping_Convoys:0 "Protect Shipping Convoys"
SAF_Protect_Shipping_Convoys_desc:0 "Protecting shipping convoys is one of our most important duties- and one we do not take lightly. Every time a vessel enters our waters, they will receive as much support and protection as we can provide- their cargo and what they represent is simply too important to risk losing."
SAF_Hunt_Enemy_Submarines:0 "Hunt Enemy Submarines"
SAF_Hunt_Enemy_Submarines_desc:0 "The threat of an enemy submarine is our greatest one- fighting them off is the most solemn duty of our naval force. Between patrol vessels hunting them and anti-submarine aircraft searching the entire coast for them, we will not let a single vessel (or god-forbid, a wolfpack) enter our seas without being sunk or chased off."
SAF_Strike_From_Below:0 "Strike From Below"
SAF_Strike_From_Below_desc:0 "We must not merely be defensive- we must go on the offense as well, with our own submarines. Enemy convoys are also prolific, and we can help our allies by a large amount hunting them ourselves- so that they, not we, will fear the depths."
SAF_Designate_Naval_Strategists:0 "Designate Naval Strategists"
SAF_Designate_Naval_Strategists_desc:0 "Between our elderly Admiral and our few commanders, it is clear that our naval force is a small one- but that does not mean we cannot plan for the future. We will designate strategists to both coordinate our current efforts and plan for larger, hypothetical ones- so once we have a larger fleet, we are able to use it effectively."

#Wartime Government
SAF_Wartime_Government_Start:0 "Wartime Government Formed"
SAF_Wartime_Government_Start_desc:0 "The beginnings of our nation at war have rocked South African politics- gone is the days of the united Smuts-Hertzog coalition, in its place Smuts seemingly rules alone. We will now have to drive the nation forward, bringing ourselves to a state of war alongside the rest of the Empire- while attempting to not create so much disruption that we can no longer effectively rule."
SAF_Enact_Emergency_War_Measures:0 "Enact Emergency War Measures"
SAF_Enact_Emergency_War_Measures_desc:0 "The first step we must take is to begin some measures to allow us to govern more efficiently- and prepare for the inevitable casualties and damages that the war will bring. We know, as macabre as it is, that these things will happen- so planning ahead will give us the best chance to prevent them from being too disruptive."
SAF_Develop_Our_Industry:0 "Develop War Industries"
SAF_Develop_Our_Industry_desc:0 "Our war industry is severely lacking- and that simply will not do. We must bring it into line, and begin having the factories churn out necessary materials- it may hurt short-term stability, but it is a small price to pay for the future."
SAF_Reform_Government_Finance:0 "Reform Government Finance"
SAF_Reform_Government_Finance_desc:0 "Our government is in need of serious financial reforms- and with the hardship of war, it makes sense that we will begin by immediately reforming those institutions which are costing us the most. If our financial sector cannot keep solvent in war, then the whole endeavor might as well be called off."
SAF_Reform_The_Judiciary:0 "Reform The Judiciary"
SAF_Reform_The_Judiciary_desc:0 "Our Judicial system must also change with the event of war- petty crimes are of less importance, and high treason charges may well be leveled during these engagements. As such, we will set about ensuring that the judicial system is prepared to handle such things, should the need arise."
SAF_Enact_Transportation_Legislation:0 "Enact Transportation Legislation"
SAF_Enact_Transportation_Legislation_desc:0 "We must regulate and manage transportation in this country- ensuring that as few resources as possible are wasted on frivolous civilian pursuits and that the most resources possible are going towards the war effort is of the utmost priority."
SAF_Intensify_Resource_Extraction:0 "Intensify Resource Extraction"
SAF_Intensify_Resource_Extraction_desc:0 "Resources and minerals- the one thing our nation has in abundance. To provide for ourselves and the rest of the Allied powers, we must dig harder and longer than we ever have before- each bit that leaves our mines is another bit supporting the war effort."
SAF_Slacken_Foreign_Aliens_Legislation:0 "Slacken Foreign Aliens Legislation"
SAF_Slacken_Foreign_Aliens_Legislation_desc:0 "While we may be at war, that is no reason for us to crack down on foreign aliens- the vast majority of them are other citizens of the Empire. Quite the opposite, in fact- we should legislate and regulate them so that the situation is determined to be under control, but we should encourage them to come and support us in our hour of need."
SAF_Adjust_Zoning_Regulations:0 "Adjust Zoning Regulations"
SAF_Adjust_Zoning_Regulations_desc:0 "In order to build the barracks, bases, and sites required for the war, we must change how our country is districted and zoned. With a series of reforms to this sector, we will ensure that we can fight most effectively with proper support from the home front."
SAF_Protect_The_Forests:0 "Protect The Forests"
SAF_Protect_The_Forests_desc:0 "Even if we are at war, we cannot ignore the agricultural needs of our nation. We will pass legislation to ensure that several high-risk and high-priority forests in our nation are protected, so that future generations may enjoy them."
SAF_Ensure_Wartime_Solvency:0 "Ensure Wartime Solvency"
SAF_Ensure_Wartime_Solvency_desc:0 "With all of the legislation passed, we have but a few more bills to secure- measures that will ensure our nation is able to operate at peak efficiency and not fall victim to the struggles and crises that come when we do not preempt them in a time of conflict."

#1943 United Party
SAF_United_1943_Start:0 "1943 United Party Victory"
SAF_United_1943_Start_desc:0 "As we have in those elections prior, the United Party- despite challenges from a resurgent National Party- has managed to secure yet another victory in the national elections, winning a majority of seats. Now, though, we are not merely in a regular government- we have the global crises to worry about, and our governance should reflect that."
SAF_Compensate_Our_Veterans:0 "Compensate Our Veterans"
SAF_Compensate_Our_Veterans_desc:0 "Through the long fighting and the various conflicts we've been a party to, we've amassed a number of veterans- and it's time we give back to them, with pensions and services so that their service will be constantly respected and they won't have to struggle again."
SAF_Address_Wartime_Industry:0 "Address Wartime Industry"
SAF_Address_Wartime_Industry_desc:0 "The war has caused a massive shift in our industrial sector, and as a result we've had to rearrange a number of things. We should look at addressing these changes further, to ensure that production can be at peak efficiency without sacrificing our greater plan and strategy for the nation."
SAF_Begin_State_Land_Management:0 "Begin State Land Management"
SAF_Begin_State_Land_Management_desc:0 "A number of areas are not being put to proper use- and with the war on, it's best if the state handles their management until we can effectively turn them over to private interests in peacetime."
SAF_Crack_Down_Profiteers:0 "Crack Down on Profiteers"
SAF_Crack_Down_Profiteers_desc:0 "When war began, a number of war profiteers began to crop up and take advantage of the conflict. We will need to destroy the rings of these people, prosecuting them to the most severe extent possible- and make it clear that war profiteering will not be tolerated in our South Africa."
SAF_Expand_Rail_Systems:0 "Expand Rail Systems"
SAF_Expand_Rail_Systems_desc:0 "Our railroads have seen expansion in previous- but now, with the war on, they're more vital than ever. We've resolved to undergo a policy of nationalization and consolidation, expanding railways in this country while bringing them under our control for the duration of the conflict to ensure that war-necessary materials can make it to their targets on time."
SAF_Improve_Extraction_Operations:0 "Improve Our Fisheries"
SAF_Improve_Extraction_Operations_desc:0 "Fishing is a large industry on our coastlines- and it's one of our most important, with the war on. Fisheries are needed to supply food to the civilian and military populations, and as such we will subsidize them and encourage their growth to support our people."
SAF_Reform_Law_Structures:0 "Reform Law Structures"
SAF_Reform_Law_Structures_desc:0 "Once more, reform of the legal system is required- this time, to handle the variety of issues that have begun to crop up due to the stresses of war. We will embark on a crusade to fix these, bringing the judicial system more in line with our goals and values."
SAF_Expand_University_Systems:0 "Expand University Systems"
SAF_Expand_University_Systems_desc:0 "One thing that has been lacking severely as of late is our ability to have learned people in government- most people go to a handful of domestic university, or more likely, foreign universities such as those in the United Kingdom. To rectify this and improve our educated population, we will subsidize the education sector, allowing us greater opportunities when it comes to learning and research."
SAF_Adjust_Financial_Sector:0 "Adjust the Financial Sector"
SAF_Adjust_Financial_Sector_desc:0 "The financial sector once more requires change, this time more efforts of further nationalization and investment to ensure that the people have all that they need- shortages could be incredibly dangerous in this period of wartime. Industry will serve South Africa, and it will prosper."
SAF_Subsidize_Medical_Sector:0 "Subsidize the Medical Sector"
SAF_Subsidize_Medical_Sector_desc:0 "With the rapid increase of wartime injuries, we have seen significant issues with our healthcare system- something that must be fixed immediately. We will subsidize the medical sector, so that when growth is necessary, it will happen and be undergone with great zeal."
SAF_Regulate_Air_Travel:0 "Regulate Air Travel"
SAF_Regulate_Air_Traval_desc:0 "The aviation sector has been rather small until as of late, but regulations on it would never hurt- it is the future of travel, after all. And getting ahead of that future will save us headaches in future."
SAF_Modernize_Agricultural_Practices:0 "Modernize Agricultural Practices"
SAF_Modernize_Agricultural_Practices_desc:0 "Our agriculture for a long period of time has been rather rustic, with minimal industrialization- but the outputs we could gain with more industry would greatly outweigh the costs it would take to improve said industry. Mechanization is the future, whether the conservative populations like it or not."
SAF_Reform_The_Electorate:0 "Reform the Electorate"
SAF_Reform_The_Electorate_desc:0 "The South African electorate has always been a murky subject- and with ill-defined boundaries. Passing legislation to better define who can vote and where they can vote, while potentially causing issues down the line, will greatly help in streamlining the process of governance."
SAF_Reaffirm_Existing_State:0 "Reaffirm Our Existing State"
SAF_Reaffirm_Existing_State_desc:0 "Instead of reforming and changing the way the electorate is managed, we should maintain the status quo- there is no reason to change these policies. We should instead reaffirm existing policies, codifying those further instead of provincial differences."
SAF_Expand_Indian_Affairs:0 "Expand Indian Affairs"
SAF_Expand_Indian_Affairs_desc:0 "There is a large population of immigrants from the British Raj- but their management is poor, at best. Instead of this horrid system of ad hoc legislation, we should pass national legislation regulating this sector of the population, so that the questions relating to them can be handled on a national level."
SAF_Adjust_Native_Land_Laws:0 "Adjust Native Land Laws"
SAF_Adjust_Native_Land_Laws_desc:0 "The laws governing native land ownership are complicated and confusing- and often times lead to conflicts in the courts of law. We should revise these to define what lands the native population is permitted to own, and the process for managing said land."
SAF_Sponsor_Fagan_Commission:0 "Sponsor the Fagan Commission"
SAF_Sponsor_Fagan_Commission_desc:0 "The Fagan Commission is the brainchild of our government's top officials- to evaluate the native population and its relation to our current white administration and ruling minority. Its prediction for what should be done is one that should be certainly listened to, though what that prediction will be cannot be known now..."
SAF_Restrict_Native_Movement:0 "Restrict Native Movement"
SAF_Restrict_Native_Movement_desc:0 "The native population will not be negotiated over. Their existence in this country is one that needs to be managed, and controlled, not debated. We will tighten the restrictions on their movement, so that we can better manage and control where they reside."

