#Volksraad
 SAF_Volksraad:0 "The Volksraad"
 SAF_Volksraad_desc:0 "The Volksraad is the Lower House and main Legislative Body of [This.GetNameDef]. The Volksraad, or House of Assembly as it is known in English, can trace its origins to the bicameral Parliament of the Cape of Good Hope- founded on Cape independence in 1853, on the basis of Cape Qualified Franchise, which allowed all males to vote regardless of race. When the Union was founded, the Parliament came into effect on a model resembling the United Kingdom, with two houses- a Senate, and a House of Assembly, both of whom reside in Pretoria.\n\n§YTotal Coalition Seats:§! §C[?This.SAF_coalition_seats]§!\n\n[This.SAFComSeatLoc][This.SAFRevSocSeatLoc][This.SAFDemSocSeatLoc][This.SAFSocDemSeatLoc][This.SAFSocLibSeatLoc][This.SAFMarLibSeatLoc][This.SAFLibConSeatLoc][This.SAFSocConSeatLoc][This.SAFAutSeatLoc][This.SAFAutDesSeatLoc][This.SAFFarAutSeatLoc][This.SAFFasSeatLoc]\n§YTotal Seats:§! §C[?This.SAF_total_seats]§!\n§YSeats Needed:§! §C[?This.SAF_supseat]/[?This.SAF_seats_needed]§!\n\nWhite Laws are Neutral Legislation\nRed Laws are §RLabour-leaning Legislation§!\nYellow Laws are §YLiberal-leaning Legislation§!\nBlue Laws are §CModerate-leaning Legislation§!\nOrange Laws are §OModerate National-leaning Legislation§!\nGrey Laws are §gFar Right National-leaning Legislation§!"
