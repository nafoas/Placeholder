 #WAR
 saf_war.1.t:0 "The War Has Begun"
 saf_war.1.d:0 "The unthinkable has occurred. A telegram has reached us from Britain, but it was unnecessary- those in their living rooms and public centers all heard the address over the radio. Britain, and presumably by extension us as well, has gone to war once more- not merely a small or local war, but a war that will come to rival the last Great War. A Second World War has begun. Mothers now worry of the fates of their sons, fathers review the ages of enlistment and the draft requirements, and politicians beg forgiveness to the Lord for what will come- because for another time in the lifetimes of many, the children of South Africa will be sent to foreign lands to fight for the Empire and their homes."
 saf_war.1.a:0 "We pledge our moral support for a common cause..."
 saf_war.2.t:0 "The State of Our Nation"
 saf_war.2.d:0 "Despite the acceptance of our people and the Volksraad for war, Minister Hertzog has made it clear- he will not support our current government in these state of affairs. Effective immediately the former National Party has split from our United Party, joining the opposition- while we will hold the majority for some time, it is now irrevocably clear that our government is one run by General Smuts and not one of a grand coalition."
 saf_war.2.a:0 "So be it."
 saf_war.3.t:0 "The South Africans Pledge Support"
 saf_war.3.d:0 "The South Africans, in accordance with defense policies, have formed and supported two divisions of various African groups under British command in Kenya. While it would be only natural to accept them into British command, some have suggested allowing these forces to be under South African command- a step to put the South Africans in a place of prominence in the region and potentially allowing them to command the majority of forces in Africa as a whole."
 saf_war.3.a:0 "These divisions will remain under British command."
 saf_war.3.b:0 "These divisions will go to the South Africans."
 saf_war.4.t:0 "The South Africans Offer Madagascar Guarantees"
 saf_war.4.d:0 "The South Africans have come forth to our government in Madagascar with a proposition- guaranteeing their safety should the situation in France itself ever become too dangerous. While we obviously eye this with suspicion, if our nation falls and the situation becomes unreliable, would it not be better to have that colony in the hands of the other Allies instead of with the enemy?"
 saf_war.4.a:0 "No, Madagascar will remain French alone."
 saf_war.4.b:0 "We are willing to agree to this."
 saf_war.5.t:0 "The French Have Declined"
 saf_war.5.d:0 "Despite our reasoned and logical arguments, the French- citing national sovereignty- have declined our generous offer of taking over the administration of Madagascar or ensuring its friendliness to the Allies in the event of France herself falling. If it comes to it, then, we may indeed have to fight for the islands, instead of a quick and clean solution to this problem..."
 saf_war.5.a:0 "This is worrying..."
 saf_war.6.t:0 "The French Have Agreed"
 saf_war.6.d:0 "Despite the protests of French politicians, we have come to an agreement as to the situation in Madagascar- we will ensure that if the French mainland falls to the enemy, Madagascar will be placed under a friendly administration instead of being allowed to fall to the enemy and potentially be used against us."
 saf_war.6.a:0 "Hip-Hip Hooray!"
 saf_war.7.t:0 "Seizure of Madagascar"
 saf_war.7.d:0 "Despite moderate resistance from the French garrison, the island of Madagascar is now under our definitive control. We must now decide its fate, if it is to go to a friendly French administration, or if it will remain under our ownership for the duration of this conflict..."
 saf_war.7.a:0 "We will grant it to the Free French."
 saf_war.7.b:0 "We will take the island for ourselves."
 saf_war.8.t:0 "The Coloured Question"
 saf_war.8.d:0 "Our coloured population is one of great debate in our country. Our need for manpower is publicly known, but our government is unlikely to support the measures that would alleviate it. However, the pressures of war also make some much more amenable to these sorts of policies. Regardless, a choice must be made, and whatever it is will have longstanding effects on the future of our nation..."
 saf_war.8.a:0 "Allow Coloured Reservists to join the Armed Forces in a limited extent."
 saf_war.8.b:0 "Allow coloured persons to join the Armed Forces in a limited extent."
 saf_war.8.c:0 "We will not allow any coloured persons to join the regular Armed Forces."
  
 
