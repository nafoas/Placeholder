tan_sov.7.t:0 "Planes arrive"
tan_sov.7.a:0 "Great!"
tan_sov.8.t:0 "Our request rejected"
tan_sov.8.a:0 "Oh well..."
tan_sov.9.t:0 "Tuva requests guns"
tan_sov.9.a:0 "We can spare a few"
tan_sov.9.b:0 "All are neccessary for our own use"
tan_sov.10.t:0 "Guns arrive"
tan_sov.10.a:0 "Great!"
tan_sov.11.t:0 "Our request rejected"
tan_sov.11.a:0 "Oh well..."
tan_sov.12.t:0 "Anti-Stalinist coup in Tuva"
tan_sov.12.a:0 "We should keep an eye on this"
tan_sov.13.t:0 "The USSR Celebrates our 15 years"
tan_sov.13.a:0 "Cheers to our Comrades!"

#Tuvan Army Events tuva_army#
tuva_army.1.t:0 "Military March in Kyzyl"
tuva_army.1.a:0 "Hurrah!"
tuva_army.2.t:0 "Weapons Production Program Finished"
tuva_army.2.a:0 "Very good!"
tuva_army.3.t:0 "Preparing for the inevitable"
tuva_army.3.a:0 "We will be ready!"
tuva_army.4.t:0 "Territorial Gatherings Held"
tuva_army.4.a:0 "Great!"
tuva_army.5.t:0 "Army Reform Plans Debate"
tuva_army.5.a:0 "We will accept Seren Kuzhuget's Plan"
tuva_army.5.b:0 "We will accept Gessen Shooma's Plan"
tuva_army.6.t:0 "Military Students sent to Moscow"
tuva_army.6.a:0 "Good luck to them!"
tuva_army.7.t:0 "Mass Conscription in Tuva"
tuva_army.7.a:0 "The Nation itself must be armed."
tuva_army.8.t:0 "Seren Kuzhuget falls ill"
tuva_army.8.a:0 "He has served us well, allow his wishes."
tuva_army.8.b:0 "The Army needs a man like him."

#Tuvan Ovyursky events #

tuva_ovyursky.1.t:0 "The Ovyursky Dispute"
tuva_ovyursky.1.d:0 "One matter of utmost importance to the Tuvan nation is that of its southern territory, comprising the majority of the Tes-Khem district. In 1932, Tuvan and Mongolian officials attempted to draw a border at the USSR's request, however no clear line was able to be agreed on. Currently, the 'Ovyursky' territory is claimed by both Tuva and Mongolia, while the neighboring territory bordering Lake Khovsgol is de-facto Terra Nullius. \n\nOvyursky contains many resources vital to the development of the Tuvan nation, besides over six-thousand of our people living there, it contains Mount Dus-Dag, a large mountain with potential salt reserves, and prospective gold-producing sites in the Southwest. Securing the disputed territory is of vital importance to us."
tuva_ovyursky.1.a:0 "Ovyursky must be ours."
tuva_ovyursky.2.t:0 "The Ovyursky Dispute"
tuva_ovyursky.2.a:0 "We must secure Ovyursky"
tuva_ovyursky.3.t:0 "Tuvans move into Ovyursky"
tuva_ovyursky.3.a:0 "We must counter this incursion!"
tuva_ovyursky.3.b:0 "Damn them! We will get them next time..."
tuva_ovyursky.4.t:0 "Mongolia Counters our Movements"
tuva_ovyursky.4.a:0 "We must defeat them."
