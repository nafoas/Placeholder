tuva_flavour.11.a:0 "Interesting"
tuva_flavour.12.t:0 "An old believer emerges"
tuva_flavour.12.a:0 "A shame, but he must die."
tuva_flavour.13.t:0 "The 15-Years Jubilee"
tuva_flavour.13.a:0 "To 1000 years more!"
tuva_flavour.14.t:0 "Khoshun Education Program Halted"
tuva_flavour.14.a:0 "We'd better find a solution for this..."
tuva_flavour.15.t:0 "Tuvan-Russian Dictionary Published"
tuva_flavour.15.a:0 "Wonderful!"
tuva_flavour.16.t:0 "Union Soyuzasbest Surveys the West"
tuva_flavour.16.a:0 "Only good can come from this"
tuva_flavour.17.t:0 "The Founding of Churmit-Dazhy"
tuva_flavour.17.a:0 "A Great town for a great man!"
tuva_flavour.18.t:0 "A Tragedy in Buryatia"
tuva_flavour.18.a:0 "The nation weeps for her"
tuva_flavour.19.t:0 "Churmit-Dazhy abandoned"
tuva_flavour.19.a:0 "We have other priorities now"
tuva_flavour.20.t:0 "Convention of Schools in Kyzyl"
tuva_flavour.20.a:0 "The Youth will lead us forward!"
tuva_flavour.21.t:0 "A Most Delightful Performance"
tuva_flavour.21.d:0 "The Citizens of Kyzyl gathered around today to a delightful performance. The previously-unknown Throat Singer from Ulug-Khem had been studying music on the outskirts of Kyzyl, with the help of a Khoomei master, and today sung to the entire city, including several Khural members. He has since been awarded a certificate of Merit and has been offered a place in the new State Theater, which he has yet to respond to. When the crowd asked for his name following his performance, the young man answered 'Dakpai Maxim Chalamovich,' before being greeted with a standing ovation"
tuva_flavour.21.a:0 "Dakpai Maxim Chalamovich... It has a nice ring to it."
tuva_flavour.22.t:0 "Oh, My Miserable Life"
tuva_flavour.22.a:0 "A great play!"
tuva_flavour.23.t:0 "Tyvadomak"
tuva_flavour.23.a:0 "Great!"
tuva_flavour.24.t:0 "Singing Maadyr-ool Records in Kyzyl"
tuva_flavour.24.a:0 "First in Moscow, now, at home!"
tuva_flavour.25.t:0 "Kizhirool Athletic Competition"
tuva_flavour.25.a:0 "Wonderful"
tuva_flavour.26.t:0 "Churmit-Dazhy visits the West"
tuva_flavour.26.a:0 "Good for him."
