  # Tannu Ideas
 TAN_collectivization_disaster:0 "The Collectivization Disaster"
 TAN_collectivization_disaster_desc:0 "Collectivization in Tuva occured between 1929 and 1932, resulting in the forced movement of thousands of nomads and lamas to collectives. Although Toka officially ended the policy following his rise to power, the scars of collectivization still haunt the nation. It would take a great effort to heal them."
 TAN_collectivization_disaster_2:0 "The Collectivization Disaster"
 TAN_collectivization_disaster_3:0 "The Collectivization Disaster"

 
 TAN_the_influence_of_chulydum:0 "Adyg Tulush Chulydum"
 TAN_the_influence_of_chulydum_desc:0 "Chairman of the Presidium of the Little Khural, and Head of State of the Tuvan People's Republic, Adyg Tyulyush Chulydum, is a unique figure in Tuva. He is a national hero, having led the Arats to destroy both the Whites and the Chinese Imperialists, and he is a staunch supporter of Toka's new regime. Or at least, he was. Since his appointment as head of the Khural, Chulydum has gradually become less close to the remainder of our party. \n\nAlthough he has not acted significantly out of line, with his strong support and reputation as a national savior, he has significant potential to be a threat to our national stability."

 TAN_tere_kholsky_unrest_idea:0 "The Third Khemchik Rebellion"
 TAN_tere_kholsky_unrest_idea_desc:0 "Although we have decisively defeated the rebels in Khemchik itself, the remnants of the Khemchik Rebellion still persist. \n\nIn the East, we have made progress against the rebels in Kaa-Khem district, and the rebellion there appears to be close to destruction. In the south, we attacked Kungurtug in late 1932, winning a victory and scattering much of the remaining rebel forces, however, some rebels still persist in the rural areas around Kungurtug, and have somewhat regrouped during the winter. \n\nRegardless of how we approach the conflict, only one thing is certain- we must destroy the rebels if we are to secure our rule over the entire country."
 TAN_tere_kholsky_unrest_kungurtug_only_idea:0 "The Third Khemchik Rebellion"
 TAN_tere_kholsky_unrest_kungurtug_only_idea_desc:0 "We have defeated the rebel forces in the Kaa-Khem region, now only one pocket of resistance remains. We must launch an attack in Kungurtug as soon as possible, and crush the rebellion once and for all!"
 TAN_tere_kholsky_unrest_kha_khem_only_idea:0 "The Third Khemchik Rebellion"
 TAN_tere_kholsky_unrest_kha_khem_only_idea_desc:0 "We have defeated the rebel forces in the Kungurtug region, now only one pocket of resistance remains. We must launch an attack at the resistance holdouts in Kaa-Khem as soon as possible, and crush the rebellion once and for all!"

 TAN_irregular_army:0 "Outdated Army"
 TAN_irregular_army_desc:0 "Although we have made significant strides in recent years, the sad truth is that the TNRA is still an outdated mess. If the army is to ensure the prosperity of our great nation, we must ensure that it is modernized and better organized."


 
 TAN_mass_illiteracy:0 "Mass Illiteracy"
 TAN_mass_illiteracy_desc:0 "Despite our best efforts, much of Tuva remains the same as it has for millenia. Nomads still roam the countryside, and signs of industrialization and few outside Kyzyl itself. Consequently, much of our technoligical progression is reliant on Soviet advisors introducing and implementing new technologies."
 
