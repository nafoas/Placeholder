TAN_russian_tuvan_balancing_act:0 "Soviet Influence in Tuva"
TAN_russian_tuvan_balancing_act_desc:0 "Although we absorbed the Russian Self-Governing Labour Colony (PCTK), it is undeniable that the Soviet Union is still the highest authority in Tuva, and without it, the Tuvan state itself may cease to function. We must ensure the USSR's influence is balanced with our own national interest, or we may face a new crisis. \n\n§YSoviet Influence is at §R[?Root.TAN_soviet_influence]§!\n\nThe §GCurrent Effects§! of Soviet Influence are:\n[Root.TAN_stab_effects]§W"

