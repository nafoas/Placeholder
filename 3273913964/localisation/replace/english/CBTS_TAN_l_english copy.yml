TAN_gold_reserve:0 "Tuvan Gold Reserve"
TAN_gold_reserve_desc:0 "Tuva is a Land rich with various kinds of Minerals, including Gold. We should aim to develop our Gold industry, as the wealth we can obtain from the industry could be well-used to boost other sectors of our economy.\n\n§COur current §YGold Reserve§C is worth §Y[?Root.TAN_gold_amt] Million Rubles.§C\n\nOur current annual §YGold Production§C is §Y[?Root.TAN_gold_prod] Million Rubles.§W"
