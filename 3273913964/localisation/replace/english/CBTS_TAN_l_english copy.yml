 TAN_khural:0 "The Little Khural"
 TAN_khural_desc:0 "Founded in 1924, the Tuvan Little Khural serves as the primary parliament of the Tuvan People's Republic. Although the Great Khural, founded in 1921, still retains absolute parliamentary authority, the Little Khural serves as the state parliament in sessions between the Great Khurals, with both retaining the ability to reject the decisions of local governments. Since 1930, the Little Khural has also served as the Tuvan Government.\n\n§GThe current §YChairman of the Presidium of the Little Khural§G is §Y[Root.TAN_hos].§!\n\n[Root.TAN_khuralstatus]"
 
