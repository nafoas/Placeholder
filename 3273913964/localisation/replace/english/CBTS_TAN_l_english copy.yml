# Temporary for teasers

#Tuva description#
TAN_GATHERING_STORM_DESC:0 "The young Tuvan People's Republic has lived a troublesome 11 years, having weathered the horrors of the Russian Civil War, Chinese occupation, Mongolian invasion, and Lamaist counterrevolution. \n\nBut now, Tuva stands at a point unlike any before. Donduk Kuular's counterrevolutionary old order has been eliminated, the current Khemchik-led Rebellion appears to be on its final legs, and most importantly, with the visions of newly-appoined head of party Salchak Toka, the future of the Tuvan nation can finally be in the right direction- forward."

#Introduction Events tuva_intro#
tuva_intro.1.t:0 "Tuva in 1933"
tuva_intro.1.d:0 "Founded in 1921 with Soviet backing, it is undeniable that the young Tuvan People's Republic has had a turbulent life so far. \n\nFollowing the collapse of the Russian Empire, the Uryankhai Krai found itself occupied by the White Army, the Chinese, the Mongols, and the Bolsheviks, until in 1921, with assistance from Soviet forces in the region, it was transformed into the Tannu Tuva People's Republic. Following its formation, the Tuvan Khural elected Mongush Buyan-Badyrgy as its first chairman. \n\nIn rural areas, the first years of communist rule were unremarkable. Nomads and Lamas carried out their lifestyles as they had for centuries. However, urban areas witnessed rapid transformation, the by 1925, over 5000 delegates, from the major towns across the country, convened in the third congress of the Tuvan People's Revolutionary Party. Similarly, the government also created the Tuvan People's Revolutionary Army and begun the development of the first Tuvan newspaper. In 1925, Donduk Kuular was appointed as Chairman of the Council of Minsters. A Buddhist himself, Donduk immediately began a program of incorporating Buddhist culture into his new republic, appointing Buddhists to positions of power, supporting the rural Lama population, and even going so far as declaring Buddhism the official state revolution.\n\n In 1929, graduates returning from Soviet-based education in Moscow, led by Salchak Toka, orchestrated the Kutvan Coup. 'Anti-revolutionary' leaders were imprisoned, such as Mongush Buyan-Badyrgy and Donduk Kuular, while an interim government was established, led by Adyg-Tulush Khemchik-ool and Adyg Tyulyush Chulydum. The interim government was quickly forced to act, quashing a pro-Mongolian insurgency in late 1930. In March of 1932, following the sickness of head-of-party Irgit Shagdyrzhap, the interim government handed the role over to Toka, appointing him General Secretary of the TPRP. Although nominally only head of the Tuvan Communist party, Toka's power rose quickly in the republic. \n\nIn 1932, Toka ordered the execution of the imprisoned opposition. In response the central district of Dzun-Khemchik and the southeastern district of Erzin rose up in rebellion, aided by the Mongolian lamaists in Khovsgol. Although the central rebellion was destroyed by a swift movement by the TPRA, a small force of rebels still holds out in Kungurtug and Erzin. Following the rebellion, Toka consilidated his power further, curbing the power of the Russian self-governing Labour colony and ending the unpopular collectivization policies.\n\nIn 1933, the Tuvan Peoples Republic is still reeling from the strife of the last ten years, however, with Toka now unchallenged and de-facto dictator of the state, the path towards modernization appears brighter than ever."
tuva_intro.1.a:0 "For the Revolution!"
tuva_intro.3.t:0 "Preparing for Shagaa"
tuva_intro.3.a:0 "This Celebration will be grand..."
tuva_intro.4.t:0 "The Role of Religion"
tuva_intro.4.a:0 "It can't matter much"
tuva_intro.5.t:0 "Shagaa"
tuva_intro.5.a:0 "Hail the New Year!"

#Flavour Events tuva_flavour#
tuva_flavour.1.t:0 "Commanders return from Moscow"
tuva_flavour.1.a:0 "Welcome home!"
tuva_flavour.2.t:0 "A Wedding in Kyzyl"
tuva_flavour.2.a:0 "Congratulations to them"
tuva_flavour.3.t:0 "The Second Class Returns"
