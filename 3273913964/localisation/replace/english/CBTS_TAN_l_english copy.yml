#Politics Events tuva_politics#
tuva_politics.1.t:0 "Adyg Tyulyush Chulydum Dies"
tuva_politics.1.a:0 "The Fighter Passes..."
tuva_politics.2.t:0 "Churmit-Dazhy appointed chairman of the council"
tuva_politics.2.d:0 "With the expiration of Adyg Tulush Khemchik-ool's term, the post of Chairman of the Council of Ministers has passed to minister of foreign affairs Sat Churmit-Dazhy. Churmit-Dazhy, an ex-Lama, has begun to distance himself from the rest of the TPRP in recent years, and has gained a wide base of support among the arats. With his new post as head of government, his increased power could allow his personal ambitions to play out..."
tuva_politics.2.a:0 "Keep an eye on him"
tuva_politics.3.t:0 "Churmit-Dazhy reopens Lamaseries"
tuva_politics.3.a:0 "Something is rotten in the streets of Kyzyl..."
tuva_politics.4.t:0 "An offer from Mikhail Frinkovsky"
tuva_politics.4.a:0 "We can use them to find a plot!"
tuva_politics.4.b:0 "Their offer is appreciated, but not needed."
tuva_politics.5.t:0 "Churmit-Dazhy suspends rural re-education"
tuva_politics.5.a:0 "He can't do that!"
tuva_politics.6.t:0 "Khural Opposition forms"
tuva_politics.6.d:0 "Sat Churmit-Dazhy has shown his true face! In the Litttle Khural, he and several allies have put forward a motion to evict Comrade Toka from his position as General Secretary and demote him to the position of minister of culture, with allied appointments in high positions of the state government. Oyun Tanchai and Churmit-Dazhy's predeccessor Adyg Tulush Khemchik-ool have openly declared supported for the opposition plans, and influentials such as Seren Kuzhuget have also refused to denounce them. The measure may have failed to pass in the Khural, but Churmit-Dazhy has as of today, declared the opening of a crisis in the TPRP. "
tuva_politics.6.a:0 "They Can't do that!"
tuva_politics.7.t:0 "Oyun Tanchai's Dubious Dealings"
tuva_politics.7.a:0 "He cannot be trusted in that position"
tuva_politics.7.b:0 "It would not be a beneficial move"
tuva_politics.8.t:0 "Opposition protests Toka's nomination"
tuva_politics.8.a:0 "Well, they can't do anything about it"
tuva_politics.9.t:0 "Kara-Sal Pirinlei Arrested"
tuva_politics.9.a:0 "That will show them..."
tuva_politics.10.t:0 "Opposition-Trotskyist Plotting!"
tuva_politics.10.a:0 "We must move swiftly to crush this"
tuva_politics.11.t:0 "Arrests across Kyzyl"
tuva_politics.11.a:0 "This is the end of their road..."
tuva_politics.12.t:0 "Third Plenary Meeting of the Central Committee"
tuva_politics.12.a:0 "The Verdict?"
tuva_politics.13.t:0 "The Central Committee Makes its decision"
tuva_politics.13.a:0 "The trial will be set for next month"
tuva_politics.14.t:0 "The Open Court of the Small Khural"
tuva_politics.14.a:0 "Seren Kuzhuget shall confess"
tuva_politics.15.t:0 "Seren Kuzhuget confesses"
tuva_politics.15.a:0 "Well, at least one traitor shall survive then."
tuva_politics.16.t:0 "A Hail of Fire"
tuva_politics.16.a:0 "We have saved the nation"
tuva_politics.17.t:0 "Churmit-Dazhiite Coup"
tuva_politics.17.d:0 "With the ineffective action made by the government against the opposition, Sat Churmit-Dazhy has today presented an ultimatum to Toka. He has offered to keep Toka as the head of party, but has demanded the reversal of several of Toka's appointments, and the increase in prominence of several of his compatriots. He claims that a detachment of the Tuvan Army loyal to Seren Kuzhuget is waiting outside the Khural, at the ready to arrest Toka for treason. It seems that the best option left may be to concede..."
tuva_politics.17.a:0 "Damn them!"

tuva_politics.18.t:0 "The Khemchik-Chadan Tour"
tuva_politics.18.a:0 "He is certainly making himself popular"
tuva_politics.19.t:0 "Trotskyist Plot!"
tuva_politics.19.a:0 "Arrest the Minister!"
tuva_politics.20.t:0 "Sat Lopsan's End"
tuva_politics.20.a:0 "At least he is gone"
tuva_politics.21.t:0 "Seren Kuzhuget Arrested"
tuva_politics.21.a:0 "They will all fall"
tuva_politics.22.t:0 "The Plot of the Nine"
tuva_politics.22.a:0 "We must make our move- now!"
tuva_politics.23.t:0 "Churmit-Dazhy proposes Western Reorganization"
tuva_politics.23.a:0 "He cannot be allowed to do that!"
tuva_politics.24.t:0 "The Bankers' Plot"
tuva_politics.24.a:0 "Arrest the Traitors!"
tuva_politics.25.t:0 "The Plot of the Seven"
tuva_politics.25.a:0 "We must make our move- now!"
tuva_politics.26.t:0 "Seren Kuzhuget Marches on Kyzyl"
tuva_politics.26.d:0 "As Salchak Toka prepared his plot, something was obviously off. For once, it was not Sat Churmit-Dazhy and the Khural opposition. Both were oblivious to the events soon to unfold, and they would soon pay for it. \n\nThen, the attack came. Marching at night from Vostoka base, soldiers swarmed around his house. After briefly shouting arrest orders from military commander Seren Kuzhuget, they then broke down the door, and within a minute, a gun was pointed at Toka's head. He did not resist as the soldiers led him outside and past the Commisar-Commander, watching the attack unfold from the nearby road. Suddenly, Toka struggled and turned to face his captor \n\n'Do not destroy our nation.'"
tuva_politics.26.a:0 "...Comrade Toka, You have already destroyed my nation."
tuva_politics.27.t:0 "The Khemchik-Lama Plot"
tuva_politics.27.a:0 "Sat Churmit-Dazhy must be removed!"
tuva_politics.28.t:0 "Opposition Flees Kyzyl"
tuva_politics.28.a:0 "So? Find them!"
tuva_politics.29.t:0 "Gessen Shooma Marches on Kyzyl"
tuva_politics.29.a:0 "He has control over the state and the army..."
tuva_politics.30.t:0 "Gessen Shooma's Declaration"
tuva_politics.30.a:0 "Oh Dear..."
tuva_politics.31.t:0 "The Annexation of Tannu Tuva"
tuva_politics.31.a:0 "Well, if it's what they want."

#Stalinist Events tuva_stalinist_events#
tuva_stalinist_events.1.t:0 "The New Year's Address"
tuva_stalinist_events.1.d:0 "A New Year, a new cycle. \nBefore the preperations even began Shagaa of 1933 was going to be one very different than those that had come before it. But it was the time for renewal. The time to throw away the darkness of the past four years' collectivization, and put on a new look for the nation. \n\nAfter the traditional greeting ritual, Salchak Toka stepped up to the podium to deliver his yearly address- the first address since Irgit Shagdyrzhap scaled-down Shagaa ceremonies in his three years of rule. In a booming speech, Toka announced to the Tuvan people the end of the 'dark years,' and the start of a new path for the Tuvan nation. \n\nThe citizens danced, the party celebrated, the Lamas performed their own rituals, whatever. Shagaa was the time for renewal, not that for ending traditions."
tuva_stalinist_events.1.a:0 "To a bright future we march!"
tuva_stalinist_events.2.t:0 "Partition of Kaa-Khem"
tuva_stalinist_events.2.a:0 "This will help us control the Frontier!"
tuva_stalinist_events.3.t:0 "Tere-Kholsky incorporated"
tuva_stalinist_events.3.a:0 "This will assist our fight against the insurgents"
tuva_stalinist_events.4.t:0 "Roubles Re-issued"
tuva_stalinist_events.4.a:0 "Good!"
tuva_stalinist_events.5.t:0 "An offer from Bela Szekula"
tuva_stalinist_events.5.a:0 "Accept his proposal"
tuva_stalinist_events.5.b:0 "We will design our stamps ourselves!"
tuva_stalinist_events.6.t:0 "Szekula presents his designs"
tuva_stalinist_events.6.a:0 "They are wonderful!"
tuva_stalinist_events.7.t:0 "Soviet-Tuvan Treaty"
tuva_stalinist_events.7.a:0 "Good for both sides"
tuva_stalinist_events.8.t:0 "The Aksha introduced"
tuva_stalinist_events.8.a:0 "Very good"
tuva_stalinist_events.9.t:0 "Erzin Conspirators Executed"
tuva_stalinist_events.9.a:0 "We will finish them in Kungurtug!"
tuva_stalinist_events.10.t:0 "9th Convention of the Great Khural"
tuva_stalinist_events.10.a:0 "The Theater plan shall proceed!"
tuva_stalinist_events.11.t:0 "KUTV Agrees"
tuva_stalinist_events.11.a:0 "Good for us"
tuva_stalinist_events.12.t:0 "Third class of students departs"
tuva_stalinist_events.12.a:0 "We wish them well!"
tuva_stalinist_events.13.t:0 "Tuva requests mediation"
tuva_stalinist_events.13.a:0 "The request is reasonable enough"
tuva_stalinist_events.14.t:0 "Ovyursky handed to us!"
tuva_stalinist_events.14.a:0 "Great!"
tuva_stalinist_events.15.t:0 "The USSR hands Ovyursky to the Tuvans!"
tuva_stalinist_events.15.a:0 "This is an outrage!"
tuva_stalinist_events.16.t:0 "Mongolia breaks relations"
tuva_stalinist_events.16.a:0 "They are but sore losers"
tuva_stalinist_events.17.t:0 "Soviet scientists are unpopular in Tuva"
tuva_stalinist_events.17.a:0 "They sure are a rowdy bunch"
tuva_stalinist_events.18.t:0 "Nomads protest Rural Education programs"
tuva_stalinist_events.18.a:0 "They will learn in time..."
tuva_stalinist_events.19.t:0 "Tuvinian Truth Published"
tuva_stalinist_events.19.a:0 "A tool of the people!"
tuva_stalinist_events.20.t:0 "The TNRA Attacks Kungurtug"
tuva_stalinist_events.20.a:0 "The rebellion is on its last legs..."
tuva_stalinist_events.21.t:0 "Kaa-Khem rebels surrender"
tuva_stalinist_events.21.a:0 "That took too long..."
tuva_stalinist_events.22.t:0 "Kungurtug rebels surrender"
tuva_stalinist_events.22.a:0 "That took too long..."
tuva_stalinist_events.23.t:0 "The end of the Third Khemchik Rebellion"
tuva_stalinist_events.23.a:0 "Hopefully it will be the last..."
tuva_stalinist_events.24.t:0 "Oyun Tanchai and Sat Lopsan reorganize the State Bank"
tuva_stalinist_events.24.a:0 "Good."
tuva_stalinist_events.25.t:0 "Electoral rights restored"
tuva_stalinist_events.25.a:0 "Good for them, and good for us."
tuva_stalinist_events.26.t:0 "Oyun Polat's Dillemma"
tuva_stalinist_events.26.a:0 "Allow him to Study Abroad"
tuva_stalinist_events.26.b:0 "We need him here."
tuva_stalinist_events.27.t:0 "A Successor for Oyun Polat"
tuva_stalinist_events.27.a:0 "Saryg-Donggak Chymba"
tuva_stalinist_events.27.b:0 "Tovarishtai Nikolay Choldak-oolovich"
tuva_stalinist_events.28.t:0 "A First National Census"
tuva_stalinist_events.28.a:0 "Great!"
tuva_stalinist_events.29.t:0 "The Fate of Churmit-Dazhy"
tuva_stalinist_events.29.d:0 "With the discovery of Sat Churmit-Dazhy's treason, the question of the fate of the town of Churmit-Dazhy has been brought up. The asbestos factory-town has had its facilities almost completed, and its completion will be a big boost to our economy, however, the town's loyalty to Churmit-Dazhy has prompted many party members to abandon the town. After months of debate in the Khural, no conclusive decision has been determined, so it has fallen to Comrade Toka to decide the fate of the town."
tuva_stalinist_events.29.a:0 "Shut that Traitor-town Down"
tuva_stalinist_events.29.b:0 "Rename it. Ak-Dovurak sounds better anyways."
tuva_stalinist_events.30.t:0 "The Asbestos Iniative"
tuva_stalinist_events.30.a:0 "We must develop our Asbestos industry!"
tuva_stalinist_events.30.b:0 "It is not vital to our economic growth."
tuva_stalinist_events.31.t:0 "Old Believer Hunt Begins!"
tuva_stalinist_events.31.a:0 "Destroy those Parasites!"
tuva_stalinist_events.32.t:0 "Old Believer Hunt Fails"
tuva_stalinist_events.32.a:0 "Bah! Cover this up!"
tuva_stalinist_events.33.t:0 "War is upon us!"
tuva_stalinist_events.33.a:0 "Forward! To Victory!"

#Tuvan-Soviet Events tan_sov#
tan_sov.1.t:0 "Tuva proposes a road to Chadan"
tan_sov.1.a:0 "This will benefit both our nations"
