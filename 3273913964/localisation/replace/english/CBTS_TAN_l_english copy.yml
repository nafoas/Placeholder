TAN_tere_kholsky_crisis:0 "The Third Khemchik Rebellion"
TAN_tere_kholsky_crisis_desc:0 "In 1932, in response to our power-centralization policies, the Lamas launched the Third Khemchik Rebellion. The Khoshuns of Khemchik and Kaa-Khem and the town of Kungurtug rose into open rebellion. \nIn September of 1932, our army moved into Khemchik, crushing the rebels there while we launched similar attacks at the other rebel bases. However, despite our best efforts, holdouts still remain in both Kaa-Khem and Kungurtug. The Siberian winter has made a new action impossible for the time being, but we must act soon. If we are to finalize our control over all of Tuva, the remaining rebels must be eliminated. \n\n§YRebel Strength in §OKaa-Khem §Yis at §R[?Root.TAN_kha_khem_unrest]\n\n§YRebel Strength in§O Kungurtug §Yis at §R[?Root.TAN_tere_kholsky_unrest]§!"
TAN_defeat_kha_khem:0 "Restore Order in Kaa-Khem"
TAN_defeat_kungurtug:0 "Restore Order in Kungurtug"
TAN_kha_khem_decision:0 "Divide Kaa-Khem Khoshun"
TAN_terekholsky_decision:0 "Incorporate Kungurtug as Tere-Kholsky"
TAN_strike_at_kungurtug_decision:0 "Advance on Kungurtug"

# Ovyursky

TAN_dusdag_decisions:0 "The Ovyursky Dispute"
TAN_dusdag_decisions_desc:0 "The ownership of §YOvyursky§W, a thin region stretching between our land and that of §OMongolia§W, has been disputed since our independence in 1921. Although a joint border-commission awarded the territory to us in 1932, Mongolia has refused to ratify the agreement, and has pressed its claims to the region. As Ovyursky is rich in minerals vital to our economic growth, and home to six-thousand of our own people, our control over the region §Rmust be secured at all costs.§!\n\n[Root.TAN_dusdagstatus]§!"
TAN_dusdag_calm:0 "§WThe §YOvyursky Border Dispute §Wis currently §CCalm.§W While both sides claim the region, neither has taken significant action to enforce its border claim.§!"
TAN_dusdag_hot:0 "§WWith the §GTuvan Government §Wbeginning plans in Ovyursky, the §Rborder dispute §Whas been §RReignited.\n\n§GTuvan§W Influence in Ovyursky is at §R[?Root.TAN_ovyursky_influence].\n§OMongolian §Winfluence in Ovyursky is at §R[?Root.TAN_MON_ovyursky_influence]. \n\n§WWhen a side reaches §Y10 Influence, §Wthey will be able to §Rappeal to Moscow!§W"

