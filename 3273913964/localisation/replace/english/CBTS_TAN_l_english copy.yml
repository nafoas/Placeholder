tuva_flavour.27.a:0 "Theatre in Tuva is becoming a reality"
tuva_flavour.28.t:0 "Chymba made Medical Director"
tuva_flavour.28.a:0 "This Man Only Continues to Grow"
tuva_flavour.29.t:0 "From Rags to Revolution"
tuva_flavour.29.a:0 "A Champion of the People!"
tuva_flavour.30.t:0 "Pilots go to Orenburg"
tuva_flavour.30.a:0 "We wish them well!"
tuva_flavour.31.t:0 "Pilots return from Orenburg"
tuva_flavour.31.a:0 "Welcome Back!"
tuva_flavour.32.t:0 "Kidispey Choodu's Flying Boat"
tuva_flavour.32.a:0 "This will go down in history..."
tuva_flavour.33.t:0 "State Funeral for Adyg Tyulyush Chulydum"
tuva_flavour.33.a:0 "He will be remembered..."
tuva_flavour.34.t:0 "A New Student"
tuva_flavour.34.a:0 "Let's wait and see."
tuva_flavour.34.t:0 "The Imaginary Cuckold"
tuva_flavour.34.a:0 "A wonderful performance!"
tuva_flavour.36.t:0 "The Ceremony"
