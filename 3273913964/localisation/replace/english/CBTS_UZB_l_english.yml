 #decisions
 TKS_Constitution:0 "The Constitutional Congress"
 TKS_Constitution_desc:0 "Under the guidance of Usman Khojaev, the Constitutional Congress of Turkestan has brought men from all walks of life, and all corners of our budding Federation with the aim of creating a strong federal government, one which all can participate in. This agenda is not without its opponents however, the Emirs, landowners, and various other elites will most definitely object to reforms that threaten their power. As such, it will be difficult for Usman and his fellow Jadids to create a functional constitution without compromising on some aspects of their agenda.\n§RWhile a potentially weaker constitution is a hard pill to swallow, it will certainly go down easier with the knowledge that the likely alternative is total collapse...§!\nThe current strength level of the constitution is [?constitution_power|G0]\nOpposition to the constitutional reforms is [discontent_level_text]"
 TKS_discontent_level_0:0 "§CNegligible§!"
 TKS_discontent_level_1:0 "§GLow§!"
 TKS_discontent_level_2:0 "§YModerate§!"
 TKS_discontent_level_3:0 "§OWorrisome§!"
 TKS_discontent_level_4:0 "§RMassive§!"
 TKS_discontent_level_5:0 "§ROverwhelming!!!§!"
 TKS_placate_the_emirs:0 "Placate the Emirs"
 TKS_offer_concessions:0 "Offer Concessions to Elites"
 TKS_fed_civil_war:0 "§RImminent Reactionary Uprising!§!"
 TKS_Alims_Gambit:0 "Alim's Gamble"
 TKS_Alims_Gambit_desc:0 "Mohammed Alim Khan has decided to put the future of Turkestan on the line in a bid for absolute power. To succeed he must address the various groups, factions, and organizations within our new nation. Violence, bribery, and other means of coercion are all tools Alim must wield if he is to succeed in his quest to become the undisputed ruler of Turkestan. However, attempting to recklessly centralize power around Alim will most certainly destabilize the nation. If the situation is allowed to spiral out of control, Alim’s ambitions, along with the country, are doomed.\n§YCentralization is scaled from 0 to 100. Centralization can be increased via focuses, decisions, and events. If 100 Centralization is reached and the Solidify Control decision is taken, then the mechanic will be disabled and a new focus tree will load. Instability, on the other hand, represents the combined discontent, and breakdown of control in Turkestan. Instability will constantly increase, and can also be increased or decreased with focuses, decisions, and events.§!§R Be warned, if Instability reaches 100, then Turkestan will collapse!§!\nThe Centralization level is currently [?centralization_power|G0]\nThe Instability level is currently [?anger_level|R0]"
