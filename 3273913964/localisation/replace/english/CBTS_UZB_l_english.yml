 uzb_civil_war.1.t:0 "Return of the Khan"
 uzb_civil_war.1.d:0 "After a 20-year exile, Mohammed Alim Khan has been given the reigns of the Basmachi Movement. Though the old movement had support from Reformers and Leftists, the new movement is dominated by Traditionalist Monarchists, and it is certain that they will build the state accordingly. However, in order to secure Central Asia, we will need to fight our way up to Northern Kazakhstan against the Soviets, or whatever other threat comes our way..."
