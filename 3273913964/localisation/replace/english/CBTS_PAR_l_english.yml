 #Events
 PAR_president_ayala.2.t:0 "Government Budget Reform"
 PAR_president_ayala.2.d:0 "President Ayala has ordered the reformation of the government budget for the foreseeble future. We have two options; either we balance the budget, and  this will help us get out of the current recession, or we prioritize funding for the military to help us win the war in the Chaco."
 PAR_president_ayala.2.optionA:0 "Balance the Budget"
 PAR_president_ayala.2.optionB:0 "Priorotize the Military"
 PAR_february_revolt.1.t:0 "Colonel Franco Arrested"
 PAR_february_revolt.1.d:0 "For plotting against the government, and for possible left-wing sympathies, Colonel Rafael Franco has been arrested. In recent weeks, he has started a  campaign against General Estigarribia, accusing him of failures during the Chaco War. Now that Franco has been arrested andexiled to Buenos Aires, we hope to crush enemies of  President Ayala."
 PAR_february_revolt.1.optionA:0 "This will anger many opponents of the Liberal Party"
 PAR_february_revolt.2.t:0 "President Ayala seeks to extend his term"
 PAR_february_revolt.2.d:0 "Now that the opposition is purged, Ayala and his friend General Estigarriba will seek to extend the presidential term"
 PAR_february_revolt.2.optionA:0 "This isn't the Soviet Union!"
 PAR_february_revolt.3.t:0 "Veterans and Peasents outraged"
 PAR_february_revolt.3.d:0 "Due to the economic recession that Paraguay is in, and no apparant help from the ruling Liberal Party, Peasents demanding land reform and Veterans  demanding an increase to their pensions are outraged by President Ayala."
 PAR_february_revolt.3.optionA:0 "President Ayala has no choice but to dismiss many soldiers... without pensions."
 PAR_february_revolt.4.t:0 "February Revolution"
 PAR_february_revolt.4.d:0 "Troops led by lieutenant colonels Federico Wenman Smith and Camildo Recalde occupied Asuncion. Police headquarters were attacked with a loss of about 50  lives. Battles in the city lasted the whole day and in the evening President Ayala surrendered to Recalde. General Estigarribia flew to Asuncion from his headquarters in the Chaco..."
 PAR_february_revolt.4.optionA:0 "...but was arrested in the airport"
 PAR_february_revolt.4.optionB:0 "...and managed to convice the revolting soldiers to release President Ayala"
 PAR_february_revolt.5.t:0 "Colonel Franco returns"
 PAR_february_revolt.5.d:0 "The capital has been succesfully captured by revolutionary forces loyal to Rafael Franco. The exiled Colonel has retourned and has been inaugurated as  the 33rd President of Paraguay. Franco's supporters came from those who hated the rule of Liberal politicians and the large landowners – war veterans, students and peasants,  uniting all kinds of political persuasions, from socialism to nationalism. Franco insisted that his revolution is one of national solidarity aimed at increasing the well-being of  regular people."
 PAR_february_revolt.5.optionA:0 "Viva la Revolución!"
 PAR_economic_fail.1.t:0 "Total Economic Collapse!"
 PAR_economic_fail.1.d:0 "'Nice one Idiot! You've doomed us all!'"
 PAR_economic_fail.1.optionA:0 "Dire times are ahead of us..."
 PAR_economic_succes.1.t:0 "Foreign Investements in Paraguay"
 PAR_economic_succes.1.d:0 ""
 PAR_economic_succes.1.optionA:0 "I sure hope the war will be over soon!"
 PAR_economic_succes.2.t:0 "Liberal Party Economic Policy"
 PAR_economic_succes.2.d:0 ""
 PAR_economic_succes.2.optionA:0 "A bit of Liberty... A bit of Equality... no Solidarity"
 PAR_event_standard_oil.1.t:0 "War of the Standard Oil"
 PAR_event_standard_oil.1.d:0 "It is said that the Chaco is full of oil. Though we do not know this, the American oil giant 'standard oil' is betting heavily on this bieng true. We previously refused to sell them the rights to drill oil there, and this made them very angry. Now, Standard Oil is supporting Bolivia and donating to their army effort in an attempt to capture the region. It is now clear... Bolivia and the imperialist Standard Oil started the war, and we cannot afford to lose it."
 PAR_event_standard_oil.1.optionA:0 "Imperialists will always have an interest in the Chaco"
 PAR_event_standard_oil.2.t:0 "Huey Long supports us!"
 PAR_event_standard_oil.2.d:0 "Senator Huey Long, a populist United States senator from Louisiana, has openly declared his support for Paraguay! He is a vehement opponenent to big  businesses... esspecially those who oppress workers. Now that we know that Standard Oil is supplying the Bolivian Army, he decided that an enemy of a friend of an enemy is his  friend."
 PAR_event_standard_oil.2.optionA:0 "Perhaps one day we'll rename 'Presidente Hayes' to 'Presidente Long'"
 PAR_event_standard_oil.3.t:0 "Work with the Dutch?"
 PAR_event_standard_oil.3.d:0 "We are basically at war with Standard Oil and their Bolivian puppets. The Royal Dutch Shell company has offered to support us in the war, in exchange for future 'favours'. It is obvious however, that the only reason they care for Paraguay's victory is for a chance of bieng awarded oil fields in the Chaco, how should we respond?"
 PAR_event_standard_oil.3.optionA:0 "We will never work with Imperialists!"
 PAR_event_standard_oil.3.optionB:0 "The ends justify the means"
