ARG_the_great_depression_desc:0 "The New York market crash in 1929 has devastated the Argentinean economy and even led to the 1930 coup by General Uriburu due to the inaction of the UCR to take action. The switching from a liberal economy to a neo-corporatist system didn't help the economy recover during the dictatorship and now that democracy has finally been relatively restored, there's still a long way to go before the ripples of the Great Depression stop influencing Argentina, and by extension, its politics..."
