 #events
 sia_internal.1.t:0 "The Boworadet Rebelion"
 sia_internal.1.d:0 "Ever since King Rama VII denounced former Minister of State Pridi Phanomyong for perceived Communistic activities, the government has been in a crisis, culminating in General Phraya Phahon Phon Phayuhasena’s coup d'etat. Now, Prince Boworadet and other key members of the Royal Family have risen up in opposition to the Khana Ratsadon’s authority. The rebellion proclaims that its armed struggle against the government intends to establish real democracy in the country and also accuses Pridi Phanomyong of harboring communist sympathies."
 sia_internal.1.a:0 "The future of our nation hangs on a thread"
 sia_wip_tt:0 "§GThis content is WIP§"
 sia_internal.2.t:0 "The rebelion ends"
 sia_internal.2.d:0 "The rebellion has been crushed and the Prince Boworadet has fled to the French Indochina. With his final defeat, hundreds of his remaining soldiers and supporters have now been imprisoned and await sentencing."
 sia_internal.2.a:0 "The Khana Ratsadon will continue to rule as the Constitution demands."
 sia_internal.3.t:0 "Rama VII abdicated"
 sia_internal.3.d:0 "Following the events of the Boworadet Rebellion, the King lost his popular support and the National Assembly has frequently grappled with and undermined his authority. Following a dispute over penal reform, which would take the authorization of execution outside of the Monarch’s hands, things have come to a head. The King sent an ultimatum, demanding the restructuring of the National Assembly, which would make it an entirely elected body."
 sia_internal.3.a:0 "The perfect puppet..."
 sia_internal.4.t:0 "A New Name for Our Nation"
 sia_internal.4.d:0 "As part of a campaign to instill national sentiment in our people, Prime Minister Plaek Phibunsongkhram has renamed Siam to Prathet Thai, referred to in English as Thailand. This will serve as another reflection of the unity of the Tai peoples and the strength of our nation."
 sia_internal.4.a:0 "Thailand is for the Thai!"
 sia_internal.5.t:0 "King Rama VIII Comes of Age"
 sia_internal.5.d:0 "As of the 25th of September, King Rama has now come of age and is ready to undertake the full weight of his royal duties."
 sia_internal.5.a:0 "Long Live King Rama VIII!"