 ### Focus Tree ###
 #Political Focuses
 #Early Political Path
 NOR_mistillitsvotumet_av_1933:0 "Mistillitsvotumet av 1933"
 NOR_mistillitsvotumet_av_1933_desc:0 "The sitting government, lead by Jens Hundseid, has recently lost more and more of their parliamental support as the Venstre leader Mowinckel has become bitter rivals with Hundseid. The Hundseid government is now facing the threat of a vote of no confidence which would force them out."
 #Early Mowinckel - Historical
 NOR_mowinckels_third_cabinet:0 "Mowinckel's 3rd Cabinet"
 NOR_mowinckels_third_cabinet_desc:0 "Johan Ludwig Mowinckel has not only shown himself capable of governing a country, but he is also determined to gain trade relations abroad, which will help us in these desperate times."
 NOR_a_new_economic_plan:0 "New Economic Commitment"
 NOR_a_new_economic_plan_desc:0 "We must get our economy back on track, and this must be done through a series of economic inititives. While, at the same time, we must limit the amount of loans we are taking up as we are not capable of further stressing our budget."
 NOR_restructure_spendings:0 "Restructure Spendings"
 NOR_restructure_spendings_desc:0 "Our economy has been dealt a good blow over the years, this has led to a great debt over time. To avoid our nation from drowning in debt we must restructure our spendings to be as little as possible, all unnecessary purchases must be kept away."
 NOR_stabilize_kronen:0 "Stabilize the Krone"
 NOR_stabilize_kronen_desc:0 "Although the gold standard has for long been abandoned, we must find other ways to stabilize our national currency, Kronen. If we do not do this, our national economy could splunge into high inflation at any moment."
 NOR_budget_cuts:0 "Budget Cuts"
 NOR_budget_cuts_desc:0 "To further help the strain on our economy, we must put down the maintenance where possible, and end all superfluous spendings."
 NOR_relations_abroad:0 "Relations Abroad"
 NOR_relations_abroad_desc:0 "In the 1930 Oslo Agreements, between the nordic and Benelux countries, we agreed to not raise the tariffs between us without agreeing and consulting the other nations. We must continue with friendly diplomacy if we want to get out of this economic depression."
 NOR_support_academics:0 "Support Academics"
 NOR_support_academics_desc:0 "With the economic crisis, many people has not been able to educate themselves as schools are either forced to close or cut down on the number of students. We must reinvest and ensure that the competence in the higher educational levels are kept intact."
 NOR_increased_exports:0 "Increase Exports"
 NOR_increased_exports_desc:0 "When the economic crisis hit the USA and Europe, many nations fell for the trap of increasing tariff on foreign products. This hit us as hard as it hit everyone else, but we have worked up trade agreements with multiple nations in Europe. Now there's a market for us products, in which we can sell them."
 NOR_give_nrk_monopoly_on_radio:0 "Give NRK monopoly on Radio"
 NOR_give_nrk_monopoly_on_radio_desc:0 "The newly founded national radio company of NRK has both the quality and the will to secure and promote norwegian interest inside and outside of Norway. We can give them the best platform available by giving them monopoly over radio."
 NOR_help_out_the_unemployed:0 "Help out the Unemployed"
 NOR_help_out_the_unemployed_desc:0 "The unemployment has risen to levels never seen before. We must start increased efforts to help out those who are less unfortunate than us by starting national funded projects to increase employment rates."
 NOR_continue_norwegian_neutrality:0 "Ensure Norwegian Neutrality"
 NOR_continue_norwegian_neutrality_desc:0 "To be sure not to provoke any nation, we need to be as neutral as possible in diplomatic relations and give our trust the League of Nations. By doing this we do not only take a step to improve our trade relations, but also to improve global peace."
 NOR_a_liberal_norway:0 "A Liberal Norway"
 NOR_a_liberal_norway_desc:0 "Venstre is the current ruling party and we should take effort to strenghten the party's position both in the Parliament and in the population."
 #Early Nygaardsvold - Ahistorical
 NOR_nygaardsvold_cabinet:0 "The Nygaardsvold Cabinet"
 NOR_nygaardsvold_cabinet_desc:0 "In the previous years Norway has been dominated by anti-socialist parties who's only goal has been to not let the socialists govern. However the socialist party of Arbeiderpartiet has shown themselves getting more and more support both in popularity and views. Nygaardsvold has shown himself to be a quite capable man - maybe it is time for him and Arbeiderpartiet to govern?"
 NOR_a_norwegian_3_year_plan:0 "A Norwegian 3-Year Plan"
 NOR_a_norwegian_3_year_plan_desc:0 "Several influentual norwegian socialist economics, such as Ole Colbjørnsen and Axel Sømme, has advocaded for a transition into a light form of a planned economy. The plan heavily relies on increased taxes and regulation of businesses, while technological advancements will improve efficiency and productivity."
 NOR_increase_business_taxes:0 "Increase Corporate Tax Rates"
 NOR_increase_business_taxes_desc:0 "Businesses that have profit during these difficult times should be harder taxed, which will grant the state more money which in turn can be used for stimulus or creating jobs."
 NOR_promote_technogical_innovativeness:0 "Promote Technological Innovation"
 NOR_promote_technogical_innovativeness_desc:0 "The 3-year plan heavily relies on continued technological improvements which will make the businesses more profitable, which in turn will help the norwegian economy into a mixed economy."
 NOR_lower_unemployment:0 "Lower Unemployment"
 NOR_lower_unemployment_desc:0 "The economical crisis put as much as 150 000 norwegians without jobs. We must find ways to get these people back into employment."
 NOR_public_works_focus:0 "Public Works"
 NOR_public_works_focus_desc:0 "We can begin publicly funded construction works to get people back into employment. There are several benefits to this, such as higher employment and improved infrastructe, however it has a high cost."
 NOR_a_moderate_kriseplan:0 "A Moderate Kriseplan"
 NOR_a_moderate_kriseplan_desc:0 "The moderate wing of the Arbeiderpartiet is campaigning for a moderate relief plan. This will be done through a \"Kriseplan\", a plan of crisis, where the state will take up loans and focus on stimulus to increase employment, aswell as aid businesses."
 NOR_aid_rural_farmers:0 "Aid Rural Farmers"
 NOR_aid_rural_farmers_desc:0 "There has been an economic crisis in the agricultural sector as grain prices has been inflated, unemployment has risen and the debt for farmers has increased. We must better aid farmers through deleting their debt."
 NOR_help_small_businesses:0 "Help Small Businesses"
 NOR_help_small_businesses_desc:0 "During the economic crisis, small businesses were often the first to go bankrupt or be seriously impacted by the crisis. As small businesses makes up for more than the majority of the nations employment, it is necessary to help small businesses back on their feet."
 NOR_a_mixed_economy:0 "A Mixed Economy"
 NOR_a_mixed_economy_desc:0 "Adopting several ideas and state monopolies which has its' roots in socialism, we are now creating an economy that is mixed between the private sector and the public sector."
 NOR_subsidize_the_nrk:0 "Subsidize NRK"
 NOR_subsidize_the_nrk_desc:0 "The Norwegian National Broadcast Company, shortened NRK, is inspired by the british BBC. We must subsidize NRK to ensure that all norwegians get proper radio coverage and news."
 NOR_improved_workers_conditions:0 "Improved Worker Conditions"
 NOR_improved_workers_conditions_desc:0 "It is always a goal to improve the conditions that workers face every day. We must put increased efforts on this matter, securing proper lunch breaks, holidays and workers rights' for the people!"
 NOR_support_pacifism:0 "Celebrate Pacifism"
 NOR_support_pacifism_desc:0 "The earlier Great War has showed us how detrimental a war could be. We must therefor celebrate our pacifism and neutrality, to ensure that we are a target or an player in a future war."
 NOR_a_social_democratic_norway:0 "A Social Democratic Norway"
 NOR_a_social_democratic_norway_desc:0 "By creating social democratic institutions such as a mixed economy and pacifism, we now are yet closer to a social democratic society than ever!"
 #Late Political Path
 NOR_kriseforliket:0 "Kriseforliket"
 NOR_kriseforliket_desc:0 "With the Support from Bondepartiet, the socialist party Arbeiderpartiet, led by Nygaardsvold, is able to gain the majority and thus form a government. Nygaardsvold has promised to improve to economic situation for both workers and farmers by following the keynesian economic theory, as well as using this opportunity to establish an operative welfare system."
 #Late Nygaardsvold - Historical
 NOR_the_nygaardsvold_government:0 "The Nygaardsvold Government"
 NOR_the_nygaardsvold_government_desc:0 "Nygaardsvold has been leading the socialist party DNA into moderation and the party is now seeking peaceful reforms through democratic means rather than through a brutal revolution. We can entrust him to be capable of ruling our nation in dire time like these."
 NOR_deal_with_the_economic_crisis:0 "Deal with the Economic Crisis"
 NOR_deal_with_the_economic_crisis_desc:0 "The economic crisis has for too long constrained our economy. We must begin to take action to improve our economic situation."
 NOR_keynesian_economics:0 "Keynesian Economics"
 NOR_keynesian_economics_desc:0 "The earlier economic recovery plans, while initially succesfull, ultimately failed it's goal of restoring the norwegian economy. The Arbeiderpartiet government is now pursuing a new line in economic thinking: Keynesian Economcs. Now instead of reducing our costs as our income is reduced, we instead take in more loans to accomodate economic growth and recession."
 NOR_introduce_1_sales_tax:0 "Introduce 1% Sales Tax"
 NOR_introduce_1_sales_tax_desc:0 "A more active and partaking state also needs ways to fund itself. We should introduce a 1% sales tax as it is one of the most fair taxes availble, as those who consume more also pays more, and those who consume less pay less."
 NOR_expand_the_budget:0 "Expand the Budget"
 NOR_expand_the_budget_desc:0 "From the Keynesian economic perspective, we must expand the budget and accept that we will have to take up loans to help the people in our nation."
 NOR_expand_local_production:0 "Expand Local Production"
 NOR_expand_local_production_desc:0 "Expanding local production makes us rely less on foreign import, as well as local manufacturers, producers and farmers have more to sell. We must also be cautious not to increase the production too much, as it would increase the inflation."
 NOR_create_new_jobs:0 "Public Works"
 NOR_create_new_jobs_desc:0 "Statefunded projects are costly, but will provide jobs for the people. We should initiate such projects to better the employment-situation in our country."
 NOR_economic_recovery:0 "Economic Recovery"
 NOR_economic_recovery_desc:0 "Our efforts to secure our nation's economy has proven succesfull. We should now focus on the time that is ahead of us."
 NOR_det_norske_arbeiderpartiet:0 "Det Norske Arbeiderpartiet"
 NOR_det_norske_arbeiderpartiet_desc:0 "Although Det Norske Arbeiderpartiet only has governed once before in it's history, it still has had an immense change on norwegian politics. Under Arbeiderpartiet, the norwegian socialist movement has gathered wide political support as well as getting through varies reforms and changes for the betterment of the norwegian society."
 NOR_social_reforms:0 "Social Reforms"
 NOR_social_reforms_desc:0 "During the previous times of need and despair we've have experienced that social reforms are necessary for the people to survive. It's become obvious that the people are dependant on a strong and reliable state that can take care of it's citizens. We therefor need to introduce additional social reforms to our country."
 NOR_employments_programs:0 "Employment Programs"
 NOR_employments_programs_desc:0 "Every man, woman and child has a right and a duty to work, except maybe the children as child labour is illegal. As the unemployment is at higher rates now than ever we must begin an even greater effort to employ more of the population."
 NOR_unemployed_benefits:0 "Unemployment Benefits"
 NOR_unemployed_benefits_desc:0 "Unemployed people rarely have the money and the possibility to live a healthy and happy life. We must ensure that large swaths of our populaton isn't left to their own fate. We must give benefits to those left without money or opportunity."
 NOR_age_pension:0 "Age Pension"
 NOR_age_pension_desc:0 "Elderly people who have spent must of their lives helping our nation when working are now left to themselves as they have little money for themselves. We must ensure that those who built up this country is also alive to see it flourish."
 NOR_the_norwegian_welfare_state:0 "The Norwegian Welfare State"
 NOR_the_norwegian_welfare_state_desc:0 "With important welfare options, such as proper healthcare, limited working hours, age pension and unemployment benefits we can now establish the norwegian welfare state. This state will be built around the principle that every man, woman and child has an opportunity to succeed in their lives. The state must ensure that everyone is taken care of."
 NOR_police_reform:0 "Police Reform"
 NOR_police_reform_desc:0 "The police has become too distant to the common norwegian. We must reform the police to not only give them local presence but also competence when dealing with dangerous criminality."
 NOR_neutral_foreign_policy:0 "Neutral Foreign Policy"
 NOR_neutral_foreign_policy_desc:0 "Norway as a nation is too little and too weak to make a difference on the world stage. We should not meddle in international affair that we don't belong in, as it would create problems for us. We must ensure our neutrality and stay as neutral as possible."
 NOR_a_policy_of_no_aggression:0 "Non-Agression Policy"
 NOR_a_policy_of_no_aggression_desc:0 "To not provoke any nations into attacking us, we must stay as neutral as possible. Even if it would mean that we would have to downsize our military."
 NOR_parliamental_support:0 "Secure Parliamentary Support"
 NOR_parliamental_support_desc:0 "Arbeiderpartiet is depedant on an other parties' support if they wish to control the government. Arbeiderpartiet must secure further support aswell as a wider political program if they still want to keep control of the government."
 NOR_the_bondepartiet_coalition:0 "Continue the Coalition with Bondepartiet"
 NOR_the_bondepartiet_coalition_desc:0 "Now we are leading with a majority cabinet in the Parliament thanks to the support from the Bondepartiet, of course the Bondepartiet has a few demands for us in this coalition."
 NOR_increase_tariffs:0 "Increase Grain Tariffs"
 NOR_increase_tariffs_desc:0 "Many farmers have a difficult time selling grain on the norwegian market seeing as foreign nations import grain and sell them at a cheaper price. We need to increase the tariffs to protect the farmer."
 NOR_debt_deletion:0 "Debt Deletion"
 NOR_debt_deletion_desc:0 "Many farmers had taken up loans because of the rapid mecahnization we had during the previous decades.When the economic crisis hit, the real amount of the debt rose over 4 times - which few could pay back. By deleting their debt, we can assure that the people who took up debt can manage themselves again."
 NOR_law_about_public_schools:0 "Public School Reform"
 NOR_law_about_public_schools_desc:0 "We must invest more into the schools if we want to expand the number of pupils and we would also have to increase the competence of the teachers. This will ensure that our nation will have greater competence and education than the rest of Europe and the world."
 NOR_the_language_issue:0 "The Language Issue"
 NOR_the_language_issue_desc:0 "The written language is split into Nynorsk and Bokmål. We must begin to finish the project to integrate them into one written language."
 NOR_the_venstre_coalition:0 "Settlement with Venstre"
 NOR_the_venstre_coalition_desc:0 "Our coalition with Bondepartiet, relied on middle-ground agreements, which Bondepartiet has been less eager for as time has gone by. Venstre on the other hand has shown themselves to be quite as progressive as Arbeiderpartiet, sometimes being more progressive than Arbeiderpartiet. We both have an interest in working together, and getting their support would be valuable."
 NOR_aid_bankrupt_businesses:0 "Aid Bankrupt Businesses"
 NOR_aid_bankrupt_businesses_desc:0 "Many businesses has gone bankrupt from the economic crisis. We must assure that the profitable businesses are reopened as they'll provide jobs and taxes."
 NOR_arbeidervernloven_av_1936:0 "Arbeidervernloven av 1936"
 NOR_arbeidervernloven_av_1936_desc:0 "Through reforms the labour movement in Norway has ensured that the working class has proper safety, payment and rest. However their rights could and should be further expanded through Arbeidervernloven, \"the law about worker protection\". In this law, 8-hour worksdays will be statutory, aswell as all workers will have a right for nine days of vacation in each year."
 NOR_by_og_land_hand_i_hand:0 "\"By og land, hand i hand\""
 NOR_by_og_land_hand_i_hand_desc:0 "\"City and Countryside, Hand in Hand\" was one of the slogans for Arbeiderpartiet during the 1933 election campaign. It is a powerful slogan that says that both city and countryside must joins each others side to improve the economic situation."
 NOR_progressive_ideals:0 "Progressive Ideals"
 NOR_progressive_ideals_desc:0 "In some nations radical support has increased and the public has gone into disorder. This has luckily not happened in Norway, much thanks to the progressive ideals pursued by Arbeiderpartiet as well as other political parties. This has stabilized the country in a time of confusion."
 #Industry Focuses
 NOR_industrial_focus:0 "Industrial Efforts"
 NOR_industrial_focus_desc:0 "In order to compete with other industrialized nations, we must find ways to innovate and to improve our production methods."
 NOR_northern_infrastructure:0 "Northern Infrastructure"
 NOR_northern_infrastructure_desc:0 "The northern parts of our country lacks proper transportation methods. We should put effort into expanding and improving our infrastructure."
 NOR_norsk_staal:0 "Norsk Stål"
 NOR_norsk_staal_desc:0 "We have had a long tradition of extraction ores and minerals both for own usage and export, and extracting more just means more resources at our disposal."
 NOR_establish_tandberg_radiofabrikk:0 "Tandbergs Radiofabrikk"
 NOR_establish_tandberg_radiofabrikk_desc:0 "Tandbergs Radiofabrikk, \"Tandberg's Radio Factory\", is a pioneer within the norwegian radio-market. The factory is developing radios that can be used for both civilian and military purposes."
 NOR_expand_the_railroad_network:0 "Expand the Railroad Network"
 NOR_expand_the_railroad_network_desc:0 "Our country consists of small villages and cities spread out across long distances. We should try to construct and expand the current railway system so that the long distances is faster to travel."
 NOR_norsk_hydro_focus:0 "Norsk Hydro"
 NOR_norsk_hydro_focus_desc:0 "Norsk Hydro is a norwegian industrial manufactorer who specializes in producing fertilisers aswell as being a key producer in the norwegian aluminium production."
 NOR_kongsberg_military_factory:0 "Kongsberg Military Factory"
 NOR_kongsberg_military_factory_desc:0 "Kongsberg Våpenfabrikk is a key producer of norwegian military armament and specializes in the production of small arms. We can grant the factory even bigger role in the upcoming years."
 NOR_expand_coastal_ports:0 "Expand Coastal Ports"
 NOR_expand_coastal_ports_desc:0 "Our country has historically been very dependant on our ports and the trade the ports has brought with them. Expanding our ports is a good step in improving our economy."
 NOR_hardangerbana:0 "Complete Hardangerbana"
 NOR_hardangerbana_desc:0 "Hardangerbana has been a railway under construction ever since 1921 and has been delayed multiple times. However, when completed it will be the first norwegian railway who's fully electric from the beginning, we just have to ensure it's completion."
 NOR_expand_norsk_hydro:0 "Expand Norsk Hydro"
 NOR_expand_norsk_hydro_desc:0 "Norsk Hydro's aluminium extraction has for years been a vital export for Norway. We should expand Norsk Hydro so they can extract even more resources."
 NOR_help_out_the_civilian_sector:0 "Aid the Private Sector"
 NOR_help_out_the_civilian_sector_desc:0 "The private sector in Norway has seen economic and social issues that has troubled it's development lately. We need to ensure that the private sector will recover sooner rather than later."
 NOR_foreign_investors:0 "Attract Foreign Investors"
 NOR_foreign_investors_desc:0 "Opening our country to foreign investors is a win-win scenario. They will get profit and we will get employment, work and resources from their investments."
 NOR_foreign_investors2:0 "Additional Foreign Investments"
 NOR_foreign_investors2_desc:0 "Although our nation is somewhat rich, we have far from the necessary capital to continously build up new businesses. We need to attract foreign investments, this way we can assure that we have more availble capital."
 NOR_build_up_the_iron_road:0 "Build up the Iron Transport"
 NOR_build_up_the_iron_road_desc:0 "The Iron Transport is referring to the swedish transport of iron ore to the Norwegian Port of Narvik. During the winter, when the sea of Bothnia freezes, the iron mines of Kurina can no longer transport it's ore through the baltic sea, and is more or less forced to ship their iron ore to Narvik if they want to sell it on the global market."
 NOR_expand_naval_production:0 "Expand Naval Production"
 NOR_expand_naval_production_desc:0 "Our coast is large to say the least, and it's beneficial for us to expand our naval presence in our territorial waters, both in terms of our defence, but also our economy."
 NOR_urban_infrastructure:0 "Urban Infrastructure"
 NOR_urban_infrastructure_desc:0 "We must invest the necessary funds into our major cities' infrastructure to ensure that they keep the standard of living and working high."
 NOR_universities_expansion:0 "University Expansion"
 NOR_universities_expansion_desc:0 "Over the previous century, there has been several universities and institutions established in Norway. The continuous progress these have given us has been helpful in our research."
 NOR_the_oslo_analyzer:0 "The Oslo Analyzer"
 NOR_the_oslo_analyzer_desc:0 "The Oslo Analyzer is a norwegian super-computer and is estimated to be the most powerful computer in the world."
 NOR_raufoss_ammunisjonsfabrikker:0 "Expand Raufoss Ammunisjonsfabrikker"
 NOR_raufoss_ammunisjonsfabrikker_desc:0 "Raufoss Ammunisjonsfabrikker is a state-owned producer of ammunition and is one of the main producers in Norway. It's operations is central for building up and maintaining the military, and hence we should look to expand the factory at Raufoss."
 NOR_resource_excavation_focus:0 "Resource Excavation"
 NOR_resource_excavation_focus_desc:0 "Raw resources, such as steel, coal, cobber and aluminium is extremely valuable to sell on the global market. With some increased efforts, we may increase the amount of resources in our country."
 NOR_factory_expansion:0 "Factory Expansion"
 NOR_factory_expansion_desc:0 "We should contruct new factories where people may work in. This will create more jobs aswell as improving our industrial and economic situation."
 NOR_expand_norwegian_aluminium_production:0 "Expand Norwegian Aluminium Production"
 NOR_expand_norwegian_aluminium_production_desc:0 "Aluminium is a light metal useable for producing planes. Norway is already extracting a substansial amount of aluminium from it's territories. However we may also expand the aluminium mines, ensuring more income."
 NOR_construction_research:0 "Increase Construction Spendings"
 NOR_construction_research_desc:0 "The construction sector is improving continously and is largely dependant on investments and technology enhancements. By beginning to use more standarized solutions whereever possible, as well as adapting cranes and constructing machines into our work would improve our construction methods."
 NOR_secure_unemployment:0 "Secure Unemployment"
 NOR_secure_unemployment_desc:0 "Our nation has suffered from high unemployment for years. Completing a series of investments we can hope that a more businesses will be open for unemployment."
 NOR_norwegian_arms_producers:0 "Norwegian Armament Manufacturers"
 NOR_norwegian_arms_producers_desc:0 "Both Kongsberg Våpenfabrikk and Raufoss Ammunisjonsfabrikker are central in maintaining the military. We should give both of the factories additional roles in the upcoming years."
 NOR_expand_norwegian_military_industry:0 "Expand Norwegian Military Industry"
 NOR_expand_norwegian_military_industry_desc:0 "As tensions rise in Europe, there becomes a greater need for military arms. However, we are not equipped with the military industry, and nations are less wanting to export arms. We must begin to expand our military industry."
 #Foreign Policy Branch
 NOR_foreign_policy:0 "Norwegian Foreign Policy"
 NOR_foreign_policy_desc:0 "Norway's foreign policy today is known to be neutral with the goal of good relations, what will the norwegian foreign policy in the future look like?"
 NOR_norway_at_war:0 "Norway at War"
 NOR_norway_at_war_desc:0 "The invetible has happened! Norway has been attacked by a foreign power. Now is not the time for confusion or endless debate; We must seek to mobilize aswell as quickly improve our defence and hunt away the attackers."
 NOR_send_out_an_order_of_mobilization:0 "Issue an Order of Mobilization"
 NOR_send_out_an_order_of_mobilization_desc:0 "We must mobilize in order to properly defend ourselves from invaders! We must therefore issue an order of mobilization to the general populace."
 NOR_end_of_the_neutrality_line:0 "End Norway's Neutrality"
 NOR_end_of_the_neutrality_line_desc:0 "We have been rapidly attacked with little to no help from others. It is time for us to seek an alliance with other nations instead of neutrality that we have pursued in the past."
 NOR_abandon_neutrality:0 "Abandon Neutrality"
 NOR_abandon_neutrality_desc:0 "Although we have never been in a war ever since the neutrality-doctrine was adopted, it is still unreliable to protect our nation from foreign threats. Under neutrality we stand alone; We should seek a defensive alliance with either Great Britain or Germany."
 NOR_british_ties:0 "British Ties"
 NOR_british_ties_desc:0 "Britain has been a supporter of us and our independence for the last decades. Aligning ourselves with Britain makes the most sense as we have economic interests that's similar. They also have the mightiest navy in the world, which would be a huge asset if we were to be attacked."
 NOR_german_ties:0 "German Ties"
 NOR_german_ties_desc:0 "Germany is the most influential and economic rich european nation. It would be wise, not only for investments, but also for increased trade, to align ourselves with Germany."
 NOR_increase_foreign_opinions:0 "Increase Economic Cooperation"
 NOR_increase_foreign_opinions_desc:0 "Seeking out to a major power for economic, military and diplomatic help would be beneficial for both us and them. They will get to expand their influence, and we will secure our interests abroad."
 NOR_keep_our_neutrality:0 "Continue with the Neutrality Path"
 NOR_keep_our_neutrality_desc:0 "History has taught us that when war breaks out, it is necessary to be neutral to not get ourselves destroyed by the conflict. We must from now on put emphasis on neutrality."
 NOR_nordic_relations:0 "Nordic Relations"
 NOR_nordic_relations_desc:0 "Although ancient rivals and enemies, we have had peace and prosperity with our fellow nordic brothers for the past 100 years."
 NOR_armed_neutrality:0 "Armed Neutrality"
 NOR_armed_neutrality_desc:0 "With new threats all over Europe, it is now necessary for us to transfer into an armed neutrality incase a war would break out."
 NOR_open_up_for_european_investments:0 "Secure European Investments"
 NOR_open_up_for_european_investments_desc:0 "We should open up businesses and corporations for european money. This will help us create new industries aswell as new jobs."
 NOR_neighbouring_threats:0 "Neighbouring Threats"
 NOR_neighbouring_threats_desc:0 "Once upon a time our neighbours and us lived peacefully in harmony. Sadly that time over, and the hard realistion that we have an enemy at our door is now a real matter. We must prepare ourself and our people for the possible invasion!"
 NOR_glomma_defense_line:0 "Glomma Defense Line"
 NOR_glomma_defense_line_desc:0 "When the swedish union over Norway ended in 1905, the norwegian government agreed to demilitarize all forts on the strategic river of Glomma in order to gain independence. Earlier Norway was prevented from building forts because of that agreement, however now we are in need of a defense in case we would be attacked."
 NOR_finnmark_landforsvar:0 "Finnmark Landforsvar"
 NOR_finnmark_landforsvar_desc:0 "The Finnmark countryside defense is a common head quarters for important organizations within the army. In case of an enemy invasion of Finnmark, this head quarters would be responsible of defending it."
 #Military Branch
 NOR_det_norske_forsvaret:0 "Det Norske Forsvaret"
 NOR_det_norske_forsvaret_desc:0 "Ever since the danish union over Norway was abolished in 1814, has Norway been dependant on protecting it's own territorial integrity for itself. It's largely consisted of defensive forces, where a main doctrine in norwegian military thinking is to stall the enemy to victory. However, for the past 30 years it has seen little change, and is thus heavily outdated compared to other european nations."
 #Air Force
 NOR_the_norwegian_air_force:0 "The Norwegian Air Force"
 NOR_the_norwegian_air_force_desc:0 "The Norwegian Airforce consist of a few planes and some traning-schools, and could be said to be behind standard of other european powers. It lacks proper structure as it is organized into two airforces, one for the navy and one for the army."
 NOR_haarens_flygevaapen:0 "Hærens Flygevåpen"
 NOR_haarens_flygevaapen_desc:0 "Hærens Flygevåpen is the airbranch of the army of forces. Its' headquarters lie in Kjeller, a little north of the capital Oslo, and there is where the majority of pilots are trained. Sadly it lacks both material, structure and manpower to challenge any other european air force."
 NOR_expand_kjeller:0 "Expand Kjeller"
 NOR_expand_kjeller_desc:0 "Kjeller is the main base of operations for Hærens Flygevåpen and where the planes are produced and pilots are trained. We should expand Kjeller if we want to expand Hærens Flygevåpen as it clearly needs an upgrade in operational capacity!"
 NOR_marinens_flygevaapen:0 "Marinens Flygevåpen"
 NOR_marinens_flygevaapen_desc:0 "Marinens Flygevåpen is the naval branch of the air force and is located in Horten just south of Oslo. It mainly operates with naval planes and fighters, concerning only about the naval theatre of the air force."
 NOR_expand_horten:0 "Expand Horten"
 NOR_expand_horten_desc:0 "Horten is where the naval part of the air force is training and operating from. We should seek to expand Horten if we want to improve our naval air support, as well as the air force in general."
 NOR_new_air_tactics:0 "New Air Tactics"
 NOR_new_air_tactics_desc:0 "Ever since aircrafts have been invented the tactics have changed both because of improved technology as well as experience. We should look to previous experience and do sizeable amount of training to apply these doctrines to our airforce."
 NOR_air_academy:0 "Pilot Training"
 NOR_air_academy_desc:0 "There are two key elements when improving an airforce; the first option is improving the planes itself, the second option is to improve the pilots who fly the planes. That's why we need to seek to improve pilot training if we want our airforce to be better."
 NOR_air_doctrine:0 "Air Doctrine Effort"
 NOR_air_doctrine_desc:0 "For us to construct a modern air force, it is necessary for us to have a proper experience with these flying machines. We should invest into air doctrines."
 NOR_build_alapmoen_airport:0 "Build Alapmoen Airport"
 NOR_build_alapmoen_airport_desc:0 "Although the southern parts of nation has somewhat good coverage from their airports, there's a substantial need for better air infrastructure up north. Constructing Alapmoen Airport will allow us to protect our northern regions if any enemies would appear there."
 NOR_rely_on_foreign_import:0 "Foreign Imports of Aircrafts"
 NOR_rely_on_foreign_import_desc:0 "Norway has a small and unexperienced airforce. The way we should update it is by importing aircrafts from other nations as it is cheaper short-term and ensures that the planes will be functioning. It is too expensive to design our own aircrafts."
 NOR_buy_naval_bombers_from_italy:0 "Italian Naval Bombers"
 NOR_buy_naval_bombers_from_italy_desc:0 "Foreign import of arms is the easiest way for us to modernize our air force. We should approach Italy with an offer to buy Naval Bombers!"
 NOR_buy_fighters_from_britain:0 "Fighters from Britain"
 NOR_buy_fighters_from_britain_desc:0 "Buying arms from nations with an already established and experienced air force is the best way for us to have a airforce capable of doing things. We should approach Britain to gain a sort of deal where we can buy any light fighters!"
 NOR_buy_bombers_from_germany:0 "German Bombers"
 NOR_buy_bombers_from_germany_desc:0 "Buying arms from nations with an already established and experienced air force is the best way for us to have a airforce capable of doing things. We should approach Germany to gain a sort of deal where we can buy bombers!"
 NOR_buy_fighters_from_usa:0 "American Planes"
 NOR_buy_fighters_from_usa_desc:0 "Buying arms from nations with an already established and experienced air force is the best way for us to have a airforce capable of doing things. We should approach America to gain a sort of deal where we can buy fighters!"
 NOR_build_up_our_own_airforce:0 "Expanded Aircraft Construction"
 NOR_build_up_our_own_airforce_desc:0 "Over the past years, it's been evidently clear that our airforce is in big need of an upgrade. We must build up our own airforce with our own aircraft models if we want to upgrade our airforce."
 NOR_engine_modules:0 "Engine Modules"
 NOR_engine_modules_desc:0 "It is a prerequisite for any flying vehicle to posess an engine, and developing air engines is a great start when we're building up our air force."
 NOR_focus_on_light_aircraft:0 "Focus on Light Aircraft"
 NOR_focus_on_light_aircraft_desc:0 "Light aircraft has several advantages. It needs fewer personell aswell as it is cheaper to produce and develop."
 NOR_focus_on_long_distance_aircraft:0 "Focus on Bombers"
 NOR_focus_on_long_distance_aircraft_desc:0 "We must be able to better defend our cities in case enemy troops would try to attack them. Although they are expensive, bombers fullfil this task and we should initiate new bomber designs."
 NOR_naval_bombers:0 "Naval Bombers"
 NOR_naval_bombers_desc:0 "If we want to be a presence at sea as we are in the air, we should start production of naval bombers. We are, after all, a nation with long coast and any help the navy can get, they will take."
 NOR_a_modern_airforce:0 "A Modern Airforce"
 NOR_a_modern_airforce_desc:0 "As the projects we've started to modernize and upgrade our airforce has been largely succesfull, it's time to formally recognize the modern air force that we've created!"
 NOR_force_merge_the_airforces:0 "Merge the Airforces"
 NOR_force_merge_the_airforces_desc:0 "Today the air force is split between Hærens Flygevåpen and Marinens Flyvåpen. This has proven inefficient as the air force would be better organized as one. There is struggle in both air forces not to be merged; hence we would need to forcefully merge them for the greater good of our air forces."
 NOR_retain_the_old_structure:0 "Retain the Airforce Structure"
 NOR_retain_the_old_structure_desc:0 "While having two independant air forces has proven to given us some military and political difficulties, it has also given each of the air branches competence and experience within their fields. We should not tamper with what is already working."
 NOR_create_luftforsvaret:0 "Create Luftforsvaret"
 NOR_create_luftforsvaret_desc:0 "The need for a combined airforce has already been demonstrated and work is already ongoing to combine to the to branches into \"Luftforsvaret\"."
 #Army
 NOR_haaren:0 "Den Norske Hær"
 NOR_haaren_desc:0 "\"Hæren\" is the main branch of the land forces of the Norwegian military. Although once top modern and ready for a fight, it's been in hibernation as the norwegian state has pursued an armed neutrality guard over a flexible and strong force."
 NOR_reform_generalstaben:0 "Forsvarsordningen av 1933"
 NOR_reform_generalstaben_desc:0 "We have appointed a commision to help us decide the future for our military and foreign policy, and what needs it would have."
 NOR_increase_military_expenses:0 "Increase the Military Budget"
 NOR_increase_military_expenses_desc:0 "After the great war, many nations in Europe, both to the west, south and east to us, have experienced high form of radicalization. It is evidently clear that a new war is rising on the horizon, it is no longer a question if, but when. The ball is in our court now - we have have to either increase the military budget, or risk sacrificing everything we love."
 NOR_neoytralitetsvern:0 "Nøytralitetsvern"
 NOR_neoytralitetsvern_desc:0 "To ensure the protection of the norwegian independence and democracy it is necessary for us that our army is capable of defending the nation if we were to be attacked - and to go on the offensive if the situation requires it."
 NOR_decrease_the_military_budget:0 "Keep the Military Budget at a Minimum"
 NOR_decrease_the_military_budget_desc:0 "Ever since the great war ended for more than 15 years ago, the world has gone quiet and conflicts will now be solved through diplomacy - the League of Nations - rather than through the battlefield. Enlightened times!"
 NOR_infantry_weapons:0 "Infantry Weapons"
 NOR_infantry_weapons_desc:0 "It is a necessarity for any modern army to have a infantry weapons but for the active personell but also for the reserve-force, we should ensure that our infantry is as good as possible."
 NOR_artillery_focus:0 "Artillery Focus"
 NOR_artillery_focus_desc:0 "The majority of an army consists usually of infantry. However without artillery-support that infantry will become target-practice for enemy artillery. We need to ensure that that does not happen."
 NOR_a_defensive_force:0 "A Defensive Force"
 NOR_a_defensive_force_desc:0 "Norway's politics and military tells us that we are in no position to attack any foreign power. We must therefor instead focus on the defence of our nation."
 NOR_modernize_coastal_forts:0 "Modernize Coastal Defenses"
 NOR_modernize_coastal_forts_desc:0 "Our country consists of a long and sparse coast with many ports. Although there are many good sides about this, it also leaves us more exposed if someone were to attack us. We should modernize the coastal forts to we are better prepared incase it happens."
 NOR_increased_conscription:0 "Increased Conscription"
 NOR_increased_conscription_desc:0 "Norway is a country with low population which means that we have less available manpower for our army. We should initiate increased conscription to ensure that our army has men in it."
 NOR_motorized_battalions:0 "Motorized Battalions"
 NOR_motorized_battalions_desc:0 "A new doctrine for modern theorists argument for the need of a mobile and swift force. We can upgrade our infantry with motorized units to be able to deploy them faster."
 NOR_recruit_officers:0 "Recruit Officers"
 NOR_recruit_officers_desc:0 "As we have been expanding and improving our army lately, there has also been a need for new officers. Luckily, the army expansion has found several new capable army humans who are ready to give everything and more for their fatherland!"
 NOR_modern_doctrines:0 "Modern Doctrines"
 NOR_modern_doctrines_desc:0 "The tactics of warfare are in constant change as new technologies are invented. We must therefor do a consideration of our tactics and adopt to the new modern doctrines."
 NOR_improve_the_artillery:0 "Improve the Artillery"
 NOR_improve_the_artillery_desc:0 "The artillery is a key piece in the defense of our beloved country. If we could improve the precision, damage and the quality of our artillery we could smash out any attackers on norwegian soil."
 NOR_conscription_efforts:0 "Expand Conscription"
 NOR_conscription_efforts_desc:0 "Norway is a country of low population. If we want to field an army of sizeable force, we would need to expand our conscription."
 NOR_forsvarets_overkommando:0 "Establish Forsvarets Overkommando"
 NOR_forsvarets_overkommando_desc:0 "The previous army chiefs of Generalstaben has shown themselves incapable of properly preparing our nation for an enemy attack. We must reorganize Generalstaben into a commando unit."
 NOR_heimevernet:0 "Heimevernet"
 NOR_heimevernet_desc:0 "We should establish Heimevernet, \"the home guard\", as a rapid mobilization force. It will allow us to mobilize faster aswell as be more prepared in case of a war!"
 NOR_prioritize_the_infantry:0 "Prioritize the Infantry"
 NOR_prioritize_the_infantry_desc:0 "The core of the army consists of Infantry. To make our army as capable as possible in defending our territory, we must prioritize the infantry units within."
 NOR_new_infantry_weapons:0 "New Infantry Weapons"
 NOR_new_infantry_weapons_desc:0 "Sadly our infantry and army has been downprioritized for too much too long now and we are heavily outmatched when it comes to infantry guns. We must take effort to upgrade our weapons to better standard."
 NOR_mountaineers:0 "Mountaineers"
 NOR_mountaineers_desc:0 "Our country consists of large mountains and big chains of mountain. It would be preferrable if we could recruit a group of mountaineers to protect us in these mountains."
 NOR_a_mobile_army:0 "A Mobile Army"
 NOR_a_mobile_army_desc:0 "Modern theorists debate that the usage of mobile forces could be of great importance. We should strive to initiate a motorized group in Norway."
 NOR_cavalry_forces:0 "Cavalry Forces"
 NOR_cavalry_forces_desc:0 "Cavalry is both mobile, cheap and effective, and is key in protecting our nation. We should recruit a new cavalry division."
 NOR_special_forces:0 "Special Forces"
 NOR_special_forces_desc:0 "Special forces specialize in fighting in rough terrain and under sinister conditions. We should launch a special forces program."
 NOR_increase_equipment_production:0 "Increase Equipment Production"
 NOR_increase_equipment_production_desc:0 "For us to produce the necessary material for our forces to be operating we would need to expand the equipment production. We could do this by improving our armaments industry.\n\n\"You need additional equipment!\"\n\"You need additional equipment!\"\n\"You need additional equipment!\"\n\"You need additional equipment!\""
 NOR_focus_on_infantry_support:0 "Focus on Infantry Support"
 NOR_focus_on_infantry_support_desc:0 "Rather than expanding our infantry, we should focus on expanding the support around the infantry. There is no way we would be able to field a large infantry army - and we should rather concentrate on improving and assisting what infantry we already got."
 NOR_support_brigades:0 "Support Brigades"
 NOR_support_brigades_desc:0 "Support companies prove themselves as vital to the infantry when battles are to be decided. We should be ensure that our support companies are up to date."
 NOR_support_weapons:0 "Support Weapons"
 NOR_support_weapons_desc:0 "We must ensure that our troops are properly prepared and equipped for battling. It is of great priority to keep our divisions well equipped."
 NOR_army_mechanization:0 "Army Mechanization"
 NOR_army_mechanization_desc:0 "Our army consists mainly of infantry, who by themselves are soft and easily exposed. We must take initiate to protect them from sharpnell and artillery fire by mechanization the infantry and the army."
 NOR_armoured_projects:0 "Armoured Projects"
 NOR_armoured_projects_desc:0 "The time has finally come for us to utilize the potential that our armed forces have - we should start armoured projects which would make it more difficult for the enemy to destroy us."
 NOR_anti_tank_warfare:0 "Anti-tank Warfare"
 NOR_anti_tank_warfare_desc:0 "Near the end of the Great War, tanks were being utilized to a higher degree than ever before. Next european war is bound to have armored tanks and we should be prepared to face them."
 NOR_panserbataljonen:0 "Panserbataljonen"
 NOR_panserbataljonen_desc:0 "Panserbataljonen would be an armoured unit of the norwegian forces. We must recruit this unit if we want our tank project to be realized."
 NOR_neoytralitetsvakt:0 "Nøytralitetsvakt"
 NOR_neoytralitetsvakt_desc:0 "We should reactivate the Nøytralitetsvak like we did in the first world war incase we would be attacked. A war is brewing on the horizon, and it may destroy us soon. As of now, it is calm before the storm..."
 #Naval
 NOR_sjoeforsvaret:0 "Sjøforsvaret"
 NOR_sjoeforsvaret_desc:0 "Sjøforsvaret, \"the sea defence\", is the maritime branch of the norwegian military. Although once modern, it largely consists now of obsolete ships, most notably the two once-modern panzerships HNoMS Eidsvold and HNoMS Norge."
 NOR_destroyer_modernization:0 "Destroyer Modernization"
 NOR_destroyer_modernization_desc:0 "Destroyers are fast, reliable and effective ships. Our destroyers has sadly been made obsolete by new models. We need to take effort and time to update and upgrade our destroyers"
 NOR_sleipner_class_destroyers:0 "Sleipner Class Destroyers"
 NOR_sleipner_class_destroyers_desc:0 "Sjøforsvaret is outmatched compared to other european nations when it comes to both material and active personell. The sitting government has proposed creating a new class of destroyers known as the Sleipner-Class. When completed these ships would go up to 600 tons."
 NOR_construct_new_destroyers:0 "Construct New Destroyers"
 NOR_construct_new_destroyers_desc:0 "As we've finished the development of the Sleipner-Class, it is now time to produce these modern ships. When completed, these destroyers will become vital in the defense of Norway."
 NOR_naval_ports:0 "Expand Naval Ports"
 NOR_naval_ports_desc:0 "For any navy it is important not only to be able to fight, but also have strategic bases for operation aswell as ports to repair themselves. We should expand our coastal ports to meet this need."
 NOR_norwegian_convoys:0 "Norwegian Convoys"
 NOR_norwegian_convoys_desc:0 "The trade at sea has always been the most important source of trade for Norway. The navy tradition is spread across the nation and there are many ships available for us."
 NOR_naval_admiralty:0 "Navy Admiralty"
 NOR_naval_admiralty_desc:0 "A lethal navy requires competent leadership. We should strive to recruit new and competent admirals to fill the ranks of good and needed expertise."
 NOR_naval_tactics:0 "Naval Tactics"
 NOR_naval_tactics_desc:0 "There will always be a tactical element in naval battles. We must ensure that we are the ones teaching tactics to our enemy, and not the other way around."
 NOR_naval_doctrine_1:0 "Naval Doctrine I"
 NOR_naval_doctrine_1_desc:0 "The way naval battles are fought, are in constant change in our times. We must take time to sit down and find out new doctrines aswell as take time to train the maneuvers into our fleet."
 NOR_naval_doctrine_2:0 "Naval Doctrine II"
 NOR_naval_doctrine_2_desc:0 "The way naval battles are fought, are in constant change in our times. We must take time to sit down and find out new doctrines aswell as take time to train the maneuvers into our fleet."
 NOR_naval_training:0 "Naval Training"
 NOR_naval_training_desc:0 "Increased pressure both from the admiralty and politicians have created a wish for increased naval training. We must train our navy to better comprehend a possible invasion of Norway."
 NOR_handelsflaaten:0 "Handelsflåten"
 NOR_handelsflaaten_desc:0 "\"Handelsflåten\" is the norwegian name for the norwegian merchant navy. It is one of the largest in the world, and the largest compared to the population."
 NOR_NORTRASHIP:0 "NORTRASHIP"
 NOR_NORTRASHIP_desc:0 "Our convoys are spread across ports around the world, and we must ensure both ours and theirs protection in these times of war. We could put them under external protection, however this maritime fleet is the only income we have - we should rather organize them under a common organizaion, Norwegian Trade and Shipping, and use them in the war effort."
 NOR_expand_the_fleet:0 "Expand the Fleet"
 NOR_expand_the_fleet_desc:0 "Although we've had big progress when it comes to modernizing parts of our fleet, there's still a vacuum needing to be filled as the Eidsvold-class panzerships are outdated and the navy is in dire need of reinforcements."
 NOR_big_ships:0 "Bigger Ships"
 NOR_big_ships_desc:0 "We should focus our naval strength around the use of cruiser and light-battleships to the best effect. With enough firepower we will dominate the seas and protect ourself against any intruder."
 NOR_cruiser_efforts:0 "Cruiser Efforts"
 NOR_cruiser_efforts_desc:0 "It is necessary for our navy to have ships that can maneuver yet provide big amounts of firepower. Cruisers provide this - although they may be weaker than a battleship they were well make up for it with there cheaper cost."
 NOR_small_ships:0 "Refit Destroyers"
 NOR_small_ships_desc:0 "Our navy is not strong enough, and never will be, to win against another naval power. We should therefor abandon the idea of protecting our nation with brute naval-firepower and instead focus on destroying their trade and supplies."
 NOR_torpedo_ships:0 "Torpedo Boats"
 NOR_torpedo_ships_desc:0 "Torpedo Boats are light and quick ships that carry torpedos to do a large amount of harm to the enemy fleet. These easily counter battleships, however they are weak without any support."
 NOR_anti_minelaying:0 "Anti-Minelaying"
 NOR_anti_minelaying_desc:0 "Our long and beautiful coast sadly is also a target of not only tourism, but also minelaying. If war between european nations start our coast is a prime area to put their mines. As it will hurt and limit us both militarily and civil we should put effort into anti-minelaying technology."
 NOR_anti_submarine_efforts:0 "Anti-Submarine Efforts"
 NOR_anti_submarine_efforts_desc:0 "From our experience during the Great War, we learned that submarines could absoluetely demolish both fleets and convoys. That's another reason to clean these underwater ships from the history books!"
 NOR_submarine_warfare:0 "Submarine Warfare"
 NOR_submarine_warfare_desc:0 "It's clear that we have no way to openly challange any other great nation's surface fleet. We should aspire to expand our submarine fleet and construct new and better submarine ships to spread havoc on the enemy ships."
 NOR_minelaying_warfare:0 "Minelaying Warfare"
 NOR_minelaying_warfare_desc:0 "Our enemies has been interested in minelaying our coasts for too long. Now we will get at it first and minelay our territory before anyone else can!"
 NOR_naval_modules:0 "Naval Modules"
 NOR_naval_modules_desc:0 "Our navy has been outdated for the couple of last decades. We would need to upgrade not only the ships itself, but also it's armaments and gear for our navy to even come close to being called modern."
 ### Decisions ###
 #Political Decisions
 NOR_established_the_ministry_of_provisioning:0 "Ministry of Provisioning"
 NOR_established_the_ministry_of_provisioning_desc:0 "Seeing the need of a ministry that reduces civilian waste, we can now have higher focus on the military."
 NOR_mobilize_the_economy:0 "Mobilize the Economy"
 NOR_mobilize_the_economy_desc:0 "We are at war, but our economy isn't ready for it. We have to mobilize our economy as fast as possible and get ready for an invasion!"
 NOR_increase_military_organization_decision:0 "Improve Military Organization"
 NOR_increase_military_organization_decision_desc:0 "Our military is currently disorganized! We need to mobilize our army and reorganize it properly until disaster is upon us!"
 #Foreign Policy Decisions
 NOR_money_from_ENG:0 "British Shipyard Construction"
 NOR_money_from_ENG_desc:0 "The Royal Navy is perhaps the most powerful navy that the earth will ever sea (pun intended). We should seek investments from british businesses."
 NOR_money_from_WGR:0 "German Industrial Production"
 NOR_money_from_WGR_desc:0 "The german industry is a mighty one and we should seek investments and aid from german companies willing to invest money into our nation."
 NOR_money_from_USA:0 "American Construction Vehicles"
 NOR_money_from_USA_desc:0 "USA has always been the best when it comes to construction machinery and vehicles. We should get more cooperations from USA to invest in our nation!"
 NOR_money_from_FRA:0 "French Capital"
 NOR_money_from_FRA_desc:0 "The french has an enormous ability to pay. We should get them to invest some of that money to our nation."
 NOR_seek_out_british_guarantee:0 "Request British Guarantee"
 NOR_seek_out_british_guarantee_desc:0 "We can ask the british for a guarantee over our independence and safety."
 NOR_british_investments:0 "British Investments"
 NOR_british_investments_desc:0 "We should open our country up for investments from Britian."
 NOR_british_research:0 "British Industrial Research"
 NOR_british_research_desc:0 "Britain is one of the nations with the best technology and solutions on our earth, we should adapt from them."
 NOR_improved_british_naval_production:0 "British Naval Production"
 NOR_improved_british_naval_production_desc:0 "Britain has one of the largest navies and of of the largest naval production in the world, surely we can learn a thing or two from them."
 NOR_join_the_allies:0 "Join the [ENG.GetFactionName]"
 NOR_join_the_allies_desc:0 "We should seek to join the [ENG.GetFactionName] as a way to be better protected, aswell as we can contribute ourself to the defence of democracy."
 NOR_seek_out_a_german_guarantee:0 "Request a German Guarantee"
 NOR_seek_out_a_german_guarantee_desc:0 "We should ask Germany to guarantee our independence, so we are more protected from other threats, including Germany."
 NOR_german_capital:0 "German Capital"
 NOR_german_capital_desc:0 "In an effort to better our economy, we can make it easier for german capital and money to transfer into Norway."
 NOR_german_engineering:0 "German Engineering"
 NOR_german_engineering_desc:0 "Precision German Engineering"
 NOR_german_industrial_production:0 "German Industrial Production"
 NOR_german_industrial_production_desc:0 "Germany is one of the most industrial nations in Europe, we can learn a thing or two from them."
 NOR_join_the_germans:0 "Join the [GER.GetFactionName]"
 NOR_join_the_germans_desc:0 "We should join the [GER.GetFactionName] as a way to get protection and aswell protect our interests."
 #Defence of Norway Decisions
 NOR_norwegian_battleplans:0 "The Defence of Norway"
 #Expand the Norwegian Railroad System
 NOR_expand_the_railnetwork:0 "Expand the Railroad Network"
 NOR_expand_the_railnetwork_desc:0 "Our country consists of small villages and cities spread out across long distances. We should try to construct and expand the current railway system so that the long distances is faster to travel."
 NOR_expand_railways_oestlandet:0 "Expand Railroads in Østlandet"
 NOR_expand_railways_vestlandet:0 "Expand Railroads in Vestlandet"
 NOR_expand_railways_soerlandet:0 "Expand Railroads in Agder"
 NOR_expand_railways_troendelag:0 "Expand Railroads in Trøndelag"
 NOR_expand_railways_nordland:0 "Expand Railroads in Nordland"
 NOR_expand_railways_finnmark:0 "Expand Railroads in Finnmark"
 
