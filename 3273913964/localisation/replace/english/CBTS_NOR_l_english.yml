 #Law Proposals
 NOR_focus_on_military_industry:0 "Promote Military Rearmament"
 NOR_focus_on_military_industry_desc:0 "It is necessary for our own protection that we begin to rearm. We must therefor first of all focus on the military industry within our nation."
 NOR_focus_on_civilian_industry:0 "Focus on the Civilian Industry"
 NOR_focus_on_civilian_industry_desc:0 "Our industry is as of now not capable of having a positive growth without additional help from the state. We must secure a civilian industrial base before we rearm ourselves."
 NOR_new_school_law:0 "New School Law"
 NOR_new_school_law_desc:0 "We must invest more into the schools if we want to expand the number of pupils and we would also have to increase the competence of the teachers. This will ensure that our nation will have greater competence and education than the rest of Europe and the world."
 NOR_aid_rural_farmers_decision:0 "Aid Rural Farmers"
 NOR_aid_rural_farmers_decision_desc:0 "Many farmers are left with an unreasonably high amount of debt after the previous years of economic stagnation and debt inflation. We must ensure that the farmers are back on their feet as soon as possible."
 NOR_promote_technological_innovativeness_decision:0 "Promote Technological Innovation"
 NOR_promote_technological_innovativeness_decision_desc:0 "To ensure that the economy is always experiencing growth we must ensure that it is continously growing. This may be achieved through incentives where businesses' innovativeness is rewarded."
 NOR_improve_workers_conditions_decision:0 "Improve Worker Conditions"
 NOR_improve_workers_conditions_decision_desc:0 "Workers has for too long been victims of social dumping, wage exploitation and work fatigue. We must improve worker conditions by creating stricter laws and demanding higher welfare for our beloved workers."
 NOR_expand_the_oslo_breakfast:0 "Expand the \"Oslo Breakfast\""
 NOR_expand_the_oslo_breakfast_desc:0 "\"Oslofrokosten\", the Oslo breakfast, is an experiment for the schools in Oslo where they are served a breakfast 45 minutes before school. The meal is free for children and is consisting of foods such as milk, kneippbrød, fruit and a spoon with cod liver oil. We must expand this breakfast to central cities to ensure that the children who will spend time at school are properly fed."
 NOR_agricultural_loan_fund:0 "Agricultural Loan Fund"
 NOR_agricultural_loan_fund_desc:0 "Many of the farmers around the country has amassed a debt that will be repaid through a lifetime. The farmers need aid, and we must provide a loan fund for the agriculture sector as a way to help them."
 NOR_aid_public_schools:0 "Aid Public Schools"
 NOR_aid_public_schools_desc:0 "Many schools in the nation is left without proper education tools, such as books, blackboards and the newest apple iphone. We must increase spendings so we can assure that the teachers in our schools have the necessary tools to teach properly."
 NOR_reform_the_police:0 "Reform the Police"
 NOR_reform_the_police_desc:0 "During the Quisling administration the police became more armed and dangerous as he wanted to crack down on crime and socialism as much as possible. We must reform the police and instead make they more local to better help preventing crimes aswell as disallowing paramilitary groups to ensure the safety of the nation."
 NOR_expand_the_term_of_office:0 "Expand the Term of Office"
 NOR_expand_the_term_of_office_desc:0 "Norway has an election every 3 years. Many politicans has said it would be more practical to have a term of office of 4 years instead of 3 as is standard in most European nations."
 NOR_employment_efforts:0 "Employment Programs"
 NOR_employment_efforts_desc:0 "We should initize programs for the unemployed to get working again by creating new jobs aswell as restructure current workplaces so that more people will be employed."
 NOR_budget_cuts_decision:0 "Budget Cuts"
 NOR_budget_cuts_decision_desc:0 "As the economic situation is still troubling our economy we need to come to the realisation that the economic budget is to optimistic. We need to cut down on the budget and maintain a balanced budget approach in the economic crisis."
 NOR_det_brukne_gevaers_politikk:0 "Det Brukne Geværs Politikk"
 NOR_det_brukne_gevaers_politikk_desc:0 "\"The politics of the broken gun\". Meaning that if we keep militarization our building up our military, other nations will do so too, possibly leading to war. By keeping our military small, we will also keep the chances of war small."
 NOR_establish_den_norske_industribank:0 "Establish Den Norske Industribank"
 NOR_establish_den_norske_industribank_desc:0 "To help out industries we must establish a bank which gives out longterm capital to industries, not only to secure the banks from bankruptcy but also to secure jobs."
 NOR_help_out_the_unemployed_decision:0 "Help out the Unemployed"
 NOR_help_out_the_unemployed_decision_desc:0 "As our nation as a whole is still damaged by the high unemployment, so is also the unemployed. We must take act to better the condition that the unemployed and poor live in."
 NOR_establish_the_ministry_of_provisioning:0 "Establish the Ministry of Provisioning"
 NOR_establish_the_ministry_of_provisioning_desc:0 "Like we did in the Great War, we should create a ministry of provisioning to limit civilian waste of vital resources that could be either useful for trade or for a military buildup."
 NOR_expand_norsk_hydro_decision:0 "Expand Norsk Hydro"
 NOR_expand_norsk_hydro_decision_desc:0 "Norsk Hydro's aluminium extraction has for years been a vital export for Norway. We should expand Norsk Hydro so they can extract even more resources."
 NOR_help_out_the_civilian_sector_decision:0 "Help out the Civilian Sector"
 NOR_help_out_the_civilian_sector_decision_desc:0 "The civilian sector in Norway has had many businesses shut down as the economic crisis is still ongoing. We need to help out the civilian sector so that they may begin to employ people again."
 NOR_open_nhh:0 "Open a Business School"
 NOR_open_nhh_desc:0 "The business communities in Norway has for years discussed and wanted a business school in Norway. There is already several business schools established in Europe, and Stortinget passed a resolution to create a norwegian business school."
 NOR_public_works_decision:0 "Public Works"
 NOR_public_works_decision_desc:0 "We should start to assign unemployed humans to state-funded construction work. This way we will both build infrastructure and put unemployed into work, however it will not be cheap."
 NOR_arbeidervernloven_av_1936_decision:0 "Arbeidervernloven av 1936"
 NOR_arbeidervernloven_av_1936_decision_desc:0 "Seeing the need for a new and improved law about the rights and protection of workers, we can soon celebrate 9-day vacations and statutory 8-hour workdays. Of course, only if the law is passed..."
 NOR_aid_bankrupt_businesses_decision:0 "Aid Bankrupt Businesses"
 NOR_aid_bankrupt_businesses_decision_desc:0 "For the past two years we've had our focus on aiding bankrupt businesses. Now with some final effort it seems like we can revive quite a few of the profitable ones."
 NOR_age_pension_decision:0 "Introduce Age Pension"
 NOR_age_pension_decision_desc:0 "Elderly people who have devoted their lives, ability and energy to work and serve our nation are often left out in the cold when they no longer possess the ability to work. We must ensure they are fairly paid for their work earlier in their lives."
 NOR_expand_the_budget_decision:0 "Expand the Budget"
 NOR_expand_the_budget_decision_desc:0 "The Nygaardsvold government has followed the theories of Keynes to increase the spendings to increase employment and to improve the economic situation. We would have to reflect this in our budgets and take in the necessary loans to finance our new budget."
 NOR_delete_farmer_debt:0 "Delete Farmer Debt"
 NOR_delete_farmer_debt_desc:0 "Many farmers had taken up loans because of the rapid mecahnization we had during the previous decades.When the economic crisis hit, the real amount of the debt rose over 4 times - which few could pay back. By deleting their debt, we can assure that the people who took up debt can manage themselves again."
 NOR_boost_gun_production:0 "Boost Gun Production"
 NOR_boost_gun_production_desc:0 "If war would break out, it would be necessary for our army to be properly equipped and prepared. Our army is currently lacking in this field, and we need to expand the gun production to meet its' needs."
 NOR_military_armament:0 "Military Armaments"
 NOR_military_armament_desc:0 "We can not trust our neighbours and other nations in Europe to be as peaceful as we are. We should start a military armament campaign to be better prepared in case a war would break out."
 NOR_recruitment_campaign:0 "Recruitment Campaign"
 NOR_recruitment_campaign_desc:0 "Our nation has too low population to properly defend itself. We must at least try to create a strengthened defence by having a recruitment campaign."
 NOR_train_new_officers:0 "Train New Officers"
 NOR_train_new_officers_desc:0 "As the nation has had a long period of keeping the military expenses at the minimum, the competence of the high command and officer corps is below what is necessary in a potential war. We must take effort to train new officers who can fight in a war."
 NOR_create_the_NRK:0 "Found the NRK"
 NOR_create_the_NRK_desc:0 "Radio is a relatively new field of communications and we should aspire to spread to the use of radio as much as possible. We should create a national broadcasting company using the same ideal of public broadcasting as the BBC."
 NOR_start_work_on_a_language_reform:0 "Begin work on a Language Reform"
 NOR_start_work_on_a_language_reform_desc:0 "We must assign a committe to find out how to reform the two forms of written norwegian, Bokmål and Nynorsk, into one written language."
 NOR_finish_the_language_reform:0 "Complete the Language Reform"
 NOR_finish_the_language_reform_desc:0 "Our progress to slowly reform the language is under the way and the commitee we assigned has found several edits to both Bokmål and Nynorsk, that will make the languages similar and we may be able to merge them at a later date."
 NOR_christian_school_books:0 "More Christianity in Schools"
 NOR_christian_school_books_desc:0 "We must learn our children the values of christianity to better the world. We have a large christian heritage that needs to be kept, and the christian message is vital if we want our nation to stay together."
 NOR_idrettsforliket:0 "Merge AiF and NLI"
 NOR_idrettsforliket_desc:0 "Today our the two biggest sport associations is splitted. One is the Arbeidernes Idrettsforening and the other is Norges Landsforbund for Idrett where one is respectively for workers and the other is for non-socialist. The two organizations are so divided that they refuse to partake in any arrangement where the other is partaking in. We must strive to improve this situation by merging the two organizations to cool the tension, as it is good for neither our athletes nor our internal stability."
 NOR_rural_farm_jobs:0 "Secure Rural Employment"
 NOR_rural_farm_jobs_desc:0 "When the great war ended, much of the \"monopoly\" Norway had on fishing and farming products to Germany, and timber export to Britain, fell and many farmers lost their lives are the grain prices rose. We should take efforts to secure back the farmers' jobs."
 NOR_increased_fishing_rights:0 "Expand Fishing Rights"
 NOR_increased_fishing_rights_desc:0 "Fish has traditionally been an important source of food for the norwegian people. We should seek to expand the fishing rights, which would give more food to the people, however we must be careful not to allow any overfishing."
 NOR_municipalty_support:0 "Municipalty Support"
 NOR_municipalty_support_desc:0 "Many of our nations municipalties have been left with huge debt and too few economic resources to handle their debt. To better the situation we must restructure the municipalties slightly to give them a better economic basis, but also repay their debt."
 NOR_fish_exports:0 "Fish Exports"
 NOR_fish_exports_desc:0 "Our export to the rest of Europe has traditionally been fish, and although the demand for fish has sunk like a rock after the great war, we can assign for new trade deals which allows us more trade, which means more money."
 NOR_wartime_protocols:0 "Civilian Wartime Protocols"
 NOR_wartime_protocols_desc:0 "The great european powers are on road to another great conflict. We must prepare our civilian population for the devastating conflict that is rising on the horizon!"
 NOR_research_institutions_help:0 "Assist Research Institutions"
 NOR_research_institutions_help_desc:0 "The higher educational institutions in Norway are starting to become important research centres, both nationally and internationally. By assisting these institutions further, both the universities and we will learn useful research from their studies."
 NOR_anti_pacifism_effort:0 "Anti-Pacifism Efforts"
 NOR_anti_pacifism_effort_desc:0 "It is clear for us that there's is only a question of time for when the next grand european war breaks out. We can not let any insecurity prolong our buildup or militarization when the war is a reality upon us."
 NOR_more_foreign_investors:0 "Attract Wealthy Investors"
 NOR_more_foreign_investors_desc:0 "Our open border policy of free trade of capital, makes it possible for huge amount of investments to move into norwegian businesses. We should try to attract even more wealthy companies to invest in Norway."
