 #Parliament Events
 norwegian_parliament.1.t:0 "Our law proposal has been approved!"
 norwegian_parliament.1.d:0 "Our law proposal has now been worked out, voted through and verified in Stortinget. Consequently the law's effect will come into effect as soon as our sitting government will enact the law as soon as possible. This has also marked a victory for the government, pushing through a law proposal.\n\nWe may now propose a new law."
 norwegian_parliament.1.a:0 "Great!"
 norwegian_parliament.10.t:0 "Our law proposal is voted down"
 norwegian_parliament.10.d:0 "Our law proposal in Stortinget did now manage to gain the necessary amount of votes for it to be approved. Although this means that we, for the moment, will not enact the law, we can still propose this motion yet again.\n\nWe may now propose a new law."
 norwegian_parliament.10.a:0 "Too bad"
 #NKP
 norwegian_parliament.100.t:0 "Negotiations with NKP"
 norwegian_parliament.100.d:0 "We have approached the communist party of NKP for support on our law proposal. They have made it clear that if we want their support on this matter, then we would have to give something back in return. NKP has said themselves willing to give their support in exchange for either expanded social relief or government funds against anti-pacifism efforts.\n\nHow should we proceed?"
 norwegian_parliament.100.a:0 "Social Relief for the People!"
 norwegian_parliament.100.b:0 "Put down anti-pacifism."
 norwegian_parliament.100.c:0 "We'd rather not negotiate with communists"
 #Arbeiderpartiet
 norwegian_parliament.110.t:0 "Arbeiderpartiet Supports our Proposal"
 norwegian_parliament.110.d:0 "As we expected earlier, Arbeiderpartiet is quite eager to vote for our proposal. We now have their support in the parliament!"
 norwegian_parliament.110.a:0 "Sweet!"
 norwegian_parliament.111.t:0 "Seek Support from Arbeiderpartiet"
 norwegian_parliament.111.desc:0 "We have approached the social democratic party of Arbeiderpartiet for support on our law proposal. They have made it clear that if we want their support on this matter, then we would have to give something back in return. Arbeiderpartiet has said themselves willing to give their support in exchange for more room for their policies within the government.\n\nHow should we proceed?"
 norwegian_parliament.111.a:0 "Let's defeat militarization!"
 norwegian_parliament.111.b:0 "Let's downprioritize the military..."
 norwegian_parliament.111.c:0 "Looks like meat is back on the meny boys!"
 norwegian_parliament.111.d:0 "Social Relief for the people!"
 norwegian_parliament.111.e:0 "Subsidized housing!"
 norwegian_parliament.111.f:0 "We need their support"
 norwegian_parliament.111.g:0 "We don't need their support..."
 norwegian_parliament.112.t:0 "Disagreements within Arbeiderpartiet"
 norwegian_parliament.112.d:0 "As we started supporting the current law proposal, some members of Arbeiderpartiet questioned the proposal as it goes against the values of Arbeiderpartiet. Nygaardsvold has already spoken out on the incident, saying that this is only for the well-being of Norway and the law is only a positive. Spectators debate what effect this will have on the current government and the political landscape in Norway. Regardless, Nygaardsvold has appeared out of touch of what the voters want."
 norwegian_parliament.112.a:0 "Not good."
 norwegian_parliament.113.t:0 "More disagreements within Arbeiderpartiet"
 norwegian_parliament.113.d:0 "As we started supporting the current law proposal, some members of Arbeiderpartiet questioned the proposal as it goes against the values of Arbeiderpartiet. Nygaardsvold has already spoken out on the incident, saying that this is only for the well-being of Norway and the law is only a positive. Spectators debate what effect this will have on the current government and the political landscape in Norway. Regardless, Nygaardsvold has appeared out of touch of what the voters want."
 norwegian_parliament.113.a:0 "I've got a bad feeling about this."
