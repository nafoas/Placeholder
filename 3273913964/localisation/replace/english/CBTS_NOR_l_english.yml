 NOR_military_confusion:0 "Military Confusion"
 NOR_military_confusion_desc:0 "War has just struck Norway and it has caught most of the political leadership off guard and certain officials in the norwegian military high command has already given up. The military high command needs time to reorganize to prepare to be able to repel the invaders."
 NOR_more_military_spending:0 "Increased Military Spending"
 NOR_more_military_spending_desc:0 ""
 NOR_minority_cabinet:0 "Minority Cabinet"
 NOR_minority_cabinet_desc:0 "Ever since the short lived, socialist Arbeiderpartiet-government in 1928, the political climate in Norway has been dominated by short-lived and unstable non-socialist governments, where the only agreement between the non-socialists is to not allow Arbeiderpartiet, the socialist party, to form a government. \n\nThis has led to weak parliamental support for each party, where they are facing the threat of a motion of no confidence, even the current sitting government's days are numbered. Norway is dependant on a larger coalition to break out of the political stand-still that has occured during the previous years."
 NOR_the_great_depression4:0 "The Great Depression"
 NOR_the_great_depression4_desc:0 "In the aftermath of the Great War, much of the norwegian economy was sent into stagnation, with productivity and efficiency falling. The economy spent much of the 1920s either experiencing stagnation or having an economic boom. However, after the Wall Street Crash hit in 1929, the Norway economy was yet again sent into an economic crisis. Only time can tell when or if Norway can get out of the this crisis."
 NOR_the_great_depression3:0 "The Great Depression"
 NOR_the_great_depression3_desc:0 "In the aftermath of the Great War, much of the norwegian economy was sent into stagnation, with productivity and efficiency falling. The economy spent much of the 1920s either experiencing stagnation or having an economic boom. However, after the Wall Street Crash hit in 1929, the Norway economy was yet again sent into an economic crisis. Only time can tell when or if Norway can get out of the this crisis."
 NOR_the_great_depression2:0 "The Great Depression"
 NOR_the_great_depression2_desc:0 "In the aftermath of the Great War, much of the norwegian economy was sent into stagnation, with productivity and efficiency falling. The economy spent much of the 1920s either experiencing stagnation or having an economic boom. However, after the Wall Street Crash hit in 1929, the Norway economy was yet again sent into an economic crisis. Only time can tell when or if Norway can get out of the this crisis."
 NOR_the_great_depression1:0 "The Great Depression"
 NOR_the_great_depression1_desc:0 "In the aftermath of the Great War, much of the norwegian economy was sent into stagnation, with productivity and efficiency falling. The economy spent much of the 1920s either experiencing stagnation or having an economic boom. However, after the Wall Street Crash hit in 1929, the Norway economy was yet again sent into an economic crisis. Only time can tell when or if Norway can get out of the this crisis."
 NOR_huge_unemployment4:0 "Huge Unemployment"
 NOR_huge_unemployment4_desc:0 "As economic stagnation hit the norwegian industries during the 1920s, many jobs dissapeared as the productivity and efficiency fell. Workers were left without jobs, and were put in a hard position, especially when the prices increased and the wages were lowered. As the number of unemployed increased to 110 000 workers in 1930 it's been clear that this is much more a social crisis, than an economic one."
 NOR_huge_unemployment3:0 "Huge Unemployment"
 NOR_huge_unemployment3_desc:0 "As economic stagnation hit the norwegian industries during the 1920s, many jobs dissapeared as the productivity and efficiency fell. Workers were left without jobs, and were put in a hard position, especially when the prices increased and the wages were lowered. As the number of unemployed increased to 110 000 workers in 1930 it's been clear that this is much more a social crisis, than an economic one."
