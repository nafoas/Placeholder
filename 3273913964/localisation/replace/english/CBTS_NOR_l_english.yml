 #News Events
 nor_news.1.t:0 "Liberals form Government in Norway"
 nor_news.1.d:0 "The former Norwegian government led by prime minister Jens Hundseid from the agrarian party fell after a vote of no confidence gained majority thanks to the seats from the Liberal and the Social Democratic party. The Hundseid-Government was a troubled one with little support both within and outside the government. It failed to deal with the economic crisis, and the unemployment only rose under it. The new government consists solely of the liberal party with its' parliamentary leader Johan Mowinckel becoming prime minister, which will be his third government."
 nor_news.1.a:0 "Interesting."
 nor_news.2.t:0 "Social Democrats form Government in Norway"
 nor_news.2.d:0 "The former Norwegian government led by prime minister Jens Hundseid from the agrarian party fell after a vote of no confidence gained majority thanks to the seats from the Social Democratic and the Liberal party. The Hundseid-Government was a troubled one with little support both within and outside the government. It failed to deal with the economic crisis, and the unemployment only rose under it. The new government consists solely of the Social Democratic party with its' parliamentary leader Johan Nygaardsvold becoming prime minister, which will be the second time the Social Democratic party has been in power."
 nor_news.2.a:0 "Okay."
 nor_news.5.t:0 "Social Democrats form Government in Norway"
 nor_news.5.d:0 "Today the former Norwegian government, led by Johan Ludwig Mowinckel and his cabinet consisting mainly of Liberal politicans resigned after not gaining majority for their economic budget. After their resignation, the Social Democratic party, with the support of the Agrarians, formed a new government which is led by prime minister Nygaardsvold.\n\nIt is likely that this will mean that the political landscape in Norway will moderate, as the Socialists are dependant on support from the Non-Socialist, and the Non-Socialist now is open for cooperation with the Social Democrats."
 nor_news.5.a:0 "The political landscape is changing."
 nor_news.7.t:0 "Norway joins the [ENG.GetFactionName]"
 nor_news.7.d:0 "Today the Norwegian goverment announced that [NOR.GetName] had formally joined the [ENG.GetFactionName]. This comes to a shock to many, seeing as Norway has until recently followed a strict neutrality foreign policy. This will undoubtedly strenghten [ENG.GetAdjective] and [NOR.GetAdjective] interests and control in the North Sea-region."
 nor_news.7.a:0 "The fools are grouping together..."
 nor_news.7.b:0 "Weird times, indeed"
 nor_news.8.t:0 "Norway joins the [GER.GetFactionName]"
 nor_news.8.d:0 "Today the Norwegian and German foreign department announced Norway's formal entry into the [WGR.GetFactionName]. This comes to a light surprise to many observers - as Norway until recently advocaded for a strict neutrality foreign policy. This will undoubtedly strenghten [WGR.GetAdjective] interests both in Scandinavia and in the North Sea, however the long-term consequences of this entry are less certain."
 nor_news.8.a:0 "The [WGR.GetFactionName] are expanding their influence!"
