 ### Ideas ###
 #Permament Laws
 NOR_WELFARE_IDEAS:0 "Parliament Laws"
 NOR_new_law:0 "New Law"
 NOR_social_reforms_idea:0 "Social Reforms"
 NOR_a_liberal_norway_idea:0 "A Liberal Norway"
 NOR_a_social_democratic_norway_idea:0 "A Social Democratic Norway"
