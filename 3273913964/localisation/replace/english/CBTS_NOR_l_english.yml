 norway_external.17.t:0 "Norway asks for Guarantee"
 norway_external.17.d:0 "The norwegian ambassador in London handed today over a proposal from the norwegian government. The proposal includes that Britain shall give a guarantee over Norway's independence, and in return Norway will align itself with Britain if a war would break out. Norway's strategic location would be essential for us if a war would break out over the north sea, however as they have weak military we may be forced to aid with troops should they be invaded.  Should we accept the offer? "
 norway_external.17.a:0 "Beneficial for both!"
 norway_external.17.b:0 "We will not go out of our way to protect others"
 norway_external.18.t:0 "Norway wants to join the [ENG.GetFactionName]"
 norway_external.18.d:0 "Today we have received a telegram from the norwegian government that they are wishing join the [ENG.GetFactionName]. They have cited the wish for increased cooperation, aswell as better relations and the wish to defend democracy as the main reasons for this proposal. If we are to accept this, we are to have greater access to the north-sea and the atlantic ocean, especially from the German threat. Their military is however of a moderate size, so we would have to extend our military if Norway ever is under attack. Should we allow them into the [ENG.GetFactionName]?"
 norway_external.18.a:0 "Accept!"
 norway_external.18.b:0 "We are better off without them"
 norway_external.19.t:0 "Britain accepts our request for guarantee"
 norway_external.19.d:0 "We have just received word from the british government that they agreed to guarantee our independence. Although there exists some doubters within our nation, most people feel more safe now."
 norway_external.19.a:0 "Excellent News!"
 norway_external.20.t:0 "Britain declines our request for a guarantee"
 norway_external.20.d:0 "Today we received a message from the british foreign department that they will not be guaranteeing our independence."
 norway_external.20.a:0 "Oh..."
 norway_external.21.t:0 "Britain accept our offer to join the [ENG.GetFactionName]"
 norway_external.21.d:0 "We just received word from the british officials that they have accepted our offer to join the [ENG.GetFactionName]. All that is left is to formally sign the treaty and we will join the [ENG.GetFactionName]!"
 norway_external.21.a:0 "We always had a friend in Britain!"
 norway_external.22.t:0 "Britain declines our offer to join the [ENG.GetFactionName]"
 norway_external.22.d:0 "We just received word from the british foreign department that they will not be accepting our offer to join the [ENG.GetFactionName]. This has come to the shock of many within our government, who expected Britain to answer otherwise."
 norway_external.22.a:0 "We have to look elsewhere..."
