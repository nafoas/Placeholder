 NOR_new_school_law_idea:0 "New School Law"
 NOR_aid_public_schools_idea:0 "Aid Public Schools"
 NOR_aid_public_schools_idea_desc:0 "Seeing the need to upgrade schools, the norwegian government has initiated increased spendings on public schhol to aid and improve it."
 NOR_unemployed_benefits_idea:0 "Unemployment Benefits"
 NOR_secure_rural_employment_idea:0 "Secure Rural Employment"
 NOR_open_nhh_idea:0 "Opened the Norwegian School of Economics and Business Administration"
 NOR_finish_the_language_reform_idea:0 "Completed the Language Reform"
 NOR_fish_exports_idea:0 "Increased Fish Export"
 NOR_foreign_investors_idea:0 "Foreign Investors"
 NOR_foreign_investors_idea_desc:0 "Opening the country to foreign investors has attracted several wealthy investors willing to put their capital to use. The investors will gain profit, and we will get employment, work and resources from their investments."
 NOR_foreign_investors_idea2:0 "Foreign Investors"
 NOR_foreign_investors_idea2_desc:0 "Opening our country to foreign investors is a win-win scenario. They will get profit and we will get employment, work and resources from their investments."
 NOR_resource_excavation:0 "Resource Excavation"
 NOR_resource_excavation_desc:0 "Norway has a large mineral basis and has a large mining potential. We are currently expanding the resource excavation in our country."
 NOR_increased_exports_idea:0 "Increased Exports"
 NOR_increased_exports_idea_desc:0 "Seeking to strenghten the norwegian trade abroad aswell as the norwegian financial market, the norwegian government has begun increasing exports."
 NOR_expanded_fishing_rights_idea:0 "Expanded Fishing Rights"
 NOR_expanded_fishing_rights_idea_desc:0 "Fish has traditionally been an important source of food for the norwegian people. We should seek to expand the fishing rights, which would give more food to the people, however we must be careful not to allow any overfishing."
 NOR_research_institutions_help_idea:0 "Research Institutions Help"
 NOR_research_institutions_help_idea_desc:0 "The higher educational institutions in Norway are starting to become important research centres, both nationally and internationally. By assisting these institutions further, both the universities and we will learn useful research from their studies."
 NOR_more_foreign_investors_idea:0 "Foreign Investors"
 NOR_more_foreign_investors_idea_desc:0 "Our open border policy of free trade of capital, makes it possible for huge amount of investments to move into norwegian businesses. We should try to attract even more wealthy companies to invest in Norway."
 NOR_municipalty_support_idea:0 "Muncipalty Support"
 NOR_municipalty_support_idea_desc:0 "Many of our nations municipalties have been left with huge debt and few economic resources. To better the situation we must restructure the municipalties slightly to give them a better economic basis, but also repay their debt."
 #Timed Laws
 NOR_increased_gun_production:0 "Increased Gun Production"
 NOR_increased_gun_production_desc:0 "The Norwegian Military is largely outdated and now that there's trouble on the horizon, they are in dire need of arms, and we have started increasing our gun production to meet their needs."
 NOR_support_armament_industry:0 "Support Armament Industry"
 NOR_support_armament_industry_desc:0 "The Norwegian Armament Industry is getting outdated, we must support it to prevent us from falling too far behind as it may be our doom."
 NOR_training_of_new_officers:0 "Train New Officers"
 NOR_training_of_new_officers_desc:0 "Every army consists of the core element of infantry, who is able to support both tanks, trucks and artillery. For the infantry to be able to fight, they need officers to command them..."
 NOR_conscription_campaign:0 "Conscription Campaign"
 NOR_conscription_campaign_desc:0 "In a time of war it is necessary for every man to do his duty. We must be prepared when a war breaks out, as we don't want to be caught with our pants down."
 NOR_public_works:0 "Public Works"
 NOR_public_works_desc:0 "We have started several projects to improve the employment in our country, sadly it also costs."
 NOR_deletion_of_debt:0 "Deletion of Farmer Debt"
 NOR_deletion_of_debt_desc:0 "We have begun deleting debt that is unjustly high for farmers, and this is necessary if we want the agrarian economy to get on it's own feet again."
 NOR_help_out_the_civilian_sector_idea:0 "Help out the Private Sector"
 NOR_help_out_the_civilian_sector_idea_desc:0 "The private sector in Norway has seen economic and social issues that has troubled it's development lately. We need to ensure that the private sector will recover sooner rather than later."
 NOR_start_work_on_a_language_reform_idea:0 "Language Reform"
 NOR_start_work_on_a_language_reform_idea_desc:0 "A committe has sat down and began discussing how to reform the two forms of written norwegian, Bokmål and Nynorsk, into one written form to rule them all."
 #Negotiation Laws
 NOR_venstre_negotiate1:0 "§OScholarships for Students§!"
 NOR_venstre_negotiate1_desc:0 "In the future there will be dire need for educated humans, and to meet this demand we are making it easier for humans to study by giving out scholarships."
 NOR_venstre_negotiate2:0 "§OSocial Security Expansion§!"
 NOR_venstre_negotiate2_desc:0 "Helping poor people with increased and improved social security will ensure that poor people can get out of poverty. It will also help people stuck in poverty with money to live with."
 NOR_venstre_negotiate3:0 "§OProductivity actions in the agriculture§!"
 NOR_venstre_negotiate3_desc:0 "With the economic crisis, the agricultural productivity fell like a rock. We must increase money on the agriculture sector if we want the productivity to increase."
 NOR_venstre_negotiate4:0 "§OSupport Academics§!"
 NOR_venstre_negotiate4_desc:0 "Our country consists of many doctors, professors and other academics, we should support these academics as they make up a core of our population."
 NOR_venstre_negotiate5:0 "§OSupport the Culture Sector§!"
 NOR_venstre_negotiate5_desc:0 "Our culture - in literature, sports and science - is having a positive progression. We should support this sector even more!"
 NOR_social_relief:0 "§OSocial Relief§!"
 NOR_social_relief_desc:0 "More social relief will helpfully aid poor people out of poverty. However those who is stuck in poverty will still have money to live on."
 NOR_lowered_taxes:0 "§OLowered Taxes§!"
 NOR_lowered_taxes_desc:0 "Lowered taxes will help people who wants to found new businesses aswell as ordinary people who wants to live with more money."
 NOR_AP_negotiate1:0 "§OAnti-Militarization§!"
 NOR_AP_negotiate1_desc:0 "We should strike down on militarization to prevent polarization of the politics and fascism gaining support."
 NOR_AP_negotiate2:0 "§ODecreased Military Spendings§!"
 NOR_AP_negotiate2_desc:0 "We shouldn't waste money around on the military when we have more important things to prioritize."
 NOR_AP_negotiate3:0 "§OFree Meals in Schools§!"
 NOR_AP_negotiate3_desc:0 "Before there were too many poor children that could not afford to either buy or bring food from their homes. Now they can eat at school."
 NOR_AP_negotiate4:0 "§OIncreased Social Relief§!"
 NOR_AP_negotiate4_desc:0 "More social relief will helpfully aid poor people out of poverty. However those who is stuck in poverty will still have money to live on."
 NOR_AP_negotiate5:0 "§OSubsidized Housing§!"
 NOR_AP_negotiate5_desc:0 "There are enough poor people in our country as is. We should focus on giving out houses for poor people that live in poverty."
 NOR_increased_military_spending:0 "§OIncreased Military Spendings§!"
 NOR_increased_military_spending_desc:0 "There will be a bigger need for a stronger military force in future. Let's increase the spending of the military now, to protect ourself later."
 NOR_BP_negotiate1:0 "§OHelp Rural Unemployed§!"
 NOR_BP_negotiate1_desc:0 "In the rural districts of our nation, many people are without work. We must initatiate projects to help them out of their unemployment!"
 NOR_BP_negotiate2:0 "§OIncreased Grain Duties§!"
 NOR_BP_negotiate2_desc:0 "In the previous decades has Norway experienced an increase of both exports and imports. While it has largely helped out the majority of the population, many farmers are left without high enough prices on their goods for them to live off it. We must increase the duties on foreign grain if we want the farmers to still remain in our nation."
 NOR_BP_negotiate3:0 "§OMonetary Support to Farmers§!"
 NOR_BP_negotiate3_desc:0 "Many farmers have gone into debt by the economic crisis, or has lost a majority of their income thanks to competition from other nations with cheaper grain. We must save these farmers and give them support so they can survive."
 NOR_BP_negotiate4:0 "§OPreserve Local Democracy§!"
 NOR_BP_negotiate4_desc:0 "We must ensure that the local democracies are in tact so that the people can be represented not by the state on local matters, but rather representatives of their own choosings."
 NOR_BP_negotiate5:0 "§OSupport the Primary Industrial Sector§!"
 NOR_BP_negotiate5_desc:0 "Many farmers, foresters, fishers and miners have lost much of their jobs and their influence within the government. It is necessary to protect their right to be represented!"
 NOR_hoyre_negotiate1:0 "§OPrivate Initiatives§!"
 NOR_hoyre_negotiate1_desc:0 "The private sector is responsible for much of the capital that goes around in our nation. We must ensure that the private properties can remain, to ensure that our population both has money to spend but also money to spare."
 NOR_hoyre_negotiate2:0 "§OChurch Support§!"
 NOR_hoyre_negotiate2_desc:0 "Many churches have gone bankrupt or into total mess since the 1930s, this will help out churches in need."
 NOR_hoyre_negotiate3:0 "§OTax Cuts§!"
 NOR_hoyre_negotiate3_desc:0 "In a time of economic crisis, large parts of the population is left without enough money to keep their expenses and lifestyles up, no matter their wealth. When we lowered the taxes we ensured that it wouldn't happen to out population."
 NOR_hoyre_negotiate4:0 "§OReinforce Christian Values§!"
 NOR_hoyre_negotiate4_desc:0 "We need to ensure that our christian heritage and tradition is kept relevant - we should christian books and schools."
 NOR_hoyre_negotiate5:0 "§OSupport Militarism§!"
 NOR_hoyre_negotiate5_desc:0 "Our country has for too long been supporting the neutral and pacifistic side, we should now focus on the military!"
 #Air
 NOR_expanded_air_production:0 "Increased Air Production"
 NOR_expanded_air_production_desc:0 "We must increase our Air Production if we want our air force to be as good and modern as possible!"
 NOR_aircraft_payments:0 "Foreign Payments"
 NOR_aircraft_payments_desc:0 "The recent purchase of aircrafts has left us with foreign payments for a while."
 #Army
 NOR_defensive_army:0 "A Defensive Army"
 NOR_defensive_army_desc:0 "§Y(Localization TBD)§!"
 #Navy
 NOR_destroyer_production:0 "Destroyer Production"
 NOR_destroyer_production_desc:0 "With the development of the Sleipner-Class Destroyers there has been an initiative from the government for more focus on the construction of new destroyers."
 NOR_merchant_navy1:0 "Norwegian Merchant Navy"
 NOR_merchant_navy1_desc:0 "Norway has one of the largest civilian navies in the world. §Y(Localization TBD)§!"
 NOR_merchant_navy2:0 "Handelsflåten"
 NOR_merchant_navy2_desc:0 "Norway has one of the largest civilian navies in the world. §Y(Localization TBD)§!"
 NOR_merchant_navy3:0 "NORTRASHIP"
 NOR_merchant_navy3_desc:0 "§Y(Localization TBD)§!"
 #Politics
 NOR_a_new_economic_plan1:0 "New Economic Commitment"
 NOR_a_new_economic_plan1_desc:0 "The new economic commitment, is the current plan of the Mowinckel government to solve the economic crisis that Norway currently is in. This will be achieved through economic intervention with budget cuts, increasing productivity aswell as reducing the state's independence on loans."
 NOR_a_new_economic_plan6:0 "Stabilization Policies"
 NOR_a_new_economic_plan6_desc:0 "The earlier recovery plans, while initially succesfull, failed it's goal of restoring the norwegian economy. The social democratic government is now pursuing a new line in economic thinking: Keynesian Economcs. Now instead of reducing our costs as our income is reduced, we instead take in more loans to accomodate economic growth and recession."
 NOR_kriseplan1:0 "Kriseplanen"
 NOR_kriseplan1_desc:0 "Kriseplanen, the \"plan of emergency\" is the current economic policy of the norwegian government. It entitles noteworthy loan sums to stimulate the market and increase demands."
 NOR_kriseplan2:0 "Kriseplanen"
 NOR_kriseplan2_desc:0 "Kriseplanen, the \"plan of emergency\" is the current economic policy of the norwegian government. It entitles noteworthy loan sums to stimulate the market and increase demands."
 NOR_kriseplan3:0 "Kriseplanen"
 NOR_kriseplan3_desc:0 "Kriseplanen, the \"plan of emergency\" is the current economic policy of the norwegian government. It entitles noteworthy loan sums to stimulate the market and increase demands."
 NOR_kriseplan4:0 "Kriseplanen"
 NOR_kriseplan4_desc:0 "Kriseplanen, the \"plan of emergency\" is the current economic policy of the norwegian government. It entitles noteworthy loan sums to stimulate the market and increase demands."
 NOR_a_3_year_plan1:0 "3-Year Plan"
 NOR_a_3_year_plan1_desc:0 "Several influentual norwegian socialist economics, such as Ole Colbjørnsen and Axel Sømme, has advocaded for a transition into a light form of a planned economy. The plan heavily relies on increased taxes and regulation of businesses, while technological advancements will improve efficiency and productivity."
 NOR_a_3_year_plan2:0 "3-Year Plan"
 NOR_a_3_year_plan2_desc:0 "Several influentual norwegian socialist economics, such as Ole Colbjørnsen and Axel Sømme, has advocaded for a transition into a light form of a planned economy. The plan heavily relies on increased taxes and regulation of businesses, while technological advancements will improve efficiency and productivity."
 NOR_a_3_year_plan3:0 "3-Year Plan"
 NOR_a_3_year_plan3_desc:0 "Several influentual norwegian socialist economics, such as Ole Colbjørnsen and Axel Sømme, has advocaded for a transition into a light form of a planned economy. The plan heavily relies on increased taxes and regulation of businesses, while technological advancements will improve efficiency and productivity."
 NOR_a_3_year_plan4:0 "3-Year Plan"
 NOR_a_3_year_plan4_desc:0 "Several influentual norwegian socialist economics, such as Ole Colbjørnsen and Axel Sømme, has advocaded for a transition into a light form of a planned economy. The plan heavily relies on increased taxes and regulation of businesses, while technological advancements will improve efficiency and productivity."
 NOR_the_norwegian_welfare_state_idea:0 "The Norwegian Welfare State"
 NOR_the_norwegian_welfare_state_idea_desc:0 "With important welfare options, such as proper healthcare, limited working hours, age pension and unemployment benefits we have establish the norwegian welfare state. This state is built around the principle that every man, woman and child has an opportunity to succeed in their lives. The state must ensure that everyone is taken care of."
 NOR_increase_tariffs_idea:0 "Increased Grain Tariffs"
 NOR_increase_tariffs_idea_desc:0 "Mwahahah! Now our farmers can sell grain!!"
 NOR_economic_recovery_idea:0 "Economic Recovery"
 NOR_economic_recovery_idea_desc:0 "Through economic commitment and increased spendings by a model alike the Keynesian one, we have managed to recover our economy. The market is positive to it's future, seeing that we just defeated an economic crisis. Is there anything that we can not overcome?"
 NOR_norwegian_neutrality:0 "Norwegian Neutrality"
 NOR_norwegian_neutrality_desc:0 "Ever since Norway gained it's independence in 1905, the norwegian state has pursued a way of peaceful neutrality. During the devastating Great War this kept Norway out of harms way, and thus there is now widespread beliefs that Norway should remain neutral again if another conflict would spread throughout Europe. If a grand european war breaks out again, we would stand little chance alone, therefor we must seek complete and full neutrality to not provoke any nation to attack us. \n\n§YThis national spirit will be lost once Norway is in a faction with another nation.§!"
 NOR_norwegian_neutrality2:0 "Norwegian Neutrality"
 NOR_norwegian_neutrality2_desc:0 "Ever since Norway gained it's independence in 1905, the norwegian state has pursued a way of peaceful neutrality. During the devastating Great War this kept Norway out of harms way, and thus there is now widespread beliefs that Norway should remain neutral again if another conflict would spread throughout Europe. If a grand european war breaks out again, we would stand little chance alone, therefor we must seek complete and full neutrality to not provoke any nation to attack us. \n\n§YThis national spirit will be lost once Norway is in a faction with another nation.§!"
 NOR_norwegian_neutrality3:0 "Armed Neutrality"
 NOR_norwegian_neutrality3_desc:0 "Conflict is blooming in Europe. Our neutral foreign policy makes it unlikely that we will be attacked, however we should not prepare for a peaceful time. We may face the threat of an invasion, and we are arming our nation in case war would come to our nation. \n\n§YThis national spirit will be lost once Norway is in a faction with another nation.§!"
 NOR_abandon_neutrality_idea:0 "Abandoning Neutrality"
 NOR_abandon_neutrality_idea_desc:0 "Norway is in the process of abandoning neutrality with the hope of joining another nation's faction. \n\n§YThis national spirit will be lost once Norway is in a faction with another nation.§!"
 NOR_british_investments_idea:0 "British Investments"
 NOR_british_investments_idea_desc:0 "We have opened up our country for investments from Britain. This is quite prosperous as capital is steadily flowing in to finance different projects within our borders."
 NOR_low_military_spending:0 "Low Military Spending"
 NOR_low_military_spending_desc:0 "In the first decade in the 20th century, the norwegian military was modernized with new equipment in case of a war for independence against Sweden. However after Norway achieved its' independence and the crisis deescalated, the norwegian military lost more of its' funding as the idea of neutrality became prominent, and the fundings were lowered even further during the 20s as the norwegian economy stagnated. Today the military is in lack of proper equipment, sufficient experience and manpower, which is largely due to the lack of funding.\n\nThere is no doubt that it would require a serious reinvestment to modernize the norwegian army. It is as much a political question as much as a geopolitical one."
 NOR_low_military_spending1:0 "Low Military Spending"
