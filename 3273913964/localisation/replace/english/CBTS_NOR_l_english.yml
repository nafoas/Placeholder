 #Introduction Event
 norway.1.t:0 "The Kingdom of Norway in 1933"
 norway.1.d:0 "In 1933 Norway is one of the youngest nations in the world. Norway achieved it's independence from an union with Sweden almost 28 years ago, in 1905. By then, Norway was already a country with longstanding traditions, a working democracy as well as other established institutions. When the Great War started - mere 9 years after it's independence - Norway joined the other Scandinavian countries in an agreement of neutrality and building down their military forces. However, Norway was far from neutral. Norwegian convoys sailed under british flag, under british protection and under the german submarine threat. Although the convoy fleet experienced many losses - the country itself got rich off the lucrative trade with both Britain and Germany. Sadly, when the war ended, Norway lost much of it's \"monopoly\" on many trade goods, and in the upcoming years the Norwegian Economy fell into disarray with many farmers, fishers and workers gaining huge debts.\n\nWith the economic earthquake also came a political earthquake - the socialist party of Arbeiderpartiet gained broad support and the political tension rose ever higher than before. After a brief Arbeiderpartiet-government in 1928 that only sat for 18 days, the non-socialist parties agreed to not let Arbeiderpartiet under any circumstance govern. However the political disagreements between the non-socialists has made it ever hard for them to cooperate together.\n\nThe future of Norway remains unclear. Arbeiderpartiet seems to moderate and to gain more support as the non-socialist parties have been unable to restore the norwegian economic situation as it once was. As this is happening Norway is experiencing radicalism on both sides grow, only time can tell how Norway will look in the future..."
 norway.1.a:0 "What about the Parliament?"
 norway.1.b:0 "I know enough already..."
 norway.2.t:0 "The Language Question"
 norway.2.d:0 "Today the norwegian written language is split in two, Nynorsk and Bokmål. The population is also divided between Nynorsk users, compising much of the Vestlandet region, and Bokmål users, composing mostly of Østlandet, Trøndelag and Nord-Norge.\n\nIn addition to being a lingual issue, it is often viewed as a political one too. Bondepartiet is supportive of Nynorsk, Høire supports Bokmål, meanwhile Arbeiderpartiet and Venstre wants to consolidate the two languages into one over time, a project known as Samnorsk. How should we proceed?"
 norway.2.a:0 "Continue the consolidation"
 norway.2.b:0 "Let them co-exist"
 norway.3.t:0 "Parents Protests against the Language Reform"
 norway.3.d:0 "Several parents have let their dissatisfaction be known as the government is beginning the consolidation of Nynorsk and Bokmål. They've started changing book grammar and publically demonstrating against the changes."
 norway.3.a:0 "Let them protest"
 norway.4.t:0 "The Norwegian Parliament"
 norway.4.d:0 "Norway in CBtS has a parliament, nicknamed \"Stortinget\". Through this parliament you will pass laws, some that affect the hidden modifier called the \"Parliament Laws\". To pass a law you need a majority vote (76 seats). These belong to different parties, and when you select a law to vote on it, you have 60 days to gather the necessary political support, which you will get through spending political power and gaining a negative national spirit for 60 days. It would be wise to see which parties are supportive or positive of the law that you are voting on, as you can make it cheaper to pass it. If you succeed with gathering enough seats, the law will pass, if you don't however it won't, but you can always pass it at a later time."
 norway.4.a:0 "Good to know"
 norway.10.t:0 "[GetYear] Elections"
 norway.10.d:0 "Today, voters all over the country entered voting booths to vote on their preferred political party. With this election, there is also a major uncertainty of who will emerge victorious. Will the social democratic party of AP see the same stagnation as they did in the 1930 elections, or will the \"borgerlige\", the non-socialist, parties continue to hold parliamental majority, maybe even the newly founded fascist party of Nasjonal Samling will see parliamental representation? No matter the result; An election is the sign of a health and working democracy."
 norway.10.a:0 "I love democracy"
# norway.11.t:0 "1936 Elections"
# norway.11.d:0 "Today, voters all over the country entered voting booths to vote on their preferred political party. As with all elections, there is a large question of who will emerge victorious. No matter the result; An election is the sign of a health and working democracy."
# norway.11.a:0 "I love democracy."
 #Politics
 norway.100.t:0 "Mistillitsvotumet av 1933"
 norway.100.d:0 "The sitting Hundseid government has lost more and more support in the Parliament ever since the death of the previous prime minister Peder Kolstad. Especially the Venstre-leader, Johan Mowinckel, has been agitated by the growing influence and instability of the sitting government.\n\nAs the Hundseid government looks to go to an end, the question remains of who shall govern after him?"
 norway.100.a:0 "Venstre forms the new government!"
 norway.100.b:0 "Arbeiderpartiet forms the new government!"
 norway.101.t:0 "Kriseforliket"
 norway.101.d:0 "After the Venstre-led government the past two years, Arbeiderpartiet has seeked and found new parliament support with Bondepartiet by agreeing to remove debt, inflate corn prices and put up higher tariff on farm products."
 norway.101.a:0 "The political landscape changes."
 norway.102.t:0 "Vidkun Quisling forms Nasjonal Samling"
 norway.102.d:0 "The former Minister of Defence and general Vidkun Quisling announced today the creation of the Nasjonal Samling, shortened NS, a party who puts emphasis on the battle against socialists as well a return to \"norse glory\". Nonetheless, the party is heavily inspired by the rising NSDAP in Germany. It has adopted similar paramilitary groups, nicknamed \"Hirden\", which consists of local SA-groups. Vidkun Quisling is already a controversial figure in Norway, and as the founder of a party with its' goal of creating a strong state with a \"fører\" on top, he will undoubtedly spark be even more debated.\n\nAlthough this comes as a surprise to most norwegians, it is still unknown how much this will change the political landscape. Vidkun Quisling himself has mentioned that the goal in the first place will be to get parliamentary representation, which is ironic considering that the party itself is against democratic representation..."
 norway.102.a:0 "Will this change anything?"
 norway.103.t:0 "Moderation within Det Norske Arbeiderpartiet"
 norway.103.d:0 "The short-lived Arbeiderparti-government in 1928 began changes within the worker-movements. No longer was socialism seen as something radical, but instead the movement of moderation was put on emphasis. In a system of democracy, it is necessary for a socialist party to gain the majority vote, if not, it is simply impossible to gain any sort of influence within the decision-making.\n\nIt has now been clear for many DNA officials that the worker-movement should thus focus more on reforms and cooperation, even with non-socialist parties, than being shut out of the democratic process. With a more moderate form of socialism, social democratism, the non-socialist parties will be more likely to tolerate an Arbeiderparti-government."
 norway.103.a:0 "Moderation is key!"
 norway.103.b:0 "The only form of Socialism is true Socialism!"
 norway.104.t:0 "The End of Grønlandssaken"
 norway.104.d:0 "Grønlandssaken, \"the Greenland dispute\", is the dispute between the norwegian and the danish government over the sovereignity of eastern Greenland. The dispute suddenly became highly relevant as four norwegian fishers in 1931 occupied the uninhabitable region, nicknamed it Eirik Raudes Land, after the viking that discovered Greenland, and proclaimed it as a part of Norway. Norway supported the occupation, even going as far as sending out a governor to the recently acquired area. However both Norway and Denmark agreed to settle it pecaefully through the International Court of Justice. Sadly the International Court of Justice ruled against Norway, and the occupation has to be cancelled, much to the dislike of the norwegian populace."
 norway.104.a:0 "Greenland should be ours!"
 norway.105.t:0 "Unemployment on the Rise"
 norway.105.d:0 "Over the past months, more businesses has either gone bankrupt or been forced to cut down on the number of employees as the economic situation has taken a turn for the worse. This has led to increasing unemployment, especially for workers and farmers. Many of those whom are left without a job are now dependant on financial and nutritional support food from the state to survive. Without jobs, many people now have a better reason than ever to be scared of the radpidly approaching winter.\n\nHow the political landscape will be affected remains to be seen, however it is certain that the dire economic sitation has taken it's toll on our citizens."
 norway.105.a:0 "We need solutions, not problems..."
 norway.106.t:0 "Decline of NKP"
 norway.106.d:0 "As Arbeiderpartiet has become more and more moderate, the radical left-wing in Norway has slowly dwindled away. This meant that the foundation of what Norges Kommunistiske Parti, shortened NKP, is built upon is gone and thus the communist has lost a substanstial amount of public support. A communist Norway seems unlikely at the moment."
 norway.106.a:0 "Goodbye Stalin"
 norway.107.t:0 "Internal Unrest Within NS"
 norway.107.d:0 "After the dissapoint result in the 1936 elections, many members of NS has begun criticizing the \"Fører\" of Nasjonal Samling, Vidkun Quisling. Vidkun Quisling has only gotten more and more power over the party over the years, and many members has now left the party in protest of what Nasjonal Samling has become."
 norway.107.a:0 "Will this be the end of fascism in Norway?"
 norway.108.t:0 "Hambro Critizices Military Cuts"
 norway.108.d:0 "The party leader from Høire, Carl Joachim Hambro, has begun critizicing the government as the military budget has been kept at an all-time low. Hambro claims that lack of a proper and modern military may lead to a catastrophe if we are to be attacked. The sitting government has countered by claiming that Norway has larger issues than it's military right now, and that there is no threat to norwegian independence in the upcoming years."
 norway.108.a:0 "We have bigger worries than the military"
 norway.109.t:0 "Hambro Praises Increased Military Spendings"
 norway.109.d:0 "The party leader of Høire, Carl Joachim Hambro, applauded the increase focus on the military. He claims it would be necessary if Norway wants to attain its' independence for the future."
 norway.109.a:0 "We hope it is the right choice..."
 norway.110.t:0 "Forsvarsordningen av 1933"
 norway.110.d:0 "The commision that we assigned to give us a report on our military and foreign policy has finally come to a conclusion. Although radicalism is on the rise on some european countries, the chance for Norway to be swept up in a revolution or civil war seems unlikely. Further more the commision found out that there is little need for a military, seeing as there are few nations that remains a threat to our independence. The international neutrality laws that Norway has embraced will protect it from any attack from any foreign nation. Surely, the next decade in european history will likely be known for it's peacefulness."
 norway.110.a:0 "Peaceful times ahead..."
 norway.111.t:0 "Decline of Frisinnede Venstre"
 norway.111.d:0 "Frisinnede Venstre was a political party that was created in 1909 by conservative members of the liberal party of Venstre. The party had often similar views as the conservative party Høire and chose multiple times to form a government together with them. At their height they had 26 out of 123 seats in Stortinget. However their continued cooperation with Høire eventually made the differences between the two parties modest. By now, much of the voting-base of Frisinnede Venstre has began voting for Høire instead."
 norway.111.a:0 "Interesting"
 norway.112.t:0 "Nationalists Clash with Communists"
 norway.112.d:0 "Today 200 nationalists tried to storm a communist meeting at Forum with the intent of ending the so-called red rule at the University of Oslo. The nationalists were met by worker-guards and didn't manage to enter the building, and several people were wounded in the fighting outside. After police arrived and the fighting died down, the nationalists walked to Stortinget and paraded with nazi-salutes. The clash started heavy debate within the media, pro-socialist papers complained about the cruelty and the violence from the nationalists. Meanwhile the conservative papers acclaimed that the violence was minimal."
 norway.112.a:0 "Not good."
 norway.113.t:0 "Hovedavtalen av 1935"
 norway.113.d:0 "Today the national trade union center (LO) and the largest employers organization (NHO) agreed upon a collective labour agreement. While the agreement itself is quite moderate, it lays the foundation for later cooperation between the employeers, represented by NHO, and the trade union, represented by LO. In the long run this will increase the worker conditions, increase representation aswell as create a more creative and happy workplace."
 norway.113.a:0 "Great!"
 norway.114.t:0 "Death of Queen Maud"
 norway.114.d:0 "Today the tragic news reached us that Queen Maud, spouse of King Haakon VII, died today in London. In the week before she became increasingly ill and was placed in a nursing home, and after a successful surgery she unexpectedly passed away thanks to heart failure on 20. November. Her body is expected to be returned to Norway soon with the burial taking place as soon as possible."
 norway.114.a:0 "A Sad Day..."
 norway.115.t:0 "The Birth of a Prince"
 norway.115.d:0 "Today excellent news arrived from the Royal House. For the first time in 567 years, a norwegian prince, named Harald, has been born. Harald is the third child, and the only son, from crown prince Olav and princess Märtha of Sweden."
 norway.115.a:0 "Love live the king"
 norway.116.t:0 "Norway Annexes Queen Maud's Land"
 norway.116.d:0 "Today the we formally claimed a region in the Antartica. This comes much as a reaction for the german interests in the region; where they seek to establish a colony for themselves. This colony could however be an useful base for not only operations in the ice sheets, but also whaling, research and braggings rights."
 norway.116.a:0 "We control the ice sheets now!"
 norway.117.t:0 "General Laake Resignation?"
 norway.117.d:0 "As enemy forces has occupied central regions in Østlandet, military confusion and anger is spreading throughout the army. General Laake, who has for years insisted that it would be necessary to expand the military budget, offered today to deliver in their resignation. If we are to accept it, we may have an easier time to reorganize our army, however if we do, we still lose an efficient general.\n\nWill we allow him to resign?"
 norway.117.a:0 "He will resign!"
 norway.117.b:0 "This is no time for resignation!"
 norway.118.t:0 "Quisling's Radio Speech"
 norway.118.d:0 "Today at [GetDateText] Vidkun Quisling, the founder and leader of the fascist Nasjonal Samling, announced a coup d'etat against the norwegian government during a radio speech. In the speech, which was broadcasted to the entire nation, he claimed that the norwegian government was no longer fit for its' duties, and he further claimed that it was Nasjonal Samling's duty to and right to take over the goverment to secure Norway's interests.\n\nThe speech, however, ended up being much of a failure. Most norwegians doesn't recognize his radio speech as a legitimate form of a taking power, and instead view him now as a traitor who'd rather be allied with the invaders."
 norway.118.a:0 "He's making a fool out of himself."
 #External
 norway_external.1.t:0 "Norway wants to buy naval bombers from us"
 norway_external.1.d:0 "The Norwegian ambassador has approached us with an offer of buying a good couple dozen of our newest Naval Bombers, the money they offer is nothing to scoff at but as always things are not so simple. The military might be angered by this display of opportunism, not to mention the public taking ill at our perceived whoring out of Italy's military with war on the horizon. Of course such negatives could be spun into positives, the military might be pleased by pulling the Norwegians slightly closer to us and the public might be pleased by us offering additional protection to our Norwegian brothers and sisters.\n\nPolitics are as always a gamblers game."
 norway_external.1.a:0 "We won't deny a good deal."
 norway_external.1.b:0 "Maybe try the Brits."
 norway_external.1.c:0 "We don't have anything to offer them"
 norway_external.2.t:0 "Italy accepts"
 norway_external.2.d:0 "Italy has accepted our request of buying their top of the line Bombers. All we have to do now is write the checks and the machinery will start flowing. While our air force might see this as somewhat of an embarassment, given our industrial capabilities and expertise the purchase will give us much needed equipment for the coming war."
 norway_external.2.a:0 "Excellent!"
 norway_external.3.t:0 "Italy declines"
 norway_external.3.d:0 "Italy has rejected our offer for buying their newest Naval Bombers from them, while some in the military seem oddly pleased with this development, this means we have to look for another country for purchase as manufacturing our own is simply out of question at the moment."
 norway_external.3.a:0 "Maybe the Spaniards?"
 norway_external.4.t:0 "Norwegian payment ends"
 norway_external.4.d:0 "The payment the norwegians gave for the naval bombers just ended."
 norway_external.4.a:0 "Oh well"
