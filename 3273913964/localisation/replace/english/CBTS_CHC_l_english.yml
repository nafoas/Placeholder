 #events
 chc_revolt.1.t:0 "War for Independence!"
 chc_revolt.1.d:0 "We have thrown off the shackles of [From.GetAdjective] Imperialism, but [From.GetNameDef] will not let us go without a fight! We have fifteen thousand fighters with us, ready to defend their fatherland! Furthermore, any nation that seeks to conquer the Caucasus might try and fight us as well, so we must be ready!"
 chc_revolt.1.a:0 "To arms!"
 chc_revolt.2.t:0 "Chechens Declare Independence"
 chc_revolt.2.d:0 "Chechen Revolutionaries led by Hasan Khant Israil have declared independence from their [From.From.GetAdjective] overlords, and are now fighting a Guerilla war against them. However, as we are fighting the same enemy, we may have to infringe on Chechen territory to properly conquer the oil in the region. Is this invasion worth our time?"
 chc_revolt.2.a:0 "We must have Grozny Oil!"
 chc_revolt.2.b:0 "This is not worth our time or resources."
 chc_revolt.3.t:0 "Peace with Chechnya"
 chc_revolt.3.d:0 "We have failed to seize Chechnya from the rebels, and thus a tentative ceasefire has been established. The Chechens now have peace."
 chc_revolt.3.a:0 "They have achieved their dream."
 #2rcw
 chc_civil_war.1.t:0 "Chechnya's Reawakening"
 chc_civil_war.1.d:0 "The Chechen and Ingushetian peoples have been oppressed by the Russians for far too long. Despite their claims of equality, the Soviets send Russians to rule us, and use our labour to feed Moscow instead of those who provided it! It is clear that grand action has become necessary to provide the North Caucasians with a country of their own. Therefore, with the help of our Brothers in Dagestan, we will throw off the Russian shackles, and break the Imperialist Chains!"
 chc_civil_war.1.a:0 "For Unity and Progress!"
 #internal
 chc_internal.1.t:0 "Order comes to Chechnya"
 chc_internal.1.d:0 "With the establishment of a provisional bureaucratic office, we have slowly been restoring order to the country. Control in Shuyta was quickly established, and we've used it as a base to establish offices in the rest of the country. Those most of these offices have very little ability to carry out our policies, they still provide an important symbol of stability to the people."
 chc_internal.1.a:0 "Stability is Paramount."
 chc_internal.2.t:0 "Decollectivization Controversy"
 chc_internal.2.d:0 "Our decollectivization efforts have been going well so far, however, they are not without controversy. Today, Farmers Maskhadov and Avtorzhanov have been arguing with their local bureaucratic offices about the distribution of land. Currently, the office has given a slightly larger share of territory to Avtorzhanov due to certain geographical features, while Maskhadov has not been happy about this. He wants his equitable share of land. Who should we side with?"
 chc_internal.2.a:0 "Maskhadov should have his fair share."
 chc_internal.2.b:0 "Avtorzhanov can keep this land. It is not very fertile anyways."
 #decisions
 Chechen_Revolt_Cat:0 "Independence War"
 CHC_survival_mission:0 "Repel the Imperialists!"
 CHC_survival_mission_desc:0 "If we can survive for one-and-a-half years, we can enjoy peace and independence! If we can seize Dagestan and Kizlyar, we might be able to keep those as well..."
 #focuses
 CHC_Independence_War:0 "Chechen War for Independence"
 chc_focus_revolt:0 "Chechen Revolt Focus Tree"
 CHC_Revolt_Start:0 "Chechen War for Independence"
 CHC_Revolt_Start_desc:0 "The time has come to throw off the shackles of the Bolshevik Imperialists and other foreign oppressors. The Future of Chechnya will be one of independence and freedom!"
 CHC_Revolt_Military_Affairs:0 "Create a General Staff"
 CHC_Revolt_Military_Affairs_desc:0 "A General Staff led by Maribek Sheripov is vital to the survivial of Chechnya."
 CHC_Revolt_Political_Affairs:0 "Provisional Ministry for Political Affairs"
 CHC_Revolt_Political_Affairs_desc:0 "The Provisional Government will be lead by Hasan Khant Israil as Head of State, and his brother Hussein will be Head of Government for the time being. Once we have secured independence, we can decide the actual form of our government."
 CHC_Revolt_Economic_Affairs:0 "Ministry of Economic Affairs"
 CHC_Revolt_Economic_Affairs_desc:0 "Although Chechnya barely has any industry to speak of, if we want to develop our country to western standards, we must have bureaucracy ready to regulate and subsidize."
 CHC_Revolt_Guerilla_Training:0 "Guerilla Training"
 CHC_Revolt_Guerilla_Training_desc:0 "Conventional Warfare will not work against our foes. They number too greatly for us to fight directly. Our army will be a hidden guerilla army, winning using cunning rather than strength."
 CHC_Revolt_Chain_of_Command:0 "Establish a Chain of Command"
 CHC_Revolt_Chain_of_Command_desc:0 "To unite our efforts agains the enemy, our units must have a clear chain of command."
 CHC_Revolt_Decollectivization:0 "Decollectivization"
 CHC_Revolt_Decollectivization_desc:0 "Bolshevik Collectivization has wreaked havoc on our lands. To fix this, land ownership will be immediately transfered to the households who work on it, and will be apportioned evenly between them."
 CHC_Revolt_Convert_Manufactory:0 "Convert Manufactories"
 CHC_Revolt_Convert_Manufactory_desc:0 "Our nation needs to be able to produce its own weapons to ensure our soldiers can fight!"
 CHC_Revolt_Cavalry:0 "Cavalry Divisions"
 CHC_Revolt_Cavalry_desc:0 "The creation of a cavalry division will substantially improve our fighting capabilities."
 CHC_cav_tt:0 "§GA Cavalry Division will be raised in Shatoi.§!\n"
 CHC_dag_tt:0 "§GTwo Militia Divisions will be raised in Makhachkala.§!\n"
 CHC_Revolt_Oath:0 "Oath to Independence"
 CHC_Revolt_Oath_desc:0 "Our soldiers will not swear an oath to the leader or the nation, but the independence of the people!"
 CHC_recognition:0 "Responded to our diplomacy"
 CHC_Revolt_Foreign_Recognition:0 "Push for Recognition"
 CHC_Revolt_Foreign_Recognition_desc:0 "We must strive to open diplomatic contacts with other nations, as their support will be vital to our nation's survival."
 CHC_Revolt_Doctrine_Effort:0 "Doctrine Effort"
 CHC_Revolt_Doctrine_Effort_desc:0 "Now that our military has been somewhat organized, we can now embark on the development of new tactics."
 CHC_Revolt_Dagestan_Units:0 "Dagestani Militia"
 CHC_Revolt_Dagestan_Units_desc:0 "The Dagestanis are enthusiastic about fighting the oppressors, so we can create militia divisions staffed by and commanded by Dagestanis."
 CHC_Revolt_First_Pilots:0 "Establish an Air Force"
 CHC_Revolt_First_Pilots_desc:0 "A small air force will allow us to better protect our skies from bombers!"
 CHC_Revolt_Recognize_Officers:0 "Promote Officers"
 CHC_Revolt_Recognize_Officers_desc:0 "Some militiamen have been found to be outstanding commanders. We should promote them to officers."
 CHC_Revolt_Defence_Industry:0 "Establish a Defence Industry"
 CHC_Revolt_Defence_Industry_desc:0 "We must have a steady supply of weapons, no matter how slow!"
 CHC_Revolt_Open_for_Business:0 "Open for Business!"
 CHC_Revolt_Open_for_Business_desc:0 "We cannot establish an industry without foreign investors. Therefore, we must open up the country to foreign firms."
 CHC_Revolt_Import_Foreign_Weapons:0 "Import Foreign Weapons"
 CHC_Revolt_Import_Foreign_Weapons_desc:0 "We can likely arrange for weapons to be smuggled accross the border to be used in the fight against Socialism and Imperialism."
 CHC_Revolt_Improve_Oil:0 "Improve Oil Fields"
 CHC_Revolt_Improve_Oil_desc:0 "The Solzha-Giala Oil Fields must be improved to attract more foreign investors."
 CHC_Private_Initiative:0 "Encourage Private Initiative"
 CHC_Private_Initiative_desc:0 "Our Economy should lean towards a free market, to allow the Chechens and Ingushetians to improve themselves!"
 CHC_Mixed_Systems:0 "A Mixed Economy"
 CHC_Mixed_Systems_desc:0 "Key industries in Chechnya should be owned by the state to ensure that we can guide the country's development."
 CHC_Lower_Trade_Barriers:0 "Free Trade"
 CHC_Lower_Trade_Barriers_desc:0 "Since we want to be able to get resources into Chechnya, we must lower any tariffs."
 CHC_Raise_Trade_Barriers:0 "Protectionism"
 CHC_Raise_Trade_Barriers_desc:0 "If we were to lower tariffs, then the Chechen would not be able to develop their own industries as they would be flooded with foreign products!"