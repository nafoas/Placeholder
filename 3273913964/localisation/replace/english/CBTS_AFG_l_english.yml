 ### Events ###
 
 afg_internal.1.t:0 "The King has been shot!"
 afg_internal.1.d:0 "During a royal visit at a graduation ceremony in a Kabul High School, an ethnic Hazara called Abdul Khaliq shot the King, instantly killing him. The murderer was apprehended and tortured before being executed by quartering in Situ, along with relatives such as his father and uncle. The government then used this opportunity to arrest other potential rivals and execute them on charges of plotting the assassination of King Nadir."
 afg_internal.1.a:0 "The King has died, long live Mohammed Zahir Shah!"
 
