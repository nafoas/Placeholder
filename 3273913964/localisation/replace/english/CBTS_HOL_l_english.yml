#National Spirits
 HOL_pillarized_society:0 "Pillarized Society"
 HOL_pillarized_society_desc:0 "During the late 1800's, Dutch Religious life was becoming increasingly polarized. Calvinists, Catholics, and Secularists all competed for influence, which threatened to destroy the stability of the nation. Abraham Kuyper, famous Neo-Calvinist theologian and politician designed a system of \"Pillarization\", where all of society was grouped into one of the three Pillars, effectively making the Netherlands a state of Organized Minorities. The secular Pillar eventually split into Liberal and Socialist Pillars, only serving to complicate matters further.\n\nEach Pillar had its own set of organizations, such as churches, schools, sport clubs, and labour unions. Pillarizaiton itself was recognized in 1917 when universal male suffrage was granted. Furthermore, in 1930, even radios became pillarized. This has served to effectively lock down Dutch socio-political life."
 HOL_outdated_military:0 "Outdated Military"
 HOL_outdated_military_desc:0 "Although we escaped the Battles of the Great War (though not its economic effects), our policy of Neutrality has come with a cost. Our last major war was in the 1760's, and as such our military has long since been outdated. If we are to have a respectable European Army, we must begin modernization."
 HOL_great_depression:0 "Great Depression"
 HOL_great_depression_desc:0 "The effects of the Great Depression were managable until 1931. That year, mass unemployment began and poverty became rampant. Recovery is nowhere in sight, but there are greater calls to drop the Gold Standard." Industrial output has dropped significantly, and lack of Government Support is causing unrest in the provinces..."
