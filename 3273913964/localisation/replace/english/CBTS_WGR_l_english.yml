l_english:
 WGR_invite_french_businesses:0 "Invite French Businesses"
 WGR_invite_french_businesses_desc:0 "Now that the French Government has allowed us to reach out to French Firms, we can get down to buisness."
 WGR_invite_total:0 "Invite Total S.A."
 WGR_invite_total_desc:0 "We should invite Total, a chemical production company, to establish an oil-refinary facility in our country."
 WGR_invite_lafarge:0 "Invite Lafarge S.A."
 WGR_invite_lafarge_desc:0 "Lafarge is a French construction company. Bringing a division of their offices to Germany would provide unemployed construction workers with new job opportunities."
 WGR_invite_montagut:0 "Invite Montagut"
 WGR_invite_montagut_desc:0 "Montagut is a French clothing firm. A Montagut factory in Germany would increase the amount and variety of goods available to the German consumer."
 WGR_invite_dassault:0 "Invite Renault"
 WGR_invite_dassault_desc:0 "Renault is a French automobile manufacturer. By bringing French cars to the German Market, we can stimulate competition, thus driving up both the quality and quantity of automobiles in Germany."
 WGR_intervention_cat:0 "Foreign Intervention"
 WGR_intervention_cat_desc:0 "Nations who believe in Radical Ideologies are threatening our border! We need to make sure that they are aligned with us!"
 wgr_intervene:0 "Intervention in [From.GetNameDef]"
 wgr_intervene_desc:0 "The political situation in [From.GetNameDef] is currently contrary to our own security and interests. We must invade them and force them to end their radicalism!"
 WGR_economic_crisis:0 "The Economic Crisis"
 WGR_economic_crisis_desc:0 "The Economic Crisis Plaguing Germany must be dealt with, as the German people are suffering from inflation and poverty."
 WGR_economic_crisis_solve:0 "Declare the Crisis Over!"
 WGR_economic_crisis_solve_desc:0 "It seems as though our crisis is over. We have institutued measures that would help alliviate the negative effects, and we seem to be going back to normal."
