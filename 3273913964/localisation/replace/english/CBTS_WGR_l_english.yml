 WGR_foreign_investors_law:0 "§GInvite Foreign Investors§!"
 WGR_catholic_schools_law:0 "§gSupport Catholic Schools§!"
 WGR_catholic_schools_law_desc:0 "Note: no other parties will support this law, and you cannot negotiate for it."
 WGR_dissolve_prussia_law:0 "§GDissolve Prussia§!"
 WGR_dissolve_prussia_law_desc:0 "Note: you cannot negotiate with other parties for this law."
 
 WGR_lower_small_business_tax_law:0 "§YLower taxes on small businesses.§!"
 
 WGR_spd_support_pro_government:0 "Amnesty for Paramilitaries"
 WGR_spd_support_pro_government_desc:0 "Offering amnesty to paramilitary groups and their members would help increase the reputation of the government."
 WGR_spd_lower_voting_age_law:0 "§GLower the Voting Age§!"
 WGR_spd_lower_voting_age_law_desc:0 "We should lower the voting age to 18. This would get our government many more votes and improve our democracy!"
 WGR_spd_fund_education_law:0 "§CFund Education"
 WGR_spd_fund_education_law_desc:0 "A Permanent Funding Increase on Eduation would improve the People's quality of life."
 WGR_spd_farmers_councils_laws:0 "§CHousing Projects§!"
 WGR_spd_farmers_councils_laws_desc:0 "Housing Projects would allow us to better support our people."
 WGR_spd_increase_minimum_wage:0 "§CIncrease the minimum wage§!"
 WGR_spd_increase_minimum_wage_desc:0 "A higher minimum wage means a higher quality of life."
 WGR_spd_national_parks_law:0 "§GExpand National Parks§!"
 WGR_spd_national_parks_law_desc:0 "We need more national parks!"
 WGR_spd_cultural_ministry_law:0 "§CEstablish a Cultural Ministry§!"
 WGR_spd_cultural_ministry_law_desc:0 "A Cultural Ministry would help patronize struggling artists, regulate tourism, and manage our museums."
 WGR_spd_full_equality_law:0 "§GThe Zinn Act§!"
 WGR_spd_full_equality_law_desc:0 "The Zinn Act proposes to make Social, Political, and Economic equality available to all peoples, regardless of race, ethnicity, or gender."
 WGR_spd_property_rights_law:0 "§GDefend Property Rights§!"
 WGR_spd_property_rights_law_desc:0 "Small Landowners need to have their rights defended. What we need to figure out is, how many rights do they get?"
 WGR_spd_environmentalism_law:0 "§GEnvironmentalist Measures§!"
 WGR_spd_environmentalism_law_desc:0 "We need to make sure that nature is protected from industrial waste."
 WGR_spd_abolish_fascism:0 "§GAbolish Fascism§!"
 WGR_spd_abolish_fascism_desc:0 "Fascism is a force counter to the People! It must be removed!"
 WGR_spd_soldier_council_law:0 "Establish Soldiers' Commitees"
 WGR_spd_soldier_council_law_desc:0 "We should have soldiers' \"councils\" that are subject to the Reichstag to give them a feeling of autonomy."
 WGR_spd_female_soldier_law:0 "§GAllow Women on the Front Line§!"
 WGR_spd_female_soldier_law_desc:0 "Allowing Women to serve as infantry would help make our nation be more egalitarian."
 WGR_spd_women_in_the_workforce_law:0 "§GWomen in the Workforce§!"
 WGR_spd_women_in_the_workforce_law_desc:0 "We must make sure that women have the same working rights as men do."
 WGR_spd_nationalize_estates_law:0 "§CNationalize Large Estates§!"
 WGR_spd_nationalize_estates_law_desc:0 "Large Estates should be made into Museums for our people!"
 WGR_spd_nationalize_key_industries_law:0 "§CNationalize Key Industries§!"
 WGR_spd_nationalize_key_industries_law_desc:0 "Important Industries should come under the administration of the State."
 WGR_spd_decrease_military_spending_law:0 "Decrease Military Spending"
 WGR_spd_decrease_military_spending_law_desc:0 "We should decrease military spending in order to focus on other projects."
 WGR_spd_cooperation_with_business_law:0 "§YCooperation with Businesses§!"
 WGR_spd_cooperation_with_business_law_desc:0 "Entering into a state of cooperation with our businesses would lead to greater economic efficiency."
 WGR_spd_more_for_the_people_law:0 "§CMore for the People§!"
 WGR_spd_more_for_the_people_law_desc:0 "More welfare for the people would help improve German standards of living."
 WGR_spd_tradition_increase_welfare_law:0 "§CIncrease Welfare Further§!"
 WGR_spd_tradition_increase_welfare_law_desc:0 "Further Increasing Welfare would help ensure that the Citizens could at least live normally."
 WGR_spd_kaiser_law:0 "§GThe Hohenzollern Act§!"
 WGR_spd_kaiser_law_desc:0 "The Law for the Barring of persons claiming Titles of Nobility or Royalty of Germany from the German Nation, or the Hohenzollern act for short, is a law meant to force all German Nobles and (former) Royals to give up claims to their titles or risk losing citizenship."
 WGR_spd_conscription_law:0 "End Conscription"
 WGR_spd_conscription_law_desc:0 "Ending conscription would mean our people can focus on working."
 WGR_spd_lower_insurance_rates_law:0 "§CEstablish Price Floors on Insurance§!"
 WGR_spd_lower_insurance_rates_law_desc:0 "Establishing a cap on the price of insurance can ensure that insurance companies can assure financial protection for their customers."
 WGR_spd_regulate_logging_law:0 "§CRegulate the Logging Industry§!"
 WGR_spd_regulate_logging_law_desc:0 "We need to put some regulations on the Logging industry to ensure environmental protections and safety for the workers."
 WGR_spd_fund_reichsbahn_railservice_law:0 "§CIncrease Reichsbahn Funding§!"
 WGR_spd_fund_reichsbahn_railservice_law_desc:0 "Now that the economic crisis is over, we can increase funding for the Reichsbahn."
 WGR_spd_regulate_shipping_law:0 "§CRegulate the Shipping Industry§!"
 WGR_spd_regulate_shipping_law_desc:0 "Regulating Shipping Standards would go a long way to ensure quality and safety in the industry."
 WGR_spd_nationalize_steel_industry_law:0 "§CNationalize the Steel Industry§!"
 WGR_spd_nationalize_steel_industry_law_desc:0 "We should nationalize the steel industry in order to better control the market."
 WGR_spd_close_tax_loopholes_law:0 "§CClose Tax Loopholes§!"
 WGR_spd_close_tax_loopholes_law_desc:0 "We need to close tax loopholes to make sure everyone pays their fair share."
 WGR_spd_brodcasting_service_law:0 "§CFound the Volksrundfunkdienst§!"
 WGR_spd_brodcasting_service_law_desc:0 "We need a People's Broadcasting service to better regulate and manage the airwaves."
 WGR_spd_increase_quota_on_farmers_law:0 "§CIncrease Quotas On Farmers§!"
 WGR_spd_increase_quota_on_farmers_law_desc:0 "With increased Demand, we need to increase the quotas on our farmers."
 WGR_spd_church_tax_law:0 "§GEstablish a Tax on the Church§!"
 WGR_spd_church_tax_law_desc:0 "We need to establish a tax on the church in order to stem the flow of opiates to the masses!"
 WGR_dstp_lower_taxes_law:0 "§BLower Taxes§!"
 WGR_dstp_lower_taxes_law_desc:0 "We need to lower taxes to improve the purchasing power of the German People!"
 WGR_dstp_decrease_welfare_spending_law:0 "§BDecrease Welfare Spending§!"
 WGR_dstp_decrease_welfare_spending_law_desc:0 "Lower welfare spending would balance the budget."
 WGR_dvp_lower_welfare_law:0 "§BDecrease Welfare Spending§!"
 WGR_dvp_lower_welfare_law_desc:0 "Lower welfare spending would balance the budget."
 WGR_dstp_adjust_tax_brackets_law:0 "§GAdjust Tax Brackets§!"
 WGR_dstp_adjust_tax_brackets_law_desc:0 "We need to make tax brackets more fair to the people!"
 WGR_dstp_social_security_law:0 "§CSocial Security§!"
 WGR_dstp_social_security_law_desc:0 "We need to reform our social security system to be in line with Liberal policies, instead of socialist ones."
 WGR_dstp_private_property_law:0 "§GProtect Private Property§!"
 WGR_dstp_private_property_law_desc:0 "We should protect private property from the cruel clutches of Communism!"
 WGR_dstp_support_universities_law:0 "§CSupport Universities§!"
 WGR_dstp_support_universities_law_desc:0 "Education is the key to success, so we need to make sure that the people get the best education possible."
 WGR_dstp_regulations_law:0 "§CEconomic Regulations§!"
 WGR_dstp_regulations_law_desc:0 "We need some economic regulations to make sure that workers are being treated fairly and the consumers are not being cheated."
 WGR_dstp_social_equality_law:0 "§GSocial Equality§!"
 WGR_dstp_social_equality_law_desc:0 "A Social Equality Law would help the reputation of the government."
 WGR_progressive_taxes_law:0 "§CThe Weber Tax Code§!"
 WGR_progressive_taxes_law_desc:0 "Proposed by Economic Minister Alfred Weber, a new tax code that ensured that the Rich paid more than the Poor would go a long way towards social harmony in Germany."
 WGR_lower_trade_barriers_law:0 "§GLower Trade Barriers§!"
 WGR_lower_trade_barriers_law_desc:0 "Lowered Tariffs would lead to a stronger economy!"
 WGR_export_focus_law:0 "§GIncrease Export Focus§!"
 WGR_export_focus_law_desc:0 "Increasing incentives for our firms to export goods would lead to greater German influence on foreign economies."
 WGR_dstp_housing_law:0 "§GCreate a Housing Commission§!"
 WGR_dstp_housing_law_desc:0 "A housing commission would make sure that people can access cheap and high-quality homes to keep themselves off the streets."
 WGR_dstp_competition_law:0 "§GEnsure Healthy Competition§!"
 WGR_dstp_competition_law_desc:0 "We need a new set of regulations to ensure that no monopolies can form in our economy."
 WGR_dstp_balanced_budget_law:0 "§BBalance the Budget§!"
 WGR_dstp_balanced_budget_law_desc:0 "A Balanced Budget would ensure that we remain out of debt."
 WGR_dstp_privitization_law:0 "§BCreate a Privitization Commission§!"
 WGR_dstp_privitization_law_desc:0 "Privitizing some State assets would lessen the burden on the government."
 WGR_dstp_minimum_wage_law:0 "§CIncrease the Minimum Wage§!"
 WGR_dstp_minimum_wage_law_desc:0 "We should increase the minimum wage to support the working people of Germany!"
 WGR_dstp_telecom_law:0 "§GEncourage the Telecommunications Industry§!"
 WGR_dstp_telecom_law_desc:0 "Giving incentives for research in telecommunications would improve our technology."
 WGR_dstp_price_law:0 "§BLift Price Controls§!"
 WGR_dstp_price_law_desc:0 "We need to lift price controls to allow the German economy to grow!"
 WGR_dstp_farming_regulations_law:0 "§CThe Pomernland Regulations§!"
 WGR_dstp_farming_regulations_law_desc:0 "Called such because the politician who introduced these agricultural regulations is a Pommeranian, this set of laws would ensure that the consumers are not being given rotten or cheaply produced produce."
 WGR_dstp_mining_regulations_law:0 "§CThe Safe Mining Act§!"
 WGR_dstp_mining_regulations_law_desc:0 "This act would ensure that mining operations in Germany would be safe and produce only the highest quality ore possible."
 WGR_dstp_transportation_regulations_law:0 "§CTransportation Regulations§!"
 WGR_dstp_transportation_regulations_law_desc:0 "Making sure that transporting goods and people across Germany is safe would require a new set of legislation."
 WGR_dstp_industrial_safety_law:0 "§CIndustrial Safety Measures§!"
 WGR_dstp_industrial_safety_law_desc:0 "Establishing required safety measures will ensure that less workers get mangled up by inudstrial machinery."
 WGR_dstp_improve_womens_rights_law:0 "§GSupport Women's Rights§!"
 WGR_dstp_improve_womens_rights_law_desc:0 "Supporting Women's rights would allow women to make more money (and thus contribute to the economy), as well as hold higher positions."
 WGR_dstp_german_historical_society_law:0 "§GCreate the German Historical Society§!"
 WGR_dstp_german_historical_society_law_desc:0 "The Deutsche Historiche Gesellschaft would be an organization that managed historical museums, and preserved items of historical interest."
 WGR_dstp_anti_corruption_law:0 "§GAnti-Corruption Measures§!"
 WGR_dstp_anti_corruption_law_desc:0 "We need to crack down on civil servants taking bribes and embezzeling money for their own benefit."
 WGR_dstp_simplify_bureaucracy_law:0 "§GSimplify the Bureaucracy§!"
 WGR_dstp_simplify_bureaucracy_law_desc:0 "The German Bureaucracy is too complicated. We need to cut down on forms of red tape and focus instead on getting the task completed."
 WGR_dstp_subsidize_fishing_law:0 "Subsidize the Fishing Industry"
 WGR_dstp_subsidize_fishing_law_desc:0 "Subsiziding the Fishing Industry would mean cheaper food for the people!"
 WGR_dvp_ban_communism_law:0 "§gBan Communism§!"
 WGR_dvp_ban_communism_law_desc:0 "Communism is a destructive force that must be banned before it takes over Germany!"
 WGR_dvp_agrarian_subsidies_law:0 "§CSubsidies for the Agrarian Industry§!"
 WGR_dvp_agrarian_subsidies_law_desc:0 "Some subsidies for the agrarian industry would help make sure that the German people can actually eat."
 WGR_dvp_raise_voting_age_law:0 "§gRaise the Voting Age§!"
 WGR_dvp_raise_voting_age_law_desc:0 "Who let these young whippersnappers vote? They should be busy training for war, not voting. Voting is something for us refined gentlemen."
 WGR_dvp_increase_police_presence_law:0 "§gIncrease Police Presence§!"
 WGR_dvp_increase_police_presence_law_desc:0 "We need more police on the streets to fight the Communists!"
 WGR_dvp_abolish_communism_law:0 "§gAbolish Communism§!"
 WGR_dvp_abolish_communism_law_desc:0 "While Communism is already banned, we need to begin more measures to fight the Bolsheviks!"
 WGR_dvp_free_trade_law:0 "§BFree Trade Measures§!"
 WGR_dvp_free_trade_law_desc:0 "We need to lower tariffs to improve our economy."
 WGR_dvp_support_industrials_law:0 "§gSupport Industrialists§!"
 WGR_dvp_support_industrials_law_desc:0 "The Industrialists in this nation need our support to grow the economy."
 WGR_dvp_end_the_welfare_state_law:0 "§BEnd the Welfare State§!"
 WGR_dvp_end_the_welfare_state_law_desc:0 "The Welfare State makes us look weak. We must destroy it!"
 WGR_dvp_less_exports_law:0 "§gDiscourage Exports§!"
 WGR_dvp_less_exports_law_desc:0 "We need to discourage our companies from exporting. This will improve the domestic economy."
 WGR_dvp_support_small_businesses_law:0 "§GSupport Small Businesses§!"
 WGR_dvp_support_small_businesses_law_desc:0 "Even though we support large buisnesses, we also need to support small ones."
 WGR_dvp_protect_minorities_law:0 "§GProtect Minority Establishments§!"
 WGR_dvp_protect_minorities_law_desc:0 "We need to protect minority establishments, for if they work hard (and they will), then they will also benefit the economy."
 WGR_dvp_womens_rights_law:0 "§GSupport Women's Rights§!"
 WGR_dvp_womens_rights_law:0 "If women could earn as much as men do, they would contribute more to the economy."
 WGR_dvp_lower_business_tax_law:0 "§BLower the Corporate Tax§!"
 WGR_dvp_lower_business_tax_law_desc:0 "Corporate Tax Rates are too high. We need to lower them."
 WGR_dvp_tax_breaks_for_construction_law:0 "§BConstruction Tax Breaks§!"
 WGR_dvp_tax_breaks_for_construction_law_desc:0 "Companies that build buildings for the state or the people will be rewarded with tax breaks."
 WGR_dvp_women_at_work_law:0 "§GWomen at Work§!"
 WGR_dvp_women_at_work_law_desc:0 "Don't you hear the thunder? You better run, you better take cover!"
 WGR_dvp_deregulate_mining_law:0 "§gDe-Regulate Mining§!"
 WGR_dvp_deregulate_mining_law_desc:0 "We must end regulations on mining practices to prevent our mining firms from going out of business."
 WGR_dvp_deregulate_farming_law:0 "§gDe-Regulate Farming§!"
 WGR_dvp_deregulate_farming_law_desc:0 "Regulations on agriculture prevent us from getting food to the German People! I mean, who cares how good quality it is."
 WGR_dvp_ease_of_establishment_law:0 "§GThe Ease of Establishment Act§!"
 WGR_dvp_ease_of_establishment_law_desc:0 "We need to make it easier for the people to establish businesses and industries."
 WGR_dvp_simplify_tax_code_law:0 "§GSimplify the Tax Code§!"
 WGR_dvp_simplify_tax_code_law_desc:0 "Our tax code is too complicated. We should streamline it so bureaucratic processes are faster."
 WGR_dvp_decrease_womens_rights_law:0 "§gDecrease the Status of Women§!"
 WGR_dvp_decrease_womens_rights_law_desc:0 "Allowing women into new progressive roles would increase the popularity of the Leftist parties. We need to prevent this."
 WGR_dvp_return_of_the_kaiser_law:0 "§gThe Return of the Monarchy§!"
 WGR_dvp_return_of_the_kaiser_law_desc:0 "Now that Hindenburg is dead, we are able to recognize the true ruler of all Germany - The Kaiser! However, as a compromise, we will be putting Crown Prince Wilhelm on the throne instead of his father."
 WGR_zentrum_end_prussianism_law:0 "§GEnd Prussian Dominance§!"
 WGR_zentrum_end_prussianism_law_desc:0 "Prussia caused Germany's downfall in the last war, and we must destroy Prussian Dominance to prevent another downfall!"
 WGR_zentrum_integrate_paramilitary_law:0 "§RIntegrate the Paramilitaries§!"
 WGR_zentrum_integrate_paramilitary_law_desc:0 "We should integrate the paramilitaries into the military. It would provide us with some defense while appeasing them."
 WGR_zentrum_dissolve_prussia_law:0 "§GDissolve Prussia§!"
 WGR_zentrum_dissolve_prussia_law_desc:0 "We must rearrange the states so that Prussia can never come into dominance again!"
 WGR_zentrum_catholic_education_law:0 "§gCatholic Education§!"
 WGR_zentrum_catholic_education_law_desc:0 "We have to support catholic educucational centres in Germany."
 WGR_zentrum_limit_expenditure_law:0 "§BLimit Expenditure§!"
 WGR_zentrum_limit_expenditure_law_desc:0 "The Government spends too much. We should spend less."
 WGR_zentrum_support_food_supply_law:0 "§GAgrarian Subsidies§!"
 WGR_zentrum_support_food_supply_law_desc:0 "We need to make sure that every person in Germany has food to eat."
 WGR_zentrum_end_worker_councils_law:0 "§gEnd Workers' Councils§!"
 WGR_zentrum_end_worker_councils_law_desc:0 "We should end the workers' councils to preserve Capitalism!"
 WGR_zentrum_bypasses_law:0 "§GBuild more Bypasses§!"
 WGR_zentrum_bypasses_law_desc:0 "What do you mean \"Why's it got to be built?\" It's a bypass. You've got to build bypasses."
 WGR_zentrum_religious_defamation_law:0 "§gReligous Defamation Law§!"
 WGR_zentrum_religious_defamation_law_desc:0 "Insulting Religion is Hate Speech! We must cut down on that!"
 WGR_zentrum_parity_law:0 "§GDenominational Parity§!"
 WGR_zentrum_parity_law_desc:0 "Despite Catholic Political Dominance, we must make sure that no Religion is socially dominant."
 WGR_zentrum_catholic_workers_law:0 "§CSupport Catholic Trade Unions§!"
 WGR_zentrum_catholic_workers_law_desc:0 "We need to support Catholic Trade Unions. Trade Unions are not so bad, we just need to subordinate them to God."
 WGR_zentrum_religious_equality_law:0 "§GReligious Equality§!"
 WGR_zentrum_religious_equality_law_desc:0 "While different Christian Denominations have Parity, we need to extend this to all other religions."
 WGR_zentrum_marriage_law:0 "§gEnd Civil Marriages§!"
 WGR_zentrum_marriage_law_desc:0 "Marriages should be religious in order to be legal!"
 WGR_zentrum_tax_free_clergy_law:0 "§gTax Exemptions for the Clergy§!"
 WGR_zentrum_tax_free_clergy_law_desc:0 "The Clergy work hard to spread the word of God, regardless of the God they follow. They must be rewarded for this!"
 WGR_zentrum_redraw_state_borders_law:0 "§GRedraw State Borders§!"
 WGR_zentrum_redraw_state_borders_law_desc:0 "The Borders of the German States are complicated relics of an outdated Imperial system. They must be swept aside and replaced with new and efficient states."
 WGR_zentrum_build_more_green_belts_law:0 "§GBuild More Green Belts§!"
 WGR_zentrum_build_more_green_belts_law_desc:0 "Planting more trees would benefit the environment and make Germany look much nicer."
 WGR_zentrum_basic_law_law:0 "§GGrundgesetz für die Deutscher Volksstaat§!"
 WGR_zentrum_basic_law_law_desc:0 "The \"Basic law for the German People's State \" is a new constitution drafted by a joint committee of all the parties. It would reform the German government to prevent a dictatorship from taking hold. Ironically, the one thing it does not reform is an agreement for the name of the country."
 WGR_zentrum_religious_minorities_law:0 "§GSupport Religious Minorities§!"
 WGR_zentrum_religious_minorities_law_desc:0 "We must support Religious minorities in our nations, as we are good Christians."
 WGR_zentrum_housing_programs_law:0 "§GHousing Programs§!"
 WGR_zentrum_housing_programs_law_desc:0 "We need housing programs to keep the people off the street!"
 WGR_zentrum_holy_guarantees_law:0 "§gHoly Guarantees§!"
 WGR_zentrum_holy_guarantees_law_desc:0 "While we should have ties with the Church, we should constitutionally defend its autonomy."
 WGR_zentrum_theology_in_schools_law:0 "§gTheology in Schools§!"
 WGR_zentrum_theology_in_schools_law_desc:0 "We need Theology to be taught in schools to make sure that any German Christians are good Christians!"
 WGR_zentrum_POW_laws_law:0 "§GReform POW Laws§!"
 WGR_zentrum_POW_laws_law_desc:0 "We need to make POW Laws more humane, in line with the teachings of Jesus."
 WGR_zentrum_equality_for_judaism_law:0 "§GEquality for Judaism§!"
 WGR_zentrum_equality_for_judaism_law_desc:0 "We need to make sure that the Jews have full equality in our nation, as the Jewish people were the ancestors of the Messiah."
 WGR_zentrum_unemployment_benefits_law:0 "§CUnemployment Benefits§!"
 WGR_zentrum_unemployment_benefits_law_desc:0 "We have to expand Welfare to those without work, as Jesus would have wanted."
 WGR_zentrum_support_cultural_traditions_law:0 "§gSupport Cultural Traditions§!"
 WGR_zentrum_support_cultural_traditions_law_desc:0 "We must strive to protect the German Culture from foreign influence."
 WGR_zentrum_support_germans_in_poland_law:0 "§RSupport Germans in Poland and the Sudetenland§!"
 WGR_zentrum_support_germans_in_poland_law_desc:0 "Creating a connection between Germans in Poland and Czechoslovakia would improve the reputation of our government, but may inspire militarist feelings."
 WGR_zentrum_public_nurseries_law:0 "§CSupport Public Day Nurseries§!"
 WGR_zentrum_public_nurseries_law_desc:0 "If we were to fund these public Day Cares, the women of Germany would be able to work more to earn money for their families."
 WGR_zentrum_adenauer_curtail_red_tape_law:0 "§GCurtail Red Tape§!"
 WGR_zentrum_adenauer_curtail_red_tape_law_desc:0 "Streamlining the Bureaucracy would go a long way to ensuring Stability in Germany."
 WGR_zentrum_adenauer_denounce_communism:0 "§gDenounce Communism§!"
 WGR_zentrum_adenauer_denounce_communism_desc:0 "Communism is a Poison that must be thrown to the Pits of Hell!"
 WGR_zentrum_kaas_denounce_nazism:0 "§GDenounce National Socialistsm§!"
 WGR_zentrum_kaas_denounce_nazism_desc:0 "National Socialistsm is a Poision that must be thrown to the Pits of Hell!"
 WGR_zentrum_kaas_encourage_churches:0 "§gEncourage Church Construction§!"
 WGR_zentrum_kaas_encourage_churches_desc:0 "Germany needs more Churches to Spread the Good Word of Christ!"
 WGR_zentrum_kaas_pacifism:0 "Introduce State Pacifism"
 WGR_zentrum_kaas_pacifism_desc:0 "War is a Sin, and this must be reflected in our Constitution!"
 WGR_politics_will_be_restricted:0 "Political Activity will be Restricted"
 WGR_politics_restricted:0 "Political Activity will be allowed once again"
 WGR_restrict_politics_law:0 "§RRestrict Political Activity§!"
 WGR_restrict_politics_law_desc:0 "Now that we are in a large war, we need to restrict political activity to preserve stability."
 WGR_unrestrict_politics_law:0 "Unrestrict Political Activity"
 WGR_unrestrict_politics_law_desc:0 "Our newfound Peace forces us to allow political activity once again. If we do not do this, the population will become upset with us..."
 WGR_invade_poland_law:0 "§RInvade Poland§!"
 WGR_invade_poland_law_desc:0 "We should invade Poland to get our old lands back."
 WGR_vote_German_Republic_law:0 "§GEstablish the German Republic§!"
 WGR_vote_German_Republic_law_desc:0 "Now that we have finished a lot of different reforms, we can rename the country from \"German Reich\" to \"German Republic\", as long as we can get a majority."
 WGR_vote_German_People_State_law:0 "§GEstablish the German People's State§!"
 WGR_vote_German_People_State_law_desc:0 "Now that we have finished a lot of different reforms, we can rename the country from \"German Reich\" to \"German People's State\", as long as we can get a majority."
 WGR_dvp_deregulate_factory_safety_law:0 "§gDe-Regulate Factory Safety§!"
 WGR_dvp_deregulate_factory_safety_law_desc:0 "Safety measures are probably unnecessary. We should repeal them to improve efficiency."
 #focuses
 have_to_vote:0 "§GYou will unlock this law in the Reichstag!§!\n"
 west_german_focus_default:0 "German Republic Focus Tree"
 west_german_focus_SPD_tradition:0 "German Republic Focus Tree - SPD Traditions"
 west_german_focus_DStP_tradition:0 "German Republic Focus Tree - DStP Traditions"
 new_reichskanzler_chosen:0 "A New Reichskanzler has been chosen"
 WGR_1933_election:0 "Elections of 1933"
 WGR_1936_election:0 "Elections of 1936"
 WGR_spd_chosen:0 "The SPD is in power"
 WGR_DStP_chosen:0 "The DStP is in power"
 WGR_DVP_chosen:0 "The DVP is in power"
 WGR_Adenauer_Zentrum_chosen:0 "Konrad Adenauer's Zentrum is in power"
 WGR_Kaas_Zentrum_chosen:0 "Ludwig Kaas's Zentrum is in power"
 WGR_politics_start:0 "A New Reichskanzler"
 WGR_politics_start_desc:0 "President Hindenburg has chosen a Reichskanzler from one of the more democratic-leaning parties. They will have the difficult job of maintaining stability and protecting the Republic from Fascists and Communists."
 WGR_spd_free_meals:0 "Free Meals for Schoolchildren"
 WGR_spd_free_meals_desc:0 "Since the 1920's, Providing Free Meals in Schools has been an election promise of the SPD. With the new government, they could now have the authority to pass this law, if they gain enough support from the other parties."
 WGR_spd_support_from_left_zentrum:0 "Support from Zentrum"
 WGR_spd_support_from_left_zentrum_desc:0 "The Left-Wing of the Centre Party supports trade unions and even a few of our policies. We should try and negotiate for their support. We'll need it to maintain stability."
 WGR_spd_increase_welfare_funding:0 "Increase Welfare Spending"
 WGR_spd_increase_welfare_funding_desc:0 "To garner support from the people, we need to increase our welfare spending. We'll go into some more debt, but with further reform this should go away. We will have to negotiate for this law, though."
 WGR_DStP_lower_taxes:0 "Lower Taxes"
 WGR_DStP_lower_taxes_desc:0 "We need to lower taxes to gain support from the people."
 WGR_DStP_decrease_welfare_spending:0 "Decrease Welfare Spending"
 WGR_DStP_decrease_welfare_spending_desc:0 "We need to decrease welfare spending to prevent us from going further into debt. We shall calm the people by saying it's a temporary measure, but we shall have to negotiate for this measure to pass."
 WGR_DStP_affirm_jewish_citizenship:0 "Affirm Non-German Citizenship"
 WGR_DStP_affirm_jewish_citizenship_desc:0 "If the German Jews, Poles, and Czechs know that we support their freedoms, we could gain some support for March's Election."
 WGR_DVP_fight_for_freedom:0 "Fight For Freedom!"
 WGR_DVP_fight_for_freedom_desc:0 "\"Fight For Freedom\" is the DVP's slogan for the election in March. The intent is to rally the people to reject Marxism, and on a lesser note, Fascism. It also speaks to Nationalists, as the DVP promises to fight for German indpendence fom the Versailles treaty and for a place for Germany on the world stage."
 WGR_DVP_coalition_with_zentrum:0 "Coalition with Zentrum"
 WGR_DVP_coalition_with_zentrum_desc:0 "Because the DVP and Zentrumspartei support Christian values and opposition to socialism, we could form a coaltion and gain their support in our government."
 WGR_DVP_discredit_socialists:0 "Discredit Socialists"
 WGR_DVP_discredit_socialists_desc:0 "We need to destroy the image of the Social Democrats and Communists before the election. We must start a propaganda campaign!"
 WGR_Adenauer_leave_the_tower:0 "Leave the Tower"
 WGR_Adenauer_leave_the_tower_desc:0 "The Zentrumspartei must \"leave the tower\" and work with all Christians if it is to safeguard democracy and the will of the people."
 WGR_Adenauer_promise_green_belts:0 "Promise Green Belts"
 WGR_Adenauer_promise_green_belts_desc:0 "We shall promise the people that we will build more parks and trees in Germany, as Adenauer did in Cologne."
 WGR_Adenauer_end_prussianism:0 "End Prussianism"
 WGR_Adenauer_end_prussianism_desc:0 "We need to quickly pass measures that would end Prussian Dominance in Germany. This would ensure that the National Socialists do not gain a majority in government."
 WGR_Kaas_stay_in_the_tower:0 "Stay in the Tower"
 WGR_Kaas_stay_in_the_tower_desc:0 "To ensure Catholic rights and even dominance in Germany, the Zentrumspartei must \"stay in the tower\", and prevent non-Catholic interference."
 WGR_Kaas_promise_reconciliation:0 "Promise Reconciliation"
 WGR_Kaas_promise_reconciliation_desc:0 "We shall promise reconciliation with the Western powers and discredit the Nationalists in Germany. We hope that this would get us support from the people."
 WGR_Kaas_ties_with_vatican:0 "Ties With the Vatican"
 WGR_Kaas_ties_with_vatican_desc:0 "A Campaign which supports the Vatican could help to rally more Catholics to our side."
 WGR_1933_start:0 "Election of 1933"
 WGR_1933_start_desc:0 "Now that the election of 1933 is over, the ruling party can begin instituting their reforms and bringing stability back to the nation!"
 WGR_spd_chosen_1933:0 "The SPD won the 1933 elections"
 WGR_DStP_chosen_1933:0 "The DStP won the 1933 elections"
 WGR_DVP_chosen_1933:0 "The DVP won the 1933 elections"
 WGR_Adenauer_Zentrum_chosen_1933:0 "The Zentrum under Adenauer won the 1933 elections"
 WGR_Zentrum_Kaas_chosen_1933:0 "The Zentrum under Kaas won the 1933 elections"
 WGR_spd_1933_start:0 "SPD Victory"
 WGR_spd_1933_start_desc:0 "Now that the SPD has the people's support, we can begin to further implement reforms that benefit the people!"
 WGR_DStP_1933_start:0 "DStP Victory"
 WGR_DStP_1933_start_desc:0 "Now that the DStP achieved victory in the elections, we can begin to roll back the welfare state and prevent the government from intruding into the economy!"
 WGR_DVP_1933_start:0 "DVP Victory"
 WGR_DVP_1933_start_desc:0 "Now that the people support the DVP, it is possible for the government to roll back reforms and slide into authoritarianism. But only a little bit."
 WGR_Adenauer_Zentrum_1933_start:0 "Moderate Zentrum Victory"
 WGR_Adenauer_Zentrum_1933_start_desc:0 "Now that Konrad Adenauer's Zentrum has won the support of the people, Germany can return to a more moderate approach to politics. Some social aspects, some capitalism, and some religion."
 WGR_Zentrum_Kaas_1933_start:0 "Right-Wing Zentrum Victory"
 WGR_Zentrum_Kaas_1933_start_desc:0 "Now that Ludwig Kaas's Zentrum has won the wupport of the people, the Catholics of Germany will be able to enjoy dominance, as the Protestants did for so long!"
 WGR_spd_1933_reconcile_splinter_groups:0 "Reconcile Splinter Groups"
 WGR_spd_1933_reconcile_splinter_groups_desc:0 "If we are to maintain stability, we have to bring back splinter groups such as the Iron Front back into the fold."
 WGR_spd_1933_amnesty_to_paramilitaries:0 "Amnesty to Paramilitaries and Radicals"
 WGR_spd_1933_amnesty_to_paramilitaries_desc:0 "Paramilitary organizations applying their own laws and orders on the country has been a problem for years. If we offer them amnesty in exchange for disarmament, we can enforce the laws of the constitution, and prevent Radicals from seizing control of the government!"
 WGR_spd_1933_lower_the_voting_age:0 "Lower The Voting Age"
 WGR_spd_1933_lower_the_voting_age_desc:0 "If we set the minimum voting age to 18 years old, we can garner some support from the people. We will have to negotiate for this law, however."
 WGR_spd_1933_fund_education:0 "Fund Education"
 WGR_spd_1933_fund_education_desc:0 "We need to fund education so Germany can keep up with the rest of the world!"
 WGR_spd_1933_farmers_councils:0 "Housing Projects"
 WGR_spd_1933_farmers_councils_desc:0 "The People need cheap and comfortable houses in order to stay off the streets. Plus, if we build more residential zones, we would have more room for industrial zones."
 WGR_DStP_1933_adjust_tax_brackets:0 "Adjust Tax Brackets"
 WGR_DStP_1933_adjust_tax_brackets_desc:0 "We have lowered taxes as a temporary measure, but now we need to negotiate with the rest of the Reichstag to re-adjust the tax brackets to decrease the amount of government oppression!"
 WGR_DStP_1933_social_security:0 "German Social Security"
 WGR_DStP_1933_social_security_desc:0 "Francis Townsend, an American, has proposed a system of Social Security to regulate welfare in his country. By obligating each citizen to invest in their own, private, Social Security funds, we can alleviate some of the Great Depression's effects on our country."
 WGR_DStP_1933_negotiate_with_paramilitaries:0 "Negotiate with Paramilitaries"
 WGR_DStP_1933_negotiate_with_paramilitaries_desc:0 "To fix these paramilitary problems, we should try and negotiate with them, and maybe give them some representation in government."
 WGR_DStP_1933_support_german_buisnesses:0 "Support German Buisnesses"
 WGR_DStP_1933_support_german_buisnesses_desc:0 "By eliminating some regulations, we can garner some support from German Buisnessmen for the next elections. We will have to negotiate for these repeals."
 WGR_DStP_1933_pragmatism:0 "Pragmatism"
 WGR_DStP_1933_pragmatism_desc:0 "While we are a Market Liberal party, some Social Liberal tendencies have ensured that this party is one of reason and pragmatism, and not one blindly guided by ideology."
 WGR_DVP_1933_fight_paramilitaries:0 "Fight the Paramilitaries"
 WGR_DVP_1933_fight_paramilitaries_desc:0 "We need to rough up the paramilitary groups, to make sure they know that they are not in control."
 WGR_DVP_1933_christian_family_values:0 "Christian Family Values"
 WGR_DVP_1933_christian_family_values_desc:0 "Even though we support secular education, the home is where religion shines through!"
 WGR_DVP_1933_ban_on_communism:0 "Kommunistisches Verbot"
 WGR_DVP_1933_ban_on_communism_desc:0 "The law is easy to draw up, but hard to pass. But we must find common ground if we are to ban Communist subversiveness in this country!"
 WGR_DVP_1933_attack_socdems:0 "Attack the Social Democrats"
 WGR_DVP_1933_attack_socdems_desc:0 "A smear campaign on the Social Democratic Party would go a long way in ensuring our victory in the next elections."
 WGR_DVP_1933_appease_nationalists:0 "Appease Nationalists"
 WGR_DVP_1933_appease_nationalists_desc:0 "If we can convince the Nationalists to calm down, we can preserve stability and our rule!"
 WGR_Adenauer_Zentrum_1933_chancellor_democracy:0 "Bundeskanzler Demokratie"
 WGR_Adenauer_Zentrum_1933_chancellor_democracy_desc:0 "The German Republic is more of a \"Chancellor Democracy\", where the president has little role in government, and it is the Chancellor who holds real power, similar to a constitutional monarchy."
 WGR_Adenauer_Zentrum_1933_catholic_social_teaching:0 "Catholic Social Teachings"
 WGR_Adenauer_Zentrum_1933_catholic_social_teaching_desc:0 "We must make sure that moderate Catholic Social Teachings are present in society and the economy."
 WGR_Adenauer_Zentrum_1933_integrate_paramilitaries:0 "Integrate Paramilitaries"
 WGR_Adenauer_Zentrum_1933_integrate_paramilitaries_desc:0 "Instead of banning or fighting the paramiliaries, we should get them to work for the state while we are still re-arming."
 WGR_Adenauer_Zentrum_1933_dissolve_prussia:0 "Dissolve Prussia"
 WGR_Adenauer_Zentrum_1933_dissolve_prussia_desc:0 "We need to dismantle the state of Prussia, and turn it into several smaller states to end Prussian dominance over politics! Even though Chancellor Adenauer, a Rhinelander to the end, supports the law, it might meet some resistance in the Reichstag."
 WGR_Adenauer_Zentrum_1933_rearmament_rhetoric:0 "Rearmament Rhetoric"
 WGR_Adenauer_Zentrum_1933_rearmament_rhetoric_desc:0 "The Zentrumspartei supports German Rearmament! We are even willing to cooperate with the Nationalists to achieve this end!"
 WGR_Zentrum_Kaas_1933_catholic_education:0 "Fund Catholic Education"
 WGR_Zentrum_Kaas_1933_catholic_education_desc:0 "We will increase the amount of Catholic Education students get in this country!"
 WGR_Zentrum_Kaas_1933_god_before_fatherland:0 "Gott vor dem Vaterland"
 WGR_Zentrum_Kaas_1933_god_before_fatherland_desc:0 "\"God Before Fatherland\" is a new campaign slogan targeted at nationalists; its aim is to persuade them to return to God, before committing sins in the name of Germany."
 WGR_Zentrum_Kaas_1933_paramilitarists_repent:0 "Paramilitarists, Repent!"
 WGR_Zentrum_Kaas_1933_paramilitarists_repent_desc:0 "Members of paramilitary organizations have strayed too far from God's light. They must return, or face reprocussions, both from the State and the Lord!"
 WGR_Zentrum_Kaas_1933_faithless_communists:0 "Faithless Socialists"
 WGR_Zentrum_Kaas_1933_faithless_communists_desc:0 "The Socialists are of little faith, and spurn the teachings of Jesus Christ. We must bring those poor sheep back into the fold."
 WGR_Zentrum_Kaas_1933_catholic_dominance:0 "Catholic Dominance"
 WGR_Zentrum_Kaas_1933_catholic_dominance_desc:0 "Now that we have brought stability back to this country, it has become clear that the Catholics of Germany have begun to take dominance over the Protestants!"
 WGR_1936_start:0 "Election of 1936"
 WGR_1936_start:0 "The Elections of 1936 were contentious, but are now over. We now have a new government"
 WGR_spd_1936_start:0 "SPD Victory"
 WGR_spd_1936_start_desc:0 "The SPD has won the 1936 elections."
 WGR_spd_1936_calm_revolutionaries:0 "Calm Revolutionaries"
 WGR_spd_1936_calm_revolutionaries_desc:0 "We have to calm down revolutionary groups such as the Communists and Fascists to ensure stability."
 WGR_spd_1936_increase_minimum_wage:0 "The Minimum Wage Act"
 WGR_spd_1936_increase_minimum_wage_desc:0 "We can introduce a law in the Reichstag to increase the minimum wage of the German worker."
 WGR_spd_1936_national_parks:0 "Build More Parks"
 WGR_spd_1936_national_parks_desc:0 "To provide the people with more leisure and nature, we need to build more parks in the cities."
 WGR_spd_1936_end_nationalist_sentiment:0 "Combat Nationalism"
 WGR_spd_1936_end_nationalist_sentiment_desc:0 "One of the biggest problems plaguing Germany today is Nationalism. The government must remind the people that nationalism is what got us into this position in the first place!"
 WGR_spd_1936_ministry_of_culture:0 "Kulturministerium"
 WGR_spd_1936_ministry_of_culture_desc:0 "We need a Ministry of Culture to collect and mildly regulate the art in our nation!"
 WGR_DStP_1936_start:0 "DStP Victory"
 WGR_DStP_1936_start_desc:0 "The DStP has won the 1936 elections."
 WGR_DStP_1936_laicism:0 "Laizismus"
 WGR_DStP_1936_laicism_desc:0 "We need to pursue a policy of Laicism, to decrease the effect the Church has on our nation!"
 WGR_DStP_1936_legacy:0 "Legacy of Preuß"
 WGR_DStP_1936_legacy_desc:0 "Hugo Preuß, one of the great members of the former German Democratic Party, must be remembered by our politicians. It is through his work, that we can do the reforms we are doing today!"
 WGR_DStP_1936_work_with_SPD:0 "Work with the SPD"
 WGR_DStP_1936_work_with_SPD_desc:0 "The right-wing of the SPD are moderate, Keynsian, social democrats. Their position is close to ours. We should try to see if we can work with them in the Reichstag."
 WGR_DStP_1936_protect_private_property:0 "Protect Private Property"
 WGR_DStP_1936_protect_private_property_desc:0 "Despite the party's interventionist attitude, the people must be reassured that we are not going to come for their private property!"
 WGR_DStP_1936_support_unis:0 "Support the Universities"
 WGR_DStP_1936_support_unis_desc:0 "Extra funding to the Universities would help our research efforts."
 WGR_DVP_1936_start:0 "DVP Victory"
 WGR_DVP_1936_start_desc:0 "The DVP has won the 1936 elections."
 WGR_DVP_1936_lower_taxes:0 "The Bismarck Law"
 WGR_DVP_1936_lower_taxes_desc:0 "The Bismarck Law would lower taxes for all people in Germany. We have called it such to harken back to the days when Bismarck was a proponent of free trade."
 WGR_DVP_1936_support_wealthy:0 "Support the Wealthy"
 WGR_DVP_1936_support_wealthy_desc:0 "We must try to enact other laws to support the wealthy industrialists, in order to garner support for our party."
 WGR_DVP_1936_vaterland:0 "Was ist des Deutschen Vaterland?"
 WGR_DVP_1936_vaterland_desc:0 "All Germans must know that this is a German government!"
 WGR_DVP_1936_support_from_dnvp:0 "Support from the DNVP"
 WGR_DVP_1936_support_from_dnvp_desc:0 "We must appeal to the Nationalism of the DNVP to attempt to gain their support!"
 WGR_DVP_1936_agrarian_subsidies:0 "Agrarian Subsidies"
 WGR_DVP_1936_agrarian_subsidies_desc:0 "We have to support the farmers, as they are the backbone of Germany!"
 WGR_Adenauer_Zentrum_1936_start:0 "Moderate Zentrum Victory"
 WGR_Adenauer_Zentrum_1936_start_desc:0 "Konrad Adenauer's Zentrum has won the 1936 elections."
 WGR_Adenauer_Zentrum_1936_limit_expenditure:0 "Limit Expenditure"
 WGR_Adenauer_Zentrum_1936_limit_expenditure_desc:0 "New laws in the Reichstag to limit government spending should help with the crisis."
 WGR_Adenauer_Zentrum_1936_support_food_supply:0 "Support the Food Supply"
 WGR_Adenauer_Zentrum_1936_support_food_supply_desc:0 "We need to spend some money to help make sure people at least have enough to eat."
 WGR_Adenauer_Zentrum_1936_end_worker_councils:0 "End Worker Councils"
 WGR_Adenauer_Zentrum_1936_end_worker_councils_desc:0 "A new law that would repeal some SPD reforms would go a long way in securing Germany from Marxism and increasing support for Zentrum..."
 WGR_Adenauer_Zentrum_1936_build_more_bypasses:0 "Build More Bypasses"
 WGR_Adenauer_Zentrum_1936_build_more_bypasses_desc:0 "'What do you mean, why's it got to be built? It's a bypass. You've got to build bypasses.'"
 WGR_Adenauer_Zentrum_1936_christian_labor_unions:0 "Christian Labour Unions"
 WGR_Adenauer_Zentrum_1936_christian_labor_unions_desc:0 "Supporting Christian Labour Unions could help us get more votes in the next elections."
 WGR_Zentrum_Kaas_1936_start:0 "Right-Wing Zentrum Victory"
 WGR_Zentrum_Kaas_1936_start_desc:0 "Ludwig Kaas' Zentrum has won the 1936 elections."
 WGR_Zentrum_Kaas_1936_religious_defamation_law:0 "Religious Defamation Law"
 WGR_Zentrum_Kaas_1936_religious_defamation_law_desc:0 "We need a law that prevents people from insulting religion. Because we are good Christians, we will also extend this protection to the Protestants, Jews, and other religions and denominations."
 WGR_Zentrum_Kaas_1936_parity_for_denominations:0 "Denomination Parity"
 WGR_Zentrum_Kaas_1936_parity_for_denominations_desc:0 "We need another law that gives Social (if not political) equality to different Christian denominations."
 WGR_Zentrum_Kaas_1936_catholic_workers:0 "Support Catholic Workers"
 WGR_Zentrum_Kaas_1936_catholic_workers_desc:0 "We will give extra funding to Catholic worker unions in order to increase their support for our platform."
 WGR_Zentrum_Kaas_1936_defend_liberty:0 "Defend Liberty"
 WGR_Zentrum_Kaas_1936_defend_liberty_desc:0 "The Zentrumspartei supports the liberty and freedom of the people!"
 WGR_Zentrum_Kaas_1936_reconcile_party_renagades:0 "Reconcile Party Renagades"
 WGR_Zentrum_Kaas_1936_reconcile_party_renagades_desc:0 "There are still some supporters of the former chancellors Franz von Papen and Heinrich Brüning, the so-called \"renegades\". Although they have deviated from the party's platform, we still need them in our party for political leverage."
 WGR_1940_start:0 "Election of 1940"
 WGR_1940_start_desc:0 "The 1940 elections are now over. The new ruling party can now institute reforms."
 WGR_spd_1940_start:0 "SPD Victory"
 WGR_spd_1940_start_desc:0 "The SPD has won the 1940 elections."
 WGR_spd_1940_full_equality:0 "The Zinn Act"
 WGR_spd_1940_full_equality_desc:0 "The Zinn Act, if passed, would ensure in the constituion that all peoples in Germany have full civil and political rights, regardless of ethnicity or religion."
 WGR_spd_1940_small_property_rights:0 "Property Rights"
 WGR_spd_1940_small_property_rights_desc:0 "We know we need to have some rights for small property owners. What we need to debate is how much rights they get."
 WGR_spd_1940_avant_garade:0 "The Avant-Garde"
 WGR_spd_1940_avant_garade_desc:0 "The Avant-Garde art movement will get support from Berlin. Our Ministry of Culture will fund and display Avant-Garde works and artists!"
 WGR_spd_1940_environmentalism:0 "Environmentalism"
 WGR_spd_1940_environmentalism_desc:0 "We will support environmentalist efforts in order to make Germany a better place to live."
 WGR_spd_1940_attract_communists:0 "Attract Communists"
 WGR_spd_1940_attract_communists_desc:0 "We should try and de-radicalize Communists and bring them over to our side."
 WGR_DStP_1940_start:0 "DStP Victory"
 WGR_DStP_1940_start_desc:0 "The DStP has won the elections of 1940."
 WGR_DStP_1940_good_of_all:0 "The Good of All"
 WGR_DStP_1940_good_of_all_desc:0 "While we support communities, we cannot forget about the individual. It is individual enterprise that forms the basis of the economy."
 WGR_DStP_1940_regulations:0 "Regulations"
 WGR_DStP_1940_regulations_desc:0 "While we support private enterprise, we recognize that there needs to be regulations, in order to better the community."
 WGR_DStP_1940_social_equality:0 "Social Equality"
 WGR_DStP_1940_social_equality_desc:0 "We need to support social equality. A law in the Reichstag would be sure to secure minorities' support!"
 WGR_DStP_1940_housing_projects:0 "Housing Projects"
 WGR_DStP_1940_housing_projects_desc:0 "Making new and modern houses would help improve the economy."
 WGR_DStP_1940_progressive_tax:0 "Progressive Taxes"
 WGR_DStP_1940_progressive_tax_desc:0 "Now that the economy is doing better, we need to vote on bringing in a higher tax on the rich, now that they can pay their fair share!"
 WGR_DVP_1940_start:0 "DVP Victory"
 WGR_DVP_1940_start_desc:0 "The DVP has won the 1940 elections."
 WGR_DVP_1940_raise_voting_age:0 "Raise the Voting Age"
 WGR_DVP_1940_raise_voting_age_desc:0 "Who let all these youngsters vote? We need a new law that tells them that they can't!"
 WGR_DVP_1940_lower_welfare:0 "Lower Welfare Spending"
 WGR_DVP_1940_lower_welfare_desc:0 "Although we already have lowered welfare, we can lower welfare spending even more."
 WGR_DVP_1940_hunt_down_communists:0 "Crackdown on Communists"
 WGR_DVP_1940_hunt_down_communists_desc:0 "Communism might be banned, but that doesn't mean that people aren't practicing it underground. We need to hunt these dissidents down!"
 WGR_DVP_1940_german_freedom:0 "German Freedom"
 WGR_DVP_1940_german_freedom_desc:0 "Germany shall be free. Free from the shackles of Marxism, the murky waters of Protectionism, and the strangling arms of Europe!"
 WGR_DVP_1940_prosperous_germany:0 "A Prosperous Germany!"
 WGR_DVP_1940_prosperous_germany_desc:0 "Through the power of Economic Liberalism, we have Broken the Marxist Chains and made the German people rich!"
 WGR_Adenauer_Zentrum_1940_start:0 "Moderate Zentrum Victory"
 WGR_Adenauer_Zentrum_1940_start_desc:0 "Konrad Adenauer's Zentrum has won the elections of 1940."
 WGR_Adenauer_Zentrum_1940_more_parks:0 "Build More Parks"
 WGR_Adenauer_Zentrum_1940_more_parks_desc:0 "Parks would help the people enjoy nature. We should build more of them."
 WGR_Adenauer_Zentrum_1940_order:0 "Order"
 WGR_Adenauer_Zentrum_1940_order_desc:0 "We must continue the established order in Germany!"
 WGR_Adenauer_Zentrum_1940_diligence:0 "Diligence"
 WGR_Adenauer_Zentrum_1940_diligence_desc:0 "We must work diligent to maintain our democracy!"
 WGR_Adenauer_Zentrum_1940_decency:0 "Decency"
 WGR_Adenauer_Zentrum_1940_decency_desc:0 "Even the rich and middle classes in our nation must be respectful to each other and the poor."
 WGR_Adenauer_Zentrum_1940_organic_farms:0 "Organic Farms"
 WGR_Adenauer_Zentrum_1940_organic_farms_desc:0 "Chemicals only hurt people's health, when applied on their food. We must make a law supporting farms that grow food organically."
 WGR_Zentrum_Kaas_1940_start:0 "Right-Wing Zentrum Victory"
 WGR_Zentrum_Kaas_1940_start_desc:0 "Ludwig Kaas' Zentrum has won the 1940 elections."
 WGR_Zentrum_Kaas_1940_ties_with_bishops:0 "Ties with Bishops"
 WGR_Zentrum_Kaas_1940_ties_with_bishops_desc:0 "We must work harder to bring Bishops and Cardinals into our administration, politically."
 WGR_Zentrum_Kaas_1940_religious_equality_law:0 "Religious Equality"
 WGR_Zentrum_Kaas_1940_religious_equality_law_desc:0 "We need to enforce religious equality, as to not let hate fester in our nation."
 WGR_Zentrum_Kaas_1940_marriage_law:0 "Re-Christianize Marriage"
 WGR_Zentrum_Kaas_1940_marriage_law_desc:0 "The Youth of the Nation needs to remember the spiritual aspects of marriage, not just the physical."
 WGR_Zentrum_Kaas_1940_tax_free_clergy:0 "The Kaas Act"
 WGR_Zentrum_Kaas_1940_tax_free_clergy_desc:0 "The Kaas Act would amend the constitution mandating that the clergy and religious institutions remain tax-free."
 WGR_Zentrum_Kaas_1940_a_holy_republic:0 "A Holy Republic"
 WGR_Zentrum_Kaas_1940_a_holy_republic_desc:0 "This is not just a Republic, but a democracy guided by faith! Go my brothers, and may God lead us to victory and freedom."
 #DStP
 WGR_DStP_tradition_start:0 "Liberal Traditions"
 WGR_DStP_tradition_start_desc:0 "Thanks to the successive elections of the DStP, a Liberal tradition has been established in Germany. However, unlike the National Liberals, the Social Liberals are more progressive."
 WGR_DStP_social_liberal:0 "Social Liberalism"
 WGR_DStP_social_liberal_desc:0 "The goal of the state is not to help the economy when it is doing well, but to reinforce it when it is failing. The state also must safeguard the people's rights and make sure they have opportunites."
 WGR_DStP_social_liberal_lower_trade_barriers:0 "Lower Trade Barriers"
 WGR_DStP_social_liberal_lower_trade_barriers_desc:0 "We need to open up Germany to global investment, to stimulate the economy."
 WGR_DStP_social_liberal_good_of_the_community:0 "The Good of the Community"
 WGR_DStP_social_liberal_good_of_the_community_desc:0 "We must balance the Good of the Community with the free market. One must not impede the other."
 WGR_DStP_social_liberal_franco_german_friendship:0 "Invite French Businesses"
 WGR_DStP_social_liberal_franco_german_friendship_desc:0 "Bringing in French Corporations would give the German People more job opportunities and increase the standing of the Republic in the eyes of the French."
 WGR_DStP_social_liberal_export_focus:0 "Export Focus"
 WGR_DStP_social_liberal_export_focus_desc:0 "We must focus on bringing German goods to foreign markets."
 WGR_DStP_social_liberal_decrease_welfare:0 "Decrease Welfare Spending"
 WGR_DStP_social_liberal_decrease_welfare_desc:0 "Although we support the people's welfare, the state's funds would be better spent upholding the Market."
 WGR_DStP_social_liberal_equal_opportunity:0 "Equal Opportunity"
 WGR_DStP_social_liberal_equal_opportunity_desc:0 "In order to have a strong economy, the people must have equal opportunities to succeed."
 WGR_DStP_social_liberal_a_free_market:0 "A Free Market"
 WGR_DStP_social_liberal_a_free_market_desc:0 "With our reforms, the German Economy is more free!"
 WGR_DStP_social_liberal_good_of_the_individual:0 "The Good of the Individual"
 WGR_DStP_social_liberal_good_of_the_individual_desc:0 "Although we are developing communities, we cannot forget about the individual. Freedom and private enterprise must be maintained!"
 WGR_DStP_social_liberal_good_of_the_country:0 "The Good of the Country"
 WGR_DStP_social_liberal_good_of_the_country_desc:0 "Supporting the people means the people would support the state!"
 WGR_DStP_social_liberal_housing_projects:0 "Housing Projects"
 WGR_DStP_social_liberal_housing_projects_desc:0 "We need to get people into modern and safe homes. The state should subsidize such projects."
 WGR_DStP_social_liberal_social_justice:0 "Social Justice"
 WGR_DStP_social_liberal_social_justice_desc:0 "We need to be on the side of the oppressed! If people are being discriminated against, the state should act to combat this!"
 WGR_DStP_social_liberal_a_free_people:0 "A Free People"
 WGR_DStP_social_liberal_a_free_people_desc:0 "Thanks to our reforms, the German People are free, from the shackles of Socialism, the chains of Nationalism, and the fear of Poverty."
 WGR_DStP_social_liberal_a_free_germany:0 "A Free Germany"
 WGR_DStP_social_liberal_a_free_germany_desc:0 "Now that the People and the Market are free, we can declare that Germany is free, and looking towards a shining future!"
 WGR_DStP_ordoliberal:0 "Ordoliberalism"
 WGR_DStP_ordoliberal_desc:0 "Ordoliberalism, originally known as Neoliberalism, is a strand of economic thought theorized by Alexander Rüstow, that advocates a Social Market Economy, in which the state tries its hardest to make sure that the economy is running at peak efficiency."
 WGR_DStP_ordoliberal_ensure_healthy_competition:0 "Ensure Healthy Competition"
 WGR_DStP_ordoliberal_ensure_healthy_competition_desc:0 "Private enterprises, whether big or small, must be able to compete with each other. This drives growth. Thus, the state must take active measures in assuring that competition is active."
 WGR_DStP_ordoliberal_central_bank:0 "Central Monetary Policy"
 WGR_DStP_ordoliberal_central_bank_desc:0 "The Central Bank must dictate monetary policy. This would allow the bureaucracy to better support the economy."
 WGR_DStP_ordoliberal_economic_power_into_political_power:0 "Economic Power into Political Power"
 WGR_DStP_ordoliberal_economic_power_into_political_power_desc:0 "The Economic state of the country must determine political policy, not the other way around."
 WGR_DStP_ordoliberal_positive_freedoms:0 "Positive Freedoms"
 WGR_DStP_ordoliberal_positive_freedoms_desc:0 "We have to defend the positive freedoms of our people. Freedom of speech, religion, and private enterprise, for example."
 WGR_DStP_ordoliberal_balanced_budget:0 "Balanced Budget"
 WGR_DStP_ordoliberal_balanced_budget_desc:0 "The budget must be balanced to ensure that the state does not lose money."
 WGR_DStP_ordoliberal_progressive_taxes:0 "Progressive Taxes"
 WGR_DStP_ordoliberal_progressive_taxes_desc:0 "We must tax progressively, so the rich will pay their fair share. If they earn more, they should pay more. They can afford it, after all."
 WGR_DStP_ordoliberal_privatization:0 "Privatization"
 WGR_DStP_ordoliberal_privatization_desc:0 "We should privatize some of the national firms so the economy has a chance to grow."
 WGR_DStP_ordoliberal_support_unions:0 "Support the Unions"
 WGR_DStP_ordoliberal_support_unions_desc:0 "Despite our Liberal policy, we should support trade unions so that we can bring them over to our side."
 WGR_DStP_ordoliberal_minimum_wage:0 "Support the Minimum Wage"
 WGR_DStP_ordoliberal_minimum_wage_desc:0 "To increase the purchasing power of the people, we must increase the amount of money they have to purchase with. We should start by increasing the minimum wage in the country."
 WGR_DStP_ordoliberal_encourage_the_telecommunication_industry:0 "Encourage the Telecommunication Industry"
 WGR_DStP_ordoliberal_encourage_the_telecommunication_industry_desc:0 "We should encourage the growth of Radio, so that the people can better communicate, spurring the economy."
 WGR_DStP_ordoliberal_lift_price_controls:0 "Lift Price Controls"
 WGR_DStP_ordoliberal_lift_price_controls_desc:0 "Controls on price are detrimental to competition in most industries. We have to draft a law that would lift most of these restrictions."
 WGR_DStP_ordoliberal_attract_spd_moderates:0 "Attract SPD moderates"
 WGR_DStP_ordoliberal_attract_spd_moderates_desc:0 "With our policies of supporting social security and giving out some welfare, we can possibly attract some moderates from the SPD."
 WGR_DStP_ordoliberal_economic_miracle:0 "Wirtschaftswunder"
 WGR_DStP_ordoliberal_economic_miracle_desc:0 "The Economic Miracle has proven that our policies work, and we can now lead Germany into a new age of prosperity!"
 #DVP
 west_german_focus_DVP_tradition:0 "German Focus Tree - DVP Tradition"
 WGR_DVP_tradition_start:0 "National Liberal Traditions"
 WGR_DVP_tradition_start_desc:0 "The German People have decided to make National Liberalism a political tradition. While most of the DVP support a slight reactionary cause, some liberals support focusing on maintaining capitalism."
 WGR_DVP_national_liberal:0 "The Path to a Great Democracy"
 WGR_DVP_national_liberal_desc:0 "While we are liberals, democracy in its current state has somewhat failed us. We need to reform it to allow for greater state control."
 WGR_DVP_market_liberal:0 "Support Capitalism"
 WGR_DVP_market_liberal_desc:0 "The main focus of the party should be safeguarding capitalist practices."
 WGR_DVP_national_liberal_raise_voting_age:0 "Raise the Voting Age"
 WGR_DVP_national_liberal_raise_voting_age_desc:0 "These young people are too irresponsible to vote. We should restrict voting to those over the age of 24."
 WGR_DVP_national_liberal_increase_police_prescence:0 "Increase Police Funding"
 WGR_DVP_national_liberal_increase_police_prescence_desc:0 "The Police force should be more active in trying to catch criminals. Let's give them more money."
 WGR_DVP_national_liberal_abolish_communism:0 "Abolish Communism"
 WGR_DVP_national_liberal_abolish_communism_desc:0 "A new set of Anti-Communism laws would help eliminate Marxism in Germany for good!"
 WGR_DVP_national_liberal_a_german_nation:0 "A German Nation"
 WGR_DVP_national_liberal_a_german_nation_desc:0 "Remember that this is Germany, a soveirgn nation. Not a French puppet or British Colony."
 WGR_DVP_national_liberal_a_german_people:0 "A German People"
 WGR_DVP_national_liberal_a_german_people_desc:0 "The German People are free and prosperous! Nothing will ever change this!"
 WGR_DVP_national_liberal_german_culture:0 "Revival of Kultur"
 WGR_DVP_national_liberal_german_culture_desc:0 "We must re-introduce the concept of Kultur, and try and softly eliminate French and British influences in German society."
 WGR_DVP_national_free_trade:0 "Lower Tariffs"
 WGR_DVP_national_free_trade_desc:0 "A Free Market means a Free People, to restore the Freedom of Germany we must thus restore tariff-free trade."
 WGR_DVP_national_liberal_support_industrialists:0 "Support Industrialists"
 WGR_DVP_national_liberal_support_industrialists_desc:0 "We have to support the rich in order to gain support for the state."
 WGR_DVP_national_liberal_end_the_welfare_state:0 "End the Welfare State"
 WGR_DVP_national_liberal_end_the_welfare_state_desc:0 "We must take steps to oppose welfare systems in Germany! They are eroding the social order!"
 WGR_DVP_national_liberal_german_freedom:0 "German Freedom"
 WGR_DVP_national_liberal_german_freedom_desc:0 "Our freedom is uniquely German. It shall last until the end of time!"
 WGR_DVP_national_liberal_german_market:0 "A German Market"
 WGR_DVP_national_liberal_german_market_desc:0 "Our economy is uniquely German. It is a nearly completely free market, with little regulation and little welfare payments."
 WGR_DVP_national_liberal_great_germany:0 "A Great Germany"
 WGR_DVP_national_liberal_great_germany_desc:0 "Germany is a great country, with freedoms, culture, and a free market! No longer are we subject to British and French Demands! Democracy shall rule here forever!"
 WGR_DVP_market_liberal_political_status_quo:0 "Political Status Quo"
 WGR_DVP_market_liberal_political_status_quo_desc:0 "We have all the political reforms we need, so we can cancel our plan of rolling back reforms."
 WGR_DVP_market_liberal_affirm_constitutional_commitments:0 "Affirm Constitutional Commitments"
 WGR_DVP_market_liberal_affirm_constitutional_commitments_desc:0 "We are committed to retaining the constitution and maintaining Democracy in Germany."
 WGR_DVP_market_liberal_defend_freedoms:0 "Defend Freedoms"
 WGR_DVP_market_liberal_defend_freedoms_desc:0 "We shall support the freedom of the people, including religion, speech, and assembly."
 WGR_DVP_market_liberal_support_small_buisness:0 "Support Small Buisness"
 WGR_DVP_market_liberal_support_small_buisness_desc:0 "We must support small buisnesses, as they are the backbone of the economy."
 WGR_DVP_market_liberal_protect_minority_establishments:0 "Protect Minority Establishments"
 WGR_DVP_market_liberal_protect_minority_establishments_desc:0 "Supporting the rights of minorities to participate in the economy can only help the economy."
 WGR_DVP_market_liberal_womens_rights:0 "Women's Rights"
 WGR_DVP_market_liberal_womens_rights_desc:0 "Having women go to work will produce more money, and thus a stronger economy."
 WGR_DVP_market_liberal_lower_buisness_tax:0 "Lower Corporate Tax"
 WGR_DVP_market_liberal_lower_buisness_tax_desc:0 "A lower corporate tax would stimulate the economy. However, we need to convince the Reichstag to allow this."
 WGR_DVP_market_liberal_support_military_companies:0 "Support Military Companies"
 WGR_DVP_market_liberal_support_military_companies_desc:0 "The Army needs more equipment. Buying more from the military manufacturers would help stimulate the economy."
 WGR_DVP_market_liberal_tax_breaks_for_construction:0 "Tax Breaks for Construction Companies"
 WGR_DVP_market_liberal_tax_breaks_for_construction_desc:0 "If construction companies have more money, then that money is sure to trickle down to more factories, right?"
 WGR_DVP_market_liberal_working_tradition:0 "Working Tradition"
 WGR_DVP_market_liberal_working_tradition_desc:0 "The German people have developed a tradtion of working hard and earning money!"
 WGR_DVP_market_liberal_women_at_work:0 "Women at Work"
 WGR_DVP_market_liberal_women_at_work_desc:0 "We need to support the right of Women to leave the home and earn money."
 WGR_DVP_market_liberal_prosperous_germany:0 "A Prosperous Germany"
 WGR_DVP_market_liberal_prosperous_germany_desc:0 "With our new economic reforms, Germany has Prospered to a level unknown in all of History!"
 #Zentrum
 west_german_focus_Zentrum_tradition:0 "German Republic Focus Tree - Conservative Traditions"
 WGR_Zentrum_tradition_start:0 "Conservative Traditions"
 WGR_Zentrum_tradition_start_desc:0 "The German People have decided that a Christian, Conservative tradition is necessary in this country. Now, we can make more sweeping reforms of the system."
 WGR_Zentrum_Adenauer_tradition_start:0 "A Moderate Zentrumspartei"
 WGR_Zentrum_Adenauer_tradition_start_desc:0 "Konrad Adenauer's Zentrumspartei has evolved into a pan-christian party. Now, we can go about making better friends with the West and healing divisions in German Society."
 WGR_Zentrum_Kaas_tradition_start:0 "Remain in the Tower"
 WGR_Zentrum_Kaas_tradition_start_desc:0 "Ludwig Kaas' Zentrumspartei has evolved into a right-wing Catholic party. Now, we can better go about re-affirming Christianity in society and politics."
 WGR_Zentrum_Adenauer_tradition_clean_imperial_army:0 "Clean Deutsches Heer"
 WGR_Zentrum_Adenauer_tradition_clean_imperial_army_desc:0 "We must convince the people and the world that the Imperial Army largely fought honorably. We will say that those who did commit crimes were a select few, and have been subsequently dealt with."
 WGR_Zentrum_Adenauer_tradition_redraw_state_borders:0 "Redraw State Borders"
 WGR_Zentrum_Adenauer_tradition_redraw_state_borders_desc:0 "We must redraw state borders in order to better manage the country. Gone are the complicated enclaves of the Imperial provinces, to be replaced by clean and manageable states!"
 WGR_Zentrum_Adenauer_tradition_build_more_green_belts:0 "Build more Green Belts"
 WGR_Zentrum_Adenauer_tradition_build_more_green_belts_desc:0 "Building more natural areas would increse the living standards and leisure standards of the German People."
 WGR_Zentrum_Adenauer_tradition_organic_farms:0 "Organic Farms"
 WGR_Zentrum_Adenauer_tradition_organic_farms_desc:0 "We need a law that would move German farms to a more organic system, as pesticides and other chemicals are making them less digestible."
 WGR_Zentrum_Adenauer_tradition_order:0 "Order"
 WGR_Zentrum_Adenauer_tradition_order_desc:0 "Order is a key German Value; it is a societal virtue necessary to keeping peace."
 WGR_Zentrum_Adenauer_tradition_diligence:0 "Diligence"
 WGR_Zentrum_Adenauer_tradition_diligence_desc:0 "A diligent, hardworking people makes a successful country! The German people must work hard to put Germany on the map!"
 WGR_Zentrum_Adenauer_tradition_decency:0 "Decency"
 WGR_Zentrum_Adenauer_tradition_decency_desc:0 "The German people must be good to each other. This can create a Bourgious Decency that will calm any Class Conflicts."
 WGR_Zentrum_Adenauer_tradition_christianity:0 "Christianity"
 WGR_Zentrum_Adenauer_tradition_christianity_desc:0 "While we will not force Christianity on the people, we have to remind Germany that Catholic social teachings should be an integral part of society."
 WGR_Zentrum_Adenauer_tradition_basic_law:0 "Grundgesetz"
 WGR_Zentrum_Adenauer_tradition_basic_law_desc:0 "The Basic Law of the Republic will be our new constitution, reformed to avoid any loopholes that would allow a dictatorship to take power."
 WGR_Zentrum_Adenauer_tradition_rights_for_polish_germans:0 "Minority Rights"
 WGR_Zentrum_Adenauer_tradition_rights_for_polish_germans_desc:0 "We will consider the Poles, Jews, French, and Czechs in Germany to be first-class German citizens."
 WGR_Zentrum_Adenauer_tradition_support_religious_minorities:0 "Support Religious Minorities"
 WGR_Zentrum_Adenauer_tradition_support_religious_minorities_desc:0 "Despite our Christian position, we must allow other religions equality in German politics and society. It is the right thing to do."
 WGR_Zentrum_Adenauer_tradition_housing_programs:0 "Housing Programs"
 WGR_Zentrum_Adenauer_tradition_housing_programs_desc:0 "We should build more houses for the people. According to Catholic teachings, this would be the right thing to do."
 WGR_Zentrum_Adenauer_tradition_grand_federation:0 "The Grand Federation"
 WGR_Zentrum_Adenauer_tradition_grand_federation_desc:0 "Now that our reforms are complete, we can declare Germany to be a beacon of light in Europe. Without dictatorship, socialism, and immorality, we have made a Grand Federation, that should stand the test of time."
 WGR_Zentrum_Kaas_tradition_christian_trade_unions:0 "Christian Trade Unions"
 WGR_Zentrum_Kaas_tradition_christian_trade_unions_desc:0 "While we are anti-socialist, we must support the workers' as they are the backbone of the economy."
 WGR_Zentrum_Kaas_tradition_christian_marriage:0 "Christian Marriage"
 WGR_Zentrum_Kaas_tradition_christian_marriage_desc:0 "with the new attitudes of the youth, they are starting to forget the Holyness of Matrimony. We should remind them of their responsibilities."
 WGR_Zentrum_Kaas_tradition_holy_guarantees:0 "Ecclesiastical Guarantees"
 WGR_Zentrum_Kaas_tradition_holy_guarantees_desc:0 "It is the duty of the state to safeguard the autonomy and freedoms of the Church."
 WGR_Zentrum_Kaas_tradition_priests_in_government:0 "Priests in Government"
 WGR_Zentrum_Kaas_tradition_priests_in_government_desc:0 "While the Papacy doesn't want men of the cloth to serve in government, they must, in order to preserve a Catholic way of life."
 WGR_Zentrum_Kaas_tradition_ties_with_bishops:0 "Ties with Bishops"
 WGR_Zentrum_Kaas_tradition_ties_with_bishops_desc:0 "We have to make ties with Bishops and the government, both in Germany and out."
 WGR_Zentrum_Kaas_tradition_ties_with_rome:0 "Ties with the Papacy"
 WGR_Zentrum_Kaas_tradition_ties_with_rome_desc:0 "We should increase the Papacy's opinion of the German Government."
 WGR_Zentrum_Kaas_tradition_theology_in_schools:0 "Theology in Schools"
 WGR_Zentrum_Kaas_tradition_theology_in_schools_desc:0 "We should teach theology in public schools. This will lead to a generation of devout Catholics!"
 WGR_Zentrum_Kaas_tradition_reform_pow_laws:0 "Reform POW Laws"
 WGR_Zentrum_Kaas_tradition_reform_pow_laws_desc:0 "We need to treat Prisoners of War well, as Jesus would have wanted."
 WGR_Zentrum_Kaas_tradition_equality_for_judaism:0 "Equality for Judaism"
 WGR_Zentrum_Kaas_tradition_equality_for_judaism_desc:0 "They may be different from us, but the Jews are still our brothers in humanity. We must respect their rights, both socially, and religiously."
 WGR_Zentrum_Kaas_tradition_unemployment_benefits:0 "Unemployment Benefits"
 WGR_Zentrum_Kaas_tradition_unemployment_benefits_desc:0 "We should increase unemployment payments to ensure that the German people have a decent living standard."
 WGR_Zentrum_Kaas_tradition_support_legacy_of_windthorst:0 "Legacy of Windthorst"
 WGR_Zentrum_Kaas_tradition_support_legacy_of_windthorst_desc:0 "All Zentrum members must remember Ludwig Windthorst, the Zentrum politician who opposed Bismarck's Protestant Policies."
 WGR_Zentrum_Kaas_tradition_re_affirm_democracy:0 "Re-Affirm Democracy"
 WGR_Zentrum_Kaas_tradition_re_affirm_democracy_desc:0 "We need to maintain our democracy, as it is the most moral form of government. By giving the people freedom, we obey the words of the Bible and Jesus Christ."
 WGR_Zentrum_Kaas_tradition_holy_republic:0 "A Holy Republic"
 WGR_Zentrum_Kaas_tradition_holy_republic_desc:0 "Our Republic is Holy in Nature, as we obey both the will of the people and the Will of God."
 #economy
 WGR_econ_crisis2:0 "Economic Crisis"
 WGR_econ_crisis3:0 "Economic Crisis"
 WGR_econ_crisis4:0 "Economic Crisis"
 WGR_reform_start:0 "Reform"
 WGR_reform_start_desc:0 "We need to reform the economy to ensure economic equality and employment. We can do so either by heavy investment into union initiatives and experiments with planning, or through subsidies and trade."
 WGR_radical_reform_start:0 "Radical Reform"
 WGR_radical_reform_start_desc:0 "To fix the crisis, we must take Radical steps to move the country to a Socialist Market Economy."
 WGR_steady_reform_start:0 "Steady Reform"
 WGR_steady_reform_start_desc:0 "While we need to reform the economy, we do not need to take it to the extremes of Socialism. A regulated Liberal economy with Welfare programs will do fine."
 WGR_radical_reform_national_union:0 "Encourage Union Membership"
 WGR_radical_reform_national_union_desc:0 "Trade Unions are the main vehicle for workers to fight for their rights. We should encourage workers to join them in order to limit the power of the capitalists and encourage equality."
 WGR_radical_reform_integrate_liberal_trade_unions:0 "Encourage Union-Led Cooperatives"
 WGR_radical_reform_integrate_liberal_trade_unions_desc:0 "We should be encouraging trade unions to form democratically managed cooperatives. In such an enterprise, there would be no central management, but economic decisions would be made by the workers themselves."
 WGR_encourage_coops:0 "Encouraged Cooperatives"
 WGR_radical_reform_social_enterprises:0 "Subsidize Social Enterprises"
 WGR_radical_reform_social_enterprises_desc:0 "We should subsidize already-existing cooperatives so that they can expand their operations, and thus employ more people. In these cooperatives, employment for the firm is replaced by something like membership of the firm, where each worker is entitled to a share of the profits."
 WGR_radical_reform_fair_competition_law:0 "Fair Competition Law"
 WGR_radical_reform_fair_competition_law_desc:0 "We will introduce a Fair Competition Law in order to break up major conglomerates. This should allow others to have more opportunity to succeed, thus improving economic equality."
 WGR_reform_deutsche_bahn:0 "Improve Deutsche Bahn"
 WGR_reform_deutsche_bahn_desc:0 "We should invest more in our railway system to improve its quality and capacity. We will invest in new rail lines, new engines, new carriges, and new staff that would make sure that everything is in tip-top shape, lest any Fat Directors wish to privatize the railways..."
 WGR_reform_highways:0 "Build Highways"
 WGR_reform_highways_desc:0 "We need to construct new highways to make sure we can get cargo and people from place to place."
 WGR_radical_reform_centralize_planning:0 "Establish a Central Planning Committee"
 WGR_radical_reform_centralize_planning_desc:0 "It would be prudent to establish a Central Planning Committee to manage our national property (railways, post office, etc) as well as engage in indicative planning in order to encourage economic growth."
 WGR_radical_reform_decentralize_planning:0 "Experiment with Decentralized Planning"
 WGR_radical_reform_decentralize_planning_desc:0 "Instead of a Central Planning Committee, we will experiment with establishing Regional Planning Committees for the Länder. They will be able to engage in indicative planning and form their own state-owned firms. Regional planning might be more efficient than central planning, as they have more information on regional circumstances and local consumer needs."
 WGR_radical_reform_state_council:0 "Create the Central Planning Board"
 WGR_radical_reform_state_council_desc:0 "Now that we have nationalized some major industries, we have to make the Central Planning Committee into a permanent Central Planning Board that would manage these industries and continue to engage in indicative planning."
 WGR_voted_on_nationalization:0 "§YThe Reichstag voted on nationalizing industries.§!"
 WGR_performed_nationalization:0 "§YThe Reichstag successfully nationalized some industries.§!"
 WGR_radical_reform_municipal_councils:0 "Establish Regional Planning Boards"
 WGR_radical_reform_municipal_councils_desc:0 "We should restructure the Regional Committees into Regional Planning Boards that will manage our newly-nationalized industries. They will also continue to engage in indicative planning, which we hope will encourage positive economic trends."
 WGR_radical_reform_further_infrastructure:0 "Invest Further in Infrastructure"
 WGR_radical_reform_further_infrastructure_desc: "While German Infrastructure is already very good, we have the opportunity to make it better."
 WGR_radical_reform_factories_for_the_people:0 "Establish State-Owned Firms"
 WGR_radical_reform_factories_for_the_people_desc:0 "We need state-owned consumer goods firms to provide employment and construct cheap consumer goods that can be sold at low prices. This would ensure that more workers have wages to spend, and that they have something to spend them on."
 WGR_radical_reform_factories_for_defense:0 "Expand the Defense Industry"
 WGR_radical_reform_factories_for_defense_desc:0 "We must expand our defensive capabilities by establishing state-owned defense firms. These firms will both provide employment to workers and allow us to re-arm the Reichswehr."
 WGR_radical_reform_more_factories:0 "Expand State-Owned Firms"
 WGR_radical_reform_more_factories_desc:0 "Establishing State=Owned firms as legitimate competitors to privatly-owned firm will help us limit the power of the capitalist class by breaking their monopoly on the means of production!"
 WGR_radical_reform_more_military_factories:0 "Preparing for the Next War"
 WGR_radical_reform_more_military_factories_desc:0 "We do not know when the next Great War will come, or even if it will come at all. Whether the threat comes from the USSR in the East, the Italians in the South, or the British across the Channel, we will be ready!"
 WGR_radical_reform_housing:0 "Factory Towns"
 WGR_radical_reform_housing_desc:0 "We need to create new Factory Towns to support our industry."
 WGR_radical_reform_agrarian_socialism:0 "Voluntary Collective Farming"
 WGR_radical_reform_agrarian_socialism_desc:0 "We shall encourage our farmers to engage in collectivized agriculture, where the farmers jointly work the land and share in the profits. However, our peasantry is largely conservative, and we will thus have a hard time doing so."
 WGR_radical_reform_military_focus:0 "Coordinate with Defense Firms"
 WGR_radical_reform_military_focus_desc:0 "We must collaborate with defense firms to expand our defensive capabilities. We will establish contacts with them, and have state liasons help to coordinate our activities."
 WGR_radical_reform_civilian_focus:0 "Modernize Industrial Methods"
 WGR_radical_reform_civilian_focus_desc:0 "We will focus on modernizing our industrial methods in order to keep up with the British, American, and French economies. Germany was an industrial giant once before, and shall be again!"
 WGR_radical_reform_subsidize_small_buisness:0 "Subsidize Small Buisnesses"
 WGR_radical_reform_subsidize_small_buisness_desc:0 "Small Buisnesses are the backbone of the economy. They shall have the state's support!"
 WGR_radical_reform_no_quota:0 "From Each According to His Ability..."
 WGR_radical_reform_no_quota_desc:0 "We will make no extraneous demands on our farmers. We shall let each work according to his (or her) abilities. Although we may subsidize the farmers, we shall let the smallholders work without worrying about state demands."
 WGR_radical_reform_quotas:0 "...To Each According to His Need"
 WGR_radical_reform_quotas_desc:0 "We need to hire out farmers to provide food to the cities and the soldiers. Thus, we will have to establish unofficial quotas that they may or may not be able to meet."
 WGR_radical_reform_defensive_focus:0 "Basic Defenses"
 WGR_radical_reform_defensive_focus_desc:0 "A few basic defenses around big cities like Berlin would not go amiss. They will help our soldiers defend Germany from attack if necessary."
 WGR_radical_reform_oil:0 "Oil Refineries"
 WGR_radical_reform_oil_desc:0 "We must invest in creating new oil refineries for the state. They will compete with private firms in order to break private capital's monopoly on production and allow us to generate more wealth for the people."
 WGR_radical_reform_resources:0 "Scout for Resources"
 WGR_radical_reform_resources_desc:0 "Instead of using our resources to build oil, which we can trade for, we must look for more metals to fuel our industry! This will both improve employment and allow us to compete with private firms."
 WGR_steady_reform_economic_opportunity:0 "Reassure the People"
 WGR_steady_reform_economic_opportunity_desc:0 "We should reassure the people of the positive effects of our impending reforms. This will help to stave off both left-wing agitation and right-wing reaction."
 WGR_steady_reform_lower_tax_on_small_buisnesses:0 "Lower Taxes on Small Businesses"
 WGR_steady_reform_lower_tax_on_small_buisnesses_desc: "We must lower taxes on small businesses to enable them to do well in the face of the economic crisis."
 WGR_steady_reform_factory_subsidies:0 "Factory Subsidies"
 WGR_steady_reform_factory_subsidies_desc:0 "We have to support factories to make sure that our people have the necessary amount of consumer goods."
 WGR_steady_reform_bailout_key_industries:0 "Bailout Key Industries"
 WGR_steady_reform_bailout_key_industries_desc:0 "We need to save key consumer and military industries from bankrupcy! We should give them a temporary bailout."
 WGR_steady_reform_further_intervention:0 "Protect German Industries"
 WGR_steady_reform_further_intervention_desc:0 "We should be encouraging Germans to Buy German! In order to stimulate the economy, German people should be buying German goods from German firms. This ensures that the market can pull itself back up to standard."
 WGR_steady_reform_maintain_status_quo_for_now:0 "Encourage Trade"
 WGR_steady_reform_maintain_status_quo_for_now_desc:0 "By encouraging Germans to trade with foreign industries, we can promote peace and stability. In addition, it will result in cheaper prices for German consumers, thus increasing overall demand."
 WGR_steady_reform_labor_protections:0 "Win Over the Workers"
 WGR_steady_reform_labor_protections_desc:0 "We should present our Protectionist Policies as a method of protecting German jobs. This should work to let us appeal to the workers."
 WGR_steady_reform_ease_trade_restrictions:0 "Ease Trade Restrictions"
 WGR_steady_reform_ease_trade_restrictions_desc:0 "We need to convince the Reichstag to lower some tariffs in order to make it easier for foreign buisnesses to invest in Germany."
 WGR_steady_reform_road_subsidies:0 "Subsidies for Highways"
 WGR_steady_reform_road_subsidies_desc:0 "Giving susbidies for highway construction will increase the amount of paths we can take to deliver cargo and supplies to our soldiers."
 WGR_steady_reform_revitalize_north:0 "Revitalize The North"
 WGR_steady_reform_revitalize_north_desc:0 "We have to make sure that Northern Germany, our industrial base, is running at full efficiency. To this end, we will encourage the construction of new factories in the northern regions, which will also provide more employment for German workers."
 WGR_steady_reform_industrialize_south:0 "Industrialize the South"
 WGR_steady_reform_industrialize_south_desc:0 "We should have a more even industrial base, to allow for redundencies. In this vein, we will encourage the construction of factories in the South, where the population is currently somewhat agrarian and conservative."
 WGR_steady_reform_bring_food_from_south:0 "Food from the South"
 WGR_steady_reform_bring_food_from_south_desc:0 "Food from the south feeds the growing population from the north. Southern Germany is very agrarian, so we will simply play to our people's strengths. We will encourage the farmers to bring their harvest up north."
 WGR_steady_reform_northern_more_factories:0 "Northern Investments"
 WGR_steady_reform_northern_more_factories_desc:0 "Incentives to invest in Northern Germany should help bolster its economy. If we can atract both foreign and domestic capital to the region, we are sure to redevelop Germany as the industrial powerhouse of Europe."
 WGR_steady_reform_search_for_resources:0 "Improve Resource Mills"
 WGR_steady_reform_search_for_resources_desc:0 "We need to improve our excavation and resource extraction technology to better serve the German economy. If more resources are available, then more goods will become available, thus decreasing their prices. This benefits both the consumers, the producers, and even our defense industry."
 WGR_steady_reform_oil:0 "Develop Synthetic Refineries"
 WGR_steady_reform_oil_desc:0 "We need to encourage German companies to invest in synthetic fuel refining technology. This way, Germany can become less dependent on foreign trade."
 WGR_steady_reform_resources_from_the_north:0 "Resources from the North"
 WGR_steady_reform_resources_from_the_north_desc:0 "We should encourage Southern Industrial Firms to purchase resources from within Germany. This will encourage Northern Refining Firms to increase production."
 WGR_steady_reform_unionize_workers:0 "Unionize Workers in the South"
 WGR_steady_reform_unionize_workers_desc:0 "We should encourage Trade Union activity in the largely conservative south. It does not matter what ideology these unions follow, only that they help to organize the workers."
 WGR_steady_reform_military_factories_1:0 "Construct Military Factories in the North"
 WGR_steady_reform_military_factories_1_desc:0 "We cannot neglect the military. We should construct more military factories in Northern Germany. This will both provide us with military equipment and provide more employment."
 WGR_steady_reform_military_factories_2:0 "Construct Military Factories in the South"
 WGR_steady_reform_military_factories_2_desc:0 "We must construct more military factories in the South to help industrialize the region. This would also geographically diversify our defense industry, preventing shortages caused by foreign occupation."
 WGR_reform_research_slot:0 "Max Plank Society"
 WGR_reform_research_slot_desc:0 "We need to invest resources in improving the education of the people! This way, we can encourage our population to become politically conscious and allow Germany to be at the forefront of scientific research!"
 WGR_status_quo_start:0 "Moderation"
 WGR_status_quo_start_desc:0 "Economic moderation, not reform, will save the Republic! We can either implement further Austerity measures to save the budget, or pricitize welfare and infrastructure programs to decrease expenditure."
 WGR_austerity_start:0 "Austerity Measures"
 WGR_austerity_start_desc:0 "Through a combination of temporarily increased taxes and spending cuts, we can save the budget, which would allow us to invest back into the economy once the crisis is over."
 WGR_privitisation_start:0 "Privatization"
 WGR_privitisation_start_desc:0 "By privatizing different state industries, we can allow the people to take initiative to save the economy themselves."
 WGR_austerity_budget_cuts:0 "Budget Cuts"
 WGR_austerity_budget_cuts_desc:0 "Cutting government spending would help balance the budget and thus prevent deficit spending. This will ensure that the government does not spend money irresponsibly, limiting the damage reckless spending will do to the economy."
 WGR_austerity_military_cuts:0 "Cut the Military Budget"
 WGR_austerity_military_cuts_desc:0 "We have to spend some time with an even weaker and less equipped military. The General Staff won't like it, but it must be done in order to prevent overspending. This should help alleviate the crisis."
 WGR_austerity_raise_taxes:0 "Raise Taxes"
 WGR_austerity_raise_taxes_desc:0 "Although it pains us to do this, we must raise taxes to balance the budget. This will prevent us from going too much further into debt."
 WGR_austerity_weather_the_storm:0 "Den Sturm Überstehen"
 WGR_austerity_weather_the_storm_desc:0 "The Reichskanzler's new speech, titled Den Sturm überstehen, more commonly known as the "Storm Speach", will tell the populace that they must Weather the Storm, and perservere until the crisis is over. It might help to calm some radicals."
 WGR_austerity_privatize_infrastructure:0 "Privatize Infrastructure"
 WGR_austerity_privatize_infrastructure_desc:0 "Selling some major railways and highways to railway and roadbuilding companies would help raise money for the government and prevent the bureaucracy from causing inefficiencies."
 WGR_austerity_hire_new_contractors:0 "Hire New Contractors"
 WGR_austerity_hire_new_contractors_desc:0 "Hiring more contractors will enable us to employ more Germans in public works. This should slightly increase their purchasing power."
 WGR_austerity_more_public_works:0 "Public Works"
 WGR_austerity_more_public_works_desc:0 "We should be using some money for public works to help push the economy back up faster. This will employ more Germans in useful projects, increasing the people's purchasing power. However, we risk entering a deficit..."
 WGR_austerity_small_bailouts:0 "Small Bailouts"
 WGR_austerity_small_bailouts_desc:0 "It is important that large industries don't collapse due to our measures. We have to invest a little bit in keeping the economy afloat."
 WGR_austerity_keep_going:0 "Continue the Path"
 WGR_austerity_keep_going_desc:0 "Our budget must remain balanced. We cannot make room for Public Works at this time. Therefore, we will simply have to weather the storm until it ends."
 WGR_austerity_tax_breaks_for_small_buisnesses:0 "Tax Breaks for Small Businesses"
 WGR_austerity_tax_breaks_for_small_buisnesses_desc:0 "Small Businesses should, however, be taxed less, as they are the backbone of this nation's economy."
 WGR_austerity_end_austerity:0 "Declare the End of Austerity"
 WGR_austerity_end_austerity_desc:0 "We have weathered the storm, and now calm has come once again. We can declare the end of Austerity and begin returning the economy to the status quo."
 WGR_austerity_restore_budget:0 "Restore the Budget"
 WGR_austerity_restore_budget_desc:0 "We can increase our public spending as we now have a far stronger economy!"
 WGR_austerity_lower_taxes:0 "Restart Spending"
 WGR_austerity_lower_taxes_desc:0 "We should begin to spend more on industrial development. Through minor intervention in the economy, we can make sure that if another crisis happens, we will be able to mitigate it."
 WGR_austerity_keep_the_tax_break:0 "Work with Small Businesses"
 WGR_austerity_keep_the_tax_break_desc:0 "We should be working with small businesses in order to strengthen Germany's middle economy. This will give our economy greater diversity, securing it from further crises."
 WGR_austerity_remove_the_tax_break:0 "Work with Large Businesses"
 WGR_austerity_remove_the_tax_break_desc:0 "We should be working with large firms to stimulate rapid growth. This way, we can quickly provide employment opportunities for thousands of Germans."
 WGR_austerity_dispersed_development:0 "Dispersed Development"
 WGR_austerity_dispersed_development_desc:0 "We should be encouraging industry to develop somewhat evenly around the country in order to provide employment to workers around the country. This will also secure our industrial base from foreign attack and natural disaster."
 WGR_austerity_concentrated_development:0 "Concentrated Development"
 WGR_austerity_concentrated_development_desc:0 "We should be developing in places that already have an industrial base, as there are more workers there to employ."
 WGR_austerity_military_effort:0 "Encourage the Defense Inudstry"
 WGR_austerity_military_effort_desc:0 "We should provide incentives for defense firms to expand their production. This way, we can make sure that our re-armament goes smoothly to ensure that Germany is a fighting power!"
 WGR_austerity_military_effort2:0 "Subsidize Military Development"
 WGR_austerity_military_effort2_desc:0 "We should subsidize military factory construction in order to expedite re-armament. This will allow us to purchase German arms on the cheap while employing more workers."
 WGR_austerity_resources:0 "Subsidize Resource Extraction"
 WGR_austerity_resources_desc:0 "We need more resources to fuel our industry! We should offer subsidies to relevant companies. This will ensure that German firms can get the mineral resources they need on the cheap, thus decreasing the cost on German consumers."
 WGR_austerity_oil:0 "Subsidize Synthetic Oil Research"
 WGR_austerity_oil_desc:0 "We need more oil and rubber, so we should subsidize research into Synthetic Oil Field technology. This will make us less dependent on foreign trade and potentially make us a fuel exporter."
 WGR_privitisation_open_trade:0 "Lower Trade Barriers"
 WGR_privitisation_open_trade_desc:0 "Trade Barriers must be relaxed so that our companies can import resources that the need without the threat of tariffs or trade wars."
 WGR_privitisation_lower_corporate_tax:0 "Lower the Corporate Tax"
 WGR_privitisation_lower_corporate_tax_desc:0 "We must decrease the tax on corporations in order to encourage corporations to expand their operations. If they have more capital to work with, then they will be able to provide employment for more Germans."
 WGR_privitisation_privatize_insurance:0 "Privatize some Healthcare Operations"
 WGR_privitisation_privatize_insurance_desc:0 "This will take us a while, but we should privitaze healthcare for all but the most needy Germans, in order to ensure that bureaucratic interference does not limit efficiency."
 WGR_privitisation_lower_taxes:0 "Lower Taxes"
 WGR_privitisation_lower_taxes_desc:0 "Lowering Taxes will give the people more purchasing power, thus stimulating the economy. If people have more money to spend, then they will stimulate demand, thus encouraging supply, thus increasing employment."
 WGR_privitisation_enforce_free_market:0 "A Market of Opportunity"
 WGR_privitisation_enforce_free_market_desc:0 "We must, unfortunately, intervene a little into the economy to make sure that smaller businesses have the opportunity to grow, and employ more people."
 WGR_privitisation_privatize_public_works:0 "Appeal to Industrialists"
 WGR_privitisation_privatize_public_works_desc:0 "Our policy of non-internvention is sure to win over some voters, particularly rich industrialists. This way, we can secure additional funding for our campaigns."
 WGR_privitisation_dont_enforce_free_market:0 "A Market of Freedom"
 WGR_privitisation_dont_enforce_free_market_desc:0 "We don't have to enforce anything. The economy should be left to its own devices. If we intervene, that will only introduce innefficiency and waste."
 WGR_privitisation_trust_laws:0 "Increase Agricultural Prices"
 WGR_privitisation_trust_laws_desc:0 "If we establish a price floor on agricultural products, we can ensure that our farmers are earning a living."
 WGR_privitisation_privatize_open_up_trade:0 "Free Trade"
 WGR_privitisation_privatize_open_up_trade_desc:0 "We should open up trade and seek contacts in other countries. This will ensure that we can get the resources we need in Germany."
 WGR_privitisation_french_businesses:0 "Reach out to French Firms"
 WGR_privitisation_french_businesses_desc:0 "The French are our neighbors, and we should start with reaching out to their corporations to get investments in our country."
 WGR_privitisation_british_businesses:0 "British Shipping Agreements"
 WGR_privitisation_british_businesses_desc:0 "We need to get British shipping firms to bring their ships to our ports, and we need our goods in London stores."
 WGR_privitisation_american_businesses:0 "American Automobiles"
 WGR_privitisation_american_businesses_desc:0 "We need to bring American designs and assembly methods to Germany, to bolster our assembly lines. Perhaps we can bring German cars to the United States as well..."
 WGR_privitisation_austrian_businesses:0 "Austrian Free Trade Agreement"
 WGR_privitisation_austrian_businesses_desc:0 "A free trade agreement with Austria would get more investments into both our nations. This will improve Austro-German relations and cooperation."
 WGR_privitisation_czech_businesses:0 "Invest in the Sudetenland"
 WGR_privitisation_czech_businesses_desc:0 "Convincing the Czech government to allow German businesses to invest into the Sudetenland will be no easy task, but should we do so, the German population would become even more sympathetic to our government."
 WGR_privitisation_italian_oil:0 "Libyan Oil Refineries"
 WGR_privitisation_italian_oil_desc:0 "Asking Italy to let our corporations invest in Libya will likely produce no result, but hopefully, something will come out of it."
 WGR_privitisation_hungarian_businesses:0 "Hungarian Arms Deal"
 WGR_privitisation_hungarian_businesses_desc:0 "Selling Arms to Hungary would allow us to invest in factories to make more. This will stimulate employment."
 WGR_privitisation_romanian_oil:0 "Romanian Oil Agreement"
 WGR_privitisation_romanian_oil_desc:0 "We need to get better deals for Romanian Oil. The more oil we have access to, the more we can defend against Bolshevik aggression!"
 WGR_privitisation_polish_businesses:0 "Bonn to Wilno"
 WGR_privitisation_polish_businesses_desc:0 "A common Railway Deal with Polish Firms would improve the ability of Germans to send their goods to Poland and the Baltic."
 WGR_privitisation_portugese_tungsten:0 "Deals for Tungsten"
 WGR_privitisation_portugese_tungsten_desc:0 "We need better trade deals from Portugal for their Tungsten."
 WGR_privitisation_research_slot:0 "Robert Koch Institute"
 WGR_privitisation_research_slot_desc:0 "We have enough resources to invest in more research projects."
 WGR_marlib_trade:0 "Germany is open for Trade"
 #military
 WGR_military_start:0 "Renegotiate the Treaty of Versailles"
 WGR_military_start_desc:0 "Now that Democracy is saved, we can ask the Western Allies for their consent in letting us re-arm."
 WGR_army_amnesty_for_nazi_officers:0 "Amnesty for some NSDAP Officers"
 WGR_army_amnesty_for_nazi_officers_desc:0 "While they are against the republic and everything Germany holds dear, we must allow some National Socialist generals into the German General Staff."
 WGR_army_no_amnesty:0 "No Amnesty!"
 WGR_army_no_amnesty_desc:0 "We have other officers to rely on. The Nationalists can rot in jail for the rest of their lives for all we care!"
 WGR_army_mobile_warfare:0 "New Mobility Doctrine"
 WGR_army_mobile_warfare_desc:0 "It is clear that trench warfare failed us in the last war. Our new military strategy will be based around fast movements and Panzer combat."
 WGR_army_grand_battleplan:0 "Reform Old Doctrines"
 WGR_army_grand_battleplan_desc:0 "We should continue to use old military doctrines, but we need to reform and adapt them to modern technologies."
 WGR_army_mobile_warfare_motorized:0 "Motorize Our Troops"
 WGR_army_mobile_warfare_motorized_desc:0 "In order to get our soldiers around faster, we need to develop new motors and engines."
 WGR_army_mobile_warfare_armor:0 "New Armor Designs"
 WGR_army_mobile_warfare_armor_desc:0 "We should invest in new Panzer designs. Several design firms, such as Porsche and MAN should be available to help out."
 WGR_army_mobile_warfare_heavy_armor:0 "Focus on Heavy Armor Designs"
 WGR_army_mobile_warfare_heavy_armor_desc:0 "We need heavy tanks to take hits and deal a lot of damage to the enemy."
 WGR_army_mobile_warfare_light_armor:0 "Focus on Light Armor Designs"
 WGR_army_mobile_warfare_light_armor_desc:0 "We need light tanks to go around the enemy and cut them off from their supplies."
 WGR_army_mobile_warfare_medium_armor:0 "Develop Medium Tank Designs"
 WGR_army_mobile_warfare_medium_armor_desc:0 "We should develop some tanks that would balance the power of the heavy tank with the speed of a light tank."
 WGR_army_battleplan_infantry_weapons:0 "New Infantry Weapon Standards"
 WGR_army_battleplan_infantry_weapons_desc:0 "We need new and modern infantry weapons to give to our army."
 WGR_army_battleplan_planning_office:0 "Decentralize Command Offices"
 WGR_army_battleplan_planning_office_desc:0 "The General Staff should be more decentralized to allow Generals to make more independent decisions, without the meddling of Central Command."
 WGR_army_battleplan_motorized:0 "Motorized Plans"
 WGR_army_battleplan_motorized_desc:0 "We should base our plans on motorized foot soldiers."
 WGR_army_battleplan_spec_ops:0 "Special Operation Plans"
 WGR_army_battleplan_spec_ops_desc:0 "We should base our plans on special operation soldiers, such as Marines and Paratroopers."
 WGR_army_battleplan_defensive_posture:0 "Defensive Posture"
 WGR_army_battleplan_defensive_posture_desc:0 "Our posture should be defensive, to protect against enemy invasion."
 WGR_army_support_equipment:0 "Support Brigades"
 WGR_army_support_equipment_desc:0 "We need some Brigades to support our frontline troops, such as engineers, radiomen, and field hospitals."
 WGR_army_superior_firepower:0 "Focus on Quality"
 WGR_army_superior_firepower_desc:0 "We need quality weapons and artillery, as manpower is precious."
 WGR_army_mass_assault:0 "Focus on Quantity"
 WGR_army_mass_assault_desc:0 "We need a lot of weapons and manpower to overwhelm the enemy."
 WGR_army_superior_firepower_arty_effort:0 "Artillery Effort"
 WGR_army_superior_firepower_arty_effort_desc:0 "We need new and more powerful artillery. The Reichswehr whould be able to hit an enemy without them knowing we're there!"
 WGR_army_superior_firepower_rocket_arty_effort:0 "Rocket Artillery Advancements"
 WGR_army_superior_firepower_rocket_arty_effort_desc:0 "Developing new rocket artillery designs will give us an extra edge against our opponents."
 WGR_army_superior_firepower_more_arty:0 "Continued Artillery Development"
 WGR_army_superior_firepower_more_arty_desc:0 "We should continue our development into high-calibre cannons."
 WGR_army_superior_firepower_infantry_weapons:0 "Develop Infantry Weapons"
 WGR_army_superior_firepower_infantry_weapons_desc:0 "We should research new infantry weapons to give to our soldiers."
 WGR_army_superior_firepower_support_equipment:0 "Support Equipment Designs"
 WGR_army_superior_firepower_support_equipment_desc:0 "We need support brigades to help our frontline infantrymen win our wars!"
 WGR_army_mass_assault_recruitment_effort:0 "Lower Recruitment Standards"
 WGR_army_mass_assault_recruitment_effort_desc:0 "We should lower the physical standards of our soldiers to recruit more into our military."
 WGR_army_mass_assault_naval_landings:0 "Large Scale Naval Landings"
 WGR_army_mass_assault_naval_landings_desc:0 "We should be investing in our ability to land large scale assaults on enemy coasts."
 WGR_army_mass_assault_motorized:0 "Motorized Mass Assault"
 WGR_army_mass_assault_motorized_desc:0 "If we could move our entire army by truck, we could be a devestating force to the enemy!"
 WGR_army_mass_assault_spec_ops:0 "Special Forces Development"
 WGR_army_mass_assault_spec_ops_desc:0 "In addition to our basic military training, some soldiers will go under more intensive training to become one of our Special Forces!"
 WGR_army_superior_firepower_offensive_posture:0 "Offensive Posture"
 WGR_army_superior_firepower_offensive_posture_desc:0 "We would rather take an offensive posture, seeing as our doctrines are more geared towards advancing, not retreating!"
 WGR_army_doctrines:0 "Doctrine Effort"
 WGR_army_doctrines_desc:0 "We must continue to develop strategies to use in battle!"
 WGR_navy_compete_with_britain:0 "Compete with the Royal Navy"
 WGR_navy_compete_with_britain_desc:0 "Our Navy should be able to blow the Royal Navy right out of the water!"
 WGR_navy_go_around_britain:0 "Go Around the Royal Navy"
 WGR_navy_go_around_britain_desc:0 "We should be able to outmaneouver the Royal Navy and try and starve Britain of Resources."
 WGR_navy_compete_cruiser_effort:0 "Cruiser Effort"
 WGR_navy_compete_cruiser_effort_desc:0 "We need to make new mid-size cruisers to increase our navy's range and adaptability."
 WGR_navy_compete_battleship:0 "Battleship Effort"
 WGR_navy_compete_battleship_desc:0 "New heavy ships would be able to better take hits and deal damage."
 WGR_navy_compete_north_sea_dockyards:0 "North Sea Dockyards"
 WGR_navy_compete_north_sea_dockyards_desc:0 "More Dockyards in the North Sea would be able to deploy new vessels faster into combat."
 WGR_navy_compete_north_sea_ports:0 "North Sea Ports"
 WGR_navy_compete_north_sea_ports_desc:0 "We need new ports in the North Sea to increase the range of our new, larger, fleet."
 WGR_navy_screens:0 "Develop new Destroyers"
 WGR_navy_screens_desc:0 "New and Fast Destroyers will help protect our convoys and supplement our Battlefleet."
 WGR_navy_battlecruisers:0 "Battlecruiser Effort"
 WGR_navy_battlecruisers_desc:0 "We should develop a new Battlecruiser design so that even if we are avoiding Combat, we can still fight."
 WGR_navy_go_around_subs:0 "Wolfpacks"
 WGR_navy_go_around_subs_desc:0 "New Submarine models will help us hit enemy convoys and deprive them of resources."
 WGR_navy_go_around_better_fuel_tanks:0 "Better Submarine Fuel Tanks"
 WGR_navy_go_around_better_fuel_tanks_desc:0 "Better fuel tanks on our submarines enables them to stay underwater longer, and at longer range."
 WGR_navy_go_around_baltic_dockyards:0 "Baltic Dockyards"
 WGR_navy_go_around_baltic_dockyards_desc:0 "Dockyards in the Baltic are further from enemy airstrips, making them less vunerable to bombing efforts."
 WGR_navy_go_around_baltic_ports:0 "Baltic Ports"
 WGR_navy_go_around_baltic_ports_desc:0 "We need ports in the Baltic to hide away and support our navy."
 WGR_navy_compete_bb_production:0 "Battleship Production"
 WGR_navy_compete_bb_production_desc:0 "We should invest our resources in making more battleships."
 WGR_navy_compete_carriers:0 "Carrier Research"
 WGR_navy_compete_carriers_desc:0 "A navy with aircraft carriers is a competative navy!"
 WGR_navy_go_around_cruiser_effort:0 "Cruiser Research"
 WGR_navy_go_around_cruiser_effort_desc:0 "If the navy gets into direct combat, we need cruisers to back up our submarines and screens."
 WGR_navy_go_around_sub_production:0 "Submarine Production"
 WGR_navy_go_around_sub_production_desc:0 "We should focus our resources on making a massive fleet of submarines."
 WGR_navy_doctrine:0 "Doctrine Research"
 WGR_navy_doctrine_desc:0 "We need to review the Admirality and develop new maneuovers to use with our advanced fleet!"
 WGR_airforce_light_bombers:0 "Light Bombers"
 WGR_airforce_light_bombers_desc:0 "We should focus on cheap and fast close air support planes."
 WGR_airforce_heavy_bombers:0 "Heavy Bombers"
 WGR_airforce_heavy_bombers_desc:0 "We should focus on large and powerful heavy bombing planes."
 WGR_airforce_carrier_CAS:0 "Carrier Close Air Support"
 WGR_airforce_carrier_CAS_desc:0 "We should put these light bombers on our aircraft carriers, to better hit our enemies' other carriers with."
 WGR_airforce_naval_bombers:0 "Naval Bombers"
 WGR_airforce_naval_bombers_desc:0 "We need planes that can efficiently bomb enemy ships, thus supplementing the navy."
 WGR_airforce_strategic_bombers:0 "Strategic Bombers"
 WGR_airforce_strategic_bombers_desc:0 "Strategic bombers are large, and can effectively damage enemy production sites."
 WGR_airforce_heavy_fighters:0 "Heavy Fighters"
 WGR_airforce_heavy_fighters_desc:0 "With all these new bombers, we need fighters to protect them on long-range missions."
 WGR_airforce_fighters:0 "Fighter Effort"
 WGR_airforce_fighters_desc:0 "We need fighters to protect our skies from invaders and clear the way for our bombers."
 WGR_airforce_aa_guns:0 "Anti-Aircraft Guns"
 WGR_airforce_aa_guns_desc:0 "We should build some anti-aircraft guns in our more densly populated provinces to protect our industry from enemy planes."
 WGR_airforce_rocketry:0 "Rocketry Effort"
 WGR_airforce_rocketry_desc:0 "We should invest in rockets that we could use to bomb the enemy."
 WGR_airforce_more_fighters:0 "Fighter Production"
 WGR_airforce_more_fighters_desc:0 "We need even more fighters to make Germany a fortress of Liberty!"
 WGR_airforce_doctrine:0 "Doctrine Effort"
 WGR_airforce_doctrine_desc:0 "We need to come up with new doctrines to use with our new air fleet!"
 #Foreign Policy
 WGR_cze_accepts_guar_treaty:0 "§GWe have signed a treaty with Czechoslovakia.§!"
 WGR_foreign_policy_start:0 "Germany on the World Stage"
 WGR_foreign_policy_start_desc:0 "Now that we have restored stability in Germany, we can begin to look outwards. We can either align with the Western Powers, or we can try to establish our own Hegemony in Europe."
 WGR_foreign_policy_western_europe:0 "Align with the West"
 WGR_foreign_policy_western_europe_desc:0 "An alliance in Western Europe would lead to stability and safety in Europe. We shall look to befriend France and Britain, and hopefully join any of their alliances."
 WGR_foreign_policy_our_own_bloc:0 "Our Own Bloc"
 WGR_foreign_policy_our_own_bloc_desc:0 "A German-led alliance in Central Europe would allow Germany to be a hegemon once again."
 WGR_defensive_bloc:0 "Berlin Accords"
 WGR_foreign_policy_franco_german_conciliation:0 "Franco-German Friendship"
 WGR_foreign_policy_franco_german_conciliation_desc:0 "A declaration of friendship with the French would mark a new era in Franco-German Relations!"
 WGR_foreign_policy_anglo_german_conciliation:0 "Anglo-German Frienship"
 WGR_foreign_policy_anglo_german_conciliation_desc:0 "A declaration of friendship with the English would mark a new era in Anglo-German Relations!"
 WGR_foreign_policy_plebiscite_in_saarland:0 "Plebiscite in Saarland"
 WGR_foreign_policy_plebiscite_in_saarland_desc:0 "It is time to trigger the plebiscite in the Saarland. We will see whether they wish to return home, or stay with the French."
 WGR_foreign_policy_renegotiate_rhineland:0 "Renegotiate The Rhineland"
 WGR_foreign_policy_renegotiate_rhineland_desc:0 "We should negotiate with the French for permission to move our troops into the Rhineland again."
 WGR_we_have_demil_zones:0 "§YThe Rhineland is no longer Demilitarized§!"
 WGR_foreign_policy_trade_agreement_with_france:0 "Trade Agreement with France"
 WGR_foreign_policy_trade_agreement_with_france_desc:0 "We should set up some free trade agreements with the French so both our economies would benefit."
 WGR_trade_with_france:0 "Trade Agreement"
 WGR_foreign_policy_fra_research_agreement:0 "Research Agreement with the French"
 WGR_foreign_policy_fra_research_agreement_desc:0 "France is very advanced technologically. We should look to trade some information, to benefit both our countries."
 WGR_foreign_policy_anglo_german_naval_treaty:0 "Anglo-German Naval Treaty"
 WGR_foreign_policy_anglo_german_naval_treaty_desc:0 "Now that we are once again committed to democracy, we should be able to convince Britain to let us build up a navy once again."
 WGR_foreign_policy_denounce_soviet:0 "Denounce the Soviet Union"
 WGR_foreign_policy_denounce_soviet_desc:0 "We must show our commitment to our friendship with Britain by denouncing the Soviet Evil!"
 WGR_denounce_soviet_good:0 "Denounced the Soviet Union"
 WGR_denounce_soviet_bad:0 "Denounced Us"
 WGR_foreign_policy_anglo_german_trade:0 "Anglo-German Trade Agreement"
 WGR_foreign_policy_anglo_german_trade_desc:0 "A Trade Agreement with the English would be beneficial to both our countries. German goods in London, Edinbrough, and even Ottawa stores would greatly increase our export income!"
 WGR_foreign_policy_anglo_german_research:0 "Research Agreement with Britain"
 WGR_foreign_policy_anglo_german_research_desc:0 "A research agreement with the Royal Navy would improve our battleships and improve their submarines."
 WGR_foreign_policy_align_west_defend_Belgium:0 "Defend Belgium"
 WGR_foreign_policy_align_west_defend_Belgium_desc:0 "Belgium might be at risk of attack from expansionist powers such as France or the Netherlands. If such a condition occurs, we should be on call to defend the Belgians."
 WGR_foreign_policy_align_west_defend_netherlands:0 "Defend the Netherlands"
 WGR_foreign_policy_align_west_defend_netherlands_desc:0 "The Netherlands might be at risk of attack from expansionist powers such as a militarist Belgium or a Britain that wants to keep them in their sphere. If such a condition occurs, we should be on call to defend the Dutch."
 WGR_foreign_policy_benelux_trade_agreements:0 "Trade Agreements with the Lowlands"
 WGR_foreign_policy_benelux_trade_agreements_desc:0 "Creating Free Trade Agreements with the Netherlands, Belgium, and Luxemburg would help to solidify relations with them and increase the living standard of their people!"
 WGR_foreign_policy_denmark:0 "Danish-German Agreement"
 WGR_foreign_policy_denmark_desc:0 "Northern Schleswig is a Danish territory, now and forever. If we agree to this, then the Danes would move a bit closer to being under our hegemony."
 WGR_foreign_policy_austria:0 "Austro-German Agreement"
 WGR_foreign_policy_austria_desc:0 "While Austria will move to our sphere of influence, we will respect its sovereignty. This seems like a fair arrangement."
 WGR_austria_friend:0 "Treaty of Friendship"
 WGR_foreign_policy_czech:0 "Czechoslovak-German Agreement"
 WGR_foreign_policy_czech_desc:0 "We will sign a treaty bringing the Czechs to our sphere of influence, while we respect their territory."
 WGR_foreign_policy_denmark_reach_out_to_scandiavian_trade:0 "Trade with Scandanavia"
 WGR_foreign_policy_denmark_reach_out_to_scandiavian_trade_desc:0 "Investing in Scandanavian companies would lead to greater cooperation between our nations."
 WGR_foreign_policy_denmark_ally_skaggarak:0 "An Allied Skaggerak"
 WGR_foreign_policy_denmark_ally_skaggarak_desc:0 "If Denmark and Norway were in our alliance, we would be able to traverse the Skaggerak with greater ease."
 WGR_foreign_policy_denmark_protecc_finland:0 "Protect Finland from the Soviet Union"
 WGR_foreign_policy_denmark_protecc_finland_desc:0 "Moscow's threatening position towards Finland cannot stand! We should offer protections to the Finns in case of invasion."
 WGR_foreign_policy_denmark_develop_finnish_war_industry:0 "Develop Finland's War Industry"
 WGR_foreign_policy_denmark_develop_finnish_war_industry_desc:0 "We should help the Finns develop their military industry by investing in their land."
 WGR_foreign_policy_denmark_access_through_sweden:0 "Access Through Sweden"
 WGR_foreign_policy_denmark_access_through_sweden_desc:0 "We should ask the Swedes for the ability to move our equipment through their territory should we need to."
 WGR_foreign_policy_denmark_memel_special_economic_zone:0 "The Memel Special Economic Zone"
 WGR_foreign_policy_denmark_memel_special_economic_zone_desc:0 "We should propose a treaty to the Lithuanians, in which they would turn over the Memelland to us, but we would allow them to use the port for trade."
 WGR_foreign_policy_denmark_baltic_alliance:0 "Ally the Baltic"
 WGR_foreign_policy_denmark_baltic_alliance_desc:0 "Having Lithuania, Estonia, and Latvia in our faction would be instrumental in our fight against the Russian menace."
 WGR_foreign_policy_austria_military_cooperation:0 "Austro-German Military Cooperation"
 WGR_foreign_policy_austria_military_cooperation_desc:0 "Open Communication between the Austrian and German military is a key for an alliance!"
 WGR_foreign_policy_austria_ally:0 "Alliance with Austria"
 WGR_foreign_policy_austria_ally_desc:0 "Austria might not be part of our nation, but they are part of our Sphere. We should have a mutual alliance with them."
 WGR_foreign_policy_austria_support_hungary:0 "Support Hungary"
 WGR_foreign_policy_austria_support_hungary_desc:0 "Hungary should be our friend, to fight against the Soviet and Italian menaces."
 WGR_supported_us:0 "Supported Us"
 WGR_foreign_policy_austria_denounce_hungary:0 "Denounce Hungarian Expansionism"
 WGR_foreign_policy_austria_denounce_hungary_desc:0 "Hungarian Expansionism only serves themselves, and will be useless against the Soviets!"
 WGR_denounced_us:0 "Denounced Us"
 WGR_foreign_policy_austria_protect_romania:0 "Guarantee Romania"
 WGR_foreign_policy_austria_protect_romania_desc:0 "We need to protect the Romanians from Russian claims on Bessarabia, and Hungarian claims on Transylvania."
 WGR_foreign_policy_austria_mediate_transylvania:0 "Mediate in Transylvania"
 WGR_foreign_policy_austria_mediate_transylvania_desc:0 "We should meet with the Romanians and Hungarians to settle the Transylvanian question once and for all."
 WGR_foreign_policy_austria_denounce_italy:0 "Denounce Italy"
 WGR_foreign_policy_austria_denounce_italy_desc:0 "We should denounce Italian expansionism in the Balkans."
 WGR_foreign_policy_austria_support_italy:0 "Support Italy"
 WGR_foreign_policy_austria_support_italy_desc:0 "A Strong Italy is a Strong Ally!"
 WGR_foreign_policy_austria_forts_in_austria:0 "Fortifications in Tyrol"
 WGR_foreign_policy_austria_forts_in_austria_desc:0 "If we are to go to war with Italy, we would need some fortifications in Tyrol, to prevent Italians from crossing into Germany."
 WGR_foreign_policy_austria_ally_yugoslavia:0 "The Treaty of Belgrade"
 WGR_foreign_policy_austria_ally_yugoslavia_desc:0 "Bringing Yugoslavia into our sphere would be a good way to contain Italy."
 WGR_foreign_policy_austria_ally_italy:0 "Alliance with Italy"
 WGR_foreign_policy_austria_ally_italy_desc:0 "An Alliance with Italy would help to extend our hegemony to the Mediterranean."
 WGR_foreign_policy_austria_claims_in_slovenia:0 "Claims in Slovenia"
 WGR_foreign_policy_austria_claims_in_slovenia_desc:0 "Now that Austria is part of our country, we should claim Slovenia as part of our territory."
 WGR_foreign_policy_czech_rights_for_germans:0 "Rights for Germans"
 WGR_foreign_policy_czech_rights_for_germans_desc:0 "A Treaty guaranteeing the rights of Sudeten Germans would go a long way in improving relations with Czechoslovakia."
 WGR_foreign_policy_czech_invite_to_alliance:0 "Invite Czechoslovakia to our Alliance"
 WGR_foreign_policy_czech_invite_to_alliance_desc:0 "Czechoslovakia would be an important member of our new alliance. We should invite them for the mutual protection of our countries."
 WGR_foreign_policy_czech_zaolzie_dispute:0 "The Zaolzie Dispute"
 WGR_foreign_policy_czech_zaolzie_dispute_desc:0 "We should mediate a Polish-Czech summit over the Zaolzie territory."
 WGR_foreign_policy_czech_send_guns:0 "Send Guns to the Czechoslovaks"
 WGR_foreign_policy_czech_send_guns_desc:0 "Czechoslovakia could use some weapons to bolster their military."
 WGR_foreign_policy_czech_invest_in_sudeten:0 "Invest in the Sudetenland"
 WGR_foreign_policy_czech_invest_in_sudeten_desc:0 "We should invest in making the Sudeten Germans' lives better."
 WGR_foreign_policy_czech_nap_poland:0 "Non-Aggression Pact with Poland"
 WGR_foreign_policy_czech_nap_poland_desc:0 "We need to take steps to get the Polish government to trust us."
 WGR_foreign_policy_czech_danzig_access:0 "The Danzig Cooridor"
 WGR_foreign_policy_czech_danzig_access_desc:0 "We should negotiate for the ability to move our soldiers through Poland."
 WGR_foreign_policy_czech_polish_officer_training:0 "Polish Officer Training"
 WGR_foreign_policy_czech_polish_officer_training_desc:0 "The Polish military could use our help. We should start an officer training program."
 WGR_foreign_policy_czech_polish_investments:0 "Invest in Eastern Poland"
 WGR_foreign_policy_czech_polish_investments_desc:0 "Eastern Poland has little industry to speak of. What would you say when your country asks \"Why didn't you invest in Eastern Poland?\"."
 WGR_foreign_policy_czech_alliance_with_poland:0 "Alliance With Poland"
 WGR_foreign_policy_czech_alliance_with_poland_desc:0 "The Threat of the an invasion by Moscow is great enough that we can consider allying with our Polish Friends."
 
 ##Reworked political focuses:
 WGR_Last_Chance_for_Democracy:0 "Last Chance for Democracy"
 WGR_Last_Chance_for_Democracy_desc:0 "We may have formed a Grand Coalition, but the threat of extremist politics still hangs over Germany. The Spectre of Communism and the Shadow of National Socialism threaten to envelop the light of German democracy. Yet we must stand firm, and take whatever actions are permissable to restore order and secure the republic!"
 WGR_Left_Coalition:0 "Coalition with the Left"
 WGR_Left_Coalition_desc:0 "We have chosen to form a coalition with the SPD. To satisfy their Deputies in the Reichstag, we will need to push for parts of their platform. They wish for us to help limit the powers of President Hindenburg and expand welfare programs."
 WGR_spd_coalition:0 "§GThe SPD is part of the Grand Coalition.§!\n"
 WGR_modDnvp_coalition:0 "§GThe DNVP Republicans are part of the Grand Coalition.§!\n"
 WGR_Right_Coalition:0 "Coalition with the Right"
 WGR_Right_Coalition_desc:0 "We have chosen to form a coalition with dissident republicans in the nominally monarchist DNVP. However, if we choose to support Hindenburg's Presidential Powers and work on lowering taxes and raising tarriffs, we could potentially gain the support of much of the German peasantry and middle class."
 WGR_Free_Meals_for_Schoolchildren:0 "Free Meals for Schoolchildren"
 WGR_Free_Meals_for_Schoolchildren_desc:0 "One of the SPD's main policy initiatives in the last election cycle was to establish a free meal program for schoolchildren. Adopting such a program would mean that children from poor families will not go hungry at school, allowing them to focus on their studies."
 WGR_Expand_Union_Activity:0 "Expand Union Activity"
 WGR_Expand_Union_Activity_desc:0 "Supporting SPD-Affiliated Unions would shore up support for our coalition and prevent the workers from moving towards the radical unions, limiting the Communists' potential recruits."
 WGR_Work_With_Reichsbanner:0 "Work with the Reichsbanner"
 WGR_Work_With_Reichsbanner_desc:0 "The Reichsbanner Schwartz-Rot-Gold is the main Republican paramilitary force. Though it is not officially affiliated with any party, most of its members are Social Democratic. Therefore, we can use our coalition to get their support for our Coalition, which would give us extra manpower to use against the SA and Red Militias."
 WGR_paramilitary_divisions:0 "Paramilitary Divisions"
 WGR_paramilitary_divisions2:0 "Paramilitary Divisions"
 WGR_paramilitary_divisions3:0 "Paramilitary Divisions"
 WGR_paramilitary_divisions4:0 "Paramilitary Divisions"
 WGR_Expand_Welfare:0 "Expand Welfare Payments"
 WGR_Expand_Welfare_desc:0 "Much of the SPD's platform is based on expanding welfare to guarantee all Germans a standard of living. This is consistant with our platform, so we should be working to push such expansions through."
 WGR_Limit_Union_Activity:0 "Limit Union Activity"
 WGR_Limit_Union_Activity_desc:0 "Much of the middle class wants us to limit trade union activity. They see it as a Marxist phenomenon, even though there are many non-marxist trade unions in Germany. However, it would be politically advantages to show the industrialists and middle class that we are on their side, and as such we will try and curtail union activity."
 WGR_Protectionism:0 "Raise Tariffs"
 WGR_Protectionism_desc:0 "In order to protect German industry, we will raise tariffs on foreign imports, a move that is sure to have the support of farmers and some industrialists. By showing that we are interested in Germans buying German goods, we can gain support for our government."
 WGR_Work_With_Stahlhelm:0 "Work with the Stahlhelm"
 WGR_Work_With_Stahlhelm_desc:0 "The Stahlhelm (Bund der Frontsoldaten) is a large paramilitary affiliated with the DNVP. Though it is officially Fascist, and sympathizes with radical nationalists, we can use Oberfohren's growing influence to secure an alliance against Communist Groups and the Sturmabteilung, who are the Stahlhelm's competitors on the Far-Right."
 WGR_Lower_Taxes:0 "Lower Taxes"
 WGR_Lower_Taxes_desc:0 "The middle class and the agrarians need tax cuts in order to secure greater purchasing power. This will allow Germans to stimulate the economy, which is sure to lead to economic growth and more employment for the working class."
 WGR_Limit_President:0 "End the Kamarilla"
 WGR_Limit_President_desc:0 "President Hindenburg has been a puppet of General von Schleicher for far too long. We should draft a bill that would end the \"25/48/53 formula\" that allows von Schleicher to manipulate politics through Hindenburg ruling by decree. It is now the Grand Coalition that rules!"
 WGR_Support_President:0 "Support President Hindenburg"
 WGR_Support_President_desc:0 "Since 1926, General Kurt von Schleicher has manipulated German politics with his Kamarilla. By using Hindenburg as a puppet, he is at least partway responsible for this crisis. However, Hindenburg's emergency powers could come in use should the need arise. Therefore, we will sideline von Schleicher in support of the President. He is sure to thank us."
 WGR_Deal_with_the_Left:0 "Dealing with the Far-Left"
 WGR_Deal_with_the_Left_desc:0 "The Far-Left threatens to violently tear down the republic to replace it with a theoretical \"Dictatorship of the Republic\"; what they call \"Socialist Democracy\". The KPD is brazenly a lapdog of Stalin, and we must take action to limit their influence before the Soviets get their way!"
 WGR_Deal_with_the_Right:0 "Dealing with the Far-Right"
 WGR_Deal_with_the_Right_desc:0 "The Far-Right threatens to destroy our democracy to replace it with a totalitarian dictatorship! Their explicit racist and sexist opinions would erode all progress made in the Revolution of 1918. Therefore, we must make sure that they can no longer poison our society!"
 WGR_Disarm_Reichsbanner:0 "Disarm the Reichsbanner"
 WGR_Disarm_Reichsbanner_desc:0 "Republican or not, the Reichsbanner are still a paramilitary. We cannot allow such extrajudicial activity to occur. This will show the conservatives that we are not biased against them."
 WGR_Disarm_Stahlhelm:0 "Disarm the Stahlhelm"
 WGR_Disarm_Stahlhelm_desc:0 "We should disarm the Stahlhelm immediately. Though they would not accept a decree by the republic, should we have the army demand that they stand down, they likely would do so out of respect."
 WGR_Anti_Communist_Propaganda:0 "Anti-Communist Propaganda"
 WGR_Anti_Communist_Propaganda_desc:0 "Our enemies are successful because of their masterful use of propaganda. We should engage in a propaganda campaign to turn the population away from Pro-Bolshevik and other self-proclaimed Communist ideologies."
 WGR_Anti_Nationalist_Propaganda:0 "Anti-Nationalist Propaganda"
 WGR_Anti_Nationalist_Propaganda_desc:0 "Hitler and his lackey Goebbels are seen as some of the best orators in the nation. We should engage in a counter-propganda campaign in order to turn the population away from the ideology of Race, Führer, and Nation."
 WGR_Ready_the_Army:0 "Ready the Army"
 WGR_Ready_the_Army_desc:0 "For the main phase of our campaign to secure order, we should spend time making sure the Army is ready to deal with inevitable outbreaks of violence."
 WGR_Red_Spectre:0 "The Red Spectre"
 WGR_Red_Spectre_desc:0 "Though smaller than the National Socialist movement, the Bolshevik Movement in Germany remains a thorn in our side and a threat to the republic. We will embark on a campaign of disruption and arrests in order to silence them for good."
 WGR_Curtail_Red_Militias:0 "Curtail Red Militias"
 WGR_Curtail_Red_Militias_desc:0 "Though the Rotfront was banned in 1929, various Communist Militias still exist in Germany. We must do our best to curtail their activities with the limited resources we have available."
 WGR_Curtail_KAPD_Support:0 "Negotiate for KAPD Support"
 WGR_Curtail_KAPD_Support_desc:0 "It would be in our interest to make tactical alliances with anti-KPD socialist groups such as the KAPD. The KAPD can help us to split the Communist movement and potentially endear some workers and unemployed to our coalition."
 WGR_Fight_All_Communists:0 "Ban Minor Communist Groups"
 WGR_Fight_All_Communists_desc:0 "Minor Communist Groups such as the KAPD and KPDO should be banned while we have the chance. Though some of there members will go the the KPD, we can at least prevent these groups from allowing KPD members to take refuge with them."
 WGR_Red_Unions:0 "Limit Red Unions' Influence"
 WGR_Red_Unions_desc:0 "We should go on a campaign to limit the influence of trade unions associated with the KPD, mainly the Revolutionäre Gewerkschafts-Opposition. We will do so by sponsoring other trade unions and arresting the RGO's leaders."
 WGR_Disrupt_KPD_Meetings:0 "Disrupt KPD Meetings"
 WGR_Disrupt_KPD_Meetings_desc:0 "In order to disrupt the KPD from below, we should send our police to disrupt any meeting with over 50 people. This will limit the KPD's ability to organize its members and recruit new ones."
 WGR_Disrupt_Arrest_Thalmann:0 "Arrest Thälmann's Gang"
 WGR_Disrupt_Arrest_Thalmann_desc:0 "In order to throw the KPD into disarray from above, we should arrest Party Leader Ernst Thälmann and his close associates. This should set off some factional conflicts that would paralyze the KPD for the time being."
 WGR_anger_against_gov:0 "Anti-Republican Sentiment"
 WGR_anger_against_gov2:0 "Anti-Republican Sentiment"
 WGR_Disrupt_Ban_KPD:0 "Ban the KPD"
 WGR_Disrupt_Ban_KPD_desc:0 "The KPD has been disrupted both from above and from below. Now it is time to cut the snake in two! By order of the government, the Communist Party of Germany will be banned for its threat to public safety and the constitution. Though residual groups may form, the Bolshevik movement will have lost all its power."
 WGR_Brown_Shadow:0 "The Brown Shadow"
 WGR_Brown_Shadow_desc:0 "The darkness of National Socialism is best shown by their Brownshirt Militia, the Sturmabteilung. If the National Socialists get their way, then the ideology of Race and Nation will replace the Democracy and Freedom we have built. To save the republic, we must destroy Hitler!"
 WGR_Disrupt_Nazi_Meetings:0 "Disrupt NSDAP Meetings"
 WGR_Disrupt_Nazi_Meetings_desc:0 "Despite the Totalitarian Nature of Hitler's ideology, the movement's local cells are given a lot of autonomy in most areas. In order to prevent the NSDAP from getting support from the cells, we must cut off this flow by sending police to disrupt NSDAP meetings of over 50 people."
 WGR_Arrest_Hitler:0 "Arrest Hitler's Goons"
 WGR_Arrest_Hitler_desc:0 "Hitler is surrounded by a group of deluded power-hungry autocrats, where he remains king due to his personality cult. Now that we've cut off support from below, it is time to cut off the beast's head. We will arrest Hitler, Göring, Goebbels, Bormann, and a couple other of Hitler's goons, so that the entire organization is in disarray."
 WGR_Curtail_the_SA:0 "Confront the Brownshirts"
 WGR_Curtail_the_SA_desc:0 "The Sturmabteilung are a menace on society. Their thuggery has intimidated many Germans, and their violence knows no bounds. We will send the Army and Police to confront and disrupt SA activities in order to show the public that we are acting for their security."
 WGR_Disarm_Stahlhelm_2nd_Phase:0 "Take Off Your Helmets!"
 WGR_Disarm_Stahlhelm_2nd_Phase_desc:0 "Though the Stahlhelm remains strong, we must disarm them in the interests of stability. We will allow them to continue as a veterans' organization, but they must take off their helmets and turn in their weapons."
 WGR_DNVP_Support:0 "Appeal to the Middle Class"
 WGR_DNVP_Support_desc:0 "Now that we have intervened against the National Socialists and the Communists, we can intervene to ensure that middle and upper-class supporters of the DNVP and NSDAP will support our government using Oberfohren's influence. With his assistance, we can get popular support for the republic, that will hopefully translate to electoral success."
 WGR_Ban_SA:0 "Ban the SA"
 WGR_Ban_SA_desc:0 "The Sturmabteilung has been sufficiently weakened by our insistance on confrontation. We are now in a position where we can declare the SA and other National Socialist paramilitaries to be illegal. We will concurrently arrest SA leader Enrst Röhm, at least, if he goes quietly..."
 WGR_Ban_NSDAP:0 "Ban the NSDAP"
 WGR_Ban_NSDAP_desc:0 "We have removed the Hitlerist Beast's head, legs, and fangs, and we can now land the final blow. We shall dissolve, by court order, the NSDAP, finally bringing the danger of National Socialism's ideology of Race to an end."
 WGR_Extra_Paramilitary:0 "Disarm Remaining Paramilitaries"
 WGR_Extra_Paramilitary_desc:0 "Now that the crisis has finished, we can disarm other paramilitaries in the country. This should finally restore some stability to our nation, as no political militias will be engaging in street violence any longer."
 #SPD
 WGR_has_socialist_government:0 "We have a §YSocialist Government§!"
 WGR_dstp_in_coalition:0 "The §YDStP§! is in our §Ycoalition§!."
 WGR_zentrum_in_coalition:0 "§YZentrum§! is in our §Ycoalition§!."
 WGR_not_dstp_in_coalition:0 "The §YDStP§! is §RNot§! in our §Ycoalition§!."
 WGR_SPD_start:0 "Social Democratic Victory"
 WGR_SPD_start_desc:0 "The SPD has won the election, and are now in a position to push through reforms. As a Marxist Reformist party, the SPD is expected to propose bills to increase government participation in economic affairs and expand civil rights. However, should we enter into coalition with a more moderate party, we may have to tone down our radical rhetoric."
 WGR_SPD_Left:0 "Continue the Program"
 WGR_SPD_Left_desc:0 "We are in a position to push for radical reforms to German society without being hampered by moderate interests. In this vein, we will work to improve economic equality through education reform, economic intervention, and going after the highest levels in society."
 WGR_SPD_Pressure_Junkers:0 "Pressure the Junkers"
 WGR_SPD_Pressure_Junkers_desc:0 "\"Junker\" is a term for Prussian nobility that dominated German politics from 1871 to 1918, and continue to have considerable influence to this day. By publically denouncing their influence and reactionary behaviour, we can begin a campaign to decrease the power of the wealthy elite."
 WGR_SPD_Encroach_Land:0 "Encroach on Oligarchic Land Ownership"
 WGR_SPD_Encroach_Land_desc:0 "We shall go after large landowners by nationalizing portions of their land over a certain amount. Some of this land will go to smallholders, and the rest will remain national property for the time being. However, we will need time to determine the correct proportion of land to nationalize, and work with small farmers to redistribute the land."
 WGR_SPD_Education_Reform:0 "Education Reform"
 WGR_SPD_Education_Reform_desc:0 "In order to reform society in a social manner, the people must be properly educated. Therefore, we will research and introduce new educational tools and methods to properly prepare our children for tomorrow's society."
 WGR_SPD_Raise_Taxes:0 "Raise Taxes"
 WGR_SPD_Raise_Taxes_desc:0 "In order to properly fund our social programs, we must raise taxes. Simply put, in order to get more out of the system, the German people must put more in. By using a progressive taxation method, we can encourage wealth equality, as the richest Germans will be taxed the most."
 WGR_SPD_Government_Mediation:0 "Worker-Capital Mediation"
 WGR_SPD_Government_Mediation_desc:0 "We will begin a program that allows Unions and Corporations to ask the government to mediate their contractural disagreements. With our intervention, we can protect workers' interests while preventing backlash."
 WGR_SPD_Nationalize_Mining:0 "Nationalize Mining Industries"
 WGR_SPD_Nationalize_Mining_desc:0 "In order to prevent the capitalists from maintaining a monopoly on economic activity, we should make Germany's mineral resources available to all. In this vein, we will propose a bill to nationalize major mineral extraction and refining operations."
 WGR_SPD_Nationalize_Military_Industries:0 "Nationalize the Defense Industry"
 WGR_SPD_Nationalize_Military_Industries_desc:0 "Even though we seek a peaceful and gradual transition to socialism, we run the risk of alienating major industries, including the defense industry, which has the additional sin of being a militarist institution. We shall propose the nationalization of the defense industry in order to limit their power and convert it into something more peaceful."
 WGR_SPD_Break_Up_Conglomerates:0 "Break up Major Conglomerates"
 WGR_SPD_Break_Up_Conglomerates_desc:0 "Instead of directly nationalizing major industries, we should force major conglomerates to break up into competing firms. This will further prevent monopolies from forming, which directly protects smaller businesses."
 WGR_SPD_Organized_Capitalism:0 "Organized Capitalism"
 WGR_SPD_Organized_Capitalism_desc:0 "We have already made great gains in encouraging economic equality and limiting the power of private firms. In the future, we will work on moving from Social Capitalism to Organized Capitalism, which allows us to achieve pacifist realism. Only then can we transition to Democratic Socialism."
 WGR_SPD_Banking_Regulations:0 "Regulate the Banks"
 WGR_SPD_Banking_Regulations_desc:0 "Further state intervention in the banking industry will enable us to limit predatory loaning practices and limit the flow of money to the upper classes. Banks are meant to be social institutions, not generators of private wealth!"
 WGR_SPD_Right:0 "Coalition with the Liberals"
 WGR_SPD_Right_desc:0 "We have chosen to enter a coalition with the Left-Liberal DStP. Though we are both interested in progressive social reforms, the DStP might become unconfortable if we propose too many Marxism-based laws. Therefore, we must moderate our positions for the time being."
 WGR_SPD_University_Expansion:0 "Expand Universities"
 WGR_SPD_University_Expansion_desc:0 "We will propose a bill to create funding for us to expand universities. The DStP's voter base has a significant proportion of intellectuals, who would surely support such a move. Thus, we can gain support among the intelligentsia."
 WGR_SPD_Progressive_Tent:0 "The Progressive Tent"
 WGR_SPD_Progressive_Tent_desc:0 "We will position our coalition as a \"Progressive Tent\", that advocates for culturally liberal positions and Keynesian Economics. This way, we can get the support of a decent portion of women, minority groups, and others on the German Left."
 WGR_SPD_Tone_down_Marxism:0 "Tone Down Marxist Rhetoric"
 WGR_SPD_Tone_down_Marxism_desc:0 "Some of the DStP's supporters are unconfortable about working with a Marxist party. As such, we will refrain from referring to Marx for the time being."
 WGR_SPD_Lower_Retirement_Age:0 "Lower the Retirement Age to 64"
 WGR_SPD_Lower_Retirement_Age_desc:0 "The retirement age in our country is 65, which approximately relates to life expectency in Germany. However, it is in our interest to lower the retirement age to 64, which would improve the health of our elderly."
 WGR_SPD_Introduce_Regulations:0 "Introduce new Regulations"
 WGR_SPD_Introduce_Regulations_desc:0 "We will introduce new regulations on German Businesses that aim to protect the consumers and small business owners. It will improve competition and allow consumers to make better choices."
 WGR_SPD_Improve_Worker_Protections:0 "Improve Worker Protection Laws"
 WGR_SPD_Improve_Worker_Protections_desc:0 "We will propose new bills that will make it harder for firms to fire workers without proper reason. This will improve our standing among workers and make our economy less dependent on Capitalist whims."
 WGR_SPD_Anti_Nationalism:0 "Anti-Nationalism"
 WGR_SPD_Anti_Nationalism_desc:0 "We will embark on a renewed Anti-Nationalist propaganda campaign to prevent the Radical Right from resurging. This campaign will denounce militarism, racialism, and promote the idea of Germany as a part of Europe, not as a foe."
 WGR_SPD_Increase_Land_Taxes:0 "Increase Property Taxes"
 WGR_SPD_Increase_Land_Taxes_desc:0 "We will increase taxes on land in order to raise more money for our social programs. This money will go towards retirment pensions and the unemployed. This will also help us, as Henry George would say, limit the power of the landowning classes."
 WGR_SPD_Income_Taxes1:0 "Raise Income Taxes"
 WGR_SPD_Income_Taxes1_desc:0 "The best way to improve economic equality in Germany would be to increase taxes on the wealthy and use that money in our social programs. This way, wealth is distributed from the top of society to the bottom."
 WGR_SPD_Welfare_Capitalism:0 "Welfare Capitalism"
 WGR_SPD_Welfare_Capitalism_desc:0 "We have achieved a state of welfare capitalism, where we have somewhat closed the economic gap between the rich and the poor by investing in welfare programs to take care of those who need it. From here, we can work on transitioning to a state of Organized Capitalism, and then a state of Democratic Socialism!"
 WGR_enough_welfare_spending:0 "We are investing at least §Y0.20§! £pol_power into welfare spending.§!"
 WGR_SPD_Welfare_Budget:0 "Expand Welfare Programs"
 WGR_SPD_Welfare_Budget_desc:0 "We should expand welfare programs in order to better provide for the least fortunate in German society. Doing so will help us bring people out of poverty and therefore contribute to a more productive nation."
 WGR_SPD_Agricultural_Subsidies:0 "Agricultural Subsidies"
 WGR_SPD_Agricultural_Subsidies_desc:0 "The peasants are still suffering, and many of them have turned to conservative agrarian movements for aid. If we were to introduce new agricultural subsidies, then the farmers would get the aid they need and perhaps begin voting for us."
 WGR_SPD_Expand_Womens_Rights:0 "Expand Access to Contraceptives"
 WGR_SPD_Expand_Womens_Rights_desc:0 "In 1919, we established equality for women in the constitution, making us one of the most progressive countries in the world in terms of womens' rights. Left-Wing groups continue to advocate for expanded access to contraceptives. We will propose a bill that establishes contraceptives as a healthcare item, thus becoming free under our welfare laws."
 WGR_SPD_Redraw_Provinces:0 "Redraw Provinces"
 WGR_SPD_Redraw_Provinces_desc:0 "We should redraw our provinces in order to make administration easier. While we will keep a strong, centralized Prussia, the other states should get cleaner borders, not based on the outdated principalities."
 WGR_SPD_No_Stab:0 "Fight Anti-Semitism"
 WGR_SPD_No_Stab_desc:0 "We should begin a propaganda campaign to fight the Anti-Semitic conspiracy theories that have plagued Germany since 1918. It is imperative to prevent fearmongerers from exploiting national pride to peddle unfounded racist accusations and pseudoscientific quackery."
 WGR_SPD_Encourage_SPD_Unions:0 "Enourage the ADGB"
 WGR_SPD_Encourage_SPD_Unions_desc:0 "The ADGB is a confederation of trade unions affiliated with the SPD. We should give it preferential treatment to bolster our support."
 WGR_SPD_Encourage_All_Unions:0 "Encourage All Unions"
 WGR_SPD_Encourage_All_Unions_desc:0 "We should encourage all trade union activity regardless of political affiliation. The Working Class should come before party politics!"
 WGR_SPD_Protect_Minorities:0 "Protect Minorities"
 WGR_SPD_Protect_Minorities_desc:0 "In addition to our Jewish population, we should also be protecting our Polish, Sorbian, Czech, and even our African citizens from discrimination."
 #DStP
 WGR_DStP_start:0 "Progressive Liberal Victory"
 WGR_DStP_start_desc:0 "We, the German State Party, have been allowed to form a government. We are expected to push for progressive social reforms and left-liberal economic issues. Our party supports ethnic and racial equality, womens' rights, and social security. Though our voter base generally tends to be small business owners and intelelctuals, we are confident that we can appeal to a wide variety of Germans by enacting reforms."
 WGR_SPD_coalition_tt:0 "The §YSPD§! is in our §YCoalition§!"
 WGR_DVP_coalition_not_tt:0 "The §YDVP§! is §RNot§! in our §YCoalition§!"
 WGR_DNVP_coalition_not_tt:0 "The §YDNVP§! is §RNot§! in our §YCoalition§!"
 WGR_DStP_Union_Support:0 "Support Trade Unions"
 WGR_DStP_Union_Support_desc:0 "Yellow and some Red Unions will get government support in order to limit the influence of Catholic and Bolshevik unions. In addition, they will be better able to correct for the excesses of Capitalism."
 WGR_DStP_Left:0 "Progress and Equality"
 WGR_DStP_Left_desc:0 "We have chosen to ally with Progressive forces in order to push through social reforms. In this vein, we will push for more economic equality and civil rights."
 WGR_DStP_Expand_Welfare_Programs:0 "Expand Welfare Programs"
 WGR_DStP_Expand_Welfare_Programs_desc:0 "We shall somewhat expand our welfare programs in order to support the social security net for the poor. Such programs allow Germans to survive while searching for a job or studying for school."
 WGR_DStP_Mediate_Strikes:0 "Mediate in Strikes"
 WGR_DStP_Mediate_Strikes_desc:0 "We should send civil servants to mediate between the unions and their management when strikes occur. In this manner, we can secure the support of members of the working class."
 WGR_DStP_Apologize_for_Ruhr:0 "Apologize for Ruhr Excesses"
 WGR_DStP_Apologize_for_Ruhr_desc:0 "In 1920, an insurrection occured in the Ruhr region. It was carried out by socialist workers in response to the Kapp Putsch, and it was brutally crushed by the Army and Right-Wing Paramilitaries, involving extrajudicial executions. We will officially apologize for the excesses of this suppresion."
 WGR_DStP_Anti_Clericalism:0 "Anti-Clerical Campaign"
 WGR_DStP_Anti_Clericalism_desc:0 "We should engage on a bureaucratic and propaganda campaign to reduce the levels of clerical influence on German politics. Religious parties dominate the right-wing, and we would rather they didn't."
 WGR_DStP_Invest_in_Infrastructure:0 "Expand Public Works Programs"
 WGR_DStP_Invest_in_Infrastructure_desc:0 "We should expand public works programs in order to help expand employment opportunities. This way, we can provide unemployed Germans with work, and thus help lift them out of poverty."
 WGR_DStP_Recruit_SocDems:0 "Recruit Moderate Social Democrats"
 WGR_DStP_Recruit_SocDems_desc:0 "With some targeted propaganda, we should be able to bring some social democrats from the SPD to the DStP, on the basis of common social and economic policies. In order to do so, we can reconcile with figures such as Ludwig Bergstrasser and Anton Erkelenz, former DDP politicians who later turned to the SPD."
 WGR_enough_public_works_spending:0 "We are investing at least §Y0.25§!£pol_power into stimulus spending.§!"
 WGR_DStP_Equal_Opportunity:0 "Equal Opportunity"
 WGR_DStP_Equal_Opportunity_desc:0 "With our high level of spending, we are on our way to offering every German equal economic opportunities! However, what they do this opportunity is up to them, though if they squander it, we have programs ready for that too."
 WGR_DStP_Right:0 "Freedom and Nation"
 WGR_DStP_Right_desc:0 "We have chosen to ally with the National Liberal German People's Party. Though we agree on the maintainance of a market economy, we argue for progressive reforms including welfare, while they argue for mildly conservative social policies and Laissez-Faire economic policies."
 WGR_DStP_Streamline_Bureaucracy:0 "Streamline the Bureaucracy"
 WGR_DStP_Streamline_Bureaucracy_desc:0 "By performing cutbacks in the civil service, we can save money in the long run. Furthermore, our coalition partners are of the opinion that the government should not interfere quite so much on society, so the government should be cut down in parallel."
 WGR_DStP_Empower_State_Governments:0 "Empower State Governments"
 WGR_DStP_Empower_State_Governments_desc:0 "By devolving some powers to the Länder governments, we can allow more regional solutions for regional problems. This will make our decision making more dynamic and cut overhead from our budget."
 WGR_DStP_Support_Local_Governments:0 "Support Local Governments"
 WGR_DStP_Support_Local_Governments_desc:0 "The coalition with the DVP is very much tying our hands in the field of reforms. However, by supporting local governments - especially cities - we can get a popular mandate to eventually ditch the DVP."
 WGR_DStP_Expand_Primary_Schools:0 "Expand Primary Schools"
 WGR_DStP_Expand_Primary_Schools_desc:0 "Despite their Right-Liberal policies, the DVP is very interested in supporting primary schools. Ergo, we should be able to agree with them on an expansion of the education budget. However, they may demand some patronage for Lutheran schools."
 WGR_DStP_Anti_Marxism:0 "Anti-Marxism"
 WGR_DStP_Anti_Marxism_desc:0 "At the behest of the DVP, we will engage in an Anti-Marxist propaganda campaign. We will insist that the Socialists do not represent the best interests of the German Nation, and thus Germans should not support them. Though the DVP thinks such a stance is weak, we insist that this is best in order to avoid the violence of the '20s."
 WGR_DStP_Patriotism:0 "New Patriotism"
 WGR_DStP_Patriotism_desc:0 "With the DVP, we shall engage in a Patriotic Propaganda campaign, though under our direction, we shall make it clear that patriotism should not be connected with any kind of discrimination against minorities."
 WGR_DStP_Ignore_Unions:0 "Promote Yellow Unions"
 WGR_DStP_Ignore_Unions_desc:0 "We shall focus our time on promoting Liberal Trade Unions that compete with the Socialist and Catholic unions. This will both increase support for our government while at the same time placating the DVP, who demands we do more to fight the unions."
 WGR_DStP_Nation_of_Opportunity:0 "A Nation of Opportunity"
 WGR_DStP_Nation_of_Opportunity_desc:0 "Germany is not just a strong progressive nation, but one of opportunity! We have managed to combine national ideals with social progressivism, to maintain the levels of progress we have now, and improve our government's standing among the people."
 WGR_DStP_Minorities:0 "Protect Minorities"
 WGR_DStP_Minorities_desc:0 "We should engage on a campaign to fight racism in our country. Even though we defeated the National Socialists, racialist ideas still exist in large quantities in Germany. Ergo, we have to release new propaganda against such bigotry."
 WGR_DStP_Working_Class:0 "Turn to the Working Class"
 WGR_DStP_Working_Class_desc:0 "Though our base traditionally centeres on the middle class, we should make an effort to improve our profile among the working classes. A larger base would improve our standings in elections, which would presumably translate into more seats in the Reichstag."
 WGR_DStP_Middle_Class:0 "Stay with the Middle Class"
 WGR_DStP_Middle_Class_desc:0 "We should expand our traditionally middle class base. By supporting intellectuals, technical specialists, and small business owners, we can secure our place in this sector of society."
 WGR_DStP_Income_Tax:0 "Raise Income Taxes"
 WGR_DStP_Income_Tax_desc:0 "We should raise income taxes in the country, but make sure to keep them in a progressive manner, meaning that those who earn higher salaries will pay a larger percentage of it in taxes. This will enable us to pay for our welfare programs."
 WGR_DStP_Small_Business:0 "Subsidize Small Businesses"
 WGR_DStP_Small_Business_desc:0 "We should be subsiziding small businesses in order to lower their costs and overhead. This will allow them to produce more units, thus making more products that sell for less. This will enable several small enterprises to get off the ground."
 WGR_DStP_Education_Budget:0 "Expand the Education Budget"
 WGR_DStP_Education_Budget_desc:0 "In order to ensure equal opportunity, we have to expand the education budget. Ensuring a quality education for all Germans would gradually wear down the clss barrier."
 #DVP/DNVP
 WGR_DVP_DNVP_tree:0 "Moderate Nationalist Tree"
 WGR_DVP_start:0 "National Liberal Victory"
 WGR_DVP_start_desc:0 "We, the German People's Party, have won the elections, and are now in a position to push our agenda through the Reichstag. We are a national liberal party that supports free trade and laissez-faire enterprise while maintaining slightly conservative social positions."
 WGR_DVP_One_Germany:0 "United Germany..."
 WGR_DVP_One_Germany_desc:0 "The DVP is a party of the Nation! All Germans must remember that despite our failure in the Great War, we can still be a strong and proud nation, regardless of class or status."
 WGR_DVP_Many_Peoples:0 "...Many Peoples"
 WGR_DVP_Many_Peoples_desc:0 "Our Coalition partner, the DStP, has pressured us to remind Germans that our national pride should not spill over into ethnic pride, and that the Jews, Poles, Sorbs, etc; are an integral part our country and its heritage."
 WGR_DVP_Expand_Education_Programs:0 "Expand Education Programs"
 WGR_DVP_Expand_Education_Programs_desc:0 "Though we oppose welfare spending on principle, we are very much interested in supporting education. With our left-liberal coalition partner, we will work to expand education programs across the country."
 WGR_DVP_Oppose_Fascism:0 "Oppose National Socialism"
 WGR_DVP_Oppose_Fascism_desc:0 "National Socialism is a dangerous racialist movement that divides the people of Germany. We should oppose any resurgent groups wherever they stand!"
 WGR_DVP_Federalism:0 "Continue Supporting Federalism"
 WGR_DVP_Federalism_desc:0 "We need strong Länder if we are to maintain a strong Germany. With a strong Bavaria, Prussia, Saxony, etc; the government will become a beacon of stability and freedom."
 WGR_DVP_Centralism:0 "Prussian Centralism"
 WGR_DVP_Centralism_desc:0 "We need a strong Prussia if we are to maintain a strong Germany. Under our direction, Prussia can be a bulwark of liberalism as well as nationalism, and provide legitimacy to the state."
 WGR_DVP_Support_Constitution:0 "Support the Constitution"
 WGR_DVP_Support_Constitution_desc:0 "Despite some of our members' conservative or monarchist tendencies, we must publically support the constitution, as it lays down the provisions of freedom and national strength."
 WGR_DVP_Lower_Tariffs:0 "Lower Tariffs"
 WGR_DVP_Lower_Tariffs_desc:0 "German industry can only prosper if we can get resources into the country. Therefore, we will propose a bill to lower tariffs. This will benefit the German consumer by making more goods available for lower prices."
 WGR_DNVP_start:0 "National Conservative Victory"
 WGR_DNVP_start_desc:0 "We, the German National People's Party, have won the elections, and are now in a position to push through our aganda through the Reichstag. Though we had been ultranationalists for much of our existence, we managed to de-radicalize in order to become a major player in Weimar politics."
 WGR_DNVP_Raise_Tariffs:0 "Raise Tariffs"
 WGR_DNVP_Raise_Tariffs_desc:0 "German farmers can only prosper when produce cannot be imported from other countries on the cheap. We should raise tariffs to limit competition and thus ensure that farmers can sell their produce at reasonably high prices."
 WGR_DNVP_Focus_on_Defense:0 "Raise Defense Spending"
 WGR_DNVP_Focus_on_Defense_desc:0 "We must raise spending on the army in order to ensure that we remain a strong and respectable European power."
 WGR_DNVP_Agricultural_Subsidies:0 "Agricultural Subsidies"
 WGR_DNVP_Agricultural_Subsidies_desc:0 "Despite our laissez-faire attitude towards the internal economy, we must provide farmers with some subsidies in order to get them back on their feet. This should decrease their operating costs, which would allow crop prices to decrease while ensuring that the farmers do not fall into poverty."
 WGR_DNVP_Agricultural_Interests:0 "Support Agricultural Groups"
 WGR_DNVP_Agricultural_Interests_desc:0 "We shall publically support agricultural interest groups and parties in the hopes of securing more voters from the agrarian sector."
 WGR_DNVP_Attract_Upper_class:0 "Attract Upper-Class Support"
 WGR_DNVP_Attract_Upper_class_desc:0 "We can draw in upper-class support from the far-right of the party by offering lower taxes on their income and land. This should help us become the dominant faction of the party."
 WGR_DNVP_The_Dream_is_Dead:0 "The Dream is Dead"
 WGR_DNVP_The_Dream_is_Dead_desc:0 "The Nationalist Dream of replacing the Republic with a dictatorial form of government (such as a Monarchy) has died. We must convince the right-wing of the party to give up this hope and support our faction instead."
 WGR_DNVP_Monarchist_Support:0 "Support from our Right-Wing"
 WGR_DNVP_Monarchist_Support_desc:0 "We should garner support from the right-wing of the DNVP in order to subordinate them to our agenda. This way, we will remain a united electoral force while not giving in too harshly to monarchist interests."
 WGR_DNVP_Tactical_Democracy:0 "Tactical Democracy"
 WGR_DNVP_Tactical_Democracy_desc:0 "Our party does not view democracy as an ideal, but merely as an electoral tactic for our conservative agenda. We will continue to publically support democracy even though the constitution might be a bit too limiting for our taste."
 WGR_Nationalists_Family_Values:0 "Family Values"
 WGR_Nationalists_Family_Values_desc:0 "We must emphasize the value of the Nuclear Family. It is the family that consumes, and the family that produces, all under the eye of the father of the household. As such, we will discourage the use of contraceptives and try to discredit feminist movements."
 WGR_Nationalists_Lutheran_Values:0 "Lutheran Values"
 WGR_Nationalists_Lutheran_Values_desc:0 "Our values go beyond the family. We should be promoting Lutheran Values among Germans. It is the Lutheran - particularly the Prussian Lutheran - that understands that it is his hard work and his loyalty to the state that brings him prosperity."
 WGR_Nationalists_Lower_Corporate_Taxes:0 "Lower Corporate Taxes"
 WGR_Nationalists_Lower_Corporate_Taxes_desc:0 "In order to stimulate growth and employement, we will introduce a bill that will lower taxes on corporations. This will allow them to expand their operations even further, providing the Germans with more employment."
 WGR_Nationalists_Lower_Income_Tax:0 "Lower Income Taxes"
 WGR_Nationalists_Lower_Income_Tax_desc:0 "We should decrease our income tax rates in order to provide Germans with more purchasing power. This will enable them to stimulate the economy through spending."
 WGR_Nationalists_Lower_Property_Tax:0 "Lower Property Taxes"
 WGR_Nationalists_Lower_Property_Tax_desc:0 "We should lower our property tax rates in order to allow middle and upper-class Germans to stimulate the economy through spending. They will have more purchasing power, which encourages demand for products, thus increasing the demand for labour."
 WGR_Nationalists_Decrease_Welfare_Payments:0 "Cut Welfare Spending"
 WGR_Nationalists_Decrease_Welfare_Payments_desc:0 "Welfare only encourages the poor to leech off the government like parasites. With our deregulations, they should be looking for work, rather than sit on our handouts."
 WGR_Nationalists_Downsize_Bureaucracy:0 "Downsize Bureaucracy"
 WGR_Nationalists_Downsize_Bureaucracy_desc:0 "With our cuts to welfare and taxes, there is less need for a large state bureaucracy. Therefore, we will conduct a downsizing campaign."
 WGR_Nationalists_Christian_Unions:0 "Support Protestant Trade Unions"
 WGR_Nationalists_Christian_Unions_desc:0 "In order to limit the influence of Red and Yellow Trade Unions, we will grudgingly support Protestant Trade Unions whose cultural interests align closer with ours. A few paltry displays of public support should be enough to get them on our side."
 WGR_Nationalists_National_Pride:0 "National Pride"
 WGR_Nationalists_National_Pride_desc:0 "Germans must remember to have pride in their nation. Whether they are from Berlin, München, Königsberg, or Essen, we all make up a united Germany!"
 WGR_Nationalists_Rework_Curriculum:0 "Rework the Curriculum"
 WGR_Nationalists_Rework_Curriculum_desc:0 "We shall rework the curriculum to better reflect Lutheran and Prussian values. Our children should be educated to be hardworking, conservative, and hostile to Marxism."
 WGR_Nationalists_Entrench_Prussianism:0 "Entrench Prussianism"
 WGR_Nationalists_Entrench_Prussianism_desc:0 "The Prussians will once more be culturally dominant in Germany. Our advocacy of Conservative Lutheran Values have also ensured our political relevance, if not dominance, which guarantees our influence on legislation for the forseeable future."
 WGR_Nationalists_Deregulation:0 "Deregulation"
 WGR_Nationalists_Deregulation_desc:0 "We should lift restrictions on what our firms can and cannot do to stimulate production. This results in cheaper goods for the consumer and more employment for the working class."
 WGR_DVP_coalition_tt:0 "The §YDVP§! is §Gin§! our §Ycoalition§!."
 WGR_DNVP_coalition_tt:0 "The §YDNVP§! is §Gin§! our §Ycoalition§!."
 WGR_Nationalists_Unite_Parties:0 "DVP-DNVP Merger"
 WGR_Nationalists_Unite_Parties_desc:0 "We should unite the Deutsch Volkspartei and the Deutschnationale Volkspartei. Both are in favor of economic liberalism and a degree of Lutheran Conservatism. The only things that the two disagree on are tariffs and agricultural subsidies, which can easily be solved by negotiation."
 WGR_Nationalists_Recruitment:0 "Appeal to the Middle Class"
 WGR_Nationalists_Recruitment_desc:0 "Instead of wasting our time trying to solve factional differences, we should be trying to recruit party members, donors, and most importantly, voters."
 WGR_Nationalists_Anti_Marxism:0 "Discredit the Marxists"
 WGR_Nationalists_Anti_Marxism_desc:0 "The Marxists across the aisle represent cultural degeneracy and welfare paternalism. We should engage on a campaign to show the Germans that Marxist values are amoral and un-German!"
 WGR_Nationalists_Moral_Standards:0 "Uphold Moral Standards"
 WGR_Nationalists_Moral_Standards_desc:0 "We should be looking to censor amoral and un-Christian media in order to make sure Germany is a moral society."
 #Zentrum
 WGR_Zentrum_start:0 "Catholic Victory"
 WGR_Zentrum_start_desc:0 "The Zentrumspartei has won the elections, and is expected to begin pushing through reforms based on Clerical teachings. We are expected to enact socially conservative economic and cultural reforms as per our interpretation of the Bible."
 WGR_Zentrum_Stegerwald:0 "The Joos Judiciary"
 WGR_Zentrum_Stegerwald_desc:0 "Joseph Joos has replaced party chairman Ludwig Kaas and is now in a position to perform economically leftist reforms. He is expected to support Catholic Trade Unions and establish more in-depth social programs."
 WGR_Zentrum_Unemployment_Pension:0 "Increase Unemployment Pensions"
 WGR_Zentrum_Unemployment_Pension_desc:0 "We should increase unemployment pensions in order to make sure that those without work can still provide for themselves and their families. As they search for a job, they should not be under a high level of stress."
 WGR_Zentrum_Support_Catholic_Unions:0 "Support Catholic Trade Unions"
 WGR_Zentrum_Support_Catholic_Unions_desc:0 "We should give official support to Catholic Trade Unions in order to help workers campaign for better conditions and to garner support for our party."
 WGR_Zentrum_Labour_Advisors:0 "Labour Advisory Program"
 WGR_Zentrum_Labour_Advisors_desc:0 "We should make it easier for Trade Unions to approach the government with their grievances. This will encourage firms to treat their workers better one way or the other, allowing us to establish a more just society."
 WGR_Zentrum_Retirement_Pension:0 "Increase Retirement Pensions"
 WGR_Zentrum_Retirement_Pension_desc:0 "German Elders have (hopefully) worked hard their entire lives. Whether they fought in battle, worked in the factory, or spent their lives on their ancestral farmland, they should be respected and rewarded."
 WGR_Zentrum_Minimum_Wage:0 "Increase the Minimum Wage"
 WGR_Zentrum_Minimum_Wage_desc:0 "The Bible says that we must be just to all, including the poor worker. After all, they have families to feed. We will thus propose a law that would increase their minimum wages."
 WGR_Zentrum_All_German_Workers_Employers_Congress:0 "All-German Workers and Employers Congress"
 WGR_Zentrum_All_German_Workers_Employers_Congress_desc:0 "By holding a convention of German Trade Unions and Employers' Organizations, we can demonstrate progress made in making Germany a just and ethical society."
 WGR_Zentrum_Social_Harmony:0 "Work Towards Social Harmony"
 WGR_Zentrum_Social_Harmony_desc:0 "A state is meant to ensure stability, but we believe that Catholic Teaching goes farther. We are meant to secure social harmony in addition to stability. It is time the German People understood this."
 WGR_Zentrum_Open_Up_Trade_Unions:0 "Pan-Christian Trade Unions"
 WGR_Zentrum_Open_Up_Trade_Unions_desc:0 "We should pressure Catholic Unions to open up their membership to other Christian Denominations. This way, we can work to heal the sectarian divide between the Protestants and Catholics, resulting in a more harmonious society."
 WGR_Zentrum_Adenauer:0 "The Adenauer Agenda"
 WGR_Zentrum_Adenauer_desc:0 "Konrad Adenauer has been chosen to represent Zentrum as Chancellor, and so the former Mayor of Cologne will get to work. Adenauer is popular among Catholics and Catholic voters, and has strong convictions in favor of democracy."
 WGR_Out_of_the_Tower:0 "Out of the Tower"
 WGR_Out_of_the_Tower_desc:0 "Our wing of the party is of the opinion that we should not restrict the Zentrumspartei to being only a Catholic party. Therefore, we will open up the party to all Christian Denominations, and even to secular voters should they wish to join. However, we will insist that our platform is based on Christian Social Teachings."
 WGR_Zentrum_Appeal_to_SPD:0 "Appeal to SPD Voters"
 WGR_Zentrum_Appeal_to_SPD_desc:0 "Our insistence on establishing social harmony based on Christian teachings is sure to resonate with some voters on the left. Therefore, we should target them for our political gain."
 WGR_Zentrum_Promote_Christian_Teachings:0 "Promote Christian Teachings"
 WGR_Zentrum_Promote_Christian_Teachings_desc:0 "We should promote the teachings of the Bible, namely hard work, social cooperation, and fairness toward others. This will help us keep stability in order to push through even more reforms."
 WGR_Zentrum_Promoted_Coops:0 "Supported Cooperatives"
 WGR_Zentrum_Support_Cooperatives:0 "Support Mutual Enterprises"
 WGR_Zentrum_Support_Cooperatives_desc:0 "Mutually-Owned and Cooperative Enterprises should get support from the government. Such a move will promote a more egalitarian method of management that encourages altruism and fairness."
 WGR_Zentrum_Support_Democracy:0 "Promote Democracy"
 WGR_Zentrum_Support_Democracy_desc:0 "Democracy is the foundation of our state, and the Zentrumspartei will be its guardian. We must engage on a propaganda campaign in order to promote the democratic idea and ensure that remaining radicalist groups cannot gain further influence."
 WGR_Zentrum_Primacy_Of_Chancellor:0 "Reichskanzler Primacy"
 WGR_Zentrum_Primacy_Of_Chancellor_desc:0 "Under the influence of the Kamarilla, President Hindenburg used his presidential powers far too often. We should reinforce the idea that it is the Chancellor who is meant to direct policy, not the President."
 WGR_Zentrum_Green_Belts:0 "Grünstadtplan"
 WGR_Zentrum_Green_Belts_desc:0 "When he was mayor of Cologne, Chancellor Adenauer built a green belt around the city, which was regarded as a success. We now propose to build new green infrastructure in the cities of Berlin, Munich, Dresden, Dörtmund, and Hamburg on the Cologne model. If these are succssful, we can continue to extend this plan to other cities."
 WGR_Zentrum_Encourage_Foreign_Investors:0 "Encourage Foreign Investment"
 WGR_Zentrum_Encourage_Foreign_Investors_desc:0 "We should work to bring foreign capital into Germany. Though many in our government would rather see us protect our firms from foreign competition, we recognize that providing jobs comes first."
 WGR_Zentrum_Social_Conservatism:0 "Encourage Social Conservativism"
 WGR_Zentrum_Social_Conservatism_desc:0 "The Bible does not teach us to succumb to moral and social degeneracy, but to uphold the values of Christ. Therefore, we will encourage socially moral behaviours such as abstinance from drugs and alcohol, and discourage the use of contraceptives."
 WGR_Zentrum_Kaas:0 "The Kaas Konkordat"
 WGR_Zentrum_Kaas_desc:0 "Party Chairman Ludwig Kaas was considered to be a compromise candidate within the party, but he actually represents the party's right-wing. As the Great Depression hit and the Republic began to collapse, Kaas began to become disillusioned with democracy, and although it is not a well-known fact in German society, he is expected to favor heavy-handed solutitions to our problems."
 WGR_Zentrum_Catholic_Teachings:0 "Promote Catholic Teachings"
 WGR_Zentrum_Catholic_Teachings_desc:0 "We should embark on a propaganda campaign to promote Catholic Social Teachings. We will promote the ideas of fairness, harmony, and respect for authority. This should help promote stability in Germany."
 WGR_Zentrum_Support_Catholic_Schools:0 "Support Catholic Schools"
 WGR_Zentrum_Support_Catholic_Schools_desc:0 "We will propose a bill in the Reichstag that would allocate additional funds to Catholic Schools. However, in order to make it so that we don't get our heads ripped off our shoulders for it, we should include funds for Lutheran schools as well."
 WGR_Zentrum_Expand_Welfare_Programs:0 "Expand Welfare Programs"
 WGR_Zentrum_Expand_Welfare_Programs_desc:0 "We should expand welfare programs in order to better work towrards social stability. As Pope Leo XIII wrote, the Church and the State must combat social inequality caused by overextended Capitalism. Welfare programs are a key step in doing so."
 WGR_Zentrum_Implicit_Authority:0 "Implicit Authority"
 WGR_Zentrum_Implicit_Authority_desc:0 "The Chancellor's quiet disdain of democracy is discussed in several circles, but in the cabinet, an informal understanding has been reached: the Chancellor has the first, last, and only say in policy. The cabinet is merely there to make his will be done."
 WGR_Zentrum_Honor_Hindenburgs_Memory:0 "Honor Hindenburg's Memory"
 WGR_Zentrum_Honor_Hindenburgs_Memory_desc:0 "President Hindenburg may have been a Prussian, but if we present him as a friend of the Zentrumspartei, our electoral position would be even more secure."
 WGR_Zentrum_Papal_Meeting:0 "Meeting with the Vatican"
 WGR_Zentrum_Papal_Meeting_desc:0 "A meeting with the Pope would be an incredible endoresement for our party. We shall meet with him to ensure the Vatican that we have protected the interests of Catholicism in Germany to the best of our ability."
 WGR_Zentrum_Traditionalism:0 "Traditional Values"
 WGR_Zentrum_Traditionalism_desc:0 "We will encourage our population to follow traditional Christian values. We can encourage faith in God and the teachings of the Church as a way to combat nationalism, racialism, and instability."
 WGR_Zentrum_Provide_an_Example:0 "Provide an Example"
 WGR_Zentrum_Provide_an_Example_desc:0 "The Reichskanzler should be sincere in his positions and lead a modest life. This way, he can provide a positive example for the rest of his flock."
 WGR_Zentrum_Fight_Prussian_Influence:0 "Fight Prussian Influence"
 WGR_Zentrum_Fight_Prussian_Influence_desc:0 "The militarist values of Prussianism are the root cause of our problems. The Great War was started by Prussian Warmongers, and the political crises during the 1920's were caued by the Prussians' unwillingness to let go of their oppressive monarchist dreams. We must combat the idea of Prussianism whenever possible."
 WGR_Zentrum_Legitimize_Rhenish_Nationalism:0 "Legitimize Rhenish Nationalism"
 WGR_Zentrum_Legitimize_Rhenish_Nationalism_desc:0 "In order to weaken Prussian influence, we have to legitimize the cause of Rhenish nationalism. The Rhinelanders have a different Cultural and Religious Identity from the other Prussias, and thus must be made into a separate state."
 WGR_Zentrum_Work_With_Regionalists:0 "Work with Regionalists"
 WGR_Zentrum_Work_With_Regionalists_desc:0 "We should open up dialogue with Regionalist groups in order to achieve a better understanding of what their regions need and how we can address their needs."
 WGR_Zentrum_Dissolve_Prussia:0 "Dissolve Prussia"
 WGR_Zentrum_Dissolve_Prussia_desc:0 "We are now in a good position to propose a bill to dissolve Prussia into three parts. First, the Rhineland will become separate. Second, East Prussia will become its own state. Thirdly, Silesia will be separated from the late Prussia. Finally, Prussia will be renamed \"Brandenburg\". This will ensure that reactionary Prussianism can no longer plague our society!"
 #events
 wgr_external.57.t:0 "The Garantiebrief"
 wgr_external.57.d:0 "Germany wants us to sign the Garantiebrief, or Treaty of Guarantees. This would basically ensure the protection of Sudaten Germans and Czechs in Germany, as well as allow German firms to invest in Sudaten Buisnesses. Should we sign it?"
 wgr_external.57.a:0 "Investments are always appreciated!"
 wgr_external.57.b:0 "Are there even Czechs in Germany?"
 wgr_external.58.t:0 "The Czechs Sign the Garantiebrief"
 wgr_external.58.d:0 "[CZE.GetNameDef] has signed the Garantiebrief, ensuring that we can exert our influence in at least part of Czechia. However, due to the very large ratio between Germans in [CZE.GetNameDef] and Czechs in [GER.GetNameDef, the treaty is largely one-sided!"
 wgr_external.58.a:0 "Hooray for us!"
 wgr_external.59.t:0 "The Czechs Do Not Sign the Garantiebrief"
 wgr_external.59.d:0 "[CZE.GetNameDef] has realized that, due to the very low presence of Czechs in Germany, the treaty would be mostly one-sided. Thus, they have declined."
 wgr_external.59.a:0 "Too bad."
 #WGR events
 wgr_grand_coalition.1.t:0 "The Grand Coalition"
 wgr_grand_coalition.1.d:0 "President von Hindenburg has refused to allow Far-Right parties to form a coalition, but has also refused to allow von Schleicher to enact martial law. As such, he must rely on a Republican party to restore order to Germany. In a rushed discussion with some legal experts, it became clear that only if the Republican parties managed to form a Grand Coalition as they did under Hermann Müller's Chancellorship could they show a position of unity and stability.\n\nHowever, we still have to appoint a figure to the position of Chancellor, so that they can have the mandate to form a coalition. Though the SPD is the largest Republican party, they are still dangerous Marxists, and cannot be given a position of leadership. Our first option is Hermann Dietrich of the DStP. Though his party is Social Liberal, he can appeal to SPD members and progressive intellectuals. Our second option is the National Liberal DVP, led by Eduard Dingeldey. Appointing the DVP can appeal to major industrialists and even get us support from some moderate Nationalists. Our third option is Konrad Adenauer, an influential member of the Zentrumspartei. Though he refused the position in 1926 (the DVP was \"too Prussian\" for him), he would be a fool to refuse again, especially against the threat of Hitlerism and Marxism. Not only would he appeal to Catholic Conservatives, his interest in working with Protestant Conservatives could earn him further support. Finally, we could appoint Zentrum Party leader Ludwig Kaas to the position. Already a compromise leader of his party, his focus is on political Catholicism and limiting the influence of Catholic Trade Unions. Importantly, he also shows sympathy for the authoritarian solutions we have been using of late."
 wgr_grand_coalition.1.a:0 "The DStP should have the mandate."
 wgr_grand_coalition.1.b:0 "The DVP has our sympathies."
 wgr_grand_coalition.1.c:0 "Adenauer should have a chance."
 wgr_grand_coalition.1.e:0 "Kaas should do well."
 wgr_grand_coalition.2.t:0 "Negotiating with the DVP"
 wgr_grand_coalition.2.d:0 "After the death of Gustav Stressemann, the German People's Party has moved significantly rightward. Though ostensibly a Republican party, many of its members barely accept it, and even call for the restoration of the monarchy. However, if we are to secure the stability of the nation, we must negotiate for their support. A few hours of negotiations have shown that the DVP will accept our terms of coalition if they are granted the foreign ministry. Stressemann was likely the Republic's most successful foreign minister, and though the party has changed since his death, the DVP could still carry respect internationally. In addition, their anti-Socialist mindset could appeal to Liberals and Conservatives in the UK and France."
 wgr_grand_coalition.2.a:0 "We agree to their terms."
 wgr_grand_coalition.2.b:0 "This is intolerable."
 wgr_grand_coalition.3.t:0 "Negotiating with the DStP"
 wgr_grand_coalition.3.d:0 "The German State Party is a far cry from the old German Democratic Party. However, having the progressive liberals in our coalition would still be a great boon, as we can position them once again as the party of intellectuals and small business owners. Much like the DVP, we will need to give up an important cabinet position to satisfy them, despite their party's current status. However, they have two seats in the Reichstag, and two seats for us means they will not be against us..."
 wgr_grand_coalition.3.a:0 "We must accept their terms."
 wgr_grand_coalition.3.b:0 "They are not worth our time."
 wgr_grand_coalition.4.t:0 "Negotiating with Zentrum"
 wgr_grand_coalition.4.d:0 "The Catholic Centre party is the largest Centre-Right party in Germany. In 1932 they managed to carry about 15% of the vote and currently have the fourth largest amount of seats in the Reichstag. To get their support, we will need to grant them the economic ministry, but this is not an incontroversial idea. Their economic positions are somewhat leftist, though party leader Ludwig Kaas wishes to limit the power of trade unions, a policy which is compatible with the right's beliefs."
 wgr_grand_coalition.4.a:0 "Their terms are reasonable."
 wgr_grand_coalition.4.b:0 "Political Catholicism is not acceptable."
 wgr_grand_coalition.5.t:0 "Dealing with a Demon"
 wgr_grand_coalition.5.d:0 "At present, the Grand Coalition has support from nearly 20% of the Reichstag, but this is nothing compared to the Hitlerists, who have about a third on their own, and the Communists, who have nearly as much as we do combined. In order to fix this issue, we will need to negotiate with parties on the edge of the centre.\n\nWe could negotiate with Otto Wels and the SPD, seeing as they have an interest in maintaining the republic and, more importantly, has 121 seats alone. Though they may be Marxist, with them, we would have about 40% of the Reichstag on our side. On the other hand, we could negotiate with a rogue faction of the German National People's Party, which tactically accepts the republic but continues to advocate for nationalist agrarian policies. Such an alliance would be controversial and limit our support from within the Reichstag, but provide us with an ally who can draw support away from the extreme right."
 wgr_grand_coalition.5.a:0 "We should work with the SPD."
 wgr_grand_coalition.5.b:0 "We should work with the DNVP."
 wgr_grand_coalition.6.t:0 "Meeting with the Marxists"
 wgr_grand_coalition.6.d:0 "We have decided that in order to secure parliamentary support for the Grand Coalition, we have to negotiate with the Social Democratic Party. Being reformists, the SPD stands against the revolutionary activities of the Communists, and thus have an incentive to work with us to secure republican stability. Though relations are cordial, it is clear that we will have to offer them multiple ministerial positions in order to gain their support. We can give the Social Democrats the Ministries for Labour, Transport, and Employment, thus gaining the trust of the working people!"
 wgr_grand_coalition.6.a:0 "The socialists are welcome."
 wgr_grand_coalition.6.b:0 "We will not cooperate with Marxists!"
 wgr_grand_coalition.7.t:0 "Consorting with the Conservatives"
 wgr_grand_coalition.7.d:0 "We have decided that in order to secure popular support for the grand coalition, we must negotiate with Ernst Oberfohren, the group chairman of the DNVP. We shall have to convince him that DNVP participation in the Grand Coalition would be preferable to working with the Hitlerists, and in doing so, we must convince him to attempt to sideline Hugenberg and reconcile with Industrialists and Monarchists that Hugenberg had alienated. If we give him the position of Reich Minister of Agriculture, we may be able to convince Oberfohren to begin his own Republican faction, which would very much be in our favor."
 wgr_grand_coalition.7.a:0 "We must cooperate with him."
 wgr_grand_coalition.7.b:0 "The DNVP cannot be allowed in government!"
 WGR_init_tree_available:0 "§GThis tree is available.§!"
 wgr_grand_coalition.8.t:0 "Agreement with the Reichsbanner"
 wgr_grand_coalition.8.d:0 "The Reichsbanner Schwartz-Rot-Gold is the main Republican paramilitary in Germany. Its members tend to be members of the SPD, DStP, and Zentrumspartei. As such, they did not need much convincing when we offered to cooperate with them against the Communists and the National Socialists. They will now essentially be at the command of the Reichswehr, which allows us to circumvent the Versailles Treaty limitation on our army while helping to maintain stability.\n\nOn both sides of the Reichstag, protests came from the Communists and Nationalists as they view this as an illegal action. However, it is clear that they have begun to fear reprocussions for their actions as we begin to close in..."
 wgr_grand_coalition.8.a:0 "Legal or not, they will be crushed!"
 wgr_grand_coalition.9.t:0 "Agreement with the Stahlhelm"
 wgr_grand_coalition.9.d:0 "Despite the Stahlhelm's far-right orientation, we have managed to hammer out an agreement that would effectively put the Stahlhelm at the army's disposal. Not only will this allow us to break up far-right cooperation, it will give us more soldiers to use against Hitler and the Communists. The Social Democrats and the Communists have both condemned this move, and the KPD has subsequently accused us of fascist sympathies. What they do not seem to realize is that we should be able to disarm the Stahlhelm once we are done with them..."
 wgr_grand_coalition.9.a:0 "Only pawns in our game..."
 wgr_grand_coalition.10.t:0 "KPD Successor Organizations Form"
 wgr_grand_coalition.10.d:0 "The Communist Party of Germany had been thoroughly Stalinized by 1930 and factional rivals had left the party. However, now that the KPD has been forced to dissolve, new successor parties have begun to form. These range from the Leninist \"Revolutionary Vanguard Party\", which still follows Lenin yet denounces Stalin, to the National Communist \"National Proletarian Front\". Out of all these successor groups, the Leipzig-based \"Proletarian League\" seems to be the largest. Largely led by members of the now-late KPD Opposition, the PB (Proletarierbund) follows a line reminiscent of Soviet Theorist Nikolai Bukharin. Rejecting the \"Social Fascist\" thesis of the KPD, the PB declares itself to be in favor of the republic until \"conditions favorable for revolution\" are achieved. In this sense, it wishes to cooperate with other left-wing groups and names the National Socialists and Fascists as its main enemy."
 wgr_grand_coalition.10.a:0 "We will keep watching them."
 wgr_grand_coalition.11.t:0 "The Body of the Beast"
 wgr_grand_coalition.11.d:0 "We had cut off the NSDAP's legs, and now we have cut off its head. The body continues to convulse with factional squabbles and half-hearted initiatives. Early calls for unity to free Hitler have devolved into power struggles at every level of the party, only made harder with police intervention. Yet the body does not die. If Hitlerism is to be destroyed once and for all, we must land the killing blow!"
 wgr_grand_coalition.11.a:0 "Germany shall be saved!"
 wgr_grand_coalition.12.t:0 "Arresting Ernst Röhm"
 wgr_grand_coalition.12.d:0 "By court order, the National Socialist Sturmabteilung was banned to the relief of much of the nation. At the same time, we moved on SA leader Ernst Röhm to arrest him at an SA meeting, which they called to discuss the situation. As the group is banned, such a meeting is clearly illegal, giving us good pretext to arrest him. A group of policemen came accompanied with an army detachment commanded by Colonel Wilhelm Keitel to the SA's headquareters, surrounded it, and demanded that all SA members lay down any arms and surrender.\n\nNo answers came immediately, but the SA responded with a hail of machine gun fire from a window. The soldiers and police immediately ducked behind their armored cars, and began firing back as soldiers moved in from behind to storm the building. After a few minutes, the soldiers entered the building, which triggered a shootout on the inside. This prompted the soldiers near the front of the building, at Colonel Keitel's command, to attack from the front. When all was said and done, SA headquarters were taken, and Röhm and many SA-men lay dead."
 wgr_grand_coalition.12.a:0 "The Beast has lost its claws!"
 wgr_grand_coalition.13.t:0 "The Collapse of the Movement"
 wgr_grand_coalition.13.d:0 "Barely a week has passed since the NSDAP was forced to dissolve, and already the National Socialist movement has collapsed. Factional infighting had torn the party structure apart at every level of organization, and all that remains are opportunits and fanatics scrambling for power. Some have remained loyal to Hitler's vision, but others have deviated to a Strasserite or Röhmite line.\n\nThe premier NSDAP remnant organization seems to be the Socialist Workers' Front (SAF), an ostensibly Hitlerist organization, but with a distinctly socialist twinge, as they call for the breakup of major conglomerates and more welfare than what Hitler would have found acceptable. The group is headquartered in Düsseldorf, and has about 6500 members."
 wgr_grand_coalition.13.a:0 "They will fall soon enough."
 WGR_saf_party:0 "SAF"
 WGR_saf_party_long:0 "Sozialistische Arbeiterfront"
 WGR_prolbund:0 "PB"
 WGR_prolbund_long:0 "Proletarierbund"
 wgr_grand_coalition.14.t:0 "The Man in the House"
 wgr_grand_coalition.14.d:0 "Hitler, Goebbels, Himmler, and Göring had gone into hiding when it became clear that we were cracking down on the National Socialist movement. However, our informants had quickly ascertained their location from a bodyguard, and moved on his location.\n\nInside the house, a different story was being told. Goebbels and Göring had been arguing for what looked to be a while, and Hitler was having none of it. When the authorities entered the house, they did not see the vociferous leader of a racist and nationalist movement, but a man who had realized too late that his ship has sunk. He gave up without a fight, followed by his disciples."
 wgr_grand_coalition.14.a:0 "The head is cut off!"
 WGR_hindenburg_dead:0 "§RHindenburg is dead.§!"
 wgr_grand_coalition.15.t:0 "Collapse of the Grand Coalition"
 wgr_grand_coalition.15.d:0 "Though we have managed to restore stability to the nation, the Grand Coalition could not stabilize itself. Now that the crisis is over and Hindenburg is dead, there is little reason for the coalition to stay together. Politicians on the moderate right had argued for leaving, and thus another election is required. The Reichstag agreed to hold elections in two months, and most cabinet members agreed to stay in their positions as caretakers."
 wgr_grand_coalition.15.a:0 "Democracy has been saved!"
 
 wgr_civil_war.100.t:0 "Turbulent Reichstag Session"
 wgr_civil_war.100.d:0 "The appointment of [WGR_chancellor] as Chancellor has coincided with the reopening of the Reichstag after a long recess. The new Chancellor thus devoted the first session to explain his cabinet's goals, but after two hours of speech, several NSDAP deputies began to shout at him loudly, accusing him of lacking any majority or mandate and being Hindenburg's puppet while waving their party flags, without any reaction from Reichstag President Göring. The session finally collapsed when a [WGR.GetRulingParty] deputy physically attacked a NSDAP deputy that had reportedly thrown a rock to the Chancellor. Although a full-on fist fight was prevented, the session got abruptly interrupted as deputies from almost all parties pulled out their guns, flags or slogans, with a complicit Göring doing little to stop it. After 20 minutes and several death threats, Vice-President of the Reichstag and SPD member Paul Löbe finally managed to bring some order to the chamber, and the Chancellor resumed his speech. This chaos can't be good for the new government's goal of stabilizing the nation."
 wgr_civil_war.100.a:0 "This Reichstag is unworkable..."
 wgr_civil_war.101.t:0 "Motion of No Confidence Defeated"
 wgr_civil_war.101.d:0 "Today, the Reichstag held a no confidence vote against [WGR_chancellor]'s government tabled by the NSDAP and the DNVP. In long speeches, Wilhelm Frick and Alfred Hugenberg denounced the lack of a majority in the Reichstag supporting the cabinet, calling it illegitimate and \"another stab in the back\". Ernst Thälmann and the KPD were willing to vote against the government, but in a fiery speech, Reichskanzler [WGR_chancellor] warned that the collapse of his government could mean \"an immediate declaration of martial law, which may not be in the best interests of many of the parties represented on this Reichstag.\" This threat had the desired effect on many KPD deputies, who abstained or even voted against, preventing the no confidence vote from succeeding. The final vote was extremely close, with the government winning it 265-257. After the vote, Göring and Frick appeared visibly frustrated, and Hitler's plotting may intensify from this point on."
 wgr_civil_war.101.a:0 "Phew!"
 wgr_civil_war.102.t:0 "Rumblings in the Reichswehr"
 wgr_civil_war.102.d:0 "General Kurt von Hammerstein-Equord, the Head of the Army Command, has met today with Chancellor [WGR_chancellor] and the Minister of Defence Wilhelm Groener to discuss the possible insurrection within sectors of the Reichswehr. Hammerstein-Equord hates Hitler, so we can count on his loyalty, but he has warned us about the open disloyalty of all division commanders within Gruppenkommando 1, comprising Berlin, Pomerania, Silesia and East Prussia. As Berlin is too important in the event of a civil war, he proposed to replace the commander of Berlin's 3rd Infantry Division, Werner von Fritsch, with General Maximilian von Weichs, whose loyalty may be easier to attain. Otherwise, the 1st Division under Walther von Brauchitsch and the 2nd Division under Fedor von Bock may be lost causes, so we must be ready to face an insurrection in the East. After the meeting, it is clear that a Reichswehr coup attempt is coming, the only question is when..."
 wgr_civil_war.102.a:0 "Worrying" 
 wgr_civil_war.103.t:0 "Reichsbanner Preparations Continue"
 wgr_civil_war.103.d:0 "After being declared as an auxiliary police force in Prussia, and with a civil war closer than ever, the Reichsbanner Schwartz-Rot-Gold has intensified their preparations for the conflict. Their leader, Karl Höltermann, has merged the anti-fascist Iron Front with the Reichsbanner, and set up military trainings for their members, managed mostly by Republican Great War veterans. The Reichsbanner has also, either openly or in secret, received lots of rifles and ammunition, and they have even drafted plans to fight any putch attempt in major cities like Berlin or Munich. President Hindenburg is very displeased with the growth of the Reichsbanner, but at this point we need them to sustain the Republic..."
 wgr_civil_war.103.a:0 "That's good to hear!"
 wgr_civil_war.0.t:0 "Assasination Attempt on [WGR_chancellor]!"
 wgr_civil_war.0.d:0 "Schocking news! As Reichskanzler [WGR_chancellor] was leaving the Reichstag, after today's turbulent session, an unidentified gunman shot him 3 times, managing to scape before the bodyguards and the police could arrest him. Two of the shots missed and the third one only caused a superficial wound in the Chancellor's leg, leaving him almost unscathed, but this assasination attempt doesn't bode well with his promises of stabilizing the nation. Meanwhile, the police has begun investigating the gunman, and several rumours point to an SA member from Berlin. We can only hope that the gunman is quickly arrested and the situation dies down soon..."
 wgr_civil_war.0.a:0 "What a day!" 
 wgr_civil_war.1.t:0 "The Battle of Berlin"
 wgr_civil_war.1.d:0 "After a brief investigation, the police had finally identified the gunman who attempted to assasinate the Reichskanzler three days ago. To the surprise of nobody, he was a SA member, so an operation was organized to arrest him. This however, has ended in disaster, as the SA fortified themselves in a local tavern, and were reportedly assisted by some policemen who refused to enter the tavern and allow reinforcements to come in. After two hours, an unrelated incident between the SA and the communists elsewhere escalated and, in the confusion, a full-blown urban battle erupted between the SA, the Communists and the overwhelmed police. The ensuing bloodbath has left 78 deaths and hundreds of wounded, and a political fallout that threatens the integrity of the Republic. The Communists have denounced the government as weak against the fascist threat, while the NSDAP has reportedly begun contacting several Reichswehr officers that, like them, are \"disgusted\" by the chaos of the Republic and the inability to stop the Communist violence. Reichskanzler [WGR_chancellor] has been forced to declare a State of Emergency, and in his capacity as Reich Commissioner of Prussia, has declared the Republican militia Reichsbanner Schwartz-Rot-Gold as an auxiliary police force, distrusting both the police and the Reichswehr due to their proximity with the far-right.\n\nDespite all attempts at reconciliation, it seems that a civil war is almost inevitable at this point, so we must be ready for it..."
 wgr_civil_war.1.a:0 "A disaster!"
 wgr_civil_war.2.t:0 "General Strike in Essen"
 wgr_civil_war.2.d:0 "The Rhineland is a stronghold for the Communist Party, and Essen is no exception. In protest against the Centrist government and the Conservative president, the Communists are holding a general strike in the city. Production has dropped significantly, and transport has ground to a halt. In an address to the workers, party leader Ernst Thälmann denounced President Hindenburg and the Grand Coalition as \"Reactionaries\", \"Oppressors\", and \"Fascist Sympathizers\", claiming that we were not doing enough to stop the National Socialists from taking over. The way things are turning out, that last accusation might turn out to be true..."
 wgr_civil_war.2.a:0 "Send in the police!"
 wgr_civil_war.3.t:0 "Communist-Stahlhelm Battle"
 wgr_civil_war.3.d:0 "Leipzig was rocked by a battle between Socialist and Far-Right Militias today. Though the Roter Frontkämpferbund (Alliance of Red Front-Fighters) was dissolved by the Republic in 1929, local militias still persist in some areas. A militia in Leipzig had accosted a Stahlhelm patrol, who then began a shootout. The Stahlhelm, a Fascist paramilitary associated with the DNVP, has been operating for many years now, so it is used to organization. Thus, by the time the police were called and order was restored, only 3 were dead and 4 wounded on the Fascist side, but 8 were dead on the Socialist side, with about 11 wounded.\n\nAn emergency meeting of the cabinet was called, but no practical solution was found. Everybody wants stability, every cabinet member wants to disarm and disband the paramilitaries, and the government wants the agitators arrested and put in prison for many years. However, because of the poor position of our military, we are unable to actually do anything about the situation."
 wgr_civil_war.3.a:0 "We shall just have to perservere."
 wgr_civil_war.4.t:0 "Shootout with the SA!"
 wgr_civil_war.4.d:0 "A pitched gun battle was fought between police and the National Socialist Sturmabteilung in Berlin today, starting when a police officer tried to arrest SA members for common thuggery. The stormtrooper had tried to intimidate a shopkeeper for some alcohol, when a policeman tried to intervene, the SA-man attacked the officer, denouncing him as a Conservative and a mason. Fellow police officers were rushed to the scene, as more SA troops converged on the street. The SA tried to free their alcoholic comrade, and the police tried to put down the chaos. This led to a pitched gun battle that ended with the deaths of 7 officers and 13 stormtroopers, and it only ended with the intervention of the military."
 wgr_civil_war.4.a:0 "Damn Thugs!"
 wgr_civil_war.5.t:0 "Attack at a Protest"
 wgr_civil_war.5.d:0 "A KPD-led protest in Düsseldorf turned violent as the local military detachment began shooting at the demonstrators. Though nobody wanted a repeat of the Altona Bloody Sunday, some young Socialists began running up to the military - for reasons unknown - and the soldiers (who were just as young) began shooting. This set off a chain of events that left 15 dead, and the Communists outraged at our actions. Though the soldiers have been arrested and are going on trial, it is expected that they will be acquited regardless.\n\nAn emergency meeting of the KPD was called where an unanimous resolution was passed condemning the violance and committing the KPD to find another solution to the instability..."
 wgr_civil_war.5.a:0 "We must be vigilant!"
 WGR_civil_war_dev_note:0 "§RThe German Civil War will be added in a future version! Make sure to visit our subreddit and discord for updates!§!"
 WGR_civil_war_dev_note2:0 "§RThe German Civil War will be added in a future version! Make sure to visit our subreddit and discord for updates!\n\nFor now, a timed national spirit will be given as a penalty.§!"
 WGR_civil_war_temp:0 "German Civil War"
 wgr_civil_war.6.t:0 "The Socialist Revolution!"
 wgr_civil_war.6.d:0 "[WGR_DDR_rebellion]"
 ddr_rebel_first:0 "Terrible news! A general strike in Essen has escalated as socialist paramilitaries overwhelmed the local police forces and ousted the local city council, arresting mayor Heinrich Schäfer (Zentrum) and declaring a new \"People's Council\". These developments were soon replicated in Köln, as law enforcement collapsed in the entire Rhineland region and socialist militias occupied Dortmund, Düsseldorf, Aachen and Koblenz, despite local resistance from catholic militias, who, without Reichswehr support, stood little chance. \n\nOnce Essen and Köln were under communist control, KPD Chairman Ernst Thälmann took control of the insurrection, declaring the beggining of the German Revolution and calling all German workers to overthrow the capitalist order. His call has failed everywhere except in Hamburg, Magdeberg and Western Saxony, where local communist paramilitaries have bested the SA and the Reichswehr and took control of those areas. It seems that we have a civil war in our hands..."
 ddr_rebel_second:0 "As we expected, the collapse of public order following the coup attempt has been used by the communists as an opportunity to rise up against both the government and the Nationalists. From his stronghold in the Rhineland, Thälmann's calls for Revolution have been heard in Magdeberg, Hamburg and Western Saxony, where, in the confusion, communist militias weree able to defeat both the SA and the government forces. We have a third contender now..."
 wgr_civil_war.6.a:0 "What a disaster!"
 wgr_civil_war.7.t:0 "The National Revolution!"
 wgr_civil_war.7.d:0 "[WGR_GER_rebellion]"
 ger_rebel_first:0 "War has come. At 3:00 PM yesterday, Walther von Brauchitsch, commanding general of the 1st Infantry Division (Königsberg), declared Martial Law in East Prussia and cut all communications with the government in Berlin. As Brauchitsch, with the support of the local SA, began rounding up and executing local leftist politicians and unionists, Fedor von Bock, commander of the 2nd Infantry Division in Stettin, followed his lead and declared Martial Law. In parallel, Adolf Hitler, the leader of the NSDAP, declared the beggining of the \"National Revolution\" from his stronghold of Breslau, hours after the city had been secured by Ewald von Kleist's 2nd Cavalry Division and its liberal mayor Otto Wagner had been executed. \n\nHitler's new \"National Salvation Government\", a coalition of the NSDAP and the DNVP, rapidly ordered all SA and Reichswehr commanders to overthrow local authorities and seize control, and despite the government's best efforts, they have been able to secure all of Germany east of Oder, along with several parts of Mecklenburg, Saxony and Schleswig-Holstein. In Munich, Ernst Röhm has managed to use the local SA, along with hundreds of Reichswehhr defectors, to kick General Ritter von Leeb's loyal 7th division out of the city, claiming it on behalf of Hitler's Breslau government. As the putch failed in Berlin thanks to the intervention of the Reichsbanner, we now have a civil war in our hands..." 
 ger_rebel_second:0 "In response to the Socialist Insurrection, the NSDAP has declared a \"National Revolution\", by which he means an armed insurrection to seize power for the Extremist Nationalists. The alliance of National Socialists and Conservative Nationalists have been joined by Monarchists and even Conservative Revolutionaries. They have seized their strongholds in Pommerania, Frankfurt/Oder, and Silesia. Hours later, a revolt in East Prussia brought Königsberg under National Socialist Control. They have declared their opposition to both the Republican government and the Socialists, meaning we have a three-way war on our hands."
 wgr_civil_war.7.a:0 "Bloody fascists!"
 wgr_civil_war.8.t:0 "Rumblings from Below"
 wgr_civil_war.8.d:0 "It seems that Hindenburg's death has been a shockwave that permeated all levels of German Society. The old General had been a symbol of stability and security for many Germans, and a symbol of national pride for others. However, despite our best attempts to restore order to Germany, we have only partially succeeded, and those who looked up to the President now live in fear of Red or Brown terror.\n\nOn the far-left, there has been talk of a revolution. Now that Hindenburg is gone, every facade of stability is fading, and militants want to strike at the \"reactionary capitalist order\". On the far-right, there has also been talk of a revolution. Remaining National Socialists wish to free their comrades and seize power from the government, now that the only moderate politician they pretended to respect is dead. It has become increasingly clear that a crisis is in store, and we must prepare..."
 wgr_civil_war.8.a:0 "We have failed."
 wgr_civil_war.9.t:0 "Attack on the Reichsbank"
 wgr_civil_war.9.d:0 "It was a normal day at the Reichsbank until about twenty National Socialist militiamen held a rally outside of it. For about 20 minutes, the speaker denounced the bank as the \"tool\" of Jewish Bolsheviks\" and \"traitorous speculators\", until the police moved to arrest them for causing a disturbance. This quickly led to a brawl, which turned into a shootout once more police arrived on the scene. For about ten minutes, both sides shot back and forth until all but six militiamen lay dead. Four more were wounded, one surrendered, and the last attempted to flee, but was captured.\n\nThe German people has had a mixed reaction to this news. While the Far-Right is treating the militiamen as martyrs, others are treating this as part of the instability brought on by Hindenburg's death. However, it seems that some Germans appreciate the police's actions as a symbol of the government protecting the people's interests. Finally, the Far-Left is decrying Fascist violence, but made sure to denounce the Reichsbank as a tool of \"exploitation\". However, many Communists and Socialists have felt that we have not done enough to curb National Socialist militas, and thus wish to take action into their own hands..."
 wgr_civil_war.9.a:0 "What now?"
 wgr_civil_war.10.t:0 "Civil War!"
 wgr_civil_war.10.d:0 "Our failure to ensure stability has led the population to lose confidence in the moderate government, and as such, the Radical Left and Radical Right have risen up seperately and delcared our government to no longer be in legitimate insterests of the people. Much of the military has sided with the Right, but both sides have a large amount of popular support. The Far-Left has seized much of industrial eastern Germany, while the Far-Right has seized the rural regions."
 wgr_civil_war.10.a:0 "We have a disaster on our hands!"
 
 wgr_election.1.t:0 "Stable Elections?"
 wgr_election.1.d:0 "A feeling of calm has descended upon Germany. Now that the Bolshevik and National Socialist movements have effectively been neutered, Germans can now live their lives free of the fear of paramilitary violence and revolutionary spectres. For some Germans, such a life is unheard of. Regardless, today is the first federal election since the formation of the Grand Coalition, and voters seem to appreciate being able to go to the polls without being harrassed by men in uniform.\n\nDespite our new-found stability, German politics remains contentious. The Social Democrats and Conservatives are both vying for the Mandate, and smaller liberal parties are hoping to gain middle-class votes from the Radical Right's collapse. The votes have been counted, the calculations made, and the winner is..."
 wgr_election.1.a:0 "...the SPD with the workers' support!"
 wgr_election.1.b:0 "...the DStP and the Middle Class!"
 wgr_election.1.c:0 "...the DVP and the Business Class!"
 wgr_election.1.e:0 "...Zentrum and the Christians!"
 wgr_election.1.f:0 "...the DNVP and the Upper Class!"
 WGR_SPD_Tree:0 "SPD Focus Tree"
 wgr_election.2.t:0 "Forming a Coalition"
 wgr_election.2.d:0 "Though we have been given the ruling mandate, we do not have a majority in the Reichstag. To rectify this situation, we must form a coalition with one of the parties ideologically similar to ours. However, should we agree to a coalition, we must give up some of our cabinet positions to our partners, but in exchange, we get their support in the Reichstag. Should we agree to a coalition?"
 wgr_election.2.a:0 "We will work with the SAPD."
 wgr_election.2.b:0 "We should partner with the DStP."
 wgr_election.2.c:0 "We do not need a coalition."
 wgr_election.3.t:0 "Forming a Coalition"
 wgr_election.3.d:0 "Though we have been given the ruling mandate, we do not have a majority in the Reichstag. Though our traditionally small party will have the leading role in the government, we will need a coalition partner to make our position tenable and help us get our reforms through. Should we agree to work with other parties, we would need to give up some cabinet positions, but we would get their suppport in the reichstag."
 wgr_election.3.a:0 "We should work with the SPD."
 wgr_election.3.b:0 "We must partner with the DVP."
 wgr_election.3.c:0 "We do not need a coalition."
 wgr_election.4.t:0 "Forming a Coalition"
 wgr_election.4.d:0 "Though we have been given the ruling mandate, we do not have a majority in the Reichstag. Our party has seen better days, but its recent revival has given people enough confidence to give us the leading role in the government. However, we will still need a coalition partner in order to make our position stable. If we agree to work with another party, we will have to give up some cabinet positions in excahange for their support."
 wgr_election.4.a:0 "We should work with the DStP."
 wgr_election.4.b:0 "We must partner with the DVP."
 wgr_election.4.c:0 "We would rather work with the DNVP."
 wgr_election.4.e:0 "We do not need a coalition!"
 wgr_election.5.t:0 "Federal Election"
 wgr_election.5.d:0 "Today is a federal election in Germany! Germans from all over the country go to the polls to vote on their parliamentary repesentatives, and many parties are vying for the top spot. On the left, we have the Social Democrats, who campaign on a progressive pro-labour platform. They aim to improve welfare programs and put pressure on the wealthy to engage in ethical business practices. Next to them, the Social Liberals advocate for welfare programs alongside market stimulus measures in order to reinvigorate the economy. The National Liberals (and their national conservative friends) advocate for conservative values and the end of the welfare state. They also wish for Germany to have a stronger place in Europe. The Social Conservatives advocate for generous welfare policies, but also the application of Christian teachings on politics and economics. As the votes are counted, who can now claim victory?"
 wgr_election.5.a:0 "The SPD!"
 wgr_election.5.b:0 "The DStP!"
 wgr_election.5.c:0 "The DVP!"
 wgr_election.5.e:0 "Zentrum!"
 wgr_election.5.f:0 "The DNVP!"
 wgr_election.6.t:0 "Forming a Coalition"
 wgr_election.6.d:0 "Though we have come victorious in the latest election, we must form a coalition with another party in the Reichstag. Doing so will give us more seats in the Reichstag, which would give us more support for our laws, but will force us to give up some ministerial positions to our coalition partner. Shall we form a coalition?"
 wgr_election.6.a:0 "We will work with the DStP."
 wgr_election.6.b:0 "We will work with the DVP."
 
 wgr_election.15.t:0 "President Hindenburg Dies"
 wgr_election.15.d:0 "Our President, Paul von Hindenburg, has died today of lung cancer. The Lion of Prussia had led our country both in War and in Peace, and his funeral will ensure that the Great Hero will be mourned accross the nation. Erwin Bumke of the DNVP will take his place and as previously agreed with the DNVP, will see out the rest of Hindenburg's term."
 wgr_election.15.a:0 "Rest in Peace"
 
 wgr_election.16.t:0 "Choosing our Candidate!"
 wgr_election.16.d:0 "With Presidential elections in a few months we must choose our candidate for the election!"
 wgr_election.16.a:0 "Co-Chairman Hans Vogel"
 wgr_election.16.z:0 "Marxist Theologian Emil Fuchs"
 wgr_election.16.b:0 "Party General Secretary Otto Nuschke"
 wgr_election.16.g:0 "Former Interior Minister Karl Jarres"
 wgr_election.16.h:0 "Mayor of Köln Konrad Adenauer"
 wgr_election.16.i:0 "Bishop Ludwig Kaas"
 wgr_election.16.j:0 "Teacher Christine Teusch"
 wgr_election.16.k:0 "Bookbinder Jakob Kaiser"
 
 wgr_election.17.t:0 "The Presidential Election of [GetYear]"
 wgr_election.17.d:0 "It is time for our presidential elections. Voters are going to polling stations to find out who will be Germany's Head of State for the next six years. Whoever is chosen is sure to give some legitimacy to their party, and will be instrumental in ensuring stability in the nation. Who will lead the ship of state?"
 wgr_election.17.a:0 "SPD Co-Chairman Hans Vogel"
 wgr_election.17.z:0 "Marxist Theologian Emil Fuchs"
 wgr_election.17.b:0 "DStP Party General Secretary Otto Nuschke"
 wgr_election.17.g:0 "Former Interior Minister Karl Jarres"
 wgr_election.17.h:0 "Mayor of Köln Konrad Adenauer"
 wgr_election.17.i:0 "Bishop Ludwig Kaas"
 wgr_election.17.j:0 "Teacher Christine Teusch"
 wgr_election.17.k:0 "Bookbinder Jakob Kaiser"
 
 wgr_internal.1.t:0 "The Kaas Affair"
 wgr_internal.1.d:0 "German Newspaper Readers had become accustomed to political crises in the 1920's, and today they were not shocked at the latest scandal. A reporter caught Reichskanzler Ludwig Kaas discussing his disapproval with the democratic process with other Zentrumspartei leaders. Though his mild disdain of democracy is quietly known in Germany, he had never before been heard referring to democracy as \"a process of idiocy\" and \"rule by the Godless\". To the surprise of nobody, the Priest ranted for several minutes about the Social Democrats, Communists, and even the Progressive Liberals. Though many are disgusted by these words, others have barely reacted. To them, it is merely a sign that democracy had never truly healed."
 wgr_internal.1.a:0 "Is Democracy still in Danger?"
 wgr_internal.2.t:0 "Joos Denounces Kaas"
 wgr_internal.2.d:0 "In the wake of the Kaas affair, not many are sure of its consequences. However, Catholic trade unionist Joseph Joos, who represents the left-wing of the Zentrumspartei, has denounced Kaas for his authoritarian tendencies and lack of commitment to the Catholic Workers' cause. Consequently, Joos has demanded that Kaas resign from his positions and allow the party to choose a new leader.\n\nKonrad Adenauer, the former Mayor of Colone and President of the Prussian State Council has come to Kaas's defense. In a statement to reporters, he said that \"as long as I have known him, Herr Kaas has always supported constitutionalism and social equality. I do not believe these slanders are factual.\" Several Zentrum politicians have echoed Adenauer's words."
 wgr_internal.2.a:0 "What will happen next?"
 WGR_zentrum_vote:0 "§YZentrum will vote on a new leader.§!"
 wgr_internal.3.t:0 "The Kaas Affair Continues"
 wgr_internal.3.d:0 "Joseph Joos has not ceased his efforts to pressure Ludwig Kaas to resign. He and his wing of the party have intensified their efforts to denounce Kaas as a traitor to democratic values. Their apperances in the press and in party meetings have begun to turn public opinion against Kaas, and the Zentrum party committee have thus agreed to a vote of no confidence against the Rhenish priest. As the votes have been counted, it was found that..."
 wgr_internal.3.a:0 "...Kaas has been removed!"
 wgr_internal.3.b:0 "...Kaas remains!"
 wgr_internal.3.c:0 "...it could go either way!"
 wgr_internal.4.t:0 "The New Zentrumspartei Chairman"
 wgr_internal.4.d:0 "Ludwig Kaas has been removed from the Zentrumspartei Leadership, and a new leader has become necessary. Joseph Joos, leader of the Anti-Kaas left-wing, has been quickly approved as party chairman. He will now lead the Zentrumspartei in electoral politics. Joos is stronly pro-labour and supports \"leaving the Tower\" in order to make Zentrum a broad interdenomianational party. He is expected to encourage cooperative enterprises and social welfare programs over charity and private enterprise."
 wgr_internal.4.a:0 "Congratulations, Herr Joos!"
 
 wgr_internal.5.t:0 "Germany asks for Trading Contacts"
 wgr_internal.5.d:0 "The German Foreign Ministry has contacted ours and asked if they could establish trading contacts with French companies. Doing so would bring us profits and improve relations between the two countries. Shall we accept?"
 wgr_internal.5.a:0 "Of Course!"
 wgr_internal.5.b:0 "No, we can't trust those Germans."
 
 wgr_internal.6.t:0 "France Agrees to a Trade Agreement"
 wgr_internal.6.d:0 "The French government has agreed to let us contact and invite French firms to create or expand operations in Germany. This will ultimately foster cooperation between the French and Geman peoples, and bring jobs to Germany."
 wgr_internal.6.a:0 "We shall begin immediately!"
 
 wgr_internal.7.t:0 "France Refuses our Trade Proposal"
 wgr_internal.7.d:0 "The French government has refused to allow us to invite French firms to Germany. This is a blow to international cooperation, the German people, and our government."
 wgr_internal.7.a:0 "A Shame"
 
 wgr_internal.8.t:0 "Negotiations Sucessful!"
 wgr_internal.8.d:0 "We have sucessfully negotiated with a French Firm to establish a division in our country. We will now have access to another Synthetic Refinary to use in our military production."
 wgr_internal.8.a:0 "Hooray for Free Trade!"
 
 wgr_internal.9.t:0 "One of Our Companies Creates a German Facility"
 wgr_internal.9.d:0 "The German Government has successfully lobbied for one of our companies to create a factility within Germany. While the Germans will reap most of the benefits, we still get some financial support from their adventures."
 wgr_internal.9.a:0 "The Germans win, but we also win."
 
 wgr_internal.10.t:0 "Negotiations Failed"
 wgr_internal.10.d:0 "We have failed in bringing a French company to Germany. While it is only a temporary setback, it does not help the reputation of our government or our economic policies."
 wgr_internal.10.a:0 "A Shame"
 
 wgr_internal.11.t:0 "Negotiations Sucessful!"
 wgr_internal.11.d:0 "We have sucessfully negotiated with a French Firm to establish a division in our country. We will now have access to another Industrial Complex to use in our construction efforts."
 wgr_internal.11.a:0 "Hooray for Free Trade!"
 
 wgr_internal.12.t:0 "Integrate SPD Moderates?"
 wgr_internal.12.d:0 "If we were to bring SPD moderates into the DStP, we could gain some support. These moderates have similar positions to ours, but they would probably require us to change our program somewhat. Shall we agree to the integration?"
 wgr_internal.12.a:0 "Of course!"
 wgr_internal.12.b:0 "We don't need their help."
 
 wgr_internal.13.t:0 "[This.GetCampaignIdeology] Political Campaign"
 wgr_internal.13.d:0 "[This.GetCampaignIdeology] activists have been campaigning heavily lately, and many Germans have been won over to their message. Through posters, rallies, and other events, their party membership has grown, and this is expected to translate into a stronger performance in the next election."
 wgr_internal.13.a:0 "Interesting"
 WGR_Bolshevik_Campaign:0 "Bolshevik"
 WGR_RevSoc_Campaign:0 "Revolutionary Socialist"
 WGR_DemSoc_Campaign:0 "Social Democratic"
 WGR_SocLib_Campaign:0 "Left Liberal"
 WGR_MarLib_Campaign:0 "Classical Liberal"
 WGR_LibCon_Campaign:0 "National Liberal"
 WGR_SocCon_Campaign:0 "Social Conservative"
 WGR_NatCon_Campaign:0 "National Conservative"
 WGR_AutDes_Campaign:0 "Monarchist"
 WGR_FarAut_Campaign:0 "Ultranationalist"
 WGR_Fascist_Campaign:0 "National Socialist"
 
 wgr_internal.61.t:0 "The All-German Workers and Employers Congress"
 wgr_internal.61.d:0 "Today, a government-organized convention of workers' and employers' associations met in Berlin to discuss our latest reforms and their effects on society. The first presenters were the workers' associations and Trade Unions. They reported that workers' wages had increased, and their working and living conditions had improved accordingly. They also reporeted an increase in the number of mutual associations and cooperative enterprises. They recommend that the government continue such policies and pressure privately owned enteprise and other corporations to adopt the cooperative model.\n\nThe employers' associations reported an increase of both supply and demand, indicating a revitalized economy. They indicated that Germany should be ready for a period of steady, but moderately slow, growth. They recommend that we limit increases in welfare spending (beyond that required by inflation) and lessen corporate taxes by moderate amounts."
 wgr_internal.61.a:0 "A Complete Success!"
 
 WGR_may_spawn_coup:0 "§RThis option may anger some elements in German society...§!\n"
 wgr_external.1.t:0 "The Germans ask for Permission to Re-Arm"
 wgr_external.1.d:0 "The German government has approached ours and asked for permission to expand their military (limited by the Treaty of Versailles to 100,000 soldiers), as well as establish an air-force. They assure us that they have successfully contained radicalism in their country, and need a military to fight against expansionist and radical powers, i.e. the Soviet Union.\n\nHowever, our office has quickly drawn up two possible plans. Both would agree to re-armament on the condition that Germany restarts debt payments, with the money being taken out of its defence budget. On paper, this would mean that Germany has no restrictions placed on it, but in practice, they would only be able to do a limited re-armament. We can choose a harsher - yet shorter - payment plan, or a more lenient - yet longer - payment plan."
 wgr_external.1.a:0 "A 5-year Plan would suit us best."
 wgr_external.1.b:0 "An 8-year Plan would suit Germany best."
 wgr_external.1.c:0 "Since when could we trust the Germans?"
 
 wgr_external.2.t:0 "The French Give Permission"
 wgr_external.2.d:0 "The French government has given us permission to re-arm on the condition that we restart debt payments using a portion of our defense budget. This would mean we would only be able to do a partial re-armament until the debt is repaid. Should we refuse this plan and go forwards with re-armament anyways, we would surely face an invasion. Or, we could just, well, not re-arm."
 wgr_external.2.a:0 "We have no choice but to accept."
 wgr_external.2.b:0 "We won't give in to the French demands!"
 wgr_external.2.c:0 "On second thought..."
 
 wgr_external.3.t:0 "The French Refuse Permission"
 wgr_external.3.d:0 "The French government has refused us permission to re-arm. It is quite obvious that they would feel threatned by a strong German military, which is understandable. But regardless of our understanding, we have to make a choice. We could either refuse their resolution, and re-arm anyways (which would definately lead to a French invasion) or back down, which would anger the Reichswehr and the people. What shall we choose?"
 wgr_external.3.a:0 "We won't give in to the French demands!"
 wgr_external.3.b:0 "On second thought..."
 
 wgr_external.4.t:0 "Germany Declares Re-Armament Against Our Wishes!"
 wgr_external.4.d:0 "The German Government has spat in our face and has begun re-armament despite our refusal to allow it. It is clear that the Germans cannot be trusted, and pose a threat to Europe and France. What shall we do about it?"
 wgr_external.4.a:0 "We hit them while they're weak!"
 wgr_external.4.b:0 "We cannot afford a war right now."
 
 wgr_external.5.t:0 "The Germans Rescind Their Requests"
 wgr_external.5.d:0 "The German Government has decided that they would rather not re-arm if it would mean paying us reparations."
 wgr_external.5.a:0 "A Victory for our Administration!"
 
 wgr_external.6.t:0 "The Saarland Plebiscite"
 wgr_external.6.d:0 "The time has come for us to hold a plebiscite in the Saarland as mandated by the League of Nations. There will be three options on the ballot: Return to Germany, Status Quo, or become a French Department. However, we can just not hold the referendum..."
 wgr_external.6.a:0 "We must hold the referendum!"
 wgr_external.6.b:0 "The Saarland should be a part of France!"
 
 wgr_external.7.t:0 "France blocks the Saarland Plebiscite"
 wgr_external.7.d:0 "The French Government has denied the League of Nations the ability to set up a plebiscite in the Saarland, meaning that for the moment, the Saar is part of France!"
 wgr_external.7.a:0 "We'll get it back eventually!"
 
 wgr_external.8.t:0 "The Saarland Goes With Germany"
 wgr_external.8.d:0 "The People of the Saarland have voted to return to Germany. Transferring the state over shall be immediate, and the League of Nations administration shall leave the area in exchange for a German one."
 wgr_external.8.a:0 "The People have Chosen."
 
 wgr_external.9.t:0 "The Saarland Goes With Germany"
 wgr_external.9.d:0 "The People of the Saarland have voted to return to Germany. Transferring the state over shall be immediate, and the League of Nations administration shall leave the area in exchange for a German one."
 wgr_external.9.a:0 "Deutsch ist die Saar!"
 
 wgr_external.10.t:0 "The Saarland chooses the Status Quo"
 wgr_external.10.d:0 "The People of the Saarland have voted to remain under a League of Nations Mandate. The current administration seems to be popular with the people, and we hope to keep it that way."
 wgr_external.10.a:0 "Perhaps we'll try again in 15 years?"
 
 wgr_external.11.t:0 "The Saarland chooses the Status Quo"
 wgr_external.11.d:0 "The People of the Saarland have voted to remain under a League of Nations Mandate. The current administration seems to be popular with the people, and the French hope to keep it that way."
 wgr_external.11.a:0 "But why would they do that?"
 
 wgr_external.12.t:0 "The Saarland Goes With France"
 wgr_external.12.d:0 "The People of the Saarland have voted to join France as the Department of the Saare. We will immediately begin setting up administration and begin recruiting soldiers from the area."
 wgr_external.12.a:0 "Another Victory for France!"
 
 wgr_external.13.t:0 "The Saarland Goes With France"
 wgr_external.13.d:0 "The People of the Saarland have voted to join France as the Department of the Saare. The French have immediately begun setting up administration and have begun recruiting soldiers from the area. As per League of Nations rules, we have lost our claim to the area."
 wgr_external.13.a:0 "It's Treason, then."
 
 wgr_external.14.t:0 "The Germans Ask for Permission to Remilitarize the Rhineland"
 wgr_external.14.d:0 "The German Government has approached ours and decided that they want more for their debt repayment: more specifically, they want military access to the Rhineland. However, our government has again come up with three possible plans for this scenario. The first is, we can simply allow them access to the Rhineland on the condition that they sign a non-aggression pact with us. The second is that we allow them access up to the East Bank of the Rhine, and allowing them full access later if they behave well. The third option would be denying them any access at all. This would be safest, but would anger the Germans, and could lead to a military conflict. Which plan should we choose?"
 wgr_external.14.a:0 "We should give them full access."
 wgr_external.14.b:0 "The Two-Stage Process would work best."
 wgr_external.14.c:0 "We don't trust the Germans enough to allow this!"
 
 wgr_external.15.t:0 "The French Give Us Full Access!"
 wgr_external.15.d:0 "In Exchange for a non-aggression pact, the French Government has given us full military access to the Rhineland. The people are cheering and are happy to see the borders of Germany completely under German Control once again."
 wgr_external.15.a:0 "Another Victory for our Government!"
 
 wgr_external.16.t:0 "The French Allow Us Partial Access"
 wgr_external.16.d:0 "The French have allowed us military access to the East Bank of the Rhine. If we \"Behave Well\", according to the French, in a few years they might allow us full access. While we could accept this compromise, it is possible to just remilitarize the Rhineland anyways. However, marching into the Rhineland would anger the French, and could lead to yet another humilitation for Germany."
 wgr_external.16.a:0 "We shall accept the compromise."
 wgr_external.16.b:0 "The Rhineland is German! All of it!"
 
 WGR_lock_out_france_path:0 "We have failed to reconcile France."
 wgr_external.17.t:0 "The French Deny Us Access"
 wgr_external.17.d:0 "The French have responded by telling us that German access to the Rhineland would be \"The First Step Towards War\". While we can accept their judgement (and humiliate ourselves), the military and the people will not be happy with us. On the other hand, if we were to march directly into the Rhineland, we could face a military invasion. What shall we do?"
 wgr_external.17.a:0 "In the name of peace we shall sacrifice our dignity."
 wgr_external.17.b:0 "In the name of our dignity, we shall risk sacrificing peace!"
 
 wgr_external.18.t:0 "The Germans Remilitarize the Rhineland!"
 wgr_external.18.d:0 "The German government has gone ahead and completely remilitarized the Rhineland despite our resolution. In this situation, we have two possible courses of action: the first would be to invade Germany and force them to bend to our will. The second would be to leave them alone and hope that they are sufficiently appeased. What shall we do?"
 wgr_external.18.t:0 "These Uppity Germans must be brought to heel!"
 wgr_external.18.d:0 "We can trust the Germans, right?"
 
 WGR_neutral_foreign_policy:0 "Neutral Foreign Policy"
 wgr_external.19.t:0 "Our Foreign Policy Direction"
 wgr_external.19.d:0 "We must now decide the direction of our foreign policy. We can choose a policy of neutrality, that would seek to limit our involvement in other nations' affairs. This policy is favored by Socialists. Liberal Conservatives have proposed to maintain the status quo; we would continue to reach out to foreign powers, yet not intervene in their politics. The National Liberals have long been advocating a more aggressive foreign policy. They think that if any nation on our border adopts a radical ideology, we should be ready to immediately deploy. Which option should we choose?"
 wgr_external.19.a:0 "Neutrality is best."
 wgr_external.19.b:0 "The Status Quo would keep us involved with foreign affairs."
 wgr_external.19.c:0 "Intervension would establish a Sphere of Influence for Germany."
 
 wgr_external.20.t:0 "Germany Proposes a Resarch Agreement"
 wgr_external.20.d:0 "The German Ministry of Research has approached our Foreign Ministry to propose an exchange of research. German scientists would help us with creating new tank designs, and we would help them with new infantry weapon designs. Should we accept this offer?"
 wgr_external.20.a:0 "This makes sense to us."
 wgr_external.20.b:0 "Help them make weapons against us? No thank you."
 
 wgr_external.21.t:0 "France Agrees"
 wgr_external.21.d:0 "The French have agreed to our research proposal. Their scientists have arrived, and are getting aquainted with their new German collegues. Soon, we will have improved infantry weapons!"
 wgr_external.21.a:0 "Hooray for European Cooperation!"
 
 wgr_external.22.t:0 "France Refuses"
 wgr_external.22.d:0 "The French have refused our proposal. They cite national security interests in refusing to advance military science."
 wgr_external.22.a:0 "Shame"
 
 WGR_lock_britain_path:0 "We have failed to reconcile Britain."
 wgr_external.23.t:0 "Naval Treaty with Germany?"
 wgr_external.23.d:0 "Currently, the German Navy is limited in size so it cannot be a threat to our navy. However, the Germans have implored us to allow them to build up a larger navy. They assure us that they have quelled radicalism and expansionism in their country, and need the navy for defensive reasons. Should we accept?"
 wgr_external.23.a:0 "Yes, we should"
 wgr_external.23.b:0 "We musn't trust the Germans!"
 
 wgr_external.24.t:0 "Britain Agrees to the Treaty"
 wgr_external.24.d:0 "The British Foreign Office has agreed to lift most of the restrictions on our navy. We are now free to build it as large as we want in order to defend our coastline."
 wgr_external.24.a:0 "Long Live the Reichsmarine!"
 
 wgr_external.25.t:0 "Britain Refuses our Proposal"
 wgr_external.25.d:0 "London has refused to allow us to defend our own territory! They are requiring us to keep a limited navy! It seems like we cannot trust the British."
 wgr_external.25.a:0 "A real shame."
 
 wgr_external.26.t:0 "Germany Proposes a Resarch Agreement"
 wgr_external.26.d:0 "The German Ministry of Research has approached our Foreign Ministry to propose an exchange of research. German scientists would help us with creating new tank designs, and we would help them with improving their destroyers. Should we accept this offer?"
 wgr_external.26.a:0 "This makes sense to us."
 wgr_external.26.b:0 "Help them make weapons against us? No thank you."
 
 wgr_external.27.t:0 "Britain Agrees"
 wgr_external.27.d:0 "The French have agreed to our research proposal. Their scientists have arrived, and are getting aquainted with their new German collegues. Soon, we will have improved destroyers!"
 wgr_external.27.a:0 "Hooray for European Cooperation!"
 
 wgr_external.28.t:0 "Britain Refuses"
 wgr_external.28.d:0 "The British have refused our proposal. They cite national security interests in refusing to advance military science."
 wgr_external.28.a:0 "Shame"
 
 wgr_external.29.t:0 "Germany Offers a Guarantee of Independence"
 wgr_external.29.d:0 "The Germans have approached our government offering a guarantee of our independence. If we accept, the Germans would come to our aid should a foreign power seek to infringe upon our borders. Should we accept this offer?"
 wgr_external.29.a:0 "Of Course!"
 wgr_external.29.b:0 "Defend us so they can annex us themselves? No thank you."
 
 wgr_external.30.t:0 "[From.GetNameDef] Accepts our Guarantee!"
 wgr_external.30.d:0 "Representatives of [From.GetNameDef] have responded to our offer and welcome any military assistance against foreign invaders."
 wgr_external.30.a:0 "Excellent!"
 
 wgr_external.31.t:0 "[From.GetNameDef] Rejects our Guarantee!"
 wgr_external.31.d:0 "Representatives of [From.GetNameDef] have responded to our offer and assure us that we do not have to trouble ourselves, as they \"can defend themselves\"."
 wgr_external.31.a:0 "Shame."
 
 wgr_external.32.t:0 "Germany Invites us to Their Alliance"
 wgr_external.32.d:0 "The German Foreign Ministry has approached us and have asked if we would like to join the Berlin Accords. Accepting would mean that we and the other members of the Accords would have a mutual defense treaty, and an obligation to come to the aid during an offensive war if asked. Shall we accept?"
 wgr_external.32.a:0 "Better with the Germans than against them."
 wgr_external.32.b:0 "We would rather remain neutral."
 
 wgr_external.33.t:0 "[From.GetNameDef] Accepts our Alliance!"
 wgr_external.33.d:0 "Representatives of [From.GetNameDef] have responded to our offer and have officially joined the Berlin Accords"
 wgr_external.33.a:0 "Excellent!"
 
 wgr_external.34.t:0 "[From.GetNameDef] Rejects our Alliance!"
 wgr_external.34.d:0 "Representatives of [From.GetNameDef] have responded to our offer and have decided to remain neutral."
 wgr_external.34.a:0 "Shame."
 
 wgr_external.35.t:0 "Germany Offers Military Investment"
 wgr_external.35.d:0 "The German Government has offered to invest in a military factory in our Capital Province in order to better arm us against foreign threats. Should we accept, our industry will be better prepared to fight against invaders. Shall we accept their offer?"
 wgr_external.35.a:0 "Of Course!"
 wgr_external.35.b:0 "We do not require assistance!"
 
 wgr_external.36.t:0 "[From.GetNameDef] Accepts our Offer"
 wgr_external.36.d:0 "The Government of [From.GetNameDef] has accepted our offer for help in developing their military industry."
 wgr_external.36.a:0 "Three Cheers for International Cooperation!"
 
 wgr_external.37.t:0 "[From.GetNameDef] Refuses our Offer"
 wgr_external.37.a:0 "The Government of [From.GetnameDef] has rejected our offer for help in developing their military industry. They say that they can do without us."
 wgr_external.37.b:0 "Shame."
 
 wgr_external.38.t:0 "[From.GetNameDef] Asks Us For Military Access"
 wgr_external.38.d:0 "The Government of [From.GetNameDef] has asked us to allow their soldiers free passage through our territory. They say that they need it in order to fulfill their military objectives. Shall we accept?"
 wgr_external.38.a:0 "There is not much harm in it."
 wgr_external.38.b:0 "We would prefer to remain neutral in this matter."
 
 wgr_external.39.t:0 "[From.GetNameDef] Gives Us Military Access"
 wgr_external.39.d:0 "The Foreign Office of [From.GetNameDef] has agreed to give our military access through their country to help us achieve our military objectives."
 wgr_external.39.a:0 "And we thank them for it."
 
 wgr_external.40.t:0 "[From.GetNameDef] Refuses us Military Access"
 wgr_external.40.d:0 "The Foreign Office of [From.GetNameDef] has refused to give our military access through their countries. It seems that we must accomplish our objectives through other means."
 wgr_external.40.a:0 "Understandable, but still a shame."
 
 wgr_external.41.t:0 "Germany Proposes the Memelland Special Economic Zone"
 wgr_external.41.d:0 "The German Foreign Office has proposed a plan to return the Memelland to Germany, yet ensure that we do not suffer from the loss of our main port. Essentially, the Memelland would become a core territory of Germany, but Lithuanian buisnesses will still be allowed free acess to the port and the provinces. Accepting would mean not only less administrative costs, but also more trade with Germany. To sweeten the deal, the Germans have also offered a guarantee of our independence. However, we would be compromising our territory. Should we accept?"
 wgr_external.41.a:0 "We accept their offer."
 wgr_external.41.b:0 "We shall not compromise our territorial integrity!"
 
 wgr_external.42.t:0 "Lithuania Agrees to Our Proposal"
 wgr_external.42.d:0 "The Lithuanian Foreign Ministry has agreed to our proposal for a Special Economic Zone. The Memelland will be transfered to us, and should Lithuania come under attack, we will be poised to assist."
 wgr_external.42.a:0 "Excellent!"
 
 wgr_external.43.t:0 "Lithuania Rejects Our Proposal"
 wgr_external.43.d:0 "The Lithuanian Foreign Ministry has rejected our proposal for a Special Economic Zone. While they would prefer to keep their territory intact, they will now be on their own if we are attacked."
 wgr_external.43.a:0 "Less work for us then."
 
 wgr_external.44.t:0 "Germany Offers Military Cooperaton"
 wgr_external.44.d:0 "The German Military has approached ours and has offered a program of military cooperation. Under the program, German officers would help to train our soldiers and officers in modern military tactics. Should we accept, we would possibly open the door to more cooperation with the Germans. Should we accept?"
 wgr_external.44.a:0 "This is an acceptable arrangement."
 wgr_external.44.b:0 "Our military can learn on its own."
 
 wgr_external.45.t:0 "Military Cooperation with the [From.GetAdjective] Military."
 wgr_external.45.d:0 "The government of [From.GetNameDef] has agreed to our proposal of military cooperations. We will immediately begin selecting officers to send to help out."
 wgr_external.45.a:0 "Hopefully, we can learn something from them as well!"
 
 wgr_external.46.t:0 "[From.GetAdjective] Refuses Military Cooperation"
 wgr_external.46.d:0 "Our offer of military cooperation has been refused, as [From.GetAdjective] says that their army can learn on its own."
 wgr_external.46.a:0 "Shame."
 
 wgr_external.47.t:0 "Germany offers to mediate in Transylvania"
 wgr_external.47.d:0 "The German Government has offered to mediate in our current dispute with Hungary over Transylvania. However, they have declared that a compromise must be reached no matter the cost, even threatening with military intervention if a side chooses to abandon the negtiations. We aren't sure if the other European powers (and the Leage of Nations) will allow such extreme measures to be taken, but it could give the Hungarians the perfect casus belli to invade us.\n\n After lengthy negotiations in Berlin, our foreign minister has sent a letter back home detailing the Hungarian posture: \"They have reduced their demands, from wanting 2/3 of Transylvania (69,000 km2 of territory with 3,803,000 inhabitants) to dividing it in equal parts. They will not further reduce their claims.\" \nWe have 2 options, either we agree to these outrageous demands or we ask Germany to impose a better solution."
 wgr_external.47.a:0 "Give in to the Hungarian demands"
 wgr_external.47.b:0 "The German way is preferable"
 wgr_external.47.c:0 "We cannot sacrifice innocent Romanians because of Hungarian whims!"
 
 wgr_external.48.t:0 "Romania Agrees to Hungarian Demands!"
 wgr_external.48.d:0 "The Romanian Government has agreed to turn cede some land in Transylvania to Hungary. This is a victory for our diplomats and our Government! The Hungarians have already begun moving into the area, and will be displacing the Romanian Administration (and population) shortly."
 wgr_external.48.a:0 "Another Victory for Germany!"
 
 wgr_external.49.t:0 "Romania Agrees to our Demands!"
 wgr_external.49.d:0 "The Romanian Government has agreed to cede us part of Transylvania. Our army has already started moving into the Romanian border and are on their way to occupy all our newly adquired lands. Some reports have come in informing of mass killings, rape, and general violence exerted upon the romanian population by our troops, but we are not sure if they are true. It's probably Romanian propaganda."
 wgr_external.49.a:0 "That takes care of the problem."
 
 wgr_external.50.t:0 "Romania asks us to impose a compromise"
 wgr_external.50.d:0 "TODO"
 wgr_external.50.a:0 "Favour Romania"
 wgr_external.50.b:0 "Favour Hungary"
 
 wgr_external.51.t:0 "The German plan for Transylvania"
 wgr_external.51.d:0 "TODO"
 wgr_external.51.a:0 "Accept"
 wgr_external.51.b:0 "Over my dead body!"
 
 wgr_external.52.t:0 "Break of Negotiations"
 wgr_external.52.rom.desc:0 "The Romanian Government has refused to give up Transylvania to the Hungarians and have promptly abandoned the ongoing negotiations. We sent an ultimatum to their government demanding them to return to the table of negotiations in less than 2 days or face war. They chose the later...\nThe Hungarians have started to mobilize their army on the Romanian border, we should support them."
 wgr_external.52.rom:0 "Another war in the balkans"
 wgr_external.52.hun.desc:0 "The Hungarian Government has abandoned the ongoing negotiations in protest for their un-met claims. We sent an ultimatum to their government demanding them to return to the table of negotiations in less than 2 days or face war. They chose the later.\nThe Romanians have started to mobilize their army on the Hungarian border, we should support them."
 wgr_external.52.hun:0 "They will get a smaller Hungary instead"

 wgr_external.53.t:0 "Break of Negotiations"
 wgr_external.53.rom.desc:0 "In an unexpected move, the Hungarian Government has abandoned the ongoing negotiations in protest for their un-met demands. The Germans have reacted to this move by to mobilize their army and sending an ultimatum to Hungary. They have pressed us to join the war against Hungary."
 wgr_external.53.rom.a:0 "You left us no choice..."
 wgr_external.53.hun.desc:0 "In an unexpected move, the Romanian Government has abandoned the ongoing negotiations in protest of what they consider as \"an unacceptable annexation of our land that will harm our people\". The Germans have started to mobilize their army in preparation for the uncoming war. We should do the same..."
 wgr_external.53.hun.a:0 "War it is!"
 
 wgr_external.54.t:0 "Forts along Tyrol?"
 wgr_external.54.d:0 "The German Government, with its recent statements against [ITA.GetNameDef], have proposed that they help us build forts along our border with the Italians to deter invasion. Should we accept?"
 wgr_external.54.a:0 "Very well, we accept."
 wgr_external.54.b:0 "We don't need their help."
 
 wgr_external.55.t:0 "Austria Accepts our Defensive Proposal"
 wgr_external.55.a:0 "The Austrian Government has sent us their approval for our engineers to begin work on military outposts on the Austrian Border with Italy."
 wgr_external.55.b:0 "Italy Shall be Crushed!"
 
 wgr_external.56.t:0 "Austria Rejects our Defensive Proposal"
 wgr_external.56.a:0 "The Austrian Government has sent us their refusal to allow our military to construct military outposts on the Austrian Border with Italy."
 wgr_external.56.b:0 "But if Italy attacks..."
 
 wgr_external.57.t:0 "The Garantiebrief"
 wgr_external.57.d:0 "Germany wants us to sign the Garantiebrief, or Treaty of Guarantees. This would basically ensure the protection of Sudaten Germans and Czechs in Germany, as well as allow German firms to invest in Sudaten Buisnesses. Should we sign it?"
 wgr_external.57.a:0 "Investments are always appreciated!"
 wgr_external.57.b:0 "Are there even Czechs in Germany?"
 
 wgr_external.58.t:0 "The Czechs Sign the Garantiebrief"
 wgr_external.58.d:0 "[CZE.GetNameDef] has signed the Garantiebrief, ensuring that we can exert our influence in at least part of Czechia. However, due to the very large ratio between Germans in [CZE.GetNameDef] and Czechs in [GER.GetNameDef, the treaty is largely one-sided!"
 wgr_external.58.a:0 "Hooray for us!"
 
 wgr_external.59.t:0 "The Czechs Do Not Sign the Garantiebrief"
 wgr_external.59.d:0 "[CZE.GetNameDef] has realized that, due to the very low presence of Czechs in Germany, the treaty would be mostly one-sided. Thus, they have declined."
 wgr_external.59.a:0 "Too bad."
 
 wgr_external.60.t:0 "German Mediation in The Zaolzie Dispute"
 wgr_external.60.d:0 "The German Government has decided that it would be best to resolve the Zaolzie Dispute once and for all. They have given us the option to either meet with the Czechs or to directly give up claims. What shall we do?"
 wgr_external.60.a:0 "We will give up our claims, if the Germans would side with the Czechs"
 wgr_external.60.b:0 "Zaolzie is Polish!"
 
 wgr_external.61.t:0 "Poland Gives Up Claims to Zaolzie"
 wgr_external.61.d:0 "Thanks to German Mediation, the Polish Government has given up all claims to Zaolzie."
 wgr_external.61.a:0 "Zaolzie is Czech!"
 
 wgr_external.62.t:0 "German Mediation in Zaolzie"
 wgr_external.62.d:0 "The Germans' Plea to get Poland to give up their claims in Zaolzie has failed, and it is up to our diplomats to resolve the dispute. What shall we do?"
 wgr_external.62.a:0 "The simple option: Give Poland Zaolzie"
 wgr_external.62.b:0 "The compromise: Make Zaolzie a Neutral Zone"
 wgr_external.62.c:0 "The Czech Option: Zaolzie is Ours!"
 
 wgr_external.63.t:0 "[CZE.GetNameDef] Turns Over Zaolzie!"
 wgr_external.63.d:0 "The Czechs have finally seen that Poland is deserving of Zaolzie, as the people of Zaolzie are Polish, anyways. They have turned over the state to us, and our administration has taken over from the Czech bureaucracy."
 wgr_external.63.a:0 "Zaolzie is finally Polish again!"
 
 wgr_external.64.t:0 "The Czechs offer a Neutral Zone"
 wgr_external.64.d:0 "The Czechs have offered to make Zaolzie into a demilitarized Neutral Zone. No military action would be allowed in the province unless [CZE.GetNameDef] enters a state of war. Should we accept this compromise."
 wgr_external.64.a:0 "We can accept this compromise."
 wgr_external.64.b:0 "This isn't going to work, is it?"
 
 wgr_external.65.t:0 "The Polish Accept our Offer"
 wgr_external.65.d:0 "The Polish Diplomats have accepted our offer of making Zaolzie a demilitarized zone. Any soldiers in the area will have to leave, and the only kind of armed force allowed in the area will be the local police."
 wgr_external.65.a:0 "Hooray for Diplomacy!"
 
 wgr_external.66.t:0 "The Polish End Negotiations"
 wgr_external.66.d:0 "The Polish have not accepted our offer, and have decided that these Negotiations would go nowhere. Technically, this is a victory for us!"
 wgr_external.66.a:0 "Hooray?"
 
 wgr_external.67.t:0 "The Czechs End Negotiations"
 wgr_external.67.d:0 "The Czechs have said that they will not compromise with us on the Zaolzie issue, and have broken negotiations."
 wgr_external.67.a:0 "Shame."
 
 wgr_external.68.t:0 "Germany Offers Weapons"
 wgr_external.68.d:0 "The German Government has offered to send us some small arms from their stockpile. While they are old German weapons, we could use them to reinforce our divisions. Shall we accept?"
 wgr_external.68.a:0 "We need all the guns we can get."
 wgr_external.68.b:0 "We have enough, thank you."
 
 wgr_external.69.t:0 "[From.GetNameDef] Accepts our Weapons"
 wgr_external.69.d:0 "The Government of [From.GetNameDef] has accepted taking some of our surplus weapons to bolster their military. We have already begun sending them over."
 wgr_external.69.a:0 "Excellent!"
 
 wgr_external.70.t:0 "[From.GetNameDef] Rejects our Weapons"
 wgr_external.70.d:0 "[From.GetNameDef] has decided that they do not need our weapons at the moment."
 wgr_external.70.a:0 "Shame."
 
 wgr_external.71.t:0 "Germany Offers Investments in the Sudetenland"
 wgr_external.71.d:0 "The German Government has asked us to open up the Sudetenland to German Investment, which they say would improve living conditions for the locals and improve the reputation of the Czech government with the Germans. Should we accept this offer?"
 wgr_external.71.a:0 "We accept!"
 wgr_external.71.b:0 "We do not need their money."
 
 wgr_external.72.t:0 "The Czechs open the Sudetenland to Investment"
 wgr_external.72.d:0 "In light of the recent news from Prague, German buisnesses have already begun pouring money into the Sudetenland. We are sure that this will be beneficial for both our countries!"
 wgr_external.72.a:0 "Soon the Czech and German economies will grow together!"
 
 wgr_external.73.t:0 "The Czechs Reject Our Offer"
 wgr_external.73.d:0 "German Firms are dissapointed in the Prague Government for not allowing development of the Sudetenland. They are also dissapointed in our government for failing to reach a deal."
 wgr_external.73.a:0 "We'll do it next time!"
 
 wgr_external.74.t:0 "Germany Offers a Non-Aggression Pact"
 wgr_external.74.d:0 "[From.GetNameDef] has proposed a non-aggression pact. They say that they want nothing but positive relations with our country. What shall we do?"
 wgr_external.74.a:0 "To Protect our borders, anything."
 wgr_external.74.b:0 "We do not deal with Snakes!"
 
 wgr_external.75.t:0 "Poland Signs the Non-Aggression Pact!"
 wgr_external.75.d:0 "The Poles have signed the Non-Aggression Pact we offered them. Two Strong Nations have a better chance against the Soviet Union than one!"
 wgr_external.75.a:0 "We shall be victorious once more!"
 WGR_pol_does_NAP:0 "Non-Aggression Pact With Poland"
 
 wgr_external.76.t:0 "Poland Refuses the Non-Aggression Pact!"
 wgr_external.76.d:0 "The Poles have refused to sign the Non-Aggression Pact we offered them. They do not trust us, and would rather fight the Soviets alone."
 wgr_external.76.a:0 "Damn!"
 
 wgr_external.77.t:0 "Germany Offers Investments"
 wgr_external.77.d:0 "The German Government has offered to allow German Companies to invest in Polish Land. Should we accept this offer?"
 wgr_external.77.a:0 "We accept!"
 wgr_external.77.b:0 "We do not need their money."
 
 wgr_external.78.t:0 "Poland is Open to Investment"
 wgr_external.78.d:0 "In light of the recent news from Warsaw, German buisnesses have already begun pouring money into Poland. We are sure that this will be beneficial for both our countries!"
 wgr_external.78.a:0 "Soon the Polish and German economies will grow together!"
 
 wgr_external.79.t:0 "The Polish Reject Our Offer"
 wgr_external.79.d:0 "German Firms are dissapointed in the Warsaw Government for not allowing development of Poland. They are also dissapointed in our government for failing to reach a deal."
 wgr_external.79.a:0 "We'll do it next time!"
 
 wgr_external.80.t:0 "Negotiations with Ford Motor Company"
 wgr_external.80.d:0 "Ford Motor Company is the largest Automobile Manufaturer in the United States, and thanks to innovations by CEO Henry Ford, Ford Automobiles have been readily available to the American People and Workers at cheap prices. We are currently setting up meetings to bring Ford Automobiles to Germany. However, we can either invite them to construct a factory in Germany, or we can ask them to teach our experts the finer points of Fordism, the name for Ford's revolutionary industrial innovations. What should we do?"
 wgr_external.80.a:0 "We need the factory!"
 wgr_external.80.b:0 "We need Fordism!"
 
 wgr_external.81.t:0 "Germany Asks For Access to Libya"
 wgr_external.81.d:0 "The German Government has asked us to allow their firms access to the Oil Fields of Libya. Allowing this would mean that we would have less resources available there, but the goodwill of the German Government. Should we accept?"
 wgr_external.81.a:0 "Very Well. Our Firms need some Competition."
 wgr_external.81.b:0 "No!"
 WGR_libya_factories:0 "Allowed us to Invest"
 
 wgr_external.82.t:0 "[From.GetNameDef] Allows Our Firms Access"
 wgr_external.82.d:0 "Our companies have already begun setting up refinaries in Libya, after the administration of [From.GetNameDef] has allowed our companies permits."
 wgr_external.82.a:0 "Excellent!"
 
 wgr_external.83.t:0 "Oil Refining Permit Rejected"
 wgr_external.83.d:0 "[From.GetNameDef], citing \"Threats to [From.GetAdjective] Profits\", has rejected our application for Permits to drill for oil in Libya."
 wgr_external.83.a:0 "Damn!"
 
 wgr_external.84.t:0 "Germany Offers Investments"
 wgr_external.84.d:0 "The German Government has offered to allow German Railroad Companies to invest in Polish Land. Should we accept this offer?"
 wgr_external.84.a:0 "We accept!"
 wgr_external.84.b:0 "We do not need their rails."
 
 wgr_external.85.t:0 "Poland accepts German Roads"
 wgr_external.85.d:0 "In light of the recent news from Warsaw, German buisnesses have already begun constructing railroads and highways in Poland. We are sure that this will be beneficial for both our countries!"
 wgr_external.85.a:0 "Soon the Polish and German economies will grow together!"
 
 wgr_external.86.t:0 "The Polish Reject Our Offer"
 wgr_external.86.d:0 "German Firms are dissapointed in the Warsaw Government for not allowing development of Poland. They are also dissapointed in our government for failing to reach a deal."
 wgr_external.86.a:0 "We'll do it next time!"
 
 wgr_parliament.1.t:0 "Communists Agree with our Proposal"
 wgr_parliament.1.d:0 "The Communists in the Reichstag have already decided to back our proposal when voting time comes."
 wgr_parliament.1.a:0 "Good to know."
 
