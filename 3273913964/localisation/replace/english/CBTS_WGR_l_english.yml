 wgr_parliament.13.t:0 "Negotiations with the Communists: Taxes"
 wgr_parliament.13.d:0 "The Communists are willing to support our motion on the condition that we raise taxes. Should we accept?"
 wgr_parliament.13.a:0 "We accept."
 wgr_parliament.13.b:0 "We cannot accept this."
 
 wgr_parliament.14.t:0 "Negotiations with the Communists: Welfare"
 wgr_parliament.14.d:0 "The Communists are willing to support our motion on the condition that we increase welfare spending. Should we accept?"
 wgr_parliament.14.a:0 "We accept."
 wgr_parliament.14.b:0 "We cannot accept this."
 
 wgr_parliament.15.t:0 "Negotiations with the Communists: Military Spending"
 wgr_parliament.15.d:0 "The Communists are willing to support our motion on the condition that we increase military spending. Should we accept?"
 wgr_parliament.15.a:0 "We accept."
 wgr_parliament.15.b:0 "We cannot accept this."
 
 wgr_parliament.16.t:0 "Negotiations with the Revolutionary Socialists: Union Support"
 wgr_parliament.16.d:0 "The Revolutionary Socialists are willing to support our motion on the condition that we increase our support for the labour unions. Should we accept?"
 wgr_parliament.16.a:0 "We accept."
 wgr_parliament.16.b:0 "We cannot accept this."
 
 wgr_parliament.17.t:0 "Negotiations with the Revolutionary Socialists: Worker Protection"
 wgr_parliament.17.d:0 "The Revolutionary Socialists are willing to support our motion on the condition that we improve protections for workers. Should we accept?"
 wgr_parliament.17.a:0 "We accept."
 wgr_parliament.17.b:0 "We cannot accept this."
 
 wgr_parliament.18.t:0 "Negotiations with the Democratic Socialists: Welfare"
 wgr_parliament.18.d:0 "The Democratic Socialists are willing to support our motion on the condition that we increase welfare spending. Should we accept?"
 wgr_parliament.18.a:0 "We accept."
 wgr_parliament.18.b:0 "We cannot accept this."
 
 wgr_parliament.19.t:0 "Negotiations with the Democratic Socialists: Military Spending"
 wgr_parliament.19.d:0 "The Democratic Socialists are willing to support our motion on the condition that we decrease military spending. Should we accept?"
 wgr_parliament.19.a:0 "We accept."
 wgr_parliament.19.b:0 "We cannot accept this."
 
 wgr_parliament.20.t:0 "Negotiations with the Democratic Socialists: Public Works"
 wgr_parliament.20.d:0 "The Democratic Socialists are willing to support our motion on the condition that we increase spending on Public Works. Should we accept?"
 wgr_parliament.20.a:0 "We accept."
 wgr_parliament.20.b:0 "We cannot accept this."
 
 wgr_parliament.21.t:0 "Negotiations with the Social Democrats: Taxes"
 wgr_parliament.21.d:0 "The Social Democrats are willing to support our motion on the condition that we increase taxes for the rich. Should we accept?"
 wgr_parliament.21.a:0 "We accept."
 wgr_parliament.21.b:0 "We cannot accept this."
 
 wgr_parliament.22.t:0 "Negotiations with the Social Democrats: Protecting Minorities"
 wgr_parliament.22.d:0 "The Social Democrats are willing to support our motion on the condition that we increase protections on minorities. Should we accept?"
 wgr_parliament.22.a:0 "We accept."
 wgr_parliament.22.b:0 "We cannot accept this."
 
 wgr_parliament.23.t:0 "Negotiations with the Social Democrats: Denouncing Fascism"
 wgr_parliament.23.d:0 "The Social Democrats are willing to support our motion on the condition that we campaign against the National Socialists. Should we accept?"
 wgr_parliament.23.a:0 "We accept."
 wgr_parliament.23.b:0 "We cannot accept this."
 
 wgr_parliament.24.t:0 "Negotiations with the Social Liberals: Protecting Minorities"
 wgr_parliament.24.d:0 "The Social Liberals are willing to support our motion on the condition that we increase protections on minorities. Should we accept?"
 wgr_parliament.24.a:0 "We accept."
 wgr_parliament.24.b:0 "We cannot accept this."
 
 wgr_parliament.25.t:0 "Negotiations with the Social Liberals: Social Security"
 wgr_parliament.25.d:0 "The Social Liberals are willing to support our motion on the condition that we increase social security payments. Should we accept?"
 wgr_parliament.25.a:0 "We accept."
 wgr_parliament.25.b:0 "We cannot accept this."
 
 wgr_parliament.26.t:0 "Negotiations with the Market Liberals: Lower Taxes"
 wgr_parliament.26.d:0 "The Market Liberals are willing to support our motion on the condition that we lower taxes. Should we accept?"
 wgr_parliament.26.a:0 "We accept."
 wgr_parliament.26.b:0 "We cannot accept this."
 
 wgr_parliament.27.t:0 "Negotiations with the Market Liberals: Lower Tariffs"
 wgr_parliament.27.d:0 "The Market Liberals are willing to support our motion on the condition that we lower tariffs. Should we accept?"
 wgr_parliament.27.a:0 "We accept."
 wgr_parliament.27.b:0 "We cannot accept this."
 
 wgr_parliament.28.t:0 "Negotiations with the Centrists: Lower Taxes"
 wgr_parliament.28.d:0 "The Centrists are willing to support our motion on the condition that we lower taxes. Should we accept?"
 wgr_parliament.28.a:0 "We accept."
 wgr_parliament.28.b:0 "We cannot accept this."
 
 wgr_parliament.29.t:0 "Negotiations with the Centrists: Denouncing Communism"
 wgr_parliament.29.d:0 "The Centrists are willing to support our motion on the condition that we campaign against communism. Should we accept?"
 wgr_parliament.29.a:0 "We accept."
 wgr_parliament.29.b:0 "We cannot accept this."
 
 wgr_parliament.30.t:0 "Negotiations with the Conservatives: Lower Taxes"
 wgr_parliament.30.d:0 "The Conservatives are willing to support our motion on the condition that we lower taxes. Should we accept?"
 wgr_parliament.30.a:0 "We accept."
 wgr_parliament.30.b:0 "We cannot accept this."
 
 wgr_parliament.31.t:0 "Negotiations with the Conservatives: Decreased Welfare"
 wgr_parliament.31.d:0 "The Conservatives are willing to support our motion on the condition that we lower welfare payments. Should we accept?"
 wgr_parliament.31.a:0 "We accept."
 wgr_parliament.31.b:0 "We cannot accept this."
 
 wgr_parliament.32.t:0 "Negotiations with the Conservatives: Raised Taxes"
 wgr_parliament.32.d:0 "The Conservatives are willing to support our motion on the condition that we raise taxes. Should we accept?"
 wgr_parliament.32.a:0 "We accept."
 wgr_parliament.32.b:0 "We cannot accept this."
 
 wgr_parliament.33.t:0 "Negotiations with the Monarchists: Supporting Landowners"
 wgr_parliament.33.d:0 "The Monarchists are willing to support our motion on the condition that we ease taxes on landowners. Should we accept?"
 wgr_parliament.33.a:0 "We accept."
 wgr_parliament.33.b:0 "We cannot accept this."
 
 wgr_parliament.34.t:0 "Negotiations with the Nationalists: Supporting Industrialists"
 wgr_parliament.34.d:0 "The Nationalists are willing to support our motion on the condition that we ease taxes on Industrialists. Should we accept?"
 wgr_parliament.34.a:0 "We accept."
 wgr_parliament.34.b:0 "We cannot accept this."
 
 wgr_parliament.35.t:0 "Negotiations with the National Socialists: Increased Welfare"
 wgr_parliament.35.d:0 "The National Socialists are willing to support our motion on the condition that we increase welfare spending. Should we accept?"
 wgr_parliament.35.a:0 "We accept."
 wgr_parliament.35.b:0 "We cannot negotiate with National Socialist Snakes!"
 
 wgr_parliament.36.t:0 "Negotiations with the National Socialists: Increased Military Spending"
 wgr_parliament.36.d:0 "The National Socialists are willing to support our motion on the condition that we increase military spending. Should we accept?"
 wgr_parliament.36.a:0 "We accept."
 wgr_parliament.36.b:0 "We cannot negotiate with National Socialist Snakes!"
 
 wgr_parliament.37.t:0 "Motion Fails to Pass"
 wgr_parliament.37.d:0 "Our latest piece of legislation has failed to pass through the Reichstag. We will thus not get the benefits of this law, and our government's reputation will suffer."
 wgr_parliament.37.a:0 "Unfortunate."
 
 wgr_parliament.38.t:0 "Negotiations with the Moderate Nationalists: Decreased Welfare Spending"
 wgr_parliament.38.d:0 "The Moderate Nationalists are willing to support our motion on the condition that we decrease welfare spending. Should we accept?"
 wgr_parliament.38.a:0 "We accept."
 wgr_parliament.38.b:0 "We cannot accept this!"