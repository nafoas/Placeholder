 WGR_reichstag:0 "The Reichstag"
 WGR_reichstag_desc:0 "In order for these measures to be passed, the Reichstag has to vote on them.\n\n§GSeats in the Coalition: [?WGR.GER_coalition_seats]§!\n\n§YSeats Per Ideology:§!\n\n§Y Leninist Seats: [?WGR.GER_com_seats]\n Revolutionary Socialist Seats: [?WGR.GER_rso_seats]\n Democratic Socialist Seats: [?WGR.GER_dso_seats]\n Social Democratic Seats: [?WGR.GER_sde_seats]\n Social Liberal Seats: [?WGR.GER_sli_seats]\n Market Liberal Seats: [?WGR.GER_mli_seats]\n National Liberal Seats: [?WGR.GER_cen_seats]\n Social Conservative Seats: [?WGR.GER_dem_seats]\n Monarchist Seats: [?WGR.GER_mon_seats]\n National Conservative Seats: [?WGR.GER_neu_seats]\n Ultranationalist Seats: [?WGR.GER_nat_seats]\n National Socialist Seats: [?WGR.GER_fas_seats]\n\n Total Seats: [?WGR.GER_total_seats]\n\n Seats needed to pass the current law: [?WGR.GER_supseat]/[?GER_seats_needed]§!\n\nRed laws are §RMilitarist§!\nWhite Laws are Pacifist\nYellow Laws are §YIndustrial§!\nLight Blue Laws are for §CWelfare§!\nBlue Laws are for §BAusterity§!\nGreen Laws are §GProgressive§!\nGrey Laws are §gReactionary§!"
