 #events
 raj_internal.1.t:0 "A new Governor-General"
 raj_internal.1.d:0 "Victor Alexander John Hope, 2nd Marquess of Linlithgow served as an officer on the Western Front during the First World War, where he commanded a battalion of the Royal Scots. He was mentioned in a number of military dispatches and later was appointed an Officer of the Order of the British Empire, ending the war as a Colonel. After the war he served in minor roles within various Conservative governments. Additionally, he served as president of the Navy League from 1924 until 1931.\n\nFrom April 1933 to November 1934 he was the chairman of the Parliamentary Joint Select Committee on Indian Constitutional Reform, formed to consider the proposals for Indian self-government contained in the British Government’s March 1933 White Paper. Promising to treat each faction as neutrally as he would his children, his work culminated in the Government of India Act. Having initially declined both the governorship of Madras and the governor-generalship of Australia (where his father was the first Governor-General), his previous work has now allowed him to become the Viceroy of India."
 raj_internal.1.a:0 "Welcome!"
 raj_internal.2.t:0 "Governor-General Archibald Wavell"
 raj_internal.2.d:0 "Archibald Percival Wavell, 1st Earl Wavell served in the British Army since 1901, where he fought in the Second Boer War. After the war, he served in India, where he made lieutenant in 1904. By the beginning of the Great War, he was a captain, and could count among his accomplishments an arrest by Russian Secret police in 1913.\n\nDuring the Great War, he surved in the Second battle of Ypres where he lost an eye, and by 1918, he served was made a lieutenant colonel and had served in Europe and Palestine. He continued to serve in the army afterwards, making Major-General in 1933 and Lieutenant-General in 1938. His experience in India and Palestine has made him an optimal choice for Viceroy of India."
 raj_internal.2.a:0 "Welcome!"
 raj_politics.1.t:0 "The Congress Socialist Party Forms"
 raj_politics.1.d:0 "The Congress Socialist Party was formed recently as an internal faction in the Indian National congress to reject both Ghandian socialism (which they saw as anti-rational and mystic) and the sectarianism of the Communist Party of India. The CSP supports decentralized economics with cooperatives, trade unions, and small farmers holding much of the power. The CSP contains forces such as communists, fabians, and marxists."
 raj_politics.1.a:0 "Yet more parties to deal with."
 
