 #events
 RUS_Exiles:0 "Returning Exiles"
 rus_civil_war.1.t:0 "Military Exiles Arrive from Yugoslavia"
 rus_civil_war.1.d:0 "Upon news of the revolt, the Russian Diaspora - particularly those who left during the First Civil War - erupted in joy as the first batch of Exiles and their Descendents returned to Russia via Azov. On the first boat, out of Yugoslavia, were the leaders of the Russian All-Military Union, an ostensibly Monarchist Veterans Group. In a speech to the masses at the port, ROVS Commander Alexei Arkhangelsky affirmed ROVS's unconditional support for the revolt against Bolshevism and [This.GetLeader]’s leadership.\n\nWhile the ROVS began to establish political offices, volunteers started arriving from all corners of the globe. They have organized in their own divisions and have turned over their command to the Tsaritsyn Government. While poorly equipped, these fighters are well-trained, and will likely be of much use in this conflict."
 rus_civil_war.1.a:0 "Welcome Home, Great Heroes!"
 rus_civil_war.2.t:0 "Kadets Arrive in Azov"
 rus_civil_war.2.d:0 "Another great stir was made in the Port of Azov when it was found out that former Leader of the Constiutional-Democratic Party Pavel Milykov would be on an incoming vessel, returning from his Parisian Exile. The old man stepped down from a vessel in the early evening, greeted by hundreds of supporters, and was asked to make a speech. He did not say much, but he declared his support for the Tsaritsyn Government, his intention to meet with the leadership, and support for the fight against Bolshevism in general. He also announced his intention to reform the Party under his leadership, as he claims that his internal counterrevolution strategy has been proven right. His arrival had a rousing effect on the audience, and some of his supporters have gone and volunteered for military service."
 rus_civil_war.2.a:0 "The Kadets lived to fight another day!"
 rus_civil_war.3.t:0 "Octorbists Reform"
 rus_civil_war.3.d:0 "Despite the death of Alexander Guchkov, members of the old Union of October 17, a Liberal Conservative party in Imperial Russia, today announced the reformation of their old Party. The new party leader, Alexander Krudener-Struve, today announced a program to support the establishment of a democratic process, total privatization of state industry and agriculture, and other conservative viewpoints. However, after much arguing, the new Octobrists have pledged their support not only to the new government’s leadership, but the factional viewpoints of the Kadets in order to expedite the democratization of Russia. The announcement has led several like-minded youths and adults to sign up for military service."
 rus_civil_war.3.a:0 "We appreciate their assistance!"
 rus_civil_war.4.t:0 "Revolutionaries Cross the Border"
 rus_civil_war.4.d:0 "Border Guards frequently pick up Red Deserters, but today, near Voronezh Oblast, it became clear that they did not find regular soldiers. Maria Spiridonova, Boris Kamkov, and other leading Left Socialist Revolutionaries have crossed the frontline and asked to be allowed to form a political base. They say that the SR program can appeal to Socialists, especially peasants, while drawing them away from the Bolshevik line, therefore bringing our government support. After much discussion, an agreement was reached: the Left Socialist Revolutionaries would agitate against the Bolsheviks, but not mention or disdain our leadership or economy. Although some in our government are nervous about working with Socialists, their ability to take away from the Bolsheviks' support is paramount."
 rus_civil_war.4.a:0 "Welcome Aboard, I suppose."
 rus_civil_war.5.t:0 "The Second Union of the Russian People"
 rus_civil_war.5.d:0 "At a meeting house on the outskirts of Rostov-na-Donu, Nikolai Markov, the leader of the late Union of the Russian People, announced the organization's refounding. He was then questioned intently by government officials, as he is known for his Extreme-Right views. He made it very clear that although the party will accept nothing less than the reestablishment of the Romanov Dynasty as an Autocracy and State Orthodoxy, the new Black Hundredists are willing to put aside their differences with the new government to fight the Bolsheviks. It is known that Markov personally detests the idea of personal freedoms and equality for Jews, but he seems to be able to keep these feelings to himself for now."
 rus_civil_war.5.a:0 "They can be dealt with later."
 rus_civil_war.6.t:0 "Trudoviks Return to Russia"
 rus_civil_war.6.d:0 "The Leaders of the old Labour Group, referred to as the Trudoviks, have convened in Tsaritsyn and declared the reformation of the Party. In a speech outside the townhouse, Party Leader Ivan Zhilkin, as has become usual, affirmed the Party's Support for the New Leadership, denounced Bolshevik policy, and promised to fight for true land reform. He also reiterated his Party's support for political equality, social welfare, and regulated Capitalism. The Trudoviks have become quite popular already, and a few thousand of their supporters have already volunteered for military service. The Trudoviks have thrown their lot in with the Kadets, who have gladly accepted them as partners in their Bloc."
 rus_civil_war.6.a:0 "A good ally in these troubled times!"
 rus_civil_war.7.t:0 "A National Trade Union?"
 rus_civil_war.7.d:0 "One of the more enthusiastic emigre groups, the National Alliance of Russian Solidarists (NTS) has curiously decided not to form their own base of political support, but to act as a sort of trade union in favor of our government. NTS leader Viktor Baydalakov has declared for his unconditional backing of the Provisional Council and the political aims of KONR, as it is known that the Provisional Council's program was in part inspired by the NTS. However, the NTS advocates for a more Corporatist society based on Christian Teachings. Nevertheless, the NTS does not follow the other Democratic parties in advocating for a transference of power directly to a Parliamentary Assembly, but the creation of a temporal military dictatorship. This military dictatorship would build democratic institutions in conjunction with the NTS, and then transfer power to the new Parliament."
 rus_civil_war.7.a:0 "We can probably find a use for them."
 RUS_NTS_Arrived:0 "§GThe NTS returned to Russia.§!"
 rus_civil_war.8.t:0 "Socialist Revolutionaries Return"
 rus_civil_war.8.d:0 "The Chaos of the Civil War has allowed members of the Party of Socialist Revolutionaries (the right wing of the party, from which the PLSR split off of) to cross the border and begin political operations. The Group's leader, Victor Chernov, made a public appearance after returning from the United States, in which he affirmed the Party's support for the Anti-Bolshevik War and Free Democracy. They also praised our economic policies, which they say allow the state to direct industrial growth while permitting the people to better themselves. Chernov also praised the \"Anti-Chauvanist\" attitudes of the government, claiming that the SRs will follow in their footsteps. Although our government is made slightly uncomfortable by the SRs' socialism, they will be useful to take support away from the Bolsheviks."
 rus_civil_war.8.a:0 "More help is appreciated!"
 rus_civil_war.9.t:0 "The Russians Assemble"
 rus_civil_war.9.d:0 "Splitting off from the new Union of the Russian People, the less-extreme Russian Assembly is a monarchist party led by Pyotr Apraskin. At the (re)founding of the party, it was, of course, decided to back the Tsaritsyn Leadership, but politically align with the Russian All-Military Union. The Assembly demands a restoration of the monarchy in Russia, but do not demand a direct descendent from the main line of Romanovs, offering several other nobles and royals as alternatives."
 rus_civil_war.9.a:0 "Yet another political development."
 rus_civil_war.10.t:0 "The Progressive Party Reforms"
 rus_civil_war.10.d:0 "The Progressive Party was a minor liberal party in the Empire. Occupying a Centre position between the Kadets and Octobrists, the Progressives advocated for liberal reforms and free trade. They failed to get a large following because they differed from the Kadets on economics, but not really on social or political issues. Minor economic differences were not the issue of the day in the Russian Empire, with the struggle of Capitalists against Socialists being paramount in economic debates. The party, as expected, supports our leadership, but politically has decided to work in the Kadets' bloc. It is not expected that they will get a large following."
 rus_civil_war.10.a:0 "An ally all the same."
 RUS_get_sov_generals:0 "§GRed Army Generals will defect to us.§!\n"
 rus_civil_war.11.t:0 "Choosing a Leader"
 rus_civil_war.11.d:0 "It has come time for the Provisional Council to choose a government for the country. In the meantime, military figures have filled out cabinet positions such as foreign or economic minister, but the Council has decided that it must formalize our government leadership. To that end, we have three possible choices.\n\nOur first choice would be to organize a liberal government around Pavel Milyukov. The old foreign minister is respected internationally, and those in the provisional government have found him to be an intelligent and capable figure. We could also form a government around the Octobrist Lev Zinoviev. A veteran of the Imperial Civil Service, he might be old-fashioned, but committed enough to Democratic ideals while Conservative enough to appeal to older and rural elements.\n\nOur final choice would be to allow Vlasov to fully take the reigns. Although he has been acting as a policy maker already, he is not formally the head of government. KONR has proven increasingly popular among our military and moderate nationalists, though many in the council worry that it would lead to a dictatorship. With the debate out of the way, all the possibilities have been weighed and the vote has been taken. The government will be formed by..."
 rus_civil_war.11.a:0 "Milyukov and the Liberals!"
 rus_civil_war.11.b:0 "Zinoviev and the Conservatives!"
 rus_civil_war.11.c:0 "Vlasov and KONR!"
 rus_civil_war.12.t:0 "Complaints about Occupation"
 rus_civil_war.12.d:0 "Despite our best efforts, our troops are sometimes prone to excesses. A complaint has reached our ears from a village we recently moved into, that one of our fireteams stole from and physically harrased the inhabitants. They demand that \"the New Russia\" take appropriate action to correct this matter."
 rus_civil_war.12.a:0 "We do not have the time."
 rus_civil_war.12.b:0 "Try the soldiers."
 rus_civil_war.12.c:0 "Pay restitution."
 rus_civil_war.12.e:0 "Pay restitution and try the offenders."
 rus_civil_war.13.t:0 "Land Distribution Dispute"
 rus_civil_war.13.d:0 "The decollectivization process is generally going well, but we have recieved a few complaints from concerned citizens. They say that they have been given less land than their neighbors, which they see as unfair. When questioned, local authorites gave reasons including natural features, comparative land arability, projected consumption, etc. Regardless, the concerned citizens have asked for us to take action."
 rus_civil_war.13.a:0 "The Local Authorities know best."
 rus_civil_war.13.b:0 "Give the citizens proper monetary compensation."
 rus_civil_war.13.c:0 "Equitize the apportionments."
 rus_civil_war.14.t:0 "The [From.GetAdjective] Military District Joins us"
 rus_civil_war.14.d:0 "[From.GetLeader], the former Red Army Commander of the [From.GetAdjective] Military District, has rightfully decided to join us in our mission to defeat the Bolshevik menace. They declared their allegiance to the New Russia, and recognized that their administrations are temporal, to be ended once the civil war has finished."
 rus_civil_war.14.a:0 "The Reds shall fall!"
 rus_civil_war.15.t:0 "Dybenksim in the Volga District"
 rus_civil_war.15.d:0 "Pavel Dybenko was known in the Red Army as an incompetent drunk. He was expelleed from the Communist Party more than once, with only the personal loyalty of his soldiers to his name. From the beginning of the first Civil War, Dybenko's troops were known to drink, flee, and commit acts of banditry, most notably in the short lived Crimean Socialist Soviet Republic. These behaviours have again risen in Dybenko's Volga Military District. There are verified reports of soldiers using their authority to steal and extort from the local population, as well as harass local minorities. Although our Political Leadership is greatly offended by these actions, our lack of de facto authority in the Volga District meanst hat it will reflect negatively on KONR."
 rus_civil_war.15.a:0 "We will court-martial him when possible."
 rus_civil_war.16.t:0 "Politics in [From.GetNameDef]"
 rus_civil_war.16.d:0 "The leader of [From.GetNameDef], [From.GetLeader] has decided to follow our lead and allow political organizations other than KONR to form and participate in local affairs. They have been given municipal bureaucratic powers, freeing the military to focus on larger projects."
 rus_civil_war.16.a:0 "A great victory for freedom!"
 rus_civil_war.17.t:0 "Managing the Democratic Transition"
 rus_civil_war.17.d:0 "It has become increasingly clear that we cannot get popular support without real reforms. Therefore, the decision was made to appoint a representative from one of the liberal parties to manage this process. This way, we can take credit for any successes, and not be directly responsible for any failures. The only question is: who should we choose?"
 rus_civil_war.17.a:0 "A representative from the Socialists"
 rus_civil_war.17.b:0 "A delegate from the Labour Group"
 rus_civil_war.17.c:0 "We want a Kadet politician"
 rus_civil_war.17.e:0 "A senior Octobrist can appeal to the Conservatives."
 rus_civil_war.18.t:0 "Mob Justice?"
 rus_civil_war.18.d:0 "On paper, the arrest of Bolshevik bureaucrats and sympathizers was to be done peacefully and efficiently. In practice, this has not been the case. Reports have indicated that soldiers and police have been beating and even on occasion killing these functionaries, claiming violent struggle. While some incidents are genuine cases of self-defense, others seem to be petty acts of violence. If the Reds are truly unlucky, they are given to the Justice of the Public, where they are beaten, pelted with stones and fruit, and brutally humiliated. The public has chosen these arrests to be a trial by their peers, and the defendents are presumed guilty."
 rus_civil_war.18.a:0 "The Public has already sentenced the Bandits"
 rus_civil_war.19.t:0 "Mob Justice in [From.GetNameDef]"
 rus_civil_war.19.d:0 "Reports from [From.GetNameDef] reveal a shocking level of brutality by our allied territories. Rebel soldiers are beating and even killing Bolshevik Functionaries, as some sort of revenge for the last 20 years. The public feels similarly, with incidents of mobs forming to beat these bureaucrats themselves, in one case even arresting them and holding an impromptu trial on their own, with the defendent presumed guilty. The military government seems not to care about these incidents, writing them off as \"unfortunate occurences\". However, this has made political groups nervous, and our inability to do anything about this will reflect poorly on us."
 rus_civil_war.19.a:0 "Now is not the time!"
 rus_civil_war.20.t:0 "Narodnaya Pobeda"
 rus_civil_war.20.d:0 "Ever since we allowed limited forms of expression, new periodicals have been published in the Far East. \"People's Victory\" is a new Fascist newspaper, a first in Russia. Published by N.N. Khrabrov, as the editor calls himself, Narodnaya Pobeda claims to be the party of the Russian Fascists in the Far East, despite the Emigre Fascists already having their own paper, \"Nash Put\" (Our Way). The paper praises the Government in Tsarytsin, the administration in Khabrovsk, and the Fascist administration of Rodzaevsky, Vonsyatsky, and Semyonov, while blaming hardships and failures on the Communists and other such \"Anti-Russian Elements\". It calls for a general mobilization of the nation to fight the Bolshevik menace.\n\nWith little else to do in the Far East, the citizens of our district have made the periodical into a best-seller. Although few are convinced of its arguments, people and groups from all political creeds and social class have been investigating the newpaper, as it is the first domestic Russian Fascist publication, and the first example of Fascist propaganda to be available to the Russian public. Its mystique is only increased by the fact that nobody knows of this N.N. Khrabrov, or who he really is. Nobody can also figure out where the newspaper is being printed, or directly published from."
 rus_civil_war.20.a:0 "An interesting development..."
 rus_civil_war.21.t:0 "The People's Second Victory"
 rus_civil_war.21.d:0 "Narodnaya Pobeda gripped the nation a month ago, and today, the second issue was published. Though it did not draw quite as much attention as the first one, this issue proved to be just as gripping. In an editorial, Khrabrov wrote an essay titled \"Monarchy or Republic?\". Despite the unoriginal name, it proved to be a large source of debate. Within the essay, Khrabrov considers whether a Fascist Russia should be a monarchy or a Republic. He clearly read imported issues of Nash Put, as he considers Rodzaevsky's answer to this question, which is to not commit to either option. However, he rejects it. Khrabrov decides that the role of the state is to \"reawaken and foster\" the National, Social, and Spiratual Consciousness of the Russian People. First, he claims that this is best accomplished by Autocracy, as six hundred years of Tsarist Rule had gone largely uninterupted. The Popular Revolutions in 1905 and 1917 were, according to Khrabrov, caused by \"Foreign Subversive Elements\", and an Autocratic State would prevent this.\n\nHowever, Khrabrov's question is now a matter of inheritance: Should the Autocrat be an inherited position, or chosen by a Political Elite? Khrabrov claims that the former method is superior, as it had worked since the days of the Kievan Rus with no interuption. A Leader (he uses the word \"Predvoditel\") chosen by a political elite can give way to factionalism and corruption, which a Monarchy would avoid. He comments that the later Romanovs had not acted to prevent these \"Subversive Interests\" from taking hold in Russia, but excuses them as \"the proper methods\" (Fascism) had \"not been developed yet\"."
 rus_civil_war.21.a:0 "And what does the RFP think?"
 rus_civil_war.22.t:0 "The People's Victory Comes Again"
 rus_civil_war.22.d:0 "The third issue of Narodnaya Pobeda was recently published, but has sold far less than the preceding two issues. It seems the people have already gotten over these radically new ideas, and has proven the publication to be a fad. Regardless, the paper still makes money from Far-Right Monarchists and the like. In this issue, Editor N.N. Khrabrov explores economic issues, and attempts to formulate a system that would work \"for all Russians\". He denounces Liberal Capitalism as a method for \"Exploitative Parasites\" to sell the nation and the strength of the people for personal gain, but also Marxian Socialism for providing the state the power to do the same, devoting a whole three paragraphs for a denunciation of Lenin and Stalin. He also criticizes socialism for preventing the individual to make the most of himself, at least within state boundaries.\n\nKhrabrov then begins to forumulate a new system to represent all Russians regardless of social class, or rather, because of their social class. By \"formulate\", future historians will mean \"copied from Mussolini and hoped nobody will notice\", as he goes on to describe a Corporatist system, where workers of different sectors of the economy will be reprsented by \"Corporations\", a corporate group similar to a trade union.\n\nKhrabrov then decides to tackle the issues of Nationalization. He argues that important industries should remain nationalized to ensure economic and national security, but most others should be private to allow the people to achieve their own standard of living. Readers generally consider this to be relatively unoriginal, as this is already the stated policy of the government."
 rus_civil_war.22.a:0 "The Paper has ceased to be a novelty."
 rus_civil_war.23.t:0 "Rus' Svyataya"
 rus_civil_war.23.d:0 "For 20 years, Christian belief had been under attack in Russia. Stalin's purges had reduced the Russian Orthodox Church to less than five hundred clergymen, with other religious institutions being treated similarly. The Civil War is the first time our people can openly practice their religion, and a new newspaper has been formed to reflect this. \"Rus' Svyataya\" (Holy Russia) is the Volga's \"Official\" publication for Conservative Orthodoxy, published by a G-N (Mr.) S.I. Verushnikov. The paper has caused a bit of a stir, with Anti-Clerical and Non-Orthodox groups denouncing the Pro-Religious Arguments, and Right-Wing Russian groups giving it much fanfare.\n\nThe paper calls for the development of the Russian Orthodox Church as a National Institution based around the Monarchy. Unlike other Far-Right Orthodox groups, \"Holy Russia\" does not demand the restoration of the Romanov dynasty, only that the Monarch be Russian Orthodox. The paper briefly considers the question of Theocracy, and while it considers Rule by Religious Institutions to be a legitimate option, Verushnikov only asks that the Church's interests be represented in government.\n\nVerushnikov himself has become a local celebrity. As it turns out, his parents were incredibly devout members of the Russian Orthodox Church, who instilled these Conservative values in their children. Religious people have begun flocking to him, almost as a pilgramige, as he begins writing the second issue..."
 rus_civil_war.23.a:0 "God Bless Russia?"
 rus_civil_war.24.t:0 "Rus' Svyataya Prints Again!"
 rus_civil_war.24.d:0 "The second issue of \"Holy Russia\" has been published with much fanfare, but Gospodin Verushnikov's arguments proved far less gripping for the general public. The paper attempts to be a Newspaper, Propaganda Service, and Prayer Book at the same time. It informs the public on current events, provides editorials attacking the Marxists, and about a third of the publication provides prayers, presumably as a replacement for lost Orthodox Literature.\n\nBut while the first issue caused a bit of a stir, the second can mostly be found after Old Ladies are finished singing prayers on street corners. The Conservatives still like and enjoy Rus' Svyataya, but its novelty has quickly worn off, like a new Tram or a two-headed fish."
 rus_civil_war.24.a:0 "Not an interesting read, it seems."
 rus_civil_war.25.t:0 "Chernaya Zvezda"
 rus_civil_war.25.d:0 "Anarchism has had a long history in the Russian Empire, with a large following until the Bolsheviks consolidated control over the country during the first Civil War. Now that the country is once again in chaos, an Anarchist Newspaper, the \"Black Star\", has found it safe to publish scathing attacks on the Bolshevik government. The paper blames Lenin and Stalin for \"betraying the Revolution\", corruption, and abuses of power. However, they have also found it safe to attack our government, accusing us of \"Perpetuating Elitist Rule\" when we should be \"Fighting for Democracy and Freedom\".\n\nNobody can tell where the publication is being printed from, or even who writes for it. The staff all use pseudonyms, such as \"Pomidor\", \"Medved\", and \"Parovoz\" (Tomato, Bear, and Steam Train, respectively). This means that although \"Chernaya Zvezda\" breaks laws by slandering our government, we cannot find, nor dispatch the resource to investigate, the perperatrators.\n\nMost political groups in our territory revile them or at the very least emphatically disagree, and call for them to be put to trial. Left-Wing Groups, have put out statements cautioning the \"Foolishness of fighting the Wrong Enemies\", but even they are prone to ideological polemics, with some editorials angrily claiming that these Anarchists are in reality Bolshevik spies."
 rus_civil_war.25.a:0 "Who are these Anarchists?"
 rus_civil_war.26.t:0 "Chernaya Zvezda's Second Revolution"
 rus_civil_war.26.d:0 "To the dismay of most in the Siberian District, \"Chernaya Zvezda\" has printed another issue, attacking ideological enemies left, right and center. If the attacks were more intense, the newspaper would be physically attacking people. The staff had clearly read other papers' responses, as they spend time on a rebuttal, specifically denying accusations of espionage. They attack the other Socialists for being weak, and the right-wingers for being cowards, and the Centrists for being apathetic. They then go on to demand democratic reforms in the army, and elections to municpal governments.\n\nOther political papers continue to protest \"Chernaya Zvezda\". Right-Wing, Centrist, and Left-Wing papers all denounce the Anarchists as dangerous, either for reasons of alleged espionage, subversion, or for ideological reasons. Despite the fact that no progress has been made in ascertaining the writers' identities, they still can stir up a lot of trouble."
 rus_civil_war.26.a:0 "We do not have time for this!"
 rus_civil_war.27.t:0 "Chernaya Zvezda's Third Rising"
 rus_civil_war.27.d:0 "The third issue of \"Black Star\" has caused even more stir than the previous two. In this issue, \"Medved\", one of the writers, describes the ideal Anarchist State (the irony is apparently lost on him). He describes a free association of Communes, which is to be the highest level of government. These communes would govern entirely independent of one another, relying on direct democracy. They would be free to implement their own policies, and even engage in foreign policy on their own. The only higher form of government would be the Raion (county) during emergencies, and the Central Commune for extreme emergencies, such as war.\n\nEconomically, the communes would be developed by decentralized planning: all economic decisions would be made democratically. Instead of state or private ownership, all property would be owned commonly, with everybody having equal right of use.\n\nAgain, all other parties have begun a rebuttal period, with denunciations of this plan as unrealistic, foolish, or \"Anti-Russian\". The Far-Right and Left still claim that these Anarchists are spies, with the intention of destroying our ability to fight the Red Oppressors."
 rus_civil_war.27.a:0 "Do they have nothing better to do?"
 RUS_work_with_fascists:0 "Working with Ideological Enemies"
 rus_civil_war.28.t:0 "Fascists March out of Manchuria"
 rus_civil_war.28.d:0 "White Emigre Soldiers under the command of Transbaikal Ataman Grigory Semyonov have marched out of Manchuria, and have begun a campaign against the USSR. Their political leader is Konstantin Rodzaevsky, the leader of the Russian Fascist Party. Foreign cables were kind enough to inform us of this development, which also wrote of a speech Rodzaevsky gave to his blackshirts. In this speech, Rodzaevsky declared the Fascist Government in [RFP.Capital.GetName] to be merely a regional administration of our government, and that his troops are ready to join ours in the \"Holy Crusade\".[This.GetDenounce]"
 RUS_can_denounce:0 "\n\nHowever, some of our foreign backers have expressed reservations about an alliance with the Fascists. These countries have Left-Wing Governments, and their cables say that working with ideological enemies will not be popular with both the government and the public. If we do not denounce the fascists, it might be difficult to get these countries to back us in the future."
 rus_civil_war.28.a:0 "Rodzaevsky and his movement are welcome allies!"
 rus_civil_war.28.b:0 "We are honored by the Command of the Legendary Ataman!"
 rus_civil_war.28.c:0 "The Fascists have no affiliation with the New Russia!"
 RUS_exalted_semyonov:0 "Supported Cossacks over Fascists"
 rus_civil_war.29.t:0 "Russia Supports Semyonov's Faction"
 rus_civil_war.29.d:0 "Our contacts in Manchuria have sent us a letter containing a copy of one of [RUS.GetLeader]'s statements, in which he praised the command of Ataman Semyonov and his forces. The statement makes no mention of the Fascist Leadership! This is clearly intended as a slight, possibly due to foreign elements influencing his opinions."
 rus_civil_war.29.a:0 "We'll teach him to pay attention to us."
 rus_civil_war.30.t:0 "Blackshirts come to Russia"
 rus_civil_war.30.d:0 "After our praise of the Fascist March in the Far East, Fascists have arrived in Russia en masse, and attempted to organize Blackshirt divisions. While we welcome volunteers, the Army Leadership said that they would refuse to allow the Blackshirts to organize separate divisions, and that they must join the ranks normally. Despite this restriction, the Fascists seem eager to fight, regardless.\n\nPolitically, the Fascist Newcomers have been working with the Black Hundredists, as the two groups have similar goals, although the fascists are, in comparison, negligible."
 rus_civil_war.30.a:0 "God, Nation, and Labour?"
 rus_civil_war.31.t:0 "Russia Denounces Us"
 rus_civil_war.31.d:0 "The Foreign Marxist Plutocrats have managed to levarage Tsaritsyn into distancing itself from our Crusade! The Fascists have found this both perplexing and intolerable. In a Rally to the Blackshirts, the Vozhak informed them of this betrayal, and declared that if the Provisional Council was not capable of coordinating with those loyal to its cause, then it must be declared to be an traitor, and therefore does not represent the legitimate Russian Government. Rodzaevsky of course maintained that the task falls to us, and has declared the New Russia's soldiers to be as much of an enemy as the Bolsheviks!"
 rus_civil_war.31.a:0 "The Vozhak shall rule all Russia!"
 rus_civil_war.32.t:0 "Vonsyatsky Returns to the RFP"
 rus_civil_war.32.d:0 "The leader of the Connecticut-Based All-Russian National Revolutionary Party, Anastasy Anastasyvich Vonsyatsky, has rejoined us in our Crusade. Although previous attempts at cooperation failed due to dissagreements on the Jewish Question and Cooperation with the Japanese, the Collapse of the USSR is sufficient to allow the two groups to start working with each other again. Vonsyatsky arrived by train to the capital, where he met with the Vozhak, and began outlining plans for a post-war Fascist government."
 rus_civil_war.32.a:0 "We must learn to work together."
 rus_civil_war.33.t:0 "Rodzaevsky Establishes a State Religion"
 rus_civil_war.33.d:0 "Despite that such a thing is not conducive to our popular movement, the Far Eastern Fascists have gone ahead and established the Russian Orthodox Church as the State Religion. Apparently, they see their status as a \"regional administration\" as an allowance of doing as they please. The Russian Far-Right is pleased at this development, and argues that we should do the same. All other politicians have emphatically refused to consider this proposal."
 rus_civil_war.33.a:0 "We shall deal with this later."
 rus_civil_war.34.t:0 "Fascists Claim Our Place!"
 rus_civil_war.34.d:0 "Rodzaevsky's Bandits were going to be a political nightmare once the Reds have been defeated. However, they seem to have made matters worse by declaring themselves to be the legitimate goverment of Russia. According to the so-called \"Vozhak\", we are too weak to carry out the Fascist Revolution, and despite our common enemy, Rodzaevsky has proclaimed that we must be destroyed as well."
 rus_civil_war.34.a:0 "The Lying Snake will be punished!"
 VLA_will_be_annexed:0 "§RWe will be annexed into [RFP.GetNameDef].\n§!"
 rus_civil_war.35.t:0 "Union with the Fascists?"
 rus_civil_war.35.d:0 "The Self-Proclaimed \"Vozhak\" of the Russian Fascist Party, Konstantin Rodzaevsky, has sent us a message asking if we would like them to take over political duties, thus letting General [This.GetLeader] to focus on military duties. Although this is a blatant Fascist attempt to expand their power base, it is true that it would make military command more efficient. How shall we respond?"
 rus_civil_war.35.a:0 "We shall accept."
 rus_civil_war.35.b:0 "We're doing fine, thank you."
 rus_civil_war.36.t:0 "[From.GetNameDef] Accepts Annexation"
 rus_civil_war.36.d:0 "[From.GetLeader] has agreed to allow our administration to take over his territory, while he and his commanders focus on military command. Buildings have begun flying the RFP flag, yet the common folk are not sure what to make of our crusade."
 rus_civil_war.36.a:0 "We shall have to teach them."
 rus_civil_war.37.t:0 "[From.GetLeader] Repudiates our Offer"
 rus_civil_war.37.d:0 "[From.GetNameDef] has refused our very generous offer to manage their territories while the generals focus on commanding their military. It seems they would rather hog the glory for themselves instead of allowing the Fascist Revolution to shine!"
 rus_civil_war.37.a:0 "We must find other methods..."
 rus_civil_war.38.t:0 "Fascists Annex [From.GetNameDef]"
 rus_civil_war.38.d:0 "Russian Fascist Leader, or \"Vozhak\", as he prefers to be called, Konstantin Rodzaevsky has announced that [From.GetNameDef] will be subsumed into [RFP.GetNameDef] so that [From.GetLeader] can focus on his military duties. Although this is merely a way for the Fascists to gain political relevance, we can be consoled by having [From.GetLeader] in the Fascist military, which will hopefully bring a moderate voice to the table."
 rus_civil_war.38.a:0 "We will wait and see."
 rus_civil_war.39.t:0 "[From.GetNameDef] Revolts!"
 rus_civil_war.39.d:0 "Our revolt has exacerbated ethnic tensions in the USSR to the point that separatists have rebelled and declared the foundation of [From.GetNameDef], meant to be a new independent state. However, as we technically claim that territory, we must decide on our reaction. Far-Rightists wish to attack the new state and \"re-integrate it into Great Russia\". Members of KONR recommend to not react at all, and simply acknowledge the revolt so we can deal with it later. The Liberals and Socialists in government advocate for us to recognize and ally with the new state, calling for unity in the face of Bolshevism, which the Whites failed to achieved in the first civil war."
 rus_civil_war.39.a:0 "Attack!"
 rus_civil_war.39.b:0 "Remain Passive"
 rus_civil_war.39.c:0 "Offer an Alliance"
 rus_civil_war.40.t:0 "Russians Offer an Alliance"
 rus_civil_war.40.d:0 "Due to current circumstances, the Tsarytsin Government has offered to recognize our government and territory according to Soviet Administrative Borders in exchange for an agreement of cooperation. Russian and [This.GetAdjective] troops will fight side-by-side rather than against each other. Shall we accept this offer?"
 rus_civil_war.40.a:0 "Yes!"
 rus_civil_war.40.b:0 "We cannot trust the Russians."
 rus_civil_war.41.t:0 "[From.GetNameDef] Accepts our Alliance"
 rus_civil_war.41.d:0 "The [From.GetAdjective] Government has accepted our offer to join the Anti-Bolshevik Front. Our troops will fight as one against the Bolshevik Menace. For now, at least."
 rus_civil_war.41.a:0 "The Enemy Trembles in Fear!"
 rus_civil_war.42.t:0 "The [From.GetAdjective] Government Rejects our Proposal"
 rus_civil_war.42.d:0 "[From.GetNameDef] has decided to reject our proposal of alliance. It is clear that they do not trust us to not betray them."
 rus_civil_war.42.a:0 "A shame."
 ##Internal
 rus_internal.1.t:0 "Guerillas Gain Experience"
 rus_internal.1.d:0 "After many months, our army has gotten used to the struggles of guerilla warfare. Avoiding battles in open terrain (which is nigh-impossible in the steppe) and choosing to fight from the shadows, we have inflicted severe casulties on the Red Army."
 rus_internal.1.a:0 "Hopefully, it will be enough."
 ##External
 rus_external.1.t:0 "Russia Asks for Weapons"
 rus_external.1.d:0 "The Anti-Bolshevik Government in Russia has come to us with a request. They want to know if we are willing to send them weapons, which they intend to use to fight the Bolsheviks. Many in our government are enthusiastic about this offer, as we have an interest in eliminating the Red Beast. A few naysayers, on the other hand, feel like these weapons should stay in the homeland, as we may need them shortly. Shall we arm the Russians, or not?"
 rus_external.1.a:0 "Tsarytsin must not fall!"
 rus_external.1.b:0 "We do not have the resources at this time."
 rus_external.2.t:0 "[From.GetNameDef] Delivers Weaponry"
 rus_external.2.d:0 "The [From.GetAdjective] Government has acceeded to our request and has sent Infantry Equipment to our shores. We have immedietely begun distributing the weapons and gear. This is sure to assist us in the fight against the Bolshevik Tyrants."
 rus_external.2.a:0 "Their assistance will not be forgotten!"
 rus_external.3.t:0 "[From.GetNameDef] Refuses our Request"
 rus_external.3.d:0 "The [From.GetAdjective] Government has refused to send us the weapons that we desperately need, citing \"national security concerns\" and \"upcoming demand\". Obviously, they seek to protect themselves while leaving us out to die in the steppe."
 rus_external.3.a:0 "These Imperialists will pay!"
 rus_external.4.t:0 "Polish-Russian Non-Aggression Pact"
 rus_external.4.d:0 "The Foreign Ministry of the Russian Revolt has approached us with a proposal for a non-aggression pact. Under the terms of the agreement, Poland and Russia would not be allowed to take hostile action against the other, and each would recognize the other's territorial integrity. Should we sign this pact?"
 rus_external.4.a:0 "Of course!"
 rus_external.4.b:0 "Something's off here..."
 rus_external.5.t:0 "Poland Signs the Non-Aggression Pact"
 rus_external.5.d:0 "The Poles have agreed to sign the non-aggression pact. We both recognize each other's territories and spheres of influence. This will help us to ensure that we have a nearby partner in the fight against the Bolsheviks."
 rus_external.5.a:0 "A Great Success for the New Russia!"
 rus_external.6.t:0 "A Diplomatic Defeat"
 rus_external.6.d:0 "The Poles have decided to repudiate our offer of non-aggression. It appears that they would rather risk aggressive relations with us than enusre peaceful collaboration. The Black Hundredists are happy about this, as they seek to use this as a pretense to restore Greater Russia."
 rus_external.6.a:0 "So be it!"
 #Focuses
 ##Politics
 Russian_Civil_War:0 "§YSecond Russian Civil War§!"
 RUS_2RCW_Politics_Start:0 "Choosing a Leader"
 RUS_2RCW_Politics_Start_desc:0 "Before we undertake political reforms, we must decide on a leader of our government and their cabinet. This assure the people and foreign observers that we intend to see this conflict through and establish stable leadership."
 RUS_2RCW_Politics_Try_Communists:0 "Try the Guilty"
 RUS_2RCW_Politics_Try_Communists_desc:0 "Major Communist figures - local Party Secrataries and so forth - were arrested in the days following the revolt. We shall give them fair trails on charges of associating themselves with an enemy force."
 RUS_2RCW_Politics_Personality_Cult:0 "Destroy the Cult"
 RUS_2RCW_Politics_Personality_Cult_desc:0 "The Stalin Cult has proven to be a great evil, even more so than the Lenin Cult. By our initiative, the Personality Cult will be denounced, exposed, and destroyed."
 RUS_2RCW_Politics_Prepare_Reforms:0 "Win the People"
 RUS_2RCW_Politics_Prepare_Reforms_desc:0 "The people do not simply want another change of power, they want real reforms. Therefore, we shall begin to restructure society to free it from the Bolshevik system, although to a degree where our security interests are met. Further reforms will come after the war, which we are sure the population will understand."
 RUS_2RCW_Politics_Freedom_of_Speech:0 "Limited Freedom of Speech"
 RUS_2RCW_Politics_Freedom_of_Speech_desc:0 "We can allow limited Freedoms of Speech, where all expression bar Pro-Bolshevism, Sedition, and political/military secrets are allowed. Though we accept the people's right to express themselves, we must keep national security in mind."
 RUS_2RCW_Politics_Injustice:0 "Prevent Injustice"
 RUS_2RCW_Politics_Injustice_desc:0 "Our military must remain professional. Lootings, killings, and especially pogroms are explicitly prohibited. Any citizen who suffers injustice from the military may appeal for compensation."
 RUS_2RCW_Politics_Open_Churches:0 "Re-open Religious Institutions"
 RUS_2RCW_Politics_Open_Churches_desc:0 "After Socialist Attacks on Religious institutions, we will allow them to be re-opened, as religion is a personal freedom. Churches, Mosques, and Synogogues will be legal once again."
 RUS_2RCW_Politics_Free_Press:0 "Managed Press"
 RUS_2RCW_Politics_Free_Press_desc:0 "The Press will be made free, but with a similar restriction as our Freedom of Speech, at least until the war is over. Private citizens and organizations may have their own news organs, and all opinions may be printed so long as it does not reveal sensative information."
 RUS_2RCW_Politics_Equality:0 "Equality for All"
 RUS_2RCW_Politics_Equality_desc:0 "The Soviet Regime has been disasterous for our Ethnic Minorities. Under the cover of Korenizatsiya, ethnic and racial minorities have been oppressed by Moscow for two decades, most of all the Jewsand the Ukrainians. Our government will impose no cultural restrictions, and the people will thus be free."
 RUS_2RCW_Politics_Prepare_Democratic_Transition:0 "Democratization"
 RUS_2RCW_Politics_Prepare_Democratic_Transition_desc:0 "Our liberal government has decided that we should begin developing Democratic Institutions now so we can gain more support from the people. If we linger, public opinion may turn against our rule."
 RUS_2RCW_Politics_One_Banner:0 "Under One Banner"
 RUS_2RCW_Politics_One_Banner_desc:0 "We do not have the time and resources to create democratic institutions right now. We will continue with the policy of Nepredreshenchestvo (Non-Pre-Determination). The political structure of Russia will be determined once we have peace."
 RUS_2RCW_Politics_Encourage_Ideas:0 "Encourage Ideas..."
 RUS_2RCW_Politics_Encourage_Ideas_desc:0 "A key ingrediant of democracy is the development of an intellectual plurality. We shall encourage political parties to debate and campaign, so as long as they stay within our purview."
 RUS_2RCW_Politics_Not_Actions:0 "...Not Actions"
 RUS_2RCW_Politics_Not_Actions_desc:0 "We shall ask political organizations in our territory to refrain from holding protests and strikes, as this may interfere with the war effort. However, we will make government offices available to party representatives so that requests can reach the proper authorities."
 RUS_municipal_politics:0 "Municipal Democracy"
 RUS_municipal_politics2:0 "Delegated Bureaucracy"
 RUS_2RCW_Politics_Municipal_Politics:0 "Municipal Politics"
 RUS_2RCW_Politics_Municipal_Politics_desc:0 "We can delegate the day-to-day operations at the municial level to other political organizations. This will free up some of our resources and show the public that we actually care about reforms."
 RUS_2RCW_Politics_Free_The_Camps:0 "Free The Camps"
 RUS_2RCW_Politics_Free_The_Camps_desc:0 "Soviet Concentration Camps are at present guarded by our soldiers, and although the prisoners have been given greater conditions (if they are truly innocent), they have not yet been freed. It is time to let the innocents go. Those truly guilty shall remain in the prison or transfered to other prisons. Empty prisons can be used as military bases."
 RUS_2RCW_Politics_Expand_Bureaucracy_Free:0 "Delegate Bureaucratic Processes"
 RUS_2RCW_Politics_Expand_Bureaucracy_Free_desc:0 "We can continue to delegate bureaucratic powers to civilian authorities up to the province level. Key provinces, however, shall be left under military authority."
 RUS_NTS_Trade_Union:0 "Narodno-Trudovoy Soyuz Rossiysikh Solidaristov"
 RUS_2RCW_Politics_National_Trade_Union:0 "Make the NTS our National Trade Union"
 RUS_2RCW_Politics_National_Trade_Union_desc:0 "The National Alliance of Russian Solidarists is a Christian Corporatist Organization that strongly backs our government. A major influence on KONR's manifesto, the NTS can be made into our National Trade Union. It would have the responsibility to make sure that the workers are being treated fairly without being entirely dependent on State Control."
 RUS_2RCW_Politics_Fight_for_Rights:0 "Fight for Rights"
 RUS_2RCW_Politics_Fight_for_Rights_desc:0 "The rights we have already granted are not enough to get the people to support us. We must remind people that to protect their new freedoms, they need to fight!"
 RUS_2RCW_Politics_Outlaw_Bolshevism:0 "Outlaw Leninism"
 RUS_2RCW_Politics_Outlaw_Bolshevism_desc:0 "While we have taken measures to find those complicit in Bolshevik crimes (but not defected) and have outlawed Pro-Bolshevik expression, the ideology is still technically legal. Leninism must be temporarily banned, as to not interfere with the war effort."
 RUS_2RCW_Politics_Inter_Party_Relations:0 "Inter-Party Relations"
 RUS_2RCW_Politics_Inter_Party_Relations_desc:0 "While KONR interacts with the other political parties, it would be more efficient to have a separate department to handle these interactions. This will help us coordinate political activities in ways that do not interfere with the military's operations."
 RUS_2RCW_Politics_Military_Bureaucracy:0 "A Strong Military Bureaucracy"
 RUS_2RCW_Politics_Military_Bureaucracy_desc:0 "We must entrench our military's bureaucratic powers to ensure that the military's needs are met at the municipal level."
 ##economics
 RUS_2RCW_Economics_Start:0 "Plowshares into Swords"
 RUS_2RCW_Economics_Start_desc:0 "If we are to free Russia from the Bolshevik Grasp, we must mobilize everything. The development of a strong military industry depends on our decisive action. We must beat our plowshares into swords. We must beat ourselves into swords as well."
 RUS_decollectivize:0 "Agricultural Privatization"
 RUS_2RCW_Decollectivization:0 "Agricultural Privatization"
 RUS_2RCW_Decollectivization_desc:0 "We shall begin decollectivization measures immediately. Over the next two years, farmland will be transfered from state hands directly to smallholding peasants. This will help to reverse the brutal collectivization policies of the Stalinist Regime."
 RUS_2RCW_Industrial_Base:0 "Develop an Industrial Base"
 RUS_2RCW_Industrial_Base_desc:0 "Developing military industry is good in the short term, but will mean nothing if we do not prepare for the long term. Therefore, we will build heavy industry, which will bolster our industrial capacity."
 RUS_2RCW_Infra1:0 "New Rail Lines"
 RUS_2RCW_Infra1_desc:0 "The success of our soldiers depends on the ability of our infrastructure network. If we cannot bring equipment to our soldiers, then we cannot win the war."
 RUS_2RCW_Infra2:0 "Further Rail Innovations"
 RUS_2RCW_Infra2_desc:0 "Developing further innovations in the field of Rail Transport will surely help our soldiers win the war. We will be better able to bring supplies and reinforements to the front."
 RUS_2RCW_More_Civs:0 "Prepare Heavy Industry"
 RUS_2RCW_More_Civs_desc:0 "A larger industrial capacity will help us repair and build military structures. Heavy Industry must therefore be a priority."
 RUS_capitalism:0 "Private Sector"
 RUS_2RCW_Legalize_Private_Economics:0 "Legalize Private Ownership"
 RUS_2RCW_Legalize_Private_Economics_desc:0 "Henceforth, the right of the individual to own private capital shall not be infringed upon. We shall establish a mixed economy, where mineral resources and heavy industry shall remain in state hands, but all other sectors of industry and all of agriculture will be left for private hands. We will hold all current consumer industry, and decide how to privatize it later."
 RUS_2RCW_Focus_on_Agriculture:0 "Agricultural Innovations"
 RUS_2RCW_Focus_on_Agriculture_desc:0 "If we cannot feed our people and our soldiers, then the war will be lost regardless of the state of our industry."
 RUS_feed_troops:0 "Feeding the Soldiers"
 RUS_2RCW_Keep_Troops_Fed:0 "Civilian Rations"
 RUS_2RCW_Keep_Troops_Fed_desc:0 "If the soldiers are not fed, then the war is lost. We must find a way to keep the soldiers fed while 
 RUS_2RCW_Military_Capabilities:0 "Develop our Military Capabilities"
 RUS_2RCW_Military_Capabilities_desc:0 "Although developing an industrial base for the long-term is important, it will mean nothing if we cannot safeguard our freedoms. We must develop a strong military industry."
 RUS_2RCW_Military_Capabilities2:0 "Expand our Factories"
 RUS_2RCW_Military_Capabilities2_desc:0 "We do not necessarily have to build new factories from scratch. We can simply expand the operations of our already standing factories."
 RUS_Western_Industrial_Practices:0 "Western Industrial Practices"
 RUS_2RCW_Western_Practices:0 "Western Practices"
 RUS_2RCW_Western_Practices_desc:0 "It is clear that Eastern industrial practices are not enough for our new nation. We must look to see how the British, French, German, and American factories are run."
 RUS_2RCW_Convert:0 "Convert Civilian Factories"
 RUS_2RCW_Convert_desc:0 "Rather than build new structures from scratch, it would be more efficient to simply convert some consumer goods factories for military use. However, we would lose some industrial capacity."
 RUS_2RCW_Convert2:0 "Additional Conversions"
 RUS_2RCW_Convert2_desc:0 "Now that we have successfully converted a civilian factory into a military one, it would be a good idea to do it again."
 RUS_2RCW_Oil:0 "Expand Oil Drilling"
 RUS_2RCW_Oil_desc:0 "Oil is incredibly important for an army that uses motor vehicles. We should expand our oil drilling operations so we can better fuel our military."
 RUS_2RCW_Chromium:0 "Prepare Chromium for Export"
 RUS_2RCW_Chromium_desc:0 "Chromium is used in the development of heavy ships, but we should make ourselves competative in the chromium market. This will bring us a larger cash flow, and enable us to invest more in heavy industry."
 RUS_foreign_loans:0 "Foreign Loans"
 RUS_2RCW_Foreign_Loans:0 "Foreign Loans"
 RUS_2RCW_Foreign_Loans_desc:0 "We can try to take $1,500,000.00 in loans from foreign banks and governments to pay for industrial expansion. These loans would be due 10-years after the war ends, in the case of our victory. Of course, we will be expected to pay them back..."
 RUS_2RCW_Buy_Western_Guns:0 "Buy Western Guns"
 RUS_2RCW_Buy_Western_Guns_desc:0 "With our newfound capital, we should buy Western Military Equipment for our own use. Although we want our own arms industry, any way we can arm our soldiers is welcome."
 RUS_2RCW_Tractor_Factory:0 "A New Tractor Factory"
 RUS_2RCW_Tractor_Factory_desc:0 "To improve agricultural mechanizations, we will build another tractor factory. This will drive down the price of tractors, making them more affordable for the average peasant."
 RUS_2RCW_Aluminium:0 "Improve Tungsten Refinement"
 RUS_2RCW_Aluminium_desc:0 "Our output of tungsten should be increased, as while tungsten is not as high of a priority as oil, we should have it on hand to build artillery pieces out of."
 ##Military
 RUS_2RCW_Military_Start:0 "The New Army"
 RUS_2RCW_Military_Start_desc:0 "With the Red Army shaken by our revolt, it is time for the new Russian Armed Forces to arise. However, despite our plethora of senior officers, we are starting nearly from scratch in regards to organization."
 RUS_Western_Ranks:0 "De-Sovietized Army Ranks"
 RUS_2RCW_Western_Ranks:0 "Decommunize our Chain of Command"
 RUS_2RCW_Western_Ranks_desc:0 "Our chain of command still follows the Soviet Style. We should re-organize our army so that we are effective, like in the West."
 RUS_2RCW_Soviet_Ranks:0 "Keep Soviet Ranks"
 RUS_2RCW_Soviet_Ranks_desc:0 "We do not have the time to do a major re-organization of our Chain of Command. What we have will do for now."
 RUS_2RCW_Small_Arms:0 "Develop New Infantry Weapons"
 RUS_2RCW_Small_Arms_desc:0 "The USSR will likely try to advance their weaponry to gain an edge over us. We cannot let this happen, so we must advance our weaponry as well."
 RUS_2RCW_Land_Doctrine:0 "Doctrinal Development"
 RUS_2RCW_Land_Doctrine_desc:0 "We know the enemy's tactics, as we studied them firsthand. That means we have to out-doctrine the USSR as soon as possible."
 RUS_inexperienced_guerillas:0 "Inexperienced Guerillas"
 RUS_2RCW_Guerilla:0 "Study Guerilla Warfare"
 RUS_2RCW_Guerilla_desc:0 "Despite its flaws, the Red Army still far outnumbers our forces. General Vlasov spent time in China assisting the KMT, so this experience, combined with Soviet Intelligence reports, can allow us to adapt Guerilla tactics to our needs. However, the soldiers and officers are not experienced in this kind of hit-and-run style of combat, and will need time to adjust."
 RUS_guerillas:0 "Guerilla Warfare"
 RUS_guerillas_dig_in:0 "Guerilla Warfare"
 RUS_guerillas_resistance:0 "Guerilla Resistance"
 RUS_2RCW_Soviet_Tactics:0 "Use Soviet Strategies"
 RUS_2RCW_Soviet_Tactics_desc:0 "We do not have the time or researches to change tactics in mid-stream. We shall continue using the Red Army's tactics against them, and try and beat them at their own game."
 RUS_Western_Tactics:0 "Western Strategies"
 RUS_2RCW_Western_Tactics:0 "Use Western Strategies"
 RUS_2RCW_Western_Tactics_desc:0 "Despite the advancement of Deep Battle Tactics, the West has the best technology and commanders, and therefore has the best tactics. We should seek to emulate them."
 RUS_experienced_guerillas:0 "We have gotten used to Guerilla Tactics."
 RUS_2RCW_Dig_In:0 "Entrenchement"
 RUS_2RCW_Dig_In_desc:0 "A strong guerilla force must be able to entrench themselves into a position. It is not enough to be able to take land; we must defend it as well."
 RUS_2RCW_Resist:0 "Resist the Invader!"
 RUS_2RCW_Resist_desc:0 "Should our enemies invade our territory, we should be ready to leave behind trained partisan cells to resist their occupation."
 RUS_2RCW_Fighters:0 "Develop Fighter Designs"
 RUS_2RCW_Fighters_desc:0 "A key component of Combined Arms Operations is air superiority. If we cannot control the air above our enemies, we will have no ability to attack from above. Therefore, we should build light fighers capable of dispersing enemy forces."
 RUS_2RCW_Support:0 "Support Units"
 RUS_2RCW_Support_desc:0 "Our front line must be bolstered by support brigades. Engineers, Reconiteurs, and Signalers can supplement our frontline soldiers and greatly improve our performance."
 RUS_defensive_war:0 "Defensive Focus"
 RUS_2RCW_Defensive:0 "Focus on Defense"
 RUS_2RCW_Defensive_desc:0 "Our freedom means nothing if we cannot defend it. We should invest our resources into building fortifications and anti-air towers."
 RUS_2RCW_Fortifications:0 "The Don-Volga Line"
 RUS_2RCW_Fortifications_desc:0 "A series of basic fortifications along the Don and the Volga will help our soldiers guarantee our territorial integrity in the case that these lands are under threat."
 RUS_offensive_war:0 "Offensive Focus"
 RUS_2RCW_Offensive:0 "An Offensive Strategy"
 RUS_2RCW_Offensive_desc:0 "The best defense is a good offense, or so they say. We will focus on attacking the enemy, and bringing this war to a close."
 RUS_2RCW_Motorized:0 "Motorization Effort"
 RUS_2RCW_Motorized_desc:0 "Motorizing our army would give us better mobility on the battlefield itself and in the theater of war."
 RUS_2RCW_Armour:0 "Armour Development"
 RUS_2RCW_Armour_desc:0 "Although our resources are few, it would be worthwhile to invest in creating new tanks. These heavy iron beasts are able to pack a punch, and help defend our lines."
 ##Foreign
 RUS_2RCW_Foreign_Start:0 "Push for Recognition"
 RUS_2RCW_Foreign_Start_desc:0 "If we are to succeed we need to be officially recognized as the legitimate Russian Government. Of course, the West will likely have no qualms about recognizing an Anti-Communist State as a country."
 RUS_unrecognized:0 "Unrecognized State"
 RUS_partially_recognized:0 "Partially Recognized State"
 RUS_2RCW_English_Equipment:0 "English Equipment"
 RUS_2RCW_English_Equipment_desc:0 "We are in desperate need of equipment, and there is no better place to get arms than the United Kingdom. We will ask Britain for some spares, which will enable us to better fight the Bolsheviks.
 RUS_2RCW_German_Guns:0 "German Guns"
 RUS_2RCW_German_Guns_desc:0 "Germany's growing arms industry may sympathize with our plight. We should ask the German Government to supply us with weapons. Their friendship will not be forgotten."
 RUS_2RCW_Polish_Pact:0 "Polish Pact"
 RUS_2RCW_Polish_Pact_desc:0 "To calm fears about a resurgent Russian Empire, we will sign a non-aggression pact with Poland that recognizes their territorial integrity."
 RUS_2RCW_English_Industry:0 "Imperial Industry"
 RUS_2RCW_English_Industry_desc:0 "We should use our contacts in the United Kingdom to secure the purchase of heavy industrial equipment for our own usage. This equipment can be shipped into Russia as soon as possible."
 RUS_trade_modifier:0 "Improved Trade Relations"
 RUS_2RCW_Polish_Trade:0 "Favor Polish Merchants"
 RUS_2RCW_Polish_Trade_desc:0 "We will make Poland a favored trading nation, thus helping to enusre that we foster friendly relations between our two countries."
 RUS_2RCW_German_Factory:0 "German Arms Manufacturing"
 RUS_2RCW_German_factory_desc:0 "We should purchase German Military Manufacturing Equipment so that we can better arm our soldiers."
 RUS_20_opinion:0 "Mutual Cordiality"
 RUS_2RCW_France:0 "Meet with the French"
 RUS_2RCW_France_desc:0 "The old Empire and the French Republic were staunch allies. It is time for us to rekindle that relationship."
 RUS_2RCW_Italy:0 "Reach Out to the Italians"
 RUS_2RCW_Italy_desc:0 "Generally, Mussolini was considered to be a friend of the Bolsheviks, but now that there is an Anti-Communist option available, perhaps we can convince the Italians to change sides."
 RUS_2RCW_Befriend_Finland:0 "Befriend the Finns"
 RUS_2RCW_Befriend_Finland_desc:0 "Despite our differences in the past, the Future can be bright for a Russo-Finnish Friendship! We should send a delegation to meet with the Finns so they are assured of our good intentions."
 RUS_2RCW_Attack_Finland:0 "Attack Finland"
 RUS_2RCW_Attack_Finland_desc:0 "The Finns have had autonomy before, but they hold integral parts of Russia. We must attack them!"
 RUS_2RCW_An_Active_Nation:0 "Russia on the World Stage"
 RUS_2RCW_An_Active_Nation_desc:0 "Our recent diplomatic outings have proved one thing: That the new Russia both is and can be active on the World Stage!"
 #Other Military Revolts
 RUS_regional_administration:0 "Regional Administration"
 FER_Vlasovist_neutrality:0 "Far Eastern Military District"
 FER_Vlasovist_neutrality_DEF:0 "The Far Eastern Military District"
 MOS_Vlasovist_neutrality:0 "Volga Military District"
 MOS_Vlasovist_neutrality_DEF:0 "The Volga Military District"
