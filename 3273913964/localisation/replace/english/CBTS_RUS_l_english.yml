 #Names
 RFP_rod_name:0 "Konstantin\nRodzaevsky"
 RFP_von_name:0 "Anastasy\nVonsyatsky"
 RFP_cos_name:0 "Grigory Semyonov"
 #Decisons
 RFP_2RCW_decs:0 "Fascist Crusade against Bolshevism"
 RFP_2RCW_decs_desc:0 "After 20 years, the Soviet Union is finally falling to Counter-Revolution. The Provisional Council and its forces have risen up against the Cursed Reds, and we see no better option than to join them in their crusade. Young Blackshirts, Cossack Riders, and Veterans of the First Civil War have followed the Vozhak, Konstantin Rodzaevsky, over the Manchurian border to free Russia from the Stalinist Grasp."
 RFP_Core_Chita:0 "Establish Fascism in Chita"
 RFP_Core_Chita_desc:0 "We have managed to fight our way into Chita! The Trans-Siberian Railroad is now in our grasp, as we control its line to the Far East! We must establish Fascism in the province to consolidate our position in the Motherland."
 RFP_Core_Baikal:0 "Establish Fascism in Transbaikal"
 RFP_Core_Baikal_desc:0 "The Transbaikal region is now largely under our control. We should begin to establish fascism in these regions to provide a better base for an assault on Western Russia."
 RFP_Core_Primorsky:0 "Establish Fascism in Primorye"
 RFP_Core_Primorsky_desc:0 "We have managed to fight our way into the key city of Vladivostok. We must establish Fascism in Primorsky Krai so that we have full control over the area's industry and natural resources."
 RFP_Core_Amur:0 "Establish Fascism in the Amur Region"
 RFP_Core_Amur_desc:0 "The Rest of the Amur and Khabarovsk regions is now under our control. To take full advantage of all it has to offer, such as natural resources, we should establish political hegemony in the area."
 RFP_Blackshirt_Conscript:0 "§GA Blackshirt Militia will be raised in the state.§!\n"
 RFP_2Blackshirt_Conscript:0 "§GTwo Blackshirt Militias will be raised in the state.§!\n"
 RFP_2Blackshirt_Cav_Conscript:0 "§GTwo Blackshirt Militias and a Cavalry Division will be raised in the state.§!\n"
 RFP_Blackshirt_Cav_Conscript:0 "§GA Blackshirt Militia and a Cavalry Division will be raised in the state.§!\n"
 RFP_Conscript_Chita:0 "Raise Conscripts in Chita"
 RFP_Conscript_Chita_desc:0 "With Chita now under our control, we can surely find willing recruits to fight in our army."
 RFP_Conscript_Ulan_Ude:0 "Raise Conscripts in Buryatia"
 RFP_Conscript_Ulan_Ude_desc:0 "With Buryatia under occupation, we can find local Russians willing to fight for the Vozhak. Local Buryats might also join with the promise of equality."
 RFP_Conscript_Irkutsk:0 "Raise Conscripts in Irkutsk"
 RFP_Conscript_Irkutsk_desc:0 "As Irkutsk is now under Fascist control, we should be able to mobilize its people for our Holy Effort."
 RFP_Conscript_Bratsk:0 "Raise Conscripts in Bratsk"
 RFP_Conscript_Bratsk_desc:0 "Now that Bratsk is under our occupation, we can raise willing conscripts to fight against the Reds!"
 RFP_Conscript_Birobidzhan:0 "Raise Conscripts in Birobidzhan"
 RFP_Conscript_Birobidzhan_desc:0 "Birobidzhan is a key area to control due to the railway; without it, we cannot effectively cross from Primorye to Transbaikal, and vice versa. To help secure it, we should raise some Blackshirt divisions."
 RFP_Conscript_Khabarovsk:0 "Raise Conscripts in Khabarovsk"
 RFP_Conscript_Khabarovsk_desc:0 "Recruiting Blackshirts in Khabarovsk, which is now under Fascist Control, will greatly assist in seizing the vital state, which lies in between the Amur and Primorye regions."
 RFP_Conscript_Primorye:0 "Raise Conscripts in Primorye"
 RFP_Conscript_Primorye_desc:0 "The vital port city of Vladivostok is entirely under Fascist occupation. This is a golden opportunity to recruit soldiers to join our Holy Crusade."
 RFP_Declare_Legitimate_Gov:0 "Claim all Russia!"
 RFP_Declare_Legitimate_Gov_desc:0 "The Provisional Council's government is not capable of carrying out the Third Revolution. We are the only ones who can complete the Crusade, and thus our rivals must be destroyed."
 RFP_Annex_Revolts:0 "Take Over [From.GetAdjective] Political Duties"
 RFP_Annex_Revolts_desc:0 "The [From.GetAdjective] Vlasovist Revolt likely finds it difficult to manage both military and political affairs. We shall offer to take over [From.GetLeader]'s political duties, allowing him to focus on military command."
 #focuses
 RFP_zone_1:0 "Either §YChita§! or §YPrimorye§! are our Cores."
 RFP_zone_2:0 "Either the §YTransbaikal§! or the §YTransamur§! regions are our Cores."
 RFP_zone_3:0 "Both the §YTransbaikal§! and the §YTransamur§! regions are our Cores."
 RFP_2RCW_Politics_Start:0 "Introduce Ourselves"
 RFP_2RCW_Politics_Start_desc:0 "We should start by introducing the basics of Fascism to the people. They are only familiar with it through Soviet Propaganda and smuggled Fascist Literature, so it would be best if we introduced these foreign concepts to our citizens."
 RFP_2RCW_Ataman:0 "The Ataman"
 RFP_2RCW_Ataman_desc:0 "It would be smarter to base our propaganda, at least at first, on Ataman Semyonov. He is more known to the older citizens as the legitimate successor to Admiral Kolchak's government, and such a propaganda campaign would work to attract Conservatives to our cause."
 RFP_2RCW_Liberators:0 "The Liberators"
 RFP_2RCW_Liberators_desc:0 "The best propadanda campaign would focus both on Ataman Semyonov and the Vozhak. The Ataman can appeal to the Conservatives, and the Fascists can appeal to younger radicals hungering for change."
 RFP_2RCW_Vozhak:0 "The Vozhak"
 RFP_2RCW_Vozhak_desc:0 "All propaganda should put emphasis on the Vozhak and the Political Leadership. The military commanders are important, but they would be nothing without the Dynamism of the Fascists!"
 RFP_2RCW_Class_Collaboration:0 "Class Collaboration"
 RFP_2RCW_Class_Collaboration_desc:0 "Liberalism protects the supremacy of the Upper Classes, and Marxism imposes the supremacy of the Lower Classes, both of which are harmful to the Community. Only Fascist Socialism can ensure the integrity of the Nation by ensuring the harmony of all classes. We shall enable the workers to exersize their rights while at the same time ensuring that a heirarchy is established and protected."
 RFP_2RCW_Corporatism:0 "Establish Zemskiye Sobory"
 RFP_2RCW_Corporatism_desc:0 "Fascism advocates for a Corporate State, where all vocations are represented in Corporations, in a manner similar to Trade Unions in Syndicalism. We shall call our version of the Corporate Assembly a \"Zemsky Sobor\" (Assembly of the Land), which was a Russian form of the Estates General. We can use this symbol of Tsarism to give our \"Third Russia\" legitimacy."
 RFP_Corporatism:0 "Corporate Assemblies"
 RFP_Corporatism_desc:0 "Vocational Representation takes some duties away from the bureaucracy, leading to a more streamlined and stable government."
 RFP_2RCW_Open_Religious_Institutions:0 "Re-Open Religious Institutions"
 RFP_2RCW_Open_Religious_Institutions_desc:0 "Russian Fascism is a Holy Movement with God's Blessing. It would be a cardinal sin to keep the Churches closed."
 RFP_2RCW_Official_Secularism:0 "Official Secularism"
 RFP_2RCW_Official_Secularism_desc:0 "Although our Party is Christian in nature, imposing a single religion on all the peoples of Russia will get in the way of building a National Community."
 RFP_religious_tolerance:0 "Religious Tolerance"
 RFP_state_religion:0 "State Orthodoxy"
 RFP_2RCW_State_Religion:0 "State Orthodoxy"
 RFP_2RCW_State_Religion_desc:0 "We cannot allow Lower Religions to prevent us from establishing a National Community based on God and Nation. Therefore, The Russian Orthodox Church shall be the State Church of our administration."
 RFP_2RCW_No_Mercy:0 "No Mercy for Marxists"
 RFP_2RCW_No_Mercy_desc:0 "The Bolsheviks and their more moderate counterparts are internationalist, cosmopolitan elements that are entirely inconducive with the building of the People's Community. These elements should be dealt with by any means."
 RFP_2RCW_Silence_Liberals:0 "Silence the Liberals"
 RFP_2RCW_Silence_Liberals_desc:0 "Since the Civil War Started, the liberal dissidents began to come out of hiding, and their parties have been steadily growing. We cannot allow any threat to our administration or the National Community, so either by hook or by crook, the liberals must be silenced."
 RFP_2RCW_Jewish_Conscription:0 "Tolerate the Jews"
 RFP_2RCW_Jewish_Conscription_desc:0 "The so-called \"Jewish Question\" is one of the major points of debate between Vonsyatsky and Rodzaevsky. However, it is clear that Vonsyatsky's proposals are, if not ideologically correct, at the very least more pragmatic. As a group oppressed by the Bolshevik Fist, the Jews are a natural ally of the Fascists, and that the National Community should count them as friends."
 RFP_2RCW_Antisemitism:0 "Exclude Jews from Service"
 RFP_2RCW_Antisemitism_desc:0 "The so-called \"Jewish Question\" has dominated Rodzaevsky and Vonsyatsky's debates. Now that we control the Jewish Autonomous Oblast, what should be our Jewish Policy? Rodzaevsky's answer of Ideological Purity won out. His racist policy will prevent Jews from settling in large cities and serving in government or the military. While this will alienate the Jews, these policies will be appreciated by racists."
 RFP_Multiculturalism:0 "National Community"
 RFP_2RCW_National_Community:0 "\"Russia is a Nation of Peoples\""
 RFP_2RCW_National_Community_desc:0 "Another burning question is the issue of multiculturalism. Oddly, despite his virulent Antisemitism, Rodzaevsky recognizes that all the other Nationalities that inhabit Russia are an integral part of the Nation, and seeks to allow these Ethnicities to develop Fascism in accordance with their \"National Circumstances\"."
 #econ
 RFP_2RCW_Economics_Start:0 "A Far Eastern Economy"
 RFP_2RCW_Economics_Start_desc:0 "The Crusade cannot be won with an army alone. Although we have foreign assistance, that can only supplement the Home Front. Thus, we must develop an industrial base in the Far East."
 RFP_mixed_economy:0 "Mixed Economy"
 RFP_corporate_economy:0 "Corporate Economy"
 RFP_2RCW_Economics_Mixed_Economy:0 "Economic Guidance"
 RFP_2RCW_Economics_Mixed_Economy_desc:0 "Although private initiative will be allowed and encouraged, the State must keep control of major industries to ensure that the economy is guided in the right direction."
 RFP_2RCW_Economics_National_Unions:0 "Natsionalnye Soyuzy"
 RFP_2RCW_Economics_National_Unions_desc:0 "Instead of giving Trade Unions total freedom or making them into Party shams, we shall give unions a real use, to allow the workers to represent themselves with Government assistance! This allows us to better control the population while ensuring their needs are met."
 RFP_2RCW_Economics_State_Arbitration:0 "State Arbitration"
 RFP_2RCW_Economics_State_Arbitration_desc:0 "As promised, the Corporate State will allow workers to fight for their interests by appealing to a State Labour Mediator for assistance. These mediators will ensure that the workers', employers', and above all, the state's interests are met."
 RFP_2RCW_Economics_Decollectivization:0 "Begin Decollectivization"
 RFP_2RCW_Economics_Decollectivization_desc:0 "One of the more urgent points of reform, Decollectivization will ensure that all the peasants will have land of their own to work as they please."
 RFP_creative_labour:0 "Creative Labour"
 RFP_creative_labour_resources:0 "Creative Labour"
 RFP_2RCW_Economics_Creative_Labour:0 "Creative Labour"
 RFP_2RCW_Economics_Creative_Labour_desc:0 "Private enterprise is only good when it is producing something of value. Banking and Speculation, on the other hand, are not creative, so they must be banned."
 RFP_2RCW_Economics_Resources:0 "Increase Resource Extraction"
 RFP_2RCW_Economics_Resources_desc:0 "At present, the greatest amount of State Revenue will come from using mineral resources. We must expand these operations to survive!"
 RFP_2RCW_Economics_Civ_Factory:0 "Begin Industralization"
 RFP_2RCW_Economics_Civ_Factory_desc:0 "The Far East has very little industrial capacity. We need to build up our production capabilities if we are to establish Fascism in Russia."
 RFP_2RCW_Economics_Infrastructure:0 "Improve Supply Lines"
 RFP_2RCW_Economics_Infrastructure_desc:0 "The supply situation in the Far East is pitiful. To ensure that our soldiers have the supplies they need to fight, we must improve our distribution lines."
 RFP_2RCW_Economics_Arms_Factory:0 "Armament Production"
 RFP_2RCW_Economics_Arms_Factory_desc:0 "Our soldiers need guns! There is no other way for them to fight; and with our lack of weaponry, we must immediately coordinate to set up a production line."
 RFP_2RCW_Economics_Industry2:0 "Emphasize Industrial Equipment"
 RFP_2RCW_Economics_Industry2_desc:0 "If we cannot make Heavy Industrial Equipment, we will have nothing to build with. Therefore, our industrial might must be used to make us a base from which to work with." 
 RFP_2RCW_Economics_Arms_Factory3:0 "Expand Weapon Production"
 RFP_2RCW_Economics_Arms_Factory3_desc:0 "As we capture more and more territories, it becomes clear that we need more weapons with which to arm our soldiers. We must spend time building a new factory to build firearms."
 RFP_2RCW_Economics_Arms_Factory2:0 "Emphasize Military Production"
 RFP_2RCW_Economics_Arms_Factory2_desc:0 "Our survival depends on the aquisition of weapons. Therefore, all our industrial might must be put into military production."
 #military
 RFP_2RCW_Military_Start:0 "The New Russian Army"
 RFP_2RCW_Military_Start_desc:0 "As we fight the Red Menace, we must constantly improve our armed forces. If we do not surpass the Red Army's performance, we may as well have already lost."
 RFP_2RCW_Military_GBP:0 "Trust Traditional Strategies"
 RFP_2RCW_Military_GBP_desc:0 "Our strategies will be based off of older tactics, modernized for our needs. We will focus on having large and flexible plans that we must make to outmaneuver the Red Army."
 RFP_2RCW_Military_MA:0 "A Popular Army"
 RFP_2RCW_Military_MA_desc:0 "Older strategies assume that we have a trained professional army. While we do have trained professionals, it would be a more efficient use of our lack of resources to rely on the Blackshirts as our army's core unit."
 RFP_cav_emphasis:0 "Cavalry Emphasis"
 RFP_2RCW_Military_Cavalry:0 "Faith in the Ataman"
 RFP_2RCW_Military_Cavalry_desc:0 "We will let Ataman Semyonov make the Cossacks the core unit of our army. They are the best trained out of all our soldiers, so they would make a solid backbone."
 RFP_2RCW_Military_Chain_of_Command:0 "Chain of Command"
 RFP_2RCW_Military_Chain_of_Command_desc:0 "Strengthening the Pre-Crusade Chain of Command will help to instill Pre-modern values in the soldiers and officers."
 RFP_blackshirt_militia:0 "Blackshirt Emphasis"
 RFP_2RCW_Military_Blackshirts:0 "Faith in the Blackshirts"
 RFP_2RCW_Military_Blackshirts_desc:0 "The Blackshirts are mostly young men who seem to eschew a full training regimen for ideological fervor. As this group is easiest to recruit to, we should make Blackshirt propaganda a priority."
 RFP_political_army:0 "Politicized Army"
 RFP_2RCW_Military_Politicized_Army:0 "Politicize the Army"
 RFP_2RCW_Military_Politicized_Army_desc:0 "The Army is one of the key institutions which we must make a Fascist stronghold. Therefore, we will commisison Party Propagandists to regularly hold rallies at military camps."
 RFP_2RCW_Military_Small_Arms:0 "Study Japanese Rifles"
 RFP_2RCW_Military_Small_Arms_desc:0 "By studying Japanese Rifles, we can improve on our own designs. However, we must import new ones, instead of relying on the relics we brought with us."
 RFP_2RCW_Military_Artillery:0 "Modern Cannons"
 RFP_2RCW_Military_Artillery_desc:0 "We should study captured Artillery Pieces to improve on our own Artillery construction."
 RFP_2RCW_Military_Doctrine:0 "Improve Our Strategies"
 RFP_2RCW_Military_Doctrine_desc:0 "Now that we control a large swath of Far-Eastern Territory, we must improve our strategies to reflect that."