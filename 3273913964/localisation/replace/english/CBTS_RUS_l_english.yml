 FER_Japanese_fascism_ADJ:0 "East Siberian"
 FER_Japanese_party:0 "YaOU"
 FER_Japanese_party_long:0 "Yaponskoye Okkupatsionnoye Upravleniye"
 FER_Japanese_Occupation:0 "Japanese Occupation"
 ##focuses
 VLA_2RCW_Start:0 "A New Hope"
 VLA_2RCW_Start_desc:0 "We have chosen to follow the Provisional People's Council in its efforts to create a New Russia, where the old fantasies of Tsarism and Marxism will be laid to rest. In their place will come a Fair and Just Russia, a Great Russia, where military officers are not put to death on groundless suspicions."
 VLA_2RCW_Occupy_Political_Offices:0 "Occupy Political Offices"
 VLA_2RCW_Occupy_Political_Offices_desc:0 "Even though our territory is secured, we have to spend the next several days occupying offices of the Communist Party, lest they foment internal strife."
 VLA_2RCW_Try_Bolsheviks:0 "Try the Bolsheviks"
 VLA_2RCW_Try_Bolsheviks_desc:0 "Communists in our territory need to be tried and imprisoned for enemy sympathies. If we were to let these dangerous subversives run amok, they would be able to spy on or worse, sabotage, the War Effort."
 VLA_2RCW_Free_Camps:0 "Free the Camps"
 VLA_2RCW_Free_Camps_desc:0 "There are serveral Gulags in our territory, used to not only use criminals, but innocent people, as labour. Freeing all innocents from the camps would bring a large amount of popularity to our administration."
 RUS_recruits:0 "Energetic Volunteers"
 VLA_2RCW_Encourage_Volunteers:0 "Encourage Volunteers"
 VLA_2RCW_Encourage_Volunteers_desc:0 "Our territory has millions of people residing in it; many have already signed up to fight the Reds. However, a new round of recuritment propaganda would bring even more able young men to the battles ahead."
 RUS_dybenkoism:0 "Dybenkism"
 RUS_professionalism:0 "Professionalism"
 VLA_2RCW_Professionalism:0 "[This.GetDybenko]"
 VLA_2RCW_Professionalism_desc:0 "[This.GetDybenkoDesc]"
 RUS_Dybenko:0 "Dybenkism"
 RUS_Not_Dybenko:0 "Military Professionalism"
 RUS_Dybenko_Desc:0 "During the first Civil War, Pavel Dybenko established the Crimean Socialist Soviet Republic after invading Crimea a second time in 1919. Although the state was short-lived, his mark on the territory is well-remembered. Dybenkism, as it has been come to be known, was the result of Red Tyranny combined with Lawless Banditry, which disgusted even leading Bolsheviks."
 RUS_Not_Dybenko_Desc:0 "As per Tsaritsyn's initiative, we will enforce standards of military professionalism in our Army. Looting, stealing, and pogroms will be explicitly forbidden, and any soldier who takes part in these activities will be court-martialed and dishonorably discharged. We cannot afford to have such destruction taint our reputation."
 VLA_2RCW_Allow_Political_Refugees:0 "Allow Political Pluralities"
 VLA_2RCW_Allow_Political_Refugees_desc:0 "We should follow the Provisional Council's lead, and allow the fostering of political pluralities in our district. Members of other parties will be appointed to low-level government postings, and will be allowed to follow their ideologies openly."
 VLA_2RCW_KONR_Only:0 "The KONR Banner"
 VLA_2RCW_KONR_Only_desc:0 "Despite Tsaritsyn's tolerance of democratic elements, we do not share the same sympathies. Non-KONR organizations should not be repressed on the same level of the Communists, but we should not encourage their development."
 VLA_2RCW_Equality:0 "Equality for National Minorities"
 VLA_2RCW_Equality_desc:0 "If we are to win the support of our District's Citizens, then we must guarantee that all peoples, regardless of ethnicity or race, are equal under the law."
 VLA_2RCW_Not_Yet:0 "Decide Later"
 VLA_2RCW_Not_Yet_desc:0 "We cannot be distracted by social equality while we have a war to win! we will make some vague promises, but in reality, do nothing."
 VLA_speech_restrictions:0 "Restricted Expression"
 VLA_speech_free:0 "Managed Expression"
 VLA_2RCW_Restrictions:0 "Restrict Expression"
 VLA_2RCW_Restrictions_desc:0 "Some restrictions on freedoms of expression must be maintained in order to assure the security of the New Russia and the War Effort. However, we shall assure our citizens that this restriction is temporary, and will be lifted upon victory!"
 VLA_2RCW_Free_Speech:0 "Managed Expression"
 VLA_2RCW_Free_Speech_desc:0 "We cannot denounce the Bolshevik Oppression and censor our people at the same time, so we will allow most other forms of expression that does not interfere with the war effort, such as military secrets."
 VLA_2RCW_Legalize_Private_Enterprise:0 "Open the Private Sector"
 VLA_2RCW_Legalize_Private_Enterprise_desc:0 "While all current state-owned industries will remain in our hands, the people will be allowed to develop their own consumer goods and agriculture industries."
 VLA_2RCW_Decollectivize:0 "Begin Decollectivization"
 VLA_2RCW_Decollectivize_desc:0 "One of the major goals of KONR is the decollectivization of agriculture. We should begin this endevour immediately. We will apportion farmland to the peasants equitably, based on projected consumption and natural resources. From there, they can buy and sell land as they wish."
 VLA_2RCW_Infrastructure:0 "Infrastructure Development"
 VLA_2RCW_Infrastructure_desc:0 "We have chosen to revolt in areas with infamously low infrastrucure. A greater amount of military roads and railways are necessary to get supplies to our soldiers."
 VLA_2RCW_Infrastructure2:0 "Military Railways"
 VLA_2RCW_Infrastructure2_desc:0 "New military railways would let us better reinforce our soldiers, thus leading to an easier victory."
 VLA_2RCW_Industrial_Complex:0 "Develop Heavy Industry"
 VLA_2RCW_Industrial_Complex_desc:0 "The nation needs heavy industry if we are to build other key military installations. We should use what we already have to help in this endeavour."
 VLA_2RCW_Convert:0 "Convert Factories for Military Use"
 VLA_2RCW_Convert_desc:0 "A consumer industry is good, but we need a military industry first! We shall convert existing a consumer goods factory into a factory for military use."
 VLA_2RCW_Arms_Factory:0 "Increase Military Production"
 VLA_2RCW_Arms_Factory_desc:0 "We desperately need more military equipment to reinforce our soldiers and train new divisions. We must build new factories or expand the ones we have."
 VLA_2RCW_Resources:0 "Increase Resource Extraction"
 VLA_2RCW_Resources_desc:0 "Our military is the vehicle and natural resources are the fuel. To enable our army to survive, we need to expand mining and refining operations!"
 VLA_2RCW_Deep_Battle:0 "Deep Battle Tactics"
 VLA_2RCW_Deep_Battle_desc:0 "We do not have the time nor the resources to decide on a new strategic paradigm. We should continue with the Traditional Soviet Doctrine of Deep Battle, where combined arms operations are used to get far behind enemy lines, and encircle them."
 VLA_2RCW_Fighters:0 "[This.GetAdjective] Fighter Designs"
 VLA_2RCW_Fighters_desc:0 "To achieve a combined arms effect, we have to create our own fighter designs to help us achieve air superiority over the battlefield."
 VLA_2RCW_CAS:0 "Close Air Support"
 VLA_2RCW_CAS_desc:0 "The ability to bomb the enemy from above during a battle will prove key to our success."
 VLA_2RCW_Motorized:0 "Motorization"
 VLA_2RCW_Motorized_desc:0 "Motorized vehicles are not the best form of transport in backwoods Russia. The cold climate and lack of infrastructure prevents us from motorizing our army entirely, but we must try!"
 VLA_2RCW_Armor:0 "Armour Effort"
 VLA_2RCW_Armor_desc:0 "Like with other motor vehicles, the Cold Climate of Russia does not bode well for their engines. However, there is nothing that prevents us from trying to make it work!"
 VLA_2RCW_Grand_Battleplan:0 "More Traditional Strategies"
 VLA_2RCW_Grand_Battleplan_desc:0 "The West's strategy usually relies on a flexible and overarching battleplan, rather than a single tactic. We should look to emulate them."
 VLA_2RCW_Small_Arms:0 "Develop New Firearms"
 VLA_2RCW_Small_Arms_desc:0 "If we are to properly fight in the forests of Russia, we need our soldiers to be armed with only the best equipment!"
 VLA_2RCW_Support:0 "Support Equipment"
 VLA_2RCW_Support_desc:0 "A strong frontline division needs support companies to supplement it. Reconnaissance, Engineering, and even Hospital Companies would help our units be more effective in battle."
 VLA_2RCW_Chain_Of_Command:0 "Reorganize the Chain of Command"
 VLA_2RCW_Chain_Of_Command_desc:0 "A Western-Style chain of command would be more fitting for our tactics. We shall spend some time re-organizing our offices."
 VLA_defense:0 "Defensive Focus"
 VLA_2RCW_Defense:0 "Preserve What Little we Have"
 VLA_2RCW_Defense_desc:0 "On the whole, we have very little in terms of equipment, soldiers, and resources. We should focus on defending our territory, not overextending ourselves."
 VLA_2RCW_Artillery:0 "Artillery Development"
 VLA_2RCW_Artillery_desc:0 "Artillery will be useful to us, as it enables us to pepper the enemy forces from afar, softening them up before we attack!"
 VLA_2RCW_Doctrine:0 "Continue Doctrinal Development"
 VLA_2RCW_Doctrine_desc:0 "We have fought long and hard against the Oppressors. We should use these experiences to improve our own tactics."
 #Decisions
 VLA_see_factions:0 "Factionalism"
 VLA_see_factions_desc:0 "There are numerous political factions vying for influence in the New Russia. While they are not very active here, we are kept abreast on the goings-on in Russian's Territory.§Y\n\n[RUS.GetSocInf][RUS.GetDemInf]KONR Influence: [?RUS.RUS_vlasov_influence][RUS.GetMonInf][RUS.GetNatInf]§!"
