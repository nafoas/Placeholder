 BRA_bcb_2_desc:0 "We finally have a working Central Bank to curb the excesses of our Government and Financial Institutions."
 BRA_prosperous_agriculture_0:0 "Prosperous Agriculture"
 BRA_prosperous_agriculture_0_desc:0 "Our Agriculture has finally recovered from a long slump."
 BRA_prosperous_agriculture_1:0 "Importing Agricultural Workers"
 BRA_prosperous_agriculture_1_desc:0 "More immigration is needed if we want to make our agricultural sector truly competitive!"
 BRA_prosperous_agriculture_2:0 "Agricultural Schools"
 BRA_prosperous_agriculture_2_desc:0 "Investing in our human capital and rationalizing our manpower use will certainly increase our agricultural productivity to new levels."
 BRA_prosperous_agriculture_3:0 "Competitive Economy"
 BRA_prosperous_agriculture_3_desc:0 "While quickly industrializing, we must not abandon our immense agricultural wealth."
 BRA_american_investments:0 "American Investments"
 BRA_american_investments_desc:0 "Our amicable relationship with the US has paid off. We have been receiving enormous amounts of American investments!"
 BRA_federalist_constitution:0 "Federalist Constitution"
 BRA_federalist_constitution_desc:0 "The Constituent Assembly has finally drawn a Constitution. This Constitution is predominantly influenced by federalist and classical liberal ideas."
 BRA_revolutionary_constitution:0 "Revolutionary Constitution"
 BRA_revolutionary_constitution_desc:0 "The Constituent Assembly has finally drawn a Constitution. This Constitution is predominantly influenced by centralist and corporatist ideas."
 BRA_compromise_constitution:0 "Compromise Constitution"
 BRA_compromise_constitution_desc:0 "The Constituent Assembly has finally drawn a Constitution. This Constitution is a compromise between liberal and corporatist political groups."
