 #ideas
 BRA_aftermath_1932:0 "Aftermath of the 1932 Revolution"
 BRA_aftermath_1932_desc:0 "The Civil War of 1932 has left many marks in the Brazilian nation, both economic and social. Economically, the war has damaged one of Brazil's most developed regions, the state of São Paulo, with many of its cities having been bombed during the conflict. Socially, the War has highlighted tensions between the states of the Federation, as well as between the states and the Federal Government, with Paulista regionalist sentiment and antagonism towards the Presidency never being so marked as they are today."
 BRA_oligarchs:0 "Regional Oligarchies"
 BRA_oligarchs_desc:0 "Outside the largest urban centers, there lies the vast Brazilian countryside, whose inhabitants have usually little to do with the Federal Government, being subject to other - more local - forms of governance instead. The \"Coronéis\", local oligarchs and strongmen, who have virtually complete control over their rural constituencies, use their economic and social power to advance their political agendas on a national level, using clientelism to dominate their voter bases and avoid any social changes that should harm their personal wealth and power. Besides inhibiting true democratic representativeness, these oligarchs block any potential encroachments by the central government, as some have gathered sizeable militia forces."
 BRA_oligarchs_1:0 "Regional Oligarchies"
 BRA_oligarchs_1_desc:0 "Outside the largest urban centers, there lies the vast Brazilian countryside, whose inhabitants have usually little to do with the Federal Government, being subject to other - more local - forms of governance instead. The \"Coronéis\", local oligarchs and strongmen, who have virtually complete control over their rural constituencies, use their economic and social power to advance their political agendas on a national level, using clientelism to dominate their voter bases and avoid any social changes that should harm their personal wealth and power. While they remain inhibiting true democratic representativeness, measures were already taken to limit the size and strength of state militias, greatly limiting their military power."
 BRA_oligarchs_2:0 "Loyal Interventores"
 BRA_oligarchs_2_desc:0 "The old \"Coronéis\" are gone, along with their clientelistic practices, but that doesn't mean that the Federal Government doesn't have to delegate power to local authorities. The old states are now dominated by loyal \"Interventores\", named by the President especially to fulfill their administrative duties."
 BRA_aftermath_1932_1:0 "Aftermath of the 1932 Revolution"
 BRA_aftermath_1932_1_desc:0 "The Civil War of 1932 has left many marks in the Brazilian nation, both economic and social. Economically, the war has damaged one of Brazil's most developed regions, the state of São Paulo, with many of its cities having been bombed during the conflict. Socially and politically, on the other hand, we have finally managed to mend the harsh divide between Paulista elites and the central government."
 BRA_aftermath_1932_2:0 "Aftermath of the 1932 Revolution"
 BRA_aftermath_1932_2_desc:0 "The Civil War of 1932 has left many marks in the Brazilian nation, both economic and social. Economically, the war has damaged one of Brazil's most developed regions, the state of São Paulo, with many of its cities having been bombed during the conflict. Socially and politically, on the other hand, we have finally managed to mend the harsh divide between Paulista elites and the central government."
 BRA_rev_goverment:0 "Unconstitutional Government"
 BRA_rev_goverment_desc:0 "Since the October Revolution of 1930 and the annulment of the Constitution of 1891, Brazil has been living without a formal Constitutional document. While this gives the President immense discretionary power to govern as he sees fit, it is already clear - as 1932 has shown us - that this situation cannot stand for long."
 BRA_weakened_agricultural_sector_0:0 "Weakened Agricultural Sector"
 BRA_weakened_agricultural_sector_0_desc:0 "The international prices for our agricultural exports have not recovered since 1929. Coffee, Cotton and Cocoa planters, who produced goods that used to be the lifeblood of our economy, are now burried in debt."
 BRA_high_external_debt_0:0 "Very High External Debt"
 BRA_high_external_debt_0_desc:0 "The collapse of international trade following the crash of 29 has not left us unscarred. The disruption of foreign investments and drastic reduction in our exports made us extremely indebted."
 BRA_weakened_agricultural_sector_1:0 "Weakened Agricultural Sector"
 BRA_weakened_agricultural_sector_1_desc:0 "The international prices for our agricultural exports have not recovered since 1929. Coffee, Cotton and Cocoa planters, who produced goods that used to be the lifeblood of our economy, are now burried in debt."
 BRA_weakened_agricultural_sector_2:0 "Recovering Agricultural Sector"
 BRA_weakened_agricultural_sector_2_desc:0 "The international prices for our agricultural exports are steadily recovering, but still below 1928' levels."
 BRA_weakened_agricultural_sector_3:0 "Recovering Agricultural Sector"
 BRA_weakened_agricultural_sector_3_desc:0 "The international prices for our agricultural exports are steadily recovering, but still below 1928' levels."
 BRA_high_external_debt_1:0 "Very High External Debt"
 BRA_high_external_debt_1_desc:0 "The collapse of international trade following the crash of 29 has not left us unscarred. The disruption of foreign investments and drastic reduction in our exports made us extremely indebted."
 BRA_high_external_debt_2:0 "High External Debt"
 BRA_high_external_debt_2_desc:0 "The collapse of international trade following the crash of 29 has not left us unscarred. The disruption of foreign investments and drastic reduction in our exports made us extremely indebted."
 BRA_high_external_debt_3:0 "High External Debt"
 BRA_high_external_debt_3_desc:0 "The collapse of international trade following the crash of 29 has not left us unscarred. Although disruption of foreign investments and drastic reduction in our exports made us extremely indebted, recent increases in coffe prices are making our situation more comfortable."
 BRA_high_external_debt_4:0 "Manageable External Debt"
 BRA_high_external_debt_4_desc:0 "The collapse of international trade following the crash of 29 has not left us unscarred. Although disruption of foreign investments and drastic reduction in our exports made us extremely indebted, our current situation is not nearly as bad as is used to be."
 BRA_high_external_debt_lol1:0 "Enormous External Debt"
 BRA_high_external_debt_lol1_desc:0 "The collapse of international trade following the crash of 29' and the recession of 37' have not left us unscarred. The disruption of foreign investments and drastic reduction in our exports made us extremely indebted."
 BRA_high_external_debt_lol2:0 "Enormous External Debt"
 BRA_high_external_debt_lol2_desc:0 "The collapse of international trade following the crash of 29' and the recession of 37' have not left us unscarred. The disruption of foreign investments and drastic reduction in our exports made us extremely indebted."
 BRA_sustaining_coffee_prices_0:0 "Sustaining Coffee Prices"
 BRA_sustaining_coffee_prices_0_desc:0 "To alleviate our current lack of hard money as well as to relieve struggling farmers, the Federal Government has decided to buy huge piles of surplus coffee and burn what is not sellable, thus keeping artificially high prices."
 BRA_sustaining_coffee_prices_1:0 "Sustaining Coffee Prices"
 BRA_sustaining_coffee_prices_1_desc:0 "While we are still buying and burning surplus coffee, we no longer have the means nor the interest to keep these operations as high as they were."
 BRA_economic_planning_0:0 "Economic Planning"
 BRA_economic_planning_0_desc:0 "In accordance to international developments, we should use the state apparatus to make our economy more rationalized."
 BRA_economic_planning_1:0 "Economic Planning"
 BRA_economic_planning_1_desc:0 "In accordance to international developments, we should use the state apparatus to make our economy more rationalized."
 BRA_economic_planning_2:0 "Economic Mobilization"
 BRA_economic_planning_2_desc:0 "To survive in this world of war and chaos, we should put our previously built planning apparatus to make sure our economy serves the interests of national defense."
