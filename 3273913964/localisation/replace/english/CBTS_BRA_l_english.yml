 #Flavor Events
 bra.flavour.1.t: "Anniversary of the Republic"
 bra.flavour.1.desc: "Today marks the anniversary of the Republic of the United States of Brazil, after the ousting of the Brazilian Emperor, Pedro II. The regime that 1889 inaugurated had its faults, however, as clientelism, patrimonialism, electoral fraud and the dictatorship of the Executive plagued the First Brazilian Republic for its 40 years of duration. Although the Revolution of 1930 created a New Republic, we need to always remain vigilant on whether we are remaining faithful to the ideals of October 3, for the road ahead is full of temptations. May we build a better Republic..."
 bra.flavour.1.a: "Liberdade! Liberdade! Abre as asas sobre nós!"
 bra.flavour.2.t: "Integralist March in São Paulo"
 bra.flavour.2.desc: "Today, in São Paulo, happened the first big procession of the Brazilian Integralist Action. The organization, led by Brazilian poet and journalist Plínio Salgado, was created just last year and follows the model of Italian fascism, an influence which became even clearer with their aesthetic emulation of Mussolini's March on Rome. Chanting \"Anauê\" and wearing green uniforms, the Integralist ranks called for the end of liberal democracy and the adoption of a corporatist form of government. The movement is already quite well-organized and is beginning to gather the support of the middle and upper classes, giving us reason to worry about its future."
 bra.flavour.2.a: "Anauê!?"
 bra.flavour.3.t: "The University of São Paulo"
 bra.flavour.3.desc: "Other than a few Law Schools, Brazil terribly lacks higher education institutions, even when compared to other Latin American countries. Social and natural sciences are completely unknown to our ruling elites, whose only education lies in the limited world of the \"Bacharéis\". \n\nWith that in mind, the newly appointed Paulista Interventor, Armando de Salles Oliveira, implementing the project of his intellectual cicle, which the important journalist Júlio de Mesquita Filho is part of, has founded the University of São Paulo. Established with agglutination of a few preceding disconnected schools, such as the São Paulo Polytechnic School and the São Paulo Law School, a new school - the School of Philosophy, Sciences and Letters - was also created to join the greater University. Already counting with a few renowned international professors, such as Claude Lévi-Strauss, Fernand Braudel and Roger Bastide, Armando de Salles aims at creating a new elite that shall govern the future generations. São Paulo will reconquer Brazil again, but this time, it won't be by the force of arms, but by the capacity of its intellectuals and technicians."
 bra.flavour.3.a: "Scientia vinces!"
 bra.flavour.4.t: "Battle of Praça da Sé"
 bra.flavour.4.desc: "We have been experiencing a growing wave of political radicalization, which can already be felt in all major Brazilian cities. Just today, a conflict between Integralists and Antifascist groups has happened in the Sé Square, in downtown São Paulo, leaving 7 dead and 30 injured. \n\nDuring an Integralist rally, which was meant to commemorate the 2 years anniversary of the Integralist Manifesto, leftist groups decided to interrupt the meeting. In the end, the police ended up getting involved, and it is alleged that some were even in possession of machine guns during the struggle. \n\nThis type of incident is becoming more common every day, giving us a glimpse of what the future might look like..."
 bra.flavour.4.a: "The storm is coming..."
 bra.flavour.5.t: "Casa Grande e Senzala Published"
 bra.flavour.5.desc: "The Brazilian intellectual effervescence of the recent year has produced yet another gem. Gilberto Freyre, a Brazilian sociologist currently residing in Portugal, has published \"Casa Grande & Senzala\", a book which demystifies and rebukes the claim that Brazilian miscigenation makes its society inferior. Studying the influence of slavery in the Brazilian society, Freyre has argued that Brazilians and the Portuguese, who colonized the country, are and were particularly welcoming towards the assimilation of Africans and other ethnicities to the society, at least when compared to other European groups. Th Brazilian society, which evolved through the centuries, is marked by its relative acceptance of different ethnic groups. \n\nAlso countering the scholars who believe that Brazilian miscigenation is the source of the country's poverty, Freyre writes that cultural and environmental factors are much more effective at explaining this problem. On the contrary, he argues, Brazilian ethnic diversity is a source of national strength!"
 bra.flavour.5.a: "Interesting!" 
 bra.flavour.6.t:0 "A tale from the Frontier"
 bra.flavour.6.desc:0 "The clock showed 8:30 PM when the usually placid margins of the Uruguay River were struck by a rather strange event. Ten men were crossing from the Brazilian frontier town of São Borja to the Argentine frontier town of Santo Tomé, with the alleged intention of going to a cinema in the latter. The men, some of them wearing military attire, would be received by the Argentine maritime guard to be escorted into Santo Tomé. It was already late, and ordinary men were not allowed to do such a crossing at this time of the night - but these were not ordinary men. \n\nThree gentlemen - clearly inebriate - disembarked from the boat to meet a Corporal from the Argentine guard, the two first wearing grey suits and the third one wearing a khaki military uniform, but with a peculiarity: below one of his arms, he carried a cloak, trying to conceal an object that looked suspiciously similar to a rifle... As soon as the Corporal noticed the cloak, he inquired the military man on the nature of the object he was trying to hide. After the man refused to answer, the guard ordered the man to reveal what he was carrying, or else the group would not be allowed to set foot in Argentina - the discussion soon became heated. The man in khaki attire, it was revealed, was Benjamim Vargas, the brother of the Brazilian President himself, and his two companions were Odon and Ary, nephews of the President! \n\nA few steps below, was another Argentine marine carrying a lantern, who then noticed something strange... He shouted: \"Careful, Corporal! He has a gun!\". The situation didn't get much better after this. Odon, Vargas's nephew, jumped in front of the Corporal and pointed a revolver towards his head. The Argentine man, disoriented, tried to escape from the hands of Odon and fell on his back - exactly at the same time that the President's nephew pulled his trigger. Assuming that the Corporal was dead, as it was already dark, Benjamim Vargas removed a submachinegun from his cloak and began to aim at the second Argentine guard, who was behind the Corporal - but not before the man had turned off his lantern and could not be seen anymore. The guard ran to call on for reinforcements, while the Argentine Corporal, unharmed, stood lying on the ground watching the whole scene. The backup soon arrived, firing a volley of shots against the Brazilian boat. The bullets hit the two of Vargas' nephews, Odon and Ary, who died on the spot, as well as the boat's pilot and the boat's fuel tank, causing a huge explosion. Having lost their means of transportation, Benjamim and the other survivors jumped into the water - having to swim until they reached São Borja! \n\nApart from harming Brazil's relations with Argentina, the loss of two of his nephews in the incident was not good news to the Brazilian President, Getúlio Vargas. The Frontier has never been kind to adventurers, and never will be, no matter who they are or what they are doing, which was definetely not \"going to the cinema\" as they stated..."
 bra.flavour.6.a:0 "A sad night..."
 bra.flavour.7.t:0 "The Catholic Electoral League"
 bra.flavour.7.desc:0 "Since the outset of the 1930 Revolution, it has become clear that the Catholic Church, often relegated to a secondary role in the strictly laicist Old Republic, has been trying to expand its political influence. One of the most remarkable examples of this tendency was the creation of the Catholic Electoral League, one supra-partisan organization aiming at organizing and supporting christian politicians, recommending their preferred candidates to the electorate. With the prominent catholic intellectual Alceu Amoroso de Lima as its General Secretary, the LEC intends to leave its mark on the Constituent Elections, which are going to happen soon."
 bra.flavour.7.a:0 "Interesting"
 bra.flavour.8.t:0 "Lampião is gunned down!"
 bra.flavour.8.desc:0 "It happened! The bandit and brigand \"Lampião\" was finally found and gunned down by a police force in the state of Sergipe, after years of criminal activity. Just before sunrise, a \"Volante\", lead by Lieutenant João Bezerra, orchestrated a surprise attack on Lampião's hideout, killing Lampião, his partner, Maria Bonita, and 9 more \"cangaceiros\". Afterwards, their heads were chopped off and went on a tour through the Brazilian Northeast, to show that the man who once terrorized the region is now dead."
 bra.flavour.8.a:0 "Good"
 bra.flavour.9.t:0 "The National Union of Students"
 bra.flavour.9.desc:0 "Today was created the National Union of Students (UNE), an organization aiming at centralizing and strengthening the multiple scattered students' unions that exist today. The UNE will serve as the main voice of the students in Brazil, an evergrowing class that currently lacks political representation."
 bra.flavour.9.a:0 "Interesting"
 bra.flavour.10.t:0 "The Census of 1940"
 bra.flavour.10.desc:0 "The creation, in 1938, of the Brazilian Institute of Geography and Statistics (IBGE) is beginning to fructify. We managed to conduct a new national census, the most advanced and detailed until present day! Apart from showing that Brazil has already more than 40 million living souls, we have also gained valuable data on Brazil's socieconomic condition, which might be extremely useful as part of our government's project of rationalizing the Brazilian economy."
 bra.flavour.10.a:0 "Ordem e Progresso!"
 bra.flavour.11.t:0 "Brasilien: Ein Land der Zukunft"
 bra.flavour.11.desc:0 "Austrian author Stephan Zweig, currently living in Brazil, has just published the new book \"Brazil, country of the future\", which already became a bestseller. After travelling the Brazilian heartland, Zweig has become impressed with our country's nature and people, telling to the whole world our great potential as a nation. Let's hope others find this out!"
 bra.flavour.11.a:0 "Ordem e Progresso!"
 bra.flavour.12.t:0 "The Founding of Goiânia"
 bra.flavour.12.desc:0 "Administrative modernization was one of the main - and accomplished - objectives of the Revolution of 1930. Aiming at reorienting his state's political power away from the traditional oligarchies, the Interventor of the state of Goyaz, Pedro Ludovico, began to prepare for the relocation of Goyaz's capital in 1932. Now, the new capital, \"Goiânia\", is finally completed, after years of construction. Unlike other Brazilian capitals, perhaps with the sole exception of Belo Horizonte, Goiânia was thoroughly planned and based on modernist principles, with large parks and geometric avenues. A great accomplishment to the whole nation, Goiânia simbolizes the virtues of the New Republic: progress, modernity, rationalism and the occupation of the Brazilian interior!"
 bra.flavour.12.a:0 "Our Destiny is to Colonize!"
 
 #Econ/Diplo/Mil Events
 bra.1.t:0 "Import Substitution Industrialization"
 bra.1.desc:0 "Since the 1928 agricultural crisis and especially after the 1929 Crash, Brazil has been struggling with the lack of foreign exchange reserves, which has reduced our ability to import. Interestingly, the increased domestic demand for finished goods that resulted from the crisis has spurred immense growth in manufacturing, which might soon surpass agriculture as the biggest share of domestic output. Unexpectedly and without openly protectionist intentions, Brazil is beginning to substitute its imports for domestic production."
 bra.1.a:0 "Onwards!"
 bra.1937recession.t:0 "The 1937 Recession"
 bra.1937recession.desc:0 "With a new recession ravaging the US, our already precarious external financial position has managed to become even worse. The prospects of a debt moratorium have returned to Brazil, and it might be the best solution for the moment. Our administration is divided: should we really enact the moratorium or should we try to renegotiate our external debt once again, like we did in 1934? The military definitely favors the first solution, as it would liberate some hard currency to be spent in importing guns and aircraft..."
 bra.1937recession.a:0 "Not again!"
 bra.3.t:0 "The CNPIC is founded"
 bra.3.desc:0 ""
 bra.3.a:0 "Another technical council!?"
 bra.4.t:0 "The CPE is founded"
 bra.4.desc:0 ""
 bra.4.a:0 "Perhaps it will lighten some productive debates!"
 bra.5.t:0 "Roberto Simonsen debates Eugênio Gudin"
 bra.5.desc:0 ""
 bra.5.a:0 "Interesting"
 bra.6.t:0 "Building the CSN"
 bra.6.desc:0 "It seems that the construction of our dreamed steel plant has begun. It will take several years, but will revolutionize the country when it's completed!"
 bra.6.a:0 "Progress!"
 bra.7.t:0 "The construction of the CSN is delayed!"
 bra.7.desc:0 "The War is quickly spreading across the globe, and it has already affected us, even if indirectly. Since we are not self-sufficient, we have to import most of the materials that are used in the building of the CSN, and these are being requested by their home governments to be used in the war effort. Sadly, our shipments of cement and steel have been delayed, overall delaying the construction of the CSN itself."
 bra.7.a:0 "Damn!"
 bra.8.t:0 "The inauguration of the CSN"
 bra.8.desc:0 "After decades of empty promises, we have finally achieved our dream, a huge steel plant operating in Brazilian soil!"
 bra.8.a:0 "Finally!"
 bra.12.t:0 "Industrialists protest new trade agreement!"
 bra.12.desc:0 "Our proposed MFN trade agreement with the US has come under heavy fire from the Brazilian industrial circles, so that it is being really hard to ratify the treaty in the National Assembly. Roberto Simonsen and members of the industrialists' unions have criticized it as being excessively harmful to Brazilian manufactories, as it makes it easy for certain American finished goods to be imported. Naturally, the agreement brings us certain benefits, such as the total elimination of American tariffs to Brazilian coffee, but the industrialists believe that these are outweighted by the maluses."
 bra.12.a:0 "As expected"
 bra.13.t:0 "The Americans protest"
 bra.13.desc:0 "Since Roosevelt's inauguration in 1933, the American policy regarding international trade has been that of strongly promoting multilateral solutions over bilateral ones. Our recent move to approve a clearing agreement with Germany clearly goes in the oppostie direction, as it stimulates a kind of trade that does not rely on hard currency. We might manage, however, convince the Americans that we had no other choice, since we have no hard currency to spend on imports."
 bra.13.a:0 "But we had no choice..."
 bra.14.t:0 "The Inter-American Coffee Agreement"
 bra.14.desc:0 ""
 bra.14.a:0 "Interesting"
 bra.15.t:0 "The Inter-American Coffee Agreement"
 bra.15.desc:0 ""
 bra.15.a:0 "Interesting"
 bra.16.t:0 "The Inter-American Coffee Agreement"
 bra.16.desc:0 ""
 bra.16.a:0 "Interesting"
 bra.17.t:0 "The Inter-American Coffee Agreement is signed!"
 bra.17.desc:0 ""
 bra.17.a:0 "Good"
 bra.18.t:0 "Propose the Anti-Argentine Pact"
 bra.18.desc:0 ""
 bra.18.a:0 "It's time to put shackles on this jingoist beast!"
 bra.19.t:0 "Brazil proposes the Anti-Argentine Pact"
 bra.19.desc:0 ""
 bra.19.a:0 "Sure"
 bra.20.t:0 "Brazil proposes the Anti-Argentine Pact"
 bra.20.desc:0 ""
 bra.20.a:0 "Sure"
 bra.21.t:0 "Brazil proposes the Anti-Argentine Pact"
 bra.21.desc:0 ""
 bra.21.a:0 "Sure"
 bra.22.t:0 "Bolivia accepted!"
 bra.22.desc:0 ""
 bra.22.a:0 "Great!"
 bra.23.t:0 "Bolivia disagreed!"
 bra.23.desc:0 ""
 bra.23.a:0 ""
 bra.24.t:0 "Chile Accepted!"
 bra.24.desc:0 ""
 bra.24.a:0 "Great!"
 bra.25.t:0 "Chile Disagreed!"
 bra.25.desc:0 ""
 bra.25.a:0 ""
 bra.26.t:0 "Peru Accepted!"
 bra.26.desc:0 ""
 bra.26.a:0 "Great!"
 bra.27.t:0 "Peru Disagreed!"
 bra.27.desc:0 ""
 bra.27.a:0 ""
 bra.28.t:0 "Oil found in Alagoas"
 bra.28.desc:0 ""
 bra.28.a:0 "So he was right all along..."
 bra.29.t:0 "The Aranha Mission"
 bra.29.desc:0 ""
 bra.29.a:0 "Good"
 bra.30.t:0 "Reaching out to Krupp"
 bra.30.desc:0 "The German government has promised to fund the building of a steel plant in Brazilian territory by Krupp AG. While it is likely that it was an empty promise, made to bring Brazil closer to the German sphere, asking them won't hurt us, right?"
 bra.30.a:0 "Let's see"
 bra.31.t:0 "Krupp agreed to designing a project"
 bra.31.desc:0 "It seems that the German government is willying to fund a Krupp project in Brazil, but only after the war their country is currently embroiled in. While this is good news, it is likely that it will take several years before the construction even begins."
 bra.31.a:0 "Great!"
 bra.32.t:0 "Krupp begins begins the construction"
 bra.32.desc:0 "Finally, after all those years, the Germans are ready to finance a steel plant in Brazil. Let's hope it is built fast..."
 bra.32.a:0 "That took long!"
 bra.33.t:0 "CSN - Finding an American company"
 bra.33.desc:0 "We have opted for finding an American private company to build the CSN, instead of building a plant completely owned by the state and financed by American credits. Before construction, however, we must find an American company that is willying to be our parners in the venture."
 bra.33.a:0 "Let's see if we can find one"
 bra.34.t:0 "US Steel agrees to building the CSN"
 bra.34.desc:0 "US Steel has agreed to building our requested steel plant, and they are already preparing a draft for the project. While not as profitable to us as a government-owned initiative, the American government is certainly more willying to finance the US Steel than the Brazilian government!"
 bra.34.a:0 "Excellent!"
 bra.35.t:0 "Brazil asks for an American military Mission"
 bra.35.desc:0 "Brazil is requesting an American Army-Airforce Mission to prepare their Armed Forces to the storm of war. Should we accept their proposal?"
 bra.35.a:0 "Sure!"
 bra.35.b:0 "We have no resources to spare"
 bra.36.t:0 "The Americans accept!"
 bra.36.desc:0 "The generous Americans have accepted to start an Army-Airforce Mission in Brazil!"
 bra.36.a:0 "Great!"
 bra.37.t:0 "The Americans deny!"
 bra.37.desc:0 "The Americans have denied our request for a military mission. Let's hope others have brighter minds than these selfish Yankees!"
 bra.37.a:0 "Sad"
 bra.38.t:0 "Brazil asks for the renewal of our military mission"
 bra.38.desc:0 "Brazil is requesting the renewal of the Franco-Brazilian Military Mission to further prepare their Armed Forces to the storm of war. Should we accept their proposal?"
 bra.38.a:0 "Of course!"
 bra.38.b:0 "We have no resources to spare"
 bra.39.t:0 "The French accept!"
 bra.39.desc:0 "The generous French have accepted to further extend the Franco-Brazilian Military Mission!"
 bra.39.a:0 "Great!"
 bra.40.t:0 "The French deny!"
 bra.40.desc:0 "The French have denied our request for a military mission. Let's hope others have brighter minds than these selfish Frenchmen!"
 bra.40.a:0 "Sad"
 bra.41.t:0 "Brazil asks for a German military mission"
 bra.41.desc:0 "Brazil is requesting a German Military Mission to prepare their Armed Forces to the storm of war. Should we accept their proposal?"
 bra.41.a:0 "Sure!"
 bra.41.b:0 "We have no resources to spare"
 bra.42.t:0 "The Germans accept!"
 bra.42.desc:0 "The generous Germans have accepted to start a Military Mission in Brazil!"
 bra.42.a:0 "Great!"
 bra.43.t:0 "The Germans deny!"
 bra.43.desc:0 "The Germans have denied our request for a military mission. Let's hope others have brighter minds than these selfish Krauts!"
 bra.43.a:0 "Sad"
 bra.44.t:0 "Brazil requests a MFN trade agreement with us"
 bra.44.desc:0 "Brazil is requesting a trade agreement with us with a \"Most Favored Nation\" clause. Shall we accept?"
 bra.44.a:0 "This will benefit us both!"
 bra.44.b:0 "Our economy needs more protection, not less!"
 bra.45.t:0 "Trade agreement signed!"
 bra.45.desc:0 "Greece has agreed to the MFN trade agreement that we had proposed them earlier."
 bra.45.a:0 "Good"
 bra.46.t:0 "Greece denied!"
 bra.46.desc:0 "Greece has not agreed to the MFN trade agreement that we had proposed them earlier."
 bra.46.a:0 "Sad"
 bra.47.t:0 "Brazil requests a MFN trade agreement with us"
 bra.47.desc:0 "Brazil is requesting a trade agreement with us with a \"Most Favored Nation\" clause. Shall we accept?"
 bra.47.a:0 "This will benefit us both!"
 bra.47.b:0 "Our economy needs more protection, not less!"
 bra.48.t:0 "Trade agreement signed!"
 bra.48.desc:0 "Portugal has agreed to the MFN trade agreement that we had proposed them earlier."
 bra.48.a:0 "Good"
 bra.49.t:0 "Portugal denied!"
 bra.49.desc:0 "Portugal has not agreed to the MFN trade agreement that we had proposed them earlier."
 bra.49.a:0 "Sad"
 bra.50.t:0 "Brazil requests a MFN trade agreement with us"
 bra.50.desc:0 "Brazil is requesting a trade agreement with us with a \"Most Favored Nation\" clause. Shall we accept?"
 bra.50.a:0 "This will benefit us both!"
 bra.50.b:0 "Our economy needs more protection, not less!"
 bra.51.t:0 "Trade agreement signed!"
 bra.51.desc:0 "Turkey has agreed to the MFN trade agreement that we had proposed them earlier."
 bra.51.a:0 "Good"
 bra.52.t:0 "Turkey denied!"
 bra.52.desc:0 "Turkey has not agreed to the MFN trade agreement that we had proposed them earlier"
 bra.52.a:0 "Sad"
 bra.53.t:0 "Maneuvers near Agulhas Negras"
 bra.53.desc:0 "In an unprecedented feat in the history of the Brazilian Army, we have conducted a full-scale exercise involving the whole Brazilian Cadet Corps. The maneuvers happened near the Agulhas Negras summit, a place that has been envisioned by José Pessoa, the current commander of the Realengo Military Academy, as the future location of a new Military Academy, far from the agitation of Rio de Janeiro. Pessoa had, as it seems, even prepared a ceremony to launch the foundation stone of his dreamed new military academy, the \"Agulhas Negras Military Academy\", after the cadet maneuvers were completed. After hearing that the ceremony could not proceed, as the government has no funds to build this expensive academy, it is said that several tears dropped from the face of this veteran soldier."
 bra.53.a:0 "Interesting"
 bra.54.t:0 "Brazil requests a Destroyer lease"
 bra.54.desc:0 "The Brazilian Foreign Ministry is requesting us the lease of 6 of our decommissioned destroyers. It might not cost much to us, but the arrival of 6 new destroyers in a South American nation will surely alter the regional power balance."
 bra.54.a:0 "Okay"
 bra.55.t:0 "Brazil is to be leased 6 American destroyers"
 bra.55.desc:0 "The Brazilian Foreign Ministry has just requested the US a lease of 6 of their decommissioned destroyers. If these destroyers arrive, they will surely endanger our project of naval supremacy in South America and might even threaten our national security. We mustt ask the US to cancel the lease!"
 bra.55.a:0 "Let's contact the Americans"
 bra.55.b:0 "Who cares?"
 bra.56.t:0 "Argentina complains about the Brazilian destroyer lease"
 bra.56.desc:0 "The Argentine Foreign Minister Carrlos Saaverda Lamas has just approached us asking us to cancel the Brazilian destroyer lease. He claims that this is part of a Brazilian project to dominate the South American continent and subjugate their people. While no other South American nations have complained, it might be wise to postpone the lease to avoid any possible tensions."
 bra.56.a:0 "The lease has to be postponed"
 bra.57.t:0 "The US suspends the destroyer lease"
 bra.57.desc:0 "After receiving Argentine complaints that the lease was part of a Brazilian project to dominate South America, the Americans have postponed indefinitely their destroyer lease. Chancellor Osvaldo Aranha has already approached the Department of State to straighten the situation, but it is probably to late to recover these precious ships."
 bra.57.a:0 "What!? Unacceptable"
 bra.58.t:0 "The US suspends the Brazilian destroyer lease"
 bra.58.desc:0 "After listening to our complaints, it seems that the US has indefinitely postponed the destroyer lease to the Brazilian Navy. It looks like Saavedra Lamas has obtained another victory."
 bra.58.a:0 "A victory, indeed!"
 bra.59.t:0 "The American destroyers arrive!"
 bra.59.desc:0 "After months of wait, the 6 American destroyers leased to us have finally arrived in Brazilian seas. Now our Navy will be feared in the whole Southern Hemisphere!"
 bra.59.a:0 "Finally!"
 bra.60.t:0 "The first Non-Stop Fortaleza-Rio flight"
 bra.60.desc:0 "Today, two Brazilian military pilots have performed a great feat: flying Non-Stop between the cities of Fortaleza and Rio de Janeiro. The 16 hour flight, made with one Waco Cabin-64 biplane, was the first Non-Stop flight between these cities, and is already considered a victory by Brazilian aviation enthusiasts, such as the President himself. Perhaps this marks the beginning of a new Brazilian age, one which the enormous country, essentially a disconnected archipelago, will be finally united under the might of the airplane!" 
 bra.60.a:0 "A great day for Brazilian aviation!"
 
 #Constitution Events
 
 bra.constitution.1.t:0 "The Constititutional Draft is ready"
 bra.constitution.1.desc:0 "In 1932, Vargas appointed a Comission of 26 politicians to elaborate a draft on what they think should be the constitution. The \"Itamarati Comission\", as it was nicknamed, was composed of some famous figures, such as Osvaldo Aranha, Assis Brasil, Oliveira Viana, José Américo, Góis Monteiro, João Mangabeira and its President, Afrânio de Melo Franco. After months of debates, the comission has suggested that the future Constitution should have proportional suffrage, including for women; indirect presidential elections and a weak presidency, indicating a compromise between parliamentarism and presidentialism; a relatively strong central government; suppression of the Senate and also the inexistence of class representation in the National Assembly. The Constituent Assembly still has to vote these proposals in order to make them part of the Constitution, and it is not yet clear what articles will stay in the final version."
 bra.constitution.1.a:0 "Let's vote it"
 bra.constitution.2.t:0 "Election of the President of the Constitutional Assembly"
 bra.constitution.2.desc:0 "As the Progressive Party of Minas Gerais is the biggest pro-Government group in the Constitutional Assembly, the President of this chamber should be drawn from this party, guaranteeing its valuable support to the Presidential cause. One option would be to choose the experient politician and previous President of Minas Gerais, Antônio Carlos Ribeiro de Andrada, one man of extraordinary political abilities and prestige, but who should not be allowed to fly too high. Another option would be to elect Virgílio de Melo Franco, one promising young representative from the same party and a steady supporter of the 1930 Revolution, though dangerously close to the Finance Minister Osvaldo Aranham, who is rumored to ambition the Presidential seat. Who should lead the Constituent Assembly?"
 bra.constitution.2.a:0 "Antônio Carlos de Andrada, of course!"
 bra.constitution.3.t:0 "An Assembly Divided"
 bra.constitution.3.desc:0 "The members of the Constituent Assembly have just been elected and clear ideological divisions, which are usually intertwined with regional ones, are already appearing among them. The representatives can be divided in roughly two groups: those from the \"small states\", such as Pernambuco, Paraíba and Rio Grande do Norte, and those from the \"big states\" such as Minas Gerais, São Paulo, Rio Grande do Sul and even Bahia. The first group is primarily represented by the UCN, whose members were the most radical revolutionaries in October 1930. Among their primary propositions are the support of centralizing and corporatist measures, such as class representation, in order to guarantee that the \"big states\", dominated by coffee planters and cattle ranchers, don't monopolize national politics as they did during the Old Republic. This group finds, however, common ground with autocratic militarists and Vargas himself, as they too put an emphasis in expanding federal powers and reducing the power of the wealthiest states. The second group, far from homogenous, includes representatives from that wealthiest states and have the common goal of keeping the autonomy of their respective regions against the Federal Government. Part of this group are both supporters of Vargas, such as the Mineiro PP and the Gaúcho PRL, as well as groups that have antagonized Vargas' presidency, such as the Paulistas and the Gaúcho United Front. This assembly will surely experience some heated debates!"
 bra.constitution.3.a:0 "Interesting"
 bra.constitution.4.t:0 "Constitutional Debate: On Class Representation"
 bra.constitution.4.desc:0 "Some members of the constituent assembly are in favor of adopting corporatist elements in our National Assembly. They argue that the modern industrial society requires more forms of political representation than traditional political parties, and as such, some seats should be destined to employer's and worker's union members. On the other hand, representatives of the \"big states\" argue that these measures are copied from Fascist Italy and should not be applied under a representative democracy. Additionally, President Vargas sees in class representation an opportunity to increase his personal powers, as he could extend his control over the relevant unions. What will the Assembly decide?"
 bra.constitution.4.a:0 "Political parties are an insufficient form of representation"
 bra.constitution.4.b:0 "Let us not copy the Fascists"
 bra.constitution.5.t:0 "Constitutional Debate: Economic Nationalism"
 bra.constitution.5.desc:0 "The Constituent Assembly is debating a shift from the relative openness to foreign investments of the Old Republic to a new system of economic nationalism. Measures such as nationalization of all subsoil resources and of all financial institutions are being considered, and it seems that there isn't much opposition to them."
 bra.constitution.5.a:0 "This is the future"
 bra.constitution.6.t:0 "Constitutional Debate: On the Duality of the Judiciary"
 bra.constitution.6.desc:0 "The Assembly is debating whether Judicial Federalism should exist or not. While the \"big states\" argue that there should be separation of judicial authority between state courts and federal courts, the UCN sees this as another way that regional strongmen can maintain their power. What will the Assembly decide?"
 bra.constitution.6.a:0 "Judicial Dualism would only serve the interests of the oligarchs"
 bra.constitution.6.b:0 "Judicial Federalism is a fundamental element of Federalism"
 bra.constitution.7.t:0 "Constitutional Debate: On Bicameralism"
 bra.constitution.7.desc:0 "Continuing the debates concerning decentralization, some representatives are disagreeing on whether keeping the Senate - or an equivalent - as an autonomous part of the Legislative, or keeping it merely as a simply honorific institution dedicated to coordinating the other powers, with the Chamber of Deputies becoming the sole chamber of the Legislative. What will the Assembly decide?"
 bra.constitution.7.a:0 "The Senate cannot be stronger than the House"
 bra.constitution.7.b:0 "The Senate must be as strong as the House"
 bra.constitution.8.t:0 "Constitutional Debate: Voting Rights"
 bra.constitution.8.desc:0 "The main objective of the 1930 Revolution was moralizing the electoral system. Incorporating the ideas of Assis Brasil, the Constituent Assembly is unanimous to approve the establishment of an \"Election Justice\" as well as direct, universal - including for women - and secret suffrage for the Chamber of Deputies. Whether Presidential elections are going to remain direct or become indirect will be discussed later on."
 bra.constitution.8.a:0 "Progress cannot be stopped!"
 bra.constitution.9.t:0 "Constitutional Debate: On Presidential Responsibility"
 bra.constitution.9.desc:0 "The Assembly is debating on whether to keep a strong Presidency or an arrangement where the President and his Ministers are liable to the Legislative. Surprisingly, this idea has drawn support from both the big states and the UCN, while being naturally opposed by Vargas and his closest allies. What will the Assembly decide?"
 bra.constitution.9.a:0 "The Executive Power must be strong and independent"
 bra.constitution.9.b:0 "The President and his Ministers should answer to the Legislative"
 bra.constitution.10.t:0 "Constitutional Debate: Direct or Indirect Elections?"
 bra.constitution.10.desc:0 "Another issue that has been dividing the Assembly is whether or not to have indirect Presidential Elections. While the states of São Paulo and Rio Grande do Sul support direct elections, Minas Gerais and the UCN take the opposite stance. What will the Assembly decide?"
 bra.constitution.10.a:0 "Indirect Elections will weaken the Coroneis"
 bra.constitution.10.b:0 "Indirect elections are an affront to Democracy"
 bra.constitution.11.t:0 "Constitutional Debate: Social Rights"
 bra.constitution.11.desc:0 "It has been widespread consensus that the State should expand its powers in order to guarantee social harmony, while still keeping distance from totalitarian experiences by the left and by the right. Things such as basic education, labor rights and an expanded role for women in our society are now part of the Constitution."
 bra.constitution.11.a:0 "We must push for equality!"
 bra.constitution.12.t:0 "Constitutional Debate: Reforming the Tax System"
 bra.constitution.12.desc:0 "The excesses of fiscal federalism were one of the most common points of criticism to the Old Republic. The UCN proposes reducing the ability of the states to levy taxes - especially the archaic export taxes - increasing the size of the Federal budget at the expense of the states, while representatives from São Paulo and Minas Gerais are naturally opposed to this. What will the Assembly decide?"
 bra.constitution.12.a:0 "Excessive fiscal federalism only serves to divide our country!"
 bra.constitution.12.b:0 "The states should be autonomous to levy taxes!"
 bra.constitution.13.t:0 "Góis Monteiro aspires the Presidency"
 bra.constitution.13.desc:0 "Reports by allied Interventors Juracy Magalhães and Flores da Cunha indicate that Minister of War Góis Monteiro plans to run for President himself, and he already has a group of oppositionist PRM representatives backing him. The most worrying part, though, is that apparently he is willing to use illegal means of taking power, such as inciting unrest among the Armed Forces."
 bra.constitution.13.a:0 "We cannot let him continue"
 bra.constitution.14.t:0 "Enacting the Constitution"
 bra.constitution.14.desc:0 "With the Constitution ready and the indirect Presidential Elections happening tomorrow, all we need now is for Vargas to sign the Document. While there is no risk of discarding the Constitution right now, Vargas and his close aides have made it clear that they think that it puts too many restrictions on Presidential Powers, and that he will soon work towards revisiting this aspect..."
 bra.constitution.14.a:0 "Serei o primeiro revisor da Constituição..." 
 bra.constitution.15.t:0 "The Debates are over!"
 bra.constitution.15.desc:0 "After long months of incessant debates and political intrigue, the Constitution is finally ready to be promulgated!"
 bra.constitution.15.a:0 "Finally"
 
 #Election Events
 
 bra.elections.1.t:0 "The Constituent Election"
 bra.elections.1.desc:0 "Scheduled in 1932, even before the onset of the Paulista War, the Constituent elections have finally arrived. We must be wary, though, as the elctions will grant access to government to the many groups that were previously marginalized by our coalition..."
 bra.elections.1.a:0 "Constituição ou Morte!"
 bra.elections.3.t:0 "The First Legislative Elections"
 bra.elections.3.desc:0 "As decided, the Constituent Assembly should be replaced by a new National Assembly after the return of Constitutional normalcy. With all Interventors now firmly entrenched in their respective states, it is widely expected that they will strongly influence the outcome of the Legislative elections in their favor. Perhaps the biggest losers of this election will be the Tenentes and the UCN, who did not manage to canvass much support in the civil society after the cooling down of the Revolution..."
 bra.elections.3.a:0 "A Victory for the Status-Quo"
 bra.elections.4.t:0 "The Fluminense Elections"
 bra.elections.4.desc:0 "The counting of ballots is finally over in the state of Rio de Janeiro. The official candidate, Protógenes Guimarães, has narrowly won the vote, but at the cost of sacrificing many of our most loyal allies..."
 bra.elections.4.a:0 "Was it worth it?"
 bra.elections.5.t:0 "The 1938 Elections"
 bra.elections.5.desc:0 "Against all expectations, the 1938 elections are actually going to happen. After much electoral tension, the voters decide to elect..."
 bra.elections.5.a:0 "Armando de Sales Oliveira!"
 bra.elections.5.b:0 "José Américo de Almeida!"
 bra.elections.5.c:0 "Antônio Carlos de Ribeiro Andrada!"
 bra.elections.7.t:0 "The [GetYear] Elections"
 bra.elections.7.desc:0 "The civil society is experiencing its first elections since the twilight of the Estado Novo. The voter are going to elect..."
 bra.elections.7.a:0 "The Brigadier!"
 bra.elections.7.b:0 "The Father of the Poor!"
 bra.elections.7.c:0 "The General!"
 
 #Political Events
 bra.intro.1.t:0 "The Second Brazilian Republic"
 bra.intro.1.desc:0 "The third decade of the 20th century has not been particularly calm in Brazil. After the Wall Street Crash of 1929 and its subsequent economic crisis, a wide coalition of political forces, called the \"Liberal Alliance\" - an heterogeneous group consisting of Tenentes, liberals and disaffected oligarchs - was formed in order to destroy the staus-quo of the Old Republic. In the end, the wide coalition was victorious, culminating in the 1930 Revolution, the toppling of Paulista President Washington Luís by a coup d'état. \n\nThe new regime, or the New Republic, as its leaders prefer to call it, soon had to face many challenges, both external and internal. Externally, the young government was met coldly by Herbert Hoover, who was still reticent to support the new Brazilian head of state Getúlio Vargas, who had, as it seemed, taken power from the rightful president. Internally, the wealthy state of São Paulo, that had recently fallen from the central stage of national politics, rebelled against the federal government, demanding the approval of a new constitution, which Vargas did not promise credibly enough. The Paulista War, as it is called, started in July 1932 and lasted four months and left behind a trail of trenches, corpses and dry public coffers, reminding some of the carnage of the Great War. \n\nWhile the past might seem bleak to Brazil, the future poses new opportunities. Thanks to the actions of the President and his cabinet, Brazil has already recovered from the Depression in terms of output, and has now many laws to safeguard the dignity of the common worker, though there's still much to be done. A new Constitution, the demand of the rebellious Paulistas and politicians, is currently being discussed by the Comission of the 26, whose Constitutional Draft will be voted by a Constituent Assembly. The elections to the Constituent Assembly, which will happen in May, will be the first that Brazilians take part since the sunset of the Old Republic, with the difference that this time women and the poor will also participate."
 bra.intro.1.a:0 "Ordem e Progresso!"
 bra.pol.1.t:0 "The Death of Olegário Maciel"
 bra.pol.1.desc:0 "Today, at the age of 77, the influential Interventor of Minas Gerais, Olegário Maciel, has died unexpectedly. Having stood besides Getúlio Vargas in 1930 and 1932, Olegário Maciel was the only governor to stay in control of his state after the 1930 Revolution. \n\nMaciel's unexpected death has left Vargas with a question: who should succeed him? His successor should be definitely chosen in the following month, a decision that will surely impact the future of our nation, as opposing political currents compete for this important state in the Federation. Until then, the seat will be occupied by Gustavo Capanema, who clearly ambitions the permanent post."
 bra.pol.1.a:0 "A sad day for Brazil"
 bra.pol.2.t:0 "Appointing an Interventor for Minas Gerais"
 bra.pol.2.desc:0 "With several months having passed since the death of Interventor Olegário Maciel, now it is time to choose who is going to definitively occupy his vacant seat. In support of the interim Interventor, Gustavo Capanema, are the traditional oligarchies of the state of Minas Gerais, with its maximum representative, Antônio Carlos, as well as the powerful Interventor of Rio Grande do Sul, Flores da Cunha. An opposing group wishes Virgílio de Melo Franco ascendency to the post, having Osvaldo Aranha, Virgílio's old friend, and Afrânio de Melo Franco, Virgílio's father, as its main spokespersons. \n\nKeeping in mind the relevance of the state of Minas Gerais, we should consider that choosing either Capanema or Melo Franco would critically empower Antônio Carlos and Osvaldo Aranha respectively, two men who are known for their presidential ambitions. After much thought, Vargas chooses..."
 bra.pol.2.a:0 "...neither! Benedito Valadares is a more appropriate candidate."
 bra.pol.3.t:0 "Aranha and Melo Franco resign their ministries"
 bra.pol.3.desc:0 "Feeling snubbed by President Vargas after having their choice for the Minas Gerais' succession, Virgílio de Melo Franco, sidelined, Ministers Afrânio de Melo Franco and Osvaldo Aranha have decided to resign their posts. Claiming that it was all a scheme created by Antônio Carlos to weaken their family in the Mineiro political scenario, Virgílio and Afrânio de Melo Franco have become deeply embittered with the President. Additionally, Osvaldo Aranha, who ended up being transferred to the Brazilian embassy in Washington, was also the leader of the majority in the Constituent Assembly, and his departure will certainly delay the conclusion of the debates."
 bra.pol.3.a:0 "An unfortunate loss"
 bra.pol.4.t:0 "The return of the Exiles"
 bra.pol.4.desc:0 "Having we restored political and civil rights, it makes no more sense to keep old political enemies exiled. With the amnesty, many relevant oppositionist figures, such as Artur Bernardes, Otávio Mangabeira and Borges de Medeiros, are returning from exile, either external or internal. Having lost the extensive powers they held before 1930 and 1932 in their respective constituencies, these men will surely become formidable opponents to the President."
 bra.pol.4.a:0 "I hope I do not have to exile them again"
 bra.pol.5.t:0 "The proletarian Caucus denounces police brutality"
 bra.pol.5.desc:0 "Exposing yesterday's incident to the National Assembly, Valdemar Reykdall, an unionist and member of the Proletarian Caucus, called the ocurrence a cowardly slaughter, holding the President and the police responsible for it. Additionally, the Caucus demanded an explanation from the Minister of Justice, which is unlikely to come."
 bra.pol.5.a:0 "The policemen did the right thing"
 bra.pol.6.t:0 "Incident at Praça Tiradentes"
 bra.pol.6.desc:0 "A brutal fight between unionists and policemen just happened in the national capital, Rio de Janeiro. After an unionist congress at the João Caetano Theater, a theater at Tiradentes Square, the police forbade the demonstrators to leave the building, creating a turmoil that resulted in a shootout. The outcome of this event, in which the unionists carried red flags and echoed the slogan \"Against war, fascism and integralism\", resulted in a few dead and many injured, perplexing many local newspapers and politicians."
 bra.pol.6.a:0 "These are not workers, these are communists!"
 bra.pol.7.t:0 "The First Integralist National Congress"
 bra.pol.7.desc:0 "The First Integralist Congress happened today, in Vitória. The main aim of the event was the establishment of a proper bureaucratic framework to the organization, creating a hierarchical structure of local organs, with the \"Chefe\" at the top. This organizational effort already makes the AIB the most structured political party in Brazil."
 bra.pol.7.a:0 "Interesting"
 bra.pol.9.t:0 "Universidade do Distrito Federal"
 bra.pol.9.desc:0 "Aided by Anísio Teixeira, the city's Secretary of Education, Pedro Ernesto, the popular mayor of the Federal District, has organized a new public university. The University of the Federal District, as it will be called, aims at becoming a national center of study and research, already counting on a French mission to organize its scholars. Following the principles of the Escola Nova movement, the UDF is a strictly secular institutions, which has already created frictions with the clergy."
 bra.pol.9.a:0 "A revolutionary event"
 bra.pol.10.t:0 "The Second Integralist National Congress"
 bra.pol.10.desc:0 "The Second Integralist National Congress, which happened in Petrópolis, follows the pattern of the first and develops even more the structure and hierarchy of the Integralist movement. As the AIB grows, they've been managing to mantain worrying internal cohesion and discipline."
 bra.pol.10.a:0 "They're already becoming a nuisance"
 bra.pol.11.t:0 "Our Electoral Stance"
 bra.pol.11.desc:0 "As the federal and state elections are apporaching, members of the opposition have suggested that we take some measures to reduce electoral fraud and coercion. As the state legislatures are going to indirectly elect the first constitutional governors, they argue that it makes no sense for the current Interventors to remain at their posts, as they will take anti-democratic measures to increase the likelihood of their election. In practice, they are suggesting that Interventors who wish to be reelected leave their posts during the electoral campaign. \nWhat decision should we take?"
 bra.pol.11.a:0 "Haha, what a story..."
 bra.pol.11.b:0 "We will agree to such proposals"
 bra.pol.12.t:0 "The Fluminense Elections are coming"
 bra.pol.12.desc:0 "The state of RIo de Janeiro will soon have its state elections, and it looks like it will cause much turmoil. Unlike perhaps in any other state of the Federation, the two competitors to the position of governor, Protógenes Guimarães and Cristóvão Barcelos, have credible chances of winning, leaving the results unpredictable. While the state of Rio de Janeiro is extremely close to the national capital and having a loyal governor would be indispensable during a time of national instability, helping one candidate over the other means sacrificing one ally over the others. The first candidate is favored by the Paulistas and by Vargas himself, as Guimarães is from the same party of the leader of the house majority, Raul Fernandes, while the second is supported by the powerful Flores da Cunha. Who should we support during the campaign?"
 bra.pol.12.a:0 "We will discretely support Protógenes Guimarães"
 bra.pol.13.t:0 "Troubles in our Coalition"
 bra.pol.13.desc:0 "The electoral situation in Rio de Janeiro clearly Protógenes Guimarães, our candidate, but not everyone is happy. After some clear vestiges that the Federal Government is intervening in favor of Guimarães, Flores da Cunha, a staunch supporter of Cristóvão Barcelos, made public a telegram from Minister Vicente Rao to Vargas explaining the reasons why Protógenes Guimarães should be supported. After what some sectors of the political class saw as an act of illegal interference of the Federal Government in state's matters, Raul Fernandes has resigned as the leader of the house majority, and Flores has become openly hostile to the President."
 bra.pol.13.a:0 "So it begins..."
 bra.pol.14.t:0 "The 'Parliamentary Group for Popular Liberties' forms"
 bra.pol.14.desc:0 "A new political group, the GPLP, was formed in the House of Deputies. Without leaving their official political parties, some deputies, among them Café Filho and Domingos Velasco, have read a declaration upholding constitutional liberties, denouncing imperialism and calling for action against the AIB. Showing clear dissatisfaction with our current policies of strengthening the Executive at the expense of the Legislative, the group is also making an attempt at illegalizing Integralism, which might constitute a defeat for the government if approved by the house..."
 bra.pol.14.a:0 "Communists in disguise, probably"
 bra.pol.15.t:0 "Representatives criticize our Budget Draft"
 bra.pol.15.desc:0 "Members of the house minority have criticized our budget draft for the year of 1935, with one representative going as far as to say that the draft is \"entirely flawed\". Among the most important foci of criticism, as exposed by oppositionist representatives Henrique Dodsworth and Acúrcio Torres, are the lack of resources destined to education, which is extremely important for the whole nation. Perhaps these politicians don't recognize the terrible fiscal situation we're in..."
 bra.pol.15.a:0 "Our hands are tied"
 bra.pol.16.t:0 "The creation of the ANL"
 bra.pol.16.desc:0 "Following closely the international trend of United Fronts against fascism, the National Liberator Alliance was just founded in Rio de Janeiro. Calling for the suspension of foreign debt payments, agrarian reform, strengthening of the Armed Forces and opposition to fascism in its manifesto, thousands of citizens, mostly socialists, communists, catholics and soldiers attended to the launching of the ANL. In the rally, the young Carlos Prestes has announced the honorific president of this new organization: no one less than Luis Carlos Prestes, the \"Knight of Hope\", who is currently serving the Comintern in Moscow."
 bra.pol.16.a:0 "They might become dangerous"
 bra.pol.17.t:0 "Prestes returns from the USSR"
 bra.pol.17.desc:0 "Informers have told us that Luis Carlos Prestes, the honorific president of the ANL, has illegally returned from the Soviet Union. While he is currently hidden and we can't seem to find him, it is likely that he will cause much trouble."
 bra.pol.17.a:0 "That's not good"
 bra.pol.18.t:0 "ANL and AIB clash in the streets"
 bra.pol.18.desc:0 "Quite expectedly, the newly founded ANL has already started to cause problems. Just yesterday, a bloody clash has happened in Rio de Janeiro between partisans of the ANL and integralists, and while no one died, it exemplifies a worrying trend in Brazilian politics."
 bra.pol.18.a: "Street fights!? In MY Brazil?"
 bra.pol.19.t:0 "ANL launches a new manifesto"
 bra.pol.19.desc:0 "\"All power to the ANL!\", says a new manifesto launched by Luis Carlos Prestes. Radicalizing its discourse, the organization declared that peaceful collaboration with our current government is impossible, openly calling for an armed insurrection against Vargas."
 bra.pol.19.a:0 "They must be shut down!"
 bra.pol.20.t:0 "The LSN is discussed in Parliament"
 bra.pol.20.desc:0 "The National Security Law has just been sent by the Executive to be voted by the Parliament. Already nicknamed the \"Monster Law\" by the opposition, who sees it as an authoritarian measure by the government, the objective of the document is to define crimes against the \"social\" and the \"political\" order. \nWhile the original project, with Henrique Smith Bayma (Constitutionalist Party - SP) as its rapporteur, will certainly receive changes by the Legislative, some interesting debates are already appearing in the chamber. Highlighting the disunity of the former Paulista \"United Ticket\", who fought side by side in 1932, heated debates are happening between Paulistas from the Constitutionalist Party, supporters of the government, and those from the Paulista Republican Party, one of the most irate opposition groups. How the political scene changes fast!"
 bra.pol.20.a:0 "Ironic"
 bra.pol.21.t:0 "Góis Monteiro publicly supports the LSN"
 bra.pol.21.desc:0 "In a press interview, Minister of War Góis Monteiro has praised the new National Security Law, saying that it gives the state much needed powers to counter internal threats. The individual, he says, should abdicate part of his powers to the collectivity, justifying the need for a strong state in the 20th century. \nMore interesting though, was his concern about military unrest. The LSN, in Góis' view can serve as a way of cleaning the Army of Integralist and Communist elements, who are becoming increasingly popular inside the institution."
 bra.pol.21.a:0 "Good"
 bra.pol.22.t:0 "The House criticizes our Military Pay Reform"
 bra.pol.22.desc:0 "As already expected, the bill raising Army wages is causing much discontent inside the Parliament. With the clear intention of dividing the House majority, members of the opposition, such as congressman Mozart Lago, have proposed an ammendment to the bill, extending the pay raise to all public servants, who have suffered from wage stagnation. While this will make the President look bad, he has no alternative other than vetoing this ammendment, as the federal budget is already too strained to incur new expenses."
 bra.pol.22.a:0 "We will veto it!"
 bra.pol.24.t:0 "Góis Monteiro resigns"
 bra.pol.24.desc:0 "With the military pay reform being constantly blocked by the opposition, some sectors of the Army are already becoming undisciplined. In Rio Grande do Sul, Army officers have interpellated Minister of War Góis Monteiro, demanding the approval of the bill. Seeing this as a break of military hierarchy, Góis had them punished. \nHowever, the governor of RIo Grande do Sul, Flores da Cunha made a public declaration defending the officers and calling for their pardon. Góis, furious with this political intromission in the affairs of the Army, resigned from his post. Being the most loyal supporter of Vargas in the Army, his dismissal will make our life much harder, with the opposition already capitalizing on the event. After the episode, João Gomes Ribeiro, an indication from the Constitutionalist Party, has assumed as the new Minister of War."
 bra.pol.24.a:0 "\"Flores da Cunha will pay for what he has done!\""
 bra.pol.25.t:0 "The Gaúcho United Front criticizes the Presidential Veto"
 bra.pol.25.desc:0 "Vetoing the House ammendment of the Army pay reform, has caused much malaise and outcry in the Parliament. The two most prominent opposition representatives, João Neves da Fontoura and Batista Luzardo, both members of the Gaúcho United Front (FUG), have harshly criticized the President. In a brilliant discourse, João Neves accused Vargas of not having one single supporter inside the Parliament, as even the House majority sided with the opposition over the military pay reform. This episode marks an increasingly difficult relationship between Vargas and the Parliament, which was extremely loyal and disciplined until a few months ago."
 bra.pol.25.a:0 "The Parliament only exists to make my life harder..."
 bra.pol.27.t:0 "Flores da Cunha imports Czechoslovak weapons"
 bra.pol.27.desc:0 "Since the episode with Góis Monteiro, governor Flores da Cunha has been moved starkly towards the opposition. In a display of old-fashioned Caudillismo, Flores has already started to buy Czechoslovak military equipment, such as armored cars and small arms, foreseeing a future showdown with the central government."
 bra.pol.27.a:0 "Wait! That's illegal!"
 bra.pol.28.t:0 "The Parliament criticizes our Budget Draft"
 bra.pol.28.desc:0 "Approving the next year's budget has been even harden than it was last year. Dozens of deputies, trying to obtain spending increases, which are favorable to their interests, have proposed ammendments to the 1936 budget. Vargas is visibly angry with this, claiming it's all remains of the oligarchic practices of the Old Republic, calling the deputies irresponsible for straining the federal budget even more."
 bra.pol.28.a:0 "Their collective irresponsibility is lamentable"
 bra.pol.29.t:0 "Flores breaks with Vargas"
 bra.pol.29.desc:0 "The day dawned with a singularly interesting newspaper headline: \"Flores rompe com Vargas\". After the government chose Pedro Aleixo, a Mineiro, instead of João Carlos Machado, a Gaúcho, to lead the House majority after Raul Fernandes' departure, it has become clear that Flores' PRL has joined the opposition in all but name. Politicians have already warned Vargas that Flores da Cunha is making recurring visits to opposition leaders, trying to solidify this new arrangement. \nWith the complete loss of one of Brazil's most important states to the opposition, Vargas enters into a very complicated situation..."
 bra.pol.29.a:0 "It seems that São Paulo is more loyal than my fellow Gaúchos"
 bra.pol.30.t:0 "Otávio Mangabeira asks for Vargas' resignation"
 bra.pol.30.desc:0 "Capitalizing on the strained relations between Vargas and Flores da Cunha, oppositionist representative Otávio Mangebeira has taken the opportunity to attack the President. Saying that Vargas is soon going to be put in a state of permanent war against the Parliament, which is quite likely to happen, Mangabeira has stated that Brazil needs a new face at the Catete Palace, demanding for Vargas' resignation. \nNewspapers and observers are predicting that the Parliament will close ranks against Presidentian powers, which had been increasing since the promulgation of the 1934 Constitution, after measures such as the LSN."
 bra.pol.30.a:0 "Only a miracle might save the government now"
 bra.pol.31.t:0 "Socialists start a revolt in Natal"
 bra.pol.31.desc:0 "Bad news! A revolt by soldiers and workers has just ecloded in Natal, capital of the state of Rio Grande do Norte. The rebellious troops have taken control of the 21st Battalion of Caçadores' Headquarters in the city, forcing the state governor and local politicians to take refuge in the CHilean embassy. While legalist troops are attempting to control the situation, a \"people's revolutionary committee\" has already been set in the city, and might well expand its operations to other states."
 bra.pol.31.a:0 "What!?"
 bra.pol.32.t:0 "Socialist uprising in Recife"
 bra.pol.32.desc:0 "In solidarity with the rebels in Natal, the 29th Battalion of Caçadores, situated just outside Recife, the capital of the important Northern state of Pernambuco, has just sublevated and marched towards the city. While the situation isn't good, our legalist troops are already managing to take control of the situation."
 bra.pol.32.a:0 "Fools!"
 bra.pol.33.t:0 "Declaring State of Siege"
 bra.pol.33.desc:0 "The communist uprisings in Natal and Recife have given us pretext to declare \"Estado de Cerco\". Hard to believe that only a few days after Otávio Mangabeira's fiery speech against the President, we would have such an opportunity to increase Presidential powers!"
 bra.pol.33.a:0 "A blessing, without a doubt"
 bra.pol.34.t:0 "The Uprising reaches Rio de Janeiro"
 bra.pol.34.desc:0 "The red manace has also infiltrated the caserns of Rio de Janeiro! A group of leftist revolters tried to imprison the officers of the 3rd Infantry Regiment and sublevate the entire regiment, but luckily, we were prepared. Besides the fact that the revolt had already started in the North, we received confidential information from the British embassy suggesting that a communist coup could be attempted at any moment. General Eurico Gaspar Dutra, commander of the 1st Military Region, made sure that these rebels would not come close to the Catete Palace!"
 bra.pol.34.a:0 "Destroy them!"
 bra.pol.35.t:0 "The Communist Uprising is crushed"
 bra.pol.35.desc:0 "After almost a week of turmoil, the uprisings are finally over and our soldiers are slowly returning to their caserns. The armed conspirators are being shot, while we are beginning to prosecute their political collaborators, with parliamentary support, of course. \n\nWhile the rebellion has been defeated, it came at the cost of the blood of several martyrs. Brazil shall not forget the soldiers who died fighting the Red Hydra!"
 bra.pol.35.a:0 "Excellent"
 bra.pol.36.t:0 "Prestes and his wife are arrested"
 bra.pol.36.desc:0 "Finally found, after months in hiding, the communist Luís Carlos Prestes and his wife, Olga Benário, have been arrested. Olga, a German jewish communist in service of the Comintern, will be deported back to Germany, so that the relevant authorities can deal with her. She is current expecting a child, and with the current situation of German politics, her future and the child's are rather uncertain... May Filinto deal with these filthy communists!?"
 bra.pol.36.a:0 "It is as it is"
 bra.pol.37.t:0 "The Military pressures us!"
 bra.pol.37.desc:0 "Brazil's lack of ability to import since the 1929 Crash has led to rising inflation. Our soldiers' wages have remained stagnant since then, however, leading to a decrease in their real wages. The officers, feeling that the military has done their part in standing besides the President in 1930, 1932 and 1934, have been pressuring for a wage increase. \n\nSeeing that some of our officers have rather questionable loyalty, it wouldn't be wise to delay their pay rise too much, although we're short in cash, and the Parliament won't be happy with this..."
 bra.pol.37.a:0 "I will see what I can do"
 bra.pol.8.t:0 "Rumors of extending the Presidential Mandate"
 bra.pol.8.desc:0 "The communist uprising has unquestionably altered the Brazilian political atmosphere. As we don't have much certainty about the extent of the activities of the Communist Party, the prospect of polarized presidential elections, such as the ones that are coming in 1938, might arouse the spirits of the Brazilian people in undesirable ways... \n\nAlleging that the current situation is too delicate, Getúlio Vargas has not yet nominated a successor, even if the elections are approaching. While on one hand this is understandable, since the succession of the incumbent President has always created divisions among Brazilian political elites (including the one that led to 1930), on the other there have been talks - which seem to be originating in the Interior Ministry - about the prospects of increasing Vargas' mandate, which would require significant changes in the Constitution. Already opposed to this Constitutional Ammendment are the governors of some of Brazil's most important states, such as Bahia's Juracy Magalhães, Pernambuco's Carlos Lima Cavalcanti, São Paulo's Armando de Salles Oliveira and Rio Grande do Sul's Flores da Cunha, with some of them having their own Presidential ambitions. This has become a problem, since no President can govern without these states, with São Paulo's situation being even more worrying, since the Paulistas have been entertaining the possibility of succeeding Vargas since 1934."
 bra.pol.8.a:0 "I have no idea from where these rumors are coming from"
 bra.pol.66.t:0 "Flores da Cunha agitates an oppositionist candidacy"
 bra.pol.66.desc:0 "Flores da Cunha has been providing the stauchest opposition to Vargas since the end of 1935, and it seems he's not tired yet. Abhorring the possibility of Vargas, who has been in government since 1930, extending his Presidential mandate, Flores has been agitating an oppositionist candidacy to confront the incumbent Commander-in-Chief. Since Flores himself has too many political enemies, he has been entertaining the possibility of backing the candidacy of Armando de Salles de Oliveira, the governor of São Paulo - who has been leading an innovative administration in his home state. São Paulo has been thirsty for the Presidential seat since 1930, since Washington Luís was deposed, and thus are likely to accept the Gaúcho's offer."
 bra.pol.66.a:0 "That fool!"
 bra.pol.39.t:0 "Armando de Sales renounces de Paulista government"
 bra.pol.39.desc:0 "As Vargas has not yet chosen a succesor to the Presidency, São Paulo has decided to act. Accepting Flores da Cunha's proposal of a Paulista oppositionist candidacy, Armando de Salles Oliveira has renounced his post as governor, since Presidential candidates must not be exercising a political function since at least one year before the election. It seems that Vargas' honeymoon with the Constitutionalist Party has ended."
 bra.pol.39.a:0 "O Senhor, Dr. Armando?!"
 bra.pol.40.t:0 "Paulista ministers leave the government"
 bra.pol.40.desc:0 "In solidarity with Armando de Salles Oliveira, the Presidential candidate of the Constitutionalist Party, his copartisan associates Vicente Rao and José Carlos de Macedo Soares, respectivelly Minister of Justice and Minister of Foreign Affairs, have resigned from their government posts. Now, the Constitutionalist Party has formally entered into the parliamentary opposition."
 bra.pol.40.a:0 "Why are all the Paulistas so snob?"
 bra.pol.41.t:0 "The UDB forms"
 bra.pol.41.desc:0 "Trying to unite the various oppositionist politicians - which are scattered among dozens of small state-based political parties - around Armando de Salles candidacy, some leaders have created the Brazilian Democratic Union (UDB). Being the first truly national political party in generations, the UDB has agglutinated several important figures of the opposition, such as Flores da Cunha (PRL); João Carlos Machado (PRL); the former President Artur Bernardes (PRM); Otávio Mangabeira (CAB); Waldemar Ferreira (PC); and of course, Armando de Salles Oliveira (PC) himself."
 bra.pol.41.a:0 "The situation is becoming worrying"
 bra.pol.42.t:0 "Américo de Almeida discourses in a favela"
 bra.pol.42.desc:0 ""
 bra.pol.42.a:0 "Audacious, isn't he?"
 bra.pol.51.t:0 "José Américo becomes the official candidate of the government"
 bra.pol.51.desc:0 "After delaying the succession question until it was no longer possible, the Government has finally chosen a name. In a meeting with the presence of the governors of Minas Gerais, Benedito Valadares; Bahia, Juracy Magalhães; and Pernambuco, Carlos Lima Cavalcanti, the peers have decided to choose José de Américo de Almeida, a government minister, to run against Armando de Salles Oliveira. Breaking with the tradition of nominating a candidate from the \"South\", José Américo is natural from the \"Northern\" state of Paraíba, and promises to enact much needed government programs in this impoverished region if he is elected. \n\nWhile José Américo has received the support of all governors not affiliated with the UDB - that is, most of them - he has not received the enthusiastic support of the President himself. Now that it's clear to most observers that Vargas at least entertains the ambition of remaining indefinitely, José Américo's candidacy, despite being officially backed by the government, has an oppositionist aspect to it..."
 bra.pol.51.a:0 "Vargas has to keep the appearences"
 bra.pol.64.t:0 "José Américo, the Radical"
 bra.pol.64.desc:0 "In a speech during a rally in Rio de Janeiro, the official presidential candidate José Américo has inaugurated a very \"radical\" political platform. Latifundia should be divided and the state should take care of war industry and mining activities, he says. This type of \"radical\" discourse has been alienating parts of his original supporters, who are now turning to Vargas as a way of upholding the status quo. There have been growing talks among the military, for example, suggesting a non-democratic solution to this political polarization."
 bra.pol.64.a:0 "Let's see where this is going to"
 bra.pol.65.t:0 "\"A Name for the North\""
 bra.pol.65.desc:0 ""
 bra.pol.65.a:0 "A most unorthodox choice..."
 bra.pol.44.t:0 "Armando de Sales organizes a Feast at the Municipal Theater"
 bra.pol.44.desc:0 ""
 bra.pol.44.a:0 "Trying to court the upper classes, eh?"
 bra.pol.45.t:0 "Armando de Sales calls for National Unity"
 bra.pol.45.desc:0 ""
 bra.pol.45.a:0 "A stylish, but old-fashioned discourse"
 bra.pol.77.t:0 "So that Brazil continues..."
 bra.pol.77.desc:0 ""
 bra.pol.77.a:0 "Hm"
 bra.pol.46.t:0 "Plínio Salgado anounces his candidacy"
 bra.pol.46.desc:0 "An entourage of greenshirts has just arrived at the Catete Palace bringing fresh news: besides Armando de Salles and José Américo, the Presidential race will have yet another competitor! Plínio Salgado, as it seems, has decided to lead the AIB tickets to the elections. \n\nAfter having supported the centralizing measures of the Federal government since 1932, the Integralists still seem to believe that their \"loyalty\" will be rewarded with Vargas' support to the Presidency. What a joke..."
 bra.pol.46.a:0 "He still believes he is getting official support, eh?"
 bra.pol.48.t:0 "High-ranking politicians imprisoned!"
 bra.pol.48.desc:0 "Several important politicians, from the popular mayor of Rio de Janeiro Pedro Ernesto to the congressman João Mangabeira, have been arrested for their - alleged - association with the Communist Uprising of 1935. These men were denounced by the National Commission of Repressing Communism, with the Ministry of Justice requesting their prisons shortly after. Several members of the parliamentary opposition have denounced the act as illegitimate and proofless, but since we're under State of War, there not much that can be done."
 bra.pol.48.a:0 "That's their reward for associating with the ANL"
 bra.pol.49.t:0 "The Gaúcho modus vivendi"
 bra.pol.49.desc:0 "After the menace shown by the Communist Revolt, the Gaúcho government and the opposition sealed a pact that was in the making since 1935. The \"Gaúcho Modus Vivendi\", as it was called, established an almost parliamentarist system in the state, with the government having its functions divided between the official PRL and the (formerly) oppositionist FUG. \n\nBefore the pact, the FUG was already the main opposition to Vargas in the national sphere, with João Neves da Fontoura being the leader of the House minority. Now, their ranks have been reinforced with the recently-turned-into-opposition Flores da Cunha (PRL). A united Rio Grande do Sul will Surely pose a formidable threat to the Federal Government, but it is unlikely that this union will subsist. There's still much bad blood beetwen the FUG and the PRL, and members of both parties, such as João Neves da Fontoura himself, from the first; and Benjamim Vargas, from the second, are opposed to the alliance."
 bra.pol.49.a:0 "This won't work"
 bra.pol.50.t:0 "João Gomes resigns"
 bra.pol.50.desc:0 "After constant bickering with General Góis Monteiro, the Minister of War João Gomes Ribeiro Filho has decided to resign from his office. Being extremely reluctant to participate in our current offensive against Flores da Cunha, his leave will probably accelerate our dealings with the Gaúcho governor."
 bra.pol.50.a:0 "A constitutionalist, after all"
 bra.pol.71.t:0 "The Flores-Vargas showdown escalates"
 bra.pol.71.desc:0 "What was already a tumultuous relation has just escalated even more. Following a military parade leading the Gaúcho Military Brigade, where he force showcased his modern weaponry, such as armored cars and Skoda guns, Flores gave one of his typical explosive discourses, denouncing Vargas' plans to intervene in Rio Grande do Sul and install a dictatorship. In other times, this could have led to nothing, but now the State of War is over. \n\nSoon, his speech was already in the front cover of most newspapers in Rio de Janeiro. \"Civil War imminent\", the headlines said, expressing that the conflict between the President and Rio Grande do Sul would have led to another 1932. After that, several generals, some of them friendly towards Flores da Cunha, have approached Vargas demanding satisfaction. It appears as if the Army, fearing a new civil war, will no longer support Vargas' plans of centralization..."
 bra.pol.71.a:0 "Damn!"
 bra.pol.72.t:0 "The War Minister negotiates with the opposition"
 bra.pol.72.desc:0 "João Gomes Ribeiro, the Minister of War, has being opening worrying talks with the group around Armando de Salles Oliveira! It seems that João Gomes is offering himself to be Salles' Minister of War if he is to win the elections..."
 bra.pol.72.a:0 "What!?"
 bra.pol.52.t:0 "Choosing the new Interior Minister"
 bra.pol.52.desc:0 "Since some months have passed since the resignation of Vicente Rao from the Ministry of Justice, and we must replace Agammenon Magalhães, who currently holds the office as an interim minister. One good alternative is to appoint José Carlos de Macedo Soares, our former Paulista Minister of Foreign Affairs, since he is not so loyal to the cause of Armando de Salles as it seemed... His defection will surely further divide the already ruptured Paulista section of the UDB, boosting our cause."
 bra.pol.52.a:0 "Macedo Soares is our choice"
 bra.pol.53.t:0 "The 'Macedada'"
 bra.pol.53.desc:0 "In an act nicknamed the \"Macedada\", Minister of Justice Macedo Soares has decided to free hundreds of political prisioners, who were associated with the ANL without due judgement. As part of the relative liberalization that has been happening since the end of the State of War, this measure will surely angerthe more hardline anti-leftist sectors of the society. Very interesting, though, is that most of the freed prisoners were little more than pickpockets, but yet, it will further boost the support for a non-democratic outcome to our political situation..."
 bra.pol.53.a:0 "This is going to cause problems"
 bra.pol.54.t:0 "Pedro Ernesto speaks against the government"
 bra.pol.54.desc:0 "As part of the current wave of freeing political prisioners, the extremely popular Pedro Ernesto left the prison with wide popular acclaim. In a huge rally, he pronounced a fiery discourse against our government and in support of the candidacy of Armando de Salles Oliveira! Naturally, the Military is extremelly angry at this insolence, and is thinking of ending this liberal-democratic experiment once and for all..."
 bra.pol.54.a:0 "He should have stayed in prison"
 bra.pol.55.t:0 "The army demands action"
 bra.pol.55.desc:0 "The recent Pedro Ernesto's speech condemning the government, as well as the increasingly polarized electoral race, has been worrying our closest supporters in the military. Góis Monteiro and Filinto Müller believe that a nation as weakened as Brazil is right now, less than two years after the Red Hydra showed one of its heads, cannot stand such political agitation. They are demanding that we speep up the enactment of a solution that keeps Vargas in power, for the sake of stability!"
 bra.pol.55.a:0 "Perhaps these rumors about extending the presidential mandate have been true, after all."
 bra.pol.56.t:0 "Renewing the State of War"
 bra.pol.56.desc:0 "After a year of duration, the State of War has been suspended. Being blocked by the opposition, especially the Paulistas, who want to guarantee that Armando de Salles will run in 1938, the extension of the state of war was made impossible. For the first time, the oppositionist alliance, fearing that Vargas is planning a coup d'état, has managed to avoid a centralizing measure by the Executive."
 bra.pol.56.a:0 "The opposition has finally united"
 bra.pol.57.t:0 "Electing a new speaker of the house"
 bra.pol.57.desc:0 "If we are too proceed with our project of political centralization, we need the support of Benedito Valadares. One of his main demands, however, are that we get rid of Antônio Carlos de Ribeiro Andrada, the Mineiro patriarch who still threatens Valadares' hols in Minas Gerais. \n\nAntônio Carlos currently sits as the Speaker of the House, and we must make him lose the next elections to his post. Our best alternative is to support the ascension of Pedro Aleixo, our current leader of House majority, who is also from Minas Gerais, but not half as dangerous. After this act of treachery, it is likely that Antônio Carlos will end up joining the UDB, but at this point he will have lost all his power."
 bra.pol.57.a:0 "Pedro Aleixo will succeed him."
 bra.pol.58.t:0 "The \"Cohen\" Plan"
 bra.pol.58.desc:0 "Mr. President, we have \"bad\" \"news\"! We have unveiled a judeo-bolshevik plan, in which the reckless Komintern desires to strip away our freedom! The \"Cohen\" Plan, as the document was called, was already shown to Brazil's highest military authorities, who have all agreed on taking incisive action, and shall soon be announced on the Programa Nacional, making sure that all law-abiding citizens are aware of its existence! And well... I suppose that the document, which was definitely not fabricated by the Integralists, will give us the opportunity of passing the State of War in the Parliament!"
 bra.pol.58.a:0 "Our national security is threatened!"
 bra.pol.59.t:0 "Flores da Cunha resigns"
 bra.pol.59.desc:0 "After a decree that managed to officially federalize the Gaúcho Military Brigade, after years of preparation, Flores da Cunha has resigned his post as governor of Rio Grande do Sul. Knowing that he will not have bargaining power a threat without his once-formidable military power and with the state politically divided, he chose to flee to Uruguay. The command of the Military Brigade was passed on to General Daltro FIlho, who now controls the state as the Federal Government's appointed Interventor. With the biggest armed threat to Getúlio Vargas neutralized, our coup is almost guaranteed!"
 bra.pol.59.a:0 "Finally!"
 bra.pol.60.t:0 "Macedo Soares resigns the ministry"
 bra.pol.60.desc:0 "Only a few days before the concretization of the planned self-coup, Justice Minister José Carlos de Macedo Soares has asked for his resignation from the post. While he claimed that it was for health reasons, several people speculate that this has deeper reasons, such as his frequent disagreements with Vargas' more hardline supporters, for his \"soft\" treatment of leftists. There are aven those who speculate that perhaps he was really sick - but the reason for his malaise was taking part in such a nefarious coup..."
 bra.pol.60.a:0 "Was it really for health reasons?"
 bra.pol.61.t:0 "Armando de Sales tries his last move"
 bra.pol.61.desc:0 "At night, presidential candidate Armando de Salles Oliveira organized a meeting in his house with the most prominent members of the UDB, aiming at discussing what looks like an inevitable self-coup by President Vargas. In an unprecedented move, he has written a manifest to the Brazilian nation, denouncing a maneuver by \"a few in order to make millions slaves\" and destroy democracy. \n\nThe UDB wishes to distribute the manifesto to officers and soldiers of the Brazilian Army and Navy, trying to galvanize the sympathy of democratic officers and botch the coup attempt. The document was also read in the National Assembly, and according to allied representative Batista Luzardo, its divulgation is already creationg a \"revolutionary atmosphere\" in the National Assembly. One thing is clear: we need to act fast."
 bra.pol.61.a:0 "He should be stopped!"
 bra.pol.62.t:0 "The coup"
 bra.pol.62.desc:0 "It is over. The Police Force of the Federal District has surrounded the National Assembly and suspended its functioning indefinitely. In the radio, President Vargas has announced the dawn of a new era, the \"New State\", inaugurated by a new Constitution, this time written solely by Francisco Campos, a friendly jurist and intellectual. Tomorrow, UDB conspirators, such as Armando de Salles and Artur Bernardes, will be arrested and likely exiled in the future."
 bra.pol.62.a:0 "Towards a New State"
 bra.pol.75.t:0 "The End"
 bra.pol.75.desc:0 "With the Army and the civil society so polarized, no one knows what can happen... Perhaps by killing himself, Vargas can calm down the spirits, giving an opportunity for everyone to reflect on the current situation. The suicide might become a huge trauma to our nation, but at least a trauma that inhibits hotheaded actions, so that Brazil doesn't fall into a spiral of strife and destruction. \n\nThere was no other way left."
 bra.pol.75.a:0 "[...] I leave life to enter History."
 bra.pol.77.t:0 "Armando de Sales calls for national unity"
 bra.pol.77.desc:0 ""
 bra.pol.77.a:0 "Curious"
 bra.pol.87.t:0 "The Generals discuss the Communist Threat"
 bra.pol.87.desc:0 "Minister of War João Gomes Ribeiro has just organized a meeting with other generals in order to discuss the fate of the revolting soldiers and of Brazil itself. It has been decided that all soldiers involved in the Communist Revolt should be immediately expelled and the collaborators harshly repressed, preferably by the creation of a National Security Tribunal. In the meeting, General Góis Monteiro stood out as demanding the abolishment of the 1934 Constitution, for it guarantees too many freedoms, which shall lead to anarchy. \n\nOne voice is out of tune with the military corporation, however. General José Pessoa, who experienced the Great War in France, is of the opinion that the Army should not interfere in these matters, which should be a responsibility of the civil leaders alone. Well, that might be foreshadowing a future split inside the Brazilian Military!"
 bra.pol.87.a:0 "Interesting"
 bra.pol.85.t:0 "Alceu Amoroso Lima calls for increased presidential powers"
 bra.pol.85.desc:0 "The prominent catholic intellectual Alceu Amoroso Lima has just published a column in the newspaper \"O Jornal\", where he claims that the 1934 Constitution should be revised in order the better fight the communist menace. He has also stated that Vargas \"is the man that Brazil needs to save itself from chaos and Soviet imperialism\". \n\nThe position he's defending is far from isolated, as several other newspapers, most prominently the Constitutionalist-affiliated \"O Estado de São Paulo\", have also been supporting greater repression against subversive elements."
 bra.pol.85.a:0 "Interesting"
 bra.pol.86.t:0 "Vargas' New Year Discourse"
 bra.pol.86.desc:0 "In his annual New Year speech, President Getúlio Vargas took advantage of the turbulent political climate to further propel the red scare. In his proclamation, he alerted the Brazilian people against the hatred and the viciousness of the communist hosts, saying that during the Intentona dozens of soldiers were massacred by their red companions while at sleep!"
 bra.pol.86.a:0 "We shall gather all our energies to fight the Soviet threat!"
 bra.pol.88.t:0 "The National Commission of Repressing Communism"
 bra.pol.88.desc:0 "Organized by Gaúcho representative Adalberto Correia, the \"National Commission of Repressing Communism\" was created to facilitate the repression against \"red\" elements. The aim of this parliamentary commission is to investigate any accusations linking Brazilian citizens with \"subversive activitites\", having the power to dismiss them from their offices and even arresting them if necessary. This measure will surely increase the discretionary capacities of the government, and make the centralization of power much easier."
 bra.pol.88.a:0 "Let's begin the Red Scare!"
 bra.pol.89.t:0 "Argument between the War Minister and Góis Monteiro"
 bra.pol.89.desc:0 "Góis Monteiro is no particular friend of his successor in the Ministry of War, João Gomes Ribeiro. Recently, Góis Monteiro has been spreading negative talks about João Gomes among his military colleagues, criticizing his moral conduct and inability to act. João Gomes, enraged, wrote a letter and sent to various regional commanders criticizing Góes' political ambition. How can one unify an Army that acts like that?"
 bra.pol.89.a:0 "These military men... Always fighting between themselves!"
 bra.pol.90.t:0 "Weapons shipment intercepted in Rio de Janeiro"
 bra.pol.90.desc:0 "A shipment of weapons, ammunition, and AA guns bought by the state of São Paulo was just intercepted by Federal forces at the port of Rio de Janeiro. The equipment, destined to arm the Public Force of São Paulo, is clearly inadequate to be used against bandits and criminals, and something tells us that São Paulo might be having second intentions. The shipment was ordered and authorized when João Gomes was still the Minister of War, and it seems that he was really condescending with Armando de Salles..."
 bra.pol.90.a:0 "Glad we dismissed João Gomes"
 bra.pol.91.t:0 "A last attempt at reconciliation"
 bra.pol.91.desc:0 "Few bonds in Brazil are stronger than those between fellow Gaúchos. Cultivated by years of military camaraderie as well as militancy inside the old PRR, the companionship between Getúlio Vargas and Flores da Cunha should be one to last. Here they are now, however, almost dragging the whole country into a civil war between the two. \n\nIn order to try to mend this strained relationship, as well as to settle the future of Brazilian politics, Osvaldo Aranha, a fellow Gaúcho and old fried, who has, like the other two, fought in the bloody Gaúcho civil war of 1932, returned from his embassy in Washington and organized a meeting between Flores and Vargas. The two old friends accepted the invitation and, unordinarily, treated each other very politely, with both trying to reach a settlement. Flores da Cunha even committed himself towards convincing Armando de Salles to give up his presidential candidacy, perhaps in favor of a more conciliatory option, such as Osvaldo Aranha himself. \n\nAs Vargas is definitely not making the things easier by openly encouraging dissidence among Flores' pary, this compromise is unlikely to materialize, but one cannot lose hope..."
 bra.pol.91.a:0 "There's no turning back, isn't it?"
 bra.pol.92.t:0 "Military Maneuvers in Rio Grande do Sul"
 bra.pol.92.desc:0 "Unordinarily, ten thousand soldiers of the Brazilian Army are practicing military maneuvers around the town of Nova Hamburgo (Rio Grande do Sul) as part of their annual training cycle. While training in the region is not unusual on itself, the Army has been enacting both defensive and offensive maneuvers, whose clear aim is not defending against an external enemy, but defending against an internal one. The internal threat in question is the Military Brigade of the state of Rio Grande do Sul, which might try to resist violently against our planned Federal Intervention."
 bra.pol.92.a:0 "Let's scare that caudilho!"
 bra.pol.93.t:0 "José Pessoa meets with oppositionist generals"
 bra.pol.93.desc:0 "Several Generals, fearful that Federal encroachment on Rio Grande do Sul might cause a civil war, have gathered at General José Pessoa's house, trying to discuss the situation. The group of Generals, with Getúlio's uncle Valdomiro de Lima among them, have signed a manifesto condemning our Army maneuvers in Rio Grande do Sul, and plan to send it to Minister of War Eurico Dutra. Right now, there is a very real possibility that the Army will split into two opposing factions..."
 bra.pol.93.a:0 "The army is beginning to show its internal fissures"
 bra.pol.94.t:0 "José Pessoa and Valdomiro Lima are arrested"
 bra.pol.94.desc:0 "Their disobedience will be punished! Generals Valdomiro de Lima and José Pessoa will be arrested for conspirating against the military hierarchy! While their arrests will only last for a few days, their ostracization might well serve as an example against insubordinate Generals."
 bra.pol.94.a:0 "Better keep their mouths shut next time"
 bra.pol.95.t:0 "Integralist rally ends in bloodbath"
 bra.pol.95.desc:0 "In another examplo of increasing political radicalization, an Integralist rally in the city of Campos (Rio de Janeiro) ended in bloodbath. While a local AIB leader was delivering a speech in front of the town hall, an armed group appeared and opened fire against the greenshirts, leaving a few dead and more than 100 wounded. While the perpetrators of the fusillade remain unclear, Integralist leaders have blamed the city police."
 bra.pol.95.a:0 "Worrying"
 bra.pol.96.t:0 "President Vargas watches an Integralist demonstration"
 bra.pol.96.desc:0 "For the first time, President Getúlio Vargas has watched an Integralist parade, whose route passed just in front of the Guanabara Palace, where the President and his family reside. Hundreds of Greenshirts marched in this ostentatious rally, which Vargas silently watched from a window in the official residence. \n\nWhat made that day special, however, wasn't the rally itself, but what came after. A few hours later, Plínio Salgado, the Integralist \"chefe\", gave a radio pronouncement withdrawing his presidential candidacy in favor of Vargas' continuity in the Presidency. He also gave full support to Vargas in his fight against \"communism and anarchic democracy\", stating his support for profound constitutional changes."
 bra.pol.96.a:0 "So this is how liberty dies..."
 bra.pol.97.t:0 "UDB Manifesto reaches the barracks"
 bra.pol.97.desc:0 "Armando de Salles' letter, read yesterday in the National Assembly, is beginning to reach the barracks. The distribution of the manifesto must be halted at all costs and the coup must be accelerated, Minister of War Dutra says, or else he cannot guarantee that the army will remain loyal..."
 bra.pol.97.a:0 "Minister Dutra will stop this!"
 bra.pol.76.t:0 "The Other Menace"
 bra.pol.76.desc:0 "By now, it has become clear that the Red Menace is not the only threat we have face. There's another menace, much older and more persistent, that is the risk of national disintegration ny power-hungry \"Caudilhos\". \n\nJosé Antônio Flores da Cunha, naturally, is the most prominent of them, and while he has commited his forces to repressing dangerous communist elements, every day it becomes more obvious that he will never let the government advance with its centralizing agenda. The process of disarming the Military Brigade of Rio Grande do Sul, the biggest and best prepared in Brazil, will not be an easy task, and we will need to replace a lot of unwilling generals in the process."
 bra.pol.76.a:0 "National integrity shall be preserved!"
 bra.pol.80.t:0 "Antônio Carlos calls for moderation"
 bra.pol.80.desc:0 ""
 bra.pol.80.a:0 "Beautiful words"
 bra.pol.81.t:0 "Antônio Carlos meets with governors"
 bra.pol.81.desc:0 ""
 bra.pol.81.a:0 "He's sure to win"
 bra.pol.63.t:0 "The military starts to grow dissatisfied with the President"
 bra.pol.63.desc:0 "\"In my project of trying to centralize Brazil and destoying the centrifugal forces that corrupt the fabric of our nation, I had to create many antagonisms... But it looks like I wasn't able to solve them in due time\". \n\nIn order to eliminate regionalist warlords such as Flores da Cunha and destroying the internationalist menace, Getúlio Vargas had to empowered a sector of the Armed Forces that began an open confrontation with the federalist elements. The problem, however, was that he wasn't able to take decisive action in due time, so that not all pieces are in place for the Federal Intervention in Rio Grande do Sul. Right now, the Army is completely fissured, with one faction trying to guarantee national peace and the other trying to escalate the situation with Flores da Cunha. Too many antagonisms have been created, yet, the elections are approaching and a rushed coup right now could degenerate into a civil war... Perhaps, Vargas will find a way to avoid this upcoming civil conflict, a way that would calm down the spirits... At least for a while..."
 bra.pol.63.a:0 "Perhaps there's still one thing I can do to stop this civil war..."
 bra.pol.79.t:0 "Antônio Carlos resigns the presidency of the Assembly"
 bra.pol.79.desc:0 ""
 bra.pol.79.a:0 "As expected"
 bra.pol.73.t:0 "Góis demands action!"
 bra.pol.73.desc:0 "Some sectors of the Armed Forces, notably those around General Góis Monteiro, are beginning to get noticeably angry at the current state of affairs. There have been talks of a possible coup d'état, tansferring power from the civilian government to the Army. While these men have reason in disdaining João Gomes and Flores da Cunha, they seem to be thinking with their guts instead of their brains... Their talks have already caused discontent among federalist officers, and a civil war, or at least a coup, could be in the making... Perhaps, there's still one thing left for me to do to stop all this madness..."
 bra.pol.73.a:0 "Perhaps there is still a solution..."
 bra.pol.74.t:0 "Northern Governors approach Antônio Carlos"
 bra.pol.74.desc:0 ""
 bra.pol.74.a:0 "So be it"
 bra.pol.78.t:0 "The New President addresses the Brazilian Nation"
 bra.pol.78.desc:0 ""
 bra.pol.78.a:0 "Ordem e Progresso"
 bra.pol.67.t:0 "A Deal with Plínio Salgado"
 bra.pol.67.desc:0 "We share a lot of ideals with the AIB, even if we don't trust their leadership. Perhaps we can sign an agreement right now, in which they support Vargas' centralization of power and withdraw Plínio Salgado's candidacy, while we give them a voice in our future \"orderly\" government, preferably with Plínio Salgado as Minister of Education. Of course, though, we can always disrespect the pact on our end! "
 bra.pol.67.a:0 "Deal accepted"
