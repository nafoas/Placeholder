 #News events
 
 bra.news.1.t:0 "Getúlio Vargas reelected in Brazil"
 bra.news.1.desc:0 "Indirect elections were scheduled for day after the promulgation of the new Brazilian Constitution, and so it happened. With 175 votes against Borges de Medeiros, the second most voted candidate, who received 59 votes, Getúlio Vargas has managed to secure four more years as the country's Commander-in-chief."
 bra.news.1.a:0 "Interesting"
 bra.news.1.b:0 "Ordem e Progresso!"
 bra.news.2.t:0 "Communist Uprising Crushed in Brazil"
 bra.news.2.desc:0 "A revolutionary attempt was just put down in Brazil. Supported by the Brazilian Communist Party and the Comintern, infantry regiments from the cities of Natal, Recife and Rio de Janeiro, revolted on the 23rd, 24th and 27th of November, respectively, aiming at toppling the government. The upheaval was quickly destroyed by the legalist troops, which lost only a few soldiers, and the government is already preparing a repression against the revolutionary elements, who were shouting against \"imperialism, authoritarianism and the oligarchies\"..."
 bra.news.2.a:0 "Worrying"
 bra.news.3.t:0 "Getúlio Vargas found dead!"
 bra.news.3.desc:0 "The Brazilian President, Getúlio Vargas, was just found dead inside his bedroom at the Catete Palace, Rio de Janeiro. The body was found lying in his bed, with a gunshot - which came from Vargas' own revolver - near the heart, with suicide as the assumed cause of death. Apparently, Vargas was under extreme stress before commiting the act, being extremely pressured by the military and politicians alike, with the additional factor that his relationship with mistress had just been discovered by his wife, Darci Vargas."
 bra.news.3.a:0 "Suicide!?"
 bra.news.3.b:0 "Suicide!?"
 bra.news.4.t:0 "Getúlio Vargas closes the National Assembly"
 bra.news.4.desc:0 "On this day, Brazilian President Getúlio Vargas dissolved the National Assembly with the help of the Police Force of the Federal District. After the coup being denounced by the Brazilian opposition a few days earlier, Vargas and his supporters - the Army, the Integralists and friendly bureaucrats and industrialists - decided to speed up the \"revolutionary\" action. Besides closing the National Assembly, a new Constitution, the \"Polack\", replaced the 1934 one. The most prominent oppositionists, especially those affiliated to the Brazilian Democratic Union, such as Armando de Salles Oliveira and former president Artur Bernardes, have already been arrested or are on the way to be."
 bra.news.4.a:0 "Worrying"
 bra.news.5.t:0 "Armando de Salles Oliveira elected in Brazil"
 bra.news.5.desc:0 "Armando de Salles Oliveira, the oppositionist candidate to the Brazilian Presidency, has just managed to win the country's Presidential elections. With a liberal and technocratic discourse, he wishes to keep Brazilian federalism while modernizing the state apparatus."
 bra.news.5.a:0 "Para que o Brasil continue!"
 bra.news.6.t:0 "José Américo de Almeida elected in Brazil"
 bra.news.6.desc:0 "José Américo de Almeida, the official candidate to the Brazilian Presidency, has just managed to win the country's Presidential elections. With a popular and reformist discourse, he wishes to reduce the power of the Brazilian oligarchies and redistribute wealth while still mantaining the democratic system of governance."
 bra.news.6.a:0 "Interesting"
 bra.news.7.t:0 "Antônio Carlos Ribeiro de Andrada elected in Brazil"
 bra.news.7.desc:0 "Antônio Carlos de Ribeiro Andrada, the official candidate to the Brazilian Presidency, has just managed to win the country's Presidential elections. With a conciliatory and moderate discourse, he wishes to mend Brazilian political divisions while keeping the Federalist system and sanating the public finances."
 bra.news.7.a:0 "Interesting"
 bra.news.8.t:0 "The Minas Gerais Speech"
 bra.news.8.desc:0 "In an event on bord of the Brazilian battleship \"Minas Gerais\", Getúlio Vargas recited a speech which was seen by some observers as an act of Brazilian alignment with the Axis Powers. Criticizing political democracy as incompatible with \"economic democracy\" and exalting the political formulas of the \"future\", the speech is already considered concerning by the US Department of State."
 bra.news.8.a:0 "Worrying"
 bra.news.8.b:0 "I hope that will put fear on the Americans!"
 bra.news.9.t:0 "Integralist Uprising crushed in Brazil"
 bra.news.9.desc:0 "The Integralists, initially enthusiastic about Vargas' self-coup, have now changed their minds, after a few measures by the Brazilian President to limit the activity of political parties. In a bold attempt, around 30 Integralist rebels - with the help of the President's own guard - besieged the Guanabara Palace, where Vargas and his family reside, and cut off light and telephone lines. Armed solely with pistols, the President himself led a fierce resistance together with his relatives and loyal employees, sustaining a shooting for several hours until the Integralist forces finally fled."
 bra.news.9.a:0 "Worrying"

