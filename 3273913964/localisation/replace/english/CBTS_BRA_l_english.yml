 bra.pol.126.t:0 "Brazil reaffirms Continental Solidarity"
 bra.pol.126.desc:0 "Given the recent geopolitical situation that the World finds itself in, the Brazilian Ministry of Foreign Affairs has thought appropriate to reaffirm its stance towards Continental Solidarity. The basic lines of Brazilian foreign policy were defined as non-interventionism in European affairs and a commitment to Hemispheric defense. While Brazil will not join a conflict between European powers, it would not hesitate to fight if the security of the Americas is threatened, that is, if the USA is attacked."
 bra.pol.126.a:0 "Good"
