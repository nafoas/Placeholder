 #Decisions
 BRA_constituent_factions:0 "The Constituent Assembly"
 BRA_constituent_factions_desc:0 "The Constituent Assembly is roughly divided between two major factions, whose regionally-defined identities should not be mistaken for a lack of ideological affinity. The biggest faction, that of the representatives from the \"big states\", such as São Paulo, Minas Gerais, Rio Grande do Sul, and even Bahia, is usually united in the defense of classical liberal and federalist principles, as these wealthy states wish to preserve their power and autonomy. The other faction, that of the representatives from the \"small states\", such as Pernambuco, Paraíba and Rio Grande do Norte, usually support principles anthitetical to classical federalist ideals. This group, organized by the UCN and with strong roots in the Tenentist movement, fights for the centralization of power in the hands of the Federal Government, so that national politics cannot be abused by the wealthier, stronger \"big states\". If any of these factions becomes too influent during the writing, the Constitution will bear the clear demands of this group. If neither group becomes sufficiently powerful in order to dominate the Constitutional Debates, then our Constitution will be a compromise between the two parties. \n\nThe Big States have §Y[?BRA.BRA_big_states]§! Points of Influence.\nThe Small States have §Y[?BRA.BRA_small_states]§! Points of Influence."
