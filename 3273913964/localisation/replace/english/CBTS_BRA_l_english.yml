 #National Focus
 FOCUS_FILTER_BRA_CENTRALIZATION:0 "Centralize the State"
 BRA_create_the_desps:0 "Create the DESPS"
 BRA_create_the_desps_desc:0 "In order to deal with the increaingly tense political atmosphere, we shall subordinate the police force of the Federal District to the President himself. Attached to it, we will create the DESPS, a police force dedicated to silencing subversive and anti-national elements."
 BRA_weaken_the_tenentes:0 "Sideline the Tenentes"
 BRA_weaken_the_tenentes_desc:0 "The Tenentes have been an embarassment in the recent years in their subversion of military hierarchy, especially as some have even created their own militias, or \"Civic Legions\" as they put it. They must be sidelined for the good of national stability."
 BRA_name_armando_sales:0 "Appoint a new Paulista Interventor"
 BRA_name_armando_sales_desc:0 "The Paulista question has been a headache for many years, and it is now time to appoint an Interventor that would be a consensus among Paulista political elites. We've been informed that Armando de Sales Oliveira fits this requirement."
 BRA_elect_the_president_of_the_assembly:0 "Organize the Constituent Assembly"
 BRA_elect_the_president_of_the_assembly_desc:0 "The Constituent Deputies have already been elected, but the Assembly has not started working and we still lack a strong candidate to its Presidency. The most important requirements for this position are being from a big party, preferably from Minas Gerais, assuring that the debates go smoothly, and also someone who would support Vargas' reelection to the Presidency."
 BRA_begin_voting_the_constitution:0 "Begin Writing the Constitution"
 BRA_begin_voting_the_constitution_desc:0 "After 3 years of wait, the United States of Brazil will finally have a chance of elaborating its dignified Constitution! Let's not waste this opportunity"
 BRA_articulate_the_reelection:0 "Articulate the Reelection"
 BRA_articulate_the_reelection_desc:0 "New presidential elections are coming after the Constitution is promulgated and it is no secret that Getúlio Vargas wants to serve another term. It is imperative that we begin to articulate politically so that potential rivals are sidelined."
 BRA_defuse_the_military_conspiracy:0 "Defuse the Military Conspiracy"
 BRA_defuse_the_military_conspiracy_desc:0 "Góis Monteiro has not abandoned the possibility of running for the Presidency, and his clique of unruly Tenentes has not discarded an armed solution in order to achieve this goal. His name must be quickly discarded from the ballots of the Constituent Assembly, but we must avoid direct confrontation in doing so."
 BRA_promulgate_the_Constitution:0 "Promulgate the Constitution"
 BRA_promulgate_the_Constitution_desc:0 "The Constitution was already voted by the Assembly and can finally be put into effect!"
 BRA_begin_the_constitutional_government:0 "Begin the Constitutional Government"
 BRA_begin_the_constitutional_government_desc:0 "Although the Constitution of 1934 was voted democratically, some people, such as Vargas, think that it limits too much the power of the President. Let's hope this does not lead to another coup."
 BRA_grant_amnesty_to_revolters:0 "Grant Amnesty to Opposition Leaders"
 BRA_grant_amnesty_to_revolters_desc:0 "We are no longer under a state of exception. The oppositionists that were exiled in 1930 and 1932 must be granted amnesty and return to their home country."
 BRA_negotiate_with_the_constitutionalists:0 "Negotiate with the Constitutionalists"
 BRA_negotiate_with_the_constitutionalists_desc:0 "Although initially vowing to oppose Vargas' government, the Constitutionalist Party has grown more interested in taking part in the government. Granting them The Foreign and Interior ministries will suffice to seal this valuable alliance."
 BRA_discuss_the_1935_budget:0 "Prepare the 1935 Budget"
 BRA_discuss_the_1935_budget_desc:0 "Budget voting is traditionally a time when conflicts arise in the Parliament, and this year won't be an exception."
 BRA_control_class_representatives:0 "Control Class Representatives"
 BRA_control_class_representatives_desc:0 "While the intention of the Constituent Assembly was to give more voice to workers at the expense of the powerful southern states, our control over the unions will ensure that the class representatives work in our favor."
 BRA_national_security_law:0 "The National Security Law"
 BRA_national_security_law_desc:0 "The 'Lei de Segurança Nacional' (LSN), brainchild of the Paulista minister Vicente Rao, will make it easier to prosecute 'anti-Brazilian' agitators, such as the Communists. The opposition has already nicknamed it the 'Monster Law'."
 BRA_the_military_pay_debate:0 "The Military Pay Debate"
 BRA_the_military_pay_debate_desc:0 "The Army has been pressuring Vargas for quite some time to increase their wages. As the President himself is not in a position to deny it, but recognizes the gravity of our budget deficits, he will leave the law to the parliament and see if he can blame them for its eventual defeat."
 BRA_neutralize_dangerous_army_elements:0 "Neutralize Unruly Officers"
 BRA_neutralize_dangerous_army_elements_desc:0 "The recent parliamentary debate over military pay has evidenced some officers that are not willing to obey the military hierachy when their individual interests are threatened. These should be neutralized."
 BRA_outlaw_the_anl:0 "Outlaw the ANL"  
 BRA_outlaw_the_anl_desc:0 "The communists and their sister organization, the ANL, must be outlawed if Brazil wants to stay independent from the tyrqants of Moscow!"
 BRA_discuss_the_1936_budget:0 "Prepare the 1936 Budget"
 BRA_discuss_the_1936_budget_desc:0 "Last year's budget was the already the first major parliamentary conflict that this government had to endure. Growing political animosity indicates that this year's one will be even more complicated."
 BRA_approach_intellectuals:0 "Approach Prominent Intellectuals"
 BRA_approach_intellectuals_desc:0 "Intellectuals are well-tuned with international tendencies and as such are well qualified to lead the Brazilian culture and public debate. Minister of Culture Gustavo Capanema will invite many artists, such as poet Carlos Drummond de Andrade, to work closely with him and help renovate Brazilian culture."
 BRA_programa_nacional:0 "Programa Nacional"
 BRA_programa_nacional_desc:0 "We're entering the age of the great radio broadcasts. As such, we ought to create a radio program dedicated to informing the population of the big national events, showing the rightful perspective of the government, of course."
 BRA_iap:0 "Expand the IAPs"
 BRA_iap_desc:0 "The IAPs, or 'Institutos de Aposentadorias e Pensões', are pension schemes divided by occupational categories, whose funding is divided equally between workers, bosses and the government. The State should support the creation of more of these schemes, guaranteeing that all urban workers have access to their well-deserved retirement."
 BRA_extend_labour_legislation:0 "Extend the Labour Legislation"
 BRA_extend_labour_legislation_desc:0 "As Lindolfo Collor put it in 1930, the Labour Ministry should be the \"Ministry of the Revolution\" in that its prime objective is to improve the life of every worker. In that vein, Minister Agamemnon Magalhães will guarantee that new laws, such as insurance against work accident and unjustifiable dismissals, are passed."
 BRA_cangaco:0 "Fund Northern Police Forces"
 BRA_cangaco_desc:0 "For many decades, the northern states of Bahia, Sergipe, Alagoas, Pernambuca, Paraíba, Rio Grando do Norte have been plagued by banditry and brigandism in their countryside. We must fund their police forces in order to stabilize their frontiers."
 BRA_renegotiate_uk:0 "Further Renegotiate our British Debts"
 BRA_renegotiate_uk_desc:0 "While the Aranha Scheme has helped reducing our total debt, we need to further renegotiate them with the British, our biggest creditors, if we ever want to breathe again."
 BRA_destroy_unions:0 "Destroy Independent Unions"
 BRA_destroy_unions_desc:0 "As trade unions must be recognized by the government in order to be acknowledged, we can use this piece of legislation to root out potentially subversive and left-wing unions."
 BRA_declare_state_of_siege:0 "Declare State of Siege"
 BRA_declare_state_of_siege_desc:0 "The Communist Uprising has shown that we need a strong Executive in order to root out subversive and anti-national movements. Declaring State of Siege shall be our first step in this direction."
 BRA_dealing_with_flores_da_cunha:0 "Deal with Flores da Cunha"
 BRA_dealing_with_flores_da_cunha_desc:0 "Communism is not our only problem, as we also have to deal with the centrifugal tendencies of our caudilhos. Flores da Cunha, the best armed and most arrogant of the governors, must be dealt with if ever want to proceed with our dreams of political centralization."
 BRA_send_gois_to_the_south:0 "Send Góis Monteiro to the South"
 BRA_send_gois_to_the_south_desc:0 "In order to prepare the offensive against Flores da Cunha, we shall replace the current General Inspector of the 3rd Military Region (South) with Góis Monteiro, one of our most enthusiastically centralist Generals."
 BRA_divide_the_fug:0 "Divide the FUG"
 BRA_divide_the_fug_desc:0 "Vargas has many ancient ties with the members of the Gaúcho United Front, and as they seem, they are not happy with their current state of affairs with Flores da Cunha. Bringing some of their members to our side might reduce their opposition at the federal level, as well as increase the opposition inside their state."
 BRA_gois_monteiro_focus:0 "Empower Góis Monteiro"
 BRA_gois_monteiro_focus_desc:0 "The only man who has enough courage to confront Flores da Cunha directly is Góis Monteiro. Giving him the post of Chief of Staff will be an important step in fully disarming the Gaúcho militias."
 BRA_isolate_flores_da_cunha:0 "Besiege Rio Grande do Sul"
 BRA_isolate_flores_da_cunha_desc:0 "All the pieces are positioned, and Góis and Dutra only need a valid pretext to proceed with the Federal Intervention in Rio Grande do Sul. Flores da Cunha can count his last days!"
 BRA_he_ministry:0 "The Health and Education Ministry"
 BRA_he_ministry_desc:0 "To highlight the importance that our government and minister Capanema have been giving to culture and education, we will start building a new office to the ministry. This new building, a monumental Corbusian structure, will symbolize Brazil's abandonment of the old and embracement of the future."
 BRA_deport_foreign_subversives:0 "Deport Subversive Immigrants"
 BRA_deport_foreign_subversives_desc:0 "Some immigrants that come to Brazil are here to spread exotic ideologies and instill unrest among our christian workers. The special police will detect the dangerous elements and round them up."
 BRA_combat_tropical_diseases:0 "Combat Tropical Diseases"
 BRA_combat_tropical_diseases_desc:0 "It is well known by our specialists and intellectuals that tropical diseases are one of the obstacles that prevent Brazil's growth. We shall do what our predecessors should have done, and fund a proper sanitation campaign in the countryside."
 BRA_unib:0 "Found the Universidade do Brasil"
 BRA_unib_desc:0 "Continuing the project of Francisco Campos, we shall create the University of Brazil, aiming at centralizing and standardizing our superior education. This university, built in Rio de Janeiro, should compete directly with the atheistic and left-wing University of the Federal District." 
 BRA_approach_plinio:0 "Strike a Deal with the AIB"
 BRA_approach_plinio_desc:0 "The Integralists hold enormous power among some sectors of society, and their commitment to anti-communism and corporative government is undeniable. Perhaps we can convince their leaders with some empty promises and attract their indispensable help to our centralizing project."
 BRA_harden_the_lsn:0 "Harden the LSN"
 BRA_harden_the_lsn_desc:0 "The \"Monster Law\" is currently too lenient on subversive elements. We must also create new Constitutional devices to allow the President to concentrate more power."
 BRA_declare_state_of_war:0 "Declare State of War"
 BRA_declare_state_of_war_desc:0 "During the State of War, the President has to set which Constitutional Rights are suspended. In State of War, however, the President has to set which Rights are actually not suspended."
 BRA_arrest_leftist_representatives:0 "Arrest Leftist Representatives"
 BRA_arrest_leftist_representatives_desc:0 "Unfortunately, our National Assembly is full of socialists who openly collaborated with the ANL. The State of War allows us to persecute, even if there is no concrete proof of their involvement with the Communist Uprising."
 BRA_the_national_security_tribunal:0 "The National Security Tribunal"
 BRA_the_national_security_tribunal_desc:0 "Minister Vicente Rao has spoken in favour of creating a special tribunal to judge those prosecuted under the State of War. This tribunal, subordinated to Military Courts, will certainly give us more ability to arrest dangerous socialists."
 BRA_get_rid_of_andrada:0 "Compromise with Valadares"
 BRA_get_rid_of_andrada_desc:0 "If we want to proceed centralizing Brazil, we will need the support of Minas Gerais, the biggest state in the Federation. We can take advantage of its internal political divisions and earn the loyalty of th governor, Benedito Valadares, as his help won't come for free.."
 BRA_fabricate_the_cohen_plan:0 "Fabricate the Cohen Plan"
 BRA_fabricate_the_cohen_plan_desc:0 "The elections are coming, but the opposition has rallied behind Armando de Sales and blocked our last State of War motion. Perhaps we could find a way to force the Parliament to accept the State of Siege, and keep Vargas indefinitely in power..."
 BRA_national_coffee_dapartment:0 "Found the National Coffee Department"
 BRA_national_coffee_dapartment_desc:0 "Succeeding the National Coffee Council (CNC), the National Coffee Department (DNC) will make our coffee policy more permanent. Now, predetermined proportions of our national coffee produce will be bought and burnt by the government, bought and sold by the government, and freely commercialized by the private sector."
 BRA_centralize_forex_operations:0 "Centralize Foreign Exchange Operations"
 BRA_centralize_forex_operations_desc:0 "To avoid unnecessary currency speculation, all citizens should be required to sell and purchase foreign currency only from previously authorized establishments."
 BRA_curb_private_interest_rates:0 "Slash Agricultural Debts"
 BRA_curb_private_interest_rates_desc:0 "Brazilian farmers are burried in debt and their insolvency would cause many banks to go bankrupt. Two government measures - the Economic Adjustment Act and the Usury Act - will deal with reducing the amount of debt farmers owe to banks, while at the same compensating the financial institutions with special government bonds."
 BRA_set_a_legal_tender:0 "Set the Mil-Réis as Legal Tender"
 BRA_set_a_legal_tender_desc:0 "Since the abandonment of the Gold Standard, our currency has been in an uncertain position. In order to clarify this new monetary arrangement, we need to make sure that everyone accepts the new form of payment that is fiat money."
 BRA_renegotiate_aglo_american_debts:0 "The Aranha Scheme"
 BRA_renegotiate_aglo_american_debts_desc:0 "Before quitting the Ministry of Finance, Osvaldo Aranha elaborated a plan to restructure our international debt, involving the negotiation of substantial interest reductions. While our lenders will accept this as a preferable alternative to a moratorium, the scheme faces internal opposition from both the right, who sees it as unorthodox, and the left, believing it is not ambitious enough."
 BRA_liberalize_exports:0 "Liberalize our Exports"
 BRA_liberalize_exports_desc:0 "It was agreed that we reduce the foreign currency fees that we have been charging from our export sector. These measures were adopted in times of crisis, so it is clear that our renewed financial position will allow for it."
 BRA_found_the_CFCE:0 "Found the CFCE"
 BRA_found_the_CFCE_desc:0 "In accordance to international developments, we should use the state apparatus to make our economy more rationalized. The new Federal Council of Foreign Trade will serve this function, aiming to rationalize and expand our International Trade."
 BRA_sugar_and_alcohol_institute:0 "The Sugar and Alcohol Institute"
 BRA_sugar_and_alcohol_institute_desc:0 "To guarantee that our agriculture fully recovers, we should create new state institutions, such as the Sugar and Alcohol Institute, to subsidise the development of that sector."
 BRA_trade_agreement_usa:0 "Grant Most Favored Nation Status to the US"
 BRA_trade_agreement_usa_desc:0 "In exchange for tariff reductions for our agricultural goods, we have granted the Americans 'Most Favored Nation' status. We have to be careful though, as it might provoke a backlash among our industrialists."
 BRA_clearing_trade_germany:0 "German Compensation Trade"
 BRA_clearing_trade_germany_desc:0 "The Germans are desperately hungry for hard currency, and so are we. But unlike us, they are also extremely hungry for raw products, such as cotton and leather, which we have plenty. One option would be to use their precious Compensation Marks and import some German capital goods, though the US won't be happy."
 BRA_another_american_loan:0 "Strike a deal with the Americans"
 BRA_another_american_loan_desc:0 "The Americans want us to cease trading with the Germans without the use of hard currency, and are willing to compensate us for this loss."
 BRA_responding_to_the_american_crisis:0 "Dealing with the American Recession"
 BRA_responding_to_the_american_crisis_desc:0 "The new recession in America has left us with two options: should we default on our foreign obligations, as the Integralists and Socialists advocate, or should we keep paying them nonetheless?"
 BRA_default_on_our_international_debts:0 "Default on our External Debt"
 BRA_default_on_our_international_debts_desc:0 "With the new recession, our balance of payment has worsened considerably. If we are to continue with our plans of military modernization, we must default on our foreign debts, even if we are to renegotiate them on a later date. It might also be wise to tune down our coffee policy, for its costs are too high and the benefits uncertain."
 BRA_taurus:0 "Subsidise Taurus"
 BRA_taurus_desc:0 "We have agreed with the military to improve our national arms industry. As such, we will reach out to some Gaúcho manufacturers, who will, with some governmental benefits, build an arms forge."
 BRA_feneme:0 "Fábrica Nacional de Motores"
 BRA_feneme_desc:0 "Our industrial capacity is extremely low, and yet, we have to prepare for the coming war. We already have the plans set to create a state-private company dedicated to manufacturing airplane engines, the National Engines Factory!"
 BRA_forex_licenses:0 "Hard Currency Licenses"
 BRA_forex_licenses_desc:0 "In our more acute years of currency crisis, we managed to develop a system of hard currency lincenses, that were only granted to importers we deemed of national importance. We can now use the system as a form of protection, and we are sure our closest industrialists will approve..."
 BRA_create_the_sumoc:0 "Create the SUMOC"
 BRA_create_the_sumoc_desc:0 "We, unlike most civilized countries, don't have a Central Bank. As we are currently very far from having the means of creating one, perhaps it would be wise to form the 'SUMOC', an institution that could serve some of the purposes of a central banks and curb our rising inflation."
 BRA_inflationism:0 "Resort to Money Issuance"
 BRA_inflationism_desc:0 "Our rate of government spending can no longer be sustained solely by issuing bonds. We shall choose growth over price stability and start relying on seigniorage instead!"
 BRA_nationalize_business_insurance:0 "Nationalize Insurance Contracts"
 BRA_nationalize_business_insurance_desc:0 "In order to secure our economy from predatory foreign financial practices, we will create a state-owned rediscount bank and buy national insurance contracts that are currently owned by international institutions."
 BRA_developmentalist_economics:0 "Developmentalist Economics"
 BRA_developmentalist_economics_desc:0 "The Old Republicans were wrong when they naively tried to emulate the Anglo-Saxon model of economic development. A country like Brazil needs a strong state to guide our industrialization, or else it will remain agrarian forever."
 BRA_honor_our_obligations:0 "Honor our Obligations"
 BRA_honor_our_obligations_desc:0 "Instead of defaulting on our debts and tarnishing our national reputation, we could follow the examples of presidents Prudente de Morais and Campos Salles, who made an heroic effort to tighten the belts when the situation was difficult."
 BRA_float_our_currency:0 "Renew the Aranha Scheme"
 BRA_float_our_currency_desc:0 "The original Aranha Scheme was extremely successful in delaying our payment of debt interest, but the plan did not extend beyond 1938. Facing the prospects of moratorium once again, we must seek our creditors to negotiate an extension of the scheme."
 BRA_brazilian_central_reserve_bank:0 "A Brazilian Central Reserve Bank"
 BRA_brazilian_central_reserve_bank_desc:0 "Many times we tried to create a Central Bank, but were impaired by unforeseeable international developments. This time we should use the project drawn in 1931 by the prestigious British 'money doctor', Otto Niemeyer, and create a serious Brazilian Central Reserve Bank."
 BRA_modernize_our_financial_regulations:0 "Redraw our Financial Regulations"
 BRA_modernize_our_financial_regulations_desc:0 "If we are to truly modernize our financial system, a Central Bank will not suffice. Along with it we should put our financial regulations up to date."
 BRA_denationalize_coffee_policy:0 "Denationalize the Coffee Policy"
 BRA_denationalize_coffee_policy_desc:0 "The current coffee policy is costly and removes all autonomy from plantation owners, giving all decision power to the Federal Government. We should try a new arrangement, where the market is able to correct itself."
 BRA_modernizing_our_agriculture:0 "Import Agricultural Workers"
 BRA_modernizing_our_agriculture_desc:0 "Our estimates show that our agriculture is in dire need of manpower. Immigrants may prove to be the best option, even if they bring exotic ideologies with them, and as such, we need to adopt a more liberal immigration legislation,inspired on our own neighbors, Argentina."
 BRA_foreign_investments_in_infrastructure:0 "Attract Infrastructure Investments"
 BRA_foreign_investments_in_infrastructure_desc:0 "Our rate of rail construction has been depressingly low in the present decade. Perhaps we should turn to foreign investors to put us back on track.."
 BRA_cautious_modernization:0 "Cautious Modernization"
 BRA_cautious_modernization_desc:0 "Even if we disagree with those who say that Brazil's destiny is to remain agrarian forever, we cannot embrace the autarks on the other side either. One of Brazil's greatest traditions is its openness to the external world, and it would be foolish to shield our economy from all International influences."
 BRA_technocratic_corporatism:0 "Entrench Technocratic Corporatism"
 BRA_technocratic_corporatism_desc:0 "Giving one more step into increased economic planning, we will create more government agencies, such as the CNPIC, in order to further consolidate our industrial policy. These agencies shall be naturally led by the industrialists and financiers themselves, thus bringing the conflicts that may arise between these classes into the state."
 BRA_ctef:0 "Establish the CTEF"
 BRA_ctef_desc:0 "The Technical Council of Economics and Finance (CTEF), an organ attached to the Minister of Finance, will serve the much needed function of regulating state and municipal finances as well as centralizing foreign loans in the hands of the Federal Government. We will finally get away from the fiscal indiscipline that has been a rule in most Brazilian states since the Old Republic..."
 BRA_building_the_csn: "Build the CSN"
 BRA_building_the_csn_desc:0 "Brazil has significant reserves of iron ore but doesn't have the technology to make steel out of it. We shall make the dream of all Brazilian statesmen, since president Nilo Peçanha, come true and make our nation self-sufficient in steel production. But of course, we first need EXIMBANK to approve a loan to either our government or to businessmen in order to build it..."
 BRA_prepare_for_the_coming_storm:0 "Coordinate Economic Mobilization"
 BRA_prepare_for_the_coming_storm_desc:0 "The Coordenação da Mobilização Econômica (CME) will be a governmental agency aiming at preparing our economy for war. Now, the state should play an even bigger role in the economy, receiving many of the attributes of that of a planned economy, such as setting prices, regulating industries and fully controlling foreign trade. "
 BRA_cnp:0 "The National Oil Council"
 BRA_cnp_desc:0 "Following the objectives of the 1934 Constitution, we will create the Conselho Nacional do Petróleo (CNP), nationalizing all oil extraction in the country, even of that oil deposits that are still to be found. Private companies are still allowed to extract the black gold, but need authorization from the Union first."
 BRA_cnaee:0 "Conselho Nacional de Águas e Energia"
 BRA_cnaee_desc:0 "The National Council of Waters and Energy will be an organ destined to unifying all federal policies regarding the production and distribution of electric energy, especially hydraulic. Now we can proceed regulating the various privately-owned and disorganized hydroelectric power plants."
 BRA_vale_do_rio_doce:0 "Found the Vale do Rio Doce"
 BRA_vale_do_rio_doce_desc:0 "The State will proceed nationalizing our underground mineral deposits, and since, the concession to the British company Itabira Iron Ore should expire. We will nationalize their iron mines and explore them ourselves!"
 BRA_found_the_creai:0 "Found the CREAI"
 BRA_found_the_creai_desc:0 "Our agriculture and industrial sector suffer from a chronic lack of funding. For this reason, we should create the 'Carteira de Crédito Agrícola e Industrial' and offer loans to sectors which we find more appropriate."
 BRA_inter_american_coffee_agreement:0 "Sign the Inter-American Coffee Agreement"
 BRA_inter_american_coffee_agreement_desc:0 "The current geopolitical developments have given us much uncertainty regarding the coffee trade. We should sit with the US and other leading coffee-producing nations in Latin America and discuss this situation."
 BRA_war_profiteering:0 "War Profiteering"
 BRA_war_profiteering_desc:0 "We produce many goods that are of vital importance to nations at war. Meat, cotton and leather are all items that will prove of great value in the years to come."
 BRA_professional_schools:0 "Professional Agricultural Schools"
 BRA_professional_schools_desc:0 "Previous Brazilian governments have historically neglected the importance of professional education. If we want to truly become the breadbasket of the world, we need to improve the expertise of our agricultural workers."
 BRA_itamaraty:0 "Evaluate our Foreign Policy"
 BRA_itamaraty_desc:0 "Brazil has changed, but so did the rest of the world. We need to have a new diplomacy for the New Republic if we are to meet the challenges that lie ahead."
 BRA_afranio_de_melo_ministry:0 "The Afrânio de Melo Ministry"
 BRA_afranio_de_melo_ministry_desc:0 "Minister of Foreign Affairs Afrânio de Melo Franco is doing the necessary job of repositioning Brazil in South America. With conflicts arising between our neighboring nations - Paraguay and Bolivia, Peru and Colombia - as well as the rather aggressive attitude of our eternal enemies, Argentina, Brazil should aim at asserting its power as South America's foremost power!"
 BRA_plata_focus:0 "Focus on the Plata Basin"
 BRA_plata_focus_desc:0 "Since the Empire, our diplomats have been focusing on controlling the Plata basin in order to keep Brazil's high profile in South America. With conflicts ravaging our southern neighbors, Brazil has to show that it can keep up with the Imperial tradition and guarantee our shaking influence."
 BRA_chaco_neutrality:0 "Keep our Neutrality over the Chaco Dispute"
 BRA_chaco_neutrality_desc:0 "As much as it might be dangerous to let Paraguay expand on our borders, we cannot risk an open confrontation with their backers, Argentina. We'll stay out of their business, but watch closely."
 BRA_saavedra_lamas:0 "Ratify the Saavedra Lamas Treaty"
 BRA_saavedra_lamas_desc:0 "Argentina is a lot richer a better-armed than we are. As we cannot afford a continental war right now, perhaps it is best to guarantee peace in the Southern Cone and sign the Saavedra Lamas treaty."
 BRA_support_bolivia:0 "Discretely Support Bolivia"
 BRA_support_bolivia_desc:0 "While we have nothing against Paraguay itself, the country is sadly a little more than an Argentine puppet. We cannot allow our borders with Paraguay expand much, or else we will have little chance in a future war against Argentina."
 BRA_saavedra_lamas_no:0 "Ignore the Saavedra Lamas Treaty"
 BRA_saavedra_lamas_no_desc:0 "The Saavedra Lamas Treaty is a little more than an artifice from Argentina to solidify their complete control over the Plata basin. We shall not ratify the treaty, and will suggest Chile to follow our actions."
 BRA_chaco_peace_talks:0 "Offer to Help with Chaco Peace Talks"
 BRA_chaco_peace_talks_desc:0 "While it is clear that Bolivia has little chance of winning the war, we must ensure that Paraguay acquires as little territory as possible. We should also speed up our construction of the Northwestern Railway, so that it actually reaches Bolivia and gives it access to our ports."
 BRA_amazonia_focus:0 "Focus on the Amazon Basin"
 BRA_amazonia_focus_desc:0 "Brazil dominates most of the Amazon river, which is the only source of connection with our northern neighbors. In order to keep our international relevance, we have to show that we can mediate the conflicts just outside our Amazonian borders."
 BRA_leticia:0 "Mediate the Leticia Dispute"
 BRA_leticia_desc:0 "The war between Colombia and Peru is dangerously close to our borders. It is in our best interest to end it as soon as possible."
 BRA_andine_pact:0 "Meet with the \"Andine Bloc\""
 BRA_andine_pact_desc:0 "The \"Andine Bloc\" - Bolivia, Chile and Peru - have a common goal with us, that is, to hinder Argentinean expansionism. Let's together create a protection ring against the Viceroyalty!"
 BRA_first_blow:0 "Strike the First Blow"
 BRA_first_blow_desc:0 "Since the Paraguayan War, our statesmen have been warning us that our next war would be against Argentina. This hasn't happened until now, as neither had reasons to start a conflict. The situation has changed with their newly resurrected irredentism, as we will have to act preemtively."
 BRA_claim_misiones:0 "Claim Misiones"
 BRA_claim_misiones_desc:0 "As a peace-loving nation, we have no interest in Argentinean territory. Misiones, though, has great strategic relevance, which might make us reevaluate our previous policy..."
 BRA_reacting_internally:0 "Assess Foreign Ideologies"
 BRA_reacting_internally_desc:0 "The world today is full of curious ideological experiments - communism, fascism, nationalism, anarchism, liberalism, socialism - and Brazil needs to choose which path to follow."
 BRA_destroy_germanophilia:0 "Fight Germanophilia..."
 BRA_destroy_germanophilia_desc:0 "Sectors of the Brazilian government, including but not restricted to the Army, are worryingly Germanophile. In order to safeguard the US and the Allies that we offer no risk of joining the German sphere, we must persuade these sectors that approaching the Americans can offer us immense benefits"
 BRA_fascist_proselytizing:0 "...but allow Fascist Proselytizing"
 BRA_fascist_proselytizing_desc:0 "Even though we are not in the position to join the Axis, we cannot deny that Italy and Germany have inaugurated strong regimes that our government takes much inspiration from. Perhaps we could ignore some of the propaganda being disseminated by the Italian embassy..."
 BRA_integralist_uprising:0 "Take Advantage of the Integralist Uprising"
 BRA_integralist_uprising_desc:0 "The Integralist Uprising has created new international opportunities for us, for now Brazil can brand itself as a bastion against fascism and German encroachment!"
 BRA_minas_gerais_speech:0 "The Minas Gerais Speech"
 BRA_minas_gerais_speech_desc:0 "\"We don't march towards the demise of civilization, but to the beginning, tumultuous and fecund, of a new era!\"... \"No more to the improvident liberalisms, to the sterile demagogies, to the disorder-seeding personalisms...\""
 BRA_mixed_commission:0 "The Brazilian-American Mixed Commission"
 BRA_mixed_commission_desc:0 "According to our wishes, the Americans are setting the \"Joint Brazilian-US Military Commission\" in Rio de Janeiro, which will deal with all military problems concerning the defense of the American continent."
 BRA_lease_the_coast:0 "Lease our Ports"
 BRA_lease_the_coast_desc:0 "The War threatens the whole American continent. In order to keep our continental security, we have to make some concessions to the stronger Americans, such as giving their navy access to our coast."
 BRA_northeast_lease:0 "Give access to the Northeast"
 BRA_northeast_lease_desc:0 "The Brazilian Northeast has great strategic significance in South America, for its proximity to the \"Old World\". The Americans have demanded that we give them access to the region, for it shall serve as an air base to Africa and Europe."
 BRA_american_naval_mission:0 "Accept the American Naval Mission"
 BRA_american_naval_mission_desc:0 "Since we have a French military mission in place, he US has been pressing us to continue the NAval Mission that started in 1922. While it is not our biggest priority, we should accept this proposal."
 BRA_american_mission:0 "The American Army-Airforce Mission"
 BRA_american_mission_desc:0 "The French are no more. Right now, they are the only country that is able to offer us a military mission, and their army is not doing bad at all. Additionally, this can work well with our bigger tendency of American alignment."
 BRA_french_mission:0 "Extend the French Mission"
 BRA_french_mission_desc:0 "The French have the best army in the world, and since Gamelin came in 1919, a tradition of helping us improve our Armed Forces. It seems logical to further extend their current military mission to us."
 BRA_german_mission:0 "The New Hegemon"
 BRA_german_mission_desc:0 "The German legions have been impressing the world with their military prowess! Let us propose a German military mission to Brazil - and hope they accept it..."
 BRA_earn_our_recognition:0 "Earn our deserved recognition!"
 BRA_earn_our_recognition_desc:0 "Our Army is finally ready to face the Storm! Let us show the world what Brazil is capable of. A cobra vai fumar!"
 BRA_panamericanism:0 "Fully Embrace Pan-Americanism"
 BRA_panamericanism_desc:0 "Instead of looking to the autocratic regimes of Europe, let we stay where be belong! America is our natural ally, and we are their natural vicars for democracy in the South American continent!"
 BRA_economic_diplomacy:0 "Focus on Economic Diplomacy"
 BRA_economic_diplomacy_desc:0 "The end of the monarchy also marked the beginning of Brazilian economic diplomacy. While until now it was limited to the \"Coffee Diplomacy\", the recession we're in demands a more energetic approach."
 BRA_pragmatism:0 "Balance American Influence"
 BRA_pragmatism_desc:0 "Brazil is in the middle of a great game of imperialist powers, each one trying to extend its mandate over us. While there is no doubt that the US has a natural preponderance, perhaps it can be profitable to balance American influence with another power."
 BRA_new_partners:0 "Find New Trade Partners"
 BRA_new_partners_desc:0 "Several nations are willing to sign MFN trade agreements with us. These can help our economy in this time of low international trade opportunities."
 BRA_reduce_forex_controls:0 "Lift Foreign Exchange Controls"
 BRA_reduce_forex_controls_desc:0 "In response to the new American multilateral foreign policy instances, we have compromised to reduce our current exchange controls. This might prove costly, but it will certainly be a huge step towards global free trade."
 BRA_reduce_compensation:0 "Reduce our Dependency on Compensation Trade"
 BRA_reduce_compensation_desc:0 "The American have been tolerating our bilateral trade with Germany, even though it violates their diplomatic principles. With the war approaching, and the German ability to ship us goods and guns being limited, we should reduce our dependency on compensation trade and align with American trade doctrine."
 BRA_german_business:0 "Deepen our German Business Relations"
 BRA_german_business_desc:0 "Germany has shown the world that a country can openly confront international finance. Let us become independent from the retrograde imperialist powers of England and the US! We welcome German capital and goods!"
 BRA_hemispheric_free_trade:0 "Hemispheric Free Trade"
 BRA_hemispheric_free_trade_desc:0 "We currently have little room to further decrease our trade controls, but perhaps we can commit towards increasing continental trade in the following years. While it is unlikely that our neighbors will agree to this, one has to dream, right?"
 BRA_aranha_mission:0 "The Aranha Mission"
 BRA_aranha_mission_desc:0 "The American president has invited Oswaldo Aranha to take part in a conference in Washington. The aim of this meeting is to discuss Brazilian economic problems, with the expectation that they provide us credit in exchange for some policy concessions."
 BRA_krupp_contracts:0 "Krupp Contracts"
 BRA_krupp_contracts_desc:0 "With our recent foreign policy attitudes, it is unlikely that the US is willing to fund our new steel plant. The Germans have promised us a partnership with Krupp to build it, let's see if they were not bluffing..."
 BRA_the_second_rubber_boom:0 "The Second Rubber Boom"
 BRA_the_second_rubber_boom_desc:0 "The war in Southeast Asia has given us a new opportunity to reemerge as a leading rubber producer, like we were during the 19th century."
 BRA_cult_of_caxias:0 "Establish the Cult of Caxias"
 BRA_cult_of_caxias_desc:0 "Since the Revolution, we have enacted a series of reforms in order to restore the pride of the unmotivated Brazilian Army. We shall adopt military traditions and regalia from our Imperial past, the time of our greatest general, the Duke of Caxias! In that vein, we shall reform the uniforms of our cadets, making them similar to XIX century uniforms, and give each of them a miniature version of Caxias' saber!"
 BRA_discipline_the_cadets:0 "Discipline the Cadets"
 BRA_discipline_the_cadets_desc:0 "For too long have our cadets been idle and unruly. Colonel José Pessoa, commander of the Realengo Military Academy, will guarantee that each of them, even the veterans, are kept busy and away from trouble."
 BRA_organic_reforms:0 "Start the Organic Reforms"
 BRA_organic_reforms_desc:0 "The Revolutionary Government has committed itself towards modernizing and moralizing the Brazilian Army. In order to achieve that end, we must push for profound organizational and technical changes, professionalizing our recruits and officer corps based on the model of the French Military Mission."
 BRA_reform_the_estado_maior:0 "Reform the Estado Maior"
 BRA_reform_the_estado_maior_desc:0 "Until now, the General Staff has been a mere extension of the War Ministry. This must end, as the War Minister is a political-administrative role, and the Chief of the General Staff is a technical one!"
 BRA_staff_department:0 "The Army Staff Department"
 BRA_staff_department_desc:0 "In order to rationalize the Army Staff, we should create a special army department towards achieving that end."
 BRA_adm_department:0 "The Administrative Department"
 BRA_adm_department_desc:0 "Our army is in a state of administrative mess! Based on our lessons from the French Mission, we should create an army administrative department so that its finances and material are properly administered."
 BRA_technical_department:0 "Found the Technical Department"
 BRA_technical_department_desc:0 "Our army arsenals have been badly managed form too long. Based on our studies of the Franch Mission, we ought to professionalize its technicians so we can dream of becoming self-sufficient in ammunition and guns."
 BRA_reform_military_promotions:0 "Redraw Military Promotions"
 BRA_reform_military_promotions_desc:0 "Our high-ranking officers are a joke! Many of our Generals and Colonels are good sociologists, biologists and even gynechologists, everything but good soldiers! We must ensure that our officers are only promoted if they have the physical, intellectual and experimental requirements to do so."
 BRA_support_units:0 "Create New Support Units"
 BRA_support_units_desc:0 "War is changing fast, and so we must adapt to it. It is imperative that we create new support battalions, such as mechanical, reconnaissance and communicantion ones."
 BRA_gunpowder_arsenals:0 "Build New Gunpowder Arsenals"
 BRA_gunpowder_arsenals_desc:0 "Thanks to our reforms, our state arsenals are better-managed now, but there's still too few of them. We must build new plants, such as the Estrela Gunpowder Factory, in Rio de Janeiro, so that our forces are sufficiently equiped and state police forces are more dependent on federal supplies."
 BRA_nationalize_state_militias:0 "Nationalize State Militias"
 BRA_nationalize_state_militias_desc:0 "Some states, such as São Paulo, and especially Rio Grande do Sul, have large police and irregular forces, who sometimes are better-equiped than our federal army! If we are to prevent another civil war and keep professional standards, we must forbid regional forces from having artillery and armored cars, while also requiring them to be led by regular army colonels."
 BRA_autometralhadoras:0 "Esquadrão de Autometralhadoras"
 BRA_autometralhadoras_desc:0 "Mechanization and Motorization is the future! Captain Carlos Flores will create a new mechanized cavalry regiment, the Esquadrão de Auto-Metralhadoras, so that we can gain valuable expertise on this field."
 BRA_cimme:0 "Establish the CIMM"
 BRA_cimme_desc:0 "There's no use in acquiring modern vehicles and tanks if our officers don't know how to use them. In order to solve this problem, we will create the Centro de Instrução de Motorização e Mecanização (CIMM), a tank academy destined to intructing our soldiers."
 BRA_arms_purchases:0 "Massive Arms Purchases"
 BRA_arms_purchases_desc:0 "We don't have the means of producing high-quality military equipments ourselves, but our forces are terribly outdated. The fastest way of empowering them is to buy massive arms shipments from abroad, but this might deprive us from precious hard currency."
 BRA_italian_imports:0 "Italian Contracts"
 BRA_italian_imports_desc:0 "The Regia Marina has one of the most modern submarines and ships in the world. If the Italian Government accepts raw products instead of hard currency as means of payment, we can make a deal with them."
 BRA_french_imports:0 "French Contracts"
 BRA_french_imports_desc:0 "The French Army has been supplying us since the start of the French Military Mission, and unlike America and Britain, they do not oppose arms proliferation. Let's buy from them!"
 BRA_czechoslovak_import:0 "Czechoslovak Small-Arms"
 BRA_czechoslovak_import_desc:0 "Czechoslovakia is renowned for its military industry and small-arms production. We can make a deal with them if they accept barter."
 BRA_swedish_imports:0 "Swedish Imports"
 BRA_swedish_imports_desc:0 "Bofors AB is a large supplier of field and anti-aircraft guns. Those would be valuable in the possession of the Brazilian Army."
 BRA_american_imports:0 "Buy American Equipment"
 BRA_american_imports_desc:0 "The Americans were apprehensive of selling us military material because of our external financial position. This is no longer a problem, and thus there's no reason for them not to sell their state-of-the-art planes."
 BRA_british_imports:0 "Buy from the British"
 BRA_british_imports_desc:0 "The British have developed some of the most modern airplanes and battleship in existence. Now that war is approaching and they need strong allies, they will have to abandon their previous stance against weapons proliferation."
 BRA_german_imports:0 "Use German Guns"
 BRA_german_imports_desc:0 "The German war industry is now one of the most advanced in the world, and most importantly, we can use our accumulated compensation marks to buy their weaponry. Perhaps it is time for the Brazilian Army to sign a new contract with Krupp AG, like the one we had during the turn of the century. Why not?"
 BRA_reverse_engineering:0 "Reverse Engineering"
 BRA_reverse_engineering_desc:0 "With the human capital available in our newly-found military technical institutes, we will proceed to study foreign weapons, so that we can fabricate them ourselves!"
 BRA_national_security_council:0 "The National Security Council"
 BRA_national_security_council_desc:0 "The French have taught us that modern war means total war, and thus, we need to mobilize the entire society to deal with it. The Conselho de Segurança Nacional (CSN) will be created with the objective of regulating land concessions as well as industry establishment in frontier areas."
 BRA_our_place_in_the_world:0 "Our Place in the World"
 BRA_our_place_in_the_world_desc:0 "We have sent military attachés to the main imperialist powers in order to evaluate our place in the world. The current conjuncture puts us closer to the liberal nations, but as this may soon change, we need to further improve our doctrine of national security so that Brazil can survive the struggle of nations that will come."
 BRA_pessoa:0 "Implement Pessoa's Ideas"
 BRA_pessoa_desc:0 "Brigadier-General José Pessoa has proved itself as a great soldier, both as an organizer as a tactician. Learning from his experience in the Great War, such as the importance he saw in armored divisions, he will put us in the path of military glory!"
 BRA_gois_dutra:0 "Keep the Current Military Doctrine"
 BRA_gois_dutra_desc:0 "Modern war is total war, and as such, it is a war of careful planning and allocation of resources. We have learned this in 1932, when the Paulistas, fighting against a better-armed and more resourceful army, lost due to exhaustion. General Góis Monteiro believes that our army is not prepared enough to enact thrusting attacks, and we should focus on bleeding out and exhausting the enemy instead."
 BRA_mobile_divisions:0 "Lighten our Divisions"
 BRA_mobile_divisions_desc:0 "The Modern War is that of rapid attacks and flanking moves. The Brazilian Army divisions are currently too heavy and unfit for such maneuvers, and as such we need to adapt them."
 BRA_brazilian_tankists:0 "Reestablish Armored Batallions"
 BRA_brazilian_tankists_desc:0 "In 1921, Captain José Pessoa had established a company of assault cars after what he learnt in the Great War. After the Revolution of 1930, the company was disbanded, as its FT-17s were too old and costly to repair. With our recently bought tanks, however, it could be smart to reactivate the company."
 BRA_prepare_guanabara:0 "Prepare the Guanabara Bay"
 BRA_prepare_guanabara_desc:0 "The batteries of our capital, Rio de Janeiro, are extremely old, and can be even outreached by Argentine ships! If we are to protect the Guanabara Bay from the Germans - or worse - we need to set our new Krupp guns."
 BRA_igee:0 "Create the IGEE"
 BRA_igee_desc:0 "We need to guarantee that all our officers are well-educated, - and properly indoctrinated - so we should create the Inspetoria Geral de Ensino do Exército (IGEE). The IGEE will coordinate and fiscalize all military education, and our aim is to end up eliminating the need for civilian higher education for our soldiers altogether!"
 BRA_imt:0 "Instituto Militar de Tecnologia"
 BRA_imt_desc:0 "Under the benevolent influence of the United States, we should create the Instituto Militar de Tecnologia (IMT), so that our military can properly research and design war materials and industry."
 BRA_feb:0 "Establish the FEB"
 BRA_feb_desc:0 "We are finally ready for war in the European Theater, and thus we shall create the Brazilian Expeditionary Force under Brigadier-General Zenóbio da Costa."
 BRA_paratrooper_units:0 "Form Paratrooper Units"
 BRA_paratrooper_units_desc:0 "In accordance to international developments, and seeing the success of German and American Airborne operations, we should create new paratrooper brigades."
 BRA_aman:0 "Build the AMAN"
 BRA_aman_desc:0 "The Academia Militar de Agulhas Negras (AMAN) is the brainchild of José Pessoa and was originally designed to be built in 1933. Far from the political agitation of Rio de Janeiro, the Federal Capital, where our current military academy is, our cadets should be moved to Resende, a city in the Fluminense countryside. Now our recruits will finally have the chance to exercise and focus on military matters in peace!"
 BRA_conquest_of_the_air:0 "The Conquest of the Air"
 BRA_conquest_of_the_air_desc:0 "Getúlio Vargas is a great proponent of aviation, both military and civilian, and as such, he replaced trains with airplanes as the presidential means of transportation. Other visionaries have noted that Brazil is an enormous, yet untamed country, and thus aviation can prove to be an excellent way of integrating the nation."
 BRA_regulate_air_companies:0 "Regulate Foreign Companies"
 BRA_regulate_air_companies_desc:0 "We will pass a law so that all foreign air companies operating in Brazil should employ all-Brazilian crews. That way, we will ensure that enough Brazilians have the required expertise to properly fly a plane."
 BRA_pilots_to_the_us:0 "Send our Pilots to the US"
 BRA_pilots_to_the_us_desc:0 "With our recent purchase of American planes, we will send our pilots to the US so they can learn how to operate our new weapons."
 BRA_columbaphile_confederation:0 "The Columbaphile Confederation"
 BRA_columbaphile_confederation_desc:0 "Many Brazilians are enthusiasts of messenger pigeons and as such their organizations should be recognized by the Armed Forces. Pigeons might prove to be an excellent way of military communication!"
 BRA_fab:0 "Establish the FAB"
 BRA_fab_desc:0 "Thanks to the help of our foreign benefactors, we can finally for an independent airforce, separated from tha Army and the Navy."
 BRA_separated_airforces:0 "Keep the Airforces Separated"
 BRA_separated_airforces_desc:0 "There's no real reason for us to create an independent airforce, as our number of planes is currently laughable. Establishing one would prove to be nothing more than a political maneuver with the goal of satisfying political interests!"
 BRA_assess_the_navy:0 "Assess the Navy"
 BRA_assess_the_navy_desc:0 "Our navy is extremely outdated, even in comparison with our neighbors, such as Agentina. This has to change now if Brazil wishes to survive amidst the struggle of nations!"
 BRA_salvage_what_we_can:0 "Salvage what we can"
 BRA_salvage_what_we_can_desc:0 "While we recognize the importance of the navy, we don't have the means of rebuilding it from ground up. Let's use what we have, and use it in the best manner possible."
 BRA_naval_glory:0 "Restore our Former Glory"
 BRA_naval_glory_desc:0 "The Brazilian Navy is a mere shadow of what it was 30 years ago. We left the Paraguayan War as the uncontested naval power of the South Atlantic, and yet our ships are now outdated and our officers are unmotivated. Reestablishing maritime supremacy will be costly, but it might prove useful in the years to come."
 BRA_destroyer_lease:0 "Lease Destroyers from the US"
 BRA_destroyer_lease_desc:0 "We will sign an agreement to lease 6 outdated destroyers from the US Navy. While they aren't much by themselves, it might put us in a position of sea dominance over our South American neighbors."
 BRA_submit_to_the_usn:0 "Submit to the US Navy"
 BRA_submit_to_the_usn_desc:0 "Even with our recent efforts, we haven't be able to set a proper navy. If we wish to keep our homeland secure, we must submit our ships to the much stronger US Navy."
 BRA_anti_submarine_warfare:0 "Anti-Submarine Warfare"
 BRA_anti_submarine_warfare_desc:0 "The Germans and Italians have offended the Brazilian Homeland by sinking our merchant vessels. We'll show them what we are capable of!"
 BRA_south_atlantic_ops:0 "South Atlantic Operations"
 BRA_south_atlantic_ops_desc:0 "Together with the Americans, we will perform various defensive operations in the South Atlantic, so that we can gain valuable naval experience."
 BRA_naval_arsenal:0 "Expand the AMRJ"
 BRA_naval_arsenal_desc:0 "The Naval Arsenal of Rio de Janeiro is an old and poud institution. We need to build an extension of it at \"Ilha das Cobras\"."
 BRA_modernize_naval_code:0 "Modernize our Naval Code"
 BRA_modernize_naval_code_desc:0 "Our naval codes are more or less the same since the fateful \"Revolt of the Lash\" in 1910. We need to modernize them if we are to avoid having another uprising like this one agsin."
