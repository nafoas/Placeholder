#Ideas

LAT_welfare_state:0 "Welfare State"
LAT_welfare_state_desc:0 "Latvia, like its Baltic neighbors in Scandinavia, is a well developed welfare state. Dominated by a strong agricultural based economy, Latvia escaped the Great Depression almost unscathed and thus stands out among Europe for its high standards of living backed by large amounts of investments in welfare benefits. Some elements in the government disagree with this policy due to its high budget costs, but overall these policies are extremely popular among the majority of the populace."
LAT_prospering_agriculture:0 "Prospering Agriculture"
LAT_prospering_agriculture_desc:0 "Latvia has a prospering agricultural sector which stands in contrast to many of its neighbors. Despite being modern and industrial, Latvia still owes a lot of its income to its agricultural exports which is backed by a very opportune position in the Baltic Sea. Some elements perceive dangers in a long term reliance on agriculture and seek further industrialization, though this is opposed by the farmers who make up a large part of the electorate and the government."
LAT_nationalist_army_loyalties:0 "Nationalistic Army Loyalties"
LAT_nationalist_army_loyalties_desc:0 "It is widely believed that the military holds unspoken loyalties to more nationalistic elements within the government. Some have pointed the finger at strongman Kārlis Ulmanis, while others have suspected sympathies towards groups like the Pērkonkrusts. While some have claimed it is just natural and even good to have a nationalistic military, others consider these sympathies to be a serious threat to Latvian democracy. Only time will tell what this really means."

