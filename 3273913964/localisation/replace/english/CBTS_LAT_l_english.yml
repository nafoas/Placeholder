#events

lat_internal.2.t:0 "Latvian Coup of 1934"
lat_internal.2.d:0 "The 1934 Latvian coup d'état, known in Latvia as the May 15 Coup or Ulmanis' Coup, was a self-coup by the veteran Prime Minister Kārlis Ulmanis against the parliamentary system in Latvia. On the night of May 15–16 Ulmanis, with the support of Minister of War Jānis Balodis and the paramilitary Aizsargi organization took control of the main state and party offices, proclaimed the State of War in Latvia, suspended the Constitution, dissolved all political parties and the Saeima (parliament). Ulmanis then established an executive non-parliamentary authoritarian regime in which he ruled as the Prime Minister. Laws continued to be promulgated by the acting government. The incumbent President of Latvia Alberts Kviesis, who was from Ulmanis Latvian Farmers' Union, accepted the coup and decided to serve out to the rest of his term."
lat_internal.2.a:0 "There goes another European democracy"

lat_internal.3.t:0 "Army Coup Prevented"
lat_internal.3.d:0 "Thanks to our recent army reforms we've managed to remove nationalist infuance from our military, preventing any hostile actions against our democratic goverment."
lat_internal.3.a:0 "Many democracies fall in the face of chaos...But not this one! Not today!"

lat_internal.4.t:0 "Latvian Presidental Elections"
lat_internal.4.d:0 "The term of our president ends, it is the time to choose new president of Latvia"
lat_internal.4.a:0 "I guess the final result won't suprise anyone"

