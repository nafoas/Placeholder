 ##Politics
 GEO_2RCW_Politics_Start:0 "The Second Republic"
 GEO_2RCW_Politics_Start_desc:0 "The legacy of the first Georgian Democratic Republic is shown by the great zeal of our troops. Our people rejoice at the possibility of a Free Georgia, and have placed their trust in the Menshevik Government. Thus, we must deliver."
 GEO_2RCW_Freedom_of_Expression:0 "Freedom of Expression"
 GEO_2RCW_Freedom_of_Expression_desc:0 "All restrictions on speech, peaceful assembly, and press shall be lifted immediately. Georgians shall be encouraged to engage in open political discussion in order to foster Democratic Traditions."
 GEO_2RCW_Freedom_of_Religion:0 "Freedom of Religion"
 GEO_2RCW_Freedom_of_Religion_desc:0 "Georgians will no longer be discriminated against based on their religious beliefs. The days of Soviet State Aethism are over, and the Georgian Orthodox Church, along with other smaller religious groups, will be allowed to operate once more."
 GEO_anger_conservatives:0 "§RBy going down this path we risk alienating the Traditionalists!§!"
 GEO_anger_radicals:0 "§RBy going down this path we risk alienating the Radical Mensheviks!§!"
 GEO_2RCW_Menshevik_Program:0 "The Menshevik Program"
 GEO_2RCW_Menshevik_Program_desc:0 "The Mensheviks represent True Marxist Principles: Equality and Democracy, which the Bolshevik savages have betrayed several times over. Only the Mensheviks can rectify this error, as if we let the Nationalists poison our program, it will only serve to doom Georgia!"
 GEO_2RCW_Compromise:0 "The Conservative Compromise"
 GEO_2RCW_Compromise_desc:0 "In order for Georgia to survive, we must cooperate with the Traditionalist politicians. In the Georgians' time of need, we cannot divide the country with political strife."
 GEO_2RCW_Municipal_Councils:0 "Local People's Councils"
 GEO_2RCW_Municipal_Councils_desc:0 "Municipal Councils must be set up to ensure that our towns and villages are able to function politically, rather than be abandoned by Tbilisi."
 GEO_2RCW_Ethnic_Autonomy:0 "Ethnic Councils"
 GEO_2RCW_Ethnic_Autonomy_desc:0 "Creating special People's Councils for certain Ethnic Regions should help to give Abkhazians and Ossetians a positive opinion of our government." 
 GEO_2RCW_Negotiate_With_Nationalists:0 "Negotiate with Nationalists"
 GEO_2RCW_Negotiate_With_Nationalists_desc:0 "Abkhaz and Ossetian Nationalist groups have been slowly forming and growing in number ever since the re-legalization of political freedoms. We must negotiate with the more radical groups in order to assure that our Nation is not broken apart by toxic separatism."
 GEO_2RCW_Commitment_to_Marxism:0 "Commitment to Marxism"
 GEO_2RCW_Commitment_to_Marxism_desc:0 "Our Democratic Reforms have shown that we are truly committed to the ideals of Marxism. The Mensheviks have proven that Marxist Social Democracy really does serve the people!"
 GEO_2RCW_Womens_Rights:0 "Enact Gender Equality"
 GEO_2RCW_Womens_Rights_desc:0 "The First Republic managed to enact laws granting Women equal rights with Men. We must do the same!"
 GEO_healthcare_start:0 "Healthcare Initiatives"
 GEO_2RCW_Tbilisi_Healthcare:0 "Healthcare Initiatives"
 GEO_2RCW_Tbilisi_Healthcare_desc:0 "Although we do not have the infrastructure to bring State Healthcare to the entire country right now, we can begin some initiatives in the larger Municipalities."
 GEO_public_education:0 "Public Education"
 GEO_2RCW_Public_Education:0 "Public Education Programs"
 GEO_2RCW_Public_Education_desc:0 "It is our responsibility to guarantee our citizens a real education. Soviet Propaganda will be eliminated, but we must ensure that the next generation of Georgians are educated!"
 GEO_2RCW_Constituent_Assembly:0 "Organize the Assembly"
 GEO_2RCW_Constituent_Assembly_desc:0 "The Constituent Assembly will be the Lower House in the Government. It will be directly elected, and responsible for introducing legislation."
 GEO_2RCW_Independent_Judiciary:0 "Establish an Independent Judiciary"
 GEO_2RCW_Independent_Judiciary_desc:0 "It is imperative that our Judiciary is independent from any political partisanship. The Soviet Dictatorship has already proved this."
 GEO_2RCW_Senate:0 "Create the Senate"
 GEO_2RCW_Senate_desc:0 "Our Legislative Upper House, the Senate will be a directly elected body with the power of veto. It will also be an advisory board for the Cabinet, if necessary."
 GEO_2RCW_First_Election:0 "The First Election"
 GEO_2RCW_First_Election_desc:0 "Our reforms are sufficient to elect a Constituent Assembly and a Senate to represent the People of Georgia. There are numerous political groups available to choose from, and we wonder what the results will be..."
 GEO_2RCW_Provincial_Governors:0 "Provincial Governors"
 GEO_2RCW_Provincial_Governors_desc:0 "We will appoint Provisional Provincial Governors to ensure that order is kept. Once the war is over, we can create Democratically Elected Councils."
 GEO_2RCW_Equality_for_Minorities:0 "Equality for Minorities"
 GEO_2RCW_Equality_for_Minorities_desc:0 "Although the most Hardline Traditionalists still refuse to guarantee the Abkhaz and Ossetian populations equality, our agreement with the Moderate Traditionalists would give them equality under the law, but not autonomy."
 GEO_2RCW_Crush_Nationalists:0 "Crush Radical Separatists"
 GEO_2RCW_Crush_Nationalists_desc:0 "Although some Mensheviks belive that Radical Separatist groups can be negotiated with, the Traditionalists would refuse to endorse such an agreement. Therefore, these groups must be banned and their leaders must be imprisoned."
 GEO_2RCW_Table_Gender_Equality:0 "Postpone Gender Equality"
 GEO_2RCW_Table_Gender_Equality_desc:0 "Although Gender Equality is an important point of our Program, we would not be able to pass it without risking our coalition. Therefore, it shall be a priority after the War, but will remain ambigious for now."
 GEO_2RCW_The_Great_Promise:0 "The Great Promise"
 GEO_2RCW_The_Great_Promise_desc:0 "Although we cannot push through our most radical reforms yet, we can at least promise to push them through after the war. All we need is the backing of the people!"
 GEO_2RCW_Tone_Down_Rhetoric:0 "Tone Down Marxist Rhetoric"
 GEO_2RCW_Tone_Down_Rhetoric_desc:0 "Although we are still a Marxist Party, we should not emphasize the Marxist portions of our program to avoid making the Traditionalists uncofortable. The Hardline Mensheviks, of course, will not appreciate this choice."
 ##economics
 GEO_2RCW_Economics_Start:0 "Making Something out of Nothing"
 GEO_2RCW_Economics_Start_desc:0 "The chaos that has engulfed Georgia has greatly impacted our economy. Factories have been left empty, and the fields are left untended. Our problems are further compounded by the stain of collectivization left by the Bolsheviks. The situation is... not good, but this also provides us with a golden opportunity for reform. With hard work, some luck, and preferably a mountain load of cash, we can create a functional economy."
 GEO_kickstart_the_economy:0 "Kickstart the Economy"
 GEO_kickstart_the_economy_desc:0 "In order to maximize the effectiveness of our economy and military, the Ministry of Economic Development has decided that all our presently available economic assets should be mobilized for the war effort. To win our independence, our brave soldiers must be fed, and they must be armed."
 GEO_begin_decollectivization_of_the_nation:0 "Begin Decollectivization"
 GEO_begin_decollectivization_of_the_nation_desc:0 "The collectivization of Georgia, to put it lightly, was an economic and social travesty inflicted upon us by the Godless bolsheviks. Thus, it is high time we end collectivization and create a proper economy! It will be difficult, but it is necessary to ensure the future prosperity of Georgia."
 GEO_emergency_factory_conversion:0 "Emergency Factory Conversion"
 GEO_emergency_factory_conversion_desc:0 "In order to ensure that our land forces are properly supplied, the Ministry of Economic Development has decided to appropriate several factories, and utilize them for military equipment production. While we will have to sacrifice some factories for the war effort, this is considerably cheaper compared to constructing brand new factories."
 GEO_take_loans:0 "Take Loans"
 GEO_take_loans_desc:0 "Given our sudden declaration of independence, and the ongoing war, it is unsurprising that our coffers are rather empty. Fortunately, there are quite a few foreign banks and governments willing to loan us money. Of course, we will have to eventually pay these loans back, but that can left for after we win our independence!"
 GEO_choosing_an_economy_minister:0 "The Economomic Minister Debacle"
 GEO_choosing_an_economy_minister_desc:0 "Recently the Traditionalists have begun pressing for the removal of the current Minister of Economic Development, Evgeni Gegechkori. Gegechkori is an adamant Menshevik, and plans to pursue a socialist economic policy. This is apparently unacceptable for the Traditionalists, who denounce Gegechkori as “no better than the Bolsheviks.” In his stead, the Traditionalists have put forward Aleksandre Asatiani, who supports more liberal economic policies. Whether Gegechkori stays, or Asatiani replaces him will most likely determine the economic policy of Georgia, for the near future at least."
 GEO_socialist_minister:0 "A Socialist Minister"
 GEO_socialist_minister_desc:0 "Despite Traditionalist protests, Gechkori has retained his position as Minister of Economic Development! He will now pursue a socialist economic policy, employing ideas of the First Republic and the socialist parties of Europe."
 GEO_conservative_minister:0 "A Conservative Minister"
 GEO_conservative_minister_desc:0 "Thanks to Traditionalist efforts, Astiani has been appointed as Minister of Economic Development! He will now pursue a liberal economic policy which many Traditionalists claim make Georgia a modern European nation!"
 GEO_institute_price_controls:0 "Institute Price Controls"
 GEO_institute_price_controls_desc:0 "To ensure that goods are affordable for even the most destitute of the population, the Economics Ministry will implement price controls for many basic goods. Some of the Traditionalists may complain, but this is for the greater good of the country."
 GEO_tax_reform:0 "Tax Reform"
 GEO_tax_reform_desc:0 "In order to create a more equal economy and society, the Ministry of Economic Development has decided to implement several tax reforms, the most notable being the implementation of progressive taxation. These reforms will be crucial steps towards building a modern Georgia!"
 GEO_encourage_unionism:0 "Encourage Unionism"
 GEO_encourage_unionism_desc:0 "To ensure that the laborers of our country receive proper pay and support from their employers, the government will encourage the creation of new labor unions. So while the Bolsheviks oppress and enslave, we will fight for the rights of the working class!"
 GEO_create_cooperatives:0 "Create Cooperatives?"
 GEO_create_cooperatives_desc:0 "Within the government there has been debate over the creation of cooperatives. The Mensheviks argue that cooperative ownership would allow every Georgian to achieve prosperity, while the Traditionalists argue that cooperative ownership is just another term for the collectivization. Whether or not cooperative ownership will be implemented remains to be seen."
 GEO_national_work_programs:0 "National Work Programs"
 GEO_national_work_programs_desc:0 "To ensure that almost everyone is properly employed, the Ministry of Economic Development has created a series of work programs that will create employment opportunities, and foster economic development."
 GEO_allow_private_investment:0 "Allow Private Investment"
 GEO_allow_private_investment_desc:0 "By allowing private investment within our nation, we will create conditions that will allow capital to flow into Georgia. Of course, it might be difficult to find willing investors under these conditions..."
 GEO_railway_expansion:0 "Railway Expansion"
 GEO_railway_expansion_desc:0 "Expanding the existing Georgian railway network will be an excellent way to increase the rate at which we are able to transport troops, and resources."
 GEO_expand_the_industry:0 "Expand the Industry"
 GEO_expand_the_industry_desc:0 "Using our currently available resources, we will be able to expand Georgia’s existing industrial complexes. This will benefit us in the short term, as well as in the long term."
 GEO_build_arms_factories:0 "Build Arms Factories"
 GEO_build_arms_factories_desc:0 "The Ministry of Economic Development has set forward a plan to construct additional arms and munitions factories. Even if we have no outside sources supplying us with military aid, a sizable domestic arms industry will allow us to properly supply our army."
 GEO_exploit_mineral_wealth:0 "Exploit Mineral Wealth"
 GEO_exploit_mineral_wealth_desc:0 "Georgia is blessed with a bounty of mineral wealth. Thus, the Ministry of Economic development has decided to expand and create new mining projects. The increased flow of natural resources will prove useful for supplying our factories, and for foreign export."
 GEO_implement_modern_agricultural_methods:0 "Modern Agricultural Methods"
 GEO_implement_modern_agricultural_methods_desc:0 "Implementing modern agricultural methods in Georgia will be an effective method in boosting agricultural output, and will significantly lower the probability of famine."
 GEO_purchase_farm_equipment:0 "Purchase Farming Equipment"
 GEO_purchase_farm_equipment_desc:0 "No longer will plows be pulled by oxen. By purchasing mechanized agricultural equipment, Georgia will at last have fully modern agriculture!"
 GEO_tbilisi_senaki_highway:0 "The Tbilisi Senaki Highway"
 GEO_tbilisi_senaki_highway_desc:0 "As part of the Ministry of Economic Development infrastructure plan, a road will be built that will run through Central Georgia. Upon completion, this road will be dubbed the Tbilisi-Senaki Highway."
 GEO_loosen_trade_barriers:0 "Loosen Trade Barriers"
 GEO_loosen_trade_barriers_desc:0 "By loosening the trade barriers of our nation, we can begin to attract foreign businesses, and encourage them to invest in Georgia."
 GEO_attract_businesses:0 "Encourage Businesses" 
 GEO_attract_businesses_desc:0 "By encouraging both local and foreign via tax cuts and other business friendly reforms, the Ministry of Economic Development plans to make Georgia a center of trade in Caucasia and the Black Sea. Should we prove triumphant, this dream may be within our grasp..."
 GEO_destroy_the_vestiges_of_bolshevism:0 "Destroy the Vestiges of Bolshevism"
 GEO_destroy_the_vestiges_of_bolshevism_desc:0 "We must destroy the economic legacy of Bolshevism! All the lands must be privatized, all the regulations must be stripped away, and the country opened to the free market! The Mensheviks oppose such measures of course, but their understanding of economics is rather pitiful as it stands."
 GEO_foreign_investments:0 "Foreign Assistance"
 GEO_foreign_investments_desc:0 "Whether it be from banks, governments, or private individuals, we must acquire as much foreign aid as possible. Our benefactors will not regret assisting in the creation of an independent and economically liberal Georgia!"
 GEO_a_balanced_budget:0 "A Balanced Budget"
 GEO_a_balanced_budget_desc:0 "One of the main mistakes the ruling Mensheviks made during the time of the First republic was pursuing budget heavy policies without the economic backing to do so. We must ensure that this mistake is never again repeated. From now on, the Ministry of Economic Development will ensure that the money that flows into country is spent responsibly."

 #Military Tree 
 GEO_2RCW_Military_Start:0 "To Defend Our Nation"
 GEO_2RCW_Military_Start_desc:0 "Bolsheviks on one side, Russian nationalists on the other. Our enemies are powerful, numerous, and ruthless. The odds may be against us, but one thing is certain, we must defend our country. We must defend Georgia!"
 GEO_call_on_the_junkers:0 "Call on The Junkers"
 GEO_call_on_the_junkers_desc:0 "When Georgia first declared its independence, many Junkers, or officers, in exile flocked to their homeland’s aid. With their experience and insight, the Junkers will be put in charge of developing our newly created military."
 GEO_defensive_plans:0 "Defensive Plans"
 GEO_defensive_plans_desc:0 "With our limited resources, and Georgia’s mostly mountainous terrain, a defensive focus for our army would be wise. Our enemies may be more numerous and better equipped, but we shall make sure that any attempt to take our country will only lead to their ruin."
 GEO_neu_army_for_neu_nation:0 "The New Army"
 GEO_neu_army_for_neu_nation_desc:0 "The armies of the 20th century are evolving, and so we must evolve to. We must create a new kind of army, one that is flexibly and powerful enough to keep up with even the most daunting of foes."
#  GEO_engineering_brigades:0 "Engineering Brigades"
#  GEO_engineering_brigades_desc:0 "Creating and attaching engineering battalions to our armies will increase the proficiency of our land forces exponentially. The ability to quickly construct basic fortifications such as foxholes and trenches will be invaluable in a defensive and attritional war."
 GEO_establish_partisans:0 "Establish Partisans"
 GEO_establish_partisans_desc:0 "Establishing various partisan cells will open up another front against the enemy. Not only will the Russians have to contend with our regular forces, but from now on they will have to fight a costly guerrilla war."
 GEO_mountain_warfare:0 "Mountaineer Warfare"
 GEO_mountain_warfare_desc:0 "The Caucasian mountains are as massive as they magnificent. As such, many of our senior officers have supported the use of specialized mountain warfare to better exploit our country’s mountainous terrain."
 GEO_create_infantry_reserves:0 "Create Reserve Brigades"
 GEO_create_infantry_reserves_desc:0 "Some of the Junkers have suggested creating an infantry reserve, whose normally non-combatant members will be trained and organized so that, should the need arise, they will be ready to fight."
 GEO_anti_tank:0 "Invest in Anti Tank"
 GEO_anti_tank_desc:0 "Both the Bolsheviks and the revolting Russians are known to possess varying amounts of tanks and other armored vehicles. To better combat these, we should invest in anti-tank guns and stop these death machines in their tracks."
#  GEO_asymmetrical_warfare:0 "Asymmetrical Warfare"
#  GEO_asymmetrical_warfare_desc:0 "The guerrillas and partisans have proved themselves more than capable of fighting, pressuring, and terrorizing Georgia’s enemies. It is only logical that we invest more in our irregular forces which, working in tandem with our regular forces, will assure our victory!"
 GEO_let_them_come:0 "Let Them Come"
 GEO_let_them_come_desc:0 "Throughout its history, Georgia has fought numerous enemies. More often than not, they are far larger and more powerful, and they are bent on the conquest and destruction of our sweet homeland. This war is no different. The Russians, whether they be Bolsheviks or nationalists only desire the subjugation of our country, and our people. But they should know this, they can invade our nation all they like, but here they will only find sorrow and death. So let them come, here they will meet there grave."
 GEO_artillery_research:0 "Artillery Research"
 GEO_artillery_research_desc:0 "By studying foreign artillery we could start to design our own modern field guns. After all, if the quality of our artillery pieces is high, we won’t need that many."
 GEO_instill_discipline:0 "Instill Discipline"
 GEO_instill_discipline_desc:0 "Good discipline is essential for a modern and effective army. Unsurprisingly, many of the Junkers have supported increasing the disciplinary standards of our army. No doubt, it’s about time we whipped our soldiers into shape!"
#  GEO_implementation_of_bicycles:0 "Implement Bicycles"
#  GEO_implementation_of_bicycles_desc:0 "Some might laugh at the idea of using bicycles for military applications, but it is undeniable that they increase the mobility of infantrymen at relatively low cost."
 GEO_motorization_effort:0 "Motorization Effort"
 GEO_motorization_effort_desc:0 "A truly modern military requires motorization. The mobility of trucks, armored cars, and tanks allows an army to outmaneuver and overwhelm enemy forces. By purchasing military trucks, we can begin the process of building a modern, motorized, army."
 GEO_establishing_an_air_force:0 "Purchase Aircraft"
 GEO_establishing_an_air_force_desc:0 "One can simply not have a modern military without airpower. Military aviation revolutionized warfare during the early 20th century. Thus, by purchasing some outdated aircraft, we can jumpstart the creation of the Georgian Air Force!"
 GEO_no_chances:0 "No Chances"
 GEO_no_chances_desc:0 "Whether it be savage Bolsheviks, or perfidious Russian militarists, we cannot simply allow the enemy to waltz in and decimate our country. If anyone dares to set foot into this country, we will blast them into nothingness before they have a chance burn down a single village. We will give the enemy… no chances."
 GEO_call_for_recruits:0 "Call for Volunteers"
 GEO_call_for_recruits_desc:0 "With nationalistic fervor at all time highs, many members of the populace are eager to go and join the fight for independence. As such, now would be an opportune time to call for additional army volunteers."
 GEO_the_national_defense_academy:0 "The National Defense Academy"
 GEO_the_national_defense_academy_desc:0 "The Junkers are a competent bunch, but they will all inevitably leave service one way or another. Thus, it has been decided that a new officer school be established in Tbilisi. Named The National Defense Academy, this officer school will train the next generation of Georgian officers!"
 GEO_contined_doctrine_development:0 "Doctrinal Advancement"
 GEO_contined_doctrine_development_desc:0 "The efforts to advance the Georgian Army, and the numerous battles fought during the war have provided plenty new ideas, and battlefield experience respectively. We should utilize the insights we have gleamed from the war and our modernization efforts to advance our military doctrine."

 ##Foreign
 GEO_2RCW_Foreign_Start:0 "Looking Outwards"
 GEO_2RCW_Foreign_Start_desc:0 "We cannot only focus on ourselves during this war. There are a few countries sympathetic to our cause, and building relations with these nations will prove invaluable. We could also turn to our fellow Caucasian countries, though they’ve proven to be rather troublesome in the past."
 GEO_the_matter_of_foriegn_relations:0 "The Matter of Foreign Relations"
 GEO_the_matter_of_foriegn_relations_desc:0 "As a newly independent nation, our international recognition is rather limited. Thus, one of the first jobs of the Ministry of Foreign Affairs will be to build international recognition of Georgia."
 GEO_ask_the_french:0 "Ask The French"
 GEO_ask_the_french_desc:0 "After the Soviet invasion, many Georgian political exiles fled to French Republic. Perhaps the French government would be willing to support us in our fight for independence."
 GEO_ask_fra:0 "§YWe Will Request Guarantees From the French.§!\n"
 GEO_ask_the_poles:0 "Ask The Poles"
 GEO_ask_the_poles_desc:0 "During the Soviet occupation, many of the Junkers served in the Polish armed forces. The Poles have no love neither for the Bolsheviks, nor the Russian militarists. It is natural then, that we should approach them and request their support."
 GEO_ask_pol:0 "§YWe Will Request Guarantees From the Polish.§!\n"
 GEO_ask_the_germans:0 "Ask The Germans"
 GEO_ask_the_germans_desc:0 "The Germans are bitter enemies with the Soviets, and would be more than happy to see them be destroyed. Thus, it is likely that the German government will be willing to assist us in our war, should we approach them."
 GEO_ask_ger:0 "§YWe Will Request Guarantees From the Germans.§!\n"
 GEO_foreign_officers:0 "Foreign Officers"
 GEO_foreign_officers_desc:0 "If we request a military attaché from our benefactor, we can very easily gain a gold mine of military knowledge and experience, should they accept, that is."
 GEO_regional_diplomatic_outreach:0 "Caucasian Diplomacy"
 GEO_regional_diplomatic_outreach_desc:0 "By sending diplomatic envoys to our Caucasian neighbors, we can show that our intentions towards them are benign, and that we only seek friendship and peace among us."
 GEO_gib_friends: "§GWe Will Send Diplomatic Envoys to Our Caucasian Neighbors!§!\n"
 GEO_purchase_weapons:0 "Purchase Weapons"
 GEO_purchase_weapons_desc:0 "We shall send a request to our ally for additional weapons and munitions. If they know what’s best, they will agree. After all, it is in their interest to see us triumph."
 GEO_caucasian_trade:0 "Caucasian Trade"
 GEO_caucasian_trade_desc:0 "We can attempt to deepen our ties to our neighbors by offering mutually beneficial trade agreements. Most certainly, it’s an offer they cannot refuse! At least, that is what we hope."
 GEO_gib_trade:0 "§YWe Will Attempt to Negotiate Trade Deals With Our Neighbors.§!\n"
 GEO_cement_legitimacy:0 "Cement Legitimacy"
 GEO_cement_legitimacy_desc:0 "Thanks to the efforts of the Ministry of Foreign affairs, our legitimacy as an independent nation has been cemented all over the globe. Avenues for trade and diplomacy that were once closed to us are now open. No matter how much our enemies protest, Georgia is now widely recognized as an independent nation-state."
