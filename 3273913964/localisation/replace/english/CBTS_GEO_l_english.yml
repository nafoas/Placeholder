 #events
 geo_civil_war.1.t:0 "Strength in Unity"
 geo_civil_war.1.d:0 "The Independence Conflicts in the Russian Civil War and the Subsequent Anti-Soviet Uprisings have done much to harden our population against the Red Tyranny. Now that the Bolsheviks are faltering, it is time for the Mensheviks to come back to the political stage. Georgia will once again see the light of day as an independent nation, not as an Imperialist Vassal!"
 geo_civil_war.1.a:0 "For Georgia!"
 geo_civil_war.2.t:0 "Tetri Giorgi"
 geo_civil_war.2.d:0 "The Patriotic Union \"Tetri Giorgi\", named after St. George, was the main Georgian politial organization in exile. The key word being \"was\", as Tetri Giorgi's leadership has just arrived in Tbilisi. The organization is generaly right-wing nationalist, with elements of monarchism in some parts. President Zhordania greeted them at the Constituent Assembly, where they wholehartedly endorsed the Menshevik government and our Nationalist Cause."
 geo_civil_war.2.a:0 "Together, we shall be strong!"
 geo_civil_war.3.t:0 "Socialist-Federalists Reform"
 geo_civil_war.3.d:0 "The Georgian Socialist-Federalist Revolutionary Party was a Bourgeios-Nationalist Party formed in 1904. An Agrarian Liberal party, the Socialist Federalists advocated for decentralization and Georgian Independence. Intellectuals in Tbilisi have announced the party's reformation, though with a more traditional Social Liberal orientation. Though lacking a concrete program, the party's manifesto makes it clear that they support policies to ensure social welfare, business growth, and technological progress."
 geo_civil_war.3.a:0 "A good Menshevik Ally!"
 geo_civil_war.4.t:0 "National Democratic Return"
 geo_civil_war.4.d:0 "Although the party's program was drafted in 1905, the National Democratic Party was first formed in 1917. Although this was a moderate Conservative party, the National Democrats aligned with the Mensheviks and Socialist-Federalists before dissolving after the Soviet Occupation. In response to the reformation of the Socialist-Federalist Party, the National Democratic Party has made a return. The party's manifesto indicates the party's support for a strong and free market and some tacitly conservative social positions."
 geo_civil_war.4.a:0 "They're aligning with the Traditionalists?"
 geo_civil_war.5.t:0 "Georgia Wants Equipment"
 geo_civil_war.5.d:0 "The Georgian government has approached was with a request for additional infantry equipment. Sending the Georgians infantry equipment is an excellent method of bolstering the Georgians against their enemies at relatively low cost to ourselves. So then, how should we respond to the Georgian request?"
 geo_civil_war.5.a:0 "We Shall Help Them!"
 geo_civil_war.5.b:0 "They're Doing Fine"
 geo_civil_war.6.t:0 "Georgia Requests Attache"
 geo_civil_war.6.d:0 "The Georgian Ministry of Foriegn Affairs has put in a request for a military attache to travel to Georgia to advise, train, and coordinate the Georgian Army. Although many of their high-ranking officers seasoned veterans of war, many of their junior officers are still green and inexperienced. An attache would prove incredibly useful to our Georgian friends. So, should we dispatch some dispatch some officers to Georgia?"
 geo_civil_war.6.a:0 "Of Course!"
 geo_civil_war.6.b:0 "It's Cold in the Mountains..."
 geo_civil_war.7.t:0 "Georgian Diplomatic Mission"
 geo_civil_war.7.d:0 "Today we received a special diplomatic envoy from our Georgian neighbors, allegedly to \"build friendship in these dire times\" and to \"foster cooperation between our nations\". While the discussions went strangely well, one must wonder what the true intentions behind these pleasantries are."
 geo_civil_war.7.a:0 "Do They Want to Recreate the Federation?"
 geo_civil_war.8.t:0 "Georgia Offers a Trade Deal"
 geo_civil_war.8.d:0 "The Georgian government has recently expressed a desire for a trade deal between our two countries. The deal specifies lowering various trade barriers between Georgia and [Root.GetNameDef] such as tariffs and customs checks. This could prove an excellent opportunity to expand our markets and our flow of resources. So, should accept the Georgian trade deal, or should we reject it?"
 geo_civil_war.8.a:0 "Why Not?"
 geo_civil_war.8.b:0 "We Don't Need Anything from Them"
 geo_civil_war.9.t:0 "[From.GetNameDef] Accepts"
 geo_civil_war.9.d:0 "Thanks to the diligent efforts of our diplomats, [From.GetNameDef] has accepted our generous trade deal! We can now look forward to increased flow of resources between Georgia and [From.GetNameDef]!"
 geo_civil_war.9.a:0 "Excellent"
 geo_civil_war.10.t:0 "[From.GetNameDef] Refuses"
 geo_civil_war.10.d:0 "Despite the best efforts of our diplomats, [From.GetNameDef] has foolishly decided to reject our generous trade deal! Those fools are obviously far too self-serving to see the value of our offer!"
 geo_civil_war.10.a:0 "How Dare They!"
 geo_civil_war.11.t:0 "Georgia Requests Guarantees!"
 geo_civil_war.11.d:0 "Recently, the Georgian Ministry of Foreign Affairs has approached our government with a request for assistance. The Georgian government recently declared independence from the USSR, so supporting them would be an excellent way to, at the very least, weaken the Bolsheviks. On the other hand, supporting Georgia will likely drag us into a conflict with the Vlasovists, who are also fighting against the Soviet Union. So, how should we respond to Georgia’s request?"
 geo_civil_war.11.a:0 "They Have Our Support!"
 geo_civil_war.11.b:0 "Why Die For Georgia?"
 geo_civil_war.12.t:0 "[From.GetNameDef] Agrees To Help!"
 geo_civil_war.12.d:0 "[From.GetNameDef] has agreed to our plea for help! The government of [From.GetNameDef] has publicly announced that they will guarantee the independence of Georgia, and will defend us from any forces that threaten us! This is the start of a new age of relations between Georgia and [From.GetNameDef]!"
 geo_civil_war.12.a:0 "Georgia Is Not Alone!"
 geo_civil_war.13.t:0 "[From.GetNameDef] Refuses To Help!"
 geo_civil_war.13.d:0 "[From.GetNameDef] has decided to ignore our plea for help! It is clear that if we want any assistance, we will have to look elsewhere."
 geo_civil_war.13.a:0 "We Will Win Alone If Necessary!"
 #internal
 geo_internal.1.t:0 "Negotiations with Nationalists"
 geo_internal.1.d:0 "Ever since political activity was re-legalized, Abkhaz and Ossetian Nationalists have been slowly growing their political positions. As part of our attempts to prevent their nationalism from conflicting with ours, we have approached nationalist leaders to ensure their groups loyalty to the Georgian Democratic Republic. After four weeks of negotiations, we have managed to hammer out a deal. Tbilisi will grant these ethnic regions Autonomous Status (with greater parliamentary powers) and greater representation in the Constituent Assembly, while the nationalist groups promise to moderate their rhetoric and abstain from violent actions, thus ensuring peace and stability. However, the Traditionalists have been against this deal from the start: according to them, the Nationalists should have been crushed, not bargained with. It is simply up to Tbilisi to sign off on the agreement. Noe Zhordania puts his pen on the paper, and..."
 geo_internal.1.a:0 "...signs the agreement!"
 geo_internal.1.b:0 "...refuses to sign!"
 geo_internal.2.t:0 "Squabble Over the Ministry of Economics"
 geo_internal.2.d:0 "Many arguments have sprung up over the issue of the economics ministry. Minister Gegechkori is doing a fine job, but many Traditionalists are pushing for their own candidate, Aleksandre Asatiani, a member of the National Democrats. They claim that Gegechkori's socialist economic policies are unsustainable, as proven by the First Republic's downfall, and will lead to total collapse. As abhorrent these arguments are, we need to make a decision soon, or these petty arguments will continue indefinitely"
 geo_internal.2.a:0 "Gegechkori Stays!"
 geo_internal.2.b:0 "Perhaps They Have a Point..."
 geo_internal.3.t:0 "Create Cooperatives?"
 geo_internal.3.d:0 "Minister Gechkori has recently been pushing for the creation of labor cooperatives. Gechkori has claimed that workers cooperatives provide stable income to workers, decrease economic inequality, increase productivity, and are resilient to economic downturn. Indubitably, creating worker’s cooperatives would provide a boost to our economy, and would reinforce the Menshevik commitment to Marxism. However, such an ambitious undertaking may prove costly, and would most certainly anger the Traditionalists. So then, should we implement Gechkori’s plan?"
 geo_internal.3.a:0 "Absolutely!"
 geo_internal.3.b:0 "We Can't Spare the Resources"
 geo_internal.4.t:0 "Mass Privitization?"
 geo_internal.4.d:0 "Minister Asatiani, a diehard National Democrat, has put forward an unprecedented plan to liberalize the economy. According to the plan, all government property that is not absolutely necessary to the war effort will be privatized, and almost all price and market regulations must be torn down. Asatiani claims that this will foster economic growth and prosperity. No matter its economic effects, implementing this plan would undoubtedly give a boost to the Traditionalists, and anger the Mensheviks. With all this in mind, should we go through with Asatiani’s plan?"
 geo_internal.4.a:0 "That's how the Economy Works!"
 geo_internal.4.b:0 "This is too Much"
 #elections
 geo_elections.1.t:0 "The First Elections"
 geo_elections.1.d:0 "Georgia has not had a real election in 20 years. There have been Soviet shams, but the previous real election (which ended in a Menshevik Landslide Victory) occured under the First Republic. Today marks the true restoration of Georgian Democracy, as Georgians went to the polls to choose a Constituent Assembly and Senate. The results were [This.GeoElectionResults]. It was decided that Noe Zhordania would remain in control of the Government as part of the Coalition, but the makeup of the Assembly is now very different."
 geo_elections.1.a:0 "Such is Democracy's Power!"
 GEO_Menshevik_Victory:0 "similar to the 1919 election: the Mensheviks have won! It seems that their platform of reform has won over the population, and their nationalism has managed to attract those in the center"
 GEO_Traditionalist_Victory:0 "very different: the Traditionalists have won! It seems that the Menshevik reforms are too radical for many Georgians, and Menshevik Patriotism is not convincing enough for those in the center"
