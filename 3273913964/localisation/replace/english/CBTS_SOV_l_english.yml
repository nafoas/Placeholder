 SOV_disloyal_military:0 "Disloyal Military"
 SOV_disloyal_military_desc:0 "In the wake of the Revolt, defections are common, and the soldiers do not want to fight."
 SOV_tolkachy:0 "Tolkachy"
 SOV_tolkachy_desc:0 "\"Pushers\" are a group of profesionals employed by our enterprises to get bureaucrats to decrease production targets."
 SOV_sfyp_failure:0 "Failure of the Five-Year Plan"
 SOV_sfyp_failure_desc:0 "We have failed to meet the quota of the Five-Year Plan, and we will suffer for it."
 SOV_sfyp_success:0 "Success of the Five-Year Plan"
 SOV_sfyp_success_desc:0 "We have managed to meet the quota of the Five-Year Plan and build our intended projects. Now, we can reap the rewards!"
 SOV_35yp_idea:0 "People's Commissars of Defense Industries"
 SOV_35yp_idea_desc:0 "We have had to create new ministries to manage defense spending in order to prepare for any upcoming war."
 SOV_military_expansion:0 "Expanded Military Capability"
 SOV_military_expansion_desc:0 "Our need for weapons and armour means that we must expand military operations."
 SOV_resource_expansion:0 "Expanded Resource Refinement"
 SOV_resource_expansion_desc:0 "To produce military equipment, we need resources. And to get these resources, we need to increase resource allocation to resource production."
 SOV_navy_expansion:0 "Expanded Naval Production"
 SOV_navy_expansion_desc:0 "To produce a surface fleet capable of fighting the Germans and the Japanese, we need to increase our dockyards' output."
