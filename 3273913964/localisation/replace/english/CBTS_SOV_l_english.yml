 SOV_famine:0 "Memory of Collectivization"
 SOV_famine_desc:0 "Although collectivization has been officially halted (since we are \"Dizzy with Success\"), the scars are already there. Major famines in Ukraine, the Northern Caucasus, the Volga Region, and Kazakhstan have emerged as a result of both targeted repression and collectivization in general."
