 #Amur escalation
 AM_Escalation:0 "The Amur War"
 AM_Escalation_desc:0 "The Imperial Japanese Army seeks to take advantage of the Soviet Collapse by seizing territory in the Far East. They claim lands all the way from Vladivostok almost to Chita, but this territory centers on the Amur River. The Red Army, of course, has a vested interest in defending Soviet land. However, it is clear that the Japanese will give their best effort to expand their sphere of influence.\n\n§YLocal Tension: [?global.AM_Tension|Y0]\n§RIf Local Tension reaches 100, a full scale war will break out!§!"
 add_3_esc:0 "§RLocal Tension will increase by §Y3§R.§!\n"
