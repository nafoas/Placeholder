 ##2RCW
 SOV_Second_Civil_War_Cat:0 "Second Russian Civil War"
 SOV_Second_Civil_War_Cat_desc:0 "Civil War has broken out once again in Russia. Anti-Bolshevik Counter-Revolutionaries have declared an insurgency against our rule, and ethnic groups are using this opportunity to break away from our state. If we do not act decisively, the USSR will be destroyed, only known in memories and textbooks..."
 SOV_lose_Buryatia:0 "Losing Control in Buryatia"
 SOV_lose_Buryatia_desc:0 "The Civil War has caused chaos in the government, making Moscow weaker and regional governments stronger. Though we have managed to keep some control, our loss of the Trans-Siberian Railroad has allowed the ambitious Mikhey Yerbanov to act independently in Buryatia. If we do not retake the railway then our authority might be entirely eroded."
 Russian_Civil_War_Make_Peace:0 "Making Peace"
 Russian_Civil_War_Trigger_Peace:0 "Offer Peace to [From.GetNameDef]"
 ##Foreign countries
 Russian_Civil_War_Category:0 "Second Russian Civil War"
 Russian_Civil_War_Category_desc:0 "The USSR has collapsed in the wake of bureaucratic instability and ethnic nationalism. A coalition of Anti-Bolsheviks have set up a rival government in Tsaritsyn that aims to topple the Communist Government and install a new (though undecided) government in its place. In addition, various ethnic groups have seen a surge in nationalist activity, as simmering tensions have been released following the Russian Revolt. It is our job to decide how we want to react to this conflict. Intervention on the part of the Soviets would maybe help with their bureaucratic changes, but should we supply the Revolters, we might be able to align their political interests with ours..."
 Intervene_in_2RCW:0 "Intervene in the Russian Civil War"
 sov_civil_war.69.t: "intervening in the Russian Conflict"
 sov_civil_war.69.d: "Our government is ready to truck with the conflict in Russia. We will start to secretly support a side (or sides) in the conflict, but first we must choose which side to support."
