 SOV_ethnic_nationalism:0 "Ethnic Nationalism"
 SOV_ethnic_nationalism_desc:0 "Ethnic Nationalism has a long history in the USSR and the Russian Empire, but nationalism in its current form comes from both a continuation of old sentiments and our repressive policies, especially in the Western USSR and the Caucasus."
