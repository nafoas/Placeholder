 ###Insurgency in Chechnya
 Chechnya_Insurgency_Cat:0 "Chechen-Ingush Insurgency"
 Chechnya_Insurgency_Cat_desc:0 "In Chechnya, Hasan and Hussein Israilov have organized an armed revolt in the name of Chechen Independence. They have since occupied numerous villages and have damaged several military installations. If we let this insurgency get out of hand, we might face a full scale revolt!\n\n§YInsurgency Strength: §![CHCInsurgencyStrength]"
 CHC_Insurgency_weak:0 "§G[?1080.CHC_insurgency_strength]\nThe rebels have control of several villages in the countryside and a small, albeit strong, base of support. Attacks should not be so frequent.§!"
 CHC_Insurgency_medium:0 "§Y[?1080.CHC_insurgency_strength]\nThe rebels have control of many villages in the countryside and an established base of support. They also have many modern weapons they can use against us, and attacks will come at a moderate frequency.§!"
 CHC_Insurgency_strong:0 "§R[?1080.CHC_insurgency_strength]\nThe rebels have control of most villages in the countryside and a very strong base of support. Attacks will come frequently, and if we are not careful, we could be facing an open revolt.§!"
