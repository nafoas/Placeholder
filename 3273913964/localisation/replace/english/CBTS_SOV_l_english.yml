 #Leader Descs
 POLITICS_JOSEPH_STALIN_DESC:0 "Joseph Vissaronovich Stalin - real name Ioseb Besarionis dze Jughashvili - has been the leader of the USSR from 1922. An autocrat with a love of political purges, by the early 1930s Stalin became the dictator of the Soviet Union. He runs a personality cult on a massive scale with very liberal use of the NKVD, the Soviet Secret Police. Ideologically, he is a Marxist-Leninist, a more formal definition of the ideas of Lenin. However, Marxism-Leninism better represents Stalin's own political initiatives such as purges, collectivization, and ethnic discrimination, with the name of Lenin attached to give it legitimacy."
