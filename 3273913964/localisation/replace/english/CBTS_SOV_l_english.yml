 SOV_Stalinist_SFYP_Start:0 "The Second Five-Year Plan"
 SOV_Stalinist_SFYP_Start_desc:0 "After the moderate success of the First Five-Year Plan, we should follow it up with a second plan to eliminate capitalist elements, expand industry, improve the well-being of the people, and strengthen the defense of the country."
 SOV_Stalinist_SFYP_Uralmashzavod:0 "Uralmashzavod"
 SOV_Stalinist_SFYP_Uralmashzavod_desc:0 "The Ural Heavy Machinery Plant is our planned source of metallurgical and infrastructure equipment. Built in Sverdlovsk, it will also help to industrialize a backwards Siberia."
 SOV_Stalinist_SFYP_Dubrovskaya_TETS:0 "Dubrovskaya TETS"
 SOV_Stalinist_SFYP_Dubrovskaya_TETS_desc:0 "Dubrovskaya will be a new Coal-based Power Plant in the Leningrad Region, meant to assist with electrification. Remember Lenin's teachings: Communism is Soviet Power plus Electrification of the Country!"
 SOV_Stalinist_SFYP_Chelyabinsk:0 "Chelyabinsky Traktorny Zavod"
 SOV_Stalinist_SFYP_Chelyabinsk_desc:0 "The Chelyabinsky Tractor Plant will build agricultural machinery for us to send to collective farms. Designed by American Capitalist Albert Kahn, the plant will produce Stalinets brand tractors."
 SOV_Stalinist_SFYP_Azovstal:0 "Metallurgichesky Kombinat \"Azovstal\""
 SOV_Stalinist_SFYP_Azovstal_desc:0 "The Metallurgical Combine \"Azovstal\" will be a new steel mill established in Mariupol. It will be the first 250 ton open-hearth furnace in the USSR!"
 SOV_Stalinist_SFYP_Krivoy_Rog:0 "Metallurgichesky Kombinat \"Krivorozhstal\""
 SOV_Stalinist_SFYP_Krivoy_Rog_desc:0 "The Metallurgical Plant \"Krivorozhstal\" named after V.I. Lenin will be another new steel mill in the Ukraine. Located in Krivoy Rog, the plant will be the main steel mill in the Western USSR."
 SOV_Stalinist_SFYP_Novotulsky:0 "Metallurgichesky Kombinat \"Novotulsky\""
 SOV_Stalinist_SFYP_Novotulsky_desc:0 "Located in the Tula Region near Moscow, the Metallurgical Plant \"Novotulsky\" will improve the RSFSR's output of steel. It will also provide employment to some of the starving masses in Tula and Moscow."
 SOV_Stalinist_SFYP_Novolipetsk:0 "Metallurgichesky Kombinat \"Novolipetsk\""
 SOV_Stalinist_SFYP_Novolipetsk_desc:0 "Lipetsk, RSFSR will be home to the Metallurgical Plant \"Novolipetsk\", a steel mill meant to have produce 350,000 tons of cast iron per year. It will continue with the proud tradition of Lipetsk Ironworking, begun on the initiative of Peter the Great."
 SOV_Stalinist_SFYP_Zaporozhstal:0 "Metallurgichesky Kombinat \"Zaporozhstal\""
 SOV_Stalinist_SFYP_Zaporozhstal_desc:0 "Zaphorozia will be home to the Metallurgical Plant \"Zaporozhstal\", a mill designed by the State Institute for the Design of Metallurgical Plants. We want it to be one of the largest in Europe, but we do not know if this is possible with current technology."
 SOV_Stalinist_SFYP_Uralvagonzavod:0 "Uralvagonzavod"
 SOV_Stalinist_SFYP_Uralvagonzavod_desc:0 "Ural Carriage Works will be another addition to the industrial complex of Sverdlovsk, and will be the site of Armoured Equipment Production."
 SOV_Stalinist_SFYP_Barnaul_Textile:0 "Barnaulsky Melanzhevy Kombinat"
 SOV_Stalinist_SFYP_Barnaul_Textile_desc:0 "The Barnaul Textile Plant will be part of an attempt to industrialize Central Siberia. Located - as the name suggests - in Barnaul, the plant will make textiles primarily out of cotton. However, with the rampant poverty in our nation, it is doubtful that many people will recieve the fruits of others' labour."
 SOV_Stalinist_SFYP_Kramtorsk:0 "Kramtorsky Zavod Tyazhyologo Stankostroeniya"
 SOV_Stalinist_SFYP_Kramtorsk_desc:0 "The Kramtorsk Heavy Machine Tool Plant will be a major producer of heavy industrial machinery in the Ukraine. Located in the Donbass region, KZTS should provide the State with the ability to create far more factories."
 SOV_Stalinist_SFYP_Tashkent:0 "Tashkentsky Melanzhevy Kombinat"
 SOV_Stalinist_SFYP_Tashkent_desc:0 "The Tashkent Textile Mill will be part of our project to Sovietize Central Asia. Located in Tashkent, Uzbekistan, it is hoped that employment will help bring the locals around to our cause."
 SOV_Stalinist_SFYP_Novomoskovskaya:0 "Bobrikovskaya GRES"
 SOV_Stalinist_SFYP_Novomoskovskaya_desc:0 "The Bobrikov State District Power Plant is another key component of our Electrification campaign. Located in Tula, it will provide new chemical factories with the power needed to supply the State with fertalizer and ceramics."
 SOV_Stalinist_SFYP_Kemerovskaya:0 "Kemerovskaya GRES"
 SOV_Stalinist_SFYP_Kemerovskaya_desc:0 "As part of our Siberan Industrialization Campaign, the Kemerovo State District Power Plant will provide electricity to the villages and factories stationed in the area."
 SOV_Stalinist_SFYP_NizhneSvirskaya:0 "Nizhne-Svirskaya GES"
 SOV_Stalinist_SFYP_NizhneSvirskaya_desc:0 "Lower Svirskaya Hydroelectric Station will be another method of providing the Leningrad region with electricity. If successful, it will be a model for other Hydroelectric Plants to follow."
 SOV_Stalinist_SFYP_Sredneuralskaya:0 "Sredneuralskaya GRES"
 SOV_Stalinist_SFYP_Sredneuralskaya_desc:0 "To help supply our factories in Sverdlovsk, we will create the Sredneuralsk State District Power plant. It is part of the Ural electrification plan, and will help to link up eastern provinces with Moscow."
 SOV_Stalinist_SFYP_Rionskaya:0 "Rionskaya GES"
 SOV_Stalinist_SFYP_Rionskaya_desc:0 "Located on the River Rion in Georgia, the Rion Hydroelectric Station will help to supply Georgia with electricity. Unfortunately, it will not solve the problem of Georgian Nationalism."
 SOV_Stalinist_SFYP_Kanaker:0 "Kanaker GES"
 SOV_Stalinist_SFYP_Kanaker_desc:0 "The Kanaker Hydroelectric Station will help electrify Armenia. Located on the Hradzan river, it is called Kanaker because of the epynomous village, northeast of Yerevan."
 SOV_3fyp_done:0 "The Third Five-Year Plan has reached its deadline."
 SOV_Stalinist_TFYP_Start:0 "The Third Five-Year Plan"
 SOV_Stalinist_TFYP_Start_desc:0 "After our attempts to modernize civilian industry, our attention must turn towards National Defense. As Russia's enemies gear up for war, we must prepare our military too!"
 SOV_Stalinist_TFYP_Military_Expansion:0 "Expand Military Production"
 SOV_Stalinist_TFYP_Military_Expansion_desc:0 "In order for the Red Army to be the Strongest of All, we must be able to supply the soldiers with equipment."
 SOV_Stalinist_TFYP_Barrikady:0 "Barrikady"
 SOV_Stalinist_TFYP_Barrikady_desc:0 "\"Barricades\" is a munitions company established in Stalingrade before the Great War. In order to produce sufficient ammunition and artillery pieces, we must expand the plant."
 SOV_Stalinist_TFYP_Dirigiblestroy:0 "Dirizhablestroy"
 SOV_Stalinist_TFYP_Dirigiblestroy_desc:0 "The Moscow Dirigible Factory must be moved towards Aircraft Production, in order to prepare the Air Fleet for War!"
 SOV_Stalinist_TFYP_MAPO:0 "MAPO"
 SOV_Stalinist_TFYP_MAPO_desc:0 "The Moskovskoye Aviatsionnoye Proizvodstvennoye Obyedineniye (Moscow Aircraft Production Association) will be created out of a Dux factory in Moscow. As the name suggests, it will be a principle manufacturer of Military Aircraft."
 SOV_Stalinist_TFYP_Bolshevik_Factory:0 "Zavod No. 174"
 SOV_Stalinist_TFYP_Bolshevik_Factory_desc:0 "The Leningrad State Plant No. 174 named after K.E. Voroshilov is the name of the former Bolshevik Plant, which needs to be expanded if we are to have sufficient artillery pieces."
 SOV_Stalinist_TFYP_GAZ:0 "Gorkovsky Avtomobilny Zavod"
 SOV_Stalinist_TFYP_GAZ_desc:0 "The Gorkey Automobile Plant (aka GAZ) is the result of a deal with the Ford Motor Company signed in 1929, in which we purchased automobiles and parts worth $13 Million, and Ford agreed to provide us with technical assistance in building GAZ in Gorky. The plant must be expanded to support military production."
 SOV_Stalinist_TFYP_Kiev_Arsenal:0 "Kievsky Arsenal"
 SOV_Stalinist_TFYP_Kiev_Arsenal_desc:0 "The Kiev Arsenal is an armaments factory dating back to the mid-18th century. We should restablish it to allow us to produce even more weaponry."
 SOV_Stalinist_TFYP_Resource_Expansion:0 "Expand Resource Refineries"
 SOV_Stalinist_TFYP_Resource_Expansion_desc:0 "To supply our factories, we need more resources. Thus, we must invest more resources into excavating and refining more resources."
 SOV_Stalinist_TFYP_Aluminum_Leningrad:0 "Expand Leningrad Aluminium Plants"
 SOV_Stalinist_TFYP_Aluminum_Leningrad_desc:0 "We need more Aluminium for our vehicles, and Leningrad is a natural place to expand production."
 SOV_Stalinist_TFYP_Chromium_Uralsk:0 "Chromium in Uralsk"
 SOV_Stalinist_TFYP_Chromium_Uralsk_desc:0 "To build larger ships we need Chromium. We should prospect for some based on reports in Uralsk."
 SOV_Stalinist_TFYP_Naval_Expansion:0 "Expand Naval Output"
 SOV_Stalinist_TFYP_Naval_Expansion_desc:0 "The Navy must not be neglected, so we must construct new dockayrds to improve output. As we will have to fight on multiple bodies of water which are not accesible from the other, this is not a task for the weak."
 SOV_Stalinist_TFYP_Dagdizel:0 "Zavod No. 182 \"Dagdizel\""
 SOV_Stalinist_TFYP_Dagdizel_desc:0 "\"Dagdizel\" is a company based in Dagestan that produces shipboard instruments. If we can expand the plant, then we can increase naval output."
 SOV_Stalinist_TFYP_Mariupol:0 "Zhdanovsky Sudostroitelny Zavod"
 SOV_Stalinist_TFYP_Mariupol_desc:0 "A new shipyard in Mariupol, named after Andrei Zhdanov, will help to improve our Black Sea Naval Capabilities."
 SOV_Stalinist_TFYP_Murmansk:0 "Zavod No. 10 \"Shkval\""
 SOV_Stalinist_TFYP_Murmansk_desc:0 "A shipyard in Murmansk will be a useful supplement to the White Sea fleet, and help us deliver a Red October to our enemies!"
 SOV_Stalinist_TFYP_Lower_Nevsky:0 "Zavod No. 363"
 SOV_Stalinist_TFYP_Lower_Nevsky_desc:0 "Situated in Leningrad, Plant 363 of the People's Commissariat of the Defens Industry should be expanded to improve our minesweeping and torpedo capabilities."
 SOV_Stalinist_TFYP_Severnaya_Verf:0 "Severnaya Sudostroitelnaya Verf"
 SOV_Stalinist_TFYP_Severnaya_Verf_desc:0 "Also Situated in Leningrad, Shipyard 190 (named after Zhdanov as well) will be used to improve our Baltic fleet."
 SOV_Stalinist_TFYP_Zvezda:0 "Zavod No. 892"
 SOV_Stalinist_TFYP_Zvezda_desc:0 "A shipyard in the Far East will help us fight off the Japanese or Chinese should we need to."
 SOV_4fyp_done:0 "The Fourth Five-Year Plan has reached its deadline."
 SOV_Stalinist_4FYP_Start:0 "The Fourth Five-Year Plan"
 SOV_Stalinist_4FYP_Start_desc:0 "The Fourth Five-Year Plan will be focused on maintaining the balance between civilian industries and military industries. If these efforts are successful, we can even work on adding to our resource reserves."
 SOV_Stalinist_4FYP_Factory_Molotov:0 "Zavod No. 311"
 SOV_Stalinist_4FYP_Factory_Molotov_desc:0 "\"Factory 311 in the name of V.M. Molotov\" will be a heavy machinery factory named after the esteemed diplomat, Vyacheslav Molotov"
 SOV_Stalinist_4FYP_Zavod_374:0 "Radiozavod \"Voroshilov\""
 SOV_Stalinist_4FYP_Zavod_374_desc:0 "In order to build more civlian radios, we shall construct the \"Radio Plant in the name of K.Y. Voroshilov\". Whether any civilians can afford the radios remains to be seen."
 SOV_Stalinist_4FYP_Zavod_358:0 "Kombinzavod \"Litvinov\""
 SOV_Stalinist_4FYP_Zavod_358_desc:0 "The \"Combine Harvest Plant in the name of M.M. Litvinov\" will be a Combine Harvester factory that we can supply our Collective Farms with."
 SOV_Stalinist_4FYP_Zavod_Kalinin:0 "Zavod No. 374"
 SOV_Stalinist_4FYP_Zavod_Kalinin_desc:0 "\"Factory 374 in the name of M.I. Kalinin\" is going to be a new cement factory that can allow us to build more factories accross the USSR."
 SOV_Stalinist_4FYP_Zavod_Cigarette:0 "Stavropolsky Sigaretny Zavod"
 SOV_Stalinist_4FYP_Zavod_Cigarette_desc:0 "The Stavropol Cigarette Factory will be an attempt to pacify the population with tobacco."
 SOV_Stalinist_4FYP_Zavod_Chibisov:0 "Zavod No. 402"
 SOV_Stalinist_4FYP_Zavod_Chibisov_desc:0 "To satisfy our need for industrial glass, \"Factory 411 in the name of N.I. Chibisov\" shall be constructed."
 SOV_Stalinist_4FYP_Nikolayevsk_Steel:0 "Expand Nikolayevsk Iron Mines"
 SOV_Stalinist_4FYP_Nikolayevsk_Steel_desc:0 "Increasing Iron Output in the Far East will help to protect some of our industries from attack."
 SOV_Stalinist_4FYP_Perm_Aluminium:0 "Expand Perm Aluminum Mines"
 SOV_Stalinist_4FYP_Perm_Aluminium_desc:0 "Expanding mining operations in Perm would be useful, because it is out of range of enemy airplanes."
 SOV_Stalinist_4FYP_Zavod_Khrushchev:0 "Zavod No. 438"
 SOV_Stalinist_4FYP_Zavod_Khrushchev_desc:0 "To honor Nikita Khrushchev, the great civil servant, we will name Factory 438 after him!"
 SOV_Stalinist_4FYP_Factory_Beria:0 "Ruzhyozavod \"Beria\""
 SOV_Stalinist_4FYP_Factory_Beria_desc:0 "Lavrentiy Beria, the great NKVD officer renowned throughout the nation, should have a Rifle Factory named after him."
 SOV_Stalinist_4FYP_Factory_397:0 "Zavod No. 397"
 SOV_Stalinist_4FYP_Factory_397_desc:0 "\"Factory 397 in the name of K.K Rokossovsky\" Will be a new armements factory, which we ened to supply our ever growing army."
 SOV_Stalinist_4FYP_Varshava:0 "Varshava"
 SOV_Stalinist_4FYP_Varshava_desc:0 "The \"Warsaw\" Factory will be a new weapons factory named after the Polish Capital, to remind the people of our Comrades abroad."
 SOV_Stalinist_4FYP_More_Railroads:0 "Military Railroads"
 SOV_Stalinist_4FYP_More_Railroads_desc:0 "To transport our ever growing arsenal, we need more railroads to transport it on."
 SOV_Stalinist_4FYP_Dock:0 "Zavod No. 420"
 SOV_Stalinist_4FYP_Dock_desc:0 "\"Factory 420 in the name of T.D. Lysenko\" will be a new shipyard to expand our Navy to complement our Army."
 SOV_Stalinist_4FYP_Pechora_Oil:0 "Pechora Oil Fields"
 SOV_Stalinist_4FYP_Pechora_Oil_desc:0 "The Pechora Oil Fields must be expanded and operations intensified in order to diversify our stocks of oil."
 SOV_Stalinist_4FYP_Zavod_483:0 "Zavod No. 483"
 SOV_Stalinist_4FYP_Zavod_483_desc:0 "\"Factory 483 in the name of G.K. Zhukov\" will be a grand arms factory named after the Great General."
 ###Politics
 SOV_Stalinist_Collectivization:0 "The Issue of Collectivization"
 SOV_Stalinist_Collectivization_desc:0 "Collectivization is our policy of taking grain and land from the so-called \"Kulaks\" (well-off peasants) and redistributing them to landless peasants. In truth, there are little landless peasants, yet the \"Kulaks\" have still been treated harshly. While Comrade Stalin writes of our successes, we are all aware that it has cost millions of lives."
 SOV_Stalinist_Collectivization_continue:0 "Continue Collectivization"
 SOV_Stalinist_Collectivization_continue_desc:0 "Although the cost will be high and resistance will be great, Comrade Stalin has decided to continue to Collectivize the nation."
 SOV_Stalinist_Collectivization_Stop:0 "Officially Halt Collectivization"
 SOV_Stalinist_Collectivization_Stop_desc:0 "Collectivization comes with too high a price, and too much resistance will be detrimental to the stability of our nation. We shall officially declare the project over."
 SOV_Stalinist_Collectivization_Resistance:0 "Deal With Resistance"
 SOV_Stalinist_Collectivization_Resistance_desc:0 "Peasant Resistance is still high in our nation. We need to deal with them in every way possible."
 SOV_Stalinist_Collectivization_Tech:0 "Invest in Agricultural Technologies"
 SOV_Stalinist_Collectivization_Tech_desc:0 "New technologies such as Tractors and Combine Harvesters might help to alliviate the effects of the famines."
 SOV_Stalinist_Collectivization_Restore_Kulak_Rights:0 "Restore \"Kulak\" Rights"
 SOV_Stalinist_Collectivization_Restore_Kulak_Rights_desc:0 "Our war on the peasant middle class is over. We should now restore their rights. At least, what little rights the people have left."
 SOV_Stalinist_17_Congress:0 "The 17th Congress of the VKP(b)"
 SOV_Stalinist_17_Congress_desc:0 "We are bound to hold the 17th Congress of the All-Union Communist Party (Bolsheviks) to formally ratify the Second Five-Year Plan, and adopt the new Party platform as laid out by Comrade Stalin."
 SOV_Congress_Done:0 "The Congress has Finished"
 SOV_Stalinist_Great_Offensive:0 "Continue the Communist Offensive"
 SOV_Stalinist_Great_Offensive_desc:0 "Our attacks on reactionary institutions such as the \"Burzhui\" and Scientific Progress must continue!"
 SOV_Stalinist_Great_Retreat:0 "The Great Retreat from Communism"
 SOV_Stalinist_Great_Retreat_desc:0 "Comrade Stalin is right to say that we must end the practices of the idealist period of the 1920s and begin to act more pragmatically."
 SOV_Stalinist_Reorganize_Districts:0 "Reorganize Districts"
 SOV_Stalinist_Reorganize_Districts_desc:0 "At the 17th Congress, the Party decided to resuffle party organization at the Raion (county) level."
 SOV_Stalinist_Streamline_Bureaucracy:0 "Streamline Bureaucracy"
 SOV_Stalinist_Streamline_Bureaucracy_desc:0 "The 17th Party Congress also approved measures calling for a slight downscaling and streamlining of bureaucratic offices."
 SOV_must_streamline_bureaucracy:0 "§RWe must have already streamlined the bureaucracy in order for this focus to have an effect.§!"
 SOV_Stalinist_Party_Transport_Office:0 "Party Transport Office"
 SOV_Stalinist_Party_Transport_Office_desc:0 "Military and Industrial Transport should come under the direct control of the Party."
 SOV_Stalinist_Party_Downscale_Trade_Union:0 "Downscale Trade Unions"
 SOV_Stalinist_Party_Downscale_Trade_Union_desc:0 "The Trade Unions themselves will be downscaled, and their operations will be more subordinated to Party control."
 SOV_Stalinist_Party_Fuel_Office:0 "Party Fuel Office"
 SOV_Stalinist_Party_Fuel_Office_desc:0 "Matters relating to fuel usage by industrial and military equipment should be controlled by a special Party commission."
 SOV_Stalinist_Vertical_Management:0 "Vertical Management"
 SOV_Stalinist_Vertical_Management_desc:0 "We should reorganize our industrial and political management style to have a more vertical and heirarchial organization."
 SOV_Stalinist_Personal_Leadership:0 "Encourage Party Meritocracy"
 SOV_Stalinist_Personal_Leadership_desc:0 "Important positions should be filled by those who are most fit to do so."
 SOV_Stalinist_Strengthen_Cadres:0 "Strengthen Cadres"
 SOV_Stalinist_Strengthen_Cadres_desc:0 "Our Cadres are used to allow the Party to act outside of the law, and they must be strengthened if we are to continue our Class War."
 SOV_Stalinist_Party_Control_Commission:0 "Party Control Commission"
 SOV_Stalinist_Party_Control_Commission_desc:0 "The Party Control Commission should be subordinated to the Central Committee of the Party, rather than allowing it to function independently."
 SOV_Stalinist_Change_Cadres:0 "End the Cadres"
 SOV_Stalinist_Change_Cadres_desc:0 "Party Cadres are no longer necessary, as Capitalism has been abolished. They will be transformed into Party Organization."
 SOV_Stalinist_Komsomol_Activity:0 "Increase Komsomol Activity"
 SOV_Stalinist_Komsomol_Activity_desc:0 "The All-Union Leninist Young Communist League (Or Komsomol) is the Youth Division of the VKP(b). The Komsomol is the final stage of the Youth Program, after the Little Octobrists and the Young Pioneers. These programs are required for all young people in the USSR, but their activity should become more intense, almost paramiliatary-esque."
 SOV_Stalinist_New_Bureaucracy:0 "The New Bureaucracy"
 SOV_Stalinist_New_Bureaucracy_desc:0 "With our reforms, it can be clearly shown that our bureaucracy is clean, efficient, and a model for all other countries, as long as you don't ask it to do much."
 ####Great Retreat
 SOV_Stalinist_Traditional_Schooling:0 "Traditional Schooling"
 SOV_Stalinist_Traditional_Schooling_desc:0 "The days of internationalist fervor are over. We must teach the Great Russian Classics, not Trotskyist pandering."
 SOV_Stalinist_Rediscover_Pushkin:0 "Rediscover Pushkin"
 SOV_Stalinist_Rediscover_Pushkin_desc:0 "The Great Poet Alexander Pushkin will be the focus of our traditionalist efforts, and we can weave it into Socialist propaganda as well!"
 SOV_Stalinist_Individual_Recognition:0 "Turn to Individualism"
 SOV_Stalinist_Individual_Recognition_desc:0 "If we recognize the individual achievements of the Proletariat, we can incentivize them to work harder for little meaningful reward."
 SOV_Stalinist_Stakhanovite:0 "The Stakhanovite Movement"
 SOV_Stalinist_Stakhanovite_desc:0 "Named after Alexei Stakhanov, a miner who is said to have mined 102 tones of coal in less than six hours, which is 14 times his quota, the Stakhanovite Movement recognizes the individual achievements of our Proletariat. We must inspire more workers to be like him!"
 SOV_Stalinist_Benefits_for_Work:0 "Benefits for Work"
 SOV_Stalinist_Benefits_for_Work_desc:0 "Promising increased benefits for increased work will be a good way to motivate the people."
 SOV_Stalinist_Cult_Quo:0 "Maintain the Personality Cult"
 SOV_Stalinist_Cult_Quo_desc:0 "The Personality Cult of Stalin should remain strong and prevalent! The people must learn to love their Marshal."
 SOV_Stalinist_Cult_More:0 "Intensify the Personality Cult"
 SOV_Stalinist_Cult_More_desc:0 "Our propaganda is not intense enough. It is not enough that the people be taught about the Strength of the Leader, they must be aggressively inundated with propaganda."
 SOV_Stalinist_Moscow_Centralism:0 "Muscovite Centralism"
 SOV_Stalinist_Moscow_Centralism_desc:0 "Moscow must once again be the center of Russian culture and political activity. Movies will show its splendor, meetings will be held here, and so forth."
 SOV_Stalinist_End_Class_War:0 "End the Class War"
 SOV_Stalinist_End_Class_War_desc:0 "Our conflict with imagined class enemies has been won and our objectives have been met. The children of these \"Burzhui\" will be given rights again, because as Comrade Stalin says, \"A son does not answer for his father\"."
 SOV_Stalinist_Traditionalist_Family:0 "Reinforce the Family"
 SOV_Stalinist_Traditionalist_Family_desc:0 "Traditionalist Familial Roles must be enforced. Women who refuse to have and raise children are guilty of impeding the growth of the New Soviet Man!"
 SOV_Stalinist_Face_On_Every_Penny:0 "A Face on Every Kopek..."
 SOV_Stalinist_Face_On_Every_Penny_desc:0 "Putting the face of the Great Comrade Stalin on every coin and paper note will remind the people exactly who is responsible for their well-being."
 SOV_Stalinist_Statue_on_every_Corner:0 "...And a Statue on Every Corner"
 SOV_Stalinist_Statue_on_every_Corner_desc:0 "A Statue of the Great Comrade Stalin and his followers on every few street corners will remind the people exactly who defends the cities they live in."
 SOV_Stalinist_Stalin_Constitution:0 "The Stalin Constitution"
 SOV_Stalinist_Stalin_Constitution_desc:0 "Stalin's new Constituion explains that the USSR is not yet a Communist Country, but a Socialist one. Building Socialism will be accompanied by restored \"rights\" to all deprived of them, and \"free\" elections. It is the most democratic constituion in the world! At least, that's what we think."
 SOV_Stalinist_Polar_Explorers:0 "Polar Explorers"
 SOV_Stalinist_Polar_Explorers_desc:0 "The people must know about our Daring Polar Explorers who fly or boat north to the frozen seas, risking their lives and rescuing each other!"
 SOV_Polar_Explorers:0 "Heroes of Polar Exploration!"
 SOV_Stalinist_Nationalism:0 "Great Russian Nationalism"
 SOV_Stalinist_Nationalism_desc:0 "The People of the USSR must know that it is Great Russia who leads them, Great Russia who defends them, and Great Russia who takes care of them."
 SOV_Stalinist_Soften_Church:0 "Soften the War on the Clergy"
 SOV_Stalinist_Soften_Church_desc:0 "Our War on Religion has gone on long enough. Most Churches have been either destroyed or seized by the State, and most Clergymen have been killed or sent to Siberia. We do not need to spend as much effort on this anymore."
 SOV_Stalinist_New_Members:0 "Push for New Party Members"
 SOV_Stalinist_New_Members_desc:0 "We must encourage more people to join the Party. With a consolidated monolithic Party, we can better contorl the people and the nation."
 SOV_Stalinist_Police:0 "Grow the Police Forces"
 SOV_Stalinist_Police_desc:0 "Our Police Departments, including the Militsia and the NKVD, must be expanded to deal with the wave of banditry and social disobediance."
 ####Great Offensive
 SOV_Stalinist_Collectivist_Spirit:0 "The Collectivist Spirit"
 SOV_Stalinist_Collectivist_Spirit_desc:0 "It is not enough to collectivize people on a physical level, we must collectivize them on a spiritual level as well. Their individuality must be stamped out, and any actions against their collectives must be shamed."
 SOV_Stalinist_Socialist_Idealism:0 "Socialist Idealism"
 SOV_Stalinist_Socialist_Idealism_desc:0 "Reshaping people's personalities must come with an ideal; a goal to work towards. That goal is Communism!"
 SOV_Stalinist_Anti_Intellectualism:0 "Anti-Intellectualism"
 SOV_Stalinist_Anti_Intellectualism_desc:0 "Professors, Scientists, and any other kind of Thinkers are saboteurs and enemies of the people!"
 SOV_Class_War:0 "Reinvigorate the Class War"
 SOV_Class_War_desc:0 "Intellectuals, Kulaks, and other forms of \"Burzhui\" still exist in the USSR. We must root these enemies out with renewed spirit!"
 SOV_Stalinist_Freedom_From_Elections:0 "Everything for the State"
 SOV_Stalinist_Freedom_From_Elections_desc:0 "The USSR is the home of the Revolution, so serving the USSR is serving the Revolution. All who do not give everything for the state are traitors and bourgious wreckers."
 SOV_Stalinist_Pretend_to_Pay_Them:0 "Re-Establish the Party Maximum"
 SOV_Stalinist_Pretend_to_Pay_Them_desc:0 "Bolsheviks and Workers must have a cap on wages in order to follow Socialist Ideals!"
 SOV_Stalinist_Continue_Ethnic_Policies:0 "Continue Korenizatsiya"
 SOV_Stalinist_Continue_Ethnic_Policies_desc:0 "Korenizatsiya, our policy of indigenization, must continue to ensure cultural prosperity!"
 SOV_Stalinist_Fix_Ethnic_Nationalism:0 "Friendship of Peoples"
 SOV_Stalinist_Fix_Ethnic_Nationalism_desc:0 "Korenizatsiya does not go far enough to assure the people that Russia is not really in total control. A concentrated propaganda effort can help this."
 SOV_Stalinist_Status_of_Family:0 "Formalize Familial Laws"
 SOV_Stalinist_Status_of_Family_desc:0 "The status of the family has been attacked by our idealist offensive since the days of Lenin. However, the Central Committee does not want it to go too far, so we should formalize the status quo." 
 SOV_Stalinist_Scapegoating:0 "Communal Housing"
 SOV_Stalinist_Scapegoating_desc:0 "We do not want a repeat of the Housing Crisis of the 20's. Therefore, more communal houses must be built."
 SOV_Stalinist_All_Union_Concert:0 "All-Union People's Concert"
 SOV_Stalinist_All_Union_Concert_desc:0 "A grand concert in Moscow, celebrating all the people's of the USSR is just what we need to make them feel better about the Regime!"
 SOV_Stalinist_Redirect_Nationalism:0 "Redirect Nationalism"
 SOV_Stalinist_Redirect_Nationalism_desc:0 "Nationalism is perfectly fine, if it is to unite an ethnic group under the USSR, of course."
 SOV_Stalinist_Gulags:0 "Expand the Rabfak"
 SOV_Stalinist_Gulags_desc:0 "The intelligensia are imperialist spies; the Rabochiy Fakultet (Workers' Faculty) will prepare proletarians to take their place!"
 SOV_Stalinist_Anti_Religious_Legislation:0 "Continue the War on Religion"
 SOV_Stalinist_Anti_Religious_Legislation_desc:0 "Priests and Preachers are \"Burzhui\", and thus enemies of the people! They must be removed from society."
 SOV_Stalinist_Reinforce_Comintern:0 "The Stalin Revolution"
 SOV_Stalinist_Reinforce_Comintern_desc:0 "The Bolshevik Revolution is guided by the Iron Premier, Joseph Stalin. He is the Father, Teacher, and Protector of the People!"
 ##Armed Forces
 ###Army
 SOV_Army_Start:0 "The Red Army"
 SOV_Army_Start_desc:0 "Our enemies are always plotting to destroy the USSR and the Socialist State we have built up. The defense of our Motherland is paramount!"
 SOV_Army_GBP:0 "Use Traditional Strategies"
 SOV_Army_GBP_desc:0 "The Grand Battleplans of old can be modernized, and enable us to adapt and respond to the enemy's plans."
 SOV_Army_MA:0 "Continue Developing Deep Battle Doctrine"
 SOV_Army_MA_desc:0 "Marshal Tukhachevsky's Deep Battle Doctrine involves the simultaneous use of aircraft, infantry, and armor to overwhelm enemy defenses. It is this that will allow us to Spread the Revolution!"
 SOV_Army_Stavka:0 "Stavka"
 SOV_Army_Stavka_desc:0 "The Stavka was an Imperial institution that encompassed the administrative staff and General Headquarters of the Imperial Armed Forces. We should re-establish the institution for our own use."
 SOV_Army_Spec_Ops:0 "Spetsnaz"
 SOV_Army_Spec_Ops_desc:0 "We need to develop special forces such as Marine soldiers and Paratroopers to allow us to do more intricate maneuvers."
 SOV_Army_Tank_Production:0 "Tank Production"
 SOV_Army_Tank_Production_desc:0 "Armor is one of the keys to our operations. We must focus on producing as many tanks as possible!"
 SOV_Army_Combined_Arms:0 "Combined Arms Operations"
 SOV_Army_Combined_Arms_desc:0 "In order for our tactics to succeed, we need to make sure that our infantry, armor, and air fleet work together in unison."
 SOV_Army_Artillery:0 "Artillery Research"
 SOV_Army_Artillery_desc:0 "Powerful artillery pieces are vital to ensure that the enemy forces are softened up before our infantry gets to them."
 SOV_Army_Anti_Tank:0 "Anti-Tank Development"
 SOV_Army_Anti_Tank_desc:0 "One of the most vital pieces of equipment for a modern army is the ability to defend themselves against enemy tanks."
 SOV_Army_Infantry:0 "Small Arms Effort"
 SOV_Army_Infantry_desc:0 "We have to take steps to ensure that our infantry has the most modern equipment on hand."
 SOV_Army_Support:0 "Auxillery Units"
 SOV_Army_Support_desc:0 "To ensure that our army can function fluidly, we need some auxillery units to provide a supplement in some specialized areas."
 SOV_Army_Anti_Air:0 "Mobile Anti-Air"
 SOV_Army_Anti_Air_desc:0 "Towed or Self-Propelled Anti-Air guns would be a great boon in helping secure our soldiers' cover."
 SOV_Army_Rocket_Artillery:0 "Rocket Artillery"
 SOV_Army_Rocket_Artillery_desc:0 "The ability to send self-propelled shells over long ranges will do a great deal to improve the quality of our artillery support."
 SOV_Army_MotMech:0 "Motorized Infantry"
 SOV_Army_MotMech_desc:0 "If we can carry our infantry with trucks or half-tracks then we can save them time and energy, thus improving our fighting ability."
 SOV_Army_Armor:0 "Armored Effort"
 SOV_Army_Armor_desc:0 "The key to our tactics is the tank, the weapon capable of punching lines through enemy forces and allowing our soldiers to envelop them."
 SOV_Army_Doctrine:0 "Doctrine Effort"
 SOV_Army_Doctrine_desc:0 "Now that we have put time and resources into making new equipment, we have to develop new tactics around them."
 ###Navy
 NAME_THEME_HISTORICAL_LENINGRAD_DD: "Leningrad Class Historical Names"
 SOV_Navy_Start:0 "The 1933 Naval Plan"
 SOV_Navy_Start_desc:0 "The Red Navy is lacking compared to our other military developments. The second five-years plan of 1933 will focus on building submersibles, destroyers, MBTs and heavy cruisers so our fleet can properly defend our ports from the clutches of the traitorous capitalist countries."
 SOV_form_the_Northern_Fleet: "Form the Northern Fleet"
 SOV_form_the_Northern_Fleet_desc: "We will form a fleet in the port of Polyarny as our front of Defence in the White Sea."
 SOV_1933_Northern_Fleet_mtg: "Soviet Northern Fleet"
 SOV_1933_Northern_Fleet: "Soviet Northern Fleet"
 SOV_submarine_building: "Continue Submarine Construction"
 SOV_submarine_building_desc: ""
 SOV_navy_foreign_designer_help: "Foreign Designers and Mechanics"
 SOV_modernize_destroyers: "Modernize our Destroyers"
 SOV_better_torpedos: "Employ better torpedos"
 SOV_German_assistance_subs: "German Assistance"
 SOV_new_minesweepers: "New Minesweeper models"
 SOV_reinforce_Leningrad: "Reinforce Leningrad"
 SOV_reinforce_Leningrad_desc: "The Baltic Fleet is very exposed in its bases. We should invest some resources into protecting its anchorages and improve its repair capacities."
 SOV_navy_marines: "Marines of the Soviet Navy"
 SOV_navy_marines_desc: "While we have no intention to invade hostile shores in imperialistic endeavours, a force of dedicated naval infantry can be very useful to raid enemy shore installations and protect our coastlines."
 SOV_develop_new_mines: "A new type of mine"
 SOV_develop_new_mines_desc: "Word has reached us from our spies that the west is developing a new type of underwater mine that detects ships passing above it and blows itself up without the ship ever touching it. Needless to say this technology would be extremely advantageous for the USSR in defending its ports in the Baltic."
 SOV_mine_the_coast: "Mine the ports!"
 SOV_submarine_chasers: "Submarine Chasers"
 SOV_submarine_chasers_desc: ""
 SOV_cruiser_submarines: "Cruiser Submarines"
 SOV_cruiser_submarines_desc: "With the distance from our naval bases to the main shipping lanes, our current submarines will find difficult to reach the rich hunting grounds. We should develop longer-ranged submarines to ensure we can attack our enemies where it hurts the most."
 SOV_black_sea_shipyards: "Expand the Black Sea Shipyards"
 SOV_Surface_Focus: "Surface Warfare"
 SOV_Surface_Focus_desc: "Capital ships require a significant investment of time and resources, and often end up being obsolete before they are even finished building. Smaller vessels are cheaper, can be built faster and are more sutable for shallow seas like the Baltic. We should focus on developing our light forces as the primary arm of naval warfare."
 SOV_sovetsky_soyuz_class: "The Sovetsky Soyuz Class"
 SOV_sovetsky_soyuz_class_desc: ""
 SOV_Navy_Submarines:0 "Undercover Warfare"
 SOV_Navy_Submarines_desc:0 "All of our major ports have chokepoints that impede us reaching the ocean with normal surface vessels. But there is a loophole: Submarines. We can get past straits without being detected allowing us to reach the Atlantic and Mediterranean. There we can use the submarines to cripple the enemy's fleet and trading networks, thus destroying their economy and morale. We should focus on developing these vessels as the main offensive power of our navy."
 SOV_Kirov_Class:0 "The Kirov Class"
 SOV_Kirov_Class_desc:0 ""
 SOV_1938_naval_plan: "The 1938 Naval Plan"
 SOV_1938_naval_plan_desc: ""
 SOV_Opytny_class:0 "The Opytny Class"
 SOV_Opytny_class_desc:0 ""
 SOV_Kronshtadt_class_focus:0 "The Kronshtadt Class"
 SOV_Kronshtadt_class_focus_desc:0 ""
 SOV_Navy_Light_Cruisers:0 "Light Cruiser Research"
 SOV_interwar_naval_tactics:0 "20th Century Doctrines"
 SOV_interwar_naval_tactics_desc:0 "A modern fleet requires modern tactics. Therefore, we must set the Naval Office to work developing them."
 ###Air Force
 SOV_Air_Start:0 "The Soviet Air Forces"
 SOV_Air_Start_desc:0 "The success of our combined arms doctrines depend on the participation of the air force. Thus, we must make sure they are competent enough to ensure victory!"
 SOV_glorify_pilots: "Glorify Pilots"
 SOV_establish_air_fleet_day: "Establish Air Fleet Day"
 SOV_produce_the_I_15: "Produce the Polikarpov I-15"
 SOV_introduce_the_I_16: "Introduce the I-16"
 SOV_expand_airbases: "Expand Airbases"
 SOV_prioritize_long_range_bombers: "Prioritize long rage bombers"
 SOV_new_bomber_models: "New Bomber Models"
 SOV_first_transpolar_flight: "The First Transpolar flight"
 SOV_expand_technical_schools: "Improve the Technical Schools"
 SOV_modernize_air_doctrine: "A modern Air Doctrine"
 SOV_expand_aircraft_industry:0 "Expand the Aircraft Industry"
 SOV_expand_aircraft_industry_desc:0 "In the wars to come, our air force will have to secure the skies against enemies equipped with the most modern equipment. We must ensure that they not only have comparable planes, but also that they have enough of them."
 SOV_Air_Bombers:0 "Spreading the Revolution on the Ground"
 SOV_Air_Bombers_desc:0 "Tactical bombers are medium-sized aircraft designed to assist in ground battles by obliterating enemy positions from above."
 SOV_Air_CAS:0 "Close Air Support Effort"
 SOV_Air_CAS_desc:0 "Close Air Support involves light bomber aircraft dropping bombs on the enemy soldiers during battle. This allows us to better expose their cover."
 SOV_Air_Strat:0 "Destroy their Home Front!"
 SOV_Air_Strat_desc:0 "Heavy Bomber models will give us the ability to travel to enemy homelands and destroy their industry from affar. By destroying their ability to wage war, we will win it!"
 SOV_Air_Heavy_Fighter:0 "Escort the Revolution"
 SOV_Air_Heavy_Fighter_desc:0 "Our Bombers need escorts to make sure that they get to enemy territories without being destroyed by light interceptors."
 SOV_Air_Naval_Bomber:0 "Spreading the Revolution to the Sea"
 SOV_Air_Naval_Bomber_desc:0 "We need a new kind of bomber to supplement our fleets. If we can destroy the enemy's boats from the air, we will have an undisputed advantage."
 SOV_Air_Fighter_Production:0 "People's Commissariat for Fighter Production"
 SOV_Air_Fighter_Production_desc:0 "Defending our skies is paramount. We must create a new ministry specifically to deal with this."
 SOV_Air_Bomber_Production:0 "People's Commissariat for Bomber Production"
 SOV_Air_Bomber_Production_desc:0 "Victory on the battlefield is vital to the survival of our nation. We must create a new ministry specifically to deal with this."
 SOV_Air_Carrier_Planes:0 "Carrier Planes"
 SOV_Air_Carrier_Planes_desc:0 "Although we do not have enough naval industry to build many carriers, it is a good idea to understand the principles of how the planes take off and land."
 SOV_Air_Doctrine1:0 ""
 SOV_Air_Doctrine1_desc:0 ""
 SOV_Air_Anti_Air:0 "Anti-Air Construction"
 SOV_Air_Anti_Air_desc:0 "Because of our decreased emphasis on fighters, we should focus our military construction priorities on building anti-air emplacements to protect our land from bombers."
 SOV_Air_Bases:0 "People's Airfields"
 SOV_Air_Bases_desc:0 "More air bases will help us be more versetile in the defense of our nation."
 SOV_Air_Doctrine2:0 "Continued Doctrine Development"
 SOV_Air_Doctrine2_desc:0 "With our new technologies, we can go farther and stay in the air longer. Our tactics should reflect these developments."
 ##Diplomacy
 SOV_italy_pact:0 "Italo-Soviet Pact"
 SOV_italy_pact_trade:0 "Italo-Soviet Pact"
 SOV_Stalinist_Italo_Soviet_Pact:0 "Italo-Soviet Pact"
 SOV_Stalinist_Italo_Soviet_Pact_desc:0 "We cannot forget that the first Western Government to recognize the USSR was Mussolini's Italy. Therefore, we must conclude a pact of friendship that includes a trade deal so we can get Italian capital in our lands."
 SOV_Stalinist_Join_LON:0 "Join the League of Nations"
 SOV_Stalinist_Join_LON_desc:0 "The People's Commissariat for Foreign Affairs is currently concerned with defending the USSR from enemy threat. Because Comrade Stalin is personally uninterested in diplomacy right now, Narkomindel has been free to act mostly independently. Thus, they have been pursuing a policy of collective security, and joining the League of Nations is an important step in this direction."
 SOV_collective_security:0 "Wants to work with us"
 SOV_Stalinist_Collective_Security:0 "Collective Security"
 SOV_Stalinist_Collective_Security_desc:0 "The threat of fascism is large, and looms over Europe like a spectre. If we are to survive, we must work with the moderate Capitalist powers."
 SOV_Stalinist_Realpolitik:0 "Realpolitik"
 SOV_Stalinist_Realpolitik_desc:0 "The main goal of our foreign policy is the protection of the Heart of the Revolution. If we are to get guarantees of security from the ultranationalists and radicals themselevs, we will be in a far safer position. After all, the Italian Fascists did quickly recognize the USSR."
 SOV_invaded_poland:0 "Invaded Poland"
 SOV_invaded_poland_hard:0 "Partitioned Poland"
 SOV_expansion:0 "Claims on Us"
 SOV_Stalinist_Expansion:0 "Expansion"
 SOV_Stalinist_Expansion_desc:0 "Although we stand for workers in all countries, our government is interested in reclaiming lands lost in the Treaty of Brest-Litovsk and in the Civil War. This will come at the expense of Poland, Finland, and the Baltic nations."
 ###CS
 SOV_summit_yes:0 "Successful Summit"
 SOV_summit_no:0 "Failed Summit"
 SOV_Stalinist_French_Summit:0 "Improve Franco-Soviet Relations"
 SOV_Stalinist_French_Summit_desc:0 "If we are to successfully secure our territory in Europe, then a relationship with France must be a top priority."
 SOV_Stalinist_German_Summit:0 "Summit with Germany"
 SOV_Stalinist_German_Summit_desc:0 "The German Military is very friendly with the Red Army. We should be working to improve relations with the Central European Power."
 SOV_assistance_no:0 "Refused Treaty of Mutual Assistance"
 SOV_french_assistance_no:0 "§RThe French Have Refused our Treaty of Mutual Assistance§!"
 SOV_german_assistance_no:0 "§RThe Germans Have Refused our Pact of Non-Aggression§!"
 SOV_french_assistance_yes:0 "§GThe French Have Accepted our Treaty of Mutual Assistance§!"
 SOV_german_assistance_yes:0 "§GThe Germans Have Accepted our Pact of Non-Aggression§!"
 SOV_Stalinist_Non_Aggression_France:0 "Franco-Soviet Treaty of Mutual Assistance"
 SOV_Stalinist_Non_Aggression_France_desc:0 "Oweing to common threats, it would be prudent for the French nation and the USSR to defend the other against enemy invasion."
 SOV_Stalinist_Non_Aggression_Germany:0 "German-Soviet Pact of Non-Aggression"
 SOV_Stalinist_Non_Aggression_Germany_desc:0 "If we were to secure guarantees of peace from the Germans, our enemy in the Great War, it would be a grand diplomatic triumph for the Stalinist System."
 SOV_export_oil_germany: "German-Soviet Secret trade agreement"
 SOV_Trade_Policy_loc_France:0 " towards France"
 SOV_Trade_Policy_loc_Germany:0 " towards Germany"
 SOV_Stalinist_Trade_Policy:0 "Reevaluate our Trade Policy[This.SOV_Trade_Policy_loc]"
 SOV_Stalinist_Trade_Policy_desc:0 "We should decrease trade with the power that we did not choose to make a treaty with."
 SOV_decrease_trade_other_power:0 "§YThe Power we did §!§Rnot§!§Y choose to side with will be not favored during trade negotiations."
 SOV_trade_other_power:0 "Took a Side"
 SOV_denoucned:0 "Denounced Us!"
 SOV_Stalinist_Denounce_Nationalist_Spain:0 "Denounce Spanish Nationalists"
 SOV_Stalinist_Denounce_Nationalist_Spain_desc:0 "The Nationalists in Spain stand against the rights of their people! We shall make an official statement to this effect."
 SOV_Stalinist_Friend_Spain:0 "Befriend Spain"
 SOV_Stalinist_Friend_Spain_desc:0 "Now that the Spanish have ended the civil war, we can befriend the new government to ensure that they will not work against us!"
 SOV_befriend_spr_tooltip:0 "§GThe Spanish Civil War has ended (or did not happen), and Spain is socialist§!"
 SOV_Stalinist_Popular_Front:0 "The Popular Fronts"
 SOV_Stalinist_Popular_Front_desc:0 "The \"Third Period\" saw Communist rejection of cooperation with other parties and the labeling of Social Democrats as Social Fascists. However, with the increased threat of Fascism and Nationalism, we must order Comintern parties to organize general antifascist activity."
 USSR_Popular_Front:0 "§YThe USSR has ordered the Comintern to follow the Popular Front strategy.§!"
 SOV_Stalinist_Third_Period:0 "Continue the Third Period"
 SOV_Stalinist_Third_Period_desc:0 "We shall continue our strategy of Non-Cooperation with Social Democratic parties. The only thing more dangerous than a Capitalist or Counter-Revolutionary is a Rival Socialist!"
 USSR_Third_Period:0 "§RThe USSR has ordered the Comintern to follow the Non-Cooperation strategy.§!"
 SOV_Stalinist_Czech_NAP:0 "Non-Aggression Pact with the Czechs"
 SOV_Stalinist_Czech_NAP_desc:0 "A non-aggression pact with Prague will help us facilitate cooperation in Eastern Europe, and provide a sense of security towards the western powers."
 SOV_Stalinist_Denounce_Imperialism:0 "Denounce Imperialism"
 SOV_Stalinist_Denounce_Imperialism_desc:0 "We must let imperialistic countries know that we are fully against their expansion!"
 SOV_send_cze_planes_loc:0 "Fighter Planes"
 SOV_send_cze_arty_loc:0 "Artillery Pieces"
 SOV_send_cze_arms_loc:0 "Infantry Kits"
 SOV_Stalinist_Czech_Guns:0 "Assist the Czechs!"
 SOV_Stalinist_Czech_Guns_desc:0 "[CZE.GetNameDef] are fighting a war, and they need all the help they can get! We should offer them military equipment to prevent their fall."
 SOV_Stalinist_Denounce_Sudeten:0 "Denounce the Munich Agreement"
 SOV_Stalinist_Denounce_Sudeten_desc:0 "The so-called Great Empires of England and France have betrayed their friends in the East to the Germans. We will not stand for this!"
 GER_sudetenland_surrendered:0 "§YThe Germans have annexed the Sudetenland.§!"
 ###RP
 SOV_Stalinist_Realpolitik_GER_Peaceful_Coexistance:0 "Peaceful Coexistence with Germany"
 SOV_Stalinist_Realpolitik_GER_Peaceful_Coexistance_desc:0 "A war with Germany is neither in our nor in Germany's interests. We should prepare a summit to make sure our nations are prepared to work together to ensure peace."
 SOV_italy_assistance_yes:0 "§GBoth the USSR and Italy have made a joint statement denouncing liberalism.§!"
 SOV_italy_assistance_no:0 "§YItaly§! has declined to make a joint statement with us."
 SOV_Stalinist_Realpolitik_ITA_denounce_capitalism:0 "Joint Statement with Italy"
 SOV_Stalinist_Realpolitik_ITA_denounce_capitalism_desc:0 "To ensure that we maintain common interests with Italy, we should sign a joint statement with the Italian Government denouncing Liberal Capitalism once and for all."
 SOV_Stalinist_Realpolitik_FRA_Old_Alliance:0 "Revive Friendship with France"
 SOV_Stalinist_Realpolitik_FRA_Old_Alliance_desc:0 "The Old Alliance of France and Russia must be revived, but first we have to convince the new French Government of our good intentions."
 SOV_need_to_align_first:0 "§YThe effect of this focus depends on the power we choose to align with.§!"
 SOV_nationalist_align_GER:0 " with Germany"
 SOV_nationalist_align_ITA:0 " with Italy"
 SOV_nationalist_align_FRA:0 " with France"
 SOV_Stalinist_Realpolitik_Tank_Research:0 "Armor Research Treaty[This.SOV_nationalist_align]"
 SOV_Stalinist_Realpolitik_Tank_Research_desc:0 "Now that we have managed to improve relations with another anti-liberal power, we should see to it that both nations have a modern military. Otherwise, any kind of land engagement will be lost."
 SOV_Stalinist_Realpolitik_Navy_Research:0 "Naval Research Treaty[This.SOV_nationalist_align]"
 SOV_Stalinist_Realpolitik_Navy_Research_desc:0 "Now that we have managed to improve relations with another anti-liberal power, we should see to it that both nations have a modern navy to compete with the United Kingdom and the United States."
 SOV_italy_nap_yes:0 "§GNon-Aggression Pact with Italy.§!"
 SOV_italy_nap_no:0 "§RNo Non-Aggression Pact with Italy.§!"
 SOV_france_nap_no:0 "§RNo Non-Aggression Pact with France.§!"
 SOV_Stalinist_Realpolitik_NAP:0 "Sign a Non-Aggression Pact[This.SOV_nationalist_align]"
 SOV_Stalinist_Realpolitik_NAP_desc:0 "If we are to ensure cooperation between us and other powers, we must have assurances that either power will not work against the other."
 SOV_befriend:0 "Improved Relations"
 SOV_Stalinist_Realpolitik_Hungary:0 "Improve Relations with Hungary"
 SOV_Stalinist_Realpolitik_Hungary_desc:0 "It would be in our interests to support Hungary against their rivals in the Balkans and the Carpathians."
 SOV_Stalinist_Realpolitik_Yugoslavia:0 "Improve Relations with Yugoslavia"
 SOV_Stalinist_Realpolitik_Yugoslavia_desc:0 "Yugoslavia is surrounded by rivals on all sides; Italy, Hungary, and Bulgaria all have claims on them. We should support the Yugoslavs and maintain a powerful ally in the Balkans."
 SOV_Stalinist_Realpolitik_Devils_Fronts:0 "The Devil's Fronts"
 SOV_Stalinist_Realpolitik_Devils_Fronts_desc:0 "We will end our orders to the Comintern to maintain total Communist Isolation, and order Comintern participants to cooperate with nationalist and fascist parties to overthrow Capitalism!"
 USSR_Devils_Fronts:0 "§YThe USSR has instructed the Comintern to follow the Devil's Front strategy.§!"
 SOV_nationalist_align_GER_tern:0 "German Communists"
 SOV_nationalist_align_FRA_tern:0 "French Communists"
 SOV_nationalist_align_ITA_tern:0 "Italian Communists"
 SOV_foreign_communists:0 "Certain Communist Groups"
 SOV_Stalinist_Realpolitik_End_Support:0 "End Support to [This.SOV_nationalist_align_cmntrn]"
 SOV_Stalinist_Realpolitik_End_Support_desc:0 "We cannot simultaneously support Communist parties in friendly nations and hope to ally these nations at the same time."
 SOV_Stalinist_Realpolitik_Yugoslavia_Advisors:0 "Send Advisors to Yugoslavia"
 SOV_Stalinist_Realpolitik_Yugoslavia_Advisors_desc:0 "Should any foreign power attack Yugoslavia, we would want them to win as our interests would then be secure. To that end, we should offer a military attache to [YUG.GetLeader]."
 SOV_Stalinist_Realpolitik_Hungary_Arms:0 "Send Weapons to Hungary"
 SOV_Stalinist_Realpolitik_Hungary_Arms_desc:0 "We should offer [HUN.GetLeader] a shipment of weapons to ensure that they have enough stockpiles for the Final Struggle."
 ##Part 2
 SOV_Stalinist_Europe_Future:0 "The Future of Europe"
 SOV_Stalinist_Europe_Future_desc:0 "Now that the Great Purge has been dealt with, we must decide our position on Europe's Future."
 ###CS2
 SOV_Stalinist_CS_Phase_2:0 "A Hand to the Capitalists"
 SOV_Stalinist_CS_Phase_2_desc:0 "The Nationalist Powers are a viper in Europe, ready to strike when they see an opportunity. To prevent these strikes from reaching the USSR, we must ally with Capitalist Powers to ensure Collective Security."
 SOV_anti_diplomacy:0 "Took up positions against us."
 SOV_Stalinist_Anti_German:0 "Take up Anti-German Positions"
 SOV_Stalinist_Anti_German_desc:0 "The Germans are the biggest threat to the USSR. We must cooperate with either the British or the French to strangle this revanchist power early."
 SOV_Stalinist_Anti_British:0 "Take up Anti-British Positions"
 SOV_Stalinist_Anti_British_desc:0 "The British Imperialists are the biggest threat to the USSR. We must cooperate with either the Germans or the French to prevent the UK from taking over Russia!"
 SOV_Stalinist_Work_With_Britain:0 "Overtures to London"
 SOV_Stalinist_Work_With_Britain_desc:0 "To fight a power such as Germany, an alliance with the world's strongest power, [ENG.GetNameDef] is a natural course of action."
 SOV_Stalinist_Work_With_France:0 "Meetings in Paris"
 SOV_Stalinist_Work_With_France_desc:0 "A revival of the old Franco-Russian Alliance would do well in moving the axis of Europe to Paris and Moscow."
 SOV_Stalinist_Work_With_Germany:0 "Summits in Berlin"
 SOV_Stalinist_Work_With_Germany_desc:0 "A Soviet-German Alliance would be able to coordinate both in Eastern Europe and Western Europe in ways never seen before in history!"
 SOV_Stalinist_Yalta_Naval_Treaty:0 "The Yalta Naval Treaty"
 SOV_Stalinist_Yalta_Naval_Treaty_desc:0 "If Britain is to consider us to be trustworthy, we must sign a treaty limiting our naval power."
 SOV_Stalinist_Defensive_pact_UK:0 "Anglo-Soviet Defensive Agreement"
 SOV_Stalinist_Defensive_pact_UK_desc:0 "If we are to cooperate with the British against the Germans, we must sign an agreement promising mutual defense. Should any nation attack us, Britain will come to our defense. If [ENG.GetNameDef] is attacked, we will come to their aid."
 SOV_Stalinist_Mutual_Defensive_Pact_France:0 "Franco-Soviet Pact of Mutual Assistance"
 SOV_Stalinist_Mutual_Defensive_Pact_France_desc:0 "If France is attacked, we should be able to come to their aid. But it would be more advantageous for us if they came to our aid as well!"
 SOV_Stalinist_French_Alliance:0 "Treaty of Vitebsk"
 SOV_Stalinist_French_Alliance_desc:0 "A Full Alliance with France would go a long way in ensuring both the safety of our territorial borders and the safety of socialism!"
 SOV_Stalinist_Potsdam_Concordat:0 "The Potsdam Concordat"
 SOV_Stalinist_Potsdam_Concordat_desc:0 "A treaty of non-aggression with Germany would ensure that neither power would take action against the other, thus securing relations and our territorial integrity."
 GER_must_be_not_hostile_tt:0 "§YThis focus requires that Germany not be hostile or ideologically incompatible with the USSR.§!\n"
 SOV_Stalinist_German_Alliance:0 "Alliance with Germany"
 SOV_Stalinist_German_Alliance_desc:0 "An Alliance with Germany will ensure both that we can give Britain a hard fight, and that Germany will not be encroaching on our territory."
 SOV_Stalinist_International_Air_Training:0 "Cooperative Aerial Training"
 SOV_Stalinist_International_Air_Training_desc:0 "To improve both nations' militaries, we can send our new ally an offer to create a mutual air force training program."
 SOV_Stalinist_International_Army_Training:0 "Mutual Army Training Program"
 SOV_Stalinist_International_Army_Training_desc:0 "To improve both nations' militaries, we can send our new ally an offer to create a mutual army training program."
 ###Isolation
 SOV_Stalinist_Neutrality:0 "End Foreign Policy Adventures"
 SOV_Stalinist_Neutrality_desc:0 "The USSR is the strongest nation in the world; we have no need of foreign alliances and agreements! That being said, if an enemy attacks our territory, we must be ready to respond in kind!"
 SOV_Stalinist_Attack_For_Motherland:0 "Attack for the Rodina!"
 SOV_Stalinist_Attack_For_Motherland_desc:0 "If the enemy puts one foot on our soil we must drive them out with the force of a thousand winds!"
 SOV_Stalinist_Defend_For_Motherland:0 "Defend the Rodina!"
 SOV_Stalinist_Defend_For_Motherland_desc:0 "If the enemy tries to reach our soil we must see to it that they go no further into our country!"
 SOV_Stalinist_Minsk_Forts:0 "The Minsk Line"
 SOV_Stalinist_Minsk_Forts_desc:0 "A set of fortifications in and around Minsk will help in defending Belarus from enemy attack."
 SOV_Stalinist_Moscow_Forts:0 "The Moscow Line"
 SOV_Stalinist_Moscow_Forts_desc:0 "A short series of fortifications in Moscow would prevent the enemy - whoever they may be - from seizing the city!"
 SOV_Stalinist_Zaporozhe_Forts:0 "The Black Sea Line"
 SOV_Stalinist_Zaporozhe_Forts_desc:0 "A small series of forts in Zaporozhye behind the Dnieper would help secure our position by the Black Sea."
 SOV_Stalinist_Kiev_Forts:0 "The Kiev Line"
 SOV_Stalinist_Kiev_Forts_desc:0 "Although it would make more sense to put the forts behind the river, Comrade Stalin is insistant that we defend the city itself."
 SOV_Stalinist_Stalingrad_Forts:0 "The Stalingrad Line"
 SOV_Stalinist_Stalingrad_Forts_desc:0 "Although it would make more sense to put the forts behind the Volga, Comrade Stalin is insistant that we focus a defense of Stalingrad on the city itself."
 SOV_Stalinist_Partisans:0 "Partisans, Arise!"
 SOV_Stalinist_Partisans_desc:0 "The Enemy is in our land, and the people should not stand for it. We should broadcast propaganda encouraging partisan activity.!"
 ###RP2
 SOV_Stalinist_Support_The_Nationalists:0 "Dealing with the Devil"
 SOV_Stalinist_Support_The_Nationalists_desc:0 "It is clear that Europe's future cannot be decided by the Capitalist Democracies. We must ally with the Devil to secure our dominance!"
 SOV_interest:0 "Expressed Interest in Cooperation"
 SOV_Stalinist_Meet_With_Italians:0 "Meet with the Italians"
 SOV_Stalinist_Meet_With_Italians_desc:0 "Comrade Stalin has expressed interest in continued cooperation with [ITA.GetNameDef]."
 SOV_Stalinist_Meet_With_Germans:0 "Approach [GER.GetLeader]"
 SOV_Stalinist_Meet_With_Germans_desc:0 "[GER.GetLeader], the leader of [GER.GetNameDef], is a direct threat to us. It is obvious that we must get direct assurances that Germany will not attack the USSR."
 SOV_provide_resources_to_germany: "Provide resources to Germany"
 SOV_provide_resources_to_germany: "The Germans seem willing to not attack us and instead seem to focus opposing the capitalistic west with the intention of one day subjugating them. There is no better situation for the USSR than the western imperialistic countries fighting between themselves, as they weaken themselves while we only have to sit and watch. But for this fight to occur we need to supply the German war machine with resources such as oil and steel so they can be up to the task."
 SOV_Stalinist_Meet_With_French:0 "The Franco-Russian Alliance"
 SOV_Stalinist_Meet_With_French_desc:0 "We must take steps to begin the Franco-Russian Alliance anew, this time instead of a Democracy and an Autocracy, two Autocracies shall be united by common goals."
 SOV_Stalinist_Rhodes_Plan:0 "The Rhodes Plan"
 SOV_Stalinist_Rhodes_Plan_desc:0 "To be discussed in secret with the Italians, the Rhodes plan will be a process of achieving a mutual military alliance between [This.GetNameDef] and [ITA.GetNameDef]. The key to this plan is Turkey; if we can get Turkey to join the alliance (and thus grant us access to the Turkish Straits), we can then comfortably ally with the Italians, knowing that our supply routes are safe."
 SOV_Stalinist_Turkish_Alliance:0 "The Treaty of Batumi"
 SOV_Stalinist_Turkish_Alliance_desc:0 "Now that the Rhodes Plan has been approved by both the USSR and Italy, we must get to work forming an alliance with Turkey. However, there are a few issues that must be cleared up. First there is the issue of the Turkish Straits. It goes without saying that if we are to ally with Turkey, they should have to give us free passage. Secondly, Turkish claims on Batumi have to be dropped. We can offer to drop claims on Turkish Armenia in exchange."
 SOV_Stalinist_Italian_Alliance:0 "Alliance with Italy"
 SOV_Stalinist_Italian_Alliance_desc:0 "The second phase of the Rhodes Plan is the formal ratification of a military alliance with the Italians. The Central Committee has already given Carte Blanche to the foreign ministry to develop the treaty and get the Italians to sign the agreement. We now only depend on the Italians."
 SOV_Stalinist_RP2_Trade:0 "Hammer Out a Trade Deal"
 SOV_Stalinist_RP2_Trade_desc:0 "We should cooperate with our friends by making sure that trade between our nations proceeds quickly and smoothly."
 MR_pact_flag:0 "§RMolotov§!-§wRibbentrop§! Pact"
 SOV_Stalinist_Alliance_With_Germany:0 "Alliance with Germany"
 SOV_Stalinist_Alliance_With_Germany_desc:0 "We should take our cooperation further with Germany and form a full military alliance. In reality, we can use them as a force against the Liberal West!"
 SOV_Stalinist_Partition_Germany:0 "The Kiev Agreement"
 SOV_Stalinist_Partition_Germany_desc:0 "Our Foreign Office has formulated a secret plan that would require a Franco-Soviet effort to partition Germany. All German Land East of the Elbe will go to the USSR, and all land to the West will go to France. The plan only depends on [FRA.GetLeader]'s signature."
 PG_pact:0 "Agreed to Partition Germany"
 refused_PG_pact:0 "Refused to Partition Germany"
 SOV_Stalinist_Distance_Poland:0 "Diplomatically Isolate Poland"
 SOV_Stalinist_Distance_Poland_desc:0 "As Long as Poland is protected by France, we will not be able to work with the French effectively. If they will not do so willingly, then they can always be bribed..."
 SOV_Stalinist_Alliance_With_France:0 "Alliance with France"
 SOV_Stalinist_Alliance_With_France_desc:0 "If Europe is to be split, then a Franco-Soviet alliance will be the natural axis of the partitioners. Half of Europe goes to France, the other half to the USSR..."
 ##Expansion
 SOV_MR_Pact_Focus: "Pact with the Germans"
 SOV_MR_Pact_Focus_desc: ""
 SOV_Ultimatum_to_Finland:0 "Ultimatum to Finland"
 SOV_Ultimatum_to_Finland_desc:0 "The Finnish border is far too close to Leningrad. We should demand that the Finns allow us to occupy a stretch of land 30 km to the North. In exchange, we will offer them some of Karelia. If they refuse, then the military option will be on the table..."
 SOV_Fortify_Finnish_Bases:0 "Fortify Hanko"
 SOV_Fortify_Finnish_Bases_desc:0 "We must build a naval base in the Hanko peninsula to house our fleet!"
 SOV_invasion_decisions:0 "Invasion Plans"
 SOV_invasion_decisions_desc:0 "Dummy"
 democratic_germany_exists_tt:0 "Germany is not an expansionist dictatorship"
 activate_soviet_invasion_of_poland:0 "§RWe will invade Poland§! (This will be done through border wars)"
 SOV_attack_poland_too_early_tt:0 "§RIf §YWarsaw§! has not been occupied/encircled by [GER.GetFlag]§YGermany§!, we will get the following effects:§!"
 SOV_anger_the_germans_over_MR_tt:0 "§RThe Germans will keep all of Poland to themselves!§!"
 SOV_warning_not_invading_poland_tt:0 "[GER.GetFlag]§YGermany§! will make a separate peace with Poland, giving us no land!"
 SOV_we_will_invade_poland_tt:0 "§GWe will commence the Invasion§!"
 SOV_poland_is_crumbling_tt:0 "§CPoland is crumbling, this might be a good opportunity to attack!§!"
 SOV_Invade_Poland:0 "Invade Poland"
 SOV_Invade_Poland_desc:0 "Half of Belarus and a large portion of Ukraine will be returned to Russia through the might of the Red Army!"
 SOV_Demand_Bessarabia:0 "Demand Bessarabia"
 SOV_Demand_Bessarabia_desc:0 "We shall submit a demand to the government of Romania demanding that they turn over Bessarabia and Bucovina over to us, on threat of war."
 SOV_Bases_in_the_Baltic:0 "Bases in the Baltic"
 SOV_Bases_in_the_Baltic_desc:0 "We must demand the ability to host military bases on the territory of the Baltic nations. We can use these to demand annexations later on."
 SOV_Occupy_Baltic:0 "Occupy the Baltic States"
 SOV_Occupy_Baltic_desc:0 "Now that we have soldiers placed in the Baltic States, we should be able to use them as leverage to force the Baltic Governements to appoint Communist Governments."
 SOV_will_be_annexed:0 "§RWe will be annexed into the Soviet Union.§!"
 SOV_Attack_Xinjiang:0 "Invade Xinjiang"
 SOV_Attack_Xinjiang_desc:0 "Xinjiang should be invaded in order to secure our Southern border in China. It is a natural extension of our Regime in Central Asia."
 SOV_Attack_Manchuria:0 "Operation Davydov"
 SOV_Attack_Manchuria_desc:0 "The Inventor of Hedonistic Hussar Poetry, Denis Davydov was a famous Imperial General of the Napoleonic Wars. We shall name our plan to invade Manchuria after him."
 SOV_Attack_Japan:0 "Retake Southern Sakhalin!"
 SOV_Attack_Japan_desc:0 "Stolen from us in the Russo-Japanese War, Southern Sakhalin will rejoin our nation once more! The Kuril Islands and Hokkaido can join as well."
 ####GPW
 SOV_GPW:0 "Great Patriotic War Focus Tree"
 SOV_GPW_War_Upon_Us:0 "War Is Upon Us!"
 SOV_GPW_War_Upon_Us_desc:0 "The enemy has invaded, so we must mobilize the people to stop them!"
 SOV_GPW_Free_Religious_Prisoners:0 "Free Religious Prisoners"
 SOV_GPW_Free_Religious_Prisoners_desc:0 "As long as they do not get involved in politics, all Orthodox Priests may walk free."
 SOV_GPW_Pray_For_Nation:0 "Pray for the Nation"
 SOV_GPW_Pray_For_Nation_desc:0 "The People must Pray for the USSR, Pray for the Red Army, and Pray for the Iron Marshal!"
 SOV_GPW_Appoint_Patriarch:0 "Appoint a Patriarch"
 SOV_GPW_Appoint_Patriarch_desc:0 "As per our negotiations with Metropolitan Sergius, we will allow the Church to operate (under the supervision of the NKVD), and Sergius will be appointed Patriarch of the Russian Orthodox Church!"
 SOV_GPW_Lock_Them_Back_Up:0 "Re-imprison the Clergy"
 SOV_GPW_Lock_Them_Back_Up_desc:0 "Now that our victory is assured, the Clergymen should go back to prison, where they belong!"
 SOV_GPW_Free_Political_Prisoners:0 "Free Political Prisoners"
 SOV_GPW_Free_Political_Prisoners_desc:0 "There are some political prisoners we must free on the condition that they mobilize whatever followers they have - if they have any at all - to serve the nation!"
 SOV_GPW_Soviet_Socialist_Patriotism:0 "Soviet Socialist Patriotism"
 SOV_GPW_Soviet_Socialist_Patriotism_desc:0 "All Peoples of the USSR must remember that they serve not just an ideology, but a nation. The Russians, the \"elder brothers of the Soviet people\", will be at the helm!"
 SOV_GPW_Rationing:0 "Ration Program"
 SOV_GPW_Rationing_desc:0 "We need an intense rationing program to ensure the Red Army has enough resources to fight! The city dwellers will get a little bit of food, but the peasants will be made to live off their harvest."
 SOV_GPW_Fight_Ethnic_Nationalism:0 "Fight Ethnic Nationalism"
 SOV_GPW_Fight_Ethnic_Nationalism_desc:0 "It is the opinion of Comrade Stalin that many nationalities, such as the Baltic Peoples and the Ukrainians, will work against the USSR due to their hate of Russia. We must stop this as soon as possible!"
 SOV_GPW_Free_Scientific_Prisoners:0 "Free Scientific Prisoners"
 SOV_GPW_Free_Scientific_Prisoners_desc:0 "If we are to win the Great Patriotic War, we must allow imprisoned scientists to work for benefit!"
 SOV_GPW_Improve_Industry:0 "Improve our Industry"
 SOV_GPW_Improve_Industry_desc:0 "We need engineers to work on new industrial machinery, to ensure maximum possible output."
 SOV_GPW_Think_for_Rodina:0 "Think for the Rodina"
 SOV_GPW_Think_for_Rodina_desc:0 "We must force our scientists to do the work exactly to our specifications and within Socialist Ideology."
 SOV_GPW_Atomic_Spies:0 "Atomic Spies"
 SOV_GPW_Atomic_Spies_desc:0 "We can send spies to nations with greater atomic capabilities to steal the technology for ourselves."
 ##Economy
 SOV_GPW_Move_Towards_War_Economy:0 "Move Towards War Economy"
 SOV_GPW_Move_Towards_War_Economy_desc:0 "If we are to survive, we need an immediate turn towards an economy built for war!"
 SOV_GPW_Convert_Tractor_Factories:0 "Convert Tractor Factories"
 SOV_GPW_Convert_Tractor_Factories_desc:0 "Tractor Factories in Chelyabinsk and Stalingrad can easily be turned into tank factories."
 SOV_GPW_Convert_Civ_Factories:0 "Convert Civilian Factories"
 SOV_GPW_Convert_Civ_Factories_desc:0 "Consumer goods are not a priority right now, as if we cannot produce arms, there will be no more consumers to produce for!"
 SOV_GPW_Increase_Production:0 "Increase Arms Production"
 SOV_GPW_Increase_Production_desc:0 "With Conversion out of the way, we can now work on increasing our arms production capabilities from scratch."
 SOV_GPW_More_Evacuation:0 "Council of Evacuation"
 SOV_GPW_More_Evacuation_desc:0 "The Council of Evacuation will be created to carry out our plans of industry relocation for the duration of the war."
 SOV_worker_mobilize:0 "Mobilized Workers"
 SOV_GPW_Mobilize_Workers:0 "Mobilize the Proletariat"
 SOV_GPW_Mobilize_Workers_desc:0 "Long shifts and seven day work weeks are vital for our production, as are new laws against unwilling workers. All must make sacrifices for the nation, and the proletariat are no different."
 SOV_GPW_Coal_Urals:0 "Steel in the Urals"
 SOV_GPW_Coal_Urals_desc:0 "Coal plants and steelworks in and near the Ural Mountains will provide us with a supply of steel safe from enemy attack."
 SOV_GPW_Oil_Volga:0 "Oil on the Volga"
 SOV_GPW_Oil_Volga_desc:0 "An oil refinery in the Volga Region should be safe from enemy attack and give us an easily transportable source of fuel."
 SOV_GPW_Power_Siberia:0 "Power Stations in Siberia"
 SOV_GPW_Power_Siberia_desc:0 "If our electricity generation stations are lost, the war is lost. We must build new ones in Siberia."
 SOV_GPW_Sacrifice_Consumer:0 "Sacrifice the Consumer"
 SOV_GPW_Sacrifice_Consumer_desc:0 "The needs of the consumers are vastly dwarfed by the needs of the military. As we have said, all must make sacrifices in times of need."
 SOV_sacrifice_consumers:0 "Disregarded Consumers"
 SOV_GPW_Empower_Gosplan:0 "Empower Gosplan"
 SOV_GPW_Empower_Gosplan_desc:0 "The Gosudarstveny Komitet po Planirovaniyu - State Planning Committee - known more commonly as Gosplan, is the ministry responsible for central economic planning. It should be empowered with all the necessary authority to manage the war economy."
 SOV_GOSPLAN:0 "State Planning Committee"
 SOV_agricultural_alleviation:0 "Agricultural Support"
 SOV_GPW_Agriculture:0 "Agricultural Developments"
 SOV_GPW_Agriculture_desc:0 "Focusing some of our efforts on agriculture should help alleviate the situation somewhat."
 ##Military
 SOV_GPW_Reintroduce_Guard_Units:0 "Guard Units"
 SOV_GPW_Reintroduce_Guard_Units_desc:0 "The old rank of Guards will be re-introduced for units who show exemplary skill in combat and loyalty to the nation!"
 SOV_guards_tt:0 "§GA Guard Unit Template will now be available.§!\n"
 SOV_military_morale:0 "For the Motherland!"
 SOV_military_morale2:0 "For the Motherland!"
 SOV_GPW_Motherland_and_Nation:0 "Rodina and Nation"
 SOV_GPW_Motherland_and_Nation_desc:0 "A sufficiently determined soldier can storm a fortress, so we will make our soldiers determined!"
 SOV_GPW_Celebrate_Officers:0 "Celebrate Pre-Soviet Officers"
 SOV_GPW_Celebrate_Officers_desc:0 "Alexander Nevsky and Pyotr Bagration were patriots who fought for their country, regardless of their Monarchism!"
 SOV_GPW_Abolish_Political_Commissars:0 "Abolish Political Commissars"
 SOV_GPW_Abolish_Political_Commissars_desc:0 "The military has made it clear that our officers are only hindered by our Party Liasons. Therefore, Commissars must be abolished so the military can do its job."
 SOV_military_commissars:0 "Political Commissars"
 SOV_military_commissars_desc:0 "Political Commissars in the military serve as the political officer. They make sure that all military maneuvers have some sort of political and/or propaganda value. They are sent from the party to keep watch over all military headquarters, as the commanders cannot be trusted."
 SOV_nkvd:0 "Osobisty"
 SOV_GPW_NKVD_Agents:0 "The Osobisty"
 SOV_GPW_NKVD_Agents_desc:0 "NKVD Military Counter-Intelligence Officers will replace the old commissars. Although their work has no political value, they will make sure that disloyal officers and soldiers are punished accordingly."
 SOV_GPW_Women_in_Aviation:0 "Women in Aviation"
 SOV_GPW_Women_in_Aviation_desc:0 "With the men on the ground, a few thousand women serving in aerial detatchments would not go amiss."
 SOV_shtrafbat:0 "Penal Batallions"
 SOV_GPW_Shtrafbat:0 "Shtrafnye Bataliony"
 SOV_GPW_Shtrafbat_desc:0 "Penal Batalions, also called Shtrafbaty, will be composed of prisoners, mainly deserters, cowards, or Gulag inmates. They will be a good compliment to our regular soldiers, and will make for decent cannon fodder."
 SOV_GPW_Military_Development:0 "Army Improvements"
 SOV_GPW_Military_Development_desc:0 "Now that the shock of the invasion is over, we can get to work improving our army."
 SOV_GPW_Develop_Tactics:0 "Adapt Army Tactics"
 SOV_GPW_Develop_Tactics_desc:0 "We must improve our tactics if we are to be victorious."
 SOV_GPW_Mechanized:0 "Improve Mechanization"
 SOV_GPW_Mechanized_desc:0 "Our early attempts of mechanization let us learn from our mistakes!"
 SOV_GPW_Arm_the_Troops:0 "Arm the Troops"
 SOV_GPW_Arm_the_Troops_desc:0 "If our soldiers are to succeed, they need modern weapons."
 SOV_cult_sacrifice:0 "Cult of Sacrifice"
 SOV_GPW_Cult_of_Sacrifice:0 "Cult of Sacrifice"
 SOV_GPW_Cult_of_Sacrifice_desc:0 "Sacrificing oneself for the nation is the noblest sacrifice of all! We will make sure that our soldiers understand this."
 SOV_GPW_Tanks:0 "New Tank Designs"
 SOV_GPW_Tanks_desc:0 "The development of new tank designs will be paramount to assert our dominance on the battlefield."
 SOV_GPW_Rocket_Artillery:0 "The Katyusha"
 SOV_GPW_Rocket_Artillery_desc:0 "Rocket Artillery is less accurate, but more powerful. Some of these migh tbe a good supplement to our equipment."
 SOV_GPW_Navy:0 "Rebuild the Navy"
 SOV_GPW_Navy_desc:0 "We have let the navy fall into disrepair, and now is the time we may need it most."
 SOV_GPW_Subs:0 "Above and Below"
 SOV_GPW_Subs_desc:0 "The Nation must make its will known not only above the water, but below the water as well."
 SOV_GPW_Torpedos:0 "Improve Torpedos"
 SOV_GPW_Torpedos_desc:0 "Our ships will be nothing without decent torpedos, especially not our submarines."
 SOV_GPW_Doctrines:0 "Consult Glavkom VMF"
 SOV_GPW_Doctrines_desc:0 "The Commander-in-Chief of the Soviet Navy is in charge of managing all naval maneuvers and developing tactics. We should consult with him to see what our tactics should be."
 SOV_GPW_Capital_Ships:0 "A Strong Backbone"
 SOV_GPW_Capital_Ships_desc:0 "We do not have the necessary infrastructure to build a massive battleship fleet. Cruisers will have to suffice for now."
 SOV_GPW_Dockyards:0 "A Large Fleet"
 SOV_GPW_Dockyards_desc:0 "No matter what our strategy is, we need a larger fleet to remain competetive. Therefore, we must build more dockyards."
 SOV_GPW_Naval_Equipment:0 "A Larger Naval Research Budget"
 SOV_GPW_Naval_Equipment_desc:0 "The navy still insists that our recent naval developments are not enough. They demand that more funding goes into research."
 SOV_GPW_Air_Force:0 "Improve the Air Force"
 SOV_GPW_Air_Force_desc:0 "The key to our victory will be a combined arms effort between the Air Forces and the Army. Thus, we need a stronger airforce."
 SOV_GPW_Fighters:0 "Planes for our Aces"
 SOV_GPW_Fighters_desc:0 "The USSR produces the Greatest Pilots in the world! They deserve better planes!"
 SOV_GPW_Heavy_Fighters:0 "Escort our Bombers"
 SOV_GPW_Heavy_Fighters_desc:0 "To protect our bombers against enemy fighters, we need a class of escort planes to support them."
 SOV_GPW_Bomber:0 "Combat Bombers"
 SOV_GPW_Bomber_desc:0 "The ability to hit enemy troops mid-combat will be a great boon to the army."
 SOV_GPW_Moscow_to_Paris:0 "From Moscow to Paris"
 SOV_GPW_Moscow_to_Paris_desc:0 "Alexander I chased Napoleon to Paris within two years. With more advanced strategic bombers, we will be able to do the same in a day."
 SOV_GPW_Naval_Air:0 "Naval Bomber Development"
 SOV_GPW_Naval_Air_desc:0 "Our navy might not be rebuilt, but we can still use naval bombers to attack enemy ships."
 SOV_GPW_Air_Doctrine:0 "Air Doctrine Development"
 SOV_GPW_Air_Doctrine_desc:0 "Since we have more capable air craft, we should develop new tactics to make full use of them."
 ###Foreign
 SOV_GPW_Foreign_Policy:0 "Review Foreign Policy"
 SOV_GPW_Foreign_Policy_desc:0 "It is clear that our foreign policy strategies have not prepared us for this eventuality. We must review our policy and adjust when necessary."
 SOV_GPW_Anglo_Soviet_Agreement:0 "Anglo-Soviet Agreement"
 SOV_GPW_Anglo_Soviet_Agreement_desc:0 "We must make an agreement with [ENG.GetNameDef] to ensure that we will not take action against each other. That way, one country can assist the other, and the war can be over faster."
 SOV_GPW_Align_With_France:0 "Franco-Soviet Treaty"
 SOV_GPW_Align_With_France_desc:0 "France and the USSR are natural allies. As we are fighting on the same side, friendship can come easily."
 SOV_GPW_Align_With_Germany:0 "Moscow-Berlin Accords"
 SOV_GPW_Align_With_Germany_desc:0 "Although we are fighting on the same side, it is imperative to ensure that we and the Germans have a non-aggression pact."
 SOV_GPW_Align_With_Italy:0 "Italo-Soviet Pact"
 SOV_GPW_Align_With_Italy_desc:0 "An agreement between Italy and the USSR would do well to ensure that our Black Sea ports are guarded from attack."
 SOV_GPW_Align_With_Japan:0 "Soviet-Japanese Concords"
 SOV_GPW_Align_With_Japan_desc:0 "War makes for strange bedfellows, but in this time of need, we must set aside our differences and approach the Japanese for mutual assistance."
 SOV_GPW_Anglo_Soviet_Tech:0 "RADAR Station Lend-Lease"
 SOV_GPW_Anglo_Soviet_Tech_desc:0 "Our RADAR technology is far behind British levels. We should ask the British government for parts that would allow us to build radar emplacements."
 SOV_radar_building:0 "English RADAR Parts"
 SOV_GPW_Anglo_Soviet_Liscense_Weapons:0 "[LicenseOrBuy] Fighters from [ENG.GetNameDef]"
 SOV_GPW_Anglo_Soviet_Liscense_Weapons_desc:0 "The British have better fighter planes than we do. We should ask if we can [LicenseOrBuy] some of them."
 LicenseKey:0 "License"
 BuyKey:0 "Buy"
 SOV_GPW_American_NAP:0 "Befriend the Americans"
 SOV_GPW_American_NAP_desc:0 "The United States is an industrial powerhouse, with production levels far greater than our own. If we improve relations with them, we might be able to get lend-lease agreements."
 SOV_GPW_Attack_Far_East:0 "Secure the Far East"
 SOV_GPW_Attack_Far_East_desc:0 "A preemptive strike on Japan and Manchuria would enable us to secure our Eastern Frontier."
 SOV_GPW_Coord_with_Germany:0 "Military Coordination with Germany"
 SOV_GPW_Coord_with_Germany_desc:0 "To fight our enemies succesfully we will need mutual access through German Territory."
 SOV_GPW_Trade_with_Germany:0 "German-Soviet Trade Relations"
 SOV_GPW_Trade_with_Germany_desc:0 "Both we and the Germans need resources that the other has. Therefore, we should work to improve trade relations."
 SOV_GPW_German_Tech:0 "Technology Agreement with the Germans"
 SOV_GPW_German_Tech_desc:0 "The Germans have excellent Industrial Technology, while our Tank Designs are above-par. We should work to exchange these technologies."
 SOV_GPW_Secure_Iran:0 "Head to the Persian Gulf"
 SOV_GPW_Secure_Iran_desc:0 "The Iranian Government is somewhat friendly with a hostile power. Therefore, we should invade them to neutralize the threat. Additionally, their oil would be a good addition to our reserves."
 SOV_GPW_Secure_Iraq:0 "Secure Iraq"
 SOV_GPW_Secure_Iraq_desc:0 "Having Iraq on our borders is a threat. An Oil-Rich nation with possible ties to hostile governments cannot go on existing."
 SOV_GPW_Coord_With_France:0 "Military Coordination with France"
 SOV_GPW_Coord_With_France_desc:0 "It is possible that we would need to fight alongside French Soldiers. Thus, we should offer mutual military access to the French."
 SOV_GPW_French_Industrial_Grants:0 "French Industrial Grants"
 SOV_GPW_French_Industrial_Grants_desc:0 "French Industry is very capable. We should pay them to help us build up our arms industries."
 SOV_GPW_French_Tank_Designs:0 "[LicenseOrBuy] French Tanks"
 SOV_GPW_French_Tank_Designs_desc:0 "French Heavy Tanks - Specifically the Renault B1 - are fearsome on the battlefield. If we had access to those designs, we could be just as fearsome!"
 SOV_GPW_Secure_Romania:0 "Yassy-Kishinev Offensive"
 SOV_GPW_Secure_Romania_desc:0 "Romania is an oil-rich nation in Europe, right on our borders. Therefore, they can potentially trade with the enemy. This cannot be allowed."
 SOV_GPW_Secure_Bulgaria:0 "Operation Skobelev"
 SOV_GPW_Secure_Bulgaria_desc:0 "Named after a General in the Russo-Turkish war that helped liberate Bulgaria, the invasion of Bulgaria will liberate them from their imperialist ways!"
 SOV_GPW_Secure_YUG:0 "Liberate our South Slavic Brothers"
 SOV_GPW_Secure_YUG_desc:0 "Yugoslavia is weak, ready to fall apart with the slightest breeze. We must impose our own order there."
 SOV_GPW_ITA_Docking:0 "Naval Coordination with Italy"
 SOV_GPW_ITA_Docking_desc:0 "Supporting Italy in the Mediterranian will be vital to secure our imports and the Black Sea in general."
 SOV_GPW_ITA_Trade:0 "Oil to Italy"
 SOV_GPW_ITA_Trade_desc:0 "We must guarantee that the Italians can get all the oil they need for their large navy."
 SOV_GPW_ITA_Milaccess:0 "Military Coordination with Italy"
 SOV_GPW_ITA_Milaccess_desc:0 "It is not enough to have naval access to Italy. To better fight our enemies, we need to be able to land soldiers in Italy."
 SOV_GPW_Secure_Turkey:0 "Hegemon of the Bosphorous"
 SOV_GPW_Secure_Turkey_desc:0 "Joseph Stalin will soon be the Great Hegemon of the Bosphorous, accomplashing what no Tsar ever did!"
 SOV_GPW_Secure_Greece:0 "A Socialist Aegean"
 SOV_GPW_Secure_Greece_desc:0 "The Aegean Sea, and thus all naval maneuvers - including trade - in the Black Sea, will soon be entirely controlled by the USSR!"
 SOV_GPW_Japanese_Resources:0 "East Asian Trade Deals"
 SOV_GPW_Japanese_Resources_desc:0 "Trading with Japan and its Sphere will ensure that we have a steady supply of Aluminum and Steel, and allow the Japanese war machine a steady supply of oil."
 SOV_GPW_Sakhalin_for_Wargoals:0 "Treaty of Sakhalin"
 SOV_GPW_Sakhalin_for_Wargoals_desc:0 "Sakhalin is rightfully ours, yet it was stolen by the Japanese in the Russo-Japanese war over 30 years ago. We should negotiate for its return. In exchange, we will help Japan in China. In addition, we will allow Japan rights to the oil in the region for 20 years."
 SOV_invade_china_tt:0 "§GWe will gain wargoals on every Northern Chinese state that is at war with Japan.§!\n"
 SOV_GPW_Invade_China:0 "Assist Japan in China"
 SOV_GPW_Invade_China_desc:0 "If the Japanese are to win against the more vital enemies, they will need assistance in China, first."
 SOV_GPW_Coord_Jap:0 "Military Coordination with Japan"
 SOV_GPW_Coord_Jap_desc:0 "To ensure that maneuvers in China or India live up to their potential, we will need mutual territorial access with the Japanese."
 SOV_GPW_Secure_Afg:0 "Graveyard No More"
 SOV_GPW_Secure_Afg_desc:0 "Afghanistan is known as the Graveyard of Empires. We shall prove the saying wrong!"
 no_india_tt:0 "§RNo State in India Exists.§!\n"
 SOV_GPW_Secure_India:0 "Secure India"
 SOV_GPW_Secure_India_desc:0 "India is a potential trade partner for all nations involved in the conflict. We should secure the resources for ourselves."
 #### Post-War
 ussr_post_war_focus:0 "Post-War Stalinist Tree"
 SOV_GPW_War_Is_Over:0 "Societal Reconstruction"
 SOV_GPW_War_Is_Over_desc:0 "The Great Patriotic War has taken a large toll on the people and the country as a whole. We must rebuild!"
 SOV_Post_War_Collectivization:0 "Collectivization of Conquered Territories"
 SOV_Post_Collectivize_New_Lands:0 "Collectivize Conquered Territories"
 SOV_Post_Collectivize_New_Lands_desc:0 "Our new territories are not yet rebuilt on the Soviet Model. Our government must begin collectivizing agriculture once more."
 SOV_Post_Anti_Intel:0 "Anti-Intellectualism"
 SOV_Post_Anti_Intellectualism:0 "Anti-Intellectualism Campaign"
 SOV_Post_Anti_Intellectualism_desc:0 "The Intellectuals are a danger to the Soviet Order. The Writers, Composers, and Film Directors are all conspiring to bring down our Socialist State!"
 SOV_Post_No_Freedom:0 "Re-Restrict the Population"
 SOV_Post_No_Freedom_desc:0 "Due to the chaos of the War, we loosened the people's chains a little bit. It is time to reforge them, and return to normalcy."
 SOV_Post_Lysenkoism:0 "Lysenkovshchina"
 SOV_Post_Lysenkoism_desc:0 "Trofim Lysenko produces the only correct theories. Acquired characterstics can obviously be inherited, as genetics is the product of the fascist fly-loving biologists. Any other science is hogwash!"
 SOV_Lysenkoism:0 "Lysenkoism"
 SOV_Post_Big_Deal:0 "The Big Deal"
 SOV_Post_Big_Deal_desc:0 "If we are to build up the country, we cannot rely on the Proletariat. They are simply incapable of doing so. It is the White-Collar Professional: Engineers, Bureaucrats, and Economists, who will be our base of support! We will give them a good life, and they will uphold the nation."
 SOV_Post_Deheroization:0 "Deheroization"
 SOV_Post_Deheroization_desc:0 "The Soviet Hero of Old was a zealous worker, working only for the collective and sacrificing himself for the Revolution. But this is not how people live and act. Why show the people a charicature of themselves when we can depict life realistically?"
 SOV_deproletarianization:0 "Deproletarianization"
 SOV_Post_Deproletarianization:0 "Deproletarianization"
 SOV_Post_Deproletarianization_desc:0 "The Proletarians are a good bunch. They possess the correct political opinions (we think) yet lack skill. We must encourage intelligent work, not manual labor."
 SOV_embourgeoisement:0 "Embourgeoisement"
 SOV_Post_Embourgeoisement:0 "Embourgeoisement" 
 SOV_Post_Embourgeoisement_desc:0 "The Bourgeoise value luxury and comfort. Is this not how we want people to live? We must teach them that a comfortable life is their goal." 
 SOV_big_deal:0 "The Big Deal"
 SOV_Post_Socialist_Realism:0 "Zhdanovshchina"
 SOV_Post_Socialist_Realism_desc:0 "Our Literature and Films must display the best engineers, the smartest scientists, and purist ideologues. For if Ideology is strong enough, it can overcome any scientific law!"
 SOV_postwar_bureaucracy:0 "Post-War Bureaucracy"
 SOV_Post_Bureaucracy:0 "New Apparatchiki"
 SOV_Post_Bureaucracy_desc:0 "The Post-War Bureaucracy does not need to be the most ideologically pure, but they need to be capable."
 SOV_Post_Return_To_Normalcy:0 "Return to Normalcy"
 SOV_Post_Return_To_Normalcy_desc:0 "The basis of our reconfiguring of society is fundamentally complete. We now simply need to wait, and the people will fall in line all on their own."
 ##Economy
 SOV_Post_War_Plan_tt:0 "§YThe Fourth Five-Year Plan will begin!§!\n"
 SOV_Post_4FYP_Start:0 "The Fourth Five-Year Plan"
 SOV_Post_4FYP_Start_desc:0 "The Fourth Five-Year Plan will be focused on restoring the country to its previous industrial capabilities and continuing development to match the West. Our new stock of Gulag inmates will be useful to build up our new industries."
 SOV_post_gpw_repair:0 "Repair Efforts"
 SOV_Post_Repair:0 "Fix the Country"
 SOV_Post_Repair_desc:0 "While we are in a terrible state, we can spend resources on rebuilding destroyed factories and infrastructure."
 SOV_Post_Build_to_West:0 "Match the West"
 SOV_Post_Build_to_West_desc:0 "The Western Capitalists will soon become our main enemy, but if we were to match them industrially, we would be able to better influence the world!"
 SOV_Post_Civil_Aviation:0 "Expand Civil Aviation"
 SOV_Post_Civil_Aviation_desc:0 "Wide is our Motherland, and to better connect it, we need to build new airports."
 SOV_Post_Air_Factory:0 "Introduce the Il-12"
 SOV_Post_Air_Factory_desc:0 "Now that we have airports, we need airplanes to use them. The Il-12 is a modern plane that we can make quickly and cheaply. This shall supplement our fleet of Li-2 planes."
 SOV_Post_Railways:0 "Connect the Country"
 SOV_Post_Railways_desc:0 "New and modern railways are necessary to ensure that our infrastructure needs are satisfied."
 SOV_Post_Rail_Cars:0 "Modern Railcars"
 SOV_Post_Rail_Cars_desc:0 "If we are to support the Modern Soviet Passenger, we must create new and modern Rail Cars for them."
 SOV_Post_Jet_Engines:0 "Jet Engine Innovations"
 SOV_Post_Jet_Engines_desc:0 "The age of the propeller is over and the Era of Jet Propulsion is beginning. As the Jet Engine takes planes faster and faster, we will get to the Communist Future!"
 SOV_Post_Appeal_to_Middle_Class:0 "Middle Class Luxuries"
 SOV_Post_Appeal_to_Middle_Class_desc:0 "If we promise luxuries to the middle class, we must supply it to them. However, it is likely that few people will actually get the benefits we promised."
 SOV_Post_Pig_Iron:0 "Expand Pig Iron Mining"
 SOV_Post_Pig_Iron_desc:0 "If we are to build new factories, we will need more iron to build out of. We hope to produce over 50 Million tons of pig iron by 1950!"
 SOV_Post_Oil:0 "Fuel for Factories"
 SOV_Post_Oil_desc:0 "We must expand our oil mining operations if we hope to build a modern military. This oil will be made into fuel, which will be made into Socialism!"
 SOV_Post_Mil_Factory:0 "Expand the Army"
 SOV_Post_Mil_Factory_desc:0 "Now that our infrastructure and resource operations are modernized, we can expand our arsenal."
 ##Foreign
 SOV_Post_Foreign_Start:0 "A New Superpower"
 SOV_Post_Foreign_Start_desc:0 "We started the Great Patriotic war as an unknown backwards state, and emerged a modern superpower! All will tremble at our might!"
 SOV_Post_Foreign_Hegemony:0 "The Eastern Hegemon"
 SOV_Post_Foreign_Hegemony_desc:0 "The USSR shall be the Hegemon of the Entire East. Our position stands strong, yet its freshness means it is somewhat precarious. Our order must be safeguarded."
 SOV_Post_Foreign_Outreach:0 "Foreign Outreach"
 SOV_Post_Foreign_Outreach_desc:0 "It would make more sense to appease the West for now as our position is being consolidated, and we are repairing."
 SOV_Ideological_Hostility:0 "Ideological Hostility"
 SOV_Post_Antagonize_America:0 "Antagonize America"
 SOV_Post_Antagonize_America_desc:0 "America is a nation of immense industrial capabilities. It is only natural that they will be our main enemy going forwards. We must break our pacts with them and demand that our people hate everything America stands for!"
 SOV_Post_Irritate_Empire:0 "Offend the Empire"
 SOV_Post_Irritate_Empire_desc:0 "As we, having Sattelites, are obviously an imperialist power, we must direct the people's attention at another of our True Enemies: The United Kingdom"
 SOV_Begrudge:0 "Commitment to Cooperation"
 SOV_Post_Begrudge_Allies:0 "Begrudge the Allies"
 SOV_Post_Begrudge_Allies_desc:0 "If we do not want everything we've built up to immediately come crashing down on us, we must play nice. For now."
 SOV_Post_Trade:0 "Enact Trade Agreements"
 SOV_Post_Trade_desc:0 "Trade with the Allies served us well before. It would be good to continue these policies."
 SOV_Post_Befriend_Turkey:0 "Summit with Turkey"
 SOV_Post_Befriend_Turkey_desc:0 "We must work to improve relations with our Turkish Neighbors, to ensure that they remain on our side."
 SOV_Post_Turkish_Strait_Crisis:0  "The Turkish Straits Issue"
 SOV_Post_Turkish_Strait_Crisis_desc:0 "Turkey's control over Black Sea shipping is unacceptable. How are we meant to exert our power if we cannot get our Navy out of the Black Sea?"
 SOV_Post_Demand_Turkey:0 "Demand Greater Georgia"
 SOV_Post_Demand_Turkey_desc:0 "Trabzon and Erzurum are lands stolen from Georgia and Armenia during the Ottomans' Reign. As we control Georgia and Armenia proper, we can now demand control of what is our rightful territory."
 SOV_Post_Puppets:0 "Consolidate Control over our Satellites"
 SOV_Post_Puppets_desc:0 "Our Sattelite nations need political purges and some more Soviet Liasons to ensure that our puppet leaders do not get ambitions of their own."
 SOV_Puppet_Control:0 "Soviet Consolidation"
 #2RCW
 ##Soviet
 ###Stalin
 SOV_2RCW_Stalinist_Focus_Tree:0 "Second Russian Civil War: Stalinist Focus Tree"
 ###Politics
 SOV_2RCW_Stalin_Politics_Start:0 "The Enemy Shows its Face"
 SOV_2RCW_Stalin_Politics_Start_desc:0 "Despite the fact that Shaposhnikov's Revolt was inspired by the Great Purge, and not the other way around, Comrade Stalin is insistant that he was right all along, and that the Purge was a correct move. Some wonder that maybe, Comrade Stalin went too far."
 SOV_2RCW_Stalin_Politics_Mobilize_Workers:0 "Mobilize the Workers"
 SOV_2RCW_Stalin_Politics_Mobilize_Workers_desc:0 "If the Workers' Dictatorship is to survive, it is the workers we need to mobilize. Heavy propaganda campaigns and the threat of arrest will keep our base of support in line."
 SOV_2RCW_Stalin_Politics_Our_Nation_First_Of_All:0 "Our Nation, First of All!"
 SOV_2RCW_Stalin_Politics_Our_Nation_First_Of_All_desc:0 "The people do not just fight for an ideal, they fight for a Leader and a Nation. They must never forget this simple fact!"
 SOV_2RCW_Stalin_Politics_Watch_the_Fields:0 "Watch the Fields"
 SOV_2RCW_Stalin_Politics_Watch_the_Fields_desc:0 "The Peasants famously resisted Collectivization, and now that their Counter-Revolutionary sympathies have a base of support, we must send spies to make sure that they make no false moves."
 SOV_Enemy_Within:0 "The Enemy Within"
 SOV_2RCW_Stalin_Politics_Enemy_Within:0 "The Enemy Within..."
 SOV_2RCW_Stalin_Politics_Enemy_Within_desc:0 "Comrades, although the Counter-Revolution has become concentrated, traces of it remain, even in the Heart of the Nation. You must all remain vigilant for these Dangerous Reactionaries, and report them whenever possible!"
 SOV_2RCW_Stalin_Politics_Enemy_Without:0 "...and Without"
 SOV_2RCW_Stalin_Politics_Enemy_Without_desc:0 "Despite our constant internal vigilance, our second priority should be to fight the Fascist Horde in the South. The people must understand why they have everything to gain from us, and everything to lose to the Tsarists!"
 SOV_Organized_Terror:0 "Organized Terror"
 SOV_2RCW_Stalin_Politics_Organized_Terror:0 "Organized Terror"
 SOV_2RCW_Stalin_Politics_Organized_Terror_desc:0 "If the Reactionaries wish to uproot our people and use them against us, that's fine! For the Tsarist Terror, comes our Organized Terror!"
 SOV_Jews_removed_from_bureaucracy:0 "§YJewish Bureaucrats will be removed from their positions.\n§!"
 SOV_2RCW_Stalin_Politics_Remove_Jews_From_Bureaucracy:0 "Remove Jewish Bureaucrats"
 SOV_2RCW_Stalin_Politics_Remove_Jews_From_Bureaucracy_desc:0 "Comrade Stalin has always had a strong hatred of the Jews, ever since he was a child. However, so far he has somewhat tolerated Jewish Communists in the Party. Recently, his stance has changed, and he wants the Jews to be removed from the Party Bureaucracy. Although some have their reservations about this, much of the non-Jewish public will be pleased."
 SOV_Civil_War_Purge:0 "Renewed Purges"
 SOV_2RCW_Stalin_Politics_Army_Purge:0 "Purge the Army"
 SOV_2RCW_Stalin_Politics_Army_Purge_desc:0 "In light of recent events, Comrade Stalin has decided that there are likely still reactionary elements in the Army, and that these must be eradicated."
 SOV_2RCW_Stalin_Politics_Navy_Purge:0 "Purge the Navy"
 SOV_2RCW_Stalin_Politics_Navy_Purge_desc:0 "As part of the navy has defected to the Fascist Reactionaries, we must send our spies to ensure that only the most loyal sailors remain in our forces."
 SOV_2RCW_Stalin_Politics_Air_Purge:0 "Purge the Air Force"
 SOV_2RCW_Stalin_Politics_Air_Purge_desc:0 "There have been relatively few defections from the Air Force compared to the Army and Navy. However, Comrade Stalin would feel safer if we extended our Counter-Counter-Revolutionary activities to the Air Force."
 SOV_2RCW_Stalin_Politics_Bureaucracy_Purge:0 "Purge the Bureaucracy"
 SOV_2RCW_Stalin_Politics_Bureaucracy_Purge_desc:0 "Comrade Stalin still feels that the \"opposition\" remains within the party, despite the clear defiance of outer-party elements. He has ordered that the Bureaucracy be the next victim of these new purges. Doing so will allow a new, more capable, generation of bureaucrats to arise instead of keeping these old goats."
 SOV_2RCW_Stalin_Politics_Party_Purity:0 "Enforce Ideological Purity"
 SOV_2RCW_Stalin_Politics_Party_Purity_desc:0 "This war will not be won unless we ensure that Stalinist Purity is prevelant accross the entire party. A heavy campaign of propaganda is necessary to ensure that factionalism remains dead."
 SOV_2RCW_Stalin_Politics_Conscript_Prisoners:0 "Conscript Prisoners"
 SOV_2RCW_Stalin_Politics_Conscript_Prisoners_desc:0 "Prisoners held in the GULAGs will now be made to fight alongside the other concripts with the promise of freedom. This should alleviate the affects of the desertions somewhat."
 SOV_2RCW_Stalin_Politics_Promote_More_Capable_Bureaucrats:0 "Promote Technocrats"
 SOV_2RCW_Stalin_Politics_Promote_More_Capable_Bureaucrats_desc:0 "Ideological Purity cannot win a war. Only by having a capable bureaucracy can we successfully manage the country, regarless of political situation."
 ###Economics
 SOV_2RCW_Economics_Start:0 "The Economic Situation"
 SOV_2RCW_Economics_Start_desc:0 "Our economy is in dire straits. Large portions of our country have stopped providing us with much needed resources. If we are to win this civil war, we must take action to prevent famine and total collapse."
 SOV_2RCW_Economics_War_Communism:0 "What Worked Before Will Again"
 SOV_2RCW_Economics_War_Communism_desc:0 "War Communism was the method by which the USSR was converted into a Command Economy for the first time. With extreme demands on the economy and the population, the system delivered a victory at the front, and a famine at home. However, needs must, so War Communism must rise again."
 SOV_2RCW_Economics_Empower_Gosplan:0 "Empower Gosplan"
 SOV_2RCW_Economics_Empower_Gosplan_desc:0 "The State Planning Committee is the agency that manages the Five-Year Plans in the USSR. Gosplan will be given the necessary means and oversight to ensure that our economy is capable of defeating the rebellions quickly."
 SOV_GOSPLAN_Stalin:0 "State Planning Committee"
 SOV_2RCW_Economics_Stalin:0 "Internal Security"
 SOV_2RCW_Economics_Stalin_desc:0 "We must focus on weeding out the saboteurs, wreckers, and enemies of the people who would seek to cause us to lose the war by failure to produce."
 SOV_2RCW_Economics_Malenkov:0 "Technocratic Development"
 SOV_2RCW_Economics_Malenkov_desc:0 "It is our White-Collar Proffesionals who know best, so they must run the economy. Our stigmas against scientists and engineers must end."
 SOV_2RCW_Economics_Zinoviev:0 "Ideological Correctness"
 SOV_2RCW_Economics_Zinoviev_desc:0 "It is our duty to ensure that War Communism is handled not only with skill, but correctly within Leninist Ideology. This means that nearly any of our endeavours can be justified through a Marxist lens."
 SOV_2RCW_Economics_Reserve_Railways:0 "Reserve Railways"
 SOV_2RCW_Economics_Reserve_Railways_desc:0 "Civilian Traffic on the railways must be banned for the time being. Nothing may get in the way of the Army's advance!"
 SOV_2RCW_Economics_Military_Roads:0 "Military Roads"
 SOV_2RCW_Economics_Military_Roads_desc:0 "We must build more roads for the military to transport on. These special roads will, so far, be specifically built for military trucks and tanks."
 SOV_2RCW_Economics_New_Railways:0 "Build New Railways"
 SOV_2RCW_Economics_New_Railways_desc:0 "The Military requires new railways to be built in European Russia. If we cannot get supplies to the front, we will not be able to win the fight!"
 SOV_2RCW_Economics_Excavations:0 "Iron Excavations"
 SOV_2RCW_Economics_Excavations_desc:0 "The USSR is rich in Iron and Coal Deposits. We must expand these mines to expand our steel production, seeing that much is occupied by the enemy."
 SOV_2RCW_Economics_Oil:0 "Expand Oil Drilling"
 SOV_2RCW_Economics_Oil_desc:0 "Oil is the life-blood of our military; without it, we cannot move our tanks, planes, trucks, or ships. Therefore, we must make sure to expand our oil operations in places out of reach of the enemy."
 SOV_2RCW_Economics_Trade:0 "Foreign Trade"
 SOV_2RCW_Economics_Trade_desc:0 "We cannot rely on our resources alone. We must improve trade relations with the few countries that still support us."
 SOV_Agro_Quota:0 "Raised Agricultural Quotas"
 SOV_Agro_Quota2:0 "Prodrazyorska"
 SOV_Famine_Civil_War:0 "Famine"
 SOV_2RCW_Economics_Raise_Agricultural_Quotas:0 "Raise Agricultural Quotas"
 SOV_2RCW_Economics_Raise_Agricultural_Quotas_desc:0 "The soldiers and workers need to eat, so we will raise quotas for Collective and State Farms. This propelled us to victory in the First Civil War, so it will obviously work again!"
 SOV_2RCW_Economics_Prodrazvyorstka:0 "Prodrazvyorstka"
 SOV_2RCW_Economics_Prodrazvyorstka_desc:0 "Quotas will not be able to satisfy the soldiers. We will take all the peasants' food over a certain amount, as we did in the First Civil War. We can deal with the consequences later."
 SOV_2RCW_Economics_Feed_Loyalists:0 "Feed Loyalists"
 SOV_2RCW_Economics_Feed_Loyalists_desc:0 "The people are sick of hearing that \"Who does not work does not eat\", so now we must remind them that \"Who is not loyal does not eat\"."
 SOV_2RCW_Economics_Tractor_Factories:0 "Convert Tractor Factories"
 SOV_2RCW_Economics_Tractor_Factories_desc:0 "A tractor factory can easily be converted into a tank factory. Therefore, we should begin this process immediately."
 SOV_2RCW_Economics_Civilian_Rationing:0 "Civilian Rationing"
 SOV_2RCW_Economics_Civilian_Rationing_desc:0 "In order to ensure that the soldiers have enough food and equipment, we must implement a rationing program for the civilians. It may be unpopular, but necessary."
 SOV_Forced_Labour:0 "Intensified Forced Labour"
 SOV_2RCW_Economics_Forced_Labour:0 "Intensify Forced Labour Programs"
 SOV_2RCW_Economics_Forced_Labour_desc:0 "The Five-Year Plans have always relied on forced labour. Prisoners have been made to work as slaves, a tradition going back to Tsarist times. However, with an increasingly unpopular war and lack of capital, we must begin to rely even more on these Counter-Revolutionary Bandits."
 SOV_2RCW_Economics_Convert_Civilian_Factories:0 "Factory Conversion"
 SOV_2RCW_Economics_Convert_Civilian_Factories_desc:0 "If the military has nothing to fight with, we might as well just throw the civilians on the front line. We shall convert factories geared for consumer goods into factories for military production."
 SOV_2RCW_Economics_Civilian_Factories:0 "Military Construction Factories"
 SOV_2RCW_Economics_Civilian_Factories_desc:0 "The military will still need things other than food or equipment, like cement and sandbags. We should make factories to supply these items."
 SOV_2RCW_Economics_Military_Factories:0 "Construct Equipment Factories"
 SOV_2RCW_Economics_Military_Factories_desc:0 "The military needs more equipment to fight the Reactionaries! GOSPLAN must construct more factories to build military equipment."
 SOV_2RCW_Economics_Military_Factories2:0 "Tank Factories"
 SOV_2RCW_Economics_Military_Factories2_desc:0 "Tanks will allow us to win this war! Therefore, more tank factories should be built!"
 SOV_2RCW_Economics_Bukharin:0 "We Cannot Make the Same Mistakes"
 SOV_2RCW_Economics_Bukharin_desc:0 "The policy of War Communism was a disaster that caused the collapse of the Early Soviet Economy and the Famine of 1920. We cannot allow this to happen again, so we must find another way."
 SOV_2RCW_Economics_Lower_Quotas:0 "Lower Quotas"
 SOV_2RCW_Economics_Lower_Quotas_desc:0 "The Stalinist imposition on the Workers and Farmers is tantamount to exploitation. We should lower these obscene figures (for civilian industries) to more reasonable goals."
 SOV_2RCW_Economics_End_Collectivization:0 "End Collectivization"
 SOV_2RCW_Economics_End_Collectivization_desc:0 "Stalin's Collectivization Policy has been disasterous. This policy must end immediately if we are to restore a semblance of stability to the fields."
 SOV_2RCW_Economics_Relaxed_Hand:0 "A Relaxed Hand"
 SOV_2RCW_Economics_Relaxed_Hand_desc:0 "Although we will need a firm hand in planning for the War Economy, we will let other industries function more autonomously."
 SOV_2RCW_Economics_Bukharin_Oil:0 "Expand Minnefteprom"
 SOV_2RCW_Economics_Bukharin_Oil_desc:0 "The Ministry of Oil Industry needs more funding so it can drill for more oil, and refine it more efficiently."
 SOV_2RCW_Economics_Bukharin_Aluminum:0 "Expand Aluminium Production"
 SOV_2RCW_Economics_Bukharin_Aluminum_desc:0 "We cannot win the war without a strong Air Force, and we cannot build a strong Air Force without aluminium. Therefore, we must expand our mining and refinement processes."
 SOV_2RCW_Economics_Bukharin_Railways:0 "Military Railways"
 SOV_2RCW_Economics_Bukharin_Railways_desc:0 "To get equipment to the front, we need trains that reach our supply depots. Therefore, we must build more railways to improve efficiency."
 SOV_2RCW_Economics_Bukharin_Railways2:0 "Reinforced Roads"
 SOV_2RCW_Economics_Bukharin_Railways2_desc:0 "Our military can make great use of the roadway system in Russia. However, these roads are not designed for heavy equipment. We should work on reinforcing them."
 SOV_Prodnalog:0 "Prodnalog"
 SOV_2RCW_Economics_Bukharin_Prodnalog:0 "Prodnalog"
 SOV_2RCW_Economics_Bukharin_Prodnalog_desc:0 "Instead of forced requisition of crops, we will re-institute the Food Tax, where peasants will pay our government in food instead of money. The rest they will be able to sell collectively or directly to State Agencies."
 SOV_2RCW_Economics_Bukharin_Progressive_Taxation:0 "Progressive Taxation"
 SOV_2RCW_Economics_Bukharin_Progressive_Taxation_desc:0 "Naturally, farms that produce more crops will be taxed more than those that have a smaller output."
 SOV_2RCW_Economics_Bukharin_Stop_Using_Prisoners:0 "Stop Using Prisoners"
 SOV_2RCW_Economics_Bukharin_Stop_Using_Prisoners_desc:0 "We cannot expect the people to have faith in us if we continue to work our prisoners like slaves."
 SOV_2RCW_Economics_Bukharin_Convert1:0 "Convert European Factories"
 SOV_2RCW_Economics_Bukharin_Convert1_desc:0 "Factories in Europe can be made to produce guns and tanks instead of textiles and tractors. We should convert them immediately."
 SOV_2RCW_Economics_Bukharin_Convert2:0 "Convert Factories outside Europe"
 SOV_2RCW_Economics_Bukharin_Convert2_desc:0 "Factories outside Europe can be converted to military production, just like in Europe, in case our European holdings are overrun, which they won't be anyways."
 SOV_2RCW_Economics_Bukharin_Keep_Using_Prisoners:0 "Keep Using Prisoners"
 SOV_2RCW_Economics_Bukharin_Keep_Using_Prisoners_desc:0 "These counter-revolutionary bastards in our Camps deserve to be used as labour! Without them, our nation would never have gotten off the ground!"
 SOV_2RCW_Economics_Bukharin_Counter_Rev_Rail:0 "The Reactionary Rail"
 SOV_2RCW_Economics_Bukharin_Counter_Rev_Rail_desc:0 "Called this way by the public, this rail line will be built out of forced labour to better improve our military transportation."
 SOV_2RCW_Economics_Bukharin_More_Rail:0 "Resource Rails"
 SOV_2RCW_Economics_Bukharin_More_Rail_desc:0 "We need to improve our infrastructure around important resource depots so that we can better get deposits to our refineries, and then to the factories themselves."
 SOV_2RCW_Economics_Bukharin_Civ:0 "Industrial Expansion Plan"
 SOV_2RCW_Economics_Bukharin_Civ_desc:0 "If we are to win this war then we must expand industries vital to the war effort."
 SOV_2RCW_Economics_Bukharin_Civ2:0 "Increase Output"
 SOV_2RCW_Economics_Bukharin_Civ2_desc:0 "The war will not be won by lazyness and sloth! This war will be won by hard work and socialist effort!"
 SOV_2RCW_Economics_Bukharin_mil:0 "Expand Military Production"
 SOV_2RCW_Economics_Bukharin_mil_desc:0 "As part of our country is under occupation, we desperately need more factories to produce military equipment."
 SOV_2RCW_Economics_Bukharin_mil2:0 "Improve Military Output"
 SOV_2RCW_Economics_Bukharin_mil2_desc:0 "Our military still may be undersupplied, but we can remedy this situation with a decent Subbotnik!"
 ###Military
 SOV_2RCW_Military_Start:0 "The Military\nin Shambles"
 SOV_2RCW_Military_Start_desc:0 "We have lost the confidence of the people and thus the military, making our advances entirely ineffective and costly. While the Political Leadership controls the opinions of the people, the military leadership can do its part to ensure that the army has effective weapons and equipment."
 SOV_2RCW_Military_Include_Navy:0 "Include the Navy"
 SOV_2RCW_Military_Include_Navy_desc:0 "Despite our war being primarily on land, we cannot forget the naval arm of the military. Without proper control of the sea, we may lose vital points of crossing and our convoy trade routes."
 SOV_2RCW_Military_Army_Air:0 "Focus on Land\nand the Air"
 SOV_2RCW_Military_Army_Air_desc:0 "Our war is on the land and in the air. If we do not focus on developing the army and the air force, we will lose the war and lose it quickly."
 SOV_2RCW_Military_Dockyards:0 "Expand Shipyards"
 SOV_2RCW_Military_Dockyards_desc:0 "Since a portion of our Drydocks are occupyied by the enemy, it is necessary to expand the ones we already have."
 SOV_2RCW_Military_Naval_Doctrines:0 "Keep Up with the West"
 SOV_2RCW_Military_Naval_Doctrines_desc:0 "The West, particularly Britain and America, constantly spearheads new Naval Strategies. If we do not keep up, then we will not be able to outmatch them when necessary."
 SOV_2RCW_Military_Airfields:0 "Expand Airfields"
 SOV_2RCW_Military_Airfields_desc:0 "With a surplus of planes and a shortage of air fields, we should expand the ones we already have to fit our Air Force in."
 SOV_2RCW_Military_CAS:0 "Combined Arms"
 SOV_2RCW_Military_CAS_desc:0 "If we can attack the enemy from both the Air and the Ground, then we are sure to win the battle! Investing in Light Bomber technology will allow us to build cheap and efficient planes that can get the job done."
 SOV_2RCW_Military_Land_Doctrine:0 "Develop New Tactics"
 SOV_2RCW_Military_Land_Doctrine_desc:0 "The enemy is trained just as we are. If we are to overpower them, we need to get ahead!"
 SOV_2RCW_Military_Air_Doctrine:0 "Aerial Strategies"
 SOV_2RCW_Military_Air_Doctrine_desc:0 "Our pilots and the enemies' pilots are equally matched. They trained under the same instructors and in the same schools. We have to push forward with Aerial Tactical Developments."
 SOV_2RCW_Military_Small_Arms:0 "The PPS-42"
 SOV_2RCW_Military_Small_Arms_desc:0 "Our infantry needs new weapons capable of a decent level of accuracy, but cheaper for us to make. We should \"ask\" Comrade Sudayev to make this for us!"
 SOV_2RCW_Military_Fighters:0 "Ilyushin Fighters"
 SOV_2RCW_Military_Fighters_desc:0 "Demanding new fighter designs from Ilyushin's studio is sure to give us something with speed, strength, and agility."
 SOV_2RCW_Military_Destroyers:0 "Screen Ships"
 SOV_2RCW_Military_Destroyers_desc:0 "Our core is made up of battleships and cruisers, but we need to develop new destroyers to help protect them."
 SOV_2RCW_Military_TacBombers:0 "Medium Bombers"
 SOV_2RCW_Military_TacBombers_desc:0 "Although we cannot produce the large, heavy bombers of the West, we can produce some medium sized tactical bombers to assist our frontline soldiers."
 SOV_2RCW_Military_Mechanized:0 "Mechanization"
 SOV_2RCW_Military_Mechanized_desc:0 "Our motorized divisions are not good enough anymore. The infantry can be transported with lightly-armored half-tracks instead."
 SOV_2RCW_Military_Armor:0 "The T-34"
 SOV_2RCW_Military_Armor_desc:0 "Our tanks are no longer good enough. The Revolters are being given modern Western tanks, and we have nothing comparable."
 SOV_2RCW_Military_Cruisers:0 "Heavy Ships"
 SOV_2RCW_Military_Cruisers_desc:0 "Although we are modernizing our destroyers, they become useless if they are not supporting a core of Cruisers and Battleships."
 SOV_2RCW_Military_Naval_Bombers:0 "Naval Bombers"
 SOV_2RCW_Military_Naval_Bombers_desc:0 "Our navy might not be sufficient protection for our waters. We should invest in building bombers designed to fight above the water rather than land."
 SOV_2RCW_Military_Air_Doctrine2:0 "Consult the GUV"
 SOV_2RCW_Military_Air_Doctrine2_desc:0 "The Main Directorate of the Air Force should be consulted to see what new strategies they can concieve."
 ##Troika Tree
 SOV_2RCW_Troika_Tree:0 "USSR Post-Stalin Focus Tree"
 SOV_2RCW_Troika_Stalin_Dead:0 "Stalin is Dead"
 SOV_2RCW_Troika_Stalin_Dead_desc:0 "Comrade Stalin has died. A Troika has thus been formed to direct the country until a new General Secratary can be elected at the 19th Party Congress. While we begin to organize the meeting, we can at least try and keep order."
 SOV_2RCW_Troika_Stay_Popular:0 "Stay Popular"
 SOV_2RCW_Troika_Stay_Popular_desc:0 "With the Great Leader dead, the personality cult risks coming apart at the seams. We should take measures to ensure that the Troika is popular enough until the 19th Congress. Stalin's policies have already damaged our reputation enough, but we must see it through."
 SOV_2RCW_Troika_Keep_Order:0 "Keep Order"
 SOV_2RCW_Troika_Keep_Order_desc:0 "With the Great Leader dead, our first priority should be to maintain order in the nation. Though these policies will not be popular, we must make an effort to ensure that the Revolution does not fall in the wake of political instability. The Ryutin Affair was bad enough, and we do not want a repeat."
 SOV_2RCW_Troika_Propaganda_Campaign:0 "A New Propaganda Campaign"
 SOV_2RCW_Troika_Propaganda_Campaign_desc:0 "We shall undertake a massive propaganda campaign to assure the people that all is well and that the Troika acts in their interest. Reports are showing that people have grown increasingly cynical over the last few months, but it is worth a try."
 SOV_2RCW_Appeal_To_Minorities:0 "Appeal to Minorities"
 SOV_2RCW_Appeal_To_Minorities_desc:0 "Nationalism has grown more appealing to the people, so we will begin to appeal to smaller minorities by positioning them against larger minorities. For example, we can cajole the Abkhazians to remain loyal by promising them further autonomy from the Georgian SSR. This can be done across the entire nation."
 SOV_2RCW_Troika_Defend_Legacy:0 "Legacy of the Revolution"
 SOV_2RCW_Troika_Defend_Legacy_desc:0 "We must defend the Legacy of Lenin and Stalin in order to give our regime more legitimacy. If the Troika positions itself as a natural successor to Stalin as the First Troika was to Lenin, then the people would more easily come to our side."
 SOV_2RCW_Troika_Scapegoat:0 "Find a Scapegoat"
 SOV_2RCW_Troika_Scapegoat_desc:0 "We must find somebody or some group to definitively blame for Stalin's death. Our propaganda has so far been running stories about how Stalin's death was caused by all sorts of political opponents, but we need to direct public outrage at a single specific group in order to take away this alleged group's legitimacy."
 SOV_2RCW_Troika_Rally_People:0 "Rally the People"
 SOV_2RCW_Troika_Rally_People_desc:0 "We must continue our efforts to rally the people to our side in this time of instability. Nationalism and protests are scary to a lot of people who simply want things to continue as they were, and we shall promise that."
 SOV_2RCW_Troika_Increase_Police:0 "Deploy the Militsiya"
 SOV_2RCW_Troika_Increase_Police_desc:0 "Our Police (the Militia) should be more active on the streets to discourage acts of dissent. Protestors and nationalists should be arrested and hauled to prison at the first opportunity!"
 SOV_2RCW_Troika_Support_NKVD:0 "Support the NKVD"
 SOV_2RCW_Troika_Support_NKVD_desc:0 "We must funnel additional resources to the NKVD to ensure that they have enough means to properly deal with dissidents and possible insurrectionists. Intellectuals must remain under particular scrutiny, lest they engage in any \"ideology\"."
 SOV_2RCW_Troika_Break_NKVD:0 "Re-align the NKVD"
 SOV_2RCW_Troika_Break_NKVD_desc:0 "With Stalin's death, we should have the NKVD leadership removed in order to root out those more personally associated with Stalin. To that end, we will send Komdiv Georgy Zhukov into Lubyanka and see to it that our potential political rivals are destroyed. In addition, announcing the \"treason\" of the old NKVD and installing a lesser-known leader would improve our image."
 SOV_need_focus_to_get_other_leaders:0 "§YThis Focus is necessary in order to unlock alternative Soviet Leaders!§!"
 SOV_2RCW_Troika_Everybody_in_Line:0 "Keep the Peace"
 SOV_2RCW_Troika_Everybody_in_Line_desc:0 "It is ever important to watch out for violent conflicts and stop them whenever they begin. Ergo, our propaganda should include anti-protest and anti-nationalist sentiments."
 SOV_2RCW_Troika_Politics_Start:0 "The 19th Party Congress"
 SOV_2RCW_Troika_Politics_Start_desc:0 "After Comrade Stalin's death, a Troika was formed to manage the country until a new General Secretary could be elected. This new General Secretary will be determined at the 19th Party Congress of the All-Union Communist Party, called as an emergency."
 SOV_2RCW_Zinoviev_Start:0 "Orthodox Victory"
 SOV_2RCW_Zinoviev_Start_desc:0 "After his horrifiying ordeal in prison, Grigory Zinoviev has managed to climb to the top, using his powerful orating skills to convince the Central Committee to elect him to the position of General Secretary. Although not well liked, even by his supporters, he is seen as a necessary compromise candidate."
 SOV_2RCW_Malenkov_Start:0 "Hardliner Victory"
 SOV_2RCW_Malenkov_Start_desc:0 "Georgy Malenkov was the expected successor to the Late Comrade Stalin. A faithful devotee to Marxism-Leninism, Comrade Malenkov was a close aide to Comrade Stalin and is expected to continue current policies. An ardent technocrat, Comrade Malenkov believes Ideology should be secondary, and technical experience primary."
 SOV_2RCW_Bukharin_Start:0 "Reformist Victory"
 SOV_2RCW_Bukharin_Start_desc:0 "Nikolai Bukharin's struggle against Comrade Stalin has paid off. An extremely popular figure in the Party, Comrade Bukharin has been a champion of peace and reform ever since Stalin took power. Opposed to the totalitarian controls on the population, Comrade Bukharin sees some liberalization as necessary and morally correct."
 SOV_2RCW_Zinoviev_Reorganize_Party:0 "Reorganize the Party"
 SOV_2RCW_Zinoviev_Reorganize_Party_desc:0 "Stalin turned the Party Bureaucracy into a cantakerous mess. Although we shall keep much of it, we can trim the hedges to produce a slightly more streamlined civil service."
 SOV_2RCW_Zinoviev_Appeal_to_Ideology:0 "Appeal to Ideology"
 SOV_2RCW_Zinoviev_Appeal_to_Ideology_desc:0 "This is not just a war of militaries and bureaucracies, but of ideologies. We have to keep ideology as the primary focus of our propaganda, or else there would be no point in fighting."
 SOV_Red_Terror:0 "Red Terror"
 SOV_2RCW_Zinoviev_Red_Terror:0 "Red Terror"
 SOV_2RCW_Zinoviev_Red_Terror_desc:0 "Comrade Zinoviev enthusiastically perpretrated the Red Terror in Petrograd during the civil war, and is glad to reinstate the policy. We must do everything in our power to prevent a Counter-Revolution!"
 SOV_2RCW_Zinoviev_Political_Reeducation:0 "Political Reeducation"
 SOV_2RCW_Zinoviev_Political_Reeducation_desc:0 "The Peoples of the USSR have been force-fed Stalinist lies for 25 years. They need to learn our truth instead!"
 SOV_2RCW_Zinoviev_Admit_Excesses:0 "Admit Stalinist Excesses"
 SOV_2RCW_Zinoviev_Admit_Excesses_desc:0 "While we are hesitant to denounce Stalin entirely at this precarious time, it would be safe to denounce things like the brutal methods of purging and collectivization as \"unfortunate excesses\" of the Stalinist Regime caused by the \"precived necessity\" of these actions."
 SOV_2RCW_Zinoviev_Comintern_Support:0 "Support from the Comintern"
 SOV_2RCW_Zinoviev_Comintern_Support_desc:0 "The USSR has patronized the Comintern since 1918. Now it is time for the other parties to do their part. We need for our affiliates to openly recognize Comrade Zinoviev as the head of the VKP(b) and renounce Stalinism."
 SOV_2RCW_Zinoviev_Quell_Factionalism:0 "Quell Factionalism"
 SOV_2RCW_Zinoviev_Quell_Factionalism_desc:0 "The 19th Party Congress has revealed some factionalism within the party, which is explicitly banned according to the principles of Democratic Centralism. This factionalism must be rooted out so we can present a United Front!"
 SOV_2RCW_Zinoviev_Great_Cities:0 "The Great Cities"
 SOV_2RCW_Zinoviev_Great_Cities_desc:0 "Stalin put too much emphasis on Moscow. We should remind the peoples of the other Great Cities of the Union how much we respect them."
 SOV_2RCW_Zinoviev_Strengthen_Rule_Provinces:0 "Fight Nationalism"
 SOV_2RCW_Zinoviev_Strengthen_Rule_Provinces_desc:0 "Non-Russian lands have been agitating for greater autonomies and even independence. We should increase Party Activities in these areas to remind people how good the USSR is for them."
 SOV_2RCW_Zinoviev_Offer_Autonomy:0 "Exploit Nationalism"
 SOV_2RCW_Zinoviev_Offer_Autonomy_desc:0 "Non-Russian Nationalists are currently agitating to fight for greater autonomy and independence. We shall promise to promote several ASSRs to SSR level in exchange for the people's loyalty."
 SOV_Malenkov_Purge:0 "Bureaucratic Purge"
 SOV_2RCW_Malenkov_Review_Bureaucracy:0 "Review the Bureaucracy"
 SOV_2RCW_Malenkov_Review_Bureaucracy_desc:0 "It is clear that there is some factionalism in the Bureaucracy. We must review every bureaucrat and remove dissenters with an iron fist."
 SOV_Malenkov_Technocrats:0 "Technocratic Bureaucracy"
 SOV_2RCW_Malenkov_Downplay_Ideology:0 "Downplay Ideology..."
 SOV_2RCW_Malenkov_Downplay_Ideology_desc:0 "The current situation is dire, and we need to pour all resources into winning the Civil War. And despite what Comrade Zhdanov may tell you, the Sword is mightier than the Pen!"
 SOV_2RCW_Malenkov_Promote_Specialists:0 "...and Emphasize Skill"
 SOV_2RCW_Malenkov_Promote_Specialists_desc:0 "It does not matter how well prospective bureaucrats have memorized the Complete Works of Vladimir Lenin. If they can design, perform science, and plan, then that is good enough."
 SOV_2RCW_Malenkov_Apologia:0 "Defend His Legacy"
 SOV_2RCW_Malenkov_Apologia_desc:0 "Despite much of the public blaming the Late Comrade Stalin for the Civil War, Comrade Malenkov's new propaganda campaign is meant to defend Comrade Stalin's rule from accusations of being anything other than kind and benevolent."
 SOV_2RCW_Malenkov_Terror:0 "The Great Terror"
 SOV_2RCW_Malenkov_Terror_desc:0 "Comrade Malenkov was furious at the outbreak of Civil War. It is his opinion - and thus our policy - that we must begin a campaign of Total War with reprisals and murders against the Anti-Bolshevik forces."
 SOV_2RCW_Malenkov_Zhdanov:0 "Destroy Zhdanovshchina"
 SOV_2RCW_Malenkov_Zhdanov_desc:0 "Andrei Zhdanov believes that the only thing that can save Soviet Russia is a new round of ideological purification. However, it has become increasingly clear to the leadership that ideology has failed. Therefore, Zhdanov and his supporters must be expelled from the Party for factionalism."
 SOV_2RCW_Malenkov_Remove_Jews_from_Civil_Service:0 "Disband Jewish Organizations"
 SOV_2RCW_Malenkov_Remove_Jews_from_Civil_Service_desc:0 "The Late Comrade Stalin had strong Anti-Semitic sympathies, which is shared by Comrade Malenkov. Both blame so-called \"Cosmopolitan Elements\" for interfering with the Civil War. Therefore, Comrade Malenkov has sanctioned the disbandment of Jewish Organizations and the dismissal of Jewish Bureaucrats. While some like-minded people will appreciate this move, many others will not."
 SOV_2RCW_Malenkov_Education:0 "Emphasize Education"
 SOV_2RCW_Malenkov_Education_desc:0 "Naturally people should be made to benefit the collective, but they cannot do it through work alone. They must be educated as well."
 SOV_2RCW_Malenkov_Political_Heroes:0 "Political Heroism"
 SOV_2RCW_Malenkov_Political_Heroes_desc:0 "These military heroes are rightfully praised, but the people should not forget about the Political Leadership working to preserve our Great Union."
 SOV_2RCW_Expand_Civil_Service:0 "Expand the Civil Service"
 SOV_2RCW_Expand_Civil_Service_desc:0 "We need to push more people into the civil service and the Party to ensure that they are mobilized against the Counter-Revolutionary Fascist incursions."
 SOV_2RCW_Bukharin_Denounce_Stalin:0 "Denounce Stalinshchina"
 SOV_2RCW_Bukharin_Denounce_Stalin_desc:0 "The practices of Stalinism went far beyond simple \"excesses\", but completely destroyed both any progress the NEP made in building Socialism, as well as Socialism's Credibility both within and outside Russia. It will be our goal to fix these errors."
 SOV_2RCW_Bukharin_Reforms_Later:0 "Promise Future Reform"
 SOV_2RCW_Bukharin_Reforms_Later_desc:0 "With the civil war, we cannot spare time and resources on reforming the country. However, we can begin to make plans for the future, which can hopefully appease the people."
 SOV_2RCW_Bukharin_Reforms_Now:0 "Begin Reforms Now"
 SOV_2RCW_Bukharin_Reforms_Now_desc:0 "Simple promises are not enough. We have to spend time actually reforming the system so that the people will have faith in us."
 SOV_2RCW_Bukharin_Autonomy:0 "Inquire into Autonomy"
 SOV_2RCW_Bukharin_Autonomy_desc:0 "We will make plans to grant ASSRs SSR status, and possibly elevate some Autonomous Oblasts and Okrugs into ASSRs."
 SOV_Private_Initiative_0:0 "Minor Private Initiative"
 SOV_Private_Initiative_1:0 "Limited Private Initiative"
 SOV_2RCW_Bukharin_Very_Small_Private_Initiative:0 "Minor Private Initiative"
 SOV_2RCW_Bukharin_Very_Small_Private_Initiative_desc:0 "We will legalize a very small amount of private initiative to allow civilians to supplement our economy with thir own production. Of course, this will be limited to non-vital consumer goods at a very small scale, using non-vital materials. This should somewhat help to alleviate the effects of the Five-Year Plans and the civil war."
 SOV_2RCW_Bukharin_Promise_Agrarian_Reform:0 "Promise Agrarian Reform"
 SOV_2RCW_Bukharin_Promise_Agrarian_Reform_desc:0 "The effects of Stalin's Collectivizaton are one of the main reasons why Bolshevism is no longer trusted in the USSR. We shall promise to reform - or even destroy if it becomes necessary - the Collective Farm system to be more beneficial to the people."
 SOV_2RCW_Bukharin_Keep_Grain_Here:0 "Keep Grain Here"
 SOV_2RCW_Bukharin_Keep_Grain_Here_desc:0 "Stalin, instead of using surplus grain to feed the people, sold the grain internationally to pay for Heavy Industry. Comrade Bukharin, on the other hand, recognizes that the people are the first priority, and that Heavy Industry can come later. During the Civil War of course, the soldiers will come first. But these reforms will come!"
 SOV_2RCW_Bukharin_Legalize_Factionalism:0 "Clamp Down on Factionalism"
 SOV_2RCW_Bukharin_Legalize_Factionalism_desc:0 "Comrade Lenin was entirely correct when he banned Factionalism in the Party. Allowing Party members to argue against already established Policy will cause the same instabilities that led to the Ryutin affair and the civil war in the first place! Ergo, we must spend time ensuring that Comrade Bukharin's place is more or less secure. However, we will not go as far as Stalin did, or we might be placed in further risk."
 SOV_2RCW_Bukharin_New_Electoral_Law:0 "Restore the Smychka"
 SOV_2RCW_Bukharin_New_Electoral_Law_desc:0 "The Smychka was the alliance between the peasant class and the working class enacted by Lenin as a way to win the support of the countryside. We must openly restore this alliance to regain the farmers' political support, especially given the disasterous collectivization policies of the 20's and 30's."
 SOV_2RCW_Bukharin_Allow_Private_Initiative:0 "Private Initiative in Non-Vital Areas"
 SOV_2RCW_Bukharin_Allow_Private_Initiative_desc:0 "While the State should maintain total control over industries vital to the War Effort, we should allow Private Initiative in Non-Vital industries (largely basic consumer goods), and allow the limited purchase - from the state - of resources provided that these materials are not too vital right now."
 SOV_2RCW_Bukharin_Buy_From_Private:0 "Buy from Private Producers"
 SOV_2RCW_Bukharin_Buy_From_Private_desc:0 "To stimulate private production, we should set up funds to buy goods from the private sector, so as long as these \"entreprenuers\" keep within cooperative and anti-exploitatory practices. Their products can then be resold or redistributed by the state."
 SOV_2RCW_Bukharin_Private_but_Patriotic:0 "Private but Patriotic"
 SOV_2RCW_Bukharin_Private_but_Patriotic_desc:0 "We should remind these \"New Soviet Industrialists\" that it is illegal to use their capital to promote Anti-Soviet initiatives or break the law. They must also be ordered to keep the people of the USSR First. In short, we tolerate Capitalism so as long as it does nothing against the state."
 SOV_2RCW_Bukharin_Release_Innocents:0 "Release Innocent Prisoners"
 SOV_2RCW_Bukharin_Release_Innocents_desc:0 "While our Gulags do house some despicable Counter-Revolutionaries and Common Criminals, it also holds innocent peasants, soldiers, and other citizens wrongly caught up by the Stalinshchina. If we release these innocents, we could perhaps get the people's faith back. We shall screen them and give them and their families proper compensation for their losses."
 SOV_2RCW_Bukharin_Communism_With_Morals:0 "Communism with a Moral Code"
 SOV_2RCW_Bukharin_Communism_With_Morals_desc:0 "The End Result of Comrade Bukharins reforms, whether already enacted or to be enacted in the future, is to present the People and the World with a Moral Communism, where the name \"Lenin\" has credibility and the USSR is respected internationaly."
 ###Coup
 SOV_2RCW_Coup_Tree:0 "Red Army Coup Focus Tree"
 SOV_2RCW_Coup_Politics_Start:0 "Red Army Coup"
 SOV_2RCW_Coup_Politics_Start_desc:0 "The intellectual vanguard has failed to secure order and build Socialism. By being too lax about national defence and being too strong on controlling the populace, the Communist Party has clearly had its priorities in the wrong places. The USSR needs a military solution, provided by Comrade General - now Comrade Field Marshal - Georgy Zhukov."
 SOV_2RCW_Coup_Tolerate_Leninism:0 "Work With Leninism"
 SOV_2RCW_Coup_Tolerate_Leninism_desc:0 "With the Civil War, the issues of Ideological Polemics come secondary to national defense. We will officially allow the Communist Elements to cooperate with us until we can afford to work out the issues."
 SOV_2RCW_Coup_Tolerate_Control_Party:0 "Control the VKP(b)"
 SOV_2RCW_Coup_Tolerate_Control_Party_desc:0 "We need to keep the Communists focused on fighting Shaposhnikov rather than the New Regime. Therefore, we shall impose Comrade General Kiril Meretskov on them as their new General Secretary. The General is capable but with little ambition, and his leadership should ensure that our sole political rival is practically ineffective."
 SOV_2RCW_Coup_Tolerate_End_Party_Meetings:0 "End Party Meetings"
 SOV_2RCW_Coup_Tolerate_End_Party_Meetings_desc:0 "We would get a lot more work done if the Communists stopped having Party Meetings and actually got to work. Furthermore, a lack of Party Meetings would prevent the Communists from presenting a united opinion on the new situation. We would not have allowed this either way."
 SOV_2RCW_Coup_Tolerate_Take_Over_Pravda:0 "Take Over \"Pravda\""
 SOV_2RCW_Coup_Tolerate_Take_Over_Pravda_desc:0 "\"Pravda\" (Truth) remains the official newspaper of the Communist Party. However, they have been posting slightly critical views of the Military Leadership, leading our government to believe that a takeover is necessary. The Communists would still have Isvestia, but the absorbtion of \"Pravda\" into \"The Red Star\" will serve as an effective example."
 SOV_2RCW_Coup_Tolerate_Demand_Professionalism:0 "Demand Professionalism"
 SOV_2RCW_Coup_Tolerate_Demand_Professionalism_desc:0 "Our soldiers must remain professional to the last. Any reported instances of Terror will result in a court martial of the perpretrators, and proper compensation to the victims."
 SOV_Military_Terror:0 "Military Terror"
 SOV_2RCW_Coup_Tolerate_Look_Other_Way:0 "Look the Other Way"
 SOV_2RCW_Coup_Tolerate_Look_Other_Way_desc:0 "While we ostensibly demand our soldiers to be professional, we are willing to look the other way should they commit crimes against the civilian population in rebellious territories, provided that it is not too egregious."
 SOV_Communists_Uppity:0 "§RCommunist Agitation§!"
 SOV_Dual_Power:0 "Military-Civilian Joint Rule"
 SOV_Dual_Power2:0 "Military-Civilian Joint Rule"
 SOV_2RCW_Coup_Tolerate_Pressure_Communists:0 "Sideline Communist Power"
 SOV_2RCW_Coup_Tolerate_Pressure_Communists_desc:0 "Recent Communist Agitation has made us reconsider the Dual Power structure that we have allowed to develop. We will now bring powers back to the Army, and if the Party does not like it, there is nothing they can do."
 SOV_2RCW_Coup_Tolerate_Prevent_Pogroms:0 "Prevent Pogroms"
 SOV_2RCW_Coup_Tolerate_Prevent_Pogroms_desc:0 "Despite our relaxed attitude towards military conduct, we cannot afford to have Pogroms against our Jewish Population, despite the high presence of Anti-Semitism in society and the military. While the Jews will appreciate this measure, some members of other ethnicities may lose confidence in us."
 SOV_2RCW_Coup_Tolerate_Promote_Loyalists:0 "Promote Loyalists"
 SOV_2RCW_Coup_Tolerate_Promote_Loyalists_desc:0 "To fully consolidate our rule, it will be necessary to promote those loyal to us. This will ensure greater unity with the Red Army and the bureaucracy."
 SOV_2RCW_Coup_Tolerate_Abolish_Commissars:0 "Abolish Military Commissars"
 SOV_2RCW_Coup_Tolerate_Abolish_Commissars_desc:0 "Military Commissars are still part of the military structure despite the lack of Party Authority. It is time to correct this error."
 SOV_2RCW_Coup_Vague_Commitment:0 "Vague Commitments"
 SOV_2RCW_Coup_Vague_Commitment_desc:0 "Our rhetoric will include some vague commitments to Leninism, but no cooperation with the Communists or any actual adherence to Leninism. The VKP(b) will simply be tolerated for the time being."
 SOV_2RCW_Coup_Let_Them_Stay:0 "Let Communist Officers Serve"
 SOV_2RCW_Coup_Let_Them_Stay_desc:0 "Much of the High Command and many senior officers are Communists, but we cannot afford to do anything about that at this time. It would be better if we let them serve as normal."
 SOV_2RCW_Coup_Purge_Officers:0 "Purge Stalinist Commanders"
 SOV_2RCW_Coup_Purge_Officers_desc:0 "Commanders who show or have shown to be still loyal to Josef Stalin and the Bolsheviks should be dismissed from their positions immediately. This includes figures such as Voroshilov and Tukhachevsky."
 SOV_2RCW_Coup_Military_Bureaucracy:0 "Military Bureaucracy"
 SOV_2RCW_Coup_Military_Bureaucracy_desc:0 "The transition to a military bureaucracy is not something that can be done overnight. We will spend the next two years slowly replacing middle to high level bureaucrats with military functionaries."
 SOV_Bureaucratic_Transition:0 "Bureaucratic Transition"
 SOV_2RCW_Coup_Denounce_Stalinist_Crimes:0 "Denounce Stalin's Crimes"
 SOV_2RCW_Coup_Denounce_Stalinist_Crimes_desc:0 "Josef Stalin's crimes were a horror to behold, and must be admitted to and denounced in detail. The millions of deaths he caused have created a debt that falls on us to repay."
 SOV_2RCW_Coup_Outlaw_Terror:0 "Outlaw Terror"
 SOV_2RCW_Coup_Outlaw_Terror_desc:0 "No matter what Shaposhnikov and his ilk throw at us, we will have no Red Terrors. We must hold the moral high ground if we are to keep the faith of the people."
 SOV_2RCW_Coup_Repudiate_Leninism:0 "Repudiate Leninism"
 SOV_2RCW_Coup_Repudiate_Leninism_desc:0 "It is clear that the Leninist Revolution has failed. The Bolsheviks have plunged Russia into a period of darkness and poverty, surpassing even the worst Tsarist times. It now falls to us to implement real reforms."
 SOV_2RCW_Coup_Repudiate_Take_Down_Statues:0 "Take Down Statues"
 SOV_2RCW_Coup_Repudiate_Take_Down_Statues_desc:0 "If we are to dismantle the personality cults and the Communist Structure, we have to take down all the statues of Lenin, Stalin, and other Bolsheviks. Perhaps we can build a museaum out of them later."
 SOV_2RCW_Coup_Repudiate_Ban_Communist_Party:0 "Ban the VKP(b)"
 SOV_2RCW_Coup_Repudiate_Ban_Communist_Party_desc:0 "The Communist Party is a nest of bandits, rats, and opportunist ideologues. The Communists are drinking champagne in the Kremlin while the common people are starving. The Communist Party should therefore be banned and destroyed, with their leaders tried for their crimes."
 SOV_2RCW_Coup_Repudiate_Denounce_Lenin:0 "The Whole Truth"
 SOV_2RCW_Coup_Repudiate_Denounce_Lenin_desc:0 "The people have suffered under the Bolsheviks for the last 20 years, they deserve to know the truth. The real operations of the Propaganda Machines, the Red Terror, Collectivization, etc; must all be made public."
 SOV_2RCW_Coup_Repudiate_Prepare_Reforms:0 "Freedom of Assembly"
 SOV_2RCW_Coup_Repudiate_Prepare_Reforms_desc:0 "Despite the current situation, we can make some small strides in personal freedoms. We will start by allowing a small measure of Freedom of Assembly. However, due to the civil war, such assemblies will have to be pre-approved by local authorities, but we will give them instructions to be somewhat lax on what they approve."
 SOV_2RCW_Coup_Repudiate_Press_Freedoms:0 "Limited Press Freedoms"
 SOV_2RCW_Coup_Repudiate_Press_Freedoms_desc:0 "Freedom of Expression was taken away by the Bolsheviks in the aftermath of the October Revolution. We shall restore this Basic Right, but due to circumstances, sedition and leaking military secrets will still be criminalized for now."
 SOV_2RCW_Coup_Repudiate_Fight_For_Nation:0 "Fight for the Nation"
 SOV_2RCW_Coup_Repudiate_Fight_For_Nation_desc:0 "We do not ask the people to fight for ideology or something as insubstantial. We ask them to fight for the nation and the people!"
 SOV_2RCW_Coup_Economics_Start:0 "Militarize the Economy"
 SOV_2RCW_Coup_Economics_Start_desc:0 "We will not win the Civil War if the economy is geared towards a civilian orientation. We must re-direct the economy to serve the needs of the Army."
 SOV_2RCW_Coup_End_Collectivization:0 "End Collectivization"
 SOV_2RCW_Coup_End_Collectivization_desc:0 "Collectivization was a horrific process which destroyed our agricultural economy and killed millions of people in famines and retributions. We must end this process immediately."
 SOV_2RCW_Coup_Feed_Soldiers:0 "Feed the Soldiers"
 SOV_2RCW_Coup_Feed_Soldiers_desc:0 "Collectivization or no, the Army still needs food. Therefore, we should establish a food tax, similar to the times of the New Economic Period, that would take enough grain to feed the army, but allow the peasants to eat as well."
 SOV_2RCW_Coup_Rations:0 "Civilian Rations"
 SOV_2RCW_Coup_Rations_desc:0 "Even if we tax the peasants' supplies, we still have to implement rations for the rest of the population, to ensure that the Army has all the material it needs to fight."
 SOV_2RCW_Coup_Steel_Mills:0 "Improve our Steel Mills"
 SOV_2RCW_Coup_Steel_Mills_desc:0 "Our military needs steel for equipment, so as much of our resources are under siege, we must improve production elsewhere. We shall improve both milling efficiency and raw mining output."
 SOV_2RCW_Coup_Oil:0 "Expand Oil Production"
 SOV_2RCW_Coup_Oil_desc:0 "The USSR's great bounty of oil is occupyied by the enemy, and thus we are cut off from our most important resource. Ergo, we have to improve rigging efficiency elsewhere."
 SOV_2RCW_Coup_Aluminium:0 "Increase Aluminium Mining Operations"
 SOV_2RCW_Coup_Aluminium_desc:0 "Although a lesser priority than steel and aoil, aluminium is needed to produce planes and other equipment. With the necessities of the Civil War, it has become important to increase our aluminium mining output."
 SOV_2RCW_Coup_Military_Factories:0 "Improve Military Production"
 SOV_2RCW_Coup_Military_Factories_desc:0 "Although numbers alone cannot win the Civil War, it would be prudent to increase our production now that we have been cut off from a portion of it."
 SOV_2RCW_Coup_Convert_Factories:0 "Convert Civilian Factories"
 SOV_2RCW_Coup_Convert_Factories_desc:0 "Now is not the time to produce consumer goods! Surely the people will understand that we need to re-orient their factories for military usage."
 SOV_2RCW_Coup_Mil2:0 "Military Expansion Plan \"Bagaration\""
 SOV_2RCW_Coup_Mil2_desc:0 "We desperately need military equipment for the Army. This has led us to create a new expansion plan that would fill our needs."
 SOV_2RCW_Coup_Infrastructure:0 "Military Railways"
 SOV_2RCW_Coup_Infrastructure_desc:0 "We should expand our military railway network so that we can better ferry equipment and resources to their destinations."
 SOV_2RCW_Coup_Infrastructure2:0 "European Infrastructure"
 SOV_2RCW_Coup_Infrastructure2_desc:0 "Our infrastructure networks in Europe are our highest priority. Therefore, we should work on improving those as soon as possible."
 SOV_2RCW_Coup_Infrastructure3:0 "Highway Expansion"
 SOV_2RCW_Coup_Infrastructure3_desc:0 "Our roadway network should be improved and protected as an alternative to the railways. They may also come in useful as civilian paths in the future."
 SOV_2RCW_Coup_Convert_Factories2:0 "Continue to Convert Factories"
 SOV_2RCW_Coup_Convert_Factories2_desc:0 "We still have too many factories focusing on civilian goods. They should be made to produce military equipment instead."
 SOV_2RCW_Coup_Militarize:0 "Transition to a War Economy"
 SOV_2RCW_Coup_Militarize_desc:0 "It is clear that our mobilization efforts have not yet paid off. We should have another round of national mobilization."
 SOV_Zhukov_Surrender:0 "Unconditional Surrender"
 SOV_Zhukov_Surrender_desc:0 "It is clear that we can no longer fight the Second Russian Civil War. We shall lay down our arms and go to the negotiating table."
