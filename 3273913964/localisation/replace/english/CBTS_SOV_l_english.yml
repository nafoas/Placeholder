 ##Poland stuff
 POL_2RCW_Offer_UKR_BLR_Alliance:0 "Intervene in the East"
 POL_2RCW_Offer_UKR_BLR_Alliance_desc:0 "The doctrine of Prometheism maintains that we must take every effort possible to help the oppressed nations within the USSR achieve independence. Now with the collapse of the USSR, we have the opportunity to realize this ambition. To that end, we should offer Ukraine and Belarus a formal alliance."
 ##GPW STuff
 SOV_industry_relocation:0 "Industry Relocation"
 SOV_relocate_industry_from_moscow:0 "Relocate Industry from Moscow"
 SOV_relocate_industry_from_moscow_desc:0 "Evacuating the heavy machinery of our Moscow factories to the Urals is a huge undertaking, but it is necessary to secure our war production."
 SOV_relocate_industry_from_moscow_tt:0 "§RThese effects require control of Moscow when the decision times out.§!"
 SOV_relocate_industry_from_leningrad:0 "Relocate Industry from Leningrad"
