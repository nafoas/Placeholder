 SOV_big_famine:0 "Continued Collectivization"
 SOV_famine_desc:0 "We have decided to restart Collectivization. Although our aim is to put most farmland into collective farms, we are aware that this will come at an extreme cost."
 SOV_purged_10:0 "Aftermath of the Great Purge"
 SOV_purged_10_desc:0 "The Great Purge saw the death of about twenty thousand officers and nearly eight hundred thousand people due to state action. Such mass murders do not come without reprocussions."
