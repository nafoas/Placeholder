 sov_introduction.1.t:0 "The Union of Soviet Socialist Republics"
 sov_introduction.1.d:0 "The USSR under the leadership of General Secretary Josef Stalin is the greatest country in the world! Or that is what the papers say. The truth is, the USSR is in rather dire straits. After outmaneuvering his political opponents, Stalin finally assumed the position of General Secretary in 1929 unquestioned, and his authority has only been growing. Though he only formally became General Secretary four years ago, he had been exercising increasing amounts of control since Vladimir Lenin's death.\n\nA close associate of Lenin, Stalin formally calls his ideology \"Marxism-Leninism\", which the ruling Communist Party claims to be the only true successor of Lenin's thought. Though Stalin has continued the Autocratic System established by Lenin, he has slowly increased its intensity. A Personality Cult has formed around both leaders, and Stalin makes even greater use of Concentration Camps, though Stalin's own views of Economics, Social Policy, and Religion have prevailed over Lenin's.\n\nThe USSR was established after the Russian Civil War, fought between Radical Leftist \"Reds\", Anti-Leftist \"Whites\", and a variety of Nationalist movements from November 1917 to October 1922. Though the Reds would eventually win out, this came at a great cost. Due to Soviet Agricultural Policies and Terror against the Population from nearly all sides, the economy had been destroyed and a Famine struck in 1921, lasting until 1923. By the end of it all, about 10 Million People had died.\n\nOver the course of these Five Years, the USSR had gone from a limited-party Socialist Democracy to a One-Party Autocracy ruled by Lenin's Bolsheviks. The state has Heads of State and Government, though these are nominally ceremonial roles, as the General Secretary of the All-Union Communist Party (Bolsheviks) holds the power. The General Secretary is supplemented by an Executive Committee called a \"Politburo\", which is elected by a \"Central Committee\" (different from the Central Executive Committee, which serves as a Legislative House), which in turn is elected at Party Congresses. These committees oversee a massive bureaucracy that manages practiacally all aspects of life, from massive projects such as economic development and the propaganda machine, all the way down to the affairs of communal apartments and elementary school classes."
 sov_introduction.1.a:0 "Tell me more!"
 sov_introduction.1.b:0 "I'm not interested."
 sov_introduction.2.t:0 "Lenin and Leninism"
 sov_introduction.2.d:0 "The Russian Civil War resulted in the transformation of a Socialist Democracy into a One-Party Autocracy. The state is governed by a bureaucracy built to supplement the policies of the Politburo and Central Committee, which in turn supplement the General Secretary. \"Elections\" are held where the sole candidate for the given position is chosen by the bureaucracy and from the bureaucracy. A key element of Bolshevik ideology is ideological discipline, called \"Democratic Centralism\". Democratic centralism is a doctrine that states that party decisions are totally binding on the entire party, with the intention to eliminate factionalism. Combined with the actions of the Secret Police (at this time the NKVD), democratic centralism prevents opposition to the dictatorship from within the bureaucracy, even though some early factions argued against it.\n\nBefore discussing Stalinism and Marxism-Leninism, Leninism itself must be explained. Lenin envisioned an elitist form of Marxism. While many Western European Communists had advocated for a more decentralized and democratic state, Lenin argued that Russia did not have the right level of development for such an arrangement. Thus, Lenin argued for a \"Vanguard\" party that would work to build up political consciousness and direct the Proletarian Revolution by eliminating percieved economic and political enemies. This was his interpretation of Marx's \"Dictatorship of the Proletariat\". During the Civil War, the Bolsheviks had begun the \"Red Terror\", aimed at violently eliminating alleged ideological opponents through mass killings and imprisonment in Concentration Camps, carried out by the Extraordinary Commission (Cheka). At first, Soviet Russia had nationalized all economic activity in order to mobilize the population to fight the Civil War. Called \"War Communism\", this mobilization had disasterous effects on the economy, particularly the policy of \"Food Apportionment\", where crops were forcibly confiscated from the peasants, extending an Imperial practice. As this had contributed to the aforementioned famine, War Communism was entirely reversed in 1922, when the New Economic Policy took over, allowing individuals to engage in private enterprise in order to rebuild industry. This was abandoned in 1928."
 sov_introduction.2.a:0 "And what about Stalin?"
 sov_introduction.2.b:0 "That's enough!"
 sov_introduction.3.t:0 "Stalin and Stalinism"
 sov_introduction.3.d:0 "Though claiming to be a formalized extension of Lenin's ideas, \"Marxism-Leninism\" is in fact the imposition of Stalin's positions onto Leninism (which Stalin already had influence on before Lenin's death). It can be safely called \"Stalinism\". Due to Stalin's succesful assumption of Autocratic Power, Marxism-Leninism is the state ideology.\n\nWe have been engaged in an internal Class War for many years. In the USSR, the term \"class\" does not just refer to the different echelons of wealth, but different occupations. The Workers, Poor Peasants, Middle Peasants (\"Kulaks\"), Intellectuals, Technical Specialists, Bureaucrats, etc; are all considered to be different classes. Stalin has rejected the \"Smychka\", or the collaboration between the peasant and the worker classes in favor of an all-out class conflict. National laws discriminate against and encourage the universal ostracization of those declared to be \"Class Enemies\" and their families, which can be understood as anybody who is not a worker, collective farmer, or bureaucrat.\n\nThis war has also been extended to the Clergy. Though religion is not technically illegal, the state is engaged in a campaign to eliminate religious belief (except for the Stalin Cult). Religious ministers and land used for such purposes are heavily taxed, and the \"servers of cults\" are openly denied privaleges, such as permission to live in cities. In reality, Priests and other Clergy members have been arrested en masse, and many religious buildings (such as Churches) have been destroyed.\n\nThe Party's Socially Conservative Policies have also supplanted any progress Lenin made. Though Lenin's government improved the rights of women and discouraged ethnic bigotry, Stalin's has instead slowly encroached on gender equality and those close to Stalin know he harbors resentment towards some ethnicities, primarily the Jews."
 sov_introduction.3.a:0 "What about the Economy?"
 sov_introduction.3.b:0 "Too much information!"
 sov_introduction.4.t:0 "Soviet Economics"
 sov_introduction.4.d:0 "In 1928, the New Economic Policy was reversed in favor of total nationalization and state planning, in the form of the Five-Year Plans. These were meant to forcibly industrialize the mostly rural country. Though the Soviet Press reports huge successes, these are generally exaggerated as the First Five-Year plan was not totally completed, and any real success has been built on the backs of prison labour with immense loss of life. The Five-Year Plans are also poorly managed, as the production quotas have turned out to be grossly overdemanding.\n\nCollectivization has proved to be the most damaging policy of all. The Party has been trying to integrate privately owned land into Collective Farms - which would be owned by those working it - and State Farms - which would be state-owned. Despite these official definitions, both Collective and State farms are run by the State Bureaucracy with no meaningful difference. Collectivization has been imposed using forceful methods such as shock brigades meant to get the peasants to join the collective farms by any means. Concurrent with this policy is \"Dekulakization\". \"Kulak\" is a derogatory term diven to so-called \"Wealthy\" peasants, which in reality means anybody who is not starving. These peasants, by Stalin's decree, are at best deported to the East, and at worst shot by the NKVD. This policy alone has caused hundreds of thousands of deaths, at least.\n\nCollectivization, though ideologically correct according to the state, has so far not benefited anybody. It is meant to benefit landless peasants, but there are really very few landless peasants, and the peasants have grown quite opposed to this Social Transformation. Many peasants strated protesting peacefully, though this turned violent when the situation failed to improve. People are committing sabotage and are even resorting to murder. Despite these failures, the Soviet Government continues to push on, the result of which has been a major famine stretching from Ukraine all the way to Kazakhstan.\n\nStalinist Repressions have ensured that a large sector of the population has become opposed to the Bolshevik Party, and a crime wave has hit the nation. Although Stalin's authority is nearly absolute, incidents such as the 1932 Ryutin Affair show that there is still opposition to his rule at the highest levels, and he is getting a little bit worried..."
 sov_introduction.4.a:0 "I understand"
 ##Purge Events
 SOV_kirov_will_be_murdered_first_attempt:0 "§YAt the direction of Comrade Vania Zaporozhets, an Assassin will try to kill Sergei Kirov.§!\n"
 SOV_kirov_dies:0 "§YSergei Kirov will no longer be available as a minister.§!\n"
 sov_purge.1.t:0 "Kirov Defies Orders!"
 sov_purge.1.d:0 "Comrade Stalin has recently ordered the NKVD to replace the head of the Leningrad Office, Filipp Medved (a known associate of Kirov's) with Grigory Yevdokimov, who is closer to Comrade Stalin. However, in an unthinkable display of individuality, Comrade Kirov countermanded the order! Although furious, Comrade Stalin has come to see this otherwise minor event as a possible excuse to launch a purge against his precieved political enemies and consolidate his power for good. Therefore, Comrade Kirov must die!"
 sov_purge.1.a:0 "Comrade Zaporozhets will lead the operation!"
 SOV_kirov_assassination_fails:0 "§YThe Assassination will be re-planned and the operation will be executed at a later date.§!\n"
 sov_purge.2.t:0 "Kirov Survives!"
 sov_purge.2.d:0 "Leonid Nikolaev, a failed Communist Party member who holds intense grudges against the Party, was picked up and hired to kill Kirov. He tried to kill Kirov in his office in the Smolny, but was found out by security guards. Upon the intervention of the NKVD, he was let with all his personal effects and his pistol. It is clear that we must make a new plan and try again."
 sov_purge.2.a:0 "We can limit the size of Comrade Kirov's security detail..."
 SOV_kirov_second_attempt:0 "§YLeonid Nikolaev will attempt to kill Comrade Kirov again.§!\n"
 sov_purge.3.t:0 "The Second Attempt on Comrade Kirov's Life"
 sov_purge.3.d:0 "After our failed assassination of Sergei Kirov, we have had to go back to the drawing board, as it is clearly not as easy as we thought. With the power of the NKVD, we have managed to reduce Comrade Kirov's bodyguards to a team of four. We will also instruct NKVD guards in the Smolny to not obstruct Nikolaev's mission. This should make it easier for Nikolaev to commit the murder."
 sov_purge.3.a:0 "It will work this time!"
 SOV_kirov_investigation:0 "§YA false investigation shall take place to create a pretext for a Purge.§!"
 sov_purge.4.t:0 "The Death of Kirov"
 sov_purge.4.d:0 "Today in the afternoon, our hired gun, Leonid Nikolaev, entered the Smolny and shot Sergei Kirov in the back of the neck in a hallway. Because of our intervention, he was allowed to conduct the operation without any difficulty. We now have engineered a crime; all that remains is to engineer a motive, and Comrade Stalin can have his purge. The NKVD Officers who \"failed\" in their duties today must also be quietly dealt with. However, to keep up appearences, we must give Comrade Kirov a state funeral."
 sov_purge.4.a:0 "Comrade Stalin shall be one of the Pallbearers!"
 sov_purge.5.t:0 "The Investigation into Comrade Kirov's Assassination"
 sov_purge.5.d:0 "Now that our government has murdered Sergei Kirov, the NKVD was tasked with conducting a false investigation to provide an excuse for the elimination of every element that Comrade Stalin sees as a possible threat. In this vein, our assassin, Leonid Nikolaev, has just been executed after being forced to falsely confess to being part of a fascist plot. His family members and a few of his personal friends have been killed or sent to labour camps, and his son has been sent to an orphanage.\n\nGoing further, Commissar Borisov (an NKVD officer who was to be \"in charge\" of Kirov's security), has been killed, and his wife has been sent to an insane asylum. 104 prisoners unrelated to the incident were accused of fascism and executed. Several Leningrad NKVD officers have also been conviced of negligence, and as punishment, have been sent to guard the labor camps.\n\nParty meetings have been no less vicious. The Party secretary of the Moscow District even went so far as to claim that Comrade Stalin personally interrogated Nikolaev. All committees can agree, however, that the \"opposition\" is at fault for the Death of Kirov. Increased calls for a Purge of the Party suggest that the plan has worked, and that we will soon be free to carry out this Purge. Party members are blaming the Opposition leadership for being morally responsible for the murder simply because they oppose or do not reach the Party line. Major Opposition members like Zinoviev and Kamenev have been arrested. Nobody has even thought to mention the \"Fascist Plot\" that the NKVD extracted out of Nikolaev."
 sov_purge.5.a:0 "The Central Committee must be pitiless..."
 sov_purge.6.t:0 "The Great Purge"
 sov_purge.6.d:0 "Investigations into the Opposition have produced less than satisfactory results, as we cannot ascertain, for example, that Trotsky is involved. However, at the direction of the NKVD, forced confessions should allow us to eliminate political and social opposition. Zinovievites, Bukharinists, dissident artists, and other elements Comrade Stalin sees as dangerous can and will be Purged."
 sov_purge.6.a:0 "Let us Begin."
 sov_news.4.t:0 "Mass Purges in the USSR"
 sov_news.4.d:0 "Security Officials in the USSR have begun waves of mass arrests and trials of suspected members of the opposition. While such purges are not new to the Soviet Union, they have never been conducted on this scale and with this level of ferocity. Many \"Old Bolsheviks\" (communists from before the revolution), including high-ranking party members and military officers, have been arrested and await trial.\n\nThese high-level cases are accompanied with the mass arrests of intellectuals, supposed class enemies, and even some emigrants who escaped after the Civil War."
 sov_news.4.a:0 "What will be their fate?"
 SOV_wounds_begin_to_heal:0 "The wounds are beginning to heal."
 SOV_wounds_healing:0 "The wounds continue to heal."
 SOV_wounds_healed:0 "The wounds have nearly healed."
 sov_purge.7.t:0 "Aftermath of the Great Purge"
 sov_purge.7.d:0 "In the aftermath of the Great Purge, many institutions were left in shambles. The military was left without authority, hundreds of thousands of peasants were killed and sent to the labour camps, and many of the government ministries saw their work disrupted. However, as time goes on, order is being restored. New bureaucrats are being trained, officers are being taught, and life is generally returning to a state of calm."
 sov_purge.7.a:0 "[This.SOV_Purge_Option_Loc]"
 ##Civil War Events
 sov_civil_war.1.t:0 "A Time of Uncertainty"
 sov_civil_war.1.d:0 "The Great Leader has died. Though his four-day funeral was majestic, a wave of uncertainty has gripped the nation. We were in this situation fifteen years ago when Lenin died, but this feels very different. Back then the nation was taken by optimistic predictions of a socialist future, but reactions this time are mixed. Some are truly saddened by Comrade Stalin’s death, and no matter who replaced him, a Golden Age has come and gone. Others feel that now can be a time for change, whether for better or for worse. Yet many want no truck with the situation at all; certain that nothing will fundamentally change.\n\nFor the bureaucracy, the situation is even more unsure. To their credit, the bureaucrats are doing their best to keep order, reassure the populace, and keep any bribes hidden. However, there has been a noticeable level of discontent in the Party, as far-off party sections and committees have slowly begun to pursue a more independent policy, on occasion coming into conflict with Moscow. Moscow itself has shown signs of instability. Despite the immense effort undertaken to keep Moscow the same, the capital has reacted the same way as the rest of the nation. It is clear that our position will be quite uncertain for the time being."
 sov_civil_war.1.a:0 "Something is Rotten in the city of Moscow..."
 sov_civil_war.2.t:0 "Protests in Ukraine"
 sov_civil_war.2.d:0 "For the last several weeks, unrest in the Ukrainian Countryside has been slowly growing. Our collectivization campaigns of the 20’s and 30’s had taken a huge toll on the people, who are starting to show further signs of dissatisfaction. Organized protests have started in the cities of Kiev, Odessa, and Dnepropetrovsk. Largely disillusioned students, these protestors have demanded justice for the people, the disbanding of the NKVD, and reform or replacement of the Bolshevik system. These protests are fairly small, as the biggest only numbers about 75 people in Kiev. However, the Militsya has managed to arrest most of them, and the situation is now under control."
 sov_civil_war.2.a:0 "These students should know better."
 sov_civil_war.3.t:0 "Revolt in Stalingrad!"
 sov_civil_war.3.d:0 "Stalingrad and southern Russia had remained a hotbed of dissident activity, despite attempts to win the people over by Gorkom Stalingrad. Employment and housing programs announced several months ago had failed to bring fruit, and this deeply alienated the people. Following Tbilisi’s example, thousands of Stalingraders marched on the Gorkom Offices. The protestors confronted the Red Army soldiers with rage in their eyes, knowing - whether consciously or subconsciously - that they had nothing to lose. The Party Secretary for the City tried talking to them, but to no avail. The Red Army Captain overseeing the office’s defense apparently understood what the situation was building towards, and ordered the soldiers to stand down\n\nThe protestors entered the building and using whatever weapons they had, arrested and disarmed the security guards, eventually occupying the entire building. On the steps of the building, a group of protestors had read out their declaration: The Bolshevik dictatorship was responsible for the oppression of the people, the deaths of millions, and the Troika has failed to address any of these issues. Therefore, the Bolsheviks had been overthrown in Tsaritsyn (not Stalingrad!) and declared a Provisional People’s Council with the primary intention of taking over from the Communists. The protestors ended on a call for the Red Army to join the Provisional Government and called on Moscow to surrender peacefully. This speech was also broadcast throughout the region, encouraging several towns and cities to attempt the same process.\n\nThough we are obviously not going to surrender, many soldiers in the region have deserted the Red Army and defected to the side of these counter-revolutionary pigs, in some cases helping the dissidents take power. It is clear that we have a new war on our hands.\n\nA major cause for concern in Moscow is the defection of General Andrei Andreivich Vlasov. A defecting high-ranking general is quite alarming, but he has declared himself to be the ideologue of the movement. He has immediately declared the creation of a \"Committee for the Liberation of the Peoples of Russia\", or KONR. Though many dissidents are wary of working with somebody complicit in the purges, these obvious fascists clearly have no intention of doing away with him."
 sov_civil_war.3.a:0 "We must crush the traitors!"
 sov_civil_war.3.b:0 "Hooray for the Council! Down with Bolshevism!"
 sov_civil_war.4.t:0 "The Second Russian Civil War"
 sov_civil_war.4.d:0 "With the Rebellion, it is clear that this has become more than a revolt, but a civil war. It is also clear the Troika has failed to maintain stability in the nation, and the Central Committee is now organizing to choose a leader. All the work we put in for the last 20 years has been undone. This is truly a nightmare."
 sov_civil_war.4.a:0 "The Imperialists will fall!"
 SOV_Collapse_2rcw_Message:0 "The USSR has collapsed to Anti-Bolshevik Forces!"
 sov_news.2.t:0 "Revolt in the USSR!"
 sov_news.2.d:0 "After the death of Soviet Dictator Joseph Stalin, popular resentment to the Soviet Regime had begun to take concrete form. Protests had begun in Kiev and Tbilisi, and many were resentful of the Troika for their lack of action. Even military leaders and some party committees had begun to disregard Moscow in an attempt to keep order. However, the protests only intensified.\n\nAtter violent confrontations with authorities and riots in Kiev and Tbilisi, unsatisfied Stalingraders had, with the tacit approval of the army, occupied the Stalingrade Party Committee headquarters and declared the end of Communist Party Authority in the city, with several others in the region following suit. It seems now that Moscow has a civil war on its hands."
 sov_news.2.a:0 "Could this be the end of the USSR?"
 #Stalin's Deaths
 sov_news.1.t:0 "The Death of Stalin"
 sov_news.1.d:0 "Reports coming out of the USSR indicate that Soviet Dictator Joseph Stalin has died in the last few days from [SovNewsStalinDead].\n\nIt was decided that a triumvirate led by President Mikhail Kalinin will take power until a new leader is chosen. The \"Troika\" will do its best to keep order despite any grumblings from below..."
 StalinHasAStrokeNews:0 "a stroke. Apparently, Stalin was giving a piched speach to his cabinet when he collapsed and died. By the time his doctors arrived, he was dead"
 StalinAssassinatedOfficeNews:0 "being shot in the head. Stalin was found in his office with a bullet hole in his head and a gun on the floor. Despite the apparant circumstances, a statement by the Kremlin says that they do not believe that his death was a suicide, and that the NKVD was trying to find the assassin"
 StalinAssassinatedNews:0 "being shot with several bullets. Stalin was on the Kremlin Balcony giving a speech, when an assailent shot several bullets at him, and though only a small fraction hit their mark, it was enough. Stalin died practically instantly, and Lazar Kaganovich (one of his close associates) was wounded. Despite the best effort of the NKVD, the assailant remains and unknown figure. His (or her) identity will likely be lost to time"
 sov_news.1.a:0 "So the bastard's dead?"
 sov_news.1.b:0 "Our comrade will be remembered"
 StalinHasAStroke:0 "Comrade Stalin Dies in the Sovnarkom"
 StalinAssassinated:0 "Comrade Stalin's Assassination!"
 StalinSurvives:0 "Comrade Stalin Survives Assasination"
 StalinHasAStrokeDesc:0 "During a meeting of the Council of People’s Commissars, Comrade Stalin was making a speech. At least, that’s what will be said officially. His frenzied rant had reached a peak as he was discussing potentially dangerous factions which could have remained despite the Purges conducted for the previous three years. The People’s Commissars exchanged side glances, as they knew that the alleged Trotskyite Saboteurs were few and far between, that is, if they existed at all. After ten minutes, the tirade seemed to be quieting down. Vyacheslav Molotov audibly breathed a sigh of relief. At that moment, Comrade Stalin stopped mid-sentence, and collapsed onto the floor. By the time his doctors had arrived on the scene, he was dead. Further examination revealed that a blood vessel had burst in his brain, and he died nearly instantly."
 StalinAssassinatedBalconyDesc:0 "Today, Comrade Stalin, flanked by Lazar Kaganovich and Marshal Kliment Voroshilov, gave a balcony address from the Moscow Kremlin in Red Square. He talked at length about the Fascist Fighters, Liberal Libelers, and Counter Revolutionary Commanders all lying in wait to strike the USSR the moment the country showed any weakness. However, as he was explaining something about meeting the enemy face-to-face, a cry rang out: \"Death to the Communist Conmen!\", followed by several shots. Comrade Stalin collapsed to the floor (he died instantly), and the public scattered. Seven Bullets were found at the crime scene: One in Comrade Stalin’s chest, another in his neck, a third in Comrade Kaganovich’s arm, and the rest in various spots on the balcony.\n\nBut who could be responsible for such an act? An associate of Martemyan Ryutin? An errant Trotskyist? A Fascist Spy? That’s what Pravda will write at any rate. Initial investigations have so far failed to find a lead. Eyewitnesses are as unreliable as ever. Some say it was soldiers in uniform, others say it was a lone man in a workers cap. The assassin looked like a Russian, a Ukrainian, a Georgian, a Kazakh, or a Jew depending on who you asked (one old woman even said \"Demon\"). It seems as though we will never know who assassinated the Vozhd." 
 StalinAssassinatedOfficeDesc:0 "The Kremlin is in a panic! Comrade Stalin’s Secretary, Alexander Poskrebyshev, went into the Great Leader’s office after the latter had failed to respond to some knocks, and found him dead at his table! Poskrebyshev and the visiting Marshal Voroshilov called the Militsiya, military specialists, and the NKVD without haste. Comrade Stalin was hunched over at his desk with a hole in his head and a gun on the floor. He had bled profusely, but preliminary estimates suggest he died instantly, and early in the morning. According to Comrade Poskrebyshev, Voroshilov was the first appointment of the day, and the guards confirmed that Comrade Poskrebyshev had entered the Kremlin after the estimated time of death. However, Comrade Beria notes that Poskrebyshev did not see the late General Secretary in his office as he came in to work. It was then decided that the NKVD would, of course, take charge of the investigation, and Comrade Poskrebyshev, the guards, and even some of the cleaning crew were arrested as possible suspects."
 sov_civil_war.5.t:0 "[This.howStalinDiesTitle]"
 sov_civil_war.5.d:0 "[This.howStalinDiesDesc]\n\nThe news was only printed and broadcast some hours later after it was decided that President Mikhail Kalinin, Head of the Cadres Directorate Georgy Malenkov, and [This.GetThirdTroikist] would form a Troika that would lead the government until a new General Secretary can be chosen. Their first act was to announce a week of mourning and the schedule for Comrade Stalin’s funeral. There will be grand shows of grief, spectacular parades, everything else that would impress foreign journalists."
 KaganovichThird:0 "Minnefteprom Head Lazar Kaganovich"
 BukharinThird:0 "Party Darling Nikolai Bukharin"
 StalinYells:0 "Stalin did not go quietly."
 StalinQuiet:0 "How could nobody notice this earlier?"
 sov_civil_war.5.a:0 "[This.howStalinDiesButton]"
 meeting_two_weeks:0 "§YAn Emergency Party Congress will be held in one month.§!\n"
 StalinSurvivesDesc:0 "If you are reading this, there is a bug. Please report this to our subreddit (r/CBTSmod), our forum page, or our discord."
 SOV_Stalin_Survived:0 "§GComrade Stalin Survived the Attempt on his life.§!"
 sov_civil_war.6.t:0 "Military Loyalty"
 sov_civil_war.6.d:0 "During this period of confusion, the eastern regions of the USSR have begun to act more and more independently. In this vein, the eastern military districts, most notably the Far East (governed by Vasily Blyukher) have generally stopped listening to Moscow, and only send back paltry reports. It is clear that the Red Army has more-or-less decided that the political leadership cannot decisively govern in a period of clear instability, and have thus decided to follow their own orders."
 sov_civil_war.6.a:0 "Is that legal?"
 sov_civil_war.7.t:0 "Protest in Tbilisi"
 sov_civil_war.7.d:0 "Georgia, much like Ukraine, is a historical hotbed of Anti-Soviet activity. In 1924, a rebellion attempted to shake off our rule, and it seems these memories have not died. News of the Ukrainian protests have clearly reached Georgia, as about 1200 dissidents, including students, workers, and even a bureaucrat or two converged on the House of Government building and protested for about eight hours before the police were able to disperse them. Smaller protests also took place in Batumi and Kutaisi. Internal reports show that protesters who resisted arrest - and even a few that did not - were beaten quite harshly by the authorities. Of course, this will never be printed.\n\nOnce news of this protest spread through Georgia, it elicited curious responses from the South Osseitian and Abkhazian ASSRs (part of the Georgian SSR). In an apparently coordinated maneuver, both regions’ Parties have issued statements separate their regions from Georgia. Both groups wish for their ASSRs to become part of the RSFSR rather than remain Georgian. If anything, it is proof that our Korenizatsiya strategy had worked."
 sov_civil_war.7.a:0 "We must be very careful."
 NikBul:0 "Nikolai Bulganin"
 NikKhr:0 "Nikita Khrushchev"
 sov_civil_war.8.t:0 "The NKVD Deposed!"
 sov_civil_war.8.d:0 "In a daring operation, soldiers led by General Georgy Zhukov have stormed Lubyanka, taken the NKVD leadership hostage, and quietly executed them. To explain the gunfire and military presence, \"Pravda\" was told to say that \"Rogue Elements\" in the NKVD had been partaking in counter-revolutionary activities. All that remains is to declare [This.GetNKVDHead] to be the new Minister of Internal Affairs."
 sov_civil_war.8.a:0 "We can breathe easy now."
 sov_civil_war.9.t:0 "The Fates of Zinoviev and Kamanev"
 sov_civil_war.9.d:0 "Grigory Zinoviev and Lev Kamenev, members of the first Troika and former associates of Lenin, were imprisoned in 1934 after being forced to admit \"moral complicity\" in the killing of Sergei Kirov. This finished a power struggle between Zinoviev and Stalin that had gone on since the formation of the first Troika. Originally siding with Stalin over Trotsky, they had begun to drift away from the late General Secretary and had been exiled to the Urals after reading Martemyan Ryutin’s Anti-Stalinist Platform.\n\nLately, there has been some talk in the Central Committee of bringing the pair back to Moscow as a show of clemency. They would be put under surveillance, of course, but such a move would show the people that we are a merciful government, capable of reconciling with the opposition. It will also show that we are loyal to Lenin’s platform instead of being purely the Cult of Stalin. Should we let them out, or allow them to rot in prison?"
 sov_civil_war.9.a:0 "We shall welcome them back."
 sov_civil_war.9.b:0 "Let them sit!"
 sov_civil_war.10.t:0 "Unrest in the South"
 sov_civil_war.10.d:0 "Though most people’s lives have gone back to normal, the general feeling of uncertainty has devolved into fear. After the protests in Ukraine and Georgia, it seems as though the people are even more encouraged to speak out against the government. Southern Russia has recently seen a growing wave of unrest, especially since that region was devastated by collectivization. In a rare break from Moscow, the Stalingrad City Committee of the VKP(b) (Gorkom Stalingrad) has approved a series of radical new measures meant to placate the populace. These measures include greater spending on housing, factory construction, and food distribution. What baffles observers is that Gorkom Stalingrad has announced these changes when it knows full well it can neither pay for them on its own nor get the money from any upper levels. These announcements are thus entirely symbolic. Nevertheless, Moscow Hardliners are furious at the idea of a Russian Gorkom acting independently of the Central Committee."
 sov_civil_war.10.a:0 "How can this be tolerated?"
 sov_civil_war.11.t:0 "The 19th Party Congress of the VKP(b)"
 sov_civil_war.11.d:0 "The 19th Party Congress is an emergency meeting of the All-Union Communist Party (bolsheviks) to determine Soviet policy in the Post-Stalin era. The Troika had considered it unwise to hold a special meeting, but the rebellions have made this necessary. At this congress, we will also elect a new General Secretary for the party. The candidate will be selected by a Party Vote, but there is time for debate beforehand. The [This.GetCandidateMalenkov] candidate is Georgy Malenkov, one of Comrade Stalin's close aides and a Technocratic hardliner.[This.GetZin] [This.GetBuk]There is much apprehension in the Central Committee, as the Civil War threatens to uproot the entire Soviet System."
 sov_civil_war.11.a:0 "Let us make haste when the Red Sun shines."
 MalOnlyCan:0 "only"
 MalNotAlone:0 "first"
 ZinCan:0 "The second candidate is Grigory Zinoviev, a member of the old United Opposition, and together with Lev Kamenev, close personal allies of Lenin."
 BukCan:0 "The third candidate is Nikolai Bukharin, a member of the old Right Opposition, and a very popular figure in the party."
 sov_civil_war.12.t:0 "19th Party Congress: Wartime Economics"
 sov_civil_war.12.d:0 "The first issue is probably the most important. We must decide on our Wartime Economic Policies. Comrade Malenkov recommends a return to War Communism, where all industry is nationalized and heavy requisitions are demanded from the peasants. While we are technically in this state already, GOSPLAN will be given even more power to direct the war effort. Malenkov also advocates for a focus on technical expertise over ideological correctness.[This.GetZinEco][This.GetBukEco]" 
 ZinEco:0 " Comrade Zinoviev agrees with re-implementing War Communism, but virulently attacked Comrade Malenkov's proposal to downplay ideology, asserting that ideological correctness is paramount."
 BukEco:0 " Comrade Bukharin disagrees with War Communism entirely, citing the Famine of 1920. Although the Famine is officially blamed on Imperialist elements, Bukharin asserts that War Communism at the very least exacerbated the tragedy. He recommends we abandon the old practices of Forced Labour and Collectivization in favor of a more \"human\" method."
 sov_civil_war.12.a:0 "Acting without Ideology is Barbarity."
 sov_civil_war.12.b:0 "Doing without Knowledge is Shortsighted."
 sov_civil_war.12.c:0 "Fighting without Morals is Cruel."
 sov_civil_war.13.t:0 "19th Party Congress: Wartime Conduct"
 sov_civil_war.13.d:0 "A somewhat controversial topic, it is necessary to outline the proper rules of conduct for our soldiers.[This.GetZinConduct] Comrade Malenkov endorses extending our already institutionalied repression to the military sphere, where executions and massacres are managed bureaucratically.[This.GetBukConduct]"
 BukConduct:0 " Comrade Bukharin at first balked at all of this, and then spoke. He claims that the Bolshevik regime would lose further popularity if repression was to continue. He said that the Red Terror had caused animosity and rebellion, and that a new Red Terror would only make the situation worse."
 ZinConduct:0 " Being first to speak, Comrade Zinoviev proposed a return to Lenin's Red Terror to avoid over-bureaucratization of the ideological purification of the country. According to him, it would make the process more effective."
 sov_civil_war.13.a:0 "The anti-socialists must be annihilated."
 sov_civil_war.13.b:0 "Who is not with us, is against us!"
 sov_civil_war.13.c:0 "We must find another way."
 sov_civil_war.14.t:0 "19th Party Congress: Collectivization"
 sov_civil_war.14.d:0 "Another controversial topic, Collectivizaton has caused a great deal of misery and pain for the people, and the early stages caused a great amount of division within the Party. It is time to revisit these debates. Hardliners at first rejected this topic of debate under the terms of Democratic Centralism, but it was eventually agreed that the situation was too dire to avoid it.[This.GetBukCol][This.GetZinCol]Comrade Malenkov believes that the Late Comrade Stalin's Collectivization Policies work fine, and therefore should be continued."
 BukCol:0 "Comrade Bukharin denounced Collectivization and instead proposes the restoration of the \"Smyrchka\", the so-called \"alliance\" between the peasants and the workers. He proposes to legalize independent farming to the point of allowing the Collective farms to act independently, and allowing the farmers to act as smallholders if they wish. "
 ZinCol:0 "Comrade Zinoviev supports Collectivization, but insists that the system is too complicated and bureaucratized. He proposes a very minor reform: to convert the Collective Farms to State Farms, as there is no functional difference. "
 sov_civil_war.14.a:0 "Simplification!"
 sov_civil_war.14.b:0 "Collectivization!"
 sov_civil_war.14.c:0 "Restoration!"
 sov_civil_war.15.t:0 "19th Party Congress: State Planning"
 sov_civil_war.15.d:0 "There are some concerns over the demands and effectiveness of GOSPLAN, which has sparked another debate. Comrade Malenkov and his supporters insist that the Five-Year plans work perfectly fine, and thus should be maintained.[This.GetZinPla][This.GetBukPla]"
 ZinPla:0 " Comrade Zinoviev generally endorses the 5-Year Plans and GOSPLAN, but feels as though the system is a bit too demanding, and that lower quotas and a system of Three-Year Plans would be more dynamic and effective."
 BukPla:0 " On the other hand, Comrade Bukharin declared that the Stalinist Planning System has entirely failed, and that a return to the New Economic Policy is necessary. He proposes the \"Democratic Economic Program\" which would re-introduce some elements of a mixed economy where some small private enterprise would be tolerated to allow the standard of living to rise."
 sov_civil_war.15.a:0 "The Three-Year Plan makes sense!"
 sov_civil_war.15.b:0 "The Five-Year Plans shall continue"
 sov_civil_war.15.c:0 "We must turn towards consumer goods."
 sov_civil_war.16.t:0 "19th Party Congress: Foreign Policy"
 sov_civil_war.16.d:0 "The ever-shifting nature of International Politics is a tricky subject, but one that is necessary for this debate. Much of the other World Powers revile the USSR, and each candidate has their own ideas on how to deal with the world stage. [This.GetBukFor]Comrade Malenkov believes that we should continue the policies of the Late Comarde Stalin, taking old lands where we can and securing our position with international treaties.[This.GetZinFor]"
 BukFor:0 "Comrade Bukharin reminded the Central Committee that it was he, not the late Comrade Stalin, who invented the theory of Socialism in One Country. He believes that we should stay true to this theory, and maintain our security with international collaboration rather than aggressive expansion."
 ZinFor:0 "Comrade Zinoviev, on the other hand, advocates for an aggressive foreign policy, to bring the Revolution to Europe. While he does not advocate for rabid declarations of war, he wants greater support for the Communist International and the mobilization for War with the West."
 sov_civil_war.16.a:0 "The Revolution Will Come to Europe!"
 sov_civil_war.16.b:0 "Collective Security is Correct!"
 sov_civil_war.16.c:0 "Collaboration is Key!"
 sov_civil_war.17.t:0 "19th Party Congress: Trade Unions"
 sov_civil_war.17.d:0 "The Trade Union Debate was one of the major debates of Early Soviet Russia. Dear Comarade Lenin took the position that the Trade Unions were meant to be Party Organs that would \"teach\" the workers about Communism, while Leon Trotsky took the position that the unions should be turned into Party Production Organs, and given control of the economy. Comrade Lenin's view prevailed. However, there have been some new concerns about this issue, given the debates on planning and the role of ideology in the country. [This.GetZinUni]Comrade Malenkov agrees with Dear Comrade Lenin's Position, but feels that it would be best to expand the role of unions into making them centers of supplementary technical education.[This.GetBukUni]"
 ZinUni:0 "Comrade Zinoviev took the opportunity to remind the Central Committee that this decision has already been made, and by the philosophy of Democratic Centralism, cannot be challenged."
 BukUni:0 " Comrade Bukharin simply took the opportunity to remind the Central Committee that there is a civil war in the country, and that we do not have time for this debate."
 sov_civil_war.17.a:0 "This policy is already binding."
 sov_civil_war.17.b:0 "The expansion of the unions' role is possible."
 sov_civil_war.17.c:0 "We don't have the time for this!"
 sov_civil_war.18.t:0 "19th Party Congress: The Personality Cult"
 sov_civil_war.18.d:0 "The Late Comrade Stalin allowed a personality cult to foster around him, but now that Comrade Stalin is dead, we have to discuss what to do with Comrade Stalin's image and cult. The Troika has so far maintained it, as they were unsure of what to do about it. Comrade Malenkov insists that we maintain Comrade Stalin's legacy and continue to blame the Civil War on Monarcho-Fascist Sympathizers.[This.GetZinPer][This.GetBukPer]"
 ZinPer:0 "Comrade Zinoviev proposes that we admit to some \"excesses\" in policy, but otherwise paint Comrade Stalin's policies as necessary \"growing pains\" needed to develop Socialism. He feel that this would satiate the people's need for justice while allowing the Current Central Committee to maintain its current status and structure."
 BukPer:0 "Comrade Bukhain instead says that we have to almost entirely repudiate Stalin's policies and rule as a mistake. This caused an uproar in the Central Commitee but Comrade Bukharin feels that it is the best way to win back the support of the people, especially if we combine this with real reform."
 sov_civil_war.18.a:0 "Somthing that works for all."
 sov_civil_war.18.b:0 "A program to keep people in line."
 sov_civil_war.18.c:0 "We must admit to our mistakes."
 sov_civil_war.19.t:0 "19th Party Congress: Authoritarianism"
 sov_civil_war.19.d:0 "Although the State is meant to \"Wither Away\" with the coming of Communism, Comrade Stalin developed a Totalitarian State so that the enemies of Socialism could be found and prevented from reversing the gains of the Revolution. However, public opinion and the civil war has made it abundantly clear that Comrade Stalin's policies did not work. Comrade Malenkov asserts that the NKVD had failed to efficiently find these Fascist elements, but maintains that Comrade Stalin is not to blame for the Civil War.[This.GetBukRep][This.GetZinRep]"
 BukRep:0 "Comrade Bukharin instead insists that we have to continue to clamp down on factionalism, especially given the instability of the 20's and early 30's, where he himself became embittered towards Trotsky for engaging in this practice. He argues that although we do not need Labour Camps or the Secret Police to punish such political dissidents, we should still follow Lenin's procedures and expel factionalists from the Party. Bukharin thus argues for a lighter hand in dealing with Party Factions."
 ZinRep:0 "However, Comrade Zinoviev feels that we should keep the current situation while preventing further \"excesses\" of the secret police and the bureaucracy, clearly alluding to the Purges before the Civil War."
 SOV_congress_over:0 "§GThe General Secretary will be elected, and the Congress will be finished!§!\n"
 sov_civil_war.19.a:0 "We must pull back."
 sov_civil_war.19.b:0 "We must continue."
 sov_civil_war.19.c:0 "We must reform."
 sov_civil_war.20.t:0 "Georgy Malenkov wins the Election"
 sov_civil_war.20.d:0 "After days of debates, the 19th Party Congress has ended with the election of the Hardliner Georgy Maximilianovich Malenkov as the General Secretary of the Communist Party, making him the leader of the USSR. His platform of adhering to the Legacy of Comrade Stalin and scientific progress have brought him praises from other Comrades of being pragmatic and forward-thinking. An old ally of the late Comrade Stalin, Comrade Malenkov was the early favorite to win the Congress, and has done as was expected."
 sov_civil_war.20.a:0 "Glory to Comrade Malenkov!"
 sov_civil_war.21.t:0 "Grigory Zinoviev wins the Election"
 sov_civil_war.21.d:0 "One of Lenin's early allies, Grigory Yevseyvich Zinoviev, has won the Election for General Secretary, bringing the 19th Party Congress to a close. On a platform of ideological correctness and minor reforms in most areas, Comrade Zinoviev has been presented as a compromise candidate, which his supporters see as positive, and his detractors as a party weakness. The former head of the Communist International is expected to return the USSR to a more Orthodox Leninist direction together with his close friend, and advisor, Lev Kamenev."
 sov_civil_war.21.a:0 "For Iron Discipline!"
 sov_civil_war.22.t:0 "Nikolai Bukharin wins the Election"
 sov_civil_war.22.d:0 "Nikolai Ivanovich Bukharin, one of the most popular politicians in the Party's History, has been elected General Secretary at the end of the 19th Party Congress. A reformist, He intends to completely do away or reform the politics and economics of the USSR to undo Stalin's Tyranny. He intends to reform the Collective Farm system, re-legalize a small measure of private enterprise, and improve the image of the Party, which has suffered as of late. Some people have been receptive to his election, but others cast him away as \"just another Bolshevik\"."
 sov_civil_war.22.a:0 "Rightly Considered the favourite of the whole Party!"
 sov_civil_war.23.t:0 "Military Coup"
 sov_civil_war.23.d:0 "By some irony of fate, the election of the General Secretary has reached gridlock. No candidate managed to receive a clear majority and an argument broke out. The argument soon turned into a screaming match that took nearly an hour to subside, and it was decided that the 19th Party Congress would continue the next day. However, soldiers blocked the entrance to the Conference Hall, preventing the Delegates from entering. Some hours later, gunfire was heard from Red Square, as soldiers were rushing in. After a few hours of confusion, General Georgy Zhukov announced on the Radio that he had secured the Kremlin and that the Red Army would be leading the country and the War Effort. He announced that reforms were on the way but affirmed the Army's support for Socialism."
 sov_civil_war.23.a:0 "My army - you're always on guard!"
 sov_civil_war.24.t:0 "Revolt in the Far East"
 sov_civil_war.24.d:0 "The Commander of the Far Eastern Military District, Vasily Blyukher, has declared his and his soldiers' support for the Provisional People’s Council and denounced the Bolshevik Tyranny. He has declared the Far Eastern military district to be a provincial administration of the New Russia, with its Capital in Khabarovsk. Blyukher's Loyalist Soldiers - which now include several thousand Civilian Militiamen - have seized parts of Khabarovsk Krai, Amursk Oblast, and the Jewish Autonomous Oblast, and have taken positions against us at the front."
 sov_civil_war.24.a:0 "They will be crushed as well!"
 sov_civil_war.24.b:0 "The Far East shall be liberated!"
 sov_civil_war.25.t:0 "Revolt on the Volga"
 sov_civil_war.25.d:0 "Apparently inspired by Blyukher's actions, Commander of the Volga Military District, Pavel Dybenko, has declared that his command too has now allied itself with Tsarytsin. Dybenko, long known as a drunk and an incompetent, clearly expects to be dismissed from his command, and has rebelled as a last-ditch attempt to save his skin. Regardless, he has taken a dangerous amount of territory with him. He has secured Tatarstan, Bashkortostan, and Chuvashia land, as well as some land around. His troops are many, and are ever closer to Moscow..."
 sov_civil_war.25.a:0 "We must take action!"
 sov_civil_war.25.b:0 "Dybenko can win!"
 sov_civil_war.26.t:0 "Revolt in Siberia"
 sov_civil_war.26.d:0 "Yan Gailit, the Commander of the Siberian Military District, has defected to the Provisional People’s Council with about 15 divisions. Although a long way from his native Latvia, the former Bolshevik has apparently realized that the Red Oppression can go on no longer, and like Blyukher and Dybenko, has decided to declare his military district as a regional administration of the traitorous regime. Unfortunately, he has seized the most vital parts of the district: Barnaul and Novosibirsk, which hold the Trans-Siberian Railway, and thus has practically cut off the flow of supplies to the Far East."
 sov_civil_war.26.a:0 "We'll get to him later."
 sov_civil_war.26.b:0 "A strong blow against Bolshevism!"
 sov_civil_war.27.t:0 "The [This.GetAdjective] Campaign"
 sov_civil_war.27.d:0 "The time has come for us to begin the campaign. The Red Tyranny will soon be replaced by a New Russia, one where people will be free to be themselves and do as they please, instead of hiding behind the facade of Lenin and Stalin."
 sov_civil_war.27.a:0 "To War!"
 sov_civil_war.28.t:0 "Russian Fascists Ask to March"
 sov_civil_war.28.d:0 "The Second Russian Civil War has caused a great deal of gossip and speculation in all corners of society. However, no institution has been more curious and even worried than the Government, who is not entirely sure what to do. Do we prepare for war? Do we offer to assist one side or the other? These kinds of debates have been going on all day, every day, with no end in sight.\n\nSoon after the Russians began the Civil War, a letter came to our Military Administration in Harbin from the Russian Fascists, who have long made Manchuria their home. They ask for permission to march into Soviet Territory to assist in the \"Crusade against Bolshevism\". This decision has been transfered to the highest levels of our government, because allowing the Fascists, who claim to have 150,000 soldiers at their disposal under the command of Cossack Ataman Semyonov, might ruin Soviet-[This.GetAdjective] Relations. What shall we do?"
 sov_civil_war.28.a:0 "Allow them to march to the East."
 sov_civil_war.28.b:0 "Allow them to march to the Northwest."
 sov_civil_war.28.c:0 "We cannot allow them to march."
 sov_civil_war.29.t:0 "Fascists March into the East"
 sov_civil_war.29.d:0 "The Russian Fascist Party has long been based in Manchuria, but today, these [From.GetAdjective] Lapdogs have marched into our territory, seizing [RFP.Capital.GetName] with about 50,000 soldiers under the command of the Transbaikal Cossack Ataman Grigory Semyonov. Konstantin Rodzaevsky, who leads [RFP.GetNameDef], has declared this day to be the beginning of \"The Great Fascist Crusade against Bolshevism\". Rodzaevsky, known for his Anti-Communist and Anti-Semitic stances, has declared his administration to be loyal to the Traitors' Government in [RUS.Capital.GetName]."
 sov_civil_war.29.a:0 "Our worst fears come true!"
 sov_civil_war.29.b:0 "All hail the Leader!"
 SOV_allowed_fascist_march:0 "Allowed Fascists into Soviet Territory"
 sov_civil_war.30.t:0 "The Crusade"
 sov_civil_war.30.d:0 "The Vozhd seems insistent on calling our campaign against the USSR a \"Crusade\", as he sees the destruction of the Bolshevik State a \"Holy Duty\" that the Fascists are meant to fulfill. Regardless, our soldiers are ready, the Legendary Semyonov is prepared, and the Political Leadership is willing to launch our war with the Reds!"
 sov_civil_war.30.a:0 "God, Nation, Labour!"
 sov_civil_war.31.t:0 "Ukrainian Revolution"
 sov_civil_war.31.d:0 "The Red Army has been slowly recapturing Ukrainian towns as the nationalist rebels continue to organize. With the rebellion in Southern Russia, these insurrectionists have seen it fit to finally rush the Verkhovna Rada in Kiev and declare the independence of [UKR.GetName]. Nearly all Ukrainians played some role in this event, as workers, students, intellectuals, soldiers, and even bureaucrats decided to tear off their stripes, burned their Party Membership cards, and join in the beating of those who kept them on. Ethnic minorities were attacked as shops were destroyed. Most crucially, the rebels managed to capture or force the surrender of most political offices and many army barracks, as Ukrainian soldiers defected and established a new Ukrainian Army.\n\nThe Red Army was capable of disarming Eastern Ukrainian towns, but the River Dnieper protected the Ukrainian Militia and allowed them to stop our paltry advance. Or perhaps, the river protects us from them. The rebels have thus seized all land west of the Dnieper with the exception of Odessa, which has been held by the naval garrison.\n\nDuring this anarchy, a train left Lviv, Poland and pulled into Vinnitsa. Its passengers were a group of Ukrainian Nationalist Leaders from Poland. The leaders of the Ukrainian National Democratic Organization and the Ukrainian Democratic Radical Party had spent much time discussing the situation and deciding on a government. They had been in contact with the rebels and have already agreed to form an administration in Kiev. Though their speech was not quite ready, the Vinnitsa crowd wanted it to be given there and then. Faced with the trust of his countrymen, Kost Levytsky of the UNDO read the speech. Ukraine was declared to be a free Democratic Republic, and it would be run by a coalition of Conservative and Agrarian Socialist politicians."
 sov_civil_war.31.a:0 "These Fascists will be crushed like the Council!"
 sov_civil_war.31.b:0 "The glory of Ukraine has not yet died!"
 sov_civil_war.32.t:0 "Belarusian Invasion?"
 sov_civil_war.32.d:0 "The Revolt in Ukraine has insipired similar stirrings in Belarus, but to a far lesser degree. Many Belarusians see themselves as Russians, and the territory has been largely resistant to national agitation and welcoming to the Red Army. As a result, any incidents have been quickly dealt with by local police or NKVD detatchments.\n\nWith one exception.\n\nMinsk has been in a state of constant warfare for at least a week. At the western edge of our territory, nationalist militias - aided by deserters - have been able to present a worthy opponent to the Red Army. At any given time, at least two-fifths of the city was under rebel control. This all changed when Stanislav Bulak-Bulakovich, a general who at one point or another fought on the side of Imperial Russia, the Red Army, the White Army, the German Army, the Polish Army, and even establishing an Independent Belarus, charged accross the Soviet-Polish border with a few divisions. It is our estimation that he had approximately twenty thousand soldiers under his command. His soldiers quickly reached Minsk, and helped the rebels to push the Red Army out of the city. He then declared the establishment of the second Belarusian Democratic Republic. Following his speech, which was met by cheering crowds, the rebel militias integrated themselves into the new Belarusian Army, which, under the organization of Bulakovich's \"Military Confederation\", seek to establish a new, Anti-Bolshevik, Belarus."
 sov_civil_war.32.a:0 "Another toady to destroy"
 sov_civil_war.32.b:0 "Belarus is back on the map!"
 sov_civil_war.33.t:0 "A Tatar Republic?"
 sov_civil_war.33.d:0 "During the first Civil War, the Crimean Tatars attempted to form their own Crimean People's Republic. Although some Crimean Nationalists were pro-Bolshevik, their organization, the Milly Firqa, was banned by the Communist Party and Crimea was made into an ASSR. However, it seems that we have failed to properly deal with Tatar Nationalism. Asan Aivazov, former editor of MF's newspaper, has declared Crimea to be an independent state, uniting all Crimean ethnicities. Although this has been popular among the populations considered to be \"Tatar\" (in reality a group of somewhat related sub-ethnicities), local Russians, Ukrainians, and Germans have met this declaration with anything between cautious nervousness and outright disgust.\n\nThe new Crimean government, although totally disorganized, have made public their intentions to form a Western-style Parliamentary Republic. Despite their intentions, it will be very hard to develop political groupings and traditions in a nation that has only ever known monarchy and dictatorship."
 sov_civil_war.33.a:0 "Another abnormality on the map!"
 sov_civil_war.33.b:0 "Crimea shall be free!"
 sov_civil_war.34.t:0 "The [GetMonth] Uprising"
 sov_civil_war.34.d:0 "The First Civil War saw the Georgian Democratic Republic declare its independence, led by the reviled Mensheviks. The GDR achieved several key reforms in education and land distribution, but that was in vain. The Petty-Bourgeois State was crushed by the Red Army, as was a failed uprising in August 1924.\n\nHowever, with the outbreak of the Second Civil War and related Independence Wars, rumblings in Georgia have steadily grown. With the Caucasus generally cut off from the rest of the USSR, it has been up to the local army, police, and NKVD to keep down any traitors. However, these efforts have failed. The rebellious Georgian People’s Assembly and their militia has seized Tbilisi, and several aligned towns have defected to the GPA. Red Army soldiers have begun defecting to the new militias, with much of Georgia following suit. The port city of Batumi in particular was only saved due to the bravery of the local NKVD.\n\nOnly today has Noe Zhordania, one of the GDR leaders in Exile, arrived in Georgia (through secret channels). Upon arrival, he announced the reformation of the Georgian Democratic Republic under the Menshevik government. These Social Democrats broke with the Bolshevik over their willingness to sell out to Bourgeois Governments. If Georgia is allowed to seize the rest of their SSR and expand further into the Caucasus, the entire region may be lost to us forever!"
 sov_civil_war.34.a:0 "Yet another emergency!"
 sov_civil_war.34.b:0 "Strength is in Unity!"
 sov_civil_war.35.t:0 "Revolution in Yerevan"
 sov_civil_war.35.d:0 "Due to the Russians' position and the Georgian Revolt, our hold on the Caucasus is getting ever weaker. With little authority to stop them, members of the Armenian Revolutionary Federation have been smuggled into Armenia and have subsequently declared Armenian Independence.\n\nThese \"Dashnaks\" have ruled Armenia once before. The Democratic Republic of Armenia existed for over two years during the first Russian Civil War, where the Socialist Dashnaks established a multi-party parliamentary republic and laid claim to what has become known as \"Wilsonian Armenia\", based on promises by American President Woodrow Wilson. After the Sovietization of Armenia, the ARF became the primary representative of the Armenian Diaspora, particularly in Lebanon.\n\nWhile the ARF's positions were more concrete back then, Dashnak ideas of Nationalism and Socialism - including their relation to one another - have become somewhat muddled. Some trends in the Dashnak movement have shown rightward movements, with some ARF members advocating for positions that put Nationalism as a priority over Socialism, such as the Fascist Taronakanutyun splinter group. Only time will tell what kind of government the Armenians can put together."
 sov_civil_war.35.a:0 "These Counter-Revolutionaries will fall!"
 sov_civil_war.35.b:0 "The Armenian National Revolution will restore Our Fatherland!"
 sov_civil_war.36.t:0 "Jadidism in Azerbaijan"
 sov_civil_war.36.d:0 "As of now, the Soviet Caucasus is in a real crisis. Azerbaijani Militias East of the Mtkvari river (and the town of Ganja to the West) have revolted and declared Azerbaijan's Independence. Led by the famed Jadidist Muhammad Amin Rasulzadeh, these militias seek to restore the Armenian Democratic Republic, founded in 1918.\n\nThe Jadidist movement seeks to create a Liberal Parliamentary Democracy in Azerbaijan in an attempt to imitate the Imperialist West. More crucially, we need Azerbaijan's oil fields to supply our army. Should we become unable to sustain our large motorized forces, we are doomed!"
 sov_civil_war.36.a:0 "To Baku!"
 sov_civil_war.36.b:0 "Long Live the Movement!"
 sov_civil_war.37.t:0 "The Terek Brotherhood"
 sov_civil_war.37.d:0 "Inspired by the Ukrainian and Caucasian Nationalist Movements, a group of Cryptofascists in Chechnya and Dagestan have performed an obviously coordinated strike against our governments in the North Caucasus. In similar speeches, leaders [CHC.GetLeader] and [Dag.GetLeader] praised the efforts of the Mountain Republic to establish a Pan-Caucasus Islamic Republic, and denounced us for invading them. They both pledged military cooperation as a \"Terek Brotherhood\" against all threats, \"Bolshevik or Otherwise\". Seeing as that there is a not-insignificant amount of oil in these regions, losing the North Caucasus will be a large blow for us. Luckily, they may become distracted fighting Shaposhnikov's men, rather than ours."
 sov_civil_war.37.a:0 "Yet another obstacle in the face of victory!"
 sov_civil_war.37.b:0 "Dagestan shall lead us into victory!"
 sov_civil_war.37.c:0 "Chechnya shall remain free!"
 sov_civil_war.38.t:0 "Return of the Basmachi"
 sov_civil_war.38.d:0 "In 1916, Imperial anti-conscripton led to the beginning of the \"Basmachi\" movement which attempted to create an independent Turkestan. After the Bolsheviks carried out a massacre in Kokand, the Basmachi began a guerilla war that lasted all the way into the '30s, though with increasingly lesser intensity. The Basmachi drew support from many ideological viewpoints, including reformers, Pan-Turkics, and Left-Nationalists. However, ethnic rivalry eventually forced the movement apart. They were allied with the kingdoms of Khiva and Bukhara, but were eventually forced south into Afghanistan.\n\nIt is from Afghanistan that this new threat comes. Exiled riders have ridden north to Tashkent and declared the Emirate of Turkestan under the exiled ruler of Bukhara, Mohammed Alim Khan. They have taken control over a significant area in Southern Central Asia, meaning that a territory rich in resources and population is at risk. Though they rode north with about three Cavalry Divisions, they were accompanied by a militia made up of about five thousand vetrean soldiers. They have also managed to raise many militiamen to aid them. If we do not act, these bandits will make Central Asia lost to Moscow forever!"
 sov_civil_war.38.a:0 "Surely we can fight a few horsemen..."
 sov_civil_war.38.b:0 "Central Asia shall be free!"
 sov_civil_war.39.t:0 "Loss of Control in Buryatia"
 sov_civil_war.39.d:0 "Our loss of the Trans-Siberian Railway has meant that we have far less control on what goes on in Siberia. As a result, there is nothing stopping ambitious local leaders from gaining de facto independence. In particular, the General Secretary of the Buryatian Section of the VKP(b), Mikhey Yerbanov, has managed to accrue enough influence to be able to declare his own militia, meaning that Buryatia is, as of now, effectively independent. However, he has not betrayed us like the other SSRs have. He still recognizes that Buryatia is a part of the USSR, but likely wants to pressure us into elevating the Buryat Autonomous Soviet Socialist Republic to a full SSR. Ergo, while Buryatia will fight on our side, we have very little say over what goes on there."
 sov_civil_war.39.a:0 "Everything is crumbling around us!"
 sov_civil_war.39.b:0 "Buryatia shall help defeat the Counter-Revolutionaries!"
 sov_civil_war.40.t:0 "[From.GetAdjective] Recognition"
 sov_civil_war.40.d:0 "Finding friends during this conflict is a tall order. However, [From.GetNameDef] has announced that they recognize our government and our rightful ownership of the territory our nationality controlled as part of the USSR. They have also dispached some liasons to assist in the transport of military equipment to our borders."
 sov_civil_war.40.a:0 "A Friend Indeed!"
 sov_civil_war.41.t:0 "The Sihvo Proposal"
 sov_civil_war.41.d:0 "Karelia has been split between the Russians and Finns since the 18th century, when it had already been split between the Russians and Swedes since the 13 century. The Karelian people are closely related to the Finns, so Finnish nationalists feel that all of Karelia should be a natural part of Greater Finland. To this end, after the collapse of the Russian Empire and the independence of Finland, Finnish volunteer soldiers began to march on Bolshevik-ruled Karelia to join it to Finland.\n\nOne of these soldiers, Colonel Aarne Sihvo, later became a general, and the Chief of Defense of the Finnish Defence Forces. General Sihvo has today prsented the government with a plan to seize Karelia and Murmansk without immediately drawing us into a large-scale war. General Sihvo emphatically emphsizes the plan's reliance on medium-scale skirmishes with the Soviets, which would cause tension in the region, but if Karelia is swiftly taken, then Finland can declare victory without the Soviets sending a full scale invasion force. Some members of the government are enthusiastic, while others still worry about possible Soviet Counterattack. As a compromise, it was suggested that Finland only claim the regions of Repola and Porajärvi (Porosozero in Russian), but nobody was very enthusiastic about this idea. It remains our decision on what to claim..."
 sov_civil_war.41.a:0 "We must liberate all Karelia!"
 sov_civil_war.41.b:0 "We will liberate Repola and Porajärvi!"
 sov_civil_war.41.c:0 "We cannot afford such risky expeditions!"
 #42-52 are hidden
 sov_civil_war.53.t:0 "Failure in the Amur Region"
 sov_civil_war.53.d:0 "[This.GetAdjective] forces have failed to complete our objectives in the Amur region. As such, a great blow has been dealt to our governments' legitimacy. Even now, the cabinet is meeting with our High Command to determine our next course of action."
 sov_civil_war.53.a:0 "Failure is Intolerable!"
 sov_civil_war.54.t:0 "Poland Offers Assistance"
 sov_civil_war.54.d:0 "[From.GetNamDef] has offered us an alliance. Under the terms of the agreement, Polish soldiers would be able to march to the aid of thir \"[This.GetAdjective] Brothers\" in order to liberate them from Soviet and Russian oppression. The Pro-Polish members of our government are estatic about this turn of events. On the other hand, we would be expected to take part in any Polish wars as well. Should we accept this agreement?"
 sov_civil_war.54.a:0 "Yes, of course!"
 sov_civil_war.54.b:0 "We should not."
 warsaw_kiev_pact:0 "Lublin Pact"
 sov_civil_war.55.t:0 "[From.GetAdjective] Alliance!"
 sov_civil_war.55.d:0 "The government of [From.GetNameDef] has agreed to allow us to assist them in fighting the Red Menace. As we speak, the [From.GetAdjective]s have opened their border and our soldiers and equipment can now come pouring in. Naturally, we expect to be able to both secure our eastern border and extract economic concessions out of the [From.GetAdjective] nation."
 sov_civil_war.55.a:0 "Hooray for Poland!"
 sov_civil_war.56.t:0 "[From.GetNameDef] Rejects our Alliance"
 sov_civil_war.56.d:0 "The [From.GetAdjective] government has rejected our offer of alliance, with no reason given. Perhaps they have deduced that we want to extract economic concessions from them, and apparently this is not worth military assistance. Regardless of reason, we will not be coming to our [From.GetAdjective] Brothers' aid."
 sov_civil_war.56.a:0 "Shame."
 sov_civil_war.57.t:0 "Intervention in the East?"
 sov_civil_war.57.d:0 "We have just recieved word that the Polish Army has crossed their eastern border to support the Anti-Communist Nationalist Governments. [This.GetGermany2rcwResponse]"
 Germany_Leninist_2rcw_Response:0 "Our politicians have spent the last day emphatically insisting that we launch an assault accross the Polish Border in support of the USSR. They maintain that we can both retake old German lands and neutralize a hostile power to our east in one fell swoop. Though this is appealing, it is also worth noting that the French and the British would not tolerate an attack on Polish Soil. The military is also concerned that we are not ready to fight on even one front, especially on such a wide border. What shall we do?"
 Germany_Socialist_2rcw_Back_Poland:0 "Our government and the army have spent the last day emphatically insisting that we back [POL.GetNameDef]. Though we are anti-war, some have felt that it is our duty to assist the Polish in taking down the Bolsheviks and helping them work towards an International Revolution. Others feel that although we should offer our materiel support to Anti-Bolshevik regimes, it would be hypocritical for us to attack a foreign power, especially if there is not a Socialist Revolution going on. Ultimately, the decision is up to us on how to proceed."
 Germany_Socialist_2rcw_Response:0 "Though some Military Officers wish to go East in support of the Poles, most of our government believes that we should not waste resources on assisting an Anti-Socialist power in their Reactionary Assault on the USSR, even if we also oppose the Bolsheviks. They hold that we can only fight for Socialist Revolutions, and the revolt in Russia and Poland's intervension are decidedly Counter-Revolutionary. On the other hand, Socialist participation in the East might warm the Poles, Belarusians, and Ukrainians up to our ideology as a replacement for Bolshevism. In the end, it is our decision whether or not to assist the Poles in their mission."
 Germany_Rightist_2rcw_Response:0 "An overwhelming majority in our government believe that we need to participate in some way; whether against or with the Poles. However, the only opinions that matter are those who have our leader's ear. Many argue that our irridentist goals outweigh our Anti-Bolsheviks goals, and we should thus invade Poland. When questioned about the need to eliminate the Bolsheviks from the map, they respond that the Bolsheviks will be \"crushed under their own weight\". Obviously, some feel that we should assist Poland in fighting the Bolsheviks, as International Bolshevism's influence persists in other parts of the world. They say that irridentism can wait while the security of \"European Civilzation\" is at stake. A very small minority also feels that we should remain neutral, and let the Poles and Bolsheviks beat each other to deah, after which we can move in \"as scavengers\", taking what we want while letting others do the heavy lifting. This would save on resources and manpower..."
 Germany_Democratic_2rcw_Response:0 "Some members of our government wish to mobilize our armies in assistance, rather than in opposition, to the Poles. They are saying that the destruction of a hostile foreign power that meddles in our affairs takes top priority, and we can now do so while promoting cooperation with Eastern Europe. However, our economy has only recovered recently, and is not ready to sustain war for long. Some parliamentarians are keenly aware of this fact, and argue that a war is not economically desirable. Still others add to this and argue that a war is not morally or socially desirable either, arguing that it would damage our standing among the people. However, the final choice rests with [This.GetLeader]."
 sov_civil_war.57.a:0 "We shall take our lands back!"
 sov_civil_war.57.b:0 "It is best to remain neutral."
 sov_civil_war.57.c:0 "Destroying the Bolsheviks is our top priority!"
 sov_civil_war.58.t:0 "Germany Asks for an Alliance"
 sov_civil_war.58.d:0 "[From.GetNameDef] has asked us for permission to join us in our war against the USSR. They say that they see it as their duty to fight the Bolsheviks in order to limit Moscow's influence in Germany and to help establish a new - and hopefully friendlier - regime in Russia. Under the terms of their proposal, German soldiers would march through our lands and meet up with Polish soldiers in order to fight on the front lines. Should we agree to this proposal?"
 sov_civil_war.58.a:0 "We need all the help we can get!"
 sov_civil_war.58.b:0 "Probably just another German trick."
 sov_civil_war.59.t:0 "Poland Rejects our Assistance"
 sov_civil_war.59.d:0 "In an audience with [This.GetLeader], the Polish Ambassador proudly declared that Poland needed no assistance against the weakened USSR. The Poles have thus decided not to grant our army access to their rail network. It seems that Germany will continue to see peace."
 sov_civil_war.59.a:0 "The people will be relieved."
 sov_civil_war.60.t:0 "Germany Invades Poland!"
 sov_civil_war.60.d:0 "[From.GetNameDef] has invaded Poland in order to satisfy their irridentist claims while Poland is distracted with fighting the collapsing USSR. The Germans' attack of Poland and implicit support of the Bolsheviks cannot go unheeded, and many in our government are calling for mobilization against the Germans. What shall we do?"
 sov_civil_war.60.a:0 "Poland is not yet lost!"
 sov_civil_war.60.b:0 "We cannot fight just yet."
 sov_civil_war.61.t:0 "Moscow Nights"
 sov_civil_war.61.d:0 "It was a crisp spring night in Moscow. A young student was taking the trolleybus home from University. He looked out onto the street and saw what everyone else saw: people trying to do their best in the circumstances they were given. Tomorrow he was to go to a Komsomol meeting and listen to political reports, but his heart wasn’t in it. The young man had never cared for political meetings anyways; he just wanted to be an engineer. Lately he had begun to think that Stalin’s death had opened up the opportunity for real change. He understood that the state had given him an education and a future place of work, but to him it appeared that the Central Committee were living like Kings while the common people were living in shambles. He thought, perhaps it was time for the people’s voice to be heard…\n\nThe man sitting on the other end of the trolleybus could not have felt differently from our first subject. This man was a Moscow worker, and he too had a Party Meeting the next day. Unlike the engineering student, the worker was very much looking forward to his political meeting. Born into a poor family, he had barely reached adulthood when the First Five-Year Plan had begun, and he deeply believed the only reason he was still alive was the Bolsheviks. Comrade Stalin’s Party had provided him with a basic education, a factory to work in, and a communal apartment. He deeply detested the protestors, as his workplace comrades would attest. He also hated the Troika, branding them as bourgeois and ineffectual. In his anger, the man began to think that revenge would come soon..."
 sov_civil_war.61.a:0 "The river moves and does not move."
 sov_civil_war.62.t:0 "Massacre in Kiev"
 sov_civil_war.62.d:0 "Every few days, the cycle repeats: Protestors amass in front of Party Committee Offices, and pressure for change until the police disperse them. However, these protests continue to grow each time, to the point where the military now guards local squares. Yesterday’s protest in Kiev numbered nearly 12000 people and continued for over twelve hours, from dawn into the night, as the police were unsure of what to do. However, as a few soldiers tried to draw away and arrest a group of protestors, the students began resisting, as has become common practice for the dissidents. And as has become common practice for the military and police, they began beating the protestors.\n\nOf course, other protestors reacted negatively, and the crowd appeared to pulse with activity. Some moved to help their colleagues, others moved toward the Verkhovna Rada building. It was this latter group that spooked the soldiers, as shots rang out over the square. As other soldiers began joining in, the entire \"battle\" lasted seven minutes until a second group of soldiers could intervene. This had also scared the militia, who began attacking protestors as well, who responded in kind. When the dust settled, 27 people had died and another 443 had been wounded. Though Pravda and Izvestia will claim this to be an insurrection, we cannot keep people in the dark much longer."
 sov_civil_war.62.a:0 "We are doomed!"
 sov_civil_war.63.t:0 "The Kiev Riot"
 sov_civil_war.63.d:0 "The killing of Ukrainian protestors did not go over well with the Kievans. Nearly immediately, a riot began on the Western Side (Left Bank of the Dnieper) of the city, particularly near the Capital District. Throughout the night and into the early morning, shops were burned, goods were looted, and authorities were attacked. Particularly at risk of personal attack were the Jewish population. If they themselves were uninjured, stores they ran would more than likely have been targeted by rioters who blamed minorities for Bolshevik rule.\n\nAll we could do at this point was watch. The Red Army had been pulled back to prevent further incidents, though soldiers had been sent to other Ukrainian cities for security. Until dawn, Kiev was in anarchy, and chaos reigned. All we can do now is put out the fires and count the dead. The potential political ramifications of this are stunning. Most in Moscow do not even want to think that far ahead."
 sov_civil_war.63.a:0 "We should prepare for the worst."
 sov_civil_war.64.t:0 "Restless Ukraine"
 sov_civil_war.64.d:0 "The Kiev Massacre and the subsequent riot have only served to incense the Ukrainians. The cities have seen new protests and small acts of rioting and vandalism. The countryside and small towns have essentially rejected Bolshevik rule, on some occasions taking the local authorities captive and arming themselves if possible. There have even been rumors of gunfights or murders, but these are not yet possible to prove. Besides the popularity of this movement, what worries Moscow most is their drive to organize.\n\nThese rebels draw support from nearly all strata of Soviet society. Peasants, workers, students, technical specialists, and even some bureaucrats have turned on us. This has allowed the rebels to establish communications between each other, and are coordinating their movements. While they have not yet taken over key industrial or political areas, they could do so at any moment. Communications from loyal stations are sparse, and transport in or out has nearly stopped. It seems that our only option is to send the Red Army to restore order town-by-town."
 sov_civil_war.64.a:0 "The Red Army shall be victorious!"
 sov_civil_war.65.t:0 "The Tbilisi Takeover"
 sov_civil_war.65.d:0 "The Georgians have apparently been watching the chaos in Ukraine closely. Yesterday, a contingent of protestors - too many to count - had marched on the House of Government building in Tbilisi with the intention of entering it and declaring the end of Soviet Power in Georgia. At least, that is what their signs implied. While the soldiers had been told that the events in Kiev were an \"insurrection\", many thought differently and their commanders (and the Political Leadership) knew exactly what had happened. To avoid a similar situation, the Red Army retreated to the doors of the Building and commanded the protestors to stand down. The dissidents stopped in front of the Building, and the two sides remained at an impasse for three hours, screaming at each other until the protestors finally retreated, not wishing to spark a riot.\n\nEven though this obvious coup had failed, the rebels still control a large portion of Tbilisi. Though they have been trying to organize like the Ukrainians, Georgia’s lack of infrastructure and rural nature means that they have had little luck outside of the Capital. This has not stopped the Tbilisians from creating a \"Georgian People’s Assembly\", which sort of acts as a council for the rebels."
 sov_civil_war.65.a:0 "We fight on two fronts!"
 sov_civil_war.66.t:0 "[From.GetAdjective]s Demand Peace"
 sov_civil_war.66.d:0 "Make no mistake, we are losing the war. [From.GetNameDef] has seen fit to capitalize on our precarious position and offer to cease hostilities in return for their rightful land, as defined by their borders within the USSR. Doing so would give us a morale boost at home and allow us to focus our resources on a thinner front, but it would mean acknowledging defeat..."
 sov_civil_war.66.a:0 "We have no choice!"
 sov_civil_war.66.b:0 "We must fight on!"
 sov_civil_war.67.t:0 "Peace with the [From.GetAdjective]s"
 sov_civil_war.67.d:0 "[From.GetNameDef] has accepted our deal for peace. They have recognized our claims to our rightful territory, and hostilities have stopped between our forces."
 sov_civil_war.67.a:0 "Hooray!"
 sov_civil_war.68.t:0 "Hostilities Continue"
 sov_civil_war.68.d:0 "[From.GetNameDef] has refused to recognize our territories in exchange for peace. Despite the plain fact that they are fighting a losing battle, they think they can fight on."
 sov_civil_war.68.a:0 "We'll see about that."
 ##Internal
 sov_internal.1.t:0 "Rise of the Tolkachy"
 sov_internal.1.d:0 "It has become clear that despite our insistance, we have created unrealistic quotas without taking into account how inefficient our economy actually is. To avoid looking bad (and likely arrest), factory managers have begun hiring \"Tolkachy\", or \"Pushers\". These people help the factories meet their production targets by getting bureaucrats to lower the targets themselves, so when a factory meets the new targets, they look better."
 sov_internal.1.a:0 "Can we do nothing about this?"
 sov_internal.2.t:0 "The Collectivization Debate"
 sov_internal.2.d:0 "There can be no doubt in the Politburo that collectivization was very successful, especially because Comrade Stalin will not let there be any doubt. However, our temporary moratorium has only resulted in only about 5% of farmlands becoming collective farms in the last year. The debate is thus: Should we re-intensify collectivization efforts, or should we declare an end to the program and let the country recover?"
 sov_internal.2.a:0 "Comrade Stalin is right: Continue!"
 sov_internal.2.b:0 "We should stop, as Comrade Stalin says."
 SOV_reintensify_collectivization:0 "Re-intensified Collectivization"
 SOV_stop_collectivization:0 "Halted Collectivization"
 sov_internal.3.t:0 "Collectivization is Over"
 sov_internal.3.d:0 "90% of farmland has been collectivized, so Comrade Stalin has decided that our collectivization campaign is successful enough and resources should be invested in other areas of development. Furthermore, Comrade Stalin knows how precarious the situation is. If we do not stop now and at least let some peasants work on their own, then we could face total collapse."
 sov_internal.3.a:0 "At least it's over now."
 sov_internal.4.t:0 "The Scars of Famine Heal"
 sov_internal.4.d:0 "The end of collectivization has given the nation the chance to heal from the damage we have caused it. The famines are ending and people are beginning to have a semblance of living standards once again."
 sov_internal.4.a:0 "Glory to Stalin!"
 sov_internal.5.t:0 "The 17th Congress Begins"
 sov_internal.5.d:0 "The 17th Congress of the All-Union Communist Party (Bolsheviks) begins today to determine the future of the country and the platform of the Party. In attendence are nearly two thousand delegates, representing nearly two million Party members. The agenda includes:\n\n\t- A report by the Central Committee (represented by Comrade Stalin)\n\t- A report by the Central Revision Committee (represented by Comrade Vladimirsky)\n\t- A report by the Central Control Commission (represented by Comrade Rudzutak)\n\t- A report by our delegation to the Comintern (represented by Comrade Manuilsky)\n\t- The formal approval of the Second Five-Year Plan\n\t- Revisions to Party organization and platform"
 sov_internal.5.a:0 "Let us begin!"
 sov_internal.6.t:0 "17th Party Congress: Party Platform"
 sov_internal.6.d:0 "Over the last few days, Comrades Stalin, Vladimirsky, Rudzutak, and Manuilsky gave their reports. According to them, everything is going well, except when it is not going well. However, neither our brave Communist Party not its leaders are the cause of our non-existant setbacks, but the saboteurs, imperialists, and bourgiouse. The TsRK and Comintern's activities were approved wholeheartedly. Of particular note were the revisions to party platform laid out by Comrade Stalin, which was also swiftly approved."
 sov_internal.6.a:0 "The Platform of Comrade Stalin is the Platform of the Party!"
 sov_internal.6.b:0 "Comrade Stalin is right to keep us Internationalist!"
 SOV_Great_Retreat:0 "Comrade Stalin has chosen to perform a Great Retreat from Communism."
 SOV_Great_Offensive:0 "Comrade Stalin has chosen to perform a Great Offensive for Communism."
 sov_internal.7.t:0 "17th Party Congress: Party Organization"
 sov_internal.7.d:0 "The last few days have seen debate about the organization of the Party itself. Resolutions were adopted to cut down on bureaucratic inefficiency and establish a more hierarchical organization. It also calls for the end of Cadres and their transformation into party organizations and committees. It also sees more organizations created to give more control to the Central Committee, thus giving more power to Comrade Stalin."
 sov_internal.7.a:0 "Good Work, Comrades!"
 sov_internal.8.t:0 "17th Party Congress: The Second Five-Year Plan"
 sov_internal.8.d:0 "Although the Second Five-Year Plan has already started, it has not been formally approved by the Congress. The Congress has thus spent the last few days approving the plan, along with its main goals: The elimination of capitalist elements, the technological modernization of industry, continued agricultural improvements, and electrification."
 sov_internal.8.a:0 "May the Five-Year Plan be finished in Four!"
 sov_internal.9.t:0 "17th Party Congress: Final Words and Elections"
 sov_internal.9.d:0 "As the Congress comes to a close, Comrade Stalin gives a final speech. In it, he talks about the eternal threat of Imperialism and Sabotage, and the need for ever increasing vigilance. Elections to the Central Committee also occured, whose new composition includes up-and-comers like Nikita Krushchev and Nikolai Yezhov."
 sov_internal.9.a:0 "Long Live the Revolution!"
 sov_news.3.t:0 "17th Party Congress in the USSR"
 sov_news.3.d:0 "The Soviet Leadership has concluded the 17th Party Congress of the All-Union Communist Party (bolsheviks). During the congress, the delegates, brought from all over the USSR, reviewed reports by the Party committees and revised their platform according to recommendations.\n\nMost notable was the speech given by General Secretary Joseph Stalin. [SOV.SOV_offensive_or_retreat]"
 sov_news.3.a:0 "Is this the future of Socialism?"
 SOV_offensive_loc:0 "According to Stalin's recommendations, the party will mostly continue with the current policies of class conflict. Remarking that the USSR has \"already chosen course,\" the Party has thus chosen to adopt resolutions signifying the need for the continued struggle against supposed counter-revolutionary and foreign elements in the country."
 SOV_retreat_loc:0 "According to Stalin's recommendations, the Party has adopted resolutions to de-escalate the social tensions within the country by ending the class conflict. The Party now calls for rights to be returned to reformed \"saboteurs\" and their families."
 SOV_start_politics:0 "§GThe full Political Branch is now unlocked.§!"
 sov_internal.10.t:0 "Insurgency in Chechnya"
 sov_internal.10.d:0 "Rebels led by Chechen intellectual Hasan Israilov have today taken control of several auls - fortified villages - in the Shatoysky district, located on Southern Chechnya. The Proclamation of the Provisional Popular Revolutionary Government of Chechnya-Ingushetia proclaims their aim is independence for Chechnya and all Caucasian peoples. The people seem to be sympathetic, as they have already begun evading [This.GetAdjective] conscription statues."
 sov_internal.10.a:0 "Thus the conflict begins"
 sov_internal.11.t:0 "Chechen Insurgents Attack!"
 sov_internal.11.d:0 "Chechen Guerillas have today attacked one of our military outposts. Using explosives, they have caused damage to [This.GetAdjective] military railways and killed a few military personnel. Most notably, they have seized a number of modern weapons, which they will likely use against us."
 sov_internal.11.a:0 "They will pay for this!"
 CHC_NKVD:0 "NKVD Spies"
 CHC_Abwehr:0 "Abwehr Spies"
 CHC_Generic:0 "Our Spies"
 sov_internal.12.t:0 "The Chechen Insurgency Grows"
 sov_internal.12.d:0 "[Controller.CHCIntelAgency] have found that Hasan Israilov and his brother Hussein have organized 41 meetings to recruit guerillas and sympathizers. Their insurrection is growing steadily, and we must take actions to stop this!"
 sov_internal.12.a:0 "Worrying"
 sov_internal.13.t:0 "The Special Party of Caucasus Brothers"
 sov_internal.13.d:0 "Hasan Israilov has announced that his movement now aims not just to liberate the Chechens and Ingush, but all of the Caucasus. To this end, he has formed the Special Party of Caucasus Brothers to attract other nationalities to his insurrection. Some North Caucasians are joining him, but the effect is largely contained."
 sov_internal.13.a:0 "A minor development at best."
 sov_internal.14.t:0 "Rebellion in Shatoi and Dagestan!"
 sov_internal.14.d:0 "Guerillas led by Maribek Sheripov have taken over Shatoi and failed to take Itum-Kale, in the South of Chechnya! They have joined up with Israilov and have thus scored a major victory for the insurrectionists. Additionally, Dagestani rebels have taken over the frontier villages of Novolakskaya and Dylym. This is sure to be a huge blow to our operations in the region!"
 sov_internal.14.a:0 "We must act soon!"
 sov_internal.15.t:0 "Chechen Soldiers Desert!"
 sov_internal.15.d:0 "Chechen and Ingush Soldiers have heard of the recent revolt in Shatoi and have started deserting en masse. This has somewhat depleted our manpower pool, but we can recover from this!"
 sov_internal.15.a:0 "When the revolt is crushed, they will see the error of their ways!"
 fighting_chechens:0 "§YAlready taking actions against Chechen Insurgents.§!\n"
 sov_internal.16.t:0 "Chechen Cell Taken Down"
 sov_internal.16.d:0 "After a heated gun battle, [This.CHCIntelAgency] have managed to take down an insurgent cell in Chechnya. A small village is back under our control. This event has robbed the insurgents of some of their strength and manpower."
 sov_internal.16.a:0 "Another victory for [This.GetNameDef]."
 sov_internal.17.t:0 "Stalemate in Chechnya"
 sov_internal.17.d:0 "After a heated gun battle, [This.CHCIntelAgency] were forced out of a Chechen village with heavy losses. While they were able to inflict casualties on the enemy, they still failed to take down the cell. The Insurgents can now scavenge weapons and ammunition from the fallen agents, and use those against us again."
 sov_internal.17.a:0 "At least we know there is a cell there!"
 sov_internal.18.t:0 "Failure in Chechnya"
 sov_internal.18.d:0 "After a heated gun battle, [This.CHCIntelAgency] have been captured and/or killed by an Insurgent Cell in a Chechen village. This has robbed us of semi-valuable spies, and has given the insurgents a larger stockpile of weapons and ammunition."
 sov_internal.18.a:0 "Damn!"
 sov_internal.19.t:0 "Successful Operation in Chechnya"
 sov_internal.19.d:0 "Our recent military operation in Chechnya seems to have successfully eliminated a known partisan cell. Unfortunately, this has been accompanied by civilian casualties. However, the insurrectionists have been severly hurt by this operation."
 sov_internal.19.a:0 "Alright."
 sov_internal.20.t:0 "Failed Operation in Chechnya"
 sov_internal.20.d:0 "Our recent military operation in Chechnya has failed to eliminate a known cell. Instead, analysis reveals that we have inflicted civilian casualties. This has only increased the morale of the Chechen separatists."
 sov_internal.20.a:0 "Damn!"
 sov_internal.21.t:0 "Anti-Insurgent Operation Successful"
 sov_internal.21.d:0 "Resorting to drastic measures involving over one hundred thousand covert agents and soldiers, the Insurgency in Chechnya-Ingushetia has been ended. As part of these measures, a large majority of insurgents were found and exectued, including the Israilov brothers. It is safe to say that order has been restored."
 sov_internal.21.a:0 "Understood."
 sov_internal.22.t:0 "Chechen Revolt!"
 sov_internal.22.d:0 "We have let the Insurgency in Chechnya get out of hand, and now rebels led by Hasan Israilov have begun an open revolt! Chechnya has been seized by the guerillas, and local authorities have been overpowered, with some officials being executed. Israilov has declared this day to be the day of Chechen Independence, although it is not clear how he expects to fight us with only 15 thousand militiamen..."
 sov_internal.22.a:0 "Crush the Traitors!"
 sov_internal.22.b:0 "Repel the Imperialists!"
 sov_internal.23.t:0 "The End of the War"
 sov_internal.23.d:0 "The Imperialist Attackers have been repelled and destroyed! A new era of peace now reigns over the Union of Soviet Socialist Republics, thanks to the Red Army and The Iron Marshal and Generalissimus, Comrade Stalin! Military Parades and Celebrations are already underway, with the people ready to recieve the fruits of their labor!"
 sov_internal.23.a:0 "May Peace last another 50 years!"
 sov_internal.24.t:0 "Peasants Resist"
 sov_internal.24.d:0 "Our Counter-Counter-Revolutionary efforts in rural Russia have by-and-large failed. Peasant Resistance remains high, and no amount of arrests and propaganda can mitigate it. The peasants - even the Kolkhozniki - are hiding their grain, lying to state officials, and some have even been caught distributing Conservative Literature."
 sov_internal.24.a:0 "This problem is too big to solve."
 sov_internal.25.t:0 "A Dissolusioned People"
 sov_internal.25.d:0 "The Bolshevik Oppression has worn the population down since 1917. The people are no longer enthusiastic about the Revolution, no longer trust the Party's cries for stability, and see our recent propaganda as they see rats fleeing a sinking ship. Some Communists try and excuse themselves by quietly blaming the State of the Union on Comrade Stalin, but a large majority rue the day that the Communists took over."
 sov_internal.25.a:0 "Can we do nothing about this?"
 sov_internal.26.t:0 "An Unpopular War"
 sov_internal.26.d:0 "The People blame the Civil War and their own misery on the Communists, and thus are not enthusiastic about fighting somebody who wants to change the system. They actually sympathize with the Counter-Revolutionary Revolutionaries! They feel that we have nothing to give them, and thus do not support a regime that murdered and exiled millions of their family members."
 sov_internal.26.a:0 "We cannot win without the people!"
 sov_internal.27.t:0 "The Tolls of War"
 sov_internal.27.d:0 "The Peasant Life is hard in the USSR. Lenin's policies in the First Russian Civil War, the Horrors of Collectivization, and now the New Prodrazvyorstka have caused the Soviet Peasant to live a life of poverty and hunger. However, because of our demands, the peasants have grown even more hungry, and thus more unruly. Our economists estimate that if we do not end the civil war soon, a famine may hit us within a couple of years."
 sov_internal.27.a:0 "But the Revolution?"
 sov_internal.28.t:0 "Famine on the Horizon"
 sov_internal.28.d:0 "The Civil War has continued for over a year, and the Prodrazyorskta with it. The peasants grow hungrier and hungrier, and their anger is directed at the government. They blame us for our actions, and let Revolution be damned. They comply on threat of arrest or even execution, but they clearly do not like it."
 sov_internal.28.a:0 "Their ideological correction is necessary."
 sov_internal.29.t:0 "Famine!"
 sov_internal.29.d:0 "Thanks to War Communism, we have caused yet another famine in the USSR. The peasantry are starving, with the workers not too far behind. They all blame us, the Bolsheviks for this catastrophe. They all want the civil war to end quickly, and they want Socialism to end with it. They do not even give us their crops, as they do not have the ability to work the fields. This war must end quickly!"
 sov_internal.29.a:0 "They should have just produced more."
 sov_internal.30.t:0 "New Electoral Procedures"
 sov_internal.30.d:0 "\"Elections\" in the USSR only provide the voters a single candidate from the Communist Party, ensuring our dictatorship remains intact while giving it a facade of legitimacy. However, there are some concerns that it would not be compatible with our new Factionalism Laws. They argue that electoral procedures should modified to allow for more candidates. Of course, these candidates would come exclusively from the Communist Party and would be ideologically screened beforehand, but it would allow the people a small amount of Freedom to make their opinions heard.\n\nOpponents of this idea call it a \"Populist, Bourgeouis, and Anarchist Deviation\" from the Leninist line. They argue that the Party now simply has more choices to give to the population to approve. They say that our Factionalism Law already allows Imperialist Elements to destroy our system - if we are not careful, of course - through infiltration of the Communist Party, and that elections would give them a vehicle to disseminate propaganda. As the debate winds down, it is clear that the Central Committee must vote on the new proposal..."
 sov_internal.30.a:0 "The Party must come first!"
 sov_internal.30.b:0 "The People cannot be abandoned!"
 sov_internal.31.t:0 "Georgy Malenkov Complains"
 sov_internal.31.d:0 "With Georgy Malenkov forced out of his position of General Secretary of the All-Union Communist Party, we have begun to receive complaints from him and his supporters, who are understandably bitter after the blatant military takeover of the Party. They accuse General Meretskov of being a \"Military Puppet\" and a \"vehicle of Bonapartism\". While these accusations are not entirely false, they have no place in our Country. We do not really need to do anything about this, because Malenkov and his clique does not have the ability to change the situation. On the other hand, a lot of people would appreaciate if we just sent him to Prison."
 sov_internal.31.a:0 "Leave him alone."
 sov_internal.31.b:0 "Lock him up!"
 sov_internal.32.t:0 "Communist Agitation"
 sov_internal.32.d:0 "As expected, the Communists are none too pleased with the restrictions we have recently put on them. Some have begun agitating for a loosening of restrictions, and in rare cases, the tranferance of power entirely to a Civilian Government. These rabble-rousers need to be reminded that their loyalties are to us, and against the Cryptofascists. It may also be prudent to alter the Dual Power system..."
 sov_internal.32.a:0 "They must be put in their place!"
 sov_internal.33.t:0 "The Crisis of the Proletarian Dictatorship"
 sov_internal.33.d:0 "In addition to our economic issues, a recent political scandal has threatened the very foundations of our state. In June 1932, Old Bolshevik and Bukharin supporter Martemyan Ryutin published a Platform called \"Stalin and the Crisis of the Proletarian Dictatorship\", in which Ryutin called for \"peace with the peasants\" and the forceful end of Stalin's dictatorship. He even went as far as to call for Trotsky's reinstatement in the Communist Party!\n\nRyutin's faction, \"The Union of Marxist-Leninists\" operated in secret for nearly three months, but was betrayed by an informer. The Presidum of the Central Control Commission and Politburo authorized the destruction of Ryutin's conspirators and allowed Comrade Stalin to remove the traitor from the Party. Grigory Zinoviev and Lev Kamenev, both old associates of Lenin, had been found to have read the platform, and were expelled the month after. These provocateurs were then exiled to the Urals.\n\nThis incident demonstrated two things. First, it showed that Comarde Lenin was wise to include Democratic Centralism as part of our power structure, so we have a legal means to deal with traitors like Ryutin. Second, it Comrade Stalin's precarious position clear. If Ryutin could secretly engage in factionalism, who knows how many others are also engaged in such conspiracies..."
 sov_internal.33.a:0 "We must find these spies!"
 sov_internal.34.t:0 "General Vlasov Defects!"
 sov_internal.34.d:0 "During the heavy fighting around Smolensk, Colonel General Andrei Vlasov was forced into hiding by a German encirclement. Refusing an escape by airplane, Vlasov hid in the area for ten days until a local farmer gave him up to the Germans. To our horror, Vlasov has announced his defection to the Wehrmacht, and intends to set up a \"Russian Liberation Army\" and fight against the Bolsheviks."
 sov_internal.34.a:0 "We must catch the traitor!"
 ##External
 SOV_french_summit_yes:0 "§GSuccessful Summit with the French.§!"
 SOV_german_summit_yes:0 "§GSuccessful Summit with the Germans.§!"
 SOV_french_summit_no:0 "§RFailed Summit with the French.§!"
 SOV_german_summit_no:0 "§RFailed Summit with the Germans.§!"
 sov_external.1.t:0 "Franco-Soviet Relations"
 sov_external.1.d:0 "The foreign ministries of both [This.GetNameDef] and [From.GetNameDef] have been working together to ensure friendship between our two nations. Although the ultimate goal is cooperation, we first need to ensure stable relations. The Soviet Ambassador has come to speak with us about improving our relations. Should we listen to him?"
 sov_external.1.a:0 "We accept their graciousness"
 sov_external.1.b:0 "Cooperation with Communists is unacceptable!"
 sov_external.2.t:0 "Franco-Soviet Relations Improve"
 sov_external.2.d:0 "The [From.GetAdjective] government has decided that it would be prudent to improve relations with us, seeing as we might have common enemies. We are now further on our way to establish good relations with [From.GetNameDef]."
 sov_external.2.a:0 "Very Good"
 sov_external.3.t:0 "Franco-Soviet Relations Worsen"
 sov_external.3.d:0 "The [From.GetAdjective] government has decided that cooperation with us is not a viable option. Although their official reason for declining is \"conflicting interests in Eastern Europe\", we know full well that they reject us on the basis of ideology."
 sov_external.3.a:0 "Shame"
 sov_external.4.t:0 "German-Soviet Relations"
 sov_external.4.d:0 "The foreign ministries of both [This.GetNameDef] and [From.GetNameDef] have been working together to ensure friendship between our two nations, and our armies have been continuing their cooperative stance to dodge the Treaty of Versailles. Although the ultimate goal is a mutual non-aggression pact, we first need to ensure stable relations. The Soviet Ambassador has come to speak with us about improving our relations. Should we listen to him?"
 sov_external.4.a:0 "We accept their graciousness"
 sov_external.4.b:0 "We would rather look to other avenues of cooperation"
 sov_external.5.t:0 "German-Soviet Relations Improve"
 sov_external.5.d:0 "The [From.GetAdjective] government has decided that it would be prudent to improve relations with us, seeing as we might have common enemies. We are now further on our way to establish a non-aggression pact with [From.GetNameDef]."
 sov_external.5.a:0 "Very Good"
 sov_external.6.t:0 "German-Soviet Relations Worsen"
 sov_external.6.d:0 "The [From.GetAdjective] government has decided that cooperation with us is not a viable option. Although their official reason for declining is \"conflicting interests in Eastern Europe\", we know full well that they reject us on the basis of ideology."
 sov_external.6.a:0 "Shame"
 sov_external.7.t:0 "[SOV.GetNameDef] Proposes a Treaty of Mutual Assistance"
 sov_external.7.d:0 "The [SOV.GetAdjective] foreign ministry has proposed a treaty of mutual guarantees to us. Under this treaty, both [From.GetNameDef] and [This.GetNameDef] would be required to come to the other's aid if either of us is attacked. Of course, this treaty is directed mostly towards Germany, but applies to all foreign aggressors. Should we sign this treaty?"
 sov_external.7.a:0 "Having the Soviets on our side would be a great boon to us."
 sov_external.7.b:0 "We cannot trust the Communists!"
 sov_external.8.t:0 "The Franco-Soviet Treaty of Mutual Assistance"
 sov_external.8.d:0 "Our bilateral defensive pact with [From.GetNameDef] has been approved by both parties. From now on, if any power should attack either of our nations unprovoked, they will be met by the combined forces of the USSR and [From.GetNameDef]!"
 sov_external.8.a:0 "Excellent!"
 sov_external.9.t:0 "The [From.GetAdjective] Refuse Cooperation"
 sov_external.9.d:0 "Representatives from the [From.GetNameDef] have refused cooperation with our military on the grounds that they \"do not wish to exacerbate any tensions in Europe\". Should either of our nations be attacked, they will have to deal with the aggressors on their own."
 sov_external.9.a:0 "This is a major blow to our security."
 sov_external.10.t:0 "[From.GetNameDef] Proposes a Pact of Non-Aggression"
 sov_external.10.d:0 "The Soviet Government has proposed an official non-aggression pact between [This.GetNameDef] and [From.GetNameDef]. Should we accept, we and the Soviets will be forced to refrain from attacking the other in an offensive war, and we would be bound to not assist any power declaring war on either signatory. Should we accept this treaty?"
 sov_external.10.a:0 "Whatever helps protect our borders."
 sov_external.10.b:0 "We cannot trust the Communists!"
 sov_external.11.t:0 "The Germans accept the Pact!"
 sov_external.11.d:0 "[From.GetNameDef] has accepted our proposal of non-aggression, meaning that under no circumstances can one power take actions against the other. This helps to ease some of the High Command's worries of a German attack."
 sov_external.11.a:0 "We are safe now."
 sov_external.12.t:0 "The Germans refuse the Pact!"
 sov_external.12.d:0 "German Diplomats have explained to our Ambassador that they do not wish to enter in a non-aggression pact with us. They cite our support of the Communists to be a subversive act against Germany, and that a non-aggression pact would thus be empty."
 sov_external.12.a:0 "We'll see when the Red Flag rises over Berlin..."
 sov_external.13.t:0 "The USSR offers a Non-Aggression Pact"
 sov_external.13.d:0 "Soviet diplomats have offered our government a total Non-Aggression pact between our two nations. This pact would mean that neither power can take any kind of hostile action against the other, even indirectly. Should things go wrong, it will more than likely be a great boon if this opens the door to Soviet protection against Poland and Germany. Should we sign this treaty?"
 sov_external.13.a:0 "Of course, there's no question about it"
 sov_external.13.b:0 "Protect us now so they can attack us later? We won't fall for this."
 sov_external.14.t:0 "[From.GetNameDef] accepts our Pact of Non-Aggression!"
 sov_external.14.d:0 "The Government of [From.GetNameDef] has decided to sign our proposed treaty, and enter into a pact of non-aggression with us. Under this pact, neither power can take action against the other power without a real cause to do so."
 sov_external.14.a:0 "Excellent"
 sov_external.15.t:0 "[From.GetNameDef] refuses our Pact of Non-Aggression!"
 sov_external.15.d:0 "The Government of [From.GetNameDef] has refused to sign our proposed treaty that would prevent both powers from taking action against the other. They cite \"security concerns\", but we know it is because they are imperialists who refuse to do what is best for them!"
 sov_external.15.a:0 "[From.GetLeader] will soon see the Red Army on his doorstep..."
 sov_external.16.t:0 "The USSR offers Material Support"
 sov_external.16.d:0 "Soviet Diplomats have offered our government a shipment of military equipment in exchange for a monetary payment. As we need the weapons badly, our military is eagerly lobbying us to get these arms. The Soviets have offered infantry weapons, artillery emplacements, and a contingent of fighter planes. However, our economics ministry and the prime minister's office is not very pleased about paying the USSR for weapons. What shall we do?"
 sov_external.16.a:0 "Our infantry needs weapons"
 sov_external.16.b:0 "Our divisions need artillery"
 sov_external.16.c:0 "We need air superiority!"
 sov_external.16.e:0 "We do not want the Russians' help!"
 sov_external.17.t:0 "[From.GetNameDef] asks to Purchase [This.SOV_send_cze]"
 sov_external.17.d:0 "To help in their war against the Imperialists, [From.GetNameDef] has accepted our offer of material support and has chosen to purchase [This.SOV_send_cze] from us. The deal has already been approved, and the shipments are being prepared."
 sov_external.17.a:0 "They will remember our assistance..."
 sov_external.18.t:0 "[From.GetNameDef] Declines our Offer"
 sov_external.18.d:0 "The [From.GetAdjective] government has politely declined our offer of material support. According to them, they would like to maintain budget austerity in wartime, and not to expand their military beyond feasible capabilities."
 sov_external.18.a:0 "It seems like they do not trust us"
 sov_external.19.t:0 "The USSR Offers a Joint Anti-Capitalist Treaty"
 sov_external.19.d:0 "Mussolini's government was the first western power to recognize the Soviet Union in 1924, and we have maintained positive relations due to mutual anti-capitalist sentiments. The USSR's diplomats have come to our government offering a joint statement denouncing liberal democracy, which would make our two nations better aligned in foreign policy, and thus would facilitate cooperation. Should we sign this treaty?"
 sov_external.19.a:0 "We should not let this chance go to waste!"
 sov_external.19.b:0 "It would be better not to anger the West"
 sov_external.20.t:0 "Italy signs the Joint Statement"
 sov_external.20.d:0 "The Italian Prime Minister has - with the permission of [ITA.GetLeader] signed the Italo-Soviet Joint Statement against Liberalism. This means that both Fascists and Bolsheviks agree that Anti-Capitalism is a priority, and that both ideologies should work together to oppose the First Enemy."
 sov_external.20.a:0 "Fascism in Italy is an internal matter"
 sov_external.21.t:0 "Italy declines the Joint Statement"
 sov_external.21.d:0 "[ITA.GetNameDef] has declined to sign our Joint Anti-Capitalist Statement (rather ironically) on the grounds that they would rather not engage in antagonistic posturing. However, our agents in Rome inform us that the Italian Foreign Ministry would rather take steps to align with the Western Powers, leaving cooperation with the USSR a closed door."
 sov_external.21.a:0 "We thought the Italians were reliable!"
 SOV_tech_yes:0 "§GSigned a Technology Sharing Agreement.§!"
 SOV_tech_no:0 "§RFailed to reach a Technology Sharing Agreement§.!"
 sov_external.22.t:0 "Technology Sharing with the USSR?"
 sov_external.22.d:0 "Soviet diplomats relayed a proposal from the Soviet Government relating to military technology. According to the document, before our nations begin the final struggle against liberalism, both nations must have a modern military. To this end, the Soviets offer to train our engineers in tank design, in exchange for training from our engineers, to create an optimal design. Should we accept this treaty?"
 sov_external.22.a:0 "A modern military is paramount."
 sov_external.22.b:0 "They can't teach us anything."
 sov_external.23.t:0 "[From.GetNameDef] accepts our Technology Treaty"
 sov_external.23.d:0 "In order to prepare for the Final Struggle, [From.GetLeader] has agreed to a technology treaty that will make sure that both our militaries are ready to meet the Imperialists head-on."
 sov_external.23.a:0 "The final struggle awaits!"
 sov_external.24.t:0 "[From.GetNameDef] declines to sign our Technology Treaty"
 sov_external.24.d:0 "Despite our agreements of cooperation, [From.GetNameDef] does not see technology sharing as a priority. Therefore, neither country will be exchanging scientific secrets."
 sov_external.24.a:0 "Shame"
 sov_external.25.t:0 "Technology Sharing with the USSR?"
 sov_external.25.d:0 "Soviet diplomats relayed a proposal from the Soviet Government relating to naval technology. According to the document, before our nations begin the final struggle against liberalism, both nations must have a navy capable of competeing with the United Kingdom and the United States. To this end, the Soviets offer to train our engineers in cruiser design, in exchange for training from our engineers, to create an optimal design through cooperation. Should we accept this treaty?"
 sov_external.25.a:0 "A modern military is paramount."
 sov_external.26.t:0 "The USSR offers a Non-Aggression Pact"
 sov_external.26.d:0 "In order to facilitate cooperation between our two nations, the Soviets requires an assurance that we will not take action against them. In return, the Soviets will make the same assurance in regards to our affairs. This treaty could potentially open up the doors to a full military alliance with the USSR. Should we accept?"
 sov_external.26.a:0 "We lose nothing with this deal"
 sov_external.26.b:0 "We do not want to align too closely to the Bolsheviks!"
 sov_external.27.t:0 "Italy Accepts the Non-Aggression Pact"
 sov_external.27.d:0 "One of the last steps before we can ally to face the Final Struggle, the Italians have agreed to sign a Non-Aggression pact with us. This means that unless the pact is broken, we and the Italian will remain friends!"
 sov_external.27.a:0 "Socialism in one country, [From.GetRulingIdeology] in another!"
 sov_external.28.t:0 "Italy Refuses the Non-Aggression Pact"
 sov_external.28.d:0 "[ITA.GetNameDef] has refused to sign a Non-Aggression pact with us on the grounds that we have given asylum to \"subversive\" Italian elements, obviously refering to several Italian Communists living in the USSR. They also say that they do not want to anger the West by aligning with us."
 sov_external.28.a:0 "Have they switched sides as they did in the Great War?"
 sov_external.29.t:0 "The USSR offers a Non-Aggression Pact"
 sov_external.29.d:0 "The USSR demands assurance that [This.GetNameDef] will not act against them under any circumstances. In exchange, they agree to guarantee peace with us in the same manner. The Soviets also state that this agreement would be a requirement for a full military alliance. Should we agree to this proposal?"
 sov_external.29.a:0 "These are fair terms"
 sov_external.29.b:0 "We do not want to cooperate with Bolsheviks!"
 sov_external.30.t:0 "[From.GetNameDef] Accepts the Non-Aggression Pact"
 sov_external.30.d:0 "[From.GetLeader] has agreed to sign a mutual Non-Aggression Pact with our nation. From now on, we are not allowed to take any action against them. However, they also are bound to not take any action against us."
 sov_external.30.a:0 "We move towards peace!"
 sov_external.31.t:0 "[From.GetNameDef] Refuses the Non-Aggression Pact"
 sov_external.31.d:0 "The Foreign Ministry of [From.GetNameDef] has informed us that [From.GetLeader] has refused to sanction a non-aggression pact between our two nations, as they do not wish to upset their relations with other powers."
 sov_external.31.a:0 "Shame"
 sov_external.32.t:0 "[SOV.GetNameDef] Offers Military Advisors"
 sov_external.32.d:0 "Diplomats from [SOV.GetNameDef] have come to our foreign ministries offering us an Attache of Soviet Officers and a small contingent of infantry to help train our forces. While this would be a great benefit to our military, there are some who feel like cooperation with the Bolsheviks presents a danger in itself. What shall we do?"
 sov_external.32.a:0 "Danger or no, we need these advisors"
 sov_external.32.b:0 "Bolsheviks cannot be trusted!"
 sov_external.33.t:0 "[From.GetNameDef] accepts Military Advisors"
 sov_external.33.d:0 "To secure their borders, [From.GetLeader] has agreed to a Soviet Military Attache to assist in training and doctrine formation. This way, we secure our interests and gain influence in [From.GetNameDef]."
 sov_external.33.a:0 "Our Sphere Grows!"
 sov_external.34.t:0 "[From.GetNameDef] refuses Military Advisors"
 sov_external.34.d:0 "Citing security concerns, the [From.GetAdjective] foreign ministry has refused our offer of Military Advisors. They wrote that their military is content as it is, without \"ideologically motivated\" imperialism on our part."
 sov_external.34.a:0 "The insolence!"
 sov_external.35.t:0 "The Rhodes Plan"
 sov_external.35.d:0 "A secret missive from the [From.GetNameDef] has arrived to our foreign ministry today. Upon opening it, the Foreign Ministry immediately declared that only the higest levels of the Government were allowed to read it. The message concerns a process to ensure a functioning Italo-Soviet Alliance. If we agree to this plan, the Soviets would first have to ensure access through the Turkish Straits, which would immediately lead into an alliance with Turkey. Under this agreement, if the Soviet-Turkish alliance is formed, then we would be bound to ally with the USSR. Should we take this deal?"
 sov_external.35.a:0 "Of course, unless something better comes along..."
 sov_external.35.b:0 "The plan is too risky"
 sov_external.36.t:0 "Italy Accepts the Plan"
 sov_external.36.d:0 "The Italian government has relayed a response to our secret message agreeing to participate in the Rhodes Plan. The operation has the sanction of [From.GetLeader] himself. We must now focus all our efforts on securing a Turkish Alliance."
 sov_external.36.a:0 "To Work!"
 sov_external.37.t:0 "Italy Refuses the Plan"
 sov_external.37.d:0 "While some in the Italian Foreign Ministry were excited to ally with us, it failed to pass an audience with [From.GetLeader]. Dismissing the plan as too risky, they have declined to arrange a Soviet-Turkish-Italian alliance."
 sov_external.37.b:0 "We must find other areas of cooperation."
 SOV_rhodes_yes:0 "§GItaly has agreed to the Rhodes Plan§!"
 SOV_rhodes_no:0 "§RItaly has declined the Rhodes Plan§!"
 sov_external.38.t:0 "The Treaty of Batumi"
 sov_external.38.d:0 "Our longtime friend, the USSR, has approached us with a full offer of military alliance. The Treaty - now known as the Treaty of Batumi - is a proposal that would ensure military cooperation between the USSR and [This.GetNameDef]. Under the terms of the agreement, both countries would have mutual military obligations towards the other, we would have to allow Russia free access to the Turkish Straits and give up any claim on Batumi (in Georgia). Likewise, the USSR would send us industrial assistance and give up any claim to Turkish Armenia. Should we sign this agreement?"
 sov_external.38.a:0 "It would be beneficial to do so"
 sov_external.38.b:0 "We wish to remain neutral"
 sov_external.39.t:0 "Turkey signs the Treaty!"
 sov_external.39.d:0 "[From.GetNameDef] has signed the Treaty of Batumi, giving up their claims on Georgia and giving us access through the Turkish Straits. In exchange, we have had to give up claims to Turkish Armenia and send industrial assistance to Turkey. Phase one of the Rhodes Plan is thus complete."
 sov_external.39.a:0 "On to Phase Two"
 sov_external.40.t:0 "Turkey refuses the Treaty of Batumi"
 sov_external.40.d:0 "The Turkish Government has declined our request for an alliance, citing their intent to remain neutral in world affairs. Without the ability to go through the Turkish Straits, we will not be able to properly supply Italy in case of war. Thus, the plan is shot."
 sov_external.40.a:0 "We took a risk, and it failed."
 sov_external.41.t:0 "Alliance with the USSR?"
 sov_external.41.d:0 "[SOV.GetNameDef] has managed to bring Turkey into their sphere, and they ask that we honor our end of the Rhodes Plan, and join the [From.GetFaction]. Doing so will get us easy access to Russian Resources and military equipment. However, there is some reluctance in our nation; especially among the more conservative members of [This.GetRulingParty]. Should we sign the agreement, or back out?"
 sov_external.41.a:0 "We must have access to the Russian Arsenal!"
 sov_external.41.b:0 "We cannot cooperate with Bolsheviks!"
 sov_external.42.t:0 "Italy Joins the [This.GetFaction]!"
 sov_external.42.d:0 "[From.GetNameDef] has decided to ally with us, signing an agreement that gives both nations military obligations towards the others in the faction. The alliance was announced to the people, after which there was a grand parade held in our honor. The foreign minister was joined by [From.GetLeader], and both gave speeches which were met with cheers!"
 sov_external.42.a:0 "The Plan Worked!"
 sov_external.43.t:0 "Italy Backs Down"
 sov_external.43.d:0 "The Italian Cowards have decided to back down from the Rhodes Plan, citing their wish to not aggrevate the Western Powers. This is a huge blow to the prestige of our foreign ministry, and a blow to our friendship with [From.GetNameDef]."
 sov_external.43.a:0 "Why is [From.GetLeader] the way that he is?"
 SOV_rhodes_failed:0 "Betrayed the Rhodes Plan!"

##### MR PACT stuff

 molotov_ribbentrop_pact_tt:0 "§GIf we occupy areas east to the Molotov-Ribbentrop demarcation line in Poland, we must turn them over to the Soviets. They will do likewise with our claims.§!"
 molotov_ribbentropSOV_pact_tt:0 "§GIf we occupy areas west to the Molotov-Ribbentrop demarcation line in Poland, we must turn them over to Germany. They will do likewise with our claims.§!"

 mr_pact_event.1.t:0 "Non-Aggression Pact with Germany?"
 mr_pact_event.1.d:0 "The German Foreign Minister himself has approached our government, proposing a Non-Aggression Pact with provisions that include consultation, arbitration if either party disagreed, neutrality if either went to war against a third power and no membership of a group \"which is directly or indirectly aimed at the other\"; combined with a mutual agreement regarding the territories of Eastern Europe. The treaty contains a secret protocol that splits Eastern Europe into German and Soviet spheres of influence; Poland is to be partitioned in the event of its \"political rearrangement\": the areas east of the Pisa, Narev, Vistula, and San Rivers would go to the Soviet Union, and Germany would occupy the west. Lithuania and the 'vilnus strip' would be assigned to the German sphere of influence while Estonia Latvia, Finland, Bessarabia, Northern Bukovina and the Hertsa regions (in Romania) would be all asigned to the Soviet sphere of influence.\nThis would allow us a free hand in eastern europe to invade and annex without the intervention of Germany as well as a guarantee that the Germans won't invade us anytime soon. We should make a final decision, should we sign the pact?"
 mr_pact_event.1.a:0 "We must safeguard our Western borders."
 mr_pact_event.1.b:0 "The Germans cannot be trusted!"
 
 mr_pact_event.2.t:0 "The Soviet Union signs the Non-aggression Pact!"
 mr_pact_event.2.d:0 "The Foreign Ministers of [This.GetNameDef] and [From.GetNameDef] today announced to the world that they have signed a Non-Aggression Pact between our two nations. They failed to mention, of course, the secret protocol that allots both nations spheres of influence in Eastern Europe."
 mr_pact_event.2.a:0 "Heute Deutschland! Morgen die Welt!"
 
 mr_pact_event.3.t:0 "The Soviet Union Declines the Pact!"
 mr_pact_event.3.d:0 "The Russians have decided to rebuff our efforts to get a non-aggression pact between the two nations. They cite \"A lack of trust in the German State\" as their reason for refusing; it cannot be more clear that they are an enemy of the new Germany!"
 mr_pact_event.3.a:0 "Communism will fall!"
 SOV_betrayed_MR:0 "Betrayed the Pact"

 mr_pact_event.4.t:0 "The German-Soviet Boundary and Friendship Treaty"
 mr_pact_event.4.d:0 "[GER_SOV_Fronteer_Treaty_Lublin], so to avoid any conflicts a second secret clause to the Molotov-Ribbentrop Pact that redraws the spheres of interest in Poland and the Baltic has been added[GER_SOV_Fronteer_Treaty_Lithuania][GER_SOV_Fronteer_Treaty_lit_strip]. In addition, the treaty allows for the exchange of Soviet and German nationals between the two occupied zones of Poland and also states that neither party would allow on its territory any "Polish agitation" directed at the other party."
 mr_pact_event.4.a:0 "Fair"

 ger_sov_fronteer_treaty_lublin_ours_first:0 "During the western invasion of Poland, our army took control of the Lublin Voivodeship and eastern Warsaw Voivodeship, territories that the Molotov-Ribbentrop Pact had accorded in the Soviet sphere of influence"
 ger_sov_fronteer_treaty_no_lublin:0 "During the invasion of Poland our army occupied some areas that belong to the Soviet sphere of influence, such as the eastern part of Warsaw Voivodeship"
 ger_mr_compensate_lith:0 ".\nTo compensate the Soviets for their \"loss\" in Lublin and Warsaw, the treaty's secret attachment has transferred Lithuania to the Soviet sphere of influence"
 ger_mr_compensate_lit_strip:0 " except for a small territory, the left bank of the Šešupė River which we have dubbed the \"Lithuania Strip\", that is to remain in the German sphere of influence"
 ger_mr_lith_strip:0 ". A small territory in Poland that our army occupied, the left bank of the Šešupė River which we have dubbed the \"Lithuania Strip\", will become part of the German sphere of influence"
 SOV_WHITEPEACE_POL_MR:0 "The Soviet Union has annexed the land they occupied in Eastern Poland."

 mr_pact_event.5.t:0 "The German-Soviet Boundary and Friendship Treaty"
 mr_pact_event.5.d:0 "During the western invasion of Poland, the Wehrmacht took control of the Lublin Voivodeship and eastern Warsaw Voivodeship, territories that the Molotov-Ribbentrop Pact had accorded in our sphere of influence, so to avoid any conflicts a second secret clause to the Molotov-Ribbentrop Pact that redraws the spheres of interest in Poland and the Baltic has been added. After negotiating with Ribbentrop we have reached a compromise: The Germans will keep the land they occupied in Warsaw and Lublin, but to compensate our loss, the treaty's secret attachment has transferred Lithuania to our sphere of influence. In addition, the treaty allows for the exchange of Soviet and German nationals between the two occupied zones of Poland and also states that neither party would allow on its territory any "Polish agitation" directed at the other party."
 mr_pact_event.5.a:0 "The Germans are Trustworthy!"
 mr_pact_event.6.t:0 "Germany Betrays the Pact!"
 mr_pact_event.6.d:0 "The Germans have occupied lands that we have claimed - which they agreed to - and have refused to turn over these territories to us! By going against the agreement, the Germans have broken the pact!"
 mr_pact_event.6.a:0 "They are dead to us!"

 EST_SOV_mutual_assistance_treaty_tt: "§RWe have signed the Soviet-Estonian Mutual Assistance Treaty§! £trigger_no"
 LAT_SOV_mutual_assistance_treaty_tt: "§RWe have signed the Soviet-Latvian Mutual Assistance Treaty§! £trigger_no"
 LIT_SOV_mutual_assistance_treaty_tt: "§RWe have signed the Soviet-Lithuanian Mutual Assistance Treaty§! £trigger_no"

 sov_external.50.t:0 "Honoring the Pact with the Germans"
 sov_external.50.d:0 "Land claimed by [GER.GetNameDef] has recently come into our possession. By the terms of the [GER.GetAdjective]–[SOV.GetAdjective] Boundary and Friendship Treaty (a supplementary protocol of the Molotov-Ribbentrop pact), we must turn these lands over to them. Shall we do this, or keep the land for ourselves?"
 sov_external.50.a:0 "We shall honor our words"
 sov_external.50.b:0 "We need the land more than they do!"
 sov_external.51.t:0 "The USSR turns over lands to us."
 sov_external.51.d:0 "[From.GetNameDef] has turned over some of our claims to us as per the terms of our agreement. Our foreign ministry sent a note to [From.GetLeader]'s government and thanked them for their generosity."
 sov_external.51.a:0 "The Soviets are Trustworthy!"
 sov_external.52.t:0 "The Soviet Union Betrays the Pact!"
 sov_external.52.d:0 "The Russians have occupied lands that we have claimed - which they agreed to - and have refused to turn over these territories to us! By going against the agreement, the Russians have broken the pact!"
 sov_external.52.a:0 "They are dead to us!"
 sov_external.53.t:0 "The USSR asks for Investments"
 sov_external.53.d:0 "After signing our non-aggression pact with the Soviets, we have recieved a request to either direct or allow a [This.GetAdjective] firm to invest in the USSR. This would strengthen good will between our two nations and bring us some much needed resources. Shall we accept?"
 sov_external.53.a:0 "Yes, we must"
 sov_external.53.b:0 "And if they use the capital against us?"
 sov_external.54.t:0 "[From.GetNameDef] Allows Investment!"
 sov_external.54.d:0 "The [From.GetAdjective] foreign and economic ministries have agreed to allow their native firms to invest in the USSR. Not only does this help preserve peace (seeing as we hold their interests hostage), we also strengthen our industry."
 sov_external.54.a:0 "Excellent"
 sov_external.55.t:0 "[From.GetNameDef] declines our Request for Investors"
 sov_external.55.d:0 "[From.GetNameDef], citing ideological reasons, has politely decline our request for foreign investment. While they say that they would appreciate the money, they would rather strive for autarky rather than relying on our reserves. That being said, they still encourage further military cooperation in the future."
 sov_external.55.a:0 "Suit Yourself"
 sov_external.56.t:0 "The USSR Proposes an Alliance"
 sov_external.56.d:0 "The leader of the Soviet Union, [From.GetLeader] has personally written to [This.GetLeader] proposing a treaty of mutual alliance. This way, the USSR can be our ally against our enemies. However, many conservatives in our administration are hesitant, if not opposed, to working with the Bolsheviks. What shall we do?"
 sov_external.56.a:0 "We shall accept their advances"
 sov_external.56.b:0 "We cannot work with Communists!"
 sov_external.57.t:0 "[From.GetNameDef] Joins our Faction!"
 sov_external.57.d:0 "The Germans have agreed to cooperate with our military to create a full alliance! Both nations now have mutual obligations towards each other, and we expect that while we can use Germany against the Liberal Capitalists, they will use us against their enemies."
 sov_external.57.a:0 "The New Order Awaits!"
 sov_external.58.t:0 "Germany declines our Alliance Offer"
 sov_external.58.d:0 "[From.GetLeader] has written a short response to our offer of military alliance, saying that Germany does not want to become embroiled in any other conflicts at the moment, and will thus not be joining our faction. Of course, this is a blow to the foreign ministry, but we still have friendly relations with the Germans."
 sov_external.58.a:0 "Not all is lost"
 sov_external.59.t:0 "The Kiev Agreement"
 sov_external.59.d:0 "A secret message has been delivered by an agent of the Soviet Foreign Ministry - likely a member of the NKVD as well - detailing a secret agreement between [From.GetNameDef] and [This.GetNameDef] to partition Germany in case of war. We would have dominion over all lands Southwest of the Elbe, including Austria, and the USSR would get the rest. Should we agree to this plan?"
 sov_external.59.a:0 "We must have the Ruhr!"
 sov_external.59.b:0 "We cannot work with the Bolsheviks!"
 sov_external.60.t:0 "France accepts the Kiev Agreement"
 sov_external.60.d:0 "The French government has accepted the terms of the Kiev Agreement, in which all German Land east of the Elbe will go to us, and all other land will go to [From.GetNameDef]. This agreement also comes with assurances that neither France nor the USSR will attack the other."
 sov_external.60.a:0 "The Old Alliance stands Strong!"
 fra_yes_pact:0 "§GFrance Accepts the Kiev Agreement.§!"
 fra_no_pact:0 "§RFrance Refuses the Kiev Agreement.§!"
 sov_external.61.t:0 "France refuses the Kiev Agreement"
 sov_external.61.d:0 "[From.GetNameDef] has sent us a reply, saying that they consider the partition of Germany to be an unacceptably risky venture. Thus, they will not be entering into a non-aggression pact with us. However, they still encourage us to find other avenues of cooperation."
 sov_external.61.a:0 "Shame"
 SOV_betrayed_PG:0 "Betrayed the Kiev Agreement"
 sov_external.62.t:0 "Honoring the Kiev Agreement"
 sov_external.62.d:0 "We have taken control of lands that we promised to [SOV.GetNameDef]. Under the terms of the Kiev Agreement, we must turn these lands over to Soviet Authorities. Shall we do so, or go back on our word."
 sov_external.62.a:0 "We shall honor our word"
 sov_external.62.b:0 "We do not give up our conquests!"
 sov_external.63.t:0 "[From.GetNameDef] honors the Kiev Agreement"
 sov_external.63.d:0 "The [From.GetNameDef] have occupied land promised to us under the terms of the Kiev Agreement, and have turned it over to our authority as they have pledged to."
 sov_external.63.a:0 "The [From.GetNameDef] are reliable allies!"
 sov_external.64.t:0 "[From.GetNameDef] dishonors the Kiev Agreement!"
 sov_external.64.d:0 "The [From.GetAdjective] military has occupied lands promised to usin the Kiev Agreement, yet they refuse to allow our military to occupy the land! They have gone back on their word!"
 sov_external.64.a:0 "This is outrageous, this is unfair!"
 sov_external.65.t:0 "Honoring the Kiev Agreement"
 sov_external.65.d:0 "We have taken control of lands that we promised to [FRA.GetNameDef]. Under the terms of the Kiev Agreement, we must turn these lands over to French Authorities. Shall we do so, or go back on our word."
 sov_external.65.a:0 "We shall honor our word"
 sov_external.65.b:0 "The French have enough land"
 sov_external.66.t:0 "The Molotov Telegram"
 sov_external.66.d:0 "Soviet Diplomat Vyacheslav Molotov has personally written to our government demanding that we cancel all agreements with the French immediately. He also writes that the USSR is prepared to send a large payment of cash to secure the agreement."
 sov_external.66.a:0 "That's a lot of money. We can make this deal"
 sov_external.66.b:0 "Are they out of their minds?"
 sov_external.67.t:0 "Poland agrees to the Deal"
 sov_external.67.d:0 "The Polish have responded to Molotov's letter by agreeing to the bribe. They have already sent a letter accusing the French on going back on their agreements, and cancelled them."
 sov_external.67.a:0 "Now we have a free hand!"
 sov_external.68.t:0 "Poland refuses the Deal"
 sov_external.68.d:0 "The Polish have responded to Molotov's letter with fury, and have accused us of trying to enable an invasion. They have already written to the French, who are bound to cancel all our agreements with them."
 sov_external.68.a:0 "This was too risky; we never should have tried it"
 sov_external.69.t:0 "Poland Cancels Pacts?"
 sov_external.69.d:0 "The Polish Government has written to us canceling defensive and non-aggression pacts with us. They write that they \"are no longer content to be a French puppet\" and other such phrases. We have no idea why they could have done this."
 sov_external.69.a:0 "Perhaps foul play was involved..."
 sov_external.70.t:0 "The Molotov Telegram"
 sov_external.70.d:0 "The Polish Government has written to us informing us that the Soviets have just attempted to bribe them into leaving our sphere of influence, giving Moscow a free hand in Poland. After furious back-and-forth arguments with the Soviet Ambassador, we have cancelled all pacts with [SOV.GetNameDef]."
 sov_external.70.a:0 "We knew we couldn't trust them!"
 sov_external.71.t:0 "The USSR Proposes an Alliance"
 sov_external.71.d:0 "The leader of the Soviet Union, [From.GetLeader] has personally written to [This.GetLeader] proposing a treaty of mutual alliance. This way, the USSR can be our ally against our enemies. However, many conservatives in our administration are hesitant, if not opposed, to working with the Bolsheviks. What shall we do?"
 sov_external.71.a:0 "We shall accept their advances"
 sov_external.71.b:0 "We cannot work with Communists!"
 sov_external.72.t:0 "[From.GetNameDef] Joins our Faction!"
 sov_external.72.d:0 "The French have agreed to cooperate with our military to create a full alliance! Both nations now have mutual obligations towards each other, and we expect that while we can use France against the Liberal Capitalists, they will use us against their enemies."
 sov_external.72.a:0 "The Golden Century Awaits!"
 sov_external.73.t:0 "France declines our Alliance Offer"
 sov_external.73.d:0 "[From.GetLeader] has written a short response to our offer of military alliance, saying that France does not want to become embroiled in any other conflicts at the moment, and will thus not be joining our faction. Of course, this is a blow to the foreign ministry, but we still have friendly relations with the French."
 sov_external.73.a:0 "Not all is lost"
 sov_external.74.t:0 "The Yalta Naval Treaty"
 sov_external.74.d:0 "The USSR has asked us to agree to a naval treaty with them, which would limit their naval power but increase avenue for Anglo-Soviet cooperation. We lose nothing in this deal, but the foreign office wonders what the USSR actually wants from us..."
 sov_external.74.a:0 "This deal is acceptable"
 sov_external.74.b:0 "We do not trust the Russians"
 sov_external.75.t:0 "The United Kingdom Accepts the Naval Treaty"
 sov_external.75.d:0 "[From.GetNameDef] has agreed to entertain further requests of cooperation in exchange for limits placed on the Soviet Navy. We can now make further demands of them."
 sov_external.75.a:0 "Excellent"
 sov_external.76.t:0 "England refuses the Yalta Naval Treaty"
 sov_external.76.d:0 "It is known that the USSR has nothing to gain and [ENG.GetNameDef] has nothing to lose by signing the Yalta Naval Treaty. Howver, the British have bluntly admitted that they do not trust us and do not gain anything by cooperating with us."
 sov_external.76.a:0 "That is a shame"
 sov_external.77.t:0 "Anglo-Soviet Defensive Agreement"
 sov_external.77.d:0 "Diplomats from [From.GetNameDef] have told us that the best way to defend against the Germans is to establish a mutual defense treaty between [This.GetNameDef] and [From.GetNameDef]. They have already brought an agreement that would certify that if either nation is attacked, the other will come to the former's aid. Should we sign this treaty, or is it another Bolshevik trick?"
 sov_external.77.a:0 "This is acceptable"
 sov_external.77.b:0 "Why would we defend the Communists?"
 sov_external.78.t:0 "[From.GetNameDef] Accepts the Pact!"
 sov_external.78.d:0 "In the interests of containing Germany, we have managed to get the British to sign a defensive agreement with us. Now, two of the major powers will fight together if the other is attacked."
 sov_external.78.a:0 "Fascism will fall in Europe!"
 sov_external.79.t:0 "Britain Refuses the Defensive Pact"
 sov_external.79.d:0 "It is clear that [From.GetNameDef] does not trust our good intentions. Instead of working with us to remove [GER.GetLeader] from his place, they are focusing on their own interests!"
 sov_external.79.a:0 "They probably can afford to not work with us."
 SOV_yalta_yes:0 "§GThe Yalta Treaty has been Signed§!"
 SOV_yalta_no:0 "§RThe Yalta Treaty has been Refused§!"
 sov_external.80.t:0 "Alliance with the Soviet Union?"
 sov_external.80.d:0 "The leader of the Soviet Union, [From.GetLeader] has personally written to [This.GetLeader] proposing a treaty of mutual alliance. This way, the USSR can help us defend from enemy powers. However, many conservatives in our administration are hesitant, if not opposed, to working with the Bolsheviks. What shall we do?"
 sov_external.80.a:0 "We shall accept their advances"
 sov_external.80.b:0 "We cannot work with Communists!"
 sov_external.81.t:0 "[FRA.GetNameDef] Accepts the Treaty of Vitebsk"
 sov_external.81.d:0 "The [FRA.GetAdjective] government has agreed to cooperate with our military to create a full alliance! Both nations now have mutual obligations towards each other, and we expect that while we can use France against the Nationalists and Fascists, they will use us against their enemies."
 sov_external.81.a:0 "Excellent!"
 sov_external.82.t:0 "France declines our Alliance Offer"
 sov_external.82.d:0 "[FRA.GetLeader] has written a short response to our offer of military alliance, saying that [FRA.GetNameDef] does not want to become embroiled in any other conflicts at the moment, and will thus not be joining our faction. Of course, this is a blow to the foreign ministry, but we still have friendly relations with the [FRA.GetAdjective] government."
 sov_external.82.a:0 "Not all is lost"
 SOV_mutual_army:0 "Army"
 SOV_mutual_air:0 "Air Force"
 sov_external.83.t:0 "The USSR Proposes Mutual Military Training Programs"
 sov_external.83.d:0 "Diplomats representing the Soviet Military have proposed to help us improve our [SOV.MutualProgram] to better fight our mutual enemies. Of course, some are concerned with having Soviet Influence in our ranks. Should we accept this treaty?
 sov_external.83.a:0 "This will not cause too much harm."
 sov_external.83.b:0 "We cannot trust the Soviets!"
 sov_external.84.t:0 "[From.GetNameDef] Accepts our [SOV.MutualProgram] Training Program!"
 sov_external.84.d:0 "The government of [From.GetNameDef] has accepted our offer to establish a mutual training program to improve both our nations' militaries. Instructors will be exchanged, and a few hundred soldiers will be shipped over to help demonstrate tactics."
 sov_external.84.a:0 "Excellent!"
 sov_external.85.t:0 "[From.GetNameDef] Refuses our [SOV.MutualProgram] Training Program!"
 sov_external.85.d:0 "The military of [From.GetNameDef] refuses to work with ours, citing national security issues. It is clear however, that they do not want our ideology to spread to their soldiers."
 sov_external.85.a:0 "How could they not trust us?"
 sov_external.86.t:0 "The Italo-Soviet Pact"
 sov_external.86.d:0 "Fascist Italy was the first Western nation to recognize the USSR in February 1924. Our two nations have had strong relations ever since. The Soviet Foreign Ministry, supported by the Red Army, has proposed a pact that would allow greater trade between our nations, and possibly lead to military cooperation. We are interested in Soviet Resources, while the Soviets are interested in our industries. While it might seem wrong for a Fascist Country to be friends with a Bolshevist Country, these are internal matters and should not affect international relations. Should we sign this pact?"
 sov_external.86.a:0 "This pact is vital to our interests"
 sov_external.86.b:0 "We cannot let the Communists get too close"
 sov_external.87.t:0 "Italy signs the Italo-Soviet Pact"
 sov_external.87.d:0 "[From.GetnameDef] has signed the Pact of Friendship, Neutrality, and Nonaggression between Italy and the Soviet Union. Therefore, our trade relations have improved, and we have opened the door for future military cooperation."
 sov_external.87.a:0 "We will build on our historical friendship"
 sov_external.88.t:0 "Italy refuses the Italo-Soviet Pact"
 sov_external.88.d:0 "The Italian Government has refuse to sign the Italo-Soviet Pact, on the grounds that such a pact would hurt internal stability. Support for fascism, they say, may erode if they are to work with a Communist Nation. They also say that something similar may happen in our nation if we are to sign the pact."
 sov_external.88.a:0 "I suppose it is for the best"
 sov_external.89.t:0 "Proposal from the Soviet Union"
 sov_external.89.d:0 "[From.GetAdjective] Diplomats have approached us with the intention of trying to work out a treaty. The diplomat, calling himself Boris Rybkin, threatens to invade Finland if we are to work against them with foreign powers, but if Finland were to fight with any foreign powers, they offer full assistance. In exchange, we simply have to give them \"positive guarantees\" and allow them access to islands in the Gulf of Finland. Nobody in the negotiating team or in the government as a whole trusts Rybkin at all, and would rather maintain an anti-Soviet position. What shall we answer?"
 sov_external.89.a:0 "We accept guarantees on our independence"
 sov_external.89.b:0 "We would rather remain neutral"
 sov_external.90.t:0 "Finland agrees to the treaty"
 sov_external.90.d:0 "The Finns have agreed to let us provide for their defense. They are now clearly in our sphere of influence, and foreign powers are far less likely to come to their aid should we make further demands of them..."
 sov_external.90.a:0 "All according to plan"
 sov_external.91.t:0 "Finland refuses our help"
 sov_external.91.d:0 "The Finns have refused to allow us to guarantee their independence. They claim that they would rather maintain a policy of neutrality than align towards any foreign powers. This has put a wrench in our plans to retake Tsarist territories."
 sov_external.91.a:0 "Damn!"
 sov_external.92.t:0 "Ultimatum from the USSR"
 sov_external.92.d:0 "The Soviet Government has demanded a block of land stretching about 30 km from the Finnish-Soviet border by Leningrad. They also demand the destruction of all fortifications in the general area of the new border. They also demand the Hanko peninsula to be leased to them for 30 years, with the permission to establish a military base. In exchange they offer lands in Karelia. After proposals and counterproposals, we must make a final decision. Shall we take this offer?"
 sov_external.92.a:0 "We have no choice but to accept"
 sov_external.92.b:0 "Let us continue negotiations later"
 sov_external.93.t:0 "Finland Accepts our Demands"
 sov_external.93.d:0 "The Finnish Government has accepted our demands for territory, and have withdrawn their forces from Southern Viipuri and Hanko. Our soldiers are now free to occupy the area and establish an administration."
 sov_external.93.a:0 "Some of our goals are achieved, so far"
 sov_external.94.t:0 "The Finnish Refuse our Demands"
 sov_external.94.d:0 "Finnish Diplomats have returned to Finland on the assumption that we can continue negotiations later. We take their withdrawal as a total refusal! We should now activate our invasion plan."
 sov_external.94.a:0 "Prepare for war!"
 sov_external.95.t:0 "Ultimatum from Moscow!"
 sov_external.95.d:0 "The USSR has given us a note demanding that the Romanian mlitary and civil service withdraw from Bucovina and Bessarabia, and allow Soviet Troops to occupy the region. If we do not, the Soviet Foreign Ministry threatens war. What shall we do?"
 sov_external.95.a:0 "We have no choice. Evacuate our personnel."
 sov_external.95.b:0 "We stand and fight!"
 sov_external.96.t:0 "Romania Cedes Bessarabia"
 sov_external.96.d:0 "The Romanian government has capitulated to our demands, and have ordered the retreat of all military and administrative personnel from Bessarabia and Bucovina. We are now free to occupy the region."
 sov_external.96.a:0 "Another Imperial Territory restored!"
 sov_external.97.t:0 "Romania Stands Firm"
 sov_external.97.d:0 "The Romanian Militarist Bourgeois Clique has denied our demands for Bessarabia and Bucovina. Our soldiers in the area have been put on alert, and the Romanian government now expects war!"
 sov_external.97.a:0 "Comrade Stalin said \"to war\", so, to war!"
 sov_external.98.a:0 "We have no choice but to agree"
 sov_external.98.b:0 "[This.Adjective]s do not surrender!"
 sov_external.101.t:0 "Ultimatum from the Soviet Union"
 sov_external.101.d:0 "The USSR has issued an ultimatum: either we disband our current government and allow a Communist takeover, or the Soviets will use their garrisons to occupy us by force. Should we accept their demands, it is likely that the new government will vote to join the USSR, thus robbing us of our independence. Which option shall we take?"
 sov_external.l01.a:0 "Surrender is the only peaceful option"
 sov_external.101.b:0 "Give us liberty or give us death!"
 sov_external.102.t:0 "[From.GetNameDef] chooses to join the USSR"
 sov_external.102.d:0 "The Government of [From.GetNameDef] has decided to disband and allow Communist governments - backed by us - to establish order. These governments quickly voted in favor of joining the USSR as Soviet Republics. Our military has already occupied the capital and order should soon be restored."
 sov_external.102.a:0 "Territory returned without firing a shot!"
 sov_external.103.t:0 "[From.GetNameDef] Repudates our Ultimatum"
 sov_external.103.d:0 "The Militarist Government of [From.GetNameDef] has decided to refuse our ultimatum, stating that they are ready for anything that we can bring them! Although we are clearly stronger, it is a shame that Russian lives will have to be wasted for this."
 sov_external.103.a:0 "They will recognize their foolishness!"
 SOV_historical_friendship:0 "Historical Friendship"
 SOV_historical_animosity:0 "Historical Animosity"
 sov_external.107.t:0 "USSR Offers Non-Aggression Pact"
 sov_external.107.d:0 "Although there are a few in our leadership who doubt the effectiveness with cooperation with the Communists, it is obvious to see that our mutual enemies would benefit if we remain divided. Therefore, most of our government ministers are very supportive of this agreement. What shall we do?"
 sov_external.107.a:0 "We sign it."
 sov_external.107.b:0 "We refuse!"
 sov_external.108.t:0 "[From.GetNameDef] Signs the Pact!"
 sov_external.108.d:0 "The [From.GetAdjective] Government has signed our proposal for a non-aggression pact. Not only will we be defended from attack, we have opened up a new avenue for cooperation."
 sov_external.108.a:0 "Excellent."
 sov_external.109.t:0 "[From.GetNameDef] Refuses the Pact."
 sov_external.109.d:0 "The [From.GetAdjective] Government has refused our proposal for a non-aggression pact on the grounds that they do not feel it is safe to do so. While we had hoped for an easier time fighting our mutual enemies, it seems that we will remain divided."
 sov_external.109.a:0 "Shame."
 sov_external.110.t:0 "[From.GetNameDef] Asks for Radar Assistance"
 sov_external.110.d:0 "The Government of the USSR has asked us for radar station parts to help their emerging radar program. Such a move would help our ally, but there are concerns that this would help strengthen a potential enemy. What shall we do?"
 sov_external.110.a:0 "We must help our allies!"
 sov_external.110.b:0 "It is too dangerous."
 sov_external.111.t:0 "[From.GetNameDef] Sends Radar Parts"
 sov_external.111.d:0 "The [From.GetAdjective] government has allowed us to import radar parts on a daily basis from them. Doing so will help our anti-aircraft efforts and our technology. Once our scientists reverse engineer the principles of their radar systems, we should be on our way to being a radar superpower!"
 sov_external.111.a:0 "We will be able to see the enemy planes anywhere in the country!"
 sov_external.112.t:0 "Request for Radars Refused"
 sov_external.112.d:0 "The English Government has refused to allow us to use their radar parts, on the grounds that they have few. However, it is clear that a general anti-Soviet attitude still prevents them from helping their allies."
 sov_external.112.a:0 "Shame!"
 sov_external.113.t:0 "Soviets Ask for Fighter Licenses"
 sov_external.113.d:0 "The USSR has asked us to allow us to license our fighter designs to them. Doing so may give them an edge in the long run, but the advantage in the short run may be more important. Should we agree to this?"
 sov_external.113.a:0 "We must help our allies!"
 sov_external.113.b:0 "The risk is too great."
 sov_external.114.t:0 "England Allows Fighter License"
 sov_external.114.d:0 "The British Government has chosen to allow us access to their fighter designs. We will now be allowed to produce them under license."
 sov_external.114.a:0 "British Fighters will help our war effort!"
 sov_external.115.t:0 "London Refuses License Agreement"
 sov_external.115.d:0 "The British Government has chosen not to allow us access to their superior fighter designs. We will have to make do with our own."
 sov_external.115.a:0 "Alright then, keep your secrets."
 sov_external.116.t:0 "Soviets Ask for Fighter Planes"
 sov_external.116.d:0 "The USSR has asked us to send fighter planes them. Doing so may give them an edge in the long run, but the advantage in the short run may be more important. Should we agree to this?"
 sov_external.116.a:0 "We must help our allies!"
 sov_external.116.b:0 "The cost is too great."
 sov_external.117.t:0 "England Sends Fighter Planes"
 sov_external.117.d:0 "The British Government has chosen to send us 350 fighter planes. We will be able to use them immediately."
 sov_external.117.a:0 "British Fighters will help our war effort!"
 sov_external.118.t:0 "London Refuses Fighter Lending"
 sov_external.118.d:0 "The British Government has chosen not to allow us access to their superior fighter designs. We will have to make do with our own."
 sov_external.118.a:0 "Alright then, keep your secrets."
 sov_external.119.t:0 "[From.GetNameDef] Offers Mutual Military Access"
 sov_external.119.d:0 "The Foreign Ministry of [From.GetNameDef] has presented an offer of mutual access to our government. Under the agreement, both nations' armies would be allowed to use the other's railways and traverse through the other's territory. This would make it easier for us to fight our enemies together. Shall we agree?"
 sov_external.119.a:0 "Naturally."
 sov_external.119.b:0 "We cannot risk potentially hostile powers in our territory!"
 sov_external.120.t:0 "[From.GetNameDef] Agrees to Mutual Military Access"
 sov_external.120.d:0 "The Government of [From.GetNameDef] has agreed to allow our troops access to their land, in exchange for our land being open to theirs. We can now move closer to another front, through which we can win once and for all!"
 sov_external.120.a:0 "To Final Victory!"
 sov_external.121.t:0 "[From.GetNameDef] Refuses Mutual Military Access"
 sov_external.121.d:0 "The Government of [From.GetNameDef] has refused Military Coordination with our commanders. Therefore, we will not be able to use their territory to fight the enemy."
 sov_external.121.a:0 "It was a good idea."
 sov_external.122.t:0 "[From.GetNameDef] Offers Research Agreement"
 sov_external.122.d:0 "[From.GetNameDef] has excellent tanks, and we have decent industrial technology. We have thus been offered a research swapping agreement. Our industrial technology for [From.GetAdjective] tank designs. Should we accept?"
 sov_external.122.a:0 "Better tanks would always be appreciated."
 sov_external.122.b:0 "We do not need this."
 sov_external.123.t:0 "[From.GetNameDef] Agrees to Technology Sharing Agreement."
 sov_external.123.d:0 "[From.GetAdjective] Industrial Experts are already on their way to Russia, whereas our tank designers are already on their way to Germany. With mutual technology agreements, we are sure to win this war!"
 sov_external.123.a:0 "Excellent!"
 sov_external.124.t:0 "[From.GetAdjective] Refusal"
 sov_external.124.d:0 "The Government of [From.GetNameDef] has refused our technology sharing agreement on the grounds that they do not give away \"Military Secrets\". We will have to develop our technology on our own."
 sov_external.124.a:0 "Shame."
 sov_external.125.t:0 "Soviets Request Industrial Grants"
 sov_external.125.d:0 "The Russians have come to us to ask for French Investment in the Russian Arms Industry. They say that with our expertise, Russia could better fight our mutual enemy. In return, we would be paid. Should we accept this deal?"
 sov_external.125.a:0 "This seems like a good idea."
 sov_external.125.b:0 "We cannot spare any industrial equipment."
 sov_external.126.t:0 "[From.GetNameDef] Sends Industrial Experts"
 sov_external.126.d:0 "The [From.GetAdjective] Government is sending us enough parts to build one new factory, but with French parts, it will be efficient and capable!."
 sov_external.126.a:0 "Excellent!"
 sov_external.127.t:0 "[From.GetNameDef] Refuses Industrial Grants."
 sov_external.127.d:0 "The [From.GetNameDef] has declined our offer to pay for industrial equipment on the grounds that they have none to spare. It is clear that they simply wish to weaken us!"
 sov_external.127.a:0 "They will pay for their treachery."
 sov_external.128.t:0 "Soviets Ask for Heavy Tank Licenses"
 sov_external.128.d:0 "The USSR has asked us to allow us to license our heavy tank designs to them. Doing so may give them an edge in the long run, but the advantage in the short run may be more important. Should we agree to this?"
 sov_external.128.a:0 "We must help our allies!"
 sov_external.128.b:0 "The risk is too great."
 sov_external.129.t:0 "France Allows Heavy Tank License"
 sov_external.129.d:0 "The French Government has chosen to allow us access to their heavy tank designs. We will now be allowed to produce them under license."
 sov_external.129.a:0 "French Heavy Tanks will help our war effort!"
 sov_external.130.t:0 "Paris Refuses License Agreement"
 sov_external.130.d:0 "The French Government has chosen not to allow us access to their superior heavy tank designs. We will have to make do with our own."
 sov_external.130.a:0 "Alright then, keep your secrets."
 sov_external.131.t:0 "Soviets Ask for Heavy Tank Planes"
 sov_external.131.d:0 "The USSR has asked us to send heavy tank planes them. Doing so may give them an edge in the long run, but the advantage in the short run may be more important. Should we agree to this?"
 sov_external.131.a:0 "We must help our allies!"
 sov_external.131.b:0 "The cost is too great."
 sov_external.132.t:0 "France Sends Heavy Tank Planes"
 sov_external.132.d:0 "The French Government has chosen to send us 350 heavy tank planes. We will be able to use them immediately."
 sov_external.132.a:0 "French Heavy Tanks will help our war effort!"
 sov_external.133.t:0 "Paris Refuses Heavy Tank Lending"
 sov_external.133.d:0 "The French Government has chosen not to allow us access to their superior heavy tank designs. We will have to make do with our own."
 sov_external.133.a:0 "Alright then, keep your secrets."
 sov_external.134.t:0 "Soviets Propose Mutual Docking Rights Agreement"
 sov_external.134.d:0 "The Foreign Ministry and the Navy of [From.GetNameDef] have proposed that we sign a treaty that would allow our navies the right to dock in the other's ports. This would allow the USSR to assist us in securing our waters, and vice versa. Should we sign this agreement?"
 sov_external.134.a:0 "It seems we have nothing to lose."
 sov_external.134.b:0 "We would rather not."
 sov_external.135.t:0 "[From.GetNameDef] Allows Docking Rights!"
 sov_external.135.d:0 "The [From.GetAdjective] Foreign Ministry has allowed us to use their ports for our navy. This extends our reach beyond our waters, and allows us to better project our power."
 sov_external.135.a:0 "Victorious will the Red Navy be!"
 sov_external.136.t:0 "Docking Rights Refused!"
 sov_external.136.d:0 "[From.GetNameDef] has refused to allow us to use their ports to dock our navies in. They say that their ports are already over capacity, and cannot spare the resources."
 sov_external.136.a:0 "This benefits nobody."
 sov_external.137.t:0 "The Treaty of Sakhalin"
 sov_external.137.d:0 "The Soviet Government has approached us with a proposal in which we would return Southern Sakhalin to them, but they would guarantee us resource rights in the region for 20 years, and would invade our enemies in China. However, some in our government demand that we refuse, as the USSR is not the same state as the Russian Empire, thus they have no claim to the region. Should we accept, or listen to these ministers?"
 sov_external.137.a:0 "We just care about the oil."
 sov_external.137.b:0 "We will never surrender territory!"
 sov_external.138.t:0 "Japan Signs the Treaty of Sakhalin"
 sov_external.138.d:0 "Japanese and Soviet Dignitaries put their names on the Treaty of Sakhalin, meaning it has gone into immediate effect. Our military and bureaucracy are busy relieving Japanese administrators, and we have pulled our advisors out of China. Once invasion plans are finalized, we can attack!"
 sov_external.138.a:0 "Success in the East!"
 sov_external.139.t:0 "Japan Rebuffs the Treaty of Sakhalin"
 sov_external.139.d:0 "The Japanese have refused to sign the Treaty of Sakhalin. They will keep Sakhalin, but we will not mobilize against the Chinese."
 sov_external.139.a:0 "We still have advisors in China."
 popfront_tt:0 "§YWe will instruct Communist parties to work with other Socialists and Radicals against Fascism.§!\n"
 devfront_tt:0 "§YWe will instruct Communist parties to work with Nationalists against Liberalism.§!\n"
 sov_external.140.t:0 "Communists Announce the Popular Front"
 sov_external.140.d:0 "Our Communist Party has announced that they have decided (entirely without Moscow's help) to align themselves with the moderate socialist and radicalist parties in the fight against the far-right."
 sov_external.140.a:0 "Interesting."
 sov_external.141.t:0 "Communists Announce Anti-Capitalist Front"
 sov_external.141.d:0 "Our Communist Party has announced that they have decided (entirely ithout Moscow's help) to align themselves with the nationalist parties in the fight against liberalism."
 sov_external.141.a:0 "Interesting."
 sov_external.142.t:0 "Bolshevik Parties break with Moscow"
 sov_external.142.d:0 "Our Communist Party has announced that they will no longer take orders from Stalin in Moscow. They cite Stalin's plan to unite Communists and Fascists against democrats, saying that Stalin does not recognizd the greater threat. Of course, some die-hards are complying with the Comintern's orders, leaving their respective Communist parties."
 sov_external.142.a:0 "Interesting."
 sov_external.143.t:0 "Communist Agents in [From.GetNameDef] Break with the Comintern"
 sov_external.143.d:0 "[From.GetAdjective] Communists loyal to the Comintern line have left after we demanded they work with the nationalists. They say that we do not see the real threat, and accuse us of revisionism."
 sov_external.143.a:0 "Damn!"
 sov_external.144.t:0 "USSR Ends Support for Local Communists"
 sov_external.144.d:0 "The USSR has let us know that they are no longer supporting communist parties in our country or in exile from it. They claim to trust us and have given this to us as a sign of good will."
 sov_external.144.a:0 "At least we have more stability."
 sov_external.145.t:0 "The Death of Trotsky"
 sov_external.145.d:0 "Leon Trotsky, one of the last dissidents remaining, has been killed today in his Mexican home. One of our agents, a Spanish Communist named Jaime Ramón Mercader del Río led a team into Trotsky's house, where Mercader hit Trotsky with a blow to the head, using an Ice Axe. Trotsky did not die, and asked hsi guards to spare Mercader. Trotsky died the next day from his injuries. Mercader has been arrested, and will likely sentanced to a long stay in prison."
 sov_external.145.a:0 "The threat has been eliminated."
 sov_external.146.t:0 "USSR Demands Joint Strait Authority"
 sov_external.146.d:0 "[From.GetNameDef] has demanded that we let Soviet shipping freely travel through the Bosphorous and Dardanelles straits. They claim that our control over our sovereign territory is harmful to other Black Sea Nations, and that the situation must be revisited. To that end, they demand special treatment towards their ships. They also wish to bring troops to enforce joint administration of the straits. If we allow it, these forces will be used to take over [This.GetNameDef]. Should we accept this demand?"
 sov_external.146.a:0 "We have no other choice."
 sov_external.146.b:0 "We must ask other nations to defend us."
 sov_external.146.c:0 "We bow to no one!"
 sov_external.147.t:0 "Turkey Allows Joint Strait Administration"
 sov_external.147.d:0 "The Turkish have agreed to allow our shipping free travel through the Bosphorous and Dardanelles straits. They have also allowed our soldiers to enter their borders to begin joint administration of the Straits."
 sov_external.147.a:0 "It is good to be a power!"
 sov_external.148.t:0 "Turkey Refuses our Demands"
 sov_external.148.d:0 "The Government of [From.GetNameDef] has entirely refused to alter the situations on the straits. In what is surely a propaganda show for their people, the Turkish government thinks that we will not declare war on them. We could crush them easily. However, if we do declare war, it will surely be unpopular with our people. But if we back down, we will look weak. Should we go to war?"
 sov_external.148.a:0 "War it is!"
 sov_external.148.b:0 "We cannot risk a war just yet."
 sov_external.149.t:0 "Turkey Asks for Strategic Partnership"
 sov_external.149.d:0 "The Soviet Union has just made demands on Turkey to allow them to occupy the Turkish Straits. The Turkish cannot defend their territory on their own, so they have come to us for defense. As we are a Great Power, we have interest in stemming Soviet ambitions, so a Strategic Partnership with Turkey would help us in this regard."
 sov_external.149.a:0 "Turkey shall have our support."
 sov_external.149.b:0 "We cannot risk war at this time."
 sov_external.150.t:0 "[From.GetNameDef] Promises Aid"
 sov_external.150.d:0 "The [From.GetAdjective] Government has promised to defend our state in case of Soviet Invasion. Although we have had to abandon neutrality, it is clear that alliances are necessary for Turkish Independence."
 sov_external.150.a:0 "Turkey shall prevail!"
 SOV_unpopular_war:0 "Unpopular War"
 sov_external.151.t:0 "Turkey and [From.From.GetNameDef] Oppose our Demands"
 sov_external.151.d:0 "The Turkish Government has managed to get backing from the [From.From.GetAdjective] government. If we invade Turkey now, we could risk another full scale war, which is sure to be unpopular. However, if we back down, we face internal humiliation."
 sov_external.151.a:0 "There is no war we cannot win!"
 sov_external.151.b:0 "We cannot act now."
 sov_external.152.t:0 "We Remain Alone"
 sov_external.152.d:0 "Our cries for help have been refused, and the enemy is preparing an attack. The only thing that can stop a war is if we back down and accept Soviet infringements on our nation. But this is unacceptable for Turkey! The only honarable defeat is on the battlefield! But we do not want to waste Turkish Lives in a futile conflict. What shall we do?"
 sov_external.152.a:0 "We must surrender to save lives."
 sov_external.152.b:0 "We will fight to the last Turk!"
 sov_external.153.t:0 "USSR Demands our Territory"
 sov_external.153.d:0 "An urgent note reached our Foreign Minister today, demanding that we turn over Trabzon and Erzurum to [SOV.GetNameDef] or face war! The Soviets claim that we illegally occupy Georgian and Armenian lands, and would like to see them \"returned\" to the Georgian and Armenian SSRs. How shall we respond?"
 sov_external.153.a:0 "We cannot risk such a war."
 sov_external.153.b:0 "We will delay and reach out for allies"
 sov_external.153.c:0 "Refuse, Trabzon is Turkish!"
 sov_external.154.t:0 "Turkey Turns Tail"
 sov_external.154.d:0 "The Turkish Government have evactuated their military from Trabzon and Erzurum, and their civil servants are awaiting our approach. Our military has already begun occupying the region, to the detriment of the Turkish population, some of whom attempted to flee westwards."
 sov_external.154.a:0 "We shall soon have total Black Sea hegemony!"
 sov_external.155.t:0 "Turkey Stands Firm"
 sov_external.155.d:0 "The Turkish Government has refused to leave our rightful territories, even on threat of war. This was not expected. Our population will hate us even more if we actually start a war, but it should be a quick war we can win easily. What shall we do?"
 sov_external.155.a:0 "We shall take our territories back!"
 sov_external.155.b:0 "Well they're not actually our historical land, so we can leave it for now."
 sov_external.156.t:0 "Turkey Asks for Strategic Partnership"
 sov_external.156.d:0 "The Soviet Union has just made demands on Turkey to allow them to occupy parts of Eastern Anatolia. The Turkish cannot defend their territory on their own, so they have come to us for defense. As we are a Great Power, we have interest in stemming Soviet ambitions, so a Strategic Partnership with Turkey would help us in this regard."
 sov_external.156.a:0 "Turkey's Territory will remain intact."
 sov_external.156.b:0 "We cannot spend resources on Turkey."
 sov_external.157.t:0 "[From.GetNameDef] Promises Aid"
 sov_external.157.d:0 "The [From.GetAdjective] Government has promised to defend our state in case of Soviet Invasion. Although we have had to abandon neutrality, it is clear that alliances are necessary for Turkish Independence."
 sov_external.157.a:0 "Turkey shall prevail!"
 sov_external.158.t:0 "Turkey and [From.From.GetNameDef] Oppose our Demands"
 sov_external.158.d:0 "The Turkish Government has managed to get backing from the [From.From.GetAdjective] government. If we invade Turkey now, we could risk another full scale war, which is sure to be unpopular. However, if we back down, we face internal humiliation."
 sov_external.158.a:0 "There is no war we cannot win!"
 sov_external.158.b:0 "We cannot act now."
 sov_external.159.t:0 "We Remain Alone"
 sov_external.159.d:0 "Our cries for help have been refused, and the enemy is preparing an attack. The only thing that can stop a war is if we back down and accept Soviet infringements on our nation. But this is unacceptable for Turkey! The only honarable defeat is on the battlefield! But we do not want to waste Turkish Lives in a futile conflict. What shall we do?"
 sov_external.159.a:0 "We must surrender to save lives."
 sov_external.159.b:0 "We will fight to the last Turk!"
 sov_external.160.t:0 "Soviets Consolidate Power"
 sov_external.160.d:0 "The USSR has undertaken some consolidation efforts to ensure that we do not have ambtions of our own. They purged some important dissidents and sent more Soviet \"liasons\" to oversee our restructuring."
 sov_external.160.a:0 "We had no greater ambitions anyhow."
 sov_news.5.t:0 "The Soviet Union invades Poland"
 sov_news.5.desc:0 "Following an informal declaration of war, reports have indicated that Soviet troops are rapidly crossing the border into Poland. In a statement given to the press, Soviet Foreign Minister Vyacheslav Molotov said that “The Polish Government has disintegrated, and its Government has ceased to exist. Therefore, all treaties made with Poland have become void.” The invasion has been conducted under the pretext of protecting Ukrainian and Belarusian minorities in the area, both from Poland and from Germany.\nIn some places, advancing Red Army soldiers have been hailed as liberators, but partisan activities and resistance are already being reported. The world looks on in horror as the great powers’ hunger swallows up yet another European nation."
 sov_news.5.a:0 "Unite, Russian brothers!"
 sov_news.5.b:0 "All according to plan."
 sov_news.5.c:0 "Treachery and disaster!"
 sov_news.5.d:0 "Shocking!"
 mr_pact_event.7.t:0 "Promises to Germany"
 mr_pact_event.7.d:0 "Today the German ambassador to Moscow, Werner von der Schulenburg, met with minister of foreign affairs to discuss the possible entry of the Red Army into Poland. Werner claims that his country is very interested to know whether we will fulfill our part of the agreement or not. Molotov has assured him that the Soviet Union \"will definitely have to start concrete actions\" but, for the time being, it's too soon for an attack.\nComrade Stalin intends to wait until the advance of German troops causes the collapse of Poland, so that we can come to the "aid" of the Ukrainians and Belarusians living there, threatened by Germany. This pretext will make our intervention look benign in the eyes of the masses and will enable the Soviet Union to not look like an aggressor in the eyes of the West."
 mr_pact_event.7.a:0 "No rush, Mr. Werner"
 mr_pact_event.8.t:0 "German pressure"
 mr_pact_event.8.d:0 "With the deepening advance of the Wehrmacht, German diplomats have urged us once again to begin an incursion into Poland from the east. The German ambassador and Molotov have discussed this matter several times now, without getting anywhere. The only guarantee the Germans have is that the Soviet Union will fulfill its promise when it is convenient.\n\nApparently this whole situation has made the German Ministry of Foreign Affairs increasingly impatient with our delays. So much that today von der Schulenburg has warned us that if the Soviet union does not invade Poland in the following weeks, the [GER.GetName] would most surely make a separate peace with Poland. That means we would not get any land in eastern Poland and our influence in the Baltics would be severly diminished.\nThe best thing we can do right now is to start preparing ourselves to meet our commitments."
 mr_pact_event.8.a:0 "Alright"

 mr_pact_event.13.t:0 "Matters of the East"
 mr_pact_event.13.d:0 "My Führer, Poland has completely fallen into our hands! Both the eastern and western parts of the country are now under the victorious heel of the Wehrmacht. Only one question remains: What to do with the lands that should have been occupied by the USSR.\nSince the Soviets have not even bothered to invade Poland, some politicians have suggested to break off relations with them in retaliation for not holding up their end of the deal. They also want to establish Belarussian and Ukrainian colaborationist governments in the occupied territories of eastern Poland, which will undoubtedly anger the USSR.\nOn the other hand, several members of the High Command have requested we let this matter go, as they consider the non-aggression pact with the USSR vital for the course of the war with France and the UK. For this reason they have proposed to make an arrangement with the Soviets, in which we cede them eastern Poland and they give us a free hand in Lithuania along with a promise to remain in the Pact. What should we do?"
 mr_pact_event.13.a:0 "To hell with those communist bastards!"
 mr_pact_event.13.b:0 "The High Command is right, we should be pragmatic"
 GER_soviets_dont_invade_negotiate_tt:0 "§GWe will try to negiotiate with the soviets to mantain the pact§!"
 mr_pact_event.14.t:0 "An unexpected request"
 mr_pact_event.14.d:0 "In a surprising turn of events the German ambassador proposed this morning that, for the good of both countries, we should continue our cooperation and for this purpose they are offering us land in eastern Poland.\nBy the terms of the agreement we would get the terriotries of Wilno, Nowogrodek, Pinsk, Wolyn, Tarnopol and Stanislawow.\nAlthough this is less than what was agreed originally, it's an opportunity we should not let slip away."
 mr_pact_event.14.a:0 "Accept the offer"
 mr_pact_event.14.b:0 "Tell Mr. Hitler where to shove his proposal"
 mr_pact_event.15.t:0 "The Soviets Accept!"
 mr_pact_event.15.d:0 "Our ambassador to Moscow has informed us this morning of the successful negotiations with the Soviet Foreign Minister, who has agreed to our proposal. We have exceeded everyone's expectations in settling our differences with the Soviet Union, this is certainly a victory for diplomacy and for the Reich!"
 mr_pact_event.15.a:0 "Explendid"
 mr_pact_event.16.t:0 "The Soviets say no(placeholder)"
 mr_pact_event.16.d:0 "dummy"
 mr_pact_event.16.a:0 "The negotiations were short"
 mr_pact_event.17.t:0 "The Germans accuse us of breaking the Pact!"
 mr_pact_event.17.d:0 "Dummy"
 mr_pact_event.17.a:0 "Well, it didn't last long..."

 ##GPW
 sov_gpw.1.t:0 "The Great Patriotic War!"
 sov_gpw.1.d:0 "Comrades! Citizens! Brothers and Sisters! Men of our Army and Navy! The Enemy has come to our gates and demands our submission! The workers, peasants, and soldiers must all work tirelessly to ensure the life of the Soviet State! Our Great Nation, led by our Dear Leader, will surely triumph over the [Root.GetAdjective] bandits and bring the USSR to new heights! The enemy is armed to the teeth with weapons, but only we are armed with the Spirit of the Nation!"
 sov_gpw.1.a:0 "Forward, to our victory!"
 ##Flavor
 sov_flavor.1.t:0 "Chapayev"
 sov_flavor.1.d:0 "Lenfilm's new biopic war film Chapayev premiered today in Leningrad. The movie is an adaptation of Commissar Dimitri Furmanov's memoirs, in which Civil War Hero Vasiliy Ivanovich Chapayev fights with his soldiers against the White Army. It stars Boris Babochkn as Chapayev himself, Boris Blinov as Commissar Furmanov, Varvara Myasnikova as Anka the Machine Gunner, and Leonid Kmit as Petka. The film has proven to be a huge success!."
 sov_flavor.1.a:0 "The whole country is watching Chapayev!"
 sov_flavor.2.t:0 "Jolly Fellows"
 sov_flavor.2.d:0 "A new movie staring Leonid Utyosov and Lyubov Orlova premiered today in the USSR. \"Jolly Fellows\" tells the story of a shepherd named Kostya (Utyosov), whose greatest passion is playing his flute. By mistake, he is invited to a party held and attended by several NEPmen and women. After being thrown out for being a simple shepherd, he leaves for the city to pursue fame. He joins a band, which then wins fame in a Moscow concert hall.\n\nOrlova plays Anyuta, the maid of Yelena, a rich woman who Kostya is at love with at first. However, Anyuta also loves Kostya. At the end, Anyuta joins the band as a singer, and the two fall in love. The film has quickly become incredibly popular."
 sov_flavor.2.a:0 "A fun musical for all!"
 sov_flavor.3.t:0 "Lokomotiv Moscow Wins the Soviet Cup"
 sov_flavor.3.d:0 "In the First Soviet Cup Finals, Lokomotiv Moscow defeated Dynamo Tbilisi two to nothing. A hard fought football match, the two teams competed in Dynamo Stadium in Moscow, with Nikolai Usov refereeing. The match was attended by 22,000 excited fans. Team captains Dimitri Maksimov and Shota Shavgulidze did their best, but Moscow won in the end."
 sov_flavor.3.a:0 "I rooted for CDKA."
 sov_flavor.4.t:0 "Dynamo Tbilisi Wins the Soviet Cup"
 sov_flavor.4.d:0 "In the First Soviet Cup Finals, Dynamo Tbilisi defeated Lokomotiv Moscow three to one. A hard fought football match, the two teams competed in Dynamo Stadium in Moscow, with Nikolai Usov refereeing. The match was attened by 22,000 excited fans. Team captains Dimitri Maksimov and Shota Shavgulidze did their best, but Tbilisi won in the end. The Georgians are no doubt happy with their team's success."
 sov_flavor.4.a:0 "I rooted for Krasnaya Znamaya."
 sov_flavor.5.t:0 "Dynamo wins the Premier Basketball League"
 sov_flavor.5.d:0 "Today, the USSR Championship in Men's Basketball Finals were held, with Dynamo (from Moscow), defeating Krasnaya Zarya (Red Dawn, from Leningrad). Lokomotiv - also from Moscow - took third place. This season was the first to use clubs rather than city teams, with clubs such as Petrel and GOLFIK competing."
 sov_flavor.5.a:0 "A good match all around!"
 sov_flavor.6.t:0 "Krasnaya Zarya wins the Premier Basketball League"
 sov_flavor.6.d:0 "Today, the USSR Championship in Men's Basketball Finals were held, with Krasnaya Zarya (from Leningrad), defeating Dynamo, a Moscow team. Lokomotiv - also from Moscow - took third place. This season was the first to use clubs rather than city teams, with clubs such as Petrel and GOLFIK competing."
 sov_flavor.6.a:0 "A good match all around!"
 sov_flavor.7.t:0 "Lenin in October"
 sov_flavor.7.d:0 "Mosfilm, at the behest of GOSKINO, has released a new propaganda film titled \"Lenin in October\", directed by Mikhail Romm. Released on the Twentieth Anniversary of the October Revolution, it features Boris Schukin as Vladimir Lenin, and portrayed his actions and attempts to put a Socialist Government in power. Josef Stalin, played by Seymon Goldshtab, has a far greater prominiance in the film than he did in real life. This is of course, a government commisioned film, which repeatedly shows anti-Stalin Communists as traitors."
 sov_flavor.7.a:0 "It must recieve the Stalin Prise!"
 sov_flavor.8.t:0 "Volga-Volga"
 sov_flavor.8.d:0 "Director Grigory Aleksandrov's new film, \"Volga-Volga\", premiered today in Moscow. Featuring music by Isaak Dunayevsky, the film depicts singers from a Russian Village on their way to perform in the Moscow Musical Olypiad. The lead role is played by Lyubov Orlova, who, since Jolly Fellows, has become Comrade Stalin's favorite actress. The other lead roles are played by Igor Ilyinsky, andrei Tutyshkin, and Anatoly Shalaev. The musical has reportedly become Comrade Stalin's favorite film."
 sov_flavor.8.a:0 "That one chef looks like Comrade Khrushchev!"
 sov_flavor.9.t:0 "Alexander Nevsky"
 sov_flavor.9.d:0 "\"Alexander Nevsky\", directed by Sergei Eisenstein, premiered today. The film stars Nikolai Cherkasov as Prince Alexander, and depicts his fight against Teutonic Knights in the 13th century. In the film, the invaders are brought into Pskov with Tverdilo, a traitor, and murder the entire population. Because the Clergy, Nobility, and Merchants are unwilling to fight, Nevsky rallies the people to defeat the Teutons at the Battle of the Ice, which takes up 30 minutes of the film. The film also depicts interactions with the Mongols. It has become the new most popular film, with approval from Stalin himself!"
 sov_flavor.9.a:0 "Live by the Sword, die by the Sword!"
 sov_flavor.10.t:0 "The Wizard of the Emerald City"
 sov_flavor.10.d:0 "Alexander Volkov has published a new children's novel called \"The Wizard of the Emerald City\". In the book, a girl named Ellie Smith and her dog, Little Toto, are swept away to a magical land, killing the evil witch Gingema with their house. They are told by a good witch, Villina, that the Wizard of the Emerald City, James Goodwin, can send them back home. Along the way, they befriend that Scarecrow, the Iron Lumberjack, and Cowardly Lion. Before Goodwin sends Ellie and Little Toto home, they are sent to kill another evil witch, Bastinda. After killing Bastinda, they return to Goodwin, who fails to send them home. The group then goes to see Stella, a second good witch, who finally sends them home."
 sov_flavor.10.a:0 "We're not in Astrakhan anymore, Totoshka."
 sov_flavor.11.t:0 "Mikhail Bulgakov Dies"
 sov_flavor.11.d:0 "Mikhail Afanasyevich Bulgakov, one of our most celebated authors, has died today of nephrosclerosis, as his father had. Tomorrow, a funeral will be held at the headquarters Union of Soviet Writers. He is famous for \"The White Guard\", and his play \"The Cabal of Hypocrites\". He had also written \"The Fatal Eggs\" and \"Heart of a Dog\", which made him seem counter-revolutionary to the government. However, his last work, \"The Master and Margarita\", remains unpublished..."
 sov_flavor.11.a:0 "Don't you know that manuscripts don't burn?"
 sov_flavor.12.t:0 "Rout of the German troops near Moscow"
 sov_flavor.12.d:0 "A new propaganda documentary was released today. It shows efforts of the workers and the soldiers as they repel the enemy's forces from Moscow. The soldiers are greeted by civilians happy to have been liberated, and many historical monuments are destroyed. It shows battles with artillery, tanks, and ski troops."
 sov_flavor.12.a:0 "The Greatest Documentary in All History!"
 sov_flavor.13.t:0 "Ivan Grozniy"
 sov_flavor.13.d:0 "Sergei Eisenstein's \"Ivan the Terrible\" premiered today. The film stars Nikolai Cherkasov as Tsar Ivan IV, and depicts the Tsar's life as he fights the Khanate of Kazan, as well as deal with court intrigue, and woo a wife. The main conflict is not with invading forces, but agains the plots of the nobility, a direct allegory to Comrade Stalin's struggle with the Traitors of the 1930's."
 sov_flavor.13.a:0 "And it was only the first part!"
 sov_flavor.14.t:0 "The Closing of Zvezda and Leningrad"
 sov_flavor.14.d:0 "Two literary magazines, Leningrad and Zvezda, have published works of Mikhail Zoshchenko and Anna Akhmatova. These works are apolitical, bourgeois, individualistic, anti-formalist, and cosmopolitan. Therefore, we must close these magazines down!"
 sov_flavor.14.a:0 "Comrade Zhdanov will protect our Culture!"
 ##Test
 sov_test.1.t:0 "Soviet Autonomy Test"
 sov_test.1.d:0 "This event sets Poland to be one of the three Soviet Autonomy levels."
 sov_test.1.a:0 "Autonomous Territory"
 sov_test.1.b:0 "Satellite"
 sov_test.1.c:0 "Associated State"
 #Decisions
 SOV_Great_Purge:0 "The Great Purge"
 SOV_Great_Purge_desc:0 "Using the NKVD assassination of Sergei Kirov, we have a pretext to conduct a massive purging of the political and social sphere. Opposition politicians and innocent people wil be accused of conspiracies to commit various forms of treason, and will be executed. Comrade Stalin claims that threats within and outside of the party are plotting against him, and must be forced to confess to their false crimes. Even loyal followers of Stalin must be eliminated to avoid over-enthusiasm. Some members of émigré groups will also be brought to USSR and executed. Outside of the political sphere, the military must also be purged of those who may or may not think outside of the Party line. Furthermore, the anti-intellectual campaigns will be intensified, and writers, actors, directors, etc; can pose a propagandist threat to our power. Furthermore, nationalist groups must be eliminated to preserve the territorial integrity of the USSR."
 SOV_Purge_Mission:0 "The Great Purge"
 SOV_Purge_Mission_desc:0 "If we are to Purge the \"Opposition\", then we must eliminate everyone Comrade Stalin sees as an enemy. Failure to do so will bring repercussions on the country." 
 SOV_purge_debuff_tt:0 "§YWe will get a §Rpenalty to military performance§! based on the level of the Purges.§!"
 SOV_revolvers_taken_away:0 "Communist Party members' revolvers have been confiscated."
 SOV_Take_Away_Revolvers:0 "Confiscate Party Members' Revolvers"
 SOV_Take_Away_Revolvers_desc:0 "Several Party members have been issued a revolver so they can arrest spies and saboteurs. We should take them away before we begin mass arrests to protect NKVD agents."
 SOV_first_moscow_trial_completed:0 "The §YTrotskyite-Zinovievite Center§! has been Purged."
 SOV_trotzin_tt:0 "§YGrigory Zinoviev and Lev Kamenev will be imprisoned, tried, and executed. Vagarshak Arutyunovich Ter-Vaganyan will no longer be the General Secretary of the Armenian Communist Party.§!\n"
 SOV_First_Moscow_Trial:0 "Case of the Trotskyite-Zinovievite Terrorist Center"
 SOV_First_Moscow_Trial_desc:0 "Lev Kamenev and Grigory Zinoviev have, according to forced confessions, been working with Trotskyists to bring down the regime! Furthermore, we have evidence that the leader of the Armenian Communist Party, Vagarshak Arutyunovich Ter-Vaganyan is working with the Zinovievites as well! They must be eliminated!"
 SOV_parallel_center_trial_completed:0 "The Trial of the §YParallel anti-Soviet Trotskyist Center§! has been completed."
 SOV_parallel_tt:0 "§YKarl Radek, Grigory Sokolnikov, and Alexander Belobodorov will be imprisoned, tried, and executed.§!"
 SOV_Parallel_Center:0 "Trial of the Parallel anti-Soviet Trotskyist Center"
 SOV_Parallel_Center_desc:0 "These Dangerous Leftists present a danger to Soviet Power, and thus may be eliminated. Karl Radek has been especially forthright about Bukharin's Rightists and their planned Opposition. Thus he will be spared for now."
 SOV_democratic_centralists_completed:0 "The §YDemocratic Centralists§! have been Purged."
 SOV_demcen_tt:0 "§YValerian Obolensky, Timofey Sapronov, Vladimir Smirnov, Vladislav Kosior, and Andrei Bubnov will be imprisoned, tried, and executed.§!\n"
 SOV_Democratic_Centralist_Trial:0 "Purge the Democratic Centralists"
 SOV_Democratic_Centralist_Trial_desc:0 "The Democratic Centralists are a dangerous group of anti-Leninists who seek to see the end of absolute Soviet Power. They must be found and executed without public trial."
 SOV_anti_soviet_military_tt:0 "§YMikhail Tukhachevsky, Ieronim Uborevich, Robert Eideman, and Vitovt Putna will no longer be ministers.§!\n"
 SOV_anti_soviet_military_completed:0 "The §YCase of the Trotskyist Anti-Soviet Military Organization§! has been completed."
 SOV_Trotskyist_Anti_Soviet_Military:0 "Case of the Trotskyist Anti-Soviet Military Organization"
 SOV_Trotskyist_Anti_Soviet_Military_desc:0 "These Trotskyist Officers want to take over the regime and bring that Devil Trotsky to power! We cannot let this happen!"
 SOV_bonapartist_fascist_completed:0 "The §YTrial of the Bonapartist-Fascist Military Clique§! has been completed."
 SOV_bonapartist_clique_tt:0 "§YKonstantin Rokossovsky, Vasily Sokolovsky, Boris Shaposhnikov, Victor Kravchanko, and Seymon Timoshenko will be imprisoned, tried, and executed.§!\n"
 SOV_Bonapartist_Fascist_Clique:0 "Trial of the Bonapartist-Fascist Military Clique"
 SOV_Bonapartist_Fascist_Clique_desc:0 "There are officers who are either not political enough or too political. They are obviously hiding fascist sympathies, and thus must be purged."
 SOV_workers_opposition_completed:0 "The §YWorkers' Opposition§! has been purged."
 SOV_lensyn_purge_tt:0 "§YAlexander Shlyapnikov, Ivan Kutuzov, Vladimir Nevsky, Sergei Medvedev, and Yevgeny Kislyak will be imprisoned, tried, and executed.§!\n"
 SOV_Workers_Opposition_Purge:0 "Purge the Workers' Opposition"
 SOV_Workers_Opposition_Purge_desc:0 "The Workers' Opposition is a group of Syndicalists who aim to end the Vanguardist nature of our Party. Their elimination is paramount."
 SOV_left_sr_purge_tt:0 "§YBoris Kamkov, Imanali Aiderbekov, Mikhail Levenson, and Vladimir Trutovsky will be imprisoned, tried, and executed.§!\n"
 SOV_Left_SRs_Purge:0 "Purge the Left Socialist Revolutionaries"
 SOV_Left_SRs_Purge_desc:0 "Our former allies in the Civil War, the Left Socialist Revolutionaries represent the only threat outside the Communist Party who can rally the people. We must get rid of them at once."
 SOV_left_sr_purge_completed:0 "The §YLeft Socialist Revolutionaries§! have been Purged."
 SOV_bukharinist_purge_completed:0 "The §YCase of the Anti-Soviet Bloc of Rightists and Trotskyites§! has been completed."
 SOV_bukharninist_purge_tt:0 "§YNikolai Bukharin, Alexei Rykov, Nikolai Krestnisky, Christian Rakovsky, Genrikh Yagoda, Mikhail Chernov, Sergei Bessonov, Vasily Sharangovich, and Prokopy Zubarev will be imprisoned, tried, and executed."
 SOV_Rightists_Trotskyists:0 "Case of the Anti-Soviet Bloc of Rightists and Trotskyites"
 SOV_Rightists_Trotskyists_desc:0 "Bukharin's Rightists should be forced to admit their guilt in killing Sergei Kirov, as well as their conspiracies to kill Comrade Stalin! They should then be executed!"
 sov_nkvd.0.t: "The death of Vyacheslav Menzhinsky"
 sov_nkvd.0.d: "Today the Chairman of the OGPU, Vyacheslav Menzhinsky, has died. Menzhinsky spent his last years as an invalid, suffering from acute angina since the late 1920s, which rendered him incapable of physical exertion. He conducted the affairs of the OGPU while lying upon a couch in his office at the Lubyanka, but rarely interfered in the day-to-day operation of the GPU. Because of this, Stalin tended to deal with his first deputy Genrikh Yagoda instead, who essentially took over as head of the organization in all but name.\n\nMenzhinsky was a very important comrade, serving as People's Commissar for Finance a few days after the Revolution. It is said that his first act in the post was to drag a large sofa into his office, tacking a notice on it saying 'Commissariat of Finance', and laying down on it. When officials at the Russian State Bank refused to recognise our regime, Menzhinsky had the director and others arrested; a maneuver that deprived all our opponents of their financial means of warfare.\n\nHe played a great role in conducting the secret Trust and Sindikat-2 counterintelligence operations, in the course of which leaders of large anti-Soviet centers abroad, Boris Savinkov and Sidney Reilly, were lured to the Soviet Union and arrested."
 sov_nkvd.0.a: "Undoubtably, we will miss his presence."
 sov_nkvd.1.t: "Re-formation of the NKVD"
 sov_nkvd.1.d: "Today, two months after Menzhinsky's death, comrade Stalin has decided to reorganise the state security agencies: The NKVD of the RSFSR has been transformed into an all-union security force, becoming the newly created interior ministry of the Soviet Union. The OGPU has been dissolved and reincorporated into the NKVD as the Main Directorate for State Security (GUGB), with Genrikh Yagoda as its leader. As a result of all of this, the NKVD has took over control of all detention facilities (including the forced labor camps) as well as the regular police."
 sov_nkvd.1.a: "The NKVD will be the leading detachment of our party."
 sov_nkvd.2.t: "The fall of Genrikh Yagoda"
 sov_nkvd.2.d: "Yesterday, Stalin received a report from Yagoda detailing the unfavorable public reaction abroad to the show trials and the growing sympathy among the Soviet population for the executed defendants. The report enraged Stalin, interpreting it as Yagoda's advice to stop the show trials and in particular to abandon the planned purge of Mikhail Tukhachevsky, Marshal of the Soviet Union and former commander in chief of the Red Army. Stalin was already unhappy with Yagoda's services, mostly due to mismanagement of Kirov's assassination, his failure to report the existence of the Bloc of Oppositions earlier and his failure to fabricate "proofs" of ties between Kamenev and Zinoviev and the Okhrana (the tsarist security organization).\n\nToday Yagoda was replaced by Nikolai Yezhov as People's Commissar for Internal Affairs."
 sov_nkvd.2.a: "Do svidaniya, tovarishch."
 SOV_yagoda_purged: "§YGenrikh Yagoda§! has been §Rpurged§!"
 SOV_yezhov_purged: "§YNikolai Yezhov§! has been §Rpurged§!"
 SOV_miller_purged:0 "§YYevgeny Miller§! has been Kidnapped and Executed."
 SOV_miller_purge_tt:0 "§YYevgeny Miller will no longer be the leader of the Russian All-Military Union. He will be replaced by Fyodor Abramov.§!\n"
 SOV_Yevgeny_Miller_Kidnapping:0 "Kidnap Yevgeny Miller"
 SOV_Yevgeny_Miller_Kidnapping_desc:0 "Yevgeny Miller, the leader of the Russian All-Military Union (A Monarchist Organization based in Belgrade), must be brought from Yugoslavia by force to face punishment."
 SOV_monarchists_purged:0 "The §YÉmigré Monarchists§! have been purged."
 SOV_monarchists_purge_tt:0 "§YPyotr Apraskin, Alexei Arkhangelsky, Lukyan Solonevich, Ivan Aivazov, Sergei Voeikov, Georgi Chaplin, Vladimir Kislitsyn, Alexander Myasoedov, Erast Giatsimov, and Ivan Ilyin will be imprisoned, tried, and executed.§!\n"
 SOV_Monarchist_Purge:0 "Purge the Monarchists"
 SOV_Monarchist_Purge_desc:0 "Monarchist Émigré Organizations abroad must be found and eliminated, lest they incite reactionary sentiment in the USSR."
 SOV_trudoviks_purged:0 "§YTrudoviks§! Remaining in the USSR have been Purged."
 SOV_trudoviks_purge_tt:0 "§YMohammed Hadi-Atlasov, Ivan Subbotin, Alexander Fyodorov, Fedot Onipko, Mikhail Merkalov, Ivan Bychkov, Trofim Alexeev, and Vasily Vragov will be imprisoned, tried, and executed.§!"
 SOV_Trudoviks_Purge:0 "Purge Trudoviks"
 SOV_Trudoviks_Purge_desc:0 "Labour Group politicians are despicable anti-Marxist Social Democrats. They must be removed from the USSR!"
 SOV_trudovik2_purge_tt:0 "Ivan Zhilkin, Seymon Yermolaev, Timofey Lokot, Lev Kartashov, and Aristarkh Rylsev will be imprisoned, tried, and executed."
 SOV_More_Trudovik_Purge:0 "Purge Trudoviks Abroad"
 SOV_More_Trudovik_Purge_desc:0 "It is not enough to make sure that the false Socialists have been removed from the USSR. They should be kidnapped and tried in the USSR!"
 SOV_RightSRs_purged:0 "The §YRight Socialist Revolutionaries§! have been purged."
 SOV_rightsrs_purge_tt:0 "§YVladimir Volsky, Dimitry Zimin, Andrei Argunov, Alexander Yanko, Mihail Shebalin, Bronu Lopatin-Barth, Abram Galatser, and Vladimir Alekseevsky will no longer be agailable as ministers.§!\n"
 SOV_RightSR_Purge:0 "Purge Right SRs"
 SOV_RightSR_Purge_desc:0 "Rightist Socialist Revolutionaries remaining in the USSR must be killed to prevent their dangerous influence from reaching the people."
 SOV_kadets_purged:0 "§YKadets§! remaining in the USSR have been purged."
 SOV_kadets_purge_tt:0 "§YMikhail Mandelstam, Nikolai Vavin, and Genrikh Sliozberg will be imprisoned, tried, and executed.§!\n"
 SOV_Kadet_Purge:0 "Purge Kadets"
 SOV_Kadet_Purge_desc:0 "The Kadets are the real wreckers of society. If we are to survive, all remaining Kadets must be found and killed."
 SOV_octobrist_BH_purged:0 "§YOctobrist§! and members of §YBlack Hundred§! organizations remaining in the USSR have been purged."
 SOV_octobrist_purge_tt:0 "§YMikhail Alabovsky, Alexander Bobrishev-Pushkin, Ivan Karpinsky, and Pavel Smelov will be imprisoned, tried, and executed.§!\n"
 SOV_OctobristBH_Purge:0 "Purge Right-Wing Saboteurs"
 SOV_OctobristBH_Purge_desc:0 "The Octobrists and Black Hundreds still remain in Russia, ready to take back power when they smell opportunity. We shall not give them this opportunity!"
 SOV_konovalets_purged:0 "§YYevhen Konovalets§! has been assassinated."
 SOV_konovalets_purge_tt:0 "§YYevhen Konovalets will not longer be the leader of the Organization of Ukrainian Nationalists.§!\n"
 SOV_Konovalets_Purge:0 "Assassinate Yevhen Konovalets"
 SOV_Konovalets_Purge_desc:0 "Konovalets, the leader of the subversive Organization of Ukranian Nationalists, must be killed to avoid his nationalism from poisoning our territories."
 SOV_economic_purge_tt:0 "§YVlas Chubar will no longer be available as a minister.§!\n"
 SOV_economic_ministry_purged:0 "The §YEconomic Ministry§! has been purged."
 SOV_Economic_Ministry_Purge:0 "Purge the Economic Ministry"
 SOV_Economic_Ministry_Purge_desc:0 "The Economic Ministries are filled with Liberal Spies, Fascist Saboteurs, and Trotskyist sympathizers. The whole ministry must be purged."
 SOV_foreign_purge_tt:0 "§YThe Foreign Ministry will be Purged.§!"
 SOV_foreign_ministry_purged:0 "The §YForeign Ministry§! has been purged."
 SOV_Foreign_Ministry_Purge:0 "Purge the Foreign Ministry"
 SOV_Foreign_Ministry_Purge_desc:0 "The Foreign Ministry is full of Trotskyists who seek to put us in bed with Fascists! We cannot let this stand!"
 SOV_nkvd_purge_tt:0 "§YNikolai Yezhov, Karl Bauman, and Pavel Postychev will be imprisoned, tried, and executed.§!"
 SOV_nkvd_ministry_purged:0 "The §YNKVD§! has been purged."
 SOV_NKVD_Purge:0 "Purge the NKVD"
 SOV_NKVD_Purge_desc:0 "Our Exercise in Purging is almost over. We should now purge the NKVD to make sure that we have complete control over the organization."
 SOV_gpu_ministry_purged:0 "The §YGPU§! has been purged."
 SOV_gpu_purge_tt:0 "§YJan Berzin, Seymon Uritsky, Alexander Nikonov, Seymon Gendin, and Ivan Proskurov will be imprisoned, tried, and executed.§!\n"
 SOV_GPU_Purge:0 "Purge the GPU"
 SOV_GPU_Purge_desc:0 "Military Intelligence could betray us to the Imperialists at any moment. We must prevent these dangerous Bukharinist Fascists from doing so."
 SOV_ssrs_purged:0 "The §YSSR Leadership§! has been purged."
 SOV_ssr_purge_tt:0 "§YThe SSR Leadership will be purged and replaced.§!"
 SOV_SSR_Purge:0 "Purge SSR leadership"
 SOV_SSR_Purge_desc:0 "The Leadership of the various Soviet Socialist Republics must be replaced. They are either too enthusiastic or not enthusiastic enough."
 SOV_army_purged:0 "The §YArmy§! has been Purged."
 SOV_army_purge_tt:0 "§YVasily Blyukher, Nikolai Krashkin, and Ivan Belov will be imprisoned, tried, and executed."
 SOV_Army_Purge:0 "Finalize Army Purges"
 SOV_Army_Purge_desc:0 "We have purged nearly 20,000 officers and many more infantrymen, but we should continue to find enemies at the top of the Chain of Command."
 SOV_navy_purged:0 "The §YNavy§! has been Purged."
 SOV_navy_purge_tt:0 "§YEduard Pantserzhanskiy, Vyacheslav Zof, Romuald Muklevich, Vladimir Orlov, Mikhail Viktorov, Pyotr Smirnov, and Mikhail Frinovsky will be imprisoned, tried, and executed.§!\n"
 SOV_Navy_Purge:0 "Finalize Navy Purges"
 SOV_Navy_Purge_desc:0 "We must make sure that no surviving Fascist Trotskyist Liberals exist in the navy, lest they turn on us!"s
 SOV_air_purged:0 "The §YAir Force§! has been Purged."
 SOV_air_purge_tt:0 "§YYakov Alksnis, Benedict Trojanker, Sergei Merzheninov, Vasily Khripin, and Vasily Lavrov will be imprisoned, tried, and executed.§!\n"
 SOV_Air_Purge:0 "Finalize Air Force Purges"
 SOV_Air_Purge_desc:0 "A strong air arm is very important for a modern army. We must make sure that there are no traitors in it."
 SOV_stopped_armenia_purge:0 "Suspected §YArmenian Nationalists§! have been purged."
 SOV_armenia_tt:0 "§YArmenian Nationalists in the USSR will be purged.§!\n"
 SOV_Armenia_Purge:0 "Purge Armenian Nationalists"
 SOV_Armenia_Purge_desc:0 "Any Armenians suspected of harboring nationalist sentiments must be purged to ensure the territorial integrity of the USSR."
 SOV_stopped_azerbaijan_purge:0 "Suspected §YAzerbaijani Nationalists§! have been purged."
 SOV_azerbaijani_purge_tt:0 "§YAzerbaijani Nationalists in the USSR will be purged.§!\n"
 SOV_Azerbaijan_Purge:0 "Purge Azerbaijani Nationalists"
 SOV_Azerbaijan_Purge_desc:0 "Any Azerbaijanis suspected of harboring nationalist sentiments must be purged to ensure the territorial integrity of the USSR."
 SOV_stopped_belarus_purge:0 "Suspected §YBelarusian Nationalists§! have been purged."
 SOV_belarus_purge_tt:0 "§YBelarusian Nationalists in the USSR will be purged.§!\n"
 SOV_Belarus_Purge:0 "Purge the Tolmachev-Belarusian Opposition"
 SOV_Belarus_Purge_desc:0 "The Tolmachev-Belarusian Opposition in the Red Army is a dangerous group of nationalist dissidents who must be purged to eliminate anti-Socialist sentiment in the Red Army."
 SOV_stopped_crimean_purge:0 "Suspected §YCrimean Nationalists§! have been purged."
 SOV_crimean_purge_tt:0 "§YCrimean Nationalists in the USSR will be purged.§!\n"
 SOV_Crimean_Purge:0 "Purge Crimean Nationalists"
 SOV_Crimean_Purge_desc:0 "Any Crimeans suspected of harboring nationalist sentiment - especially the remnants of the Crimean Republic of the Civil War - must be purged to ensure the territorial integrity of the USSR."
 SOV_stopped_tatar_purge:0 "Suspected §YTatar Nationalists§! have been purged."
 SOV_tatar_purge_tt:0 "§YTatar Nationalists in the USSR will be purged.§!\n"
 SOV_Tatar_Purge:0 "Purge Tatar Nationalists"
 SOV_Tatar_Purge_desc:0 "Any Crimeans suspected of harboring nationalist sentiment - especially the remnants of the Idel-Ural State of the Civil War - must be purged to ensure the territorial integrity of the USSR."
 SOV_stopped_georgia_purge:0 "Suspected §YGeorgian Nationalists§! have been purged."
 SOV_georgia_purge_tt:0 "§YGeorgian Nationalists in the USSR will be purged.§!\n"
 SOV_Georgia_Purge:0 "Purge Georgian Nationalists"
 SOV_Georgia_Purge_desc:0 "Any Georgians suspected of harboring nationalist sentiment - for example Mikheil Javakhishvilli and Evgen Gvaladze -  must be purged to ensure the territorial integrity of the USSR."
 SOV_stopped_kazakh_purge:0 "Suspected §YKazakh Nationalists§! have been purged."
 SOV_kazakh_purge_tt:0 "§YKazakh Nationalists in the USSR will be purged.§!\n"
 SOV_Kazakh_Purge:0 "Purge Kazakh Nationalists"
 SOV_Kazakh_Purge_desc:0 "Any Kazakhstanis suspected of harboring nationalist sentiment - especially members of the Alash party -  must be purged to ensure the territorial integrity of the USSR."
 SOV_stopped_tajik_purge:0 "Suspected §YTajik Nationalists§! have been purged."
 SOV_tajik_purge_tt:0 "§YTajik Nationalists in the USSR will be purged.§!\n"
 SOV_Tajik_Purge:0 "Purge Tajik Nationalists"
 SOV_Tajik_Purge_desc:0 "Any Tajikistanis suspected of harboring nationalist sentiment must be purged to ensure the territorial integrity of the USSR."
 SOV_stopped_uzbek_purge:0 "Suspected §YUzbek Nationalists§! have been purged."
 SOV_uzbek_purge_tt:0 "§YUzbek Nationalists in the USSR will be purged.§!\n"
 SOV_Uzbek_Purge:0 "Purge Uzbeki Nationalists"
 SOV_Uzbek_Purge_desc:0 "Any Uzbekis suspected of harboring nationalist sentiment must be purged to ensure the territorial integrity of the USSR."
 SOV_stopped_north_caucasus_purge:0 "Suspected §YNorth Caucasian Nationalists§! have been purged."
 SOV_north_caucasus_purge_tt:0 "§YNorth Caucasian Nationalists in the USSR will be purged.§!\n"
 SOV_NC_Purge:0 "Purge North Caucasian Nationalists"
 SOV_NC_Purge_desc:0 "The Dagestanis and Chechens tried to establish their own state during the Civil War. If we let suspected nationalists go free, then we risk a Pan-Islamic Resurgence."
 SOV_did_purge:0 "§GThe Great Purge has been completed.§!"
 SOV_Kill_NKVD_Chief:0 "Purge the NKVD Chief"
 SOV_Kill_NKVD_Chief_desc:0 "Our NKVD Chief has witnessed and overseen many purges so far. He needs to be removed, as he knows too much. We will force him to confess to sexual promiscuity and being an enemy of the people."
 SOV_Kyrgyz_Purge:0 "Purge Kyrgyz Nationalists"
 SOV_Kyrgyz_Purge_desc:0 "Any Kyrgyz suspected of harboring nationalist sentiment must be purged to ensure the territorial integrity of the USSR."
 SOV_stopped_kirgiz_purge:0 "Suspected §YKyrgyz Nationalists§! have been purged."
 SOV_kirgiz_purge_tt:0 "§YKyrgyz Nationalists in the USSR will be purged.§!\n"
 SOV_Turkmen_Purge:0 "Purge Turkmeni Nationalists"
 SOV_Turkmen_Purge_desc:0 "Any Turkmenis suspected of harboring nationalist sentiment must be purged to ensure the territorial integrity of the USSR."
 SOV_stopped_turkmen_purge:0 "Suspected §YTurkmeni Nationalists§! have been purged."
 SOV_turkmen_purge_tt:0 "§YTurkmeni Nationalists in the USSR will be purged.§!\n"
 SOV_surrogate:0 "§GThis action has been otherwise unlocked.§!"
 SOV_invade_poland_MR_pact:0 "Invade Poland"
 SOV_invade_poland_MR_pact_desc:0 "§R[GER.GetFlag]Germany§! has declared war on [POL.GetFlag]§YPoland§!, by the terms of the §YMolotov-Ribbentrop pact§! we should uphold our agreed-upon part and attack Poland from the east. §RComrade Stalin§!, however, is reluctant on invading Poland immediately. In his opinion we should be very careful and wait to see how the West reacts to the german invasion; The perfect opportunity would be to wait until §YWarsaw§! falls to the Germans, declare that the Polish Government no longer exists and thus it cannot guarantee the safety of Belarussian and Ukrainian citizens from the German invaders, then invade Eastern Poland. This would hopefully justify the invasion to the eyes of the west and avoid us any problems."
 ### Political Actions
 SOV_political_actions:0 "Soviet Politics"
 SOV_moratorium_on_new_members:0 "Moratorium on New Members"
 SOV_moratorium_on_new_members_desc:0 "Social-Alien elements, such as reactionaries, have likely infiltrated the party! Any of our 3.5 million members could secretly be a foreign spy or a reactionary. We need a moratorium on recruitment to allow for further scrutiny of current members."
 sov_moratorium_flag:0 "§YMoratorium on Party Recruitment.§!"
 sov_moratorium_tt:0 "§RNo applicants to the Communist Party will be approved, and current members will be scrutinized.§!\n"
 sov_moratorium_off_tt:0 "§GApplicants to the Communist Party will be eligible for approval again.§!\n"
 SOV_issue_passports:0 "Issue Passports"
 SOV_issue_passports_desc:0 "Some important bureaucrats will need passports to travel abroad for state purposes. We should give them these passports."
 SOV_metro:0 "Build the Moscow Metro"
 SOV_metro_desc:0 "There have been plans to build a Metro System under Moscow since imperial times. It is time to finally build a subway!"
 SOV_revive_rodina:0 "Revive usage of \"Rodina\""
 SOV_revive_rodina_desc:0 "Although previously considered a reactionary term, the Rodina (Motherland), must once again enter the Russian vocabulary."
 SOV_lift_cossack_ban:0 "Allow Cossacks to Serve"
 SOV_lift_cossack_ban_desc:0 "For years, our government has been pressured by numerous former Cossacks who wish to serve in the Red Army. They would bring much-needed experience to our armed forces."
 SOV_have_trotsky_killed:0 "Have Trotsky Killed!"
 SOV_have_trotsky_killed_desc:0 "Leon Trotsky continues to write treatises against us from his home in [wheretrot]. We must have him killed by a local working for the NKVD!"
 trotInTur:0 "Turkey"
 trotInFra:0 "France"
 trotInNor:0 "Norway"
 trotInMex:0 "Mexico"
 SOV_dissolved_comintern:0 "Dissolved the Comintern"
 SOV_Dismantle_Comintern:0 "Dissolve the Comintern"
 SOV_Dismantle_Comintern_desc:0 "Our \"Allies\" in this Great Patriotic War are hesitant to work with us due to our position as head of the Communist International. If we dismantled it, they may feel better about us."
 SOV_end_rations:0 "End Wartime Rationing"
 SOV_end_rations_desc:0 "The people have suffered from years of war. If we get rid of wartime rations, we would restore some order to our society."
 SOV_end_mobilization:0 "Demobilize"
 SOV_end_mobilization_desc:0 "The people have worked hard enough. It is time to give them a rest."
