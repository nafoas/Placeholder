 SOV_shadow_evacuation:0 "Shadow Evacuation"
 SOV_shadow_evacuation_desc:0 "If we are to face a major invasion, our western frontier will be threatened. To protect our industrial capacity, some of it should be moved to the east, and we should plan to move more in the future."
 ##Five-Year Plans
 ###Second
 SOV_uowipghweurng:0 ""
 SOV_2nd_Plan_Title:0 "Second "
 SOV_2nd_Plan_Desc:0 "After the moderate success of the First Five-Year Plan, we should follow it up with a second plan to eliminate capitalist elements, expand industry, improve the well-being of the people, and strengthen the defense of the country. "
 SOV_3rd_Plan_Title:0 "Third "
 SOV_3rd_Plan_Desc:0 "After our attempts to modernize civilian industry, our attention must turn towards National Defense. As Russia's enemies gear up for war, we must prepare our military too! "
 SOV_4th_Plan_Title:0 "Fourth "
 SOV_4th_Plan_Desc:0 "The Fourth Five-Year Plan will be focused on maintaining the balance between civilian industries and military industries. If these efforts are successful, we can even work on adding to our resource reserves. "
 SOV_Five_Year_Plan:0 "[This.SOV_Year_Plan_Title]Five-Year Plan"
 SOV_Five_Year_Plan_desc:0 "[This.SOV_Year_Plan_Desc]Our construction projects rest on the backs of prisoners arrested for suspected sabotage or political opposition. With our collectivization campaign, there is no telling how many more people will be forced into the system."
 SOV_2nd_5_Year_Plan_Mission:0 "The Second Five-Year Plan"
 SOV_2nd_5_Year_Plan_Mission_desc:0 "If we manage to meet the quotas for the Second Five-Year Plan, then we will be rewarded with a stronger industry. If we don't, we could face industrial failures and those who are responsible will be arrested."
 SOV_canal_built:0 "The §YWhite Sea Canal§! has been built"
 WHITE_SEA_CANAL_BUILT:0 "The §YWhite Sea Canal§! has been built"
 white_sea_canal_tt:0 "§RThe White Sea Canal has not been built yet§!"
 white_sea_canal_construction_tt:0 "§YThe White Sea Canal strait will be enabled§!"
 SOV_White_Sea_Canal:0 "Finish the White Sea Canal"
 SOV_White_Sea_Canal_desc:0 "A Canal from the White Sea to the Baltic is one of our grand construction projects, and we should be able to finish it this year. Built with forced labour, it is said that the Left Bank was built by those who told Political Jokes, and the Right Bank by those who listened."
 SOV_3rd_5_Year_Plan_Mission:0 "The Third Five-Year Plan"
 SOV_3rd_5_Year_Plan_Mission_desc:0 "The Third Five-Year Plan will deal more with the defense of the nation, and not consumer goods. Should we succeed in fulfilling production targets, then we will be rewarded with a stronger industry. If we don't, we could face industrial failures and those who are responsible will be arrested."
 SOV_4th_5_Year_Plan_Mission:0 "The Fourth Five-Year Plan"
 SOV_4th_5_Year_Plan_Mission_desc:0 "The Fourth Five-Year Plan will be focused on maintaining the balance between civilian industries and military industries. If these efforts are successful, we can even work on adding to our resource reserves. Should we succeed in fulfilling production targets, then we will be rewarded with a stronger industry. If we don't, we could face industrial failures and those who are responsible will be arrested."
 SOV_Post_4th_5_Year_Plan_Mission:0 "The Fourth Five-Year Plan"
 SOV_Post_4th_5_Year_Plan_Mission_desc:0 "The Fourth Five-Year Plan will be focused on rebuilding the country after the destructive conflict. Should we succeed in fulfilling production targets, then we will be rewarded with a stronger industry. If we don't, we could face industrial failures and those who are responsible will be arrested."
