 #Game rules
 SOV_2RCW_Surrogate_Idea:0 "Intense Factional Divides"
 SOV_2RCW_Surrogate_Idea_desc:0 "The recent wave of arrests have revealed factional interests within the Communist Party and the Red Army. Though not the same alleged factions that the public is used to hearing about, we nonetheless have to live with their existance."