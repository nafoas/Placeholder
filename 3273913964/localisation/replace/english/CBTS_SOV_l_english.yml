 SOV_social_dissatisfaction:0 "Social Dissatisfaction"
 SOV_social_dissatisfaction_desc:0 "Lack of housing for peasants coming to the city, consumer shortages, lack of economic opportunity, and the brutal methods of collectivization have caused a general distaste for the regime. In addition, the constant war against imagined class enemies have alienated many former \"Burzhui\" and their families."
