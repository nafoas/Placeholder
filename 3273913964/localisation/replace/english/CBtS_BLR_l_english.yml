 BLR_Dual_Government:0 "Military-Rada Power-Sharing"
 BLR_Dual_Government_desc:0 "The power-sharing agreement between the Pro-Balakovich Miltary Confederacy and the Anti-Balakovich Rada is so far working to allow both groups to cooperate, but makes political processes tedious and policy debates strenuous."
