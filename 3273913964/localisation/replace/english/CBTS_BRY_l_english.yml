 #events
 ##internal
 bry_internal.1.t:0 "Assessing the Situation"
 bry_internal.1.d:0 "Secretary Yerbanov, above all things, is a politician. So it’s not surprising that what consumes his thoughts the most, is the current, and chaotic politics of the Buryat-Mongol ASSR. Yerbanov has exploited chaos consuming the Soviet Union, and has essentially made the ASSR completely independent from the Union. However, there are many difficulties plaguing Yerbanov’s efforts. On one hand, the Buryat-Mongolian Regional Committee of the Communist Party has been rather uncooperative as of late. Members of the Committee are either in blatant opposition to Yerbanov’s recent maneuvers, or are hesitant to offer their support to the Secretary. On the other hand, many members of the populace are sympathetic to the vile reactionaries we are fighting. Simply put, this situation cannot be tolerated."
 bry_internal.1.a:0 "There Will be Much Work Ahead"
 bry_internal.2.t:0 "Wrangle the Committee"
 bry_internal.2.d:0 "This morning, Secretary Yerbanov addressed the Committee. In his address, spoke of the “struggle against the bourgeoisie”, the “spirit of the working class”, and the “importance of maintaining socialist ideals”. Finally, Yerbanov concluded his speech by pronouncing, “In these dire times, there are few things more important than loyalty. For as we all know, a disloyal member of Lenin’s party is no better than the liberals and fascists we fight against! Unpatriotic members of the Party deserve to be slaughtered!” With that the Committee erupted in applause. Perhaps it was because the speech was so excellent, or perhaps it was out of fear of the armed guards..."
 bry_internal.2.a:0 "Undoubtedly the Former!"
 bry_internal.3.t:0 "Purge the Reactionaries!"
 bry_internal.3.d:0 "Some were removed from their positions. Some were demoted. Some simply disappeared. There is no one who doubts this is the work of Secretary Yerbanov and his cronies. Allegedly, this is to remove “bourgeoisie sympathizers”, but many believe that the purge is a just a convenient way for Yerbanov to remove any potential opponents and rivals. Of course, it’s not as if they are going to say this out loud, lest they be deemed “bourgeoisie sympathizers”."
 bry_internal.3.a:0 "We Must Defend the Revolution..."
 bry_purge.tt:0 "§RIt will take some time for the purge to complete.§!\n"
 bry_internal.4.t:0 "Purge Complete"
 bry_internal.4.d:0 "With the reactionaries hidden within the party dealt with, and new, patriotic members having taken their places, we can now safely say that the purge is complete. No longer will traitorous elements within the party threaten to destroy everything threaten everything we stand for! Comrade Yerbanov stands triumphant!"
 bry_internal.4.a:0 "Excellent"
 bry_internal.5.t:0 "Yerbanov’s Speech"
 bry_internal.5.d:0 "Standing upon a podium, Yerbanov looks at the small crowd before him. He begins by proclaiming, \"The enemies of the working people, the landowners and capitalists say that the workers and peasants cannot live without them. "If it were not for us," they say, "there would be nobody to maintain order, to give out work, and to compel people to work. If it were not for us everything would collapse, and the state would fall to pieces. We have been driven away, but chaos will bring us back again.\" But this sort of talk by the landowners and capitalists will not confuse, intimidate, or deceive the workers and peasants. An army needs the strictest discipline; nevertheless the class-conscious workers succeeded in uniting the peasants, succeeded in taking the old tsarist officers into their service, succeeded in building a victorious army.\" Yerbanov continued before concluding \"Labour discipline, enthusiasm for work, readiness for self-sacrifice, close alliance between the peasants and the workers-this is what will save the working people from the oppression of the landowners and capitalists forever.\"  Many in the crowd agreed it was a good speech, but some thought it sounded strikingly familiar..."
 bry_internal.5.a:0 "A Wonderful Speech!"
 bry_internal.6.t:0 "Offer Compromises?"
 bry_internal.6.d:0 "\"By compromising and loosening restrictions, we can turn the public to our side!\" one yells. \"That would make us no better than the capitalists and reactionaries we are fighting!\" another replies. \"We cannot concern ourselves with frivolous issues when our survival is at stake!\" the first retorts. The debate within the Committee has continued like this for what seems like eons. Realizing a descision must be reached soon, and with his patience wearing dangerously thin, Yerbanov loudly calls for silence. He takes the stand and announces..."
 bry_internal.6.a:0 "\"...We Will Do What is Necessary\""
 bry_internal.6.b:0 "\"...We Cannot Sacrifice Our Ideals\""
 bry_internal.7.t:0 "Buryatia Requests Assistance"
 bry_internal.7.d:0 "Buryatia wants military aid from us. How should we respond"
 bry_internal.7.a:0 "Send Weapons and Troops"
 bry_internal.7.b:0 "Only Send Weapons"
 bry_internal.7.c:0 "We Don't Owe Them Anything"
 bry_internal.8.t:0 "Mongolia Sends Troops and Equipment!"
 bry_internal.8.d:0 "The Mongolians have graciously decided to assist us by sending us soldiers and equipment! Their generosity is most appreciated!"
 bry_internal.8.a:0 "Their Support is Appreciated!"
 bry_internal.9.t:0 "Mongolia Sends Equipment!"
 bry_internal.9.d:0 "The Mongolians have graciously decided to assist us by sending us equipment! Their generosity is most appreciated!"
 bry_internal.9.a:0 "Their Support is Appreciated!"
 bry_internal.10.t:0 "Mongolia Refuses to Help!"
 bry_internal.10.d:0 "The Mongolians have foolishly denied our humble plea for assistance! They will regret this!"
 bry_internal.10.a:0 "We Didn't Need Them Anyway!"
 bry_internal.11.t:0 "The USSR Reasserts Control!"
 bry_internal.11.d:0 "After giving the central government a multitude of concessions, the Soviet Union has garnered enough influence over us to partially reassert their authority. While we still retain some autonomy over the affairs the Buryat-Mongol ASSR, we have lost our de facto independence from the central Soviet government."
 bry_internal.11.a:0 "I See..."
 ##External
 bry_external.1.t:0 "Buryatia Requests Industrial Support"
 bry_external.1.d:0 "The government of the Mongol-Buryat ASSR has approached us with an offer. They would like us to send them tools, and expertise that will allow them to increase their production capabilities. In return, they are offering us more control over their military industry. This could prove an excellent oppurtunity to expand our influence over the ASSR. How should we respond?"
 bry_external.1.a:0 "Together for Victory!"
 bry_external.1.b:0 "Why Should We Help Them?"
 bry_external.2.t:0 "The Soviet Union Accepts!"
 bry_external.2.d:0 "The Soviet Union has decided to accept our request and has sent us the industrial aid we asked for!"
 bry_external.2.a:0 "Very Good"
 bry_external.3.t:0 "The Soviets Refuse!"
 bry_external.3.d:0 "The Soviet Union has denied our completely reasonable proposal, and has refused to render any assistance!"
 bry_external.3.a:0 "Curse Them!"
 bry_external.4.t:0 "Buryatia Wants Engineering Assistance"
 bry_external.4.d:0 "The Buryat-Mongol ASSR has sent us a request asking for engineering assistance. The ASSR is requesting Soviet engineers along with construction equipment in order to increase their construction capabilities. For this, the Buryat-Mongol ASSR is offering greater control over their economy. With this being a golden opportunity to reassert our influence over Buryatia, how should we reply?"
 bry_external.4.a:0 "We Shall Help Them"
 bry_external.4.b:0 "We Have Other Concerns"
 bry_external.5.t:0 "Moscow Agrees to Help"
 bry_external.5.d:0 "The Soviet Union has decided to accept our request and has sent us the engineers and the equipment we requested!"
 bry_external.5.a:0 "Hurrah!"
 bry_external.6.t:0 "Buryatia Offers Resource Rights"
 bry_external.6.d:0 "Buryatia has sent us an interesting proposal. In exchange for improving their excavation and mining capabilities, Buryatia will give us expanded resource rights. Buryatia is rather rich in resources, so their offer is indeed worth considering."
 bry_external.6.a:0 "An Excellent Idea"
 bry_external.6.b:0 "Completely Unacceptable!"
 bry_external.7.t:0 "The USSR Accepts Our Offer"
 bry_external.7.d:0 "The USSR has agreed to our proposition. In return for resource rights, the USSR will provide was with the necessary resources in order to expand our mining and excavation efforts."
 bry_external.7.a:0 "Wonderful"
 bry_external.8.t:0 "Buryatia Requests Military Officers"
 bry_external.8.d:0 "The Buryat-Mongol ASSR has sent us a request for officers who would presumably lead their militias and serve as advisors. While there is not direct benefit for us, it would assist the Buryat-Mongol ASSR in their war efforts, and would allow us to increase our influence over the ASSR."
 bry_external.8.a:0 "We Must Help Them!"
 bry_external.8.b:0 "They Don't Need Our Help"
 bry_external.9.t:0 "Moscow Sends Officers"
 bry_external.9.d:0 "The central government has agreed to send us some officers! Their experience and expertise will prove a significant boon for us!"
 bry_external.9.a:0 "We Fight Together!"
 #decisions
 BRY_2RCW_decs:0 "Soviet Aid"
 BRY_2RCW_decs_desc:0 "While the central Soviet government is currently occupied with affairs further west, our unique position puts us in an excellent position to bargain with the USSR. In return for concessions, we are able to request aid from the USSR, which would allow us to better protect Buryatia, and potentially the rest of Siberia, from the capitalists and fascists. We should be careful however, giving to many concessions to the central government will result in us losing our de facto autonomy from the USSR."
 BRY_soviet_industrial_support:0 "Request Soviet Industrial Support"
 BRY_soviet_construction_support:0 "Request Soviet Engineers"
 BRY_soviet_excavation_support:0 "Offer the USSR Mining Concessions"
 BRY_soviet_army_support:0 "Request Soviet Military Officers"
 BRY_loss_of_autonomy:0 "Imminent Loss of Autonomy!"
 #focuses
 ##politics
 BRY_2RCW_Politics_Start:0 "Assessing the Situation"
 BRY_2RCW_Politics_Start_desc:0 "In order to more effectively combat the reactionaries and bourgeoisie that threaten the revolution, Comrade Yerbanov asserted his control over the Buryat ASSR! However, there are countless threats within Buryatia that threaten Secretary Yerbanov’s glorious defense of the working-class! We must address them!"
 BRY_2RCW_Help_from_USSR:0 "Look to Moscow"
 BRY_2RCW_Help_from_USSR_desc:0 "While we are de facto independent from the Soviet Union, we are still technically a de jure part of it, making us entitled to support from the Union. However, in these dire times, the central government is unlikely to aid us out of the goodness of their hearts. Perhaps if we offer them concessions, they will be more willing to help?"
 BRY_assistance:0 "§YWe can now request assistance from the USSR.§!\n"
 BRY_2RCW_Wrangle_the_Committe:0 "Wrangle the Committee"
 BRY_2RCW_Wrangle_the_Committe_desc:0 "The Buryat-Mongolian Regional Committee of the Communist Party is the highest authority of the Buyrat-Mongol ASSR. While normally a functioning part of the Union, recent events have sent the committee into a panic, causing the government of the ASSR rather dysfunctional to say the least. Furthermore, there are some members who accuse Yerbanov of taking advantage of the chaos to expand his power and influence. This state of affairs can no longer be tolerated. It’s time for Comrade Yerbanov to whip those ninnies into shape!"
 BRY_2RCW_Appoint_Commissars:0 "Appoint Commissars"
 BRY_2RCW_Appoint_Commissars_desc:0 "There are undoubtedly some inside the ASSR who support the reactionary and fascist ideas of the traitors fighting to destroy the union. As such, we should begin appointing commissars who will eliminate these dangerous elements and prevent them from spreading their degenerate ideas."
 BRY_2RCW_Purge_Dissidents:0 "Purge Dissidents"
 BRY_2RCW_Purge_Dissidents_desc:0 "Despite our best efforts, there are still individuals who oppose Comrade Yerbanov and his righteous cause! It is time for us to take drastic measures against this cancer that plagues Buryatia! We must purge those who dare fight against the will of the working class people, and ensure they never pose a threat again!"
 BRY_2RCW_Cement_the_Party:0 "Cement Control Over the Party"
 BRY_2RCW_Cement_the_Party_desc:0 "Now that the reactionaries have been purged, and the party’s loyalty ensured, it is time for First Secretary Yerbanov to fully solidify his control over the Buryat-Mongol ASSR. Only a strong leader can ensure that the revolution is protected from the oppressive monarchists, the degenerate liberals, and the evil fascists who wish to destroy it! Glory to Comrade Yerbanov!"
 BRY_2RCW_Call_on_the_people:0 "Call on the People"
 BRY_2RCW_Call_on_the_people_desc:0 "Much of the Buryatia’s population is rather apathetic to our cause. To many, there is no difference between our righteous government and the filthy and treasonous reactionaries that oppose us. This situation obviously cannot be tolerated. Perhaps a speech and some propaganda could change their minds?"
 BRY_2RCW_Patriotic_Compromises:0 "Patriotic Compromises"
 BRY_2RCW_Patriotic_Compromises_desc:0 "As the war drags on, some of Buryatia’s population is beginning to drift towards the reactionary ideas of the enemy. As party members scrambled for a solution for this dangerous trend, a small faction of party members put forward a radical proposal. They suggest that many of restrictions placed upon the populace be removed. Churches should be opened, and state censorship should be restricted. Needless to say this sparked a rather heated debate within the committee. Yet whatever the outcome, whether this proposal is accepted or rejected is up to one man, Secretary Yerbanov."
 BRY_2RCW_Against_the_Reactionaries:0 "Against the Reactionaries"
 BRY_2RCW_Against_the_Reactionaries_desc:0 "The enemy draws ever closer!  The fascists know no mercy! They will burn your homes, slaughter your families, and steal your belongings! They must be defeated at all costs! Death to the reactionaries!"
 BRY_2RCW_Help_from_Mongolia:0 "Request Assistance from Mongolia"
 BRY_2RCW_Help_from_Mongolia_desc:0 "With Moscow more or less preoccupied, the support they offer turns out to be fickle and costly. Fortunately, our socialist brethren, the Mongolians, are a much closer alternative. Perhaps if we request some military aid from them, they will be willing to assist us?"
 BRY_2RCW_Yerbanov_is_gud:0 "Hooray for Secretary Yerbanov!"
 BRY_2RCW_Yerbanov_is_gud_desc:0 "In these times of crisis, a strong leader is required, one who can destroy the enemy, and guide the people to victory. Fortunately, we have just the man for the job, Comrade Yerbanov! He protects the Union from the evil reactionaries, he strives to fulfill the will of the people, and avidly follows the teachings of Marx and Lenin! So three cheers for Secretary Yerbanov, hero of the revolution!"
 ##economy
 BRY_2RCW_Economics_Start:0 "Preparing the Economy for War"
 BRY_2RCW_Economics_Start_desc:0 "It is a sad fact that our economy is woefully underprepared for this war. While our resources are rather lacking, we must dedicate everything to the war! Victory must be gained no matter the cost, for the alternative is infinitely worse..."
 BRY_2RCW_Study_Soviet_methods:0 "Modernize Industrial Methods"
 BRY_2RCW_Study_Soviet_methods_desc:0 "By modernizing our production methods, we can make our industry far more efficient then it is now! In this struggle we must maximize the potential of our capabilities, and defeat the reactionary menace!"
 BRY_2RCW_Emergency_Factories:0 "Emergency Factories"
 BRY_2RCW_Emergency_Factories_desc:0 "Buryatia is not an industrial powerhouse, that is an unarguable fact. This leaves us greatly crippled when fighting more developed opponents. However, a plan has been presented to the committee that entails appropriating various buildings and converting them to makeshift factories. While not a permanent solution, it is a first step towards alleviating our economic issues, and transforming Buryatia into a modern communist society!"
 BRY_2RCW_Draft_Laborers:0 "Draft Laborers"
 BRY_2RCW_Draft_Laborers_desc:0 "It’s common sense that a factory cannot be run without a workforce. Regrettably, most of our able adult male population has been sent off to battle. However, some party members have pointed out that we still have a substantial population of nonworking or women, elderly, and youths. Perhaps we can “convince” them to serve in the factories?"
 BRY_2RCW_Increase_Farm_Quotas:0 "Increase Farm Quotas"
 BRY_2RCW_Increase_Farm_Quotas_desc:0 "In order for our army and workforce to function properly, we need more food. How do we acquire more food? How do we acquire more food you ask? Simple! Increase the agricultural quotas and put those lazy peasants to work!"
 BRY_2RCW_Issue_Rations:0 "Issue Rations"
 BRY_2RCW_Issue_Rations_desc:0 "To prevent food shortages, and to ensure proper supplies towards the war effort, all available foodstuffs are to be rationed from this point on. Products such as bread, eggs, sugar, tea, butter, meat, and oil are to be supplied in limited amounts. "
 BRY_2RCW_Work_the_Mines:0 "Work the Mines"
 BRY_2RCW_Work_the_Mines_desc:0 "Buryatia has a surprising wealth of minerals, ranging from gold, to tungsten. Increasing our mining efforts would be excellent method of boosting Buryatia’s industrial capability, thus boosting our economy. Soon, Buryatia will be transformed from a backwater to a modern socialist society!"
 BRY_2RCW_Towards_Modernization:0 "Towards Modernization"
 BRY_2RCW_Towards_Modernization_desc:0 "Thanks to the Party’s efforts, Buryatia is beginning to develop a modern economy! The ASSR’s industrial, mining, and agricultural output have all increased dramatically! After we triumph over the traitors and fascists, Buryatia will no doubt be one of the most prosperous regions in the entirety of the USSR! Three cheers for the Party! Three cheers for Yerbanov!"
 BRY_merge_ideas:0 "§YAll economic ideas will be merged.§!\n"
 ##military
 BRY_2RCW_Military_Start:0 "Prepare the Militia"
 BRY_2RCW_Military_Start_desc:0 "The militias we have thrown together at the onset of the war are poorly trained and underequipped. Nonetheless, we must take steps to insure that the militia is prepared as much as possible. Conducting basic training and appointing officers are a crucial first step to building a proper army."
 BRY_2RCW_fortify_Ulan_Ude:0 "Fortify Ulan Ude"
 BRY_2RCW_fortify_Ulan_Ude_desc:0 "Ulan-Ude is the largest city, and the capital or the Buryat-Mongol ASSR. Losing the city would be a deathblow to our war efforts. To ensure this does not happen, the committee has put forward a plan to construct basic fortifications in and around Ulan-Ude. The fortifications are not impressive by any means but it is better than letting the enemy waltz into the city."
 BRY_2RCW_New_Guns:0 "Study New Firearms"
 BRY_2RCW_New_Guns_desc:0 "By importing new rifle models and reverse engineering them, we may be able to gain new insight and improve the effectiveness of our rifles. Superior weapons would give us a crucial advantage against the enemy."
 BRY_2RCW_Auxillary_Units:0 "Establish Auxillary Units"
 BRY_2RCW_Auxillary_Units_desc:0 "Creating auxiliary battalions would be an excellent way to strengthen our militia. It would also make our militia less of a shambled together, poorly trained force, and more of an actual army."
 BRY_2RCW_Organize_Command:0 "Organize the Command Structure"
 BRY_2RCW_Organize_Command_desc:0 "With the chain of command throw into confusion by the civil war, many officers simply do not know who to take orders from. With the central government preoccupied, we must build a new chain of command, one that answers directly and only to Ulan-Ude."
 BRY_2RCW_Disciplinary_Measures:0 "Disciplinary Measures"
 BRY_2RCW_Disciplinary_Measures_desc:0 "Currently the militia is made up of mostly conscripted individuals not used to taking direct orders. As one would expect, their discipline is absurdly poor. This situation is completely unacceptable, poor discipline cannot be tolerated in a proper army! It’s time to transform those good for nothing layabouts into a proper fighting force!"
 BRY_2RCW_Study_Tactics:0 "Implement Soviet Strategies"
 BRY_2RCW_Study_Tactics_desc:0 "By studying the strategies and tactics used by the Soviet Red Army in the First Russian Civil War, we could very easily improve on the strategies and tactics we currently use."
 BRY_2RCW_Workers_Militia:0 "The Workers Militia"
 BRY_2RCW_Workers_Militia_desc:0 "Rise workers of Buryatia! Fight for the Union! Fight for the revolution! Fight for your homes! Against the bourgeoisie! Against the reactionaries! Against the fascists! The spirit of the people will carry you to victory!"
 BRY_militia:0 "§YTwo militia divisions will be deployed.§!\n"
 BRY_2RCW_Riders_of_the_Revolution:0 "Riders of the Revolution"
 BRY_2RCW_Riders_of_the_Revolution_desc:0 "Before the arrival of the Russian Empire, the Buryat people were mainly semi-nomadic herders, and skilled horse riders. Even after the Russian Empire established dominance over Siberia, Buryats were renowned for their horse riding skills. Buryat horsemen were commonly found in the Amur Cossacks, and during the First Russian Civil War, many Buryats fought for the Whites, led by leaders like the infamous Ungern-Sternberg. With all this in mind, perhaps it is time for us to enlist these horse riding skills for ourselves. Soon, reactionaries everywhere will come to fear the Riders of the Revolution!"
 BRY_cavalry:0 "§YOne cavalry division will be deployed.§!\n"
 