 #events
 RKB_internal.1.t:0 "Degrelle forms the Formations de Combat"
 RKB_internal.1.d:0 "Following our conquest of Belgium, Leon Degrelle, the leader of the Parti Rexiste has formed a paramilitary unit to assist us in policing the new territory. Composed of members of Rex, the unit is of a heterogeneous mixture, with veterans of combat mixed in amidst ideologues and party thugs. Whatever its quality, the formation of the unit is a signal that not all Belgians will oppose our occupation, a fact solidified by Degrelle's offer to raise other paramilitary units in support of Germany. At the same time, other Nationalist organizations are scrambling to find ways of also demonstrating their support, including providing troops of their own."
 RKB_internal.1.a:0 "We thank him for his cooperation."
 
 reichkom.300.t:0 "The Generalgouvernement"
 reichkom.300.d:0 "Our rule over Poland is now secure. While the Northeastern regions of the former Polish Republic will be integrated into the Reich, the Central region, with the cities of Krakow and Warsaw, shall be integrated into a new General Government, that will oversee Germanization in the area. Let us set it up!"
 reichkom.300.a:0 "The Generalgouvernement is born!"
 
 reichkom.301.t:0 "The Administration of the Generalgouvernement"
 reichkom.301.d:0 "We need to make an important decision regarding the Generalgouvernement. While loyal party member Hans Frank was initially proposed as Governor, we also have the option of turning the territory over to either the Army or the SS. Who shall rule the Generalgouvernement?"
 reichkom.301.a:0 "The Party!"
 reichkom.301.b:0 "The Heer!"
 reichkom.301.c:0 "The SS!"
 
 reichkom.302.t:0 "Our Germanization Policy"
 reichkom.302.d:0 "After creating the Generalgouvernement, we now must decide its Germanization policy. We can either pursue a colonization strategy, according to the Nazi ideology, or a policy of assimilation that would be better for the stability of the territory. What should we do?"
 reichkom.302.a:0 "Colonization!"
 reichkom.302.b:0 "Assimilation!"
 
 reichkom.303.t:0 "Status of Collaborators"
 reichkom.303.d:0 "As with all occupied territories, we now have the question of the collaborators in our hands. We can promote them and let the participate in the Generalgouvernement administration, or pursue a german-only policy. What should we choose?"
 reichkom.303.a:0 "Only Germans will rule the territory!"
 reichkom.303.b:0 "We must seek some local allies"
 
 reichkom.304.t:0 "The Occupation of Eastern Galicia"
 reichkom.304.d:0 "Our troops have managed to occupy the region of Eastern Galicia, a former Polish region that was taken over by the Soviets. Now we must decide what to do with this territory."
 reichkom.304.a:0 "The Generalgouvernement will administer the area"
 reichkom.304.b:0 "Give it to RK Ukraine"

 reichkom.310.t:0 "The Reichskommissariat Ostland"
 reichkom.310.d:0 "Our rule over the Baltic states is now secure. We must integrate these areas into the Reich by creating a Reichskommissariat, the RK Ostland, that will administer and germanize the area. The inclusion of Belarus into this RK is also within the Führer's plans..."
 reichkom.310.a:0 "The RK Ostland is born!"
 
 reichkom.311.t:0 "The Administration of the RK Ostland"
 reichkom.311.d:0 "We need to make an important decision regarding the RK Ostland. While loyal party member Hinrich Lohse was initially proposed as Reichskommissar, we also have the option of turning the territory over to either the Army or the SS. Who shall rule the RK Ostland?"
 
 reichkom.312.t:0 "Our Germanization Policy"
 reichkom.312.d:0 "After creating the RK Ostland, we now must decide its Germanization policy. We can either pursue a colonization strategy, according to the Nazi ideology, or a policy of assimilation that would be better for the stability of the territory. What should we do?"
 
 reichkom.313.t:0 "Status of Collaborators"
 reichkom.313.d:0 "As with all occupied territories, we now have the question of the collaborators in our hands. We can promote them and let the participate in the RK Ostland administration, or pursue a german-only policy. What should we choose?"
 
 reichkom.320.t:0 "The Reichskommissariat Ukraine"
 reichkom.320.d:0 "With Western Ukraine firmly in our hands, and our troops marching east, we need to set up a new administrative unit for these new lands. As we had planned before the invasion, a Reichskommissariat Ukraine will be set up in Western Ukraine and Southern Belarus, that will receive lands in Eastern Ukraine as we conquer them."
 reichkom.320.a:0 "Sieg Heil!"
 
 reichkom.324.t:0 "The Occupation of Odessa"
 reichkom.324.d:0 "The port of Odessa, and its neighbouring regions, are now firmly under our control. We need to decide if we should incorporate these areas into the Reichskommissariat Ukraine, or let the Romanians have it..."
 reichkom.324.a:0 "Give the area to Romania"
 reichkom.324.b:0 "The RK Ukraine will manage the region"

 GER_given_odessa: "Given Odessa"
 GER_refused_give_odessa: "Refused to give Odessa"
 
 reichkom.325.t:0 "The Occupation of Crimea"
 reichkom.325.d:0 "Our troops have finally managed to throw our enemies out of Crimea, and the peninsula is now in our hands. Several proposals have been made, but now the Führer must decide: what should be the status of Crimea under the Reich?"
 reichkom.325.a:0 "Crimea will be kept under direct control of the Reich."
 reichkom.325.c:0 "Give it to RK Ukraine, but keep Sevastopol under our direct control."
 reichkom.325.e:0 "Give Crimea to RK Ukraine."
 
 reichkom.330.t:0 "The Reichskommissariat Kaukasus"
 reichkom.330.d:0 "With the Northern Caucasus firmly in our hands, and our troops marching east, we need to set up a new administrative unit for these new lands. As we had planned before the invasion, a Reichskommissariat Kaukasus will be set up in the area, which will include all of Transcaucasia and Ciscaucasia, as well as parts of Southern Russia as far as the Volga river. The Civil administration of the territory (capital) will be set in Tbilisi."
 reichkom.330.a:0 "Sieg Heil!"
 
 reichkom.340.t:0 "The Reichskommissariat Moskowien"
 reichkom.340.d:0 "With Moscow firmly in our hands, and our troops marching east, we need to set up a new administrative unit for these new lands. As we had planned before the invasion, a Reichskommissariat Moskowien will be set up in the area, that will receive lands in Western Russia as we conquer them."
 reichkom.340.a:0 "The RK Moskowien is born!"
 
 reichkom.344.t:0 "The Occupation of the Don-Volga Region"
 reichkom.344.d:0 "With the conquests of Rostov, Stalingrad and Astrakhan, the Don-Volga region is now firmly in our hands. Although before the war we had planned to create a Reichskommissariat Don-Wolga, some ministers think that it is unnecessary and propose to give the land to other RKs. What should we do?"
 reichkom.344.a:0 "Split the area between RK Ukraine and Don-Wolga"
 reichkom.344.b:0 "Give everything to RK Ukraine"
 
 reichkom.346.t:0 "The Occupation of Karelia"
 reichkom.346.d:0 "Karelia is now in our hands, and the bolsheviks have been expelled from Kola and Olonets. Now we should decide what to do with the region, and consider our relations with the Finns."
 reichkom.346.a:0 "It is Finnish territory"
 reichkom.346.b:0 "Karelia will remain inside the Reich!"
 
