l_english:

 #Autonomies
 autonomy_reichskommissariat_cbts:0 "Reichskommissariat"
 autonomy_reichskommissariat_cbts_desc:0 "Reichskommissariat is the German designation for a type of quasi-colonial administrative territorial entity established in several occupied territories. While officially located outside the [GER.GetFlag][GER.GetName] in a legal sense, these entities are directly controlled by their supreme civil authorities, the Reichskommissars, who rule their assigned territories as German governors on behalf of and as direct representatives of [GER.GetLeader]"
 autonomy_reichsprotektorat_cbts:0 "Reichsprotektorat"
 autonomy_nibenland:0 "Outlying state"
 autonomy_reststaat:0 "Reststaat"

 already_doing_RK:0 "Already Forming a §YReichskommissariat§!"

 #Focus
 reichskommissariat_focus:0 "Reichskommissariat Focus"
 colonization_focus:0 "German Immigrants"
 assimilation_focus:0 "Assimilated Locals"
 cultural_traditions:0 "Cultural Traditions Maintained"
 RK_civil_admin:0 "Civil Administration"
 RK_mil_admin:0 "Military Administration"
 RK_ss_admin:0 "SS Administration"
 RK_ger_only:0 "German Administration"
 RK_locals_allowed:0 "Collaborators in Government"
 RK_colonization_start:0 "Germanization: Colonization"
 RK_colonization_start_desc:0 "To properly Germanize our territory, we must encourage settlers to immgirate from the Metropole. By according them preferential rights and integrating them into local society, we can eventually create conditions allowing for the full annexation of this territory into the Reich."
 RK_allow_german_investment:0 "Allow German Firms to Invest"
 RK_allow_german_investment_desc:0 "Investment by German firms into our administration's territory would further the quality of life for German immigrants seeking employment."
 RK_clear_land:0 "Clear Land for Farmers"
 RK_clear_land_desc:0 "Immigrant Farmers need space to set up their farms. Thus, we must clear out both natural and man-made barriers to expand our arable land."
 RK_immigration_office:0 "VoMi"
 RK_immigration_office_desc:0 "We must set up an a branch of the Volksdeutsche Mittelstelle, or Coordination Centre for Ethnic Germans, to accelerate Germanization of the territory."
 RK_begin_colonization:0 "Begin Colonization!"
 RK_begin_colonization_desc:0 "Now is the time for the German People to manifest their racial destiny by colonizing this territory! The work and perseverance settlers will ensure that Germany will be the dominant power in Europe!"
 RK_german_welfare:0 "Expand Welfare for Germans"
 RK_german_welfare_desc:0 "We must make sure that Ethnic Germans in this territory do not go hungry or poor by creating a robust welfare system to serve them."
 RK_propaganda_colonization:0 "Expand National Socialist Propaganda"
 RK_propaganda_colonization_desc:0 "Any Germans who live in this territory must be convinced of the party's primacy in our state, lest political subversives begin to organize against us."
 RK_children_for_germany:0 "Introduce the Mother’s Cross of Honour"
 RK_children_for_germany_desc:0 "The Mother’s Cross of Honour is a German Medal for women who have at least four children. We will start giving out this award as well, as a way to further natalist policy the local German population."
 RK_employment_office:0 "Create the Employment Office"
 RK_employment_office_desc:0 "If an immigrant does not have a job or cannot find work, we can find them a suitable occupation through the Employment Office."
 RK_import_german_machinery:0 "Import German Machinery"
 RK_import_german_machinery_desc:0 "We will import machine tools and equipment from the Metropole to improve our production capacity."
 RK_deutsche_arbeitsfront:0 "Bring in the Deutsche Arbeitsfront"
 RK_deutsche_arbeitsfront_desc:0 "A German Worker's Union branch should be opened in this territory to give us more control over local industry."
 RK_german_shipping_companies:0 "Invite German Shipping"
 RK_german_shipping_companies_desc:0 "We will begin a campaign to encourage German Shipping Companies to stop at our ports to stimulate the economy."
 RK_improve_german_living_conditions:0 "Construct Additional Housing"
 RK_improve_german_living_conditions_desc:0 "We need more housing for German Workers and settlers. We must begin building them at once!"
 RK_assimilation_start:0 "Germanization: Assimilation"
 RK_assimilation_start_desc:0 "To properly Germanize, we must \"re-educate\" the local population to speak German, follow German Customs, and most importantly, follow National Socialist ideology. If this territory's population is already Germanic, this should be a shortish process. Otherwise, it could take a really long time."
 RK_german_language_lessons:0 "German Language Lessons"
 RK_german_language_lessons_desc:0 "One of the goals of this administration is to teach the local population to speak German. With mandatory German lessons and exams, we can achieve this goal."
 RK_rewrite_school_curiculla:0 "National Socialism in Schools"
 RK_rewrite_school_curiculla_desc:0 "The Youth of this territory must be re-educated to follow National Socialist ideology. We will accomplish this by re-writing the school curricula."
 RK_decrease_power_of_church:0 "Co-opt the Church"
 RK_decrease_power_of_church_desc:0 "We decrease the power of the church in this territory, and for those more religious people, replace it with the Reich Church, eventually to be replaced."
 RK_german_street_signs:0 "German Street Signs"
 RK_german_street_signs_desc:0 "We will begin re-naming all the streets with German names, and replace the signs accordingly."
 RK_assim_propaganda:0 "Enforce National Socialist Ideology"
 RK_assim_propaganda_desc:0 "We must make sure that the assimilated locals follow National Socialism, whether they truly believe it or not!"
 RK_german_science:0 "German Science"
 RK_german_science_desc:0 "We will teach the people German Science, instead of religion. Of course, these lessons are full of ideological propaganda."
 RK_allow_local_buisness:0 "Allow Local Buisnesses"
 RK_allow_local_buisness_desc:0 "Local Buisness owners who can prove that they have at least mostly assimilated and follow National Socialism will be allowed to re-open their establishments. We hope that this would stimulate the economy."
 RK_ban_non_german_radio:0 "Promote German Radio Stations"
 RK_ban_non_german_radio_desc:0 "Right now, there are still some propaganda radio stations operating in the local language of this territory. From now on, German radio stations will be prefered!"
 RK_encourage_collaborators:0 "Encourage Membership in the Party"
 RK_encourage_collaborators_desc:0 "We would prefer that locals and assimilated locals joined the National Socialist party instead of local collaborator groups to cut down on factionalist influence."
 RK_reward_assimilators:0 "Citizenship for Assimilators"
 RK_reward_assimilators_desc:0 "If we reward assimilated locals with (at least partial) German citizenship, we can encourage people to work harder towards this goal!"
 RK_expand_welfare_for_assimilators:0 "Expand Welfare for Assimilators"
 RK_expand_welfare_for_assimilators_desc:0 "We can encourage people to assimilate quicker if we expand rations for the assimilated and their families."
 RK_cultural_traditions_start:0 "Maintain the Local Culture"
 RK_cultural_traditions_start_desc:0 "Instead of trying to Germanize the local culture, it would be more prudent to maintain the local customs and language, and sway the population to our side in other ways."
 RK_set_up_german_liason:0 "Establish German Attaché Office"
 RK_set_up_german_liason_desc:0 "Although the local population is being allowed to maintain their own culture, we still are state governed from Berlin. We must therefore set up an easy way for the German Bureaucracy to coordinate and manage the local territory and its inhabitants."
 GER_liason:0 "German Liason"
 RK_collaborationist_offices:0 "Collaborationist Offices"
 RK_collaborationist_offices_desc:0 "We need to set up official offices for the Collaborationist organizations of this territory, so that we may bolster the legitimacy of our governance."
 RK_collaborationist_buisnesses:0 "Support Collaborationist Buisnesses"
 RK_collaborationist_buisnesses_desc:0 "Establishments and Buisnesses loyal to Germany and National Socialism will have our continued financial support!"
 RK_add_german_as_official_language:0 "Establish German as an Official Language"
 RK_add_german_as_official_language_desc:0 "German will be made compulsory in schools, and will become a new official language in this territory!"
 RK_national_socialist_curricula:0 "Create a National Socialist Curriculum"
 RK_national_socialist_curricula_desc:0 "We will re-write the school curricula to infuse the next generation with National Socialist values and morality. This will legitimize both our ideology and government in the eyes of the younger generation and create a strong base of support."
 RK_pro_german_propaganda:0 "Produce Pro-German Propaganda"
 RK_pro_german_propaganda_desc:0 "Propaganda that tells the people exactly why working with Germany is good for their nation will help get the local population on our side!"
 RK_reenforce_local_culture:0 "Reinforce Local Culture"
 RK_reenforce_local_culture_desc:0 "By reinforcing aspects of the local culture, we can try to convince the local population that we are on their side."
 RK_anti_socialism:0 "Weed out Bolsheviks"
 RK_anti_socialism_desc:0 "We must convince the population to turn in Marxists and Bolsheviks to the authorities, lest they disrupt the social order."
 RK_local_conscription:0 "Conscript Collaborators"
 RK_local_conscription_desc:0 "We should open up service in the German Army for a few select collaborators who have proven their worth."
 RK_propaganda_newsreels:0 "Import Propaganda Newsreels"
 RK_propaganda_newsreels_desc:0 "By showing the local populace the strength of the German Army, we can come to convince the local populace of the inevitability of the occupation."
 RK_civil_administration:0 "Civil Administration"
 RK_civil_administration_desc:0 "This territory will be governed by civilian bureaucrats instead of military officers."
 RK_german_beauraus:0 "Introduce German Bureaucrats"
 RK_german_beauraus_desc:0 "We are ready to bring in German Bureaucrats to run this administration."
 RK_limited_military_presence:0 "Restore Civilian Policing"
 RK_limited_military_presence_desc:0 "We need to reintroduce civilian policing to the territory, to emphasize our long-term presence and calm the population."
 RK_military_administration:0 "Military Administration"
 RK_military_administration_desc:0 "This territory will be governed by military officers instead of civilian bureaucrats."
 RK_local_barracks:0 "Local Bases"
 RK_local_barracks_desc:0 "We will set up some auxillery bases to make sure that our soldiers can respond to any disturbance or invasion."
 RK_expanded_military_presence:0 "Expanded Military Presence"
 RK_expanded_military_presence_desc:0 "We need to make sure that any resistance is crushed by increasing the amount of military police there are in this territory."
 RK_ss_attache:0 "SS Attaché"
 RK_ss_attache_desc:0 "No matter which administration style was chosen for this territory, we still have to allow the SS some room to work here."
 RK_encourage_collaboration:0 "Encourage Collaborators"
 RK_encourage_collaboration_desc:0 "We need to encourage at least some percentage of the population to collaborate with our administration."
 RK_german_gaultiers:0 "German Gaultiers"
 RK_german_gaultiers_desc:0 "No matter the administration, the new Gaus need German oversight!"
 RK_hunt_down_resistance:0 "Crush any Resistance"
 RK_hunt_down_resistance_desc:0 "We need to try and crush any resistance to the occupation of this territory!"
 RK_streamline_bureaucracy:0 "Streamlined Bureaucracy"
 RK_streamline_bureaucracy_desc:0 "A Streamlined and well-oiled bereaucracy is necessary to make this administration function!"
 RK_ss_administration:0 "Schutzstaffel Administration"
 RK_ss_administration_desc:0 "Instead of Civilian or Military Bereaucrats, the SS will be ruling this territory!"
 RK_set_up_ss_office:0 "Create SS Offices"
 RK_set_up_ss_office_desc:0 "We will set up local branches of the SS in all areas of the country!"
 RK_eliminate_resistance:0 "Eliminate Resistance"
 RK_eliminate_resistance_desc:0 "A Campaign of Terror is needed to root out any resistance in this territory!"
 RK_racial_laws:0 "Promulgate Racial Laws"
 RK_racial_laws_desc:0 "We need to implement strict racial laws to ensure Germanic Supremacy in this territory!"
 RK_deny_welfare:0 "Deny Welfare"
 RK_deny_welfare_desc:0 "Only Germans will be allowed Welfare in this territory!"
 RK_recruit_officers:0 "Recruit SS Officers"
 RK_recruit_officers_desc:0 "Any German that can prove that they are pure Germans can join the SS!"
 RK_spartan_society:0 "A Spartan Society"
 RK_spartan_society_desc:0 "According to the SS and Himmler, in a pure society, only the strong survive. We shall set up to create a society reminiscant of the old Spartan State!"
 RK_german_only_administration:0 "German-Only Administration"
 RK_german_only_administration_desc:0 "Aside from a few exceptional collaborators, this administration will only be run by Germans."
 RK_ceremonial_titles:0 "Ceremonial Titles"
 RK_ceremonial_titles_desc:0 "We will give out ceremonial titles to appease high-ranking collaborators, and make sure they do not interfere with our administration."
 RK_replace_provinces:0 "Provinces into Gaus"
 RK_replace_provinces_desc:0 "We will replace the term \"Province\" with the term \"Gau\", to help people recognize that this territory is now part of the Reich."
 RK_allow_locals:0 "Allow Collaborators into Government"
 RK_allow_locals_desc:0 "We will have a joint German-Local administration to appease the people."
 RK_legitimize_government:0 "Legitimize Government"
 RK_legitimize_government_desc:0 "We will make efforts to change the minds of the people, and see that our administration of this territory is justified."
 RK_facilitate_cooperation:0 "Facilitate Cooperation"
 RK_facilitate_cooperation_desc:0 "Some German and Collaborationist administrators do not trust the other \"side\" yet. We must teach them to trust each other, to increase efficiency!"
 RK_local_police:0 "Allow Local Police"
 RK_local_police_desc:0 "We need to allow at least a small amount of the local population to serve as a tightly-monitored police force, to calm the local populace."
 RK_raise_local_ss:0 "Establish Local SS Divisions"
 RK_raise_local_ss_desc:0 "Some of the local population are already Aryan enough where they can serve our government. We should take advantage"
 RK_placate_collaborators:0 "Placate Collaborators"
 RK_placate_collaborators_desc:0 "We should give concessions to collaborators in our territory, to maintain their support for our government."
 RK_train_translators:0 "Train Translators"
 RK_train_translators_desc:0 "We need more translators to make sure that the local administration is able to coordinate effectively."
 RK_german_clubs:0 "Build Officer Clubs"
 RK_german_clubs_desc:0 "We need to build German-Only Officers' Clubs to make sure our officers have a place to relax."
 RK_replace_mayors:0 "Replace Mayors with Collaborators"
 RK_replace_mayors_desc:0 "While we cannot trust the Collaborators with full governorships, we can give them administrative control of many cities and towns."
 RK_exploit_ethnic_divisions:0 "Exploit Ethnic Divisions"
 RK_exploit_ethnic_divisions_desc:0 "We should exploit ethnic divisions within this territory to keep the local population divided. If they unite, this may well destabilize our whole administration."
 RK_begin_reconstruction:0 "Begin Reconstruction"
 RK_begin_reconstruction_desc:0 "Now that the war is over, we should begin to rebuild both the economy and our society to recover from the hardships of war."
 RK_begin_economic_recovery:0 "Restructure the Economy"
 RK_begin_economic_recovery_desc:0 "Having rebuilt our territory, we can now re-organize it to better meet the needs of the Metropole."
 RK_lesser_military_presence:0 "Lessen Military Presence"
 RK_lesser_military_presence_desc:0 "Now that we are at peace, we do not need that many soldiers marching around. The police however, will stay."
 RK_loosen_restrictions:0 "Loosen Restrictions"
 RK_loosen_restrictions_desc:0 "Loosening restrictions while at peace would placate the populace, and possibly decrease resistance activities."
 RK_increase_rations:0 "Increase Rations"
 RK_increase_rations_desc:0 "We can now increase Rations due to lack of wartime necessity."
 RK_absorb_collaborators:0 "Absorb Collborationist Organizations"
 RK_absorb_collaborators_desc:0 "Now that we have full control over this territory, we don't need the Collaborationists anymore. They will all join the Party, or else..."
 RK_reconstruction_complete:0 "Complete Reconstruction!"
 RK_reconstruction_complete_desc:0 "Now that society has been restructured, we can declare reconstruction complete!"
 
 #Decisions
 GER_RK_Forming_cat:0 "The Governance of the Occupied Territories"
 GER_annex_alsace_lorraine: "Annex Elsaß-Lothringen"
 GER_BEL_RK_occupied:0 "The Occupation of Belgium"
 GER_NED_RK_occupied:0 "The Occupation of the Netherlands"
 GER_annex_LUX:0 "Annex Luxemburg into the Reich"
 GER_annex_LUX_desc:0 "Some months ago a military administration of Luxembourg was set up, with Luxembourgish interests being represented by a governmental commission consisting of senior civil servants under Albert Wehrer. In the following days, several deputies and high-ranking civil servants tried to reach an agreement with us about Luxembourg retaining autonomy under the military administration, but they were rejected. We see the Grand Duchy as an ethnically Germanic land and thus it will be incorporated into the Reich!\n\nThe military authorities will leave Luxembourg to be replaced by a civil administration under Gustav Simon, the Gauleiter of Gau Trier-Koblenzthe. Gustav has promised to carry out a Germanisation and Nazification campaign in Luxembourg, as he told the Führer that \"the German-ness of the Luxembourgers merely lays under a thin external layer of French influence and with a bit of determined \"unraveling\" by his administration, the German character of the population would eventually reveal itself\"."
 LUX_annexation_tt:0 "§CLuxembourg§! §Ywill be incorporated into the§! §RReich§! [GER.GetFlag] §Yas the§! §RdZ-Gebiet Luxemburg§!."
 GER_merge_flandern_and_niederlande:0 "Unite the Dutch Peoples"
 
 #Ideas
 RK_Party_Resistance_Supression:0 "Civilian Administration"
 RK_Party_Resistance_Supression_desc:0 "Policing in this administration bears a resemblance to that which could can be seen in Germany proper. The local population are less aggrieved and prone to open resistance, but our ability to decisively crack down on it is weakened as well."
 RK_SS_Resistance_Supression:0 "SS Administration"
 RK_SS_Resistance_Supression_desc:0 "Policing in this administration is handled by the Schutzstaffel rather than the general party apparatus. This arrangement aggravates the local population but allows for firmer control, and a solid, consolidated base of collaborators with our regime."
 RK_Military_Resistance_Supression:0 "Military Administration"
 RK_Military_Resistance_Supression_desc:0 "Policing in this administration is handled by the Military Police and its auxiliaries. The application of Martial Law allows for the firmest control of the occupied territory at the cost of preventing accomodation with the locals."
 
 #Events
 reichkom.11.t:0 "The Occupation of Belgium"
 reichkom.11.d:0 "My Führer, now that Belgium is under our control the military staff has asked to establish an interim occupation authority. The military administration would rely on both military and civilian components to govern occupied Belgium. Accordingly, Alexander von Falkenhausen would be the Militärbefehlshaber (Military Commander) and Eggert Reeder the Militärverwaltungsstab (Military Administrative Staff). Such territorial unit would include Belgium and the French departments of Nord and Pas-de-Calais, with the administration also being responsible for governing the zone interdite. Finally, Wallon and Flemish collaborationist groups such as Vlaamsch Nationaal Verbond and the Rexists will be integrated into the command structure and administration to provide some legitimacy to the occupation. Should we allow all of this?"
 reichkom.11.a:0 "Yes, create one territorial unit for Belgium and Northern France."
 reichkom.11.b:0 "No, divide the zone into Walloon and Flemish territorial units."
 reichkom.11.c:0 "Of course not! Annex it directly into the Reich!"

 reichkom.21.t: "Zivilverwaltung in Occupied Belgium?"
 reichkom.21.d: "My Führer, the SS has recently promoted a plan for the transfer of Belgium from a military administration ruled by the Wehrmacht to a civilian administration run by the SS and NSDAP. They have suggested either Josef Terboven or Ernst Kaltenbrunner as the Reichskommissar of the civilian administration. Such actions would mean giving the SS a state where they can carry out their interpretation of Lebensraum, as well as entrusting them with more power and influence. Should we allow it? In case of allowing it, which Reichskommissar should we pick?"
 reichkom.21.a: "Pick Ernst Kaltenbrunner"
 reichkom.21.b: "Pick Joseph Terboven"
 reichkom.21.c: "Put off the plans for now"

 reichkom.22.t: "Formation of the RK Belgien-Nordfrankreich"
 reichkom.22.d: "The Führer has set in motion the plan to transfer the [RKB.GetName] to a civilian administration. The Gauleiter of Gau Cologne-Aachen, Josef Grohé, has been picked to be the Reichskommissar of the territory. This will surely bring the low countries closer to Germanisation!"
 
 reichkom.12.t:0 "The Administration of [GetRKNameRK]"
 reichkom.12.d:0 "We have completed the organization of Belgium and Northern France into a single territorial unit. We must now begin the process of determining how the new territory will be governed and by whom. Our options are to place it under the Wehrmacht as a Military Administration, establish Civilian Rule under a Party Functionary or place it under the rule of the SS. What shall we choose?"
 reichkom.12.f:0 "We have completed the organization of [GetRKName] into a territorial unit. We must now begin the process of determining how the new territory will be governed and by whom. Our options are to place it under the Wehrmacht as a Military Administration, establish Civilian Rule under a Party Functionary or place it under the rule of the SS. What shall we choose?"
 reichkom.12.a:0 "The Iron Discipline of the Army."
 reichkom.12.b:0 "The Ideological Purity of the Party."
 reichkom.12.c:0 "The Spartan Spirit of the SS."
 
 reichkom.13.t:0 "The Administration of Flanders and Wallonia"
 reichkom.13.d:0 "We have completed the organization of Wallonia and Flanders into separate territorial units. We must now begin the process of determining how the new territory will be governed and by whom. Our options are to place it under the Wehrmacht as a Military Administration, establish Civilian Rule under a Party Functionary or place it under the rule of the SS. What shall we choose?"
 reichkom.13.a:0 "The Iron Discipline of the Army."
 reichkom.13.b:0 "The Ideological Purity of the Party."
 reichkom.13.c:0 "The Spartan Spirit of the SS."
 
 reichkom.14.t:0 "The Status of the [GetRKAdjective]"
 reichkom.14.d:0 "Now that the governance of [GetRKName] has been decided, we must also determine the status of its people. Will they given second class status, in accordance with party doctrine on non-Germans? Or will we make an exception, and permit the locals certain privileges, even if it bucks our official stance?"
 reichkom.14.a:0 "Pragmatism wins over purity."
 reichkom.14.b:0 "German treatment is for German people."
 
 reichkom.15.t:0 "The Status of the Ex-Belgians"
 reichkom.15.d:0 "Now that the governance of Belgium has been decided, we must also determine the status of its people. Will they given second class status, in accordance with party doctrine on non-Germans? Or will we make an exception, and permit the locals certain privileges, even if it bucks our official stance?"
 reichkom.15.a:0 "Pragmatism wins over purity."
 reichkom.15.b:0 "German treatment is for German people."
 
 reichkom.16.t:0 "The Future of [GetRKName]"
 reichkom.16.d:0 "Now that we have chosen a form of governance and our stance towards the native population, we must look to the future of the territory. There are several ways through which [GetRKName] may eventually be integrated into the Reich, and none are compatible. Will the traditions and rites of the region be accepted and retained as we join it to the Reich? Will it be nothing more than a brave frontier from German pioneers to settle? Or will we take a middle road of assimilation and accommodation in the land we have acquired?"
 reichkom.16.a:0 "The cultural traditions of this territory will survive."
 reichkom.16.b:0 "We must pursue a policy of assimilation."
 reichkom.16.c:0 "It is nothing but Lebensraum for the Aryans."
 
 reichkom.17.t:0 "The Future of Flanders and Wallonia"
 reichkom.17.d:0 "Now that we have chosen a form of governance and our stance towards the native population, we must look to the future of the territory. There are several ways through which Belgium may eventually be integrated into the Reich, and none are compatible. Will the traditions and rites of the region be accepted and retained as we join it to the Reich? Will it be nothing more than a brave frontier from German pioneers to settle? Or will we take a middle road of assimilation and accommodation in the land we have acquired?"
 reichkom.17.a:0 "The cultural traditions of this territory will survive."
 reichkom.17.b:0 "We must pursue a policy of assimilation."
 reichkom.17.c:0 "It is nothing but Lebensraum for the Aryans."
 
 reichkom.18.t:0 "The Finalized Status of [GetRKName]"
 reichkom.18.d:0 "With the administration established, stance towards the locals determined, and the future of the territory planned, the status of [GetRKName] has now been solidified. Unless we have anything further to add, they can now go about their work without further oversight."
 reichkom.18.a:0 "The Administrator knows what they are doing."
 reichkom.18.b:0 "The [GetRKAdjective] situation bears further inspection."
 
 reichkom.19.t:0 "The Finalized Status of Flanders and Wallonia"
 reichkom.19.d:0 "With the administration established, stance towards the locals determined, and the future of the territory planned, the status of Belgium has now been solidified. Unless we have anything further to add, they can now go about their work without further oversight."
 reichkom.19.a:0 "The Administrator knows what they are doing."
 reichkom.19.b:0 "The Flemish situation bears further inspection."
 reichkom.19.c:0 "The Walloon situation bears further inspection."
 
 reichkom.20.t:0 "The Occupation of the Netherlands"
 reichkom.20.d:0 "The Netherlands are now under our control, and there are several options for its territorial arrangement. How will we organize it?"
 reichkom.20.a:0 "Create a territorial unit for the Netherlands."
 reichkom.20.b:0 "Annex it directly into the [Root.GetName]."

 reichkom.1016.t:0 "A Singular Administration for Dietsland"
 reichkom.1016.d:0 "The Government in Berlin has consented to the union of the administrations in Flandern and Niederlande. Henceforth, there will be a singular administration in control of all of the territory inhabited by the Dutchmen of the Low Countries. Though it has come about through German dominance, the centuries long dream of the Greater Netherlands has at last been fulfilled."
 reichkom.1016.a:0 "Dietsland Ontwaakt!"
 
 #Tooltips
 RK_Formations_De_Combat_raised:0 "The Formations de Combat is raised."
 RK_countries_becomes_puppet_tt:0 "We will create a §Yzone of ocupation§! whose administration will be subject to §Y[Root.GetNameWithFlag]§!"
 RK_weakened_tt:0 "§RThis will weaken the local administration.§!"
 RK_germanization_traditions_tt:0 "§RThis will speed up integration into the Reich.§!"
 RK_germanization_assimilation_tt:0 "§RIntegration into the Reich will proceed at the normal speed.§!"
 RK_germanization_colony_tt:0 "§RThis will slown down integration into the Reich.§!"
 play_as_RK:0 "§RYou will be switched to playing as the newly formed occupational authority.§!"
 
