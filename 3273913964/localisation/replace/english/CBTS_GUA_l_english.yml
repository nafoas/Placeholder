 ### leaders ###
 POLITICS_JORGE_UBICO_DESC:0 "The son of the influential Arturo Ubico Urruela and descended one of the oldest families of Guatemala, with an American Education to boot, Jorge Ubico's career is one of near consistent success. Made a colonel by 28 with time as a governor of two departments by 33, he held tenure as Secretary of War in 1922 before his resignation from the Orellana cabinet. Even his wilderness years from that moment to his 1931 election have done little to dampen the ambitions of Central America's Napoleon. Driven by a desire to reform his country on all fronts, only time will how he will be remembered now that he has reached the heights of power."
 
 ###ideas###
 GUA_UFC_Intensifies:0 "UFC Dominance of Infrastructure"
 GUA_UFC_Intensifies_desc:0 "Where once infrastructure in our nation was built and owned by various consortiums from differing nations, this is no longer the case. Now through its puppet corporation IRCA, and numerous poor deals in prior administrations the United Fruit Company has established a near complete control of our existing infrastructural network. As such they are now able to direct or deny what infrastructural projects we embark on and prevent the state from accessing the key source of income represented by the rail lines. Dealing with this situation will form a key part of our economic policy in the future."
 GUA_Militarized_Bureaucracy:0 "Militarized Bureaucracy"
 GUA_Militarized_Bureaucracy_desc:0 "Alongside the old Finquero families, the bulk of power in our state lies with the higher echelons of the armed forces. Those of our commanding officers who do not occupy active command are instead obliged to serve El Presidente in whichever capacity he requires them, or appointed to positions in the state bureaucracy. While this may bring some military discipline to our general administration, it remains important to keep them in check, lest they make a mess of things or become too independently minded."
 GUA_Bloated_General_Staff:0 "Bloated General Staff"
 GUA_Bloated_General_Staff_desc:0 "In a country with an army of perhaps 15,000 men we have dozens of Generals. While some may hold commands, others are forced into administrative jobs and some are simply reduced to running errands. As a result, disputes over authority are frequent and army reform will be impossible to establish till such time as the issues are resolved."
 GUA_Army_Incompetence:0 "Army Incompetence"
 GUA_Army_Incompetence_desc:0 "While America advisers have gone some way in bringing our army up to modern standards especially with the improvement of the Escuela Politécnica, opposition of the old guard generals together with the limited ability of the newly trained officers of the Military Academy to apply their training have led to the continuation number of backwards practices. If we are to establish an effective armed forces, further reform will be necessary, regardless of the backlash."
 
