#Pre-War Civil War
CHI_Support_Blue_Shirts:0 "Support the Blue Shirts"
CHI_Support_Blue_Shirts_desc:0 "Despite reservations about their policy proposals, the Blue Shirts Society remains a useful tool of our nationalist Kuomintang- and as a result, deserves a degree of our support. We can easily dispose of them in future if need be, and their assistance in combatting the communists will be well worth the cost."
CHI_Spread_Resistance_Northern_China:0 "Spread Resistance in Northern China"
CHI_Spread_Resistance_Northern_China_desc:0 "The only threat as dangerous as the Communists has once more reared its ugly head, this time driving itself deep into the heart of China by seizing Manchuria. However, its grasp is tenuous at best, and generally unstable at worst. While their attempts to stabilize are bearing fruit, with the right incentive to friendly bandits, we can ensure this is delayed as much as possible."
CHI_Crackdown_Corruption:0 "Crack Down on Corruption"
CHI_Crackdown_Corruption_desc:0 "Corruption as an endemic problem to our country has been present long before the Kuomintang ever gained power- but it has rarely been as bad as now. Before it can be allowed to get any worse, we must begin to push against it, or things may dramatically spiral out of control should any further destabilization occur..."
CHI_Encircle_The_Bandits:0 "Encircle the Communist Bandits"
CHI_Encircle_The_Bandits_desc:0 "The Communists are little more than Bandits- and as a result, they will be as harshly as that scourge. Our forces will clamp down on their scattered cells, forcing them to consolidate, before finally encircling them- and hopefully, this time, prepare to destroy them once and for all."
CHI_Blockhouse_Strategy:0 "Employ the Blockhouse Strategy"
CHI_Blockhouse_Strategy_desc:0 "We shall employ tactics recommended to us by the German advisors in order to prevent a successful communist rout- those of the Blockhouses. These structures, placed all around the territory which we have boxed the Communists into, will allow us to control and stop their movement, acting as defenses which their rag-tag military cannot easily break through." 
CHI_Rethink_Our_Tactics:0 "Rethink Our Tactics"
CHI_Rethink_Our_Tactics_desc:0 "If the past encirclement campaigns have taught us anything, it's that we have quite a bit to revise. We shall go back to the drawing board on a number of tactics previously thought merely "good enough", refining and honing them to allow us to employ them both effectively and smoothly, rather than the adhoc methods we have used in the past."
CHI_The_Fifth_Encirclement_Campaign:0 "The Fifth Encirclement Campaign"
CHI_The_Fifth_Encirclement_Campaign_desc:0 "The Communist bandits in the Jiangxi Soviet have been a thorn in our side for far too long. We are in an advantageous position, and it is time to strike! We will organize our troops around them and push inwards, surrounding and exterminating the red traitors as we go. Down with communism! Up with nationalism!"
CHI_The_New_Life_Movement:0 "The New Life Movement"
CHI_The_New_Life_Movement_desc:0 "China has been in a state of moral decay for almost a century. Opium, communism, imperialism, and prostitution have all eroded the foundations of morality. Chairman Chiang and his wife Soong Meiling will lead the New Life Movement, a government campaign to fight these evils and reintroduce morality and virtue to China!"
CHI_Establish_Nationwide_Draft:0 "Establish a Nationwide Draft"
CHI_Establish_Nationwide_Draft_desc:0 "With our conscription and militia reforms done, we can begin to enact a proper draft once again. This will be essential to maintaining our military. Hopefully, with the changes we’ve made to the system, this will result in us having more and better-trained and equipped soldiers for the National Revolutionary Army moving forwards."
CHI_Reorganize_Military_Conscription:0 "Reorganize Military Conscription"
CHI_Reorganize_Military_Conscription_desc:0 "Our military conscription is a mess. The laws are unclear, enforcement is spotty, and the outcome more resembles bandits engaging in impressment than a state engaging in conscription. We must organize and codify the process in order for our conscription, and by extent our army, to have any public legitimacy."
CHI_New_Law_Code:0 "Codify a New Law Code"
CHI_New_Law_Code_desc:0 "It has become more and more of a problem throughout our reforms that our legal code is disorganized, contradictory, and incoherent. With the help of our Italian advisors, we need to organize, codify, and clarify our laws so that it is understandable and actionable. That will make all our reforms and administrative efforts easier from here onwards."
CHI_Weed_Out_Mercenary_Militias:0 "Weed out Mercenary Militias"
CHI_Weed_Out_Mercenary_Militias_desc:0 "What is the difference between a mercenary and a bandit? They have a different name, is all. The mercenaries that sometimes serve local communities and political factions are one missed payment away from banditry, and must be disarmed or integrated into the proper army to prevent a bandit problem in the future."
CHI_Centralize_Provincial_Authority:0 "Centralize Provincial Authority"
CHI_Centralize_Provincial_Authority_desc:0 "Localism is an innocuous phenomenon that is nonetheless very dangerous to our rule. Villages do not exist in isolation, they exist as part of a province, which is a part of China. A gap in communication is occurring where villages do not answer to provincial authorities. This must be amended with changes to administration!"
CHI_Enroll_Militia_NRA:0 "Enroll the Militia into the NRA"
CHI_Enroll_Militia_NRA_desc:0 "The Baojia militias have been very successful against banditry, but are now needed for national defense and reserve functions. As a result, their local autonomy and semi-independence has entirely lost its usefulness. It is time that the militias be integrated into the proper hierarchy of the National Revolutionary Army."
CHI_Peace_Preservation:0 "Establish Peace Preservation Forces"
CHI_Peace_Preservation_desc:0 "Banditry remains a consistent threat throughout the country. Thankfully, we already have the institution that can provide the solution: the Baojia system provides the same kind of flexibility that anti-bandit forces need! We will set up Peace Preservation Forces as local militias integrated with the Baojia."
CHI_Strengthen_Local_Propaganda:0 "Strengthen Local Propaganda"
CHI_Strengthen_Local_Propaganda_desc:0 "It’s easy enough to promote nationalism in the cities, where it is already popular, but in the countryside, regionalist and provincialist ideas are common. We should promote and decentralize nationalist propaganda campaigns to ensure that they reach smaller communities and frontier provinces."
CHI_Strengthen_The_Kuomintang:0 "Strengthen the Kuomintang"
CHI_Strengthen_The_Kuomintang_desc:0 "The Kuomintang, as is obvious to all, the only path forwards for China. We are the only true heirs to Sun Yat Sen’s legacy, and that of the Xinhai revolution. The party, the Generalissimo, and the nation are all tied together, and strengthening one is strengthening them all! Let us strengthen China."
CHI_Marginalize_Intra_Party_Dissenters:0 "Marginalize Intra-Party Dissenters"
CHI_Marginalize_Intra_Party_Dissenters_desc:0 "The Kuomintang party is the party of China, and for China to be truly and wholly united, we must be, too. There is no room for petty factionalism or ideological bickering in our government. Chairman Chiang is the Generalissimo and he will determine our course. If some cannot accept that, they will be pushed into irrelevance."
CHI_Sideline_The_Blueshirts:0 "Sideline the Blueshirts"
CHI_Sideline_The_Blueshirts_desc:0 "The Blue Shirts Society is a military clique and secret society of Chinese nationalists inspired by European fascism. Their love of country is admirable, but their extremism and power is rapidly becoming a political hindrance. It’s time to begin bringing them down with political sidelining and signalling."
CHI_Hold_The_Fifth_Congress:0 "Hold the Fifth Congress"
CHI_Hold_The_Fifth_Congress_desc:0 "With all our recent reforms, it’s time to officially hold the Fifth National Congress of the Kuomintang party. This massive meeting of almost all important politicians in China will reform our party institutions and set out new goals and doctrines. There are even rumors that a new constitution may be proposed."
CHI_Establish_The_CBIS:0 "Establish the CBIS"
CHI_Establish_The_CBIS_desc:0 "The first and foremost goal of the Kuomintang party is to be an effective government for China. An important part of governance is establishing law and order. To that goal, we will reform our Organizational Department into the new Central Bureau of Investigation and Statistics, which will handle civilian intelligence and support local police."
CHI_Draft_A_Constitution:0 "Draft a Constitution"
CHI_Draft_A_Constitution_desc:0 "As decided at the Fifth National Congress, the constitution is to be once again revised. This will be a long process full of debate, deliberation, and political compromises on the part of many groups within the party. Hopefully, however, some key reforms can be done and we will end up with a better government for China by the end!"
CHI_Hold_National_Congress_Elections:0 "Hold National Congress Elections"
CHI_Hold_National_Congress_Elections_desc:0 "As outlined in the constitution we recently proposed, elections for a Chinese National Congress will be held! Political tutelage is far from over, and competition is primarily between Kuomintang factions, but this is still a massive victory for Chinese democracy! Let the voice of our people roar!"
CHI_Cleanse_CPC_Presence:0 "Cleanse CPC Presence from Jiangxi"
CHI_Cleanse_CPC_Presence_desc:0 "The Jiangxi Soviet may be defeated, but Communists and Communist sympathizers remain in droves. Communism is a destructive and twisted ideology that must be expunged by all means necessary. It has rooted itself deeply into Jiangxi, and only with force and fire may we root it back out again!"
CHI_Pursue_The_Communists:0 "Pursue the Communists"
CHI_Pursue_The_Communists_desc:0 "Much of the leftist force in Jiangxi was destroyed in our glorious encirclement campaign. However, some soldiers escaped under the leadership of the Communists, and are committing to a long and dangerous retreating march. We must pursue them and put the final nail in the coffin of Chinese communism!"
CHI_Placate_Local_Warlords:0 "Placate Local Warlords"
CHI_Placate_Local_Warlords_desc:0 "It is an extremely unfortunate political reality that warlords still hold much of the political capital in China. The Northern Expedition ended the warlord era proper, but we still deal with warlords both large and small on a regular basis. To maintain stability around the country, we will have to make some concessions to them."
CHI_Build_The_Sichuan_Guizhou_Highway:0 "Build the Sichuan-Guizhou Highway"
CHI_Build_The_Sichuan_Guizhou_Highway_desc:0 "The communists have no resources to speak of, and are undertaking their “long march” on foot or horse. We, however, have many resources, and can expedite the process. A highway from Sichuan to Guizhou would accomplish this, while also helping to solidify our control over this mountainous interior area."
CHI_Negotiate_With_Communists:0 "Negotiate with the Communists"
CHI_Negotiate_With_Communists_desc:0 "As much as it would please us to round up every remaining communist and fill them all with lead, the Japanese threat looming over all of China demands a somewhat more pragmatic approach. Negotiations will be held in Shanghai between Chen Lifu and Communist representatives instead."
CHI_Crush_The_Communists:0 "Crush the Communists"
CHI_Crush_The_Communists_desc:0 "Here we have an opportunity to destroy the communist threat forever! We may never get the chance again! We absolutely cannot afford to stop now. If we give them an inch, they will take a mile, and if we live one of them alive, their numbers will grow to thousands! We absolutely have to purge these traitors once and for all!"
CHI_A_Second_United_Front:0 "A Second United Front"
CHI_A_Second_United_Front_desc:0 "The Japanese are a looming threat to China, more so than ever before. Odious and untrustworthy as they are, the Communists have become adept at guerilla warfare, and we may need their help to fight the Japanese. Old allies with new enemies; the differences between Sun Yat Sen’s children may once again be set aside. For now."
CHI_Resettle_The_NEA:0 "Resettle the NEA"
CHI_Resettle_The_NEA_desc:0 "The Northeastern Army, a semi-independent warlord army, has recently found itself wayward. With our influence as the rightful government, we can direct them towards Shaanxi and use them as a bargaining chip against the communists. Shady and double-faced as this tactic may be, it would be very shrewd."
CHI_Encircle_Their_Holdouts:0 "Encircle Their Holdouts"
CHI_Encircle_Their_Holdouts_desc:0 "We absolutely cannot afford to send our army blazing into Communist territory. The harsh terrain and dirty communist guerilla tactics would make it extremely costly in terms of men and equipment. Instead, we will fall back on the blockhouse encirclement tactics that were so successful in Jiangxi under similar conditions."
CHI_Supply_The_Red_Army:0 "Supply the Red Army"
CHI_Supply_The_Red_Army_desc:0 "If the communists are going to be our allies, they may as well be useful ones. As wrong as it feels to give weapons and food to the army we fought not long ago, the communists are desperately in need of these supplies, and if we don’t give it to them, they won’t be much use to us as allies against the Japanese."
CHI_Eradicate_The_Communists:0 "Eradicate the Communists"
CHI_Eradicate_The_Communists_desc:0 "The time has finally come! The communist threat, which has plagued us for years and refused to die after every death blow dealt to it, is finally out of tricks, traps, and desperate gambles. They have nowhere left to run and no strength left to fight. They shall be hunted to a man, and communism will never stalk China again!"
CHI_Centralize_Opium_Traffic:0 "Centralize Opium Traffic"
CHI_End_Guizhou_Autonomy:0 "End Guizhou Autonomy"
CHI_Pressure_Sichuan:0 "Pressure Sichuan"
CHI_Negotiate_With_Southern_Leaders:0 "Negotiate with Southern Leaders"
CHI_Negotiate_With_Southern_Leaders_desc:0 "Our control over the south of China is... tenuous, at best. Many of the leaders in that region, including powerful general Chen Jitang, have divided loyalties and questionable past actions. We must speak with some of these leaders and ensure their loyalty, reminding them of who they serve first and foremost."
CHI_Encircle_Southern_Provinces:0 "Encircle Southern Provinces"
CHI_Encircle_Southern_Provinces_desc:0 "To say that we control the south of China would be a generous description. Warlords, bandits, rogue armies, and uncooperative garrisons abound. We must reassert our military presence in the area. For this, we will once again employ our tactic of encircling and enveloping enemy holdouts and forcing them to surrender."
CHI_Agreement_With_Chen_Jitang:0 "Reach an Agreement with Chen Jitang"
CHI_Agreement_With_Chen_Jitang_desc:0 "The New Guangxi Clique under Chen Jitang has become increasingly belligerent and powerful, even threatening the generalissimo Chiang himself. If this conflict continues and escalates, it could potentially spill into a civil war. Tensions must be defused. We will sit down with Chen and work something out."
CHI_End_Southern_Autonomy:0 "End Southern Autonomy"
CHI_End_Southern_Autonomy_desc:0 "The southern provinces, as the home of the Northern Expedition, were allowed a degree of political autonomy. This was a mistake. Plots and treason have abounded among the cliques and politicians there. It is time to rectify the situation and reassert direct control over the southern situation."
CHI_Crush_Guangxi:0 "Crush Guangxi"
CHI_Crush_Guangxi_desc:0 "The New Guangxi Clique have conspired against Chairman Chiang and are therefore traitors to China! There is only one acceptable way to deal with traitors. These renegades will be put to the sword, and the situation in the south will finally be resolved by blood and bullets."
CHI_Negotiate_With_New_Guangxi:0 "Negotiate with the New Guangxi Clique"
CHI_Negotiate_With_New_Guangxi_desc:0 "The south has many problems, but a major one is the disconnect between the government and the New Guangxi Clique. We can address this peacefully with some changes to policy and better communication, and resolve the situation in the south with words and goodwill."

