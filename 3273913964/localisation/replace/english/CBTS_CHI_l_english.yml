CHI_nationaldefense:0 "National Defense Preparations"
CHI_nationaldefense_desc:0 "A crucial part of the 1933 Defense Plan, the Eight \"Priority Measures\" called for the preparation of defensive measures and fortifications throughout Northern and Central China to defend against a Japanese attack that the National Defense Planning Council considered to be inevitable. These defenses are placed at strategically and militarily crucial locations, to prevent the Japanese from taking control of them and to make it much easier for the Chinese defenders to conduct their operations with the predicted strength and equipment against the superior Japanese military. These defensive measures include §CNaval Preparations§!, §RMilitary Buildups§!, and §GFortification Construction§! in specific locations that have been assessed to be of specific importance. If these measures are completed by the time that the Japanese begin their invasion, our nation will be able to resist them far more effectively."
