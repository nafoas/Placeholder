chi_civil_war.1.t: "The Suiyuan Campaign"
chi_civil_war.1.desc: "News have arrived from the mostly silent Inner Mongolia, the newly formed Pro-Japanese Mongol Military Government has started an invasion of the Suiyuan Mongol Council through the usage of the Grand Han Righteous Army.\n\nFrom what can be asserted, this invasion has been launched to capture the former regions that had made up the \"Mongol Local Autonomy Political Affairs Committee\". Rumours have also occurred that Japan has been involved too, interested in continuing their \"North China Policy\" by continuously encroaching into Chinese territory.\nNevertheless, the outcome of this war will boost or twist the morale of either side. This will be a fledging Mongol victory or a patriotic success by the Chinese..."
chi_civil_war.1.a: "The die has been cast"

chi_civil_war.10.t: "The Yulin King's death"
chi_civil_war.10.desc: "Tragedy! Our venerable governor and commander of the 86th Division, Jing Yuexi, has tragically died in an accidental suicide.\n\nThe fateful day of the accident, Yulin City was full of wind and dust; that night Jing Yuexiu was accompanied by Luo Xin, commander of the 514th Regiment of the 86th Division stationed in Yulin, during a routine patrol to inspect defense. When returning to change, Yuexi accidentally dropped his pistol, which went off by itself upon hitting the ground, shooting him in the chest.\nToday at about 3 o'clock in the morning, Jing Yuexiu died of his injuries at the age of 57.\n\nYuexi's 2nd-in-command Gao Shuangcheng will assume leadership of the 86th Division now that the \"Yulin King\" has died."
chi_civil_war.10.a: "A cruel twist of fate"


chi_civil_war.11.t: "Jing Yuexi's Accidental Suicide!"
chi_civil_war.11.desc: "Grim news from Yulin have arrived today reporting that 2-decade long ruler of the Shaanxi region and commander of the NRA 86th division, Jing Yuexi, has died.\nThe official report detailing the events of the tragedy explains what happened as follows: On the eighth day of the first lunar month of the year of the Pingzi (January 31, 1936) Yulin City was full of wind and dust; that night Jing Yuexiu was accompanied by Luo Xin, commander of the 514th Regiment of the 86th Division stationed in Yulin, and patrolled the city as usual to inspect defense. When returning to change, he accidentally dropped his pistol, which went off by itself upon hitting the ground, shooting him in the chest.\nToday at about 3 o'clock in the morning, Jing Yuexiu died of his injuries at the age of 57.\n\nWith the \"Yulin King\" now dead, his 2nd-in-command Gao Shuangcheng will assume leadership of the 86th Division region."
chi_civil_war.11.a: "A cruel twist of fate"

yulin_king_death_tt: "§5Gao Shuangcheng§! §Ywill become the commander of the §RNRA 86th Division§! in Yulin§!"

