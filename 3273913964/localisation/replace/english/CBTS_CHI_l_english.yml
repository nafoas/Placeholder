chi_flavor.6.t: "Hu Hanmin Passes away from Cerebral Hemorrhage"
chi_flavor.6.desc: "The great statist intellectual, Hu Hanmin, died of a cerebral hemorrhage earlier today. Aged 56 at his time of death, Hu was a long time KMT member and strong rival to Chiang Kai-shek, briefly being imprisoned by Chiang in 1931, before public pressure forced his release. Thereafter, he joined and supported General Chen Jitang’s rival Government based in Guangdong acting as its figurehead.\n\nThe general goal of his principles were resistance against the Japanese, against the warlords and against Chiang, the latter until Hu Hanmin's reconciliation with Chiang in June of 1935 following a visit to Europe. In the first session of the Fifth Conference of the Kuomintang in December 1935, he was absently elected as the Chair of Central Committee of Common Affairs. Hu returned to China in January 1936, residing in Guangzhou until his passing.\n\nHis funeral is currently being held and his death marks a huge blow to the legitimacy of Chen Jitang's Clique. Likely spelling an end to the latter man's ambitions to continued governance in the south."
chi_flavor.6.a: "May he rest in peace..."
chi_flavor.7.t: "Yang Yongtai assasinated"
chi_flavor.7.desc: "PLACEHOLDER"
chi_flavor.7.a: "Another one bites the dust"
chi_flavor.8.t: "Zhu Peide dies of blood poisoning"
chi_flavor.8.desc: "On February 7, 1937, Zhu Peide was hospitalized. After his admission into the Nanjing Drum Tower Hospital from illness related reasons, his health was closely monitored. On the 15th of February, Zhu Peide attended the Third Plenary Session of the Fifth Central Committee of the Kuomintang during his illness.\n\nIn order to attend, he had to inject anti-anemia drugs imported from Germany during the meeting. The injection had caused him wind chill which resulted in sepsis, following this he was re-admitted into the Drum Tower Hospital in Nanjing on the 17th of February, 6:00 A.M. By 10:00 P.M. his condition started sharply deteriorating. His last words to Chiang, whom visited him moments before losing consciousness were... \"First, the War of Resistance is imminent... National strength is fragile...\" he continued on, \"Second, please bury me in Jian'an.\" followed by \"Let my family members and children support themselves, don't take generous care of them just because of me... Third, don't blame Miss Ye, my family nurse for my medical situation... Our country's medical situation is underdeveloped and we cannot cure my sickness.\"\n\nGeneral Zhu Peide, member of the Central Executive Committee of the Kuomintang Central Committee, member of the Central Political Committee, and director of the General Office of the Military Commission, died of blood poisoning following his hospitalization as a result of alleged medical malpractice at age 49 according to internal sources, however some have been debating that Japanese agents were behind it, nonetheless, it comes as bad news. Chiang Kai-Shek wept bitterly and the nation was at shock as he was the first first-class general to pass away at the youngest age on the time of his death. All military and political circles mourned his passing and Nanjing was called by all echelons of China for a \"state funeral\" in commemoration for his death."
chi_flavor.8.a: "Rest in Peace Peide"
