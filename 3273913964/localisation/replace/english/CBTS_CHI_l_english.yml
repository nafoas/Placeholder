l_english:
CHI_united_front:0 "National United Front of Resistance"

CHI_GATHERING_STORM_DESC:0 "China's Century of Humiliation continues on into the 1930s, with the ongoing ownership of ports by European powers and the constant encroachment of the Japanese on her lands. Much of China remains outside of her control, a continued national shame.\n\nHowever, unlike in previous decades, China also now sits on the path to reclaiming her place in East Asia. Her power only grows, despite the persistent issues of warlordism and the Communists, as well as the ever-present threat of the Japanese. Hopefully, it will not falter when it is finally put to the test."
