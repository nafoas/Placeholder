#ROCN/ROCAF
CHI_The_Path_To_Modern_Air_Force:0 "The Path to a Modern Air Force"
CHI_The_Path_To_Modern_Air_Force_desc:0 "The Republic of China Air Force, like the rest of our military, is very outdated. It also has the additional problem of only technically existing. It’s clear that aerial warfare will be extremely important in the years to come, and if we are to remain militarily competitive, we must modernize our air force, not just our army."
CHI_Acquire_German_Aircraft:0 "Acquire German Aircraft"
CHI_Acquire_German_Aircraft_desc:0 "We are already on good terms with Germany, and they supply us with large amounts of military equipment. It is hardly a stretch, then, to request some aircraft to kick-start our air force. The Germans are still in the process of rebuilding their air force, but they also rarely turn down an opportunity to display their modern technology."
CHI_Purchase_Italian_Planes:0 "Purchase Italian Planes"
CHI_Purchase_Italian_Planes_desc:0 "Our relationship with Italy is somewhat undefined, but it is not out of the question that we could purchase some of their aircraft. This could kill two birds with one stone, strengthening our air force with new foreign models while also strengthening our relationship with one of the world’s major powers and laying groundwork for future cooperation."
CHI_Import_American_Models:0 "Import American Models"
CHI_Import_American_Models_desc:0 "The American air corps are not as respected as that of many other great powers, but the strength of America’s industrial and innovative bases are unmatched in the world. We should have no difficulty importing American planes to serve in our air force, strong as American aviation and industry is."
CHI_Build_Xiangtan_Engine_Factory:0 "Build the Xiangtan Engine Factory"
CHI_Build_Xiangtan_Engine_Factory_desc:0 "Planes are useless without engines to run them. Engines fail, break, or simply age, and must be replaced. If we are to maintain our air force of foreign planes, let alone ever hope to produce domestic ones, we must have the infrastructure in place to produce engines for them. Engine factories, oft-overlooked, will be a necessity."
CHI_Invite_German_Instructors:0 "Invite German Instructors"
CHI_Invite_German_Instructors_desc:0 "Germany has many talented pilots, both veterans of the Great War and newly trained pilots as a part of their semi-secret rearmament plans. As we did with our army, we should invite German instructors for our air force to assist in training, modernization, expansion, and combat, should such a thing ever be needed."
CHI_Establish_Nanchang_Academy:0 "Establish the Nanchang Academy"
CHI_Establish_Nanchang_Academy_desc:0 "Our Advisor, General Roberto Lordi suggested we organize a proper, modern aviation academy under Italian supervision. A domestic academy, staffed partially with Italian air mission instructors, could give us more control over doctrine and training. This would continue the pattern of Sino-Italian air cooperation."
CHI_Establish_SINAW:0 "Establish SINAW"
CHI_Establish_SINAW_desc:0 "Italy has shown some interest in creating a cooperative aircraft company. This is great news, as it will allow us to produce planes domestically with the benefit of foreign expertise! The new Sino-Italian National Aircraft Works, or SINAW, will be established to create profit and planes for us both!"
CHI_Establish_Central_Aviation_School:0 "Establish the Central Aviation School"
CHI_Establish_Central_Aviation_School_desc:0 "Having existed in some form or another since 1928, the Central Aviation School is key to our air force modernization. It has gone by many names and been reorganized several times, but with some effort we may solidify and establish it as an American-backed aviation academy to train Chinese military pilots."
CHI_Establish_CAMCO:0 "Establish CAMCO"
CHI_Establish_CAMCO_desc:0 "CAMCO was an idea pitched to our government by American businessman William Pawley. It is, frankly, an excellent idea. This Sino-American joint venture can produce planes domestically using American designs and expertise, strengthening our aviation industry and air force immensely."
CHI_Build_Junker_Factory:0 "Build Junkers Factory"
CHI_Build_Junker_Factory_desc:0 "If we are to commit to a German-style air force, it only feels right to use German planes that were designed for such a purpose. We cannot rely on handouts from Berlin forever, though. We should begin plans to produce German aircraft models domestically. This will require construction of specialized factories in China."
CHI_Expand_Italian_Mission:0 "Expand the Italian Mission"
CHI_Expand_Italian_Mission_desc:0 "So far, Italian involvement in our air force has mostly been limited to providing plans. We could, however, expand this into a proper attache. Roberto Lordi in particular, who negotiated our aircraft purchases with Italy, has shown his competence and earned President Chiang’s trust. We should have him lead an expanded Sino-Italian air mission."
CHI_Invite_Chennault:0 "Invite Chennault"
CHI_Invite_Chennault_desc:0 "Claire Lee Chennault, a respected aviator and air strategist, has had many of his ideas sidelined in the United States. We should invite him to our country, where he can serve as a distinguished advisor and instructor, while having his ideas shown the respect that they deserve! This will solidify our ties with America."
CHI_Formalize_German_Education:0 "Formalize a German-Style Education"
CHI_Formalize_German_Education_desc:0 "To go along with our German planes and German tactics, we should complete the Germanization of our air force by establishing a training manual and official curriculum for pilots along German lines. These will be little more than translations of Luftwaffe manuals, but they should suit our needs well, complimenting the rest of our air force strategy."
CHI_Prioritize_Loyang_School:0 "Prioritize the Loyang School"
CHI_Prioritize_Loyang_School_desc:0 "The Luoyang School serves as the Italian-rooted aviation school in China, as opposed to the German or American ones. In this way, Luoyang serves as something of an underdog, but they could be pushed to the forefront of aviation training with a government sponsorship. This would solidify our partnership with Italy in our air force, as we did with Germany for the army."
CHI_Build_Curtiss-Wright_Plant:0 "Build the Curtiss-Wright Plant"
CHI_Build_Curtiss-Wright_Plant_desc:0 "Who better to manufacture American planes than American companies? Cooperation with American aviators and volunteers is all well and good, but following the American air force model will require American planes to be produced domestically, which we are more than happy to invite American companies to do themselves!"
CHI_Arrange_Equipment_Sales:0 "Arrange Equipment Sales"
CHI_Arrange_Equipment_Sales_desc:0 "As with the army, the Chinese air force relies heavily on foreign equipment purchases, and Germany is often the most willing to sell. To continue our cooperation with Berlin, we should purchase more equipment for our air force as it continues to expand. The Germans are very likely to accept such overtures."
CHI_Lessons_From_Operation_Zet:0 "Analyze Lessons From Operation Zet"
CHI_Lessons_From_Operation_Zet_desc:0 "Operation Zet, a secret Soviet program to supply us with modern armaments to combat Japanese imperialism, gave us clear opportunities to see a truly modern air force in action right above our heads. This gives us not only the opportunity to learn from Soviet designs, but also their tactics and combat doctrine firsthand."
CHI_Expand_the_Central_Academy:0 "Expand the Central Academy"
CHI_Expand_the_Central_Academy_desc:0 "The Central Academy has been a massive success. This American-backed academy has produced some of the finest Chinese pilots ever seen, and this success must be rewarded. We will allocate additional funds, staff, and resources to the academy so that it may continue to serve our country in its time of need."
CHI_Form_The_AVG:0 "Form the AVG"
CHI_Form_The_AVG_desc:0 "Proposed by the United States Government and directed by General Chennault, the American Volunteer Group is a promising lead for Chinese air parity. The group would consist of American volunteer air units sent to China to assist us in times of war. These “Flying Tigers” would be better trained and equipped than our air force, and extremely useful."
CHI_Reverse_Engineer_German_Aircraft:0 "Reverse-Engineer German Aircraft"
CHI_Reverse_Engineer_German_Aircraft_desc:0 "Through our cooperation with German air missions and equipment sales, we have acquired a great deal of their planes. So many, in fact, that if a few were to go missing so we could figure out how exactly they work, no one would likely notice. This would be an effective way to begin designs for our own aircraft."
CHI_Reverse_Engineer_Soviet_Aircraft:0 "Reverse-Engineer Soviet Aircraft"
CHI_Reverse_Engineer_Soviet_Aircraft_desc:0 "Operation Zet has resulted in the delivery of hundreds of Soviet aircraft to China. It would be extremely easy to disassemble a few of them and see what makes these red birds fly. This would give us much greater insight into aircraft design, and set us on the path to domestic aircraft designs and an end to foreign reliance."
CHI_Reverse_Engineer_American_Aircraft:0 "Reverse-Engineer American Aircraft"
CHI_Reverse_Engineer_American_Aircraft_desc:0 "Through the AVG and American companies, a large portion of our air force is now of American make. We should begin reverse-engineering these designs so that we may begin creating Chinese designs for a Chinese air force. It may cost a few planes in the short run, but in the long run, it may be another way to make China whole and self-sufficient."
