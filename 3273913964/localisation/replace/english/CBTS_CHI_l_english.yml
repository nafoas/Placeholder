chi_news.1.t:0 "Incident in Xi'an"
chi_news.1.desc:0 "Political affairs in China have been severely disrupted following a major incident in Xi’an, where Generalissimo Chiang Kai-Shek of the Kuomintang was taken prisoner by two of his own generals, Zhang Xueliang and Yang Hucheng, after being invited to speak on behalf of his plans to pacify the Communist Party of China.\n\nSeemingly driven by increasing opposition to Chiang’s insistence on eradicating the communist presence in China, Zhang Xueliang and Yang Hucheng have ultimately released him after tense negotiations, with CCP envoy Zhou Enlai securing Chiang’s agreement towards cooperating with the CCP to fight Japan.\n\nIt remains to be seen whether Chiang will allow this blatant act of mutiny to go unpunished."
chi_news.1.a:0 "There will be a reckoning soon enough..."
chi_news.1.b:0 "A new United Front?"

#American Volunteer Group
chi_avg.1.t:0 "The American Volunteer Group Arrives"
chi_avg.1.d:0 "Over the summer and fall of this year, nearly 300 men boarded ships headed for Burma, their true intentions a tightly-kept- though not unacknowledged privately by authorities- secret. All of these men had skills relating to aircraft, from flying to maintenance to air traffic control skills. They would form the First American Volunteer Group, former military and civilian pilots as well as support crews hired by the Chinese government to aid them in their fight against Japan. The First AVG- or Flying Tigers, as they would be referred to as, was a mix of adventurers, freedom-fighters, and mercenaries, all led by the charismatic Colonel Chennault. Though they have yet to prove their worth in combat, already they have made both the American and Chinese public intrigued, by this concept of Americans forgoing their jobs in the US to fight for what they- at least, according to propaganda- see as a worthy cause. Though, first, of course, they'll need to pass the Colonel's 'school'."
chi_avg.1.a:0 "You'd better have our money ready when we get back!"