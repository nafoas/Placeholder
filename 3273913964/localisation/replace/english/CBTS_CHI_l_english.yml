CHI_60divisions:0 "The 60 Division Plan"
CHI_60divisions_desc:0 "The brainchild of General von Seeckt of the Reichswehr and later Wehrmacht, the 60 Division Plan was the idea that in order to ensure Chinese territorial integrity the National Revolutionary Army should be restructured into a professional, well-trained and well-disciplined force of soldiers with modern equipment- the goal, of course, being the 60 Divisions that the plan's name comes from. However, neither von Seeckt nor the Chinese National Defense Planning Council are foolish enough to see this as an immediate possibility, and thus have agreed to enact the plan on a limited scale, with the goal on creating a loyal core of officers to the Generalissimo and a small professional group with which to conduct spearhead operations. The crux of this plan is the division of the NRA into two types of divisions: §CNew Divisions§!, who will be built by the ground up to be non-regional and loyal to China rather than regional governors, and §GReorganized Divisions§!, who will be made from the divisions already under Nanjing or Warlord control and will act as secondary forces, conducting policing actions and acting as auxiliaries for the §CNew Divisions§!. Obviously, enacting this plan will be an issue of compromise, as the warlord generals will still need to be pacified as we reorganize, but we will not be able to grant them too much power or the plan will utterly collapse. \n\nThere are currently  §Y[?CHI.CHI_new_divisions]§!  §CNew Divisions§! \n\nThere are currently  §Y[?CHI.CHI_reorganized_divisions]§!  §GReorganized Divisions§!"
CHI_form_new_divisions:0 "§CForm New Divisions§!"
CHI_reorganize_existing_divisions:0 "§GReorganize Existing Divisions§!"

CHI_economy:0 "The Chinese Economy"
CHI_economy_desc:0 "For centuries, the Chinese economy has been eroding away. During the Qing dynasty, the Chinese began to lose control of their economy to Western powers, and the stability of said economy has been as fluid as the Yangtze since. While signs of stability have come after the Northern Expedition and the centralization around Nanjing - even though much of the country is under the rule of warlords - the economy has yet to recover from the Great Depression in the west, and whether or not we are experiencing §Rinflation§! or §Gdeflation§! changes as often as the wind. Because of these problems, funding projects has become increasingly difficult, as almost every time that we can earmark funds the economy enters a period of §Rinflation§!. In order to propel the Chinese economy further, we must balance these two forces, ensuring that the economy is simultaneously controlled and growing. \n\n§GDeflation§! and §RInflation§! are measured on a scale of 0 to 100, with extreme §GDeflation§! being 0 and extreme §RInflation§! being 100. \n\nCurrent Economic Stability: §Y[?CHI.CHI_economic_status]§! ([CHI.GetCHIEconomy]) \n\nOur Previous Economic Stability Was: §Y[?CHI.CHI_previous_economy]§! ([CHI.GetCHIPreviousEconomy]) \n\nChange in Economic Stability Per Month: §Y[?CHI.CHI_change_in_economic_status]§! \n\nCurrent Debt to the [USA.GetFlag][USA.GetName]: §C[?CHI.CHI_debt_US]§! \n\nCurrent Debt to the [ENG.GetFlag][ENG.GetName]: §C[?CHI.CHI_debt_UK]§! \n\nCurrent Debt to the [GRM.GetFlag][GRM.GetName]: §C[?CHI.CHI_debt_GER]§!" 
