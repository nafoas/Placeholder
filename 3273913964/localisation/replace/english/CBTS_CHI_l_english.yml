#NRA
CHI_The_NRA:0 "The National Revolutionary Army"
CHI_The_NRA_desc:0 "The National Revolutionary Army both created and defends China as it exists today. It is modern compared to the warlord bands that preceded it, and it unified the nation during the glorious Northern Expedition. It ended the warlord era and ushered in the Kuomintang state. However, it has seen better days, and we must turn attention to our defense plans."
CHI_Institute_Special_Intendent:0 "Institute the Special Intendent"
CHI_Institute_Special_Intendent_desc:0 "Magistrates are important bureaucratic persons, handling administration at a local level. However, there are layers of bureaucracy between these county-level positions and our national government. To have a more direct line to the counties, we will institute a Special Intendent, whose job will be to act as a national leader of all local magistrates."
CHI_Establish_NDPC:0 "Establish the NDPC"
CHI_Establish_NDPC_desc:0 "In order to help organize our military, we will create the National Defence Planning Council. This organization will serve a major role in our government by arranging war plans, reorganizing the NRA, taking account of our economy, and strengthening our defences. Much of the work in the years to come will be carried out by this essential body."
CHI_Restore_the_Baojia:0 "Restore the Baojia System"
CHI_Restore_the_Baojia_desc:0 "The Baojia system is an ancient administrative method introduced in the Song dynasty. It allows local leaders to handle local issues with some degree of autonomy while still being accountable to the government. This system has waned in the warlord-induced chaos, and we should revive it to help our administration."
CHI_Lessons_of_the_Wall:0 "Lessons of the \"Defence of the Great Wall\""
CHI_Lessons_of_the_Wall_desc:0 "The recent Japanese incursion they called Operation Nekka was a disaster for us. It could have gone worse, but we were powerless to prevent Japan from seizing Chinese territory. We must analyze our failings from this campaign and correct them to ensure that the next Japanese invasion faces much stiffer resistance."
CHI_Adopt_1933_Plan:0 "Adopt the 1933 Defense Plan"
CHI_Adopt_1933_Plan_desc:0 "The military and NDPC have outlined the Defense Battle Plan, which calls for construction of anti-aircraft, security of China’s rivers, and an increase in fortification and military industry in the event of foreign invasion. This plan will be expensive, but is also essential to defend China from Japanese aggression."
CHI_Abolish_Tankuan_Taxation:0 "Abolish Tankuan Taxation"
CHI_Abolish_Tankuan_Taxation_desc:0 "The Tankuan tax, a special land tax imposed on villages by local warlords, has become a problem for the countryside. These taxes are often arbitrary and have skyrocketed to obscene rates. This is forcing more and more peasants alike into poverty. These taxes are not worth the income, and should be abolished."
CHI_Strengthen_Northern_Defenses:0 "Strengthen Northern Defenses"
CHI_Strengthen_Northern_Defenses_desc:0 "When the Japanese invade, it is highly likely that a large thrust of the attack will come from Manchuria, where the Japanese puppet reigns. We should prepare defenses and fortifications around Beijing and Tianjin so that we can blunt any such attack from the north. We will build a new Great Wall to deter invaders!"
CHI_Strengthen_Central_Defenses:0 "Strengthen Central Defenses"
CHI_Strengthen_Central_Defenses_desc:0 "While the main thrust of a Japanese attack is likely to come from the north, much of our industrial and population centers are coastal and therefore exposed. Effort must be put into coastal and interior defenses to prepare for Japanese amphibious assaults or in case of a collapse of the northern lines."
CHI_Invite_von_Seeckt:0 "Replace Wetzell with von Seeckt"
CHI_Invite_von_Seeckt_desc:0 "Our German advisor Georg Wetzell is talented, but lacks a nuanced understanding of the Chinese political situation and how relevant it is to military affairs. Therefore, it may be prudent to replace him with Hans von Seeckt, a more politically savvy and equally talented military advisor who can do better for China than Wetzell has."

CHI_Run_Domestic_Analysis:0 "Run Domestic Analyses"
CHI_Run_Domestic_Analysis_desc:0 "The NDPC has put forward an ambitious plan: a massive census of China’s population, industry, geography, and economy. This would enable much more accurate war planning and economic management. It will be expensive and time-consuming, but this massive analysis of our situation will do wonders for military and economic policy-making and management."
CHI_Request_German_Aid:0 "Request German Financial Aid"
