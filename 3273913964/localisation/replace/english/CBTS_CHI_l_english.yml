CHI_construction:0 "Expanding Chinese Infrastructure"
CHI_construction_desc:0 "China's infrastructure lags far behind her European rivals. Many rural provinces still exist in Imperial Feudalist conditions due to the Qing Empire's failure to modernize and its subsequent collapse. We have only now started to resolve this issue.\n\nThe Chinese economy has recovered and the government has been stabilized to a point that we can begin a concentrated effort to improve our infrastructure. However, these projects will remain localized and will come at a cost. As these projects are completed, §Rinflation§! will slowly increase, as the influx of funds in the region and the expansion of the bureaucracy will devalue our currency. We must take care to prevent inflation from going out of control."
