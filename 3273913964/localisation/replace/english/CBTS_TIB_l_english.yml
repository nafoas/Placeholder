l_english:
 
 tibet.1.t:0 "The Death of the 13th Dalai Lama"
 tibet.1.d:0 "The 13th Dalai Lama, Thubten Gyatso, Spiritual and Temporal leader of Tibet and Tibetan Buddhism, has died at the age of 57 after a brief illness. The government and public has been informed and it is expected that a power struggle may now emerge between the Kunphela (The Dalai Lama's closest advisor, like a son to him), Lungshar (A reformer, who wants to give power to the Assembly) and the traditionalist establishment of the Kashag (Upper Parliamentary House) led by Trimon."
 tibet.1.a:0 "We pray for a swift reincarnation"
 tibet.2.t:0 "Kunphela holds a Military Parade"
 tibet.2.d:0 "Kunphela arranges for all Lhasa-based units to 'Present Arms' in honour of the Dalai Lama"
 tibet.2.a:0 "Kunphela decides to ally with the Lonchen (Prime Minister) and bide his time" 
 tibet.2.b:0 "Kunphela uses the Trongdra Regiment to seize control"
 tibet.3.t:0 "Kunphela's Decision"
 tibet.3.d:0 "Kunphela's decision"
 tibet.3.a:0 "Form Tibet's first political party to modernise the country"
 tibet.3.b:0 "Rule alone"
 
