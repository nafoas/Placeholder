l_english:
### leaders ###
POLITICS_REZA_SHAH_PAHLAVI_DESC:0 "Originally a cavalry officer, Reza Shah Pahlavi rose to prominence in 1921 when he lead his company of soldiers to seize Tehran from Ahmed Shah Qajar and founded a new dynasty with himself as the head. Driven to his actions by the country's decay over the centuries, he seeks to centralize and modernize the realm, whether he is successful or not, time will tell."

### ideas ###
PER_apoc_default:0 "Anglo-Persian Oil Company"
PER_apoc_default_desc:0 "Established in 1908, the Anglo-Persian Oil Company is a British-based corporation dedicated to extracting oil from the numerous deposits around the country and shipping it to various buyers throughout the world. While we are compensated for their use of our lands, it is clear that the British benefit from this deal far more than us."
PER_1906_constitution_default:0 "Question of the 1906 Constitution"
PER_1906_constitution_default_desc:0 "Reza Shah's coup of 1921 was ostensibly carried out to reinforce the ideals of Persian democracy, but his regime has since then done anything but. The Majlis now finds itself irrelevent, and Reza Shah, despite his claims of being a constituional monarch, rules our country as an autocrat."
PER_illiterate_populace:0 "Illiterate Populace"
PER_illiterate_populace_desc:0 "The Anjuman-i Ma'arf was formed in 1898 to help educate our populace, but with a severe lack of funding, it has been very ineffective in achieving its goals, and the majority of our population is unable to read, greatly hindering our modernization efforts."
PER_agrarian_economy:0 "Agrarian Economy"
PER_agrarian_economy_desc:0 "With the notable exception of oil extraction (which is controlled by the British), Persia's economy relies heavily on agricultural goods, and industrialization is yet to come to our nation in any meaningful capacity."
PER_british_influence_low:0 "British Influence - §GLow§!"
PER_british_influence_low_desc:0 "Since the days of their great game with Russia, the British have had a keen interest in controlling the affairs of our nation, for the time being they seem to have a small presence in our national decision making process."

### events ###
persia.1.t:0 "Persia in 1933"
persia.1.d:0 "Persia, long a centerpoint of middle-eastern power, is at a great turning point in its history. In 1906, it became a constitutional monarchy under the pressure of reformist-minded academics, beginning the modernization era and bringing the light of freedom to Central Asia. That all changed in 1921 when the Qajar dynasty which had ruled the nation for the last 132 years was suddenly toppled by Reza Shah Pahlavi, who seized power and forged his own regime, that same year he put down a communist uprising in Gilan and would go on to centralize politics around himself. While he is still committed to modernization, the freedoms of everyday people have been significantly curbed. The Shah now looks to his nation, plagued by stagnation and decay, he is determined to bring Persia once more into relevancy."
persia.1.a:0 "Long live the Shah!"
persia.2.t:0 "The Anglo-Persian Oil Company"
persia.2.d:0 "In 1901 William Knox D'Arcy upon discovering vast quantities of oil in the region, attempted to strike it rich by setting up his own oil drilling company in Iran. For just a measly 16% of profits, Mozaffar ad-Din Shah Qajar signed away the entirety of our countries oil rights to D’Arcy. But with poor conditions plaguing the entire venture, D’Arcy was forced to sell his oil rights to the newly formed Anglo-Persian Oil Company. Winston Churchill, a proponent of naval modernization and the usage of petrol rather than coal as a fuel source, secured the APOC for the British government and went on to use our oil as a cornerstone of his naval reform program. From 1927-1932, an attempt was made to renegotiate the oil rights of the APOC, this failed when territorial disputes of Hengam and Bahrain took to dominating the conversation and neither side was willing to yield their position. For many Persians, the APOC remains a source of deep shame, and renegotiation or even full nationalisation of oil rights is a popular issue."
persia.2.a:0 "This has been the worst trade deal in the history of trade deals, maybe ever."

