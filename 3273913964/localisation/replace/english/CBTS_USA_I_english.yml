 unitedstates.32.t:0 "New England under 15 feet of Water!"
 unitedstates.32.d:0 "The Washington Branch of the United States Weather Bureau has completely failed in detecting an utterly massive hurricane that has now obliterated the coast, costing the state $620 million. With winds of 120 mph recorded in the Empire State, a question has been raised about the work ethic of the US Weather Bureau."
 unitedstates.32.a:0 "What? Investigate the Bureau and help those victimized."