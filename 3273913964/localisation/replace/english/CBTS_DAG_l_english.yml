 #events
 dag_civil_war.1.t:0 "Dagestan Goes Forth"
 dag_civil_war.1.d:0 "20 years ago, we tried to establish an independent Republic of the Northern Caucasus. Back then, we had trusted the Bolsheviks in our fight against General Denikin. That was our mistake. The Bolsheviks betrayed and annexed the Republic as they did with Georgia, Armenia, and Azerbaijan, leaving us to rot in their Bureaucratic Nightmare. The Soviets had also refused to industrialize our multi-ethnic land, instead choosing to collectivize, causing thousands of deaths.\n\nThis ends now! Dagestan shall fight for its freedom along side the Chechen Guerillas, who will hopefully unite with us so that we can make a new Mountain Republic, where reason and liberty prevail, rather than Leninist Terror."
 dag_civil_war.1.a:0 "Onwards!"
 #internal
 dag_internal.1.t:0 "Islamic Nationalist Agitation"
 dag_internal.1.d:0 "The North Caucasian Emirate was an Islamic Monarchy established in Chechnya and Western Dagestan in September 1919. Lasting only about six months, it attempted to establish a Pro-Ottoman monarchial society based on Islamic teachings. Lately, a few locals have been calling for [This.GetNameDef] to be transformed into a Theocracy, where the state would be ruled by the Sunni Clergy. The Clergy is split into three factions: the Naqshbandi, the Qadiri and the Shadhili, so any further political activity would likely result in conflict between them. Though this would normally worry us, the War against against the Bolshevik Empire has given our government a large amount of popularity, meaning that this new movement is not spreading very far."
 dag_internal.1.a:0 "We will deal with them later."
 dag_internal.2.t:0 "Theocratic Newspaper"
 dag_internal.2.d:0 "Now that restrictions on expression have been lifted, the Islamic Nationalists have decided to publish a newspaper called \"Holy Star\", in which they encourage [This.GetAdjective] citizens to improve themselves and support the Theocratic Movement. They argue that only a spiritually united society can establish an independent nation in the face of such obstacles (meaning the South Caucasians, Soviets, and Russians). To this end, these nationalists want a centralized state where decisions are made by Clergymembers, rather than elected officials. This paper has started to spread in Dagestan, but its following is generally confined to larger villages, where Clerics have been reading the \"Holy Star\" to the local townsfolk."
 dag_internal.2.a:0 "Worrying."
 dag_internal.3.t:0 "The North Caucasian Islamic Union"
 dag_internal.3.d:0 "The Islamic Nationalist movement has lost no time in forming a political organization. The \"Severokavkazsky Islamsky Soyuz\" (North Caucasian Islamic Union) has held its founding congress today in Temirkhan-Shura. In the eight-hour long meeting, the party developed a six-point program:\n\n1. Establishment of Sunni Islam as the state religion.\n2. Replacement of the Democratically-Elected Majles with an appointed Council of Clerics.\n3. Centralization of power to the CoC.\n4. Establishment of Sharia Law\n5. Economic Reorganization in regards to tradition and Islamic teachings.\n6. Diplomatic Cooperation with other Muslim Nations.\n\nThough this congress has so far avoided sectarian issues, these groups will most likely raise some issues in the future. This declaration has made members of our government worried that the SIS would, if it entered government, be able to tear down all that we have worked for, citing the North Caucasian Emirate's collapse."
 dag_internal.3.a:0 "We can hold them off!"
 dag_internal.4.t:0 "The Federalist Party"
 dag_internal.4.d:0 "There had been talk of forming a progressive party in the model of the Azerbaijani \"Musavat\", but until the SIS formed, nobody had really made much initiative towards such a goal. After the SIS released its program, a group of Azerbaijanis in Derbent had quickly organized a congress of their own. Choosing to call themselves \"Federalists\" (the word is now known to many [This.GetAdjective]s due to constant debates about it), these Jadidists have relased their own program:\n\n\"The Federalist Party aims to:\n1. Create a strong Federal system that respects ethno-religious lines.\n2. Develop Popular Democratic Institutions based on the Rule of Law.\n3. Formally establish a Secular State while respecting Religious Institutions.\n4. Immediately ensure ethnic and gender equality.\n5. Modernize the Country\n6. Establish Diplomatic and Military Ties with like-minded nations.\n\nMembers of our government have found the FP to be far more palatable than the SIS, and hopes to collaborate with the Federalists in regards to parliamentary matters. The party has proved to be popular in Derbent, which has a large population of Azerbaijanis. As a consequence, the party's Pan-Islamic and Pan-Ethnic message is somewhat tempered by Azerbaijani overrepresentation."
 dag_internal.4.a:0 "Let them in!"
 dag_internal.5.t:0 "A Party of our Own"
 dag_internal.5.d:0 "In response to the founding of the Federalist and Islamist Parties, officials close to [This.GetLeader] have begun to talk about forming our own party, so that we can compete electorally. Instead of drafting yet another \"six-point program\", these officials have simply written a basic manifesto where the priorities of the so-called \"National Party\" are listed out. These priorities include the \"Independence and Security of the Nation\", \"Democracy based on the values of the People\", \"Respect for Clerical Affairs\", and \"Ethnic Federalism\". It is hoped that we can get our message across to the people through simple language and structure, rather than profound programs. However, much like our civil service, we should expect the party to be overly made up of Kumyks, and mostly have influence in the Capital. All we need is for the President to accept the founding of the Party, so that it can officially be said to be the ruling party. If it does not, then we may face greater challenges on the political stage..."
 dag_internal.5.a:0 "A healthy political processes!"
 dag_internal.5.b:0 "The government must be non-partisan for now."
 dag_internal.6.t:0 "Russian Exodus"
 dag_internal.6.d:0 "The last few weeks have made it clear that the Russians are not welcome in our country. Attacks by both soldiers and citizens have absolutely destroyed any sense that we would be able to create society where different peoples are treated totally equally (though this is not helped by Kumyk overrepresentation in the government, either). For this reason, Russians have begun to leave in droves. The loss of an estimated 130,000 people would not do well for our stability or economy. It is especially hard on the emigrants, who are leaving everything behind for the chance that somebody will take them."
 dag_internal.6.a:0 "Horrible!"
 dag_internal.7.t:0 "Russian Refugees from Dagestan"
 dag_internal.7.d:0 "With the Revolt in Dagestan, ethnic Russians in the region have been fleeing in droves, as locals have been starting to attack Russians as \"revenge\" for old grudges. The Russians are blamed for the USSR and its oppression, so they have chosen to leave their homes. They have come to us to settle, and we could do nothing more than take them in."
 dag_internal.7.a:0 "Alright."
 dag_internal.8.t:0 "Russian Socialist Groupings"
 dag_internal.8.d:0 "Despite the Mass Russian Emigration, remaning Russians had hoped for either the New Russian Military or the Red Army to re-occupy the area. Politically, some have grouped together in Pro-Bolshevik cliques, though without the intense ideological discipline provided by Moscow. However, our recent crackdowns on Bolshevik activity have resulted in a breakdown of ideology into various Unionist Groupings. These groups have varying Socialist ideologies and have no formal organization, but they do exist in our country."
 dag_internal.8.a:0 "We'll keep watch on them."
 #External
 dag_external.1.t:0 "Dagestan Proposes Union"
 dag_external.1.d:0 "20 years ago, we had declared independence as part of the Mountain Republic alongside Dagestan. Now, Dagestan proposes that we re-unite as a single country, with one military, economy, and officer corps. The advantages here are obvious: our economy and military would be stronger, enabling us to better further our cause. However, some Chechen Nationalists in our administration feel as though such a union would diminish Chechnya's independence. Should we accept this union?"
 dag_external.1.a:0 "North Caucasian Unity demands it!"
 dag_external.1.b:0 "Chechen Independence comes first."
 dag_external.2.t:0 "Union with Chechnya!"
 dag_external.2.d:0 "Our proposal of Union with Chechnya has been accepted. Chechnya and Dagestan are now one country! This shall give our military more versatility, and make us more economically competative. However, if we do not properly account for Chechen Nationalists and try to appease them, they will be quite cross with us..."
 dag_external.2.a:0 "A proud day for our country."
 dag_external.3.t:0 "Chechnya Refuses to Unify with Us."
 dag_external.3.d:0 "The Chechen Administration, despite being our allies, have refused to unify with us. As they want us to understand their good intentions, the Chechens have explained that they do not want to anger Chechen Nationalists, and therefore a total political union should be postponed."
 dag_external.3.a:0 "We shall confront this issue another time."
 dag_external.4.t:0 "[From.GetNameDef] Proposes Trade Deal"
 dag_exteranl.4.d:0 "The [From.GetAdjective] Foreign Ministry has proposed a trade deal where we would grant them access to Turkish Construction Firms and we would have greater access to their oil. Though the benefits of this are obvious, some experts are concerned that Turkey may have to take military action to secure its interests, and that this deal might take our armies too far away. Should we accept, or keep our interests closer?"
 dag_external.4.a:0 "We shall accept!"
 dag_external.4.b:0 "It is better to keep our interests at home."
 dag_external.5.t:0 "Turkey Accepts our Trade Deal"
 dag_external.5.d:0 "The Turkish Government has accepted our trade deal, so while we have to give them more of our oil, they have granted us better access to Turkish Construction Services, which is sure to boost our economy."
 dag_external.5.a:0 "Excellent."
 dag_external.6.t:0 "Turkey Rejects our Trade Deal"
 dag_external.6.d:0 "The Turkish Government has rejected our trade deal, likely because they feel we have nothing to offer them. We were counting on them to help us improve our economy, but it seems our efforts have been in vain."
 dag_external.6.a:0 "They will remember this!"
 dag_external.7.t:0 "[From.GetNameDef] Proposes Non-Aggression Pact"
 dag_external.7.d:0 "[From.capital_scope.GetName] has proposed that we enter into a pact of non-aggression with them. As both of our countries are interested in Pan-Islamism, this seems like a natural step in the right direction. If we play our cards right, we could even secure a military alliance with the [From.GetAdjective]s..."
 dag_external.7.a:0 "An excellent initiative!"
 dag_external.7.b:0 "We cannot agree at this time."
 dag_external.8.t:0 "Azerbaijan Accepts the Non-Aggression Pact"
 dag_external.8.d:0 "Baku has accepted our offer of mutual non-aggression. This way, we further the cause of Pan-Islamism by avoiding conflict with other Muslims. We hope that at some point we can have full treaties of military cooperation with Azerbaijan, as well as figuring out the oil situation."
 dag_external.8.a:0 "Excellent!"
 dag_external.9.t:0 "Azerbaijan Rejects the Non-Aggression Pact"
 dag_external.9.d:0 "The Azerbaijani Government has refused the Non-Aggression Pact that we have proposed. Despite our nations' mutual interest in Pan-Islamism, The Azeris likely see us as an economic competitor and thus would rather out-produce us."
 dag_external.9.a:0 "Shame."
 #external 10-18 are hidden
 dag_external.19.t:0 "End of the Terek Conflict"
 dag_external.19.d:0 "[DAG.GetNameDef] has been defeated. Months of [DAG.GetAdjective] incursions have been forced to end after we moved forward into Dagestan proper, and defeated the [DAG.GetAdjective] Army on their home territory. As such, we can expect no more attacks from Dagestan in the near future."
 dag_external.19.a:0 "Excellent!"
 dag_external.20.t:0 "End of the Terek Conflict"
 dag_external.20.d:0 "Months of skirmishes with [DAG.GetNameDef] have come to an end as [From.GetAdjective] forces have defeated the [DAG.GetAdjective] army in Dagestan Proper. As the [DAG.GetAdjective]s have retreated to lick their wounds, it is likely that we have nothing to fear from them for a while."
 dag_external.20.a:0 "A great relief"
 dag_external.21.t:0 "Defeat in the Terek Conflict"
 dag_external.21.d:0 "Enemy forces have invaded Dagestan and defeated our armies. As such, we are now unable to continue our incursions on others' territory. We expect this to have severe effects on the people's morale, as our failure to deliver on the promised expansions (and providing a loss of territory instead) will damage the legitimacy of the government."
 dag_external.21.a:0 "A Precarious Situation."
 dag_external.22.t:0 "Defeat on the Terek"
 dag_external.22.d:0 "Having seized all their claimed territory, [DAG.GetNameDef] has claimed victory in the Terek Conflict. Extremely proud of their accomplisment, the [DAG.GetAdjective] people are rejoicing at their victory, while ours are lamenting. [DAG.DAG_get_victory_desc]"
 MountainVictory:0 "Stretching from the Caspian to the Black Sea, [DAG.GetNameDef] has succeeded in establishing a Pan-Nationalist and Pan-Islamic state across the Northern Caucasus. Anybody wishing to travel by land from Southern Russia to the South Caucasus now faces the Northern Caucasian Republic's monopoly of passage."
 DagVictory:0 "Dagestan has succeeded in seizing Kizlyar, which has earned them back all of the former Dagestan ASSR's territory. Though this land is mostly rural or steppe, the people are still proud of their army's accomplishments."
 dag_external.22.a:0 "Damn!"
 #decisions
 Mountain_Republic_Escalation:0 "Terek Conflict"
 Mountain_Republic_Escalation_desc:0 "The Terek River holds great significance for the Northern Caucasians. [DAG.GetNameDef] claims lands along the Terek that are populated with their North Caucasian brothers. This has caused conflicts to erupt along the [DAG.GetAdjective] border. If we are not careful, this conflict shall erupt into a full-scale war...\n\nCurrent Tension: §Y[?global.NC_tension]§!\n§RIf Tension reaches 100, a full-scale war will break out!§!"
 NC_planning_attack:0 "§YAn attack is already being planned!§!"
 NC_attack_Kizlyar:0 "Attack Kizlyar"
 NC_attack_Chechnya:0 "Attack Chechnya"
 NC_attack_NOssetia:0 "Attack North Ossetia"
 NC_attack_SOssetia:0 "Attack South Ossetia"
 NC_attack_Kab_Bal:0 "Attack Kabardino-Balkaria"
 NC_attack_Dagestan:0 "Attack Dagestan"
 NC_attack_Dagestan_desc:0 "If successful, this will end the conflict!"
 DAG_end_conflict:0 "Declare Victory"
 DAG_end_conflict_desc:0 "We have captured all our claimed territory, so we will declare our victory in the conflict!"
 DAG_war:0 "Escalation of the Conflict"
 DAG_war_desc:0 "If the conflict does not end within 30 days, war will break out!"
 DAG_war_tt:0 "§RWar with Dagestan will break out!\n§!"
 #focuses
 DAG_2RCW_Politics_Start:0 "Dagestan, thou Holy Fatherland!"
 DAG_2RCW_Politics_Start_desc:0 "Given the opportunity, Dagestan can be a proud soviergn nation. It is the job of our government to ensure that this opportunity exists for all Dagestanis, and it is the duty of our army to ensure the survival of the government!"
 DAG_2RCW_Union_with_Chechnya:0 "Union with Chechnya"
 DAG_2RCW_Union_with_Chechnya_desc:0 "Our alliance with Chechnya does not go far enough. We should unite under a single banner, to protect the independence of the North Caucasians, as the Mountain Repulic did in 1917."
 DAG_CHC_Union:0 "§GWe have United with Chechnya.§!\n"
 DAG_CHC_no_Union:0 "§RChechnya has refused Unity.§!\n"
 DAG_2RCW_Mountain_Republic:0 "Form the Second Mountain Republic"
 DAG_2RCW_Mountain_Republic_desc:0 "After the Unification with Chechnya, our government had been called \"Dagestan-Chechnya\" as part of the Treaty. This has not really satisfied our government, so we have drawn up legislation changing the country's name to \"Second Republic of the Northern Caucasus\". This should make it easier for other North Caucasians to accept our administration and it fits with our cause."
 DAG_2RCW_Alone:0 "Remain Separate"
 DAG_2RCW_Alone_desc:0 "Chechnya has refused our offer of Union, so although we remain allied to them, we are a separate nation-state. Therefore, we must take steps to secure order and freedom for the Dagestani peoples."
 DAG_federalism:0 "Federalism"
 DAG_2RCW_Ethnic_Federalism:0 "Ethnic Federalism"
 DAG_2RCW_Ethnic_Federalism_desc:0 "The Republic shall be federalized so that Makhachkala does not have excessive authority over any part of the nation. However, each province is expected to remain subordinate to the capital. This should both keep stability and appease some ethnic nationalists."
 DAG_2RCW_Multilingualism:0 "A Multilingual State"
 DAG_2RCW_Multilingualism_desc:0 "We have many different ethnicities in our Republic, from Chechens to Avars, and from Russians to Lezgins. We should recognize all major languages so that people are free to live their lives out without hassle."
 DAG_centralization:0 "Centralism"
 DAG_2RCW_Centralism:0 "Centralize Territorial Administration"
 DAG_2RCW_Centralism_desc:0 "In these tenuous times, it is important that our government be able to carry out the policy it needs. Therefore, we shall grant greater powers to the Capital so that troublesome provinces cannot get in our way."
 DAG_2RCW_Common_Language:0 "Russian as a Common Language"
 DAG_2RCW_Common_Language_desc:0 "Avars, Lezgins, Kumyks, and Nogais all speak different langauges, not to mention the several other ethnicities we have. Therefore, we shall continue teaching Russian because despite mutual hatred for Moscow, as we must find some way to communicate."
 DAG_2RCW_Equality_for_All:0 "Equality for All Peoples"
 DAG_2RCW_Equality_for_All_desc:0 "It would be hypocritical to proclaim equality for the North Caucasians yet discriminate against others. Therefore, the South Caucasians, Russians, Jews, and everyone else are welcome here."
 DAG_2RCW_NC_Equality:0 "Equality for North Caucasians"
 DAG_2RCW_NC_Equality_desc:0 "The North Caucasus are for North Caucasians! If the Russians want equality, they can go back to Russia. They have oppressed us for over a century, and we want revenge!"
 DAG_2RCW_Freedom_of_Speech:0 "Loosen Restrictions on Expression"
 DAG_2RCW_Freedom_of_Speech_desc:0 "While true freedom of speech and press will be reserved until the war is over, we can loosen restrictions somewhat. While advocating for insurrection or treason will remain illegal, people will be allowed to criticize the government and engage in art without interference."
 DAG_2RCW_Political_Activity:0 "Encourage Political Activity"
 DAG_2RCW_Political_Activity_desc:0 "We shall encourage our people to become politically active, so that we can build up a functioning democracy. If the people are sufficiently involved, we can avoid a slide into dictatorship."
 DAG_2RCW_Open_Mosques:0 "Reopen the Mosques"
 DAG_2RCW_Open_Mosques_desc:0 "Smaller mosques have been popping up across the nation as people are seeing independence as the reintroduction of religion after Stalin's repression. To formally relegalize religious worship, we shall open the larger mosques that have so far been abandoned."
 DAG_2RCW_Crackdown_on_Bolsheviks:0 "Crackdown on Bolsheviks"
 DAG_2RCW_Crackdown_on_Bolsheviks_desc:0 "We cannot allow Bolshevism to fester in the nation at this crucial junction. Perhaps in the future it can be permitted, but for now, we must ensure that this terroristic ideology does not disseminate among the people."
 DAG_2RCW_Municipal_Elections:0 "Local Elections"
 DAG_2RCW_Municipal_Elections_desc:0 "Elections to local village councils would have little practical effects on our government, but it is a symbolic reform that would do well to assure the people that we care for their interests."
 DAG_2RCW_Forward_Together:0 "Forwards Together!"
 DAG_2RCW_Forward_Together_desc:0 "With the Unity our Federal System provides, the North Caucasians can truly go forwards together. We shall establish a state free for all, guarded by the will and honor of the people!"
 DAG_2RCW_Keep_Order:0 "Keep Order"
 DAG_2RCW_Keep_Order_desc:0 "Order must be kept so that we can properly administer the state and protect the people. Though we do not wish to be overly authoritarian, there must be some sort of balance we can find."
 #economics
 DAG_2RCW_Economics_Start:0 "Our Economic Situation"
 DAG_2RCW_Economics_Start_desc:0 "Our economy is severly poor. The Five-Year-Plans entirely passed us by, and we are still getting on with collectivized susbsitance agriculture. We must therefore analyze the situation and act accordingly."
 DAG_2RCW_Decollectivize:0 "Decollectivization"
 DAG_2RCW_Decollectivize_desc:0 "Collectivization left terrible scars on our peoples. Farmers were made to work collectively, whether they wanted to or not, and all resistance was dealt with through imprisonment and killings. It is our duty to rectify the situation through decollectivization."
 DAG_2RCW_Secure_Loans:0 "Secure Foreign Loans"
 DAG_2RCW_Secure_Loans_desc:0 "Despite our poor situation and relative geographical isolation, we should be able to secure some foreign loans from...less concerned banks, to say the least."
 DAG_2RCW_Import_Agro_Tech:0 "Import Agricultural Technology"
 DAG_2RCW_Import_Agro_Tech_desc:0 "We can import some agricultural technologies in order to help the people stave off hunger. If the Soviets would not bother to help us improve, then we shall do it ourselves!"
 DAG_2RCW_First_Factory:0 "Our First Factory"
 DAG_2RCW_First_Factory_desc:0 "With great effort, we can build a modern factory. Using the money loaned to us, we can build construction materials, and we can purchase resources either from abroad or the interior."
 DAG_2RCW_Oil:0 "Expand Oil Drilling"
 DAG_2RCW_Oil_desc:0 "Although we cannot hope to compete with Azerbaijani oil, we can still offer an alternative to those less disposed towards the Azeris. In addition, our oil is still high quality."
 DAG_2RCW_Mil_Factory:0 "Begin Military Production"
 DAG_2RCW_Mil_Factory_desc:0 "With our first factories being built, we must make room for military production. The key to fending off the Invaders is a steady supply of weaponry, which we have no choice but to produce ourselves."
 DAG_2RCW_Improve_Industry:0 "Improve our Industrial Methods"
 DAG_2RCW_Improve_Industry_desc:0 "By studying our current production strategies compared to proven models, we can improve our methods, and thus better compensate for our lack of capital."
 DAG_2RCW_Infrastructure:0 "Improve Railways"
 DAG_2RCW_Infrastructure_desc:0 "We must improve and expand our railways, as without them, we cannot hope to catch up to modern economies."
 #military
 DAG_2RCW_Military_Start:0 "The Chain of Command"
 DAG_2RCW_Military_Start_desc:0 "We must formalize our army structure if we are to have a fighting chance. We cannot fight if we have no organization."
 DAG_2RCW_Guerilla:0 "Guerilla Warfare"
 DAG_2RCW_Guerilla_desc:0 "Despite our need for a formal army structure, it would be good to intentionally organize loosely so that we can perform unpredictable hit-and-run attacks. This way, we would be better able to fight, despite our lack of organization."
 DAG_2RCW_Firearms:0 "New Firearm Designs"
 DAG_2RCW_Firearms_desc:0 "We need to keep up with the latest advances in firearm technology if we are to properly fight the Soviets."
 DAG_2RCW_Mountain:0 "Use the Mountains"
 DAG_2RCW_Mountain_desc:0 "The Caucausus is, of course, a mountain range. We should train specialized units to use the mountains to their utmost advantage."
 DAG_2RCW_Improve_Org:0 "Improve Officer Training"
 DAG_2RCW_Improve_Org_desc:0 "If we can train our officers better, then we could achieve higher standards of organization and effectiveness."
 DAG_2RCW_Artillery:0 "Explore Artillery"
 DAG_2RCW_Artillery_desc:0 "Though we do not have the economy to build artillery, we should be ready to build from modern designs when the time comes."
 DAG_2RCW_Doctrine:0 "New Strategies"
 DAG_2RCW_Doctrine_desc:0 "With our new technologies and training, it is time to invest our resources in developing new tactics so that we can always maintain the upper hand."
 DAG_2RCW_Combined_Corps:0 "Combined Corps"
 DAG_2RCW_Combined_Corps_desc:0 "Since the Unification with Chechnya, it has become clear that we need to spend some time encouraging the integration of our two armies. This should help us be more coordinated."
 DAG_2RCW_Communication:0 "Improve Communication"
 DAG_2RCW_Communication_desc:0 "We must improve our army's ability to communicate so that different units would have little difficulty with different languages."
 DAG_2RCW_Foreign_Start:0 "Foreign Recognition"
 DAG_2RCW_Foreign_Start_desc:0 "Major Powers were quick to recognize the Mountain Republic, so they would likely be as quick to recognize [This.GetNameDef]. We will need this recognition if we are to make treaties and facilitate trade."
 DAG_befriend:0 "Friendly Nation"
 DAG_2RCW_Foreign_Befriend_Turkey:0 "Befriend Turkey"
 DAG_2RCW_Foreign_Befriend_Turkey_desc:0 "Our foreign ministry will spend time improving relations with Turkey, as they are a fellow Muslim country with interest in the Caucasus. This friendship can be very beneficial for us..."
 DAG_2RCW_Foreign_Befriend_Azerbaijan:0 "Befriend Azerbaijan"
 DAG_2RCW_Foreign_Befriend_Azerbaijan_desc:0 "Another Muslim Nation in the Caucasus, Azerbaijan neighbors us to the south. As such, it would be prudent to maintain friendly relations with them, despite their hegemony of Caucasian oil."
 DAG_2RCW_Foreign_Turkish_Trade:0 "Trade Deal with Turkey"
 DAG_2RCW_Foreign_Turkish_Trade_desc:0 "Turkey is far wealthier than we are, so it would be prudent to sign a trade deal with them. They get easier access to our oil, and we get contracts with their construction firms..."
 DAG_2RCW_Foreign_AZR_non_aggression:0 "Non-Aggression Pact with Azerbaijan"
 DAG_2RCW_Foreign_AZR_non_aggression_desc:0 "We and the Azeris must agree not to fight each other, or else Caucasian unity would be further threatened."
 DAG_2RCW_Foreign_Pro_Russia:0 "Pro-Russian Policies"
 DAG_2RCW_Foreign_Pro_Russia_desc:0 "We should work with Russia to ensure that we both work together towards mutual interests while avoiding conflict over territory."
 DAG_antagonize:0 "Unfriendly Nation"
 DAG_2RCW_Foreign_Anti_Russia:0 "Anti-Russian Policies"
 DAG_2RCW_Foreign_Anti_Russia_desc:0 "Russia is a threat to our soveirgnty, so we must engage on an Anti-Russian course until the threat has passed."
 DAG_dropped_claim:0 "Dropped claim on Kizlyar."
 DAG_2RCW_Foreign_Drop_Claim:0 "Drop Claims on Kizlyar"
 DAG_2RCW_Foreign_Drop_Claim_desc:0 "Though Kizlyar was given to us by Moscow, we will appease the Russians by dropping claims on that land."
 DAG_2RCW_Foreign_Claims_on_Russia:0 "Claim our Rightful Lands"
 DAG_2RCW_Foreign_Claims_on_Russia_desc:0 "We must lay official claim to all lands with Northern Caucasian Populations in order to further the cause of North Caucasian Unity!"
 DAG_2RCW_Foreign_Iran:0 "Approach Tehran"
 DAG_2RCW_Foreign_Iran_desc:0 "We should look to befriend [PER.GetNameDef] in order to better strengthen our position in the Caucasus."
 DAG_embargo:0 "Embargo"
 DAG_2RCW_Foreign_Embargo_Russia:0 "Embargo the Russians"
 DAG_2RCW_Foreign_Embargo_Russia_desc:0 "We must ensure that we are neither giving the Russians the economic advantage over us nor taking our oil! We must place an embargo on them!"
 DAG_2RCW_Foreign_Start_Border_Wars:0 "Begin Incursions"
 DAG_2RCW_Foreign_Start_Border_Wars_desc:0 "We must begin launching operations into Russia to ensure that we can take all our rightful territory. Nations that are not Russia should also be attacked so that we can seize these territories. For example, Georgia's claims on South Ossetia and Abkhazia cannot be entertained."
 DAG_2RCW_Foreign_Russian_Experience:0 "Learn from the Russians"
 DAG_2RCW_Foreign_Russian_Experience_desc:0 "We can use the Russians' experience fighting the Bolsheviks to help us train our soldiers better. If we know better what the Soviets bring to the table, we can counter it more easily."
 DAG_2RCW_Foreign_Russian_Trade:0 "Facilitate Trade with Russia"
 DAG_2RCW_Foreign_Russian_Trade_desc:0 "We should ensure that trade with Russia goes without a hitch, as this will benefit both our economies. They can use our oil, and we can use their money."