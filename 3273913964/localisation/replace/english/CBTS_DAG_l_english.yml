 #ideas
 DAG_ethnic_confusion:0 "Ethnic Confusion"
 DAG_ethnic_confusion_desc:0 "The ethnic composition of Dagestan is confusing, to say the least. Avars, Lezgins, Kumyks, Nogais, several other North Caucasian ethnicities live in the Dagestan Region, not to mention colonized Russians. There is such a myriad of nationalities in our country that the only thing that unifies us is mutual dislike of the Russians, which they are not happy about."
 DAG_ethnic_confusion2:0 "Ethnic Confusion"
 DAG_ethnic_confusion2_desc:0 "The ethnic composition of Dagestan is confusing, to say the least. Avars, Lezgins, Kumyks, Nogais, several other North Caucasian ethnicities live in the Dagestan Region, not to mention colonized Russians. There is such a myriad of nationalities in our country that the only thing that unifies us is mutual dislike of the Russians, which they are not happy about. And now that we have enacted discriminatory policies, this situation has only gotten worse."
 DAG_low_political_consciousness:0 "Low Political Consciousness"
 DAG_low_political_consciousness_desc:0 "Our Country has no history of political activity beyond what the Russians have brought (meaning autocracy and totalitarianism). While our intellectuals understand political concepts, this has not been taught to the common people, who seem ready to accept our government regardless of form. While this should make it easier for us to carry out political reforms (due to lack of meaningful opposition), the people do not have much motiviation to fight for any particular system."
 DAG_agrarianism:0 "Agrarian Economy"
 DAG_agrarianism_desc:0 "Stalin's Five-Year-Plans brought nothing of value to our nation, and the economy is still entirely based on Agriculture, which the Collectivization of 1937 did not help either. Building a strong industrial base in our nation will be a major challenge for us."
 DAG_agrarianism2:0 "Agrarian Economy"
 DAG_agrarianism2_desc:0 "Stalin's Five-Year-Plans brought nothing of value to our nation, and the economy is still entirely based on Agriculture, which the Collectivization of 1937 did not help either. Building a strong industrial base in our nation will be a major challenge for us."
 DAG_agrarianism3:0 "Agrarian Economy"
 DAG_agrarianism3_desc:0 "Stalin's Five-Year-Plans brought nothing of value to our nation, and the economy is still entirely based on Agriculture, which the Collectivization of 1937 did not help either. Building a strong industrial base in our nation will be a major challenge for us."
 DAG_disorganized_army:0 "Disorganized Army"
 DAG_disorganized_army_desc:0 "Our ad-hoc forces are generally made up of rag-tag militiamen and some veterans. This varied composition has made our army somewhat disorganized, making them less effective on the battlefield. On the other hand, the lack of organization means that our units can regroup easier since these groups have little - if any - formal structure."
 DAG_disorganized_army2:0 "Disorganized Army"
 DAG_disorganized_army2_desc:0 "Our ad-hoc forces are generally made up of rag-tag militiamen and some veterans. This varied composition has made our army somewhat disorganized, making them less effective on the battlefield. On the other hand, the lack of organization means that our units can regroup easier since these groups have little - if any - formal structure."
